# The shared package that ships pinned upstream binaries (H3, C5, *`homelab-tools`*). Each lands
# at /usr/lib/homelab/bin/<tool>, never on PATH, so a caller names the absolute path:
# homelab-secrets calls /usr/lib/homelab/bin/sops (H4).
#
# The builder downloads each file, checks its sha256 against the pin below, and builds the
# package once per architecture. A digest that differs builds nothing and writes
# reason="tools". scripts/renderer/renderer_lib/host_tools.py documents the keys.
#
# Each architecture block carries its own annotation, version and digest, because the Renovate
# manager in renovate.json moves one version and one digest per match. The two blocks of a tool
# pin one version, which the renderer enforces. Renovate bumps these pins apart from the
# sops_setup and chezmoi_setup defaults, which install the same tools on a fresh host.
#
# DECIDED: chezmoi is pinned as its .tar.gz. Upstream publishes a bare binary for amd64 only,
# and `member` names the file the builder installs from inside the archive.
description: Pinned upstream binaries the homelab packages call by absolute path
tools:
  sops:
    amd64:
      # renovate: datasource=github-release-attachments depName=getsops/sops
      version: v3.13.3
      sha256: e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b
      url: https://github.com/getsops/sops/releases/download/{version}/sops-{version}.linux.amd64
    arm64:
      # renovate: datasource=github-release-attachments depName=getsops/sops
      version: v3.13.3
      sha256: 53b0abacd38ef1b12a66d6c100956691b9cefce018d91f81e73ddf7438b94d77
      url: https://github.com/getsops/sops/releases/download/{version}/sops-{version}.linux.arm64
  chezmoi:
    amd64:
      # renovate: datasource=github-release-attachments depName=twpayne/chezmoi
      version: v2.73.3
      sha256: 6e5827598cbfc02d132b04f95b5ea10efb5b79230e2a4a0e52df4af144a8ee9f
      url: https://github.com/twpayne/chezmoi/releases/download/{version}/chezmoi_{bare}_linux_amd64.tar.gz
      member: chezmoi
    arm64:
      # renovate: datasource=github-release-attachments depName=twpayne/chezmoi
      version: v2.73.3
      sha256: c9e6a6e71eb5291018e161a8426d7c313cd2e8553c2ca4029511fec2a33bc28c
      url: https://github.com/twpayne/chezmoi/releases/download/{version}/chezmoi_{bare}_linux_arm64.tar.gz
      member: chezmoi
  # H7.25: the Pi's node exporter, the version the cluster DaemonSet's image pins
  # (ansible/tests/setup/test_pi_node_exporter_host_unit.py holds the two equal). The tarball names
  # its directory after the release, so `member` carries {bare}. Both digests come from the
  # release's sha256sums.txt:
  # https://github.com/prometheus/node_exporter/releases/download/v1.12.1/sha256sums.txt
  node-exporter:
    amd64:
      # renovate: datasource=github-release-attachments depName=prometheus/node_exporter
      version: 1.12.1
      sha256: b51d8a76aa2a9156a55d501aca6276fae09e262259a5e4e831d2c2222f084e63
      url: https://github.com/prometheus/node_exporter/releases/download/v{bare}/node_exporter-{bare}.linux-amd64.tar.gz
      member: node_exporter-{bare}.linux-amd64/node_exporter
    arm64:
      # renovate: datasource=github-release-attachments depName=prometheus/node_exporter
      version: 1.12.1
      sha256: ad35b605f9954b9f1ffddf5ba054bdc5a98d790b9eae5291e1eeb83f1ecbd0e7
      url: https://github.com/prometheus/node_exporter/releases/download/v{bare}/node_exporter-{bare}.linux-arm64.tar.gz
      member: node_exporter-{bare}.linux-arm64/node_exporter
  # H7.24a: daniel-box builds the host packages itself, so it needs nfpm at the builder's pin.
  # Both digests come from the release's checksums.txt:
  # https://github.com/goreleaser/nfpm/releases/download/v2.48.0/checksums.txt
  nfpm:
    amd64:
      # renovate: datasource=github-release-attachments depName=goreleaser/nfpm
      version: v2.48.0
      sha256: 6d7f9a28b2f397934403950fcbba83f598b08d02edbe79a0815b3b4897341750
      url: https://github.com/goreleaser/nfpm/releases/download/{version}/nfpm_{bare}_Linux_x86_64.tar.gz
      member: nfpm
    arm64:
      # renovate: datasource=github-release-attachments depName=goreleaser/nfpm
      version: v2.48.0
      sha256: a9a75213763783b7669719e505474c748c5ad7dc66591a195619deb50f85c2f4
      url: https://github.com/goreleaser/nfpm/releases/download/{version}/nfpm_{bare}_Linux_arm64.tar.gz
