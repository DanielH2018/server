# The shared package that ships pinned upstream binaries (H3, C5, *`homelab-tools`*). Each lands
# at /usr/lib/homelab/bin/<tool>, never on PATH, so a caller names the absolute path:
# homelab-secrets calls /usr/lib/homelab/bin/sops (H4).
#
# The builder downloads each file, checks its sha256 against the pin below, and builds the
# package once per architecture. A digest that differs builds nothing and writes
# reason="tools". scripts/renderer/renderer_lib/host_tools.py documents the keys.
#
# Each architecture block carries its own annotation, version and digest, because the Renovate
# manager in renovate.json moves one version and one digest per match. The two blocks of a tool
# pin one version, which the renderer enforces. The sops component puts this package's sops on
# PATH as /usr/bin/sops.
#
# DECIDED: chezmoi is pinned as its .tar.gz. Upstream publishes a bare binary for amd64 only,
# and `member` names the file the builder installs from inside the archive.
description: Pinned upstream binaries the homelab packages call by absolute path
tools:
  sops:
    amd64:
      # renovate: datasource=github-release-attachments depName=getsops/sops
      version: v3.13.3
      sha256: e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b
      url: https://github.com/getsops/sops/releases/download/{version}/sops-{version}.linux.amd64
    arm64:
      # renovate: datasource=github-release-attachments depName=getsops/sops
      version: v3.13.3
      sha256: 53b0abacd38ef1b12a66d6c100956691b9cefce018d91f81e73ddf7438b94d77
      url: https://github.com/getsops/sops/releases/download/{version}/sops-{version}.linux.arm64
  chezmoi:
    amd64:
      # renovate: datasource=github-release-attachments depName=twpayne/chezmoi
      version: v2.73.3
      sha256: 6e5827598cbfc02d132b04f95b5ea10efb5b79230e2a4a0e52df4af144a8ee9f
      url: https://github.com/twpayne/chezmoi/releases/download/{version}/chezmoi_{bare}_linux_amd64.tar.gz
      member: chezmoi
    arm64:
      # renovate: datasource=github-release-attachments depName=twpayne/chezmoi
      version: v2.73.3
      sha256: c9e6a6e71eb5291018e161a8426d7c313cd2e8553c2ca4029511fec2a33bc28c
      url: https://github.com/twpayne/chezmoi/releases/download/{version}/chezmoi_{bare}_linux_arm64.tar.gz
      member: chezmoi
