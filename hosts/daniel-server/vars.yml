---
server_ip: 10.0.0.161
# Static pin keeps the agent starting with DHCP down; the gateway reserves server_ip for this NIC.
# wlo1's metric-600 route is the fallback and wins only via ignore_routes_with_linkdown on this
# link.
k3s_node_static_link: enp88s0
# The installer's wifi file joins it first; the k3s-agent fallback netplan merges on top.
k3s_node_wifi_link: wlo1
ssh_config_path: /etc/ssh/sshd_config
# Intel XE iGPU present — enables /dev/dri passthrough for jellyfin/tdarr hardware transcode.
has_igpu: true
# DECIDED: no fwupd here, because LVFS carries no firmware for this hardware. The host is an
# Intel NUC11TNHi5 (BIOS TNTGL357) with an SK hynix Platinum P41 NVMe (SHPP41-500GM). On
# 2026-11-14 fwupd.org's search returned "No results" for "NUC11" and for "P41", while a
# "ThinkPad" control search returned listings. ASUS, which took over the NUC line, publishes
# this board's BIOS as a manual download on its support page. CPU microcode arrives through the
# `intel-microcode` apt package, not fwupd. Set this true once LVFS lists the board or the drive.
has_fwupd: false

# Fan-out agents here stop at `gh pr create`; a daniel-box session lands the PR (deploys stay
# there).
claude_code_rc_enabled: false
claude_agent_ssh_login_enabled: true

# DECIDED: 24G fleet cap. It was meant to hold a floor of 8 GiB of MemAvailable, and it holds
# that floor only while much of the fleet's memory is page cache. The worst-case floor is
# MemTotal - homelab (anon + kernel) - this cap, the model defaults/main.yml states at
# claude_code_fleet_memory_high. Measured on daniel-server on 2026-11-22:
#   MemTotal 30.5 GiB. Homelab anon + kernel 8.3 GiB at its peak: kubepods.slice anon 7.3
#     (the 14-day peak of cAdvisor's rss), its kernel 0.35, system.slice anon 0.55 and kernel 0.17.
#   Worst-case floor at 24G: 30.5 - 8.3 - 24 = -1.8 GiB.
#   A cap that holds 8 GiB with all-anon fleet memory: 30.5 - 8.3 - 8 = 14.2 GiB.
# The 2026-11-14 episode fits the model: the fleet held 23.1 GiB and MemAvailable fell to
# 1.4 GiB. On 2026-11-20 the fleet peaked at 11.7 GiB and MemAvailable stayed at or above 20.7 GiB.
# The homelab plane's MemoryLow below, not a lower cap, is what keeps reclaim off the pods.
# With the RC unit disabled, user-1000.slice is the only plane here, so the 23G login cap is
# the effective per-plane bound and the fleet cap only matters once a second plane appears.
claude_code_fleet_memory_high: 24G
# Derived per k3s_kubepods_memory_low in hosts/components/k3s-server/defaults/main.yml (14-day rss
# peaks).
k3s_kubepods_memory_low: 8G
k3s_memory_low: 1G
k3s_system_slice_memory_low: 1536M
# Under a third of this host's 7 GiB swap.
claude_code_fleet_swap_max: 2G
claude_code_rc_memory_high: 23G
claude_code_rc_memory_swap_max: 2G
# The bound is workers x concurrent runs: 4 x 6 fan-out agents is 24 workers, ~2.4 GB against the
# 23G cap.
claude_code_rc_pytest_workers: 4
