# daniel-server's host package. It ships reconcile, the secrets unit and the enable link for
# homelab-updater.timer, which arms the host's unattended updates. The timer keeps the shared
# schedule: daniel-server ships no drop-in on it.
#
# secrets/hosts/daniel-server.sops.yaml carries every key this tree names, and
# `host_secrets.py sync daniel-server` rewrites it (operator-only).
#
# The initial_setup subjects ship as the same components as daniel-pi: apt's unattended upgrades,
# the sshd drop-ins, the kernel, journald, limits and login hardening, the fail2ban group
# (fail2ban, integrity-scans for rkhunter and aide-scan for AIDE, postfix and accounting), the
# maintenance timers (host-maintenance: the weekly reboot, apt autoremove and dpkg purge; this
# host has no Docker, and no fwupd per the DECIDED marker at its has_fwupd) and ufw
# (ssh-firewall). check-lib ships the textfile library the scans and the maintenance wrapper
# source. The scans and the reboot read one more credential, `healthchecks_ping_key`
# (`host_secrets.py sync daniel-server`, operator-only).
#
# `k3s-gates` ships alone from the k3s-restart pair: the k3s-agent Plan's `prepare` runs
# /usr/lib/homelab/k3s_gates.py from the host's root. The windowed restart, `k3s-restart`, stays
# off this package.
#
# `k3s-agent` carries the agent's same-path files: registries.yaml, the logging drop-in, its
# logrotate file and the log file's tmpfiles.d entry, the join rules declared `keep`, the
# multipath drop-in, the inotify key and the address pin, whose wifi half reads `wifi_ssid` and
# `wifi_password`, and the read-only kubeconfig, which reads `k3s_readonly_token`. It ships the
# first k3s-agent.service drop-in, so the package marks k3s-agent.service `windowed` and
# reconcile never restarts it. With no `k3s-restart` here, a change to those files goes live at
# the agent's next start: the Sunday weekly reboot, a SUC upgrade, or a hand restart. The
# component is forward-only. The `hypervisor` component carries the monthly etcd restore drill and
# its libvirt state (`r2_*`, `host_secrets.py sync daniel-server`, operator-only).
#
# `claude-code` ships the agent user and everything the claude_code role installed here, and
# `failure-alert` the page its oneshots name. Both need `discord_alert_webhook`, and the agent's gh
# login needs `claude_code_agent_gh_token`.
#
# `worktree-sweep` is the weekly removal of merged worktrees and unreachable objects that
# daniel-box also runs: fan-out batches run in this host's primary checkout too. The sweep pings
# `daniel-server-worktree-sweep` with the `healthchecks_ping_key` credential listed below.
#
# `uv` and `vale` put the homelab-tools binaries on PATH as /usr/bin/uv and /usr/bin/vale, and
# `worktree-holders` ships the scan's socket. The dotfiles repo owns the per-user uv, prek and
# Python, and the cluster-node procedure runs `prek install`.
#
# `gh-quota` ships the GitHub spend ledger that scripts/lib/gh.py and ghread record into
# (docs/github-quota.md), as on daniel-box.
#
# The host baseline and the Loki witness: `host-hardening` ships the sudo cache, auditd's rules,
# the module blacklist, the core-dump drop-in, the login banner, the i915 option and the base
# packages; `rsyslog-filter` ships the info filter; `loki-route-witness` ships the witness timer.
# No file needs a credential. The `unattended-upgrades` component above applies the regular
# updates pocket, this host has no Docker to hold, and no homelab origin is allowed.
description: daniel-server's homelab host package
# The claude-code component's agent user. Its uid differs per host, so the users entry and the
# agent's login-slice cap sit here; `component: claude-code` reaches only these files.
component: claude-code
users:
  # The homelab band 900-949 sits below the uids Ubuntu hands out from 999 down.
  - {name: claude, uid: 900, gid: 900, home: /var/lib/claude, shell: /bin/bash, comment: Claude agent}
# daniel-server's resolver has no record for the Pi, so `ssh daniel-pi` and `probe.py pi`
# fail here for every user. The regexp anchors on the NAME, so a new Pi address rewrites the
# line rather than adding a second one. The arm never removes a line: dropping this entry leaves
# the live line until it is deleted by hand.
lines:
  - {path: /etc/hosts, line: "{{ hosts['daniel-pi'].server_ip }} daniel-pi", regexp: '^\S+\s+daniel-pi(\s|$)', mode: "0644"}
components: [reconcile, secrets-unit, nut-secondary, apt-github-cli, unattended-upgrades, sshd, host-tuning, k3s-gates, k3s-agent, failure-alert, claude-code, sops, check-lib, hypervisor, fail2ban, integrity-scans, aide-scan, postfix, accounting, host-maintenance, ssh-firewall, worktree-sweep, uv, vale, worktree-holders, gh-quota, host-hardening, rsyslog-filter, loki-route-witness]
units:
  k3s-agent.service: {policy: windowed}
credentials:
  - healthchecks_ping_key
maintainer_scripts: [preinst, postinst, prerm]
enable:
  homelab-updater.timer: timers.target
# pyproject.toml forces PyYAML's C extension, so a repo venv on an interpreter PyYAML ships no
# wheel for builds it from source against these headers.
depends:
  - libyaml-dev
files:
  # The agent's login-session slice, capped like the Remote Control unit (claude-code component).
  - src: "component:templates/login-slice-caps.conf.j2"
    dst: /usr/lib/systemd/system/user-900.slice.d/homelab-claude-caps.conf
    when: claude_code_login_caps_enabled and claude_code_agent_user_enabled
# daniel-server installs `gh` by hand. The apt-github-cli component ships the source, and
# the hand-installed github-cli.list names the same repository, so reconcile retires it.
legacy:
  - {path: /etc/apt/sources.list.d/github-cli.list}
  # The enable link the Ansible role left dangling when its unit file went. The package's own
  # link is in /usr/lib/systemd/system/sockets.target.wants.
  - {path: /etc/systemd/system/sockets.target.wants/homelab-rootq.socket}
  # The binary sops_setup installed, which sits ahead of the packaged /usr/bin/sops on PATH.
  - {path: /usr/local/bin/sops}
  # The copies initial_setup installed, which sit ahead of /usr/bin/vale and /usr/bin/uv on PATH.
  - {path: /usr/local/bin/vale}
  - {path: /usr/local/bin/uv}
  # A prek no tracked file writes; the dotfiles repo owns prek, in ~/.local/bin.
  - {path: /usr/local/bin/prek}
  # The Compose-era CrowdSec hub update the retired traefik role installed in root's crontab
  # (`docker exec crowdsec cscli hub update && … upgrade`, 07:15 daily). This host has no
  # Docker, so it fails every day, and no other tree path retires it.
  - {cron: Update Crowdsec Hub, user: root}
  # Not Ansible-managed: a test run leaked this textfile; the eval sweep runs on
  # daniel-box alone, so nothing here overwrites it and HostCheckOverdue holds on it.
  - {path: /var/lib/node-exporter-textfile/eval-run.prom}
  # The absent arms of initial_setup's crons.yml that reached this host.
  - {path: /etc/sudoers.d/20-worktree-holders}
  - {path: /usr/local/bin/secret-rotation-audit.sh}
  - {path: /usr/local/bin/secret-rotate.sh}
  - {path: /etc/homelab/cert-expiry-webhook.env}
  # The cron absent arms of crons.yml. This host has no gitops, so the secret-rotation
  # component never lists its two crons here.
  - {cron: "Daily secret rotation audit", user: "{{ sys_user }}"}
  - {cron: "Weekly secret rotation (auto tier)", user: "{{ sys_user }}"}
  - {cron: "TLS cert-expiry watch", user: "{{ sys_user }}"}
  # docker_install's teardown half, which this host runs because it has no Docker. Each
  # drop-in comes before its directory, because reconcile removes a directory only once it is empty.
  - {cron: "Redeploy ical-proxy", user: "{{ sys_user }}"}
  - {cron: "Clean stale tdarr transcode cache", user: "{{ sys_user }}"}
  - {path: /etc/systemd/system/docker.service.d/20-go-runtime.conf}
  - {path: /etc/systemd/system/docker.service.d}
  - {path: /etc/systemd/system/containerd.service.d/20-go-runtime.conf}
  - {path: /etc/systemd/system/containerd.service.d}
  # What gitops_deploy's teardown half removed from this host, which never ran the
  # deployer. Its three directories are not listed: the teardown removed them, and reconcile
  # removes a directory only when it is empty.
  - {unit: gitops-deploy.timer}
  - {unit: gitops-deploy.service}
  - {unit: gitops-deploy-alert.service}
  - {unit: staging-backfill.timer}
  - {unit: staging-backfill.service}
  - {unit: staging-backfill-alert.service}
  - {path: /etc/polkit-1/rules.d/50-gitops-deploy.rules}
  - {path: /var/lib/node-exporter-textfile/gitops_tick.prom}
  - {path: /var/lib/homelab/setup-render-manifest.d/gitops-deploy}
  - {path: /var/lib/homelab/setup-deployed-manifest.d/gitops-deploy}
  - {unit: kuma-check-github-ruleset-drift.timer}
  - {unit: kuma-check-github-ruleset-drift.service}
  - {unit: kuma-check-github-ruleset-drift-boot.service}
  - {unit: kuma-check-github-interaction-limit.timer}
  - {unit: kuma-check-github-interaction-limit.service}
  - {unit: kuma-check-github-interaction-limit-boot.service}
  - {path: /var/lib/kuma-check/github-ruleset-drift.down}
  - {path: /var/lib/kuma-check/github-interaction-limit.down}
  - {cron_file: github-ruleset-drift}
  - {cron_file: github-interaction-limit}
  - {path: /var/lib/node-exporter-textfile/github-ruleset-drift.prom}
  - {path: /var/lib/node-exporter-textfile/github-interaction-limit.prom}
  - {path: /var/lib/homelab/setup-render-manifest.d/gitops-deploy-github-checks}
  - {path: /usr/local/bin/github-ruleset-drift.sh}
  - {path: /usr/local/bin/github-interaction-limit.sh}
  # The setup-drift check initial_setup installed, the Ansible copy of the host-check
  # library (check-lib ships /usr/lib/homelab/homelab-check-lib.sh), their stamp fragments, and
  # the ansible.log cron's absent arm. The timer goes first. The two manifest directories stay:
  # reconcile removes a directory only when it is empty, and other fragments may remain.
  - {unit: kuma-check-setup-drift.timer}
  - {unit: kuma-check-setup-drift.service}
  - {unit: kuma-check-setup-drift-boot.service}
  - {path: /usr/local/bin/setup-drift-check.sh}
  - {path: /var/lib/node-exporter-textfile/setup-drift-check.prom}
  - {path: /var/lib/kuma-check/setup-drift.down}
  # Nothing writes the old marker directory; its components' markers render after this entry.
  - {path: /var/lib/kuma-check}
  - {path: /usr/local/lib/setup-drift-lib.sh}
  - {path: /usr/local/lib/homelab-check-lib.sh}
  - {path: /var/lib/homelab/setup-render-manifest.d/setup-drift-check}
  - {path: /var/lib/homelab/setup-deployed-manifest.d/setup-drift-lib}
  - {path: /var/lib/homelab/setup-deployed-manifest.d/homelab-check-lib}
  - {cron: "Clear ansible log file", user: root}
