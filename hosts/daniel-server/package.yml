# daniel-server's host package (H4.2). It ships reconcile, the secrets unit and the enable link
# for homelab-updater.timer, which arms the host's unattended updates from the first version
# (docs/target-architecture/host/h4-secrets-unit.md, *Steps, as PRs*, item 7). The timer keeps
# the shared schedule: daniel-server ships no drop-in on it.
#
# The one credential is the UPS watchdog's Kuma push token, which homelab-ups-watchdog.service loads
# (hosts/components/nut-secondary, H4.3c).
# ansible/vars/hosts/daniel-server.sops.yaml carries every key this tree names, and
# `host_secrets.py sync daniel-server` rewrites it (operator-only).
# Since H7.28 it ships the first three subjects of initial_setup, the same components as daniel-pi:
# apt's unattended upgrades, the sshd drop-ins and the kernel, journald, limits and login hardening.
# initial_setup skips each on this host through `initial_setup_packaged_hosts`. No file needs a
# credential. The rsyslog info filter stays an Ansible task gated on has_rsyslog.
#
# #6413 adds `k3s-gates` alone: the k3s-agent Plan's `prepare` runs /usr/lib/homelab/k3s_gates.py
# from the host's root (H6.3d). The windowed restart, `k3s-restart`, stays off this package until
# H6 *Open questions* 7 and H6.5a decide it, so daniel-server's k3s config changes stay a hand
# apply through the `k3s_agent` join play.
#
# H7.39 adds `claude-code`, the agent user and everything the claude_code role installed here,
# and `failure-alert`, the page its oneshots name. The role ends on this host. Both need
# `gitops_deploy_discord_webhook`, and the agent's gh login needs `claude_code_agent_gh_token`.
#
# Since H7.31 it ships the rest of initial_setup's subjects, the same components as daniel-pi: the
# fail2ban group (fail2ban, integrity-scans for rkhunter and AIDE, postfix and accounting), the
# maintenance timers (host-maintenance: the weekly reboot, apt autoremove and dpkg purge; this
# host has neither Docker nor fwupd) and ufw (ssh-firewall). check-lib ships the textfile library
# the scans and the maintenance wrapper source. initial_setup skips each subject on this host
# through `initial_setup_packaged_hosts`. The scans and the reboot read three more credentials,
# `rkhunter_daniel_server_push_token`, `aide_daniel_server_push_token` and
# `healthchecks_ping_key` (`host_secrets.py sync daniel-server`, operator-only).
#
# #6815 adds `worktree-sweep`, the weekly removal of merged worktrees and unreachable objects
# that daniel-box already runs. Fan-out batches run in this host's primary checkout too, and
# nothing else cleared its 42 worktrees, 1173 loose objects or stale gc.log. The sweep pings
# `daniel-server-worktree-sweep` with the `healthchecks_ping_key` credential listed below.
#
# The package declares no ufw rule of its own. The k3s agent's join rules stay `setup/k3s`
# rules until H7.34 declares them `keep`; they carry no `homelab:` label, so the arm leaves them.
description: daniel-server's homelab host package
# The claude-code component's agent user. Its uid differs per host, so the users entry and the
# agent's login-slice cap sit here; `component: claude-code` reaches only these files (H7.40).
component: claude-code
users:
  # uid 995 is the live uid (`getent passwd claude` on daniel-server, 2026-10-29).
  - {name: claude, uid: 995, home: /var/lib/claude, shell: /bin/bash, comment: Claude agent}
components: [reconcile, secrets-unit, kuma-push, nut-secondary, apt-github-cli, unattended-upgrades, sshd, host-tuning, k3s-gates, failure-alert, claude-code, sops, check-lib, fail2ban, integrity-scans, postfix, accounting, host-maintenance, ssh-firewall, worktree-sweep]
# No unit loads ups_secondary_daniel_server_push_token, because M6 batch B4's Cutover-2 dropped
# the UPS watchdog's Kuma push. It stays listed because `host_secrets.py check` pins this list to
# daniel-server's SOPS file, and changing that file takes the operator's `host_secrets.py sync
# daniel-server`. B4's token PR removes the key here and in the file in one step.
credentials:
  - ups_secondary_daniel_server_push_token
  - rkhunter_daniel_server_push_token
  - aide_daniel_server_push_token
  - healthchecks_ping_key
maintainer_scripts: [preinst, postinst, prerm]
enable:
  homelab-updater.timer: timers.target
files:
  # The agent's login-session slice, capped like the Remote Control unit (claude-code component).
  - src: "component:templates/login-slice-caps.conf.j2"
    dst: /usr/lib/systemd/system/user-995.slice.d/homelab-claude-caps.conf
    when: claude_code_login_caps_enabled and claude_code_agent_user_enabled
# H7.24a: daniel-server installs `gh` by hand. The apt-github-cli component ships the source, and
# the hand-installed github-cli.list names the same repository, so reconcile retires it.
legacy:
  - {path: /etc/apt/sources.list.d/github-cli.list}
  # H7.24b: the binary sops_setup installed, which sits ahead of the packaged /usr/bin/sops on PATH.
  - {path: /usr/local/bin/sops}
  # H7.31: the maintenance wrapper the crons ran, and the Healthchecks.io key file the reboot cron
  # sourced. No other job on this host reads the key file.
  - {path: /usr/local/bin/host-maintenance.sh}
  - {path: /etc/healthchecks/ping.env}
  - {path: /etc/healthchecks}
  # #6716: the Compose-era CrowdSec hub update the retired traefik role installed in root's crontab
  # (`docker exec crowdsec cscli hub update && … upgrade`, 07:15 daily). This host has had no
  # Docker since 2026-08-14, so it fails every day, and no other tree path retires it.
  - {cron: Update Crowdsec Hub, user: root}
  # #6735: not Ansible-era. A 2026-10-25 test run leaked this textfile; the eval sweep runs on
  # daniel-box alone, so nothing here overwrites it and HostCheckOverdue holds on it.
  - {path: /var/lib/node-exporter-textfile/eval-run.prom}
