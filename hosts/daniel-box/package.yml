# daniel-box's host package. The secrets unit decrypts `k3s_readonly_token` into /run/credstore,
# and homelab-k3s-restart loads it to read the API. secrets/hosts/daniel-box.sops.yaml carries
# every key this tree names, and `host_secrets.py sync daniel-box` rewrites it (operator-only).
#
# The UPS secondary (hosts/components/nut-secondary): its upsmon.conf output reads
# `nut_monitor_password` from the same SOPS file. Listing the component is what arms this host.
# daniel-box draws from daniel-server's UPS: a 16-core burn here moved `upsc` ups.load by ~5
# points (~45 W). Without the secondary, a power cut hard-cuts etcd, Longhorn's primary
# replicas, Traefik, Prometheus and LAN DNS at battery end. Arming a further host is not a lone
# edit: it needs an ONBATT delay that rides out a blip (nut_onbatt_shutdown_delay in
# k8s/roles/nut/defaults/main.yml) and the console-attended `upsmon -c fsd` drill from
# k8s/roles/nut/CLAUDE.md, because a broken chain looks like a working one while mains is up.
#
# The initial_setup subjects ship as the same components as daniel-pi and daniel-server: apt's
# unattended upgrades, the sshd drop-ins, the kernel, journald, limits and login hardening, the
# fail2ban group (fail2ban, integrity-scans for rkhunter and aide-scan for AIDE, postfix and
# accounting), the maintenance timers (host-maintenance: the weekly reboot, apt autoremove, dpkg
# purge and, as `has_fwupd` is true only here, the firmware update; this host has no Docker) and
# ufw (ssh-firewall). The scans and the reboot read one more credential,
# `healthchecks_ping_key` (`host_secrets.py sync daniel-box`, operator-only).
#
# The host baseline is the same components as daniel-pi and daniel-server: `host-hardening` ships
# the sudo cache, auditd's rules, the module blacklist, the core-dump drop-in, the apport drop-in,
# the login banner and the base packages, and `rsyslog-filter` ships the info filter. No file needs
# a credential, and `has_igpu` is false here, so no i915 option ships.
#
# The k3s server's host half: `k3s-server` carries Longhorn's packages, the read-only
# kubeconfig, the inotify key, the join rules declared `keep` and the address pin, whose wifi half
# reads `wifi_ssid` and `wifi_password`. `k3s-host-dns` holds the resolver and the host forwarder, and
# `k3s-host-checks` the backup, disk and token checks, whose restore credentials read `r2_*`
# (`host_secrets.py sync daniel-box`, operator-only).
#
# The Renovate pair, fake_remux and the two GitHub checks (their components) read four more keys:
# renovate_agent_gh_token, renovate_agent_claude_oauth_token, sonarr_api_key and
# arr_discord_webhook_url (`host_secrets.py sync daniel-box`, operator-only).
#
# The deploy UI daemon with its in-flight panel (hosts/components/deploy-ui) declares the port's
# three ufw allows. It reads no credential. The builder and the repository are
# hosts/components/builder.
#
# The k3s-server component's first k3s.service drop-in lets the package mark k3s.service
# `windowed` (the renderer refuses a unit policy that no package installs or drops in on).
# Reconcile therefore never restarts k3s, and homelab-k3s-restart does it once per changed hash of
# the files the component marks `manual:k3s.service`. The component is forward-only.
#
# The restart window is `k3s_restart_window` in inventory/host_vars/daniel-box.yml, which
# sits above the component's defaults. A package-level `defaults:` map reaches only the package's
# own files, never a component's.
description: daniel-box's homelab host package
# media-volume's host path, a copy of the k8s role's default for the tmpfiles.d file below. puid
# and pgid come from group_vars. hosts/lib/tests/test_box_k3s_host_half.py holds the copy equal.
defaults:
  media_volume_host_path: /srv/media
# The claude-code component's agent user. Its uid differs per host, so the users entry and the
# agent's login-slice cap sit here; `component: claude-code` reaches only these files.
component: claude-code
users:
  # The homelab band 900-949 sits below the uids Ubuntu hands out from 999 down.
  - {name: claude, uid: 900, gid: 900, home: /var/lib/claude, shell: /bin/bash, comment: Claude agent}
  # Triage's controller: owns triage's records and reports, and alone will
  # start its units. Declared here, not in the claude-code component, because triage ships only
  # on daniel-box. Its name and home are pinned in claude-triage-pins.j2.
  - {name: claude-triage-ctl, uid: 906, gid: 906, home: /var/lib/claude-triage-ctl, shell: /usr/sbin/nologin, comment: Triage controller}
  # Triage's session user: runs the headless session the controller starts, with no GitHub token
  # and no start right.
  - {name: claude-triage, uid: 907, gid: 907, home: /var/lib/claude-triage, shell: /usr/sbin/nologin, comment: Triage session}
  # Renders the triage and Renovate sessions' Claude Code config from the verified dotfiles tag
  # It is no session's user, so no session reaches its stage.
  - {name: claude-triage-render, uid: 908, gid: 908, home: /run/homelab-claude-config-render, shell: /usr/sbin/nologin, comment: T2 config render}
components:
  - reconcile
  - secrets-unit
  - k3s-gates
  - k3s-restart
  - nut-secondary
  - check-lib
  - fail2ban
  - integrity-scans
  - aide-scan
  - postfix
  - accounting
  - host-maintenance
  - ssh-firewall
  - docs-refresh
  - board-sync
  - infra-map
  - eval-sweep
  - worktree-sweep
  - secret-rotation
  - loki-route-witness
  - registry-gc
  - apt-github-cli
  - failure-alert
  - builder
  # Fast-forwards the primary checkout.
  - checkout-sync
  - unattended-upgrades
  - sshd
  - host-tuning
  - k3s-server
  - k3s-apparmor
  - apparmor-who
  - k3s-host-dns
  - k3s-host-checks
  - claude-code
  - sops
  - renovate-notify
  - renovate-agent
  - t2-egress
  - fake-remux
  - github-checks
  - deploy-ui
  # This package's own units name /usr/bin/uv.
  - uv
  - vale
  - worktree-holders
  # The GitHub spend ledger that scripts/lib/gh.py and ghread record into (docs/github-quota.md).
  - gh-quota
  - host-hardening
  - rsyslog-filter
units:
  k3s.service: {policy: windowed}
credentials:
  - k3s_readonly_token
  - healthchecks_ping_key
# Two claude-code secrets only this host uses. They sit here rather than in
# the component, because host_secrets.py names every output key a component declares for each
# host that lists it, and daniel-server's SOPS file must not carry them.
outputs:
  # Triage's own Claude credential, read by systemd as root. It stays out of the agent's files, so
  # a session cannot copy it into the clone or a report.
  - src: "component:templates/claude-triage-oauth-token.j2"
    path: /etc/claude-triage/oauth-token
    owner: root
    group: root
    mode: "0600"
    keys: [claude_code_triage_claude_oauth_token]
    persist: false
    link: true
    when: claude_code_agent_user_enabled and claude_code_triage_enabled
  # The agent's login for the homelab-ui MCP server. `format: json` makes homelab-secrets
  # JSON-escape the password and refuse a file that does not parse. The file renders under /run, outside the agent's home. `path` is where the agent looks:
  # claude-agent-setup links it there (its `ui_login` names the destination), because the
  # package must not install into a directory the agent owns.
  - src: "component:templates/agent-homelab-ui-credentials.json.j2"
    path: /var/lib/claude/.config/homelab-ui/credentials.json
    destination: claude-agent/homelab-ui-credentials.json
    owner: claude
    group: ubuntu
    mode: "0600"
    keys: [authelia_agent_password]
    persist: false
    link: false
    format: json
    when: claude_code_agent_user_enabled and claude_code_agent_homelab_ui_enabled
maintainer_scripts: [preinst, postinst, prerm]
# Arms the shared updater schedule here, as daniel-server and the Pi do. daniel-box ships
# no drop-in on the timer.
enable:
  homelab-updater.timer: timers.target
# nfpm, for the builder this host runs. libyaml-dev: pyproject.toml forces PyYAML's C
# extension, so a repo venv on an interpreter PyYAML ships no wheel for builds it from source.
depends:
  - homelab-tools
  - libyaml-dev
  # What the dotfiles' install-cli-tools script wants and cannot install itself: it shells
  # out to sudo, which has no TTY on a non-interactive apply. Its PKGS list is the source.
  - bat
  - fd-find
  - gron
  - shellcheck
  - lua5.4
  - btop
  - chafa
  - zsh
  - zsh-autosuggestions
  - zsh-syntax-highlighting
files:
  - {src: tmpfiles.d/homelab-media-volume.conf.j2, dst: /usr/lib/tmpfiles.d/homelab-media-volume.conf}
  # The agent's login-session slice, capped like the Remote Control unit (claude-code component).
  - src: "component:templates/login-slice-caps.conf.j2"
    dst: /usr/lib/systemd/system/user-900.slice.d/homelab-claude-caps.conf
    when: claude_code_agent_user_enabled
