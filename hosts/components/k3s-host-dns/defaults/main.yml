# The host forwarder's and the node resolver's tunables. The renderer loads this file beneath
# component.yml's own defaults.

# In order; the first wins on every query. DELIBERATELY NO FALLBACK ENTRY: a public one would let a
# dead CoreDNS silently degrade to unfiltered DNS. Restart=always covers a crash.
k3s_node_dns_upstreams:
  - 127.0.0.1

# `attempts` is rounds over the WHOLE list, not per-server retries (resolv.conf(5)):
# one 2s round means a dead Pi-hole costs one timeout per lookup, then answers.
k3s_node_dns_timeout: 2
k3s_node_dns_attempts: 1
k3s_node_dns_options: "timeout:{{ k3s_node_dns_timeout }} attempts:{{ k3s_node_dns_attempts }}"

# glibc learns an entry is dead by timing out; CoreDNS `health_check` skips it before a query is
# sent.
# 1.14.7 exports no coredns_forward_requests_total; use
# coredns_proxy_request_duration_seconds_count{proxy_name="forward"}.
k3s_host_coredns_bin: /usr/lib/homelab/bin/coredns
k3s_host_coredns_conf: /etc/coredns/Corefile

# `policy sequential` below makes this list an order; forward defaults to `random`, a coin-flip.
# Two public entries, not one: a single fallback is the single point of failure it exists to remove.
k3s_host_dns_upstreams:
  - "{{ dns_k8s_vip }}"
  - 1.1.1.1
  - 1.0.0.1

# An unhealthy upstream is re-probed every 0.5s regardless: this bounds how long a NEWLY dead
# Pi-hole gets queries.
# max_fails 2, not 1 (one lost UDP packet) and not 0 (never marks down and never health checks).
k3s_host_dns_health_check: 5s
k3s_host_dns_max_fails: 2

# Cached answers never reach an upstream, so this bounds how stale a Pi-hole blocklist change can
# be.
k3s_host_dns_cache_ttl: 30

# Bind to the node's LAN address, NOT 127.0.0.1: Prometheus scrapes from a pod, where loopback is
# the pod's own.
# The UFW allow in component.yml is the other half.
k3s_host_dns_metrics_port: 9253

# systemd-resolved would also list these links' lease servers: six nameservers against the 3 a pod
# gets.
# Only eno1 carries a lease with DNS; the down USB NIC is left alone so the override cannot outlive
# it.
k3s_node_dns_dhcp_links:
  - eno1
