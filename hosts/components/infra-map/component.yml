# The infrastructure-map refresh on daniel-box (H7.10a). Until H7.36 initial_setup installed it as
# the "Refresh homelab infrastructure map" cron, every 15 minutes. It regenerates the architecture
# diagram and the declared-versus-live map (scripts/infra_map/gen_infra_map.py) on daniel-box,
# because kubectl is local there: both cluster nodes are read from the cluster, and only daniel-pi
# is polled remotely, over ONE ssh call per run, well clear of the `ufw limit ssh`
# 6-connections-per-30s reject threshold.
#
# No Healthchecks ping: a failed run leaves the previous page in place rather than corrupting
# anything, and the page prints the timestamp it was generated at, so a run that stops working
# shows up as a visibly stale date on the artifact itself. The service reads no credential.
#
# Autonomous-role contract (the timer regenerates the map every 15 minutes with no human in the
# loop).
#
# - Scope / exclusions: one write, the HTML file at
#   /home/<sys_user>/.claude/artifacts/homelab-infra-map.html. It reads the cluster through
#   kubectl and daniel-pi over one ssh call, and changes no cluster, host or repository state.
# - Mode (explicit and reversible): the timer's enable link in this package arms it. Dropping the
#   link from a package version, or reverting this component, stops the timer on the install that
#   drops it, and `systemctl stop homelab-infra-map.timer` stops it until the next install.
# - Authoritative sources: the live cluster through kubectl, and the checkout's declarations.
# - Abort valves: reconcile's `hold_sha`, and the updater's own hold (docs/host-packages.md).
# - Required evidence: the timestamp the page prints, and a journal line from the service on a
#   failing run. A successful run prints nothing, because stdout is discarded.
# - Next-run review: a page whose generated-at date is more than an hour old means the timer did
#   not run or the run failed. Read `journalctl -u homelab-infra-map.service` before changing
#   the generator.
#
# ENFORCED: hosts/lib/tests/test_infra_map_component.py, which renders the package and holds the
# unit, the timer, the PATH and KUBECONFIG environment and the discarded stdout.
files:
  - {src: units/homelab-infra-map.service.j2, dst: /usr/lib/systemd/system/homelab-infra-map.service}
  - {src: units/homelab-infra-map.timer, dst: /usr/lib/systemd/system/homelab-infra-map.timer}
enable:
  homelab-infra-map.timer: timers.target
# What initial_setup installed before H7.36. Reconcile retires the cron once the timer above has
# started, so the map never regenerates twice or not at all.
legacy:
  - {cron: "Refresh homelab infrastructure map", user: "{{ sys_user }}"}
