# The Pi's Compose project: the renderer's inputs (the Compose env template and the tmpfiles
# file), the unit and its two scripts, and the per-service trees.
#
# `compose:` names the directory of per-service trees (host_compose.py), and the services come from
# `compose_services` in the Pi's host_vars.
#
# The networks. Every shared network stays `external: true`, so Compose never recreates one the
# live Pi holds, which would stop every attached container. The unit's `ExecStartPre=`
# lines create each external network the rendered compose files name, from the renderer's
# `compose_external_networks`, so a fresh Pi gets them on first start.
# hosts/lib/tests/test_pi_docker_component.py holds the created set equal to the project's, and
# hosts/lib/tests/test_pi_compose_network_measurement.py records what Compose does with an
# unlabelled network of the same name.
#
# The `outputs:` entry below is the Compose env file. Autoheal's webhook and alloy's HTTP password
# are the secrets a compose file reads. The includes carry `env_file:` and `keys:` lists exactly
# the secrets the compose files read.
# The Pi's SOPS file must hold each key: the operator runs `host_secrets.py sync daniel-pi`.
#
# modules-load.d/wg-easy.conf loads the legacy iptables tables wg-easy's PostUp writes to. The
# container runs legacy `iptables` and cannot load a module, and Ubuntu 26.04 boots without
# ip_tables, iptable_nat and iptable_filter, so without the file wg-quick fails and the container
# crash-loops. The PostUp rules are IPv4 only, so no ip6table module is listed. The
# `wireguard` module itself is the host-hardening component's, on every host.
compose: services
outputs:
  - src: compose.env.j2
    path: /usr/lib/homelab/compose/compose.env
    owner: root
    group: root
    mode: "0600"
    keys: [alloy_pi_http_password, monitor_discord_webhook_url]
    dependents: [homelab-compose.service]
    format: dotenv   # homelab-secrets refuses a `'` or a newline in a value
# The boot path, reconcile's step 2 and the restart set all need this link.
enable:
  homelab-compose.service: multi-user.target
defaults:
  # The unit's wait timeout uses the Pi's healthcheck variables from host_vars; these are the
  # docker-proxy template's own defaults for a host-less render.
  container_healthcheck_interval: 10s
  container_healthcheck_timeout: 5s
  container_healthcheck_retries: 3
  # The largest start_period any service declares; a larger one raises it and the unit's wait grows.
  compose_start_period: 10s
files:
  - {src: tmpfiles.d/homelab-compose.conf, dst: /usr/lib/tmpfiles.d/homelab-compose.conf}
  - {src: modules-load.d/wg-easy.conf, dst: /etc/modules-load.d/wg-easy.conf, activate: modules-load}
  - {src: compose-run, dst: /usr/lib/homelab/compose-run, mode: "0755"}
  - {src: compose-adopt, dst: /usr/lib/homelab/compose-adopt, mode: "0755"}
  # Marked inputs_sha256: it renders after every other file, with the hash over the project's files.
  - {src: units/homelab-compose.service.j2, dst: /usr/lib/systemd/system/homelab-compose.service, inputs_sha256: true}
