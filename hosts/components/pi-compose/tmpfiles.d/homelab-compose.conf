# Directories the Pi's Compose project binds or runs in (H5, *Data directories*).
# `homelab-compose.service` runs `systemd-tmpfiles --create` on this file in ExecStartPre=, so a
# rebuilt Pi gets each directory before any container starts. On the live Pi each line changes
# nothing, because every line copies the mode and owner its directory already has.
#
# Each move PR (H5.6 to H5.9) adds one `d` line for each directory its service binds, with the
# mode and owner its body records from `stat -c '%a %U %n'`. The bind-source census fails a
# relative bind source with no line here.
#
# /var/log/pi-health holds the heartbeat verdict lines alloy reads. The H3.8b heartbeat units
# create it through LogsDirectory=pi-health as User=ubuntu, so the line names that owner.
#Type Path                Mode User   Group  Age
d /var/log/pi-health 0755 ubuntu ubuntu -
# The two parents of every service directory (H5.2b). systemd-tmpfiles refuses to create a path
# that passes from a user-owned directory (/home/ubuntu) into a root-owned one, so on a rebuilt Pi,
# where neither parent exists yet, they must be created as ubuntu. A `-` mode leaves the mode of a
# parent that already exists, as on the live Pi, untouched. The census in
# hosts/lib/tests/test_pi_compose_canary.py asserts that every service line has both lines above it.
d /home/ubuntu/server - ubuntu ubuntu -
d /home/ubuntu/server/containers - ubuntu ubuntu -
# H5.2b's canary: the project_directory its include names. It has no Ansible-era data, so the
# mode and owner are the ones the other service directories carry. H5.10 removes this line.
d /home/ubuntu/server/containers/pi-canary 0755 ubuntu ubuntu -
# H5.6's docker-proxy: the project_directory its include names. The service binds only the Docker
# socket, so the directory holds nothing; the mode and owner are what `stat -c '%a %U %n'` printed
# on the live Pi (755 ubuntu).
d /home/ubuntu/server/containers/docker-proxy 0755 ubuntu ubuntu -
# H5.7's autoheal: the project_directory its include names. The service writes nothing there (its
# role's only file was the compose file); the mode and owner are what `stat -c '%a %U %n'` printed
# on the live Pi (755 ubuntu).
d /home/ubuntu/server/containers/autoheal 0755 ubuntu ubuntu -
# H5.8's alloy: the project_directory its include names, and the data directory it binds at
# ./data (the tailing cursor). The mode and owner of both are what `stat -c '%a %U %n'` printed on
# the live Pi (755 ubuntu). The config directory the role created is not listed: the package
# installs config.alloy under /usr/lib/homelab/compose/alloy/ instead.
d /home/ubuntu/server/containers/alloy 0755 ubuntu ubuntu -
d /home/ubuntu/server/containers/alloy/data 0755 ubuntu ubuntu -
