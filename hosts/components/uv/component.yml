# The `uv` units and scripts run by absolute path (H7.61,
# docs/target-architecture/host/h7-delete-ansible.md, item 35). homelab-tools installs the pinned
# binary at /usr/lib/homelab/bin/uv, off PATH, so this component ships /usr/bin/uv, a one-line exec
# of that path, as the sops component does. A Renovate bump of the homelab-tools pin therefore
# reaches every caller.
#
# Both cluster hosts list this component, because the packaged readers, such as the claude-code
# component's units, name /usr/bin/uv on both. /usr/local/bin precedes /usr/bin on PATH, so a host
# package that stops writing /usr/local/bin/uv lists it as a legacy entry beside this component. The
# per-user uv under ~/.local/bin is the dotfiles repo's.
#
# DECIDED: the setup roles keep naming /usr/local/bin/uv until their host's own move. On daniel-box
# the GitOps tick re-renders them within ten minutes of a merge, while the package waits on the
# rollout gate, so a repoint there would run a path that does not exist yet. On daniel-server no tick
# re-rendered the Ansible-era Loki witness, so H7.59 retired the path there when it moved the witness.
depends:
  - homelab-tools
files:
  - {src: uv, dst: /usr/bin/uv, mode: "0755"}
