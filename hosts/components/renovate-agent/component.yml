# The unattended Renovate agent on daniel-box as packaged units (H7.37, H7.11,
# docs/target-architecture/host/h7-delete-ansible.md). Until H7.37 the renovate_agent role installed
# it. CLAUDE.md beside this file holds the rules and the contract.
#
# homelab-renovate-agent.service keeps `policy: manual`, so reconcile never restarts a session that
# is landing a PR. renovate-agent-land@.service keeps its Ansible-era name, because the polkit rule
# and the session's prompt start it by name, and a template unit's name is what polkit matches.
#
# The grant on /var/lib/gitops-deploy stays out of this component (H7.11): the ACL Ansible set stays
# on the directory until the operator's cleanup removes it, and H7.19b switches the readers.
users:
  # The homelab band 900-949 sits below the uids Ubuntu hands out from 999 down (#8100).
  - {name: renovate-agent, uid: 901, home: /var/lib/renovate-agent, shell: /bin/bash, comment: Unattended Renovate agent}
units:
  homelab-renovate-agent.service: {policy: manual}
outputs:
  # Readable by the agent, writable by root alone: a session steered by text it read could otherwise
  # raise its own budget or timeout, or point PROMPT_FILE at a prompt of its own for the next run.
  - src: templates/config.env.j2
    path: /etc/renovate-agent/config.env
    owner: root
    group: renovate-agent
    mode: "0640"
    keys: [discord_alert_webhook]
    persist: false
    link: true
  # Read by systemd as root through EnvironmentFile=, so neither value appears in a unit line.
  - src: templates/session.env.j2
    path: /etc/renovate-agent/session.env
    owner: root
    group: root
    mode: "0600"
    keys: [renovate_agent_gh_token, renovate_agent_gh_read_token, renovate_agent_claude_oauth_token]
    persist: false
    link: true
files:
  # Root-owned: the agent's user runs these and the lander runs land_renovate_pr.py, and neither may
  # change what the other runs.
  - {src: files/renovate_agent.py, dst: /usr/lib/homelab/renovate-agent/renovate_agent.py, mode: "0755"}
  - {src: files/agent_toolbox.py, dst: /usr/lib/homelab/renovate-agent/agent_toolbox.py}
  - {src: files/run_worktree.py, dst: /usr/lib/homelab/renovate-agent/run_worktree.py}
  - {src: files/run_requests.py, dst: /usr/lib/homelab/renovate-agent/run_requests.py}
  - {src: files/agent_logic.py, dst: /usr/lib/homelab/renovate-agent/agent_logic.py}
  - {src: files/land_renovate_pr.py, dst: /usr/lib/homelab/renovate-agent/land_renovate_pr.py, mode: "0755"}
  - {src: files/renovate_floor.py, dst: /usr/lib/homelab/renovate-agent/renovate_floor.py}
  - {src: files/t2-approval-floor, dst: /usr/lib/homelab/t2-approval-floor}
  - {lib: host_lib.py, dst: /usr/lib/homelab/renovate-agent/host_lib.py}
  - {src: templates/prompt.txt.j2, dst: /usr/lib/homelab/renovate-agent/prompt.txt}
  # The agent's user-scope Claude Code settings: the shared guard hooks and the deny floor. The setup
  # script copies them into its home on every run.
  - {src: files/claude-settings.json, dst: /usr/lib/homelab/renovate-agent/claude-settings.json, activate: "try-restart:homelab-renovate-agent-setup.service"}
  - {src: templates/renovate-agent-setup.sh.j2, dst: /usr/lib/homelab/renovate-agent-setup, mode: "0755", activate: "try-restart:homelab-renovate-agent-setup.service"}
  - {src: templates/homelab-renovate-agent-setup.service.j2, dst: /usr/lib/systemd/system/homelab-renovate-agent-setup.service}
  - {src: templates/homelab-renovate-agent.service.j2, dst: /usr/lib/systemd/system/homelab-renovate-agent.service}
  - {src: templates/homelab-renovate-agent.timer.j2, dst: /usr/lib/systemd/system/homelab-renovate-agent.timer}
  - {src: "templates/renovate-agent-land@.service.j2", dst: "/usr/lib/systemd/system/renovate-agent-land@.service"}
  - {src: templates/50-renovate-agent-land.rules.j2, dst: /usr/share/polkit-1/rules.d/50-renovate-agent-land.rules}
  # RenovateAgentNotReporting and HostCheckOverdue are plain YAML and cannot read
  # renovate_agent_enabled, so a disarmed agent says so here and both stay quiet on its check. Arming
  # drops the file from the next package version, which removes it.
  - {src: templates/renovate-agent-disarmed.prom, dst: /var/lib/node-exporter-textfile/renovate-agent-disarmed.prom, when: "not renovate_agent_enabled"}
# renovate_agent_enabled alone decides whether the timer runs. Setting it false in host_vars drops
# this link from the next package version, and reconcile stops the timer on that install.
enable:
  homelab-renovate-agent.timer: {target: timers.target, when: renovate_agent_enabled}
  # Armed or not, so the agent's Claude Code settings exist before the first session.
  homelab-renovate-agent-setup.service: multi-user.target
# What the renovate_agent role installed before H7.37. Reconcile retires each once the units above
# have started, and leaves a legacy service alone while a session still runs in it.
legacy:
  - {unit: renovate-agent.timer}
  - {unit: renovate-agent.service}
  - {unit: renovate-agent-alert.service}
  - {path: "/etc/systemd/system/renovate-agent-land@.service"}
  - {path: /etc/polkit-1/rules.d/50-renovate-agent-land.rules}
  - {path: /etc/renovate-agent/alert-webhook.env}
  - {path: /opt/renovate-agent/renovate_agent.py}
  - {path: /opt/renovate-agent/agent_toolbox.py}
  - {path: /opt/renovate-agent/run_worktree.py}
  - {path: /opt/renovate-agent/agent_logic.py}
  - {path: /opt/renovate-agent/land_renovate_pr.py}
  - {path: /opt/renovate-agent/gitops_markers.py}
  - {path: /opt/renovate-agent/gitops_ledger.py}
  - {path: /opt/renovate-agent/gitops_hold.py}
  - {path: /opt/renovate-agent/host_lib.py}
  - {path: /opt/renovate-agent/prompt.txt}
  - {path: /var/lib/renovate-agent/claude-install.sh}
  - {path: /var/lib/homelab/setup-render-manifest.d/renovate-agent}
  - {path: /var/lib/homelab/setup-deployed-manifest.d/renovate-agent}
