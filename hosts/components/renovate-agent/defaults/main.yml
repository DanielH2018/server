---
# Ships STOPPED. The role installs the script, config and units on every run; this var alone
# decides whether the timer is enabled and started. Setting it to false stops AND disables
# both, which is the rollback.
#
# It is false by default because the first arming is a decision with a spend attached and a
# blast radius (the session merges PRs and deploys), not because the role is unfinished.
renovate_agent_enabled: false

# renovate_agent_host lives in inventory/group_vars/all.yml, not here: initial_setup.yml's
# `when:` on the role entry is evaluated before this file is in scope.
renovate_agent_repo: DanielH2018/server
# The controller's home: the run's state. The session's and the controller's users, and the
# exchange directory between them, are pinned in templates/renovate-agent-pins.j2.
renovate_agent_ctl_home: /var/lib/renovate-agent-ctl
# Its home, its state and its own clone. The session never sees the primary checkout:
# ProtectHome= hides /home from the unit, and /home/{{ sys_user }} is 0750 besides.
renovate_agent_home: /var/lib/renovate-agent
renovate_agent_clone_dir: "{{ renovate_agent_home }}/server"
# The primary checkout, where the lander runs land.sh as sys_user.
renovate_agent_repo_dir: "/home/{{ sys_user }}/server"

# The session's worktree, recreated at origin/master on every tick. Named so
# scripts/dev/prune_worktrees.py recognises the branch (`worktree-<name>`), and fixed rather
# than dated so a daily timer cannot accumulate one tree per day.
renovate_agent_worktree: renovate-auto
renovate_agent_branch: worktree-renovate-auto

# PRs per tick. The ceiling exists because the wall-clock budget below has to cover every
# landing the session starts: each one is a CI wait plus a tick plus a deploy plus a health
# gate. Three fits when Ansible deploys them. A landing of a tag Flux applies waits on the soak
# and can use most of the budget alone, so the wrapper's timeout may stop the run before the
# third; the rest wait for tomorrow's tick.
renovate_agent_max_prs: 3

# `opus` rather than a pinned id so a model rename does not silently strand the timer.
renovate_agent_model: opus
renovate_agent_permission_mode: auto

# A runaway backstop, NOT a planned stop. Stopping a session mid-landing leaves a
# merged-but-undeployed change, which is exactly what CLAUDE.md's post-merge section forbids —
# so this is set well above what three landings cost (a two-turn session with this repo's
# CLAUDE.md is $0.32 before it does any work), and the PR cap is what actually bounds the run.
renovate_agent_budget_usd: 25

# Wall clock for the session itself. It must outlast one landing of a tag Flux applies, which
# waits on the soak and can take the lander's whole TimeoutStartSec (1071min, #5427, #5466, #5512, #5457). A landing
# Ansible deploys is a ~15min CI wait plus a ~20min deploy, so several of those still fit, and
# the unit's TimeoutStartSec sits above this as the backstop. The wrapper kills the
# session at this figure and still posts a digest saying so; systemd's ceiling posts nothing but
# the OnFailure alert, so this one should always trip first.
renovate_agent_run_timeout_s: 67260
renovate_agent_unit_timeout: 1131min

# The session alone. It only triages and writes requests; the runner lands what it nominated
# after it ends, inside renovate_agent_run_timeout_s. templates/renovate-agent-pins.j2 says why
# this figure.
renovate_agent_session_timeout_s: 2700

# 06:00 America/Chicago — after Renovate's own "before 6am" cycle (UTC, so it closes at
# midnight/1am CT depending on DST) has opened the day's PRs. This runs BEFORE the 13:00
# UTC renovate-notify digest classifies them.
# The explicit timezone keeps the wall-clock time fixed across the DST change instead of
# drifting an hour twice a year.
renovate_agent_oncalendar: "*-*-* 06:00:00 America/Chicago"
