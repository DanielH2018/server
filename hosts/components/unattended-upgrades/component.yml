# Periodic and unattended apt upgrades. No package lists either file (`dpkg -S` on daniel-pi), so
# dpkg takes the files over on unpack and no legacy entry is needed.
#
# The local policy keeps its extra origins in Origins-Pattern with the `::` append form, for two
# reasons: Allowed-Origins matches only a repo that publishes a `Suite:` field, and a `{ ... }`
# block reads like a replacement that would drop the -security pocket. The list is
# `unattended_upgrades_origins_patterns` in hosts/vars.yml.
#
# The list holds the release's regular updates pocket, so no Ubuntu update waits for a hand run.
# Docker's origin stays out, and the engine packages are held besides. The homelab origin stays out, because the updater is the one path that
# moves those packages. hosts/tests/host_config/test_unattended_origins_pattern.py holds both origins
# against each host's rendered drop-in. A package with an edited conffile upgrades only where the
# `host-hardening` component sets `--force-confold`, so a host waits for that component's row.
#
# After a change, `apt-config dump` must still list -security under Allowed-Origins and the extras
# under Origins-Pattern. No daemon reads these files at start, so no file carries `activate:`.
files:
  - {src: templates/20auto-upgrades, dst: /etc/apt/apt.conf.d/20auto-upgrades}
  - {src: templates/52unattended-upgrades-local.j2, dst: /etc/apt/apt.conf.d/52unattended-upgrades-local}
