# The AIDE config aide-check and bootstrap's aideinit read; Debian's /etc/aide/aide.conf and its
# conf.d snippets are not read. It selects only the trees aide-check pages on: the system trees,
# /etc, and the login and startup files outside them that its PERSIST regex names. Homes, /var,
# /run and /srv are not scanned, because a change there never pages.
#
# The groups and the relaxed rules are Debian's, copied verbatim, so every path keeps the
# attributes its baseline entry was recorded with. A literal backslash is written `\\`.
# hosts/tests/host_checks/test_aide_config.py holds the selection to aide-check's regexes.

database_in=file:/var/lib/aide/aide.db
database_out=file:/var/lib/aide/aide.db.new
gzip_dbout=yes
report_ignore_e2fsattrs=VNIE

Checksums = H
database_attrs = Checksums
OwnerMode = p+u+g+ftype
Size = s+b
InodeData = OwnerMode+n+i+Size+l+X
StaticFile = m+c+Checksums
Full = InodeData+StaticFile
VarFile = OwnerMode+n+l+X
VarDir = OwnerMode+n+i+X

@@define LANGS (ca|cs|da|de(\\.UTF-8)?|en|eo|es(\\.UTF-8)?|fi|fr(\\.(ISO8859-1|UTF-8))?|gl|hr|hu|id|it(\\.(ISO8859-1|UTF-8))?|ja(\\.UTF-8)?|jp|ko|nb|nl|pl(\\.(UTF-8|ISO8859-2))?|pt(_BR)?|ro|ru|sv|sk|sl|sr(_Cyrl)?|ta|tr|uk|vi|zh(_(CH|CN|Han[st]|TW))?)
@@define LOCALES (ab|ace|ach|af|ak|am|an|ar|as|ast|ay|az|ba|bal|bar|be|be@latin|bg|bi|bn|bn_BD|bn_IN|br|bs|byn|ca|ca@valencia|ce|ch|chr|ckb|crh|cs|csb|cv|cy|da|de|de_CH|de@hebrew|dv|dz|ee|el|en|en@arabic|en_AU|en@boldquot|en_CA|en@cyrillic|en_GB|en@greek|en@hebrew|en@piglatin|en@quot|en@shaw|eo|es|et|et_EE|eu|fa|ff|fi|fil|fo|fr|frp|fur|fy|ga|gd|gez|gl|gn|gu|gv|ha|haw|he|hi|hr|ht|hu|hy|ia|id|io|is|it|iu|ja|jam|ka|kab|ki|kk|kl|km|kmr|kn|ko|kok|ku|kv|kw|kw_GB|ky|lg|lo|locale.alias|lt|lv|mai|mg|mhr|mi|mk|ml|mn|mo|mr|ms|mt|my|na|nah|nb|nb_NO|nds|ne|nl|nn|nso|nv|oc|or|pa|pap|pi|pl|ps|pt|pt_BR|pt_PT|ro|ru|rw|sc|sd|si|sk|sl|so|son|sq|sr|sr@ije|sr@latin|sv|sw|ta|te|tg|th|ti|tig|tk|tl|tr|tt|tt@iqtelif|tzm|ug|uk|ur|uz|ve|vi|wa|wal|wo|xh|yi|yo|zh_CN|zh_Hans|zh_Hant|zh_HK|zh_TW|zu)
@@define STRICTUUID [[:xdigit:]]{8}-[[:xdigit:]]{4}-[1-5][[:xdigit:]]{3}-[89abAB][[:xdigit:]]{3}-[[:xdigit:]]{12}

# Paths their packages or the system rewrite in an ordinary week.
/etc$ d VarDir
/etc/adjtime$ f VarFile
/etc/alternatives$ d VarDir
/etc/apparmor\\.d/libvirt$ d VarDir
/etc/apparmor\\.d/libvirt/libvirt-@@{STRICTUUID}\\.files$ f VarFile
/etc/console-setup/cached_setup_(font|keyboard|terminal)\\.sh$ f VarFile
/etc/resolv\\.conf$ f VarFile
/boot/grub/grubenv$ f VarFile
/usr/(lib|share)/locale$ d VarDir
/usr/lib/locale/locale-archive$ f VarFile
/usr/share/locale/@@{LOCALES}/LC_MESSAGES$ d VarDir
/usr/share/man(/@@{LANGS})?(/man[1378])?$ d VarDir

# vfat invents an inode number at each inode load, so these skip it.
/boot/efi/EFI/(ubuntu|BOOT)$ d Full-i
/boot/efi/EFI/(ubuntu|BOOT)/[^/]+$ f Full-i
/boot/firmware(/|$) Full-i

/(usr|bin|sbin|lib|lib32|lib64|libx32|boot)(/|$) Full
/etc(/|$) Full
/var/spool/cron(/|$) Full
/root/\\.(bashrc|profile|bash_profile)$ f Full
/root/\\.ssh/authorized_keys$ Full
/home/[^/]+/\\.ssh/authorized_keys$ Full
/var/lib/[^/]+/\\.ssh/authorized_keys$ Full
