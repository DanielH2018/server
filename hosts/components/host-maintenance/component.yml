# The weekly maintenance jobs and the 5-minute failed-unit check, each a oneshot service on a
# timer.
#
# - homelab-apt-autoremove and homelab-dpkg-purge run files/host-maintenance.sh. It writes the textfile
#   verdict the AptAutoremoveNotReporting and DpkgPurgeNotReporting rules read.
# - homelab-reboot pings this host's `weekly-reboot-<host>` Healthchecks.io check, then schedules
#   the reboot `weekly_reboot_shutdown_delay_minutes` ahead. It refuses while
#   /run/homelab/validate-failed exists, which reconcile writes when a changed config failed its
#   validation, so a host never reboots into a config that did not validate. A refusal skips the
#   ping, so the Healthchecks.io deadman pages.
# - homelab-firmware-update, on a `has_fwupd` host (daniel-box alone), runs the same
#   wrapper's `firmware-update` job: fwupdmgr refreshes its metadata and stages any update, and the
#   weekly reboot 30 minutes later commits it. It writes the `firmware-update` textfile the
#   FirmwareUpdateNotReporting rule reads.
# - homelab-systemd-units runs files/systemd-units-check.sh every 5 minutes. It counts the failed
#   system units and writes the `systemd-units` textfile the SystemdUnitsFailed and
#   SystemdUnitsNotReporting rules read, so a unit with no OnFailure= hook and no verdict
#   of its own still pages when it fails.
#
# The Docker prune is the pi-docker component's, because only a Docker host runs it.
#
# The reboot schedule renders from `weekly_reboot_*` in group_vars, which Alertmanager's reboot
# mute and the Healthchecks.io cadences fragment also read. The Healthchecks.io key arrives as the
# credential `healthchecks_ping_key`, so each host package lists that key.
#
# Each unit sets its Environment= explicitly, so it does not depend on a login PATH.
#
# Autonomous-role contract (each job runs with no human in the loop).
#
# - Scope / exclusions: reboot this host, stage firmware updates, and remove orphaned packages and
#   the config remnants of removed ones. None edits the repository, the cluster or another host.
#   The systemd-units check only reads unit state.
# - Mode (explicit and reversible): each timer's enable link arms it; dropping the component, or
#   `has_fwupd` for the firmware update, stops the timer on the install that drops it.
# - Abort valves: the reboot refuses on reconcile's validation flag.
# - Required evidence: a `weekly-restart`, `apt-autoremove`, `dpkg-purge` or `fwupd-auto` line in
#   the journal, the Healthchecks.io check for the reboot, and the `apt-autoremove`, `dpkg-purge`,
#   `firmware-update` and `systemd-units` textfiles.
files:
  - {src: files/host-maintenance.sh, dst: /usr/lib/homelab/host-maintenance, mode: "0755"}
  - {src: units/homelab-apt-autoremove.service, dst: /usr/lib/systemd/system/homelab-apt-autoremove.service}
  - {src: units/homelab-apt-autoremove.timer, dst: /usr/lib/systemd/system/homelab-apt-autoremove.timer}
  - {src: units/homelab-dpkg-purge.service, dst: /usr/lib/systemd/system/homelab-dpkg-purge.service}
  - {src: units/homelab-dpkg-purge.timer, dst: /usr/lib/systemd/system/homelab-dpkg-purge.timer}
  - {src: files/systemd-units-check.sh, dst: /usr/lib/homelab/systemd-units-check, mode: "0755"}
  - {src: units/homelab-systemd-units.service, dst: /usr/lib/systemd/system/homelab-systemd-units.service}
  - {src: units/homelab-systemd-units.timer, dst: /usr/lib/systemd/system/homelab-systemd-units.timer}
  - {src: templates/homelab-reboot.j2, dst: /usr/lib/homelab/homelab-reboot, mode: "0755"}
  - {src: units/homelab-reboot.service, dst: /usr/lib/systemd/system/homelab-reboot.service}
  - {src: units/homelab-reboot.timer.j2, dst: /usr/lib/systemd/system/homelab-reboot.timer}
  - {src: units/homelab-firmware-update.service, dst: /usr/lib/systemd/system/homelab-firmware-update.service, when: has_fwupd}
  - {src: units/homelab-firmware-update.timer, dst: /usr/lib/systemd/system/homelab-firmware-update.timer, when: has_fwupd}
enable:
  homelab-apt-autoremove.timer: timers.target
  homelab-dpkg-purge.timer: timers.target
  homelab-reboot.timer: timers.target
  homelab-systemd-units.timer: timers.target
  homelab-firmware-update.timer: {target: timers.target, when: has_fwupd}
legacy:
  - {cron: "Weekly apt autoremove", user: root}
  - {cron: "Weekly dpkg purge orphaned configs", user: root}
  - {cron: "Weekly system restart", user: root}
  # Root's crontab, not sys_user's.
  - {cron: "Clean unused Docker images", user: root}
  - {cron: "Weekly firmware update", user: root, when: has_fwupd}
  # What the crons above ran and sourced. They sit here so a kept cron keeps them too. daniel-box
  # keeps the key file because its k3s health crons and worktree sweep read it.
  - {path: /usr/local/bin/host-maintenance.sh}
  - {path: /etc/healthchecks/ping.env, when: "inventory_hostname != 'daniel-box'"}
  - {path: /etc/healthchecks, when: "inventory_hostname != 'daniel-box'"}
