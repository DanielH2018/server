---
# When the daily Docker image prune runs, in the host's clock (UTC on every host). A variable
# rather than a literal in `units/homelab-docker-prune.timer.j2`, so that the healthchecks.io
# deadman-cadences fragment reads the schedule from the same place the timer does (#2806). Only
# `has_docker` hosts ship the timer.
initial_setup_docker_prune_cron_minute: 30
initial_setup_docker_prune_cron_hour: 6
