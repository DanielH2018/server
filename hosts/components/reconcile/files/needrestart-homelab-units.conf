# Shipped by every host package's reconcile component. needrestart evals this file as perl from
# apt's DPkg::Post-Invoke hook, after every package install, and restarts each service whose
# process maps a replaced file. A homelab-tools upgrade replaces every binary under
# /usr/lib/homelab/bin, so without this it restarts units reconcile is told never to touch:
# a unit with a policy (manual, windowed) and any instance of a template unit, each a job in
# flight such as a landing, a triage run or an alert. On 2026-11-15 it killed
# renovate-agent-land@8828 mid-landing (#8854). Both kinds are read from the installed package's
# manifest, so a unit that gains a policy is exempt from its next install on. A manifest that will
# not read leaves needrestart's own list as it was.
use JSON::PP ();
eval {
    open(my $fh, '<', '/usr/lib/homelab/manifest.json') or die;
    local $/;
    my $units = JSON::PP::decode_json(<$fh>)->{units} || {};
    for my $unit (keys %$units) {
        if ($unit =~ /^(.+)\@\.service$/) {
            $nrconf{override_rc}{qr(^\Q$1\E\@.+\.service$)} = 0;
        } elsif (ref $units->{$unit} eq 'HASH' && $units->{$unit}{policy}) {
            $nrconf{override_rc}{qr(^\Q$unit\E$)} = 0;
        }
    }
};
