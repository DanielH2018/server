# The deploy UI daemon on daniel-box, the host half of deploy.local. CLAUDE.md beside this file
# holds the rules.
files:
  - {src: files/deploy_ui.py, dst: /usr/lib/homelab/deploy-ui/deploy_ui.py, activate: "try-restart:deploy-ui.service"}
  - {src: files/deploy_ui.html, dst: /usr/lib/homelab/deploy-ui/deploy_ui.html}
  - {src: files/deploy_ui_lib/deploy_ui_reads.py, dst: /usr/lib/homelab/deploy-ui/deploy_ui_lib/deploy_ui_reads.py, activate: "try-restart:deploy-ui.service"}
  - {src: files/deploy_ui_lib/deploy_ui_writes.py, dst: /usr/lib/homelab/deploy-ui/deploy_ui_lib/deploy_ui_writes.py, activate: "try-restart:deploy-ui.service"}
  - {src: files/deploy_ui_lib/deploy_ui_games.py, dst: /usr/lib/homelab/deploy-ui/deploy_ui_lib/deploy_ui_games.py, activate: "try-restart:deploy-ui.service"}
  - {src: files/deploy_ui_lib/deploy_ui_game_control.py, dst: /usr/lib/homelab/deploy-ui/deploy_ui_lib/deploy_ui_game_control.py, activate: "try-restart:deploy-ui.service"}
  - {lib: host_lib.py, dst: /usr/lib/homelab/deploy-ui/host_lib.py, activate: "try-restart:deploy-ui.service"}
  - {lib: ci_verdict.py, dst: /usr/lib/homelab/deploy-ui/ci_verdict.py, activate: "try-restart:deploy-ui.service"}
  - {src: templates/deploy-ui.service.j2, dst: /usr/lib/systemd/system/deploy-ui.service}
  - {src: templates/games.json.j2, dst: /usr/lib/homelab/deploy-ui/games.json, activate: "try-restart:deploy-ui.service"}
# The unit imports it with ImportCredential=; it never reaches ~/.kube/config.
credentials:
  - games_panel_token
enable:
  deploy-ui.service: multi-user.target
# No authentication, so the port admits the cluster only: the pod CIDR and both node IPs (flannel
# masquerades).
# Never lan_subnet, which would put the land button in front of Authelia rather than behind it.
ufw:
  rules:
    - {id: deploy-ui-pods, spec: "allow from {{ k3s_pod_cidr }} to any port {{ deploy_ui_port }} proto tcp"}
    - {id: deploy-ui-daniel-box, spec: "allow from {{ server_ip }} to any port {{ deploy_ui_port }} proto tcp"}
    - {id: deploy-ui-daniel-server, spec: "allow from {{ hosts['daniel-server'].server_ip }} to any port {{ deploy_ui_port }} proto tcp"}
  # The legacy rules carry the live rules' comment; the arm relabels each live rule in place.
  legacy:
    - {spec: "allow from {{ k3s_pod_cidr }} to any port {{ deploy_ui_port }} proto tcp", comment: deploy-ui from the k3s cluster, replaced_by: deploy-ui-pods}
    - {spec: "allow from {{ server_ip }} to any port {{ deploy_ui_port }} proto tcp", comment: deploy-ui from the k3s cluster, replaced_by: deploy-ui-daniel-box}
    - {spec: "allow from {{ hosts['daniel-server'].server_ip }} to any port {{ deploy_ui_port }} proto tcp", comment: deploy-ui from the k3s cluster, replaced_by: deploy-ui-daniel-server}
