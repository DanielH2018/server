# Lets `systemctl restart watchdog.service` finish. The packaged unit ends every stop as a
# failure on purpose (`ExecStopPost=... || false`), so that `OnFailure=wd_keepalive.service` keeps
# the hardware watchdog fed while the daemon is down. wd_keepalive.service conflicts with
# watchdog.service, and under the default OnFailureJobMode=replace its start cancels the start half
# of a restart: the caller reads "Job for watchdog.service canceled", and the daemon stays down
# behind a running wd_keepalive. needrestart restarts the daemon after a library upgrade, the
# watchdog package's postinst restarts it on its own upgrade, and reconcile restarts it when this
# file changes.
#
# `fail` refuses the wd_keepalive start only while a job for watchdog.service is queued, which is
# the restart. A plain stop and a daemon that died queue none, so both still hand the device to
# wd_keepalive. docs/pi-host-tuning-record.md has the 2026-11-13 stop that measured this.
[Unit]
OnFailureJobMode=fail
