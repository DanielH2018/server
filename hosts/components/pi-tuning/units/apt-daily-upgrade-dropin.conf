# Shipped by homelab-daniel-pi (the pi-tuning component). Syncs the /var/log tmpfs to the card
# before every unattended upgrade run: a reset during the run restores the tmpfs from the last
# sync, which is otherwise log2ram-daily's 23:55 write. The `-` lets the upgrade run even when the
# sync fails.
[Service]
ExecStartPre=-/usr/bin/systemctl reload log2ram.service
