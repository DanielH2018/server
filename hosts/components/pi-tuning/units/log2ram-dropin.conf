# Runs the homelab copy of log2ram, which drops `--sparse` from both rsync syncs (component.yml
# has the DECIDED marker). The log2ram package owns /usr/local/bin/log2ram, so the patched script
# lives at /usr/lib/homelab/log2ram. log2ram-daily.service reloads this unit, so one drop-in
# covers the daily write too. The empty assignments clear the packaged commands.
[Service]
ExecStart=
ExecStart=/usr/lib/homelab/log2ram start
ExecStop=
ExecStop=/usr/lib/homelab/log2ram stop
ExecReload=
ExecReload=/usr/lib/homelab/log2ram write
