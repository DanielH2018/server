# earlyoom kills the largest process before the hardware watchdog reboots the Pi at load 24.
# This drop-in replaces the Ansible edit of /etc/default/earlyoom: EnvironmentFile= clears the
# packaged file, and EARLYOOM_ARGS carries the arguments.
#
# THE SWAP CONDITION IS DELIBERATELY NON-BINDING. earlyoom acts only when BOTH memory and swap are
# below their minimums, and this host has 1.37 GB of combined swap (350 MB zram at priority 100
# and a 1 GB SD-card swapfile at -2). A `-s 10` guard therefore fires only after hours of SD-card
# thrashing. Measured over four hours: available memory never left 30-34 percent and free swap
# never left 77-79 percent. `-s 100,100` makes both swap thresholds always true, so the memory
# condition alone decides. `-m 10` still means 45 MB of 456 MB available, against the 137-156 MB
# the box sits at, so it fires only in genuine exhaustion. Do not shrink the zram device to buy
# headroom: it compresses 4.61:1.
#
# dbus-daemon joins --avoid because Docker's cgroup driver is systemd: runc asks systemd over
# dbus to create a scope for every container start, and killing dbus-daemon would leave nothing
# able to start a container until reboot.
[Service]
EnvironmentFile=
Environment="EARLYOOM_ARGS=-m 10 -s 100,100 -r 3600 --avoid '(^|/)(systemd|systemd-.*|init|sshd|dbus-daemon|dbus-broker|dockerd|containerd|containerd-shim.*|watchdog)$'"
