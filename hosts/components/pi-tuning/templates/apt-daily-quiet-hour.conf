# Shipped by homelab-daniel-pi (the pi-tuning component). Ubuntu's timer fires twice a day at any
# hour, and a firing runs `apt-get -d dist-upgrade` for four minutes at 57 MB RSS on a 456 MB host
# that keeps 10-25 MB free (memory PSI full avg10 45%, an RCU stall in the journal). 04:20 UTC is
# the one window nothing else here uses, and update runs before upgrade. The empty `OnCalendar=`
# clears the packaged schedule; without it systemd keeps both.
[Timer]
OnCalendar=
OnCalendar=*-*-* 04:20
RandomizedDelaySec=10min
