# Shipped by homelab-daniel-pi (the pi-tuning component). needrestart runs from apt's
# DPkg::Post-Invoke hook, inside the dpkg lock, after every package install. Its kernel check
# decompresses each kernel image under /boot to read its version: four `vmlinuz-get-version` runs
# took 23-124 s of every needrestart run on this host, 50-80% of it, and the disk reads queue
# behind the SD card while the containers swap (#8610). The weekly reboot boots a new kernel
# anyway, so the hint adds nothing. Service restarts after a library upgrade stay on: the
# watchdog drop-in relies on them.
$nrconf{kernelhints} = 0;
