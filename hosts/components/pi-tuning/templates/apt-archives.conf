// Shipped by homelab-daniel-pi (the pi-tuning component). apt-get keeps every deb it installs
// under /var/cache/apt/archives, on the SD card. The weekly autoclean removes none of them
// while the homelab index still lists the version, and the index lists every version the pool
// holds: the cache held 475 MB of homelab-tools debs on 2026-11-15 (#8883).
APT::Keep-Downloaded-Packages "false";
// `apt-get clean` once a day, from apt-daily-upgrade after the unattended upgrade. It removes
// what a failed install or an unattended upgrade left behind.
APT::Periodic::CleanInterval "1";
