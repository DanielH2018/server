# Shipped by homelab-daniel-pi (the pi-tuning component) - edits here are overwritten.
# /var/log is a 128 MB log2ram tmpfs (= RAM); the 1G default would overflow it.
# SystemMaxFiles bounds the SD copy, where each archive is written at its full size.
#
# 32 archives x SystemMaxFileSize 1 MiB = 32 MiB, plus the two active files. log2ram refuses to
# start when the whole SD copy reaches 128 MB (#4583), and pacct alone holds about 62 MB of it:
# about 28 MB a day, with pacct.0 left uncompressed. At 2 MiB files the sum passed 128 MB, and
# the 2026-11-12 reset left /var/log on the card (#8234). Every rotation writes a full-size
# archive whatever it holds, so the cap is small files rather than few: the Pi made about 4
# archives a day on 2026-11-12 and 11-13, and an archive held about 270 KB. Applying this cap
# does not bring a log2ram that already refused to start back up: reboot the Pi by hand after
# the install.
[Journal]
SystemMaxUse=32M
SystemMaxFileSize=1M
SystemMaxFiles=32
