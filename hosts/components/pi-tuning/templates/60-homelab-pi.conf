# Shipped by homelab-daniel-pi (the pi-tuning component) - edits here are overwritten.
# /var/log is a 128 MB log2ram tmpfs (= RAM); the 1G default would overflow it.
# SystemMaxFiles bounds the SD copy, where each archive is written at its full size.
#
# 16 archives x SystemMaxFileSize 2 MiB = 32 MiB, plus the two active files. log2ram refuses to
# start when the whole SD copy reaches 128 MB (#4583), and pacct alone holds about 62 MB of it:
# about 28 MB a day, with pacct.0 left uncompressed. At 32 archives the sum passed 128 MB, and the
# 2026-11-12 reset left /var/log on the card (#8234). log2ram's daily `journalctl --rotate`
# archives the system and user journals, so 16 archives hold about 8 days. Applying this cap
# does not bring a log2ram that already refused to start back up: reboot the Pi by hand after
# the install.
[Journal]
SystemMaxUse=32M
SystemMaxFileSize=2M
SystemMaxFiles=16
