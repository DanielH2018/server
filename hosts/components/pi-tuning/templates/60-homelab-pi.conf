# Shipped by homelab-daniel-pi (the pi-tuning component) - edits here are overwritten.
# /var/log is a 128 MB log2ram tmpfs (= RAM); the 1G default would overflow it.
# SystemMaxFiles bounds the SD copy, where each archive is written at its full size.
#
# 32 files x SystemMaxFileSize 2 MiB = 64 MiB worst case, half the tmpfs (#4583). The other half
# holds auditd's 12 MB ceiling, three pacct generations and two days of sysstat. A day's system
# journal held 786 entries in an 8 MiB archive, so 2 MiB still holds a day, and the 30 archives
# left are about 15 days. Applying this cap does not bring a log2ram that already refused to
# start back up: reboot the Pi by hand after the install.
[Journal]
SystemMaxUse=32M
SystemMaxFileSize=2M
SystemMaxFiles=32
