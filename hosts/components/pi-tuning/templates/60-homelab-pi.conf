# Shipped by homelab-daniel-pi (the pi-tuning component) - edits here are overwritten.
# /var/log is a 128 MB log2ram tmpfs (= RAM); the 1G default would overflow it.
# SystemMaxFiles bounds the SD copy, where each archive is written at its full size.
#
# 40 archives x SystemMaxFileSize 1 MiB = 40 MiB, plus the two active files. log2ram refuses to
# start when the whole SD copy reaches 128 MB, and pacct alone holds about 62 MB of it:
# about 28 MB a day, with pacct.0 left uncompressed. At 2 MiB files the sum passes 128 MB, and
# a reset then leaves /var/log on the card. Every rotation writes a full-size
# archive whatever it holds, so the cap is small files rather than few: the Pi makes about 5
# archives a day, one per log2ram write and more per boot, and an archive holds about 270 KB. Applying this cap
# does not bring a log2ram that already refused to start back up: reboot the Pi by hand after
# the install. A smaller SystemMaxFileSize leaves the archives already written at their old
# size, so vacuum them once by hand (docs/pi-host-tuning-record.md).
[Journal]
SystemMaxUse=40M
SystemMaxFileSize=1M
SystemMaxFiles=40
