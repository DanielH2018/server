# Shipped by homelab-daniel-pi (the pi-tuning component). acct's stanza rotates pacct by `size`,
# which logrotate checks only when it runs, so an hourly run holds pacct near its cap. A `daily`
# stanza still rotates once a day, by its date in the state file. The empty `OnCalendar=` clears
# the packaged daily schedule, and the packaged RandomizedDelaySec=1h would stretch a gap between
# two runs to nearly two hours.
[Timer]
OnCalendar=
OnCalendar=hourly
RandomizedDelaySec=5min
