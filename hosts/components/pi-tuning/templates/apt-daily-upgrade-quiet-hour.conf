# Shipped by homelab-daniel-pi (the pi-tuning component). Ubuntu's timer fires at 06:00 plus up to
# an hour, and a firing runs the dist-upgrade half on a 456 MB host that keeps 10-25 MB free.
# 05:20 UTC follows apt-daily's 04:20, so update still runs before upgrade. The empty
# `OnCalendar=` clears the packaged schedule; without it systemd keeps both.
[Timer]
OnCalendar=
OnCalendar=*-*-* 05:20
RandomizedDelaySec=10min
