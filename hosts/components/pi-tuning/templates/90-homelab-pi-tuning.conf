# Order-3 GFP_ATOMIC allocations in the USB Ethernet receive path (rx_submit -> __alloc_skb)
# fail under fragmentation on this 452 MiB host. The kernel auto-sizes the reserve to 2480 KiB;
# 8192 KiB (8 MiB) gives them headroom. A larger value would push the working set into swap.
vm.min_free_kbytes=8192
vm.swappiness=130
vm.page-cluster=0
