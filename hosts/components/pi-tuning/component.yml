# The Pi's hardware and memory tuning. Only daniel-pi lists it. docs/pi-host-tuning-record.md has
# the measurements behind every number here.
#
# Owners, from `dpkg -S` and `dpkg-query -W -f='${Conffiles}'` on the live Pi. Each path takes the
# mechanism its owner allows:
#
# - conffiles, so the line arm: /etc/default/zramswap (zram-tools),
#   /etc/watchdog.conf (watchdog), /etc/log2ram.conf (log2ram), /etc/sysstat/sysstat (sysstat),
#   /etc/default/acct (acct), /etc/audit/auditd.conf (auditd);
# - unowned, so the line arm: /boot/firmware/config.txt, /etc/locale.gen (written by locales'
#   postinst) and /etc/hosts (the latter is in pi-resolver);
# - owned and not a conffile: /usr/local/bin/log2ram (log2ram). It takes the homelab copy below.
#   No path needs a divert.
# - /etc/default/earlyoom (earlyoom, a conffile) becomes a drop-in for earlyoom.service that
#   clears EnvironmentFile= and sets EARLYOOM_ARGS.
#
# Older lines stay in the files as harmless duplicates: the line arm adopts each line by its
# regexp, and the arm never removes one.
#
# Activation. zram, Log2Ram, the watchdog and the GPU split take effect at boot, so each of those
# files declares `reboot`; the weekly reboot applies them. The watchdog reads its file on start,
# so `reboot` also covers a watchdog restart. Nothing here restarts
# log2ram.service or zramswap.service live: a Log2Ram restart unmounts /var/log under whatever is
# writing to it, and a zram restart swapoffs onto the SD swapfile and half-fails (see
# docs/pi-host-tuning-record.md). log2ram.service carries `policy: manual` for that reason.
#
# What the package does not carry, and why:
#
# - The package installs zram-tools, watchdog and earlyoom through `depends:`. It cannot depend
#   on log2ram: Azlux's apt source arrives in the same package (apt-azlux), so a rebuilt Pi
#   could not resolve the dependency on first install. Step 5 of hosts/bootstrap-host.sh installs
#   the log2ram package after this one, under --force-confnew, because reconcile may already have
#   written the four lines below to /etc/log2ram.conf. log2ram mounts at the next boot.
# - The debloat purge (Open vSwitch, snapd, fwupd, appstream) and rsyslog's and wpa_supplicant's
#   mask are one-time state. They persist on the live Pi, and step 4 of hosts/bootstrap-host.sh
#   carries them for a rebuild. Step 4 also removes rsyslog's text logs, and step 7 removes the
#   report aideinit leaves at /var/log/aide/aide.log. Audit rotations need no step, because
#   auditd's cap below is in place before a rebuilt Pi has any to spare.
# - An apt preferences pin for log2ram. A pin that blocks the upgrade either names the installed
#   version, so it moves the package on the next apt run once the two drift, or blocks every
#   version, which refuses bootstrap's install. The hold unit below holds it instead.
# - A check that log2ram.conf's JOURNALD_AWARE lines agree: a test in
#   hosts/lib/tests/test_pi_tuning_component.py keeps the packaged log2ram copy honest instead.
depends:
  - zram-tools
  - watchdog
  - earlyoom
  - locales
units:
  log2ram.service: {policy: manual}
enable:
  # DECIDED: log2ram stays held, and lifts only for a planned upgrade that ends in a reboot. The
  # package's prerm unmounts /var/log on upgrade and its postinst waits for a reboot, so an
  # unplanned upgrade leaves every log write on the SD card until the weekly reboot.
  # docs/pi-host-tuning-record.md has the planned-upgrade steps.
  homelab-log2ram-hold.service: multi-user.target
files:
  # DECIDED: the patched copy drops `--sparse`, never `--inplace` and never USE_RSYNC=false.
  # Log2Ram ships both syncs as `rsync -aXv --sparse --inplace --no-whole-file
  # --delete-after`, and that pair corrupts files whose content ends in NUL bytes: `--sparse`
  # seeks over a run of NULs in the source, and `--inplace` makes the destination the live file,
  # so whatever the previous file left at those offsets survives. Rotated .gz files then fail
  # `gzip -t` while their CRC32 matches, because the gzip ISIZE field's trailing NULs carry stale
  # bytes. Dropping `--sparse`
  # alone made the transfer byte-identical under rsync 3.2.7, the Pi's version. Dropping
  # `--inplace` instead writes a full temp copy of /var/log on every sync. USE_RSYNC=false takes
  # the `cp -rfup --sparse=always` fallback, which has no `--delete`, so files deleted from the
  # tmpfs would return at boot into the 128 MB /var/log. The cost this choice carries: every hole
  # in a journald archive lands on the SD card as real zeros, which 60-homelab-pi.conf bounds
  # with SystemMaxFiles=. Log2Ram 1.7.2 is the installed version. The script stays at
  # /usr/lib/homelab/log2ram because the log2ram package owns /usr/local/bin/log2ram, and a
  # package shipping an owned path makes dpkg refuse the unpack. vendor/log2ram-1.7.2 is the
  # upstream script; test_pi_tuning_component.py holds the difference between the two to the two
  # `--sparse` words. An `apt upgrade` of log2ram rewrites the upstream copy and not this one, so
  # a new upstream version needs a new vendored file and a re-diff.
  # The SOPS export. The Pi's other dotfiles stay as it holds them; a rebuilt Pi gets Ubuntu's
  # own ~/.bashrc and no ~/.gitconfig.
  - {src: templates/homelab-profile.sh, dst: /etc/profile.d/homelab.sh}
  - {src: templates/log2ram, dst: /usr/lib/homelab/log2ram, mode: "0755"}
  - {src: units/homelab-log2ram-hold.service, dst: /usr/lib/systemd/system/homelab-log2ram-hold.service}
  - {src: units/log2ram-dropin.conf, dst: /usr/lib/systemd/system/log2ram.service.d/50-homelab.conf}
  - {src: units/earlyoom-dropin.conf, dst: /usr/lib/systemd/system/earlyoom.service.d/50-homelab.conf}
  # Without it a restart of the watchdog daemon leaves the daemon stopped; the file has the reason.
  - {src: units/watchdog-dropin.conf, dst: /usr/lib/systemd/system/watchdog.service.d/50-homelab.conf}
  # Journald's cap for the 128 MB log2ram tmpfs. 60- sorts after host-tuning's 50-homelab.conf, so
  # this wins where the two disagree.
  - {src: templates/60-homelab-pi.conf, dst: /etc/systemd/journald.conf.d/60-homelab-pi.conf, activate: "try-restart:systemd-journald.service"}
  # The apt timers, pinned to the quiet hour. Managed drop-ins, so reconcile restarts a timer when
  # its drop-in changes and leaves a masked one alone. The older copies under
  # /etc/systemd/system/<timer>.d/quiet-hour.conf hold the same schedule and stay as harmless
  # duplicates: `quiet-hour.conf` sorts after `50-homelab.conf`, so a change here loses to them
  # until the operator removes those files by hand.
  - {src: templates/apt-daily-quiet-hour.conf, dst: /usr/lib/systemd/system/apt-daily.timer.d/50-homelab.conf}
  - {src: templates/apt-daily-upgrade-quiet-hour.conf, dst: /usr/lib/systemd/system/apt-daily-upgrade.timer.d/50-homelab.conf}
  # needrestart without its kernel check, which held apt's lock for up to two minutes after every
  # install. needrestart reads conf.d on every run, so no activation is needed.
  - {src: templates/needrestart-homelab.conf, dst: /etc/needrestart/conf.d/50-homelab.conf}
  # apt deletes each deb once it is installed, and the daily apt run empties the archive cache
  # apt rereads its config on every run, so no activation is needed.
  - {src: templates/apt-archives.conf, dst: /etc/apt/apt.conf.d/60homelab-pi-archives}
  # vm.swappiness above 100 is valid on kernel 5.8 and later: it tells reclaim that compressing an
  # idle anonymous page is cheaper than re-reading a hot file page from the SD card. The cluster
  # nodes run 10 for the opposite reason. vm.page-cluster=0 disables swap readahead, which wastes
  # decompression on zram.
  - {src: templates/90-homelab-pi-tuning.conf, dst: /etc/sysctl.d/90-homelab-pi-tuning.conf, activate: sysctl}
lines:
  # The GPU split and the watchdog dtparam. Bookworm moved the file to /boot/firmware; the Pi runs
  # Ubuntu 24.04, which has no /boot/config.txt.
  - {path: /boot/firmware/config.txt, line: "gpu_mem=16", regexp: '^gpu_mem=', activate: reboot}
  - {path: /boot/firmware/config.txt, line: "dtparam=watchdog=on", regexp: '^dtparam=watchdog=', activate: reboot}
  # zram. PERCENT is the device's uncompressed capacity, not its RAM cost (about 4.6:1).
  - {path: /etc/default/zramswap, line: "PERCENT=100", regexp: '^PERCENT=', activate: reboot}
  - {path: /etc/default/zramswap, line: "ALGO=zstd", regexp: '^#?ALGO=', activate: reboot}
  # Log2Ram's four declared values. The installed conffile already holds them, so the first run
  # writes nothing. The `^#?` anchor matters: an unanchored `SIZE=` also matches LOG_DISK_SIZE=.
  - {path: /etc/log2ram.conf, line: "SIZE=128M", regexp: '^#?SIZE=', activate: reboot}
  - {path: /etc/log2ram.conf, line: "ZL2R=false", regexp: '^#?ZL2R=', activate: reboot}
  - {path: /etc/log2ram.conf, line: "LOG_DISK_SIZE=256M", regexp: '^#?LOG_DISK_SIZE=', activate: reboot}
  - {path: /etc/log2ram.conf, line: "COMP_ALG=lz4", regexp: '^#?COMP_ALG=', activate: reboot}
  # en_US.UTF-8, the locale the other hosts generate. An operator's ssh client sends
  # LC_ALL=en_US.UTF-8 and sshd accepts LC_*, so without it every login warns from setlocale.
  # The anchor matches only the UTF-8 line, not `# en_US ISO-8859-1` or `# en_US.ISO-8859-15`.
  - {path: /etc/locale.gen, line: "en_US.UTF-8 UTF-8", regexp: '^#?\s*en_US\.UTF-8 UTF-8\s*$', activate: locale-gen}
  # The hardware watchdog.
  - {path: /etc/watchdog.conf, line: "watchdog-device = /dev/watchdog", regexp: '^#?watchdog-device', activate: reboot}
  - {path: /etc/watchdog.conf, line: "max-load-1 = 24", regexp: '^#?max-load-1\s=', activate: reboot}
  # The three server-sized defaults in the log2ram tmpfs: a cap, never a disable. docs/security-tools.md
  # gives `sar`, `lastcomm` and `ausearch` their own triage rows.
  - {path: /etc/sysstat/sysstat, line: "HISTORY=2", regexp: '^#?HISTORY='}
  - {path: /etc/default/acct, line: 'ACCT_LOGGING="3"', regexp: '^#?ACCT_LOGGING='}
  # 4 MB x (1 live + 2 rotated) is a 12 MB ceiling, down from 40 MB. auditd reports CanReload=no,
  # so the action is a restart.
  - {path: /etc/audit/auditd.conf, line: "max_log_file = 4", regexp: '^max_log_file\s*=', activate: "try-restart:auditd.service"}
  - {path: /etc/audit/auditd.conf, line: "num_logs = 3", regexp: '^num_logs\s*=', activate: "try-restart:auditd.service"}
  # auditd's free-space thresholds, in MB of the 128 MB tmpfs. The packaged 75 and 50 are sized
  # for a disk: the tmpfs has under 73 MB free and can fall to 13 MB,
  # and a write below admin_space_left under the packaged SUSPEND stops all logging until auditd
  # restarts. ROTATE drops the oldest log file instead. auditd refuses to start unless
  # admin_space_left is the smaller of the two. docs/pi-host-tuning-record.md has the measurement.
  - {path: /etc/audit/auditd.conf, line: "space_left = 10", regexp: '^space_left\s*=', activate: "try-restart:auditd.service"}
  - {path: /etc/audit/auditd.conf, line: "admin_space_left = 5", regexp: '^admin_space_left\s*=', activate: "try-restart:auditd.service"}
  - {path: /etc/audit/auditd.conf, line: "admin_space_left_action = ROTATE", regexp: '^admin_space_left_action\s*=', activate: "try-restart:auditd.service"}
  # update-notifier's two apt hooks run apt-check, which loads the whole apt cache into memory on
  # this 456 MB host inside every apt transaction. ubuntu-server depends on
  # update-notifier-common, so the package stays and its conffile loses both hooks. The motd's update count goes stale as a result,
  # and after 7 days the login motd says the list is more than a week old. apt rereads its config
  # on every run, so no activation is needed.
  - {path: /etc/apt/apt.conf.d/99update-notifier, line: "// DPkg::Post-Invoke hook removed by homelab-daniel-pi: it ran apt-check", regexp: '^\s*(//\s*)?DPkg::Post-Invoke\b'}
  - {path: /etc/apt/apt.conf.d/99update-notifier, line: "// APT::Update::Post-Invoke-Success hook removed by homelab-daniel-pi: it ran apt-check", regexp: '^\s*(//\s*)?APT::Update::Post-Invoke-Success\b'}
