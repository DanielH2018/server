# The builder's and the signer's directories under the state directories that systemd creates
# (StateDirectory= on each unit). The signer must traverse the builder's 0711 directory to reach
# staged/, as http.server must traverse the signer's to reach repo/. An existing directory keeps its
# contents, and the modes below are the ones the Ansible role set.
#Type Path                          Mode User            Group           Age
d /var/lib/homelab-builder          0711 homelab-builder homelab-builder -
d /var/lib/homelab-builder/src      0700 homelab-builder homelab-builder -
d /var/lib/homelab-builder/uv-cache 0700 homelab-builder homelab-builder -
# The builder writes here and the signer empties it, so it is the one shared directory.
d /var/lib/homelab-builder/staged   2770 homelab-builder homelab-signer  -
d /var/lib/homelab-signer           0711 homelab-signer  homelab-signer  -
d /var/lib/homelab-signer/gnupg     0700 homelab-signer  homelab-signer  -
d /var/lib/homelab-signer/repo      0755 homelab-signer  homelab-signer  -
# Holds config.env and archive-key.fpr, both world-readable now that no secret is in either.
d /etc/homelab-builder              0755 root            root            -
