# The SSH rules and the enable of ufw. Reconcile's ufw arm sets the default policies, adds the
# two SSH rules and enables an inactive ufw once a package declares these rules: it sets `deny incoming` and `allow outgoing` only where they differ, and it
# enables an inactive ufw only once both keep rules are present (`REQUIRED_KEEP` in
# hosts/lib/reconcile_lib/ufw.py names these two ids).
#
# DECIDED: the LAN is exempt from SSH rate-limiting, and `lan-ssh` must sort ABOVE `ssh-limit`.
# ufw takes the first matching rule, so an allow below the limit rule does nothing. The arm checks
# the `before:` relation and fails the run, holding the host, rather than deleting a keep rule to
# repair it.
#
# WHY THE EXEMPTION. `limit` REJECTs a source IP that opens 6 connections in 30 seconds, on a
# rolling window, so sustained retries hold the block open instead of riding it out. Several Claude
# sessions reach the hosts over ssh at once. Together they cross the threshold, every session reads
# the "Connection refused" as sshd being down, and their retry loops feed the same counter, so the
# block never lifts until 90 seconds of silence let a connection through. The staging gate reaches daniel-stage through an ssh hop to daniel-server, so a
# self-inflicted block surfaces as NO VERDICT on every commit.
#
# WHAT IT COSTS. Little. fail2ban's sshd jail, which bans on auth FAILURES rather than connection
# count, still covers the LAN. Non-LAN sources keep the limiter, WireGuard peers included, whose
# source is the wg subnet rather than lan_subnet.
#
# Both rules are `keep`: no revert and no floor ever deletes them, so a revert leaves SSH reachable.
# Removing one is the operator's, at the host's console.
#
# Each spec is what `ufw show added` prints for the rule, from ufw 0.36.2-6's own parser:
# `port: ssh` prints as `22`. The live rules carry no comment, so the arm
# adopts each by appending it again, which relabels it in place. The legacy entries name each
# older rule by its exact spec and comment. The first two share a declared spec, so the arm
# never deletes them; `allow 22/tcp` is the plain allow initial_setup removed on every apply.
ufw:
  rules:
    - {id: lan-ssh, spec: "allow from {{ lan_subnet }} to any port 22 proto tcp", keep: true, position: first, before: ssh-limit}
    - {id: ssh-limit, spec: "limit 22/tcp", keep: true}
  legacy:
    - {spec: "allow from {{ lan_subnet }} to any port 22 proto tcp", comment: "", replaced_by: lan-ssh}
    - {spec: "limit 22/tcp", comment: "", replaced_by: ssh-limit}
    - {spec: "allow 22/tcp", comment: "", replaced_by: ssh-limit}
