# The k3s server's same-path files (H6.4a, docs/target-architecture/host/h6-k3s-suc.md,
# *Flags move from the unit to a package drop-in*). Ansible's tasks/server.yml wrote each one
# until H6.4a deleted its task, so dpkg takes over the path on the first install. Since H6.4b
# the component also carries the server's flags: `k3s_server_config` below, rendered into
# config.yaml.d, and the `ExecStart` lines of 50-homelab.conf. Reverting H6.4b alone is safe:
# dpkg removes the config drop-in and the `ExecStart` lines, and the installer's unit still
# carries every flag.
#
# The package ships the files and applies nothing. Each file k3s reads at startup carries
# `activate: manual:k3s.service`, which puts it in the hash homelab-k3s-restart takes
# (hosts/components/k3s-restart). The first window after an install that changes the hash
# therefore restarts k3s once, behind the gates, and the host package marks k3s.service
# `windowed` so reconcile never restarts it. A path k3s does not read at startup (logrotate,
# tmpfiles.d, the CoreDNS marker) carries no k3s activation; the renderer gives the tmpfiles.d
# file the `tmpfiles` action, which never touches k3s.
#
# FORWARD-ONLY. A file here is named by a k3s flag (`audit-policy-file`, `authentication-config`)
# or read at startup, and a missing authentication config wedges the API server on its next
# start. Reverting the PR that added a file deletes it. Return a file to Ansible with the
# attended procedure in the H6 plan's *Rollback*.
#
# The rest of the server's host half (H7.35, docs/target-architecture/host/h7-delete-ansible.md):
# Longhorn's packages and multipath drop-in, the read-only kubeconfig, the inotify key, the join
# rules and the address pin. k3s-agent renders this component's defaults and the pin's
# template through `component: k3s-server`. `k3s-host-dns` holds the resolver.
#
# DECIDED: the wifi fallback reaches /etc/netplan through a copy, never an output's symlink.
# `netplan generate` fails on a dangling link in that directory, so a missing SOPS key would take
# every link down at the next boot. `homelab-netplan-wifi` installs the rendered file only after it
# passes the generator, and leaves the old file otherwise. The copy has no owner in dpkg, so
# emptying `k3s_node_wifi_link` is the way back: the next package retires both copies.
#
# Both netplan files carry `manual:systemd-networkd.service`: `netplan apply` reconfigures the link
# an SSH session rides on, so a change goes live at the next boot.
#
# FORWARD-ONLY for the address pin as well. Reverting the PR that added it deletes the file, and a
# server that boots while the gateway's DHCP is down cannot bind server_ip (#3882). A revert
# therefore owes `k3s-bringup.yml --tags node-address` on daniel-box before the next reboot
# (operator-only); the revert restores that task file's import.
#
# ENFORCED: hosts/tests/test_k3s_server_component.py and
# hosts/lib/tests/test_box_k3s_host_half.py.
depends:
  - open-iscsi
  - nfs-common
  - multipath-tools
  - zsh
defaults:
  # The log file k3s writes. The k3s-agent component carries the same path, because Alloy tails
  # one literal on every node; ansible/tests/k8s/test_alloy_ships_k3s_log.py holds all three equal.
  k3s_log_file: /var/log/k3s.log
  # The two paths `kube-apiserver-arg` names below, shipped at the literal paths under `files:`
  # (a `dst:` is not rendered). The shipped-paths test holds each flag value to a shipped file.
  k3s_audit_policy_path: /var/lib/rancher/k3s/server/audit.yaml
  k3s_authentication_config_path: /var/lib/rancher/k3s/server/authentication-config.yaml
  # Audit log rotation, and it is not optional. An unrotated audit log grows without bound on
  # the disk `disk-health.sh` watches. A Metadata-level policy on a cluster this chatty writes a
  # steady stream of entries, so the apiserver's own rotation keeps the control-plane disk from
  # filling. 5 x 100 MiB bounds the log at about 500 MiB. Only the flags below read these.
  k3s_audit_log_maxage: 30       # days a rotated file is kept
  k3s_audit_log_maxbackup: 5     # rotated files kept
  k3s_audit_log_maxsize: 100     # MiB before rotating
  # The audit flags, armed by `k3s_audit_log_enabled` in group_vars/all.yml. loki-homelab reads
  # the same switch and `k3s_audit_log_path` to tail the file, so neither moves here.
  k3s_server_audit_args:
    - "audit-policy-file={{ k3s_audit_policy_path }}"
    - "audit-log-path={{ k3s_audit_log_path }}"
    - "audit-log-maxage={{ k3s_audit_log_maxage }}"
    - "audit-log-maxbackup={{ k3s_audit_log_maxbackup }}"
    - "audit-log-maxsize={{ k3s_audit_log_maxsize }}"
  # The k3s server's flags (H6.4b). templates/50-homelab.yaml.j2 renders this mapping as
  # /etc/rancher/k3s/config.yaml.d/50-homelab.yaml, and 50-homelab.conf runs a bare
  # `k3s server`, so this mapping is the server's whole configuration. A key is a flag name
  # without `--`, and a list is a repeated flag. A key whose value is `false` is left out of the
  # file. A change here changes the restart hash, so the next window restarts k3s once.
  #
  #   cluster-init       embedded etcd from day one. Not a one-way door (k3s converts
  #                      SQLite->etcd on restart with this flag), but it saves a control-plane
  #                      restart if a third node is ever added.
  #   disable            traefik: the bundled Traefik cannot carry the real config (the CrowdSec
  #                      Yaegi plugin, Authelia forwardauth, the raw-TCP Terraria entrypoint,
  #                      Cloudflare trustedIPs). servicelb: klipper-lb fights MetalLB for
  #                      LoadBalancer Services. local-storage: the bundled local-path
  #                      provisioner ships a SECOND default StorageClass next to longhorn. With
  #                      two defaults an unclassed PVC's placement depends on the k8s version,
  #                      and local-path data is node-local and has no backup. A kubectl patch
  #                      that un-defaults it does not stick, because k3s reapplies its bundled
  #                      manifests on every restart, so the addon is disabled outright.
  #   node-ip,           pin the node's identity to the host's canonical address instead of
  #   advertise-address  letting k3s autodetect it. A multi-homed host with equal-metric default
  #                      routes lets k3s pick a removable NIC (daniel-box's USB adapter). When
  #                      that NIC vanishes the node IP stops existing: kubelet fails "validate
  #                      nodeIP: node IP ... not found in the host's network interfaces", and
  #                      the kubernetes Service endpoint still points at the dead address, so
  #                      every pod gets "no route to host" dialling 10.43.0.1 and Longhorn
  #                      cannot provision a single volume.
  #
  #                      CHANGING THIS ON A LIVE CLUSTER IS NOT A RESTART. etcd stores the
  #                      member's peer URL, and k3s validates its own membership against it on
  #                      startup: "this server is not a member of the etcd cluster. Found
  #                      [...=https://<old>:2380], expect: ...=https://<new>:2380". It then
  #                      retries forever without signalling ready, so the restart hangs
  #                      indefinitely (the unit is Type=notify with TimeoutStartSec=0). Repair
  #                      with `k3s server --cluster-reset`, or wipe and re-run k3s-bringup.yml.
  #   kubelet-arg        the two unsafe sysctls wg-easy needs; setup/k3s's defaults say why.
  #                      The image-gc pair starts image GC below Longhorn's 75% replica
  #                      scheduling floor, which the root filesystem shares: at the kubelet's
  #                      85 every superseded image stayed until Longhorn stopped scheduling
  #                      (#8307). The kubelet refuses a low threshold not below the high one,
  #                      so the pair moves together. k3s-agent sets the same pair.
  #   secrets-encryption the apiserver encrypts Secrets on write, so k3s's snapshots carry no
  #                      plaintext Secret to R2. Secrets written before the flag stay plaintext
  #                      until `k3s secrets-encrypt rotate-keys` rewrites them: docs/host-packages.md,
  #                      *Rebuilding daniel-box*, has that check.
  #   etcd-expose-metrics  gated on the single switch in group_vars/all.yml, which the
  #                      Prometheus etcd scrape job also reads.
  #   kube-apiserver-arg the audit flags above, then the authentication config. That file
  #                      configures the JWT authenticator, which is mutually exclusive with the
  #                      --oidc-* flags: passing both makes the API server refuse to start.
  #   etcd-s3,           k3s's native etcd snapshots upload to R2 (H2.8a). Every S3 value lives
  #   etcd-s3-config-    in the Secret `longhorn-backup` renders into kube-system, which k3s
  #   secret             reads at each snapshot, so this file holds no credential. Any other
  #                      `etcd-s3-*` key here makes k3s ignore that Secret. To disarm the
  #                      upload, set `etcd-s3: false`; backup health's check 12 then reports
  #                      DOWN naming the disarm.
  #   etcd-snapshot-name `offbox`, the name both drills and the restore runbooks match
  #                      (`offbox-<node>-<ts>`).
  #   etcd-snapshot-     a local snapshot shrinks from about 85 MB to about 15 MB.
  #   compress
  #   etcd-snapshot-     k3s's default, written down: 00:00 and 12:00, a 12-hour recovery
  #   schedule-cron      point both locally and off-box.
  #   etcd-snapshot-     28 local copies, and 28 on S3 too: with no `etcd-s3-retention` set,
  #   retention          k3s carries this value over to S3. 28 at 12 hours is 14 days off-box.
  #                      docs/k3s-etcd-restore.md transcludes this value.
  #
  # ENFORCED: hosts/tests/test_k3s_server_flags_migration.py holds the rendered flags
  # equal to the ones `k3s_server_args` passed before this file existed, plus H2.8a's.
  k3s_server_config:
    cluster-init: true
    disable:
      - traefik
      - servicelb
      - local-storage
    write-kubeconfig-mode: "0640"
    node-ip: "{{ server_ip }}"
    advertise-address: "{{ server_ip }}"
    kubelet-arg:
      - allowed-unsafe-sysctls=net.ipv4.conf.all.src_valid_mark,net.ipv4.ip_forward
      - image-gc-high-threshold=65
      - image-gc-low-threshold=55
    secrets-encryption: true
    etcd-expose-metrics: "{{ k3s_etcd_expose_metrics }}"
    kube-apiserver-arg: "{{ (k3s_server_audit_args if k3s_audit_log_enabled else []) + ['authentication-config=' ~ k3s_authentication_config_path] }}"
    etcd-s3: true
    etcd-s3-config-secret: k3s-etcd-snapshot-s3-config
    etcd-snapshot-name: offbox
    etcd-snapshot-compress: true
    etcd-snapshot-schedule-cron: "0 */12 * * *"
    etcd-snapshot-retention: 28
  # The read-only ServiceAccount the audit policy exempts. cluster-base holds the twins
  # `cluster_base_readonly_sa_*`; a test holds the three members of each triple equal.
  k3s_server_readonly_sa_name: homelab-readonly
  k3s_server_readonly_sa_namespace: kube-system
  # The API server's JWT trust in Authelia. Moved from setup/k3s (the template was its only
  # reader). `k3s_oidc_issuer_urls` lists both hostnames Authelia answers on, with NO trailing
  # slash, because the comparison against the token's `iss` is exact.
  k3s_oidc_issuer_urls:
    - "https://auth.local.{{ domain }}"
    - "https://auth.{{ domain }}"
  # The audience: the Authelia client id. Authelia puts only that id in `aud`.
  k3s_oidc_client_id: headlamp
  # Authelia hydrates neither claim into the ID token by default, so its client must name a
  # claims policy carrying both. There is no username prefix variable: the template writes the
  # empty string, which is how structured authentication config disables prefixing.
  k3s_oidc_username_claim: preferred_username
  k3s_oidc_groups_claim: groups
  # The prefix that keeps an Authelia group from reading as a built-in `system:` group.
  # `headlamp_k8s_oidc_group` is this prefix plus the Authelia group, and
  # hosts/tests/test_k3s_oidc_trusts_authelia.py fails when the two drift.
  k3s_oidc_groups_prefix: "oidc:"
files:
  - {src: templates/50-homelab.conf.j2, dst: /usr/lib/systemd/system/k3s.service.d/50-homelab.conf, activate: "manual:k3s.service"}
  # The server's flags. The only file in config.yaml.d, and nothing ships config.yaml. World-
  # readable: it holds no secret, and H2.8b's backup-health check 12 reads it as `sys_user`.
  - {src: templates/50-homelab.yaml.j2, dst: /etc/rancher/k3s/config.yaml.d/50-homelab.yaml, mode: "0644", activate: "manual:k3s.service"}
  - {src: templates/audit-policy.yaml.j2, dst: /var/lib/rancher/k3s/server/audit.yaml, mode: "0600", activate: "manual:k3s.service"}
  - {src: templates/authentication-config.yaml.j2, dst: /var/lib/rancher/k3s/server/authentication-config.yaml, mode: "0600", activate: "manual:k3s.service"}
  - {src: templates/registries.yaml.j2, dst: /etc/rancher/k3s/registries.yaml, mode: "0600", activate: "manual:k3s.service"}
  - {src: templates/logrotate-k3s.j2, dst: /etc/logrotate.d/k3s}
  - {src: templates/tmpfiles-k3s.conf.j2, dst: /usr/lib/tmpfiles.d/homelab-k3s-server.conf}
  # An empty marker: the deploy controller skips an addon file whose name ends `.skip`, which
  # releases k3s's bundled CoreDNS to Flux's `coredns` tag (H1.4). k3s reads it live.
  - {src: templates/coredns.yaml.skip, dst: /var/lib/rancher/k3s/server/manifests/coredns.yaml.skip}
  # Longhorn's devices must stay out of multipathd's reach, or mounts fail: multipathd claims freshly
  # attached /dev/longhorn devices and every mount reads "already in use". The block Ansible wrote
  # in the owned /etc/multipath.conf stays as a harmless duplicate.
  - {src: templates/multipath-longhorn.conf, dst: /etc/multipath/conf.d/50-homelab-longhorn.conf, activate: "reload:multipathd.service"}
  - {src: templates/k3s-readonly-kubeconfig.j2, dst: /usr/lib/homelab/k3s-readonly-kubeconfig, mode: "0755", activate: "try-restart:homelab-k3s-kubeconfig.service"}
  - {src: units/homelab-k3s-kubeconfig.service.j2, dst: /usr/lib/systemd/system/homelab-k3s-kubeconfig.service}
  # `k3s kubectl` hardcodes /etc/rancher/k3s/k3s.yaml and fails when it is unreadable rather than
  # falling back to ~/.kube/config, so the shells name the fallback. Guarded on the file existing,
  # which root has none of, so root keeps the admin config.
  - {src: templates/k3s-kubeconfig-profile, dst: /etc/profile.d/k3s-kubeconfig.sh}
  - {src: templates/netplan-static-address.yaml.j2, dst: /etc/netplan/90-homelab-static-address.yaml, mode: "0600", activate: "manual:systemd-networkd.service", when: "k3s_node_static_link | length > 0"}
  - {src: templates/static-link-sysctl.conf.j2, dst: /etc/sysctl.d/90-homelab-static-link.conf, activate: sysctl, when: "k3s_node_static_link | length > 0"}
  - {src: files/homelab-netplan-wifi, dst: /usr/lib/homelab/homelab-netplan-wifi, mode: "0755", when: "k3s_node_wifi_link | length > 0"}
  - {src: units/homelab-netplan-wifi.service, dst: /usr/lib/systemd/system/homelab-netplan-wifi.service, when: "k3s_node_wifi_link | length > 0"}
outputs:
  # An output rather than the /run/credstore credential, because only an output has dependents: a
  # rotated token has to reach ~/.kube/config without waiting for a boot.
  - src: templates/k3s-readonly-token.j2
    path: /etc/rancher/k3s/readonly-token
    destination: k3s/readonly-token
    owner: root
    group: root
    mode: "0600"
    keys: [k3s_readonly_token]
    persist: false
    link: false
    dependents: [homelab-k3s-kubeconfig.service]
  - src: templates/netplan-wifi-fallback.json.j2
    path: /etc/netplan/80-homelab-wifi-fallback.yaml
    destination: netplan/80-homelab-wifi-fallback.yaml
    owner: root
    group: root
    mode: "0600"
    keys: [wifi_ssid, wifi_password]
    persist: true
    link: false
    dependents: [homelab-netplan-wifi.service]
    format: json   # homelab-secrets escapes each value, and JSON is YAML to netplan
    when: "k3s_node_wifi_link | length > 0"
enable:
  homelab-k3s-kubeconfig.service: multi-user.target
  homelab-netplan-wifi.service: {target: multi-user.target, when: "k3s_node_wifi_link | length > 0"}
legacy:
  # Ansible's logging drop-in. Its lines equal the package's, so both apply harmlessly until
  # reconcile removes it.
  - {path: /etc/systemd/system/k3s.service.d/10-log-to-file.conf}
  # The manifests staged on the server before Flux owned their objects. A hand `kubectl apply -f` of
  # one would be a second writer, and the R2 target's file holds the real bucket name at mode 0644.
  - {path: /etc/rancher/k3s/longhorn-backuptarget-r2.yaml}
  - {path: /etc/rancher/k3s/longhorn-recurringjob.yaml}
  - {path: /etc/rancher/k3s/longhorn-metrics-networkpolicy.yaml}
  - {path: /etc/rancher/k3s/longhorn-storageclass.yaml}
  - {path: /etc/rancher/k3s/longhorn-storageclass-nobackup.yaml}
  - {path: /etc/rancher/k3s/longhorn-storageclass-configmap-patch.json}
  - {path: /etc/rancher/k3s/coredns-corefile-patch.json}
  - {path: /etc/rancher/k3s/metallb-pool.yaml}
  - {path: /etc/rancher/k3s/priorityclass.yaml}
  - {path: /etc/rancher/k3s/readonly-rbac.yaml}
  - {path: /etc/rancher/k3s/traefik-clusterrole.yaml}
  # Emptying a link is the way back from the pin or the fallback: the next package drops the file
  # and this retires the path Ansible wrote. The link's live value stays until the next reboot.
  - {path: /etc/netplan/90-homelab-static-address.yaml, when: "k3s_node_static_link | length == 0"}
  - {path: /etc/sysctl.d/90-homelab-static-link.conf, when: "k3s_node_static_link | length == 0"}
  # Both copies of the wifi credentials.
  - {path: /etc/netplan/80-homelab-wifi-fallback.yaml, when: "k3s_node_wifi_link | length == 0"}
  - {path: /var/lib/homelab-secrets/netplan/80-homelab-wifi-fallback.yaml, when: "k3s_node_wifi_link | length == 0"}
lines:
  # kubelet's log watchers and every root-uid container share the per-uid default of 128, and the
  # crowdsec agent sidecar is the kind of process that exhausts it.
  - {path: /etc/sysctl.conf, line: fs.inotify.max_user_instances=1024, regexp: '^\s*fs\.inotify\.max_user_instances\s*=', activate: sysctl}
  # zsh does not read /etc/profile.d, and zshenv is the one startup file every invocation reads.
  # `depends: zsh` installs the file first. The arm would create a missing /etc/zsh 0700, which
  # hides the file from every user.
  - path: /etc/zsh/zshenv
    marker: "# {mark} ANSIBLE MANAGED — k3s kubeconfig"
    block: |
      if [ -r /etc/profile.d/k3s-kubeconfig.sh ]; then
        . /etc/profile.d/k3s-kubeconfig.sh
      fi
# The inter-node join rules, allowed FROM each agent ON this server. Each spec is the rule as `ufw
# show added` prints it. `keep`: no revert and no floor ever deletes one, because the node leaves the
# cluster without them. The live rules carry no comment, so the arm adopts each by appending it again,
# which relabels it in place. hosts/lib/tests/test_box_k3s_host_half.py holds the ports equal to
# k3s_join_server_ports.
ufw:
  rules:
    - {id: k3s-join-apiserver, spec: "allow from {{ k3s_agent_node_ips[0] }} to any port 6443 proto tcp", keep: true}
    - {id: k3s-join-vxlan, spec: "allow from {{ k3s_agent_node_ips[0] }} to any port 8472 proto udp", keep: true}
    - {id: k3s-join-kubelet, spec: "allow from {{ k3s_agent_node_ips[0] }} to any port 10250 proto tcp", keep: true}
    - {id: k3s-join-node-exporter, spec: "allow from {{ k3s_agent_node_ips[0] }} to any port 9100 proto tcp", keep: true}
    - {id: k3s-join-memberlist-tcp, spec: "allow from {{ k3s_agent_node_ips[0] }} to any port 7946 proto tcp", keep: true}
    - {id: k3s-join-memberlist-udp, spec: "allow from {{ k3s_agent_node_ips[0] }} to any port 7946 proto udp", keep: true}
  legacy:
    - {spec: "allow from {{ k3s_agent_node_ips[0] }} to any port 6443 proto tcp", comment: "", replaced_by: k3s-join-apiserver}
    - {spec: "allow from {{ k3s_agent_node_ips[0] }} to any port 8472 proto udp", comment: "", replaced_by: k3s-join-vxlan}
    - {spec: "allow from {{ k3s_agent_node_ips[0] }} to any port 10250 proto tcp", comment: "", replaced_by: k3s-join-kubelet}
    - {spec: "allow from {{ k3s_agent_node_ips[0] }} to any port 9100 proto tcp", comment: "", replaced_by: k3s-join-node-exporter}
    - {spec: "allow from {{ k3s_agent_node_ips[0] }} to any port 7946 proto tcp", comment: "", replaced_by: k3s-join-memberlist-tcp}
    - {spec: "allow from {{ k3s_agent_node_ips[0] }} to any port 7946 proto udp", comment: "", replaced_by: k3s-join-memberlist-udp}
