---

# A FILE, not `--oidc-*` flags: the flag takes one issuer, the JWT list both. Passing both hangs
# startup.
# A MALFORMED FILE wedges the node (Type=notify, no start timeout): read /var/log/k3s.log, not the
# journal.

# The apiserver reads the audit policy at STARTUP and refuses to come up if it is missing.
# k3s_audit_log_* live in k8s/vars.yml: loki-homelab reads them, and a role default is
# invisible to another role.

# Namespaced sysctls; /proc/sys is ro in a pod even with NET_ADMIN, so the pod spec is the only
# route.
# A privileged init container is rejected: privilege stays in one component
# (k8s/roles/dri-device-plugin).

# Admin kubeconfig is root 0640 and sudo needs a TTY; this SA gives unattended read-only access.
# cluster-base owns its objects; a test holds the mirrored name and namespace pairs equal.
k3s_readonly_sa_name: homelab-readonly
k3s_readonly_sa_namespace: kube-system
k3s_readonly_kubeconfig_server: https://127.0.0.1:6443
# The file carrying the CA for that endpoint's certificate (kubeconfig or PEM); the kubeconfig
# oneshot waits for it.
k3s_readonly_kubeconfig_ca_source: /etc/rancher/k3s/k3s.yaml

# The link that carries server_ip, pinned statically so k3s starts while the gateway's DHCP is down;
# empty removes the pin.
# Set it only once the gateway keeps server_ip out of its DHCP pool.
k3s_node_static_link: ""

# Fallback WiFi uplink using SOPS `wifi_ssid`/`wifi_password`; routes at metric 600 behind the
# pinned link's 100. Empty removes it.
k3s_node_wifi_link: ""

# The lists mirror each other except 6443 (agents dial the API); a test enforces it.
# A port missing from BOTH lists passes that test (MetalLB's 7946): only a live probe proves
# completeness.
k3s_join_server_ports:  # allowed FROM each agent, ON the server
  - { port: "6443", proto: tcp }
  - { port: "8472", proto: udp }
  - { port: "10250", proto: tcp }
  # Mirror of the agent-side 9100 rule, kept symmetric: Prometheus has no nodeSelector and may land
  # on either node, and the node it is not on must admit the scrape. Fix the firewall, not the
  # placement.
  - { port: "9100", proto: tcp }
  # MetalLB memberlist gossip. INERT while L2Advertisement homelab-l2 pins every pool to daniel-box
  # (one speaker).
  # It matters once the pin is lifted; symmetric on both lists, so the symmetry test cannot catch
  # it.
  - { port: "7946", proto: tcp }
  - { port: "7946", proto: udp }
k3s_join_agent_ports:  # allowed FROM the server, ON the agent
  - { port: "8472", proto: udp }
  - { port: "10250", proto: tcp }
  # node-exporter is hostNetwork and Prometheus scrapes the agent's 9100 masqueraded from the
  # server's LAN IP, a path the vxlan/kubelet allows never covered; without it the daniel-server
  # target sits down.
  - { port: "9100", proto: tcp }
  # Mirror of the server-side MetalLB rule: inert, but must land before the L2Advertisement pin is
  # lifted.
  - { port: "7946", proto: tcp }
  - { port: "7946", proto: udp }

# Weight 1-10000, only under contention: a starved etcd costs the controller-manager its lease,
# exiting k3s.
# 1000 is ten times a sibling's share (default 100); it does not rank system.slice at the root
# cgroup.
k3s_cpu_weight: 1000

# kubelet sets kubepods.slice's weight from allocatable CPU: 625 on 16 cores, 313 on 8.
# Re-derive this when a node gains cores; 1000 sits above both (systemd's default 100 starves etcd).
k3s_system_slice_cpu_weight: 1000

# DECIDED: MemoryLow on the homelab plane, not a lower claude_code_fleet_memory_high. Under
# memory pressure the kernel reclaims a cgroup below its memory.low only after every unprotected
# cgroup, so the Claude fleet in user.slice, which sets none, gives up its pages first. Each value
# is the plane's 14-day peak of anon + kernel memory rounded up to 0.5 GiB: protection above the
# working set would shield cache the fleet needs. daniel-server's values are in its host_vars.
# The limits: MemoryLow picks the reclaim victim and creates no MemAvailable, so fleet anon past
# its 2G swap share still breaks the 8 GiB floor; and it does not steer the OOM killer. No size
# here holds the floor with the fleet at its cap, and the doc below names the open re-ruling.
# docs/claude-code-rc-caps.md has the derivation. No MemoryMin: a hard floor turns fleet pressure
# into a global OOM. Measured on daniel-box on 2026-11-22:
#   kubepods.slice: cAdvisor's 14-day rss peak 9.2 GiB + kernel 0.8 = 10.0 -> 10G.
k3s_kubepods_memory_low: 10G
# Own claim for k3s (cAdvisor 14-day rss peak 2.2 GiB), else it shares system.slice's protection
# with the docs-refresh pytest in proportion to usage.
k3s_memory_low: 2560M
# system.slice: k3s's 2560M + other units' steady anon + 0.5 GiB kernel. A child's protection never
# exceeds its parent's.
k3s_system_slice_memory_low: 3G

# Kubelet's graceful node shutdown, rendered into kubelet.conf.d on both k3s nodes. Here rather
# than in component.yml's `defaults:`, because k3s-agent ships the same files and a borrowing
# component reads only this file. Without it every shutdown of a node logs out Longhorn's iSCSI
# sessions under mounted ext4 filesystems: open-iscsi's stop runs logout-all.sh while the pods
# still hold the mounts, and the journals abort. kubelet instead stops the workloads first, so their volumes unmount while Longhorn still serves them,
# then Longhorn, then the system-critical pods.
#
# kubelet takes that lock only when logind's delay covers the groups' sum, which the logind
# drop-in in component.yml's `files:` sets. Without the drop-in the shutdown manager fails at every k3s
# start. To see that it holds, run `systemd-inhibit --list`, which names a kubelet `shutdown`
# lock in `delay` mode.
#
# The boot side needs no iSCSI setting: iscsid.conf already sets `node.startup = manual`, and
# the logins after boot follow instance-manager's tgtd and a fresh sendtargets discovery, which
# is Longhorn's attach path. If a boot after a graceful shutdown still logs read-only remounts,
# the cause is in Longhorn's engine or replica state, not here.
#
# Each group opens at its priority and runs to the next one. 1000000000 is the value of
# Longhorn's `longhorn-critical` PriorityClass, and 2000000000 is Kubernetes'
# system-cluster-critical; system-node-critical (2000001000) lands in that last group.
# ENFORCED: hosts/tests/test_k3s_server_component.py.
#
# DECIDED: 90 seconds in total, because the UPS chain cannot give more. upsmon's SHUTDOWNCMD is
# `systemctl poweroff`, which waits on kubelet's delay lock like the weekly reboot does, and an
# FSD raised by `battery.runtime.low` (120 s, k8s/roles/nut/defaults/main.yml) leaves about two
# minutes of battery. kubelet moves to the next group as soon as a group's pods have stopped, so
# a group's seconds are its ceiling, not its cost.
k3s_graceful_shutdown:
  - {priority: 0, seconds: 45}
  - {priority: 1000000000, seconds: 30}
  - {priority: 2000000000, seconds: 15}
