# Kernel and login hardening, applied with in-place edits.
#
# - The sysctl keys live in /etc/sysctl.d/90-homelab-host-tuning.conf. Ubuntu 26.04's
#   systemd-sysctl reads only the sysctl.d directories at boot, never /etc/sysctl.conf, and 90-
#   sorts after every /usr/lib/sysctl.d file the distribution ships, so the file wins at boot and
#   at every `sysctl --system`. The Pi's vm.swappiness and vm.page-cluster are pi-tuning's.
# - The legacy entry deletes /etc/sysctl.conf, which held these keys as line-arm edits. procps
#   marks it remove-on-upgrade on 26.04, so no package owns it.
# - /etc/ufw/sysctl.conf is ufw's conffile. Ubuntu ships `log_martians=0` uncommented there, and
#   ufw re-applies the file on every enable and reload, so both log_martians lines must read 1 in
#   both files. Reconcile runs the line arm before the ufw arm for the same reason. The
#   `rsyslog-filter` component drops the pod-to-pod martians this produces.
# - /etc/login.defs is the `login` package's conffile. The six edits keep the regexps of the
#   lineinfile tasks they replace.
# - journald's cap lands in a drop-in. The Pi's pi-tuning adds 60-homelab-pi.conf beside it, and
#   that file wins where the two disagree. The `rsyslog-filter` component ships the info filter
#   that pairs with MaxLevelSyslog on each host that has rsyslog.
# - `* hard core 0` moves to limits.d. An existing line in limits.conf stays as a harmless
#   duplicate, to remove by hand.
files:
  - {src: templates/50-homelab-journald.conf, dst: /etc/systemd/journald.conf.d/50-homelab.conf, activate: "try-restart:systemd-journald.service"}
  - {src: templates/50-homelab-limits.conf, dst: /etc/security/limits.d/50-homelab.conf}
  - {src: templates/90-homelab-host-tuning.conf, dst: /etc/sysctl.d/90-homelab-host-tuning.conf, activate: sysctl}
legacy:
  - {path: /etc/sysctl.conf}
lines:
  - {path: /etc/ufw/sysctl.conf, line: "net/ipv4/conf/all/log_martians=1", regexp: '^#?net/ipv4/conf/all/log_martians='}
  - {path: /etc/ufw/sysctl.conf, line: "net/ipv4/conf/default/log_martians=1", regexp: '^#?net/ipv4/conf/default/log_martians='}
  - {path: /etc/login.defs, line: "UMASK\t\t027", regexp: '^UMASK\s'}
  - {path: /etc/login.defs, line: "SHA_CRYPT_MIN_ROUNDS\t65536", regexp: '^#?\s*SHA_CRYPT_MIN_ROUNDS\s'}
  - {path: /etc/login.defs, line: "SHA_CRYPT_MAX_ROUNDS\t65536", regexp: '^#?\s*SHA_CRYPT_MAX_ROUNDS\s'}
  - {path: /etc/login.defs, line: "PASS_MIN_DAYS\t1", regexp: '^PASS_MIN_DAYS\s'}
  - {path: /etc/login.defs, line: "PASS_MAX_DAYS\t365", regexp: '^PASS_MAX_DAYS\s'}
  - {path: /etc/login.defs, line: "PASS_WARN_AGE\t14", regexp: '^PASS_WARN_AGE\s'}
