# Managed by the homelab host package. Docker rotates container logs and Alloy ships them to Loki,
# so 1G is plenty for host forensics. MaxLevelSyslog stays above MaxLevelStore on purpose: it keeps
# the info-level SSH authentication trail reaching rsyslog's auth.log on a host that runs rsyslog.
[Journal]
SystemMaxUse=1G
MaxLevelStore=notice
MaxLevelSyslog=info
