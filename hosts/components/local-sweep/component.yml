# The shadow sweep on daniel-box (docs/ci-throughput.md, slice B1b). homelab-local-sweep.timer
# starts homelab-local-sweep.service 15 minutes after the last run ended. The service runs
# scripts/deploy_tools/local_sweep.py from the primary checkout as sys_user, the way
# homelab-docs-refresh.service runs the docs generators. It sweeps the tip of `origin/master` as
# homelab-checkout-sync last fetched it, and a commit at most once. A commit that merges and is
# superseded between two runs is never swept.
#
# The sweep is a shadow: nothing reads its verdict. It exists to record, for a week of master
# commits, whether a local sweep agrees with the hosted run and how long it takes.
#
# Autonomous-role contract — the shadow sweep runs the test suite of a master commit with no
# human in the loop.
# - Scope: it runs the gate's hooks and the whole pytest suite on a commit already merged to
#   master. It writes scratch clones under the user's cache directory, which it removes, and one
#   record file in its state directory. It never fetches, commits, pushes, merges or deploys, and
#   it writes nothing in the primary checkout.
# - Mode: the timer's enable link arms it. `sudo systemctl mask --now homelab-local-sweep.timer`
#   pauses it, and `unmask` then `start` resumes it. Dropping the component from daniel-box's
#   package stops the timer on the install that drops it.
# - Abort valves: one sweep per commit, recorded before the first check, so a sweep that dies is
#   not repeated. The tool kills a check after 30 minutes, and TimeoutStartSec= ends the run after
#   70. MemoryHigh= and MemorySwapMax= bound it inside the fleet's slice, and CPUWeight= puts it
#   behind the sessions it shares that slice with.
# - Required evidence: one `SWEEP-RESULT:` line per swept commit, at notice, in the journal
#   under the identifier `local-sweep`, with the lines naming what failed above it. A run that
#   swept nothing and failed leaves the unit failed.
# - Next-run review: before any landing reads a sweep's verdict, compare a week of
#   `SWEEP-RESULT:` lines with the hosted runs of the same commits (docs/ci-throughput.md, B1c).
files:
  - {src: units/homelab-local-sweep.service.j2, dst: /usr/lib/systemd/system/homelab-local-sweep.service}
  - {src: units/homelab-local-sweep.timer, dst: /usr/lib/systemd/system/homelab-local-sweep.timer}
enable:
  homelab-local-sweep.timer: timers.target
