---
# The UPS host uses the pod's loopback hostPort; every other host uses the Service's pinned
# ClusterIP.
# The nut NetworkPolicy already admits it: a cross-node host->pod packet arrives as the sending
# node's flannel.1 address.
nut_host_upsd_host: "{{ '127.0.0.1' if inventory_hostname == ups_host else nut_host_upsd_clusterip | default('') }}"

# Nothing at install time proves the address reaches upsd, and nut-monitor can die later.
# The k8s 'nut (upsd)' probe runs from a pod over Service DNS, not from this host's netns.
nut_host_watchdog_armed: true

# One value drives the timer cadence and DEADLINE_S (2x cadence plus 300 s: one missed run of
# slack).
nut_host_watchdog_interval_minutes: 10
