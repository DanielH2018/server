# Points nut-monitor at the rendered upsmon.conf (H4.3c, docs/target-architecture/host/
# h4-secrets-unit.md, *NUT on daniel-server*). Wants= and After= make boot start homelab-secrets
# first, and never Requires=: a failed decrypt must leave upsmon running on the persisted file.
[Unit]
Wants=homelab-secrets.service
After=homelab-secrets.service

[Service]
Environment=NUT_CONFPATH=/var/lib/homelab-secrets/etc/nut
# The vendor unit reads /etc/nut/nut.conf for MODE, and /sbin/upsmon is the wrapper that gates on
# it. The package is the decision that this host runs a netclient upsmon, so the daemon starts
# directly and no file nobody manages can switch the shutdown chain off.
EnvironmentFile=
ExecStart=
ExecStart=/lib/nut/upsmon -F
ExecReload=
ExecReload=/lib/nut/upsmon -c reload
