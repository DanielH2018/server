# Points nut-monitor at the rendered upsmon.conf. Wants= and After= make boot start homelab-secrets
# first, and never Requires=: a failed decrypt must leave upsmon running on the persisted file.
[Unit]
Wants=homelab-secrets.service
After=homelab-secrets.service

[Service]
Environment=NUT_CONFPATH=/var/lib/homelab-secrets/etc/nut
# The vendor unit reads /etc/nut/nut.conf for MODE; dropping it means no unmanaged file can switch
# the shutdown chain off.
EnvironmentFile=
ExecStart=
ExecStart=/usr/sbin/upsmon -F
ExecReload=
ExecReload=/usr/sbin/upsmon -c reload
# upsmon's child writes PIDFile and sends MAINPID, and systemd misses the exit of a main process it
# did not fork.
# With both shut, the root parent exits on child death; NotifyAccess=main would stall start (only
# the child sends READY=1).
Type=exec
NotifyAccess=none
PIDFile=
