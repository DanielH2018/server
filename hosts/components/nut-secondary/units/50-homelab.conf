# Points nut-monitor at the rendered upsmon.conf. Wants= and After= make boot start homelab-secrets
# first, and never Requires=: a failed decrypt must leave upsmon running on the persisted file.
[Unit]
Wants=homelab-secrets.service
After=homelab-secrets.service

[Service]
Environment=NUT_CONFPATH=/var/lib/homelab-secrets/etc/nut
# The vendor unit reads /etc/nut/nut.conf for MODE, and on 24.04 /usr/sbin/upsmon is the wrapper
# that gates on it. The package is the decision that this host runs a netclient upsmon, so the
# daemon starts directly and no file nobody manages can switch the shutdown chain off.
# The daemon is /lib/nut/upsmon on 24.04 and /usr/sbin/upsmon on 26.04, where /lib/nut is gone.
# A package stays installed through a release upgrade, so systemd resolves it at each start.
# The search path is also the daemon's PATH, so upsmon.conf names every command absolutely.
EnvironmentFile=
ExecSearchPath=/lib/nut:/usr/sbin
ExecStart=
ExecStart=upsmon -F
ExecReload=
ExecReload=upsmon -c reload
