---

# False stops AND disables the host and its restart timer; that is the rollback.
# Whether a phone-spawned worktree clears the workspace-trust dialog is a prerequisite Ansible
# cannot check.
claude_code_rc_enabled: true

claude_code_rc_unit: homelab-claude-rc.service
claude_code_cgroup_metrics_unit: homelab-claude-cgroup-metrics.service

# claude-rc.service pages through its own alert unit; the other units use the shared instanced
# alert.
claude_code_rc_alert_unit: homelab-claude-rc-alert.service
claude_code_sync_alert_unit: homelab-alert@%n.service

# Deliberately no default: a guessed uid would bind another account's runtime directory.
claude_code_user: "{{ sys_user }}"

# The agent's home is outside /home, so ProtectHome=tmpfs can hide human homes without hiding it.
claude_code_user_home: >-
  {{ claude_code_agent_user_home if claude_code_user == claude_code_agent_user
  else '/home/' ~ claude_code_user }}

# On-demand sessions get their own worktree under it; the pre-created session stays here.
claude_code_rc_workdir: "{{ claude_code_user_home }}/server"

# DECIDED: worktree, not same-dir. Concurrent sessions sharing one checkout is the exact
# thing this repo's parallel-session rule forbids, and the worktree pruner already
# collects finished worktrees while respecting a live session's lock.
claude_code_rc_spawn_mode: worktree

# DECIDED: auto, matching interactive sessions on this host. `default` prompts on nearly
# every tool call, which from a phone means a session that stops constantly. Falling back
# to `default` is the supported answer if auto degrades without a TTY — answering prompts
# remotely is what Remote Control is for.
claude_code_rc_permission_mode: auto

# DECIDED: 10, not the CLI's default of 32. Measured on daniel-box, a `claude` process sits
# at 200-400 MB RSS, so 10 sessions ask for up to ~4 GB against ~15 GB available with k3s
# already running.
#
# This is NOT the memory bound: the per-process figure omits the subprocess tree (two live
# sessions held 203 processes and 6.96 GB anon), so capacity multiplies that tree rather than
# bounding it. claude_code_rc_pytest_workers below bounds the fan-out; MemoryHigh in the unit
# throttles when it is exceeded anyway.
claude_code_rc_capacity: 10

# Caps pytest workers per run, `-n auto` or an explicit `-n`; the worst case is workers x
# capacity (4 x 10 = 40).
# settings.json `env` carries the same value for other sessions; raise both together.
claude_code_rc_pytest_workers: 4

# DECIDED: one crash page per 6 hours, not one per exit. claude-rc.service runs Restart=always
# with RestartSec=10, and systemd 255 fires OnFailure= on every exit of that loop, so a host
# that cannot start would page about every 10 seconds. After a delivered page the alert skips
# for this many minutes, so a loop that lasts days pages four times a day as a reminder. The
# cost is that a second, separate crash inside the window is not paged; the page text says so.
# 0 restores a page per exit.
claude_code_rc_alert_quiet_minutes: 360

# The fleet sits in two sibling cgroups that cannot see each other, so the limit is their SUM.
# The vars below cap the sum on the one slice that parents both.

# user.slice is the tightest legal common ancestor: user-<uid>.slice cannot be reparented.
# A service placed in user-<uid>.slice would stop with it at the last logout (StopWhenUnneeded=yes).
claude_code_fleet_slice: user.slice

# DECIDED: 20G on the shared parent, with the per-plane caps below at 14G as sub-bounds.
# Lowering both planes to 10G would also make the sum 20G, and is the worse shape: a plane
# would throttle at half the box's fleet budget while the other plane sat idle. A parent
# ceiling shares elastically — either plane may take up to its own 14G, and the two together
# are held to 20G by the parent.
#
# The cap was meant to hold a floor of 8 GiB of MemAvailable on every node. It does not hold it
# when the fleet's memory is anon. MemAvailable is about MemTotal minus the anon and kernel
# memory of user.slice, kubepods.slice and system.slice, since their page cache counts as
# available. memory.high bounds the fleet's anon, file and kernel together, so the worst-case
# floor is MemTotal - homelab (anon + kernel) - this cap. claude_host_plane_memory_bytes reports
# each term. Measured on daniel-box on 2026-11-22:
#   MemTotal 27.7 GiB. Homelab anon + kernel 12.6 GiB at its peak: kubepods.slice anon 9.2
#     (the 14-day peak of cAdvisor's rss), its kernel 0.9, system.slice anon 2.1 and kernel 0.4.
#   Worst-case floor at 20G: 27.7 - 12.6 - 20 = -4.9 GiB, so reclaim and swap take the gap.
#   A cap that holds 8 GiB with all-anon fleet memory: 27.7 - 12.6 - 8 = 7.1 GiB, or 10.6 GiB
#     against the homelab plane's median.
# The 2026-11-18 episode fits this model. The fleet held 17.3 GiB, nearly all of it unreclaimable,
# and MemAvailable fell to 2.7 GiB. The floor holds on an ordinary busy day only because much of
# the fleet's memory is page cache: on 2026-11-20 the fleet peaked at 15.9 GiB and MemAvailable
# stayed at or above 9.8 GiB. docs/claude-code-rc-caps.md has the full record.
# The cap stays, and the homelab plane is protected directly instead:
# k3s_kubepods_memory_low in hosts/components/k3s-server makes reclaim take the fleet's pages first.
#
# memory.high counts PAGE CACHE as well as anon, so an ordinary multi-agent pytest fan-out
# will touch this bound and reclaim cache. That is the cheap half of reclaim and it is
# intended.
claude_code_fleet_memory_high: 20G

# 2G is a quarter of the 8 GiB /swap.img, so the homelab plane keeps three quarters; not zero.
claude_code_fleet_swap_max: 2G

# Range 1-10000. At the default 100, fleet test runs starve etcd until k3s exits.
# 20 ranks the fleet below system.slice and kubepods.slice. No CPUQuota: a cap would idle cores.
claude_code_fleet_cpu_weight: 20

# DECIDED: 1000, the kernel's maximum, on every fleet process: claude-rc.service, the
# background resume, each fleet uid's user manager, the agent's login shell and every zsh the
# operator's ssh session starts (/etc/zsh/zshenv). kubelet gives
# a burstable pod 2-999 and a best-effort pod 1000, so any lower value lets the global OOM
# killer prefer a pod although the fleet caused the pressure. The bias is small: the kernel's
# badness adds adj * totalpages / 1000 to a process's RSS, so one point is about 30 MiB here,
# and a pod with a far larger RSS can still be the victim. A systemd-oomd kill on user.slice
# was ruled out on 2026-11-22 (docs/claude-code-rc-caps.md).
claude_code_fleet_oom_score_adjust: 1000

# Must be <= the fleet bound. Deliberately over half of 20G: the parent bounds the two planes
# together.
# Fan-out agents run in the login plane, so raising the fleet cap alone adds no fan-out width.
claude_code_rc_memory_high: 14G

# Without it one cgroup can take all 8 GiB of swap and starve k3s; MemoryHigh only throttles.
# NOT 0: no swap moves the growth into RAM, ending in the global OOM killer, k3s included.
claude_code_rc_memory_swap_max: 2G

# Turns off Claude Code's kill of backgrounded Bash tasks under a Node memoryPressure event.
# With it on, MemoryHigh and claude_code_rc_capacity are the only bounds on a runaway background
# shell.
claude_code_rc_disable_bg_shell_pressure_reap: true

# A long-lived process keeps running the version it started with, so the restart picks up
# auto-updates.
claude_code_rc_restart_schedule: weekly

# Respawns the shutdown-killed background sessions once at boot; CLAUDE.md says what it restores.

# The operator dispatches these; claude-rc.service's sessions come back through its own
# Restart=always.
claude_code_bg_resume_user: "{{ sys_user }}"
claude_code_bg_resume_home: "/home/{{ claude_code_bg_resume_user }}"
claude_code_bg_resume_dir: /usr/local/lib/claude-bg-resume

# claude-rc.service's caps bound only its own cgroup, not a session from an interactive SSH shell in
# user-<uid>.slice; these caps render for claude_code_login_uids plus the agent user's.

# The uid whose user-<uid>.slice gets the caps; claude-rc.service running as sys_user reads it too,
# for XDG_RUNTIME_DIR and DBUS_SESSION_BUS_ADDRESS, never claude_code_user_uid (the agent's uid).
claude_code_login_uid: 1000

# The agent's uid is not in it: each host's package.yml ships the agent's user-<uid>.slice.d cap
# itself.
# Drop 1000 only once no session still runs as sys_user.
claude_code_login_uids: "{{ [claude_code_login_uid] }}"

# Writes claude_uid_processes{uid} for each uid, 0 included; no alert rule reads the series.
claude_code_watch_uids: []

# Sessions read their own host's ~/.claude store, so this one-way overwriting copy keeps them in
# step.
# True only in daniel-box's host_vars; false stops and disables the timer and removes its units.
claude_code_memory_sync_enabled: false

# The ssh destination the store is copied to, as this host's user resolves it.
claude_code_memory_sync_target: daniel-server

# Claude Code keys a project's store by its working directory with `/` turned into `-`.
claude_code_memory_sync_dir: "{{ claude_code_user_home }}/.claude/projects/{{ claude_code_rc_workdir | replace('/', '-') }}/memory"

# Target sessions run as sys_user in that checkout, so they read this store.
claude_code_operator_checkout: "/home/{{ sys_user }}/server"
claude_code_operator_memory_dir: >-
  /home/{{ sys_user }}/.claude/projects/{{
  claude_code_operator_checkout | replace('/', '-') }}/memory

# DECIDED: the target path is its own variable, not "the same path" as the source. Once
# claude_code_user is the agent, the source is under claude_code_agent_user_home, a path that
# does not exist on claude_code_memory_sync_target, where sessions read the operator's store.
claude_code_memory_sync_target_dir: "{{ claude_code_operator_memory_dir }}"

claude_code_memory_sync_interval: 15min

# A dedicated Unix user for the operator's Claude sessions. Each host's package.yml declares it
# to the users arm, as renovate-agent's component.yml declares that agent's user, and
# claude-agent-setup builds its home. A session running as
# {{ sys_user }} reads everything that user can: the age key, which decrypts the become
# password, the operator's gh token, ssh keys, and the primary checkout. This user
# reaches none of them. claude-rc.service runs as {{ sys_user }} unless a host's host_vars set
# claude_code_user to this user (slice 4d).
#
# To start a session as it, open a login shell, which reads the .profile this role writes, then
# run `claude` in ~/server. The first run needs `/login` and trusting the directory:
#   sudo machinectl shell claude@ /bin/bash -l
# Each apply of this role syncs the clone's .venv, which the hooks run in. A pull that changes
# uv.lock needs `uv sync` in ~/server before the next `claude`, as in any checkout.
#
# False drops the agent's setup, its syncs, its lander and triage from the next package version.
# The account itself follows the host's `users:` entry in its package.yml.
claude_code_agent_user_enabled: true
claude_code_agent_user: claude
# Outside /home, as renovate-agent's is, so a unit's ProtectHome= hides every human home and
# not this one.
claude_code_agent_user_home: /var/lib/claude
claude_code_agent_user_clone_dir: "{{ claude_code_agent_user_home }}/server"
claude_code_agent_user_repo: DanielH2018/server
# A merge touching only the hook shim's or homelab-ui launcher's code applies no role, so this
# bounds how long the agent runs the old copy.
claude_code_agent_clone_sync_interval: 15min

# Without the systemd-journal group, `journalctl` shows the agent only its own units.
claude_code_agent_journal_access: true
# False closes the agent's ~/.claude to its own user again and removes the ACLs.
claude_code_agent_operator_read: true
# The agent's own memory store: Claude Code keys it by the project directory, the agent's clone.
claude_code_agent_memory_dir: >-
  {{ claude_code_agent_user_home }}/.claude/projects/{{
  claude_code_agent_user_clone_dir | replace('/', '-') }}/memory
# Copies while the agent's MEMORY.md is absent, and after an operator run if the stores differ.
# Once the host runs as the agent, a later run never overwrites what the agent wrote.
claude_code_agent_memory_seed: true
# Set by each run as the operator, outside the agent's home so the agent cannot clear it.
claude_code_agent_memory_seed_stale: /var/lib/homelab/claude-agent-memory-stale
# Stripped from copied .md paths so `/home/ubuntu/server/docs/x.md` becomes the repo-relative
# `docs/x.md`.
claude_code_agent_memory_seed_strip: "{{ claude_code_operator_checkout }}/"

# The agent gets no hooks. The subset is copied from the deployed ~/.claude, not chezmoi's source;
# this flag gates only the operator import line in templates/agent-user-claude-md.j2.
claude_code_agent_operator_config: true
claude_code_agent_operator_config_src: /home/{{ sys_user }}/.claude

# The agent takes the operator's dotfiles through chezmoi (`agent` flag), not the subset above.
# A dotfiles source without the flag is refused and the agent keeps what it had.
claude_code_agent_dotfiles: true
claude_code_agent_dotfiles_repo: https://github.com/DanielH2018/dotfiles.git
# The dotfiles' `profile` answer: `server`, as the operator's own config on these hosts holds.
claude_code_agent_dotfiles_profile: server
# A dotfiles merge ships no host package version, so this bounds how long the agent runs the old
# hooks.
claude_code_agent_dotfiles_sync_interval: 15min

# No ruleset bypass; the agent branch fence limits it to refs/heads/worktree-claude+**.
# Classic public_repo token; no `workflow` scope, so pushes editing .github/workflows/ are refused.
claude_code_agent_github_login: claudemachineacct1
# EnterWorktree turns `claude/<slug>` into `worktree-claude+<slug>`, the one shape the fence allows.
# The repo CLAUDE.md cannot carry it because the operator's sessions read that file too.
claude_code_agent_worktree_prefix: claude
claude_code_agent_github_id: 356237609
# GitHub attributes commits by this address; Verified needs the signing key on the account.
claude_code_agent_git_email: >-
  {{ claude_code_agent_github_id }}+{{ claude_code_agent_github_login }}@users.noreply.github.com
# Generated as the agent, so the private half never leaves its home. Add the `.pub` as a Signing
# Key, never an Authentication Key: the agent pushes over HTTPS, so the key signs and cannot push.
claude_code_agent_signing_key: "{{ claude_code_agent_user_home }}/.ssh/git_signing_ed25519"

# The username mirrors authelia_k8s_agent_user (a test holds them equal). The file also carries
# `domain`, because ui_login.py refuses a login file without it; the domain is not a secret.
claude_code_homelab_ui_username: claude-agent
claude_code_homelab_ui_credentials: "{{ claude_code_agent_user_home }}/.config/homelab-ui/credentials.json"

# User-scope registration, not .mcp.json: project scope waits for an approval a phone session cannot
# give, and would start a second Chromium in every operator session.
claude_code_agent_homelab_ui_enabled: false
# `current` links to the unpacked Node, so the registration's NODE_BIN survives a Node bump;
# npm's global prefix is that tree, so playwright-mcp lands in the same bin directory.
claude_code_agent_node_dir: "{{ claude_code_agent_user_home }}/.local/share/node"
claude_code_agent_node_bin: "{{ claude_code_agent_node_dir }}/current/bin"

# Whether the agent being rendered is the primary one, which alone gets the lander.
claude_code_agent_is_primary: true

# Lands PR <n> as sys_user; the agent user may start the unit and nothing else.
# False removes the rule, the unit and the approval list; a landing already running finishes.
claude_code_lander_enabled: false
# Pins are literals in templates/claude-land-pins.j2: a template's own assignment outranks
# inventory.
# The approval list is literal in claude-land-approval-paths.j2, so inventory cannot override it.

# One capped, diagnose-only headless session per episode; writes a record, an HTML report, a Discord
# page.
# False removes the rule, units, code and config; the state directory and its records stay.
claude_code_triage_enabled: false
# Pinned again in templates/claude-triage-pins.j2, which wins over inventory; these are the
# validator's values.
claude_code_triage_state_dir: /var/lib/claude-triage-ctl/state
claude_code_triage_model: opus
# The budget to diagnose, in USD.
claude_code_triage_budget_usd: 10
claude_code_triage_max_turns: 60
# The script's wall clock. The unit's TimeoutStartSec sits 10 minutes above it.
claude_code_triage_run_timeout_s: 1800
# The runner enforces the cap because polkit lets the agent start a run directly, not only via the
# poller.
claude_code_triage_daily_cap: 6
# `off` reads nothing, `shadow` logs would-be runs to <state_dir>/shadow.jsonl, `armed` starts them.
claude_code_triage_poll_mode: shadow
# A fall the table does not route is logged as skipped and opens no run.
# The seed is the down class (`warning`, bar the `*Critical` twins): a `critical` floor misses down
# services.
claude_code_triage_poll_routes:
  ExtraProbeFailed: triage
  ExtraProbeFailedCritical: triage
  IngressProbeFailed: triage
  IngressProbeFailedCritical: triage
  K8sDeploymentZeroAvailable: triage
  K8sContainerCrashLooping: triage
  ScrapeTargetDown: triage
claude_code_triage_poll_interval: 2min
# Loopback first, as Prometheus publishes loopback only on its node; the ClusterIP matches the k8s
# key.
claude_code_triage_prom_urls:
  - http://127.0.0.1:9090
  - http://10.43.39.218:9090
# A key must read down on this many consecutive polls before an episode opens.
claude_code_triage_poll_streak: 2
# More keys than this falling in one poll make one storm episode instead of one per key.
claude_code_triage_poll_storm_size: 3

# Restarts one allowlisted Deployment as root; true only in daniel-box's host_vars (k3s admin
# kubeconfig).
# False removes the unit, script and config, and keeps /var/lib/claude-restart.
claude_code_restart_enabled: false

# Runs `fanout.py land-server` on daniel-box; false stops the timer, and server batches stop at
# their PR.
claude_code_fanout_server_lander_enabled: false
claude_code_fanout_server_lander_interval: 10min
# land.sh's policy (LAND_REQUIRE_*); autoland.py holds the same two values, and a test holds them
# equal.
claude_code_fanout_server_lander_branch_prefix: worktree-fanout-
claude_code_fanout_server_lander_author: DanielH2018

# Two inputs sit in the journal, which rotates after ~10 days; a daily run copies them out first.
claude_code_pipeline_timeline_enabled: false
# Must be <N>min: timer-textfile.j2 derives the NotReporting deadline from it.
claude_code_pipeline_timeline_interval: 1440min
# A later snapshot's rows supersede an earlier one's, so N days survives N-1 missed runs.
claude_code_pipeline_timeline_days: 3
# The host whose review records the run copies with a read-only rsync.
claude_code_pipeline_timeline_server_host: daniel-server

# Pages Discord when a batch unit stops on any state but `done`; polkit allows only paging states.

# Pages Discord when a session ends on an API error; polkit allows only a cause in [a-z0-9_]+.

# The peer sync (hosts/components/claude-code/templates/sync-artifacts.sh.j2) and the OTLP-door
# heartbeat (claude-otel-health.sh.j2) ship only on this node, in its host package.
#
# DECIDED: a key pair held equal by a test, not one key in a shared vars file. A shared
# key routes as a deploy-plane change only (docs/archive/host/h2-shrink-host-plane.md).
# Each name below that has a twin in a k8s role is held equal to it by
# hosts/lib/tests/test_claude_artifacts_node_timers.py, so a change edits both.
#
# The node the artifacts pod pins, which holds the tree the sync fills and the loopback OTLP
# door the heartbeat probes. Twin of artifacts_k8s_node. No other host's package ships either.
claude_code_artifacts_node: "{{ k8s_primary_node }}"

# A `*/N` minute, read as the timer's period.
# daniel-server holds no key to daniel-box, so the sync only pulls, on a timer; it cannot be
# instant.
claude_code_artifacts_sync_minute: "*/5"

# Failed runs before the once-per-outage line to stderr; 12 runs at the interval is an hour.
# Below it each failure writes only its journal line, because daniel-server being off is ordinary.
claude_code_artifacts_sync_alert_after_failures: 12

# Pulled by the artifacts node, the only side that can open the connection.
# The same connection carries the star list back to `stars_path`. Twin of artifacts_peer_sources.
claude_code_artifacts_peer_sources:
  - name: daniel-server
    ssh_target: daniel-server
    path: /home/ubuntu/.claude/artifacts
    stars_path: /home/ubuntu/.claude/artifact-stars.txt
# The artifacts node's own tree. Twin of artifacts_host_dir.
claude_code_artifacts_host_dir: /home/ubuntu/.claude/artifacts
# Where the sync writes each peer's copy, one subdirectory per host. Twin of artifacts_peer_dir.
claude_code_artifacts_peer_dir: /home/ubuntu/.claude/artifacts-peer
# Twin of artifacts_stars_file.
claude_code_artifacts_stars_file: /var/lib/artifact-stars/stars.txt

# A `*/N` minute; the script derives its textfile deadline from it, so a dead timer trips
# OtlpDoorNotReporting.
claude_code_telemetry_health_minute: "*/10"
# Twins of observability_otlp_host_ip and observability_otlp_port.
claude_code_otlp_host_ip: 127.0.0.1
claude_code_otlp_port: 4317

# True only where the cluster-admin kubeconfig is (daniel-box); false removes the grant and the
# wrapper.
claude_code_takeover_check_enabled: false
# Users the sudoers line names. The operator's own account, which is where sessions run.
claude_code_takeover_check_users:
  - "{{ sys_user }}"
claude_code_takeover_check_wrapper: /usr/local/sbin/homelab-takeover-check
claude_code_takeover_check_state_dir: /var/lib/homelab-takeover-check

# The operator's account, where fan-out batches and sessions run; not the agent user, whose
# NoNewPrivileges stops sudo.
claude_code_rootq_users:
  - "{{ sys_user }}"
claude_code_rootq_script: /usr/local/sbin/homelab-rootq
claude_code_rootq_shim: /usr/local/bin/rootq

# `sudo` is no route for the agent (NoNewPrivileges=yes); a root helper per socket connection runs
# the same script.
claude_code_rootq_socket_group: homelab-rootq
claude_code_rootq_socket_path: /run/homelab-rootq.sock
claude_code_rootq_socket_helper: /usr/local/libexec/homelab-rootq-socket
claude_code_rootq_socket_client: /usr/local/bin/rootq-socket

# A run, not a rules.d file: augenrules stops at the first watch whose directory is missing, taking
# the host-hardening watches down. False removes the watches under the two keys on the next run.
claude_code_guardrail_audit_enabled: true
# A `*/N` minute, read as the timer's period. A watch lost to an auditd restart is back within it.
claude_code_guardrail_audit_minute: "*/5"
# Watched under the key `claude-guardrail`: what decides what a session may do. Write and attribute
# changes only (`-p wa`). A directory watch covers its whole subtree. The renovate-agent home is a
# literal because that component's defaults do not reach this one;
# hosts/tests/repo_crons/test_claude_guardrail_audit.py holds it equal to renovate_agent_home.
claude_code_guardrail_audit_paths:
  - /etc/claude-land/approval-paths
  - /usr/lib/homelab/claude-agent-setup
  - /usr/lib/homelab/claude-agent-home
  - "/home/{{ sys_user }}/.claude/settings.json"
  - "/home/{{ sys_user }}/.claude/hooks"
  - "/home/{{ sys_user }}/.claude/CLAUDE.md"
  - "/home/{{ sys_user }}/.claude/rules"
  - "{{ claude_code_agent_user_home }}/.claude/settings.json"
  - "{{ claude_code_agent_user_home }}/.claude/hooks"
  - "{{ claude_code_agent_user_home }}/.claude/CLAUDE.md"
  - "{{ claude_code_agent_user_home }}/.claude/rules"
  - /var/lib/renovate-agent/.claude/settings.json
  - /var/lib/renovate-agent/.claude/hooks
# Key `claude-memory`: memory stores a session reads at its next start; the audit record names the
# writing process.
claude_code_guardrail_audit_memory_dirs:
  - "{{ claude_code_operator_memory_dir }}"
  - "{{ claude_code_agent_memory_dir }}"

# Posts to Discord each change under claude_code_guardrail_audit_paths that nothing merged explains.
# Memory stores are audited, never posted. False drops the timer and units from the next version,
# keeping state.
claude_code_guardrail_ack_enabled: true
# A `*/N` minute, read as the timer's period.
claude_code_guardrail_ack_minute: "*/5"
# Keys Claude Code writes itself via /config and /model stay quiet; a change to any other key posts.
claude_code_guardrail_ack_quiet_settings_keys:
  - model
  - effortLevel
  - outputStyle
  - theme
claude_code_guardrail_ack_dotfiles_repo: https://github.com/DanielH2018/dotfiles.git

# Records the newest signature-verified tag that descends from the last one recorded;
# a T2 session's config is rendered only from that record. False keeps the mirror and the record.
claude_code_dotfiles_mirror_enabled: true
# A `*/N` minute, read as the timer's period.
claude_code_dotfiles_mirror_minute: "*/15"
claude_code_dotfiles_mirror_repo: https://github.com/DanielH2018/dotfiles.git
# homelab-claude-config-render.timer renders the unattended sessions' Claude Code config from the
# mirror's record as claude-triage-render, which only daniel-box's package.yml declares, and
# publishes it to /var/lib/homelab-claude-config. The triage and Renovate sessions read only that,
# and refuse to start without it. False drops the timer, its unit, the code and the config from
# the next package version, and keeps what was last published.
claude_code_config_render_enabled: false

# homelab-claude-weekly-summary.timer runs files/claude_weekly_summary.py as root every Monday
# at 09:00 UTC. Each run posts to the alerts webhook one summary of the previous ISO week's
# triage runs and Renovate ticks: counts, cost, denials, and each run that acted or needs a
# look. It only reads the run records. True only in daniel-box's host_vars, where triage and the
# Renovate agent ship. False drops the timer, its units and the config from the next package
# version, and keeps the posted-week record.
claude_code_weekly_summary_enabled: false
