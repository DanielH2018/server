# /tmp is a tmpfs on both Claude hosts, so every byte under it holds RAM until it is removed.
# Ubuntu's tmp.conf ages /tmp at 10d; this file ages the two trees that grow by gigabytes at 1d.
# systemd-tmpfiles-clean.timer runs the cleanup daily. A file read or written within the day
# survives, because the age counts from its newest atime, mtime or ctime.
#
# `e` cleans a directory's contents and never removes the directory itself, so a live session
# keeps its scratchpad and pytest keeps its pytest-of-<user> root. TMPDIR is /tmp/user/<uid> on
# these hosts, so pytest's tree sits there; a process without TMPDIR writes it straight to /tmp.
#Type Path Mode User Group Age
e /tmp/user/*/claude-*/*/*/scratchpad - - - 1d
e /tmp/user/*/pytest-of-* - - - 1d
e /tmp/pytest-of-* - - - 1d
