# The Claude Code host of daniel-server (H7.39) and daniel-box (H7.40,
# docs/target-architecture/host/h7-delete-ansible.md). The claude_code role ends on every host
# (`meta: end_role` in its tasks/main.yml), so this component is the one writer.
#
# What it ships, by subject:
#   - the agent user: homelab-claude-agent.service gives it its groups, home, identity and clone.
#     Each host's package.yml declares the user to the users arm, because its uid differs per
#     host, and ships the agent's per-uid login-slice cap;
#   - the Remote Control host (homelab-claude-rc.service), installed but not enabled while
#     claude_code_rc_enabled is false, its weekly restart and its failure page;
#   - the background-session resume at boot, the cgroup metrics timer, and the agent's clone and
#     dotfiles syncs;
#   - the fleet and login-session caps, and the pytest fan-out cap;
#   - the session stop alert and the fan-out alert, with the polkit rules that let a session start
#     them;
#   - the root inspector: the operator's sudo grant and the agent's socket;
#   - daniel-box's own timers and grants (H7.40's second slice): the agent's lander, the
#     server-batch lander, the pipeline timeline, the memory store copy, and the D5 takeover
#     check's wrapper and sudoers grant. Each is armed only in daniel-box's host_vars, so
#     daniel-server's package ships none of them.
#   - H7.40's fourth slice: the artifacts node's peer sync and OTLP-door heartbeat timers with
#     the directories the artifacts pod mounts;
#   - H7.40's third slice: alert-triggered triage, armed only in daniel-box's host_vars; the
#     agent's peer key and ssh config on claude_agent_ssh_key_host and its one-time memory seed,
#     both in claude-agent-setup; its homelab-ui login; and its homelab-ui browser oneshot,
#     which ships wherever the agent exists so that switching homelab-ui off takes it back. The
#     operator config subset is not shipped: the role runs it only where
#     claude_code_agent_dotfiles is false, which no host sets.
#
# The component renders the role's own templates and copies its scripts in place (`role:
# claude_code`), H4's pattern, so daniel-box's Ansible render and this package read one source.
# Each role template that names a sibling unit takes that name from a variable whose default is
# the Ansible-era name; the defaults below give the packaged names. H7.20a moves the sources here.
#
# DECIDED: the scripts keep their /usr/local paths (/usr/local/bin/rootq, the clone and dotfiles
# syncs, homelab-rootq and its socket helper). The scripts, the sudoers grant and the dotfiles'
# claude-guard allowlist name those paths. dpkg took each file the role had installed over at
# install.
#
# Each file, output and enable link carries the `when:` of the role toggle that gated its task,
# so a toggle set false in a host's host_vars still takes its subject back. The host's `users:`
# entry takes no `when:`: to switch the agent off, delete it, and the users arm expires the user.
#
# The agent's peer login: daniel-box's agent logs in here as `claude` with a key the role used
# to read over ssh from daniel-box. The package cannot read that key, so the host carries its
# public half as `claude_agent_peer_public_key` (in `defaults:` below). claude-agent-setup
# installs exactly that one line as authorized_keys, so a rotation replaces the old key. Once
# `claude_agent_ssh_login_enabled` is false, the setup script removes the file and drops the agent
# from ssh-users. While the key is blank, the file Ansible wrote stays untouched.
#
# Not shipped: the operator's own Claude Code install, which the dotfiles repo owns since H7.38.
role: claude_code
defaults:
  # The packaged unit names the role templates read (see the header).
  claude_code_rc_unit: homelab-claude-rc.service
  claude_code_rc_alert_unit: homelab-claude-rc-alert.service
  claude_code_cgroup_metrics_unit: homelab-claude-cgroup-metrics.service
  # The failure page of the syncs, the memory store copy, the server-batch lander and the
  # pipeline timeline.
  claude_code_sync_alert_unit: homelab-alert@%n.service
  # What the role computes in tasks: the agents switched on, and the group initial_setup names.
  claude_code_agents_present: [claude]
  claude_code_worktree_holders_group: worktree-holders
  # The public half of the key daniel-box's agent logs in with: one `ssh-ed25519 ...` line.
  # A rotation of that key edits this value. Blank leaves the authorized_keys Ansible wrote.
  claude_agent_peer_public_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJKVVuTPBnaLKLqpjXXSIozN+t+uzJ2Xq5deus3yau/P claude peers (daniel-box)"
  # The agent's homelab-ui browser toolchain, which homelab-claude-agent-browser.service installs
  # as the agent (H7.40's third slice, ruled 2026-10-30). A Node tarball rather than fnm: the agent
  # needs one fixed Node, and the operator's fnm lives in their home. The sha256 is the tarball's,
  # from the release's SHASUMS256.txt; a bump finishes with
  # `uv run python scripts/validate/asset_pins.py --refresh node`. x64 is literal because
  # asset_pins.py renders the URL from these defaults alone, and every has_claude_code host is
  # x86_64.
  # renovate: datasource=node-version depName=node
  claude_code_agent_node_version: "24.21.0"
  claude_code_agent_node_url: >-
    https://nodejs.org/dist/v{{ claude_code_agent_node_version
    }}/node-v{{ claude_code_agent_node_version }}-linux-x64.tar.xz
  claude_code_agent_node_sha256: fd8e59d5a511510f6a298afb548f18c7d2b1be404d8b4a27d94fbe49f56cb2d6
  # The release the operator's homelab-ui runs on daniel-box (0.0.79, measured 2026-10-09), so the
  # agent's browser behaves as the operator's does. Chromium is the revision this package's own
  # playwright pins, installed with that playwright's CLI.
  # renovate: datasource=npm depName=@playwright/mcp
  claude_code_agent_playwright_mcp_version: "0.0.83"
depends:
  - acl
  # claude-agent-browser reads and writes the agent's MCP registration as JSON.
  - jq
outputs:
  - src: templates/agent-gh-hosts.yml.j2
    path: /var/lib/claude/.config/gh/hosts.yml
    owner: claude
    group: ubuntu
    mode: "0600"
    keys: [claude_code_agent_gh_token]
    persist: false
    # claude-agent-setup links `path` to the rendered file. A package-installed link would put
    # root's write inside a directory the agent owns.
    link: false
    when: claude_code_agent_user_enabled
# Triage's credential and the agent's homelab-ui login are outputs of hosts/daniel-box/package.yml,
# not of this component: host_secrets.py names every output key a host's components declare,
# whatever its `when:`, and daniel-server's SOPS file must not carry either secret.
files:
  # The agent user.
  - {src: templates/claude-agent-setup.sh.j2, dst: /usr/lib/homelab/claude-agent-setup, mode: "0755", activate: "try-restart:homelab-claude-agent.service", when: "claude_code_agent_user_enabled"}
  - {src: templates/claude-agent-home.sh.j2, dst: /usr/lib/homelab/claude-agent-home, mode: "0755", activate: "try-restart:homelab-claude-agent.service", when: "claude_code_agent_user_enabled"}
  - {src: "role:agent-user-profile.j2", dst: /usr/lib/homelab/claude-agent/profile, activate: "try-restart:homelab-claude-agent.service", when: "claude_code_agent_user_enabled"}
  - {src: "role:agent-gitconfig.j2", dst: /usr/lib/homelab/claude-agent/gitconfig, activate: "try-restart:homelab-claude-agent.service", when: "claude_code_agent_user_enabled"}
  - {src: "role:agent-user-claude-md.j2", dst: /usr/lib/homelab/claude-agent/CLAUDE.md, activate: "try-restart:homelab-claude-agent.service", when: "claude_code_agent_user_enabled"}
  - {src: "role:agent-chezmoi-seed.toml.j2", dst: /usr/lib/homelab/claude-agent/chezmoi-seed.toml, activate: "try-restart:homelab-claude-agent.service", when: "claude_code_agent_user_enabled"}
  - {src: templates/agent-authorized-keys.j2, dst: /usr/lib/homelab/claude-agent/authorized_keys, activate: "try-restart:homelab-claude-agent.service", when: "claude_agent_ssh_login_enabled and (claude_agent_peer_public_key | trim) != ''"}
  # The key host's half of the agent's peer login (H7.40's third slice): the ssh config naming each
  # peer. claude-agent-setup generates the key beside it.
  - {src: "role:agent-ssh-config.j2", dst: /usr/lib/homelab/claude-agent/ssh-config, activate: "try-restart:homelab-claude-agent.service", when: "claude_code_agent_user_enabled and inventory_hostname == claude_agent_ssh_key_host"}
  - {src: units/homelab-claude-agent.service.j2, dst: /usr/lib/systemd/system/homelab-claude-agent.service, when: "claude_code_agent_user_enabled"}
  # The agent's homelab-ui browser. It ships while the agent exists, whatever
  # claude_code_agent_homelab_ui_enabled says: switched off, the same script takes it back.
  - {src: templates/claude-agent-browser.sh.j2, dst: /usr/lib/homelab/claude-agent-browser, mode: "0755", when: "claude_code_agent_user_enabled"}
  - {src: units/homelab-claude-agent-browser.service.j2, dst: /usr/lib/systemd/system/homelab-claude-agent-browser.service, when: "claude_code_agent_user_enabled"}
  - {src: units/homelab-claude-agent-browser.timer, dst: /usr/lib/systemd/system/homelab-claude-agent-browser.timer, when: "claude_code_agent_user_enabled"}
  # The Remote Control host.
  - {src: "role:claude-rc.service.j2", dst: /usr/lib/systemd/system/homelab-claude-rc.service}
  - {src: units/homelab-claude-rc-alert.service, dst: /usr/lib/systemd/system/homelab-claude-rc-alert.service}
  - {src: "role:claude-rc-restart.service.j2", dst: /usr/lib/systemd/system/homelab-claude-rc-restart.service}
  - {src: "role:claude-rc-restart.timer.j2", dst: /usr/lib/systemd/system/homelab-claude-rc-restart.timer}
  # Background sessions come back at boot.
  - {src: "role-file:bg_session_resume.py", dst: /usr/local/lib/claude-bg-resume/bg_session_resume.py, when: "claude_code_bg_resume_enabled"}
  - {src: "role:claude-bg-resume.service.j2", dst: /usr/lib/systemd/system/homelab-claude-bg-resume.service, when: "claude_code_bg_resume_enabled"}
  # The cgroup metrics.
  - {src: "role-file:claude-cgroup-metrics.sh", dst: /usr/local/bin/claude-cgroup-metrics.sh, mode: "0755"}
  - {src: "role:claude-cgroup-metrics.service.j2", dst: /usr/lib/systemd/system/homelab-claude-cgroup-metrics.service}
  - {src: "role:claude-cgroup-metrics.timer.j2", dst: /usr/lib/systemd/system/homelab-claude-cgroup-metrics.timer}
  # The agent's clone and dotfiles syncs. Their textfiles keep the names `claude-clone-sync` and
  # `claude-dotfiles-sync`, which observability's host-checks rules read.
  - {src: "role-file:claude-clone-sync.sh", dst: /usr/local/bin/claude-clone-sync.sh, mode: "0755", when: "claude_code_agent_user_enabled"}
  - {src: "role:claude-clone-sync.service.j2", dst: /usr/lib/systemd/system/homelab-claude-clone-sync.service, when: "claude_code_agent_user_enabled"}
  - {src: "role:claude-clone-sync.timer.j2", dst: /usr/lib/systemd/system/homelab-claude-clone-sync.timer, when: "claude_code_agent_user_enabled"}
  - {src: "role-file:claude-dotfiles-sync.sh", dst: /usr/local/bin/claude-dotfiles-sync.sh, mode: "0755", when: "claude_code_agent_user_enabled and claude_code_agent_dotfiles"}
  - {src: "role:claude-dotfiles-sync.service.j2", dst: /usr/lib/systemd/system/homelab-claude-dotfiles-sync.service, when: "claude_code_agent_user_enabled and claude_code_agent_dotfiles"}
  - {src: "role:claude-dotfiles-sync.timer.j2", dst: /usr/lib/systemd/system/homelab-claude-dotfiles-sync.timer, when: "claude_code_agent_user_enabled and claude_code_agent_dotfiles"}
  # The caps. systemd merges drop-ins by file name across /etc and /usr/lib, so these sort after
  # the Ansible-era claude-*.conf copies and their values govern while those remain. The login
  # caps cover the operator while claude_code_login_uids names uid 1000; each host's package.yml
  # caps its agent's uid.
  - {src: "role:fleet-slice-caps.conf.j2", dst: /usr/lib/systemd/system/user.slice.d/homelab-claude-fleet-caps.conf, when: "claude_code_fleet_caps_enabled"}
  - {src: "role:login-slice-caps.conf.j2", dst: /usr/lib/systemd/system/user-1000.slice.d/homelab-claude-caps.conf, when: "claude_code_login_caps_enabled and 1000 in claude_code_login_uids"}
  # Every user manager on the host reads it, where the role wrote one copy per capped home.
  - {src: "role:pytest-fanout-cap.conf.j2", dst: /usr/lib/environment.d/90-homelab-claude-pytest-cap.conf, when: "claude_code_login_caps_enabled"}
  # The stop and fan-out alerts.
  - {src: units/claude-stop-alert@.service, dst: /usr/lib/systemd/system/claude-stop-alert@.service, when: "claude_code_stop_alert_enabled"}
  - {src: "role:50-claude-stop-alert.rules.j2", dst: /usr/share/polkit-1/rules.d/50-claude-stop-alert.rules, when: "claude_code_stop_alert_enabled"}
  - {src: units/fanout-alert@.service, dst: /usr/lib/systemd/system/fanout-alert@.service, when: "claude_code_fanout_alert_enabled"}
  - {src: "role:50-claude-fanout-alert.rules.j2", dst: /usr/share/polkit-1/rules.d/50-claude-fanout-alert.rules, when: "claude_code_fanout_alert_enabled"}
  # The root inspector.
  - {src: "role-file:homelab_rootq.py", dst: /usr/local/sbin/homelab-rootq, mode: "0755", when: "claude_code_rootq_enabled"}
  - {src: "role-file:rootq.sh", dst: /usr/local/bin/rootq, mode: "0755", when: "claude_code_rootq_enabled"}
  - {src: "role:claude-rootq.sudoers.j2", dst: /etc/sudoers.d/homelab-rootq, mode: "0440", when: "claude_code_rootq_enabled"}
  - {src: "role-file:homelab_rootq_socket.py", dst: /usr/local/libexec/homelab-rootq-socket, mode: "0700", when: "claude_code_rootq_socket_armed"}
  - {src: "role-file:rootq_socket.py", dst: /usr/local/bin/rootq-socket, mode: "0755", when: "claude_code_rootq_socket_armed"}
  - {src: "role:homelab-rootq.socket.j2", dst: /usr/lib/systemd/system/homelab-rootq.socket, when: "claude_code_rootq_socket_armed"}
  - {src: "role:homelab-rootq@.service.j2", dst: /usr/lib/systemd/system/homelab-rootq@.service, when: "claude_code_rootq_socket_armed"}
  # The agent's lander. Its name and settings are pinned in the role's claude-land-pins.j2, so
  # no inventory value reaches them. The rule ships under /usr/share, where the Ansible-era copy
  # in /etc shadows it until reconcile retires that copy.
  - {src: "role:claude-land-approval-paths.j2", dst: /etc/claude-land/approval-paths, when: "claude_code_agent_user_enabled and claude_code_lander_enabled"}
  - {src: "role:claude-land@.service.j2", dst: /usr/lib/systemd/system/homelab-claude-land@.service, when: "claude_code_agent_user_enabled and claude_code_lander_enabled"}
  - {src: "role:50-claude-land.rules.j2", dst: /usr/share/polkit-1/rules.d/50-claude-land.rules, when: "claude_code_agent_user_enabled and claude_code_lander_enabled"}
  # The server-batch lander, the pipeline timeline and the memory store copy. Their textfiles keep
  # the names `claude-fanout-server-lander`, `claude-pipeline-timeline` and `claude-memory-sync`,
  # which observability's host-checks rules read.
  - {src: "role:claude-fanout-server-lander.service.j2", dst: /usr/lib/systemd/system/homelab-claude-fanout-server-lander.service, when: "claude_code_fanout_server_lander_enabled"}
  - {src: "role:claude-fanout-server-lander.timer.j2", dst: /usr/lib/systemd/system/homelab-claude-fanout-server-lander.timer, when: "claude_code_fanout_server_lander_enabled"}
  - {src: "role:claude-pipeline-timeline.service.j2", dst: /usr/lib/systemd/system/homelab-claude-pipeline-timeline.service, when: "claude_code_pipeline_timeline_enabled"}
  - {src: "role:claude-pipeline-timeline.timer.j2", dst: /usr/lib/systemd/system/homelab-claude-pipeline-timeline.timer, when: "claude_code_pipeline_timeline_enabled"}
  - {src: "role:claude-memory-sync.service.j2", dst: /usr/lib/systemd/system/homelab-claude-memory-sync.service, when: "claude_code_memory_sync_enabled"}
  - {src: "role:claude-memory-sync.timer.j2", dst: /usr/lib/systemd/system/homelab-claude-memory-sync.timer, when: "claude_code_memory_sync_enabled"}
  # The D5 takeover check: the wrapper and the grant land in one package version, so the grant
  # never names a missing command. The flux CLI it runs is homelab-tools', which daniel-box's
  # package depends on, and the wrapper creates its own state directory.
  - {src: "role-file:homelab-takeover-check.sh", dst: /usr/local/sbin/homelab-takeover-check, mode: "0755", when: "claude_code_takeover_check_enabled"}
  - {src: "role:claude-takeover-check.sudoers.j2", dst: /etc/sudoers.d/homelab-takeover-check, mode: "0440", when: "claude_code_takeover_check_enabled"}
  # The artifacts node's peer sync and OTLP-door heartbeat (H7.40's fourth slice), and the
  # directories the artifacts pod mounts. They push to nothing: each logs a `status=` line and
  # writes a textfile (M6 batch B6a's Cutover-2). The tags and textfiles keep the names
  # `sync-artifacts` and `claude-otel-health`, which Loki, `probe.py alerts` and observability's
  # host-checks rules read.
  - {src: tmpfiles.d/homelab-artifacts.conf.j2, dst: /usr/lib/tmpfiles.d/homelab-artifacts.conf, when: "inventory_hostname == claude_code_artifacts_node"}
  - {src: templates/sync-artifacts.sh.j2, dst: /usr/lib/homelab/sync-artifacts, mode: "0755", when: "inventory_hostname == claude_code_artifacts_node"}
  - {src: units/homelab-sync-artifacts.service.j2, dst: /usr/lib/systemd/system/homelab-sync-artifacts.service, when: "inventory_hostname == claude_code_artifacts_node"}
  - {src: units/homelab-sync-artifacts.timer.j2, dst: /usr/lib/systemd/system/homelab-sync-artifacts.timer, when: "inventory_hostname == claude_code_artifacts_node"}
  - {src: templates/claude-otel-health.sh.j2, dst: /usr/lib/homelab/claude-otel-health, mode: "0755", when: "inventory_hostname == claude_code_artifacts_node"}
  - {src: units/homelab-claude-otel-health.service.j2, dst: /usr/lib/systemd/system/homelab-claude-otel-health.service, when: "inventory_hostname == claude_code_artifacts_node"}
  - {src: units/homelab-claude-otel-health.timer.j2, dst: /usr/lib/systemd/system/homelab-claude-otel-health.timer, when: "inventory_hostname == claude_code_artifacts_node"}
  # Alert-triggered triage (H7.40's third slice). Its caps and identity are pinned in the role's
  # claude-triage-pins.j2, which every triage template imports, so no inventory value reaches them.
  # The code and its config are root-owned, so a session cannot change what the next run executes.
  - {src: "role-file:claude_triage_run.py", dst: /opt/claude-triage/claude_triage_run.py, when: "claude_code_agent_user_enabled and claude_code_triage_enabled"}
  - {src: "role-file:claude_triage_poll.py", dst: /opt/claude-triage/claude_triage_poll.py, when: "claude_code_agent_user_enabled and claude_code_triage_enabled"}
  - {lib: host_lib.py, dst: /opt/claude-triage/host_lib.py, when: "claude_code_agent_user_enabled and claude_code_triage_enabled"}
  - {lib: kuma_push.py, dst: /opt/claude-triage/kuma_push.py, when: "claude_code_agent_user_enabled and claude_code_triage_enabled"}
  - {src: "role:claude-triage-prompt.txt.j2", dst: /opt/claude-triage/prompt.txt, when: "claude_code_agent_user_enabled and claude_code_triage_enabled"}
  - {src: "role:claude-triage-config.env.j2", dst: /etc/claude-triage/config.env, when: "claude_code_agent_user_enabled and claude_code_triage_enabled"}
  - {src: "role:claude-triage-tmpfiles.conf.j2", dst: /usr/lib/tmpfiles.d/homelab-claude-triage.conf, when: "claude_code_agent_user_enabled and claude_code_triage_enabled"}
  - {src: "role:claude-triage@.service.j2", dst: /usr/lib/systemd/system/claude-triage@.service, when: "claude_code_agent_user_enabled and claude_code_triage_enabled"}
  - {src: "role:claude-triage-report-alert@.service.j2", dst: /usr/lib/systemd/system/claude-triage-report-alert@.service, when: "claude_code_agent_user_enabled and claude_code_triage_enabled"}
  - {src: "role:claude-triage-poll.service.j2", dst: /usr/lib/systemd/system/homelab-claude-triage-poll.service, when: "claude_code_agent_user_enabled and claude_code_triage_enabled"}
  - {src: "role:claude-triage-poll.timer.j2", dst: /usr/lib/systemd/system/homelab-claude-triage-poll.timer, when: "claude_code_agent_user_enabled and claude_code_triage_enabled"}
  - {src: units/homelab-claude-triage-poll-alert.service, dst: /usr/lib/systemd/system/homelab-claude-triage-poll-alert.service, when: "claude_code_agent_user_enabled and claude_code_triage_enabled"}
  - {src: "role:50-claude-triage.rules.j2", dst: /usr/share/polkit-1/rules.d/50-claude-triage.rules, when: "claude_code_agent_user_enabled and claude_code_triage_enabled"}
units:
  # A restart drops every session the host runs, so a changed unit waits for the operator.
  homelab-claude-rc.service: {policy: manual}
  # Its job is the next boot; a restart would respawn sessions the operator stopped.
  homelab-claude-bg-resume.service: {policy: manual, when: claude_code_bg_resume_enabled}
enable:
  homelab-claude-agent.service: {target: multi-user.target, when: claude_code_agent_user_enabled}
  homelab-claude-agent-browser.timer: {target: timers.target, when: claude_code_agent_user_enabled}
  homelab-claude-rc.service: {target: multi-user.target, when: claude_code_rc_enabled}
  homelab-claude-rc-restart.timer: {target: timers.target, when: claude_code_rc_enabled}
  homelab-claude-bg-resume.service: {target: multi-user.target, when: claude_code_bg_resume_enabled}
  homelab-claude-cgroup-metrics.timer: timers.target
  homelab-claude-clone-sync.timer: {target: timers.target, when: claude_code_agent_user_enabled}
