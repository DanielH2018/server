  homelab-sync-artifacts.timer:
    target: timers.target
    when: inventory_hostname == claude_code_artifacts_node
  homelab-claude-otel-health.timer:
    target: timers.target
    when: inventory_hostname == claude_code_artifacts_node
# What the role installed. Reconcile retires each unit not shipped under its old name (disable,
# stop, remove), and hands off each /etc copy of a unit shipped under the same name.
# Retiring claude-rc.service stops the Remote Control host and drops the phone's sessions, so the
# PR that adds this list merges in a window the operator picks. Retiring claude-land@.service
# leaves a landing already running to finish, but a session that started before the agent's
# profile changed still hands its next landing to the retired name.
legacy:
  # Not Ansible-era: the textfiles a disarmed timer leaves behind. Reconcile stops the dropped
  # unit in step 1, before it retires these, so a run in flight cannot write one back.
  - path: /var/lib/node-exporter-textfile/fanout_operator_waits.prom
    when: not claude_code_fanout_server_lander_enabled
  - path: /var/lib/node-exporter-textfile/claude-fanout-server-lander.prom
    when: not claude_code_fanout_server_lander_enabled
  - path: /var/lib/node-exporter-textfile/claude-pipeline-timeline.prom
    when: not claude_code_pipeline_timeline_enabled
  - {unit: claude-rc.service}
  - {unit: claude-rc-alert.service}
  - {unit: claude-rc-restart.service}
  - {unit: claude-rc-restart.timer}
  - {unit: claude-bg-resume.service}
  - {unit: claude-cgroup-metrics.service}
  - {unit: claude-cgroup-metrics.timer}
  - {unit: claude-clone-sync.service}
  - {unit: claude-clone-sync.timer}
  - {unit: claude-clone-sync-alert.service}
  - {unit: claude-dotfiles-sync.service}
  - {unit: claude-dotfiles-sync.timer}
  - {unit: claude-dotfiles-sync-alert.service}
  - {unit: claude-stop-alert@.service}
  - {unit: fanout-alert@.service}
  - {unit: homelab-rootq.socket}
  - {unit: homelab-rootq@.service}
  - {unit: claude-land@.service}
  - {unit: claude-land-alert.service}
  - {unit: claude-fanout-server-lander.service}
  - {unit: claude-fanout-server-lander.timer}
  - {unit: claude-fanout-server-lander-alert.service}
  - {unit: claude-pipeline-timeline.service}
  - {unit: claude-pipeline-timeline.timer}
  - {unit: claude-pipeline-timeline-alert.service}
  - {unit: claude-memory-sync.service}
  - {unit: claude-memory-sync.timer}
  - {unit: claude-memory-sync-alert.service}
  - {unit: claude-triage@.service}
  - {unit: claude-triage-report-alert@.service}
  - {unit: claude-triage-poll.service}
  - {unit: claude-triage-poll.timer}
