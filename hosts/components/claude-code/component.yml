# The Claude Code host of daniel-server and daniel-box.
#
# What it ships, by subject:
#   - the agent user: homelab-claude-agent.service gives it its groups, home, identity and clone.
#     Each host's package.yml declares the user to the users arm, because its uid differs per
#     host, and ships the agent's per-uid login-slice cap;
#   - the Remote Control host (homelab-claude-rc.service), installed but not enabled while
#     claude_code_rc_enabled is false, its weekly restart and its failure page;
#   - the background-session resume at boot, the cgroup metrics timer, and the agent's clone and
#     dotfiles syncs;
#   - the fleet and login-session caps, and the pytest fan-out cap;
#   - the session stop alert and the fan-out alert, with the polkit rules that let a session start
#     them;
#   - the root inspector: the operator's sudo grant and the agent's socket;
#   - daniel-box's own timers and grants: the agent's lander, the server-batch lander, the
#     pipeline timeline, the memory store copy, and the D5 takeover check's wrapper and sudoers
#     grant. Each is armed only in daniel-box's host_vars, so daniel-server's package ships none
#     of them;
#   - the artifacts node's peer sync and OTLP-door heartbeat timers with the directories the
#     artifacts pod mounts;
#   - alert-triggered triage, armed only in daniel-box's host_vars; the agent's peer key and ssh
#     config on claude_agent_ssh_key_host and its one-time memory seed, both in
#     claude-agent-setup; its homelab-ui login; and its homelab-ui browser oneshot, which ships
#     wherever the agent exists so that switching homelab-ui off takes it back. The operator
#     config subset is not shipped.
#
# Templates, scripts and defaults sit beside this file (`templates/`, `files/` and
# `defaults/main.yml`); the renderer loads defaults/main.yml beneath the `defaults:` below. Each
# template that names a sibling unit takes that name from a variable, which the `defaults:` below
# set to the packaged name. Each host's package.yml reaches them with `component: claude-code`.
#
# DECIDED: the scripts keep their /usr/local paths (/usr/local/bin/rootq, the clone and dotfiles
# syncs, homelab-rootq and its socket helper). The scripts, the sudoers grant and the dotfiles'
# claude-guard allowlist name those paths.
#
# A subject a host can switch off carries the `when:` of its toggle, so the toggle set false in
# the host's host_vars takes the subject back; a subject every host ships carries none. The
# host's `users:` entry takes no `when:`: to switch the agent off, delete it, and the users arm
# expires the user.
#
# The agent's peer login: daniel-box's agent logs in here as `claude`. The package cannot read
# the key, so the host carries its public half as `claude_agent_peer_public_key` (in `defaults:`
# below). claude-agent-setup installs exactly that one line as authorized_keys, so a rotation
# replaces the old key. Once `claude_agent_ssh_login_enabled` is false, the setup script removes
# the file and drops the agent from ssh-users. While the key is blank, an existing
# authorized_keys file stays untouched.
#
# Not shipped: the operator's own Claude Code install, which the dotfiles repo owns.
defaults:
  # The packaged unit names the templates read (see the header).
  claude_code_rc_unit: homelab-claude-rc.service
  claude_code_rc_alert_unit: homelab-claude-rc-alert.service
  claude_code_cgroup_metrics_unit: homelab-claude-cgroup-metrics.service
  # The failure page of the syncs, the memory store copy, the server-batch lander and the
  # pipeline timeline.
  claude_code_sync_alert_unit: homelab-alert@%n.service
  # What the role computes in tasks: the agents switched on, and the group initial_setup names.
  claude_code_agents_present: [claude]
  claude_code_worktree_holders_group: worktree-holders
  # The public half of the key daniel-box's agent logs in with: one `ssh-ed25519 ...` line.
  # A rotation of that key edits this value. Blank leaves an existing authorized_keys untouched.
  claude_agent_peer_public_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJKVVuTPBnaLKLqpjXXSIozN+t+uzJ2Xq5deus3yau/P claude peers (daniel-box)"
  # The agent's homelab-ui browser toolchain, which homelab-claude-agent-browser.service installs
  # as the agent. A Node tarball rather than fnm: the agent
  # needs one fixed Node, and the operator's fnm lives in their home. The sha256 is the tarball's,
  # from the release's SHASUMS256.txt; a bump finishes with
  # `uv run python scripts/validate/asset_pins.py --refresh node`. x64 is literal because
  # asset_pins.py renders the URL from these defaults alone, and every host listing this
  # component is x86_64.
  # renovate: datasource=node-version depName=node
  claude_code_agent_node_version: "24.21.0"
  claude_code_agent_node_url: >-
    https://nodejs.org/dist/v{{ claude_code_agent_node_version
    }}/node-v{{ claude_code_agent_node_version }}-linux-x64.tar.xz
  claude_code_agent_node_sha256: fd8e59d5a511510f6a298afb548f18c7d2b1be404d8b4a27d94fbe49f56cb2d6
  # The release the operator's homelab-ui runs on daniel-box, so the
  # agent's browser behaves as the operator's does. Chromium is the revision this package's own
  # playwright pins, installed with that playwright's CLI.
  # renovate: datasource=npm depName=@playwright/mcp
  claude_code_agent_playwright_mcp_version: "0.0.84"
depends:
  - acl
  # claude-agent-browser reads and writes the agent's MCP registration as JSON.
  - jq
outputs:
  - src: templates/agent-gh-hosts.yml.j2
    path: /var/lib/claude/.config/gh/hosts.yml
    owner: claude
    group: ubuntu
    mode: "0600"
    keys: [claude_code_agent_gh_token]
    persist: false
    # claude-agent-setup links `path` to the rendered file. A package-installed link would put
    # root's write inside a directory the agent owns.
    link: false
    when: claude_code_agent_user_enabled
# Triage's credential and the agent's homelab-ui login are outputs of hosts/daniel-box/package.yml,
# not of this component: host_secrets.py names every output key a host's components declare,
# whatever its `when:`, and daniel-server's SOPS file must not carry either secret.
files:
  - {src: templates/claude-agent-setup.sh.j2, dst: /usr/lib/homelab/claude-agent-setup, mode: "0755", activate: "try-restart:homelab-claude-agent.service", when: "claude_code_agent_user_enabled"}
  - {src: templates/claude-agent-home.sh.j2, dst: /usr/lib/homelab/claude-agent-home, mode: "0755", activate: "try-restart:homelab-claude-agent.service", when: "claude_code_agent_user_enabled"}
  - {src: templates/agent-user-profile.j2, dst: /usr/lib/homelab/claude-agent/profile, activate: "try-restart:homelab-claude-agent.service", when: "claude_code_agent_user_enabled"}
  - {src: templates/agent-gitconfig.j2, dst: /usr/lib/homelab/claude-agent/gitconfig, activate: "try-restart:homelab-claude-agent.service", when: "claude_code_agent_user_enabled"}
  - {src: templates/agent-user-claude-md.j2, dst: /usr/lib/homelab/claude-agent/CLAUDE.md, activate: "try-restart:homelab-claude-agent.service", when: "claude_code_agent_user_enabled"}
  - {src: templates/agent-chezmoi-seed.toml.j2, dst: /usr/lib/homelab/claude-agent/chezmoi-seed.toml, activate: "try-restart:homelab-claude-agent.service", when: "claude_code_agent_user_enabled"}
  - {src: templates/agent-authorized-keys.j2, dst: /usr/lib/homelab/claude-agent/authorized_keys, activate: "try-restart:homelab-claude-agent.service", when: "claude_agent_ssh_login_enabled and (claude_agent_peer_public_key | trim) != ''"}
  # The key host's half of the agent's peer login: the ssh config naming each
  # peer. claude-agent-setup generates the key beside it.
  - {src: templates/agent-ssh-config.j2, dst: /usr/lib/homelab/claude-agent/ssh-config, activate: "try-restart:homelab-claude-agent.service", when: "claude_code_agent_user_enabled and inventory_hostname == claude_agent_ssh_key_host"}
  - {src: units/homelab-claude-agent.service.j2, dst: /usr/lib/systemd/system/homelab-claude-agent.service, when: "claude_code_agent_user_enabled"}
  # The agent's homelab-ui browser. It ships while the agent exists, whatever
  # claude_code_agent_homelab_ui_enabled says: switched off, the same script takes it back.
  - {src: templates/claude-agent-browser.sh.j2, dst: /usr/lib/homelab/claude-agent-browser, mode: "0755", when: "claude_code_agent_user_enabled"}
  - {src: units/homelab-claude-agent-browser.service.j2, dst: /usr/lib/systemd/system/homelab-claude-agent-browser.service, when: "claude_code_agent_user_enabled"}
  - {src: units/homelab-claude-agent-browser.timer, dst: /usr/lib/systemd/system/homelab-claude-agent-browser.timer, when: "claude_code_agent_user_enabled"}
  - {src: templates/claude-rc.service.j2, dst: /usr/lib/systemd/system/homelab-claude-rc.service}
  - {src: units/homelab-claude-rc-alert.service, dst: /usr/lib/systemd/system/homelab-claude-rc-alert.service}
  - {src: templates/claude-rc-restart.service.j2, dst: /usr/lib/systemd/system/homelab-claude-rc-restart.service}
  - {src: templates/claude-rc-restart.timer.j2, dst: /usr/lib/systemd/system/homelab-claude-rc-restart.timer}
  - {src: files/bg_session_resume.py, dst: /usr/local/lib/claude-bg-resume/bg_session_resume.py}
  - {src: templates/claude-bg-resume.service.j2, dst: /usr/lib/systemd/system/homelab-claude-bg-resume.service}
  - {src: files/claude-cgroup-metrics.sh, dst: /usr/local/bin/claude-cgroup-metrics.sh, mode: "0755"}
  - {src: templates/claude-cgroup-metrics.service.j2, dst: /usr/lib/systemd/system/homelab-claude-cgroup-metrics.service}
  - {src: templates/claude-cgroup-metrics.timer.j2, dst: /usr/lib/systemd/system/homelab-claude-cgroup-metrics.timer}
  # The guardrail audit ships armed or not, because its own run is the way out.
  - {src: templates/claude-guardrail-audit.sh.j2, dst: /usr/lib/homelab/claude-guardrail-audit, mode: "0755"}
  - {src: units/homelab-claude-guardrail-audit.service.j2, dst: /usr/lib/systemd/system/homelab-claude-guardrail-audit.service}
  - {src: units/homelab-claude-guardrail-audit.timer.j2, dst: /usr/lib/systemd/system/homelab-claude-guardrail-audit.timer}
  - {src: files/claude_guardrail_ack.py, dst: /usr/lib/homelab/claude-guardrail-ack/claude_guardrail_ack.py, when: "claude_code_guardrail_ack_enabled"}
  - {lib: host_lib.py, dst: /usr/lib/homelab/claude-guardrail-ack/host_lib.py, when: "claude_code_guardrail_ack_enabled"}
  - {src: templates/claude-guardrail-ack.json.j2, dst: /etc/homelab/claude-guardrail-ack.json, when: "claude_code_guardrail_ack_enabled"}
  - {src: units/homelab-claude-guardrail-ack.service.j2, dst: /usr/lib/systemd/system/homelab-claude-guardrail-ack.service, when: "claude_code_guardrail_ack_enabled"}
  - {src: units/homelab-claude-guardrail-ack.timer.j2, dst: /usr/lib/systemd/system/homelab-claude-guardrail-ack.timer, when: "claude_code_guardrail_ack_enabled"}
  - {src: files/claude_dotfiles_mirror.py, dst: /usr/lib/homelab/claude-dotfiles-mirror/claude_dotfiles_mirror.py, when: "claude_code_dotfiles_mirror_enabled"}
  - {lib: host_lib.py, dst: /usr/lib/homelab/claude-dotfiles-mirror/host_lib.py, when: "claude_code_dotfiles_mirror_enabled"}
  - {src: templates/claude-dotfiles-mirror.json.j2, dst: /etc/homelab/claude-dotfiles-mirror.json, when: "claude_code_dotfiles_mirror_enabled"}
  - {src: templates/claude-dotfiles-allowed-signers.j2, dst: /etc/claude-dotfiles/allowed_signers, when: "claude_code_dotfiles_mirror_enabled"}
  - {src: units/homelab-claude-dotfiles-mirror.service.j2, dst: /usr/lib/systemd/system/homelab-claude-dotfiles-mirror.service, when: "claude_code_dotfiles_mirror_enabled"}
  - {src: units/homelab-claude-dotfiles-mirror.timer.j2, dst: /usr/lib/systemd/system/homelab-claude-dotfiles-mirror.timer, when: "claude_code_dotfiles_mirror_enabled"}
  - {src: files/claude_weekly_summary.py, dst: /usr/lib/homelab/claude-weekly-summary/claude_weekly_summary.py, when: "claude_code_weekly_summary_enabled"}
  - {lib: host_lib.py, dst: /usr/lib/homelab/claude-weekly-summary/host_lib.py, when: "claude_code_weekly_summary_enabled"}
  - {src: templates/claude-weekly-summary.json.j2, dst: /etc/homelab/claude-weekly-summary.json, when: "claude_code_weekly_summary_enabled"}
  - {src: units/homelab-claude-weekly-summary.service.j2, dst: /usr/lib/systemd/system/homelab-claude-weekly-summary.service, when: "claude_code_weekly_summary_enabled"}
  - {src: units/homelab-claude-weekly-summary.timer.j2, dst: /usr/lib/systemd/system/homelab-claude-weekly-summary.timer, when: "claude_code_weekly_summary_enabled"}
  # The render of the unattended sessions' Claude Code config from the mirror's verified tag.
  # Each session component ships its overlay into overlays/.
  - {src: files/claude_config_render.py, dst: /usr/lib/homelab/claude-config-render/claude_config_render.py, when: "claude_code_config_render_enabled"}
  - {lib: claude_config_lock.py, dst: /usr/lib/homelab/claude-config-render/claude_config_lock.py, when: "claude_code_config_render_enabled"}
  - {src: files/claude-config-render-chezmoi.toml, dst: /usr/lib/homelab/claude-config-render/chezmoi.toml, when: "claude_code_config_render_enabled"}
  - {src: units/homelab-claude-config-render.service.j2, dst: /usr/lib/systemd/system/homelab-claude-config-render.service, when: "claude_code_config_render_enabled"}
  - {src: units/homelab-claude-config-render.timer.j2, dst: /usr/lib/systemd/system/homelab-claude-config-render.timer, when: "claude_code_config_render_enabled"}
  # The agent's clone and dotfiles syncs. Their textfiles keep the names `claude-clone-sync` and
  # `claude-dotfiles-sync`, which observability's host-checks rules read.
  - {src: files/claude-clone-sync.sh, dst: /usr/local/bin/claude-clone-sync.sh, mode: "0755", when: "claude_code_agent_user_enabled"}
  - {src: templates/claude-clone-sync.service.j2, dst: /usr/lib/systemd/system/homelab-claude-clone-sync.service, when: "claude_code_agent_user_enabled"}
  - {src: templates/claude-clone-sync.timer.j2, dst: /usr/lib/systemd/system/homelab-claude-clone-sync.timer, when: "claude_code_agent_user_enabled"}
  - {src: files/claude-dotfiles-sync.sh, dst: /usr/local/bin/claude-dotfiles-sync.sh, mode: "0755", when: "claude_code_agent_user_enabled and claude_code_agent_dotfiles"}
  - {src: templates/claude-dotfiles-sync.service.j2, dst: /usr/lib/systemd/system/homelab-claude-dotfiles-sync.service, when: "claude_code_agent_user_enabled and claude_code_agent_dotfiles"}
  - {src: templates/claude-dotfiles-sync.timer.j2, dst: /usr/lib/systemd/system/homelab-claude-dotfiles-sync.timer, when: "claude_code_agent_user_enabled and claude_code_agent_dotfiles"}
  # The caps. These drop-ins sort after any claude-*.conf copy in /etc, so their values govern
  # while one remains. The login caps cover the operator while claude_code_login_uids names uid
  # 1000; each host's package.yml caps its agent's uid.
  - {src: templates/fleet-slice-caps.conf.j2, dst: /usr/lib/systemd/system/user.slice.d/homelab-claude-fleet-caps.conf}
  - {src: templates/login-slice-caps.conf.j2, dst: /usr/lib/systemd/system/user-1000.slice.d/homelab-claude-caps.conf, when: "1000 in claude_code_login_uids"}
  # Every user manager on the host reads it.
  - {src: templates/pytest-fanout-cap.conf.j2, dst: /usr/lib/environment.d/90-homelab-claude-pytest-cap.conf}
  - {src: units/claude-stop-alert@.service, dst: /usr/lib/systemd/system/claude-stop-alert@.service}
  - {src: templates/50-claude-stop-alert.rules.j2, dst: /usr/share/polkit-1/rules.d/50-claude-stop-alert.rules}
  - {src: units/fanout-alert@.service, dst: /usr/lib/systemd/system/fanout-alert@.service}
  - {src: templates/50-claude-fanout-alert.rules.j2, dst: /usr/share/polkit-1/rules.d/50-claude-fanout-alert.rules}
  - {src: files/homelab_rootq.py, dst: /usr/local/sbin/homelab-rootq, mode: "0755"}
  - {src: files/rootq.sh, dst: /usr/local/bin/rootq, mode: "0755"}
  - {src: templates/claude-rootq.sudoers.j2, dst: /etc/sudoers.d/homelab-rootq, mode: "0440"}
  - {src: files/homelab_rootq_socket.py, dst: /usr/local/libexec/homelab-rootq-socket, mode: "0700"}
  - {src: files/rootq_socket.py, dst: /usr/local/bin/rootq-socket, mode: "0755"}
  - {src: templates/homelab-rootq.socket.j2, dst: /usr/lib/systemd/system/homelab-rootq.socket}
  - {src: templates/homelab-rootq@.service.j2, dst: /usr/lib/systemd/system/homelab-rootq@.service}
  # The agent's lander. Its name and settings are pinned in templates/claude-land-pins.j2, so
  # no inventory value reaches them. An /etc copy of the rule shadows the one under /usr/share
  # until reconcile retires it.
  - {src: templates/claude-land-approval-paths.j2, dst: /etc/claude-land/approval-paths, when: "claude_code_agent_user_enabled and claude_code_lander_enabled"}
  - {src: templates/claude-land@.service.j2, dst: /usr/lib/systemd/system/homelab-claude-land@.service, when: "claude_code_agent_user_enabled and claude_code_lander_enabled"}
  - {src: templates/50-claude-land.rules.j2, dst: /usr/share/polkit-1/rules.d/50-claude-land.rules, when: "claude_code_agent_user_enabled and claude_code_lander_enabled"}
  # The server-batch lander, the pipeline timeline and the memory store copy. Their textfiles keep
  # the names `claude-fanout-server-lander`, `claude-pipeline-timeline` and `claude-memory-sync`,
  # which observability's host-checks rules read.
  - {src: templates/claude-fanout-server-lander.service.j2, dst: /usr/lib/systemd/system/homelab-claude-fanout-server-lander.service, when: "claude_code_fanout_server_lander_enabled"}
  - {src: templates/claude-fanout-server-lander.timer.j2, dst: /usr/lib/systemd/system/homelab-claude-fanout-server-lander.timer, when: "claude_code_fanout_server_lander_enabled"}
  - {src: templates/claude-pipeline-timeline.service.j2, dst: /usr/lib/systemd/system/homelab-claude-pipeline-timeline.service, when: "claude_code_pipeline_timeline_enabled"}
  - {src: templates/claude-pipeline-timeline.timer.j2, dst: /usr/lib/systemd/system/homelab-claude-pipeline-timeline.timer, when: "claude_code_pipeline_timeline_enabled"}
  - {src: templates/claude-memory-sync.service.j2, dst: /usr/lib/systemd/system/homelab-claude-memory-sync.service, when: "claude_code_memory_sync_enabled"}
  - {src: templates/claude-memory-sync.timer.j2, dst: /usr/lib/systemd/system/homelab-claude-memory-sync.timer, when: "claude_code_memory_sync_enabled"}
  # The D5 takeover check: the wrapper and the grant land in one package version, so the grant
  # never names a missing command. The flux CLI it runs is homelab-tools', which daniel-box's
  # package depends on, and the wrapper creates its own state directory.
  - {src: files/homelab-takeover-check.sh, dst: /usr/local/sbin/homelab-takeover-check, mode: "0755", when: "claude_code_takeover_check_enabled"}
  - {src: templates/claude-takeover-check.sudoers.j2, dst: /etc/sudoers.d/homelab-takeover-check, mode: "0440", when: "claude_code_takeover_check_enabled"}
  # The artifacts node's peer sync and OTLP-door heartbeat, and the directories the artifacts pod
  # mounts. They push to nothing: each logs a `status=` line and writes a textfile. The tags and
  # textfiles keep the names `sync-artifacts` and `claude-otel-health`, which Loki and
  # observability's host-checks rules read.
  - {src: tmpfiles.d/homelab-artifacts.conf.j2, dst: /usr/lib/tmpfiles.d/homelab-artifacts.conf, when: "inventory_hostname == claude_code_artifacts_node"}
  - {src: templates/sync-artifacts.sh.j2, dst: /usr/lib/homelab/sync-artifacts, mode: "0755", when: "inventory_hostname == claude_code_artifacts_node"}
  - {src: units/homelab-sync-artifacts.service.j2, dst: /usr/lib/systemd/system/homelab-sync-artifacts.service, when: "inventory_hostname == claude_code_artifacts_node"}
  - {src: units/homelab-sync-artifacts.timer.j2, dst: /usr/lib/systemd/system/homelab-sync-artifacts.timer, when: "inventory_hostname == claude_code_artifacts_node"}
  - {src: templates/claude-otel-health.sh.j2, dst: /usr/lib/homelab/claude-otel-health, mode: "0755", when: "inventory_hostname == claude_code_artifacts_node"}
  - {src: units/homelab-claude-otel-health.service.j2, dst: /usr/lib/systemd/system/homelab-claude-otel-health.service, when: "inventory_hostname == claude_code_artifacts_node"}
  - {src: units/homelab-claude-otel-health.timer.j2, dst: /usr/lib/systemd/system/homelab-claude-otel-health.timer, when: "inventory_hostname == claude_code_artifacts_node"}
  # Alert-triggered triage. Its caps and identity are pinned in
  # templates/claude-triage-pins.j2, which every triage template imports, so no inventory value reaches them.
  # The code and its config are root-owned, so a session cannot change what the next run executes.
  - {src: files/claude_triage_run.py, dst: /opt/claude-triage/claude_triage_run.py, when: "claude_code_agent_user_enabled and claude_code_triage_enabled"}
  - {src: files/claude_triage_poll.py, dst: /opt/claude-triage/claude_triage_poll.py, when: "claude_code_agent_user_enabled and claude_code_triage_enabled"}
  - {src: files/claude_triage_session.py, dst: /opt/claude-triage/claude_triage_session.py, when: "claude_code_agent_user_enabled and claude_code_triage_enabled"}
  - {src: files/claude-triage-settings-overlay.json, dst: /usr/lib/homelab/claude-config-render/overlays/triage.json, when: "claude_code_agent_user_enabled and claude_code_triage_enabled"}
  # No unit of its own: reconcile starts an enabled unit and waits for it, and a cold first run
  # (Claude Code, a full clone, a full uv sync) could outlast that wait and hold the host. The
  # runner runs it before each episode instead.
  - {src: templates/claude-triage-setup.sh.j2, dst: /usr/lib/homelab/claude-triage-setup, mode: "0755", when: "claude_code_agent_user_enabled and claude_code_triage_enabled"}
  - {lib: host_lib.py, dst: /opt/claude-triage/host_lib.py, when: "claude_code_agent_user_enabled and claude_code_triage_enabled"}
  - {lib: claude_config_lock.py, dst: /opt/claude-triage/claude_config_lock.py, when: "claude_code_agent_user_enabled and claude_code_triage_enabled"}
  - {src: templates/claude-triage-prompt.txt.j2, dst: /opt/claude-triage/prompt.txt, when: "claude_code_agent_user_enabled and claude_code_triage_enabled"}
  - {src: templates/claude-triage-config.env.j2, dst: /etc/claude-triage/config.env, when: "claude_code_agent_user_enabled and claude_code_triage_enabled"}
  - {src: templates/claude-triage-tmpfiles.conf.j2, dst: /usr/lib/tmpfiles.d/homelab-claude-triage.conf, when: "claude_code_agent_user_enabled and claude_code_triage_enabled"}
  - {src: templates/claude-triage@.service.j2, dst: /usr/lib/systemd/system/claude-triage@.service, when: "claude_code_agent_user_enabled and claude_code_triage_enabled"}
  - {src: templates/claude-triage-report-alert@.service.j2, dst: /usr/lib/systemd/system/claude-triage-report-alert@.service, when: "claude_code_agent_user_enabled and claude_code_triage_enabled"}
  - {src: templates/claude-triage-session.service.j2, dst: /usr/lib/systemd/system/homelab-claude-triage-session.service, when: "claude_code_agent_user_enabled and claude_code_triage_enabled"}
  - {src: templates/claude-triage-poll.service.j2, dst: /usr/lib/systemd/system/homelab-claude-triage-poll.service, when: "claude_code_agent_user_enabled and claude_code_triage_enabled"}
  - {src: templates/claude-triage-poll.timer.j2, dst: /usr/lib/systemd/system/homelab-claude-triage-poll.timer, when: "claude_code_agent_user_enabled and claude_code_triage_enabled"}
  - {src: units/homelab-claude-triage-poll-alert.service, dst: /usr/lib/systemd/system/homelab-claude-triage-poll-alert.service, when: "claude_code_agent_user_enabled and claude_code_triage_enabled"}
  - {src: templates/50-claude-triage.rules.j2, dst: /usr/share/polkit-1/rules.d/50-claude-triage.rules, when: "claude_code_agent_user_enabled and claude_code_triage_enabled"}
units:
  # A restart drops every session the host runs, so a changed unit waits for the operator.
  homelab-claude-rc.service: {policy: manual}
  # Its job is the next boot; a restart would respawn sessions the operator stopped.
  homelab-claude-bg-resume.service: {policy: manual}
  # Started by claude-triage@ for one episode's session; a package install never starts it.
  homelab-claude-triage-session.service:
    policy: manual
    when: claude_code_agent_user_enabled and claude_code_triage_enabled
enable:
  homelab-claude-agent.service: {target: multi-user.target, when: claude_code_agent_user_enabled}
  homelab-claude-agent-browser.timer: {target: timers.target, when: claude_code_agent_user_enabled}
  homelab-claude-rc.service: {target: multi-user.target, when: claude_code_rc_enabled}
  homelab-claude-rc-restart.timer: {target: timers.target, when: claude_code_rc_enabled}
  homelab-claude-bg-resume.service: multi-user.target
  homelab-claude-cgroup-metrics.timer: timers.target
  homelab-claude-guardrail-audit.timer: timers.target
  homelab-claude-guardrail-ack.timer: {target: timers.target, when: claude_code_guardrail_ack_enabled}
  homelab-claude-dotfiles-mirror.timer: {target: timers.target, when: claude_code_dotfiles_mirror_enabled}
  homelab-claude-weekly-summary.timer: {target: timers.target, when: claude_code_weekly_summary_enabled}
  homelab-claude-config-render.timer: {target: timers.target, when: claude_code_config_render_enabled}
  homelab-claude-clone-sync.timer: {target: timers.target, when: claude_code_agent_user_enabled}
  homelab-claude-dotfiles-sync.timer:
    target: timers.target
    when: claude_code_agent_user_enabled and claude_code_agent_dotfiles
  homelab-rootq.socket: sockets.target
  homelab-claude-fanout-server-lander.timer:
    target: timers.target
    when: claude_code_fanout_server_lander_enabled
  homelab-claude-pipeline-timeline.timer:
    target: timers.target
    when: claude_code_pipeline_timeline_enabled
  homelab-claude-memory-sync.timer: {target: timers.target, when: claude_code_memory_sync_enabled}
  homelab-claude-triage-poll.timer:
    target: timers.target
    when: claude_code_agent_user_enabled and claude_code_triage_enabled
  homelab-sync-artifacts.timer:
    target: timers.target
    when: inventory_hostname == claude_code_artifacts_node
  homelab-claude-otel-health.timer:
    target: timers.target
    when: inventory_hostname == claude_code_artifacts_node
# Names the role once installed. Reconcile retires each unit not shipped under its old name
# (disable, stop, remove), and hands off each /etc copy of a unit shipped under the same name.
# Retiring claude-rc.service stops the Remote Control host and drops the phone's sessions.
legacy:
  # The textfiles a disarmed timer leaves behind. Reconcile stops the dropped
  # unit in step 1, before it retires these, so a run in flight cannot write one back.
  - path: /var/lib/node-exporter-textfile/fanout_operator_waits.prom
    when: not claude_code_fanout_server_lander_enabled
  - path: /var/lib/node-exporter-textfile/claude-fanout-server-lander.prom
    when: not claude_code_fanout_server_lander_enabled
  - path: /var/lib/node-exporter-textfile/claude-pipeline-timeline.prom
    when: not claude_code_pipeline_timeline_enabled
  - path: /var/lib/node-exporter-textfile/claude-guardrail-ack.prom
    when: not claude_code_guardrail_ack_enabled
  - path: /var/lib/node-exporter-textfile/claude-dotfiles-mirror.prom
    when: not claude_code_dotfiles_mirror_enabled
  - path: /var/lib/node-exporter-textfile/claude-weekly-summary.prom
    when: not claude_code_weekly_summary_enabled
  - {unit: claude-rc.service}
  - {unit: claude-rc-alert.service}
  - {unit: claude-rc-restart.service}
  - {unit: claude-rc-restart.timer}
  - {unit: claude-bg-resume.service}
  - {unit: claude-cgroup-metrics.service}
  - {unit: claude-cgroup-metrics.timer}
  - {unit: claude-clone-sync.service}
  - {unit: claude-clone-sync.timer}
  - {unit: claude-clone-sync-alert.service}
  - {unit: claude-dotfiles-sync.service}
  - {unit: claude-dotfiles-sync.timer}
  - {unit: claude-dotfiles-sync-alert.service}
  - {unit: claude-stop-alert@.service}
  - {unit: fanout-alert@.service}
  - {unit: homelab-rootq.socket}
  - {unit: homelab-rootq@.service}
  - {unit: claude-land@.service}
  - {unit: claude-land-alert.service}
  - {unit: claude-fanout-server-lander.service}
  - {unit: claude-fanout-server-lander.timer}
  - {unit: claude-fanout-server-lander-alert.service}
  - {unit: claude-pipeline-timeline.service}
  - {unit: claude-pipeline-timeline.timer}
  - {unit: claude-pipeline-timeline-alert.service}
  - {unit: claude-memory-sync.service}
  - {unit: claude-memory-sync.timer}
  - {unit: claude-memory-sync-alert.service}
  - {unit: claude-triage@.service}
  - {unit: claude-triage-report-alert@.service}
  - {unit: claude-triage-poll.service}
  - {unit: claude-triage-poll.timer}
  - {unit: claude-triage-alert.service}
  - {unit: claude-triage-poll-alert.service}
  - {path: /etc/claude-rc/alert-webhook.env}
  - {path: /etc/claude-rc}
  - {path: /etc/claude-stop-alert/alert-webhook.env}
  - {path: /etc/claude-stop-alert}
  - {path: /etc/claude-fanout/alert-webhook.env}
  - {path: /etc/claude-fanout}
  - {path: /etc/polkit-1/rules.d/50-claude-stop-alert.rules}
  - {path: /etc/polkit-1/rules.d/50-claude-fanout-alert.rules}
  - {path: /etc/sudoers.d/claude-rootq}
  - {path: /etc/sudoers.d/claude-takeover-check}
  - {path: /etc/polkit-1/rules.d/50-claude-land.rules}
  - {path: /etc/claude-land/alert-webhook.env}
  - {path: /etc/claude-code-alerts/alert-webhook.env}
  - {path: /etc/claude-code-alerts}
  - {path: "/home/{{ sys_user }}/.config/environment.d/90-claude-pytest-cap.conf"}
  - {path: /var/lib/claude/.config/environment.d/90-claude-pytest-cap.conf}
  - {path: /etc/polkit-1/rules.d/50-claude-triage.rules}
  - {path: /etc/claude-triage/alert-webhook.env}
  # The triage credential's former EnvironmentFile=.
  - {path: /etc/claude-triage/session.env}
  - {path: /var/lib/homelab/setup-deployed-manifest.d/claude-code-triage}
  - {path: /var/lib/homelab/setup-render-manifest.d/claude-code}
  - {path: /var/lib/homelab/setup-render-manifest.d/claude-code-ansible}
  - {path: /var/lib/homelab/setup-deployed-manifest.d/claude-code-bg-resume}
  - {path: /var/lib/homelab/setup-deployed-manifest.d/claude-code-cgroup-metrics}
  - {path: /var/lib/homelab/setup-deployed-manifest.d/claude-code-clone-sync}
  - {path: /var/lib/homelab/setup-deployed-manifest.d/claude-code-dotfiles-sync}
  # The artifacts node's two crons, their scripts, which embedded the push
  # tokens, and their render stamp.
  - {cron_file: sync-artifacts}
  - {cron_file: claude-otel-health}
  - {path: /usr/local/bin/sync-artifacts.sh}
  - {path: /usr/local/bin/claude-otel-health.sh}
  - {path: /var/lib/homelab/setup-render-manifest.d/claude-code-node-crons}
  # The takeover check's former flux copy and its pin stamp.
  # Reconcile only rmdirs a directory, so its two files come first.
  - {path: /usr/local/lib/homelab-takeover-check/flux}
  - {path: /usr/local/lib/homelab-takeover-check/flux.sha256}
  - {path: /usr/local/lib/homelab-takeover-check}
