# Removes /var/lib/kuma-check, the down-marker directory of the retired kuma-check-* timers.
# Nothing writes there: the checks' markers live under /var/lib/homelab/check/.
#
# Reconcile retires each legacy key once, and a marker written after its key retired has no entry
# left to remove it. So every entry below spells its path with `/./`, which gives it a key of its
# own; reconcile reads the path through pathlib, which collapses the `/./` to the same file. The
# names are every check that ever wrote a marker here.
#
# reconcile removes a directory only once it is empty, so the directory goes last, and each host
# package lists this component last, after every component whose own legacy entries name a marker.
#
# ENFORCED: hosts/lib/tests/test_kuma_check_marker_dir.py
legacy:
  - {path: /var/lib/kuma-check/./github-ruleset-drift.down}
  - {path: /var/lib/kuma-check/./github-interaction-limit.down}
  - {path: /var/lib/kuma-check/./setup-drift.down}
  - {path: /var/lib/kuma-check/./secret-rotation-audit.down}
  - {path: /var/lib/kuma-check/./loki-read-route.down}
  - {path: /var/lib/kuma-check/./loki-route-witness.down}
  - {path: /var/lib/kuma-check/./render-records.down}
  - {path: /var/lib/kuma-check/./manifest-prune.down}
  - {path: /var/lib/kuma-check/./live-drift.down}
  - {path: /var/lib/kuma-check/./remember-logs.down}
  - {path: /var/lib/kuma-check}
