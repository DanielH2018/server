---
# What github-ruleset-drift and github-interaction-limit compare the repo with.
github_repo: DanielH2018/server

# --- The MERGE gate, which is a different thing from `ci_required_contexts` in group_vars ---
#
# `ci_required_contexts` is what a deploy waits for on master. The list here is what GitHub's
# ruleset requires before a PR can merge at all, and it is a superset: `renovate config
# validator` gates merges while deliberately not gating deploys, and `pull + boot changed
# images` is required for merges but has no `push:` trigger, so it never produces a check run on
# master and could never be waited on. `flux-deletion-drill` is the same shape: it runs
# on `pull_request` only, skips itself when no deletion path changed, and always reports (#6042).
#
# Declared here so github-ruleset-drift.sh can compare it against the live ruleset daily. That
# comparison is the whole point: this list is a hand-copy of remote state that can silently go
# stale. Reconcile this list when the drift
# monitor fires — do not edit the ruleset to match the list.
github_ruleset_id: 20912512
github_expected_ruleset_contexts:
  - prek (lint + validate + tests + secrets)
  - pull + boot changed images
  - renovate config validator
  - flux-deletion-drill
# The app every required context is pinned to: 15368 is GitHub Actions. GitHub matches an unpinned
# required check by name alone, so a commit status of that name from any token with write access
# satisfies it. Three of the four contexts were unpinned until the operator pinned them on
# 2026-11-13 (#8398). tested_tree.py and slice B3 of docs/ci-throughput.md trust a check's creator,
# which only the pin guarantees, so the drift check fails on a context with no pin or another app.
github_actions_app_id: 15368
# Nobody merges past the CI gate. A bypass actor added here could merge an un-CI'd PR, through
# land.sh's REST merge or any other merge call it makes. Each entry is
# `<actor_type>:<actor_id>:<bypass_mode>`, as the rulesets API names them.
github_ruleset_bypass_actors: []
# The CI gate's pull_request rule: every change to master arrives as a PR, and none needs an
# approving review. GitHub's auto-merge never applies a bypass, so a non-zero count leaves every
# auto-merged PR BLOCKED. The operator chose on 2026-10-11 that PRs from the operator's account
# and the agent's account both auto-merge once CI is green. D12's update restriction ended that
# on 2026-11-13: it blocks every auto-merge, for the reason this comment gives, and land.sh's
# direct merge is the one way onto master.
github_ruleset_required_approvals: 0

# The branch-protection ruleset ("Default": `deletion` + `non_fast_forward` on every ref, admin
# bypass only) must exclude Renovate's branches, or GitHub refuses the app's post-merge delete
# and its rebase force-push. A merged branch then survives at its green SHA and the next
# version's PR automerges empty off that stale verdict. The drift
# check alerts when the exclusion is missing; it never writes the ruleset.
github_branch_ruleset_id: 17358590
github_branch_ruleset_renovate_exclude: refs/heads/renovate/**

# The fence ruleset ("agent branch fence", created 2026-10-05): creating, updating and deleting
# a branch is restricted everywhere except the exclusions below. The agent's GitHub account is
# not a bypass actor, so it cannot push onto a branch an operator session or Renovate opened,
# where the next landing of that branch would carry its commit to master. An exclusion added to
# the live ruleset is a branch the agent can push to, so the drift check compares the list
# exactly. Master is excluded because the update restriction below owns it. The CI gate's
# pull_request rule still stops any account pushing to master without a PR.
github_fence_ruleset_id: 24517167
github_fence_ruleset_exclude:
  # github_update_restriction_rulesets owns master.
  - refs/heads/master
  # EnterWorktree names a `claude/<slug>` worktree's branch `worktree-claude+<slug>`: it
  # replaces `/` with `+` (observed 2026-10-05). `worktree-claude-*` would also match operator
  # branches such as worktree-claude-agent-github-identity.
  - refs/heads/worktree-claude+**
github_fence_ruleset_bypass_actors:
  # `always`, because the operator's sessions and Renovate push branches, not only merge PRs.
  - RepositoryRole:5:always
  - Integration:2740:always

# The update restrictions (dotfiles#967 D12 and D13, created by the operator on 2026-11-13). Each
# lets only its bypass actors update its refs: this repo's master, and the dotfiles repo's `main`
# and every tag. Every landing path merges as the admin through land.sh or bin/land, which applies
# the bypass; GitHub's auto-merge applies none, so an auto-merge on master stays BLOCKED for any
# account. The drift check compares the target, the refs, the rules and the bypass list exactly.
# The master one also carries `deletion` and `non_fast_forward`, which "Default" already applies
# to every branch; they are pinned as they are live.
github_update_restriction_rulesets:
  - repo: DanielH2018/server
    id: 27167149
    target: branch
    include: [refs/heads/master]
    rules: [deletion, non_fast_forward, update]
    bypass: [Integration:2740:always, RepositoryRole:5:always]
  - repo: DanielH2018/dotfiles
    id: 27167230
    target: branch
    include: [refs/heads/main]
    rules: [update]
    bypass: [RepositoryRole:5:always]
  - repo: DanielH2018/dotfiles
    id: 27167303
    target: tag
    include: ["~ALL"]
    rules: [creation, deletion, update]
    bypass: [RepositoryRole:5:always]

# Daily, offset from the other daniel-box health crons. Rulesets change on a human cadence, and
# the endpoint is rate-limited per source IP (60/hr unauthenticated, shared with renovate_notify),
# so this is a safety net rather than a control loop.
github_ruleset_drift_cron_hour: "6"
github_ruleset_drift_cron_minute: "40"

# Whose fork pull requests wait for a collaborator's approval before any workflow runs. A runner
# pod takes a job from any workflow run in this repo, so the policy that makes every author
# outside the repo wait is a condition of ADR-0032. The drift check alerts when the live policy
# differs; it never writes the setting. It is under Settings, Actions, General.
github_fork_approval_policy: all_external_contributors

# The repo's GitHub interaction limit: who may comment, react, open issues and open PRs on a
# repo that stays public. `collaborators_only` closes every one of those to anyone not listed
# as a collaborator; `none` clears the limit. GitHub caps the setting at six months and lets it
# lapse silently, so github-interaction-limit.sh re-applies it daily — a PUT with the same body
# resets the expiry. Change the declaration here, never in the GitHub UI: the cron applies
# whatever this says on its next run. Ten minutes after the ruleset check, same token budget.
github_interaction_limit_repos:
  - DanielH2018/server
  # Every operator session applies the dotfiles repo's main branch to its own home directory.
  - DanielH2018/dotfiles
github_interaction_limit: collaborators_only
github_interaction_limit_expiry: six_months
github_interaction_limit_cron_hour: "6"
github_interaction_limit_cron_minute: "50"
