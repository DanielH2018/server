# Shipped by the host package's integrity-scans component. needrestart evals this file as perl.
# Restarting homelab-rkhunter-propupd.service from the apt hook deadlocks: the running unit waits
# for the dpkg lock that the apt run holds, and the blocking restart waits for the unit.
$nrconf{override_rc}{qr(^homelab-rkhunter-propupd\.service$)} = 0;
