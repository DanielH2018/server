# Lets every user on a k3s node run `ssh daniel-pi`: the name and the Pi's pinned host key.
#
# Neither node's resolver has a record for the Pi, so without the /etc/hosts line `ssh daniel-pi`
# and `probe.py pi` end "Could not resolve hostname". The regexp anchors on the NAME, so a new Pi
# address rewrites the line rather than adding a second one. Neither node's /etc/hosts carries the
# header cloud-init writes when `manage_etc_hosts` lets it regenerate the file at boot.
#
# /etc/ssh/ssh_known_hosts pins the Pi's key from `ssh_host_ed25519_key` in
# hosts/daniel-pi/vars.yml under the name and the address. Without it `ssh daniel-pi`
# ends "Host key verification failed" for a user with no per-user known_hosts entry, such as the
# agent user. No session accepts a changed key: re-pinning is the operator's edit to host_vars.
#
# daniel-pi does not list this component: it never connects to itself.
#
# REVERSE: dropping this component makes dpkg remove /etc/ssh/ssh_known_hosts. The line arm
# never removes a line, so the /etc/hosts entry stays until it is deleted by hand.
#
# hosts/tests/pi/test_server_names_daniel_pi.py holds the name and the pin on each node.
lines:
  - {path: /etc/hosts, line: "{{ hosts['daniel-pi'].server_ip }} daniel-pi", regexp: '^\S+\s+daniel-pi(\s|$)', mode: "0644"}
files:
  - {src: templates/ssh_known_hosts.j2, dst: /etc/ssh/ssh_known_hosts}
