# Managed by Ansible (initial_setup role) — edits here are overwritten.
# Discard info/debug for every facility that reaches rsyslog through journald, so
# raising MaxLevelSyslog to info restores the auth trail without growing syslog.
if ($syslogseverity >= 6) and ($syslogfacility-text != "auth") and ($syslogfacility-text != "authpriv") and ($syslogfacility-text != "kern") and ($syslogfacility-text != "mail") then {
    stop
}
