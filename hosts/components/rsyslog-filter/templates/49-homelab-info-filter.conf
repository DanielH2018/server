# Shipped by the host package — edits here are overwritten.
# Discard info/debug for every facility that reaches rsyslog through journald, so
# raising MaxLevelSyslog to info restores the auth trail without growing syslog.
if ($syslogseverity >= 6) and ($syslogfacility-text != "auth") and ($syslogfacility-text != "authpriv") and ($syslogfacility-text != "kern") and ($syslogfacility-text != "mail") then {
    stop
}

# Discards martian-source lines between two pod IPs (k3s_pod_cidr); formats of the 6.8 and 7.0
# kernels. Other martians stay logged, but their `ll header:` hex line is discarded too.
if ($syslogfacility-text == "kern") and (re_match($msg, "martian source (10\\.42\\.[0-9.]+ from 10\\.42\\.|\\(src=10\\.42\\.[0-9.]+, dst=10\\.42\\.)") or ($msg contains "ll header: ")) then {
    stop
}
