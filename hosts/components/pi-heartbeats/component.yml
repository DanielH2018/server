# The Pi's five heartbeats. Each script runs as a oneshot service on a timer, as sys_user. The
# recovery unit grants that user the `docker` group itself, with `SupplementaryGroups=docker`,
# because no task adds sys_user to it on a rebuilt Pi. No unit loads a credential.
#
# - homelab-pi-sd-health, every 5 minutes: the root filesystem's ext4 errors_count, the
#   rotated-log integrity verdict and the log2ram mount, written to pi-sd-health.prom in
#   node_exporter's textfile directory, where PiSdHealthFailed reads it.
# - homelab-pi-gz-integrity, daily at 01:40: `gzip -t` over every rotated log, written as the
#   verdict the SD-health heartbeat reads. It alerts nothing itself.
# - homelab-pi-recovery, every 5 minutes: the contract below.
# - homelab-pi-watchdog-health, every 5 minutes: watchdog.service's state, written to
#   pi-watchdog-health.prom, where PiWatchdogFailed reads it. It reports a stopped daemon and never
#   starts one, because initial_setup stops the daemon on purpose for the length of an apply.
# - homelab-pi-audit-health, every 5 minutes: auditd.service's state and the time of the last
#   write to audit.log, written to pi-audit-health.prom, where PiAuditFailed reads it. Its unit
#   takes the `adm` group to read the log. It reports a suspended auditd and never restarts one.
#
# Beside them, one log copier: homelab-pi-journal-warnings, every minute, appends the journal's
# new warning-and-above lines to /var/log/pi-health/journal.log, which the Pi's Alloy ships to
# Loki. The journal sits on log2ram's tmpfs, so a hard reboot erases it and Loki keeps the copy.
defaults:
  # Both roots: log2ram sync corruption shows in /var/hdd.log (SD copy), not /var/log (RAM tmpfs).
  optimize_pi_gz_integrity_roots:
    - /var/log
    - /var/hdd.log
  # A glob matching nothing passes gzip -t, so the sweep needs a minimum file count.
  optimize_pi_gz_integrity_min_files: 40
  # Under /var/lib, not /var/log: log2ram's tmpfs loses the verdict on reboot.
  optimize_pi_gz_integrity_state_file: /var/lib/pi-health/gz-integrity.state
  # Longer than the daily period (tolerates one missed run), shorter than two.
  optimize_pi_gz_integrity_max_age_h: 26
  # Ships true: restart: unless-stopped does not restart a container whose create failed. Disarming
  # ends the heartbeat too: the verdict goes stale and PiRecoveryNotReporting fires.
  optimize_pi_recovery_restart_enabled: true
files:
  - {src: templates/pi-sd-health.sh.j2, dst: /usr/lib/homelab/pi-sd-health, mode: "0755"}
  - {src: templates/pi-gz-integrity.sh.j2, dst: /usr/lib/homelab/pi-gz-integrity, mode: "0755"}
  - {src: templates/pi-recovery-health.sh.j2, dst: /usr/lib/homelab/pi-recovery-health, mode: "0755"}
  - {src: templates/pi-watchdog-health.sh.j2, dst: /usr/lib/homelab/pi-watchdog-health, mode: "0755"}
  - {src: templates/pi-audit-health.sh.j2, dst: /usr/lib/homelab/pi-audit-health, mode: "0755"}
  - {shared: homelab-check-lib.sh, dst: /usr/lib/homelab/homelab-check-lib.sh}
  # A plain file at the path optimize_pi wrote, so dpkg takes it over on unpack.
  - {src: templates/pi-health.logrotate.j2, dst: /etc/logrotate.d/pi-health}
  - {src: units/homelab-pi-sd-health.service.j2, dst: /usr/lib/systemd/system/homelab-pi-sd-health.service}
  - {src: units/homelab-pi-sd-health.timer, dst: /usr/lib/systemd/system/homelab-pi-sd-health.timer}
  - {src: units/homelab-pi-gz-integrity.service.j2, dst: /usr/lib/systemd/system/homelab-pi-gz-integrity.service}
  - {src: units/homelab-pi-gz-integrity.timer, dst: /usr/lib/systemd/system/homelab-pi-gz-integrity.timer}
  - {src: units/homelab-pi-recovery.service.j2, dst: /usr/lib/systemd/system/homelab-pi-recovery.service}
  - {src: units/homelab-pi-recovery.timer, dst: /usr/lib/systemd/system/homelab-pi-recovery.timer}
  - {src: units/homelab-pi-watchdog-health.service.j2, dst: /usr/lib/systemd/system/homelab-pi-watchdog-health.service}
  - {src: units/homelab-pi-watchdog-health.timer, dst: /usr/lib/systemd/system/homelab-pi-watchdog-health.timer}
  - {src: units/homelab-pi-audit-health.service.j2, dst: /usr/lib/systemd/system/homelab-pi-audit-health.service}
  - {src: units/homelab-pi-audit-health.timer, dst: /usr/lib/systemd/system/homelab-pi-audit-health.timer}
  - {src: units/homelab-pi-journal-warnings.service.j2, dst: /usr/lib/systemd/system/homelab-pi-journal-warnings.service}
  - {src: units/homelab-pi-journal-warnings.timer, dst: /usr/lib/systemd/system/homelab-pi-journal-warnings.timer}
enable:
  homelab-pi-sd-health.timer: timers.target
  homelab-pi-gz-integrity.timer: timers.target
  homelab-pi-recovery.timer: {target: timers.target, when: optimize_pi_recovery_restart_enabled}
  homelab-pi-watchdog-health.timer: timers.target
  homelab-pi-audit-health.timer: timers.target
  homelab-pi-journal-warnings.timer: timers.target
