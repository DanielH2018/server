# daniel-box's daily secret-rotation audit as a packaged timer (H7.10c, docs/target-
# architecture/host/h7-delete-ansible.md). Until H7.36 the initial_setup role installed it as the
# Ansible-era `kuma-check-secret-rotation-audit` timer, gated on `has_gitops`, which is true on
# daniel-box alone. It loads no credential. Nothing here rotates a secret: docs/secret-rotation.md
# has the tiers and each one's runbook.
#
# - homelab-secret-rotation-audit, daily 08:30: scripts/secrets_mgmt/secret_rotation.py audit
#   --verdict. It exits 1 after a `down` verdict, so Restart=on-failure reruns it every 30 minutes
#   until the verdict is up, and its boot unit reruns it once at
#   boot while the last verdict was not up (#4495).
#
# Autonomous-role contract (the audit only reads and reports; it changes no credential).
#
# - Scope / exclusions: the audit reads `secrets/secret_rotation.yml`, the key list of
#   `secrets/secrets.yml`, those files' git history, and the `gh` token's auth status. It writes only its journal line and its textfile, and stages nothing.
# - Mode (explicit and reversible): the timer's and the boot unit's enable links in this package
#   arm them. Dropping a link from a package version, or reverting this component, stops that unit
#   on the install that drops it (reconcile's step 1).
#   `systemctl stop homelab-secret-rotation-audit.timer` on daniel-box stops the audit until the
#   next package install.
# - Authoritative sources: `secrets/secret_rotation.yml` and the key list of
#   `secrets/secrets.yml` in the primary checkout.
# - Abort valves: a run that cannot source the check library or enter the checkout exits 1
#   before it reads anything. The audit changes no state, so it holds no lock.
# - Required evidence, every run: a `status=<up|down>` line tagged secret-rotation-audit in the
#   journal, and secret-rotation-audit.prom in node_exporter's textfile directory, which
#   SecretRotationAuditFailed and SecretRotationAuditNotReporting read.
# - Next-run review: a `down` verdict names its cause on the summary line. An overdue secret is
#   rotated by the runbook in docs/secret-rotation.md, and the verdict clears within 30 minutes.
#
# ENFORCED: hosts/tests/test_host_check_textfiles.py (the audit's behaviour
# against stubs), hosts/tests/test_cron_scripts_publish_via_pr.py and
# hosts/lib/tests/test_secret_rotation_component.py (the units and the legacy entries).
files:
  - {src: templates/secret-rotation-audit.sh.j2, dst: /usr/lib/homelab/secret-rotation-audit, mode: "0755"}
  - {src: units/homelab-secret-rotation-audit.service.j2, dst: /usr/lib/systemd/system/homelab-secret-rotation-audit.service}
  - {src: units/homelab-secret-rotation-audit.timer, dst: /usr/lib/systemd/system/homelab-secret-rotation-audit.timer}
  - {src: units/homelab-secret-rotation-audit-boot.service, dst: /usr/lib/systemd/system/homelab-secret-rotation-audit-boot.service}
enable:
  homelab-secret-rotation-audit.timer: timers.target
  homelab-secret-rotation-audit-boot.service: multi-user.target
# What initial_setup installed before H7.36. Reconcile retires each once the timers above have
# started, so a rotation or an audit never runs twice or not at all.
legacy:
  - {cron: "Weekly secret rotation (auto tier)", user: "{{ sys_user }}"}
  - {cron: "Daily secret rotation audit", user: "{{ sys_user }}"}
  - {path: /usr/local/bin/secret-rotate.sh}
  - {path: /usr/local/bin/secret-rotation-audit.sh}
  - {path: /var/lib/homelab/setup-render-manifest.d/secret-rotation}
