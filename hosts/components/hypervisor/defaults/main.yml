---
# Groups that let sys_user reach qemu:///system without sudo. Both are needed: libvirt for
# the daemon socket, kvm for /dev/kvm itself.
hypervisor_user_groups:
  - libvirt
  - kvm

# The staging NAT network.
#
# DECIDED: 192.168.140.0/24, chosen against a census of what daniel-server actually routes
# rather than by picking an unused-looking number (2026-08-27). In use there: 10.0.0.0/24
# (LAN), 10.42.0.0/16 and 10.43.0.0/16 (k3s pods and services), 10.200.0.0/16 and
# 172.17.0.0/16 (bridges left by the retired Docker install), and 192.168.122.0/24
# (libvirt's own `default`, defined-but-stopped). Sitting outside 10/8 entirely means a
# future k3s or Docker range cannot grow into it.
# ENFORCED by ansible/tests/staging/test_staging_network.py, which re-checks the overlap.
hypervisor_staging_net_name: staging
# DECIDED: the live network's UUID (`virsh net-uuid staging`, 2026-11-07). `net-define` replaces an
# existing network only when the UUIDs match, and libvirt refuses a same-name define under any other
# UUID even after net-undefine, which failed the apply on 2026-09-11 (#1175). A rebuilt host takes
# the same value.
hypervisor_staging_net_uuid: 255b2bc3-f6fa-4a2f-9d0c-8c14507eb82a
hypervisor_staging_net_bridge: virbr-stage
# The egress fence attached to the guest's interface. Named rather than inlined because two
# places must agree on the string: the filter definition and the domain's <filterref>.
hypervisor_staging_nwfilter_name: staging-egress-fence
hypervisor_staging_net_gateway: 192.168.140.1
hypervisor_staging_net_netmask: 255.255.255.0
# The dynamic range deliberately excludes the drill guest's reservation.
hypervisor_staging_net_dhcp_start: 192.168.140.50
hypervisor_staging_net_dhcp_end: 192.168.140.99

# The Ubuntu cloud image every guest on this host is built from, and the local copy that is
# kept so a rebuild does not re-download it. Only the etcd restore drill's throwaway guest
# reads these.
# The path deliberately does NOT end in `_image`: in a setup role's defaults that suffix means
# a container image pin, and scripts/tests/test_renovate_managers.py reads every such key as one
# Renovate must be able to bump. This is a file on disk, so an `_image` name would fail that
# guard.
hypervisor_base_image_url: https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img
# DECIDED: pin the checksum even though `current` rotates (2026-08-27). Upstream moves this
# roughly monthly, so a host that has not downloaded the image yet WILL eventually fail here
# — which is the intended failure. A drill guest silently built from a different image than the
# one reviewed defeats the point of having a reviewed substrate. Re-pin from
# https://cloud-images.ubuntu.com/noble/current/SHA256SUMS when it fails.
hypervisor_base_image_sha256: d0fe84bb5f80853425fa6be28e2c106f30104c3cfe8611933f2e65c9b63f0e30
hypervisor_base_image_path: /var/lib/libvirt/images/noble-server-cloudimg-amd64.img

# ── The etcd restore drill guest ─────────────────────────────────────────────────────────
#
# A THROWAWAY guest that exists only while a FULL etcd restore drill runs in it.
# `scripts/backup/etcd_restore_drill.sh` restores the newest off-box snapshot into a
# scratch data-dir and reads the object graph back — but `k3s server --cluster-reset` assumes it
# is the only k3s on the host, and on daniel-box every workaround found the next thing it assumes
# (five structural failures, listed in that script's header). A guest with no k3s of its own has
# none of them, so the drill script runs there UNMODIFIED: the orchestrator below makes the guest
# look like a k3s server node whose k3s is stopped — binary, token file, R2 env file at the paths
# the script already reads — which is exactly the rebuilt-host shape a real restore would face.
#
# DECIDED: transient domain (`virsh create`), never `virsh define`. A transient domain vanishes when it is destroyed, and its
# disk is recreated from the base image on every run and deleted on every exit, pass or fail. That
# is the answer to the issue's cleanup constraint: no restored etcd database, token copy or R2
# credential outlives the run anywhere. What persists is under hypervisor_etcd_drill_log_dir —
# the drill's stdout plus k3s's restore.log and server.log, none of which carry a credential —
# pruned at hypervisor_etcd_drill_log_retention_days.
#
# Sizing: the drill runs one API server against one restored etcd (~8 MB compressed snapshot) and
# nothing else — no kubelet, no CNI, no pods. Measured on daniel-box at 6 s of CPU for
# the restore stage. 2 GiB / 2 vCPU / 20 G is generous; the cloud image itself needs ~2.5 G.
hypervisor_etcd_drill_armed: true
# The drill's files, under a directory the package owns.
hypervisor_etcd_drill_share_dir: /usr/lib/homelab/etcd-drill
# The cadence (`etcd_drill_full_cron`) and the deadline derived from it
# (`etcd_drill_full_kuma_interval_s`, named for the Kuma tile it sized until M6 batch B4) live in
# group_vars/all.yml. The orchestrator renders the deadline as its textfile's DEADLINE_S.

# Guest identity. The MAC is the staging network's one DHCP reservation (the guest attaches to
# that NAT network and its egress fence — it needs internet for R2 and nothing on the LAN), fixed
# so the orchestrator can name the address it waits for. Outside the dynamic range, and never in
# the inventory: nothing but the orchestrator ever reaches it.
hypervisor_etcd_drill_vm_hostname: etcd-drill
hypervisor_etcd_drill_vm_mac: "52:54:00:5a:11:e1"
hypervisor_etcd_drill_vm_ip: 192.168.140.11
hypervisor_etcd_drill_vm_memory_mib: 2048
hypervisor_etcd_drill_vm_vcpus: 2
hypervisor_etcd_drill_vm_disk_size: 20G
# Built from hypervisor_base_image_path, the one pinned cloud image on this host. The disk is the
# per-run copy; the orchestrator creates and deletes it.
hypervisor_etcd_drill_vm_disk: /var/lib/libvirt/images/{{ hypervisor_etcd_drill_vm_hostname }}.qcow2
hypervisor_etcd_drill_vm_xml: "{{ hypervisor_etcd_drill_share_dir }}/{{ hypervisor_etcd_drill_vm_hostname }}.xml"
hypervisor_etcd_drill_vm_seed_dir: /var/lib/libvirt/seed/{{ hypervisor_etcd_drill_vm_hostname }}
hypervisor_etcd_drill_vm_seed: /var/lib/libvirt/images/{{ hypervisor_etcd_drill_vm_hostname }}-seed.iso
# The guest's ssh HOST key is generated once here and seeded through cloud-init, so the
# orchestrator can pin it. Every run is a fresh disk, so a guest-generated host key would change
# every run and the orchestrator would have to accept any key — and anything else that ever lands
# on this bridge could then answer for this address and be handed the cluster token and the R2
# credentials. Pinning closes that.
hypervisor_etcd_drill_vm_hostkey: "{{ hypervisor_etcd_drill_vm_seed_dir }}/ssh_host_ed25519_key"
# What the rendered user-data carries in place of the three keys only the host holds.
# etcd-drill-prepare swaps each for the host's value.
hypervisor_etcd_drill_vm_ssh_key: "@OPERATOR_PUBLIC_KEY@"
hypervisor_etcd_drill_vm_hostkey_private: "@GUEST_HOST_KEY_PRIVATE@"
hypervisor_etcd_drill_vm_hostkey_public: "@GUEST_HOST_KEY_PUBLIC@"
hypervisor_etcd_drill_vm_boot_timeout: 300

# Where the orchestrator lives and what it writes.
hypervisor_etcd_drill_runner_path: /usr/lib/homelab/etcd-restore-drill-vm
hypervisor_etcd_drill_prepare_path: /usr/lib/homelab/etcd-drill-prepare
# The guest-side half, a plain file copied into the guest beside the drill script; its header
# says why the snapshot is fetched with curl and drilled as a local file.
hypervisor_etcd_drill_guest_script_path: "{{ hypervisor_etcd_drill_share_dir }}/etcd-drill-guest-run.sh"
# scripts/backup/etcd_restore_drill.sh, which the package ships. Reading it straight out of
# /home/<user>/server would make the timer depend on whatever that checkout holds.
hypervisor_etcd_drill_script_path: "{{ hypervisor_etcd_drill_share_dir }}/etcd-restore-drill.sh"
# Read by the orchestrator, copied INTO the guest as /etc/rancher/k3s/etcd-s3.env for the drill's
# run, and deleted with the guest. 0600 root: these are the R2 write credentials for the bucket
# that also holds every Longhorn backup — the same residency daniel-box already carries in
# /etc/rancher/k3s/etcd-s3.env, and on this host too because the drill has to fetch its snapshot
# from somewhere and the guest cannot reach daniel-box through the fence. The token the guest also
# needs is this host's own K3S_TOKEN from the k3s-agent unit's env file: k3s writes the same value
# to server/token and server/node-token when no --agent-token is set, and the join copied
# node-token here. A wrong token fails the restore stage loudly (the bootstrap blob cannot be
# decrypted), so it cannot pass by accident.
hypervisor_etcd_drill_s3_env: /etc/homelab/etcd-drill-s3.env
# Same path and stamp format as daniel-box's /var/lib/etcd-restore-drill, so `last-success-full`
# reads the same way on either host. Nothing in the cluster reads this one (monitor-bridge is
# pinned to daniel-box's copy); the textfile verdict is the alarm, this is the local record.
hypervisor_etcd_drill_stamp_dir: /var/lib/etcd-restore-drill
hypervisor_etcd_drill_log_dir: /var/log/etcd-restore-drill
# Longer than a year, so the evidence of the last pass is still
# on disk for the whole window an operator might ask "when did this last work".
hypervisor_etcd_drill_log_retention_days: 400
# One run at a time. A second `virsh create` of the same transient name fails anyway, but failing
# on the lock says why.
hypervisor_etcd_drill_lock: /var/lock/etcd-restore-drill-vm.lock

# ── The egress-fence leg of a drill run ──────────────────────────────────────────────────
#
# The orchestrator dials every range staging-nwfilter.xml.j2 drops, plus an internet control
# target, from inside the guest — before the guest is handed the cluster token or the R2
# credentials. It is the half of the fence a repo-side check cannot see: a filter that is
# defined and unattached reads identical to a working one from this host. Its own header has
# the four DECIDED trade-offs; ansible/tests/staging/test_staging_egress_fence.py enforces them.
#
# Per-target timeout: long enough that a slow-but-permitted answer is not read as a block,
# short enough that every target timing out still fits the deadline below.
hypervisor_etcd_drill_fence_probe_timeout: 6
# Whole-leg ceiling, covering one ssh session that dials every target. Sized for all six timing
# out at once (6 x 6 s) with ssh setup on top, because the leg runs outside the orchestrator's
# RUN_TIMEOUT and a wedged dial would otherwise hang the monthly timer.
hypervisor_etcd_drill_fence_deadline: 90
# The Service-CIDR target: Longhorn's frontend Service, the thing known to be exposed from
# the guest — answering unauthenticated on this ClusterIP with a mutating
# `diskUpdate` action in its payload.
#
# DECIDED: an allocated address written here rather than a pinned one from the inventory.
# k8s_registry_cluster_ip and dns_k8s_cluster_ip are pinned and already answer nothing from the
# guest, so either would read as a held fence forever and could never go red. The cost of an
# allocated address is that it can go stale, and the orchestrator's host-side control leg is
# what turns a stale one into a named `unproven=LONGHORNSVC` instead of a silent pass. Nothing
# deploys from this value. Re-read it with `kubectl -n longhorn-system get svc longhorn-frontend`
# on daniel-box when the leg reports it stale.
hypervisor_etcd_drill_fence_longhorn_url: http://10.43.152.244/v1/nodes

# The SUC rehearsal mode of the orchestrator (`--rehearse-suc`, H6.1b2). The host-side helper
# reads the pins from a checkout and judges the guest, and the guest-side script is copied into
# the guest for the run. The deadline is how long the Plan may take to reach its verdict after
# the bundle is published: a server upgrade is about ten minutes, plus the pulls and the restart.
hypervisor_suc_rehearsal_helper_path: "{{ hypervisor_etcd_drill_share_dir }}/suc_rehearsal.py"
hypervisor_suc_rehearsal_guest_script_path: "{{ hypervisor_etcd_drill_share_dir }}/suc-rehearsal-guest-run.sh"
hypervisor_suc_rehearsal_deadline: 2400
