# The k3s agent's same-path files, which dpkg owns from the first install. The component also
# carries the agent's flags: `k3s_agent_config` below, rendered into config.yaml.d, and the
# `ExecStart` lines of 50-homelab.conf. Reverting the flags alone is safe: dpkg removes the config
# drop-in and the `ExecStart` lines, and the installer's unit still carries every flag.
#
# The package ships the files and applies nothing. Each file k3s reads at startup carries
# `activate: manual:k3s-agent.service`, and the host package marks k3s-agent.service `windowed`,
# so reconcile never restarts the agent. daniel-server's package lists no `k3s-restart`, so the
# change goes live at the agent's next start: the weekly reboot, a SUC upgrade, or a hand restart.
# A path k3s does not read at startup (logrotate, tmpfiles.d) carries no k3s activation; the
# renderer gives the tmpfiles.d file the `tmpfiles` action, which never touches k3s.
#
# FORWARD-ONLY for registries.yaml. Reverting the PR that added a file deletes it, and an agent
# that starts without registries.yaml pulls every in-cluster image over HTTPS and fails.
#
# The rest of the agent's host half: the Longhorn packages, the multipath drop-in, the
# inotify key, the join rules and the address pin. The join itself is bootstrap-host.sh's. The
# k3s defaults and the pin's template are k3s-server's, loaded through `component: k3s-server`, so
# the two nodes cannot fork them.
#
# DECIDED: the wifi fallback reaches /etc/netplan through a copy, never an output's symlink.
# `netplan generate` fails on a dangling link in that directory, so a
# missing SOPS key would take every link down at the next boot. `homelab-netplan-wifi` installs
# the rendered file only after it passes the generator, and leaves the old file otherwise. The
# copy has no owner in dpkg, so emptying `k3s_node_wifi_link` is the way back: the next package
# drops the output and the units, and the `legacy:` entries retire both copies. Do that before
# dropping this component, which would leave the installed file behind.
#
# Both netplan files carry `manual:systemd-networkd.service`: `netplan apply` reconfigures the
# link an SSH session rides on, so a change goes live at the next boot.
#
# FORWARD-ONLY for the address pin. Reverting the PR that added it deletes the file, and an agent
# that boots while the gateway's DHCP is down cannot bind server_ip. A revert therefore owes
# `k3s-bringup.yml -e pin_agent_address=daniel-server --tags node-address` on daniel-server before
# the next reboot (operator-only); the revert restores that play's tasks.
#
# The read-only kubeconfig is k3s-server's script, unit, token output and shell profile,
# borrowed whole. Sessions and landings run on this node too, and without it every cluster read
# here fails. The token cannot read Secrets, and this node already holds the join token.
#
# kubelet's graceful node shutdown, its logind delay and the lock check are k3s-server's files
# too, shipped here under the agent's activation.
component: k3s-server
depends:
  - open-iscsi
  - nfs-common
  - multipath-tools
  - zsh
defaults:
  # An agent has no admin kubeconfig. This one names the server's apiserver, not the agent's proxy
  # on 6444, so kubectl answers while k3s-agent is down.
  k3s_readonly_kubeconfig_server: "https://{{ hosts['daniel-box'].server_ip }}:6443"
  k3s_readonly_kubeconfig_ca_source: /var/lib/rancher/k3s/agent/server-ca.crt
  # Same path in the k3s-server component, because Alloy tails one literal on every node.
  k3s_log_file: /var/log/k3s.log
  # Each key is a flag name without `--`; a repeatable flag is a list.
  # A change goes live at the agent's next start: daniel-server's package lists no `k3s-restart`.
  k3s_agent_config:
    node-ip: "{{ server_ip }}"
    # INERT: Longhorn honors this label only when `create-default-disk-labeled-nodes` is true, which
    # this cluster never sets. The label stays: removing it changes the agent's flags for nothing.
    node-label:
      - node.longhorn.io/create-default-disk=false
    # image-gc starts below Longhorn's 75% replica floor; the low threshold must stay below the high
    # one.
    # seccomp-default applies at container creation: running pods keep their profile until
    # recreated.
    kubelet-arg:
      - allowed-unsafe-sysctls=net.ipv4.conf.all.src_valid_mark,net.ipv4.ip_forward
      - image-gc-high-threshold=65
      - image-gc-low-threshold=55
      # DECIDED: user.slice counts. The Claude sessions there compete with pods for memory.
      - system-reserved=memory=4Gi
      - seccomp-default=true
files:
  - {src: templates/50-homelab.conf.j2, dst: /usr/lib/systemd/system/k3s-agent.service.d/50-homelab.conf, activate: "manual:k3s-agent.service"}
  # No activation: the postinst's daemon-reload applies the weight to the running unit.
  - {src: "component:templates/cpu-weight.conf.j2", dst: /usr/lib/systemd/system/k3s-agent.service.d/60-homelab-cpu-weight.conf}
  - {src: "component:templates/system-slice-cpu-weight.conf.j2", dst: /usr/lib/systemd/system/system.slice.d/60-homelab-cpu-weight.conf}
  - {src: "component:templates/memory-low.conf.j2", dst: /usr/lib/systemd/system/k3s-agent.service.d/60-homelab-memory-low.conf}
  - {src: "component:templates/system-slice-memory-low.conf.j2", dst: /usr/lib/systemd/system/system.slice.d/60-homelab-memory-low.conf}
  - {src: "component:templates/kubepods-memory-low.conf.j2", dst: /usr/lib/systemd/system/kubepods.slice.d/60-homelab-memory-low.conf}
  - {src: "component:units/homelab-kubepods-memory-low.path", dst: /usr/lib/systemd/system/homelab-kubepods-memory-low.path}
  - {src: "component:units/homelab-kubepods-memory-low.service", dst: /usr/lib/systemd/system/homelab-kubepods-memory-low.service}
  # The agent's flags. The only file in config.yaml.d, and nothing ships config.yaml.
  - {src: templates/50-homelab.yaml.j2, dst: /etc/rancher/k3s/config.yaml.d/50-homelab.yaml, mode: "0644", activate: "manual:k3s-agent.service"}
  - {src: templates/registries.yaml.j2, dst: /etc/rancher/k3s/registries.yaml, mode: "0600", activate: "manual:k3s-agent.service"}
  - {src: "component:templates/kubelet-graceful-shutdown.conf.j2", dst: /var/lib/rancher/k3s/agent/etc/kubelet.conf.d/50-homelab-graceful-shutdown.conf, mode: "0644", activate: "manual:k3s-agent.service"}
  - {src: "component:templates/logind-kubelet-shutdown.conf.j2", dst: /usr/lib/systemd/logind.conf.d/zz-homelab-kubelet-shutdown.conf, activate: "reload:systemd-logind.service"}
  - {src: "component:files/kubelet-shutdown-lock-check.sh", dst: /usr/lib/homelab/kubelet-shutdown-lock-check, mode: "0755"}
  - {src: "component:units/homelab-kubelet-shutdown-lock.service", dst: /usr/lib/systemd/system/homelab-kubelet-shutdown-lock.service}
  - {src: "component:units/homelab-kubelet-shutdown-lock.timer", dst: /usr/lib/systemd/system/homelab-kubelet-shutdown-lock.timer}
  - {src: "component:files/wired-gateway-check.sh", dst: /usr/lib/homelab/wired-gateway-check, mode: "0755", when: "k3s_node_static_link | length > 0"}
  - {src: "component:units/homelab-wired-gateway.service.j2", dst: /usr/lib/systemd/system/homelab-wired-gateway.service, when: "k3s_node_static_link | length > 0"}
  - {src: "component:units/homelab-wired-gateway.timer", dst: /usr/lib/systemd/system/homelab-wired-gateway.timer, when: "k3s_node_static_link | length > 0"}
  - {src: templates/logrotate-k3s-agent.j2, dst: /etc/logrotate.d/k3s-agent}
  - {src: templates/tmpfiles-k3s-agent.conf.j2, dst: /usr/lib/tmpfiles.d/homelab-k3s-agent.conf}
  # Longhorn's devices must stay out of multipathd's reach, or mounts fail.
  - {src: templates/multipath-longhorn.conf, dst: /etc/multipath/conf.d/50-homelab-longhorn.conf, activate: "reload:multipathd.service"}
  - {src: "component:templates/netplan-static-address.yaml.j2", dst: /etc/netplan/90-homelab-static-address.yaml, mode: "0600", activate: "manual:systemd-networkd.service", when: "k3s_node_static_link | length > 0"}
  - {src: templates/static-link-sysctl.conf.j2, dst: /etc/sysctl.d/90-homelab-static-link.conf, activate: sysctl, when: "k3s_node_static_link | length > 0"}
  # kubelet watchers and root-uid containers share the per-uid default of 128 inotify instances.
  - {src: "component:templates/90-homelab-k3s-node.conf", dst: /etc/sysctl.d/90-homelab-k3s-node.conf, activate: sysctl}
  - {src: files/homelab-netplan-wifi, dst: /usr/lib/homelab/homelab-netplan-wifi, mode: "0755", when: "k3s_node_wifi_link | length > 0"}
  - {src: units/homelab-netplan-wifi.service, dst: /usr/lib/systemd/system/homelab-netplan-wifi.service, when: "k3s_node_wifi_link | length > 0"}
  - {src: "component:templates/k3s-readonly-kubeconfig.j2", dst: /usr/lib/homelab/k3s-readonly-kubeconfig, mode: "0755", activate: "try-restart:homelab-k3s-kubeconfig.service"}
  - {src: "component:units/homelab-k3s-kubeconfig.service.j2", dst: /usr/lib/systemd/system/homelab-k3s-kubeconfig.service}
  - {src: "component:templates/k3s-kubeconfig-profile", dst: /etc/profile.d/k3s-kubeconfig.sh}
outputs:
  - src: "component:templates/k3s-readonly-token.j2"
    path: /etc/rancher/k3s/readonly-token
    destination: k3s/readonly-token
    owner: root
    group: root
    mode: "0600"
    keys: [k3s_readonly_token]
    persist: false
    link: false
    dependents: [homelab-k3s-kubeconfig.service]
  - src: templates/netplan-wifi-fallback.json.j2
    path: /etc/netplan/80-homelab-wifi-fallback.yaml
    destination: netplan/80-homelab-wifi-fallback.yaml
    owner: root
    group: root
    mode: "0600"
    keys: [wifi_ssid, wifi_password]
    persist: true
    link: false
    dependents: [homelab-netplan-wifi.service]
    format: json   # homelab-secrets escapes each value, and JSON is YAML to netplan
    when: "k3s_node_wifi_link | length > 0"
enable:
  homelab-k3s-kubeconfig.service: multi-user.target
  homelab-kubelet-shutdown-lock.timer: timers.target
  homelab-kubepods-memory-low.path: paths.target
  homelab-wired-gateway.timer: {target: timers.target, when: "k3s_node_static_link | length > 0"}
  homelab-netplan-wifi.service: {target: multi-user.target, when: "k3s_node_wifi_link | length > 0"}
legacy:
  # Emptying a link is the way back from the pin: the next package drops the file and this retires
  # any left copy.
  - {path: /etc/netplan/90-homelab-static-address.yaml, when: "k3s_node_static_link | length == 0"}
  - {path: /etc/sysctl.d/90-homelab-static-link.conf, when: "k3s_node_static_link | length == 0"}
  # Both copies of the wifi credentials.
  - {path: /etc/netplan/80-homelab-wifi-fallback.yaml, when: "k3s_node_wifi_link | length == 0"}
  - {path: /var/lib/homelab-secrets/netplan/80-homelab-wifi-fallback.yaml, when: "k3s_node_wifi_link | length == 0"}
lines:
  # zsh does not read /etc/profile.d; zshenv is the one file every invocation reads.
  # `depends: zsh` installs it first, since the arm would create a missing /etc/zsh 0700.
  - path: /etc/zsh/zshenv
    marker: "# {mark} ANSIBLE MANAGED — k3s kubeconfig"
    block: |
      if [ -r /etc/profile.d/k3s-kubeconfig.sh ]; then
        . /etc/profile.d/k3s-kubeconfig.sh
      fi
# Inter-node join rules from the server. `keep`: no revert or floor ever deletes one.
# The live rules carry no comment, so the arm adopts each by appending it again, which relabels it.
ufw:
  rules:
    - {id: k3s-join-vxlan, spec: "allow from {{ hosts['daniel-box'].server_ip }} to any port 8472 proto udp", keep: true}
    - {id: k3s-join-kubelet, spec: "allow from {{ hosts['daniel-box'].server_ip }} to any port 10250 proto tcp", keep: true}
    - {id: k3s-join-node-exporter, spec: "allow from {{ hosts['daniel-box'].server_ip }} to any port 9100 proto tcp", keep: true}
    - {id: k3s-join-memberlist-tcp, spec: "allow from {{ hosts['daniel-box'].server_ip }} to any port 7946 proto tcp", keep: true}
    - {id: k3s-join-memberlist-udp, spec: "allow from {{ hosts['daniel-box'].server_ip }} to any port 7946 proto udp", keep: true}
  legacy:
    - {spec: "allow from {{ hosts['daniel-box'].server_ip }} to any port 8472 proto udp", comment: "", replaced_by: k3s-join-vxlan}
    - {spec: "allow from {{ hosts['daniel-box'].server_ip }} to any port 10250 proto tcp", comment: "", replaced_by: k3s-join-kubelet}
    - {spec: "allow from {{ hosts['daniel-box'].server_ip }} to any port 9100 proto tcp", comment: "", replaced_by: k3s-join-node-exporter}
    - {spec: "allow from {{ hosts['daniel-box'].server_ip }} to any port 7946 proto tcp", comment: "", replaced_by: k3s-join-memberlist-tcp}
    - {spec: "allow from {{ hosts['daniel-box'].server_ip }} to any port 7946 proto udp", comment: "", replaced_by: k3s-join-memberlist-udp}
