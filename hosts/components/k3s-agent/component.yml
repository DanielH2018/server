# The k3s agent's same-path files (H6.5a, docs/target-architecture/host/h6-k3s-suc.md, *Steps, as
# PRs*, item 13). Ansible's tasks/agent.yml wrote each one until H6.5a deleted its task, so dpkg
# takes over the path on the first install. Since H6.5b the component also carries the agent's
# flags: `k3s_agent_config` below, rendered into config.yaml.d, and the `ExecStart` lines of
# 50-homelab.conf. Reverting H6.5b alone is safe: dpkg removes the config drop-in and the
# `ExecStart` lines, and the installer's unit still carries every flag.
#
# The package ships the files and applies nothing. Each file k3s reads at startup carries
# `activate: manual:k3s-agent.service`, and the host package marks k3s-agent.service `windowed`,
# so reconcile never restarts the agent. daniel-server's package lists no `k3s-restart`, so the
# change goes live at the agent's next start: the weekly reboot, a SUC upgrade, or a hand restart.
# A path k3s does not read at startup (logrotate, tmpfiles.d) carries no activation.
#
# FORWARD-ONLY for registries.yaml. Reverting the PR that added a file deletes it, and an agent
# that starts without registries.yaml pulls every in-cluster image over HTTPS and fails. Return a
# file to Ansible with the attended procedure in the H6 plan's *Rollback*.
#
# The rest of the agent's host half (H7.34): the Longhorn packages, the multipath drop-in, the
# inotify key, the join rules and the address pin. The join itself is bootstrap-host.sh's. No
# host-half path lives only in setup/k3s on daniel-server, whose role is still daniel-box's until
# H7.35, so the pin's templates render in place through `role: k3s`.
#
# DECIDED: the wifi fallback reaches /etc/netplan through a copy, never an output's symlink.
# `netplan generate` fails on a dangling link in that directory (measured 2026-11-07), so a
# missing SOPS key would take every link down at the next boot. `homelab-netplan-wifi` installs
# the rendered file only after it passes the generator, and leaves the old file otherwise.
#
# Both netplan files carry `manual:systemd-networkd.service`: `netplan apply` reconfigures the
# link an SSH session rides on, so a change goes live at the next boot.
#
# ENFORCED: ansible/tests/setup/test_k3s_agent_component.py.
role: k3s
depends:
  - open-iscsi
  - nfs-common
  - multipath-tools
defaults:
  # The log file k3s writes. The k3s-server component carries the same path, because Alloy tails
  # one literal on every node; ansible/tests/k8s/test_alloy_ships_k3s_log.py holds all three equal.
  k3s_log_file: /var/log/k3s.log
  # The k3s agent's flags (H6.5b). templates/50-homelab.yaml.j2 renders this mapping as
  # /etc/rancher/k3s/config.yaml.d/50-homelab.yaml, and 50-homelab.conf runs a bare `k3s agent`.
  # Each key is a flag name without `--`; a repeatable flag is a list. A change goes live at the
  # agent's next start, because daniel-server's package lists no `k3s-restart`.
  # ENFORCED: ansible/tests/setup/test_k3s_agent_flags_migration.py.
  k3s_agent_config:
    node-ip: "{{ server_ip }}"
    # INERT: Longhorn honors this label only when the cluster-level
    # `create-default-disk-labeled-nodes` setting is true, which this cluster never sets, so a
    # default disk appears anyway and the node schedules replicas. The label stays, because
    # removing it changes the agent's flags for nothing.
    node-label:
      - node.longhorn.io/create-default-disk=false
    kubelet-arg:
      - allowed-unsafe-sysctls=net.ipv4.conf.all.src_valid_mark,net.ipv4.ip_forward
files:
  - {src: templates/50-homelab.conf.j2, dst: /usr/lib/systemd/system/k3s-agent.service.d/50-homelab.conf, activate: "manual:k3s-agent.service"}
  # The agent's flags. The only file in config.yaml.d, and nothing ships config.yaml.
  - {src: templates/50-homelab.yaml.j2, dst: /etc/rancher/k3s/config.yaml.d/50-homelab.yaml, mode: "0644", activate: "manual:k3s-agent.service"}
  - {src: templates/registries.yaml.j2, dst: /etc/rancher/k3s/registries.yaml, mode: "0600", activate: "manual:k3s-agent.service"}
  - {src: templates/logrotate-k3s-agent.j2, dst: /etc/logrotate.d/k3s-agent}
  - {src: templates/tmpfiles-k3s-agent.conf.j2, dst: /usr/lib/tmpfiles.d/homelab-k3s-agent.conf}
  # Longhorn's devices must stay out of multipathd's reach, or mounts fail. The block Ansible wrote
  # in the owned /etc/multipath.conf stays as a harmless duplicate.
  - {src: templates/multipath-longhorn.conf, dst: /etc/multipath/conf.d/50-homelab-longhorn.conf, activate: "reload:multipathd.service"}
  - {src: "role:netplan-static-address.yaml.j2", dst: /etc/netplan/90-homelab-static-address.yaml, mode: "0600", activate: "manual:systemd-networkd.service", when: "k3s_node_static_link | length > 0"}
  - {src: templates/static-link-sysctl.conf.j2, dst: /etc/sysctl.d/90-homelab-static-link.conf, activate: sysctl, when: "k3s_node_static_link | length > 0"}
  - {src: files/homelab-netplan-wifi, dst: /usr/lib/homelab/homelab-netplan-wifi, mode: "0755"}
  - {src: units/homelab-netplan-wifi.service, dst: /usr/lib/systemd/system/homelab-netplan-wifi.service}
outputs:
  - src: "role:netplan-wifi-fallback.yaml.j2"
    path: /etc/netplan/80-homelab-wifi-fallback.yaml
    destination: netplan/80-homelab-wifi-fallback.yaml
    owner: root
    group: root
    mode: "0600"
    keys: [wifi_ssid, wifi_password]
    persist: true
    link: false
    dependents: [homelab-netplan-wifi.service]
enable:
  homelab-netplan-wifi.service: multi-user.target
legacy:
  # Ansible's logging drop-in. Its lines equal the package's, so both apply harmlessly until
  # reconcile removes it.
  - {path: /etc/systemd/system/k3s-agent.service.d/10-log-to-file.conf}
  # The installer the join task kept here. bootstrap-host.sh fetches its own copy per run.
  - {path: /usr/local/bin/k3s-install.sh}
  # Emptying a link is the way back from the pin: the next package drops the file and this retires
  # the path Ansible wrote. The link's live value stays until the next reboot, which is harmless.
  - {path: /etc/netplan/90-homelab-static-address.yaml, when: "k3s_node_static_link | length == 0"}
  - {path: /etc/sysctl.d/90-homelab-static-link.conf, when: "k3s_node_static_link | length == 0"}
lines:
  # kubelet's log watchers and every root-uid container share the per-uid default of 128.
  - {path: /etc/sysctl.conf, line: fs.inotify.max_user_instances=1024, regexp: '^\s*fs\.inotify\.max_user_instances\s*=', activate: sysctl}
# The inter-node join rules, allowed FROM the server ON this agent. Each spec is the rule as `ufw
# show added` prints it. `keep`: no revert and no floor ever deletes one, because the agent stops
# being a node without them. The live rules carry no comment, so the arm adopts each by appending
# it again, which relabels it in place. test_k3s_agent_component.py holds the ports equal to
# k3s_join_agent_ports, whose symmetry with the server side is a test too.
ufw:
  rules:
    - {id: k3s-join-vxlan, spec: "allow from {{ hostvars['daniel-box'].server_ip }} to any port 8472 proto udp", keep: true}
    - {id: k3s-join-kubelet, spec: "allow from {{ hostvars['daniel-box'].server_ip }} to any port 10250 proto tcp", keep: true}
    - {id: k3s-join-node-exporter, spec: "allow from {{ hostvars['daniel-box'].server_ip }} to any port 9100 proto tcp", keep: true}
    - {id: k3s-join-memberlist-tcp, spec: "allow from {{ hostvars['daniel-box'].server_ip }} to any port 7946 proto tcp", keep: true}
    - {id: k3s-join-memberlist-udp, spec: "allow from {{ hostvars['daniel-box'].server_ip }} to any port 7946 proto udp", keep: true}
  legacy:
    - {spec: "allow from {{ hostvars['daniel-box'].server_ip }} to any port 8472 proto udp", comment: "", replaced_by: k3s-join-vxlan}
    - {spec: "allow from {{ hostvars['daniel-box'].server_ip }} to any port 10250 proto tcp", comment: "", replaced_by: k3s-join-kubelet}
    - {spec: "allow from {{ hostvars['daniel-box'].server_ip }} to any port 9100 proto tcp", comment: "", replaced_by: k3s-join-node-exporter}
    - {spec: "allow from {{ hostvars['daniel-box'].server_ip }} to any port 7946 proto tcp", comment: "", replaced_by: k3s-join-memberlist-tcp}
    - {spec: "allow from {{ hostvars['daniel-box'].server_ip }} to any port 7946 proto udp", comment: "", replaced_by: k3s-join-memberlist-udp}
