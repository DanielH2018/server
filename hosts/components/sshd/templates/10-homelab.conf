# Managed by the homelab host package. sshd keeps the FIRST value it reads for a keyword, and
# `10-` sorts before cloud-init's `50-cloud-init.conf`, so these settings win.
# MaxSessions caps channels per connection, and every interactive session to these hosts shares one
# ControlMaster connection, so 10 is OpenSSH's own default and inside the CIS ceiling.
PasswordAuthentication no
PermitEmptyPasswords no
PermitRootLogin no
IgnoreRhosts yes
ChallengeResponseAuthentication no
MaxAuthTries 3
MaxSessions 10
ClientAliveCountMax 2
LoginGraceTime 30
LogLevel VERBOSE
DisableForwarding yes
AllowTcpForwarding no
AllowAgentForwarding no
X11Forwarding no
Compression no
TCPKeepAlive no
AllowGroups ssh-users
