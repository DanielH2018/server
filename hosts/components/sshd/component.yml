# sshd hardening. The sshd config is /etc/ssh/sshd_config on daniel-server and cloud-init's
# 50-cloud-init.conf on daniel-pi and daniel-box. Two drop-ins carry the settings:
#
# - 10-homelab.conf holds the settings. sshd keeps the first value it reads, and `10-` sorts
#   before 50-cloud-init.conf, so the package's value wins over the lines already there.
# - 90-homelab-match.conf holds the `Match User <sys_user>` block, in its own file.
#
# Older lines in sshd_config stay as harmless duplicates with the same values, for removal by
# hand. Each file activates `reload:ssh.service`, which runs
# `sshd -t` first, so a config sshd rejects leaves the running daemon untouched and holds the host.
#
# Step 4 of hosts/bootstrap-host.sh creates the `ssh-users` group and adds the sys user, because
# AllowGroups admits only that group and a rebuilt host needs both before sshd reloads. No setup
# role writes either.
files:
  - {src: templates/10-homelab.conf, dst: /etc/ssh/sshd_config.d/10-homelab.conf, activate: "reload:ssh.service"}
  - {src: templates/90-homelab-match.conf.j2, dst: /etc/ssh/sshd_config.d/90-homelab-match.conf, activate: "reload:ssh.service"}
