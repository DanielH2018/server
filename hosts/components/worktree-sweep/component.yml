# The weekly worktree sweep and git object-store repair (H7.10b,
# docs/target-architecture/host/h7-delete-ansible.md). Until H7.36 initial_setup installed it on
# daniel-box as the "Weekly git object-store repair" cron (`/etc/cron.d/git-object-store-repair`).
# Now homelab-worktree-sweep.timer starts homelab-worktree-sweep.service on Sunday at 04:20, as
# sys_user, in the primary checkout. daniel-box and daniel-server both list the component, because
# fan-out batches run in both hosts' checkouts (#6815). Each host pings its own
# `<host>-worktree-sweep` check, which monitor_bridge_healthchecks_expected lists.
#
# The service loads the Healthchecks.io ping key as the credential `healthchecks_ping_key`, so
# every package listing this component lists that credential. daniel-server's package retires
# /etc/healthchecks, the file the script read until #6815.
# The worktree holder scan's socket (`worktree-holders.socket`) is not part of this component:
# it moves with `claude_code` (H7.12).
#
# Several Claude sessions branch, commit and retire worktrees in the primary checkout every day,
# and each removal leaves that branch's objects unreachable. A worktree-isolated session's git
# commands are refused against the primary checkout, so the warning `git fetch` prints reaches
# only the agents structurally unable to act on it. This timer is the arm that removes; the
# SessionStart banner only reports.
#
# - Scope / exclusions: merged worktrees under `.claude/worktrees/`, orphan `worktree-*` branches
#   whose content is on origin/master, unregistered worktree directories whose every file a ref
#   already reaches, and unreachable objects older than a day. On `ops_cron_host` alone it also
#   releases the issue claims `findings.py reap` judges stale. Every other host passes
#   `--no-reap`, because its checkout cannot see the orchestrator's worktree and would read the
#   orchestrator's live claims as stale. Nothing else.
# - Mode (explicit and reversible): the timer's enable link in this package arms it. Dropping the
#   link from a package version, or reverting this component, stops the timer on the install that
#   drops it. `systemctl stop homelab-worktree-sweep.timer` stops it until the next install.
# - Authoritative sources: `git worktree list` and origin/master as `prune_worktrees.py` reads
#   them.
# - Abort valves: `prune_worktrees.py` refuses a worktree it cannot prove merged.
# - Required evidence, every run: a ping to the `<host>-worktree-sweep` Healthchecks.io check with
#   the exit code, and the script's `--brief` lines in the journal under `worktree-sweep`.
# - Next-run review: a non-zero exit pages through Healthchecks.io. Read
#   `journalctl -t worktree-sweep` for the removal or branch deletion that failed.
#
# ENFORCED: hosts/lib/tests/test_worktree_sweep_component.py, and
# ansible/tests/setup/test_worktree_sweep_cron_reports_its_exit.py, which runs the rendered script.
files:
  - {src: templates/worktree-sweep.sh.j2, dst: /usr/lib/homelab/worktree-sweep, mode: "0755"}
  - {src: units/homelab-worktree-sweep.service.j2, dst: /usr/lib/systemd/system/homelab-worktree-sweep.service}
  - {src: units/homelab-worktree-sweep.timer, dst: /usr/lib/systemd/system/homelab-worktree-sweep.timer}
enable:
  homelab-worktree-sweep.timer: timers.target
# What initial_setup installed before H7.36. Reconcile retires each once the timer above has
# started, so the sweep never runs twice or not at all.
legacy:
  - {cron_file: git-object-store-repair}
