# Shipped by daniel-box's package (the t2-egress component), a drop-in for Ubuntu's squid.service.
# It runs squid on the T2 egress config instead of /etc/squid/squid.conf, and without -s, so
# squid's own log never reaches syslog (dotfiles#967 I6).
[Service]
ExecStartPre=
ExecStartPre=/usr/sbin/squid --foreground -z -f /usr/lib/homelab/t2-egress/t2-squid.conf
ExecStart=
ExecStart=/usr/sbin/squid --foreground -YC -f /usr/lib/homelab/t2-egress/t2-squid.conf
SyslogLevel=notice
