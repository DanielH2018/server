# The failure page every packaged unit can name with `OnFailure=homelab-alert@%n.service`. Once
# it delivers, host-maintenance's systemd-units check labels the unit `paged_by="homelab-alert"`,
# and Alertmanager blackholes that unit's SystemdUnitsFailed, so a failure pages once.
#
# The unit loads one credential, `discord_alert_webhook`, from /run/credstore, where
# `homelab-secrets.service` writes it. A host that lists this component lists `secrets-unit` too.
# A failed delivery re-runs every five minutes until it succeeds, and the page ends
# `Failed at <UTC time>`, the time of the first attempt.
credentials:
  - discord_alert_webhook
files:
  - {src: units/homelab-alert@.service, dst: /usr/lib/systemd/system/homelab-alert@.service}
