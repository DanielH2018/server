# The base fixture with its drop-in on homelab-updater.timer changed, the shape of an H3.6 Pi
# package update before H3.9b ships the timer's enable link.
description: Fixture host package for the host_packages container cases
components: [reconcile]
maintainer_scripts: [preinst, postinst, prerm]
files:
  - {src: units/homelab-fixture-kept.service, dst: /usr/lib/systemd/system/homelab-fixture-kept.service}
  - {src: units/homelab-fixture-dropped.service, dst: /usr/lib/systemd/system/homelab-fixture-dropped.service}
  - {src: files/fixture-dropped, dst: /usr/lib/homelab/fixture-dropped}
  - {src: units/updater-timer-changed.conf, dst: /usr/lib/systemd/system/homelab-updater.timer.d/50-homelab.conf}
enable:
  homelab-fixture-kept.service: multi-user.target
  homelab-fixture-dropped.service: multi-user.target
