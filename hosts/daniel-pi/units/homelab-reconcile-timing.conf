# daniel-pi's drop-in for homelab-reconcile.service and homelab-reconcile-wait.service. Reconcile
# appends each `<action> starts` and `<action> took <N>s` line to this file as well as the journal.
# The Pi's journal keeps about five days in root-only archives; Alloy's pi_health source ships
# /var/log/pi-health/*.log to Loki, which keeps them for its retention.
[Service]
Environment=HOMELAB_RECONCILE_TIMING_LOG=/var/log/pi-health/reconcile.log
