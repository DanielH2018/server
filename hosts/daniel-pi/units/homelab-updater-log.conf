# daniel-pi's drop-in for homelab-updater.service. The updater appends each line it prints, such
# as a failed reconcile or a hold, to this file as well as the journal. The Pi's journal keeps
# about five days in root-only archives; Alloy's pi_health source ships /var/log/pi-health/*.log
# to Loki, which keeps them for its retention.
[Service]
Environment=HOMELAB_UPDATER_LOG=/var/log/pi-health/updater.log
