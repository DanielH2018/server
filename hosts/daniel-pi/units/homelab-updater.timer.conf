# The Pi's schedule for homelab-updater.timer (H3, *The updater*). The empty OnCalendar= resets
# every trigger the shared timer carries. H3.9b ships its enable link.
#
# DECIDED: once a day at 03:05 UTC (the Pi's clock is UTC), H3.13's daily fallback (#6911). The
# updater's common path peaked at 114 MB, above a quarter of the 95 MB apt-get -d dist-upgrade
# baseline (#5206, docs/pi-host-tuning-record.md). The plan named 00:30, but
# homelab-docker-engine.timer took 00:30 on 2026-10-30, and on a night a pin moved it masks this
# timer with --now, which drops a fire due in the same minute, and runs for up to 90 minutes.
# 03:05 is the first slot after the engine's 02:00 worst case that also clears man-db (01:00 to
# 03:00) and the 01:40 sweep, and its 50-minute timeout ends before the 04:00 to 05:59 gap that
# pi-peer-backup and the apt timers hold.
[Timer]
OnCalendar=
OnCalendar=*-*-* 03:05:00
