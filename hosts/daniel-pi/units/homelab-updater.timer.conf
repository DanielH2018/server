# The Pi's schedule for homelab-updater.timer. The empty OnCalendar= resets every trigger the
# shared timer carries.
#
# DECIDED: once a day at 03:05 UTC (the Pi's clock is UTC), H3.13's daily fallback (#6911). The
# updater's common path peaked at 114 MB, above a quarter of the 95 MB apt-get -d dist-upgrade
# baseline (docs/pi-host-tuning-record.md). 00:30 is not available: homelab-docker-engine.timer
# holds it, and on a night a pin moved it masks this timer with --now, which drops a fire due in the same minute, and runs for up to 90 minutes.
# 03:05 is the first slot after the engine's 02:00 worst case that also clears man-db (01:00 to
# 03:00) and the 01:40 sweep, and its 50-minute timeout ends before the 04:00 to 05:59 gap that
# pi-peer-backup and the apt timers hold.
#
# This fire is the fallback. homelab-updater-poll.timer (pi-updater-poll) starts the
# updater within about 15 minutes of a newer homelab-daniel-pi publish, once per version.
[Timer]
OnCalendar=
OnCalendar=*-*-* 03:05:00
