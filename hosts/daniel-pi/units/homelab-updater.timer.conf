# The Pi's schedule for homelab-updater.timer (H3, *The updater*). The empty OnCalendar= resets
# every trigger the shared timer carries. The Pi then checks every 15 minutes and skips 23:00 to
# 00:59 and 04:00 to 05:59. The timer stays unarmed until H3.9b ships its enable link.
[Timer]
OnCalendar=
OnCalendar=*-*-* 01..03,06..22:05/15:00
