# daniel-pi's host package (H3.6). It ships reconcile, the updater's schedule and, since H3.8b,
# the three Pi heartbeats. Since H3.9b it also ships the enable link for homelab-updater.timer,
# which arms the Pi's unattended updates. The first install of that link needs one hand start of
# homelab-updater.service (docs/target-architecture/host/h3-pi-pilot.md, *Steps, as PRs*).
#
# Since H4.5 it ships the secrets unit too. The unit decrypts the two push tokens into
# /run/credstore, and the two token heartbeats load them from there. The interim files under
# /etc/homelab/interim/ stay until H4.6. ansible/vars/hosts/daniel-pi.sops.yaml carries every key
# this tree names, and `host_secrets.py sync daniel-pi` rewrites it (operator-only).
#
# Since H5.14 it ships crowdsec's edge probe timer. D5's first crowdsec conversion installed that
# timer through setup/k8s_host_files. The probe reads no secret, so `credentials:` is unchanged.
#
# Since H5.2b it ships the Pi's Compose project (the pi-compose component) with its enable link and
# the first service, `pi-canary`. The canary reads no secret, so `credentials:` is unchanged and
# the Pi's SOPS file needs no new key. H5.10 removed the canary from the project.
#
# Since H5.6 the project also runs docker-proxy and its docker-proxy-lifecycle sub-proxy, which
# read no secret.
#
# Since H5.7 the project also runs autoheal, the first service that reads a secret. The pi-compose
# component's `outputs:` entry renders the Compose env file with `monitor_discord_webhook_url`, so
# the Pi's SOPS file must hold that key (`host_secrets.py sync daniel-pi`, operator-only).
# `credentials:` is unchanged.
#
# Since H5.8 the project also runs alloy, the second service that reads a secret. The Compose env
# file gains `alloy_pi_http_password`, so the Pi's SOPS file must hold that key too
# (`host_secrets.py sync daniel-pi`, operator-only). `credentials:` is unchanged.
#
# Since H5.9 the project also runs wg-easy, which reads no secret. The Compose env file and
# `credentials:` are unchanged, and the Pi's SOPS file needs no new key.
#
# Since H7.27 it ships the first three subjects of initial_setup: apt's unattended upgrades, the
# sshd drop-ins and the kernel, journald, limits and login hardening. initial_setup keeps no task for them. No file here needs a credential.
#
# Since H7.25 it ships the optimize_pi role's subjects: the memory, log and watchdog tuning
# (pi-tuning), the node exporter unit and its textfile directory (pi-node-exporter), the resolver
# and hostname line (pi-resolver), and pi-peer-backup's forced-command wrapper and key
# (pi-peer-backup-target). The interim heartbeat token files are legacy entries below. No file
# here needs a credential.
#
# Since H7.26 it ships the docker_install role's subjects (pi-docker): the engine pins and
# homelab-docker-engine.service, the one path that installs or moves the held engine, daemon.json,
# the two Go-runtime drop-ins and containerd's config block. No file here needs a credential.
#
# Since H7.30 it ships the rest of initial_setup's Pi subjects: the fail2ban group (fail2ban,
# integrity-scans for rkhunter and AIDE, postfix and accounting), the maintenance timers
# (host-maintenance: the weekly reboot, apt autoremove, dpkg purge and the Docker prune) and ufw
# (ssh-firewall and the rules below). initial_setup keeps no task for them. The timers read one new credential, so the Pi's
# SOPS file must hold `healthchecks_ping_key` (`host_secrets.py sync daniel-pi`, operator-only).
#
# Since #7065 it ships pi-updater-poll: a 15-minute timer that starts homelab-updater.service once
# the builder publishes a newer homelab-daniel-pi, so the Pi applies a change without waiting for
# the daily fire. The daily timer below stays the fallback. No file here needs a credential.
#
# Since H7.58 it ships the host baseline (host-hardening): the sudo cache, auditd's rules, the module
# blacklist, the core-dump drop-in, the login banner and the base packages. initial_setup keeps no task for them, which ends the role's dist-upgrade here. No
# file here needs a credential.
description: daniel-pi's homelab host package
components: [reconcile, secrets-unit, pi-heartbeats, pi-updater-poll, crowdsec-probe, pi-compose, unattended-upgrades, sshd, host-tuning, apt-docker, apt-azlux, pi-tuning, pi-node-exporter, pi-resolver, pi-peer-backup-target, pi-docker, sops, fail2ban, integrity-scans, postfix, accounting, host-maintenance, ssh-firewall, host-hardening]
credentials:
  - healthchecks_ping_key
# H3.11: the Pi is the arm64 pilot of homelab-tools, which ships sops and chezmoi under
# /usr/lib/homelab/bin. An unversioned Depends already satisfied never upgrades the dependency,
# so homelab-updater's steps 4 and 5 cover every installed homelab-* package.
depends:
  - homelab-tools
  - linux-raspi
  - wireguard
maintainer_scripts: [preinst, postinst, prerm]
files:
  - {src: units/homelab-updater.timer.conf, dst: /usr/lib/systemd/system/homelab-updater.timer.d/50-homelab.conf}
enable:
  homelab-updater.timer: timers.target
legacy:
  # The hypervisor role's teardown half kept this host free of the network source directory until
  # H7.34 emptied the role. Nothing recreates it, so the entry stays a no-op on a clean host.
  - {path: /etc/libvirt/declared-networks}
  # The Pi's three heartbeats read their push tokens from /run/credstore since H4.5, and nothing
  # reads the interim copies optimize_pi staged (pi-heartbeats/component.yml). H4.6's retirement
  # lands here with the role that wrote them. The directory comes after its files, because
  # reconcile removes a directory only once it is empty.
  - {path: /etc/homelab/interim/pi_sd_health_push_token}
  - {path: /etc/homelab/interim/pi_recovery_push_token}
  - {path: /etc/homelab/interim}
  # H7.24b: the binary sops_setup installed, which sits ahead of the packaged /usr/bin/sops on PATH.
  - {path: /usr/local/bin/sops}
  # H7.58: the absent arms of initial_setup's crons.yml. Each names what the role removes from a host
  # with no Claude sessions, no gitops and no witness.
  - {unit: worktree-holders.socket}
  - {unit: worktree-holders@.service}
  - {path: /usr/local/libexec/worktree-holders}
  - {path: /etc/worktree-holders.json}
  - {path: /var/lib/homelab/setup-deployed-manifest.d/worktree-holders}
  - {path: /etc/sudoers.d/20-worktree-holders}
  - {path: /usr/local/bin/secret-rotation-audit.sh}
  - {path: /usr/local/bin/secret-rotate.sh}
  - {path: /etc/homelab/cert-expiry-webhook.env}
  # H7.48: the cron absent arms of crons.yml. This host has no gitops, so the secret-rotation
  # component never lists its two crons here.
  - {cron: "Daily secret rotation audit", user: "{{ sys_user }}"}
  - {cron: "Weekly secret rotation (auto tier)", user: "{{ sys_user }}"}
  - {cron: "TLS cert-expiry watch", user: "{{ sys_user }}"}
  # H7.52: what gitops_deploy's teardown half removed from this host, which never ran the
  # deployer. Its three directories are not listed: the teardown removed them, and reconcile
  # removes a directory only when it is empty.
  - {unit: gitops-deploy.timer}
  - {unit: gitops-deploy.service}
  - {unit: gitops-deploy-alert.service}
  - {unit: staging-backfill.timer}
  - {unit: staging-backfill.service}
  - {unit: staging-backfill-alert.service}
  - {path: /etc/polkit-1/rules.d/50-gitops-deploy.rules}
  - {path: /var/lib/node-exporter-textfile/gitops_tick.prom}
  - {path: /var/lib/homelab/setup-render-manifest.d/gitops-deploy}
  - {path: /var/lib/homelab/setup-deployed-manifest.d/gitops-deploy}
  - {unit: kuma-check-github-ruleset-drift.timer}
  - {unit: kuma-check-github-ruleset-drift.service}
  - {unit: kuma-check-github-ruleset-drift-boot.service}
  - {unit: kuma-check-github-interaction-limit.timer}
  - {unit: kuma-check-github-interaction-limit.service}
  - {unit: kuma-check-github-interaction-limit-boot.service}
  - {path: /var/lib/kuma-check/github-ruleset-drift.down}
  - {path: /var/lib/kuma-check/github-interaction-limit.down}
  - {cron_file: github-ruleset-drift}
  - {cron_file: github-interaction-limit}
  - {path: /var/lib/node-exporter-textfile/github-ruleset-drift.prom}
  - {path: /var/lib/node-exporter-textfile/github-interaction-limit.prom}
  - {path: /var/lib/homelab/setup-render-manifest.d/gitops-deploy-github-checks}
  - {path: /usr/local/bin/github-ruleset-drift.sh}
  - {path: /usr/local/bin/github-interaction-limit.sh}
  # H7.63: what initial_setup's untagged copies left on this host, which never ran the setup-drift
  # check: the Ansible-era copy of the host-check library (pi-heartbeats ships
  # /usr/lib/homelab/homelab-check-lib.sh), the drift library and their stamp fragments, and the
  # ansible.log cron's absent arm.
  - {path: /usr/local/lib/setup-drift-lib.sh}
  - {path: /usr/local/lib/homelab-check-lib.sh}
  - {path: /var/lib/homelab/setup-deployed-manifest.d/setup-drift-lib}
  - {path: /var/lib/homelab/setup-deployed-manifest.d/homelab-check-lib}
  - {cron: "Clear ansible log file", user: root}
# H7.30: the Pi's own LAN rules, beside ssh-firewall's two SSH rules. Each spec is what `ufw show
# added` prints for the Ansible task that added it, and each legacy entry names that rule by its
# exact spec and comment. A legacy rule that shares a declared spec is the one the arm adopts: it
# appends the spec with its `homelab:` label, which relabels the rule in place, and never deletes it.
#
# - node-exporter: the host node exporter's metrics port, which optimize_pi opened (H7.25 left it).
# - dockerd-metrics and containerd-metrics: the two Go runtimes' metrics listeners, which
#   docker_install opened (H7.26 left them).
# - `allow 51820/udp` is a stale WireGuard allow initial_setup deleted on every apply. The Pi's
#   wg-easy listens on 51822, and Docker's nat rules publish it ahead of ufw's INPUT chain, so no
#   rule replaces it. `replaced_by` only orders its deletion after the SSH keep rule is present.
# - The hand-added 51822 allow stays undeclared. It carries no `homelab:` label and no legacy
#   entry names it, so the arm leaves it alone.
ufw:
  rules:
    - {id: node-exporter, spec: "allow from {{ lan_subnet }} to any port 9100 proto tcp"}
    - {id: dockerd-metrics, spec: "allow from {{ lan_subnet }} to any port 9323 proto tcp"}
    - {id: containerd-metrics, spec: "allow from {{ lan_subnet }} to any port 1338 proto tcp"}
  legacy:
    - {spec: "allow from {{ lan_subnet }} to any port 9100 proto tcp", comment: "optimize_pi: node_exporter", replaced_by: node-exporter}
    - {spec: "allow from {{ lan_subnet }} to any port 9323 proto tcp", comment: "docker_install: dockerd metrics", replaced_by: dockerd-metrics}
    - {spec: "allow from {{ lan_subnet }} to any port 1338 proto tcp", comment: "docker_install: containerd metrics", replaced_by: containerd-metrics}
    - {spec: "allow 51820/udp", comment: "", replaced_by: ssh-limit}
