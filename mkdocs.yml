---
# The docs site. `uv run mkdocs build --strict` renders docs/ into site/; in production
# scripts/build_docs.py runs the reference generators first and builds into the hostPath the
# `docs` k3s role serves.
#
# docs_dir points at the EXISTING docs/ tree and the nav names those files in place. Moving
# them to fit a navigation shape would break every reference to docs/secret-rotation.md and
# its siblings across CLAUDE.md, the role docs and the skills.
site_name: Homelab Docs
site_description: Reference and runbooks for the daniel-box / daniel-server / daniel-pi homelab
docs_dir: docs
site_dir: site
use_directory_urls: true

theme:
  name: material
  features:
    - navigation.top
    - navigation.indexes
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true

plugins:
  - search

# Resolves the `<span class="fqdn">` placeholders the reference generators emit into links,
# using the domain of the URL the page was served from, and resolves the nav's sentinel hosts
# the same way. The generators cannot bake an FQDN in: they parse the tree statically and
# `domain` is SOPS-sourced. See the file's own header.
extra_javascript:
  - assets/fqdn-links.js

# Pages that are BUILT unless named here. mkdocs serves everything under docs_dir whether or
# not the nav links it, and it logs an unlinked page at INFO — so `--strict` does not catch
# one, and neither does reading the nav.
#
# `superpowers/` is 11 design plans kept on disk and deliberately gitignored (.gitignore:5-6).
# Untracked is not unpublished: the cron builds from the host's working tree, so they were
# being served from an internet-facing site. They are the only pages here with a real exposure
# delta — this repo is PUBLIC, so everything tracked is world-readable already and excluding it
# protects nothing. `adr/template.md` is a fill-in-the-blanks stub, not a decision.
exclude_docs: |
  superpowers/
  adr/template.md

# Built and served on purpose, but deliberately absent from the nav. `archive/` is the
# historical record of executed work — other docs and CLAUDE.md link INTO it, so excluding it
# would 404 those links, while listing 38 superseded planning docs in the nav would bury the
# live pages. Declaring it here is what separates "decided to leave unlinked" from "nobody
# noticed", which is the distinction the nav coverage test now enforces.
not_in_nav: |
  archive/

# ENFORCED by scripts/test_mkdocs_config.py, in both directions: every entry below must
# resolve to a file, and every docs/**.md must appear here OR be matched by exclude_docs above.
# A document absent from the nav is still built and served, but nothing links to it — which is
# indistinguishable from it not existing.
nav:
  - Home: index.md
  # A nav heading that is only a link, off the site to the artifacts browser. The host is a
  # sentinel: `domain` is SOPS-sourced, so nothing static can name the real one, and
  # assets/fqdn-links.js rewrites this href to the domain and tier the reader is already on
  # — the same derivation it does for the reference pages' `<span class="fqdn">` spans.
  #
  # The degradation differs from those spans and is worse. A span that is never rewritten
  # still reads as its placeholder text; a nav anchor is a live link or a dead one, so a
  # JavaScript failure leaves this entry pointing at an unresolvable host. Accepted: the
  # same failure already costs every service link on the reference pages.
  - Artifacts: https://artifacts.local.invalid/
  - Reference:
      - Services: reference/services.md
      - Hosts: reference/hosts.md
      - Secrets: reference/secrets.md
      - Scheduled jobs: reference/crons.md
      - Networking: reference/networking.md
      - Scripts: reference/scripts.md
      - Topology: reference/topology.md
  # template.md is deliberately absent — it is a form, not a document. The nav test only
  # checks docs/*.md, not subdirectories, so leaving it out costs nothing.
  - Decisions:
      - Index: adr/index.md
      - "ADR-0001 MkDocs site with generated reference": adr/0001-mkdocs-site-with-generated-reference.md
      - "ADR-0002 k3s over Docker Compose": adr/0002-k3s-over-docker-compose-for-the-cluster-nodes.md
      - "ADR-0003 SOPS with age for secrets": adr/0003-sops-with-age-for-secrets-at-rest.md
      - "ADR-0004 Authelia as the SSO layer": adr/0004-authelia-is-the-single-sign-on-layer.md
      - "ADR-0005 Traefik as the edge": adr/0005-traefik-is-the-edge-with-ingressroute-crds.md
      - "ADR-0006 Longhorn for cluster storage": adr/0006-longhorn-for-cluster-storage.md
      - "ADR-0007 Backup tiering: R2 daily, B2 weekly": adr/0007-backup-tiering-r2-daily-b2-weekly.md
      - "ADR-0008 16 MiB Longhorn blocks": adr/0008-16-mib-longhorn-blocks.md
      - "ADR-0009 NetworkPolicy default-deny": adr/0009-networkpolicy-default-deny-ingress.md
      - "ADR-0010 Pull-based GitOps over Argo and Flux": adr/0010-pull-based-gitops-over-argo-and-flux.md
      - "ADR-0011 One lock serialises every deploy path": adr/0011-one-lock-serialises-every-deploy-path.md
      - "ADR-0012 Zero-downtime rollout gates": adr/0012-zero-downtime-deploys-gate-on-rollout-and-restarts.md
      - "ADR-0013 daniel-pi stays on Docker": adr/0013-daniel-pi-stays-on-docker.md
      - "ADR-0014 Kopia retired, Longhorn owns B2": adr/0014-kopia-retired-longhorn-owns-the-b2-credentials.md
      - "ADR-0015 D2 for hand-authored diagrams": adr/0015-d2-for-hand-authored-diagrams.md
      # The long-form documents three of the records above compress. They sit under Decisions
      # rather than in a section of their own: each one is the working-out behind a single
      # ADR, and a reader who wants that depth arrives from the record, not from a
      # top-level heading. The former "Design" section held exactly these three plus the D2
      # plan, and ADR-0007, ADR-0009, ADR-0010 and ADR-0015 now carry all four decisions.
      - Background:
          - "Longhorn backup tiering (ADR-0007)": longhorn-backup-tiering.md
          - "NetworkPolicy default-deny (ADR-0009)": networkpolicy-default-deny.md
          - "Argo and Flux evaluation (ADR-0010)": gitops-argo-flux-evaluation.md
  # Runbooks and Operations were separate sections split on whether a procedure drives the
  # system or recovers it. The split leaked in both directions — an upgrade is both, and a
  # reader looking for "how do I do X" had to guess which heading X was filed under. One
  # section, ordered day-to-day first and recovery last.
  - Operations:
      - Deploying by hand: deploying.md
      - The GitOps pipeline: gitops-pipeline.md
      - Secret rotation: secret-rotation.md
      - Claude shell permissions: claude-shell-permissions.md
      - Security tools: security-tools.md
      - WireGuard private access: wireguard-private-homelab-access.md
      - Healthchecks.io deadman: healthchecks-io-deadman.md
      # Label omits the word this document's title carries before "drain". With it,
      # gitleaks' generic-api-key rule reads the label plus the high-entropy filename
      # after the colon as a credential and fails the commit.
      - B2 drain scoping: b2-api-drain-scoping.md
      - B2 transaction cap gaps: b2-transaction-cap-monitoring-gaps.md
      - Email to RSS: email-to-rss.md
      - Longhorn upgrade: longhorn-upgrade.md
      - Longhorn disaster recovery: longhorn-disaster-recovery.md
      - k3s etcd restore: k3s-etcd-restore.md
      - Kopia disaster recovery: kopia-disaster-recovery.md
