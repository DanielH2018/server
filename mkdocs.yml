      - "ADR-0023 Fact support is a diff notice": adr/0023-fact-support-is-a-diff-notice.md
      - "ADR-0024 Code scanning is off": adr/0024-code-scanning-is-off.md
      - "ADR-0025 SUC upgrades k3s, and homelab-k3s-restart restarts it": adr/0025-suc-upgrades-k3s-and-homelab-k3s-restart-restarts-it.md
      - "ADR-0026 One alert plane on Prometheus and Alertmanager; Uptime Kuma retired": adr/0026-one-alert-plane-on-prometheus-and-alertmanager.md
      - "ADR-0027 Fan-out batches stay on host cgroups": adr/0027-fanout-batches-stay-on-host-cgroups.md
      - "ADR-0028 The cluster render supports a closed Jinja subset": adr/0028-the-renderer-supports-a-closed-jinja-subset.md
      - "ADR-0029 Each host is configured by its own package, and Ansible is gone": adr/0029-each-host-is-configured-by-its-own-package-not-ansible.md
      - "ADR-0030 The ansible/ tree is renamed for what it holds": adr/0030-the-ansible-tree-is-renamed-for-what-it-holds.md
      - "ADR-0031 One home and one stateless detector per kind of fact": adr/0031-each-kind-of-fact-has-one-stateless-detector.md
      - "ADR-0032 CI's heavy jobs may run on runner pods": adr/0032-cis-heavy-jobs-may-run-on-runner-pods.md
      - "ADR-0033 A game server's replica count is runtime state": adr/0033-game-server-replicas-are-runtime-state.md
      - "ADR-0034 GitHub quota is budgeted per session, in the wrappers": adr/0034-github-quota-is-budgeted-per-session-in-the-wrappers.md
      - "ADR-0035 The skeptic and implementer agents carry no turn cap": adr/0035-skeptic-and-implementer-carry-no-maxturns.md
      - "ADR-0036 A selected run proves its tree, and a nightly sweep is the net": adr/0036-a-selected-run-proves-its-tree-and-a-nightly-sweep-is-the-net.md
      - "ADR-0037 The renderer keeps Jinja after Ansible": adr/0037-the-renderer-keeps-jinja-after-ansible.md
      - "ADR-0038 Design is checked where code is written": adr/0038-design-is-checked-where-code-is-written.md
      - "ADR-0039 scripts/ is installed in place": adr/0039-scripts-is-installed-in-place.md
      - "ADR-0040 Dead names, copied tests and unused parameters are gated": adr/0040-dead-names-copied-tests-and-unused-parameters-are-gated.md
      - "ADR-0041 The B2 weekly bucket and the R2 etcd snapshots are locked": adr/0041-b2-weekly-and-r2-etcd-snapshots-are-locked.md
      - "ADR-0042 Each variable lives with what it describes": adr/0042-each-variable-lives-with-what-it-describes.md
      # Each is the working-out behind a single ADR, so a reader arrives from the record.
      - Background:
          - "Longhorn backup tiering (ADR-0007)": longhorn-backup-tiering.md
          - "NetworkPolicy default-deny (ADR-0009)": networkpolicy-default-deny.md
          # Live content, not archive material: it holds the answers each deploy settled, and slice
          # 5's four decisions govern how the baseline selects pods.
          - "NetworkPolicy — what each slice settled": networkpolicy-slice-answers.md
          - "Variable layout migration (ADR-0042)": variable-layout-migration.md
          - "Argo and Flux evaluation (ADR-0010)": archive/gitops-argo-flux-evaluation.md
  # A group is a nav heading only: every page keeps its path, so moving one between groups breaks no
  # link.
  - Operations:
      - How the lab is built: what-the-migration-built.md
      - Deploy and land:
          - Deploying a change: deploying.md
          - Landing a merged PR: landing.md
          - The Flux deploy plane: flux-deploy-plane.md
