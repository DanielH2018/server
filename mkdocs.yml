---
# docs_dir points at the existing docs/ tree; moving files to fit a nav shape would break references
# across CLAUDE.md, role docs and skills.
site_name: Homelab Docs
site_description: Reference and runbooks for the daniel-box / daniel-server / daniel-pi homelab
docs_dir: docs
site_dir: site
use_directory_urls: true

theme:
  name: material
  # The Docs tile's mdi icon and colour in homepage's services.yaml.j2.
  favicon: assets/favicon.svg
  icon:
    logo: material/book-open-variant
  features:
    - navigation.top
    - navigation.indexes
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  # `check_paths` turns an include naming a fragment nobody generates into a strict-build failure;
  # otherwise the include line renders as text.
  - pymdownx.snippets:
      base_path: [docs]
      check_paths: true

plugins:
  - search

# The generators cannot bake an FQDN in: they parse the tree statically and `domain` is
# SOPS-sourced.
extra_css:
  - assets/extra.css

extra_javascript:
  - assets/fqdn-links.js
  # Runs in the browser because the filter is the reader's choice; it sits after fqdn-links.js so a
  # filter matches the resolved links.
  - assets/table-filter.js

# Resolves at build time because a path to URL map is fully known then; the leading underscore keeps
# it out of the Scripts reference.
hooks:
  - scripts/docs/_mkdocs_repo_links.py
  # Computed from git at build time, so nothing is committed.
  - scripts/docs/_mkdocs_freshness.py

# mkdocs serves everything under docs_dir, in the nav or not. `superpowers/` is untracked, but the
# build reads the working tree, so without this the internet-facing site serves it.
exclude_docs: |
  superpowers/
  adr/template.md
  # Snippet bodies, not pages: excluding a file from the build does not hide it from the snippets
  # extension.
  assets/generated/fragments/

# Built and served on purpose, but deliberately absent from the nav. `archive/` is the
# historical record of executed work — other docs and CLAUDE.md link INTO it, so excluding it
# would 404 those links, while listing every superseded planning doc in the nav would bury the
# live pages. Its README is the index a reader browses the archive from, and the home page
# links it. Declaring it here is what separates "decided to leave unlinked" from "nobody
# noticed", which is the distinction the nav coverage test now enforces.
#
# `target-architecture/` holds only the docs-guard slices, which are still in progress.
# what-the-migration-built.md links the docs-guard handoff.
#
# DECIDED: docs/archive stays; size was never the concern, and a PR number is not greppable
# offline the way the linked record is.
#
# `reference/backlog.md` is the same case for a different reason: `findings.py list` is the
# open register, this page is only its rendering, and `issue-claiming-and-fanout.md` and
# CLAUDE.md link INTO it directly — so it stays built and reachable, just off the nav.
not_in_nav: |
  archive/
  target-architecture/
  reference/backlog.md

# A document absent from the nav is still built and served but nothing links to it.
nav:
  - Home: index.md
  # The host is a sentinel because `domain` is SOPS-sourced; fqdn-links.js rewrites the href.
  - Artifacts: https://artifacts.local.invalid/
  - Reference:
      - Services: reference/services.md
      - Hosts: reference/hosts.md
      - Secrets: reference/secrets.md
      - Scheduled jobs: reference/crons.md
      - State of the lab: reference/state.md
      - Networking: reference/networking.md
      - Scripts: reference/scripts.md
      - Repo size: reference/size.md
      - Topology: reference/topology.md
      - Doc freshness: reference/freshness.md
      - Decision markers: reference/decisions.md
  # template.md is deliberately absent: it is a form, not a document.
  - Decisions:
      - Index: adr/index.md
      - "ADR-0001 MkDocs site with generated reference": adr/0001-mkdocs-site-with-generated-reference.md
      - "ADR-0002 k3s over Docker Compose": adr/0002-k3s-over-docker-compose-for-the-cluster-nodes.md
      - "ADR-0003 SOPS with age for secrets": adr/0003-sops-with-age-for-secrets-at-rest.md
