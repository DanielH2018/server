---
# Template for a new host's host_vars. Copy it to `<hostname>.yml` and edit the copy. The
# inventory skips a `_`-prefixed file (scripts/lib/inventory_lists.py), so this one is no host.
# docs/host-packages.md, *Adding a host*, is the walkthrough. Defaults quoted below come from
# inventory/group_vars/all.yml; leave out anything already correct there.
#
# Never put a secret here: inventory/ is neither SOPS-encrypted nor hook-guarded
# (.claude/rules/secrets.md). A host's secrets go in secrets/hosts/<hostname>.sops.yaml.

# Required: no default exists, and the host's package fails to render or misbehaves without it

# The host's LAN IP. Needed by every component that publishes a LAN-bound port or firewalls by
# IP, and read cross-host as hosts[<other>].server_ip.
server_ip: 10.0.0.x

# Where sshd's config actually lives on this OS image — check with
# `sudo sshd -T | grep -i '^include'` or `ls /etc/ssh/sshd_config.d/`. Cloud-init images
# (the Pi) drop a file under sshd_config.d/; a stock Ubuntu install uses the bare path.
# The sshd and integrity-scans components read this path.
ssh_config_path: /etc/ssh/sshd_config

# A Docker host lists its Compose services here, which its host package deploys. A k3s node
# deletes the key, because its services are k3s roles under k8s/roles/ (repo-root CLAUDE.md,
# "Project Overview").
compose_services: []

# Whether this host holds a checkout of THIS repo at ~/server. Default: true. The k3s-host-checks
# component reads it to decide whether the host runs the B2-accounting crons.
has_repo_checkout: true

# Hardware / capability flags: set only what this host actually has

# Default: false. Intel iGPU present → /dev/dri passthrough for jellyfin/tdarr transcode.
# has_igpu: true

# Optional overrides

# Unset by default — each compose template falls back to its own value (10s/30s). Raise it
# on a slow/constrained host: every probe costs 2 runc invocations. Timeout and retries are
# tunable the same way (templates fall back to 5-10s / 3): widen them where a probe's exec
# stalls under load without the service being down, so the stall does not read `unhealthy`.
# container_healthcheck_interval: 60s
# container_healthcheck_timeout: 60s
# container_healthcheck_retries: 5

# Disk-backed swap, for a host with too little RAM for a heavy apt run (the 512 MB Pi Zero 2 W).
# bootstrap-host.sh step 4 creates it ahead of its apt steps, and its PI_SWAPFILE and
# PI_SWAPFILE_SIZE pins equal these values (hosts/lib/tests/test_bootstrap_host_pins.py).
# pi_swapfile_path: /swapfile
# pi_swapfile_size: 1G
