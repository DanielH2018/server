---
# Template for a new host's host_vars. Copy to `<hostname>.yml` and edit — Ansible only
# loads a host_vars file whose name matches an inventory hostname, so this one is inert.
# Full walkthrough: docs/host-bring-up.md §4. Defaults quoted below come from
# inventory/group_vars/all.yml; anything already correct there can simply be left out.
#
# Never put a secret here — inventory/ is NOT SOPS-auto-encrypted and NOT hook-guarded
# (see .claude/rules/secrets.md). Secrets go in vars/secrets.yml and are referenced by name.

# Required: no default exists, and a role will fail or misbehave without it

# The host's LAN IP. Needed by every role that publishes a LAN-bound port or firewalls by
# IP, and read cross-host as hosts[<other>].server_ip.
server_ip: 10.0.0.x

# Where sshd's config actually lives on this OS image — check with
# `sudo sshd -T | grep -i '^include'` or `ls /etc/ssh/sshd_config.d/`. Cloud-init images
# (the Pi) drop a file under sshd_config.d/; a stock Ubuntu install uses the bare path.
# The sshd and integrity-scans components read this path.
ssh_config_path: /etc/ssh/sshd_config

# A Docker host lists its Compose services here, which its host package deploys. A k3s node
# deletes the key, because the k3s services live in cluster/services.yml (repo-root CLAUDE.md,
# "Project Overview").
compose_services: []

# Bring-up: revert once the host is established


# Whether this host holds a checkout of THIS repo at ~/server.
# Default: true. Set false for a host Ansible drives over ssh that never checks the repo out.
# No host in the inventory sets it false, and no setup task reads it since H7.44.
has_repo_checkout: true

# Hardware / capability flags: set only what this host actually has

# Default: false. Intel iGPU present → /dev/dri passthrough for jellyfin/tdarr transcode.
# has_igpu: true

# Default: false.
# has_code_server: true

# Physical location for the homepage weather widget — only the host running homepage needs it.
# lat: 38.89
# long: -77.08

# Optional overrides

# Unset by default — each compose template falls back to its own value (10s/30s). Raise it
# on a slow/constrained host: every probe costs 2 runc invocations. Timeout and retries are
# tunable the same way (templates fall back to 5-10s / 3): widen them where a probe's exec
# stalls under load without the service being down, so the stall does not read `unhealthy`.
# container_healthcheck_interval: 60s
# container_healthcheck_timeout: 60s
# container_healthcheck_retries: 5

# Disk-backed swap, created before the apt tasks run. Only needed on a host with too little
# RAM for `upgrade: dist` / AIDE init (the 512 MB Pi Zero 2 W).
# pi_swapfile_path: /swapfile
# pi_swapfile_size: 1G

# Fleet-role assignments (defined in group_vars/all.yml, all defaulting to
# daniel-server). Override only when MOVING a role to this host, and make sure
# the old host stops claiming it.
# renovate_notify_host: <hostname>
