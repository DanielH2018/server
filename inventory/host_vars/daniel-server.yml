---
server_ip: 10.0.0.161
# The link carrying server_ip. The k3s-agent component's netplan file pins the address on it
# statically, so the k3s agent still starts when the gateway's DHCP server is down (#3891).
# The gateway reserves server_ip for this NIC (operator, 2026-10-10). wlo1 keeps its DHCP
# route at metric 600 as the fallback. That fallback wins only because the netplan file sets
# ignore_routes_with_linkdown on this link (#4510). The pin also holds the link's IPv6 RA route
# at metric 100, so IPv6 prefers it over wlo1 too (#4561).
k3s_node_static_link: enp88s0
# The Intel AX201. The installer's 00-installer-config-wifi.yaml joined it first; the k3s-agent
# component's wifi fallback netplan file merges on top and pins the metric-600 route.
k3s_node_wifi_link: wlo1
ssh_config_path: /etc/ssh/sshd_config
# Intel XE iGPU present — enables /dev/dri passthrough for jellyfin/tdarr hardware transcode.
has_igpu: true
# Dissolves docker-proxy-codeserver and the `codeserver` net from the docker-proxy compose.
has_code_server: false
# No Docker engine: this host is a k3s agent node.
has_docker: false

# Claude Code session host for issue-fanout agents. The Remote Control unit
# stays on daniel-box; agents here stop at `gh pr create` and a daniel-box session lands the
# PR, because the k8s play, the connection=local pin and the per-host lock keep deploys there.
has_claude_code: true
claude_code_rc_enabled: false
# The `claude` agent user, so a fan-out launched as `claude` on daniel-box can place a batch
# here (docs/claude-agent-user.md, slice 5). Its batches stop at the PR as before. It needs one
# interactive `/login` as `claude` here, and its signing key registered on the agent's GitHub
# account, after the first apply. False expires the account and keeps its home.
claude_code_agent_user_enabled: true
# The read-only root inspector, `rootq` (issue #6323), for the operator's account.
# False removes the grant, the shim and the script.
claude_code_rootq_enabled: true
# The same inspector for the agent user through a socket (issue #6350). False removes the
# socket, its units, the helper, the client and the group, and the agent leaves the group.
claude_code_rootq_socket_enabled: true
# daniel-box's agent logs in here as `claude` with the key claude-agent-home generates there.
# False removes the key and the ssh-users membership.
claude_agent_ssh_login_enabled: true
# The agent user takes the operator's dotfiles here too, as on daniel-box. A fan-out batch
# launched as `claude` needs the claude-guard shim they deploy: since #6116 every headless
# launch names claude-guard's prompt server, and refuses to start without the shim (#6117).
# Rollback: delete this line; the hand-picked config copy comes back on the next apply.
claude_code_agent_dotfiles: true

# DECIDED: 24G fleet cap, derived the way defaults/main.yml derives daniel-box's 20G: the
# operator set a floor of 8 GiB of host RAM available on 2026-11-13, and the cap is that floor
# worked backward. Re-derive all of it if you change this:
#   Measured on daniel-server 2026-11-13 23:25 UTC: MemTotal 31.0 GiB, MemAvailable 23.3 GiB
#     with the fleet slice at 9.4 GiB of its old 18G cap.
#   Spendable above the floor: 23.3 - 8 = 15.3 GiB.
#   Cap: the fleet's current 9.4 GiB + 15.3 GiB spendable = 24.7 GiB, rounded down to 24G.
#   Worst case: if every byte the fleet adds up to the cap stays unreclaimable, available
#     falls to 23.3 - (24 - 9.4) = 8.7 GiB. Page cache the fleet adds is reclaimable, so
#     8.7 GiB is a lower bound.
# Until 2026-11-13 the cap was 18G: 31.0 GiB - 8.4 GiB budget for the homelab plane's anon
#   (measured 6.0 GiB, +40%) - 0.6 GiB SUnreclaim - 3 GiB page cache = 19.0 GiB. The cap was
#   10G until 2026-09-26, then 13G against a budget that still counted the retired
#   daniel-stage KVM guest's 4.75 GiB (#2941), then 18G on 2026-10-17.
# The floor moves one for one with the homelab plane, so re-check kubepods.slice and
#   system.slice anon first if k3s grows. The throttle stalls whichever cgroup loses the
#   reclaim race, and the homelab plane is the one that must not.
# With the RC unit disabled, user-1000.slice is the only plane here, so the 23G login cap is
# the effective per-plane bound and the fleet cap only matters once a second plane appears.
claude_code_fleet_memory_high: 24G
# 2G is under a third of this host's 7 GiB swap (`free -g`) — the same
# shape as daniel-box's "a quarter of its 8 GiB" reasoning in defaults/main.yml:117-119.
claude_code_fleet_swap_max: 2G
claude_code_rc_memory_high: 23G
claude_code_rc_memory_swap_max: 2G
# 8 cores against daniel-box's 16. The bound that matters is workers x concurrent runs, not
# workers (defaults/main.yml): 4 x 6 fan-out agents is 24 workers, ~2.4 GB against the 23G
# login cap. CPU is not what failed, so the count is not scaled down with the cores.
claude_code_rc_pytest_workers: 4
