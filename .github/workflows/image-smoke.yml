name: image-smoke

# Runs on EVERY PR (no `paths:` filter) on purpose: this is a required status check,
# and a path-filtered workflow that never triggers would leave the PR's required check
# stuck at "Expected — waiting for status". The job self-scopes instead — the
# "Collect changed image refs" step diffs only the compose templates, so a PR that
# touches none yields an empty list and the boot step is skipped (a fast green).
#
# workflow_dispatch takes an explicit list instead of the diff, for two jobs the PR trigger
# cannot do. It is the only way to exercise a change to the check itself — a PR that edits this
# file changes no image pin, so the diff is empty and the checks below never run. And it is how
# to sweep refs the PR path has not seen: 12 of the 81 tracked pins were excluded from even the
# `docker pull` until 2026-08-21, so nothing has ever verified that those tags resolve.
on:
  pull_request:
  workflow_dispatch:
    inputs:
      images:
        description: "Image refs to check, whitespace-separated. Empty falls back to the PR diff, which is empty on a dispatch."
        required: false
        type: string

# Cancel a superseded run when new commits land on the same PR (force-push / Renovate
# rebases) — image-smoke pulls + boots images, so superseded runs waste real runner minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: pull + boot changed images
    runs-on: ubuntu-latest
    timeout-minutes: 20  # cap a hung docker pull / image that never reaches healthy (per-container boot is already bounded)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          # Kept, though this job no longer needs a specific interpreter (see below): the pin is
          # asserted in lockstep with ci.yml and .python-version by
          # scripts/test_renovate_managers.py::test_python_version_pins_in_lockstep, and the step
          # measures 0s because ubuntu-latest preinstalls this version.
          python-version: "3.14"

      # No setup-uv step: scripts/dev/smoke_extract.py imports `re` and `sys` and nothing else, so it
      # needs no project env — `uv run` here was resolving the whole `dev` group (uncached, since
      # this workflow never set enable-cache) to run a stdlib script, ~3s of a ~10s job. If that
      # script ever grows a third-party import, add `astral-sh/setup-uv` back WITH enable-cache
      # and restore the `uv run` form below.
      - name: Collect changed image refs
        id: images
        env:
          BASE_REF: ${{ github.base_ref }}  # via env, never interpolated into the shell
          DISPATCH_IMAGES: ${{ inputs.images }}  # same: data, never shell source
        run: |
          set -euo pipefail
          # A dispatch names its refs outright; there is no base branch to diff against.
          if [ -n "${DISPATCH_IMAGES:-}" ]; then
            images="$(printf '%s' "$DISPATCH_IMAGES" | tr -s '[:space:]' '\n' | sed '/^$/d')"
            {
              echo "list<<EOF"
              echo "$images"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            echo "Dispatched images:"; echo "$images"
            exit 0
          fi
          if [ -z "${BASE_REF:-}" ]; then
            # A dispatch that named no images. Nothing to diff against; say so rather than
            # letting `git fetch origin ""` fail the job.
            printf 'list<<EOF\nEOF\n' >> "$GITHUB_OUTPUT"
            echo "No images given and no base branch to diff — nothing to check."
            exit 0
          fi
          # No --depth here. The checkout above is full (fetch-depth: 0) precisely so the
          # three-dot diff below can find a merge base; a shallow fetch writes a shallow
          # boundary over origin/$BASE_REF and the merge base becomes unreachable, failing
          # the step with "no merge base". ci.yml's equivalent fetch is depth-less for the
          # same reason.
          git fetch --no-tags origin "$BASE_REF"
          # Scope is the k8s image plane: role defaults plus group_vars/all.yml (crowdsec_k8s_image
          # lives there). The compose half was dropped 2026-08-14 — both cluster hosts are drained
          # and daniel-pi has no CI deploy path, so that glob matched nothing deployable.
          #
          # A Renovate bump to a version-bearing Dockerfile FROM (ical-proxy python:3.14-slim,
          # peanut debian:bookworm-slim) is deliberately NOT boot-smoked here — those are
          # manual-merge dockerfile-manager updates with no custom.regex automerge match.
          #
          # What this proves is narrow, and the boot step below says which half is which. The
          # real gate is post-merge — the play runs `rollout status` + the stabilisation gate,
          # and for auto-deploy-eligible services gitops_deploy rolls back and holds on failure.
          # That backstop only exists for the 14 eligible roles; the other 41 are merged by
          # Renovate and applied by hand, so for them this job is the last automated check
          # before a human runs the deploy. Which is why it now covers every ref rather than
          # excluding the ones that cannot boot bare — all 9 roles the old exclusion list
          # touched were denylisted ones.
          diff="$(git diff "origin/$BASE_REF"...HEAD -- \
            'ansible/roles/k8s/*/defaults/main.yml' \
            'ansible/inventory/group_vars/all.yml')"
          images="$(printf '%s' "$diff" | python scripts/dev/smoke_extract.py)"
          {
            echo "list<<EOF"
            echo "$images"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Changed images:"; echo "$images"

      # Two layers, deliberately split by whether a check needs the image's real config.
      #
      # Layer 1 is fatal and never executes the image: `docker create` builds a container and
      # does not start it, so a config-required entrypoint is irrelevant. That is what lets
      # this run over EVERY changed ref with no exception list.
      #
      # Layer 2 is the bare `docker run` this job used to be, kept but downgraded to an
      # annotation. It was fatal until 2026-08-21 and had, across 11 failures and 14 months,
      # never once caught a real image problem — every failure was an image that needs config
      # to boot, which is the normal case for a service. Making it advisory is what let
      # `_SKIP_BARE_BOOT` be deleted; that list had grown to 11 repositories, one red PR at a
      # time, and because it filtered refs out ahead of the pull it left 12 of the 81 tracked
      # pins checked by nothing at all.
      - name: Pull + boot each image
        if: steps.images.outputs.list != ''
        env:
          LIST: ${{ steps.images.outputs.list }}  # via env so refs are data, never shell source
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r img; do
            [ -z "$img" ] && continue
            echo "::group::smoke $img"

            ### Layer 1 — fatal. Needs no config, so it applies to every image.

            if ! docker pull "$img"; then
              echo "FAIL: $img does not pull"; fail=1; echo "::endgroup::"; continue
            fi
            # `create`, not `run`: builds the container without starting it.
            cid="$(docker create "$img" 2>/dev/null || true)"
            if [ -z "$cid" ]; then
              echo "FAIL: $img pulled but no container can be created from it"
              fail=1; echo "::endgroup::"; continue
            fi
            # What the image says it runs — Entrypoint first, Cmd when there is no entrypoint.
            entry="$(docker inspect -f \
              '{{if .Config.Entrypoint}}{{index .Config.Entrypoint 0}}{{else if .Config.Cmd}}{{index .Config.Cmd 0}}{{end}}' \
              "$cid")"
            if [ -z "$entry" ]; then
              echo "note: $img declares neither Entrypoint nor Cmd — nothing to assert"
            else
              # Three shapes, and they resolve against three different things. Getting this
              # wrong produces a false failure on a perfectly good image, so each was checked
              # against real images on 2026-08-21 rather than assumed:
              #
              #   /app/entrypoint.sh   absolute — assert as given (authelia, tempo, dozzle)
              #   tini                 no slash — resolved through PATH at runtime (couchdb,
              #                        python's `python3`, wg-easy's `docker-entrypoint.sh`)
              #   ./run.sh             has a slash but is relative — resolved against
              #                        WorkingDir, NOT PATH (beardedio/terraria)
              #
              # Neither of the latter two is an edge case: of the 12 pins swept, three took the
              # PATH branch and one the WorkingDir branch.
              case "$entry" in
                /*)
                  candidates="$entry"
                  ;;
                */*)
                  workdir="$(docker inspect -f '{{.Config.WorkingDir}}' "$cid")"
                  [ -z "$workdir" ] && workdir="/"
                  candidates="${workdir%/}/${entry#./}"
                  ;;
                *)
                  path="$(docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' "$cid" \
                          | sed -n 's/^PATH=//p' | head -n1)"
                  [ -z "$path" ] && path="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
                  candidates="$(printf '%s' "$path" | tr ':' '\n' | sed "s|\$|/$entry|")"
                  ;;
              esac
              # docker cp reads the path out of the layer set and errors when it is absent.
              # This is the one check here the bare boot does not already cover: it catches a
              # base-image change that moved or renamed the binary, which otherwise surfaces
              # for the first time at deploy.
              found=""
              while IFS= read -r cand; do
                [ -z "$cand" ] && continue
                if docker cp "$cid:$cand" - >/dev/null 2>&1; then found="$cand"; break; fi
              done <<< "$candidates"
              if [ -n "$found" ]; then
                echo "ok: $entry resolves to $found"
              else
                echo "FAIL: $img declares '$entry' but the image does not contain it"
                fail=1
              fi
            fi
            docker rm -f "$cid" >/dev/null 2>&1 || true

            ### Layer 2 — advisory. Never sets `fail`.

            # Sandbox the untrusted PR-supplied image: cap CPU/memory/PIDs and block
            # privilege escalation, so a malicious ref (e.g. a crypto-miner) is bounded to
            # negligible work for the ~60s boot rather than getting a full runner. Caps don't
            # affect a legitimate image's ability to start. Deliberately NOT using --network
            # none / --read-only / --cap-drop ALL: those false-fail legit images that need the
            # network, a writable FS, or caps at boot.
            # No --rm: an exited container must survive so its logs are still readable below.
            cid="$(docker run -d \
              --memory=2g --cpus=2 --pids-limit=1024 \
              --security-opt=no-new-privileges \
              "$img" || true)"
            if [ -z "$cid" ]; then
              echo "::warning::$img did not start under a bare docker run"
              echo "::endgroup::"; continue
            fi
            # If the image declares a HEALTHCHECK, wait up to 60s for healthy.
            has_hc="$(docker inspect -f '{{if .Config.Healthcheck}}yes{{end}}' "$cid")"
            ok=1
            if [ "$has_hc" = "yes" ]; then
              for _ in $(seq 1 30); do
                st="$(docker inspect -f '{{.State.Health.Status}}' "$cid" 2>/dev/null || echo gone)"
                [ "$st" = "healthy" ] && { ok=0; break; }
                [ "$st" = "gone" ] && break
                sleep 2
              done
            else
              # No healthcheck: it stayed up 30s, or exited cleanly. A base image with an
              # interpreter entrypoint runs a REPL that exits 0 on EOF.
              sleep 30
              if [ "$(docker inspect -f '{{.State.Running}}' "$cid" 2>/dev/null || echo false)" = "true" ]; then
                ok=0
              elif [ "$(docker inspect -f '{{.State.ExitCode}}' "$cid" 2>/dev/null || echo 1)" = "0" ]; then
                ok=0
              fi
            fi
            if [ "$ok" -ne 0 ]; then
              echo "::warning::$img does not boot without its config — advisory, not a failure"
              docker logs "$cid" 2>&1 | tail -n 30
            else
              echo "ok: boots bare"
            fi
            docker rm -f "$cid" >/dev/null 2>&1 || true
            echo "::endgroup::"
          done <<< "$LIST"
          exit "$fail"
