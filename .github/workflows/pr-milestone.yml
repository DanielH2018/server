name: pr-milestone

# Adds a Claude session's pull request to that session's milestone, beside the issues
# `findings.py claim` put there. scripts/dev/pr_milestone.py picks the milestone and
# scripts/dev/findings_lib/milestone.py documents the scheme. Running on the PR event covers
# every way a PR opens: an agent's `gh pr create`, a fan-out batch, and the web UI.
#
# Only a same-repo PR runs it. A fork PR gets a read-only token, and this repo is public, so
# the job never uses `pull_request_target`.

on:
  pull_request:
    types: [opened, reopened, edited]

permissions: {}

concurrency:
  group: pr-milestone-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  milestone:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup
        with:
          uv: "false"

      - name: Add the PR to its session milestone
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python scripts/dev/pr_milestone.py "$PR_NUMBER" --repo "$GITHUB_REPOSITORY"
