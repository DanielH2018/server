name: image-leg

# Runs the pytest tests marked `image`: they execute a script and its fixtures inside a pinned
# container image with `docker run`. `addopts` in pyproject.toml deselects the marker from the
# `pytest` shards in ci.yml, so this job and the nightly run in pytest-sweep.yml are the only
# places those tests run.
#
# A separate workflow, not a ci.yml job: every ci.yml job must be read by the `prek` gate
# (tests/repo/test_every_ci_job_is_gated.py), which would make this one a merge blocker through
# that required context. A red run is visible on the PR and blocks nothing.
#
# It runs on a PR that touches what the image tests read or this file, and on a dispatch.
# scripts/tests/test_image_leg_paths_cover_test_imports.py holds the `paths:` list against the
# image tests' import closure. The `paths:` filter is safe because the check is not a required
# context: a skipped trigger cannot leave a required check waiting.

on:
  pull_request:
    # `ready_for_review` joins the defaults: the job skips a draft, and a pull request opened as a
    # draft and never pushed again would otherwise leave draft without a run.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/image-leg.yml"
      - "k8s/roles/longhorn-restore-drill/**"
      - "tests/longhorn/**"
      # The restore drill's Postgres container runs the Airflow role's Postgres pin.
      - "k8s/roles/airflow/defaults/main.yml"
      # crowdsec's two images: the role pins the jobs image, all.yml pins the engine image.
      - "k8s/roles/crowdsec/**"
      - "inventory/group_vars/all.yml"
      - "hosts/lib/tests/test_pi_compose_network_measurement.py"
      - "pyproject.toml"
      - "uv.lock"
      # `$/` pins the setup action to this pull request's commit.
      - ".github/actions/setup/**"
      # What the image tests, their conftests and the `addopts` plugins import.
      # scripts/tests/test_image_leg_paths_cover_test_imports.py fails on a module missing here.
      - "k8s/conftest.py"
      - "tests/conftest.py"
      - "tests/_helpers.py"
      - "tests/_k8s_render.py"
      - "tests/_role_census.py"
      - "tests/_shell_render.py"
      - "tests/failure_report.py"
      - "tests/leakguard.py"
      - "tests/named_files.py"
      - "tests/phase_timing.py"
      - "tests/render_share.py"
      - "tests/xdist_width.py"
      - "hosts/lib/host_lib.py"
      - "hosts/lib/tests/conftest.py"
      - "hosts/lib/tests/_updater_host.py"
      - "scripts/deploy_tools/chained_timeout.py"
      - "scripts/deploy_tools/changed_set.py"
      - "scripts/deploy_tools/kustomizations.py"
      - "scripts/lib/cli_help.py"
      - "scripts/lib/container_entry.py"
      - "scripts/lib/estate.py"
      - "scripts/lib/exit_codes.py"
      - "scripts/lib/git.py"
      - "scripts/lib/guard_jinja_env.py"
      - "scripts/lib/host_modules.py"
      - "scripts/lib/inventory_lists.py"
      - "scripts/lib/jinja_comments.py"
      - "scripts/lib/k8s_conditions.py"
      - "scripts/lib/k8s_context.py"
      - "scripts/lib/k8s_lookups.py"
      - "scripts/lib/k8s_objects.py"
      - "scripts/lib/k8s_role_callers.py"
      - "scripts/lib/k8s_roles.py"
      - "scripts/lib/k8s_yaml.py"
      - "scripts/lib/longhorn_lib/longhorn_backups.py"
      - "scripts/lib/plain_scalar.py"
      - "scripts/lib/proc_testing.py"
      - "scripts/lib/progress.py"
      - "scripts/lib/render_context.py"
      - "scripts/lib/render_guard.py"
      - "scripts/lib/repo_paths.py"
      - "scripts/lib/role_files.py"
      - "scripts/lib/yaml_fast.py"
      - "scripts/renderer/homelab_render.py"
      - "scripts/renderer/shadow_diff.py"
      - "scripts/renderer/renderer_lib/*.py"
      - "scripts/renderer/template_filters/*.py"
      - "scripts/secrets_mgmt/cluster_vars_check.py"
      - "scripts/validate/render_lib/shell.py"
      - "scripts/validate/validate_lib/host_specs.py"
      - "scripts/validate/validate_lib/shell_lint.py"
      - "scripts/validate/validate_lib/shipped_render.py"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  image-leg:
    name: image-leg (scripts run under their pinned image)
    if: ${{ github.event.pull_request.draft != true }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20  # a cold pull of the 320 MB runner image is the slow step
    env:
      # Skips pyproject.toml's `lint` group, which no step here runs (test_ci_lint_group.py).
      UV_NO_GROUP: lint
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false  # nothing here pushes

      - uses: $/.github/actions/setup

      # `-m image` replaces the `not ui and not image` in addopts. The paths are the narrowest ones
      # that collect the marked modules; `-n 0` keeps the pull on one process, and `-s` lets the
      # Compose network measurement print Compose's own output into this log.
      - name: Run the image tests
        run: >-
          uv run python -m pytest --color yes -n 0 -s -m image tests/longhorn/
          hosts/lib/tests/test_pi_compose_network_measurement.py
          k8s/roles/crowdsec/tests/test_jobs_image.py
