name: session-milestone

# Only a same-repo PR runs a job: a fork PR gets a read-only token and no job uses
# `pull_request_target`.

on:
  pull_request:
    types: [opened, reopened, edited, closed]
  issues:
    types: [closed]

permissions: {}

jobs:
  attach:
    if: >-
      github.event_name == 'pull_request' && github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    concurrency:
      group: session-milestone-attach-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup
        with:
          uv: "false"

      - name: File the PR under its session milestone
        env:
          PYTHONPATH: scripts
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python scripts/dev/session_milestone.py attach-pr "$PR_NUMBER" --repo "$GITHUB_REPOSITORY"

  close:
    # A job-level guard, so an issue or PR in no milestone starts no runner.
    if: >-
      (github.event_name == 'issues' && github.event.issue.milestone) ||
      (github.event_name == 'pull_request' && github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.milestone)
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    # Never cancelled: two milestones finishing together must both close.
    concurrency:
      group: session-milestone-close-${{ github.event.pull_request.milestone.number || github.event.issue.milestone.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup
        with:
          uv: "false"

      - name: Close the milestone if nothing in it is open
        env:
          PYTHONPATH: scripts
          GH_TOKEN: ${{ github.token }}
          MILESTONE: ${{ github.event.pull_request.milestone.number || github.event.issue.milestone.number }}
        run: python scripts/dev/session_milestone.py close-if-done "$MILESTONE" --repo "$GITHUB_REPOSITORY"
