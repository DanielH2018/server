name: CI

on:
  pull_request:
  push:
    branches: [master]

# Cancel a superseded run when new commits land on the same ref (PR force-push / stacked
# pushes) so redundant lint/test runs don't pile up.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # prek runs its hooks SEQUENTIALLY — the `concurrency=N` in its trace log is per-file
  # batching *within* one hook, not hooks in parallel. So the step's wall clock is the sum of
  # every hook, and one hook dominates it. Measured on the runner with warm caches
  # (2026-08-14, from prek's own per-hook spans):
  #
  #   ansible-lint  89.7s   pytest  13.5s   validate-k8s-manifests  2.2s
  #   validate-compose-templates  1.4s      everything else  <1s each      gitleaks  0.03s
  #
  # Sharding ansible-lint away from the other 18 hooks turns that sum into a max: the two
  # shards run concurrently, so the ~37s of non-ansible-lint work stops being time nothing
  # else can overlap. Each shard pays its own checkout + setup (~15s), which is why this is
  # only worth doing for a split this lopsided — do NOT shard further, the setup cost would
  # exceed what any additional shard removes.
  hooks:
    name: hooks (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20  # cap a wedged network hook (ansible-galaxy install) so it can't burn to the 6h default
    strategy:
      fail-fast: false  # a lint failure must not hide a test failure in the sibling shard
      matrix:
        include:
          - id: ansible-lint
            name: ansible-lint
            select: ansible-lint
          - id: rest
            name: validate + tests + secrets
            select: --skip ansible-lint
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0  # full clone; prek --all-files scans the worktree, so history isn't strictly required here — kept as belt-and-suspenders

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3  # v8.3.0  # no floating v8 tag is published; pin the exact release
        with:
          # Nine prek hooks shell out to `uv run`, which resolves the whole `dev` group
          # (ansible-core, pytest, docker, flask, ruff, shellcheck-py) before the first one
          # executes. Without this the download is repaid on every run. Keyed on uv.lock by
          # the action itself, so a lock change invalidates it exactly.
          enable-cache: true

      # prek bootstraps one isolated environment per remote hook repo whenever its cache is
      # cold — uncached, that is every CI run. Worth ~14s here (the step measured 141s before
      # these caches and 127s after). It is much cheaper on the runner than it is on a
      # workstation: the `gitleaks` hook is `language = "golang"`, and where daniel-box has no
      # Go and makes prek fetch a ~270 MB managed toolchain to build gitleaks from source
      # (220s cold, for a scan that takes 0.05s), ubuntu-latest ships Go preinstalled and prek
      # uses it. Hence a 45 MB cache rather than a 350 MB one.
      #
      # Only the environment dirs are cached. `~/.cache/prek/cache` is prek's own pip/uv
      # DOWNLOAD cache — pure redundancy once the envs it built are themselves restored, and
      # (~500 MB on a machine that does fetch a toolchain) large enough that carrying it would
      # eat the saving in transfer time.
      #
      # restore-keys is safe here because prek's env dirs are content-addressed
      # (hooks/<language>-<hash>): a stale entry from an older prek.toml is ignored rather
      # than reused, so a partial hit still lets the UNCHANGED hooks skip their rebuild when
      # one rev bumps. The fresh key then saves the union. Keyed per shard — the two shards
      # build disjoint sets of hook envs, so a shared key would have them overwrite each
      # other's save with a partial tree.
      - name: Cache prek hook environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/prek/repos
            ~/.cache/prek/hooks
            ~/.cache/prek/tools
          key: prek-${{ runner.os }}-${{ matrix.id }}-${{ hashFiles('prek.toml') }}
          restore-keys: prek-${{ runner.os }}-${{ matrix.id }}-

      # The ansible-lint hook's entry runs `ansible-galaxy collection install` before linting.
      # ansible/collections/ is gitignored, so that is a ~40 MB download of four collections on
      # every run; warm, the same command is a 0.4s no-op ("Nothing to do. All requested
      # collections are already installed"). Versions are exactly pinned in requirements.yml,
      # so hashing it is an exact key with no staleness window — hence no restore-keys.
      - name: Cache Ansible collections
        if: matrix.id == 'ansible-lint'  # the only shard that runs the hook needing them
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ansible/collections
          key: galaxy-${{ runner.os }}-${{ hashFiles('ansible/requirements.yml') }}

      - name: Install prek
        run: pip install prek==0.4.10  # pinned for a reproducible hook toolchain; Renovate (pypi) bumps it

      # Both shards still pass --all-files: the split is about WHICH hooks run here, never
      # about narrowing the files any hook sees. Between them the two shards run every hook
      # exactly once, and `--skip ansible-lint` means a hook added to prek.toml later lands in
      # the `rest` shard automatically rather than being silently dropped by an allow-list.
      - name: Run hooks
        run: prek run --all-files --color always ${{ matrix.select }}

  # Branch protection requires the context "prek (lint + validate + tests + secrets)". The job
  # that used to carry that name is now two matrix shards with names of their own, so this
  # aggregator keeps the required context reporting — and makes it depend on BOTH shards.
  # Without it, splitting the job would leave master's required check waiting on a context
  # that no longer exists, blocking every PR.
  prek:
    name: prek (lint + validate + tests + secrets)
    needs: hooks
    if: always()  # must report a conclusion even when a shard fails, or it never reports at all
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # `needs.hooks.result` is the aggregate over the whole matrix: 'success' only if every
      # shard succeeded, so this fails on a failed, cancelled, or skipped shard alike.
      - name: Assert every hook shard passed
        env:
          RESULT: ${{ needs.hooks.result }}
        run: |
          echo "hook shards: $RESULT"
          [ "$RESULT" = "success" ]

  renovate-config:
    name: renovate config validator
    runs-on: ubuntu-latest
    timeout-minutes: 20  # cap a wedged `npx renovate-config-validator` network fetch
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"

      # Semantic validation of renovate.json — the one dependency-management axis with no
      # fail-at-commit backstop. prek's `check-json` only proves the file is well-formed JSON;
      # a typo'd packageRule field (e.g. matchPackageName vs matchPackageNames) is silently
      # IGNORED by Renovate (logged as a config warning, kept running), which would quietly
      # re-enable auto-merge of the stateful/DB-breaking bumps the automerge:false overrides
      # (getmeili/meilisearch, the crowdsec bouncer plugin, galaxy collections) exist to block.
      # `--strict` makes those warnings fail the build. Validates against the latest Renovate —
      # the same hosted Mend app version that actually consumes the config.
      - name: Validate renovate.json
        run: npx --yes --package renovate renovate-config-validator --strict renovate.json
