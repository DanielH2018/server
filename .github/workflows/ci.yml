name: CI

on:
  # Setting `types` replaces GitHub's default list, so the first three restate it.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Inert: merge queues are not offered on user-owned repositories, so the push run stays the only
  # full sweep.
  merge_group:
  # An on-demand full sweep, for a PR whose own diff scopes out every hook that matters. The
  # runner-image bump is the case it exists for: a workflow-only diff matches no hook's `files`
  # regex, so that PR's green run says nothing about `validate-render-templates` against the
  # image's systemd-analyze and Node, nor about gitleaks built with its Go. Without this trigger
  # the first full sweep on a new image is the merge commit's push run, and a red one there
  # parks every landing behind it.
  #
  # Dispatch the BRANCH, never master. `ci_verdict` in `hosts/lib/ci_verdict.py` reduces
  # every check-run sharing a required name for one commit, worst outcome wins. A red dispatch
  # run therefore pins "prek (lint + validate + tests + secrets)" red on a master SHA that
  # checkout-sync's gate and `await_ci.py` both read, and that SHA's own green push run does not
  # outvote it. The concurrency arm below keeps a dispatch out of a push's group; it does nothing
  # about this. `.claude/hooks/block-footguns.py:ci_dispatch_on_master_problem` enforces the
  # rule: it denies a `gh workflow run` naming this workflow with no `--ref` or with `--ref
  # master`. It cannot see the Actions UI button or a raw `gh api .../dispatches`, so this
  # paragraph is still the rule for those.
  #
  # The REF you dispatch must carry this trigger, because GitHub runs the workflow file from that
  # ref. A branch cut before this landed therefore rebases onto master before it can be swept,
  # which for a Renovate PR is its own rebase-check box. Against a branch without the trigger,
  # `gh workflow run ci.yml --ref <branch>` returns HTTP 422 `Workflow does not have
  # 'workflow_dispatch' trigger`. The API accepts a dispatch of a branch that carries the
  # trigger even when master does not. GitHub documents the Run-workflow BUTTON as requiring the
  # default branch; that half is untested here, so reach for `gh workflow run` rather than the
  # UI.
  #
  # Every job treats a dispatch like a push that no PR run proved, with nothing to configure.
  # The `prove` job runs on `push` only, so on a dispatch its output is empty and every other job
  # runs. A PR run sweeps every hook as well, so no step keys on `pull_request` to scope a hook;
  # the `pytest` job's select step is the one exception, and a dispatch takes its full arm;
  # the PR-only steps (the facts notice, the cross-plane gate, the type-proof scope) are skipped
  # on a dispatch. `renovate-config` runs on `!= 'push'`. ENFORCED by
  # the ci-dispatch-runs-every-job row of tests/repo/_ci_sweep_workflow_rows.py, because a job
  # condition rewritten to key on `push` would leave a dispatch fast, green and checking
  # nothing.
  workflow_dispatch:
  push:
    branches: [master]

concurrency:
  # A PR branch groups by ref, so a force-push supersedes its own earlier run. A push to
  # master groups by SHA, which puts every master commit in a group of its own.
  #
  # Master needs that because every SHA needs its own verdict: checkout-sync's CI gate and
  # `await_ci.py` read check-runs per commit, and a commit with no verdict reads `cancelled`
  # forever — every landing behind it then waits on a later SHA's full sweep instead.
  #
  # `cancel-in-progress: false` does not buy that. It governs the
  # RUNNING run; it does not protect a QUEUED one. GitHub keeps at most one pending run per
  # concurrency group, so when master moves faster than a ~3-minute sweep, each new push evicts
  # the pending run ahead of it, and the evicted run never starts a job.
  #
  # Grouping by SHA means a master run is never queued behind another and so can never be
  # evicted. The cost is concurrent master sweeps rather than serialised ones. Runner minutes
  # are free on a public repo, but runner slots are not: the account runs at most 20 hosted
  # jobs at once, and a full sweep runs 22 jobs. A concurrent master sweep therefore delays
  # queued PR runs by minutes when the pool is full.
  #
  # The grouping stays anyway. A run that waits for a slot still delivers its SHA's verdict,
  # while an evicted run delivers none, so slot contention costs latency and eviction costs
  # correctness. The levers on the cost side are the share each master run takes and the size
  # of the pool, not the group key: a full sweep runs 22 jobs against a pool of 20.
  #
  # A `workflow_dispatch` run keys on `github.run_id`, which is unique per run, so it lands in a
  # group nothing else can enter. Without that arm it falls through to `github.sha` and joins the
  # push group of the SHA it was dispatched on — one pending run per group, so dispatching a
  # master SHA could evict that SHA's queued push run and leave it with no verdict. That is the
  # eviction failure above reached by a second route.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.event_name == 'workflow_dispatch' && github.run_id || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Proves, on a push to master, that the pushed tree is one a green PR run already tested.
  # Most squash commits have the tree of their PR's head run. A PR run whose `pytest` legs ran
  # the whole census is a full sweep (see the `hooks` job), so a master run on a tree it already
  # swept repeats work and checks nothing new. A PR run whose legs ran a selection records its
  # tree the same way: the push run would diff the same tree against the same base with the
  # same table, so its selection would be the one the PR run already ran.
  #
  # `scripts/dev/tested_tree.py` reads the `ci/tested-tree` commit status that the `prek` gate
  # writes on the PR head, and answers `proven=true` only when that status carries the pushed
  # commit's tree id. Every other job then skips. Any other
  # answer, including an unreadable
  # status, a token without access and a failed lookup, is `proven=false`, and the run proceeds
  # in full as it did before. The script exits 0 either way.
  #
  # The job runs on a push, and on a pull request that carries the `landing-batch` label. On
  # every other event it is skipped, its output is empty, and every dependent runs: a
  # dispatch, a merge_group run and an unlabelled PR run are never proven. Nothing here is
  # push-only except this job, so there is no push-only job to keep running.
  #
  # A landing batch tests up to four PRs stacked on master in one run, and that run records a
  # tested tree on each PR's head (`docs/ci-throughput.md`, slice B3). The landing then labels
  # each PR and marks it ready. The run that starts asks `tested_tree.py prove-head` whether
  # the head carries a record, and skips as a proven push does. The label only decides
  # whether this job takes a runner: an unlabelled PR run pays nothing for the proof, and a
  # labelled head with no record runs in full. A fork's PR is never proven, because its
  # token cannot have written the record.
  #
  # The `prek` gate stays green on the proven path because a `skipped` dependency counts as a
  # pass only when this job succeeded and said `proven=true`. checkout-sync's CI gate and
  # `await_ci.py` read the gate's check-run, and read `skipped` as a pass.
  #
  # A timed-out or failed `prove` falls back to the full sweep. Each dependent runs when
  # `prove` was cancelled or failed, whatever `proven` says, and the gate reads such a `prove` as
  # unproven, so every dependent must succeed. `tested_tree.py` exits 0 on every answer, so
  # either conclusion comes from the runner (a timeout, a failed checkout, a lost runner) and
  # says nothing about the tree. A runner that hangs in teardown after `prove` set `proven=true`
  # would otherwise skip every dependent while the gate failed on `prove=cancelled`.
  #
  # DECIDED: a cancelled or failed `prove` runs the dependents ahead of `!cancelled()` and the
  # proof.
  # A job timeout and a user's cancel look the same to an expression, so a run cancelled by hand
  # while `prove` is running still starts the sweep. That costs free runner minutes on a public
  # repo; the alternative is a red master on every hung runner. A cancel after `prove` concluded
  # still stops the sweep, through `!cancelled()`. `proven` cannot be trusted from a cancelled
  # or failed job, because the job set it and then did not succeed.
  #
  # A normal run takes 6-10s. A hang delays the sweep by the whole timeout, so it is short.
  # An unproven push also reads up to eleven pages for its green base. A walk that outlasts
  # the timeout cancels the job, which leaves no base and runs the sweep in full.
  prove:
    name: prove the pushed tree was tested
    if: >-
      github.event_name == 'push'
      || (github.event_name == 'pull_request'
      && contains(github.event.pull_request.labels.*.name, 'landing-batch')
      && github.event.pull_request.draft != true
      && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    # `checks: read` is for the green-base walk, which reads each ancestor's check-runs.
    permissions:
      checks: read
      contents: read
      pull-requests: read
      statuses: read
    # `base` is the newest ancestor whose gate passed; the `pytest` legs select against it.
    outputs:
      proven: ${{ steps.prove.outputs.proven }}
      base: ${{ steps.prove.outputs.base }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Compare the pushed tree with the tree a green PR run recorded
        id: prove
        env:
          PYTHONPATH: scripts
          GITHUB_TOKEN: ${{ github.token }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            python3 scripts/dev/tested_tree.py prove \
              --repo "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA" --tree "$(git rev-parse "$GITHUB_SHA^{tree}")"
          else
            python3 scripts/dev/tested_tree.py prove-head --repo "$GITHUB_REPOSITORY" --head "$PR_HEAD"
          fi

  # The `prek` gate job at the bottom carries the required context, under "prek (lint + validate +
  # tests + secrets)".
  #
  # Two legs: `validate-alert-rules` alone, and every other hook. That hook ran 118-200 s of a
  # 166-283 s sweep, and it already spreads its tool calls over the runner's CPUs. A hook added to
  # prek.toml runs in the second leg. `matrix.checks` puts the same text in both legs' `name:`, so
  # they share the check-run name `ci_verdict.py` lists; a `name:` with no matrix expression would
  # get the leg's values appended.
  hooks:
    needs: prove
    if: ${{ (needs.prove.result == 'cancelled' || needs.prove.result == 'failure' || (!cancelled() && needs.prove.outputs.proven != 'true')) && github.event.pull_request.draft != true }}
    name: hooks (${{ matrix.checks }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {checks: "lint + validate + secrets + docs", hooks: "validate-alert-rules"}
          - {checks: "lint + validate + secrets + docs", hooks: "--skip validate-alert-rules"}
    # A versioned runner label, not the `-latest` alias: the `language: system` hooks run whatever
    # shellcheck, Go and systemd-analyze the image preinstalls, and GitHub rolls the alias to a
    # new release with no commit here. The built-in github-actions manager tracks a
    # versioned label through the `github-runners` datasource, so the image moves in a PR that
    # runs these hooks on it first. The same reasoning covers the `python-version:` and
    # `node-version:` pins in .github/actions/setup/action.yml.
    # Every `runs-on` in .github/workflows is a versioned label, ENFORCED by
    # the `workflow-runners-are-pinned` row of tests/repo/census_rows/test_census_rows_workflows.py.
    runs-on: ubuntu-26.04
    timeout-minutes: 20  # cap a wedged network hook so it can't burn to the 6h default
    env:
      # The Vale release the `vale` hook runs. The custom manager in renovate.json reads this
      # annotation and moves the version and the digest in one PR. The digest is the sha256 of
      # vale_<version>_Linux_64-bit.tar.gz, equal to the amd64 `vale` pin in
      # hosts/packages/homelab-tools/package.yml (tests/repo/ci_workflows/test_vale_matches_the_ci_pin.py).
      # renovate: datasource=github-release-attachments depName=vale-cli/vale
      VALE_VERSION: v3.28.1
      VALE_SHA256: 068954ad869ebec24b8dec6ebcd1cbb1fd5f5a83e966a35baedfae8b2cdc093a
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0  # the merge-base diff below needs history
          persist-credentials: false  # nothing here pushes; the merge-base fetch carries its own token

      - uses: $/.github/actions/setup
        with:
          prek-cache-key: prek

      # A runner image change that drops systemd-analyze fails loud here rather than as "command not
      # found" in the hook.
      - name: Check systemd-analyze is available
        run: systemd-analyze --version

      # The `vale` prek hook is `language = "system"`, so it runs whatever binary is on PATH
      # and there is none on a fresh runner. Version-pinned to match the workstation, because
      # a style package's rules change between releases and a gate that passes locally and
      # fails in CI is one people route around.
      #
      # `scripts/validate/vale.sh` with no filenames fetches the Google package into styles/,
      # which .gitignore excludes on purpose — see the entry there. Provisioning runs before
      # the hooks rather than inside them. It is the hook's own entry, so CI and a developer's
      # worktree provision through one path and both write the stamp the guard reads.
      #
      # Each GitHub release download in this file sits behind an actions/cache keyed on its pin,
      # so it runs once per version bump and a release outage fails only the bump's run.
      # The cache holds the download, never the installed binary, and each run checks its digest
      # where it has one. A pinned binary with a sha256 comes through .github/actions/pinned-tool.
      # ENFORCED by tests/repo/ci_workflows/test_release_fetches_use_pinned_tool.py and the
      # a-downloading-script-runs-after-its-cache row of tests/repo/census_rows/test_census_rows_workflows.py.
      - name: Fetch the pinned Vale and check its sha256
        uses: $/.github/actions/pinned-tool
        with:
          tool: vale
          version: ${{ env.VALE_VERSION }}
          sha256: ${{ env.VALE_SHA256 }}

      # vale.sh's stamp skips `vale sync` when the restored package matches .vale.ini's pin.
      - name: Cache the Vale style package
        uses: actions/cache@v6.1.0
        with:
          path: styles/Google
          key: vale-styles-${{ runner.os }}-${{ hashFiles('.vale.ini') }}

      - name: Fetch the Vale style package
        run: scripts/validate/vale.sh

      # promtool and amtool, at the tags of the observability role's Prometheus and Alertmanager
      # image pins, lokitool at the tag of loki-homelab's Loki image pin, and pint at the
      # version alert_tools.sh pins, for the `validate-alert-rules` hook. The script fetches
      # each release archive, checks it against its release's sums file, and unpacks the
      # binary into alert-tools/ under the git common dir, .git/alert-tools/ in this checkout.
      # Alloy is not fetched here: its 167 MB release is provisioned on first use, by the
      # red-proof step below, from the zip the Alloy cache step restores.
      # It is the tool path the hook itself calls, so CI and a worktree provision the same way.
      # The script's stamps skip every tool the restored cache already holds. Alloy stays out of
      # the entry: it is 570 MB unpacked. The children are listed, because a `!` pattern
      # filters only paths the globs above it expand, never a directory's contents.
      # These five steps run only in the leg that runs `validate-alert-rules`, which reads them.
      - name: Cache promtool, amtool, pint and lokitool
        if: matrix.hooks == 'validate-alert-rules'
        uses: actions/cache@v6.1.0
        with:
          path: |
            .git/alert-tools/*
            !.git/alert-tools/alloy-*
          key: alert-tools-${{ runner.os }}-${{ hashFiles('scripts/validate/alert_tools.sh', 'k8s/roles/observability/defaults/main.yml', 'k8s/roles/loki-homelab/defaults/main.yml') }}

      - name: Provision promtool, amtool, pint and lokitool
        if: matrix.hooks == 'validate-alert-rules'
        run: scripts/validate/alert_tools.sh

      # The pytest shards install none of the binaries, so this step shows the hook's tool phase can
      # fail.
      - name: Read the Alloy pin
        id: alloy
        if: matrix.hooks == 'validate-alert-rules'
        run: |
          set -euo pipefail
          version=$(sed -nE 's/^loki_homelab_k8s_alloy_image: *[^:]+:v?([0-9]+\.[0-9]+\.[0-9]+)(@.*)?$/\1/p' \
            k8s/roles/loki-homelab/defaults/main.yml)
          [ -n "$version" ] || { echo "::error::loki-homelab pins no Alloy image tag"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache the Alloy release zip
        if: matrix.hooks == 'validate-alert-rules'
        uses: actions/cache@v6.1.0
        with:
          path: ${{ runner.temp }}/pinned/alloy
          key: alloy-zip-${{ runner.os }}-${{ steps.alloy.outputs.version }}

      - name: Prove each alert tool rejects its bad fixture
        if: matrix.hooks == 'validate-alert-rules'
        env:
          ALERT_TOOLS_ARCHIVES: ${{ runner.temp }}/pinned/alloy
        run: uv run python scripts/validate/alert_rules.py --prove-red

      # A PR run is the full sweep, so its green covers what the push run would check; a
      # changed-file scope would leave files unchecked.
      - name: Reject a PR whose merge changes no files
        id: changed
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}  # via env, never interpolated into the shell
          FETCH_TOKEN: ${{ github.token }}  # contents: read; the checkout drops its own, see the fetch in the script
        run: |
          set -euo pipefail
          "$GITHUB_WORKSPACE/scripts/dev/pr_changed_files.sh"
          if [ ! -s "$RUNNER_TEMP/changed.txt" ] && [ ! -s "$RUNNER_TEMP/deleted.txt" ]; then
            # No added, modified or deleted file means merging this PR would land NOTHING: the
            # checkout is the merge ref, so a three-dot diff against the base is exactly what a
            # merge adds. That is never a correct PR, whoever opened it. Renovate can reuse
            # the previous bump's branch under the next version's title when master already
            # holds the content, and the squash commit then carries an empty file list.
            # Failing here fails the `prek` gate, so an automerge cannot fire on the run.
            echo "::error::This PR's merge would change no files against $BASE_REF. Its content already landed, or its branch is stale — close it rather than merge it (#1755)."
            exit 1
          fi
          echo "This PR changes $(wc -l < "$RUNNER_TEMP/changed.txt") file(s) and deletes $(wc -l < "$RUNNER_TEMP/deleted.txt")."

      # The facts notice lists every CLAUDE.md section that cites an atom this PR moved, as
      # annotations and as a job-summary table. It never fails the job. The long form is docs/target-architecture/docs-guard/g1-diff-notice.md, *Design*.
      #
      # DECIDED: the notice never blocks a merge, during the soak or after the lock retires. A
      # PR that moves a cited atom gets a notice, not a red check. The trade, and the coverage
      # it gives up, is in docs/adr/0023-fact-support-is-a-diff-notice.md. (ADR-0023)
      #
      # No step of the three can fail the job. `continue-on-error` turns a failed step green,
      # but it does not cover the job's 20-minute timeout, and a job timeout fails the `prek`
      # gate. Each step therefore carries its own `timeout-minutes`, which ends a hang as a step
      # failure first.
      #
      # The step runs the MERGE BASE's code, never the PR's. A PR that breaks a module that
      # fact_status.py imports would otherwise crash the step, and that crash says nothing about
      # the notice. The base copy is a second worktree. Its lib.repo_paths.REPO is the copy
      # itself and its HEAD is the merge base, so `--head "$GITHUB_SHA"` is what points it at
      # the PR's merge commit. `uv sync --frozen` there installs the base's own lockfile, so the
      # PR's uv.lock cannot change what the notice imports either.
      #
      # $RUNNER_TEMP/notice.err receives every command's stderr and one `stage:` line per stage.
      # The plan's check 2 reads the last `stage:` line from the failure artifact. `setup` means
      # the merge base, `git worktree add` or `uv sync` failed, so no notice code ran. `notice`
      # means the notice itself failed, which is a notice defect unless the `base` line names
      # code older than the soak's lower bound. A timeout kills the script, but the lines it
      # already wrote stay in the file.
      - name: "Notice: CLAUDE.md sections citing atoms this PR moved"
        id: notice
        if: github.event_name == 'pull_request' && matrix.hooks != 'validate-alert-rules'
        continue-on-error: true
        timeout-minutes: 5
        env:
          BASE_REF: ${{ github.base_ref }}  # via env, never interpolated into the shell
        run: |
          set -euo pipefail
          err="$RUNNER_TEMP/notice.err"
          code="$RUNNER_TEMP/notice-code"
          exec 2> >(tee -a "$err" >&2)
          # A kill that ends the script before the trap leaves the copy registered, so the failure
          # step removes it too.
          trap 'git worktree remove --force "$code" || true' EXIT

          echo "stage: setup" >> "$err"
          SECONDS=0
          base=$(git merge-base "origin/$BASE_REF" "$GITHUB_SHA")
          echo "base $base" >> "$err"
          git worktree add --detach "$code" "$base"
          uv --directory "$code" sync --frozen
          echo "setup stage took ${SECONDS}s"

          echo "stage: notice" >> "$err"
          SECONDS=0
          notice=(uv --directory "$code" run --frozen python scripts/dev/fact_status.py
                  notice --since "origin/$BASE_REF" --head "$GITHUB_SHA")
          "${notice[@]}" --format github
          "${notice[@]}" --format markdown >> "$GITHUB_STEP_SUMMARY"
          echo "notice stage took ${SECONDS}s"

      # Tested as `!= 'success'` so it holds for a timeout whether GitHub records `failure` or
      # `cancelled`.
      - name: Notice step failed
        if: github.event_name == 'pull_request' && matrix.hooks != 'validate-alert-rules' && steps.notice.outcome != 'success'
        continue-on-error: true
        timeout-minutes: 5
        env:
          OUTCOME: ${{ steps.notice.outcome }}
        run: |
          echo "::warning title=notice-step-failed::The facts notice step ended with outcome $OUTCOME. Its notice.err is in this run's notice-step-failed artifact."
          echo "The facts notice step ended with outcome \`$OUTCOME\`. Its \`notice.err\` is in the \`notice-step-failed\` artifact." >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/notice.err" || true
          git worktree remove --force "$RUNNER_TEMP/notice-code" || true

      # With `continue-on-error` the jobs API reports the failed step as `success`, so an artifact
      # is the only findable record.
      - name: Upload notice failure
        if: github.event_name == 'pull_request' && matrix.hooks != 'validate-alert-rules' && steps.notice.outcome != 'success'
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/upload-artifact@v7.0.2
        with:
          name: notice-step-failed
          path: ${{ runner.temp }}/notice.err
          if-no-files-found: warn

      # The sweep's docs build is the only one besides the docs-refresh cron, where a broken link
      # leaves the previous site serving silently.
      - name: Run hooks (full sweep)
        # --skip static-ratchet-tests*: the `pytest` job runs those hooks' test files already, and
        # test_static_ratchet_hook.py holds this list equal to prek.toml's ratchet hook ids.
        # RENDER_TEMPLATES_SKIP=k8s: the `pytest` job runs the k8s family of
        # validate-render-templates over the real tree and asserts it reports no failure
        # (scripts/validate/tests/renders/test_render_k8s.py, `real_tree`), so the family here would be
        # a second render of every k8s role. The hook's other families run.
        # --log-file: prek's trace log holds each hook's duration, which the next step tabulates.
        # Without --verbose the job log holds only a failing hook's output.
        env:
          RENDER_TEMPLATES_SKIP: k8s
          HOOKS: ${{ matrix.hooks }}
        run: |
          # shellcheck disable=SC2086 # $HOOKS is this leg's hook selection, split into words
          prek run --all-files $HOOKS --log-file "$RUNNER_TEMP/prek.log" --skip static-ratchet-tests --skip static-ratchet-tests-python --skip static-ratchet-tests-lander --skip static-ratchet-tests-checksum --skip static-ratchet-tests-shell --skip static-ratchet-tests-renovate --skip static-ratchet-tests-evals --skip static-ratchet-tests-landing --skip static-ratchet-tests-alerts --skip static-ratchet-tests-units --skip static-ratchet-tests-test-modules --color always
      - name: Write the slowest hooks to the job summary
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: uv run python scripts/dev/prek_durations.py "$RUNNER_TEMP/prek.log" >> "$GITHUB_STEP_SUMMARY"

  # The job-level `if:` is the prove condition; PR-only tests sit on each step, since a job-level
  # one would make the job `skipped` on a push, which the gate reads as failure.
  pr_gates:
    needs: prove
    if: ${{ (needs.prove.result == 'cancelled' || needs.prove.result == 'failure' || (!cancelled() && needs.prove.outputs.proven != 'true')) && github.event.pull_request.draft != true }}
    name: PR gates (cross-plane order + cluster pins)
    runs-on: ubuntu-26.04
    timeout-minutes: 15  # the two steps' own timeouts sum to 10, plus setup
    env:
      # Skips pyproject.toml's `lint` group, which no step here runs (test_ci_lint_group.py).
      UV_NO_GROUP: lint
      # Its scripts import only [project] dependencies (test_promote_runtime_imports.py).
      UV_NO_DEV: "1"
    steps:
      # The gates read HEAD^1 and the PR's commits, so the checkout keeps history.
      - uses: actions/checkout@v7.0.1
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
          persist-credentials: false  # nothing here pushes or fetches

      # Python and uv only. Neither gate runs prek.
      - uses: $/.github/actions/setup
        if: github.event_name == 'pull_request'

      # `-P` keeps the cwd off sys.path, so only the editable install's `.pth` can supply
      # `scripts/`.
      - name: scripts/ is installed as the import root
        if: github.event_name == 'pull_request'
        run: .venv/bin/python -P -c "import lib.repo_paths"

      # They refuse an edge added beside a change to its dependent, and an object a flux-owned tag
      # drops without a `Removes-Object:` line.
      - name: Render-diff gates
        if: github.event_name == 'pull_request'
        timeout-minutes: 8
        run: uv run python scripts/validate/render_diff_gates.py --base HEAD^1

      # Refuses a pin that decreases, a Longhorn bump that skips a minor release, or a bump touching
      # more than the pin's role directory and docs.
      - name: Cluster pin checks
        if: github.event_name == 'pull_request'
        timeout-minutes: 2
        run: uv run python scripts/validate/cluster_pins.py --base HEAD^1

      # The `binary` gate mode compares each node's binary with the sum, so a bump keeping the old
      # sum is refused.
      - name: k3s binary sum co-change
        if: github.event_name == 'pull_request'
        timeout-minutes: 2
        run: uv run python scripts/validate/k3s_binary_sum.py --base HEAD^1

  # GitHub fixes a matrix before any leg runs, so only a job ahead of it can leave unneeded legs
  # unstarted.
  pytest_plan:
    needs: prove
    if: ${{ (needs.prove.result == 'cancelled' || needs.prove.result == 'failure' || (!cancelled() && needs.prove.outputs.proven != 'true')) && github.event.pull_request.draft != true }}
    name: plan the pytest legs
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    outputs:
      legs: ${{ steps.plan.outputs.legs }}
    steps:
      # A pull request diffs against the merge commit's first parent; a push's green base can be any
      # ancestor.
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 0 }}
          persist-credentials: false
      - name: Plan the legs the selection fills
        id: plan
        if: >-
          github.event_name == 'pull_request'
          || (github.event_name == 'push' && needs.prove.outputs.base != '')
        env:
          PYTHONPATH: scripts
          GREEN_BASE: ${{ needs.prove.outputs.base }}
        run: |
          set -euo pipefail
          base=HEAD^1
          if [ "$GITHUB_EVENT_NAME" = push ]; then base=$GREEN_BASE; fi
          python3 scripts/dev/pytest_shard.py --plan --changed-since "$base"

  # The pytest suite, run as `uv run python -m pytest` with the addopts from pyproject.toml, so a
  # local `uv run pytest` and this job agree about what a test run is. A dispatch runs every module, and so does a push with no green
  # ancestor in reach. A push that has one runs the modules the diff from it can affect, and a
  # pull request the modules its own diff can affect; the `Select` step below has the rule.
  #
  # Sharded across a matrix, because this job is the pole of every run and a landing
  # waits on it twice — once on the PR, once on the master merge commit that `land.sh` and
  # checkout-sync's CI gate both read.
  #
  # THE MATRIX KEEPS THE JOB ID `pytest`, which is what makes this a one-file change.
  # `needs.pytest.result` in the gate below is the AGGREGATE of every matrix leg, so the gate's
  # step, its `needs` list, and `test_every_ci_job_is_gated.py` all keep working untouched. Shards
  # as separate job ids (`pytest-1`, `pytest-2`, …) would instead make changing N a three-file
  # edit: the gate's `needs`, the gate's result comparison, and the guard's `KNOWN_JOBS` and
  # `GATE_READS` would each grow an entry per shard. No required context names a leg:
  # `ci_required_contexts` and `github_expected_ruleset_contexts` both name only
  # "prek (lint + validate + tests + secrets)". The readers that do name the legs,
  # `hosts/lib/ci_verdict.py:CI_GATE_NEEDS_JOBS` and the `pytest (shard ` prefix in
  # `scripts/dev/shard_weight_gate.py` and `scripts/dev/ci_slot_cost.py`, change with a rename.
  #
  # `fail-fast: false` for the reason the `hooks` job states above: one shard's failure must not
  # hide another's.
  #
  # DECIDED: a pull request's selection comes from a recorded table, never from a path list
  # Several tests discover their inputs by walking
  # the tree (test_render_shell's pinned roster, test_healthchecks_pings' rglob), so
  # a hand-kept map from changed paths to tests would skip the tests that should fail on a new
  # *.sh.j2. `scripts/dev/affected_tests.json` holds what each module's own run read and listed
  # under `strace`, so a module that walks a directory is selected when a file appears in it.
  # The accepted cost: a module can gain a dependency after its row was recorded, pass on the
  # pull request for not being selected, and fail later. The net for that module is the
  # nightly sweep in pytest-sweep.yml, which runs every module and reports a red run as an
  # issue. A selected pull-request run records its tested tree, so the push run of that tree
  # skips. The push run of a tree no pull-request run tested selects too, against the newest
  # ancestor whose gate passed, so a red or unfinished parent's change stays in its diff.
  # What no run can reach is a test outside `testpaths`, which
  # test_testpaths_covers_every_test_file guards.
  #
  # This job is the suite's only automated run before a merge, and `land.sh` waits on it
  # through the `prek` gate.
  pytest:
    needs: [prove, pytest_plan]
    if: ${{ (needs.prove.result == 'cancelled' || needs.prove.result == 'failure' || (!cancelled() && needs.prove.outputs.proven != 'true')) && github.event.pull_request.draft != true }}
    # No leg count in the name: a run starts only the legs its plan names.
    name: pytest (shard ${{ matrix.shard }})
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    # Every leg computes `scope` from the same diff and table, so whichever writes last writes the
    # same word.
    outputs:
      scope: ${{ steps.select.outputs.scope }}
    strategy:
      fail-fast: false
      # The fallback list must name 1..CI_LEGS.
      matrix:
        shard: "${{ fromJSON(needs.pytest_plan.outputs.legs || '[1, 2, 3, 4, 5, 6]') }}"
    env:
      # Skips pyproject.toml's `lint` group, which no step here runs (test_ci_lint_group.py).
      UV_NO_GROUP: lint
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0  # several tests read git history and worktree state
          persist-credentials: false
      - uses: $/.github/actions/setup
      # Whole modules are packed, never part of one, or loadscope's module-scoped fixtures would
      # rebuild per shard.
      - name: Select this shard's test files
        id: select
        env:
          SHARD: ${{ matrix.shard }}
          GREEN_BASE: ${{ needs.prove.outputs.base }}
          PLANNED: ${{ needs.pytest_plan.outputs.legs }}
        run: |
          set -euo pipefail
          since=()
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then since=(--changed-since "HEAD^1"); fi
          if [ "$GITHUB_EVENT_NAME" = push ] && [ -n "${GREEN_BASE:-}" ]; then
            since=(--changed-since "$GREEN_BASE")
          fi
          planned=()
          if [ -n "${PLANNED:-}" ]; then planned=(--planned "$PLANNED"); fi
          uv run python scripts/dev/pytest_shard.py --shard "$SHARD" \
            "${since[@]}" "${planned[@]}" --out "$RUNNER_TEMP/shard.txt"
      - name: Install the tools the tests run
        if: steps.select.outputs.count != '0'
        uses: $/.github/actions/pytest-tools
      # Every xdist worker collects the whole shard, and on a cold checkout each one rewrites
      # every module's assertions itself, which is over a third of collection.
      # pytest names a rewritten module `<name>.<cache tag>-pytest-<version>.pyc` and validates it
      # by the source's hash, not its mtime, so an entry from an earlier commit stays valid for
      # every module the commit left unchanged, and a changed module is rewritten again.
      # DECIDED: no leg saves. The nightly sweep in pytest-sweep.yml saves one entry over every
      # module on master, a 9 MB archive a day, and every leg of every event restores the newest
      # one, whatever its shard packed. A pull-request run reads master's entries. The key names
      # the commit only so that it misses, and `restore-keys` then takes the newest sweep entry.
      # The path and the key prefix must match the sweep's save step byte for byte.
      #
      # DECIDED: the restore is not gated on the selection's size.
      # A runner rewrites a module in 20 to 30 ms, so the restore saves that much for each selected module the entry
      # holds. The restore step took 0 to 3 seconds, median 1, over 190 pull-request legs on
      # 2026-11-22. The smallest selection a change makes is still tens of modules, because every
      # module with no current row in the affected table is selected: a 2-path change selected 65.
      # That leg restored in 2.5s and rewrote 13 to 14 modules in 0.3 to 0.4s, where 65 cold
      # modules cost about 1.6s. At that floor the restore and its saving are within a second of
      # each other, and from about 80 modules up the restore wins. A size gate would save under a
      # second on the rare one-leg run and add a threshold that drifts with runner speed. Revisit
      # if a leg's `count` routinely falls below about 50 modules.
      - name: Restore pytest's rewritten test modules
        if: steps.select.outputs.count != '0'
        uses: actions/cache/restore@v6.1.0
        with:
          path: "**/__pycache__/*-pytest-*.pyc"
          key: pytest-rewrite-${{ runner.os }}-${{ github.sha }}
          restore-keys: pytest-rewrite-${{ runner.os }}-

      # `=0` prints every duration: a per-file total cannot be summed from the top 15 lines.
      - name: Run the test suite
        if: steps.select.outputs.count != '0'
        env:
          RENDER_DIGEST_FILE: ${{ runner.temp }}/render-digests.txt
        run: |
          set -euo pipefail
          mapfile -t files < "$RUNNER_TEMP/shard.txt"
          uv run python -m pytest --github-report --durations=0 "${files[@]}" \
            | tee "$RUNNER_TEMP/durations.log"

      - name: Upload the render digest lines
        if: always() && steps.select.outputs.count != '0'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: render-digests-shard${{ matrix.shard }}
          path: ${{ runner.temp }}/render-digests.txt
          if-no-files-found: ignore

      # The measured half of the shard-weight check. Nothing static separates a heavy module from
      # a light one, so this step reads the durations report the shard just wrote. It has three
      # arms: a heavy module with no recorded weight, a recorded weight far HIGHER than what the
      # module measured, and one far LOWER. The recorded weights are the runner-seconds table,
      # scripts/dev/pytest_shard_runner_weights.json.
      #
      # DECIDED: the step annotates and never fails, on every event. A wrong weight costs one leg
      # at most that module's own seconds, until the docs-refresh cron's `--refresh-runner` reads
      # the module off green master runs, within a day. A failed run costs a full rerun from the
      # 20-job runner pool. A failing version kept failing PRs on a weight the PR could not
      # have known about.
      - name: Check every heavy module's recorded weight
        if: steps.select.outputs.count != '0'
        run: uv run python scripts/dev/pytest_shard.py --check-durations "$RUNNER_TEMP/durations.log"

  # After changing a `uses:` line, run `gh actions-lock` and commit the lockfile it rewrites.
  lockfile:
    needs: prove
    if: ${{ (needs.prove.result == 'cancelled' || needs.prove.result == 'failure' || (!cancelled() && needs.prove.outputs.proven != 'true')) && github.event.pull_request.draft != true }}
    name: actions lockfile (gh actions-lock --verify)
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false  # nothing here pushes

      - name: Verify the lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh extension install github/gh-actions-lock --pin v0.5.1
          gh actions-lock --verify

  flux_roundtrip:
    needs: prove
    if: ${{ (needs.prove.result == 'cancelled' || needs.prove.result == 'failure' || (!cancelled() && needs.prove.outputs.proven != 'true')) && github.event.pull_request.draft != true }}
    name: flux round trip (placeholder render against stub render)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      # Skips pyproject.toml's `lint` group, which no step here runs (test_ci_lint_group.py).
      UV_NO_GROUP: lint
      # Its scripts import only [project] dependencies (test_promote_runtime_imports.py).
      UV_NO_DEV: "1"
      # Equal to flux_version in k8s/roles/flux and the amd64 pin in homelab-tools/package.yml; env
      # so the cache key reads it.
      # renovate: datasource=github-release-attachments depName=fluxcd/flux2
      FLUX_VERSION: v2.9.6
      FLUX_SHA256: b4d22673e9246cbd628881f1a9ef3b090085dced291e42d804555cee8e8d42c5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup

      # The same FLUX_* pin as promote.yml's, so the CLI that checks the round trip is the CLI
      # that publishes and the controllers' release. scripts/tests/test_renovate_flux_cli.py
      # fails a drift.
      - name: Fetch the pinned flux CLI and check its sha256
        uses: $/.github/actions/pinned-tool
        with:
          tool: flux
          version: ${{ env.FLUX_VERSION }}
          sha256: ${{ env.FLUX_SHA256 }}

      - name: Probe the pinned flux CLI's substitution on fixtures
        run: |
          set -euo pipefail
          flux version --client
          uv run python scripts/renderer/shadow_diff.py fluxprobe --out "$RUNNER_TEMP/probe"
          rc=0
          uv run python scripts/renderer/shadow_diff.py fluxprobe --out "$RUNNER_TEMP/probe-red" \
            --red-proof || rc=$?
          echo "fluxprobe --red-proof exited $rc"
          [ "$rc" = 1 ]

      # The red half stays on three tags: it only has to show one changed byte is seen.
      - name: Round-trip every tag through flux build
        run: |
          set -euo pipefail
          uv run python scripts/renderer/shadow_diff.py roundtrip --out "$RUNNER_TEMP/rt"
          rc=0
          uv run python scripts/renderer/shadow_diff.py roundtrip --out "$RUNNER_TEMP/rt-red" \
            --role configarr --role janitorr --role home-assistant --red-proof || rc=$?
          echo "roundtrip --red-proof exited $rc"
          [ "$rc" = 1 ]

      # With `email` dropped from the committed map, `${email}` in CF_API_EMAIL takes `0123` and
      # loses its string type, so the narrowed pass must still see that use.
      - name: Red-proof the round trip's second pass with email dropped from the guard's map
        run: |
          set -euo pipefail
          jq 'map_values(map(select(. != "email")))' \
            scripts/renderer/job_files/standalone_secret_keys.json \
            > "$RUNNER_TEMP/guard-map-without-email.json"
          rc=0
          uv run python scripts/renderer/shadow_diff.py roundtrip --out "$RUNNER_TEMP/rt-map" \
            --role traefik --guard-map "$RUNNER_TEMP/guard-map-without-email.json" \
            > "$RUNNER_TEMP/rt-map.log" || rc=$?
          cat "$RUNNER_TEMP/rt-map.log"
          echo "roundtrip with email dropped from the guard map exited $rc"
          [ "$rc" = 1 ]
          grep -qx 'traefik: Deployment/homelab/traefik differs' "$RUNNER_TEMP/rt-map.log"

  # On a push to master its steps skip: the PR run already measured it.
  sops_manifest_type_proof:
    needs: prove
    if: ${{ (needs.prove.result == 'cancelled' || needs.prove.result == 'failure' || (!cancelled() && needs.prove.outputs.proven != 'true')) && github.event.pull_request.draft != true }}
    name: sops-manifest-type-proof (an all-digit stringData value stays a string)
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      # Skips pyproject.toml's `lint` group, which no step here runs (test_ci_lint_group.py).
      UV_NO_GROUP: lint
      # Its scripts import only [project] dependencies (test_promote_runtime_imports.py).
      UV_NO_DEV: "1"
      # In job env so the kind cache key can read them.
      # renovate: datasource=github-release-attachments depName=kubernetes-sigs/kind
      KIND_VERSION: v0.33.0
      KIND_SHA256: aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d
      # Equal to flux_version in k8s/roles/flux and the amd64 pin in homelab-tools/package.yml; env
      # so the cache key reads it.
      # renovate: datasource=github-release-attachments depName=fluxcd/flux2
      FLUX_VERSION: v2.9.6
      FLUX_SHA256: b4d22673e9246cbd628881f1a9ef3b090085dced291e42d804555cee8e8d42c5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0  # the merge-base diff below needs history
          persist-credentials: false  # nothing here pushes; pr_changed_files.sh's fetch carries its own token

      - name: Check whether this PR touches the type proof's inputs
        id: scope
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}  # via env, never interpolated into the shell
          FETCH_TOKEN: ${{ github.token }}  # contents: read; the checkout drops its own
        run: |
          set -euo pipefail
          "$GITHUB_WORKSPACE/scripts/dev/pr_changed_files.sh"
          if git diff --quiet "origin/$BASE_REF...HEAD" -- \
              k8s/roles/flux/defaults/main.yml \
              k8s/roles/flux/files/gotk-components.yaml \
              k8s/roles/registry/defaults/main.yml \
              hosts/packages/homelab-tools/package.yml \
              scripts/secrets_mgmt/cluster_vars.py \
              scripts/secrets_mgmt/cluster_vars_check.py \
              scripts/secrets_mgmt/tests/_cluster_vars_fixture.py \
              scripts/secrets_mgmt/tests/_sops_type_proof.py \
              .github/actions/pinned-tool/action.yml \
              .github/workflows/ci.yml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No pin, cluster_vars.py, fixture or job change, so there is nothing to measure."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: $/.github/actions/setup
        if: github.event_name == 'workflow_dispatch' || steps.scope.outputs.changed == 'true'

      # The flux_roundtrip job's pin. The CLI pushes the fixture artifact.
      - name: Fetch the pinned flux CLI and check its sha256
        uses: $/.github/actions/pinned-tool
        if: github.event_name == 'workflow_dispatch' || steps.scope.outputs.changed == 'true'
        with:
          tool: flux
          version: ${{ env.FLUX_VERSION }}
          sha256: ${{ env.FLUX_SHA256 }}

      # sops comes from the hosts' pin in homelab-tools' package.yml, so this job holds no drifting
      # copy.
      - name: Read the sops pin
        id: sops
        if: github.event_name == 'workflow_dispatch' || steps.scope.outputs.changed == 'true'
        run: |
          set -euo pipefail
          tools=hosts/packages/homelab-tools/package.yml
          sops_version=$(awk '/^  sops:/ {s=1} s && /version:/ {print $2; exit}' "$tools")
          sops_sha256=$(awk '/^  sops:/ {s=1} s && /sha256:/ {print $2; exit}' "$tools")
          [ -n "$sops_version" ] && [ -n "$sops_sha256" ]
          echo "version=$sops_version" >> "$GITHUB_OUTPUT"
          echo "sha256=$sops_sha256" >> "$GITHUB_OUTPUT"

      - name: Fetch the pinned sops and check its sha256
        uses: $/.github/actions/pinned-tool
        if: github.event_name == 'workflow_dispatch' || steps.scope.outputs.changed == 'true'
        with:
          tool: sops
          version: ${{ steps.sops.outputs.version }}
          sha256: ${{ steps.sops.outputs.sha256 }}

      - name: Fetch the pinned kind and check its sha256
        uses: $/.github/actions/pinned-tool
        if: github.event_name == 'workflow_dispatch' || steps.scope.outputs.changed == 'true'
        with:
          tool: kind
          version: ${{ env.KIND_VERSION }}
          sha256: ${{ env.KIND_SHA256 }}

      - name: Install age
        if: github.event_name == 'workflow_dispatch' || steps.scope.outputs.changed == 'true'
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends age \
            || { sudo apt-get update -q && sudo apt-get install -y --no-install-recommends age; }
          kubectl version --client

      # The registry sits on kind's docker network, so source-controller reaches it by container
      # name and the runner pushes through the published port. Its image is read from the
      # registry role's pin, registry_k8s_image, so this job holds no copy of it. The node
      # image is one the pinned kind release lists, on k3s_version's Kubernetes minor:
      # tests/repo/ci_workflows/test_kind_node_image_follows_k3s.py holds the minor, and Renovate
      # offers it patch and digest bumps only.
      - name: Create the kind cluster, the registry and the pinned Flux controllers
        if: github.event_name == 'workflow_dispatch' || steps.scope.outputs.changed == 'true'
        env:
          # renovate: datasource=docker depName=kindest/node
          KIND_NODE_IMAGE: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
        run: |
          set -euo pipefail
          registry_image=$(awk '/^registry_k8s_image:/ {print $2}' k8s/roles/registry/defaults/main.yml)
          [ -n "$registry_image" ]
          kind create cluster --name proof --image "$KIND_NODE_IMAGE" --wait 120s
          docker run -d --name kind-registry --network kind -p 127.0.0.1:5001:5000 "$registry_image"
          kubectl apply --server-side -f k8s/roles/flux/files/gotk-components.yaml
          for d in source-controller kustomize-controller notification-controller; do
            kubectl -n flux-system rollout status "deployment/$d" --timeout=180s
          done
          kubectl create namespace proof

      - name: Build the fixture Secrets and push them as one artifact
        if: github.event_name == 'workflow_dispatch' || steps.scope.outputs.changed == 'true'
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/proof"
          PYTHONPATH=scripts:scripts/secrets_mgmt/tests uv run python \
            scripts/secrets_mgmt/tests/_sops_type_proof.py --out "$out" --registry kind-registry:5000
          kubectl -n flux-system create secret generic sops-age --from-file=age.agekey="$out/age.agekey"
          flux push artifact oci://127.0.0.1:5001/proof:proof --path="$out/artifact" \
            --source=sops-manifest-type-proof --revision="proof@sha1:$GITHUB_SHA" --insecure-registry
          kubectl apply -f "$out/flux-objects.yaml"

      # "GREEN CHANGED" is the result the plan's `data:` remedy answers; a timeout before it is the
      # cluster or the source.
      - name: Green half — the all-digit values reach the cluster as their digits
        if: github.event_name == 'workflow_dispatch' || steps.scope.outputs.changed == 'true'
        run: |
          set -euo pipefail
          kubectl -n flux-system wait ocirepository/proof --for=condition=Ready --timeout=180s
          if ! kubectl -n flux-system wait kustomization/proof-green --for=condition=Ready --timeout=180s; then
            echo "::error::GREEN NOT READY: $(kubectl -n flux-system get kustomization proof-green \
              -o jsonpath='{.status.conditions[?(@.type=="Ready")].message}')"
            exit 1
          fi
          rc=0
          for pair in zero_lead=0123 long_digits=9007199254740993; do
            field=${pair%%=*} want=${pair#*=}
            got=$(kubectl -n proof get secret proof-green -o "jsonpath={.data.$field}" | base64 -d)
            if [ "$got" = "$want" ]; then
              echo "GREEN: $field decodes to $got, exactly its digits"
            else
              echo "::error::GREEN CHANGED: $field decodes to '$got', not $want"
              rc=1
            fi
          done
          exit "$rc"

      # Red is judged only against the artifact green just applied, so a not-ready source cannot
      # pass for the type failure.
      - name: Red half — values encrypted from an int fail to apply or come back changed
        if: github.event_name == 'workflow_dispatch' || steps.scope.outputs.changed == 'true'
        run: |
          set -euo pipefail
          revision=$(kubectl -n flux-system get ocirepository proof -o jsonpath='{.status.artifact.revision}')
          ks() { kubectl -n flux-system get kustomization proof-red -o "jsonpath=$1"; }
          status=""
          for _ in $(seq 60); do
            ready=$(ks '{.status.conditions[?(@.type=="Ready")].status}')
            if [ "$ready" = True ] || { [ "$ready" = False ] \
                && [ "$(ks '{.status.lastAttemptedRevision}')" = "$revision" ]; }; then
              status=$ready
              break
            fi
            sleep 3
          done
          message=$(ks '{.status.conditions[?(@.type=="Ready")].message}')
          case "$status" in
            False)
              echo "Ready=False at $revision: $message"
              # A decryption failure names the Secret too, so the `stringData` field name is
              # required as well.
              if printf '%s' "$message" | grep -q 'proof-red' \
                  && printf '%s' "$message" | grep -q 'stringData'; then
                echo "RED: the int-encrypted Secret failed to apply"
              else
                echo "::error::RED INCONCLUSIVE: the failure names neither the Secret nor its stringData"
                exit 1
              fi ;;
            True)
              # 0123 has no int form, so only the 16-digit value can come back unchanged.
              got=$(kubectl -n proof get secret proof-red -o 'jsonpath={.data.long_digits}' | base64 -d)
              if [ "$got" = 9007199254740993 ]; then
                echo "::error::RED PASSED: the int-encrypted value applied unchanged, so this job cannot see a type change"
                exit 1
              fi
              echo "RED: the int-encrypted Secret applied, and long_digits came back as $got" ;;
            *)
              echo "::error::RED UNJUDGED: proof-red reached no verdict at $revision: $message"
              exit 1 ;;
          esac

      - name: Dump the Flux objects and controller logs
        if: failure() && (github.event_name == 'workflow_dispatch' || steps.scope.outputs.changed == 'true')
        run: |
          kubectl -n flux-system get ocirepository,kustomization -o yaml || true
          kubectl -n flux-system logs deployment/source-controller --tail=100 || true
          kubectl -n flux-system logs deployment/kustomize-controller --tail=200 || true

  # Target slice H3's host packages (docs/archive/host/h3-pi-pilot.md, *CI (builds,
  # never signs)*), in two jobs. `host_packages_build` renders every package at the head and at
  # the merge base on every run, with no path filter, because a group_vars edit can change a
  # render. When no rendered tree differs, its build and lint steps skip and it ends green.
  # Otherwise it builds both renders with the pinned nfpm, lints them, and hands the build on:
  # the arm64 homelab-tools .deb to `host_tools_arm64`, and the render, the debs, nfpm and the
  # actions/cache key of the verified homelab-tools downloads to `host_packages`. Each `host_packages` matrix leg pulls the pinned test image for its Ubuntu
  # release, or builds it on a Dockerfile change, and runs the updater cases in it (steps 4 and 5).
  #
  # The build is a job of its own so that `host_tools_arm64` waits for the build alone, not for
  # the legs' image build and cases. The cases legs pay one more job's setup and the hand-off's
  # transfer before their image build.
  #
  # `host_packages`'s `name:` shows each leg as `host_packages (<release>, <python>)`, and later
  # host slices filter `gh run view` on that prefix. The build job's `name:` therefore does not
  # start with `host_packages`.
  #
  # The merge base is HEAD's first parent on every event but a dispatch. On a pull request HEAD
  # is the merge ref, whose first parent is the base branch tip; on a push it is the previous
  # master commit. A dispatched branch diffs against its merge base with master, and a dispatch
  # builds and lints even when nothing differs, as every job here treats a dispatch as a sweep.
  #
  # nfpm is fetched and checked against its pinned sha256 on every run, ahead of the diff. A
  # Renovate PR that bumps the pin changes no render, so with the fetch behind the diff gate a
  # wrong digest or a 404 URL would reach master green.
  host_packages_build:
    needs: prove
    if: ${{ (needs.prove.result == 'cancelled' || needs.prove.result == 'failure' || (!cancelled() && needs.prove.outputs.proven != 'true')) && github.event.pull_request.draft != true }}
    name: build the host packages (render, nfpm, lint)
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    # `run-cases` is the one answer to whether a cases job has anything to run; the `prek` gate
    # reads it to pass a job that skipped for that.
    outputs:
      run-cases: ${{ github.event_name == 'workflow_dispatch' || steps.render.outputs.changed == 'true' || steps.render.outputs.cases == 'true' }}
      upgrade: ${{ steps.render.outputs.upgrade }}
      tools-key: ${{ steps.tools-key.outputs.key }}
      arm64-tools: ${{ steps.arm64.outputs.built }}
    env:
      # The custom manager in renovate.json reads this annotation and moves the version and the
      # digest in one PR. The digest is the sha256 of nfpm_<version>_Linux_x86_64.tar.gz, which
      # Renovate reads from the release's checksums.txt.
      # renovate: datasource=github-release-attachments depName=goreleaser/nfpm
      NFPM_VERSION: v2.49.0
      NFPM_SHA256: 2afaa5ffb5e3493402e31e7c67a5a1fb42133e3f66fc315ca0051934125561c7
      # Skips pyproject.toml's `lint` group, which no step here runs (test_ci_lint_group.py).
      UV_NO_GROUP: lint
      # Its scripts import only [project] dependencies (test_promote_runtime_imports.py).
      UV_NO_DEV: "1"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0  # the merge-base render below needs history
          persist-credentials: false  # nothing here pushes or fetches

      - uses: $/.github/actions/setup

      - name: Fetch the pinned nfpm and check its sha256
        uses: $/.github/actions/pinned-tool
        with:
          tool: nfpm
          version: ${{ env.NFPM_VERSION }}
          sha256: ${{ env.NFPM_SHA256 }}

      # Each side renders with the renderer in its own tree, so a renderer change that alters a
      # render shows as a diff. The base tree is a worktree at the merge base.
      #
      # `cases=true` when the PR changes an input of the container cases (steps 4 and 5) that
      # changes no render. `host_packages.py cases-changed` decides it: a path CASE_INPUTS
      # names, an edit to a host package job, or a differing render of the cases' fixture.
      # CASE_INPUTS is the one list of the cases' own inputs: the test image's build context
      # and fixture specs, and the cases' own code.
      # tests/repo/ci_workflows/test_host_package_case_inputs_census.py holds it to every `validate`
      # module the cases script imports. The renderer is a render input, so it reaches the
      # cases through `changed` when it alters a real render.
      #
      # The verdict is captured on a line of its own, where `set -e` aborts the step when
      # the command fails. Inside a `[ "$(...)" = true ]` test the failure would read as
      # `false` and skip the cases.
      - name: Render every host package at the head and at the merge base
        id: render
        env:
          EVENT: ${{ github.event_name }}  # via env, never interpolated into the shell
          CASE_INPUTS: |
            hosts/_example/vars.yml
            docs/host-packages.md
            hosts/bootstrap-host.sh
            hosts/lib/tests/container/
            scripts/validate/host_package_cases.py
            scripts/validate/host_packages.py
            scripts/validate/validate_lib/host_container.py
            scripts/validate/validate_lib/bootstrap_age_case.py
            scripts/validate/validate_lib/bootstrap_case.py
            scripts/validate/validate_lib/bootstrap_plan.py
            scripts/validate/validate_lib/bootstrap_repo_case.py
            scripts/validate/validate_lib/case_groups.py
            scripts/validate/validate_lib/conffile_case.py
            scripts/validate/validate_lib/disarm_case.py
            scripts/validate/validate_lib/engine_case.py
            scripts/validate/validate_lib/fixture_host_case.py
            scripts/validate/validate_lib/host_fixtures.py
            scripts/validate/validate_lib/host_specs.py
            scripts/validate/validate_lib/node_package_case.py
            scripts/validate/validate_lib/node_units_case.py
            scripts/validate/validate_lib/package_roots.py
            scripts/validate/validate_lib/repos_case.py
            scripts/validate/validate_lib/scratch_clones.py
            scripts/validate/validate_lib/secrets_case.py
            scripts/validate/validate_lib/pi_host_seed.py
        run: |
          set -euo pipefail
          if [ "$EVENT" = workflow_dispatch ]; then
            base=$(git merge-base origin/master HEAD)
          else
            base=$(git rev-parse HEAD^1)
          fi
          echo "Merge base: $base"
          git worktree add --detach "$RUNNER_TEMP/base-tree" "$base"
          mkdir -p "$RUNNER_TEMP/render/base" "$RUNNER_TEMP/render/head"
          uv run python scripts/validate/host_packages.py render \
            --tree "$RUNNER_TEMP/base-tree" --out "$RUNNER_TEMP/render/base"
          uv run python scripts/validate/host_packages.py render \
            --tree . --out "$RUNNER_TEMP/render/head"
          uv run python scripts/validate/host_packages.py diff \
            "$RUNNER_TEMP/render/base" "$RUNNER_TEMP/render/head" \
            --summary "$GITHUB_STEP_SUMMARY" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          # A dispatch of master has its merge base at HEAD, so no case can upgrade; the container
          # steps stand down.
          if [ "$base" = "$(git rev-parse HEAD)" ]; then
            echo "upgrade=false" >> "$GITHUB_OUTPUT"
          else
            echo "upgrade=true" >> "$GITHUB_OUTPUT"
          fi
          cases=$(uv run python scripts/validate/host_packages.py cases-changed "$base" \
            "$RUNNER_TEMP/base-tree" --inputs "$CASE_INPUTS")
          echo "cases=$cases" >> "$GITHUB_OUTPUT"

      # The two scans read the head render's package roots alone, so they sit here, after
      # the render and ahead of every step that stands down when the tree is unchanged. Neither
      # step has an `if:`: a PR that changes only .gitleaks.toml or the gitleaks pin renders no
      # package differently, and it still runs them (the host-package-scans-run-on-every-pr
      # row of tests/repo/_ci_sweep_workflow_rows.py).
      # The scan runs the gitleaks release that prek.toml pins, checked against the release's own
      # checksums file, so the version has one home and Renovate's prek.toml manager moves it.
      # `prove-scan` runs first: it shows the binary exempts a token at a package's ciphertext
      # path and flags the same token anywhere else.
      - name: Read the gitleaks pin
        id: gitleaks
        run: |
          set -euo pipefail
          version=$(sed -n '/repo = "https:\/\/github.com\/gitleaks\/gitleaks"/{n;s/^rev = "v\(.*\)"$/\1/p}' prek.toml)
          [ -n "$version" ] || { echo "::error::prek.toml pins no gitleaks rev"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache the gitleaks release
        uses: actions/cache@v6.1.0
        with:
          path: ${{ runner.temp }}/pinned/gitleaks
          key: gitleaks-${{ runner.os }}-${{ steps.gitleaks.outputs.version }}

      - name: Scan the named package roots for secrets
        env:
          GITLEAKS_VERSION: ${{ steps.gitleaks.outputs.version }}
        run: |
          set -euo pipefail
          version="$GITLEAKS_VERSION"
          dl="$RUNNER_TEMP/pinned/gitleaks"
          archive="gitleaks_${version}_linux_x64.tar.gz"
          if [[ -f "$dl/$archive" && -f "$dl/checksums.txt" ]]; then
            echo "gitleaks $version: cached"
          else
            mkdir -p "$dl"
            base="https://github.com/gitleaks/gitleaks/releases/download/v$version"
            curl --retry 12 --retry-all-errors --retry-delay 30 -fsSLo "$dl/$archive" "$base/$archive"
            curl --retry 12 --retry-all-errors --retry-delay 30 -fsSLo "$dl/checksums.txt" "$base/gitleaks_${version}_checksums.txt"
          fi
          mkdir -p "$RUNNER_TEMP/leaks"
          cd "$dl"
          # --ignore-missing skips the other platforms' lines; a run that verifies no file fails.
          sha256sum -c --ignore-missing --strict checksums.txt
          tar -xzf "$archive" -C "$RUNNER_TEMP/leaks" gitleaks
          cd "$GITHUB_WORKSPACE"
          uv run python scripts/validate/host_packages.py prove-scan \
            --gitleaks "$RUNNER_TEMP/leaks/gitleaks" --config .gitleaks.toml
          uv run python scripts/validate/host_packages.py scan-roots "$RUNNER_TEMP/render/head" \
            --gitleaks "$RUNNER_TEMP/leaks/gitleaks" --config .gitleaks.toml

      - name: Check the named package roots' placeholders against their SOPS keys
        run: uv run python scripts/validate/host_packages.py placeholders "$RUNNER_TEMP/render/head"

      # The cluster bundle promote publishes, scanned the way promote's `Scan the bundle for
      # secrets` step scans it. The renderer drops YAML comments, so a template line's
      # `# gitleaks:allow` satisfies the prek hook and not this scan. Without it such a line
      # merges green and fails every promotion after it. It reuses the gitleaks binary
      # the step above verified, which is the release promote's GITLEAKS_URL names, because one
      # Renovate group moves both pins. The render writes `out/` at the workspace root, the
      # layout `.gitleaks.toml`'s bundle allowlists name. The
      # host-package-bundle-scan-matches-promote row of tests/repo/_ci_sweep_workflow_rows.py
      # holds the build script and the scan's arguments equal to promote's.
      - name: Render the cluster bundle as promote does
        id: bundle
        run: |
          set -euo pipefail
          # A command substitution, so set -e stops the step when the read fails.
          listed="$(uv run python scripts/deploy_tools/promote.py published-tags)"
          if [ -z "$listed" ]; then
            uv run python scripts/renderer/homelab_render.py cluster --out out --shared-only --all-images
          else
            roles=()
            while read -r tag; do roles+=(--role "$tag"); done <<< "$listed"
            uv run python scripts/renderer/homelab_render.py cluster --out out --all-images "${roles[@]}"
          fi

      - name: Scan the cluster bundle for secrets
        id: bundle-gitleaks
        run: |
          "$RUNNER_TEMP/leaks/gitleaks" dir out --config .gitleaks.toml --no-banner --redact

      # homelab-tools renders pins and no bytes. The builder's own `install_tools`
      # fetches each pinned file, checks its sha256 and places it under the tree's root/, so a
      # wrong digest or a 404 URL fails here, and a Renovate bump of a pin reaches master only
      # if its new digest verifies. The cache is keyed by digest, so the base and head trees
      # share one download.
      #
      # The cache directory persists across runs under a key hashed from every rendered
      # tools.json, base and head. A run with unchanged pins restores it and requests no
      # release URL. A pin bump changes the key and misses, so the new pin is downloaded and
      # verified. No restore-keys, so an entry never carries a retired pin into the hand-off.
      # `download_tool` checks a cached file against its pin on every use, so a bad entry is
      # fetched anew.
      - name: Key the homelab-tools cache by the rendered pins
        id: tools-key
        if: >-
          github.event_name == 'workflow_dispatch' || steps.render.outputs.changed == 'true'
          || steps.render.outputs.cases == 'true'
        run: |
          set -euo pipefail
          pins=$(find "$RUNNER_TEMP/render" -name tools.json -print0 | sort -z | xargs -0r cat | sha256sum)
          echo "key=homelab-tools-${pins%% *}" >> "$GITHUB_OUTPUT"

      - name: Restore the homelab-tools cache
        if: steps.tools-key.outputs.key != ''
        uses: actions/cache@v6.1.0
        with:
          path: ${{ runner.temp }}/tools-cache
          key: ${{ steps.tools-key.outputs.key }}

      - name: Fetch the pinned homelab-tools binaries and check their sha256
        if: >-
          github.event_name == 'workflow_dispatch' || steps.render.outputs.changed == 'true'
          || steps.render.outputs.cases == 'true'
        run: |
          uv run python scripts/validate/host_packages.py fetch-tools \
            "$RUNNER_TEMP/render" --cache "$RUNNER_TEMP/tools-cache"

      # Each side's version comes from its own commit.
      - name: Build both renders with the pinned nfpm
        if: >-
          github.event_name == 'workflow_dispatch' || steps.render.outputs.changed == 'true'
          || steps.render.outputs.cases == 'true'
        env:
          BASE_SHA: ${{ steps.render.outputs.base }}
        run: |
          set -euo pipefail
          # Called bare under `&`, never from `||` or `if`, which would switch off errexit.
          pack() {
            local side=$1 version=$2 spec=$3 scratch=$4
            export HOMELAB_VERSION=$version
            export TMPDIR="$RUNNER_TEMP/nfpm-tmp/$side/$scratch"
            mkdir -p "$TMPDIR"
            cd "$(dirname "$spec")"
            nfpm package --config nfpm.yaml --packager deb --target "$RUNNER_TEMP/debs/$side/"
          }
          mkdir -p "$RUNNER_TEMP/build-logs"
          pids=() labels=() logs=()
          for side in base head; do
            sha=$BASE_SHA
            [ "$side" = base ] || sha=$(git rev-parse HEAD)
            version="0.$(git rev-list --count --first-parent "$sha")+g$(git rev-parse "$sha" | cut -c1-12)"
            mkdir -p "$RUNNER_TEMP/debs/$side"
            mapfile -d '' specs < <(find "$RUNNER_TEMP/render/$side" -name nfpm.yaml -print0 | sort -z)
            for spec in "${specs[@]}"; do
              n=${#pids[@]}
              rel=${spec#"$RUNNER_TEMP/render/$side/"}
              logs+=("$RUNNER_TEMP/build-logs/$n.log")
              labels+=("$side build of ${rel%/nfpm.yaml}")
              pack "$side" "$version" "$spec" "$n" > "${logs[$n]}" 2>&1 &
              pids+=("$!")
            done
          done
          errors=()
          for i in "${!pids[@]}"; do
            rc=0
            wait "${pids[$i]}" || rc=$?
            echo "::group::${labels[$i]}"
            cat "${logs[$i]}"
            echo "::endgroup::"
            [ "$rc" = 0 ] || errors+=("::error::the ${labels[$i]} exited $rc")
          done
          if [ "${#errors[@]}" -gt 0 ]; then printf '%s\n' "${errors[@]}"; exit 1; fi
          find "$RUNNER_TEMP/debs" -name '*.deb' -print0 | sort -z |
            while IFS= read -r -d '' deb; do
              echo "== $deb"
              dpkg-deb --field "$deb" Package Version Depends
              dpkg-deb --contents "$deb"
            done

      # `host_tools_arm64` downloads only when this says a build exists, so a failed download fails
      # that job.
      - name: Say whether an arm64 homelab-tools build exists
        id: arm64
        run: |
          shopt -s nullglob
          debs=("$RUNNER_TEMP"/debs/head/homelab-tools_*_arm64.deb)
          if [ "${#debs[@]}" -gt 0 ]; then built=true; else built=false; fi
          echo "built=$built" >> "$GITHUB_OUTPUT"

      # The `host_tools_arm64` job installs this build on a real arm64 runner.
      - name: Hand the arm64 homelab-tools build to the arm64 job
        if: steps.arm64.outputs.built == 'true'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: homelab-tools-arm64
          path: ${{ runner.temp }}/debs/head/homelab-tools_*_arm64.deb
          if-no-files-found: error
          retention-days: 1

      - name: Run the type-config and maintainer-script lints over both renders and builds
        if: >-
          github.event_name == 'workflow_dispatch' || steps.render.outputs.changed == 'true'
          || steps.render.outputs.cases == 'true'
        run: |
          uv run python scripts/validate/host_packages.py lint \
            "$RUNNER_TEMP/render" "$RUNNER_TEMP/debs"

      - name: Red-proof the lints on a package built from the red fixture
        if: >-
          github.event_name == 'workflow_dispatch' || steps.render.outputs.changed == 'true'
          || steps.render.outputs.cases == 'true'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/red"
          (cd scripts/validate/tests/fixtures/host_packages/red &&
            nfpm package --config nfpm.yaml --packager deb --target "$RUNNER_TEMP/red/")
          rc=0
          uv run python scripts/validate/host_packages.py lint "$RUNNER_TEMP/red" \
            2> "$RUNNER_TEMP/red.log" || rc=$?
          cat "$RUNNER_TEMP/red.log"
          echo "lint of the red fixture exited $rc"
          [ "$rc" = 1 ]
          grep -q 'conffiles lists /etc/homelab-red.conf' "$RUNNER_TEMP/red.log"
          grep -qF "postinst:2: 'rm -rf /etc/foo'" "$RUNNER_TEMP/red.log"

      # One tarball carries all three because an artifact zip drops file modes and the render ships
      # executable maintainer scripts.
      - name: Hand the render, the debs and nfpm to the cases legs
        if: >-
          github.event_name == 'workflow_dispatch' || steps.render.outputs.changed == 'true'
          || steps.render.outputs.cases == 'true'
        run: >-
          tar -cf "$RUNNER_TEMP/host-packages-build.tar" -C "$RUNNER_TEMP"
          --exclude='render/*/packages/homelab-tools'
          --exclude='debs/base/homelab-tools_*' --exclude='debs/*/homelab-tools_*_arm64.deb'
          render debs bin/nfpm

      - name: Upload the hand-off for the cases legs
        if: >-
          github.event_name == 'workflow_dispatch' || steps.render.outputs.changed == 'true'
          || steps.render.outputs.cases == 'true'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: host-packages-build
          path: ${{ runner.temp }}/host-packages-build.tar
          if-no-files-found: error
          retention-days: 1
          # The debs and the tool binaries inside are compressed already.
          compression-level: 0

  # A leg skips when `run-cases` says no cases; the condition must skip for no other reason, pinned
  # by `test_ci_skip_proven_master.py`.
  #
  # The `name:` leaves the shard out, so a release's shards share the check-run name `ci_verdict.py`
  # lists. Each shard runs `case_groups.groups`'s share: on one runner the groups ran about 150 s
  # past `upgrade_path`, the longest group, which no shard can split.
  host_packages:
    name: host_packages (${{ matrix.release }}, ${{ matrix.python }})
    needs: [prove, host_packages_build]
    if: ${{ (needs.prove.result == 'cancelled' || needs.prove.result == 'failure' || (!cancelled() && needs.prove.outputs.proven != 'true')) && github.event.pull_request.draft != true && needs.host_packages_build.result == 'success' && needs.host_packages_build.outputs.run-cases == 'true' }}
    runs-on: ubuntu-26.04
    # A PR changing the Dockerfile builds the image from snapshot.ubuntu.com, so the budget covers a
    # slow mirror; `CI_TIMEOUT_S` in `land_lib/options.py` moves with it.
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read  # the pinned test image, while its GHCR package is private
    strategy:
      # Each leg reports its own conclusion, so one release's failure does not hide another's.
      fail-fast: false
      matrix:
        # A leg's name is a check-run name `hosts/lib/ci_verdict.py` lists, so the job stays a
        # matrix with one release.
        include:
          - {release: "26.04", python: "3.14", shard: "1/2"}
          - {release: "26.04", python: "3.14", shard: "2/2"}
    env:
      # Skips pyproject.toml's `lint` group, which no step here runs (test_ci_lint_group.py).
      UV_NO_GROUP: lint
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false  # nothing here pushes or fetches

      - uses: $/.github/actions/setup

      - name: Restore the hand-off from the build job
        id: handoff
        uses: $/.github/actions/host-packages-handoff
        with:
          tools-key: ${{ needs.host_packages_build.outputs.tools-key }}

      # The early exit is in the script, not the `if:`, because a dispatch must reach this step and
      # a dispatch of master must stay green.
      - name: Build the test image for this release
        env:
          RELEASE: ${{ matrix.release }}
          UPGRADE: ${{ needs.host_packages_build.outputs.upgrade }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$UPGRADE" != true ]; then
            echo "::notice::The merge base is HEAD, so no case can upgrade; no image is built."
            exit 0
          fi
          hosts/lib/tests/container/build-image.sh "$RELEASE"
          {
            echo "### Test image, ubuntu:$RELEASE"
            echo '```'
            docker run --rm "homelab-host-test:$RELEASE" dpkg-query -W systemd python3
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Step 5: this leg's shard of the cases, on its release. The script's docstring lists them.
      - name: Run the updater cases in systemd containers
        env:
          RELEASE: ${{ matrix.release }}
          PYTHON: ${{ matrix.python }}
          SHARD: ${{ matrix.shard }}
          UPGRADE: ${{ needs.host_packages_build.outputs.upgrade }}
          TOOLS_CACHE_HIT: ${{ steps.handoff.outputs.cache-hit }}
        run: |
          if [ "$UPGRADE" != true ]; then
            echo "::notice::The merge base is HEAD, so no case can upgrade; no case runs."
            exit 0
          fi
          seed=()
          if [ "$TOOLS_CACHE_HIT" = true ]; then
            seed=(--tools-cache "$RUNNER_TEMP/tools-cache")
          else
            echo "::notice::The build job's tools cache did not restore; the cases download each pin."
          fi
          uv run python scripts/validate/host_package_cases.py --image "homelab-host-test:$RELEASE" \
            --python "$PYTHON" --render "$RUNNER_TEMP/render" --debs "$RUNNER_TEMP/debs" \
            --work "$RUNNER_TEMP/cases" "${seed[@]}" --shard "$SHARD"

  # The `name:` leaves the shard out, so a release's shards share the check-run name `ci_verdict.py`
  # lists; a renamed leg would read as pending to installed copies.
  host_packages_bootstrap:
    name: host_packages_bootstrap (${{ matrix.release }}, ${{ matrix.python }})
    needs: [prove, host_packages_build]
    if: ${{ (needs.prove.result == 'cancelled' || needs.prove.result == 'failure' || (!cancelled() && needs.prove.outputs.proven != 'true')) && github.event.pull_request.draft != true && needs.host_packages_build.result == 'success' && needs.host_packages_build.outputs.run-cases == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read  # the pinned test image, while its GHCR package is private
    strategy:
      fail-fast: false
      matrix:
        include:
          - {release: "26.04", python: "3.14", shard: "1/2"}
          - {release: "26.04", python: "3.14", shard: "2/2"}
    env:
      UV_NO_GROUP: lint
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false  # nothing here pushes or fetches

      - uses: $/.github/actions/setup

      - name: Restore the hand-off from the build job
        id: handoff
        uses: $/.github/actions/host-packages-handoff
        with:
          tools-key: ${{ needs.host_packages_build.outputs.tools-key }}

      - name: Build the test image for this release
        env:
          RELEASE: ${{ matrix.release }}
          UPGRADE: ${{ needs.host_packages_build.outputs.upgrade }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$UPGRADE" != true ]; then
            echo "::notice::The merge base is HEAD, so no case can upgrade; no image is built."
            exit 0
          fi
          hosts/lib/tests/container/build-image.sh "$RELEASE"

      - name: Run the bootstrap cases in systemd containers
        env:
          RELEASE: ${{ matrix.release }}
          PYTHON: ${{ matrix.python }}
          SHARD: ${{ matrix.shard }}
          UPGRADE: ${{ needs.host_packages_build.outputs.upgrade }}
          TOOLS_CACHE_HIT: ${{ steps.handoff.outputs.cache-hit }}
        run: |
          if [ "$UPGRADE" != true ]; then
            echo "::notice::The merge base is HEAD, so no image was built; the bootstrap cases do not run."
            exit 0
          fi
          seed=()
          if [ "$TOOLS_CACHE_HIT" = true ]; then
            seed=(--tools-cache "$RUNNER_TEMP/tools-cache")
          else
            echo "::notice::The build job's tools cache did not restore; the cases download each pin."
          fi
          uv run python scripts/validate/host_package_cases.py --image "homelab-host-test:$RELEASE" \
            --python "$PYTHON" --render "$RUNNER_TEMP/render" --debs "$RUNNER_TEMP/debs" \
            --work "$RUNNER_TEMP/cases-bootstrap" "${seed[@]}" --bootstrap \
            --shard "$SHARD"

  # The bootstrap case whose seed never holds k3s, so install.sh's own download and sha256 check
  # of the release binary run whatever the legs seed. One release
  # is enough: the download does not depend on the release under test.
  #
  # It is a job of its own, beside the legs rather than after their cases, so it adds nothing to
  # the 26.04 leg, the longest of the run. It sits outside the `prek` gate, with a
  # job-level `continue-on-error`, so a GitHub release outage cannot fail the PR. The image and
  # case steps carry their own `continue-on-error` too: a job-level one still leaves a failed
  # job's check-run red, which every reader of a PR's check rollup counts as a failure. A failed
  # step shows as an annotation instead. `test_every_ci_job_is_gated.py` lists the job in
  # NON_GATING_JOBS. The id does not start with `host_packages`, for the reason above.
  #
  # The job skips when the build has no work for it (`run-cases`), so it takes no runner on a PR
  # that touches no host input. A full run is more jobs than the account's 20-job cap, and a
  # job that only skips its steps still waits for a slot (docs/ci-throughput.md).
  #
  # The budget matches the legs', because a Dockerfile PR builds the image here too.
  k3s_download:
    name: k3s release download case (does not gate)
    needs: [prove, host_packages_build]
    if: ${{ (needs.prove.result == 'cancelled' || needs.prove.result == 'failure' || (!cancelled() && needs.prove.outputs.proven != 'true')) && github.event.pull_request.draft != true && needs.host_packages_build.result == 'success' && needs.host_packages_build.outputs.run-cases == 'true' }}
    continue-on-error: true
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read  # the pinned test image, while its GHCR package is private
    env:
      UV_NO_GROUP: lint
      PYTHON: "3.14"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false  # nothing here pushes or fetches

      - uses: $/.github/actions/setup

      - name: Restore the hand-off from the build job
        id: handoff
        uses: $/.github/actions/host-packages-handoff
        with:
          tools-key: ${{ needs.host_packages_build.outputs.tools-key }}

      - name: Build the test image
        continue-on-error: true
        env:
          UPGRADE: ${{ needs.host_packages_build.outputs.upgrade }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$UPGRADE" != true ]; then
            echo "::notice::The merge base is HEAD, so no case can upgrade; no image is built."
            exit 0
          fi
          hosts/lib/tests/container/build-image.sh 26.04

      - name: Run the bootstrap case that downloads k3s from its release
        continue-on-error: true
        env:
          UPGRADE: ${{ needs.host_packages_build.outputs.upgrade }}
          TOOLS_CACHE_HIT: ${{ steps.handoff.outputs.cache-hit }}
        run: |
          if [ "$UPGRADE" != true ]; then
            echo "::notice::The merge base is HEAD, so no image was built; the k3s download case does not run."
            exit 0
          fi
          seed=()
          if [ "$TOOLS_CACHE_HIT" = true ]; then
            seed=(--tools-cache "$RUNNER_TEMP/tools-cache")
          fi
          uv run python scripts/validate/host_package_cases.py --image homelab-host-test:26.04 \
            --python "$PYTHON" --render "$RUNNER_TEMP/render" --debs "$RUNNER_TEMP/debs" \
            --work "$RUNNER_TEMP/cases-k3s-download" "${seed[@]}" --k3s-download

  # RUNNER LABEL: GitHub's hosted `arm64` Linux runner; if GitHub refuses the label the job falls
  # back to QEMU on `ubuntu-26.04`, and a run left queued is that refusal.
  host_tools_arm64:
    needs: [prove, host_packages_build]
    if: ${{ (needs.prove.result == 'cancelled' || needs.prove.result == 'failure' || (!cancelled() && needs.prove.outputs.proven != 'true')) && github.event.pull_request.draft != true && needs.host_packages_build.result == 'success' && (github.event_name == 'workflow_dispatch' || needs.host_packages_build.outputs.arm64-tools == 'true') }}
    runs-on: ubuntu-24.04-arm
    # A slow mirror makes the image build take about half an hour.
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read  # the pinned test image, while its GHCR package is private
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false  # nothing here pushes or fetches

      - name: Download the arm64 homelab-tools build
        if: needs.host_packages_build.outputs.arm64-tools == 'true'
        uses: actions/download-artifact@v8.0.2
        with:
          name: homelab-tools-arm64
          path: ${{ runner.temp }}/debs

      - name: Install the build in the test image and run each tool
        env:
          BUILT: ${{ needs.host_packages_build.outputs.arm64-tools }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          debs=("$RUNNER_TEMP"/debs/homelab-tools_*_arm64.deb)
          if [ "${#debs[@]}" -eq 0 ]; then
            if [ "$BUILT" = true ]; then
              echo "::error::host_packages_build built the arm64 homelab-tools, but the download delivered no .deb"
              exit 1
            fi
            echo "::notice::host_packages_build built no homelab-tools, so there is nothing to install."
            exit 0
          fi
          hosts/lib/tests/container/build-image.sh 26.04
          docker run --rm -v "$RUNNER_TEMP/debs:/debs:ro" homelab-host-test:26.04 sh -euc '
            test "$(dpkg --print-architecture)" = arm64
            DEBIAN_FRONTEND=noninteractive apt-get install -y /debs/homelab-tools_*_arm64.deb
            dpkg-query -W homelab-tools:arm64
            for tool in sops node-exporter; do
              /usr/lib/homelab/bin/$tool --version
              if command -v "$tool"; then echo "$tool is on PATH" >&2; exit 1; fi
            done
            test -z "$(dpkg --verify homelab-tools)"
          '

  # `if: always()` because a job with `needs` is SKIPPED when a dependency fails, and GitHub counts
  # a skipped required check as passing.
  prek:
    name: prek (lint + validate + tests + secrets)
    runs-on: ubuntu-26.04
    needs: [prove, hooks, pr_gates, pytest_plan, pytest, lockfile, flux_roundtrip, sops_manifest_type_proof, host_packages_build, host_packages, host_packages_bootstrap, host_tools_arm64]
    # A red gate on a draft would pin the head red for every reader that takes the worst check run
    # per name; the skipped gate is not a pass, since GitHub refuses to merge a draft.
    if: ${{ always() && github.event.pull_request.draft != true }}
    # `land.sh`'s CI budget sums this chain's timeouts, so the gate names its own.
    timeout-minutes: 5
    # The job runs no repository code except on a landing batch, a `queue/` branch only a
    # collaborator can push.
    permissions:
      contents: read
      statuses: write
    steps:
      # Every dependency must be named in an expression here: a `needs` entry this step does not
      # read is waited for and never checked.
      - name: Require every half to have succeeded
        env:
          RUN_CASES: ${{ needs.host_packages_build.outputs.run-cases }}
          ARM64_TOOLS: ${{ needs.host_packages_build.outputs.arm64-tools }}
          PROVE: ${{ needs.prove.result }}
          PROVEN: ${{ needs.prove.outputs.proven }}
          HOOKS: ${{ needs.hooks.result }}
          PR_GATES: ${{ needs.pr_gates.result }}
          PYTEST_PLAN: ${{ needs.pytest_plan.result }}
          PYTEST: ${{ needs.pytest.result }}
          LOCKFILE: ${{ needs.lockfile.result }}
          FLUX_ROUNDTRIP: ${{ needs.flux_roundtrip.result }}
          SOPS_TYPE_PROOF: ${{ needs.sops_manifest_type_proof.result }}
          HOST_PACKAGES_BUILD: ${{ needs.host_packages_build.result }}
          HOST_PACKAGES: ${{ needs.host_packages.result }}
          HOST_PACKAGES_BOOTSTRAP: ${{ needs.host_packages_bootstrap.result }}
          HOST_TOOLS_ARM64: ${{ needs.host_tools_arm64.result }}
        run: |
          echo "prove=$PROVE proven=${PROVEN:-} hooks=$HOOKS pr-gates=$PR_GATES" \
            "pytest-plan=$PYTEST_PLAN pytest=$PYTEST" \
            "lockfile=$LOCKFILE flux-roundtrip=$FLUX_ROUNDTRIP sops-type-proof=$SOPS_TYPE_PROOF" \
            "host-packages-build=$HOST_PACKAGES_BUILD host-packages=$HOST_PACKAGES" \
            "host-packages-bootstrap=$HOST_PACKAGES_BOOTSTRAP" \
            "host-tools-arm64=$HOST_TOOLS_ARM64 run-cases=${RUN_CASES:-} arm64-tools=${ARM64_TOOLS:-}"
          # `prove` is `skipped` on every run but a push or labelled PR; `cancelled` or `failure`
          # means unproven and every dependent ran.
          case "$PROVE" in
            success | skipped | cancelled | failure) ;;
            *) echo "::error title=gate::prove's result is '$PROVE', not success, skipped, cancelled or failure"; exit 1 ;;
          esac
          proven=false
          if [ "$PROVE" = success ] && [ "${PROVEN:-}" = true ]; then proven=true; fi
          ok() { [ "$1" = success ] || { [ "$proven" = true ] && [ "$1" = skipped ]; }; }
          # The build's own result is required below, so a failed build passes nothing here.
          ok_or_idle() { ok "$1" || { [ "$1" = skipped ] && [ "$2" = false ]; }; }
          failed=()
          need() { local half=$1; shift; "$@" || failed+=("$half=$2"); }
          need hooks ok "$HOOKS"
          need pr-gates ok "$PR_GATES"
          need pytest-plan ok "$PYTEST_PLAN"
          need pytest ok "$PYTEST"
          need lockfile ok "$LOCKFILE"
          need flux-roundtrip ok "$FLUX_ROUNDTRIP"
          need sops-type-proof ok "$SOPS_TYPE_PROOF"
          need host-packages-build ok "$HOST_PACKAGES_BUILD"
          need host-packages ok_or_idle "$HOST_PACKAGES" "${RUN_CASES:-}"
          need host-packages-bootstrap ok_or_idle "$HOST_PACKAGES_BOOTSTRAP" "${RUN_CASES:-}"
          need host-tools-arm64 ok_or_idle "$HOST_TOOLS_ARM64" "${ARM64_TOOLS:-}"
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "::error title=gate::${#failed[@]} halves failed: ${failed[*]}"
            exit 1
          fi

      # On a PR GITHUB_SHA is the merge commit whose tree every job checked out; the status goes on
      # the PR head.
      - name: Record the tested tree on the PR head
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && !(needs.prove.result == 'success' && needs.prove.outputs.proven == 'true') && (needs.pytest.outputs.scope == 'full' || needs.pytest.outputs.scope == 'selected')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          tree=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$GITHUB_SHA" --jq .tree.sha)
          gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            -f state=success -f context=ci/tested-tree -f description="$tree" -f target_url="$RUN_URL"
          echo "Recorded tree $tree on $HEAD_SHA."

      # A landing batch is a pull request from a `queue/` branch of this repository that holds
      # up to four PRs stacked on master, and this run is the one run they share
      # (`docs/ci-throughput.md`, slice B3). `tested_tree.py record-batch` reads the members'
      # numbers from the PR's body, stacks their heads on this run's base itself, and records a
      # tree on each head only when the last stacked tree is the tree this run tested. The
      # body travels in the environment, because it is free text.
      #
      # The checkout is this job's only one, and only a batch pays for it. It takes the whole
      # history without blobs: a merge needs each head's merge base, and git fetches the few
      # blobs a merge reads. Both steps carry `continue-on-error`, as the record above does:
      # a batch whose trees are not recorded lands its members one at a time, and a red gate
      # here would fail a batch that passed. Each has its own timeout for the same reason: a
      # fetch that hangs would otherwise run into the job's timeout and cancel the gate.
      - name: Check out the batch's history
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'queue/') && !(needs.prove.result == 'success' && needs.prove.outputs.proven == 'true') && (needs.pytest.outputs.scope == 'full' || needs.pytest.outputs.scope == 'selected')
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - name: Record the tested tree on each batch member's head
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'queue/') && !(needs.prove.result == 'success' && needs.prove.outputs.proven == 'true') && (needs.pytest.outputs.scope == 'full' || needs.pytest.outputs.scope == 'selected')
        continue-on-error: true
        timeout-minutes: 2
        env:
          PYTHONPATH: scripts
          GITHUB_TOKEN: ${{ github.token }}
          BATCH_BODY: ${{ github.event.pull_request.body }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 scripts/dev/tested_tree.py record-batch --repo "$GITHUB_REPOSITORY" \
            --base "$(git rev-parse "$GITHUB_SHA^1")" \
            --tested-tree "$(git rev-parse "$GITHUB_SHA^{tree}")" --run-url "$RUN_URL"

  renovate-config:
    name: renovate config validator
    # Not on push: the merge-to-master run is a daily schedule in
    # renovate-config-canary.yml. This job is the required merge context,
    # so it stays on every PR and self-scopes below; merge_group is treated like a PR whose
    # scope step found nothing to diff, the same as every other job here.
    if: github.event_name != 'push' && github.event.pull_request.draft != true
    runs-on: ubuntu-26.04
    timeout-minutes: 20  # six install attempts at 60s, plus a wedged fetch
    env:
      # Skips pyproject.toml's `lint` group, which no step here runs (test_ci_lint_group.py).
      UV_NO_GROUP: lint
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0  # the merge-base diff below needs history
          persist-credentials: false  # nothing here pushes; the merge-base fetch carries its own token

      # The script's `npm install renovate@latest` re-downloads Renovate on every run, which
      # makes this job the longest in the workflow on a PR that runs it. Skip it on PRs that
      # cannot change what it checks. A Renovate bump PR edits a pinned file, so it runs the
      # extract; most other PRs get a fast green.
      #
      # Caching does not help. The key cannot be content-derived from an unpinned package, so a
      # rolling key would write a large entry every run and churn the repo's 10 GB cache budget,
      # likely evicting the prek caches this workflow depends on. Keeping npm's `_npx` tree
      # SILENTLY PINS: its manifest records `renovate: ^44.30.1`, npm sees the install satisfies
      # it and reuses it without ever contacting the registry. That would quietly defeat the
      # whole point of this job, below.
      #
      # `validate` runs when the PR touches renovate.json. `extract` runs when it touches
      # renovate.json, scripts/validate/renovate_expected_deps.tsv, a file that table lists, a
      # file a census rule of renovate_extract.py reads, or the check itself, or when it adds
      # a file that is not prose or Python; `renovate_extract.py scope` decides, on the
      # runner's own python3, before any setup. The daily canary runs both checks on master.
      - name: Decide which Renovate checks this PR needs
        id: scope
        if: github.event_name == 'pull_request'
        env:
          PYTHONPATH: scripts
          BASE_REF: ${{ github.base_ref }}  # via env, never interpolated into the shell
          FETCH_TOKEN: ${{ github.token }}  # contents: read; the checkout drops its own, see the fetch in the script
        run: |
          set -euo pipefail
          "$GITHUB_WORKSPACE/scripts/dev/pr_changed_files.sh"
          # The script diffs against the merge base, so this is the PR's own change to the file.
          # A deletion of renovate.json counts as touching it.
          checks=""
          if grep -qFx renovate.json "$RUNNER_TEMP/changed.txt" "$RUNNER_TEMP/deleted.txt"; then
            checks="validate"
          fi
          # Assigned first so `set -e` fails the step when the script errors; inside the `if` test
          # an error would read as skip and leave the required job green.
          git diff --name-only --no-renames --diff-filter=A "origin/$BASE_REF...HEAD" > "$RUNNER_TEMP/added.txt"
          scope=$(python3 scripts/validate/renovate_extract.py scope "$RUNNER_TEMP/changed.txt" "$RUNNER_TEMP/deleted.txt" --added "$RUNNER_TEMP/added.txt")
          case "$scope" in
            true) checks="$checks extract" ;;
            false) ;;
            *) echo "::error::renovate_extract.py scope printed '$scope', not true or false"; exit 1 ;;
          esac
          echo "checks=$checks" >> "$GITHUB_OUTPUT"
          if [ -z "$checks" ]; then
            echo "Nothing this PR changes can move the Renovate config or its extract; the daily renovate-config-canary run checks master."
          fi

      - uses: $/.github/actions/setup
        if: github.event_name != 'pull_request' || steps.scope.outputs.checks != ''
        with:
          python: "true"
          uv: "true"
          node: "true"

      # Semantic validation of renovate.json — the one dependency-management axis with no
      # fail-at-commit backstop. prek's `check-json` only proves the file is well-formed JSON;
      # a typo'd packageRule field (e.g. matchPackageName vs matchPackageNames) is silently
      # IGNORED by Renovate (logged as a config warning, kept running), which would quietly
      # re-enable auto-merge of the stateful/DB-breaking bumps the automerge:false overrides
      # (getmeili/meilisearch, the crowdsec bouncer plugin) exist to block.
      # `--strict` makes those warnings fail the build. Validates against the latest Renovate —
      # the same hosted Mend app version that actually consumes the config, which is why it is
      # deliberately unpinned and why neither caching variant above was taken.
      #
      # The extract is Renovate's own matching of every custom manager over the checkout, held
      # against the expected-dependency table, so a reformatted pin or a broken matchString
      # fails here by name.
      #
      # The canary beyond validating edits — a config that Renovate itself stops accepting —
      # is renovate-config-canary.yml, daily. It does not run here on a push to master: a
      # per-merge unpinned fetch fails on its own for minutes after each of
      # Renovate's ~8 daily npm publishes. The script retries that install; each check
      # runs once, so a real failure is still final.
      - name: Validate renovate.json and check Renovate's extract
        if: github.event_name != 'pull_request' || steps.scope.outputs.checks != ''
        env:
          CHECKS: ${{ steps.scope.outputs.checks }}  # empty off a PR, which runs both
        run: |
          # shellcheck disable=SC2086 # CHECKS is a space-separated list of check names
          scripts/validate/renovate_config.sh $CHECKS
