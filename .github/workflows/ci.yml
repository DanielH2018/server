name: CI

on:
  pull_request:
  push:
    branches: [master]

# Cancel a superseded run when new commits land on the same ref (PR force-push / stacked
# pushes) so redundant lint/test runs don't pile up.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # prek runs its hooks SEQUENTIALLY — the `concurrency=N` in its trace log is per-file
  # batching *within* one hook, not hooks in parallel. So the step's wall clock is the sum of
  # every hook, and one hook dominates it. Measured on the runner with warm caches
  # (2026-08-14, from prek's own per-hook spans):
  #
  #   ansible-lint  89.7s   pytest  13.5s   validate-k8s-manifests  2.2s
  #   validate-compose-templates  1.4s      everything else  <1s each      gitleaks  0.03s
  #
  # Sharding ansible-lint away from the other 19 hooks turns that sum into a max: the two
  # shards run concurrently, so the ~37s of non-ansible-lint work stops being time nothing
  # else can overlap. Each shard pays its own checkout + setup (~15s), which is why this is
  # only worth doing for a split this lopsided — do NOT shard further, the setup cost would
  # exceed what any additional shard removes.
  #
  # The split still earns its keep now that PRs lint only changed ansible files (see the run
  # step below): a push to master lints all 325 and remains the long pole. On a PR the
  # ansible-lint shard finishes in seconds and the `rest` shard sets the critical path — that
  # costs a few runner minutes, not wall clock.
  hooks:
    name: hooks (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20  # cap a wedged network hook (ansible-galaxy install) so it can't burn to the 6h default
    strategy:
      fail-fast: false  # a lint failure must not hide a test failure in the sibling shard
      matrix:
        include:
          - id: ansible-lint
            name: ansible-lint
            select: ansible-lint
          - id: rest
            name: validate + tests + secrets
            select: --skip ansible-lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0  # full clone; prek --all-files scans the worktree, so history isn't strictly required here — kept as belt-and-suspenders

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3  # v8.3.0  # no floating v8 tag is published; pin the exact release
        with:
          # Nine prek hooks shell out to `uv run`, which resolves the whole `dev` group
          # (ansible-core, pytest, docker, flask, ruff, shellcheck-py) before the first one
          # executes. Without this the download is repaid on every run. Keyed on uv.lock by
          # the action itself, so a lock change invalidates it exactly.
          enable-cache: true

      # prek bootstraps one isolated environment per remote hook repo whenever its cache is
      # cold — uncached, that is every CI run. Worth ~14s here (the step measured 141s before
      # these caches and 127s after). It is much cheaper on the runner than it is on a
      # workstation: the `gitleaks` hook is `language = "golang"`, and where daniel-box has no
      # Go and makes prek fetch a ~270 MB managed toolchain to build gitleaks from source
      # (220s cold, for a scan that takes 0.05s), ubuntu-latest ships Go preinstalled and prek
      # uses it. Hence a 45 MB cache rather than a 350 MB one.
      #
      # Only the environment dirs are cached. `~/.cache/prek/cache` is prek's own pip/uv
      # DOWNLOAD cache — pure redundancy once the envs it built are themselves restored, and
      # (~500 MB on a machine that does fetch a toolchain) large enough that carrying it would
      # eat the saving in transfer time.
      #
      # restore-keys is safe here because prek's env dirs are content-addressed
      # (hooks/<language>-<hash>): a stale entry from an older prek.toml is ignored rather
      # than reused, so a partial hit still lets the UNCHANGED hooks skip their rebuild when
      # one rev bumps. The fresh key then saves the union. Keyed per shard — the two shards
      # build disjoint sets of hook envs, so a shared key would have them overwrite each
      # other's save with a partial tree.
      - name: Cache prek hook environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/prek/repos
            ~/.cache/prek/hooks
            ~/.cache/prek/tools
          key: prek-${{ runner.os }}-${{ matrix.id }}-${{ hashFiles('prek.toml') }}
          restore-keys: prek-${{ runner.os }}-${{ matrix.id }}-

      # The ansible-lint hook's entry runs `ansible-galaxy collection install` before linting.
      # ansible/collections/ is gitignored, so that is a ~40 MB download of four collections on
      # every run; warm, the same command is a 0.4s no-op ("Nothing to do. All requested
      # collections are already installed"). Versions are exactly pinned in requirements.yml,
      # so hashing it is an exact key with no staleness window — hence no restore-keys.
      - name: Cache Ansible collections
        if: matrix.id == 'ansible-lint'  # the only shard that runs the hook needing them
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ansible/collections
          key: galaxy-${{ runner.os }}-${{ hashFiles('ansible/requirements.yml') }}

      - name: Install prek
        run: pip install prek==0.4.10  # pinned for a reproducible hook toolchain; Renovate (pypi) bumps it

      # On a PR, lint only the ansible files the PR actually touches. ansible-lint's cost is
      # per-file (one task file 1.45s, the whole tree 18.4s locally), so this is the difference
      # between ~90s and ~2s — by far the largest single saving in this workflow.
      #
      # The file list is computed HERE rather than handed to prek's --from-ref/--to-ref, because
      # that mode does not skip a hook whose matching-file set is empty: it runs the hook with
      # NO filenames, and `ansible-lint` with no arguments falls back to walking the whole tree.
      # Measured — this PR changes no ansible YAML, and --from-ref still spent 93s linting all
      # 954 files while reporting a cheerful "Passed". The failure mode is slow, not unsafe, but
      # it removes the entire saving for exactly the PRs that should be fastest.
      #
      # `A...B` (three dots) diffs against the merge base, so this is the PR's own changes and
      # not whatever else landed on master meanwhile. --diff-filter=d drops deletions: a removed
      # file is still "changed", but passing a path that no longer exists is an ansible-lint
      # error, not a lint finding.
      #
      # What this gives up: ansible-lint does no cross-file variable analysis, so the residual
      # gap is narrow — a change to file X will not re-lint an unchanged file Y that consumes
      # it. The push-to-master run below still lints all 325, so such a case surfaces there
      # rather than never. That is a deliberate trade of post-merge detection for PR latency.
      - name: Run hooks (PR — ansible-lint on changed files only)
        if: matrix.id == 'ansible-lint' && github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}  # via env, never interpolated into the shell
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_REF"
          # Filtered with grep rather than a git pathspec glob (`ansible/**/*.yml` behaves
          # differently under git's wildmatch than it reads). secrets.yml is dropped here as
          # well as by the hook's own exclude: were it the ONLY changed file, prek would filter
          # the list to empty and fall straight back into the walk described above.
          mapfile -t changed < <(git diff --name-only --diff-filter=d "origin/$BASE_REF...HEAD" \
            -- ansible/ | grep -E '\.ya?ml$' | grep -v '^ansible/vars/secrets\.yml$' || true)
          if [ "${#changed[@]}" -eq 0 ]; then
            echo "No ansible YAML changed in this PR — nothing for ansible-lint to do."
            exit 0
          fi
          echo "Linting ${#changed[@]} changed file(s):"
          printf '  %s\n' "${changed[@]}"
          # Hook id BEFORE --files: --files is variadic and would otherwise swallow it.
          prek run ansible-lint --color always --files "${changed[@]}"

      # Everything else, and every push to master: the full sweep.
      #
      # Both shards pass --all-files here: the split is about WHICH hooks run in each job, never
      # about narrowing the files any hook sees. Between them the two shards run every hook
      # exactly once, and `--skip ansible-lint` means a hook added to prek.toml later lands in
      # the `rest` shard automatically rather than being silently dropped by an allow-list.
      - name: Run hooks
        if: matrix.id != 'ansible-lint' || github.event_name != 'pull_request'
        run: prek run --all-files --color always ${{ matrix.select }}

  # Branch protection requires the context "prek (lint + validate + tests + secrets)". The job
  # that used to carry that name is now two matrix shards with names of their own, so this
  # aggregator keeps the required context reporting — and makes it depend on BOTH shards.
  # Without it, splitting the job would leave master's required check waiting on a context
  # that no longer exists, blocking every PR.
  prek:
    name: prek (lint + validate + tests + secrets)
    needs: hooks
    if: always()  # must report a conclusion even when a shard fails, or it never reports at all
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # `needs.hooks.result` is the aggregate over the whole matrix: 'success' only if every
      # shard succeeded, so this fails on a failed, cancelled, or skipped shard alike.
      - name: Assert every hook shard passed
        env:
          RESULT: ${{ needs.hooks.result }}
        run: |
          echo "hook shards: $RESULT"
          [ "$RESULT" = "success" ]

  renovate-config:
    name: renovate config validator
    runs-on: ubuntu-latest
    timeout-minutes: 20  # cap a wedged `npx renovate-config-validator` network fetch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0  # the merge-base diff below needs history

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"

      # `npx --yes --package renovate` re-downloads Renovate on every run — 33-39s, and with
      # ansible-lint sharded off this job became the longest in the workflow. Skip it on PRs
      # that do not touch the file it validates. renovate.json moved in 26 of the last 1600
      # commits (~1.6%), so this is a fast green for essentially every PR.
      #
      # Caching was measured and rejected. npm's cache splits in two: keeping `_cacache` alone
      # (309 MB) still re-resolves from the registry and cuts the step to 7.2s, but the key
      # cannot be content-derived from an unpinned package, so a rolling key would write a new
      # 309 MB entry every run and churn the repo's 10 GB cache budget — likely evicting the
      # prek and galaxy caches this workflow depends on. Also keeping `_npx` (341 MB) gets to
      # 0.9s but SILENTLY PINS: that tree's manifest records `renovate: ^44.30.1`, npm sees the
      # install satisfies it and reuses it without ever contacting the registry (it runs
      # happily with --offline). That would quietly defeat the whole point of this job, below.
      - name: Check whether this PR touches renovate.json
        id: scope
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}  # via env, never interpolated into the shell
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_REF"
          # Three dots: against the merge base, so it is this PR's own change to the file.
          if git diff --quiet "origin/$BASE_REF...HEAD" -- renovate.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "renovate.json untouched by this PR — it is validated on the merge to master."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Semantic validation of renovate.json — the one dependency-management axis with no
      # fail-at-commit backstop. prek's `check-json` only proves the file is well-formed JSON;
      # a typo'd packageRule field (e.g. matchPackageName vs matchPackageNames) is silently
      # IGNORED by Renovate (logged as a config warning, kept running), which would quietly
      # re-enable auto-merge of the stateful/DB-breaking bumps the automerge:false overrides
      # (getmeili/meilisearch, the crowdsec bouncer plugin, galaxy collections) exist to block.
      # `--strict` makes those warnings fail the build. Validates against the latest Renovate —
      # the same hosted Mend app version that actually consumes the config, which is why it is
      # deliberately unpinned and why neither caching variant above was taken.
      #
      # Runs unconditionally on push to master, so the config still meets a freshly-resolved
      # Renovate on every merge. That is what preserves the canary this job provides beyond
      # validating edits: a config that Renovate itself stops accepting is caught within one
      # merge, rather than only whenever renovate.json is next touched.
      - name: Validate renovate.json
        if: github.event_name != 'pull_request' || steps.scope.outputs.changed == 'true'
        run: npx --yes --package renovate renovate-config-validator --strict renovate.json
