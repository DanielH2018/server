name: CI

on:
  pull_request:
  push:
    branches: [master]

# Cancel a superseded run when new commits land on the same ref (PR force-push / stacked
# pushes) so redundant lint/test runs don't pile up.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel a superseded run on a PR branch only. On master every SHA needs its own verdict:
  # the deployer's CI gate and `await_ci.py` read check-runs per commit, and a run cancelled by
  # the next merge leaves that commit with no verdict forever. 4 of the 10 master runs before
  # 2026-09-01 ended that way, each one restarting a ~5-minute full sweep that every landing
  # behind it then waited on. Runner minutes are free on a public repo.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ONE job, deliberately — the name is the branch-protection required context, so it must stay
  # exactly "prek (lint + validate + tests + secrets)".
  #
  # This was briefly two matrix shards (ansible-lint | everything else) plus an aggregator job to
  # re-report that context. That split existed because ansible-lint was a ~90s pole worth
  # overlapping with the other ~37s of hooks. It stopped paying once BOTH halves became
  # changed-files-scoped on a PR (see the run steps below): measured 2026-08-14 on the runner with
  # warm caches, a PR's lint work is ~7s and the other 20 hooks ~2-4s, against ~11-13s of fixed
  # per-job setup (checkout + uv + caches + prek install) that a second shard pays in full. The
  # aggregator cost another ~7s of runner acquisition on every run for 4s of work.
  #
  #   PR run, before: 46s wall (shards 26s + 36s, aggregator +7s)
  #   PR run, after:  33s wall — one job, 30s (11s setup + 16s hooks), no aggregator
  #
  # Measured on THIS PR, which edits workflow files and so still trips pytest (they are in its
  # `files` regex); ~16s of hooks is mostly that. A PR that trips neither pytest nor ansible-lint
  # is setup-bound at roughly 20s — extrapolated from the step breakdown, not measured.
  #
  # The trade is push-to-master, where both halves run --all-files and now serialise rather than
  # overlap: 52s -> 77s steady state, above the ~73s projected from the two shards' step times.
  # Deliberate and cheap: gitops-deploy is a pull-based 30-min timer and Renovate's automerge gates
  # on the PR run, so nothing waits on master's CI.
  #
  # NB the FIRST run on any given branch is slower, once — the merge of #166 took 108s, not 77s.
  # The hook-env cache key lost its per-shard component, so a branch restores via restore-keys from
  # an old single-shard entry and rebuilds the other half in-step (measured: a 44s hook step),
  # saving the union key at the end. Caches are scoped per branch, so master paid this on its own
  # first run and each open PR branch pays it once too. Don't read either as the steady state.
  #
  # If ansible-lint ever goes back to running unscoped on PRs, re-read that math before re-sharding.
  prek:
    name: prek (lint + validate + tests + secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 20  # cap a wedged network hook (ansible-galaxy install) so it can't burn to the 6h default
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0  # the merge-base diff below needs history

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1  # no floating major tag is published; pin the exact release
        with:
          # Nine prek hooks shell out to `uv run`, which resolves the whole `dev` group
          # (ansible-core, pytest, docker, flask, ruff, shellcheck-py) before the first one
          # executes. Without this the download is repaid on every run. Keyed on uv.lock by
          # the action itself, so a lock change invalidates it exactly.
          enable-cache: true

      # prek bootstraps one isolated environment per remote hook repo whenever its cache is
      # cold — uncached, that is every CI run. Worth ~14s here (the step measured 141s before
      # these caches and 127s after). It is much cheaper on the runner than it is on a
      # workstation: the `gitleaks` hook is `language = "golang"`, and where daniel-box has no
      # Go and makes prek fetch a ~270 MB managed toolchain to build gitleaks from source
      # (220s cold, for a scan that takes 0.05s), ubuntu-latest ships Go preinstalled and prek
      # uses it. Hence a 45 MB cache rather than a 350 MB one.
      #
      # Only the environment dirs are cached. `~/.cache/prek/cache` is prek's own pip/uv
      # DOWNLOAD cache — pure redundancy once the envs it built are themselves restored, and
      # (~500 MB on a machine that does fetch a toolchain) large enough that carrying it would
      # eat the saving in transfer time.
      #
      # restore-keys is safe here because prek's env dirs are content-addressed
      # (hooks/<language>-<hash>): a stale entry from an older prek.toml is ignored rather
      # than reused, so a partial hit still lets the UNCHANGED hooks skip their rebuild when
      # one rev bumps. The fresh key then saves the union.
      - name: Cache prek hook environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/prek/repos
            ~/.cache/prek/hooks
            ~/.cache/prek/tools
          key: prek-${{ runner.os }}-${{ hashFiles('prek.toml') }}
          restore-keys: prek-${{ runner.os }}-

      # The ansible-lint hook's entry runs `ansible-galaxy collection install` before linting.
      # ansible/collections/ is gitignored, so that is a ~40 MB download of four collections on
      # every run; warm, the same command is a 0.4s no-op ("Nothing to do. All requested
      # collections are already installed"). Versions are exactly pinned in requirements.yml,
      # so hashing it is an exact key with no staleness window — hence no restore-keys.
      - name: Cache Ansible collections
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ansible/collections
          key: galaxy-${{ runner.os }}-${{ hashFiles('ansible/requirements.yml') }}

      - name: Install prek
        run: pip install prek==0.4.14  # pinned for a reproducible hook toolchain; Renovate (pypi) bumps it

      # The `vale` prek hook is `language = "system"`, so it runs whatever binary is on PATH
      # and there is none on a fresh runner. Version-pinned to match the workstation, because
      # a style package's rules change between releases and a gate that passes locally and
      # fails in CI is one people route around.
      #
      # `vale sync` fetches the Google package into styles/, which .gitignore excludes on
      # purpose — see the entry there. It has to run before the hooks, not inside them.
      #
      # `curl -f` is load-bearing. Without it a 404 (a Renovate bump that rewrote only part of
      # the pinned URL, an upstream asset rename) exits 0 and writes the error body to
      # /tmp/vale.tar.gz, so the step dies two lines down at `tar xzf` with "not in gzip
      # format" — naming the tarball instead of the URL that was never fetched.
      - name: Install Vale
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/vale.tar.gz \
            https://github.com/vale-cli/vale/releases/download/v3.18.0/vale_3.18.0_Linux_64-bit.tar.gz
          tar xzf /tmp/vale.tar.gz -C /usr/local/bin vale
          vale --version
          vale sync

      # On a PR, run every hook against only the files the PR actually touches — the same thing
      # prek does locally at commit time, and what each hook's `files` regex in prek.toml is
      # already written for. This is the largest single saving in the workflow: ansible-lint's
      # cost is per-file (one task file 1.45s, the whole tree 18.4s locally, 36-90s on the
      # runner), and of the other 20 hooks pytest alone is ~8-10s on-runner. Measured locally,
      # the non-ansible sweep is 7.1s over --all-files and 0.10s over a one-file list.
      #
      # The file list is computed HERE rather than handed to prek's --from-ref/--to-ref, because
      # that mode does not skip a hook whose matching-file set is empty: it runs the hook with NO
      # filenames, and `ansible-lint` with no arguments falls back to walking the whole tree.
      # Measured — a PR changing no ansible YAML still spent 93s linting all 954 files while
      # reporting a cheerful "Passed".
      #
      # NB that pathology is NOT specific to --from-ref, which is why the ansible file list below
      # is kept separate and explicitly guarded. Re-measured 2026-08-14 with an explicit
      # `--files docs/secret-rotation.md`: every other hook, local and remote, pass_filenames or
      # not, correctly reports "(no files to check)Skipped" — but ansible-lint runs bare and walks
      # the tree anyway (35s local, with and without require_serial; cause not identified). So the
      # rule is: never hand ansible-lint a list that its own files/exclude pair can empty.
      #
      # `A...B` (three dots) diffs against the merge base, so this is the PR's own changes and not
      # whatever else landed on master meanwhile.
      - name: Collect this PR's changed files
        id: changed
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}  # via env, never interpolated into the shell
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_REF"
          # --no-renames so a rename is reported as its D + A halves rather than one R entry:
          # the D is what trips the full-sweep fallback below, which is the behaviour we want.
          base="origin/$BASE_REF...HEAD"
          mapfile -t deleted < <(git diff --name-only --no-renames --diff-filter=D "$base")
          # --diff-filter=d (lowercase) drops deletions: a removed file is still "changed", but
          # passing a path that no longer exists is a hook error, not a lint finding.
          git diff --name-only --no-renames --diff-filter=d "$base" > "$RUNNER_TEMP/changed.txt"
          # Filtered with grep rather than a git pathspec glob (`ansible/**/*.yml` behaves
          # differently under git's wildmatch than it reads). secrets.yml is dropped here as well
          # as by the hook's own exclude: were it the ONLY changed ansible file, the hook would
          # filter the list to empty and fall straight back into the walk described above.
          grep -E '^ansible/.*\.ya?ml$' "$RUNNER_TEMP/changed.txt" \
            | grep -v '^ansible/vars/secrets\.yml$' > "$RUNNER_TEMP/ansible.txt" || true
          # Fall back to the full sweep rather than a fast green when the scoped list cannot be
          # trusted to represent the change: a PR that only deletes files yields an EMPTY changed
          # list, and "skip everything" is the wrong answer there — dropping a template changes
          # what the render validators produce. Deletions are rare on the PRs this optimises for
          # (Renovate bumps, single-role edits), so the fast path stays the common one.
          if [ "${#deleted[@]}" -gt 0 ]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
            echo "PR deletes ${#deleted[@]} file(s) — running the full sweep."
          elif [ ! -s "$RUNNER_TEMP/changed.txt" ]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
            echo "No changed files resolved — running the full sweep."
          else
            echo "mode=scoped" >> "$GITHUB_OUTPUT"
            echo "Scoping hooks to $(wc -l < "$RUNNER_TEMP/changed.txt") changed file(s):"
            sed 's/^/  /' "$RUNNER_TEMP/changed.txt"
          fi

      - name: Run hooks (PR — scoped to changed files)
        if: steps.changed.outputs.mode == 'scoped'
        run: |
          set -uo pipefail  # NOT -e: both invocations must run, see below
          mapfile -t changed < "$RUNNER_TEMP/changed.txt"
          mapfile -t ansible < "$RUNNER_TEMP/ansible.txt"
          # Two invocations, and both always run: a lint failure must not hide a test failure
          # (this is what `fail-fast: false` bought when these were separate matrix shards).
          # Exit codes are collected and OR'd at the end.
          rc=0
          if [ "${#ansible[@]}" -gt 0 ]; then
            echo "::group::ansible-lint (${#ansible[@]} file(s))"
            # Hook id BEFORE --files: --files is variadic and would otherwise swallow it.
            prek run ansible-lint --color always --files "${ansible[@]}" || rc=1
            echo "::endgroup::"
          else
            echo "No ansible YAML changed in this PR — nothing for ansible-lint to do."
          fi
          echo "::group::all other hooks"
          prek run --skip ansible-lint --color always --files "${changed[@]}" || rc=1
          echo "::endgroup::"
          exit "$rc"

      # Every push to master, and any PR the scoping step declined to trust: the full sweep.
      #
      # This is what keeps the scoped path's residual gap bounded. ansible-lint does no cross-file
      # variable analysis, and each other hook's `files` regex is hand-maintained — so a change to
      # file X will not re-lint an unchanged file Y that consumes it, and a test added at a path
      # pytest's regex does not match is skipped on the PR. Both surface on the merge to master
      # rather than never: a deliberate trade of post-merge detection for PR latency.
      - name: Run hooks (full sweep)
        if: github.event_name != 'pull_request' || steps.changed.outputs.mode == 'full'
        run: prek run --all-files --color always

      # `mkdocs build --strict` ran nowhere except the twice-daily docs-refresh cron, so a
      # broken internal link reached master and the cron discovered it — build_site() bails
      # out and leaves the PREVIOUS site serving, which means the docs silently stop updating
      # and nothing says why until someone reads the journal (2026-08-25 review M-3).
      #
      # Deliberately a CI step and NOT a prek hook. A hook scoped `^(docs/|mkdocs\.yml)`
      # would match the paths docs-refresh.sh itself stages and commits with hooks running,
      # which is the widening prek.toml:347 forbids in writing — it would wedge the cron.
      - name: Build the docs site (mkdocs --strict)
        run: uv run mkdocs build --strict --site-dir "$RUNNER_TEMP/docs-site"

  renovate-config:
    name: renovate config validator
    runs-on: ubuntu-latest
    timeout-minutes: 20  # cap a wedged `npx renovate-config-validator` network fetch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0  # the merge-base diff below needs history

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      # `npx --yes --package renovate` re-downloads Renovate on every run — 33-39s, and with
      # ansible-lint scoped to changed files this job is the longest in the workflow on a PR that
      # touches renovate.json. Skip it on PRs that do not touch the file it validates.
      # renovate.json moved in 26 of the last 1600 commits (~1.6%), so this is a fast green for
      # essentially every PR.
      #
      # Caching was measured and rejected. npm's cache splits in two: keeping `_cacache` alone
      # (309 MB) still re-resolves from the registry and cuts the step to 7.2s, but the key
      # cannot be content-derived from an unpinned package, so a rolling key would write a new
      # 309 MB entry every run and churn the repo's 10 GB cache budget — likely evicting the
      # prek and galaxy caches this workflow depends on. Also keeping `_npx` (341 MB) gets to
      # 0.9s but SILENTLY PINS: that tree's manifest records `renovate: ^44.30.1`, npm sees the
      # install satisfies it and reuses it without ever contacting the registry (it runs
      # happily with --offline). That would quietly defeat the whole point of this job, below.
      - name: Check whether this PR touches renovate.json
        id: scope
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}  # via env, never interpolated into the shell
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_REF"
          # Three dots: against the merge base, so it is this PR's own change to the file.
          if git diff --quiet "origin/$BASE_REF...HEAD" -- renovate.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "renovate.json untouched by this PR — it is validated on the merge to master."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Semantic validation of renovate.json — the one dependency-management axis with no
      # fail-at-commit backstop. prek's `check-json` only proves the file is well-formed JSON;
      # a typo'd packageRule field (e.g. matchPackageName vs matchPackageNames) is silently
      # IGNORED by Renovate (logged as a config warning, kept running), which would quietly
      # re-enable auto-merge of the stateful/DB-breaking bumps the automerge:false overrides
      # (getmeili/meilisearch, the crowdsec bouncer plugin, galaxy collections) exist to block.
      # `--strict` makes those warnings fail the build. Validates against the latest Renovate —
      # the same hosted Mend app version that actually consumes the config, which is why it is
      # deliberately unpinned and why neither caching variant above was taken.
      #
      # Runs unconditionally on push to master, so the config still meets a freshly-resolved
      # Renovate on every merge. That is what preserves the canary this job provides beyond
      # validating edits: a config that Renovate itself stops accepting is caught within one
      # merge, rather than only whenever renovate.json is next touched.
      - name: Validate renovate.json
        if: github.event_name != 'pull_request' || steps.scope.outputs.changed == 'true'
        run: npx --yes --package renovate renovate-config-validator --strict renovate.json
