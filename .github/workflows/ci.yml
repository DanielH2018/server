name: CI

on:
  pull_request:
  # Inert. Merge queues are not offered on user-owned repositories, so the push run below
  # stays the only full sweep a merge commit gets. The
  # trigger is harmless and would do the right thing if the repo ever moved to an org: every
  # job treats a merge_group event like a push, no PR scoping.
  merge_group:
  # An on-demand full sweep, for a PR whose own diff scopes out every hook that matters. The
  # runner-image bump is the case it exists for: #2259 moves every `runs-on` to `ubuntu-26.04`,
  # and a workflow-only diff matches no hook's `files` regex, so that PR's green run says nothing
  # about `validate-unit-templates` against the image's systemd-analyze and Node, nor about
  # gitleaks built with its Go (#2366). Without this trigger the first full sweep on a new image
  # is the merge commit's push run, and a red one there parks every landing behind it.
  #
  # Dispatch the BRANCH, never master. `ci_verdict` in the deployer's `deploy_git.py` reduces
  # every check-run sharing a required name for one commit, worst outcome wins. A red dispatch
  # run therefore pins "prek (lint + validate + tests + secrets)" red on a master SHA that the
  # deployer's gate and `await_ci.py` both read, and that SHA's own green push run does not
  # outvote it. The concurrency arm below keeps a dispatch out of a push's group; it does nothing
  # about this. Since #2402 the rule is enforced rather than asked for:
  # `.claude/hooks/block-footguns.py:ci_dispatch_on_master_problem` denies a `gh workflow run`
  # naming this workflow with no `--ref` or with `--ref master`. It cannot see the Actions UI
  # button or a raw `gh api .../dispatches`, so this paragraph is still the rule for those.
  #
  # The REF you dispatch must carry this trigger, because GitHub runs the workflow file from that
  # ref. A branch cut before this landed therefore rebases onto master before it can be swept,
  # which for a Renovate PR is its own rebase-check box. Measured 2026-09-24 against a branch
  # without the trigger: `gh workflow run ci.yml --ref <branch>` returned HTTP 422 `Workflow does
  # not have 'workflow_dispatch' trigger`. The DEFAULT branch does not need it for the API to
  # accept a dispatch — measured the same day, with master still carrying no trigger, dispatching
  # a probe branch that carried one started run 35999885346 and every job took the full-sweep
  # path. GitHub documents the Run-workflow BUTTON as requiring the default branch; that half is
  # untested here, so reach for `gh workflow run` rather than the UI.
  #
  # Every job treats a dispatch like a push, with nothing to configure. Both scoping steps are
  # `if: github.event_name == 'pull_request'`, so `steps.changed.outputs.mode` stays unset and
  # each full-sweep step fires; `pytest` carries no condition; `renovate-config` runs on
  # `!= 'push'`. ENFORCED by ansible/tests/repo/test_ci_dispatch_sweeps_everything.py, because a
  # scoping condition rewritten to key on `push` would leave a dispatch fast, green and checking
  # nothing.
  workflow_dispatch:
  push:
    branches: [master]

concurrency:
  # A PR branch groups by ref, so a force-push supersedes its own earlier run. A push to
  # master groups by SHA, which puts every master commit in a group of its own.
  #
  # Master needs that because every SHA needs its own verdict: the deployer's CI gate and
  # `await_ci.py` read check-runs per commit, and a commit with no verdict reads `cancelled`
  # forever — every landing behind it then waits on a later SHA's full sweep instead.
  #
  # `cancel-in-progress: false` does not buy that. It governs the
  # RUNNING run; it does not protect a QUEUED one. GitHub keeps at most one pending run per
  # concurrency group, so when master moves faster than a ~3-minute sweep, each new push evicts
  # the pending run ahead of it. Measured with eight sessions landing: nine master
  # runs cancelled within three and a half minutes, each 4-52s after creation, every one with
  # `total_count: 0` jobs — evicted while queued, never started.
  #
  # Grouping by SHA means a master run is never queued behind another and so can never be
  # evicted. The cost is concurrent master sweeps rather than serialised ones, which is why
  # this is safe here specifically: runner minutes are free on a public repo, and the queue
  # measurement that prompted this found job start lag at 1-4s with nothing waiting on a slot.
  #
  # A `workflow_dispatch` run keys on `github.run_id`, which is unique per run, so it lands in a
  # group nothing else can enter. Without that arm it falls through to `github.sha` and joins the
  # push group of the SHA it was dispatched on — one pending run per group, so dispatching a
  # master SHA could evict that SHA's queued push run and leave it with no verdict. That is the
  # eviction failure above reached by a second route.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.event_name == 'workflow_dispatch' && github.run_id || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The hook sweep is split three ways — `ansible-lint`, `pytest`, and this job for everything
  # else. None of the three carries the branch-protection required context; the `prek` gate job
  # at the bottom does, under the name "prek (lint + validate + tests + secrets)".
  #
  # DECIDED: ansible-lint gets its own job, again. This repo split it out, reverted the split on
  # 2026-08-14, and restored it on 2026-09-10 (#1332). The revert is not a precedent to re-apply,
  # because the two facts it rested on have both gone:
  #
  #   - The 2026-08 split needed an AGGREGATOR job purely to re-report the required context, at
  #     ~7s of runner acquisition per run. That aggregator is now the `prek` gate, which exists
  #     unconditionally to cover the `pytest` split of 2026-09-01. A third half costs it nothing:
  #     the gate waits on the MAX of its dependencies, not their sum, and its own step is 4s.
  #   - The revert's case was PR wall time, where both halves are changed-files-scoped and a
  #     second job's ~15-20s of fixed setup dwarfs ~7s of scoped lint. The PR wall is now set by
  #     `pytest`, which runs UNSCOPED by design (the `pytest` job says why) at ~61s across the shards
  #     (four when this was measured; six since #2239).
  #     Both scoped hook halves finish well inside that, so on a PR this split is free rather
  #     than cheap.
  #
  # The measurement that motivated it, master run 34029520131 (the merge of #1328): `hooks` 109s
  # against pytest's slowest shard at 61s and a 120s run wall — every pytest leg done inside the
  # first 61s, then 48s waiting on `hooks` alone. Its 109s is 20s setup + an 82s full sweep + 4s
  # of mkdocs. Locally on daniel-server the sweep divides 106s of ansible-lint against 26s for
  # all twenty other hooks, so the runner's 82s is roughly 66s / 16s — which puts the split's
  # steady state at a ~40s `hooks` job beside an ~80s `ansible-lint` job, and the run wall at
  # roughly 95s. Projected from those step times, not yet measured on master.
  #
  # `mkdocs build --strict` was the other candidate and is NOT worth a job: 4s on that same run.
  #
  # Two things that make the split behave, both learned the hard way and both enforced below:
  # ansible-lint must never be handed an empty --files list (it walks all 954 files and reports
  # a cheerful "Passed"), and $RUNNER_TEMP is per-job, so the new job computes its own changed-
  # file list rather than reading one this job wrote.
  #
  # A third was checked and settled the Galaxy cache step out of this job. Nothing here ever
  # installed the collections explicitly — the ansible-lint hook's own entry did it as a side
  # effect, and that hook is skipped on both paths now. That is the shape the `pytest` job's own
  # comment describes, and it would have failed only on a cache MISS, pointing nowhere near this
  # change. Measured 2026-09-10 with `ansible/collections` moved aside: every hook left in this
  # job still passes, so the remaining sweep reads no collection and the cache step is gone
  # rather than kept for reassurance. `ansible_lint` and `pytest` both still carry it.
  #
  # NB the FIRST run on any given branch is slower, once — the merge of #166 took 108s, not 77s.
  # A branch restores its hook-env cache via restore-keys from an older entry and rebuilds the
  # rest in-step (measured: a 44s hook step), saving the union key at the end. Caches are scoped
  # per branch, so master paid this on its own first run and each open PR branch pays it once
  # too. Don't read either as the steady state.
  hooks:
    name: hooks (lint + validate + secrets + docs)
    # A versioned runner label, not the `-latest` alias: the `language: system` hooks run whatever
    # shellcheck, Go and systemd-analyze the image preinstalls, and GitHub rolls the alias to a
    # new release with no commit here (#2152). The built-in github-actions manager tracks a
    # versioned label through the `github-runners` datasource, so the image moves in a PR that
    # runs these hooks on it first. The alias resolved to ubuntu-24.04 when this was
    # pinned (2026-09-21), so the pin changed nothing on the day. The same reasoning covers
    # the `python-version:` and `node-version:` pins in .github/actions/setup/action.yml.
    # Every `runs-on` in .github/workflows is a versioned label, ENFORCED by
    # the `workflow-runners-are-pinned` row of ansible/tests/repo/test_census_rows_text.py.
    runs-on: ubuntu-26.04
    timeout-minutes: 20  # cap a wedged network hook so it can't burn to the 6h default
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0  # the merge-base diff below needs history
          persist-credentials: false  # nothing here pushes; the merge-base fetch carries its own token

      # Python, uv and prek, with their caches. The pins and the reasoning behind each cache
      # live in the action. No Galaxy cache: see the DECIDED block above.
      - uses: ./.github/actions/setup  # zizmor: ignore[self-repository] -- see the action's header
        with:
          prek-cache-key: prek

      # validate-unit-templates is `language = "system"`, so it runs whatever `systemd-analyze`
      # is on PATH — unverified on the runner image before this ran once. This step exists so a
      # runner image change that drops the binary fails loud here rather than as an opaque
      # "command not found" inside the hook.
      - name: Check systemd-analyze is available
        run: systemd-analyze --version

      # The `vale` prek hook is `language = "system"`, so it runs whatever binary is on PATH
      # and there is none on a fresh runner. Version-pinned to match the workstation, because
      # a style package's rules change between releases and a gate that passes locally and
      # fails in CI is one people route around.
      #
      # `scripts/validate/vale.sh` with no filenames fetches the Google package into styles/,
      # which .gitignore excludes on purpose — see the entry there. Provisioning runs before
      # the hooks rather than inside them. It is the hook's own entry, so CI and a developer's
      # worktree provision through one path and both write the stamp the guard reads.
      #
      # `curl -f` is load-bearing. Without it a 404 (a Renovate bump that rewrote only part of
      # the pinned URL, an upstream asset rename) exits 0 and writes the error body to
      # /tmp/vale.tar.gz, so the step dies two lines down at `tar xzf` with "not in gzip
      # format" — naming the tarball instead of the URL that was never fetched.
      - name: Install Vale
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/vale.tar.gz \
            https://github.com/vale-cli/vale/releases/download/v3.24.0/vale_3.24.0_Linux_64-bit.tar.gz
          tar xzf /tmp/vale.tar.gz -C /usr/local/bin vale
          vale --version
          scripts/validate/vale.sh

      # promtool and amtool, at the tags of the observability role's Prometheus and Alertmanager
      # image pins, lokitool at the tag of loki-homelab's Loki image pin, and pint at the
      # version alert_tools.sh pins, for the `validate-alert-rules` hook. The script fetches
      # each release archive, checks it against its release's sums file, and unpacks the
      # binary into alert-tools/ under the git common dir, .git/alert-tools/ in this checkout.
      # It is the tool path the hook itself calls, so CI and a worktree provision the same way.
      - name: Provision promtool, amtool, pint and lokitool
        run: scripts/validate/alert_tools.sh

      # The tools' red proof. Each one must accept its good fixture and reject its bad one
      # with the expected message under scripts/validate/tests/fixtures/alert_rules/. The
      # pytest shards install none of the binaries, so without this step nothing shows the hook's
      # tool phase can fail.
      - name: Prove each alert tool rejects its bad fixture
        run: uv run python scripts/validate/alert_rules.py --prove-red

      # On a PR, run every hook against only the files the PR actually touches — the same thing
      # prek does locally at commit time, and what each hook's `files` regex in prek.toml is
      # already written for. Measured locally, this sweep is 7.1s over --all-files and 0.10s
      # over a one-file list.
      #
      # The file list is computed HERE rather than handed to prek's --from-ref/--to-ref, because
      # that mode does not skip a hook whose matching-file set is empty: it runs the hook with NO
      # filenames, and a hook that walks the tree when given none then does so. `ansible-lint` is
      # that hook, and it runs in its own job now — see the warning on the identical step there.
      #
      # scripts/dev/pr_changed_files.sh owns the fetch, the merge-base diff and the rule that a
      # deletion or a FULL_SWEEP_PATHS change forces the full sweep; the `ansible_lint` job
      # calls the same script. What stays here is this job's own list and its empty-merge check.
      - name: Collect this PR's changed files
        id: changed
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}  # via env, never interpolated into the shell
          FETCH_TOKEN: ${{ github.token }}  # contents: read; the checkout drops its own, see the fetch in the script
          # A change to one of these is a change to what a hook CHECKS, not to a file it checks,
          # and the scoped run cannot see that: the hook's `files` regex matches the code, so a
          # PR editing only the config ran that hook against nothing and master's full sweep
          # failed after the merge. Vale's terms did this on 2026-08-27 (`.vale.ini`), ruff's
          # rules on 2026-09-02 (pyproject.toml). Every hook that takes NO filenames now names
          # its config in `files` instead (ruff, ruff-format, ty, mkdocs-strict); the ones here
          # are the hooks that DO take filenames, which cannot — prek would hand them the
          # config file to lint. prek.toml is here because a rev bump changes every hook's
          # behaviour and matches no hook's `files` but check-toml's. The `ansible_lint` job
          # keeps its own list. ENFORCED by test_hook_config_changes_run_the_hook.py, which
          # reads this list, so an entry cannot be dropped without a test naming it.
          #
          # A hook's config is not always one file, and Vale's is three. Its vocabulary decides
          # which words Vale.Spelling accepts across the whole corpus, so a term added or
          # removed changes the verdict on docs the PR never touched. This workflow carries the
          # binary pin (the curl above), and CI's own Vale version is what turned master red on
          # 15 untouched lines in 10 docs when Renovate bumped 3.21.0 -> 3.22.0 (#2536, #2543);
          # the PR's run checks out the merge ref, so the sweep runs the NEW binary. Listing
          # ci.yml means every workflow edit runs the full sweep, which is the cost of catching
          # that bump on its own PR. The host's Vale pin in
          # ansible/roles/setup/initial_setup/tasks/host-basics.yml is deliberately NOT here:
          # it is not the binary CI runs, and test_vale_matches_the_ci_pin.py already forces a
          # bump to move both in one commit.
          #
          # The setup action carries the prek pin, which changes how every hook runs, as a
          # prek.toml rev bump does. The changed-files script decides what this job checks. Both
          # lived in this file until #3713 and #3714 moved them out, and they stay listed so an
          # edit to either still sweeps the whole tree on its own PR.
          FULL_SWEEP_PATHS: |
            prek.toml
            .vale.ini
            styles/config/vocabularies/Homelab/accept.txt
            .github/workflows/ci.yml
            .github/actions/setup/action.yml
            scripts/dev/pr_changed_files.sh
            .shellcheckrc
            .gitleaks.toml
        run: |
          set -euo pipefail
          "$GITHUB_WORKSPACE/scripts/dev/pr_changed_files.sh"
          # Deletions are rare on the PRs this optimises for (Renovate bumps, single-role edits),
          # so the fast path stays the common one.
          if [ -s "$RUNNER_TEMP/full_sweep.txt" ]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
            printf '%s — running the full sweep.\n' "$(< "$RUNNER_TEMP/full_sweep.txt")"
          elif [ ! -s "$RUNNER_TEMP/changed.txt" ]; then
            # No deletions and no changed files means merging this PR would land NOTHING: the
            # checkout is the merge ref, so a three-dot diff against the base is exactly what a
            # merge adds. That is never a correct PR, whoever opened it. Renovate can reuse
            # the previous bump's branch under the next version's title when master already
            # holds the content, and the squash commit then carries an empty file list.
            # Failing here fails the `prek` gate, so an automerge cannot fire on the run.
            #
            # `ansible_lint`'s scoping step has an empty branch that stays GREEN on purpose: its
            # list is filtered to ansible YAML, so empty there means "no ansible files changed",
            # which any docs-only PR produces.
            echo "::error::This PR's merge would change no files against $BASE_REF. Its content already landed, or its branch is stale — close it rather than merge it (#1755)."
            exit 1
          else
            echo "mode=scoped" >> "$GITHUB_OUTPUT"
            echo "Scoping hooks to $(wc -l < "$RUNNER_TEMP/changed.txt") changed file(s):"
            sed 's/^/  /' "$RUNNER_TEMP/changed.txt"
          fi

      # The facts notice lists every CLAUDE.md section that cites an atom this PR moved, as
      # annotations and as a job-summary table. It runs beside docs/facts.lock for G1's 30-day
      # soak, and the lock stays the only blocking check, so the notice never fails the job. The
      # long form is docs/target-architecture/docs-guard/g1-diff-notice.md, *Design*.
      #
      # No step of the three can fail the job. `continue-on-error` turns a failed step green,
      # but it does not cover the job's 20-minute timeout, and a job timeout fails the `prek`
      # gate. Each step therefore carries its own `timeout-minutes`, which ends a hang as a step
      # failure first.
      #
      # The step runs the MERGE BASE's code, never the PR's. A PR that breaks a module that
      # fact_status.py imports would otherwise crash the step, and that crash says nothing about
      # the notice. The base copy is a second worktree. Its lib.repo_paths.REPO is the copy
      # itself and its HEAD is the merge base, so `--head "$GITHUB_SHA"` is what points it at
      # the PR's merge commit. `uv sync --frozen` there installs the base's own lockfile, so the
      # PR's uv.lock cannot change what the notice imports either.
      #
      # $RUNNER_TEMP/notice.err receives every command's stderr and one `stage:` line per stage.
      # The plan's check 2 reads the last `stage:` line from the failure artifact. `setup` means
      # the merge base, `git worktree add` or `uv sync` failed, so no notice code ran. `notice`
      # means the notice itself failed, which is a notice defect unless the `base` line names
      # code older than the soak's lower bound. A timeout kills the script, but the lines it
      # already wrote stay in the file.
      - name: "Notice: CLAUDE.md sections citing atoms this PR moved"
        id: notice
        if: github.event_name == 'pull_request'
        continue-on-error: true
        timeout-minutes: 5
        env:
          BASE_REF: ${{ github.base_ref }}  # via env, never interpolated into the shell
        run: |
          set -euo pipefail
          err="$RUNNER_TEMP/notice.err"
          code="$RUNNER_TEMP/notice-code"
          exec 2> >(tee -a "$err" >&2)
          # The later steps expect one worktree. A step timeout still runs this trap, but a
          # kill that ends the script before the trap runs leaves the copy registered, so the
          # failure step below removes it too.
          trap 'git worktree remove --force "$code" || true' EXIT

          echo "stage: setup" >> "$err"
          SECONDS=0
          base=$(git merge-base "origin/$BASE_REF" "$GITHUB_SHA")
          echo "base $base" >> "$err"
          git worktree add --detach "$code" "$base"
          uv --directory "$code" sync --frozen
          echo "setup stage took ${SECONDS}s"

          echo "stage: notice" >> "$err"
          SECONDS=0
          notice=(uv --directory "$code" run --frozen python scripts/dev/fact_status.py
                  notice --since "origin/$BASE_REF" --head "$GITHUB_SHA")
          "${notice[@]}" --format github
          "${notice[@]}" --format markdown >> "$GITHUB_STEP_SUMMARY"
          echo "notice stage took ${SECONDS}s"

      # The two steps below run only when the notice step did not succeed. The test reads
      # `!= 'success'` so that it holds for a timeout whether GitHub records the outcome as
      # `failure` or as `cancelled`. The warning is a step of its own because a timeout kills
      # the notice script before it could print one.
      - name: Notice step failed
        if: github.event_name == 'pull_request' && steps.notice.outcome != 'success'
        continue-on-error: true
        timeout-minutes: 5
        env:
          OUTCOME: ${{ steps.notice.outcome }}
        run: |
          echo "::warning title=notice-step-failed::The facts notice step ended with outcome $OUTCOME. Its notice.err is in this run's notice-step-failed artifact."
          echo "The facts notice step ended with outcome \`$OUTCOME\`. Its \`notice.err\` is in the \`notice-step-failed\` artifact." >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/notice.err" || true
          git worktree remove --force "$RUNNER_TEMP/notice-code" || true

      # The failure leaves an artifact because nothing else can find it later. With
      # `continue-on-error`, the jobs API reports the failed step's conclusion as `success`, and
      # listing runs to read their steps is capped and costly. One name-filtered call to the
      # artifacts endpoint lists every `notice-step-failed` artifact in the repository.
      - name: Upload notice failure
        if: github.event_name == 'pull_request' && steps.notice.outcome != 'success'
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: notice-step-failed
          path: ${{ runner.temp }}/notice.err
          if-no-files-found: warn

      - name: Run hooks (PR — scoped to changed files)
        if: steps.changed.outputs.mode == 'scoped'
        run: |
          set -euo pipefail
          mapfile -t changed < "$RUNNER_TEMP/changed.txt"
          # --skip ansible-lint: it runs in its own job beside this one, as pytest does.
          # --skip static-ratchet-tests: the `pytest` job runs those twelve test files already.
          prek run --skip ansible-lint --skip static-ratchet-tests --color always --files "${changed[@]}"

      # Every push to master, and any PR the scoping step declined to trust: the full sweep.
      #
      # This is what keeps the scoped path's residual gap bounded. ansible-lint does no cross-file
      # variable analysis, and each other hook's `files` regex is hand-maintained — so a change to
      # file X will not re-lint an unchanged file Y that consumes it, and a test added at a path
      # pytest's regex does not match is skipped on the PR. Both surface on the merge to master
      # rather than never: a deliberate trade of post-merge detection for PR latency.
      # scripts/tests/test_prek_files_cover_entry_imports.py narrows the second gap: a hook's
      # `files` must match every in-repo module its Python entry imports.
      - name: Run hooks (full sweep)
        if: github.event_name != 'pull_request' || steps.changed.outputs.mode == 'full'
        # --skip ansible-lint: it runs in its own job beside this one, as pytest does.
        # --skip static-ratchet-tests: the `pytest` job runs those twelve test files already.
        run: prek run --all-files --skip ansible-lint --skip static-ratchet-tests --color always

      # `mkdocs build --strict` also runs in the twice-daily docs-refresh cron, but a broken
      # internal link that reaches master is discovered only there — build_site() bails
      # out and leaves the PREVIOUS site serving, which means the docs silently stop updating
      # and nothing says why until someone reads the journal.
      #
      # This step predates the `mkdocs-strict` prek hook (#806), which runs the same build. The
      # hook fires only when a file in its `files` regex changes, and every full sweep matches
      # one, so a full sweep builds the site twice at about 4s each. On a scoped PR whose diff
      # misses that regex, this step is the only build. How the hook coexists with the
      # docs-refresh cron, which commits with hooks running, is in its comment in prek.toml.
      - name: Build the docs site (mkdocs --strict)
        run: uv run mkdocs build --strict --site-dir "$RUNNER_TEMP/docs-site"

  # ansible-lint alone. It is the biggest single piece of the hook sweep — 106s against 26s for
  # all twenty other hooks together, measured on daniel-server — so it gets the job
  # and `hooks` gets the remainder. The reasoning and the numbers are in the DECIDED block
  # above `hooks`.
  #
  # This job deliberately does NOT install Vale, check systemd-analyze, or build the docs site:
  # none of them is reachable from `prek run ansible-lint`. The Galaxy cache IS kept and shares
  # its key with the `pytest` job, because the hook's own entry runs `ansible-galaxy collection
  # install` before linting — warm that is a 0.4s no-op, cold a ~40 MB download.
  ansible_lint:
    name: ansible-lint
    runs-on: ubuntu-26.04
    timeout-minutes: 20  # cap a wedged ansible-galaxy install so it can't burn to the 6h default
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0  # the merge-base diff below needs history
          persist-credentials: false  # nothing here pushes; the merge-base fetch carries its own token

      # Its own prek cache prefix rather than the `hooks` job's. The two jobs build disjoint hook
      # environments, and one shared key would have them overwrite each other's entry every run.
      - uses: ./.github/actions/setup  # zizmor: ignore[self-repository] -- see the action's header
        with:
          prek-cache-key: prek-lint
          galaxy: "true"

      # $RUNNER_TEMP is per-job, so this recomputes the list rather than reading what the `hooks`
      # job wrote. The same script computes it, so the merge-base diff and the deletions-force-a-
      # full-sweep rule cannot drift between the two; the ansible filter is the part only here.
      - name: Collect this PR's changed ansible files
        id: changed
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}  # via env, never interpolated into the shell
          FETCH_TOKEN: ${{ github.token }}  # contents: read; the checkout drops its own, see the fetch in the script
          # What changes ansible-lint's verdict on files this PR did not touch: its own config,
          # the hook rev in prek.toml, and the collections it resolves modules against. None of
          # them can go in the hook's `files` — an explicitly passed path is linted whatever it
          # is (see the hook's comment in prek.toml) — and the ansible filter below would either
          # drop them (`mode=none`, so a `.ansible-lint` edit was linted by master alone) or
          # scope-lint requirements.yml as if it were a task file. The setup action is here for
          # its prek pin, which changes how this hook runs as a prek.toml rev bump does. Same
          # contract as the `hooks` job's list; ENFORCED by the same test.
          FULL_SWEEP_PATHS: |
            prek.toml
            .ansible-lint
            ansible/requirements.yml
            .github/actions/setup/action.yml
        run: |
          set -euo pipefail
          "$GITHUB_WORKSPACE/scripts/dev/pr_changed_files.sh"
          # Filtered with grep rather than a git pathspec glob (`ansible/**/*.yml` behaves
          # differently under git's wildmatch than it reads). secrets.yml is dropped here as well
          # as by the hook's own exclude: were it the ONLY changed ansible file, the hook would
          # filter the list to empty and fall straight into the tree walk warned about below.
          #
          # The greps read the FILE rather than continuing the pipe, so that `|| true` — which
          # is there for grep's empty-match exit 1 — cannot also swallow a `git diff` failure.
          # Swallowed, that would produce an empty list, read as `mode=none`, and lint nothing
          # while reporting green.
          grep -E '^ansible/.*\.ya?ml$' "$RUNNER_TEMP/changed.txt" \
            | grep -v '^ansible/vars/secrets\.yml$' > "$RUNNER_TEMP/ansible.txt" || true
          if [ -s "$RUNNER_TEMP/full_sweep.txt" ]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
            printf '%s — linting the whole tree.\n' "$(< "$RUNNER_TEMP/full_sweep.txt")"
          elif [ -s "$RUNNER_TEMP/ansible.txt" ]; then
            echo "mode=scoped" >> "$GITHUB_OUTPUT"
            echo "Linting $(wc -l < "$RUNNER_TEMP/ansible.txt") changed ansible file(s):"
            sed 's/^/  /' "$RUNNER_TEMP/ansible.txt"
          else
            echo "mode=none" >> "$GITHUB_OUTPUT"
            echo "No ansible YAML changed in this PR — nothing for ansible-lint to do."
          fi

      # NEVER let this run with an empty --files list. ansible-lint given no filenames does not
      # skip: it walks all 954 files (35s local, 36-90s on the runner) and reports a cheerful
      # "Passed", so an empty list reads as a fast green while costing the most time in the run.
      # Measured with an explicit `--files docs/secret-rotation.md`: every other
      # hook, local and remote, correctly reports "(no files to check)Skipped" — ansible-lint
      # runs bare anyway, with and without require_serial, cause not identified. Hence the
      # `mode=none` branch above, which skips the step outright rather than passing nothing.
      - name: Lint the changed ansible files
        if: steps.changed.outputs.mode == 'scoped'
        run: |
          set -euo pipefail
          mapfile -t ansible < "$RUNNER_TEMP/ansible.txt"
          # Hook id BEFORE --files: --files is variadic and would otherwise swallow it.
          prek run ansible-lint --color always --files "${ansible[@]}"

      # Every push to master, and any PR the scoping step declined to trust. ansible-lint does no
      # cross-file variable analysis, so a change to file X does not re-lint an unchanged file Y
      # that consumes it — that gap closes on the merge to master rather than never.
      - name: Lint the whole tree
        if: github.event_name != 'pull_request' || steps.changed.outputs.mode == 'full'
        run: prek run ansible-lint --all-files --color always

  # The whole pytest suite, unscoped on PRs and pushes alike — the same suite the prek `pytest`
  # hook runs, invoked the same way (`uv run python -m pytest`, addopts from pyproject.toml), so
  # a local `prek run --all-files` and this job cannot disagree about what a test run is.
  #
  # Sharded across a matrix, because this job is the pole of every run and a landing
  # waits on it twice — once on the PR, once on the master merge commit that `land.sh` and the
  # deployer's CI gate both read. Unsharded, the test step took 124s and the job 138s of which
  # 11s is setup, against 98s for the `hooks` job beside it.
  #
  # THE MATRIX KEEPS THE JOB ID `pytest`, which is what makes this a one-file change.
  # `needs.pytest.result` in the gate below is the AGGREGATE of every matrix leg, so the gate's
  # step, its `needs` list, and `test_every_ci_job_is_gated.py` all keep working untouched. Shards
  # as separate job ids (`pytest-1`, `pytest-2`, …) would instead make changing N a three-file
  # edit: the gate's `needs`, the gate's result comparison, and the guard's `KNOWN_JOBS` and
  # `GATE_READS` would each grow an entry per shard. Nothing outside this file names the bare
  # `pytest` check-run — `gitops_deploy_ci_contexts` and `gitops_deploy_expected_ruleset_contexts`
  # both name only "prek (lint + validate + tests + secrets)" — so renaming the legs costs nothing.
  #
  # `fail-fast: false` for the reason the `hooks` job states above: one shard's failure must not
  # hide another's.
  #
  # UNSCOPED by design: every PR runs the whole suite, never only the tests near its changed
  # files. Several tests discover their inputs by walking the tree (test_validate_shell_templates'
  # pinned roster, test_healthchecks_pings' rglob), so a PR adding a new *.sh.j2 that a
  # changed-files filter did not map to them would skip exactly the tests that should fail on it.
  # A path list is the wrong fix: one that grows an entry each time something escapes is not a
  # list needing one more entry. What this cannot reach is a test outside `testpaths`, which
  # test_testpaths_covers_every_test_file guards.
  #
  # This job is the suite's only automated run before a merge. The prek `pytest` hook that
  # re-ran it at `git push` was removed on 2026-10-02: it took 89s on daniel-box at load 0.9
  # (2026-10-02) and 235s on daniel-server at load 15, on every push, to repeat what this job
  # checks in ~61s, and `land.sh` already waits on this job through the `prek` gate.
  pytest:
    name: pytest (shard ${{ matrix.shard }} of ${{ strategy.job-total }})
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # Six shards. Changing this list is the whole edit: the
      # select step below reads `strategy.job-total` for `--of`, and the required context is
      # the `prek` gate, not any individual leg — nothing outside this file counts the legs.
      #
      # The trade is close to even and rests on a projection, so it is reversible on
      # evidence. `pytest_shard.py --of N --summary` projected 59.5s per shard at four and
      # 39.7s at six (local serial seconds, which are NOT the runner's
      # step time — the runner runs each shard under xdist). Against that, two more legs pay
      # ~20s of setup each in runner minutes. Keep six only if a master run's per-shard step
      # times say the run wall dropped by more than the extra setup costs; the `--durations`
      # report on every leg is what to read that off.
      #
      # Six is feasible at all only because the heaviest single module is 17.8s: a shard can
      # never finish faster than its largest member, so the floor rises as the matrix grows.
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    # The dotfiles commit the suite imports claude_guard and claude_worktree from. A pin,
    # not `main`: tracking the branch would turn this job red on an unrelated dotfiles commit.
    # The `git-refs` custom manager in renovate.json proposes each bump as its own PR.
    env:
      DOTFILES_SHA: 6865aa3b8045ae65cf75852d0accfa22d6cb9741
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0  # several tests read git history and worktree state
          persist-credentials: false
      # Several ansible/tests read the Galaxy collections, so they must be on disk. The action's
      # Galaxy cache key is the one the `ansible_lint` job uses, so the two share one entry.
      - uses: ./.github/actions/setup  # zizmor: ignore[self-repository] -- see the action's header
        with:
          galaxy: "true"
      - name: Install Ansible collections
        run: uv run ansible-galaxy collection install -r ansible/requirements.yml -p ansible/collections
      # `cluster_vars.py write`'s tests (target slice D3) run the real sops against a throwaway
      # age key, and they fail rather than skip without it. The version and digest are the
      # hosts' pin, `sops_setup_version` and `sops_setup_binary_amd64_sha256` in
      # ansible/roles/setup/sops_setup/defaults/main.yml, and
      # ansible/tests/repo/test_ci_sops_matches_the_host_pin.py holds the two equal: a sops
      # bump moves this copy too. age comes from apt, as the hosts install it.
      - name: Install sops and age for the cluster_vars tests
        env:
          SOPS_VERSION: v3.13.3
          SOPS_SHA256: e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          curl --retry 3 -fsSLo "$RUNNER_TEMP/bin/sops" \
            "https://github.com/getsops/sops/releases/download/$SOPS_VERSION/sops-$SOPS_VERSION.linux.amd64"
          echo "$SOPS_SHA256  $RUNNER_TEMP/bin/sops" | sha256sum -c --strict
          chmod +x "$RUNNER_TEMP/bin/sops"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          sudo apt-get install -y --no-install-recommends age \
            || { sudo apt-get update -q && sudo apt-get install -y --no-install-recommends age; }
          "$RUNNER_TEMP/bin/sops" --version --disable-version-check
          age-keygen --version
      # The Bash hooks split commands with the dotfiles repo's `claude_guard` package, and the
      # worktree pruner reads `claude_worktree` from it. A host gets both from `chezmoi apply`;
      # this step lays the same two directories out where a host has them, so the bootstraps
      # (`.claude/hooks/_claude_guard.py`, `scripts/dev/_claude_worktree.py`) import them
      # unchanged. Both packages are plain files under `home/dot_local/share/` in that repo,
      # so no chezmoi render is needed. The fetch lands in $RUNNER_TEMP rather than in the
      # workspace, where an untracked tree would show up in the git-status tests. The repo is
      # public, so the fetch needs no token.
      - name: Deploy the dotfiles packages the hooks and the pruner import
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/dotfiles"
          git init --quiet "$src"
          git -C "$src" fetch --quiet --depth 1 https://github.com/DanielH2018/dotfiles "$DOTFILES_SHA"
          git -C "$src" checkout --quiet FETCH_HEAD
          mkdir -p "$HOME/.local/share"
          ln -s "$src/home/dot_local/share/claude-guard" "$HOME/.local/share/claude-guard"
          ln -s "$src/home/dot_local/share/claude-worktree" "$HOME/.local/share/claude-worktree"
      # `--of "$SHARDS"` reads `strategy.job-total`, so the split follows the matrix above and
      # cannot drift from it: changing the `shard:` list is the whole edit. The helper assigns
      # whole test modules by greedy bin packing over recorded per-file durations — never part of
      # a module, or `--dist loadscope`'s module-scoped fixtures would rebuild per shard. It
      # exits non-zero rather than emit an empty list, because `pytest` with no collected tests
      # exits 5 and a shard that has silently stopped covering anything must not read as green.
      - name: Select this shard's test files
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ strategy.job-total }}
        run: |
          set -euo pipefail
          uv run python scripts/dev/pytest_shard.py --of "$SHARDS" --shard "$SHARD" --out "$RUNNER_TEMP/shard.txt"
          echo "$(wc -l < "$RUNNER_TEMP/shard.txt") test file(s) in this shard"

      # --durations because this job is the pole of the whole landing: unsharded, its test step
      # measured 267s against the `hooks` job beside it at 29-46s, and a landing waits on CI twice.
      # The runner is slower per test than the workstation, so a local `--durations` run does
      # not tell you which tests dominate HERE. Printing it on every run means the next person to
      # attack this reads the answer off a green build instead of guessing at the shape. It is
      # also the signal that the shards have gone lopsided: `pytest_shard.py --record` re-measures
      # the weights locally, and these per-shard step times say when that is worth doing.
      #
      # `=0` rather than `=15`, and the log is teed because the next step reads it.
      # A per-file total cannot be summed out of the top 15 lines: a module costing 30s across
      # 200 sub-second tests contributes nothing to them. `=0` prints every duration above
      # pytest's own 0.005s floor — 355 lines and 76 KB for one shard of six — and the
      # report is still sorted descending, so the top-15 reading above
      # survives as its first fifteen lines.
      #
      # pipefail is what makes the tee safe: without it the pipeline reports tee's exit status
      # and a failing suite would read green.
      - name: Run the test suite
        run: |
          set -euo pipefail
          mapfile -t files < "$RUNNER_TEMP/shard.txt"
          uv run python -m pytest --color yes --durations=0 "${files[@]}" \
            | tee "$RUNNER_TEMP/durations.log"

      # The measured half of the shard-weight coverage gate. The ratchet in
      # `test_pytest_shards_partition_the_suite.py` is static: it catches an unweighted file
      # only where a recorded pole already sits in the same directory, and no static proxy
      # separates a heavy module from a light one elsewhere. This step has the measurement,
      # because the shard just ran the file.
      #
      # Three arms, and the other two need the measurement just as much: a recorded weight
      # far HIGHER than what the module measured here reserves shard time the file does not
      # cost, and one far LOWER packs a heavy module as free (#4873). Every static arm asks only
      # whether a file is missing from the table. The complaint names its own repair, which
      # differs per arm — `--record-missing` fills a gap and `--record-files` refreshes an
      # entry that is merely wrong.
      #
      # A `run:` step and NOT a pytest test. The docs-refresh and eval-run crons commit with
      # the prek chain on and deselect exactly one ratchet node id; a second test that went red
      # on an unweighted file would fail their commits, and neither cron can
      # run the repair. Nothing a cron commits passes through a workflow step.
      #
      # It fails only on a pull_request or a branch dispatch, where the author can re-record.
      # On push and merge_group it annotates and passes (`--warn-only`): runner variance spans
      # the fixed bound, so the same code that passed on its PR turned master red three times,
      # and nobody can apply the repair on master (#3604). On a PR an unweighted module
      # measuring between `RUNNER_HEAVY_SECONDS` and `RUNNER_HEAVY_FAIL_SECONDS` annotates
      # too, since the same variance put one either side of the bound on a rerun (#4010).
      - name: Check every heavy module's recorded weight
        env:
          EVENT: ${{ github.event_name }}  # via env, never interpolated into the shell
        run: |
          set -euo pipefail
          mode=()
          if [ "$EVENT" = push ] || [ "$EVENT" = merge_group ]; then mode=(--warn-only); fi
          uv run python scripts/dev/pytest_shard.py "${mode[@]}" \
            --check-durations "$RUNNER_TEMP/durations.log"

  # The deck mod (`.claude/plugins/deck/`, #3676) is a Claude Code plugin of function hooks,
  # an early-access API that changes between releases. `claude plugin validate` reads the
  # module the way the engine will, and `claude plugin test` runs its tests against the engine
  # with the probe call mocked. Neither needs credentials. `.github/claude-cli/package-lock.json`
  # pins the CLI to the version whose API the mod was written and type-checked against, so a
  # bump is a deliberate change that re-runs this job. The package's postinstall puts the
  # native binary in place: run 37866869971 failed under --ignore-scripts with `claude native
  # binary not installed`. The install skips every script and then runs that one by name, so
  # it works whatever npm's lifecycle-script policy is and runs no other package's script.
  #
  # On a push to master the steps below skip and the job passes, as renovate-config skips its
  # push run. The PR run already checked the mod, and an npm outage on a master push would turn
  # the required context red and park every landing behind a check of a file the push did not
  # change. A dispatch still runs it, as every job here does.
  deck_mod:
    name: deck mod (claude plugin validate + test)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0  # the merge-base diff below needs history
          persist-credentials: false  # nothing here pushes; pr_changed_files.sh's fetch carries its own token

      - name: Check whether this PR touches the deck mod
        id: scope
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}  # via env, never interpolated into the shell
          FETCH_TOKEN: ${{ github.token }}  # contents: read; the checkout drops its own
        run: |
          set -euo pipefail
          # pr_changed_files.sh fetches the base with the token. Its file lists go unused, because
          # one `git diff --quiet` over three paths answers this step's question.
          "$GITHUB_WORKSPACE/scripts/dev/pr_changed_files.sh"
          if git diff --quiet "origin/$BASE_REF...HEAD" -- .claude/plugins/ .github/claude-cli/ .github/workflows/ci.yml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "The deck mod is untouched by this PR, so there is nothing to check."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: github.event_name == 'workflow_dispatch' || steps.scope.outputs.changed == 'true'
        with:
          node-version: "24.21.0"

      - name: Validate and test the deck mod
        if: github.event_name == 'workflow_dispatch' || steps.scope.outputs.changed == 'true'
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --prefix .github/claude-cli
          node .github/claude-cli/node_modules/@anthropic-ai/claude-code/install.cjs
          claude=.github/claude-cli/node_modules/.bin/claude
          "$claude" --version
          "$claude" plugin validate .claude/plugins/deck
          "$claude" plugin test .claude/plugins/deck

  # Target slice R2's round trip (docs/homelab-render.md, *The round trip*). It needs the flux
  # CLI, which the `pytest` job does not install, so it runs here. The probe step proves on
  # fixtures that the pinned CLI returns each escape placeholder mode writes as the round trip
  # relies on. The round-trip step then builds each directory of the placeholder render and of
  # the stub render with `flux build` and compares the two byte for byte. Each check runs once
  # more with `--red-proof`, which must make it exit 1, so this log shows both halves going red
  # on the pinned binary as well as green.
  flux_roundtrip:
    name: flux round trip (placeholder render against stub render)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The renderer imports no Galaxy collection, so no Galaxy cache.
      - uses: ./.github/actions/setup  # zizmor: ignore[self-repository] -- see the action's header

      # Equal to flux_version in ansible/roles/k8s/flux/defaults/main.yml, as every flux
      # step in .github/workflows/promote.yml is, so the CLI that checks the round trip is the CLI
      # that publishes and the controllers' release. The `# renovate:` comment puts this input
      # in the one flux PR with them, and scripts/tests/test_renovate_flux_cli.py fails a drift.
      - uses: fluxcd/flux2/action@b9c17924adb533d3617ec7de97a7b0f4acc07b39 # v2.9.6
        with:
          # renovate: datasource=github-releases depName=fluxcd/flux2
          version: v2.9.6

      - name: Probe the pinned flux CLI's substitution on fixtures
        run: |
          set -euo pipefail
          flux version --client
          uv run python scripts/renderer/shadow_diff.py fluxprobe --out "$RUNNER_TEMP/probe"
          rc=0
          uv run python scripts/renderer/shadow_diff.py fluxprobe --out "$RUNNER_TEMP/probe-red" \
            --red-proof || rc=$?
          echo "fluxprobe --red-proof exited $rc"
          [ "$rc" = 1 ]

      # The green run builds every tag in both passes, since placeholder mode skips none
      # (R2's PR 9). It covers home-assistant, pi-peer-backup, qbittorrent and authelia, which
      # carry the render_sops_manifests entries: each pass also asserts it dropped exactly one
      # document for each. The red half stays on three tags: it only has to show that one
      # changed byte is seen.
      - name: Round-trip every tag through flux build
        run: |
          set -euo pipefail
          uv run python scripts/renderer/shadow_diff.py roundtrip --out "$RUNNER_TEMP/rt"
          rc=0
          uv run python scripts/renderer/shadow_diff.py roundtrip --out "$RUNNER_TEMP/rt-red" \
            --role configarr --role janitorr --role home-assistant --red-proof || rc=$?
          echo "roundtrip --red-proof exited $rc"
          [ "$rc" = 1 ]

      # The second pass keeps a key's R1 stub only where the standalone-value guard's map
      # covers it. With `email` dropped from the committed map under every tag, the `${email}`
      # in traefik's CF_API_EMAIL env value takes `0123` and loses its string type, so the
      # narrowed pass must still see that standalone use. Every other key keeps the committed
      # map's cover, so the step holds whether or not `domain` is a placeholder (R2's domain
      # PR 2b).
      - name: Red-proof the round trip's second pass with email dropped from the guard's map
        run: |
          set -euo pipefail
          jq 'map_values(map(select(. != "email")))' \
            ansible/roles/k8s/manifests/files/standalone_secret_keys.json \
            > "$RUNNER_TEMP/guard-map-without-email.json"
          rc=0
          uv run python scripts/renderer/shadow_diff.py roundtrip --out "$RUNNER_TEMP/rt-map" \
            --role traefik --guard-map "$RUNNER_TEMP/guard-map-without-email.json" \
            > "$RUNNER_TEMP/rt-map.log" || rc=$?
          cat "$RUNNER_TEMP/rt-map.log"
          echo "roundtrip with email dropped from the guard map exited $rc"
          [ "$rc" = 1 ]
          grep -qx 'traefik: Deployment/homelab/traefik differs' "$RUNNER_TEMP/rt-map.log"

  # Target slice H3's host packages (docs/target-architecture/host/h3-pi-pilot.md, *CI (builds,
  # never signs)*). It renders every package at the head and at the merge base on every run,
  # with no path filter, because a group_vars edit can change a render. When no rendered tree
  # differs, the build, lint and container steps skip and the job ends green. Otherwise each
  # matrix leg builds the test image for its Ubuntu release and runs the updater cases in it
  # (steps 4 and 5). The job has no `name:`, so GitHub shows each leg as `host_packages
  # (<release>, <python>)`, and later host slices filter `gh run view` on that prefix.
  #
  # The merge base is HEAD's first parent on every event but a dispatch. On a pull request HEAD
  # is the merge ref, whose first parent is the base branch tip; on a push it is the previous
  # master commit. A dispatched branch diffs against its merge base with master, and a dispatch
  # builds and lints even when nothing differs, as every job here treats a dispatch as a sweep.
  #
  # nfpm is fetched and checked against its pinned sha256 on every run, ahead of the diff. A
  # Renovate PR that bumps the pin changes no render, so with the fetch behind the diff gate a
  # wrong digest or a 404 URL would reach master green.
  host_packages:
    runs-on: ubuntu-26.04
    # The image build fetches from snapshot.ubuntu.com, which answers 5xx often enough that
    # apt's retries can take minutes, and the cases boot three containers per leg.
    timeout-minutes: 30
    strategy:
      # Each leg reports its own conclusion, so one release's failure does not hide the other's.
      fail-fast: false
      matrix:
        # The releases the fleet runs or is moving to (C5), each with the python3 minor it
        # carries, which reconcile runs under.
        include:
          - {release: "24.04", python: "3.12"}
          - {release: "26.04", python: "3.14"}
    env:
      # The custom manager in renovate.json reads this annotation and moves the version and the
      # digest in one PR. The digest is the sha256 of nfpm_<version>_Linux_x86_64.tar.gz, which
      # Renovate reads from the release's checksums.txt.
      # renovate: datasource=github-release-attachments depName=goreleaser/nfpm
      NFPM_VERSION: v2.48.0
      NFPM_SHA256: 6d7f9a28b2f397934403950fcbba83f598b08d02edbe79a0815b3b4897341750
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0  # the merge-base render below needs history
          persist-credentials: false  # nothing here pushes or fetches

      # The renderer imports no Galaxy collection, so no Galaxy cache.
      - uses: ./.github/actions/setup  # zizmor: ignore[self-repository] -- see the action's header

      - name: Fetch the pinned nfpm and check its sha256
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          curl --retry 3 -fsSLo "$RUNNER_TEMP/nfpm.tar.gz" \
            "https://github.com/goreleaser/nfpm/releases/download/$NFPM_VERSION/nfpm_${NFPM_VERSION#v}_Linux_x86_64.tar.gz"
          echo "$NFPM_SHA256  $RUNNER_TEMP/nfpm.tar.gz" | sha256sum -c --strict
          tar -xzf "$RUNNER_TEMP/nfpm.tar.gz" -C "$RUNNER_TEMP/bin" nfpm
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/nfpm" --version

      # Each side renders with the renderer in its own tree, so a renderer change that alters a
      # render shows as a diff. The base tree is a worktree at the merge base.
      #
      # `cases=true` when the PR changes an input of the container cases (steps 4 and 5) that is
      # not a render input, so it changes no render (#5004): the test image's build context and
      # fixture specs, and the cases' own code. CASE_INPUTS is the one list of them, and
      # ansible/tests/repo/test_host_package_case_inputs_census.py holds it to every
      # `validate` module the cases script imports. The renderer is a render input, so it
      # reaches the cases through `changed` when it alters a real render. The job's own steps
      # invoke the cases, so an edit to this job counts too. `job-changed` compares it as
      # parsed YAML, so a comment-only edit, or an edit to another job, does not. The cases'
      # fixture exercises renderer paths no real package does, so `fixture-changed` renders it
      # in each tree with that tree's renderer, and a differing fixture counts too (#5066).
      #
      # Each verdict is captured on a line of its own, where `set -e` aborts the step when
      # the command fails. Inside a `[ "$(...)" = true ]` test the failure would read as
      # `false` and skip the cases (#5071). Each is computed only when the arms before it
      # did not fire.
      - name: Render every host package at the head and at the merge base
        id: render
        env:
          EVENT: ${{ github.event_name }}  # via env, never interpolated into the shell
          CASE_INPUTS: |
            hosts/lib/tests/container/
            scripts/validate/host_package_cases.py
            scripts/validate/validate_lib/host_container.py
            scripts/validate/validate_lib/host_fixtures.py
        run: |
          set -euo pipefail
          if [ "$EVENT" = workflow_dispatch ]; then
            base=$(git merge-base origin/master HEAD)
          else
            base=$(git rev-parse HEAD^1)
          fi
          echo "Merge base: $base"
          git worktree add --detach "$RUNNER_TEMP/base-tree" "$base"
          mkdir -p "$RUNNER_TEMP/render/base" "$RUNNER_TEMP/render/head"
          uv run python scripts/validate/host_packages.py render \
            --tree "$RUNNER_TEMP/base-tree" --out "$RUNNER_TEMP/render/base"
          uv run python scripts/validate/host_packages.py render \
            --tree . --out "$RUNNER_TEMP/render/head"
          uv run python scripts/validate/host_packages.py diff \
            "$RUNNER_TEMP/render/base" "$RUNNER_TEMP/render/head" \
            --summary "$GITHUB_STEP_SUMMARY" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          # A dispatch of master has its merge base at HEAD, so both builds carry one version
          # and no case can upgrade. The container steps read this and stand down.
          if [ "$base" = "$(git rev-parse HEAD)" ]; then
            echo "upgrade=false" >> "$GITHUB_OUTPUT"
          else
            echo "upgrade=true" >> "$GITHUB_OUTPUT"
          fi
          cases=false
          # CASE_INPUTS is left unquoted so each line is its own pathspec.
          # shellcheck disable=SC2086
          if ! git diff --quiet "$base" HEAD -- $CASE_INPUTS; then
            echo "::notice::This PR changes an input of the container cases, so they run."
            cases=true
          fi
          if [ "$cases" = false ]; then
            job=$(uv run python scripts/validate/host_packages.py job-changed "$base" \
              --workflow .github/workflows/ci.yml --job host_packages)
            if [ "$job" = true ]; then
              echo "::notice::This PR changes the host_packages job's steps, so the cases run."
              cases=true
            fi
          fi
          if [ "$cases" = false ]; then
            fixture=$(uv run python scripts/validate/host_packages.py fixture-changed \
              "$RUNNER_TEMP/base-tree" .)
            if [ "$fixture" = true ]; then
              echo "::notice::This PR changes how the cases' fixture renders, so the cases run."
              cases=true
            fi
          fi
          echo "cases=$cases" >> "$GITHUB_OUTPUT"

      # The version is H3's *Package rules* shape, `0.<first-parent count>+g<12 hex>`, taken
      # from each side's own commit, as the builder takes it from the commit it builds.
      - name: Build both renders with the pinned nfpm
        if: >-
          github.event_name == 'workflow_dispatch' || steps.render.outputs.changed == 'true'
          || steps.render.outputs.cases == 'true'
        env:
          BASE_SHA: ${{ steps.render.outputs.base }}
        run: |
          set -euo pipefail
          for side in base head; do
            sha=$BASE_SHA
            [ "$side" = head ] && sha=$(git rev-parse HEAD)
            HOMELAB_VERSION="0.$(git rev-list --count --first-parent "$sha")+g$(git rev-parse "$sha" | cut -c1-12)"
            export HOMELAB_VERSION
            mkdir -p "$RUNNER_TEMP/debs/$side"
            find "$RUNNER_TEMP/render/$side" -name nfpm.yaml -print0 | sort -z |
              while IFS= read -r -d '' spec; do
                (cd "$(dirname "$spec")" &&
                  nfpm package --config nfpm.yaml --packager deb --target "$RUNNER_TEMP/debs/$side/")
              done
          done
          find "$RUNNER_TEMP/debs" -name '*.deb' -print0 | sort -z |
            while IFS= read -r -d '' deb; do
              echo "== $deb"
              dpkg-deb --field "$deb" Package Version Depends
              dpkg-deb --contents "$deb"
            done

      - name: Run the type-config and maintainer-script lints over both renders and builds
        if: >-
          github.event_name == 'workflow_dispatch' || steps.render.outputs.changed == 'true'
          || steps.render.outputs.cases == 'true'
        run: |
          uv run python scripts/validate/host_packages.py lint \
            "$RUNNER_TEMP/render" "$RUNNER_TEMP/debs"

      # The lints' red proof on the pinned nfpm: a package built from the red fixture carries a
      # conffile and a postinst line outside the whitelist, and the lint must flag both.
      - name: Red-proof the lints on a package built from the red fixture
        if: >-
          github.event_name == 'workflow_dispatch' || steps.render.outputs.changed == 'true'
          || steps.render.outputs.cases == 'true'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/red"
          (cd scripts/validate/tests/fixtures/host_packages/red &&
            nfpm package --config nfpm.yaml --packager deb --target "$RUNNER_TEMP/red/")
          rc=0
          uv run python scripts/validate/host_packages.py lint "$RUNNER_TEMP/red" \
            2> "$RUNNER_TEMP/red.log" || rc=$?
          cat "$RUNNER_TEMP/red.log"
          echo "lint of the red fixture exited $rc"
          [ "$rc" = 1 ]
          grep -q 'conffiles lists /etc/homelab-red.conf' "$RUNNER_TEMP/red.log"
          grep -qF "postinst:2: 'rm -rf /etc/foo'" "$RUNNER_TEMP/red.log"

      # Step 4. The Dockerfile pins the release by digest and the packages by snapshot. The
      # runner's CA bundle reaches the build only, for the snapshot archive's https redirect.
      # The early exit is in the script, not the `if:`, because a dispatch must reach this
      # step (test_ci_dispatch_sweeps_everything.py) and a dispatch of master must stay green.
      - name: Build the test image for this release
        if: >-
          github.event_name == 'workflow_dispatch' || steps.render.outputs.changed == 'true'
          || steps.render.outputs.cases == 'true'
        env:
          RELEASE: ${{ matrix.release }}
          UPGRADE: ${{ steps.render.outputs.upgrade }}
        run: |
          set -euo pipefail
          if [ "$UPGRADE" != true ]; then
            echo "::notice::The merge base is HEAD, so no case can upgrade; no image is built."
            exit 0
          fi
          docker build --build-arg RELEASE="$RELEASE" --build-context runner-ca=/etc/ssl/certs \
            -t "homelab-host-test:$RELEASE" hosts/lib/tests/container
          {
            echo "### Test image, ubuntu:$RELEASE"
            echo '```'
            docker run --rm "homelab-host-test:$RELEASE" dpkg-query -W systemd python3
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Step 5: every case, on this leg's release. The script's docstring lists them.
      - name: Run the updater cases in systemd containers
        if: >-
          github.event_name == 'workflow_dispatch' || steps.render.outputs.changed == 'true'
          || steps.render.outputs.cases == 'true'
        env:
          RELEASE: ${{ matrix.release }}
          PYTHON: ${{ matrix.python }}
          UPGRADE: ${{ steps.render.outputs.upgrade }}
        run: |
          if [ "$UPGRADE" != true ]; then
            echo "::notice::The merge base is HEAD, so no case can upgrade; no case runs."
            exit 0
          fi
          uv run python scripts/validate/host_package_cases.py --image "homelab-host-test:$RELEASE" \
            --python "$PYTHON" --render "$RUNNER_TEMP/render" --debs "$RUNNER_TEMP/debs" \
            --work "$RUNNER_TEMP/cases"

  # The required status context. Branch protection, the deployer's CI_CONTEXTS, await_ci.py
  # and the ruleset-drift cron all name "prek (lint + validate + tests + secrets)", so that name
  # lives on this gate rather than on either half above. `if: always()` because a job with
  # `needs` is otherwise SKIPPED when a dependency fails, and GitHub counts a skipped required
  # check as passing — the gate has to run and fail explicitly. A cancelled run cancels this job
  # too, which is the "no verdict" every reader already handles.
  prek:
    name: prek (lint + validate + tests + secrets)
    runs-on: ubuntu-26.04
    needs: [hooks, pytest, ansible_lint, deck_mod, flux_roundtrip, host_packages]
    if: always()
    steps:
      # Every dependency must be named in an expression here, not merely in `needs` above: a
      # `needs` entry this step does not read is WAITED for and never CHECKED, so the required
      # context would pass green with that job red. `test_every_ci_job_is_gated.py` enforces it.
      - name: Require all six halves to have succeeded
        env:
          HOOKS: ${{ needs.hooks.result }}
          PYTEST: ${{ needs.pytest.result }}
          ANSIBLE_LINT: ${{ needs.ansible_lint.result }}
          DECK_MOD: ${{ needs.deck_mod.result }}
          FLUX_ROUNDTRIP: ${{ needs.flux_roundtrip.result }}
          HOST_PACKAGES: ${{ needs.host_packages.result }}
        run: |
          echo "hooks=$HOOKS pytest=$PYTEST ansible-lint=$ANSIBLE_LINT deck-mod=$DECK_MOD" \
            "flux-roundtrip=$FLUX_ROUNDTRIP host-packages=$HOST_PACKAGES"
          [ "$HOOKS" = success ] && [ "$PYTEST" = success ] && [ "$ANSIBLE_LINT" = success ] \
            && [ "$DECK_MOD" = success ] && [ "$FLUX_ROUNDTRIP" = success ] \
            && [ "$HOST_PACKAGES" = success ]

  renovate-config:
    name: renovate config validator
    # Not on push: the merge-to-master run is a daily schedule in
    # renovate-config-canary.yml. This job is the required merge context,
    # so it stays on every PR and self-scopes below; merge_group is treated like a PR whose
    # scope step found nothing to diff, the same as every other job here.
    if: github.event_name != 'push'
    runs-on: ubuntu-26.04
    timeout-minutes: 20  # six install attempts at 60s, plus a wedged fetch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0  # the merge-base diff below needs history
          persist-credentials: false  # nothing here pushes; the merge-base fetch carries its own token

      - uses: ./.github/actions/setup  # zizmor: ignore[self-repository] -- see the action's header
        with:
          python: "false"
          uv: "false"
          node: "true"

      # The script's `npm install renovate@latest` re-downloads Renovate on every run — 33-39s, and with
      # ansible-lint scoped to changed files this job is the longest in the workflow on a PR that
      # touches renovate.json. Skip it on PRs that do not touch the file it validates.
      # renovate.json moved in 26 of the last 1600 commits (~1.6%), so this is a fast green for
      # essentially every PR.
      #
      # Caching was measured and rejected. npm's cache splits in two: keeping `_cacache` alone
      # (309 MB) still re-resolves from the registry and cuts the step to 7.2s, but the key
      # cannot be content-derived from an unpinned package, so a rolling key would write a new
      # 309 MB entry every run and churn the repo's 10 GB cache budget — likely evicting the
      # prek and galaxy caches this workflow depends on. Also keeping `_npx` (341 MB) gets to
      # 0.9s but SILENTLY PINS: that tree's manifest records `renovate: ^44.30.1`, npm sees the
      # install satisfies it and reuses it without ever contacting the registry (it runs
      # happily with --offline). That would quietly defeat the whole point of this job, below.
      - name: Check whether this PR touches renovate.json
        id: scope
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}  # via env, never interpolated into the shell
          FETCH_TOKEN: ${{ github.token }}  # contents: read; the checkout drops its own, see the fetch in the script
        run: |
          set -euo pipefail
          "$GITHUB_WORKSPACE/scripts/dev/pr_changed_files.sh"
          # The script diffs against the merge base, so this is the PR's own change to the file.
          # A deletion of renovate.json counts as touching it, as `git diff -- renovate.json` did.
          if grep -qFx renovate.json "$RUNNER_TEMP/changed.txt" "$RUNNER_TEMP/deleted.txt"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "renovate.json untouched by this PR — it is validated on the merge to master."
          fi

      # Semantic validation of renovate.json — the one dependency-management axis with no
      # fail-at-commit backstop. prek's `check-json` only proves the file is well-formed JSON;
      # a typo'd packageRule field (e.g. matchPackageName vs matchPackageNames) is silently
      # IGNORED by Renovate (logged as a config warning, kept running), which would quietly
      # re-enable auto-merge of the stateful/DB-breaking bumps the automerge:false overrides
      # (getmeili/meilisearch, the crowdsec bouncer plugin, galaxy collections) exist to block.
      # `--strict` makes those warnings fail the build. Validates against the latest Renovate —
      # the same hosted Mend app version that actually consumes the config, which is why it is
      # deliberately unpinned and why neither caching variant above was taken.
      #
      # The canary beyond validating edits — a config that Renovate itself stops accepting —
      # is renovate-config-canary.yml, daily. It does not run here on a push to master: a
      # per-merge unpinned fetch fails on its own for minutes after each of
      # Renovate's ~8 daily npm publishes. The script retries that install; the
      # validation itself runs once, so a real config error is still final.
      - name: Validate renovate.json
        if: github.event_name != 'pull_request' || steps.scope.outputs.changed == 'true'
        run: scripts/validate/renovate_config.sh renovate.json
