name: prune-artifacts

# Deletes the old versions of the manifest artifact that the `promote` workflow publishes, once a
# day. `promote.py prune` selects them: it deletes a version only when it is older than 14 days
# and no promotion or rollback can reach it, together with the signatures of the digests it
# deletes. It then runs `cosign verify` on `prod`'s digest, and on `last-good`'s, so a wrong
# selection shows as a red run on the day it happens. The plan is
# docs/target-architecture/deploy/d1-flux-installed.md (*Decisions*, *Old artifact versions are
# pruned daily*), and the operator's view is docs/flux-deploy-plane.md.
#
# ansible/tests/repo/test_prune_artifacts_workflow.py holds this file's guard, permissions and
# concurrency group, and holds its cosign pin, its cosign fetch steps and RETRY_FUNCTIONS equal
# to promote.yml's.

on:
  schedule:
    - cron: "37 5 * * *"
  workflow_dispatch:

permissions: {}

env:
  # The cosign release promote.yml signs with, the sha256 of `cosign-linux-amd64`.
  # renovate: datasource=github-release-attachments depName=sigstore/cosign
  COSIGN_VERSION: v3.1.4
  COSIGN_SHA256: 424e2c97d0b45fd7a6b608a87f090f35633f4c23ece5f092d48bba11aaf4bbfa
  RETRY_FUNCTIONS: |
    retry() {
      local try out status
      for try in 1 2 3; do
        if out="$("$@")"; then
          printf '%s\n' "$out"
          return 0
        else
          status=$?
        fi
        echo "::warning::$1 failed on try $try of 3 with exit code $status" >&2
        [ "$try" = 3 ] || sleep 10
      done
      return "$status"
    }
    ghcr_login_once() { printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin; }
    ghcr_login() { retry ghcr_login_once; }

jobs:
  prune:
    # A dispatch from a branch would run that branch's copy with a token that can delete.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-26.04
    # Deletes are paced one a second (forge.py:DELETE_PAUSE_S), about 370 on a normal day. A
    # backlog that outlasts this is cut off between deletes. Signatures go last, so what is left
    # is what the next run selects again, never a kept version's missing signature.
    timeout-minutes: 60
    # Not `promote`: a job queued in that group would evict a pending promote job.
    concurrency:
      group: prune
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    env:
      # Skips pyproject.toml's `lint` group, which no step here runs (test_ci_lint_group.py).
      UV_NO_GROUP: lint
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0  # each ancestry read needs master's history back past every sha-<C>
          persist-credentials: false

      - uses: $/.github/actions/setup

      - name: Cache the cosign release
        uses: actions/cache@v6.1.0
        with:
          path: ${{ runner.temp }}/pinned/cosign
          key: cosign-${{ runner.os }}-${{ env.COSIGN_VERSION }}-${{ env.COSIGN_SHA256 }}

      - name: Fetch the pinned cosign and check its sha256
        run: |
          set -euo pipefail
          cosign="$RUNNER_TEMP/pinned/cosign/cosign"
          if [[ -f "$cosign" ]]; then
            echo "cosign $COSIGN_VERSION: cached"
          else
            mkdir -p "$RUNNER_TEMP/pinned/cosign"
            curl --retry 12 --retry-all-errors --retry-delay 30 -fsSLo "$cosign" \
              "https://github.com/sigstore/cosign/releases/download/$COSIGN_VERSION/cosign-linux-amd64"
          fi
          echo "$COSIGN_SHA256  $cosign" | sha256sum -c --strict
          sudo install -m 0755 "$cosign" /usr/local/bin/cosign
          cosign version

      # `cosign verify` passes no credentials of its own and reads the docker config, and the
      # package is private until the operator makes it public.
      - name: Log in to GHCR
        env:
          GH_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          eval "$RETRY_FUNCTIONS"
          ghcr_login

      # GITHUB_TOKEN lists and deletes package versions through the Packages API, and reads
      # each untagged manifest from GHCR.
      - name: Prune
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run --frozen python scripts/deploy_tools/promote.py prune
