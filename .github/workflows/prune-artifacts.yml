name: prune-artifacts

# Deletes the old versions of the manifest artifact that the `promote` workflow publishes, once a
# day. `promote.py prune` selects them: it deletes a version only when it is older than 14 days
# and no promotion or rollback can reach it, together with the signatures of the digests it
# deletes. It then runs `cosign verify` on `prod`'s digest, and on `last-good`'s, so a wrong
# selection shows as a red run on the day it happens. The plan is
# docs/archive/deploy/d1-flux-installed.md (*Decisions*, *Old artifact versions are
# pruned daily*), and the operator's view is docs/flux-deploy-plane.md.
#
# A red run reaches the operator through one GitHub issue, which `scripts/dev/scheduled_report.py`
# opens on a red run on master and closes on the next green one.
#
# The `prune-*` rows of tests/repo/census_rows/test_census_rows_workflows.py hold this file's guard,
# permissions and concurrency group, and hold its cosign pin and RETRY_FUNCTIONS equal to
# promote.yml's.

on:
  schedule:
    - cron: "37 5 * * *"
  workflow_dispatch:

permissions: {}

env:
  # The cosign release promote.yml signs with, the sha256 of `cosign-linux-amd64`.
  # renovate: datasource=github-release-attachments depName=sigstore/cosign
  COSIGN_VERSION: v3.1.4
  COSIGN_SHA256: 424e2c97d0b45fd7a6b608a87f090f35633f4c23ece5f092d48bba11aaf4bbfa
  RETRY_FUNCTIONS: |
    annotate() { printf '::%s::%s\n' "$1" "$2"; }
    retry() {
      local try out status
      for try in 1 2 3; do
        if out="$("$@")"; then
          printf '%s\n' "$out"
          return 0
        else
          status=$?
        fi
        annotate warning "$1 failed on try $try of 3 with exit code $status" >&2
        [ "$try" = 3 ] || sleep 10
      done
      return "$status"
    }
    ghcr_login_once() { printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin; }
    ghcr_login() { retry ghcr_login_once; }

jobs:
  prune:
    # A dispatch from a branch would run that branch's copy with a token that can delete.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-26.04
    # Deletes are paced one a second; a backlog that outlasts the budget is cut off between deletes,
    # and signatures go last so what is left is selected again.
    timeout-minutes: 60
    # Not `promote`: a job queued in that group would evict a pending promote job.
    concurrency:
      group: prune
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    env:
      # Skips pyproject.toml's `lint` group, which no step here runs (test_ci_lint_group.py).
      UV_NO_GROUP: lint
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0  # each ancestry read needs master's history back past every sha-<C>
          persist-credentials: false

      - uses: $/.github/actions/setup

      - name: Fetch the pinned cosign and check its sha256
        uses: $/.github/actions/pinned-tool
        with:
          tool: cosign
          version: ${{ env.COSIGN_VERSION }}
          sha256: ${{ env.COSIGN_SHA256 }}

      # `cosign verify` passes no credentials and reads the docker config; the package is private.
      - name: Log in to GHCR
        env:
          GH_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          eval "$RETRY_FUNCTIONS"
          ghcr_login

      - name: Prune
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run --frozen python scripts/deploy_tools/promote.py prune

  # `issues: write` sits on this job alone, which runs one script and deletes nothing.
  report:
    name: report the prune
    needs: prune
    if: ${{ always() && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          uv: "false"
      - name: Open, update or close the prune issue
        env:
          PYTHONPATH: scripts
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.prune.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python scripts/dev/scheduled_report.py --workflow "$GITHUB_WORKFLOW" \
            --repo "$GITHUB_REPOSITORY" --result "$RESULT" --run-url "$RUN_URL"
