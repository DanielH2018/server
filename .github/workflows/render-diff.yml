name: render-diff

# Advisory: renders the merge base and the PR head with one commit value, then prints the
# difference and the head's tree digest. It fails nothing and no ruleset requires it. A human
# reads the printed diff before merging a renderer or renderer-dependency change. renovate.json
# disables automerge for the renderer's dependency closure, so a bump that moves output waits
# for that read. On a draft the job skips at job level and takes no runner; the read happens
# before merge, and `ready_for_review` starts the run that prints the diff.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - scripts/renderer/**
      - scripts/lib/**
      - k8s/roles/**
      - inventory/group_vars/**
      - k8s/services.yml
      - uv.lock
      - pyproject.toml

permissions:
  contents: read

concurrency:
  group: render-diff-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  render-diff:
    name: render-diff
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    continue-on-error: true  # advisory: a red job here is information, never a block
    env:
      # Skips pyproject.toml's `lint` group, which no step here runs (test_ci_lint_group.py).
      UV_NO_GROUP: lint
      # The dyff release that compares the rendered trees. renovate.json's custom manager reads
      # this annotation and moves the version and the digest in one PR. The digest is the sha256
      # of dyff_<version>_linux_amd64.tar.gz.
      # renovate: datasource=github-release-attachments depName=homeport/dyff
      DYFF_VERSION: v1.12.0
      DYFF_SHA256: 50b43017a7474c2216694d0b5387439488a1d3c2b5eefe1674cd0e5c18bc0316
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0  # the merge base and its tree need history
          persist-credentials: false

      - uses: $/.github/actions/setup

      - name: Fetch the pinned dyff and check its sha256
        uses: $/.github/actions/pinned-tool
        with:
          tool: dyff
          version: ${{ env.DYFF_VERSION }}
          sha256: ${{ env.DYFF_SHA256 }}

      - name: Render the merge base and the head with one commit value
        env:
          BASE_REF: ${{ github.base_ref }}  # via env, never interpolated into the shell
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          merge_base="$(git merge-base "origin/$BASE_REF" "$HEAD_SHA")"
          git worktree add --detach "$RUNNER_TEMP/base-tree" "$merge_base"
          render() {
            local tree="$1" out="$2" tag
            local -a selection=()
            cd "$tree"
            for tag in $(uv run --frozen python scripts/deploy_tools/promote.py published-tags); do
              selection+=(--role "$tag")
            done
            [ "${#selection[@]}" -gt 0 ] || selection=(--shared-only)
            uv run --frozen python scripts/renderer/homelab_render.py cluster --out "$out" \
              --all-images --revision "$HEAD_SHA" "${selection[@]}"
          }
          (render "$RUNNER_TEMP/base-tree" "$RUNNER_TEMP/base-out")
          (render "$GITHUB_WORKSPACE" "$RUNNER_TEMP/head-out")

      - name: Print the difference and the head's tree digest
        run: |
          # dyff compares by structure, so a reordered key prints nothing and a changed field
          # prints its path. It exits 1 on a difference, which this advisory step ignores.
          dyff between --omit-header "$RUNNER_TEMP/base-out" "$RUNNER_TEMP/head-out" || true
          uv run --frozen python scripts/renderer/shadow_diff.py digest "$RUNNER_TEMP/head-out"
