name: promote

# Publishes each green master commit as an OCI artifact, signs it, and moves the `prod` tag
# that Flux follows to the newest published master commit. The plan and the reasons for every
# guard below are in docs/target-architecture/deploy/d1-flux-installed.md (*Decisions*), and
# docs/target-architecture/contracts.md C2 is the contract. The operator's view is
# docs/flux-deploy-plane.md.
#
# Four jobs, so code that runs during a render never holds a token that can sign, push or move
# a tag:
#   render   contents: read. Checks out the triggering commit, refuses one that is not on
#            master, builds the bundle and scans it, and hands `out/` on as an artifact.
#   publish  packages: write, id-token: write. Checks out nothing. Pushes `sha-<X>` and signs
#            it with cosign keyless under this workflow's identity. A `verify_drill` dispatch
#            instead pushes an annotated bundle to `verify-drill` unsigned, and fails unless
#            `cosign verify` refuses it.
#   promote  read-only. Checks out this workflow's own commit and runs `promote.py decide`,
#            which walks master from its tip and picks the commit `prod` moves to.
#   tag      packages: write. Checks out nothing. Moves `prod` to the commit `decide` picked
#            and records its digest in the repository variable PROD_DIGEST.
#
# ansible/tests/repo/test_promote_workflow.py holds every guard, permission and handoff here.

on:
  # zizmor: ignore[dangerous-triggers] -- every job requires a successful push run of CI on master in this repository, `render` refuses a commit not on master, and no job checks out a pull-request ref.
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      verify_drill:
        description: "Push the bundle UNSIGNED to the tag verify-drill, for the flux role's signature drill. Never touches prod."
        required: false
        type: boolean
        default: false

permissions: {}

jobs:
  render:
    # The same guard opens every job: a successful push run of CI on master in this repository,
    # or a dispatch of master's copy of this file. A branch's copy never runs with these tokens.
    if: >-
      github.ref == 'refs/heads/master' && (
      github.event_name == 'workflow_dispatch' || (
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master' &&
      github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.ancestry.outputs.sha }}
    steps:
      # The triggering commit's tree is the bundle. A dispatch has no workflow_run event, so it
      # renders master's tip.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0  # the ancestry check reads origin/master's history
          persist-credentials: false

      - name: Refuse a commit that is not on master
        id: ancestry
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          rc=0
          git merge-base --is-ancestor "$sha" origin/master || rc=$?
          case "$rc" in
            0) ;;
            1) echo "::error::$sha is not on origin/master; only master commits publish"; exit 1 ;;
            *) echo "::error::git merge-base --is-ancestor exited $rc"; exit 1 ;;
          esac
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # D1's bundle is one empty root Kustomization, so Flux applies nothing outside its own
      # namespace. Slice D2 replaces this step with the renderer.
      - name: Build the bundle
        id: build
        run: |
          set -euo pipefail
          mkdir -p out/flux
          printf '%s\n' \
            'apiVersion: kustomize.config.k8s.io/v1beta1' \
            'kind: Kustomization' \
            'resources: []' > out/flux/kustomization.yaml

      # The same gitleaks release as the `rev` in prek.toml, checked against the release's own
      # checksums file. A renovate.json custom manager moves the version in both URLs, and its
      # `gitleaks (prek.toml and the promote workflow)` group moves this copy and prek.toml's in
      # one PR.
      - name: Scan the bundle for secrets
        id: gitleaks
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --retry 3 -fsSLO \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl --retry 3 -fsSLo checksums.txt \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          # --ignore-missing skips the other platforms' lines; a run that verifies no file fails.
          sha256sum -c --ignore-missing --strict checksums.txt
          tar -xzf gitleaks_*_linux_x64.tar.gz gitleaks
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/gitleaks" dir out --config .gitleaks.toml --no-banner --redact

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bundle
          path: out/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: render
    if: >-
      github.ref == 'refs/heads/master' && (
      github.event_name == 'workflow_dispatch' || (
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master' &&
      github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      packages: write
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundle
          path: out

      # Equal to flux_version in ansible/roles/k8s/flux/defaults/main.yml, so the CLI and the
      # controllers move together. The workflow test fails a drift.
      - uses: fluxcd/flux2/action@b9c17924adb533d3617ec7de97a7b0f4acc07b39 # v2.9.6
        with:
          version: v2.9.6

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      # `--reproducible` fixes the created timestamp, so pushing one commit twice yields one
      # digest. The revision is the form promote.py's REVISION_ANNOTATION parser reads.
      - name: Push and sign the bundle
        id: push
        if: ${{ !inputs.verify_drill }}
        env:
          SHA: ${{ needs.render.outputs.sha }}
          GH_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$SHA" | grep -Eqx '[0-9a-f]{40}'; then
            echo "::error::render handed on sha '$SHA', not 40 lowercase hex"
            exit 1
          fi
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
          repo=ghcr.io/danielh2018/homelab-manifests
          digest="$(flux push artifact "oci://$repo:sha-$SHA" \
            --path=out \
            --source="https://github.com/$GITHUB_REPOSITORY" \
            --revision="master@sha1:$SHA" \
            --reproducible \
            --output=json | jq -r .digest)"
          if ! printf '%s' "$digest" | grep -Eqx 'sha256:[0-9a-f]{64}'; then
            echo "::error::flux push printed digest '$digest'"
            exit 1
          fi
          echo "pushed $repo:sha-$SHA at $digest"
          cosign sign --yes "$repo@$digest"

      # The drill pushes an unsigned bundle to its own tag. It never writes sha-<X>, because an
      # unsigned sha-<X> makes `decide` report an error for that commit. The annotation gives
      # the drill bundle a digest that no signed push carries. Without it, --reproducible makes
      # the drill's digest equal sha-<X>'s, and cosign v3 stores a signature as a referrer of
      # the digest, so `verify-drill` verified against promote's signature (#4820).
      - name: Push the drill bundle unsigned
        id: drill-push
        if: ${{ inputs.verify_drill }}
        env:
          SHA: ${{ needs.render.outputs.sha }}
          GH_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$SHA" | grep -Eqx '[0-9a-f]{40}'; then
            echo "::error::render handed on sha '$SHA', not 40 lowercase hex"
            exit 1
          fi
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
          repo=ghcr.io/danielh2018/homelab-manifests
          digest="$(flux push artifact "oci://$repo:verify-drill" \
            --path=out \
            --source="https://github.com/$GITHUB_REPOSITORY" \
            --revision="master@sha1:$SHA" \
            --annotations=io.homelab.verify-drill=true \
            --reproducible \
            --output=json | jq -r .digest)"
          if ! printf '%s' "$digest" | grep -Eqx 'sha256:[0-9a-f]{64}'; then
            echo "::error::flux push printed digest '$digest'"
            exit 1
          fi
          echo "pushed $repo:verify-drill at $digest, left unsigned"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # The drill's red half, proven on every dispatch: `cosign verify` under the identity the
      # OCIRepository checks must refuse the drill digest. A pass means a signature reaches the
      # drill bundle, so `verify-drill` would read Ready and prove nothing. The identity is
      # scripts/deploy_tools/forge.py's SIGNER_IDENTITY and SIGNER_ISSUER, and the workflow test
      # fails a drift. cosign reads the registry login the push step wrote to the docker config.
      - name: Refuse a drill bundle that verifies
        id: drill-refuses
        if: ${{ inputs.verify_drill }}
        env:
          DIGEST: ${{ steps.drill-push.outputs.digest }}
          IDENTITY: https://github.com/DanielH2018/server/.github/workflows/promote.yml@refs/heads/master
          ISSUER: https://token.actions.githubusercontent.com
        run: |
          set -euo pipefail
          repo=ghcr.io/danielh2018/homelab-manifests
          if cosign verify \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer "$ISSUER" \
            "$repo@$DIGEST"; then
            echo "::error::cosign verified the drill digest $DIGEST under promote's identity"
            exit 1
          fi
          echo "cosign refused the drill digest $DIGEST, as the drill requires"

  promote:
    needs: publish
    if: >-
      !inputs.verify_drill &&
      github.ref == 'refs/heads/master' && (
      github.event_name == 'workflow_dispatch' || (
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master' &&
      github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    # GitHub keeps one pending job per group and a newer one evicts it. `decide` walks master
    # from its tip rather than reading the trigger, so the last job to run promotes the newest
    # published commit whichever pending job was evicted.
    concurrency:
      group: promote
      cancel-in-progress: false
    permissions:
      contents: read
      checks: read
      packages: read
    outputs:
      verdict: ${{ steps.decide.outputs.verdict }}
      target: ${{ steps.decide.outputs.target }}
      digest: ${{ steps.decide.outputs.digest }}
    steps:
      # This workflow's own commit, so the promote.py that runs matches the promote.yml that
      # calls it. A workflow_run always runs master's copy of this file.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0  # the walk reads master back to prod's commit
          persist-credentials: false

      - uses: ./.github/actions/setup  # zizmor: ignore[self-repository] -- see the action's header

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      # `cosign verify` inside `decide` passes no credentials of its own and reads the docker
      # config, and the package is private until the operator makes it public.
      - name: Log in to GHCR read-only
        env:
          GH_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
        run: printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin

      # GITHUB_TOKEN reads the registry and the check-runs. GH_TOKEN is PROMOTE_TOKEN, for the
      # `gh variable get DEPLOY_HOLD` inside `decide`. That read goes through the API when
      # `decide` runs, not through the `vars` context, so a hold written after this run
      # started is still seen.
      - name: Decide
        id: decide
        env:
          TRIGGER: ${{ github.event.workflow_run.head_sha || github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ secrets.PROMOTE_TOKEN }}
        run: uv run --frozen python scripts/deploy_tools/promote.py decide --trigger "$TRIGGER"

  tag:
    needs: promote
    if: >-
      needs.promote.outputs.verdict == 'promote' &&
      !inputs.verify_drill &&
      github.ref == 'refs/heads/master' && (
      github.event_name == 'workflow_dispatch' || (
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master' &&
      github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    concurrency:
      group: promote
      cancel-in-progress: false
    permissions:
      packages: write
    steps:
      - uses: fluxcd/flux2/action@b9c17924adb533d3617ec7de97a7b0f4acc07b39 # v2.9.6
        with:
          version: v2.9.6

      # The commit and digest come from `decide`, never from the trigger: the commit `prod`
      # moves to is the newest published one, which need not be the one whose CI ran.
      - name: Move prod
        env:
          TARGET: ${{ needs.promote.outputs.target }}
          DIGEST: ${{ needs.promote.outputs.digest }}
          GH_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$TARGET" | grep -Eqx '[0-9a-f]{40}' \
            || { echo "::error::decide's target '$TARGET' is not 40 lowercase hex"; exit 1; }
          printf '%s' "$DIGEST" | grep -Eqx 'sha256:[0-9a-f]{64}' \
            || { echo "::error::decide's digest '$DIGEST' is not sha256:<64 hex>"; exit 1; }
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
          flux tag artifact "oci://ghcr.io/danielh2018/homelab-manifests:sha-$TARGET" --tag prod

      # A failed write leaves PROD_DIGEST behind prod, which the deploy-pipeline exporter pages
      # on from slice D2: the safe direction.
      - name: Record prod's digest
        env:
          DIGEST: ${{ needs.promote.outputs.digest }}
          GH_TOKEN: ${{ secrets.PROMOTE_TOKEN }}
        run: gh variable set PROD_DIGEST --body "$DIGEST" -R "$GITHUB_REPOSITORY"
