name: promote

# Publishes each green master commit as an OCI artifact, signs it, and moves the `prod` tag
# that Flux follows to the newest published master commit. The plan and the reasons for every
# guard below are in docs/target-architecture/deploy/d1-flux-installed.md (*Decisions*), and
# docs/target-architecture/contracts.md C2 is the contract. The operator's view is
# docs/flux-deploy-plane.md.
#
# Ten jobs, so code that runs during a render or a decision never holds a token that can sign,
# push or move a tag:
#   render   contents: read, checks: read. Checks out the triggering commit, or the dispatched
#            `sha`, refuses one that is not on master, re-reads a dispatched commit's CI,
#            renders the bundle, runs the publish census and gates and scans it, and hands
#            `out/` on.
#   images   contents: read, packages: write. Checks out this workflow's own commit, refuses any
#            context in `out/images/` that does not hash to its tag in `tags.json` before a
#            credential exists, then builds and pushes each image whose content tag GHCR does
#            not serve (scripts/deploy_tools/ci_images.py). `publish` needs it.
#   publish  packages: write, id-token: write. Checks out nothing. Pushes `sha-<X>` and signs
#            it with cosign keyless under this workflow's identity. A `verify_drill` dispatch
#            instead pushes an annotated bundle to `verify-drill` unsigned, and fails unless
#            `cosign verify` refuses it.
#   promote  read-only, except that `decide` writes DEPLOY_HOLD as T's SHA when T fails the
#            forward-only gate (H1.1b), or as `<T> suspended-changed=<tags>` when T changes a
#            suspended tag (D5.1d). Checks out this workflow's own commit and runs
#            `promote.py decide`, which walks master from its tip and picks the commit T `prod`
#            moves to. It pulls `prod`'s bundle and T's before anything moves, and hands them
#            on to `verify`. A step after Decide posts a suspended-changed hold to the
#            deployer's Discord channel, with the webhook and no token.
#   tag      packages: write. Checks out nothing. Tags `prod`'s digest `last-good` when that
#            tag is absent, moves `prod` to T, and records its digest in PROD_DIGEST.
#   verify   contents: read, statuses: read, packages: read. Runs `promote.py verify T`,
#            which waits on T's commit statuses for T's changed set and prints `good` or
#            `failed`, or `superseded` once a later run has moved `prod` past T.
#   settle   packages: write, actions: write. Checks out nothing. A good verdict moves
#            `last-good` to T. When T changes a snapshot role (D5.2b1), anything else writes
#            DEPLOY_HOLD as `<T> stateful=<names>`, tags T `held` and leaves `prod`. When T
#            changes a forward-only tag, it writes T's SHA alone in the same way. Otherwise it
#            writes DEPLOY_HOLD, then resets `prod` to
#            `last-good` and records PROD_DIGEST. Contract C2's *Verification* is the rule.
#            Once either succeeds, it dispatches this workflow for master's newest green
#            commit when that commit is newer than T.
#   post     contents: read. Runs only after `settle` wrote the stateful hold. Checks out this
#            workflow's own commit and runs `promote.py hold`, which posts the hold, with a
#            command block per changed snapshot role, to the deployer's Discord channel through
#            the DEPLOY_DISCORD_WEBHOOK secret. A failed post fails the run.
#   reset-check  contents: read, packages: read, actions: read. Runs only for a
#            `reset_to_last_good` dispatch, which skips every job above. Runs
#            `promote.py reset-check`, which refuses without a hold or while a verification is in
#            flight, and hands on the two digests it read.
#   reset-move   packages: write. Checks out nothing. Moves `prod` to `last-good` only while
#            `prod` still names the digest `reset-check` read, and records PROD_DIGEST.
#
# The `schedule:` run fires when the weekly reboot's no-promotion window ends (D5.2b2). Inside
# the window `decide` ends `deferred` and moves nothing, so this run promotes master's tip.
# Every commit merged in the window was published by its own run, so this one skips render,
# images and publish and starts at `promote`.
#
# ansible/tests/repo/test_promote_workflow.py holds every guard, permission and handoff here.

on:
  # zizmor: ignore[dangerous-triggers] -- every job requires a successful push run of CI on master in this repository, `render` refuses a commit not on master, and no job checks out a pull-request ref.
  workflow_run:
    workflows: [CI]
    types: [completed]
  # The weekly reboot's no-promotion window ends here, at the cron's 07:30 UTC Sunday plus the
  # 5-minute shutdown delay and the mute's 40-minute recovery, all from
  # ansible/inventory/group_vars/all.yml. GitHub reads this literal, so
  # scripts/deploy_tools/tests/test_promote_reboot_window.py derives it and fails a drift.
  schedule:
    - cron: "15 8 * * 0"
  workflow_dispatch:
    inputs:
      reset_to_last_good:
        description: "Move prod back to last-good and do nothing else. Refuses unless DEPLOY_HOLD holds and prod's run has settled (operator-only)."
        required: false
        type: boolean
        default: false
      verify_drill:
        description: "Push the bundle UNSIGNED to the tag verify-drill, for the flux role's signature drill. Never touches prod."
        required: false
        type: boolean
        default: false
      sha:
        description: "The 40-hex master commit to publish and promote from, instead of master's tip. It must descend from origin/master and have green CI."
        required: false
        type: string
        default: ""

permissions: {}

jobs:
  render:
    # The same guard opens every job: a successful push run of CI on master in this repository,
    # or a dispatch of master's copy of this file. A branch's copy never runs with these tokens.
    # A reset dispatch and the scheduled run skip it, and so every job that needs it.
    if: >-
      !inputs.reset_to_last_good &&
      github.ref == 'refs/heads/master' && (
      github.event_name == 'workflow_dispatch' || (
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master' &&
      github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read  # the CI re-check of a dispatched `sha`
    outputs:
      sha: ${{ steps.ancestry.outputs.sha }}
    steps:
      # The triggering commit's tree is the bundle. A dispatch has no workflow_run event, so it
      # renders the `sha` input, or master's tip when the input is empty.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.sha || github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0  # the ancestry check reads origin/master's history
          persist-credentials: false

      # WANTED is the commit the checkout was asked for, so a dispatched `sha` is the commit
      # this step checks, never the workflow's own `github.sha`.
      - name: Refuse a commit that is not on master
        id: ancestry
        env:
          WANTED: ${{ inputs.sha || github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$WANTED" | grep -Eqx '[0-9a-f]{40}'; then
            echo "::error::'$WANTED' is not a 40-hex commit"
            exit 1
          fi
          sha="$(git rev-parse HEAD)"
          if [ "$sha" != "$WANTED" ]; then
            echo "::error::checked out $sha, not the requested $WANTED"
            exit 1
          fi
          rc=0
          git merge-base --is-ancestor "$sha" origin/master || rc=$?
          case "$rc" in
            0) ;;
            1) echo "::error::$sha is not on origin/master; only master commits publish"; exit 1 ;;
            *) echo "::error::git merge-base --is-ancestor exited $rc"; exit 1 ;;
          esac
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # Python and uv for the renderer and promote.py. The renderer imports no Galaxy collection.
      - uses: ./.github/actions/setup  # zizmor: ignore[self-repository] -- see the action's header

      # A workflow_run carries CI's own success. A dispatched `sha` carries none, so its CI is
      # read again, as `decide` reads it, and anything but green stops the run here.
      - name: Refuse a dispatched commit whose CI is not green
        id: ci-recheck
        if: ${{ inputs.sha != '' }}
        env:
          SHA: ${{ steps.ancestry.outputs.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run --frozen python scripts/deploy_tools/promote.py ci-verdict "$SHA"

      # The bundle publishes the tags the inventory marks `owner: flux` and every shared kind,
      # such as `cluster-vars`. The renderer writes each tag's `cluster/<tag>/` and its
      # Kustomization `flux/<tag>.yaml`, each shared kind's `cluster/<kind>/` and
      # `flux/<kind>.yaml`, the root's `flux/kustomization.yaml` and `digests.json`. Passing no
      # --secret-stubs is what selects placeholder mode, the only mode that publishes
      # (contract C1).
      #
      # With no published tag the step passes --shared-only, because `cluster` without `--role`
      # renders every tag. The bundle then holds the shared kinds and a root listing them, so
      # the first decryption of the cluster file gets a revision of its own (D3.3a).
      # A --role render writes only the named tags' image contexts, and --shared-only writes
      # none, so both branches pass --all-images: the `images` job builds and pushes all ten
      # from out/images/ and refuses a render without tags.json (#5374, #5593).
      # ansible/tests/repo/test_promote_workflow_bundle.py fails either branch without it.
      - name: Build the bundle
        id: build
        run: |
          set -euo pipefail
          # A command substitution, so set -e stops the step when the read fails.
          listed="$(uv run python scripts/deploy_tools/promote.py published-tags)"
          if [ -z "$listed" ]; then
            uv run python scripts/renderer/homelab_render.py cluster --out out --shared-only --all-images
          else
            roles=()
            while read -r tag; do roles+=(--role "$tag"); done <<< "$listed"
            uv run python scripts/renderer/homelab_render.py cluster --out out --all-images "${roles[@]}"
          fi

      # The publish census: flux/ holds exactly the published tags' files, and the root lists
      # every one. Beside it run three gates: source, host and no-stub (bundle_gates.py). A
      # refusal fails the job before any push, so `prod` stays where it was.
      - name: Check the bundle
        id: check-bundle
        run: uv run python scripts/deploy_tools/promote.py check-bundle out

      # .gitleaks.toml's allowlist skips the bundle's SOPS copies, the cluster file under
      # out/cluster/cluster-vars/ and, from D3.3c, each role's manifest copy. This step is the
      # guard that stands in for the scan there: each copy must hold ciphertext only. find
      # lists them rather than a glob, so an empty list fails here instead of reaching
      # cluster_vars.py as a literal pattern.
      - name: Check the bundle's SOPS copies hold ciphertext
        id: ciphertext
        run: |
          set -euo pipefail
          mapfile -t copies < <(find out/cluster -type f -name '*.sops.*' | sort)
          if [ "${#copies[@]}" -eq 0 ]; then
            echo "::error::out/cluster holds no SOPS copy, but the cluster-vars kind always carries one"
            exit 1
          fi
          uv run python scripts/secrets_mgmt/cluster_vars.py check --ciphertext-only "${copies[@]}"

      # The same gitleaks release as the `rev` in prek.toml, checked against the release's own
      # checksums file. A renovate.json custom manager moves the version in both URLs, and its
      # `gitleaks (prek.toml and the promote workflow)` group moves this copy and prek.toml's in
      # one PR.
      - name: Scan the bundle for secrets
        id: gitleaks
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --retry 3 -fsSLO \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl --retry 3 -fsSLo checksums.txt \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          # --ignore-missing skips the other platforms' lines; a run that verifies no file fails.
          sha256sum -c --ignore-missing --strict checksums.txt
          tar -xzf gitleaks_*_linux_x64.tar.gz gitleaks
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/gitleaks" dir out --config .gitleaks.toml --no-banner --redact

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bundle
          path: out/
          if-no-files-found: error
          retention-days: 7

  # images: contents: read, packages: write. Builds each of the ten contexts `render` wrote under
  # out/images/ and pushes ghcr.io/danielh2018/<name>:<content tag> when GHCR does not serve that
  # tag (D5.4a2). It runs no renderer code: it reads `render`'s artifact and this workflow's own
  # scripts/deploy_tools/ci_images.py, which imports only the stdlib and lib.cli_help. The plan is
  # docs/target-architecture/deploy/d5-bulk-move.md, *Images built by CI (D5.4)*.
  #
  # `publish` needs it, so a failing image stops every promotion until it is fixed. A served tag
  # is success and is never rebuilt, because the push-once rule is what makes a content tag
  # immutable. The concurrency group keeps two runs from both reading a tag as absent and both
  # pushing it; a newer pending run evicts an older one, and pushes whatever that one would have.
  # Nothing pulls these refs until D5.4b.
  images:
    needs: render
    if: >-
      github.ref == 'refs/heads/master' && (
      github.event_name == 'workflow_dispatch' || (
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master' &&
      github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-26.04
    # About 3x the slowest measured run, at a 20-minute floor (#5482). A rebuild of all ten
    # took 394s on 2026-10-17, code-server's toolchains the longest at 213s. Over the 35
    # `images` jobs to that date the slowest success took 54s.
    timeout-minutes: 20
    concurrency:
      group: images
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundle
          path: out

      # Before any credential exists: each context's files must hash to the tag tags.json names,
      # by image-builder's own rule, or nothing is pushed.
      - name: Check each image context against its content tag
        id: plan
        run: python3 scripts/deploy_tools/ci_images.py plan out

      - name: Push each image whose content tag GHCR does not serve
        id: push
        env:
          GH_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
          python3 scripts/deploy_tools/ci_images.py push out

  publish:
    needs: [render, images]
    if: >-
      github.ref == 'refs/heads/master' && (
      github.event_name == 'workflow_dispatch' || (
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master' &&
      github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      packages: write
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundle
          path: out

      # Equal to flux_version in ansible/roles/k8s/flux/defaults/main.yml, so the CLI and the
      # controllers move together. The workflow test fails a drift. The `# renovate:` comment
      # is what renovate.json's custom manager reads, and it puts this input, the action's pin
      # and flux_version in one PR. The `flux_roundtrip` job in ci.yml installs the same action
      # at the same pin and version, so the CLI that proves target slice R2's round trip is the
      # CLI that publishes. The same manager reads its input, so one bump moves all three steps,
      # and scripts/tests/test_renovate_flux_cli.py fails a drift in either workflow.
      - uses: fluxcd/flux2/action@b9c17924adb533d3617ec7de97a7b0f4acc07b39 # v2.9.6
        with:
          # renovate: datasource=github-releases depName=fluxcd/flux2
          version: v2.9.6

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      # `--reproducible` fixes the created timestamp, so pushing one commit twice yields one
      # digest. The revision is the form promote.py's REVISION_ANNOTATION parser reads.
      - name: Push and sign the bundle
        id: push
        if: ${{ !inputs.verify_drill }}
        env:
          SHA: ${{ needs.render.outputs.sha }}
          GH_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$SHA" | grep -Eqx '[0-9a-f]{40}'; then
            echo "::error::render handed on sha '$SHA', not 40 lowercase hex"
            exit 1
          fi
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
          repo=ghcr.io/danielh2018/homelab-manifests
          digest="$(flux push artifact "oci://$repo:sha-$SHA" \
            --path=out \
            --source="https://github.com/$GITHUB_REPOSITORY" \
            --revision="master@sha1:$SHA" \
            --reproducible \
            --output=json | jq -r .digest)"
          if ! printf '%s' "$digest" | grep -Eqx 'sha256:[0-9a-f]{64}'; then
            echo "::error::flux push printed digest '$digest'"
            exit 1
          fi
          echo "pushed $repo:sha-$SHA at $digest"
          cosign sign --yes "$repo@$digest"

      # The drill pushes an unsigned bundle to its own tag. It never writes sha-<X>, because an
      # unsigned sha-<X> makes `decide` report an error for that commit. The annotation gives
      # the drill bundle a digest that no signed push carries. Without it, --reproducible makes
      # the drill's digest equal sha-<X>'s, and cosign v3 stores a signature as a referrer of
      # the digest, so `verify-drill` verified against promote's signature (#4820).
      - name: Push the drill bundle unsigned
        id: drill-push
        if: ${{ inputs.verify_drill }}
        env:
          SHA: ${{ needs.render.outputs.sha }}
          GH_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$SHA" | grep -Eqx '[0-9a-f]{40}'; then
            echo "::error::render handed on sha '$SHA', not 40 lowercase hex"
            exit 1
          fi
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
          repo=ghcr.io/danielh2018/homelab-manifests
          digest="$(flux push artifact "oci://$repo:verify-drill" \
            --path=out \
            --source="https://github.com/$GITHUB_REPOSITORY" \
            --revision="master@sha1:$SHA" \
            --annotations=io.homelab.verify-drill=true \
            --reproducible \
            --output=json | jq -r .digest)"
          if ! printf '%s' "$digest" | grep -Eqx 'sha256:[0-9a-f]{64}'; then
            echo "::error::flux push printed digest '$digest'"
            exit 1
          fi
          echo "pushed $repo:verify-drill at $digest, left unsigned"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # The drill's red half, proven on every dispatch: no signature may reach the drill digest
      # under the identity the OCIRepository checks. A signature there means `verify-drill`
      # would read Ready and prove nothing. The identity is scripts/deploy_tools/forge.py's
      # SIGNER_IDENTITY and SIGNER_ISSUER, and the workflow test fails a drift.
      #
      # `cosign verify` must refuse the digest, but its refusal alone proves nothing (#4829).
      # cosign v3.1.3 swallows a registry error on its bundle probe and falls back to the
      # legacy `.sig` tag, which a referrer signature never writes, so a 429 on a signed digest
      # still reads `no signatures found`. The step therefore reads the registry itself and
      # fails on any answer other than 200 or 404. GHCR answers the OCI referrers API with
      # 404, so cosign stores its bundle in the referrers-tag fallback `sha256-<hex>`: an
      # image index that lists each referrer. On 2026-10-13 prod's digest held its Sigstore
      # bundle there, and the drill digest's fallback tag answered 404. The step reads the
      # API first anyway, in case GHCR starts serving it.
      - name: Refuse a drill bundle that verifies
        id: drill-refuses
        if: ${{ inputs.verify_drill }}
        env:
          DIGEST: ${{ steps.drill-push.outputs.digest }}
          IDENTITY: https://github.com/DanielH2018/server/.github/workflows/promote.yml@refs/heads/master
          ISSUER: https://token.actions.githubusercontent.com
          GH_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$DIGEST" | grep -Eqx 'sha256:[0-9a-f]{64}'; then
            echo "::error::the drill push handed on digest '$DIGEST'"
            exit 1
          fi
          name=danielh2018/homelab-manifests
          if cosign verify \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer "$ISSUER" \
            "ghcr.io/$name@$DIGEST"; then
            echo "::error::cosign verified the drill digest $DIGEST under promote's identity"
            exit 1
          fi

          # curl reads each credential from stdin, so none reaches its argv.
          body="$RUNNER_TEMP/drill-referrers.json"
          token="$(printf 'user = "%s:%s"\n' "$GH_ACTOR" "$GITHUB_TOKEN" \
            | curl --retry 3 -fsS -K - \
              "https://ghcr.io/token?scope=repository:$name:pull&service=ghcr.io" \
            | jq -r '.token // empty')"
          if [ -z "$token" ]; then
            echo "::error::ghcr.io issued no pull token for $name"
            exit 1
          fi
          fetch() {  # fetch <path> <accept>: prints the HTTP status, writes the body to $body
            printf 'header = "Authorization: Bearer %s"\n' "$token" \
              | curl --retry 3 -sS -K - -H "Accept: $2" -o "$body" -w '%{http_code}' \
                "https://ghcr.io/v2/$name/$1"
          }
          index=application/vnd.oci.image.index.v1+json
          hex="${DIGEST#sha256:}"

          # Every 404 below reads as "nothing there", which is true only if this token can
          # see the drill digest at all, so the step reads that first.
          status="$(fetch "manifests/$DIGEST" application/vnd.oci.image.manifest.v1+json)"
          if [ "$status" != 200 ]; then
            echo "::error::the drill digest's own manifest answered HTTP $status, so a 404 below would prove nothing"
            exit 1
          fi

          status="$(fetch "referrers/$DIGEST" "$index")"
          where="the referrers API"
          if [ "$status" = 404 ]; then
            status="$(fetch "manifests/sha256-$hex" "$index")"
            where="the referrers tag sha256-$hex"
          fi
          case "$status" in
            200) referrers="$(jq -c '[.manifests[]? | .artifactType // .mediaType]' "$body")" ;;
            404) referrers='[]' ;;
            *) echo "::error::$where answered HTTP $status, so the drill digest's referrers are unknown"; exit 1 ;;
          esac
          if [ "$referrers" != '[]' ]; then
            echo "::error::$where lists referrers $referrers on the drill digest $DIGEST"
            exit 1
          fi

          status="$(fetch "manifests/sha256-$hex.sig" application/vnd.oci.image.manifest.v1+json)"
          case "$status" in
            404) ;;
            200) echo "::error::the legacy signature tag sha256-$hex.sig exists"; exit 1 ;;
            *) echo "::error::the legacy signature tag answered HTTP $status"; exit 1 ;;
          esac
          echo "the registry holds no signature for the drill digest $DIGEST, as the drill requires"

  promote:
    needs: publish
    # The scheduled run skips publish, so this job runs on a skipped publish for it alone, and
    # on a successful one otherwise.
    if: >-
      !cancelled() &&
      !inputs.verify_drill &&
      !inputs.reset_to_last_good &&
      github.ref == 'refs/heads/master' && (
      (github.event_name == 'schedule' && needs.publish.result == 'skipped') || (
      needs.publish.result == 'success' && (
      github.event_name == 'workflow_dispatch' || (
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master' &&
      github.event.workflow_run.head_repository.full_name == github.repository))))
    runs-on: ubuntu-26.04
    # `decide` waits up to 350 minutes on a verification in flight
    # (promote_lib/verify_promotion.py:IN_FLIGHT_WAIT_S), and the walk and the pulls take a few more.
    # 360 is GitHub's limit for a job on a hosted runner, so this cannot rise further.
    timeout-minutes: 360
    # GitHub keeps one pending job per group and a newer one evicts it. `decide` walks master
    # from its tip rather than reading the trigger, so the last job to run promotes the newest
    # published commit whichever pending job was evicted.
    concurrency:
      group: promote
      cancel-in-progress: false
    permissions:
      contents: read
      checks: read
      packages: read
      # The forward-only gate maps a pin-changing commit to its PR and reads the
      # homelab/upgrade-gates status on that PR's head (H1.1b).
      pull-requests: read
      statuses: read
    outputs:
      verdict: ${{ steps.decide.outputs.verdict }}
      target: ${{ steps.decide.outputs.target }}
      digest: ${{ steps.decide.outputs.digest }}
      prior: ${{ steps.decide.outputs.prior }}
      prior_digest: ${{ steps.decide.outputs.prior_digest }}
      reset_digest: ${{ steps.decide.outputs.reset_digest }}
      seed: ${{ steps.decide.outputs.seed }}
      clears_hold: ${{ steps.decide.outputs.clears_hold }}
      no_reset: ${{ steps.decide.outputs.no_reset }}
      stateful: ${{ steps.decide.outputs.stateful }}
    steps:
      # This workflow's own commit, so the promote.py that runs matches the promote.yml that
      # calls it. A workflow_run always runs master's copy of this file.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          # The walk, and decide's Removes-Object lines, read master back to prod's commit.
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup  # zizmor: ignore[self-repository] -- see the action's header

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      # `cosign verify` inside `decide` passes no credentials of its own and reads the docker
      # config, and the package is private until the operator makes it public.
      - name: Log in to GHCR read-only
        env:
          GH_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
        run: printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin

      # GITHUB_TOKEN reads the registry, the check-runs, the statuses and the commit-to-PR
      # lookup. GH_TOKEN is PROMOTE_TOKEN, for the `gh variable get DEPLOY_HOLD` inside
      # `decide`, and for the `gh variable set` that writes T's SHA when T fails the
      # forward-only gate. That read goes through the API when
      # `decide` runs, not through the `vars` context, so a hold written after this run
      # started is still seen.
      - name: Decide
        id: decide
        env:
          TRIGGER: ${{ inputs.sha || github.event.workflow_run.head_sha || github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ secrets.PROMOTE_TOKEN }}
        run: >-
          uv run --frozen python scripts/deploy_tools/promote.py decide
          --trigger "$TRIGGER" --bundle-dir "$RUNNER_TEMP/verify-input"

      # The two bundles `decide` pulled before anything moved, and its record of `prod`'s
      # statuses. `verify` reads them, so it waits on T's own changed set rather than on the
      # render of the commit that triggered, and excuses only a dependent already failing.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ steps.decide.outputs.verdict == 'promote' }}
        with:
          name: verify-input
          path: ${{ runner.temp }}/verify-input/
          if-no-files-found: error
          retention-days: 7

      # D5.1d's hold is written inside Decide, so it posts here rather than from `post`. This
      # step carries the webhook and no token, and Decide carries PROMOTE_TOKEN and no webhook,
      # so no code that posts can write DEPLOY_HOLD. A failed post fails the run.
      - name: Post the suspended-changed hold
        if: ${{ steps.decide.outputs.suspended_hold != '' }}
        env:
          HOLD: ${{ steps.decide.outputs.suspended_hold }}
          DEPLOY_DISCORD_WEBHOOK: ${{ secrets.DEPLOY_DISCORD_WEBHOOK }}
        run: >-
          uv run --frozen python scripts/deploy_tools/promote.py hold "${HOLD%% *}"
          --hold "$HOLD"

  tag:
    needs: promote
    # !cancelled() and the result, because a skipped publish on the scheduled run would skip
    # this job too: GitHub's implicit success() reads every ancestor, not only `promote`.
    if: >-
      !cancelled() &&
      needs.promote.result == 'success' &&
      needs.promote.outputs.verdict == 'promote' &&
      !inputs.verify_drill &&
      github.ref == 'refs/heads/master' && (
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' || (
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master' &&
      github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    concurrency:
      group: promote
      cancel-in-progress: false
    permissions:
      packages: write
    # `verify` and `settle` run only once `prod` has moved, whatever else this job did.
    outputs:
      moved: ${{ steps.move.outputs.moved }}
      moved_at: ${{ steps.move.outputs.moved_at }}
    steps:
      - uses: fluxcd/flux2/action@b9c17924adb533d3617ec7de97a7b0f4acc07b39 # v2.9.6
        with:
          # renovate: datasource=github-releases depName=fluxcd/flux2
          version: v2.9.6

      # The commit and digest come from `decide`, never from the trigger: the commit `prod`
      # moves to is the newest published one, which need not be the one whose CI ran.
      #
      # `prod` moves only if it still names the digest `decide` read. Another run's `promote`
      # can decide while this run's `tag` waits on the group, so two runs can each read the
      # same `prod`. The first `tag` moves it; the second finds it moved, moves nothing, and
      # verifies nothing, rather than moving `prod` past a T that the first run's `verify`
      # still waits on. `tag` jobs share the `promote` group, so the read and the move are
      # never interleaved with another run's. The DECIDED marker in promote_lib/verify_promotion.py
      # has the other half, `decide`'s wait.
      #
      # The first verified run seeds `last-good`: when `decide` read no `last-good`, the step
      # tags `prod`'s digest with it before `prod` moves, so a failed verification has a
      # verified revision to reset to.
      #
      # DEPLOY_HOLD is read again just before the move (D7.1). A `settle` can write a hold
      # while this job waits on the group, and a move after it would promote past the hold.
      # Anything but `none`, a failed read included, moves nothing.
      - name: Move prod
        id: move
        env:
          TARGET: ${{ needs.promote.outputs.target }}
          DIGEST: ${{ needs.promote.outputs.digest }}
          SEED: ${{ needs.promote.outputs.seed }}
          PRIOR_DIGEST: ${{ needs.promote.outputs.prior_digest }}
          GH_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ secrets.PROMOTE_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$TARGET" | grep -Eqx '[0-9a-f]{40}' \
            || { echo "::error::decide's target '$TARGET' is not 40 lowercase hex"; exit 1; }
          printf '%s' "$DIGEST" | grep -Eqx 'sha256:[0-9a-f]{64}' \
            || { echo "::error::decide's digest '$DIGEST' is not sha256:<64 hex>"; exit 1; }

          hold="$(gh variable get DEPLOY_HOLD -R "$GITHUB_REPOSITORY")" \
            || { echo "::error::DEPLOY_HOLD could not be read, so this run moves nothing"; exit 1; }
          if [ "$hold" != none ]; then
            echo "::warning::DEPLOY_HOLD reads '$hold', written after decide read it, so this run moves nothing and verifies nothing"
            exit 0
          fi

          # prod's live digest, from one HEAD. curl reads each credential from stdin.
          name=danielh2018/homelab-manifests
          token="$(printf 'user = "%s:%s"\n' "$GH_ACTOR" "$GITHUB_TOKEN" \
            | curl --retry 3 -fsS -K - \
              "https://ghcr.io/token?scope=repository:$name:pull&service=ghcr.io" \
            | jq -r '.token // empty')"
          [ -n "$token" ] || { echo "::error::ghcr.io issued no pull token for $name"; exit 1; }
          heads="$RUNNER_TEMP/prod-head.txt"
          status="$(printf 'header = "Authorization: Bearer %s"\n' "$token" \
            | curl --retry 3 -sS -K - -I -o "$heads" -w '%{http_code}' \
              -H 'Accept: application/vnd.oci.image.manifest.v1+json, application/vnd.oci.image.index.v1+json' \
              "https://ghcr.io/v2/$name/manifests/prod")"
          case "$status" in
            200) live="$(tr -d '\r' < "$heads" | awk 'tolower($1) == "docker-content-digest:" { print $2 }')" ;;
            404) live="" ;;
            *) echo "::error::HEAD prod answered HTTP $status"; exit 1 ;;
          esac
          if [ "$live" != "$PRIOR_DIGEST" ]; then
            echo "::warning::prod is at '${live:-absent}', not the '${PRIOR_DIGEST:-absent}' decide read: another run moved it first, so this run moves nothing and verifies nothing. The run that moved it dispatches one more run once it settles, when a commit newer than its own is green."
            exit 0
          fi

          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
          repo=ghcr.io/danielh2018/homelab-manifests
          if [ "$SEED" = true ]; then
            printf '%s' "$PRIOR_DIGEST" | grep -Eqx 'sha256:[0-9a-f]{64}' \
              || { echo "::error::decide read no prod digest to seed last-good from"; exit 1; }
            flux tag artifact "oci://$repo@$PRIOR_DIGEST" --tag last-good
            echo "seeded last-good at prod's digest $PRIOR_DIGEST"
          fi
          # Stamped before the move, so no status Flux posts for this promotion predates it.
          # verify ignores any older status on T, such as one an earlier promotion left.
          moved_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          flux tag artifact "oci://$repo:sha-$TARGET" --tag prod
          printf 'moved=true\nmoved_at=%s\n' "$moved_at" >> "$GITHUB_OUTPUT"

      # A failed write leaves PROD_DIGEST behind prod, which the deploy-pipeline exporter pages
      # on from slice D2: the safe direction.
      - name: Record prod's digest
        if: ${{ steps.move.outputs.moved == 'true' }}
        env:
          DIGEST: ${{ needs.promote.outputs.digest }}
          GH_TOKEN: ${{ secrets.PROMOTE_TOKEN }}
        run: gh variable set PROD_DIGEST --body "$DIGEST" -R "$GITHUB_REPOSITORY"

  verify:
    needs: [promote, tag]
    # always() so the job is weighed even when `tag` failed after the move, such as on a
    # failed PROD_DIGEST write: once `prod` has moved, T is verified.
    if: >-
      always() &&
      needs.tag.outputs.moved == 'true' &&
      !inputs.verify_drill &&
      github.ref == 'refs/heads/master' && (
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' || (
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master' &&
      github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-26.04
    # Above the cap on every derived timeout (chained_timeout.py:VERIFY_CAP_S, 330
    # minutes), so `verify` prints `failed` with the names before this limit stops it, and with
    # settle's below decide's in-flight wait. A job killed at this limit leaves no verdict,
    # which settle holds as unverified.
    timeout-minutes: 335
    # No concurrency group: a pending job in `promote` can be evicted. `decide` waits while
    # `prod` differs from `last-good` instead (the DECIDED marker in promote_lib/verify_promotion.py).
    # packages: read is for `prod`'s digest, which ends the wait as `superseded` once a later
    # run has moved it past T (D7.2, promote_lib/superseded.py).
    permissions:
      contents: read
      statuses: read
      packages: read
    outputs:
      verdict: ${{ steps.verify.outputs.verdict }}
      failed: ${{ steps.verify.outputs.failed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: ./.github/actions/setup  # zizmor: ignore[self-repository] -- see the action's header

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verify-input
          path: ${{ runner.temp }}/verify-input

      # T is `decide`'s target, never the triggering commit: Flux posts statuses only on the
      # commit `prod` names, so waiting on another one would time out into a false hold.
      - name: Verify
        id: verify
        env:
          TARGET: ${{ needs.promote.outputs.target }}
          PRIOR: ${{ needs.promote.outputs.prior }}
          MOVED_AT: ${{ needs.tag.outputs.moved_at }}
          DIGEST: ${{ needs.promote.outputs.digest }}
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          uv run --frozen python scripts/deploy_tools/promote.py verify "$TARGET"
          --bundle-dir "$RUNNER_TEMP/verify-input" --prior "$PRIOR" --moved-at "$MOVED_AT"
          --digest "$DIGEST"

  settle:
    needs: [promote, tag, verify]
    # always() so a verify that failed, timed out or was cancelled still settles: once `prod`
    # has moved, anything but a good verdict holds.
    if: >-
      always() &&
      needs.tag.outputs.moved == 'true' &&
      !inputs.verify_drill &&
      github.ref == 'refs/heads/master' && (
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' || (
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master' &&
      github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      packages: write
      actions: write  # the dispatch step's, which starts the next promote run
    outputs:
      # Set once the stateful hold is written, and read by `post`.
      stateful_hold: ${{ steps.apply.outputs.stateful_hold }}
    steps:
      - uses: fluxcd/flux2/action@b9c17924adb533d3617ec7de97a7b0f4acc07b39 # v2.9.6
        with:
          # renovate: datasource=github-releases depName=fluxcd/flux2
          version: v2.9.6

      # Contract C2: good moves `last-good` to T. Anything else writes the hold FIRST, so a
      # failed reset still stops the next promotion, then resets `prod` to the digest `decide`
      # read for `last-good` and records it in PROD_DIGEST. A failed hold write still attempts
      # the reset, and the step names both results. A verify that ended with no verdict holds
      # as `<T> unverified`, a form the revert rule never passes.
      #
      # A hold without a reset (H1.1b): when `decide` named forward-only tags T changes
      # against `last-good`, anything but good writes DEPLOY_HOLD as T's SHA alone, never
      # `failed=` or `unverified`, and leaves `prod` on T. A reset would re-apply an older
      # Longhorn or MetalLB over upgraded objects. It then tags T's digest `held`, which
      # `decide`'s in-flight wait reads once the operator clears the hold.
      #
      # The stateful hold (D5.2b1): when `decide` named snapshot roles T changes, anything but
      # good writes DEPLOY_HOLD as `<T> stateful=<names>`, or `<T> stateful=unverified` when
      # verify left no usable names, tags T `held` and leaves `prod`. A reset would apply the
      # old image onto data T may have migrated. It comes before the forward-only branch, so a
      # T that changes both writes the stateful form, which also never resets. The value goes
      # to the `stateful_hold` output once written, and the `post` job posts it.
      - name: Apply the verdict
        id: apply
        env:
          TARGET: ${{ needs.promote.outputs.target }}
          DIGEST: ${{ needs.promote.outputs.digest }}
          RESET_DIGEST: ${{ needs.promote.outputs.reset_digest }}
          CLEARS_HOLD: ${{ needs.promote.outputs.clears_hold }}
          NO_RESET: ${{ needs.promote.outputs.no_reset }}
          STATEFUL: ${{ needs.promote.outputs.stateful }}
          VERDICT: ${{ needs.verify.outputs.verdict }}
          FAILED_NAMES: ${{ needs.verify.outputs.failed }}
          GH_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ secrets.PROMOTE_TOKEN }}
        run: |
          set -uo pipefail
          printf '%s' "$TARGET" | grep -Eqx '[0-9a-f]{40}' \
            || { echo "::error::decide's target '$TARGET' is not 40 lowercase hex"; exit 1; }
          repo=ghcr.io/danielh2018/homelab-manifests
          login() { printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin; }

          # A verdict on T counts only while `prod` still names T's digest (D7.1). Once a
          # later run has moved `prod` past T, that run owns the cluster, and this one writes
          # neither `last-good`, the hold, `held` nor the reset, and dispatches nothing.
          # `live_prod` is the `tag` job's HEAD of `prod`. It prints the digest, nothing when
          # the tag is absent, and fails when the read fails.
          live_prod() {
            local name=danielh2018/homelab-manifests token heads status
            token="$(printf 'user = "%s:%s"\n' "$GH_ACTOR" "$GITHUB_TOKEN" \
              | curl --retry 3 -fsS -K - \
                "https://ghcr.io/token?scope=repository:$name:pull&service=ghcr.io" \
              | jq -r '.token // empty')" || return 1
            [ -n "$token" ] || return 1
            heads="$RUNNER_TEMP/prod-head.txt"
            status="$(printf 'header = "Authorization: Bearer %s"\n' "$token" \
              | curl --retry 3 -sS -K - -I -o "$heads" -w '%{http_code}' \
                -H 'Accept: application/vnd.oci.image.manifest.v1+json, application/vnd.oci.image.index.v1+json' \
                "https://ghcr.io/v2/$name/manifests/prod")" || return 1
            case "$status" in
              200) tr -d '\r' < "$heads" | awk 'tolower($1) == "docker-content-digest:" { print $2 }' ;;
              404) ;;
              *) return 1 ;;
            esac
          }
          # A failed read keeps today's behaviour, the safe direction: a hold stops promotion,
          # and a later run that verifies moves `last-good` again.
          owns_prod() {
            local live
            if ! live="$(live_prod)"; then
              echo "::warning::prod's digest could not be read, so this run applies its verdict as the owner"
              return 0
            fi
            [ "$live" = "$DIGEST" ] && return 0
            echo "prod is at '${live:-absent}', not sha-$TARGET's $DIGEST: a later run moved it, so this run writes nothing and dispatches nothing"
            return 1
          }
          # `verify` already read `prod` past T, so its verdict is not this run's to apply,
          # even when the read below would fail.
          if [ "$VERDICT" = superseded ]; then
            echo "verify read prod moved past sha-$TARGET, so this run writes nothing and dispatches nothing"
            echo "owned=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! owns_prod; then
            echo "owned=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "owned=true" >> "$GITHUB_OUTPUT"

          if [ "$VERDICT" = good ]; then
            if ! { login && flux tag artifact "oci://$repo:sha-$TARGET" --tag last-good; }; then
              echo "::error::moving last-good to sha-$TARGET failed"
              exit 1
            fi
            echo "last-good moved to sha-$TARGET"
            if [ "$CLEARS_HOLD" = true ]; then
              gh variable set DEPLOY_HOLD --body none -R "$GITHUB_REPOSITORY" \
                || { echo "::error::the revert rule's clear of DEPLOY_HOLD failed"; exit 1; }
              echo "DEPLOY_HOLD cleared by the revert rule"
            fi
            exit 0
          fi

          if [ -n "$STATEFUL" ]; then
            if [ "$VERDICT" = failed ] && printf '%s' "$FAILED_NAMES" | grep -Eqx '[a-z0-9-]+(,[a-z0-9-]+)*'; then
              hold="$TARGET stateful=$FAILED_NAMES"
            else
              hold="$TARGET stateful=unverified"
            fi
            if ! gh variable set DEPLOY_HOLD --body "$hold" -R "$GITHUB_REPOSITORY"; then
              echo "::error::writing DEPLOY_HOLD='$hold' failed, so prod stays on sha-$TARGET untagged and nothing posts"
              exit 1
            fi
            echo "stateful_hold=$hold" >> "$GITHUB_OUTPUT"
            echo "DEPLOY_HOLD set to '$hold': T changes snapshot role(s) $STATEFUL, so prod stays on sha-$TARGET"
            if ! { login && flux tag artifact "oci://$repo:sha-$TARGET" --tag held; }; then
              echo "::error::tagging sha-$TARGET held failed, so the next run after a clear waits as in flight"
              exit 1
            fi
            exit 0
          fi

          if [ -n "$NO_RESET" ]; then
            # `held` marks prod's run as settled, so it is tagged only once the hold is
            # written. With no hold, the next run's in-flight wait ends `current` instead.
            if ! gh variable set DEPLOY_HOLD --body "$TARGET" -R "$GITHUB_REPOSITORY"; then
              echo "::error::writing DEPLOY_HOLD='$TARGET' failed, so prod stays on sha-$TARGET untagged"
              exit 1
            fi
            echo "DEPLOY_HOLD set to '$TARGET': T changes forward-only $NO_RESET, so prod stays on sha-$TARGET"
            if ! { login && flux tag artifact "oci://$repo:sha-$TARGET" --tag held; }; then
              echo "::error::tagging sha-$TARGET held failed, so the next run after a clear waits as in flight"
              exit 1
            fi
            exit 0
          fi

          if [ "$VERDICT" = failed ] && printf '%s' "$FAILED_NAMES" | grep -Eqx '[a-z0-9-]+(,[a-z0-9-]+)*'; then
            hold="$TARGET failed=$FAILED_NAMES"
          else
            hold="$TARGET unverified"
          fi
          problems=()
          if gh variable set DEPLOY_HOLD --body "$hold" -R "$GITHUB_REPOSITORY"; then
            echo "DEPLOY_HOLD set to '$hold'"
          else
            problems+=("writing DEPLOY_HOLD='$hold' failed")
          fi
          if ! printf '%s' "$RESET_DIGEST" | grep -Eqx 'sha256:[0-9a-f]{64}'; then
            problems+=("decide read no last-good digest to reset to, so prod stays on sha-$TARGET")
          # Read again: the hold write takes seconds, and a reset after a later run's move
          # would undo that move.
          elif ! owns_prod; then
            :
          elif login && flux tag artifact "oci://$repo@$RESET_DIGEST" --tag prod; then
            echo "prod reset to $RESET_DIGEST"
            gh variable set PROD_DIGEST --body "$RESET_DIGEST" -R "$GITHUB_REPOSITORY" \
              || problems+=("prod moved to $RESET_DIGEST, and recording PROD_DIGEST failed")
          else
            problems+=("resetting prod to $RESET_DIGEST failed, so prod stays on sha-$TARGET")
          fi
          for problem in "${problems[@]}"; do echo "::error::$problem"; done
          [ "${#problems[@]}" -eq 0 ]

      # A run whose `tag` found `prod` already moved verifies nothing, so its commit would wait
      # for the next merge (#5022). Once the verdict is applied, this step dispatches one more
      # run when CI's newest green push run on master is for a commit newer than T. The list is
      # newest first, so "newer" means T's own run sits further down it. With T outside the list
      # the step cannot tell, and dispatches nothing. The bound: a dispatched run that promotes
      # that commit finds it equal to its own T here, and one that decides anything else never
      # reaches `settle`. After a hold the step still dispatches, as the operator ruled: the run
      # decides `held` unless the revert rule lets it promote a descendant.
      #
      # GitHub starts no run for an event GITHUB_TOKEN causes, except workflow_dispatch, so the
      # job token dispatches and PROMOTE_TOKEN gains no scope. GH_TOKEN is set here because `gh`
      # prefers it to GITHUB_TOKEN. The `sha` input sends the run through render's ancestry and
      # CI re-check, which a bare dispatch of master's tip would skip.
      - name: Dispatch a run for a newer green commit
        # A run that a later run superseded dispatches nothing; the later run owns the dispatch.
        if: steps.apply.outputs.owned == 'true'
        env:
          TARGET: ${{ needs.promote.outputs.target }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$TARGET" | grep -Eqx '[0-9a-f]{40}' \
            || { echo "::error::decide's target '$TARGET' is not 40 lowercase hex"; exit 1; }
          # A command substitution, so set -e stops the step when the read fails.
          green="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=master&event=push&status=success&per_page=100" \
            --jq '.workflow_runs[].head_sha')"
          newest="${green%%$'\n'*}"
          if ! printf '%s' "$newest" | grep -Eqx '[0-9a-f]{40}'; then
            echo "::error::CI's newest green push run on master names '$newest', not a 40-hex commit"
            exit 1
          fi
          if [ "$newest" = "$TARGET" ]; then
            echo "$TARGET is master's newest green commit, so no run follows"
            exit 0
          fi
          # A here-string, not a pipe: `grep -q` exiting early would SIGPIPE a writer, and
          # pipefail would read the match as a miss.
          if ! grep -qx "$TARGET" <<< "$green"; then
            echo "::warning::$TARGET has no green CI run among master's newest 100, so this run cannot tell whether $newest is newer, and dispatches nothing"
            exit 0
          fi
          gh workflow run promote.yml -R "$GITHUB_REPOSITORY" --ref master -f sha="$newest"
          echo "dispatched promote for $newest, master's newest green commit, which is newer than $TARGET"

  post:
    needs: [promote, tag, verify, settle]
    # always() so the post still goes out when `settle` wrote the stateful hold and then
    # failed to tag T `held`. `stateful_hold` is set only once the hold is written.
    if: >-
      always() &&
      needs.settle.outputs.stateful_hold != '' &&
      !inputs.verify_drill &&
      github.ref == 'refs/heads/master' && (
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' || (
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master' &&
      github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    # Repo code runs here, so the job holds no token that writes: `settle` wrote the hold, and
    # the post reads `decide`'s record from the artifact rather than from the registry.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: ./.github/actions/setup  # zizmor: ignore[self-repository] -- see the action's header

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verify-input
          path: ${{ runner.temp }}/verify-input

      # The record `decide` wrote beside the bundles names each changed snapshot role's digest8
      # and claims and `sha-<T>`'s digest. The webhook is the repository secret
      # DEPLOY_DISCORD_WEBHOOK, a copy of the SOPS value gitops_deploy_discord_webhook, and
      # promote.py never prints it.
      - name: Post the stateful hold
        env:
          TARGET: ${{ needs.promote.outputs.target }}
          HOLD: ${{ needs.settle.outputs.stateful_hold }}
          VERDICT: ${{ needs.verify.outputs.verdict }}
          FAILED_NAMES: ${{ needs.verify.outputs.failed }}
          DEPLOY_DISCORD_WEBHOOK: ${{ secrets.DEPLOY_DISCORD_WEBHOOK }}
        run: >-
          uv run --frozen python scripts/deploy_tools/promote.py hold "$TARGET"
          --hold "$HOLD" --bundle-dir "$RUNNER_TEMP/verify-input"
          --verdict "$VERDICT" --failed "$FAILED_NAMES"

  # The `reset_to_last_good` dispatch (D5.2b2): move `prod` back to `last-good` and do nothing
  # else, for the revert runbook's Branch 1 and the broken-sync-object runbook. It follows C2's
  # split: `reset-check` decides with read tokens, and `reset-move` writes with no checkout.
  # Both run in `promote-reset`, never `promote`: in `promote` the reset would wait behind a
  # `decide` in its in-flight wait, up to 6 hours, and the next merge's run would evict it while
  # pending. `reset-check`'s refusal while a verification is in flight replaces the
  # serialisation a shared group would give (promote_lib/reset.py). The reset ignores the
  # reboot window: it moves `prod` back to a revision the cluster already ran.
  reset-check:
    if: >-
      inputs.reset_to_last_good &&
      github.ref == 'refs/heads/master' &&
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    concurrency:
      group: promote-reset
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
      actions: read  # the in-progress promote runs a refusal names
    outputs:
      move: ${{ steps.check.outputs.move }}
      prod: ${{ steps.check.outputs.prod }}
      last_good: ${{ steps.check.outputs.last_good }}
    steps:
      - name: Refuse a reset combined with another input
        env:
          VERIFY_DRILL: ${{ inputs.verify_drill }}
          SHA: ${{ inputs.sha }}
        run: |
          if [ "$VERIFY_DRILL" = true ] || [ -n "$SHA" ]; then
            echo "::error::reset_to_last_good moves prod to last-good and does nothing else, so dispatch it without verify_drill or sha"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: ./.github/actions/setup  # zizmor: ignore[self-repository] -- see the action's header

      # GITHUB_TOKEN reads GHCR and the run list. GH_TOKEN is PROMOTE_TOKEN, for the
      # `gh variable get DEPLOY_HOLD` read through the API, as in Decide.
      - name: Check the reset
        id: check
        env:
          RUN_ID: ${{ github.run_id }}
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ secrets.PROMOTE_TOKEN }}
        run: uv run --frozen python scripts/deploy_tools/promote.py reset-check --run-id "$RUN_ID"

  reset-move:
    needs: reset-check
    if: >-
      needs.reset-check.outputs.move == 'true' &&
      inputs.reset_to_last_good &&
      github.ref == 'refs/heads/master' &&
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    concurrency:
      group: promote-reset
      cancel-in-progress: false
    permissions:
      packages: write
    steps:
      - uses: fluxcd/flux2/action@b9c17924adb533d3617ec7de97a7b0f4acc07b39 # v2.9.6
        with:
          # renovate: datasource=github-releases depName=fluxcd/flux2
          version: v2.9.6

      # The same compare-and-move as `tag`'s: `prod` moves only while it still names the digest
      # `reset-check` read. A live `prod` already on `last-good`, as after `settle`'s own reset
      # landed first, succeeds and moves nothing. Any other digest means a run moved `prod`
      # after the read, so nothing moves and the step names both.
      - name: Move prod to last-good
        id: move
        env:
          PROD: ${{ needs.reset-check.outputs.prod }}
          LAST_GOOD: ${{ needs.reset-check.outputs.last_good }}
          GH_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for digest in "$PROD" "$LAST_GOOD"; do
            printf '%s' "$digest" | grep -Eqx 'sha256:[0-9a-f]{64}' \
              || { echo "::error::reset-check handed on digest '$digest', not sha256:<64 hex>"; exit 1; }
          done

          # prod's live digest, from one HEAD. curl reads each credential from stdin.
          name=danielh2018/homelab-manifests
          token="$(printf 'user = "%s:%s"\n' "$GH_ACTOR" "$GITHUB_TOKEN" \
            | curl --retry 3 -fsS -K - \
              "https://ghcr.io/token?scope=repository:$name:pull&service=ghcr.io" \
            | jq -r '.token // empty')"
          [ -n "$token" ] || { echo "::error::ghcr.io issued no pull token for $name"; exit 1; }
          heads="$RUNNER_TEMP/prod-head.txt"
          status="$(printf 'header = "Authorization: Bearer %s"\n' "$token" \
            | curl --retry 3 -sS -K - -I -o "$heads" -w '%{http_code}' \
              -H 'Accept: application/vnd.oci.image.manifest.v1+json, application/vnd.oci.image.index.v1+json' \
              "https://ghcr.io/v2/$name/manifests/prod")"
          case "$status" in
            200) live="$(tr -d '\r' < "$heads" | awk 'tolower($1) == "docker-content-digest:" { print $2 }')" ;;
            *) echo "::error::HEAD prod answered HTTP $status"; exit 1 ;;
          esac
          if [ "$live" = "$LAST_GOOD" ]; then
            echo "prod already names last-good $LAST_GOOD, so nothing moves"
            exit 0
          fi
          if [ "$live" != "$PROD" ]; then
            echo "::error::prod is at '$live', not the $PROD reset-check read nor last-good $LAST_GOOD: a run moved it after the read, so nothing moves. Read prod and last-good again, then dispatch again."
            exit 1
          fi

          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
          flux tag artifact "oci://ghcr.io/$name@$LAST_GOOD" --tag prod
          echo "prod moved from $PROD to last-good $LAST_GOOD"
          echo "moved=true" >> "$GITHUB_OUTPUT"

      # A failed write leaves PROD_DIGEST ahead of prod, which the deploy-pipeline exporter
      # pages on, as after `tag`'s move.
      - name: Record prod's digest
        if: ${{ steps.move.outputs.moved == 'true' }}
        env:
          DIGEST: ${{ needs.reset-check.outputs.last_good }}
          GH_TOKEN: ${{ secrets.PROMOTE_TOKEN }}
        run: gh variable set PROD_DIGEST --body "$DIGEST" -R "$GITHUB_REPOSITORY"
