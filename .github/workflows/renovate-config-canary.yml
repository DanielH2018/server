name: renovate-config-canary

# Validates renovate.json against a freshly-resolved (unpinned) Renovate once a day, so a
# config the hosted Mend app has stopped accepting is caught within a day rather than only
# when renovate.json is next touched. The reasoning for validating unpinned is on the
# `renovate-config` job in ci.yml, which runs the same script on a PR that touches the file.
# It also checks Renovate's extract of master against scripts/validate/renovate_expected_deps.tsv,
# which catches a Renovate release that reads a file differently on a day nothing changed.
#
# This does not run on every push to master. Mend rolls its Renovate forward on its own cadence
# and deprecates config keys a release ahead, so per-merge buys nothing over daily. Renovate
# publishes to npm ~8 times a day and the tarball 404s for a few minutes after each publish. The
# script retries the install, and a daily run lands in one of those windows rarely.
#
# A red run here is on whatever SHA is master's head at 09:00 UTC, not that commit's verdict. No
# deploy gate reads this context (`ci_required_contexts` names only the prek gate), and it is
# not a required merge context; the PR-scoped job in ci.yml is.
#
# It is its own workflow because a `schedule:` on ci.yml would run hooks, pytest and the gate as
# well, and would share the head SHA's concurrency group with that commit's push run. Its own
# group below is keyed on the workflow name alone, so it never joins a ci.yml group.
on:
  schedule:
    - cron: "0 9 * * *" # 04:00 America/Chicago; nobody is landing, so a red run is not mistaken for a red merge
  workflow_dispatch: # after touching renovate.json on master, or when a Renovate major lands

# One run at a time; the superseded run is cancelled, not queued, because no run here is a commit's
# verdict.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: validate renovate.json against latest Renovate
    runs-on: ubuntu-26.04
    timeout-minutes: 20 # six install attempts at 60s, plus a wedged fetch
    env:
      # Skips pyproject.toml's `lint` group, which no step here runs (test_ci_lint_group.py).
      UV_NO_GROUP: lint
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false # nothing here pushes; the repo is public, so the fetch needs no token

      # The pinned Node, from the action ci.yml's `renovate-config` job uses, so the two run
      # Renovate under one Node release. Python and uv run the extract's checker.
      - uses: $/.github/actions/setup
        with:
          python: "true"
          uv: "true"
          node: "true"

      - name: Validate renovate.json and check Renovate's extract
        run: scripts/validate/renovate_config.sh validate extract
