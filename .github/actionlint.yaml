# actionlint config. https://github.com/rhysd/actionlint/blob/main/docs/config.md
#
# `ubuntu-26.04` is a GitHub-HOSTED runner label, not a self-hosted one. actionlint's hard-coded
# hosted-label list (`rule_runner_label.go`) stops at `ubuntu-24.04` on actionlint 1.7.12, the
# newest release actionlint-py ships, so the `Lint GitHub Actions workflows` prek hook reports
# `label "ubuntu-26.04" is unknown`. `self-hosted-runner.labels` adds the label to the known
# set and leaves every other runner-label check armed.
#
# Drop this file once actionlint's hosted-label list carries `ubuntu-26.04`: a hosted label
# declared as self-hosted hides a real typo in it.
self-hosted-runner:
  labels:
    - ubuntu-26.04
