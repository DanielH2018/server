name: Install the tools the test suite runs
description: >-
  sops, age, apt-utils and the dotfiles packages, which the suite's tests run and import. The
  one place those installs live, so ci.yml's pytest legs and the nightly sweep in
  pytest-sweep.yml cannot drift apart.

# The caller checks the repository out first: the sops pin is read from the checkout.
#
# DECIDED: the steps below name actions by version tag with `zizmor: ignore[unpinned-uses]`,
# for the reason .github/actions/setup/action.yml gives.

runs:
  using: composite
  steps:
    # `cluster_vars.py write`'s tests (target slice D3) run the real sops against a throwaway
    # age key, and they fail rather than skip without it. The step reads the hosts' pin, the
    # amd64 `version` and `sha256` of `sops` in homelab-tools' package.yml, as the
    # sops_manifest_type_proof job does, so a sops bump has no CI copy to move. Renovate moves
    # the version and the digest together there. age comes from apt, as the hosts install it.
    # apt-utils is for the repository signer's tests, which drive apt-ftparchive as the
    # signer does on daniel-box (hosts/lib/tests/test_repo_signer.py).
    #
    # Nothing here needs root. pinned-tool puts sops in $RUNNER_TEMP/bin. The two packages'
    # /usr/bin binaries go to ~/.local/bin, which the runner image has on PATH and the step
    # checks, and `apt-get download` with `dpkg-deb -x` unpacks the packages. Stale package
    # lists are refreshed into a directory under $RUNNER_TEMP, which apt then reads in place of
    # /var/lib/apt/lists.
    #
    # The download runs once per runner image version: an apt-get install took a median 4.1s
    # of a leg's 28s outside `Run the test suite`. The unpacked binaries are cached
    # under a key that carries the image version, because they link against the image's own
    # libraries. A copy that does not run falls back to the download, as does a runner that
    # sets no `ImageVersion`.
    - name: Read the runner image version
      id: image
      shell: bash
      run: echo "version=${ImageVersion:-}" >> "$GITHUB_OUTPUT"
    - name: Cache the age and apt-utils binaries
      if: steps.image.outputs.version != ''
      uses: actions/cache@v6.1.0 # zizmor: ignore[unpinned-uses]
      with:
        path: ${{ runner.temp }}/pinned/apt-tools
        key: apt-tools-unpacked-${{ runner.os }}-${{ steps.image.outputs.version }}
    - name: Read the sops pin
      id: sops
      shell: bash
      run: |
        set -euo pipefail
        tools=hosts/packages/homelab-tools/package.yml
        sops_version=$(awk '/^  sops:/ {s=1} s && /version:/ {print $2; exit}' "$tools")
        sops_sha256=$(awk '/^  sops:/ {s=1} s && /sha256:/ {print $2; exit}' "$tools")
        [ -n "$sops_version" ] && [ -n "$sops_sha256" ]
        echo "version=$sops_version" >> "$GITHUB_OUTPUT"
        echo "sha256=$sops_sha256" >> "$GITHUB_OUTPUT"
    - name: Fetch the pinned sops and check its sha256
      uses: $/.github/actions/pinned-tool
      with:
        tool: sops
        version: ${{ steps.sops.outputs.version }}
        sha256: ${{ steps.sops.outputs.sha256 }}
    - name: Install age and apt-utils for the tests
      shell: bash
      run: |
        set -euo pipefail
        bin="$HOME/.local/bin"
        mkdir -p "$bin"
        apt_tools="$RUNNER_TEMP/pinned/apt-tools"
        cached_apt_tools_run() {
          [[ -x "$apt_tools/age-keygen" && -x "$apt_tools/apt-ftparchive" ]] \
            && "$apt_tools/age-keygen" --version > /dev/null \
            && "$apt_tools/apt-ftparchive" --version > /dev/null
        }
        if cached_apt_tools_run; then
          echo "age and apt-utils: cached"
        else
          debs=$(mktemp -d)
          lists="$RUNNER_TEMP/apt-lists"
          private=(-o "Dir::State::Lists=$lists/lists" -o "Dir::Cache=$lists/cache" -o Debug::NoLocking=1)
          download() { (cd "$debs" && apt-get "$@" download age apt-utils); }
          download || {
            mkdir -p "$lists/lists/partial" "$lists/cache/archives/partial"
            apt-get -q "${private[@]}" update && download "${private[@]}"
          }
          for deb in "$debs"/*.deb; do dpkg-deb -x "$deb" "$debs/root"; done
          mkdir -p "$apt_tools"
          cp "$debs"/root/usr/bin/* "$apt_tools"/
        fi
        install -m 0755 "$apt_tools"/* "$bin"/
        [ "$(command -v age-keygen)" = "$bin/age-keygen" ]
        age-keygen --version
        command -v apt-ftparchive
    # The Bash hooks split commands with the dotfiles repo's `claude_guard` package, and
    # `lib.worktrees` binds this repo onto its `claude_worktree` library, which also holds the
    # worktree pruner. A host gets both from `chezmoi apply`;
    # this step lays the same two directories out where a host has them, so the bootstraps
    # (`.claude/hooks/_claude_guard.py`, `scripts/lib/_claude_worktree.py`) import them
    # unchanged. Both packages are plain files under `home/dot_local/share/` in that repo,
    # so no chezmoi render is needed. The fetch lands in $RUNNER_TEMP rather than in the
    # workspace, where an untracked tree would show up in the git-status tests. The repo is
    # public, so the fetch needs no token.
    #
    # DOTFILES_SHA is a pin, not `main`: tracking the branch would turn the suite red on an
    # unrelated dotfiles commit. The `git-refs` custom manager in renovate.json proposes each
    # bump as its own PR, and matches the literal below.
    - name: Deploy the dotfiles packages the hooks and the pruner import
      shell: bash
      env:
        DOTFILES_SHA: 87d9c3b9e7fc17d7d8cd95dd107d320be7c9c3e9
      run: |
        set -euo pipefail
        src="$RUNNER_TEMP/dotfiles"
        git init --quiet "$src"
        git -C "$src" fetch --quiet --depth 1 https://github.com/DanielH2018/dotfiles "$DOTFILES_SHA"
        git -C "$src" checkout --quiet FETCH_HEAD
        mkdir -p "$HOME/.local/share"
        ln -s "$src/home/dot_local/share/claude-guard" "$HOME/.local/share/claude-guard"
        ln -s "$src/home/dot_local/share/claude-worktree" "$HOME/.local/share/claude-worktree"
    # Test modules skip when one of these binaries is missing, so a runner without one passes
    # them as skips and its run cannot be set beside a hosted run's. Each is in the hosted
    # image; a runner pod's base image owes the same list. tests/repo/test_ci_baseline_binaries.py
    # holds BASELINE against every skip gate in the suite.
    - name: Fail on a missing binary the suite skips without
      shell: bash
      env:
        BASELINE: apt-config logger node perl rsync sshd systemd-analyze systemd-tmpfiles visudo
      run: |
        set -euo pipefail
        read -ra bins <<< "$BASELINE"
        missing=()
        for bin in "${bins[@]}"; do
          command -v "$bin" > /dev/null || missing+=("$bin")
        done
        if (( ${#missing[@]} )); then
          echo "::error::not on PATH: ${missing[*]}. The tests gated on them would pass as skips."
          exit 1
        fi
        echo "${#bins[@]} baseline binaries on PATH"
