name: Set up the CI toolchain
description: >-
  Python, uv, the Ansible collections cache, prek and Node, each behind an input. The one place
  a CI job's toolchain pins live, so a Renovate bump edits one line rather than one per job.

# Every pin below is a LITERAL in a step, never an input default. renovate.json's python, node
# and prek custom managers match the quoted value after the `python-version` and `node-version`
# keys and the version after `pip install prek==`; a `default:` would read as none of them and
# age silently. That is also why no job can ask for a different version: a second version is a
# second pin, the duplication this action exists to remove.
#
# The pins are three-part. A two-part `python-version:` or `node-version:` resolves the patch
# from whatever the runner image's toolcache holds that day, while a three-part one moves only
# through Renovate.
#
# The caller checks the repository out first. The steps below read the checkout (uv.lock,
# prek.toml), and each job's checkout differs anyway (fetch-depth).
#
# DECIDED: callers write `uses: $/.github/actions/setup`, which pins this action to the
# workflow's own commit, and the `actionlint` prek hook runs through
# scripts/validate/actionlint_dollar_refs.py (2026-11-12). actionlint 1.7.12 rejects `$/` as
# "ref is missing" and then skips checking the caller's `with:` keys against the inputs below
# (rhysd/actionlint#711). The wrapper lints a copy rewritten to `./`. Once an actionlint release
# accepts `$/`, point the hook back at `uv run --frozen actionlint` and delete the wrapper and
# its test. The pin costs every job a download of this repository's tarball during `Set up
# job`, a median 2.3s on pytest legs (0.9s to 2.7s), accepted on 2026-11-15; a `./` reference
# reads the job's checkout and downloads nothing.
#
# DECIDED: the steps below name actions by version tag with `zizmor: ignore[unpinned-uses]`
# `.github/workflows/actions.lock` pins each one under every workflow that calls this
# action, and the ci.yml `lockfile` job verifies those pins. zizmor 1.32.0 applies the lockfile
# to workflow files only, so it reads this file as unpinned. Drop the ignores once zizmor reads
# the lockfile for a `$/` composite action.

inputs:
  python:
    description: Install the pinned Python.
    default: "true"
  uv:
    description: Install uv with its download cache keyed on uv.lock. Needs `python`.
    default: "true"
  prek-cache-key:
    description: >-
      Install the pinned prek and cache its hook environments under this key prefix. Empty
      skips prek. Each job passes its own prefix, because two jobs building different hook
      environments under one key overwrite each other's entry every run.
    default: ""
  node:
    description: Install the pinned Node.
    default: "false"

runs:
  using: composite
  steps:
    # All apt mirrors are ubuntu.com names, so one DNS outage fails them all; a runner that refuses
    # sudo keeps its list.
    - name: Add a non-ubuntu.com apt mirror as the last fallback
      shell: bash
      env:
        MIRRORS: /etc/apt/apt-mirrors.txt
      run: |
        if [[ -f "$MIRRORS" ]] && ! grep -q mirrors.edge.kernel.org "$MIRRORS"; then
          sudo -n sed -i '$a https://mirrors.edge.kernel.org/ubuntu/' "$MIRRORS" \
            || echo "::notice::no sudo here, so $MIRRORS keeps its ubuntu.com hosts only"
        fi

    - if: inputs.python == 'true'
      uses: actions/setup-python@v7.1.0  # zizmor: ignore[unpinned-uses]
      with:
        python-version: "3.15.2"

    - name: Install uv
      if: inputs.uv == 'true'
      uses: astral-sh/setup-uv@v10.4.0  # zizmor: ignore[unpinned-uses]
      with:
        # The action keys the uv cache on uv.lock.
        enable-cache: true
        # The cache saves only on a miss, so jobs sharing the full key would leave lint jobs a
        # partial entry.
        cache-suffix: ${{ env.UV_NO_DEV == '1' && 'runtime' || env.UV_NO_GROUP == 'lint' && 'test' || 'dev' }}

    # pyproject.toml forces PyYAML's libyaml extension, so a source build needs these headers.
    - name: Install libyaml headers
      if: inputs.uv == 'true'
      shell: bash
      run: dpkg -s libyaml-dev >/dev/null 2>&1 || { sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libyaml-dev; }

    # Whichever job finishes first writes the cache entry, so every job syncs the whole profile.
    - name: Sync the uv environment
      if: inputs.uv == 'true'
      shell: bash
      run: uv sync --frozen --compile-bytecode

    # Only the env dirs are cached: prek's own download cache is redundant once the envs are
    # restored. restore-keys is safe because env dirs are content-addressed.
    - name: Cache prek hook environments
      if: inputs.prek-cache-key != ''
      uses: actions/cache@v6.1.0  # zizmor: ignore[unpinned-uses]
      with:
        path: |
          ~/.cache/prek/repos
          ~/.cache/prek/hooks
          ~/.cache/prek/tools
        key: ${{ inputs.prek-cache-key }}-${{ runner.os }}-${{ hashFiles('prek.toml') }}
        restore-keys: |
          ${{ inputs.prek-cache-key }}-${{ runner.os }}-
          prek-${{ runner.os }}-

    - name: Install prek
      if: inputs.prek-cache-key != ''
      shell: bash
      run: pip install prek==0.5.11  # pinned for a reproducible hook toolchain; Renovate (pypi) bumps it

    - if: inputs.node == 'true'
      uses: actions/setup-node@v7.1.0  # zizmor: ignore[unpinned-uses]
      with:
        node-version: "26.13.1"
