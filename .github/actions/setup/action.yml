name: Set up the CI toolchain
description: >-
  Python, uv, the Ansible collections cache, prek and Node, each behind an input. The one place
  a CI job's toolchain pins live, so a Renovate bump edits one line rather than one per job.

# Every pin below is a LITERAL in a step, never an input default. renovate.json's python, node
# and prek custom managers match the quoted value after the `python-version` and `node-version`
# keys and the version after `pip install prek==`; a `default:` would read as none of them and
# age silently. That is also why
# no job can ask for a different version: a second version is a second pin, which is the
# duplication this action exists to remove.
#
# The pins are three-part. A two-part `python-version:` or `node-version:` resolves the patch
# from whatever the runner image's toolcache holds that day, while a three-part one moves only
# through Renovate.
#
# The caller checks the repository out first. The steps below read the checkout (uv.lock,
# prek.toml, ansible/requirements.yml), and each job's checkout differs anyway (fetch-depth).
#
# DECIDED: callers write `uses: $/.github/actions/setup`, which pins this action to the
# workflow's own commit, and the `actionlint` prek hook runs through
# scripts/validate/actionlint_dollar_refs.py (2026-11-12). actionlint 1.7.12 rejects `$/` as
# "ref is missing" and then skips checking the caller's `with:` keys against the inputs below
# (rhysd/actionlint#711). The wrapper lints a copy rewritten to `./`. Once an actionlint release
# accepts `$/`, point the hook back at `uv run --frozen actionlint` and delete the wrapper and
# its test.

inputs:
  python:
    description: Install the pinned Python.
    default: "true"
  uv:
    description: Install uv with its download cache keyed on uv.lock. Needs `python`.
    default: "true"
  galaxy:
    description: Restore and save the Ansible collections cache (ansible/collections).
    default: "false"
  prek-cache-key:
    description: >-
      Install the pinned prek and cache its hook environments under this key prefix. Empty
      skips prek. Each job passes its own prefix, because two jobs building different hook
      environments under one key overwrite each other's entry every run.
    default: ""
  node:
    description: Install the pinned Node.
    default: "false"

runs:
  using: composite
  steps:
    # apt reads every pocket through mirror+file:/etc/apt/apt-mirrors.txt and tries each listed
    # host in turn. All of them are ubuntu.com names, so one DNS outage fails them all (#7957).
    - name: Add a non-ubuntu.com apt mirror as the last fallback
      shell: bash
      run: |
        mirrors=/etc/apt/apt-mirrors.txt
        if [[ -f "$mirrors" ]] && ! grep -q mirrors.edge.kernel.org "$mirrors"; then
          sudo sed -i '$a https://mirrors.edge.kernel.org/ubuntu/' "$mirrors"
        fi

    - if: inputs.python == 'true'
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
      with:
        python-version: "3.15.2"

    - name: Install uv
      if: inputs.uv == 'true'
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3  # no floating major tag is published; pin the exact release
      with:
        # Most prek hooks shell out to `uv run`, which resolves the `dev` and `lint` groups
        # (ansible-core, pytest, docker, flask, ruff, ty, shellcheck-py) before the first one
        # executes. Without this the download is repaid on every run. Keyed on uv.lock by
        # the action itself, so a lock change invalidates it exactly.
        enable-cache: true
        # The cache saves only on a miss, so a UV_NO_DEV or UV_NO_GROUP=lint job sharing the
        # full key would leave every lint job a partial entry to re-download around.
        cache-suffix: ${{ env.UV_NO_DEV == '1' && 'runtime' || env.UV_NO_GROUP == 'lint' && 'test' || 'dev' }}

    # pyproject.toml forces PyYAML's libyaml extension, so a source build (an interpreter
    # PyYAML ships no wheel for) needs these headers or fails.
    - name: Install libyaml headers
      if: inputs.uv == 'true'
      shell: bash
      run: dpkg -s libyaml-dev >/dev/null 2>&1 || { sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libyaml-dev; }

    # Whichever job finishes first writes the cache entry, so every job syncs the whole
    # profile here, even one that never runs `uv`. UV_NO_DEV and UV_NO_GROUP still narrow it.
    # `--compile-bytecode` prints the cold compile line shard_weight_gate.py:leg_speed reads.
    - name: Sync the uv environment
      if: inputs.uv == 'true'
      shell: bash
      run: uv sync --frozen --compile-bytecode

    # Several ansible/tests read the Galaxy collections, and the ansible-lint hook's own entry
    # runs `ansible-galaxy collection install` before linting — warm that is a 0.4s no-op, cold
    # a ~40 MB download. One key for every job that asks, so they share one entry.
    - name: Cache Ansible collections
      if: inputs.galaxy == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ansible/collections
        key: galaxy-${{ runner.os }}-${{ hashFiles('ansible/requirements.yml') }}

    # prek bootstraps one isolated environment per remote hook repo whenever its cache is
    # cold — uncached, that is every CI run. Worth ~14s in the `hooks` job (the step measured
    # 141s before these caches and 127s after). It is much cheaper on the runner than it is on
    # a workstation: the `gitleaks` hook is `language = "golang"`, and where daniel-box has no
    # Go and makes prek fetch a ~270 MB managed toolchain to build gitleaks from source (220s
    # cold, for a scan that takes 0.05s), the runner image ships Go preinstalled and prek uses
    # it. Hence a 45 MB cache rather than a 350 MB one.
    #
    # Only the environment dirs are cached. `~/.cache/prek/cache` is prek's own pip/uv
    # DOWNLOAD cache — pure redundancy once the envs it built are themselves restored, and
    # (~500 MB on a machine that does fetch a toolchain) large enough that carrying it would
    # eat the saving in transfer time.
    #
    # restore-keys is safe because prek's env dirs are content-addressed
    # (hooks/<language>-<hash>): a stale entry from an older prek.toml is ignored rather than
    # reused, so a partial hit still lets the UNCHANGED hooks skip their rebuild when one rev
    # bumps. The fresh key then saves the union. The second restore-key reaches the `hooks`
    # job's `prek-` entry, so a job with its own prefix still gets a warm start on a branch
    # where its own entry does not exist yet; for the `hooks` job it repeats the first.
    - name: Cache prek hook environments
      if: inputs.prek-cache-key != ''
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cache/prek/repos
          ~/.cache/prek/hooks
          ~/.cache/prek/tools
        key: ${{ inputs.prek-cache-key }}-${{ runner.os }}-${{ hashFiles('prek.toml') }}
        restore-keys: |
          ${{ inputs.prek-cache-key }}-${{ runner.os }}-
          prek-${{ runner.os }}-

    - name: Install prek
      if: inputs.prek-cache-key != ''
      shell: bash
      run: pip install prek==0.5.10  # pinned for a reproducible hook toolchain; Renovate (pypi) bumps it

    - if: inputs.node == 'true'
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version: "26.13.0"
