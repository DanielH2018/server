# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

# Every hook runs at commit time and at no other stage. A hook without `stages` runs at EVERY
# stage, so a stale `.git/hooks/pre-push` shim left by an older `prek install` would re-run all
# of them over the pushed range, fixers included. Setting this here covers every checkout and
# any future shim; a hook that genuinely belongs at another stage sets its own `stages`.
#
# default_stages does NOT reach a hook whose upstream manifest declares `stages` itself, and
# pre-commit-hooks v6.0.0 lists `[pre-commit, pre-push, manual]` on three of ours. So every hook
# from a remote repo repeats `stages = ["pre-commit"]`, which also covers a manifest that gains
# `stages` on a Renovate bump. ENFORCED: the `every-remote-prek-hook-pins-the-commit-stage` row in tests/repo/_config_rows.py
default_stages = ["pre-commit"]

# Without `commit-msg` in the list, the reject-robot-emoji hook never runs.
default_install_hook_types = ["pre-commit", "commit-msg"]

# Standard cleanup hooks
[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"

[[repos.hooks]]
id = "trailing-whitespace"
stages = ["pre-commit"]
# A vendored upstream manifest is pinned byte for byte to a sha256, so no fixer may rewrite it.
exclude = "^k8s/roles/[^/]+/files/upstream/"

[[repos.hooks]]
id = "end-of-file-fixer"
stages = ["pre-commit"]
exclude = "^k8s/roles/[^/]+/files/upstream/"

[[repos.hooks]]
id = "check-yaml"
stages = ["pre-commit"]
# Allowing multiple documents repo-wide would pass a stray `---` in every other file, so the one
# stream is excluded.
exclude = "^k8s/roles/(flux/files/gotk-components\\.yaml$|[^/]+/files/upstream/)"

[[repos.hooks]]
# Guards renovate.json (a syntax error there silently disables ALL dependency management)
# and every other JSON in the repo (Grafana dashboards, settings).
id = "check-json"
stages = ["pre-commit"]

[[repos.hooks]]
id = "check-toml"
stages = ["pre-commit"]

[[repos.hooks]]
id = "check-merge-conflict"
stages = ["pre-commit"]

[[repos.hooks]]
# The M6 plan grew past the 500 KB cap through edits, which this hook never sees; only its
# move into the archive reads as an add. It is history, so nothing grows it further.
id = "check-added-large-files"
stages = ["pre-commit"]
exclude = "^docs/archive/monitoring/m6-retire-kuma\\.md$"

[[repos.hooks]]
id = "mixed-line-ending"
stages = ["pre-commit"]
args = ["--fix=lf"]
exclude = "^k8s/roles/[^/]+/files/upstream/"

# Secret scanning
[[repos]]
repo = "https://github.com/gitleaks/gitleaks"
rev = "v8.30.1"

[[repos.hooks]]
id = "gitleaks"
stages = ["pre-commit"]

# Shell script linting. shellcheck-py ships a precompiled shellcheck binary via pip
# (language = python) — no host apt package and no Docker, so it works unmodified on the
# ubuntu-latest CI runner via prek's own hook-env bootstrap. All severities are on by
# default (not just --severity=error): the repo's shell scripts are currently
# shellcheck-clean, so there's nothing to suppress yet. OPTIONAL (off-by-default) rules
# are a separate axis: the triaged accept/exclude policy for them lives in .shellcheckrc,
# which also silences `shellcheck -o all` sweeps (rc disables win over -o all).
[[repos]]
repo = "https://github.com/shellcheck-py/shellcheck-py"
rev = "v0.11.0.1"

[[repos.hooks]]
id = "shellcheck"
stages = ["pre-commit"]

# Render every non-k8s template family with stubbed vars and check the output with the tool that
# reads it: the Pi's compose files as YAML plus their hardening rules, every *.sh.j2 with bash -n
# and shellcheck, every systemd unit (templates and the host packages' units) with
# systemd-analyze verify and the polkit rules with node --check, and every other host component
# template for a variable nothing defines. check-yaml, shellcheck and bash-syntax-check never see
# a `.j2`, so without this hook a broken render first fails on a host. shellcheck comes via the
# `shellcheck-py` dev dependency, and the run fails closed when shellcheck or systemd-analyze is
# missing. `scripts/validate/render_templates.py` names the families and their modules.
[[repos]]
repo = "local"

[[repos.hooks]]
id = "validate-render-templates"
name = "Validate rendered compose, shell, unit, host component and k8s manifest templates"
entry = "uv run --frozen python scripts/validate/render_templates.py"
language = "system"
# Serial, so a full sweep is one invocation and not one per argv batch.
require_serial = true
# The `scripts/lib/k8s_*.py` modules are named one by one: a rename makes an alternation fail loudly
# and a pattern match nothing.
files = "^(hosts/.*|scripts/lib/longhorn_lib/longhorn_backups\\.py|k8s/services\\.yml|scripts/renderer/(renderer_lib/[^/]+|shadow_diff)\\.py|scripts/renderer/template_filters/[^/]+\\.py|scripts/deploy_tools/(chained_timeout|changed_set|kustomizations)\\.py|scripts/validate/validate_lib/(ok_lines|shipped_render|shell_lint|k8s_net_rules|k8s_schema|host_specs)\\.py|scripts/validate/(render_templates|render_lib/(compose|k8s|setup_plane|shell|units))\\.py|k8s/templates/[^/]+\\.yml\\.j2|k8s/roles/.*\\.j2|k8s/roles/[^/]+/defaults/main\\.yml|scripts/validate/schemas/(kubernetes\\.io|traefik\\.io)/.*\\.json|scripts/lib/plain_scalar\\.py|(hosts/([^/]+/)?vars|estate/vars|k8s/vars)\\.yml|secrets/secret_rotation\\.yml|scripts/lib/(container_entry|inventory_lists|guard_jinja_env|host_modules|cli_help|exit_codes|estate|git|jinja_comments|k8s_conditions|k8s_context|k8s_lookups|k8s_objects|k8s_role_callers|k8s_roles|k8s_yaml|render_context|render_guard|repo_paths|role_files|yaml_fast)\\.py)$"

[[repos.hooks]]
id = "validate-ha-config"
name = "Validate Home Assistant config"
entry = "uv run --frozen python scripts/home_assistant/validate_ha_config.py"
language = "system"
pass_filenames = false
files = "^(k8s/roles/home-assistant/(templates/config|files)/.*|scripts/home_assistant/validate_ha_config\\.py|scripts/diagnostics/probe_lib/(core|ha|obs_api)\\.py|scripts/home_assistant/(ha_state_checks|ha_state_model)\\.py|scripts/lib/(container_entry|estate|git|inventory_lists|cli_help|exit_codes|render_guard|repo_paths|role_files|yaml_fast)\\.py)$"

[[repos.hooks]]
id = "validate-grafana-dashboards"
name = "Validate Grafana dashboard datasource uids"
entry = "uv run --frozen python scripts/validate/grafana_dashboard_uids.py"
language = "system"
pass_filenames = false
files = "^(k8s/roles/observability/files/dashboards/.*\\.json|k8s/roles/observability/templates/grafana\\.yaml\\.j2|scripts/validate/grafana_dashboard_uids\\.py|scripts/lib/(cli_help|exit_codes|repo_paths)\\.py)$"

# Check the alert plane's inputs with the tools that load them. promtool checks the rendered
# prometheus.yml, every rule file and every rule test; amtool checks the Alertmanager config;
# pint lints the rule files offline under scripts/validate/pint/offline.hcl.
# lokitool parses loki-homelab's LogQL rule files, and the hook fails when those files,
# loki_homelab_rule_groups and the rendered loki-homelab-rules ConfigMap disagree. alloy boots
# the pinned Alloy on loki-homelab's rendered config.alloy, because Alloy's parser rejects
# selectors that Loki accepts and `alloy validate` does not build the components.
# scripts/validate/alert_tools.sh provisions promtool and amtool at the observability role's
# image tags, lokitool and alloy at loki-homelab's, and pint at its own pin, into alert-tools/ under the
# git common dir, shared by every worktree of the clone. CI's `alert_rules.py --prove-red` step
# is the tools' red proof.
#
# The `files` regex names every input the hook reads, because a PR run skips a hook no
# changed file matches: the role's rule, rule-test and Alertmanager sources and the templates
# that render them; loki-homelab's rule files, their ConfigMap template and its defaults, which
# list the groups and pin lokitool's version; the pint configs; its defaults, whose image tags
# set the tool versions; the inventory and
# the scrape_jobs filter, which feed prometheus.yml's loops; and the render's import closure,
# as validate-render-templates names it. pass_filenames = false, so prek runs one instance and
# never races two provisions.
[[repos.hooks]]
id = "validate-alert-rules"
name = "Validate the alert plane and the Alloy config with promtool, amtool, pint, lokitool and alloy"
entry = "uv run --frozen python scripts/validate/alert_rules.py"
language = "system"
pass_filenames = false
files = "^(hosts/lib/host_lib\\.py|scripts/lib/longhorn_lib/longhorn_backups\\.py|k8s/services\\.yml|scripts/renderer/(renderer_lib/[^/]+|shadow_diff)\\.py|scripts/deploy_tools/(chained_timeout|changed_set|kustomizations)\\.py|scripts/lib/plain_scalar\\.py|k8s/roles/observability/(files/rules|tests/rules|files/alertmanager|tests/alertmanager)/.*|k8s/roles/loki-homelab/(files/rules/.*|templates/(rules-)?configmap\\.yaml\\.j2|templates/config/config\\.alloy\\.j2|defaults/main\\.yml)|k8s/roles/observability/templates/(prometheus|prometheus-rules|alertmanager|alertmanager-secret)\\.yaml\\.j2|k8s/roles/observability/defaults/main\\.yml|(hosts/([^/]+/)?vars|estate/vars|k8s/vars)\\.yml|scripts/renderer/template_filters/[^/]+\\.py|scripts/validate/alert_.*|scripts/validate/notification_renders\\.py|scripts/validate/pint/.*|scripts/validate/render_lib/k8s\\.py|scripts/validate/validate_lib/(ok_lines|k8s_net_rules|k8s_schema|rule_test_parts)\\.py|scripts/lib/(container_entry|inventory_lists|guard_jinja_env|host_modules|cli_help|exit_codes|estate|git|jinja_comments|k8s_conditions|k8s_context|k8s_lookups|k8s_objects|k8s_role_callers|k8s_roles|k8s_yaml|render_context|render_guard|repo_paths|role_files|yaml_fast)\\.py)$"

# Flag bash's `${#var}` length expansion in a Jinja template, before anything renders it. `{#`
# opens a Jinja comment, so a shell script inside a `.j2` that writes `${#var}` either fails the
# render with `Missing end of comment tag` (a message naming neither bash nor a fix) or, when a
# `#}` appears later, has everything between the two silently dropped from the output. The
# render-then-lint hooks above cannot see either case: the first never renders, and the second
# renders with the evidence already deleted. This one scans template TEXT, across every `.j2` in
# the tree rather than one validator's own subtree.
[[repos.hooks]]
id = "validate-jinja-bash-collisions"
name = "Flag bash ${#var} length expansions in Jinja templates"
entry = "uv run --frozen python scripts/validate/jinja_bash_collisions.py"
language = "system"
pass_filenames = false
# This reads template text and renders nothing, so no inventory or defaults file is in scope.
files = "^(k8s/.*\\.j2|scripts/validate/jinja_bash_collisions\\.py|scripts/lib/(cli_help|exit_codes|repo_paths)\\.py)$"

# A hidden file is never staged, so no `files` pattern can trigger this: it runs on every commit.
[[repos.hooks]]
id = "validate-root-ignored-files"
name = "Root-level files hidden by .gitignore's deny-all"
entry = "uv run --frozen python scripts/validate/root_ignored_files.py"
language = "system"
pass_filenames = false
always_run = true

# Lint the GitHub Actions workflows themselves. `check-yaml` above only proves they PARSE —
# nothing else checks that a job's `needs:` names a job that exists, that a `${{ }}`
# expression references a real context, or that a matrix key is spelled the way the steps read
# it. Those fail at trigger time, in a workflow whose whole job is to be the gate. actionlint
# also runs shellcheck over every `run:` block (shellcheck-py is already a dev dep, so it is on
# PATH under `uv run`), which the shellcheck hook above cannot do — identify tags a workflow as
# yaml, so the shell embedded in it is invisible to a shell-typed hook.
#
# Via the actionlint-py package + `uv run`, matching the other local hooks, NOT the upstream
# rhysd/actionlint pre-commit repo: that hook is `language = "golang"`, which on a machine
# without Go (daniel-box) makes prek fetch a ~270 MB managed toolchain and build from source.
#
# It reads `.github/actionlint.yaml`, which declares the one hosted runner label actionlint's
# own hard-coded list does not carry yet. That file says which, and when to delete it.
#
# The entry is a wrapper, not actionlint itself: actionlint 1.7.12 rejects the
# `uses: $/.github/actions/setup` callers and skips their input checks, so the wrapper lints a
# copy rewritten to `./`. The `# DECIDED:` marker in .github/actions/setup/action.yml says when
# to call actionlint directly again. A change to the action or to the wrapper's own modules
# re-lints every workflow, so the hook passes no filenames.
[[repos.hooks]]
id = "actionlint"
name = "Lint GitHub Actions workflows"
entry = "uv run --frozen python scripts/validate/actionlint_dollar_refs.py"
language = "system"
files = "^(\\.github/(workflows/[^/]+\\.ya?ml|actions/.*|actionlint\\.yaml)|scripts/validate/actionlint_dollar_refs\\.py|scripts/lib/(cli_help|exit_codes|git|repo_paths)\\.py)$"
pass_filenames = false

# The wrapper's red proof runs the real actionlint binary, which only the `lint` group installs.
# CI's pytest shards skip that group and so skip the two tests; this hook runs them in the hooks
# job, which has it.
[[repos.hooks]]
id = "actionlint-red-proof"
name = "The actionlint wrapper still flags an undefined input on a $/ caller"
entry = "uv run --frozen pytest -q -n0 -p no:cacheprovider scripts/validate/tests/repo_checks/test_validate_actionlint_dollar_refs.py"
language = "system"
pass_filenames = false
files = "^(\\.github/actions/.*|scripts/validate/(tests/repo_checks/test_validate_)?actionlint_dollar_refs\\.py|scripts/lib/(cli_help|exit_codes|git|repo_paths)\\.py|uv\\.lock)$"

# The security half of workflow linting, which actionlint does not do: a checkout that leaves
# the token on disk, a `${{ }}` expression injected into a `run:` shell, an unpinned action, a
# `pull_request_target` reading the PR head. Offline audits
# only: the online ones ask GitHub's API and would need a token on every commit. It also audits
# the local composite actions under .github/actions/, which actionlint does not lint at all.
[[repos.hooks]]
id = "zizmor"
name = "Audit GitHub Actions workflows (zizmor)"
entry = "uv run --frozen zizmor --no-progress --no-online-audits"
language = "system"
files = "^\\.github/(workflows/[^/]+|actions/[^/]+/action)\\.ya?ml$"

# Read-only: reads plaintext key NAMES only, never decrypts a value, so it is CI-safe.
[[repos.hooks]]
id = "secret-rotation-registry-sync"
name = "Secret-rotation registry in sync with secrets.yml"
entry = "uv run --frozen python scripts/secrets_mgmt/secret_rotation.py audit --check"
language = "system"
pass_filenames = false
# The whole `scripts/secrets_mgmt/` tree, because a per-file list goes stale on the next split; the
# rest is the import closure of `audit --check`.
files = "^(secrets/secrets\\.yml|secrets/secret_rotation\\.yml|scripts/secrets_mgmt/.*\\.py|scripts/lib/(cli_help|exit_codes|git|k8s_lookups|repo_paths|yaml_fast)\\.py)$"

# Only `cluster_vars.py write` writes these files, so the hook runs checks needing no render or key.
[[repos.hooks]]
id = "cluster-vars-ciphertext"
name = "Cluster SOPS files are ciphertext written by cluster_vars.py"
entry = "uv run --frozen python scripts/secrets_mgmt/cluster_vars.py check --no-render --base HEAD"
language = "system"
pass_filenames = false
files = "^(secrets/cluster-|scripts/renderer/template_filters/[^/]+\\.py$|hosts/lib/host_lib\\.py$|scripts/(lib|renderer|secrets_mgmt)/.+\\.py$|scripts/deploy_tools/(chained_timeout|changed_set|kustomizations)\\.py$)"

# Assert uv.lock stays consistent with pyproject.toml. Every unattended production path
# (promote.yml, secret-rotation-audit) runs `uv run --frozen`, which installs
# the committed lock AS-IS and never re-resolves — so a pyproject edit merged without a refreshed
# lock reaches the host as an environment missing the dependency it needs, surfacing later as a
# confusing import failure (a failed promotion, or `SecretRotationAuditFailed` firing).
# Every `uv run` hook in this file carries `--frozen` too, so the gate resolves from the
# same lock production does rather than silently regenerating one in the ephemeral checkout;
# what `--frozen` cannot do is notice the drift, which is this hook's job: `uv lock --check`
# (read-only; exits non-zero on drift, never writes) mirrors the prod invariant at commit time.
# Renovate's weekly lockFileMaintenance refreshes the lock but is NOT a same-commit gate, so a
# human pyproject edit is the open escape hatch this closes.
[[repos.hooks]]
id = "uv-lock-check"
name = "uv.lock in sync with pyproject.toml"
entry = "uv lock --check"
language = "system"
pass_filenames = false
files = "^(pyproject\\.toml|uv\\.lock)$"

# Rewrites a role CLAUDE.md's generated `## At a glance` block in the commit that moves one of
# its sources, and fails like a formatter so the author stages the doc and commits again
# (a stale block otherwise fails
# test_every_deployed_role_block_matches_what_the_generator_writes_now in CI, which stays as
# the backstop for a commit that skipped prek).
#
# `files` is every input the generator reads: the roles, the inventory, the shared templates
# whose macros declare claims, the template filter it imports, and the Python under scripts/docs and
# scripts/lib. A role CLAUDE.md matches too, so a hand edit inside the
# markers is reverted in the same commit. None of the docs-refresh cron's three staged paths
# match, so that cron's commit never writes under k8s/roles/. Renovate edits defaults
# without prek, but only an image tag or digest, which the block does not print.
[[repos.hooks]]
id = "regen-role-glance"
name = "Role At a glance blocks match their sources"
entry = "uv run --frozen python scripts/docs/gen_role_glance.py --fix"
language = "system"
pass_filenames = false
files = "^(hosts/lib/host_lib\\.py|scripts/lib/longhorn_lib/longhorn_backups\\.py|k8s/services\\.yml|(k8s|estate)/.*|hosts/([^/]+/)?vars\\.yml|scripts/renderer/template_filters/.*|hosts/components/.*|hosts/[^/]+/package\\.yml|hosts/packages/.*|secrets/secret_rotation\\.yml|scripts/(docs|lib)/.*\\.py|scripts/renderer/renderer_lib/.*\\.py|scripts/deploy_tools/(chained_timeout|changed_set|kustomizations)\\.py)$"

# Fails like a formatter so the author stages the fragment and commits again.
[[repos.hooks]]
id = "regen-doc-fragments"
name = "Docs fragments match their sources"
entry = "uv run --frozen python scripts/docs/gen_doc_fragments.py --fix"
language = "system"
pass_filenames = false
files = "^(hosts/lib/host_lib\\.py|scripts/lib/longhorn_lib/longhorn_backups\\.py|k8s/services\\.yml|(k8s|estate)/.*|hosts/([^/]+/)?vars\\.yml|scripts/renderer/template_filters/.*|hosts/components/.*|hosts/[^/]+/(package|vars)\\.yml|secrets/secret_rotation\\.yml|scripts/.*\\.py|docs/assets/generated/fragments/.*)$"

# Its own hook, not a mode of `regen-doc-fragments`, so the cron cannot rewrite a doc by mistake.
[[repos.hooks]]
id = "regen-doc-values"
name = "Stated values in docs match the tree"
entry = "uv run --frozen python scripts/docs/doc_values.py"
language = "system"
pass_filenames = false
files = '''(?x)^(
  \.claude/rules/generated-docs\.md
  | \.claude/skills/renovate-prs/SKILL\.md
  | \.claude/skills/worktree-cleanup/SKILL\.md
  | k8s/services\.yml
  | docs/claude-tooling\.md
