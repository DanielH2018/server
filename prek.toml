[[repos.hooks]]
id = "static-ratchet-tests-lander"
name = "Lander deadlines cover the soak"
entry = "uv run --frozen pytest -q -n0 -p no:cacheprovider hosts/tests/repo_crons/test_lander_deadlines_cover_the_soak.py"
language = "system"
pass_filenames = false
files = "^(k8s/services\\.yml|\\.github/workflows/promote\\.yml|estate/.*|k8s/vars\\.yml|hosts/([^/]+/)?vars\\.yml|k8s/roles/[^/]+/(tasks|templates|defaults|files)/.*|hosts/lib/.*\\.py|hosts/components/(claude-code|renovate-agent|gh-quota)/.*|scripts/renderer/template_filters/[^/]+\\.py|scripts/(deploy_tools|renderer|lib|secrets_mgmt|validate)/.*\\.py|scripts/diagnostics/probe_lib/(core|host_reader|obs_api|health_checkout)\\.py|tests/_[^/]+\\.py|hosts/tests/(repo_crons/)?[^/]+\\.py|pyproject\\.toml|uv\\.lock)$"

[[repos.hooks]]
id = "static-ratchet-tests-checksum"
name = "Documented checksum annotations exist in the manifests"
entry = "uv run --frozen pytest -q -n0 -p no:cacheprovider tests/k8s/workloads/test_checksum_annotations_documented.py"
language = "system"
pass_filenames = false
files = "^(hosts/lib/host_lib\\.py|scripts/lib/longhorn_lib/longhorn_backups\\.py|k8s/roles/.*|CLAUDE\\.md|k8s/templates/.*|tests/(_[^/]+|render_share|k8s/workloads/test_checksum_annotations_documented)\\.py|scripts/(deploy_tools|lib|renderer|validate)/.*\\.py|scripts/secrets_mgmt/cluster_vars_check\\.py|pyproject\\.toml|uv\\.lock)$"

[[repos.hooks]]
id = "static-ratchet-tests-shell"
name = "Shell entry points answer --help"
entry = "uv run --frozen pytest -q -n0 -p no:cacheprovider tests/repo/suite/test_shell_entry_points_answer_help.py"
language = "system"
pass_filenames = false
files = "(^(hosts/lib/host_lib|scripts/lib/longhorn_lib/longhorn_backups)\\.py$|^scripts/renderer/renderer_lib/[^/]+\\.py$|^scripts/deploy_tools/(chained_timeout|changed_set|kustomizations)\\.py$|\\.sh(\\.j2)?$|^tests/(_[^/]+|repo/suite/test_shell_entry_points_answer_help)\\.py$|^scripts/(lib|validate|renderer/template_filters)/.*\\.py$|^(pyproject\\.toml|uv\\.lock)$)"

