# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

# Standard cleanup hooks
[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"

[[repos.hooks]]
id = "trailing-whitespace"

[[repos.hooks]]
id = "end-of-file-fixer"

[[repos.hooks]]
id = "check-yaml"

[[repos.hooks]]
# Guards renovate.json (a syntax error there silently disables ALL dependency management)
# and every other JSON in the repo (Grafana dashboards, settings).
id = "check-json"

[[repos.hooks]]
id = "check-added-large-files"

[[repos.hooks]]
id = "mixed-line-ending"
args = ["--fix=lf"]

# Ansible linting
[[repos]]
repo = "https://github.com/ansible/ansible-lint"
rev = "v26.8.0"

[[repos.hooks]]
id = "ansible-lint"
# Scoped to `ansible/` and paired with pass_filenames — ansible-lint now lints the files it is
# GIVEN instead of walking the tree itself. Its cost is almost purely per-file (measured
# 2026-08-14: one task file 1.45s, five 1.98s, the whole repo 37s locally / 89.7s on the
# runner), so handing it a diff is what makes a PR's lint ~2s instead of ~90s.
#
# Coverage is unchanged on a full run. A walk examines 954 files, but exactly 325 of those are
# YAML and all 325 are tracked files under `ansible/` — the rest are .py/.j2/.sh that
# ansible-lint classifies and no ansible rule applies to. That 325 is precisely what this
# files/exclude pair passes.
#
# The regex must do its own excluding: `.ansible-lint`'s exclude_paths are NOT honoured for
# explicitly-passed files (verified — it happily lints `.github/workflows/ci.yml` when named
# directly). `ansible/collections/` needs no exclude here because it is gitignored and prek
# only ever passes tracked files, but secrets.yml is tracked AND encrypted, so it does.
files = "^ansible/.*\\.ya?ml$"
exclude = "^ansible/vars/secrets\\.yml$"
# Cap ansible-core <3 so a surprise upstream major can't silently change lint behavior
# or break this hook on a day nothing in the repo changed (these deps aren't lock-pinned).
additional_dependencies = ["ansible-core>=2.18,<3.0", "jmespath"]
# NB the `--` sentinel and `"$@"`, same as bash-syntax-check below: prek appends the filenames
# to the entry, and after `bash -c '<script>'` those become the SCRIPT's positional params. A
# bare `... && ansible-lint -c .ansible-lint` would silently lint nothing at all.
entry = "bash -c 'ansible-galaxy collection install -r ansible/requirements.yml -p ansible/collections && ansible-lint -c .ansible-lint \"$@\"' --"
pass_filenames = true
# REQUIRED, not a tuning knob. Without it prek shards the filenames across parallel
# invocations — measured at 16 batches of ~21-39 files for a full run, each one re-running the
# `ansible-galaxy install` and paying ansible-lint's startup again, which made `--all-files`
# SLOWER than the walk it replaced (43.8s vs 37.0s) and lints each batch without sight of the
# others. One invocation gets the whole list, and ansible-lint parallelises internally anyway
# (it saturates ~3 cores on its own).
require_serial = true

# Secret scanning
[[repos]]
repo = "https://github.com/gitleaks/gitleaks"
rev = "v8.30.1"

[[repos.hooks]]
id = "gitleaks"

# Shell script linting. shellcheck-py ships a precompiled shellcheck binary via pip
# (language = python) — no host apt package and no Docker, so it works unmodified on the
# ubuntu-latest CI runner via prek's own hook-env bootstrap. All severities are on by
# default (not just --severity=error): the repo's shell scripts are currently
# shellcheck-clean, so there's nothing to suppress yet. OPTIONAL (off-by-default) rules
# are a separate axis: the triaged accept/exclude policy for them lives in .shellcheckrc,
# which also silences `shellcheck -o all` sweeps (rc disables win over -o all).
[[repos]]
repo = "https://github.com/shellcheck-py/shellcheck-py"
rev = "v0.11.0.1"

[[repos.hooks]]
id = "shellcheck"
# .bashrc is a SOURCED dotfile (no shebang by design — `shell(1)` sources it, never execs it) and
# is the stock Debian/Ubuntu skeleton .bashrc plus one guarded nvm block, not a script this gate
# is meant to police. Excluded rather than annotated so the near-stock file stays diffable against
# upstream. The findings it trips are all expected for that class of file: SC2148 (no shebang —
# correct, it's sourced), SC1090/SC1091 (can't follow `~/.bash_aliases` / nvm's dynamic path —
# intentionally conditional/per-host), SC2015 (`test ... && eval || eval` fallback idiom, not
# if/then/else — deliberate here).
exclude = "^ansible/roles/setup/config_files/files/\\.bashrc$"

# Render container docker-compose.yml.j2 templates with stubbed vars and assert
# the output is valid YAML — catches broken indentation / label-macro edits that
# ansible-lint and check-yaml miss (they don't render .j2 files).
[[repos]]
repo = "local"

[[repos.hooks]]
id = "validate-compose-templates"
name = "Validate rendered docker-compose templates"
entry = "uv run python scripts/validate_compose_templates.py"
language = "system"
pass_filenames = false
files = "^(ansible/roles/containers/[^/]+/templates/docker-compose\\.yml\\.j2|ansible/templates/[^/]+\\.yml\\.j2|ansible/inventory/(host_vars/[^/]+|group_vars/all)\\.yml|scripts/validate_compose_templates\\.py)$"

# Structurally validate the Home Assistant config (pure Python, no Docker): YAML syntax,
# duplicate keys, broken !include targets, and a syntax parse-check of inline + custom_templates
# Jinja. Catches authoring errors before a deploy recreates the container. Schema validation
# (hass --script check_config) is intentionally out of scope.
[[repos.hooks]]
id = "validate-ha-config"
name = "Validate Home Assistant config"
entry = "uv run python scripts/validate_ha_config.py"
language = "system"
pass_filenames = false
files = "^(ansible/roles/k8s/home-assistant/(templates/config|files)/.*|scripts/validate_ha_config\\.py)$"

# Validate that every provisioned Grafana dashboard's datasource references resolve to a
# datasource declared in datasources.yml.j2 (uid or name) or a Grafana built-in. Catches the
# silent "No data" / stale-uid class (e.g. a lingering hand-imported uid) before deploy.
[[repos.hooks]]
id = "validate-grafana-dashboards"
name = "Validate Grafana dashboard datasource uids"
entry = "uv run python scripts/validate_grafana_dashboards.py"
language = "system"
pass_filenames = false
files = "^(ansible/roles/k8s/claude-otel/files/dashboards/.*\\.json|ansible/roles/k8s/claude-otel/templates/grafana\\.yaml\\.j2|scripts/validate_grafana_dashboards\\.py)$"

# Render the high-value NON-compose YAML config templates with stubbed vars and assert each
# parses — the render-then-parse guard the compose templates already get
# (validate-compose-templates), extended to the bind-mounted config templates that re-render
# every deploy. Catches a Jinja indentation bug that check-yaml/ansible-lint miss (they don't
# render .j2). The authelia/traefik entries this hook once covered retired at E7 (2026-08-13,
# the Docker edge's removal) and grafana's went with its role — validate-k8s-manifests below
# covers their k8s successors, so CONFIG_TEMPLATES is deliberately empty right now and the
# hook holds the wiring for the next config-bearing template.
[[repos.hooks]]
id = "validate-config-templates"
name = "Validate rendered config templates"
entry = "uv run python scripts/validate_config_templates.py"
language = "system"
pass_filenames = false
# group_vars/all.yml is in scope because the validator renders with it (ALL_VARS) — an
# edit there can change what these templates render to, same as the compose hook's scope.
files = "^(ansible/inventory/group_vars/all\\.yml|scripts/validate_config_templates\\.py)$"

# Same render-then-parse guard as the two above, for the k8s manifests the k3s migration adds.
# Also parses the YAML *embedded* in ConfigMap/Secret values — the manifest wrapping Traefik's
# static config and Authelia's configuration.yml is trivially valid whatever those opaque block
# scalars contain, so an outer-only check would miss the indentation bugs that matter most. A
# broken manifest otherwise first shows up as `error validating data` partway through a kubectl
# apply, with some objects applied and some not.
[[repos.hooks]]
id = "validate-k8s-manifests"
name = "Validate rendered k8s manifest templates"
entry = "uv run python scripts/validate_k8s_manifests.py"
language = "system"
pass_filenames = false
# daniel-box's host_vars is in scope because the validator renders each role with that host's
# real containers_list entry (port, hostname) rather than a stub.
files = "^(ansible/roles/k8s/.*\\.j2|ansible/templates/ingressroute\\.yml\\.j2|ansible/inventory/(group_vars/all|host_vars/daniel-box)\\.yml|scripts/validate_k8s_manifests\\.py)$"

# Render every Jinja-templated shell script (*.sh.j2) with stubbed vars and lint the OUTPUT
# (bash -n + shellcheck) — the same render-then-lint pattern as validate-compose-templates /
# validate-config-templates, but for shell instead of YAML. identify tags a `.sh.j2` file as
# {jinja, text}, never `shell`, so the bash-syntax-check / shellcheck hooks above never see these
# templates no matter how broken the rendered script is. shellcheck comes via the `shellcheck-py`
# dev dependency (pyproject.toml) so `uv run` can reach it; the script fails closed (not skips) if
# shellcheck isn't on PATH, so this can't silently degrade to bash -n alone.
[[repos.hooks]]
id = "validate-shell-templates"
name = "Validate rendered shell templates (bash -n + shellcheck)"
entry = "uv run python scripts/validate_shell_templates.py"
language = "system"
pass_filenames = false
# group_vars/all.yml is in scope because the validator renders with it (ALL_VARS) — an
# edit there can change what the rendered scripts contain.
files = "^(ansible/roles/.*\\.sh\\.j2|ansible/inventory/group_vars/all\\.yml|scripts/validate_shell_templates\\.py)$"

# Lint the GitHub Actions workflows themselves. `check-yaml` above only proves they PARSE —
# nothing until now checked that a job's `needs:` names a job that exists, that a `${{ }}`
# expression references a real context, or that a matrix key is spelled the way the steps read
# it. Those fail at trigger time, in a workflow whose whole job is to be the gate. actionlint
# also runs shellcheck over every `run:` block (shellcheck-py is already a dev dep, so it is on
# PATH under `uv run`), which the shellcheck hook above cannot do — identify tags a workflow as
# yaml, so the shell embedded in it is invisible to a shell-typed hook.
#
# Via the actionlint-py wheel + `uv run`, matching the other local hooks, NOT the upstream
# rhysd/actionlint pre-commit repo: that hook is `language = "golang"`, which on a machine
# without Go (daniel-box) makes prek fetch a ~270 MB managed toolchain and build from source.
[[repos.hooks]]
id = "actionlint"
name = "Lint GitHub Actions workflows"
entry = "uv run actionlint"
language = "system"
files = "^\\.github/workflows/[^/]+\\.ya?ml$"

# Gate that the secret-rotation registry (ansible/secret_rotation.yml) stays in sync with the
# encrypted secrets.yml — fails the commit if a secret was added/removed without running
# `secret_rotation.py sync`. Read-only: reads plaintext key NAMES only, never decrypts a value
# (no age key needed), so it's CI-safe. Catches the drift at commit time instead of a day later
# when the daily "Secret Rotation" Kuma monitor goes down.
[[repos.hooks]]
id = "secret-rotation-registry-sync"
name = "Secret-rotation registry in sync with secrets.yml"
entry = "uv run python scripts/secret_rotation.py audit --check"
language = "system"
pass_filenames = false
files = "^(ansible/vars/secrets\\.yml|ansible/secret_rotation\\.yml|scripts/secret_rotation\\.py)$"

# Assert uv.lock stays consistent with pyproject.toml. Every unattended production path
# (gitops_deploy, secret-rotate, secret-rotation-audit) runs `uv run --frozen`, which ERRORS
# on a stale lock — but prek/CI's plain `uv run` silently regenerates the lock in the ephemeral
# checkout, so a pyproject edit merged WITHOUT a refreshed lock passes CI and only bites later as
# a confusing --frozen failure on the host (a deploy rollback+hold, or the Secret Rotation Kuma
# going stale). `uv lock --check` (read-only; exits non-zero on drift, never writes) mirrors the
# prod invariant at commit time. Renovate's weekly lockFileMaintenance refreshes the lock but is
# NOT a same-commit gate, so a human pyproject edit is the open escape hatch this closes.
[[repos.hooks]]
id = "uv-lock-check"
name = "uv.lock in sync with pyproject.toml"
entry = "uv lock --check"
language = "system"
pass_filenames = false
files = "^(pyproject\\.toml|uv\\.lock)$"

# Run the repo's Python unit tests via uv: the toposort dependency-resolution filters
# (gate every deploy's ordering/scope), the monitor-bridge check logic, the
# auto-approve-readonly Bash classifier (a permission security boundary), and the
# smoke_extract image-diff parser. Deps + test paths come from pyproject.toml (the `dev`
# group + [tool.pytest.ini_options] testpaths); `uv run` auto-syncs from uv.lock, so it
# works regardless of the system Python. Requires uv on PATH (CI installs astral-sh/setup-uv).
[[repos.hooks]]
id = "pytest"
name = "Run Python unit tests (toposort + monitor-bridge + readonly-hook + smoke + gitops)"
entry = "uv run python -m pytest"
language = "system"
pass_filenames = false
# ALWAYS run — no `files` gate. Deliberate, and the one hook here that must not have one.
#
# This hook takes no filenames (pass_filenames = false), so it runs the entire suite whenever it
# fires. A `files` regex therefore buys nothing when the hook runs and costs full coverage when
# it doesn't — not a latency trade, just a gap. That gap became load-bearing when ci.yml started
# scoping PR runs to changed files: the regex this replaces was written as a LOCAL-commit
# convenience, under a premise its own comment stated ("CI runs --all-files regardless"), and the
# scoping change silently promoted it into a CI coverage gate it was never designed to be.
#
# The concrete failure: several tests here discover their own inputs by walking the tree
# (test_validate_shell_templates' pinned roster, test_healthchecks_pings' rglob). A PR adding a
# new *.sh.j2 matched no path in the regex, so pytest never ran, so those tests could not fail on
# the PR that broke them — only on the push to master afterwards. That is how registry-gc.sh.j2
# put master red for six consecutive pushes on 2026-08-15 behind six green PRs.
#
# The regex is not worth repairing. Its comment block had become a ledger of past misses, one
# clause appended per incident — the .ansible-lint/prek.toml pairing, the 2026-07-15 deployer
# brick, gitops config.env.j2, and (added the same day this was removed) setup-role tasks/*.yml
# after the k3s/initial_setup split broke three tests without firing the hook. A list that grows
# an entry every time something escapes is the wrong mechanism, not a list needing one more entry.
# Git history has the full text if the per-path rationale is ever needed again.
#
# Cost of always running: the suite is ~3s locally (-n auto) and ~8-10s on the runner, against a
# CI job that already takes 24-44s. Residual gap, stated honestly: this covers tests under
# [tool.pytest.ini_options] testpaths only — a whole-tree scanner added outside those entries
# still escapes, but that is a short explicit list in pyproject.toml rather than a regex.
always_run = true

# Lint first-party Python for real bugs only — pyflakes (unused imports/undefined names),
# syntax errors, bare-except, ==None/==True (ruleset in pyproject [tool.ruff.lint]; vendored
# collections excluded there). ruff is pinned in uv.lock (dev group) so the gate is
# reproducible and lockFileMaintenance refreshes it weekly. Runs once when any .py is staged.
[[repos.hooks]]
id = "ruff"
name = "Lint first-party Python (ruff)"
entry = "uv run ruff check"
language = "system"
pass_filenames = false
files = "\\.py$"

# Enforce `ruff format` on first-party Python (config in pyproject.toml [tool.ruff], same
# extend-exclude as the linter so vendored collections are untouched). --check fails the commit
# on an unformatted file instead of rewriting it, so a stray editor save can't sneak past CI.
[[repos.hooks]]
id = "ruff-format"
name = "Format first-party Python (ruff format)"
entry = "uv run ruff format --check"
language = "system"
pass_filenames = false
files = "\\.py$"

# Fast syntax-only gate: `bash -n` parses (doesn't run) every shell script. Catches the exact
# bug class that killed the kopia backup-maintenance watchdog cron for a day (2026-07-01,
# ansible/roles/containers/kopia/files/maintenance-check.sh): an apostrophe ("kopia's") landed
# inside a single-quoted `python3 -c '...'` block, breaking bash's own quote parsing. shellcheck
# above would also catch this, but `bash -n` is near-free and independent of it — a belt-and-
# suspenders backstop if the shellcheck-py hook is ever skipped/broken.
# `types = ["shell"]` (identify's shebang-aware detection, same as the shellcheck hook above)
# rather than a `.sh$` files regex — the NUT role's upssched-cmd (files/upssched-cmd, no
# extension: the filename is fixed by upssched's own config) is a real bash script and would be
# silently skipped by an extension-only match.
# NB: `entry` loops over "$@" itself — pre-commit/prek batch every matched filename into ONE
# invocation, and a bare `bash -n "$1" "$2"` silently only checks "$1" ($2+ become that
# script's own positional params, not additional files to parse).
[[repos.hooks]]
id = "bash-syntax-check"
name = "bash -n (shell syntax check)"
entry = "bash -c 'for f in \"$@\"; do bash -n \"$f\" || exit 1; done' --"
language = "system"
types = ["shell"]

# Prose style for the hand-written docs the ADR set introduced. Google's published style
# package plus two homelab rules; see .vale.ini for what is in scope and why.
#
# `files:` repeats .vale.ini's scope rather than trusting it, and the duplication is
# deliberate. Vale exits 0 on a file it has no section for, so a hook that passed every
# Markdown file would read green while checking nothing outside the two configured paths —
# and would ALSO hand it docs/reference/, whose commits come from the docs-refresh cron.
#
# The duplication is safe only because scripts/test_vale_scope.py asserts this regex covers
# every .vale.ini section. It did not, for two commits: docs/deploying.md and
# docs/gitops-pipeline.md entered .vale.ini in PR #418 and never entered this regex, so the
# hook reported "no files to check" and both pages went ungated while reading green. Adding
# a page to .vale.ini alone does not lint it — it has to be in both.
#
# NEVER widen this to docs/reference/. That cron stages those paths and commits with hooks
# running, so a style error there aborts the commit and alerts on every run until someone
# fixes the generator. ENFORCED by the same test.
[[repos.hooks]]
id = "vale"
name = "Prose style (Vale, scoped to ADRs + the hand-written docs pages)"
entry = "vale"
language = "system"
files = "^(docs/adr/.*\\.md|docs/(index|deploying|gitops-pipeline|diagrams-plan)\\.md)$"
