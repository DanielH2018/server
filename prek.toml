# Lower each ratchet allowlist entry to what its file is today, so a PR that SHRINKS a listed
# module needs no hand edit. An entry has to MATCH its file (the `DECIDED:` marker in
# tests/_ratchet.py). It only ever tightens -- a grown file's entry is left verbatim, so the
# ratchet still fails on it -- and it writes unconditionally, never running the suite first, so
# a failing ratchet cannot block its own repair.
#
# `static-ratchet-tests` sits after this hook, and CI's `pytest` job and `uv run pytest` run
# after the commit, so by the time test_no_module_is_longer_than_its_cap_or_its_allowlist_entry
# reads the lists off disk this hook has already rewritten them. Like a formatter, it exits non-zero when it
# rewrote a list, so the author stages what it wrote.
#
# The `files` gate keeps it off a docs-only commit, and prek SKIPS a hook whose gate matches
# nothing even with pass_filenames = false, so the docs-refresh and eval-run crons never pay it.
[[repos.hooks]]
id = "tighten-ratchet-allowlists"
name = "Ratchet allowlist entries match their files"
entry = "uv run --frozen python scripts/dev/tighten_ratchets.py --tighten"
language = "system"
pass_filenames = false
# Any Python file can be the one that shrank, and the lists too, so a hand edit that raises an entry
# is pulled back down.
files = "(\\.py|^tests/repo/(module_length|monkeypatch|copied_tests)_allowlist\\.txt)$"

# Lint the fact citations in any CLAUDE.md section this branch touched, against origin/master
# (`tests/repo/docs/test_every_section_lints_clean.py` holds every section at every commit;
# this names the finding at commit time). `--changed-since` needs a real git history, which `--all-files` on a shallow
# runner may not have for origin/master — see the `land-after-merge`/CI fetch-depth notes.
# CI's prek jobs check out with fetch-depth: 0 and fetch the base branch, so origin/master is
# there on a PR; on a push to master it is HEAD, and the range is empty.
#
# The same run adds `vanished-identifier`: a CLAUDE.md still naming an identifier this branch
# removed from the last non-Markdown file holding it. That commit is usually code-only, so the
# gate fires on any non-Markdown file as well as on a CLAUDE.md. A commit touching only other
# Markdown stays skipped, as the docs-refresh and eval-run crons' commits do.
[[repos.hooks]]
id = "facts-lint-changed"
name = "fact citations in edited instruction-file sections, and identifiers the branch removed"
entry = "uv run --frozen python scripts/dev/fact_status.py lint --changed-since origin/master"
language = "system"
pass_filenames = false
files = "(^|/)CLAUDE\\.md$|^\\.claude/(rules|agents)/[^/]+\\.md$|^\\.claude/skills/.+/SKILL\\.md$|^(?!.*\\.md$)"
# Neither cron can edit a CLAUDE.md, so a finding there would only park its publish.
exclude = "^(docs/assets/generated/|evals/history\\.json$)"

# Static test modules that turn more PRs red than any other test the author's own code did not
# break. Each failure names its own repair, so finding it at commit time saves a CI round trip
# and a fix commit. The whole suite stays out of prek because it costs minutes, and runs only
# in CI and the two crons.
#
# `--dist loadscope` keeps each module on one worker, so the slowest module bounds the hook.
# The render-and-path census and the git-and-subprocess census sit in the
# `static-ratchet-tests-test-modules` sibling below for that reason, and each census detector
# skips a module that cannot spell a hit. On daniel-server at load average 2.9-3.4, it
# took 12.1-12.6s.
#
# It sits after `tighten-ratchet-allowlists` because the ratchet test reads the lists that hook
# rewrites. `files` is wider than `.py`: a cited
# facts atom is often a YAML key or a `DECIDED:` marker in a template, and the doc fragments
# read role defaults, inventory and the fail2ban template. The shard partition test reads
# ci.yml and pyproject.toml's `testpaths`. test_role_claude_md reads every role's CLAUDE.md
# beside its tasks and templates. The census rows read tracked `.py` files, and four more
# kinds of path:
# - every workflow under .github/workflows/, for the runner-pin and shared-fetch rows;
# - any file under a role's templates/, defaults/ or vars/, for the rows that refuse a
#   Markdown or pytest file a role ships and a hand-written `dependsOn`;
# - prek.toml, for the row that holds each literal path in a hook's `files` to the tree;
# - Markdown and JSON under .claude/skills/, .claude/agents/ and evals/cases/, for the rows
#   on the review surfaces' standing-list slug and the agents' inline re-flag list;
# - a compiled module (`.pyc`, `.so`, anything under __pycache__/), for the row that refuses
#   a tracked one.
# The macro row reads every Markdown doc under docs/ and .claude/ and every CLAUDE.md, and only
# the CLAUDE.md files, the skills and the agents are gated. A docs/ page or a .claude/rules/
# file that names a deleted macro goes red in CI instead. Gating all Markdown would charge every docs-only commit the cost above, and
# the edit that usually breaks the row deletes a macro template, which `.j2` already gates.
#
# CI skips it on both `prek run` steps, because its `pytest` job runs the same ten files.
# The `static-ratchet-tests-*` siblings below carry further modules.
# That job's checkout is not shallow (`fetch-depth: 0`), so the ratchet's allowlist comparison
# runs there too, against the merge base with origin/master. docs-refresh
# stages scripts/dev/pytest_shard_runner_weights.json, so this fires on that cron's commit, which
# runs the whole suite green first. eval-run stages nothing this matches. To commit past it, `SKIP=static-ratchet-tests git commit`.
# The shell, `hosts/` and wait-source paths are the scripts the shimmed-path census row reads.
[[repos.hooks]]
id = "static-ratchet-tests"
name = "Static ratchet tests (module length, section lint, shard partition, doc fragments, role CLAUDE.md, census rows)"
entry = "uv run --frozen pytest -q -p no:cacheprovider tests/repo/ratchets/test_module_length_ratchet.py tests/repo/docs/test_every_section_lints_clean.py tests/repo/ci_workflows/test_pytest_shards_partition_the_suite.py scripts/docs/tests/test_gen_doc_fragments.py tests/repo/docs/test_role_claude_md.py tests/repo/census_rows/test_census_rows_python.py tests/repo/census_rows/test_census_rows_suite.py tests/repo/census_rows/test_census_rows_roles.py tests/repo/census_rows/test_census_rows_text.py tests/repo/census_rows/test_census_rows_layout.py"
language = "system"
pass_filenames = false
files = "(\\.py$|(^|/)CLAUDE\\.md$|^scripts/dev/pytest_shard_runner_weights\\.json$|^tests/repo/module_length_allowlist\\.txt$|^pyproject\\.toml$|^\\.github/workflows/[^/]+\\.yml$|^\\.github/actions/[^/]+/action\\.yml$|^(k8s|estate|secrets|tests)/.*\\.(ya?ml|j2|ini)$|^k8s/roles/[^/]+/(templates|defaults|vars)/|^prek\\.toml$|^(\\.claude/(skills|agents)|evals/cases)/.*\\.(md|json)$|\\.(pyc|so)$|(^|/)__pycache__/|\\.(sh|bash)$|^hosts/(lib|components)/|^hosts/([^/]+/)?vars\\.yml$|^\\.claude/wait-sources/)"

# The census reads only tracked modules `is_pytest_only` accepts under a test root, so the gate is
# those paths plus the import closure.
[[repos.hooks]]
id = "static-ratchet-tests-test-modules"
name = "Census rows over the pytest-only modules (git, subprocess, render and path helpers)"
entry = "uv run --frozen pytest -q -n 2 -p no:cacheprovider scripts/tests/test_census_rows_test_modules.py scripts/tests/test_census_rows_test_renders.py"
language = "system"
pass_filenames = false
files = "^((scripts|k8s|\\.claude/hooks|evals|hosts/components|hosts/lib)/(.*/)?((test_[^/]*|conftest)\\.py|tests/.*\\.py)|(hosts/)?tests/.*\\.py|scripts/lib/[^/]+\\.py|prek\\.toml|pyproject\\.toml|uv\\.lock)$"

# Cheap ratchet and census modules in sibling hooks rather than in the entry above, so that
# each runs only on a commit that can change its verdict. Widening the gate above to
# `renovate.json` or a planning doc would make those commits pay every module.
# Each `files` gate is the data the tests read, plus the test module and its import closure
# (scripts/tests/test_prek_files_cover_entry_imports.py), plus pyproject.toml and uv.lock,
# which decide the pytest that runs them. None matches a path the docs-refresh or eval-run
# crons commit.
#
# `-n0` on the one-module hooks: pyproject.toml's `-n auto` spends longer bringing up xdist
# workers than the module takes, and each worker repeats the module-scoped render.
# The `-python` hook pins `-n 4` rather than taking pyproject.toml's `-n auto`: tests/xdist_width.py
# sizes `auto` from recorded seconds and gives its five modules 3 workers, while `-n 4` is the
# width measured fastest (`-n 3`, `-n 5` and `-n 4 --dist load` are no faster). Under
# `--dist loadscope` each module stays on one worker, so the slowest module,
# test_prek_files_cover_entry_imports.py, bounds the hook.
# CI skips all of them on both `prek run` steps, as it skips the hook above, because its
# `pytest` job runs the same files. To commit past one, `SKIP=<its id> git commit`.

# Any `.py` can change their verdict; test_exit_codes also reads every scripts/*.sh exit contract.
[[repos.hooks]]
id = "static-ratchet-tests-python"
name = "Static ratchet tests over the tracked Python (import direction, exit codes, prek files, hazards)"
entry = "uv run --frozen pytest -q -n 4 -p no:cacheprovider scripts/tests/test_scripts_import_direction.py scripts/lib/tests/script_census/test_exit_codes.py scripts/tests/test_prek_files_cover_entry_imports.py tests/repo/ratchets/test_tracked_python_hazards.py"
language = "system"
pass_filenames = false
files = "(\\.py$|^scripts/.*\\.sh$|^(prek\\.toml|pyproject\\.toml|uv\\.lock)$)"

# The lander deadlines: promote.yml's job timeouts, the land units' TimeoutStartSec in the
# claude-code and renovate-agent host components (with their defaults and
# land_renovate_pr.py's LAND_TIMEOUT_S), the inventory's flux-owned tags, the k8s roles, and
