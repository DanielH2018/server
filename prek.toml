# Lower each ratchet allowlist entry to what its file is today, so a PR that SHRINKS a listed
# module needs no hand edit. An entry has to MATCH its file (the `DECIDED:` marker in
# tests/_ratchet.py). It only ever tightens -- a grown file's entry is left verbatim, so the
# ratchet still fails on it -- and it writes unconditionally, never running the suite first, so
# a failing ratchet cannot block its own repair.
#
# `static-ratchet-tests` sits after this hook, and CI's `pytest` job and `uv run pytest` run
# after the commit, so by the time test_no_module_is_longer_than_its_cap_or_its_allowlist_entry
# reads the lists off disk this hook has already rewritten them. Like a formatter, it exits non-zero when it
# rewrote a list, so the author stages what it wrote.
#
# The `files` gate keeps it off a docs-only commit, and prek SKIPS a hook whose gate matches
# nothing even with pass_filenames = false, so the docs-refresh and eval-run crons never pay it.
[[repos.hooks]]
id = "tighten-ratchet-allowlists"
name = "Ratchet allowlist entries match their files"
entry = "uv run --frozen python scripts/dev/tighten_ratchets.py --tighten"
language = "system"
pass_filenames = false
# Any Python file can be the one that shrank, and the lists themselves so a hand edit that
# raises an entry is pulled back down in the commit that writes it.
files = "(\\.py|^tests/repo/(module_length|monkeypatch|copied_tests)_allowlist\\.txt)$"

# Lint the fact citations in any CLAUDE.md section this branch touched, against origin/master
# (`tests/repo/test_every_section_lints_clean.py` holds every section at every commit;
# this names the finding at commit time). `--changed-since` needs a real git history, which `--all-files` on a shallow
# runner may not have for origin/master — see the `land-after-merge`/CI fetch-depth notes.
# CI's prek jobs check out with fetch-depth: 0 and fetch the base branch, so origin/master is
# there on a PR; on a push to master it is HEAD, and the range is empty.
#
# The same run adds `vanished-identifier`: a CLAUDE.md still naming an identifier this branch
# removed from the last non-Markdown file holding it. That commit is usually code-only, so the
# gate fires on any non-Markdown file as well as on a CLAUDE.md. A commit touching only other
# Markdown stays skipped, as the docs-refresh and eval-run crons' commits do.
[[repos.hooks]]
id = "facts-lint-changed"
name = "fact citations in edited instruction-file sections, and identifiers the branch removed"
entry = "uv run --frozen python scripts/dev/fact_status.py lint --changed-since origin/master"
language = "system"
pass_filenames = false
files = "(^|/)CLAUDE\\.md$|^\\.claude/(rules|agents)/[^/]+\\.md$|^\\.claude/skills/.+/SKILL\\.md$|^(?!.*\\.md$)"
# The non-Markdown paths the docs-refresh and eval-run crons commit. Neither cron can edit a
# CLAUDE.md, so a finding there would only park its publish, which the docs-refresh contract's
# next-run review says to check before a hook gains one of its staged paths.
exclude = "^(docs/assets/generated/|evals/history\\.json$)"

# Static test modules that turn more PRs red than any other test the author's own code did not
# break. Each failure names its own repair, so finding it at commit time saves a CI round trip
# and a fix commit. The whole suite stays out of prek because it costs minutes, and runs only
# in CI and the two crons.
#
# `--dist loadscope` keeps each module on one worker, so the slowest module bounds the hook.
# The render-and-path census and the git-and-subprocess census sit in the
# `static-ratchet-tests-test-modules` sibling below for that reason, and each census detector
# skips a module that cannot spell a hit. On daniel-server at load average 2.9-3.4, it
# took 12.1-12.6s.
#
# It sits after `tighten-ratchet-allowlists` because the ratchet test reads the lists that hook
# rewrites. `files` is wider than `.py`: a cited
# facts atom is often a YAML key or a `DECIDED:` marker in a template, and the doc fragments
# read role defaults, inventory and the fail2ban template. The shard partition test reads
# ci.yml and pyproject.toml's `testpaths`. test_role_claude_md reads every role's CLAUDE.md
# beside its tasks and templates. The census rows read tracked `.py` files, and four more
# kinds of path:
# - every workflow under .github/workflows/, for the runner-pin and shared-fetch rows;
# - any file under a role's templates/, defaults/ or vars/, for the rows that refuse a
#   Markdown or pytest file a role ships and a hand-written `dependsOn`;
# - prek.toml, for the row that holds each literal path in a hook's `files` to the tree;
# - Markdown and JSON under .claude/skills/, .claude/agents/ and evals/cases/, for the rows
#   on the review surfaces' standing-list slug and the agents' inline re-flag list;
# - a compiled module (`.pyc`, `.so`, anything under __pycache__/), for the row that refuses
#   a tracked one.
# The macro row reads every Markdown doc under docs/ and .claude/ and every CLAUDE.md, and only
# the CLAUDE.md files, the skills and the agents are gated. A docs/ page or a .claude/rules/
# file that names a deleted macro goes red in CI instead. Gating all Markdown would charge every docs-only commit the cost above, and
# the edit that usually breaks the row deletes a macro template, which `.j2` already gates.
#
# CI skips it on both `prek run` steps, because its `pytest` job runs the same ten files.
# The `static-ratchet-tests-*` siblings below carry further modules.
# That job's checkout is not shallow (`fetch-depth: 0`), so the ratchet's allowlist comparison
# runs there too, against the merge base with origin/master. docs-refresh
# stages scripts/dev/pytest_shard_runner_weights.json, so this fires on that cron's commit, which
# runs the whole suite green first. eval-run stages nothing this matches. To commit past it, `SKIP=static-ratchet-tests git commit`.
# The shell, `hosts/` and wait-source paths are the scripts the shimmed-path census row reads.
[[repos.hooks]]
id = "static-ratchet-tests"
name = "Static ratchet tests (module length, section lint, shard partition, doc fragments, role CLAUDE.md, census rows)"
entry = "uv run --frozen pytest -q -p no:cacheprovider tests/repo/test_module_length_ratchet.py tests/repo/test_every_section_lints_clean.py tests/repo/test_pytest_shards_partition_the_suite.py scripts/docs/tests/test_gen_doc_fragments.py tests/repo/test_role_claude_md.py tests/repo/test_census_rows_python.py tests/repo/test_census_rows_suite.py tests/repo/test_census_rows_roles.py tests/repo/test_census_rows_text.py tests/repo/test_census_rows_layout.py"
language = "system"
pass_filenames = false
files = "(\\.py$|(^|/)CLAUDE\\.md$|^scripts/dev/pytest_shard_runner_weights\\.json$|^tests/repo/module_length_allowlist\\.txt$|^pyproject\\.toml$|^\\.github/workflows/[^/]+\\.yml$|^\\.github/actions/[^/]+/action\\.yml$|^(k8s|inventory|secrets|tests)/.*\\.(ya?ml|j2|ini)$|^k8s/roles/[^/]+/(templates|defaults|vars)/|^prek\\.toml$|^(\\.claude/(skills|agents)|evals/cases)/.*\\.(md|json)$|\\.(pyc|so)$|(^|/)__pycache__/|\\.(sh|bash)$|^hosts/(lib|components)/|^\\.claude/wait-sources/)"

# The two census modules over the pytest-only modules, `_test_module_rules.pytest_only_modules`:
# the git and subprocess rows and the render-and-path rows. They were the slowest two in the
# hook above, and under `--dist loadscope` the slowest module bounds a hook. Their census reads only the tracked modules
# `is_pytest_only` accepts under a test root, so the gate is those paths (a `test_*.py`, a
# `conftest.py`, anything under a `tests/` directory), the import closure the two modules
# reach through scripts/lib and tests, and pyproject.toml and uv.lock. A commit that
# touches only non-test `.py` outside scripts/lib/ skips both. prek.toml is in the gate
# because test_census_rows_test_modules.py reads this hook's own `files`.
#
# A commit that matches both gates pays both, because prek runs hooks one after another. Only
# a commit that skips this gate gains; parsing each test module once across the census rows is
# the lever left for the rest.
[[repos.hooks]]
id = "static-ratchet-tests-test-modules"
name = "Census rows over the pytest-only modules (git, subprocess, render and path helpers)"
entry = "uv run --frozen pytest -q -n 2 -p no:cacheprovider scripts/tests/test_census_rows_test_modules.py scripts/tests/test_census_rows_test_renders.py"
language = "system"
pass_filenames = false
files = "^((scripts|k8s|\\.claude/hooks|evals|hosts/components|hosts/lib)/(.*/)?((test_[^/]*|conftest)\\.py|tests/.*\\.py)|(hosts/)?tests/.*\\.py|scripts/lib/[^/]+\\.py|prek\\.toml|pyproject\\.toml|uv\\.lock)$"

# Cheap ratchet and census modules in sibling hooks rather than in the entry above, so that
# each runs only on a commit that can change its verdict. Widening the gate above to
# `renovate.json` or a planning doc would make those commits pay every module.
# Each `files` gate is the data the tests read, plus the test module and its import closure
# (scripts/tests/test_prek_files_cover_entry_imports.py), plus pyproject.toml and uv.lock,
# which decide the pytest that runs them. None matches a path the docs-refresh or eval-run
# crons commit.
#
# `-n0` on the one-module hooks: pyproject.toml's `-n auto` spends longer bringing up xdist
# workers than the module takes, and each worker repeats the module-scoped render.
# The `-python` hook pins `-n 4` rather than taking pyproject.toml's `-n auto`: tests/xdist_width.py
# sizes `auto` from recorded seconds and gives its five modules 3 workers, while `-n 4` is the
# width measured fastest (`-n 3`, `-n 5` and `-n 4 --dist load` are no faster). Under
# `--dist loadscope` each module stays on one worker, so the slowest module,
# test_prek_files_cover_entry_imports.py, bounds the hook.
# CI skips all of them on both `prek run` steps, as it skips the hook above, because its
# `pytest` job runs the same files. To commit past one, `SKIP=<its id> git commit`.

# Six walks of the tracked Python, so any `.py` can change their verdict. test_exit_codes
# also reads every scripts/*.sh exit contract, and test_prek_files_cover_entry_imports
# reads prek.toml itself.
[[repos.hooks]]
id = "static-ratchet-tests-python"
name = "Static ratchet tests over the tracked Python (import direction, exit codes, prek files, hazards)"
entry = "uv run --frozen pytest -q -n 4 -p no:cacheprovider scripts/tests/test_scripts_import_direction.py scripts/lib/tests/test_exit_codes.py scripts/tests/test_prek_files_cover_entry_imports.py tests/repo/test_tracked_python_hazards.py"
language = "system"
pass_filenames = false
files = "(\\.py$|^scripts/.*\\.sh$|^(prek\\.toml|pyproject\\.toml|uv\\.lock)$)"

# The lander deadlines: promote.yml's job timeouts, the land units' TimeoutStartSec in the
# claude-code and renovate-agent host components (with their defaults and
# land_renovate_pr.py's LAND_TIMEOUT_S), the inventory's flux-owned tags, the k8s roles, and
# the land and render code under scripts/. The k8s gate is every role's tasks, templates, defaults and files rather
# than the soak's own inputs: the soak fixture renders every flux-owned role, and
# test_no_published_tag_builds_an_image reads every role's tasks for an image-builder
# include (`images.builder_roles`). So a k8s role edit pays this hook's ~5s. The test module
# reaches the template filters, hosts/lib and the secrets_mgmt, validate and probe_lib code
# through pytest's `pythonpath`, so the gate covers those too.
[[repos.hooks]]
id = "static-ratchet-tests-lander"
name = "Lander deadlines cover the soak"
entry = "uv run --frozen pytest -q -n0 -p no:cacheprovider hosts/tests/test_lander_deadlines_cover_the_soak.py"
language = "system"
pass_filenames = false
files = "^(cluster/services\\.yml|\\.github/workflows/promote\\.yml|inventory/.*|k8s/roles/[^/]+/(tasks|templates|defaults|files)/.*|hosts/lib/.*\\.py|hosts/components/(claude-code|renovate-agent|gh-quota)/.*|scripts/renderer/template_filters/[^/]+\\.py|scripts/(deploy_tools|renderer|lib|secrets_mgmt|validate)/.*\\.py|scripts/diagnostics/probe_lib/(core|host_reader|obs_api|health_checkout)\\.py|tests/_[^/]+\\.py|hosts/tests/[^/]+\\.py|pyproject\\.toml|uv\\.lock)$"

# Every `checksum/<name>` a CLAUDE.md names, against the k8s roles' rendered manifests. The
# render reaches scripts/validate/k8s_manifests.py and its validate_lib through pytest's
# `pythonpath`.
[[repos.hooks]]
id = "static-ratchet-tests-checksum"
name = "Documented checksum annotations exist in the manifests"
entry = "uv run --frozen pytest -q -n0 -p no:cacheprovider tests/k8s/test_checksum_annotations_documented.py"
language = "system"
pass_filenames = false
files = "^(hosts/lib/host_lib\\.py|scripts/lib/longhorn_lib/longhorn_backups\\.py|k8s/roles/.*|CLAUDE\\.md|k8s/templates/.*|tests/(_[^/]+|render_share|k8s/test_checksum_annotations_documented)\\.py|scripts/(deploy_tools|lib|renderer|validate)/.*\\.py|scripts/secrets_mgmt/cluster_vars_check\\.py|pyproject\\.toml|uv\\.lock)$"

# Every tracked `.sh` and rendered `*.sh.j2` answers `--help`. The test module renders the
# templates through scripts/lib, scripts/validate and the template filters, which it reaches
# through pytest's `pythonpath`.
[[repos.hooks]]
id = "static-ratchet-tests-shell"
name = "Shell entry points answer --help"
entry = "uv run --frozen pytest -q -n0 -p no:cacheprovider tests/repo/test_shell_entry_points_answer_help.py"
language = "system"
pass_filenames = false
files = "(^(hosts/lib/host_lib|scripts/lib/longhorn_lib/longhorn_backups)\\.py$|^scripts/renderer/renderer_lib/(dialect|environment|jinja_filters)\\.py$|\\.sh(\\.j2)?$|^tests/(_[^/]+|repo/test_shell_entry_points_answer_help)\\.py$|^scripts/(lib|validate|renderer/template_filters)/.*\\.py$|^(pyproject\\.toml|uv\\.lock)$)"

# The two Renovate-rule modules: renovate.json against the autodeploy denylist, which each
# k8s role's `k8s_autodeploy` in its defaults and `lib.k8s_roles` decide, and against who
# owns each pin. Role defaults and the Dockerfile templates hold nearly every pin; a pin a
# custom manager reads from a workflow, a task file or prek.toml reaches CI's `pytest` job
# instead of this hook. The modules reach every template filter and scripts/validate through
# pytest's `pythonpath`, so the gate covers those too.
[[repos.hooks]]
id = "static-ratchet-tests-renovate"
name = "Renovate rules carry the autodeploy denylist marker"
entry = "uv run --frozen pytest -q -n0 -p no:cacheprovider tests/deploy/test_renovate_per_package_manual_rules_carry_the_denylist_marker.py tests/deploy/test_renovate_denylist_marker_reaches_the_pr_title.py"
language = "system"
pass_filenames = false
files = "^(hosts/lib/host_lib\\.py|scripts/lib/longhorn_lib/longhorn_backups\\.py|cluster/services\\.yml|renovate\\.json|inventory/.*|k8s/roles/[^/]+/(defaults/.*|templates/Dockerfile[^/]*)|scripts/renderer/template_filters/[^/]+\\.py|tests/(_[^/]+|render_share|deploy/_autodeploy|deploy/test_renovate_[^/]+)\\.py|scripts/(deploy_tools|lib|renderer|validate)/.*\\.py|scripts/secrets_mgmt/cluster_vars_check\\.py|scripts/dev/k8s_autodeploy_counts\\.py|pyproject\\.toml|uv\\.lock)$"

# More rules that failed PR CI: the eval cases' CLAUDE.md quotes, the Landings board, the
# alert conventions and the unit-template census. Each failed branches that changed an input
# the hook below names, and none ran before CI. Two of them run one node rather than the
# module: the alert module's promtool cases and the unit module's systemd-analyze cases are
# slow, where the convention node and the census node, the ones that failed, are fast.
#
# `test_cluster_vars_tree.py` stays out. It takes 11-12s because it renders every flux-owned role, so its gate would be every k8s template,
# and its only repair is `cluster_vars.py write`, which is operator-only: catching it at commit
# saves no round trip an agent can act on.

# The eval cases' CLAUDE.md quotes, Pi roles and cited role paths. Any role path counts,
# because a case may cite a file under any role, and deleting or renaming it fails the case.
[[repos.hooks]]
id = "static-ratchet-tests-evals"
name = "Eval cases quote the live CLAUDE.md and cite live role paths"
entry = "uv run --frozen pytest -q -n0 -p no:cacheprovider evals/tests/test_eval_cases.py"
language = "system"
pass_filenames = false
files = "^(evals/(cases|tests)/.*|CLAUDE\\.md|inventory/host_vars/daniel-pi\\.yml|k8s/roles/.*|scripts/lib/repo_paths\\.py|pyproject\\.toml|uv\\.lock)$"

[[repos.hooks]]
id = "static-ratchet-tests-landing"
name = "Landings board groups by labels the landing ledger writes"
entry = "uv run --frozen pytest -q -n0 -p no:cacheprovider tests/deploy/test_landing_annotations.py"
language = "system"
pass_filenames = false
files = "^(k8s/roles/observability/files/dashboards/Infrastructure/landings\\.json|scripts/deploy_tools/land_lib/(ledger|outcome)\\.py|hosts/lib/[^/]+\\.py|scripts/lib/[^/]+\\.py|tests/(_[^/]+|deploy/test_landing_annotations)\\.py|pyproject\\.toml|uv\\.lock)$"

[[repos.hooks]]
id = "static-ratchet-tests-alerts"
name = "Alert rules meet the alert conventions"
entry = "uv run --frozen pytest -q -n0 -p no:cacheprovider scripts/validate/tests/test_validate_alert_rules.py::test_the_tree_rules_meet_every_convention_is_clean"
language = "system"
pass_filenames = false
files = "^(hosts/lib/host_lib\\.py|scripts/lib/longhorn_lib/longhorn_backups\\.py|cluster/services\\.yml|scripts/renderer/(renderer_lib/[^/]+|shadow_diff)\\.py|scripts/deploy_tools/(chained_timeout|changed_set|kustomizations)\\.py|scripts/lib/plain_scalar\\.py|k8s/roles/observability/(files/rules|tests/rules|files/alertmanager|tests/alertmanager)/.*|k8s/roles/loki-homelab/(files/rules/.*|templates/(rules-)?configmap\\.yaml\\.j2|templates/config/config\\.alloy\\.j2|defaults/main\\.yml)|k8s/roles/observability/templates/(prometheus|prometheus-rules|alertmanager|alertmanager-secret)\\.yaml\\.j2|k8s/roles/observability/defaults/main\\.yml|inventory/(host_vars/[^/]+|group_vars/all)\\.yml|scripts/renderer/template_filters/[^/]+\\.py|scripts/validate/alert_.*|scripts/validate/notification_renders\\.py|scripts/validate/k8s_manifests\\.py|scripts/validate/validate_lib/[^/]+\\.py|scripts/validate/tests/test_validate_alert_rules\\.py|scripts/lib/[^/]+\\.py|pyproject\\.toml|uv\\.lock)$"

# The unit-template census: every unit template the validator must find still exists.
[[repos.hooks]]
id = "static-ratchet-tests-units"
name = "Every known unit template is still discovered"
entry = "uv run --frozen pytest -q -n0 -p no:cacheprovider scripts/validate/tests/test_render_units.py::test_discover_templates_finds_the_known_set"
language = "system"
pass_filenames = false
files = "^(hosts/lib/host_lib\\.py|scripts/lib/longhorn_lib/longhorn_backups\\.py|(k8s/roles|hosts/components)/.*\\.(service|timer|socket|rules)\\.j2|scripts/validate/(render_lib/units|tests/test_render_units)\\.py|scripts/validate/validate_lib/[^/]+\\.py|scripts/renderer/renderer_lib/[^/]+\\.py|scripts/deploy_tools/(chained_timeout|changed_set|kustomizations)\\.py|scripts/lib/[^/]+\\.py|scripts/renderer/template_filters/[^/]+\\.py|pyproject\\.toml|uv\\.lock)$"


# The `hooks` key of .claude/settings.json is rendered from the `# gen-hooks:` block each file
# under .claude/hooks/ carries (scripts/dev/gen_hook_settings.py). `--check` fails on a hook
# file that declares nothing -- the exists-but-unregistered gap the two tests beside it cannot
# see, since test_hook_scripts_executable.py reads only the registered side -- and on a
# settings.json that drifted from the declarations. Run the generator without `--check` and
# commit what it writes. `files` names the generator itself, the way `ruff` names
# pyproject.toml above: a change to the render is a change to what the committed file must be.
[[repos.hooks]]
id = "gen-hook-settings"
name = "Hook registrations match the .claude/hooks/ declarations"
entry = "uv run --frozen python scripts/dev/gen_hook_settings.py --check"
language = "system"
pass_filenames = false
files = "^(\\.claude/hooks/[^/]+\\.(sh|py)|\\.claude/settings\\.json|scripts/dev/gen_hook_settings\\.py|scripts/lib/(cli_help|exit_codes|repo_paths)\\.py)$"

# observability's host-checks and hosts rule groups are rendered from files/rule-tables/ and the
# host table, observability_expected_hosts (scripts/dev/gen_host_rules.py). `--check` fails on a
# rule file edited by hand, a table edit committed without its render, and an inventory host the
# host table does not list. Run the generator without `--check` and commit what it writes.
[[repos.hooks]]
id = "gen-host-rules"
name = "The host rule groups match their tables"
entry = "uv run --frozen python scripts/dev/gen_host_rules.py --check"
language = "system"
pass_filenames = false
files = "^(k8s/roles/observability/(files/rule-tables/.*|files/rules/(host-checks|hosts)\\.yaml|defaults/main\\.yml)|hosts/[^/]+/package\\.yml|inventory/host_vars/[^/]+\\.yml|scripts/dev/gen_host_rules\\.py|scripts/lib/(cli_help|exit_codes|inventory_lists|repo_paths|yaml_fast)\\.py)$"

# Lint first-party Python for real bugs only — pyflakes (unused imports/undefined names),
# syntax errors, bare-except, ==None/==True (ruleset in pyproject [tool.ruff.lint]). ruff is pinned in uv.lock (lint group) so the gate is
# reproducible and lockFileMaintenance refreshes it weekly. Runs once when any .py is staged.
#
# `files` names pyproject.toml and uv.lock as well as the code, the way the `ty` hook below
# does: a commit that only enables a rule in [tool.ruff.lint] changes what every .py must
# satisfy, and with `\.py$` alone a commit-time run would skip ruff entirely.
#
# uv.lock is here for the same reason one step further out: `uv run --frozen` runs the ruff
# pinned in the lock, so a lock-file maintenance PR decides which ruff version gates every
# .py in the tree. A release that tightens a rule would otherwise pass the PR and turn master
# red on its first full sweep. A CI pull request run sweeps every hook over the whole tree, so
# the PR run catches the same escape regardless of `files`; `files` still decides what a
# commit-time run checks.
[[repos.hooks]]
id = "ruff"
name = "Lint first-party Python (ruff)"
entry = "uv run --frozen ruff check"
language = "system"
pass_filenames = false
files = "(\\.py$|^(pyproject\\.toml|uv\\.lock)$)"

# Enforce `ruff format` on first-party Python (config in pyproject.toml [tool.ruff], same
# extend-exclude as the linter). --check fails the commit
# on an unformatted file instead of rewriting it, so a stray editor save can't sneak past CI.
# `files` covers pyproject.toml and uv.lock for the reasons given on `ruff` above — the
# formatter's output moves with the pinned version just as the linter's ruleset does.
[[repos.hooks]]
id = "ruff-format"
name = "Format first-party Python (ruff format)"
entry = "uv run --frozen ruff format --check"
language = "system"
pass_filenames = false
files = "(\\.py$|^(pyproject\\.toml|uv\\.lock)$)"

# Type-check first-party Python, for the bugs ruff cannot see: it reads one file at a time, so a
# value that crosses a function boundary as the wrong type is invisible to it.
#
# WHAT THIS GATE ACTUALLY CATCHES, since a check is worth exactly its true coverage. It catches a
# `str | None` reaching a `-> str` RETURN and reaching a CALL ARGUMENT, an argument whose
# container type is merely invariant-incompatible (a `frozenset` for a `set`, a `dict[str, str]`
# for a `dict[str, str | None]`), an unnarrowed regex match subscripted, a non-iterable iterated,
# an override whose signature does not match its base, and a submodule reached through a parent
# import. No file is exempt from `invalid-argument-type`.
#
# It also catches an attribute read off an unnarrowed Optional, a wrongly typed assignment and
# an operator applied to a union: pyproject [tool.ty.rules] sets those rules to error.
#
# `pass_filenames = false` because ty resolves imports across the whole project, and a per-file
# run would report first-party imports as unresolved. `files` covers the config as well as the
# code: a commit that only edits [tool.ty.rules] or bumps the pin changes what the gate checks,
# and would otherwise run no ty at all locally (CI's --all-files sweep is the only backstop).
# Same pattern as the uv.lock hook above.
[[repos.hooks]]
id = "ty"
name = "Type-check first-party Python (ty)"
entry = "uv run --frozen ty check"
language = "system"
pass_filenames = false
files = "(\\.py$|^(pyproject\\.toml|uv\\.lock)$)"

# A name is dead only against every caller in the tree, so this runs over the whole project
# like ty above. [tool.vulture] in pyproject.toml holds the roots and the names a framework,
# a guard or an unread script calls.
[[repos.hooks]]
id = "vulture"
name = "No Python name that nothing uses (vulture)"
entry = "uv run --frozen vulture"
language = "system"
pass_filenames = false
files = "(\\.py$|^(pyproject\\.toml|uv\\.lock)$)"

# Fast syntax-only gate: `bash -n` parses (doesn't run) every shell script. Catches the bug
# class of an apostrophe inside a single-quoted `python3 -c '...'` block, which breaks bash's
# own quote parsing. shellcheck
# above would also catch this, but `bash -n` is near-free and independent of it — a belt-and-
# suspenders backstop if the shellcheck-py hook is ever skipped/broken.
# `types = ["shell"]` (identify's shebang-aware detection, same as the shellcheck hook above)
# rather than a `.sh$` files regex — the NUT role's upssched-cmd (files/upssched-cmd, no
# extension: the filename is fixed by upssched's own config) is a real bash script and would be
# silently skipped by an extension-only match.
# NB: `entry` loops over "$@" itself — pre-commit/prek batch every matched filename into ONE
# invocation, and a bare `bash -n "$1" "$2"` silently only checks "$1" ($2+ become that
# script's own positional params, not additional files to parse).
[[repos.hooks]]
id = "bash-syntax-check"
name = "bash -n (shell syntax check)"
entry = "bash -c 'for f in \"$@\"; do bash -n \"$f\" || exit 1; done' --"
language = "system"
types = ["shell"]

# Prose style for the hand-written docs the ADR set introduced. Google's published style
# package plus two homelab rules; see .vale.ini for what is in scope and why.
#
# `files:` repeats .vale.ini's scope rather than trusting it, and the duplication is
# deliberate. Vale exits 0 on a file it has no section for, so a hook that passed every
# Markdown file would read green while checking nothing outside the two configured paths —
# and would ALSO hand it docs/reference/, whose commits come from the docs-refresh cron.
#
# The duplication is safe only because scripts/tests/test_vale_scope.py asserts this regex covers
# every .vale.ini section. A page in .vale.ini but not in this regex makes the hook report
# "no files to check" and goes ungated while reading green. Adding a page to .vale.ini alone
# does not lint it — it has to be in both.
#
# DECIDED: never widen this hook to docs/reference/; the docs-refresh cron commits those paths
# with hooks running, so a strict failure stops every refresh.
# A style error there aborts the commit and alerts on every run until someone fixes the
# generator. ENFORCED by the same test.
#
# The Google package is fetched, not tracked: .vale.ini pins its release URL and .gitignore
# excludes styles/Google/, so a fresh checkout — every new worktree — has the tracked Homelab
# style and nothing else on StylesPath. A bare `vale` there dies with "style 'Google' does
# not exist on StylesPath" on every commit that touches a doc, until someone runs `vale sync`
# by hand in that worktree. `scripts/validate/vale.sh` provisions the package and then execs
# Vale. It is a script rather than a `bash -c` entry because prek splits the file list across
# several CONCURRENT invocations, and an inline guard on the directory raced itself in a fresh
# worktree — read that script's header for the failure and the lock that fixes it.
# ENFORCED by scripts/validate/tests/test_vale_sync_guard.py.
[[repos.hooks]]
id = "vale"
name = "Prose style (Vale, scoped to ADRs, top-level docs pages and generated fragments)"
entry = "scripts/validate/vale.sh"
language = "system"
# docs/[^/]+\.md is every top-level page and nothing below it, which is what keeps
# docs/archive/ and docs/reference/ out. See .vale.ini for why each is excluded.
#
# DECIDED: the generated fragments under docs/assets/generated/fragments/ are linted here,
# although the docs-refresh cron commits them with hooks running. The operator chose this so
# that a generator's prose is gated in CI and not only by a hand
# `vale docs` run. The cost is accepted: a Vale error in a fragment
# aborts the cron's commit, and its commit-failure stamp reports DOWN on every run until the
# generator in scripts/docs/gen_doc_fragments.py is fixed. docs/reference/ stays out.
files = "^(docs/adr/.*\\.md|docs/[^/]+\\.md|docs/assets/generated/fragments/[^/]+\\.md)$"

# Build the docs site the way the cron does, and fail on anything --strict rejects.
#
# WHY THIS EXISTS. Generators emit fragments that hand-written pages transclude
# with `--8<--` (scripts/docs/gen_doc_fragments.py). The fragment tests hold the wiring in
# both directions — every include names a fragment, every fragment is included — but neither
# they nor any other gate ever BUILDS the site. So a broken include, a nav entry pointing at
# a deleted page, or a dead internal link reaches master and is caught only by the
# docs-refresh cron, which does not fail loudly: it logs, rebuilds without regenerating, and
# keeps serving the previous site. The page then reads as though its table were simply
# missing.
#
# `files` is deliberately wide — anything the build reads. A fragment lives under
# docs/assets/generated/, which no other docs hook touches, and mkdocs.yml itself changes the
# nav. uv.lock is in it because `--frozen` makes the lock decide which mkdocs and which plugins
# build the site, so a lock bump that moves one is a build change. The build takes ~4s,
# so running it on every lock bump costs less than finding the break on master.
# pass_filenames = false because mkdocs takes a config, not a file list.
#
# The site directory is left in the checkout on purpose and MUST stay ignored. `.gitignore:2`
# denies every root path (`/*`), so `.mkdocs-strict-check/` is covered without an entry of its
# own — which matters more than it looks: the docs-refresh cron commits with these hooks
# running, and `homelab-checkout-sync` reads `git status --porcelain`, where a single UNTRACKED
# file parks the primary checkout. A build directory anywhere git can see would do exactly that.
# Anything that moves this path out from under the root deny needs its own ignore entry first.
[[repos.hooks]]
id = "mkdocs-strict"
name = "Build the docs site (mkdocs --strict)"
entry = "uv run --frozen mkdocs build --strict --site-dir .mkdocs-strict-check"
language = "system"
pass_filenames = false
files = "^(docs/.*|mkdocs\\.yml|scripts/docs/.*\\.py|uv\\.lock)$"

# The harness's attribution reminder ends every commit message with a footer that opens with
# the robot emoji (U+1F916), and the operator's no-emoji rule wins over it. A squash merge makes
# the message master history, so this rejects it at the commit-msg stage. It is the
# one hook not at pre-commit: git passes it the message file, and `prek run` never runs it.
[[repos.hooks]]
id = "reject-robot-emoji"
name = "Reject the robot emoji in a commit message"
entry = "uv run --frozen python scripts/dev/reject_robot_emoji.py"
language = "system"
stages = ["commit-msg"]
