pass_filenames = false
files = "^(evals/(cases|tests)/.*|CLAUDE\\.md|hosts/daniel-pi/vars\\.yml|k8s/roles/.*|scripts/lib/repo_paths\\.py|pyproject\\.toml|uv\\.lock)$"

[[repos.hooks]]
id = "static-ratchet-tests-landing"
name = "Landings board groups by labels the landing ledger writes"
entry = "uv run --frozen pytest -q -n0 -p no:cacheprovider tests/deploy/test_landing_annotations.py"
language = "system"
pass_filenames = false
