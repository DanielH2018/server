# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

# Every hook runs at commit time and at no other stage. A hook without `stages` runs at EVERY
# stage, so a stale `.git/hooks/pre-push` shim left by an older `prek install` would re-run all
# of them over the pushed range, fixers included. Setting this here covers every checkout and
# any future shim; a hook that genuinely belongs at another stage sets its own `stages`.
#
# default_stages does NOT reach a hook whose upstream manifest declares `stages` itself, and
# pre-commit-hooks v6.0.0 lists `[pre-commit, pre-push, manual]` on three of ours. So every hook
# from a remote repo repeats `stages = ["pre-commit"]`, which also covers a manifest that gains
# `stages` on a Renovate bump. ENFORCED: the `every-remote-prek-hook-pins-the-commit-stage` row in tests/repo/_config_rows.py
default_stages = ["pre-commit"]

# `prek install` writes a shim per type listed here. Without `commit-msg` in the list, the
# reject-robot-emoji hook below never runs.
default_install_hook_types = ["pre-commit", "commit-msg"]

# Standard cleanup hooks
[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"

[[repos.hooks]]
id = "trailing-whitespace"
stages = ["pre-commit"]
# A vendored upstream manifest under a role's files/upstream/ is pinned byte for byte to a
# sha256 (scripts/dev/vendor_manifest.py), so no fixer may rewrite it.
exclude = "^k8s/roles/[^/]+/files/upstream/"

[[repos.hooks]]
id = "end-of-file-fixer"
stages = ["pre-commit"]
exclude = "^k8s/roles/[^/]+/files/upstream/"

[[repos.hooks]]
id = "check-yaml"
stages = ["pre-commit"]
# Flux's vendored install is a multi-document stream, which this hook refuses without
# --allow-multiple-documents. Allowing that repo-wide would pass a stray `---` in every other
# file, so the one stream is excluded instead: the validate-k8s-manifests hook parses its
# render, and tests/k8s/test_flux_role.py reads it.
# An upstream file under files/upstream/ is such a stream too, and its own pin covers it.
exclude = "^k8s/roles/(flux/files/gotk-components\\.yaml$|[^/]+/files/upstream/)"

[[repos.hooks]]
# Guards renovate.json (a syntax error there silently disables ALL dependency management)
# and every other JSON in the repo (Grafana dashboards, settings).
id = "check-json"
stages = ["pre-commit"]

[[repos.hooks]]
# prek.toml and pyproject.toml configure every other gate; a TOML syntax error in either
# fails those gates with a parser traceback rather than a pointer at the line.
id = "check-toml"
stages = ["pre-commit"]

[[repos.hooks]]
id = "check-merge-conflict"
stages = ["pre-commit"]

[[repos.hooks]]
# The M6 plan grew past the 500 KB cap through edits, which this hook never sees; only its
# move into the archive reads as an add. It is history, so nothing grows it further.
id = "check-added-large-files"
stages = ["pre-commit"]
exclude = "^docs/archive/monitoring/m6-retire-kuma\\.md$"

[[repos.hooks]]
id = "mixed-line-ending"
stages = ["pre-commit"]
args = ["--fix=lf"]
exclude = "^k8s/roles/[^/]+/files/upstream/"

# Secret scanning
[[repos]]
repo = "https://github.com/gitleaks/gitleaks"
rev = "v8.30.1"

[[repos.hooks]]
id = "gitleaks"
stages = ["pre-commit"]

# Shell script linting. shellcheck-py ships a precompiled shellcheck binary via pip
# (language = python) — no host apt package and no Docker, so it works unmodified on the
# ubuntu-latest CI runner via prek's own hook-env bootstrap. All severities are on by
# default (not just --severity=error): the repo's shell scripts are currently
# shellcheck-clean, so there's nothing to suppress yet. OPTIONAL (off-by-default) rules
# are a separate axis: the triaged accept/exclude policy for them lives in .shellcheckrc,
# which also silences `shellcheck -o all` sweeps (rc disables win over -o all).
[[repos]]
repo = "https://github.com/shellcheck-py/shellcheck-py"
rev = "v0.11.0.1"

[[repos.hooks]]
id = "shellcheck"
stages = ["pre-commit"]

# Render every non-k8s template family with stubbed vars and check the output with the tool that
# reads it: the Pi's compose files as YAML plus their hardening rules, every *.sh.j2 with bash -n
# and shellcheck, every systemd unit (templates and the host packages' units) with
# systemd-analyze verify and the polkit rules with node --check, and every other host component
# template for a variable nothing defines. check-yaml, shellcheck and bash-syntax-check never see
# a `.j2`, so without this hook a broken render first fails on a host. shellcheck comes via the
# `shellcheck-py` dev dependency, and the run fails closed when shellcheck or systemd-analyze is
# missing. `scripts/validate/render_templates.py` names the families and their modules.
[[repos]]
repo = "local"

[[repos.hooks]]
id = "validate-render-templates"
name = "Validate rendered compose, shell, unit and host component templates"
entry = "uv run --frozen python scripts/validate/render_templates.py"
language = "system"
# The entry point runs only the families whose `files` pattern in its FAMILIES table matches a
# passed file. Serial, so a full sweep is one invocation and not one per argv batch.
require_serial = true
# The union of the families' patterns: every file under hosts/, because the units family
# renders every host package and a package unit may be a static file; the inventory the renders
# layer in; secret_rotation.yml, the plaintext census of SOPS names
# (never values) the setup family allows; and the render's import closure.
files = "^(hosts/.*|scripts/lib/longhorn_lib/longhorn_backups\\.py|cluster/services\\.yml|scripts/renderer/renderer_lib/[^/]+\\.py|scripts/renderer/template_filters/[^/]+\\.py|scripts/deploy_tools/(chained_timeout|changed_set|kustomizations)\\.py|scripts/validate/validate_lib/(ok_lines|shipped_render|shell_lint)\\.py|scripts/validate/(render_templates|render_lib/(compose|setup_plane|shell|units))\\.py|k8s/templates/[^/]+\\.yml\\.j2|k8s/roles/.*\\.(sh|service|timer|socket|rules)\\.j2|inventory/(host_vars/[^/]+|group_vars/all)\\.yml|secrets/secret_rotation\\.yml|scripts/lib/(inventory_lists|guard_jinja_env|host_modules|cli_help|exit_codes|estate|git|jinja_comments|k8s_context|k8s_lookups|k8s_role_callers|k8s_roles|k8s_yaml|render_context|render_guard|repo_paths|role_files|yaml_fast)\\.py)$"

# Structurally validate the Home Assistant config (pure Python, no Docker): YAML syntax,
# duplicate keys, broken !include targets, and a syntax parse-check of inline + custom_templates
# Jinja. Catches authoring errors before a deploy recreates the container. Schema validation
# (hass --script check_config) is intentionally out of scope.
[[repos.hooks]]
id = "validate-ha-config"
name = "Validate Home Assistant config"
entry = "uv run --frozen python scripts/home_assistant/validate_ha_config.py"
language = "system"
pass_filenames = false
files = "^(k8s/roles/home-assistant/(templates/config|files)/.*|scripts/home_assistant/validate_ha_config\\.py|scripts/diagnostics/probe_lib/(core|ha|obs_api)\\.py|scripts/home_assistant/(ha_state_checks|ha_state_model)\\.py|scripts/lib/(inventory_lists|cli_help|exit_codes|repo_paths|yaml_fast)\\.py)$"

# Validate that every provisioned Grafana dashboard's datasource references resolve to a
# datasource declared in datasources.yml.j2 (uid or name) or a Grafana built-in. Catches the
# silent "No data" / stale-uid class (e.g. a lingering hand-imported uid) before deploy.
[[repos.hooks]]
id = "validate-grafana-dashboards"
name = "Validate Grafana dashboard datasource uids"
entry = "uv run --frozen python scripts/validate/grafana_dashboard_uids.py"
language = "system"
pass_filenames = false
files = "^(k8s/roles/observability/files/dashboards/.*\\.json|k8s/roles/observability/templates/grafana\\.yaml\\.j2|scripts/validate/grafana_dashboard_uids\\.py|scripts/lib/(cli_help|exit_codes|repo_paths)\\.py)$"

# Check the alert plane's inputs with the tools that load them. promtool checks the rendered
# prometheus.yml, every rule file and every rule test; amtool checks the Alertmanager config;
# pint lints the rule files offline under scripts/validate/pint/offline.hcl.
# lokitool parses loki-homelab's LogQL rule files, and the hook fails when those files,
# loki_homelab_rule_groups and the rendered loki-homelab-rules ConfigMap disagree. alloy boots
# the pinned Alloy on loki-homelab's rendered config.alloy, because Alloy's parser rejects
# selectors that Loki accepts and `alloy validate` does not build the components.
# scripts/validate/alert_tools.sh provisions promtool and amtool at the observability role's
# image tags, lokitool and alloy at loki-homelab's, and pint at its own pin, into alert-tools/ under the
# git common dir, shared by every worktree of the clone. CI's `alert_rules.py --prove-red` step
# is the tools' red proof.
#
# The `files` regex names every input the hook reads, because a PR run skips a hook no
# changed file matches: the role's rule, rule-test and Alertmanager sources and the templates
# that render them; loki-homelab's rule files, their ConfigMap template and its defaults, which
# list the groups and pin lokitool's version; the pint configs; its defaults, whose image tags
# set the tool versions; the inventory and
# the scrape_jobs filter, which feed prometheus.yml's loops; and the render's import closure,
# as validate-k8s-manifests names it. pass_filenames = false, so prek runs one instance and
# never races two provisions.
[[repos.hooks]]
id = "validate-alert-rules"
name = "Validate the alert plane and the Alloy config with promtool, amtool, pint, lokitool and alloy"
entry = "uv run --frozen python scripts/validate/alert_rules.py"
language = "system"
pass_filenames = false
files = "^(hosts/lib/host_lib\\.py|scripts/lib/longhorn_lib/longhorn_backups\\.py|cluster/services\\.yml|scripts/renderer/(renderer_lib/[^/]+|shadow_diff)\\.py|scripts/deploy_tools/(chained_timeout|changed_set|kustomizations)\\.py|scripts/lib/plain_scalar\\.py|k8s/roles/observability/(files/rules|tests/rules|files/alertmanager|tests/alertmanager)/.*|k8s/roles/loki-homelab/(files/rules/.*|templates/(rules-)?configmap\\.yaml\\.j2|templates/config/config\\.alloy\\.j2|defaults/main\\.yml)|k8s/roles/observability/templates/(prometheus|prometheus-rules|alertmanager|alertmanager-secret)\\.yaml\\.j2|k8s/roles/observability/defaults/main\\.yml|inventory/(host_vars/[^/]+|group_vars/all)\\.yml|scripts/renderer/template_filters/[^/]+\\.py|scripts/validate/alert_.*|scripts/validate/notification_renders\\.py|scripts/validate/pint/.*|scripts/validate/k8s_manifests\\.py|scripts/validate/validate_lib/(ok_lines|k8s_net_rules|k8s_schema|rule_test_parts)\\.py|scripts/lib/(inventory_lists|guard_jinja_env|host_modules|cli_help|exit_codes|estate|git|jinja_comments|k8s_context|k8s_lookups|k8s_role_callers|k8s_roles|k8s_yaml|render_context|render_guard|repo_paths|role_files|yaml_fast)\\.py)$"

# Same render-then-parse guard as validate-render-templates above, for the k8s manifests.
# Also parses the YAML *embedded* in ConfigMap/Secret values — the manifest wrapping Traefik's
# static config and Authelia's configuration.yml is trivially valid whatever those opaque block
# scalars contain, so an outer-only check would miss the indentation bugs that matter most. A
# broken manifest otherwise first shows up as `error validating data` partway through a kubectl
# apply, with some objects applied and some not.
[[repos.hooks]]
id = "validate-k8s-manifests"
name = "Validate rendered k8s manifest templates"
entry = "uv run --frozen python scripts/validate/k8s_manifests.py"
language = "system"
pass_filenames = false
# daniel-box's host_vars is in scope because the validator renders each role with that host's
# real containers_list entry (port, hostname) rather than a stub.
#
# The six `scripts/lib/k8s_*.py` modules are named one by one rather than matched by a
# `k8s_.*` pattern. The validator's logic lives in them, so an entry naming only
# `k8s_manifests.py` would stop firing on the code that does the work — a hook that quietly
# covers less is exactly what a pattern here would hide next
# time, since a rename makes an alternation fail loudly and a pattern match nothing.
files = "^(hosts/lib/host_lib\\.py|scripts/lib/longhorn_lib/longhorn_backups\\.py|cluster/services\\.yml|scripts/renderer/(renderer_lib/[^/]+|shadow_diff)\\.py|scripts/deploy_tools/(chained_timeout|changed_set|kustomizations)\\.py|scripts/lib/plain_scalar\\.py|scripts/validate/validate_lib/ok_lines\\.py|k8s/roles/.*\\.j2|k8s/templates/ingressroute\\.yml\\.j2|inventory/(group_vars/all|host_vars/daniel-box)\\.yml|scripts/validate/k8s_manifests\\.py|scripts/lib/(inventory_lists|guard_jinja_env|host_modules|cli_help|exit_codes|estate|git|jinja_comments|k8s_context|k8s_lookups|k8s_role_callers|k8s_roles|k8s_yaml|render_context|render_guard|repo_paths|role_files|yaml_fast)\\.py|scripts/validate/validate_lib/(k8s_net_rules|k8s_schema)\\.py|scripts/validate/schemas/(kubernetes\\.io|traefik\\.io)/.*\\.json|scripts/renderer/template_filters/[^/]+\\.py)$"

# Flag bash's `${#var}` length expansion in a Jinja template, before anything renders it. `{#`
# opens a Jinja comment, so a shell script inside a `.j2` that writes `${#var}` either fails the
# render with `Missing end of comment tag` (a message naming neither bash nor a fix) or, when a
# `#}` appears later, has everything between the two silently dropped from the output. The
# render-then-lint hooks above cannot see either case: the first never renders, and the second
# renders with the evidence already deleted. This one scans template TEXT, across every `.j2` in
# the tree rather than one validator's own subtree.
[[repos.hooks]]
id = "validate-jinja-bash-collisions"
name = "Flag bash ${#var} length expansions in Jinja templates"
entry = "uv run --frozen python scripts/validate/jinja_bash_collisions.py"
language = "system"
pass_filenames = false
# Every template in the tree, plus the scanner itself. No inventory or defaults file is in
# scope: this reads template text and renders nothing, so no variable can change its verdict.
files = "^(k8s/.*\\.j2|scripts/validate/jinja_bash_collisions\\.py|scripts/lib/(cli_help|exit_codes|repo_paths)\\.py)$"

# Fail when a root-level file exists that `.gitignore`'s `/*` hides from git. Such a file
# stages nothing and lands nothing through a green CI and a clean merge. A
# hidden file is by definition never staged, so no `files` pattern can trigger this: it runs
# on every commit, and on a clean CI checkout it finds nothing to report.
[[repos.hooks]]
id = "validate-root-ignored-files"
name = "Root-level files hidden by .gitignore's deny-all"
entry = "uv run --frozen python scripts/validate/root_ignored_files.py"
language = "system"
pass_filenames = false
always_run = true

# Lint the GitHub Actions workflows themselves. `check-yaml` above only proves they PARSE —
# nothing else checks that a job's `needs:` names a job that exists, that a `${{ }}`
# expression references a real context, or that a matrix key is spelled the way the steps read
# it. Those fail at trigger time, in a workflow whose whole job is to be the gate. actionlint
# also runs shellcheck over every `run:` block (shellcheck-py is already a dev dep, so it is on
# PATH under `uv run`), which the shellcheck hook above cannot do — identify tags a workflow as
# yaml, so the shell embedded in it is invisible to a shell-typed hook.
#
# Via the actionlint-py package + `uv run`, matching the other local hooks, NOT the upstream
# rhysd/actionlint pre-commit repo: that hook is `language = "golang"`, which on a machine
# without Go (daniel-box) makes prek fetch a ~270 MB managed toolchain and build from source.
#
# It reads `.github/actionlint.yaml`, which declares the one hosted runner label actionlint's
# own hard-coded list does not carry yet. That file says which, and when to delete it.
#
# The entry is a wrapper, not actionlint itself: actionlint 1.7.12 rejects the
# `uses: $/.github/actions/setup` callers and skips their input checks, so the wrapper lints a
# copy rewritten to `./`. The `# DECIDED:` marker in .github/actions/setup/action.yml says when
# to call actionlint directly again. A change to the action or to the wrapper's own modules
# re-lints every workflow, so the hook passes no filenames.
[[repos.hooks]]
id = "actionlint"
name = "Lint GitHub Actions workflows"
entry = "uv run --frozen python scripts/validate/actionlint_dollar_refs.py"
language = "system"
files = "^(\\.github/(workflows/[^/]+\\.ya?ml|actions/.*|actionlint\\.yaml)|scripts/validate/actionlint_dollar_refs\\.py|scripts/lib/(cli_help|exit_codes|git|repo_paths)\\.py)$"
pass_filenames = false

# The wrapper's red proof runs the real actionlint binary, which only the `lint` group installs.
# CI's pytest shards skip that group and so skip the two tests; this hook runs them in the hooks
# job, which has it.
[[repos.hooks]]
id = "actionlint-red-proof"
name = "The actionlint wrapper still flags an undefined input on a $/ caller"
entry = "uv run --frozen pytest -q -n0 -p no:cacheprovider scripts/validate/tests/test_validate_actionlint_dollar_refs.py"
language = "system"
pass_filenames = false
files = "^(\\.github/actions/.*|scripts/validate/(tests/test_validate_)?actionlint_dollar_refs\\.py|scripts/lib/(cli_help|exit_codes|git|repo_paths)\\.py|uv\\.lock)$"

# The security half of workflow linting, which actionlint does not do: a checkout that leaves
# the token on disk, a `${{ }}` expression injected into a `run:` shell, an unpinned action, a
# `pull_request_target` reading the PR head. Offline audits
# only: the online ones ask GitHub's API and would need a token on every commit. It also audits
# the local composite actions under .github/actions/, which actionlint does not lint at all.
[[repos.hooks]]
id = "zizmor"
name = "Audit GitHub Actions workflows (zizmor)"
entry = "uv run --frozen zizmor --no-progress --no-online-audits"
language = "system"
files = "^\\.github/(workflows/[^/]+|actions/[^/]+/action)\\.ya?ml$"

# Gate that the secret-rotation registry (secrets/secret_rotation.yml) stays in sync with the
# encrypted secrets.yml — fails the commit if a secret was added/removed without running
# `secret_rotation.py sync`. Read-only: reads plaintext key NAMES only, never decrypts a value
# (no age key needed), so it's CI-safe. Catches the drift at commit time instead of a day later,
# when the daily audit's `SecretRotationAuditFailed` alert fires.
[[repos.hooks]]
id = "secret-rotation-registry-sync"
name = "Secret-rotation registry in sync with secrets.yml"
entry = "uv run --frozen python scripts/secrets_mgmt/secret_rotation.py audit --check"
language = "system"
pass_filenames = false
# The whole `scripts/secrets_mgmt/` tree, not `secret_rotation.py` alone: `load_registry`,
# `sops_names` and every other process boundary the gate depends on moved into
# `rotation_tools.py`, and a per-file list here is a list that goes stale on the next split.
# The rest is the import closure of `audit --check`: `consumers` reaches `k8s_lookups`.
files = "^(secrets/secrets\\.yml|secrets/secret_rotation\\.yml|scripts/secrets_mgmt/.*\\.py|scripts/lib/(cli_help|exit_codes|git|k8s_lookups|repo_paths|yaml_fast)\\.py)$"

# The cluster's SOPS files (target slice D3): the cluster file
# secrets/cluster-vars.sops.env, the manifests under secrets/cluster-manifests/ and
# the freshness evidence secrets/cluster-vars.source. Only `cluster_vars.py write`
# writes them, so this runs the checks that need no render or key: every value is ciphertext,
# a file whose content moved also moved its MAC and lastmodified lines since HEAD, each file
# is encrypted to its own creation rule, and .source matches secrets.yml's ciphertext. A
# plaintext value or a hand edit then fails here rather than after a push. CI's full `check`
# is the backstop for a commit made without hooks, which is how the rotation cron commits.
# While no cluster file exists the hook checks nothing and passes.
# `files` is the cluster paths plus the entry's import closure, which
# scripts/tests/test_prek_files_cover_entry_imports.py derives and holds this regex to. The
# closure reaches the renderer through `write` and the full `check`, which this hook never
# runs, but a change there must still rerun the hook rather than merge with it skipped.
[[repos.hooks]]
id = "cluster-vars-ciphertext"
name = "Cluster SOPS files are ciphertext written by cluster_vars.py"
entry = "uv run --frozen python scripts/secrets_mgmt/cluster_vars.py check --no-render --base HEAD"
language = "system"
pass_filenames = false
files = "^(secrets/cluster-|scripts/renderer/template_filters/[^/]+\\.py$|hosts/lib/host_lib\\.py$|scripts/(lib|renderer|secrets_mgmt)/.+\\.py$|scripts/deploy_tools/(chained_timeout|changed_set|kustomizations)\\.py$)"

# Assert uv.lock stays consistent with pyproject.toml. Every unattended production path
# (promote.yml, secret-rotation-audit) runs `uv run --frozen`, which installs
# the committed lock AS-IS and never re-resolves — so a pyproject edit merged without a refreshed
# lock reaches the host as an environment missing the dependency it needs, surfacing later as a
# confusing import failure (a failed promotion, or `SecretRotationAuditFailed` firing).
# Every `uv run` hook in this file carries `--frozen` too, so the gate resolves from the
# same lock production does rather than silently regenerating one in the ephemeral checkout;
# what `--frozen` cannot do is notice the drift, which is this hook's job: `uv lock --check`
# (read-only; exits non-zero on drift, never writes) mirrors the prod invariant at commit time.
# Renovate's weekly lockFileMaintenance refreshes the lock but is NOT a same-commit gate, so a
# human pyproject edit is the open escape hatch this closes.
[[repos.hooks]]
id = "uv-lock-check"
name = "uv.lock in sync with pyproject.toml"
entry = "uv lock --check"
language = "system"
pass_filenames = false
files = "^(pyproject\\.toml|uv\\.lock)$"

# Rewrites a role CLAUDE.md's generated `## At a glance` block in the commit that moves one of
# its sources, and fails like a formatter so the author stages the doc and commits again
# (a stale block otherwise fails
# test_every_deployed_role_block_matches_what_the_generator_writes_now in CI, which stays as
# the backstop for a commit that skipped prek).
#
# `files` is every input the generator reads: the roles, the inventory, the shared templates
# whose macros declare claims, the template filter it imports, and the Python under scripts/docs and
# scripts/lib. A role CLAUDE.md matches too, so a hand edit inside the
# markers is reverted in the same commit. None of the docs-refresh cron's three staged paths
# match, so that cron's commit never writes under k8s/roles/. Renovate edits defaults
# without prek, but only an image tag or digest, which the block does not print.
[[repos.hooks]]
id = "regen-role-glance"
name = "Role At a glance blocks match their sources"
entry = "uv run --frozen python scripts/docs/gen_role_glance.py --fix"
language = "system"
pass_filenames = false
files = "^(hosts/lib/host_lib\\.py|scripts/lib/longhorn_lib/longhorn_backups\\.py|cluster/services\\.yml|(k8s|inventory)/.*|scripts/renderer/template_filters/.*|hosts/components/.*|hosts/[^/]+/package\\.yml|hosts/packages/.*|secrets/secret_rotation\\.yml|scripts/(docs|lib)/.*\\.py|scripts/renderer/renderer_lib/.*\\.py|scripts/deploy_tools/(chained_timeout|changed_set|kustomizations)\\.py)$"

# Rewrites a stale docs fragment (docs/assets/generated/fragments/) in the commit that moves
# one of its tunables, and fails like a formatter so the author stages the fragment and commits
# again. It sits above `static-ratchet-tests`, which runs
# test_every_committed_fragment_matches_what_the_generator_writes_now, so that test reads the
# rewritten fragment.
#
# `files` is every input the generator reads: role defaults and templates (the auto-deploy
# coverage walks every k8s role's defaults, which no fragment header lists), the inventory,
# the template filter, `secrets/secret_rotation.yml`, and the
# Python under scripts/ that reads or renders a fragment. The fragments themselves match too,
# so a hand edit is reverted in the same commit. That makes the hook fire on the docs-refresh
# cron's commit, which stages docs/assets/generated/; build_docs.py regenerates the fragments
# into that directory before the cron commits, so there it writes nothing and exits 0.
[[repos.hooks]]
id = "regen-doc-fragments"
name = "Docs fragments match their sources"
entry = "uv run --frozen python scripts/docs/gen_doc_fragments.py --fix"
language = "system"
pass_filenames = false
files = "^(hosts/lib/host_lib\\.py|scripts/lib/longhorn_lib/longhorn_backups\\.py|cluster/services\\.yml|(k8s|inventory)/.*|scripts/renderer/template_filters/.*|hosts/components/.*|hosts/[^/]+/package\\.yml|secrets/secret_rotation\\.yml|scripts/.*\\.py|docs/assets/generated/fragments/.*)$"

# Rewrites a value a doc states in a sentence, in the commit that moves the value, and fails
# like a formatter so the author reads the sentence, stages the doc and commits again. The
# rows are `VALUES` in scripts/docs/doc_values.py. A fragment is a whole generated table; this
# is one number inside hand-written prose.
#
# `files` is each row's doc and source, and the Python the script imports.
# tests/repo/test_doc_values_hook.py holds the pattern against the rows. No row names a path the
# docs-refresh cron stages, so the hook stays out of the cron's commit: a doc rewritten there
# would be left unstaged, and one unstaged file parks homelab-checkout-sync.
#
# It is its own hook, not a mode of `regen-doc-fragments`, because the cron also runs the
# fragment generator, and a second entry point cannot rewrite a doc from the cron by mistake.
[[repos.hooks]]
id = "regen-doc-values"
