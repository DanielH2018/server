  | hosts/components/claude-code/CLAUDE\.md
  | hosts/components/claude-code/defaults/main\.yml
  | hosts/components/claude-code/templates/claude-triage-pins\.j2
  | hosts/components/claude-code/templates/sync-artifacts\.sh\.j2
  | hosts/components/claude-code/units/homelab-claude-guardrail-ack\.timer\.j2
  | hosts/components/claude-code/units/homelab-claude-triage-poll-alert\.service
  | hosts/components/deploy-ui/CLAUDE\.md
  | hosts/components/deploy-ui/files/deploy_ui\.html
  | hosts/components/docs-refresh/templates/docs-refresh\.sh\.j2
  | hosts/components/k3s-host-checks/defaults/main\.yml
  | hosts/components/renovate-notify/files/pending_logic\.py
  | hosts/components/worktree-sweep/units/homelab-worktree-sweep\.timer
  | hosts/daniel-box/vars\.yml
  | k8s/roles/arr-notification/CLAUDE\.md
  | k8s/roles/autofix-bridge/CLAUDE\.md
  | k8s/roles/autofix-bridge/templates/deployment\.yaml\.j2
  | k8s/roles/bento-pdf/CLAUDE\.md
  | k8s/roles/bento-pdf/defaults/main\.yml
