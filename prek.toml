language = "system"
pass_filenames = false
files = "^(hosts/lib/host_lib\\.py|scripts/lib/longhorn_lib/longhorn_backups\\.py|k8s/services\\.yml|scripts/renderer/(renderer_lib/[^/]+|shadow_diff)\\.py|scripts/deploy_tools/(chained_timeout|changed_set|kustomizations)\\.py|scripts/lib/plain_scalar\\.py|k8s/roles/observability/(files/rules|tests/rules|files/alertmanager|tests/alertmanager)/.*|k8s/roles/loki-homelab/(files/rules/.*|templates/(rules-)?configmap\\.yaml\\.j2|templates/config/config\\.alloy\\.j2|defaults/main\\.yml)|k8s/roles/observability/templates/(prometheus|prometheus-rules|alertmanager|alertmanager-secret)\\.yaml\\.j2|k8s/roles/observability/defaults/main\\.yml|(hosts/([^/]+/)?vars|estate/vars|k8s/vars)\\.yml|scripts/renderer/template_filters/[^/]+\\.py|scripts/validate/alert_.*|scripts/validate/notification_renders\\.py|scripts/validate/render_lib/k8s\\.py|scripts/validate/validate_lib/[^/]+\\.py|scripts/validate/tests/alerts/test_validate_alert_rules\\.py|scripts/lib/[^/]+\\.py|pyproject\\.toml|uv\\.lock)$"

# The unit-template census: every unit template the validator must find still exists.
[[repos.hooks]]
id = "static-ratchet-tests-units"
name = "Every known unit template is still discovered"
entry = "uv run --frozen pytest -q -n0 -p no:cacheprovider scripts/validate/tests/renders/test_render_units.py::test_discover_templates_finds_the_known_set"
language = "system"
pass_filenames = false
files = "^(hosts/lib/host_lib\\.py|scripts/lib/longhorn_lib/longhorn_backups\\.py|(k8s/roles|hosts/components)/.*\\.(service|timer|socket|rules)\\.j2|scripts/validate/(render_lib/units|tests/renders/test_render_units)\\.py|scripts/validate/validate_lib/[^/]+\\.py|scripts/renderer/renderer_lib/[^/]+\\.py|scripts/deploy_tools/(chained_timeout|changed_set|kustomizations)\\.py|scripts/lib/[^/]+\\.py|scripts/renderer/template_filters/[^/]+\\.py|pyproject\\.toml|uv\\.lock)$"


# The `hooks` key of .claude/settings.json is rendered from the `# gen-hooks:` block each file
# under .claude/hooks/ carries (scripts/dev/gen_hook_settings.py). `--check` fails on a hook
# file that declares nothing -- the exists-but-unregistered gap the two tests beside it cannot
# see, since test_hook_scripts_executable.py reads only the registered side -- and on a
# settings.json that drifted from the declarations. Run the generator without `--check` and
# commit what it writes. `files` names the generator itself, the way `ruff` names
# pyproject.toml above: a change to the render is a change to what the committed file must be.
[[repos.hooks]]
id = "gen-hook-settings"
name = "Hook registrations match the .claude/hooks/ declarations"
entry = "uv run --frozen python scripts/dev/gen_hook_settings.py --check"
language = "system"
pass_filenames = false
files = "^(\\.claude/hooks/[^/]+\\.(sh|py)|\\.claude/settings\\.json|scripts/dev/gen_hook_settings\\.py|scripts/lib/(cli_help|exit_codes|repo_paths)\\.py)$"

# `--check` fails on a rule file edited by hand, a table edit committed without its render, and an
# inventory host the table does not list.
[[repos.hooks]]
id = "gen-host-rules"
name = "The host rule groups match their tables"
entry = "uv run --frozen python scripts/dev/gen_host_rules.py --check"
language = "system"
pass_filenames = false
files = "^(k8s/roles/observability/(files/rule-tables/.*|files/rules/(host-checks|hosts)\\.yaml|defaults/main\\.yml)|hosts/[^/]+/package\\.yml|hosts/[^/]+/vars\\.yml|scripts/dev/gen_host_rules\\.py|scripts/lib/(cli_help|container_entry|estate|exit_codes|git|inventory_lists|render_guard|repo_paths|role_files|yaml_fast)\\.py)$"

# `files` names pyproject.toml and uv.lock too: a commit that only enables a rule changes what every
# .py must satisfy, and `uv run --frozen` runs the ruff pinned in the lock.
[[repos.hooks]]
id = "ruff"
name = "Lint first-party Python (ruff)"
entry = "uv run --frozen ruff check"
language = "system"
pass_filenames = false
files = "(\\.py$|^(pyproject\\.toml|uv\\.lock)$)"

# `--check` fails the commit on an unformatted file instead of rewriting it.
[[repos.hooks]]
id = "ruff-format"
name = "Format first-party Python (ruff format)"
entry = "uv run --frozen ruff format --check"
language = "system"
pass_filenames = false
files = "(\\.py$|^(pyproject\\.toml|uv\\.lock)$)"

# ruff reads one file at a time, so a value crossing a function boundary as the wrong type is
# invisible to it.
[[repos.hooks]]
id = "ty"
name = "Type-check first-party Python (ty)"
entry = "uv run --frozen ty check"
language = "system"
pass_filenames = false
files = "(\\.py$|^(pyproject\\.toml|uv\\.lock)$)"

# A name is dead only against every caller in the tree, so this runs over the whole project.
[[repos.hooks]]
id = "vulture"
name = "No Python name that nothing uses (vulture)"
entry = "uv run --frozen vulture"
language = "system"
pass_filenames = false
files = "(\\.py$|^(pyproject\\.toml|uv\\.lock)$)"

# Fast syntax-only gate: `bash -n` parses (doesn't run) every shell script. Catches the bug
# class of an apostrophe inside a single-quoted `python3 -c '...'` block, which breaks bash's
# own quote parsing. shellcheck
# above would also catch this, but `bash -n` is near-free and independent of it — a belt-and-
# suspenders backstop if the shellcheck-py hook is ever skipped/broken.
# `types = ["shell"]` (identify's shebang-aware detection, same as the shellcheck hook above)
# rather than a `.sh$` files regex — the NUT role's upssched-cmd (files/upssched-cmd, no
# extension: the filename is fixed by upssched's own config) is a real bash script and would be
# silently skipped by an extension-only match.
# NB: `entry` loops over "$@" itself — pre-commit/prek batch every matched filename into ONE
# invocation, and a bare `bash -n "$1" "$2"` silently only checks "$1" ($2+ become that
# script's own positional params, not additional files to parse).
[[repos.hooks]]
id = "bash-syntax-check"
name = "bash -n (shell syntax check)"
entry = "bash -c 'for f in \"$@\"; do bash -n \"$f\" || exit 1; done' --"
language = "system"
types = ["shell"]

# Prose style for the hand-written docs the ADR set introduced. Google's published style
# package plus two homelab rules; see .vale.ini for what is in scope and why.
#
# `files:` repeats .vale.ini's scope rather than trusting it, and the duplication is
# deliberate. Vale exits 0 on a file it has no section for, so a hook that passed every
# Markdown file would read green while checking nothing outside the two configured paths —
# and would ALSO hand it docs/reference/, whose commits come from the docs-refresh cron.
#
# The duplication is safe only because scripts/tests/test_vale_scope.py asserts this regex covers
# every .vale.ini section. A page in .vale.ini but not in this regex makes the hook report
# "no files to check" and goes ungated while reading green. Adding a page to .vale.ini alone
# does not lint it — it has to be in both.
#
# DECIDED: never widen this hook to docs/reference/; the docs-refresh cron commits those paths
# with hooks running, so a strict failure stops every refresh.
# A style error there aborts the commit and alerts on every run until someone fixes the
# generator. ENFORCED by the same test.
#
# The Google package is fetched, not tracked: .vale.ini pins its release URL and .gitignore
# excludes styles/Google/, so a fresh checkout — every new worktree — has the tracked Homelab
# style and nothing else on StylesPath. A bare `vale` there dies with "style 'Google' does
# not exist on StylesPath" on every commit that touches a doc, until someone runs `vale sync`
# by hand in that worktree. `scripts/validate/vale.sh` provisions the package and then execs
# Vale. It is a script rather than a `bash -c` entry because prek splits the file list across
# several CONCURRENT invocations, and an inline guard on the directory raced itself in a fresh
# worktree — read that script's header for the failure and the lock that fixes it.
# ENFORCED by scripts/validate/tests/repo_checks/test_vale_sync_guard.py.
[[repos.hooks]]
id = "vale"
name = "Prose style (Vale, scoped to ADRs, top-level docs pages and generated fragments)"
entry = "scripts/validate/vale.sh"
language = "system"
# docs/[^/]+\.md is every top-level page and nothing below it, which is what keeps
# docs/archive/ and docs/reference/ out. See .vale.ini for why each is excluded.
#
# DECIDED: the generated fragments under docs/assets/generated/fragments/ are linted here,
# although the docs-refresh cron commits them with hooks running. The operator chose this so
# that a generator's prose is gated in CI and not only by a hand
# `vale docs` run. The cost is accepted: a Vale error in a fragment
# aborts the cron's commit, and its commit-failure stamp reports DOWN on every run until the
# generator in scripts/docs/gen_doc_fragments.py is fixed. docs/reference/ stays out.
files = "^(docs/adr/.*\\.md|docs/[^/]+\\.md|docs/assets/generated/fragments/[^/]+\\.md)$"

# A broken include, a nav entry pointing at a deleted page or a dead link is otherwise caught only
# by the docs-refresh cron.
[[repos.hooks]]
id = "mkdocs-strict"
name = "Build the docs site (mkdocs --strict)"
entry = "uv run --frozen mkdocs build --strict --site-dir .mkdocs-strict-check"
language = "system"
pass_filenames = false
files = "^(docs/.*|mkdocs\\.yml|scripts/docs/.*\\.py|uv\\.lock)$"

# The harness's attribution reminder ends every commit message with a footer that opens with
# the robot emoji (U+1F916), and the operator's no-emoji rule wins over it. A squash merge makes
# the message master history, so this rejects it at the commit-msg stage. It is the
# one hook not at pre-commit: git passes it the message file, and `prek run` never runs it.
[[repos.hooks]]
id = "reject-robot-emoji"
name = "Reject the robot emoji in a commit message"
entry = "uv run --frozen python scripts/dev/reject_robot_emoji.py"
language = "system"
stages = ["commit-msg"]
