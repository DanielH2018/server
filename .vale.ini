StylesPath = styles
MinAlertLevel = error

# Pinned to a release URL, not the bare name `Google`. A bare name resolves through Vale's
# registry to whatever the LATEST release is, at `vale sync` time — so the 15 `level: error`
# rules gating `prek run --all-files` could change with no commit here, turning master red on
# an unrelated PR. Measured 2026-08-31: `Packages = Google` on the pinned binary fetched a tree
# byte-identical to this release. styles/ stays unvendored (see .gitignore) — this pins the
# VERSION fetched, not where it lives. Renovate tracks the URL (github-releases, vale-cli/Google).
Packages = https://github.com/vale-cli/Google/releases/download/v0.7.1/Google.zip

# The homelab's own vocabulary — Traefik, Longhorn, hostPath, inode and the rest. Without
# it Vale.Spelling reports 30-odd domain terms per ADR as misspellings, which buries a real
# typo. A vocabulary is the supported mechanism; per-file exceptions are how a style gate
# becomes decorative.
Vocab = Homelab

# SCOPE: every top-level document, plus the ADRs.
#
# This used to be a list of individual new files, because the 19 documents already in docs/
# were grandfathered: a tree-wide lint over an unmigrated corpus lands red on day one and
# gets switched off, which is worse than a narrow gate that holds. That reasoning expired
# when the corpus was migrated — the findings were worked through rather than waived, so the
# gate can now cover the tree it was always meant to cover.
#
# `docs/*.md` DOES cross a directory separator in Vale's globbing — it matches
# docs/archive/README.md and every docs/reference/ page too. The explicit opt-out sections at
# the bottom of this file are what actually excludes those trees; do not delete them on the
# assumption that the glob is already narrow. Both exclusions are deliberate:
#
# - docs/archive/ is history. Its content is deliberately unedited except for path fixes, so
#   linting it would mean rewriting records of what was decided at the time.
#
# - docs/reference/ is generated, and the exclusion is load-bearing rather than lazy. The
#   docs-refresh cron stages exactly those paths and commits with hooks running. A Vale error
#   on generated content would abort that commit, alert, and exit non-zero on every run until
#   someone fixed the generator — a style rule wedging the pipeline that keeps the docs
#   current. Nothing is lost: a generated page's prose lives in its generator's render
#   function, which is reviewed as code and covered by that generator's tests. Linting the
#   emitted Markdown would flag the template's author at a place they cannot edit — the
#   hand-edit hook denies exactly those files.
#
# ENFORCED by scripts/tests/test_vale_scope.py, which asserts prek.toml's `files:` regex covers
# every section here and still excludes docs/reference/. The two drifted apart once already.
[docs/*.md]
BasedOnStyles = Vale, Google, Homelab

# Google forbids spaces around a dash. The house style in ~/.claude/CLAUDE.md uses the
# spaced em-dash and budgets one aside per paragraph, so this rule fires on prose that is
# correct here. Turned off rather than worked around: a gate that flags every conforming
# paragraph is one people learn to skim past.
Google.EmDash = NO

# Google.Units wants a nonbreaking space between a number and its unit. Every one of the 18
# occurrences in this corpus is a false positive, and they split two ways:
#
# - HTTP status codes, usually as a verb or a plural: "each one a B2 call that 403s", "the
#   404s in slice 4". A status code is not a measurement and takes no space.
# - Kubernetes and systemd duration literals quoted from the config they describe:
#   "`activeDeadlineSeconds` (120s)", "the Ansible wait (180s)". Writing "120 s" would stop
#   the prose matching the value it names, which is the whole reason it is quoted.
#
# Left on for docs/adr/, where neither pattern occurs.
Google.Units = NO

[docs/adr/*.md]
BasedOnStyles = Vale, Google, Homelab
# docs/adr/template.md is in scope on purpose. It is the form every future ADR is copied
# from, so prose that fails the gate there propagates into records that then fail it too.
Google.EmDash = NO

# Vale's section globs cross directory separators: `docs/*.md` above also matches
# docs/archive/README.md and every docs/reference/ page (measured — 101 findings in
# reference/ alone). These two sections turn every style back off for those trees, so the
# exclusion holds for a bare `vale docs` and not only for the prek hook's file list.
#
# Relying on the hook regex alone would mean the cron's protection lived in a different file
# from the config that claims to provide it.
[docs/archive/**]
BasedOnStyles =

[docs/reference/**]
BasedOnStyles =
