StylesPath = styles
MinAlertLevel = error

Packages = Google

# The homelab's own vocabulary — Traefik, Longhorn, hostPath, inode and the rest. Without
# it Vale.Spelling reports 30-odd domain terms per ADR as misspellings, which buries a real
# typo. A vocabulary is the supported mechanism; per-file exceptions are how a style gate
# becomes decorative.
Vocab = Homelab

# SCOPED DELIBERATELY. The existing 19 documents in docs/ and the 87 role CLAUDE.md files
# are grandfathered: a tree-wide lint over that corpus lands red on day one and gets
# switched off, which is worse than a narrow gate that holds.
#
# docs/reference/ is EXCLUDED, and that exclusion is load-bearing rather than lazy. The
# docs-refresh cron stages exactly those paths and commits with hooks running. A Vale error
# on generated content would abort that commit, alert, and exit non-zero on every run until
# someone fixed the generator — a style rule wedging the pipeline that keeps the docs
# current.
#
# Nothing is lost by excluding it. A generated page's prose lives in its generator's render
# function, which is reviewed as code and covered by that generator's tests. Linting the
# emitted Markdown would flag the template's author at a place they cannot edit — the
# hand-edit hook denies exactly those files.
#
# docs/adr/template.md is in scope on purpose. It is the form every future ADR is copied
# from, so prose that fails the gate there propagates into records that then fail it too.
[docs/adr/*.md]
BasedOnStyles = Vale, Google, Homelab
# Google forbids spaces around a dash. The house style in ~/.claude/CLAUDE.md uses the
# spaced em-dash and budgets one aside per paragraph, so this rule fires on prose that is
# correct here. Turned off rather than worked around: a gate that flags every conforming
# paragraph is one people learn to skim past.
Google.EmDash = NO

# Written after the gate existed, so they are in scope from their first commit. That is the
# whole reason the scope is a list of new documents rather than the tree: a page linted from
# the day it was written never accumulates a backlog to grandfather.
[docs/{deploying,gitops-pipeline,diagrams-plan}.md]
BasedOnStyles = Vale, Google, Homelab
Google.EmDash = NO

[docs/index.md]
BasedOnStyles = Vale, Google, Homelab
# Google forbids spaces around a dash. The house style in ~/.claude/CLAUDE.md uses the
# spaced em-dash and budgets one aside per paragraph, so this rule fires on prose that is
# correct here. Turned off rather than worked around: a gate that flags every conforming
# paragraph is one people learn to skim past.
Google.EmDash = NO
