StylesPath = styles
MinAlertLevel = error

# Pinned to a release URL, not the bare name `Google`. A bare name resolves through Vale's
# registry to whatever the LATEST release is, at `vale sync` time — so the 15 `level: error`
# rules gating `prek run --all-files` could change with no commit here, turning master red on
# an unrelated PR. Measured: `Packages = Google` on the pinned binary fetched a tree
# byte-identical to this release. styles/ stays unvendored (see .gitignore) — this pins the
# VERSION fetched, not where it lives. Renovate tracks the URL (github-releases, vale-cli/Google).
Packages = https://github.com/vale-cli/Google/releases/download/v0.7.2/Google.zip

# Without the vocabulary Vale.Spelling reports 30-odd domain terms per ADR as misspellings, burying
# real typos.
Vocab = Homelab

# SCOPE: every top-level document, plus the ADRs.
#
# The gate covers the whole tree rather than a list of individual files. A tree-wide lint
# over an unmigrated corpus lands red on day one and gets switched off, but this corpus has
# had its findings worked through rather than waived.
#
# `docs/*.md` DOES cross a directory separator in Vale's globbing — it matches
# docs/archive/README.md and every docs/reference/ page too. The explicit opt-out sections at
# the bottom of this file are what actually excludes those trees; do not delete them on the
# assumption that the glob is already narrow. Both exclusions are deliberate:
#
# - docs/archive/ is history. Its content is deliberately unedited except for path fixes, so
#   linting it would mean rewriting records of what was decided at the time.
#
# - docs/reference/ is generated, and the exclusion is load-bearing rather than lazy. The
#   docs-refresh cron stages exactly those paths and commits with hooks running. A Vale error
#   on generated content would abort that commit, alert, and exit non-zero on every run until
#   someone fixed the generator — a style rule wedging the pipeline that keeps the docs
#   current. Nothing is lost: a generated page's prose lives in its generator's render
#   function, which is reviewed as code and covered by that generator's tests. Linting the
#   emitted Markdown would flag the template's author at a place they cannot edit — the
#   hand-edit hook denies exactly those files.
#
# docs/assets/generated/fragments/ is generated too, and is IN scope: hand-written pages
# transclude each fragment, so its prose reads as the page's own, and a Vale error there
# would otherwise surface only in a hand run. `[docs/*.md]`
# already matches the fragments; the prek hook's `files:` regex is what hands them to Vale.
# The cost to the docs-refresh cron is recorded at that regex in prek.toml.
#
# ENFORCED by scripts/tests/test_vale_scope.py, which asserts prek.toml's `files:` regex covers
# every section here and still excludes docs/reference/. The two drifted apart once already.
[docs/*.md]
BasedOnStyles = Vale, Google, Homelab

# Google forbids spaces around a dash, but the house style uses the spaced em-dash, so this rule
# fires on correct prose.
Google.EmDash = NO

# Every occurrence in this corpus is a false positive: HTTP status codes ("403s") and duration
# literals quoted from config ("120s"), where "120 s" would stop matching the value.
Google.Units = NO

# Google ships Will as a warning, which MinAlertLevel = error above never shows. Present tense
# is a rule in ~/.claude/CLAUDE.md ("Nothing dates the prose"), so here it gates: 21 sentences
# carried a `will` when the rule was enabled and every one read as a fact about how the
# system behaves.
# A quoted attitude keeps its `will` behind an inline `vale Google.Will = NO` marker.
Google.Will = error

# An all-caps stem with a plural or possessive suffix: PRs, POSTs, LISTs, HOST's, ACME's.
# Vale up to 3.21 skipped these as acronyms. 3.22.0 adopted Hunspell's case and affix model
# and began flagging every one, which turned master red on 15 untouched lines in 10 docs the
# moment Renovate bumped the binary. Ignoring the token shape restores the 3.21
# behaviour. An ordinary word is still spell-checked, because the stem must be two or more
# capitals. A vocabulary entry per word was the alternative, and it fails the next time
# someone writes `CRDs`.
#
# DECIDED: `[A-Z][A-Z]+`, not `[A-Z]{2,}`. Vale splits a TokenIgnores value on commas, so the
# `{2,}` form parses as two broken patterns. The first attempt silently ignored nothing;
# wrapped in a group, it failed with "missing closing )".
TokenIgnores = (\b[A-Z][A-Z]+(?:s|'s)\b)

[docs/adr/*.md]
BasedOnStyles = Vale, Google, Homelab
TokenIgnores = (\b[A-Z][A-Z]+(?:s|'s)\b)
# template.md is in scope on purpose: it is the form every ADR is copied from.
Google.EmDash = NO
Google.Will = error

# Vale's section globs cross directory separators: `docs/*.md` above also matches
# docs/archive/README.md and every docs/reference/ page (measured — 101 findings in
# reference/ alone). These two sections turn every style back off for those trees, so the
# exclusion holds for a bare `vale docs` and not only for the prek hook's file list.
#
# Relying on the hook regex alone would mean the cron's protection lived in a different file
# from the config that claims to provide it.
[docs/archive/**]
BasedOnStyles =

[docs/reference/**]
BasedOnStyles =
