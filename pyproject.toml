[project]
name = "server-homelab"
version = "0.0.0"
requires-python = ">=3.15"
# promote.yml and ci.yml's validator jobs set UV_NO_DEV and UV_NO_GROUP=lint, so a package listed
# only in a group is absent there.
dependencies = [
  "pyyaml",
  "jinja2>=3",
  "pydantic>=2.14.4",
]

[build-system]
requires = ["uv_build>=0.13,<0.15"]
build-backend = "uv_build"

[tool.uv]
package = true
# The same range as `uv_build` above, so every uv that syncs uses its bundled backend rather than
# fetching one. CI's setup-uv reads this too.
required-version = ">=0.13,<0.15"
default-groups = ["dev", "lint"]     # `uv run` installs both; UV_NO_DEV drops only `dev`
# DECIDED: no `compile-bytecode` here. uv applies it to the sync inside every `uv run`, which
# then recompiles the venv and prints `Bytecode compiled N files` on each call. The explicit
# syncs pass `--compile-bytecode` instead (checkout_sync.py, claude-clone-sync.sh, CI's setup
# action), so a root importer of daniel-box's checkout or the agent clone still finds bytecode
# the syncing user wrote. A session worktree's venv goes uncompiled.

# PyYAML ships no wheel for some interpreters, and a source build without libyaml's headers silently
# falls back to the pure-Python parser.
[tool.uv.extra-build-variables]
pyyaml = { PYYAML_FORCE_LIBYAML = "1" }

[tool.uv.build-backend]
module-root = "scripts"
namespace = true
module-name = [
  "backup",
  "deploy_tools",
  "dev",
  "diagnostics",
  "docs",
  "freshrss",
  "grafana",
  "home_assistant",
  "infra_map",
  "lib",
  "renderer",
  "secrets_mgmt",
  "validate",
]

[dependency-groups]
dev = [                              # `dev` is uv's default group for `uv run`/`uv sync`
  "pytest>=8",
  "requests",                       # ical-proxy ical_proxy.py imports requests (test_app.py)
  "flask",                          # ical-proxy ical_proxy.py imports flask at module top (test_app.py)
  "shellcheck-py==0.11.0.1",        # validate.render_lib.shell; pinned to match prek.toml's shellcheck-py rev
  "pytest-xdist",                   # -n auto in addopts below; pytest was 13.5s of CI's hook budget
  "jsonschema",                     # validate.render_lib.k8s checks every object against the
  "mkdocs",                         # test_mkdocs_repo_links renders with mkdocs.yml's extensions
  "pymdown-extensions",             # through the hook module, which imports mkdocs.utils.
  "pygments",
  "lxml",                           # scripts/freshrss/scrape_feed.py runs XPath 1.0 with functions
  "lxml-stubs",                     # lxml.etree is a C extension; ty resolves it only from these
  "loguru",                         # karakeep's test_time_tagger_logging.py runs the tagger's real handler setup
  "hypothesis>=6.170",              # property tests; profiles in tests/hypothesis_profiles.py
  "icalendar",                      # ical-proxy ical_proxy.py parses and writes every feed with it (test_app.py)
  "import-linter>=2.17",            # [tool.importlinter] contracts (test_scripts_import_direction.py)
]
# Local test reruns only, absent from `default-groups`, so CI never installs it. docs/ci-throughput.md
# says how to run it. The cap keeps testmon below 2.4.0, which has not been measured here.
local = [
  "pytest-testmon>=2.3,<2.4",
]
# Tools only prek hooks and hand-run commands call, never a test. The CI jobs that run no lint
# hook set UV_NO_GROUP=lint, so a lint tool's install (actionlint-py downloads its binary from
# GitHub releases) cannot fail them. tests/repo/ci_workflows/test_ci_lint_group.py holds both halves.
lint = [
  "ruff>=0.16",                     # first-party Python lint gate (prek hook); pinned via uv.lock.
  # The floor is the version the [tool.ruff] `*.md` exclusion was written against.
  "actionlint-py",                  # workflow lint gate (prek hook); its build fetches the actionlint binary
  "mkdocs-material>=9.5",           # the docs site; `uv run mkdocs build` renders docs/ into site/
  "zizmor>=1.0",
  "ty==0.0.111",                     # first-party Python type gate (prek hook). Pinned exactly, not
  # `>=`, because ty is pre-1.0: a 0.0.x bump can add a rule or
  # change an inference and turn master red on an unrelated PR.
  # Renovate raises the bump as its own PR, which is where the
  # new diagnostics get read.
  "vulture>=2.16",                  # dead-name gate (prek hook); [tool.vulture] holds its ignore list
]

[tool.pytest.ini_options]
testpaths = [                        # single source of truth for WHAT runs
  "tests",
  "k8s/roles/*/tests",       # every k8s role's own logic tests
  ".claude/hooks",
  "scripts",                         # closes the smoke_extract CI gap
  "evals",                                         # homelab eval-case schema validation
  "hosts/lib/tests",                               # the scripts the host packages ship
  "hosts/tests",                                   # guards over the host packages and components
  "hosts/components/*/tests",                      # a host component's own scripts, as for a role
]
# `-n auto` is set here so a bare `uv run pytest` gets it; the suite is order-independent, so fix a
# test that writes shared state rather than dropping it.
addopts = "-n auto --dist loadscope -m 'not ui and not image' --strict-markers --strict-config -p leakguard -p xdist_width -p render_share -p phase_timing -p named_files -p failure_report -p hypothesis_profiles"
# Every warning is a failure: a DeprecationWarning from a dependency bump surfaces on the PR that
# bumps it.
filterwarnings = [
  "error",
]
# The `ui` deselection lives in addopts: those tests drive a real browser against live LAN routes
# and read SOPS.
markers = [
  "image: runs a script inside its pinned container image with `docker run`; deselected from the pytest shards and run with `-m image` by .github/workflows/image-leg.yml and the nightly .github/workflows/pytest-sweep.yml",
  "ui: live checks against the homelab's own routes — browser smoke (scripts/diagnostics/tests/ui_smoke/test_ui_smoke.py) and the Uptime Robot keyword rules (tests/repo/docs/test_uptime_robot_keywords.py)",
]
# hosts/lib: host_lib is the module the host components' scripts share, shipped beside them in
# each host package — on pythonpath so the
# import-tested renovate_notify.py + test_host_lib.py resolve it in CI. scripts: the k8s manifest
# tests import the render guards from there — _k8s_render.py did it with a sys.path insert, which
# only worked for modules importing _k8s_render first.
# monitor-bridge/files: bridge/common.py is the same cross-role pattern as host_lib.py, staged
# into autofix-bridge's ConfigMap rather than duplicated — without this, `uv run pytest
# k8s/roles/autofix-bridge/files` alone can't resolve `from bridge.common import ...`
# (it only worked when monitor-bridge/files happened to already be on sys.path from the same run).
# game-stats/files: stats_lib.py is the same shape again, staged into both valheim-stats' and
# terraria-stats' ConfigMaps — without this, `import stats_lib` in either game's own script
# resolves only when a test that inserts game-stats/files happened to run first in the session.
pythonpath = [
  # pytest prepends only a test's own directory, so `tests` is listed to reach `_helpers.py` and
  # `_k8s_render.py`.
  "tests",
  "hosts/lib",
  "k8s/roles/game-stats/files",
  "hosts/components/deploy-ui/files",
  "k8s/roles/monitor-bridge/files",
  # Without this, `from jobs_metrics import ...` in autofix.py resolves only when a crowdsec test
  # collected first.
  "k8s/roles/crowdsec/files",
  "scripts/renderer/job_files",
  "hosts/components/claude-code/files",
  # The same for the renovate-agent, renovate-notify, fake-remux, hypervisor and
  # worktree-holders components.
  "hosts/components/renovate-agent/files",
  "hosts/components/renovate-notify/files",
  "hosts/components/fake-remux/files",
  "hosts/components/hypervisor/files",
  "hosts/components/worktree-holders/files",
  "hosts/components/gh-quota/files",
  "hosts/components/aide-scan/files",
  # `scripts` is the one import root (docs/adr/0039-scripts-is-installed-in-place.md): every
  # module under it imports dotted, `from lib.git import git`. No subdirectory is listed, because
  # a listed one would let a bare sibling import pass here and fail in the cron or hook that runs
  # it. A test reaches a fixture beside it (`_land_fakes.py`) through pytest's own prepend of
  # the test's directory.
  "scripts",
]

# Import contracts over scripts/, run by scripts/tests/test_scripts_import_direction.py. A module
# split out of a facade never imports it back: every facade also runs as `__main__`, so a leaf
# importing it gets a second copy under a second name.
[tool.importlinter]
root_packages = ["backup", "deploy_tools", "dev", "diagnostics", "docs", "freshrss", "grafana", "home_assistant", "infra_map", "lib", "renderer", "secrets_mgmt", "validate", "z2m"]

[[tool.importlinter.contracts]]
name = "secret_rotation's leaves never import it"
type = "forbidden"
source_modules = ["secrets_mgmt.consumers", "secrets_mgmt.git_dates", "secrets_mgmt.rotation_tools", "secrets_mgmt.secrets_lib.secret_registry"]
forbidden_modules = ["secrets_mgmt.secret_rotation"]

[[tool.importlinter.contracts]]
name = "script_classify never imports the scripts page generator"  # split into lib/ so the `--help` test skips the generator
type = "forbidden"
source_modules = ["lib.script_classify"]
forbidden_modules = ["docs.reference.scripts"]

[[tool.importlinter.contracts]]
name = "the render rule modules never import their render family"
type = "forbidden"
source_modules = ["lib.k8s_yaml", "validate.validate_lib.k8s_net_rules", "validate.validate_lib.k8s_schema", "validate.validate_lib.shell_lint"]
forbidden_modules = ["validate.render_lib.k8s", "validate.render_lib.shell"]

[[tool.importlinter.contracts]]
name = "catalog_lib never imports service_catalog, and catalog_model imports no sibling"
type = "layers"
layers = ["docs.service_catalog", "docs.catalog_lib.catalog_facts | docs.catalog_lib.catalog_render | docs.catalog_lib.catalog_backup", "docs.catalog_lib.catalog_model"]

[[tool.importlinter.contracts]]
name = "the fragment readers and renderers never import gen_doc_fragments"
type = "forbidden"
source_modules = ["docs.fragment_readers", "docs.fragment_renderers"]
forbidden_modules = ["docs.gen_doc_fragments"]

[[tool.importlinter.contracts]]
name = "findings_lib never imports findings"
type = "forbidden"
source_modules = ["dev.findings_lib"]
forbidden_modules = ["dev.findings"]

[[tool.importlinter.contracts]]
name = "probe_lib's split-out leaves never import the module they left"
type = "forbidden"
source_modules = ["diagnostics.probe_lib.b2_spend", "diagnostics.probe_lib.longhorn_budget", "diagnostics.probe_lib.longhorn_cluster", "diagnostics.probe_lib.health_cronjob", "diagnostics.probe_lib.health_docker", "diagnostics.probe_lib.health_rollout"]
forbidden_modules = ["diagnostics.probe_lib.b2_ledger", "diagnostics.probe_lib.longhorn", "diagnostics.probe_lib.health"]

[[tool.importlinter.contracts]]
name = "outside code imports dev.fanout_lib.review only through its api"
type = "protected"
protected_modules = ["dev.fanout_lib.review"]
allowed_importers = ["**.tests.**"]
ignore_imports = ["** -> dev.fanout_lib.review.api"]

[tool.ruff]
# One minor behind `requires-python`: ruff supports py315 only in preview and warns on every run.
target-version = "py314"
# DECIDED: Markdown stays out of ruff's scope. ruff 0.16 began formatting Python code
# blocks inside .md, which pulled every prose file in the repo into a gate whose stated
# job is first-party Python — and its output mangles the plan docs, exploding readable
# two-element dict keys across four lines. Excluding *.md holds the gate to the same
# Python files ruff 0.15 covered; `uv run ruff format --check` prints the count, so
# don't restate one here.
extend-exclude = [
  "*.md",
]

[tool.ruff.lint]
# Bug-catching rules only — pyflakes F (unused imports, undefined names, f-string bugs),
# syntax errors E9, bare-except E722, ==None/==True comparisons E711/E712, and flake8-bugbear
# B. Stylistic checks (E7 one-liners, ambiguous names) stay OFF — formatting is owned by
# `ruff format`.
#
# B earns its place on the same "real bugs only" test as the rest: it is the ruleset for
# constructs that are legal, silent and wrong, such as a closure over a loop variable (B023)
# and a `zip()` whose equal-length invariant nothing asserts (B905). Both fail by producing a
# plausible wrong answer rather than an error, which is the block-footguns criterion.
#
# The rest pass the same test:
# - E402 + RUF100 together. A `# noqa: E402` on the sys.path bootstrap imports enforces
#   nothing while E402 is unselected, so nobody can tell. E402 makes the bootstrap convention
#   a lint, and RUF100 removes a noqa that names a rule this table does not run.
# - DTZ: the staleness, grace-period and rotation code compares timestamps across hosts and
#   cron zones, where a naive datetime value gives a plausible wrong answer.
# - RUF059 / RUF013 / RUF012 / PT017 / S110 / S112 / PLW0129 / PLW1508 / PGH003: an unpacked
#   variable nothing reads, an implicit Optional, a mutable class default, an assert inside
#   `except`, a swallowed exception, an assert on a string literal, a non-string envvar
#   default and a blanket `type: ignore` are each legal, silent and wrong.
# - PT011 / PT012 / RUF043: each lets a `pytest.raises` pass on the wrong failure: a bare
#   `ValueError` with no `match=`, a block whose earlier statement can raise first, or a
#   `match=` pattern whose unescaped `.` or `(` matches more than the message it names. That
#   is a test staying green while checking nothing.
# - PLE / T10 / PIE794 / PIE796 / PIE800 / PIE804 / RUF006 / RUF009 / RUF018 / RUF024 / RUF034:
#   each is a bug class (a pylint error, a leftover breakpoint, a duplicate
#   class field or enum value, an un-awaited asyncio task, a call evaluated once as a dataclass
#   default, an assignment inside `assert`, a shared mutable `dict.fromkeys` value, identical
#   if/else arms), selected so the pattern cannot arrive rather than to clear a backlog.
# - ANN401: all hits are in signatures. `json.loads` and `yaml.safe_load` return
#   `Any`, and a helper that annotates its return `Any` hands that to every caller: `ty` then
#   checks nothing the caller reads from the parsed JSON, so a response of the wrong shape
#   indexes, iterates and compares without a diagnostic. That is legal, silent and wrong.
#   The fix is a return type that is true (`lib.json_types.JsonValue`) and a narrowing step at
#   the caller, never an ignore.
# - ARG001 / ARG002: a parameter the function never reads. A caller that sets it gets the
#   default behaviour and no error, which is legal, silent and wrong. A slot that a fixed
#   signature must accept, such as a callback's or a table row's, takes a leading underscore,
#   which the rule skips. Test paths are exempt below, because a fake mirrors the signature of
#   what it replaces.
#
# DECIDED: BLE001 and ARG005 stay off. A lambda with an unused argument is a callback. The
# blind excepts outside tests sit at boundaries built not to crash, which are the hooks, the
# monitor-bridge checks and the byte-pinned karakeep script, and S110 and S112 already cover
# the swallowing forms. (ADR-0040)
#
# DOCSTRING LAYOUT (D205/D415/D212/D209/D210) IS THE ONE EXCEPTION to "bug-catching rules only",
# and it is a narrow one. Those five check the SHAPE of a docstring that already exists: a
# one-line summary ending in `.`, `?` or `!`, a blank line, the body, and the closing quotes on
# their own line. That shape is a written convention with a rule file behind it
# (~/.claude/rules/python.md, from Google's Python style guide section 3.8). `ruff format` does
# not touch docstring bodies, so unlike the E7 checks this table turns off, no formatter can
# hold the convention — it either gets linted or it drifts back.
#
# The undocumented-symbol rules stay OFF, deliberately. Ruff's versions have no size
# threshold, where the rule we actually adopted asks for a docstring when a function is public
# API, non-trivial in size, or non-obvious in logic. Selecting them means writing docstrings
# on mostly-trivial functions — a wider rule than the docstring-layout rules above, so it
# needs its own argument.
select = [
  "F", "E9", "E402", "E711", "E712", "E722", "B",
  "DTZ",
  "RUF100", "RUF059", "RUF013", "RUF012",
  "PT017", "S110", "S112", "PLW0129", "PLW1508", "PGH003",
  "PT011", "PT012", "RUF043",
  "PLE", "T10", "PIE794", "PIE796", "PIE800", "PIE804",
  "RUF006", "RUF009", "RUF018", "RUF024", "RUF034",
  "ANN401",
  "ARG001", "ARG002",
  "D205", "D415", "D212", "D209", "D210",
]
# Explicit codes, never the bare `D` prefix: D203/D211 and D212/D213 are incompatible pairs, and the
# prefix makes ruff warn and silently drop one of each.

[tool.ruff.lint.per-file-ignores]
# Vendored upstream script, byte-pinned by sha256: a lint fix here is drift.
"k8s/roles/karakeep/files/karakeep-time-tagger.py" = [
  "RUF012",
  "D205",
  "D415",
  "D212",
  "D209",
  "D210",
]

# The test-module exemption from two layout rules is load-bearing: removing it turns the gate into a
# wall of errors.
"**/tests/**" = ["D205", "D209", "ARG001", "ARG002"]
"**/test_*.py" = ["D205", "D209", "ARG001", "ARG002"]
"**/conftest.py" = ["D205", "D209", "ARG001", "ARG002"]

# A test counts as a caller, because many library functions exist for a guard under tests/.
[tool.vulture]
paths = [".claude", "evals", "hosts", "k8s", "scripts", "tests"]
ignore_decorators = [
  "@pytest.fixture",  # autouse fixtures and fixtures named in usefixtures
  "@mcp.tool",  # homelab-mcp tools, called by the MCP client
  "@app.route",  # ical-proxy Flask routes
  "@rule",  # Hypothesis state-machine rules, called by the machine
  "@invariant",  # Hypothesis state-machine invariants, checked after every rule
]
ignore_names = [
  # Hooks and handlers a framework calls by name.
  "do_*", "on_config", "on_files", "on_page_content", "pytest_*", "_missing_",
  # Enum members of a Kubernetes field's legal values in lib/k8s_objects.py, reached by value
  # through the enum's constructor, so a known state never reads as UNKNOWN.
  "FALSE", "CREATING", "ATTACHING", "DETACHING", "DELETING",
  # Class attributes a stdlib base class or jinja2.Environment reads.
  "server_version", "protocol_version", "daemon_threads", "keep_trailing_newline",
  # A BaseHTTPRequestHandler override and the attribute its log methods read.
  "log_request", "client_address",
  # deploy-ui's App methods its WRITES table names as a string.
  "cancel", "game_action",
  # The option pytest-xdist reads for the run's id.
  "testrunuid",
  # Parameter of a yaml Dumper override, kept for the base signature.
  "indentless",
  # Module globals or attributes a test monkeypatches.
  "_chown", "LOCK_TIMEOUT_SECONDS", "linkname",
  # TypedDict keys: the gh JSON shapes in land_lib/pr_json.py, and a monitor-bridge cache.
  "messageHeadline", "messageBody", "changeType", "baseRefName", "changedFiles",
  "headRefName", "headRefOid", "isCrossRepository", "isDraft", "mergeCommit",
  "mergeStateStatus", "reviewDecision", "previous_filename", "submitted_at", "commit_id",
  "expiry",
  # Dataclass fields serialised with asdict() into the fan-out review record.
  "base_error", "ci_rerun_jobs",
  # A Batch field the run manifest records for whoever reads the file; no code reads it back.
  "excused_paths",
  # Read by test_host_census.py and named in docs/host-packages.md.
  "NEVER_CANARY",
  # Validated with the other reboot keys; reboot_window.py says why the window ignores it.
  "lead_min",
  # Collected by pytest: the `test` prefix matches without an underscore.
  "testworktree_*",
  # Module-level `pytestmark`, which pytest reads.
  "pytestmark",
  # Keyword a fake's signature accepts because the real call passes it.
  "server_hostname", "ua",
  # Fixtures a test requests for their effect and never reads.
  "restore_sigint", "ssh_here",
  # Read from the extensionless hosts/lib/homelab-reconcile and homelab-k3s-restart, which
  # vulture does not read.
  "refresh_pending", "last_heartbeat",
  # Guard libraries: a guard under a tests/ directory is the designed caller.
  # citations.py: FORMS is the grammar .claude/rules/facts.md cites; the rest feed
  # test_documented_paths_exist.py, test_census_rows_text.py, test_failure_class_detectors.py.
  "FORMS", "node_citations", "line_numbered_citations", "guard_path_citations",
  "macro_citations", "heading_pointers", "names_a_part",
  # invocation_sites.py: the sources test_invoker_paths_resolve.py walks.
  "prek_hook_entries", "workflow_run_steps", "systemd_exec_lines", "claude_settings_entries",
  # systemd_timer.py: test_renderer_host_update_limits.py, test_updater_package.py.
  "longest_gap_s", "timeout_start_s",
  # cli_registry.py: test_probe_registry.py, test_runbook_gates_dispatch.py.
  "assert_complete", "package_entry_points",
  # stdlib_only.py: test_stdlib_only.py's census of every no-venv module.
  "stdlib_only_set", "runtime_import",
  # git_dates.py: test_departed_secrets_are_accounted_for.py over secrets.yml's history.
  "historical_names", "undeclared_departures", "revived_departures",
  # kubectl.py: test_every_named_node_is_a_host_in_the_inventory.
  "RETIRED_CLUSTER_NODES",
  # secret_registry.py: the live-registry check in test_secret_registry.py.
  "record_names",
  # dialect.py: test_renderer_dialect.py's census of every template and variable value.
  "off_the_list",
  # bundle.py: the census that every shared kind has a footprint rule.
  "rules_missing",
  # host_package.py: the homelab-tools check in test_renderer_host_tools.py.
  "installed_paths",
  # restart.py: the rendered-tree restart censuses under scripts/renderer/tests/.
  "any_pod_template",
  # land_lib/options.py: the deploy-tools conftest clears each knob before every test.
  "ENV_KNOBS",
  # reboot_window.py: the check that promote.yml's cron is the derived window end.
  "end_cron",
  # grafana_panel_report.py: the live Grafana smoke, test_ui_smoke_grafana.py.
  "worth_renavigating",
  # role_installs.py: test_host_python_invocations.py's shebang check.
  "no_project_spans",
  # render_lib/setup_plane.py: tests/_setup_render.py, which every setup-template census renders.
  "standalone_templates",
  # Fields of a test dataclass, read through dataclasses.fields().
  "KUMA_URL", "NEW_SERVICE_TOKEN", "NEW_DISCORD_WEBHOOK_URL",
]

[tool.ty.environment]
python-version = "3.15"
# ty resolves imports from search paths alone, so without this list it reports import-not-found for
# first-party modules that resolve at runtime.
extra-paths = [
  "tests",
  "hosts/components/worktree-holders/files",
  "hosts/components/gh-quota/files",
  "hosts/components/aide-scan/files",
  "hosts/lib",
  "hosts/components/deploy-ui/files",
  "k8s/roles/monitor-bridge/files",
  "k8s/roles/game-stats/files",
  "k8s/roles/gpu-exporter/files",
  "k8s/roles/karakeep/files",
  "k8s/roles/longhorn-reconcile/files",
  "scripts",
  ".claude/hooks",
  "k8s/roles/autofix-bridge/files",
  "k8s/roles/configarr/files",
  "k8s/roles/janitorr/files",
  "k8s/roles/qbittorrent/files",
  "k8s/roles/pihole/files",
  "k8s/roles/arr-notification/files",
  "k8s/roles/lidarr/files",
  "scripts/renderer/job_files",
  "hosts/components/fake-remux/files",
  "k8s/roles/ical-proxy/files",
  "k8s/roles/homelab-mcp/files",
  "k8s/roles/airflow/files",
  "k8s/roles/crowdsec/files",
  "k8s/roles/traefik/files",
  "k8s/roles/artifacts/files",
  "hosts/components/k3s-host-checks/files",
  "hosts/components/hypervisor/files",
  "hosts/components/renovate-notify/files",
  "hosts/components/renovate-agent/files",
  "hosts/components/claude-code/files",
  "k8s/roles/home-assistant/files",
  "k8s/roles/tdarr/files",
  "k8s/roles/sonarr/files",
  "k8s/roles/dri-device-plugin/files",
  "k8s/roles/n8n/files",
  "k8s/roles/prowlarr/files",
  "k8s/roles/headlamp/files",
