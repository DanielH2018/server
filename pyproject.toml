[tool.ty.src]
# The `include` list is required: with it absent a file at the repo root is not checked at all.
include = [
  "scripts",
  ".claude",
  "k8s",
  "tests",
  "evals",
  "hosts",
]
exclude = ["site", ".claude/worktrees"]

[tool.ty.rules]
# missing-attribute, invalid-assignment and unsupported-operator are errors, because a rule
# that is off does not stop new code adding to it. Fix a hit at its cause, never exempt it:
# - An Optional used unnarrowed: an `re.match`, a `str | None` verdict or a `Path | None`. A
#   test asserts the value is present first, so a None fails on the assert and its message.
# - Module-global cache dicts that infer a value union carry TypedDicts.
# - Test doubles are small classes, not attributes bolted onto functions.
# - Mixins calling methods only their host class defines get a TYPE_CHECKING stub.
#
# The line suppressions that remain are each a `# ty: ignore[<rule>]`: tests that omit a
# required argument to prove the call raises a TypeError, a test that writes to a frozen
# dataclass to prove it raises, and a read of an attribute ansible's `constants` module sets at
# import time. The vendored karakeep script is exempted per file in [[tool.ty.overrides]] below.
#
# A per-file `ignore` beats a CLI `--error`, so a per-file exemption from any rule here hides it
# from a re-measure too. There is no per-file exemption for invalid-argument-type — every file in
# the source roots is gated on it.
#
# invalid-argument-type is at zero. Its diagnostics cluster on three causes: signatures taking
# `set`/`dict`/`Callable[[Sized], str]` when they only READ the argument, so wanting
# AbstractSet / Mapping / a type variable; the loader dance above; and `render_or_error`
# returning `tuple[str | None, str | None]`, whose correlation a destructuring loses, so
# `if err:` narrows the wrong name. A test's monkeypatch idiom is not among them, so tests get
# no per-file exemption.
#
# Widening an annotation to `Any` where the value really is heterogeneous — `_state` in the two
# mkdocs plugins, `hosts` in infra_map, three dict literals in tests — makes ty stop asking
# without making anything safer; each is a place a real type would be better if the shape were
# ever pinned down.
invalid-argument-type = "error"
missing-attribute = "error"
missing-union-attribute = "error"
invalid-assignment = "error"
unsupported-operator = "error"
# `import urllib` alone reaching `urllib.error` resolves only while something else imported the
# submodule.
possibly-missing-submodule = "error"

[[tool.ty.overrides]]
# Per-file, not per-module: these files also lose the check on first-party imports, so a typo in
# `k8s_reads` surfaces as ModuleNotFoundError when the pod starts.
include = [
  "k8s/roles/airflow/files/check_dags.py",
  "k8s/roles/airflow/files/dags/*.py",
  "k8s/roles/homelab-mcp/files/app.py",
  "k8s/roles/karakeep/files/karakeep-time-tagger.py",
  "k8s/roles/home-assistant/files/cast_quit_app.py",
]
[tool.ty.overrides.rules]
import-not-found = "ignore"

[[tool.ty.overrides]]
# The soak Job mounts flux_soak.py beside `changed_set.py` and `k8s_conditions.py` and imports them
# by bare name; same per-file collateral, covered by its own tests.
include = ["scripts/renderer/job_files/flux_soak.py"]
[tool.ty.overrides.rules]
import-not-found = "ignore"

[[tool.ty.overrides]]
# The vendored script is byte-pinned, so its four `missing-union-attribute` diagnostics cannot be
# fixed; `self.karakeep` is assigned before any caller reads it.
include = ["k8s/roles/karakeep/files/karakeep-time-tagger.py"]
[tool.ty.overrides.rules]
missing-union-attribute = "ignore"

[[tool.ty.overrides]]
# `claude_guard` is deployed by the dotfiles repo outside this checkout, so no `extra-paths`
# entry reaches it in CI.
include = [
  ".claude/hooks/_claude_guard.py",
  ".claude/hooks/_hook_common.py",
  ".claude/hooks/tests/bash_guards/test_claude_guard_import.py",
]
[tool.ty.overrides.rules]
import-not-found = "ignore"

[[tool.ty.overrides]]
# `claude_worktree` is the same kind of import: CI checks out the dotfiles repo rather than an
# in-tree copy, so ty cannot read its signatures.
include = [
  "scripts/lib/_claude_worktree.py",
  "scripts/lib/worktrees.py",
  "scripts/lib/worktree_testing.py",
  "scripts/lib/tests/script_census/test_claude_worktree_import.py",
]
[tool.ty.overrides.rules]
import-not-found = "ignore"

# Pylance in VS Code reads this table; no gate runs pyright. typeCheckingMode stays unset so the
# editor's own setting applies.
[tool.pyright]
pythonVersion = "3.15"
venvPath = "."
venv = ".venv"
include = ["scripts", ".claude", "k8s", "tests", "evals", "hosts"]
# An explicit exclude replaces pyright's defaults, whose `**/.*` would drop `.claude/hooks`.
# `.claude/worktrees` holds a full copy of every module per live session.
exclude = [".claude/worktrees", "**/__pycache__", "**/node_modules", ".venv", ".git", "site"]
# Equal to [tool.ty.environment] extra-paths, held by test_ty_config_covers_the_repo.py.
extraPaths = [
  "tests",
  "hosts/components/worktree-holders/files",
