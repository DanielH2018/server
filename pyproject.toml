[project]
name = "server-homelab"
version = "0.0.0"
requires-python = ">=3.15"
# The renderer's whole runtime closure. promote.yml and ci.yml's validator jobs set UV_NO_DEV and
# UV_NO_GROUP=lint, so a package listed only in a group is absent there; its download cannot block them.
dependencies = [
  "pyyaml",
  "jinja2>=3",
]

[build-system]
requires = ["uv_build>=0.13,<0.15"]
build-backend = "uv_build"

[tool.uv]
# `scripts/` is installed in place as the one import root: the editable install's `.pth` puts it
# on sys.path (docs/adr/0039-scripts-is-installed-in-place.md).
package = true
# The same range as `uv_build` above, so every uv that syncs uses its bundled backend rather than
# fetching one. CI's setup-uv reads this too.
required-version = ">=0.13,<0.15"
default-groups = ["dev", "lint"]     # `uv run` installs both; UV_NO_DEV drops only `dev`
# DECIDED: no `compile-bytecode` here. uv applies it to the sync inside every `uv run`, which
# then recompiles the venv and prints `Bytecode compiled N files` on each call. The explicit
# syncs pass `--compile-bytecode` instead (checkout_sync.py, claude-clone-sync.sh, CI's setup
# action), so a root importer of daniel-box's checkout or the agent clone still finds bytecode
# the syncing user wrote. A session worktree's venv goes uncompiled.

# PyYAML ships no wheel for some interpreters, and a source build without libyaml's headers
# silently falls back to the pure-Python parser, which rejects input the C loader accepts.
# Forcing the extension makes that build fail instead; the hosts and CI install libyaml-dev.
[tool.uv.extra-build-variables]
pyyaml = { PYYAML_FORCE_LIBYAML = "1" }

# Each area under `scripts/` is a PEP 420 namespace package with no `__init__.py`, imported from
# the root as `lib.x`, `dev.x`, `renderer.x`.
[tool.uv.build-backend]
module-root = "scripts"
namespace = true
module-name = [
  "backup",
  "deploy_tools",
  "dev",
  "diagnostics",
  "docs",
  "freshrss",
  "grafana",
  "home_assistant",
  "infra_map",
  "lib",
  "renderer",
  "secrets_mgmt",
  "validate",
]

[dependency-groups]
dev = [                              # `dev` is uv's default group for `uv run`/`uv sync`
  "pytest>=8",
  "requests",                       # ical-proxy ical_proxy.py imports requests (test_app.py)
  "flask",                          # ical-proxy ical_proxy.py imports flask at module top (test_app.py)
  "shellcheck-py==0.11.0.1",        # validate.render_lib.shell; pinned to match prek.toml's shellcheck-py rev
  "pytest-xdist",                   # -n auto in addopts below; pytest was 13.5s of CI's hook budget
  "jsonschema",                     # validate.render_lib.k8s checks every object against the
  # schemas vendored in scripts/validate/schemas/: Kubernetes'
  # own OpenAPI files for core kinds, the catalog's for CRDs.
  "mkdocs",                         # test_mkdocs_repo_links renders with mkdocs.yml's extensions
  "pymdown-extensions",             # through the hook module, which imports mkdocs.utils.
  "pygments",
  "lxml",                           # scripts/freshrss/scrape_feed.py runs XPath 1.0 with functions
  "lxml-stubs",                     # lxml.etree is a C extension; ty resolves it only from these
  "loguru",                         # karakeep's test_time_tagger_logging.py runs the tagger's real handler setup
]
# Tools only prek hooks and hand-run commands call, never a test. The CI jobs that run no lint
# hook set UV_NO_GROUP=lint, so a lint tool's install (actionlint-py downloads its binary from
# GitHub releases) cannot fail them. tests/repo/test_ci_lint_group.py holds both halves.
lint = [
  "ruff>=0.16",                     # first-party Python lint gate (prek hook); pinned via uv.lock.
  # The floor is the version the [tool.ruff] `*.md` exclusion was written against.
  "actionlint-py",                  # workflow lint gate (prek hook); its build fetches the actionlint binary
  "mkdocs-material>=9.5",           # the docs site; `uv run mkdocs build` renders docs/ into site/
  "zizmor>=1.0",
  "ty==0.0.108",                     # first-party Python type gate (prek hook). Pinned exactly, not
  # `>=`, because ty is pre-1.0: a 0.0.x bump can add a rule or
  # change an inference and turn master red on an unrelated PR.
  # Renovate raises the bump as its own PR, which is where the
  # new diagnostics get read.
  "vulture>=2.16",                  # dead-name gate (prek hook); [tool.vulture] holds its ignore list
]

[tool.pytest.ini_options]
testpaths = [                        # single source of truth for WHAT runs
  "tests",
  "k8s/roles/*/tests",       # every k8s role's own logic tests
  ".claude/hooks",
  "scripts",                         # closes the smoke_extract CI gap
  "evals",                                         # homelab eval-case schema validation
  "hosts/lib/tests",                               # the scripts the host packages ship
  "hosts/tests",                                   # guards over the host packages and components
  "hosts/components/*/tests",                      # a host component's own scripts, as for a role
]
# `-n auto` (pytest-xdist) fans the suite across the machine's cores. Set here rather than in
# the prek hook so a bare `uv run pytest` gets it too. The suite is filesystem-read-only and
# order-independent, so it parallelises cleanly — if you add a test that writes shared state,
# fix the test rather than dropping this. Pass `-n0` to disable it for a debugging run (--pdb
# needs that).
#
# `--dist loadscope` keeps a module's tests on ONE worker. xdist's default `load` hands tests
# out one at a time regardless of the module they came from, so a module-scoped fixture is
# rebuilt on every worker that draws any of its tests — and this suite has expensive ones,
# chiefly `real_tree` in scripts/validate/tests/test_render_k8s.py, which renders
# every k8s role.
#
# The saving is about 20% of wall and almost no CPU: worker idle time, not work removed. The
# narrower the run, the more loadscope is worth, which is why it pays on CI and looks
# pointless locally. It is worth the flag because both CI legs of a landing are pytest-bound,
# and a landing waits on CI twice.
#
# loadscope groups by class where a module has them; drop to `loadfile` only if a module's
# classes ever need splitting across workers.
# --strict-markers turns a misspelled marker into a collection error instead of a silently
# unregistered one; --strict-config does the same for an unknown key in this table.
# -p leakguard fails any test that reaches the network, the cluster or the host. It is
# registered here rather than from a conftest so it covers every `testpaths` entry at once;
# tests is on `pythonpath` below, which is what makes the bare module name resolve.
# -p xdist_width narrows `-n auto` to the run's selection: its recorded seconds over its heaviest
# module's, from scripts/dev/pytest_shard_runner_weights.json, capped at the core count, so one file
# runs on one worker rather than sixteen and five heavy ones get three. The whole suite and a CI
# shard keep every core. Its module docstring has the measurements.
#
# -p render_share lets the workers of one run share a single placeholder render of the fleet
# instead of one per module. The cache lives only as long as the run; its module docstring has
# the design.
#
# -p phase_timing prints, on a run given `--durations`, what `--durations` cannot see: each
# worker's collection, prebuild and finish times, and the slowest module collections.
#
# -p named_files keeps a run that names files, as every CI leg does, from building a node for
# each of their siblings: pytest re-collects a named file's directory once per named file in it.
#
# -p failure_report prints FAILURES and ERRORS after every other plugin's summary, just above the
# short summary, so a failed run's output ends on its failure. `--github-report` adds CI's
# per-test `::error` annotations and the job summary's count line.
#
# No `-q` here, deliberately. pytest COUNTS the flag: with `-q` already in addopts, a hand-typed
# `-q` becomes `-qq`, which suppresses the summary line entirely, so a run that collected
# nothing reads exactly like one that passed. The default verbosity costs ~2 header lines per
# xdist worker and prints the count every time.
addopts = "-n auto --dist loadscope -m 'not ui and not image' --strict-markers --strict-config -p leakguard -p xdist_width -p render_share -p phase_timing -p named_files -p failure_report"
# Every warning is a failure: each ResourceWarning is a real leak, and a DeprecationWarning
# from a dependency bump surfaces on the PR that bumps it rather than on the day the API goes
# away.
filterwarnings = [
  "error",
]
# `ui` is registered here so it stays a marker rather than becoming a typo nobody notices,
# and so `--markers` documents it. The deselection lives in addopts above: these tests drive
# a real browser against live LAN routes and read SOPS, none of which a GitHub runner has.
# Run them with `uv run pytest -m ui`, which overrides the default -m.
markers = [
  "image: runs a script inside its pinned container image with `docker run`; deselected from the pytest shards and run with `-m image` by .github/workflows/image-leg.yml and the nightly .github/workflows/pytest-sweep.yml",
  "ui: live checks against the homelab's own routes — browser smoke (scripts/diagnostics/tests/test_ui_smoke.py) and the Uptime Robot keyword rules (tests/repo/test_uptime_robot_keywords.py)",
]
# hosts/lib: host_lib is the module the host components' scripts share, shipped beside them in
# each host package — on pythonpath so the
# import-tested renovate_notify.py + test_host_lib.py resolve it in CI. scripts: the k8s manifest
# tests import the render guards from there — _k8s_render.py did it with a sys.path insert, which
# only worked for modules importing _k8s_render first.
# monitor-bridge/files: bridge/common.py is the same cross-role pattern as host_lib.py, staged
# into autofix-bridge's ConfigMap rather than duplicated — without this, `uv run pytest
# k8s/roles/autofix-bridge/files` alone can't resolve `from bridge.common import ...`
# (it only worked when monitor-bridge/files happened to already be on sys.path from the same run).
# game-stats/files: stats_lib.py is the same shape again, staged into both valheim-stats' and
# terraria-stats' ConfigMaps — without this, `import stats_lib` in either game's own script
# resolves only when a test that inserts game-stats/files happened to run first in the session.
pythonpath = [
  # `tests` so the guards in its subdirectories reach the shared `_helpers.py` and
  # `_k8s_render.py` at its root: pytest prepends only a test's OWN directory.
  "tests",
  "hosts/lib",
  "k8s/roles/game-stats/files",
  "hosts/components/deploy-ui/files",
  "k8s/roles/monitor-bridge/files",
  # crowdsec/files: jobs_metrics.py is the same cross-role pattern, staged into autofix-bridge's
  # ConfigMap rather than duplicated. Without this, `from jobs_metrics import ...`
  # in autofix.py resolves only when a crowdsec test collected first.
  "k8s/roles/crowdsec/files",
  # flux_job_connect.py is the one transport of every Job script Flux runs, and
  # arr-notification's seed imports it from here on the controller path too.
  "scripts/renderer/job_files",
  # The claude-code host component's scripts, which its tests import by bare name the way a
  # role's tests import its `files/` through k8s/conftest.py.
  "hosts/components/claude-code/files",
  # The same for the renovate-agent, renovate-notify, fake-remux, hypervisor and
  # worktree-holders components.
  "hosts/components/renovate-agent/files",
  "hosts/components/renovate-notify/files",
  "hosts/components/fake-remux/files",
  "hosts/components/hypervisor/files",
  "hosts/components/worktree-holders/files",
  # gh_quota.py is the ledger scripts/lib/gh.py records each call into, so every test that
  # imports lib.gh needs it, as does the component's own test.
  "hosts/components/gh-quota/files",
  "hosts/components/aide-scan/files",
  # `scripts` is the one import root (docs/adr/0039-scripts-is-installed-in-place.md): every
  # module under it imports dotted, `from lib.git import git`. No subdirectory is listed, because
  # a listed one would let a bare sibling import pass here and fail in the cron or hook that runs
  # it. A test reaches a fixture beside it (`_land_fakes.py`) through pytest's own prepend of
  # the test's directory.
  "scripts",
]

[tool.ruff]
# One minor behind `requires-python`: ruff supports py315 only in preview and warns on every
# run otherwise. 3.14 syntax is valid 3.15, so the rules lose nothing the code can use yet.
target-version = "py314"
# DECIDED: Markdown stays out of ruff's scope. ruff 0.16 began formatting Python code
# blocks inside .md, which pulled every prose file in the repo into a gate whose stated
# job is first-party Python — and its output mangles the plan docs, exploding readable
# two-element dict keys across four lines. Excluding *.md holds the gate to the same
# Python files ruff 0.15 covered; `uv run ruff format --check` prints the count, so
# don't restate one here.
extend-exclude = [
  "*.md",
]

[tool.ruff.lint]
# Bug-catching rules only — pyflakes F (unused imports, undefined names, f-string bugs),
# syntax errors E9, bare-except E722, ==None/==True comparisons E711/E712, and flake8-bugbear
# B. Stylistic checks (E7 one-liners, ambiguous names) stay OFF — formatting is owned by
# `ruff format`.
#
# B earns its place on the same "real bugs only" test as the rest: it is the ruleset for
# constructs that are legal, silent and wrong, such as a closure over a loop variable (B023)
# and a `zip()` whose equal-length invariant nothing asserts (B905). Both fail by producing a
# plausible wrong answer rather than an error, which is the block-footguns criterion.
#
# The rest pass the same test:
# - E402 + RUF100 together. A `# noqa: E402` on the sys.path bootstrap imports enforces
#   nothing while E402 is unselected, so nobody can tell. E402 makes the bootstrap convention
#   a lint, and RUF100 removes a noqa that names a rule this table does not run.
# - DTZ: the staleness, grace-period and rotation code compares timestamps across hosts and
#   cron zones, where a naive datetime value gives a plausible wrong answer.
# - RUF059 / RUF013 / RUF012 / PT017 / S110 / S112 / PLW0129 / PLW1508 / PGH003: an unpacked
#   variable nothing reads, an implicit Optional, a mutable class default, an assert inside
#   `except`, a swallowed exception, an assert on a string literal, a non-string envvar
#   default and a blanket `type: ignore` are each legal, silent and wrong.
# - PT011 / PT012 / RUF043: each lets a `pytest.raises` pass on the wrong failure: a bare
#   `ValueError` with no `match=`, a block whose earlier statement can raise first, or a
#   `match=` pattern whose unescaped `.` or `(` matches more than the message it names. That
#   is a test staying green while checking nothing.
# - PLE / T10 / PIE794 / PIE796 / PIE800 / PIE804 / RUF006 / RUF009 / RUF018 / RUF024 / RUF034:
#   each is a bug class (a pylint error, a leftover breakpoint, a duplicate
#   class field or enum value, an un-awaited asyncio task, a call evaluated once as a dataclass
#   default, an assignment inside `assert`, a shared mutable `dict.fromkeys` value, identical
#   if/else arms), selected so the pattern cannot arrive rather than to clear a backlog.
# - ANN401: all hits are in signatures. `json.loads` and `yaml.safe_load` return
#   `Any`, and a helper that annotates its return `Any` hands that to every caller: `ty` then
#   checks nothing the caller reads from the parsed JSON, so a response of the wrong shape
#   indexes, iterates and compares without a diagnostic. That is legal, silent and wrong.
#   The fix is a return type that is true (`lib.json_types.JsonValue`) and a narrowing step at
#   the caller, never an ignore.
# - ARG001 / ARG002: a parameter the function never reads. A caller that sets it gets the
#   default behaviour and no error, which is legal, silent and wrong. A slot that a fixed
#   signature must accept, such as a callback's or a table row's, takes a leading underscore,
#   which the rule skips. Test paths are exempt below, because a fake mirrors the signature of
#   what it replaces.
#
# DECIDED: BLE001 and ARG005 stay off. A lambda with an unused argument is a callback. The
# blind excepts outside tests sit at boundaries built not to crash, which are the hooks, the
# monitor-bridge checks and the byte-pinned karakeep script, and S110 and S112 already cover
# the swallowing forms. (ADR-0040)
#
# DOCSTRING LAYOUT (D205/D415/D212/D209/D210) IS THE ONE EXCEPTION to "bug-catching rules only",
# and it is a narrow one. Those five check the SHAPE of a docstring that already exists: a
# one-line summary ending in `.`, `?` or `!`, a blank line, the body, and the closing quotes on
# their own line. That shape is a written convention with a rule file behind it
# (~/.claude/rules/python.md, from Google's Python style guide section 3.8). `ruff format` does
# not touch docstring bodies, so unlike the E7 checks this table turns off, no formatter can
# hold the convention — it either gets linted or it drifts back.
#
# The undocumented-symbol rules stay OFF, deliberately. Ruff's versions have no size
# threshold, where the rule we actually adopted asks for a docstring when a function is public
# API, non-trivial in size, or non-obvious in logic. Selecting them means writing docstrings
# on mostly-trivial functions — a wider rule than the docstring-layout rules above, so it
# needs its own argument.
select = [
  "F", "E9", "E402", "E711", "E712", "E722", "B",
  "DTZ",
  "RUF100", "RUF059", "RUF013", "RUF012",
  "PT017", "S110", "S112", "PLW0129", "PLW1508", "PGH003",
  "PT011", "PT012", "RUF043",
  "PLE", "T10", "PIE794", "PIE796", "PIE800", "PIE804",
  "RUF006", "RUF009", "RUF018", "RUF024", "RUF034",
  "ANN401",
  "ARG001", "ARG002",
  "D205", "D415", "D212", "D209", "D210",
]
# Explicit codes above, never the bare `D` prefix: D203/D211 and D212/D213 are mutually
# incompatible pairs, and selecting the prefix makes ruff warn and then silently drop one of
# each. `[tool.ruff.lint.pydocstyle] convention` is deliberately absent — measured on
# this repo's pinned ruff, it does not filter an explicitly-selected code, so beside these codes
# it would be redundant rather than load-bearing.

[tool.ruff.lint.per-file-ignores]
# Vendored upstream script, byte-for-byte: the `karakeep-time-tagger-script-matches-its-pinned-sha256`
# row in tests/repo/_config_rows.py asserts its sha256 against the commit the archived Docker role
# pins, so a lint fix here is a drift that row exists to catch.
#
# The docstring-layout rules are here for the same reason, and they are the load-bearing half:
# this file's docstrings trip D212, so without this entry `ruff check --fix`
# rewrites it and that sha256 test fails. A gate that forces an edit to a byte-pinned file is a
# gate nobody can turn on.
"k8s/roles/karakeep/files/karakeep-time-tagger.py" = [
  "RUF012",
  "D205",
  "D415",
  "D212",
  "D209",
  "D210",
]

# Test modules are exempt from TWO of the five layout rules, and the exemption is load-bearing
# — it is not an oversight to tidy away. Google makes a test module's docstring optional, and
# says a test docstring exists only to carry something beyond "Tests for foo": a run
# instruction, a setup pattern, an external dependency. Removing these two entries turns the
# gate into a wall of errors in test files, which is how a later session "cleaning up" the
# ignore ends up reverting the whole gate instead.
#
# D415, D212 and D210 are NOT exempt, and that is deliberate. With D415 exempt here, nothing
# would stop test docstrings from silently regressing at a colon — a fix with no gate behind
# it lasts until the next mechanical pass.
"**/tests/**" = ["D205", "D209", "ARG001", "ARG002"]
"**/test_*.py" = ["D205", "D209", "ARG001", "ARG002"]
"**/conftest.py" = ["D205", "D209", "ARG001", "ARG002"]

# The `vulture` prek hook reads this and fails on any name nothing uses: delete the name, or
# list it below under a comment that says what calls it. It scans every tracked Python root,
# so a caller outside scripts/, hosts/lib and the role files/ trees still counts. Every name
# below was triaged as live.
# A test counts as a caller here, because many library functions exist for a guard under
# tests/. To list production code that only tests call, run a second pass with
# `--exclude '*/tests/*,*conftest.py,*/test_*.py,*/_*_harness.py'`.
[tool.vulture]
paths = [".claude", "evals", "hosts", "k8s", "scripts", "tests"]
ignore_decorators = [
  "@pytest.fixture",  # autouse fixtures and fixtures named in usefixtures
  "@mcp.tool",  # homelab-mcp tools, called by the MCP client
  "@app.route",  # ical-proxy Flask routes
]
ignore_names = [
  # Hooks and handlers a framework calls by name.
  "do_*", "on_config", "on_files", "on_page_content", "pytest_*", "_missing_",
  # Enum members of a Kubernetes field's legal values in lib/k8s_objects.py, reached by value
  # through the enum's constructor, so a known state never reads as UNKNOWN.
  "FALSE", "CREATING", "ATTACHING", "DETACHING", "DELETING",
  # Class attributes a stdlib base class or jinja2.Environment reads.
  "server_version", "protocol_version", "daemon_threads", "keep_trailing_newline",
  # A BaseHTTPRequestHandler override and the attribute its log methods read.
  "log_request", "client_address",
  # deploy-ui's App methods its WRITES table names as a string.
  "cancel", "game_action",
  # The option pytest-xdist reads for the run's id.
  "testrunuid",
  # Parameter of a yaml Dumper override, kept for the base signature.
  "indentless",
  # Module globals or attributes a test monkeypatches.
  "_chown", "LOCK_TIMEOUT_SECONDS", "linkname",
  # TypedDict keys: the gh JSON shapes in land_lib/pr_json.py, and a monitor-bridge cache.
  "messageHeadline", "messageBody", "changeType", "baseRefName", "changedFiles",
  "headRefName", "headRefOid", "isCrossRepository", "isDraft", "mergeCommit",
  "mergeStateStatus", "reviewDecision", "previous_filename", "submitted_at", "commit_id",
  "expiry",
  # Dataclass fields serialised with asdict() into the fan-out review record.
  "base_error", "ci_rerun_jobs",
  # A Batch field the run manifest records for whoever reads the file; no code reads it back.
  "excused_paths",
  # Read by test_host_census.py and named in docs/host-packages.md.
  "NEVER_CANARY",
  # Validated with the other reboot keys; reboot_window.py says why the window ignores it.
  "lead_min",
  # Collected by pytest: the `test` prefix matches without an underscore.
  "testworktree_*",
  # Module-level `pytestmark`, which pytest reads.
  "pytestmark",
  # Keyword a fake's signature accepts because the real call passes it.
  "server_hostname", "ua",
  # Fixtures a test requests for their effect and never reads.
  "restore_sigint", "ssh_here",
  # Read from the extensionless hosts/lib/homelab-reconcile and homelab-k3s-restart, which
  # vulture does not read.
  "refresh_pending", "last_heartbeat",
  # Guard libraries: a guard under a tests/ directory is the designed caller.
  # citations.py: FORMS is the grammar .claude/rules/facts.md cites; the rest feed
  # test_documented_paths_exist.py, test_census_rows_text.py, test_failure_class_detectors.py.
  "FORMS", "node_citations", "line_numbered_citations", "guard_path_citations",
  "macro_citations", "heading_pointers", "names_a_part",
  # invocation_sites.py: the sources test_invoker_paths_resolve.py walks.
  "prek_hook_entries", "workflow_run_steps", "systemd_exec_lines", "claude_settings_entries",
  # systemd_timer.py: test_renderer_host_update_limits.py, test_updater_package.py.
  "longest_gap_s", "timeout_start_s",
  # cli_registry.py: test_probe_registry.py, test_runbook_gates_dispatch.py.
  "assert_complete", "package_entry_points",
  # stdlib_only.py: test_stdlib_only.py's census of every no-venv module.
  "stdlib_only_set", "runtime_import",
  # git_dates.py: test_departed_secrets_are_accounted_for.py over secrets.yml's history.
  "historical_names", "undeclared_departures", "revived_departures",
  # kubectl.py: test_every_named_node_is_a_host_in_the_inventory.
  "RETIRED_CLUSTER_NODES",
  # secret_registry.py: the live-registry check in test_secret_registry.py.
  "record_names",
  # dialect.py: test_renderer_dialect.py's census of every template and variable value.
  "off_the_list",
  # bundle.py: the census that every shared kind has a footprint rule.
  "rules_missing",
  # host_package.py: the homelab-tools check in test_renderer_host_tools.py.
  "installed_paths",
  # restart.py: the rendered-tree restart censuses under scripts/renderer/tests/.
  "any_pod_template",
  # land_lib/options.py: the deploy-tools conftest clears each knob before every test.
  "ENV_KNOBS",
  # reboot_window.py: the check that promote.yml's cron is the derived window end.
  "end_cron",
  # grafana_panel_report.py: the live Grafana smoke, test_ui_smoke_grafana.py.
  "worth_renavigating",
  # role_installs.py: test_host_python_invocations.py's shebang check.
  "no_project_spans",
  # render_lib/setup_plane.py: tests/_setup_render.py, which every setup-template census renders.
  "standalone_templates",
  # Fields of a test dataclass, read through dataclasses.fields().
  "KUMA_URL", "NEW_SERVICE_TOKEN", "NEW_DISCORD_WEBHOOK_URL",
]

[tool.ty.environment]
python-version = "3.15"
# This repo has no `__init__.py` files. `scripts/` is installed in place and imports dotted from
# that one root, but a test still reaches its role's `files/`, or a host component's, by bare
# name. ty resolves imports from search paths alone, so without this list it reports
# import-not-found for first-party modules that resolve fine at runtime. The list is the union of
# pytest's `pythonpath` above, `.claude/hooks`, and the `files/` sibling of every `testpaths` entry.
# ENFORCED: tests/repo/test_ty_config_covers_the_repo.py fails if a pythonpath entry
# is added here without a matching search path.
extra-paths = [
  "tests",
  "hosts/components/worktree-holders/files",
  "hosts/components/gh-quota/files",
  "hosts/components/aide-scan/files",
  "hosts/lib",
  "hosts/components/deploy-ui/files",
  "k8s/roles/monitor-bridge/files",
  "k8s/roles/game-stats/files",
  "k8s/roles/gpu-exporter/files",
  "k8s/roles/karakeep/files",
  "k8s/roles/longhorn-reconcile/files",
  "scripts",
  ".claude/hooks",
  "k8s/roles/autofix-bridge/files",
  "k8s/roles/configarr/files",
  "k8s/roles/janitorr/files",
  "k8s/roles/qbittorrent/files",
  "k8s/roles/pihole/files",
  "k8s/roles/arr-notification/files",
  "k8s/roles/lidarr/files",
  "scripts/renderer/job_files",
  "hosts/components/fake-remux/files",
  "k8s/roles/ical-proxy/files",
  "k8s/roles/homelab-mcp/files",
  "k8s/roles/airflow/files",
  "k8s/roles/crowdsec/files",
  "k8s/roles/traefik/files",
  "k8s/roles/artifacts/files",
  "hosts/components/k3s-host-checks/files",
  "hosts/components/hypervisor/files",
  "hosts/components/renovate-notify/files",
  "hosts/components/renovate-agent/files",
  "hosts/components/claude-code/files",
  "k8s/roles/home-assistant/files",
  "k8s/roles/tdarr/files",
  "k8s/roles/sonarr/files",
  "k8s/roles/dri-device-plugin/files",
  "k8s/roles/n8n/files",
  "k8s/roles/prowlarr/files",
  "k8s/roles/headlamp/files",
  "k8s/roles/observability/files",
  "k8s/roles/media-volume/files",
  "k8s/roles/jellyfin/files",
  "k8s/roles/registry/files",
  "k8s/roles/netpol-baseline/files",
  "k8s/roles/system-upgrade/files",
  "scripts/backup/tests",
  "scripts/deploy_tools/tests",
  "scripts/docs/tests",
]

[tool.ty.src]
# `site` is the mkdocs build output, and `.claude/worktrees` holds
# other live sessions' whole checkouts of this same repo.
#
# The `include` list is required, not tidiness: dropping it does NOT fall back to the whole
# project. With `include` absent, a file at the repo root is not checked at all, while one
# under `scripts/` still is. A hand-kept list is the
# enumeration failure `testpaths` has a guard for, so this one has a guard too.
# ENFORCED: tests/repo/test_ty_config_covers_the_repo.py fails on a tracked .py
# file outside these directories.
include = [
  "scripts",
  ".claude",
  "k8s",
  "tests",
  "evals",
  "hosts",
]
exclude = ["site", ".claude/worktrees"]

[tool.ty.rules]
# missing-attribute, invalid-assignment and unsupported-operator are errors, because a rule
# that is off does not stop new code adding to it. Fix a hit at its cause, never exempt it:
# - An Optional used unnarrowed: an `re.match`, a `str | None` verdict or a `Path | None`. A
#   test asserts the value is present first, so a None fails on the assert and its message.
# - Module-global cache dicts that infer a value union carry TypedDicts.
# - Test doubles are small classes, not attributes bolted onto functions.
# - Mixins calling methods only their host class defines get a TYPE_CHECKING stub.
#
# The line suppressions that remain are each a `# ty: ignore[<rule>]`: tests that omit a
# required argument to prove the call raises a TypeError, a test that writes to a frozen
# dataclass to prove it raises, and a read of an attribute ansible's `constants` module sets at
# import time. The vendored karakeep script is exempted per file in [[tool.ty.overrides]] below.
#
# A per-file `ignore` beats a CLI `--error`, so a per-file exemption from any rule here hides it
# from a re-measure too. There is no per-file exemption for invalid-argument-type — every file in
# the source roots is gated on it.
#
# invalid-argument-type is at zero. Its diagnostics cluster on three causes: signatures taking
# `set`/`dict`/`Callable[[Sized], str]` when they only READ the argument, so wanting
# AbstractSet / Mapping / a type variable; the loader dance above; and `render_or_error`
# returning `tuple[str | None, str | None]`, whose correlation a destructuring loses, so
# `if err:` narrows the wrong name. A test's monkeypatch idiom is not among them, so tests get
# no per-file exemption.
#
# Widening an annotation to `Any` where the value really is heterogeneous — `_state` in the two
# mkdocs plugins, `hosts` in infra_map, three dict literals in tests — makes ty stop asking
# without making anything safer; each is a place a real type would be better if the shape were
# ever pinned down.
invalid-argument-type = "error"
missing-attribute = "error"
missing-union-attribute = "error"
invalid-assignment = "error"
unsupported-operator = "error"
# Warning by default; an error here. `import urllib` alone then reaching `urllib.error` resolves
# only while something else in the process has imported the submodule, which is a dependency on
# an import in a file you are not reading.
#
# The sites this rule finds are LATENT, not live. checks/b2.py
# reaches `urllib.error.HTTPError` and imports only `urllib.parse`, but it also imports
# `bridge.net`, which imports `urllib.error` — so in the real monitor-bridge process it always
# resolved. validate/render_lib/k8s.py gets `yaml.constructor` the same way, via `yaml.loader`.
# The rule is on because that is a guarantee held by a sibling module's import list rather than
# by anything local, and it breaks silently when the sibling's imports are tidied.
possibly-missing-submodule = "error"

[[tool.ty.overrides]]
# Three scripts run inside container images built elsewhere, so their third-party imports are not
# and should not be in this repo's dev group. The rule stays on everywhere else, where an
# unresolved import means a typo or a missing search path above.
#
# THE COLLATERAL, stated because it is not obvious: this is per-file, not per-module, so these
# files lose the check on their FIRST-party imports too. homelab-mcp/files/app.py imports
# `k8s_reads` from its own directory, which is on extra-paths above and would otherwise be
# checked — a typo there now reports nothing here and surfaces as a ModuleNotFoundError when the
# pod starts. ty has no per-module suppression, so the alternatives are this or losing the rule
# tree-wide. The role's own tests are what cover that file's imports. airflow's check_dags and
# DAG files import Airflow, which only its image installs; the image build's check_dags run
# imports every DAG. The glob stops at the DAG folder, so `homelab_warehouse/` stays checked.
include = [
  "k8s/roles/airflow/files/check_dags.py",
  "k8s/roles/airflow/files/dags/*.py",
  "k8s/roles/homelab-mcp/files/app.py",
  "k8s/roles/karakeep/files/karakeep-time-tagger.py",
  "k8s/roles/home-assistant/files/cast_quit_app.py",
]
[tool.ty.overrides.rules]
import-not-found = "ignore"

[[tool.ty.overrides]]
# One file runs from a staged copy whose layout no search path reproduces: the soak Job mounts
# flux_soak.py beside `changed_set.py` and `k8s_conditions.py`. It imports those staged siblings
# by bare name, while the checkout keeps them under `scripts/deploy_tools/` and `scripts/lib/`.
# The same per-file collateral as the block
# above applies; its own tests cover that import.
include = ["scripts/renderer/job_files/flux_soak.py"]
[tool.ty.overrides.rules]
import-not-found = "ignore"

[[tool.ty.overrides]]
# The vendored karakeep script is byte-pinned (ruff's per-file-ignores above has why), so a fix
# for its four `missing-union-attribute` diagnostics cannot land here. `__init__` sets
# `self.karakeep = None` and a later method assigns the client before any caller reads it, an
# ordering ty cannot follow. The
# override covers that one rule in that one file; ty checks every other rule there.
include = ["k8s/roles/karakeep/files/karakeep-time-tagger.py"]
[tool.ty.overrides.rules]
missing-union-attribute = "ignore"

[[tool.ty.overrides]]
# `claude_guard` is a different kind of external import from the block above: not a container
# image, but a sibling homelab package the dotfiles repo deploys to `~/.local/share/claude-guard`
# outside this checkout entirely — no `extra-paths` entry can reach it, since that path does not
# exist in CI or in a fresh clone. `.claude/hooks/_claude_guard.py` bootstraps it onto `sys.path`
# at runtime; `test_claude_guard_import.py::test_deployed_import_reaches_both_trusted_hosts` is
# what actually proves the import resolves, on a host where the package is deployed.
#
# Same collateral as above: `test_claude_guard_import.py` also loses
# the check on `import _claude_guard`, a first-party, `extra-paths`-covered import — a typo there
# would surface as a hook crash instead. `_claude_guard.py` imports nothing else first-party.
# `_hook_common.py` imports only
# `_claude_guard` first-party, and every hook test module imports it, so a typo there fails
# those suites at collection instead.
include = [
  ".claude/hooks/_claude_guard.py",
  ".claude/hooks/_hook_common.py",
  ".claude/hooks/tests/test_claude_guard_import.py",
]
[tool.ty.overrides.rules]
import-not-found = "ignore"

[[tool.ty.overrides]]
# `claude_worktree` is the same kind of import as `claude_guard` above: the dotfiles repo
# deploys it to `~/.local/share/claude-worktree`, and `scripts/lib/_claude_worktree.py`
# bootstraps it at runtime. ty cannot read its signatures, because CI checks out the dotfiles
# repo rather than carrying an in-tree copy. `lib.worktrees`' reader calls lose their type
# check with it, and the import test loses the check on `import claude_worktree`.
# `test_claude_worktree_import.py` and `test_worktrees.py` run against the real module in CI
# and on every host, and that is what catches a renamed reader.
# `worktree_testing.py` patches the module's slice rule out of a removal test's process scan.
include = [
  "scripts/lib/_claude_worktree.py",
  "scripts/lib/worktrees.py",
  "scripts/lib/worktree_testing.py",
  "scripts/lib/tests/test_claude_worktree_import.py",
]
[tool.ty.overrides.rules]
import-not-found = "ignore"
