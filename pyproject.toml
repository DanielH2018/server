[project]
name = "server-homelab"
version = "0.0.0"
requires-python = ">=3.14"

[tool.uv]
package = false                      # virtual project: manage deps/lock, do not build the repo

[dependency-groups]
dev = [                              # `dev` is uv's default group for `uv run`/`uv sync`
  "pytest>=8",
  "ansible-core>=2.18",             # test_toposort imports ansible.errors; also runs deploys via `uv run ansible-playbook`
  "pyyaml",                         # validate_compose_templates
  "jinja2>=3",                      # validate_compose_templates
  "requests",                       # community.docker modules (docker_container_info dependency check)
  "docker",                         # community.docker SDK-backed modules
  "flask",                          # ical-proxy app.py imports flask at module top (test_app.py)
  "ruff>=0.10",                     # first-party Python lint gate (prek hook); pinned via uv.lock
  "shellcheck-py==0.11.0.1",        # validate_shell_templates; pinned to match prek.toml's shellcheck-py rev
  "actionlint-py",                  # workflow lint gate (prek hook); ships the actionlint binary as a wheel
  "pytest-xdist",                   # -n auto in addopts below; pytest was 13.5s of CI's hook budget
  "kubernetes-validate==1.36.0",
  "jsonschema",                     # validate_k8s_manifests checks CRDs against the vendored
  # schemas in scripts/validate/schemas/. Declared rather than
  # left transitive: it arrives today only as a dependency of
  # kubernetes-validate, so an import that works by accident
  # would break the moment that pin moves.
  "mkdocs-material>=9.5",           # the docs site; `uv run mkdocs build` renders docs/ into site/
  "zizmor>=1.0",
  "ty==0.0.77",                     # first-party Python type gate (prek hook). Pinned exactly, not
  # `>=`, because ty is pre-1.0: a 0.0.x bump can add a rule or
  # change an inference and turn master red on an unrelated PR.
  # Renovate raises the bump as its own PR, which is where the
  # new diagnostics get read.
]

[tool.pytest.ini_options]
testpaths = [                        # single source of truth for WHAT runs; excludes vendored
  "ansible/tests",                   # ansible/collections/** third-party tests
  "ansible/roles/k8s/monitor-bridge/tests",
  "ansible/roles/k8s/autofix-bridge/tests",
  "ansible/roles/k8s/configarr/tests",             # cluster-side configarr health-reader logic
  "ansible/roles/k8s/janitorr/tests",              # cluster-side janitorr health-reader logic
  "ansible/roles/k8s/qbittorrent/tests",           # throughput-preference diff logic
  "ansible/roles/setup/fake_remux/tests",          # generic {ts,ok,msg} state-file pusher
  "ansible/roles/k8s/terraria-stats/tests",       # player-stats aggregator logic (moved at the Phase F drain)
  "ansible/roles/k8s/valheim-stats/tests",        # the Valheim sibling: adds deaths + a steamid<->name map
  "ansible/roles/k8s/ical-proxy/tests",
  "ansible/roles/k8s/homelab-mcp/tests",
  "ansible/roles/k8s/artifacts/tests",             # artifact index/search server + path confinement
  ".claude/hooks",
  ".claude/tests",                 # audit-permissions report/suggester logic tests
  "scripts",                         # closes the smoke_extract CI gap
  "ansible/roles/setup/k3s/tests",             # live-object drift check comparison logic
  "ansible/roles/setup/gitops_deploy/tests",   # deploy_* decision tests + gitops_deploy.py guards
  "ansible/roles/setup/renovate_notify/tests", # notifier decision tests
  "ansible/roles/setup/renovate_agent/tests",  # unattended-agent gate + digest tests
  "ansible/roles/setup/common/tests",          # shared host_lib helper tests
  "ansible/roles/k8s/home-assistant/tests", # HA Jinja macro logic tests
  "evals",                                         # homelab eval-case schema validation
]
# `-n auto` (pytest-xdist) fans the suite across the machine's cores: 5.6s -> 3.0s locally, and
# pytest was 13.5s of the ~24s of hook work in CI's `rest` shard. Set here rather than in the prek
# hook so a bare `uv run pytest` gets it too. The suite is filesystem-read-only and order-
# independent, so it parallelises cleanly — if you add a test that writes shared state, fix the
# test rather than dropping this. Pass `-n0` to disable it for a debugging run (--pdb needs that).
# --strict-markers turns a misspelled marker into a collection error instead of a silently
# unregistered one; --strict-config does the same for an unknown key in this table.
addopts = "-q -n auto -m 'not ui' --strict-markers --strict-config"
# Every warning is a failure. Measured before enabling (2026-09-02): the only classes that
# fired were ResourceWarnings, each a real leak — HTTPError test doubles built on a tempfile
# nothing closed, an sqlite connection the Valheim store never closed, and the deployer's
# subprocess pipes left open on the timeout path. A DeprecationWarning from a dependency
# bump surfaces here too, on the PR that bumps it rather than on the day the API goes away.
filterwarnings = ["error"]
# `ui` is registered here so it stays a marker rather than becoming a typo nobody notices,
# and so `--markers` documents it. The deselection lives in addopts above: these tests drive
# a real browser against live LAN routes and read SOPS, none of which a GitHub runner has.
# Run them with `uv run pytest -m ui`, which overrides the default -m.
markers = [
  "ui: live browser smoke against the homelab's own routes (scripts/diagnostics/tests/test_ui_smoke.py)",
]
# filter_plugins: lets test_toposort import toposort. setup/common/files: host_lib is a cross-role
# shared module (deployed INTO each setup script's /opt dir as a sibling) — on pythonpath so the
# import-tested renovate_notify.py + test_host_lib.py resolve it in CI. scripts: the k8s manifest
# tests import the render guards from there — _k8s_render.py did it with a sys.path insert, which
# only worked for modules importing _k8s_render first. gitops_deploy/files: lets
# ansible/tests/deploy/test_denylist_parsers_agree.py import deploy_logic alongside the filter plugin.
# monitor-bridge/files: bridge_common.py is the same cross-role pattern as host_lib.py, staged
# into autofix-bridge's ConfigMap rather than duplicated — without this, `uv run pytest
# ansible/roles/k8s/autofix-bridge/files` alone can't resolve `from bridge_common import ...`
# (it only worked when monitor-bridge/files happened to already be on sys.path from the same run).
pythonpath = [
  # `ansible/tests` so the guards in its subdirectories reach the shared `_helpers.py` and
  # `_k8s_render.py` at its root: pytest prepends only a test's OWN directory.
  "ansible/tests",
  "ansible/filter_plugins",
  "ansible/roles/setup/common/files",
  "ansible/roles/setup/gitops_deploy/files",
  "ansible/roles/k8s/monitor-bridge/files",
  # `scripts` resolves the cross-directory `from lib.docs_provenance import ...` form (a PEP 420
  # namespace package — the subdirectories deliberately have no __init__.py, which would change
  # how pytest names the test modules under them). Each subdirectory is listed as well because
  # conftest.py loads probe.py by path and that module's own `import probe_core` has to resolve
  # without depending on which suite pytest happened to collect first.
  "scripts",
  "scripts/availability_bots",
  "scripts/backup",
  "scripts/deploy_tools",
  "scripts/dev",
  "scripts/docs",
  "scripts/grafana",
  "scripts/home_assistant",
  "scripts/infra_map",
  "scripts/lib",
  "scripts/diagnostics",
  "scripts/secrets_mgmt",
  "scripts/validate",
]

[tool.ruff]
# DECIDED: Markdown stays out of ruff's scope. ruff 0.16 began formatting Python code
# blocks inside .md, which pulled every prose file in the repo into a gate whose stated
# job is first-party Python — and its output mangles the plan docs, exploding readable
# two-element dict keys across four lines. Excluding *.md holds the gate to the same
# Python files ruff 0.15 covered; `uv run ruff format --check` prints the count, so
# don't restate one here. `ansible/collections` is the vendored third-party tree, never
# linted or formatted.
extend-exclude = ["ansible/collections", "*.md"]

[tool.ruff.lint]
# Bug-catching rules only — pyflakes F (unused imports, undefined names, f-string bugs),
# syntax errors E9, bare-except E722, ==None/==True comparisons E711/E712, and flake8-bugbear
# B. Stylistic checks (E7 one-liners, ambiguous names) stay OFF — formatting is owned by
# `ruff format`.
#
# B earns its place on the same "real bugs only" test as the rest: it is the ruleset for
# constructs that are legal, silent and wrong. The 16 findings it opened on enabling were led
# by B023 (a closure over a loop variable in await_ci's CI poller) and B905 (six `zip()` calls,
# four of which had an equal-length invariant nothing asserted). Both classes fail by producing
# a plausible wrong answer rather than an error, which is the block-footguns criterion.
#
# The rest pass the same test, and each was measured against the tree before it was enabled
# (2026-09-02):
# - E402 + RUF100 together. 131 `# noqa: E402` comments sat on the sys.path bootstrap imports
#   with E402 never selected, so the comments enforced nothing and nobody could tell; RUF100
#   found 156 such dead directives (BLE001, S310 and S506 among them). E402 makes the bootstrap
#   convention a lint, and RUF100 removes a noqa that names a rule this table does not run.
# - DTZ: 30 naive datetime calls. The staleness, grace-period and rotation code compares
#   timestamps across hosts and cron zones, where a naive value is the bug class the
#   grace-periods-must-be-derived-from-the-schedule incident belongs to.
# - RUF059 / RUF013 / RUF012 / PT017 / S110 / S112 / PLW0129 / PLW1508 / PGH003: 26 hits
#   between them. An unpacked variable nothing reads, an implicit Optional, a mutable class
#   default, an assert inside `except`, a swallowed exception, an assert on a string literal,
#   a non-string envvar default and a blanket `type: ignore` are each legal, silent and wrong.
select = [
  "F", "E9", "E402", "E711", "E712", "E722", "B",
  "DTZ",
  "RUF100", "RUF059", "RUF013", "RUF012",
  "PT017", "S110", "S112", "PLW0129", "PLW1508", "PGH003",
]

[tool.ruff.lint.per-file-ignores]
# Vendored upstream script, byte-for-byte: ansible/tests/services/test_karakeep_time_tagger_script.py
# asserts its sha256 against the commit the archived Docker role pins, so a lint fix here is a
# drift that test exists to catch.
"ansible/roles/k8s/karakeep/files/karakeep-time-tagger.py" = ["RUF012"]

[tool.ty.environment]
python-version = "3.14"
# This repo has no `__init__.py` files and no installed package: a script reaches a sibling
# directory through the `sys.path` bootstrap the root CLAUDE.md describes, and a test reaches its
# role's `files/` the same way. ty resolves imports from search paths alone, so without this list
# it reports 189 unresolved-import diagnostics for first-party modules that resolve fine at
# runtime. The list is the union of pytest's `pythonpath` above, `.claude/hooks`, and the `files/`
# sibling of every `testpaths` entry — the same three sources the bootstrap draws on.
# ENFORCED: ansible/tests/repo/test_ty_config_covers_the_repo.py fails if a pythonpath entry
# is added here without a matching search path.
extra-paths = [
  "ansible/tests",
  "ansible/filter_plugins",
  "ansible/roles/setup/common/files",
  "ansible/roles/setup/gitops_deploy/files",
  "ansible/roles/k8s/monitor-bridge/files",
  "scripts",
  "scripts/availability_bots",
  "scripts/backup",
  "scripts/deploy_tools",
  "scripts/dev",
  "scripts/docs",
  "scripts/grafana",
  "scripts/home_assistant",
  "scripts/infra_map",
  "scripts/lib",
  "scripts/diagnostics",
  "scripts/secrets_mgmt",
  "scripts/validate",
  ".claude/hooks",
  "ansible/roles/k8s/autofix-bridge/files",
  "ansible/roles/k8s/configarr/files",
  "ansible/roles/k8s/janitorr/files",
  "ansible/roles/k8s/qbittorrent/files",
  "ansible/roles/setup/fake_remux/files",
  "ansible/roles/k8s/terraria-stats/files",
  "ansible/roles/k8s/valheim-stats/files",
  "ansible/roles/k8s/ical-proxy/files",
  "ansible/roles/k8s/homelab-mcp/files",
  "ansible/roles/k8s/artifacts/files",
  "ansible/roles/setup/k3s/files",
  "ansible/roles/setup/renovate_notify/files",
  "ansible/roles/setup/renovate_agent/files",
  "ansible/roles/k8s/home-assistant/files",
]

[tool.ty.src]
# `ansible/collections` is the vendored third-party tree, excluded for the same reason ruff's
# `extend-exclude` skips it. `site` is the mkdocs build output, and `.claude/worktrees` holds
# other live sessions' whole checkouts of this same repo.
#
# The `include` list is required, not tidiness: dropping it does NOT fall back to the whole
# project. Measured 2026-09-02 — with `include` absent, a deliberately broken file at the repo
# root was not checked at all, while one under `scripts/` still was. A hand-kept list is the
# enumeration failure `testpaths` has a guard for, so this one has a guard too.
# ENFORCED: ansible/tests/repo/test_ty_config_covers_the_repo.py fails on a tracked .py
# file outside these directories.
include = [
  "scripts",
  ".claude",
  "ansible/roles",
  "ansible/tests",
  "ansible/filter_plugins",
  "evals",
]
exclude = ["ansible/collections", "site", ".claude/worktrees"]

[tool.ty.rules]
# Four rules are OFF, each with the count that was measured against the tree before the gate
# landed (2026-09-02, ty 0.0.77, 228 diagnostics total). They are off because the diagnostics are
# annotation debt rather than bugs, not because they are hard — turning one on is a PR of its own
# with its own measurement, which is the point of recording the number here.
#
# invalid-argument-type (94: 54 in tests, 40 in production). The test half is almost entirely
#   monkeypatch doubles — a plain function assigned where a bound method is annotated — which ty
#   flags structurally and which no runtime path can reach. The production half is real narrowing
#   debt in the validators, and worth its own pass.
# unresolved-attribute (68: 51 in tests, 17 in production). 45 of these are one idiom:
#   `importlib.util.spec_from_file_location` returns `ModuleSpec | None`, and the loader dance
#   that follows never narrows it. It appears in .claude/hooks and nine hook test files.
# invalid-assignment (10). The same monkeypatch idiom as above, plus three production sites.
# unsupported-operator (14). Eight are arithmetic on monitor-bridge's `_env` helper, which is
#   annotated to return a union including `str`; retyping that one helper is the whole fix.
invalid-argument-type = "ignore"
unresolved-attribute = "ignore"
invalid-assignment = "ignore"
unsupported-operator = "ignore"
# Warning by default; an error here. `import urllib` alone then reaching `urllib.error` works
# only while something else in the process has imported the submodule, which is the
# plausible-wrong-answer shape block-footguns exists for.
possibly-missing-submodule = "error"

[[tool.ty.overrides]]
# Two scripts run inside container images built elsewhere, so their third-party imports are not
# and should not be in this repo's dev group. The rule stays on everywhere else, where an
# unresolved import means a typo or a missing search path above.
include = [
  "ansible/roles/k8s/homelab-mcp/files/app.py",
  "ansible/roles/k8s/karakeep/files/karakeep-time-tagger.py",
]
[tool.ty.overrides.rules]
unresolved-import = "ignore"
