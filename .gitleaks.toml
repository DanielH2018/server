# gitleaks config — extends the bundled default ruleset (does NOT replace it).
#
# The first allowlist covers the SOPS-encrypted files. Every value in them is AES256-GCM
# ciphertext — `ENC[AES256_GCM,data:...]`. The default rules occasionally false-positive on that
# random base64 when it sits next to a suggestive key name (e.g.
# `monitor_bridge_discord_push_token` tripped `discord-client-secret`). Scanning ciphertext only
# ever yields false positives.
#
# It is path-scoped to those files ONLY — every other file in the repo is scanned unchanged, so a
# plaintext secret committed anywhere else still trips. A creation rule in ansible/.sops.yaml
# applies only when `sops` itself encrypts, so it keeps nothing out of these paths. These guards
# do, per path:
#   - ansible/vars/secrets.yml: the block-protected-edits hook denies an Edit or Write to a file
#     carrying a SOPS MAC, and asks before a shell write to one, so the file is written only
#     through `sops`.
#   - the cluster file ansible/vars/cluster-vars.sops.env and the manifests under
#     ansible/vars/cluster-manifests/ (target slice D3): the same hook, which also knows the
#     dotenv form's `sops_mac=` line; the `cluster-vars-ciphertext` pre-commit hook, which fails
#     a plaintext value or a hand edit; and, from PR D3.2c, which commits the first such file,
#     `cluster_vars.py check` in CI.
#   - the per-host SOPS files ansible/vars/hosts/<host>.sops.yaml (target slice H4): the
#     pytest job's `host_secrets.py check`, which fails a value that is not an `ENC[` string
#     and a key that drifts from `secrets.yml`. It reads no key. `host_secrets.py sync` is the
#     only writer.
#   - the publish job's copies of both under out/cluster/, which PR D3.3a first publishes:
#     `cluster_vars.py check --ciphertext-only` on exactly those files, which D3.3a adds to the
#     publish job ahead of its gitleaks step. That step loads this file with
#     `--config .gitleaks.toml`. The rest of out/cluster/ is plaintext by design and stays
#     scanned.
# (A line/match-target regex on `ENC[AES256_GCM` works in `gitleaks detect` but not in the
# pre-commit `gitleaks git --staged` diff-scan mode, hence the path scope.)

[extend]
useDefault = true

[[allowlists]]
description = "SOPS (AES256-GCM) ciphertext files: secrets.yml, the cluster file and manifests, the per-host files, and their publish copies"
paths = [
  '''^ansible/vars/secrets\.yml$''',
  '''^ansible/vars/cluster-vars\.sops\.env$''',
  '''^ansible/vars/cluster-manifests/[^/]+\.sops\.yaml$''',
  '''^ansible/vars/hosts/[^/]+\.sops\.yaml$''',
  '''^out/cluster/cluster-vars/cluster-vars\.sops\.env$''',
  '''^out/cluster/[^/]+/[^/]+\.sops\.yaml$''',
  '''^usr/lib/homelab/secrets/[^/]+\.sops\.yaml$''',
]

# ansible/vars/cluster-vars.source records one SHA-256 per cluster key, of that key's public
# ciphertext in secrets.yml, beside the key's name. `generic-api-key` fires on a high-entropy
# value next to a suggestive key name, and a line such as `grafana_admin_password <sha>`
# supplies both halves. The value is a digest of tracked ciphertext, so a hit here is a false
# positive by construction, and a real secret cannot reach the file — `cluster_vars.py write`
# writes it, and `cluster_vars.py check` refuses a digest that matches no ciphertext. Scoped to
# this one rule on this one path, so every other rule still scans it.
[[allowlists]]
description = "ansible/vars/cluster-vars.source holds ciphertext digests keyed by secret name, never a credential"
targetRules = ["generic-api-key"]
paths = ['''^ansible/vars/cluster-vars\.source$''']

# docs/facts.lock records one SHA per cited atom, keyed by the atom's own name — a repo path, a
# Python symbol or a pytest node id. `generic-api-key` fires on a high-entropy value next to a
# suggestive key name, and an atom named for a test ABOUT secrets supplies both halves:
# `...::test_every_workload_reading_a_role_secret_declares_restart_on_secret": "<sha>"` tripped it
# at entropy 3.89. The value is a digest of tracked repo content, so a hit here is a
# false positive by construction, and a real secret cannot reach the file — `fact_status.py`
# writes it, and `ansible/tests/repo/test_facts_lock_matches_tree.py` refuses a hand edit as
# tampered. Scoped to this one rule on this one path, so every other rule still scans it.
[[allowlists]]
description = "docs/facts.lock/ holds content digests keyed by atom name, never a credential"
targetRules = ["generic-api-key"]
paths = ['''^docs/facts\.lock/[0-9a-f]+\.json$''']

# The same shape for the vendored Kubernetes schemas' provenance file: one sha256 per upstream
# file, keyed by the file's name. Upstream names an API group's file `apis__<group>...`, and
# `generic-api-key` reads the `api` in that key beside a 64-hex value as a credential. The values
# are digests of public files from the kubernetes/kubernetes repo, written by
# `scripts/validate/refresh_vendored_schemas.py`. Scoped to the one rule on the one file name.
[[allowlists]]
description = "Kubernetes schema SOURCE.json holds sha256 digests of public upstream files"
targetRules = ["generic-api-key"]
paths = ['''^scripts/validate/schemas/kubernetes\.io/v[0-9.]+/SOURCE\.json$''']

# A rendered workload names the Secret keys it reads, and those names are not values. A Secret
# volume's `items` list and a `secretKeyRef` both carry `key: <name>`, and `generic-api-key`
# reads `key` plus a high-entropy token as a credential: monitor-bridge's
# `- key: b2_probe_application_key` tripped it at entropy 3.77 and failed promote's render on
# 2026-10-18, the first run after monitor-bridge joined the bundle (#5623). The template's
# `# gitleaks:allow` on that line does not help, because the renderer drops YAML comments and the
# bundle line arrives bare. The line regex admits
# only a snake_case name with at least one underscore, the shape of every SOPS key name. A hex,
# base62 or JWT credential has no underscore and still trips, and so does every other rule on the
# same line. It needs both the bundle path and the line (`condition = "AND"`), and `regexTarget =
# "line"` works in the bundle scan's `gitleaks dir` mode, unlike the pre-commit diff mode.
# ENFORCED: ansible/tests/repo/test_gitleaks_secret_key_name_allowlist.py.
[[allowlists]]
description = "A rendered manifest's Secret key names (`key: <snake_case_name>`) are names, not values"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''^out/cluster/[^/]+/[^/]+\.yaml$''']
regexTarget = "line"
regexes = ['''^\s*-?\s*key: [a-z][a-z0-9]*(?:_[a-z0-9]+)+\s*$''']

# A host package's manifest.json records `secrets_inputs_sha256`, the SHA-256 of the package's
# secrets inputs, so reconcile can tell when they changed. `generic-api-key` reads `secrets` in
# that key beside a 64-hex value as a credential, and failed the `host_packages` job's scan of
# homelab-daniel-server's root on the first package that ships `secrets-unit` (H4.2). The value
# is a digest of the package's ciphertext and templates, written by the renderer. The line regex
# admits only that key with a 64-hex value, so any other high-entropy line in the file, and every
# other rule on this line, still trips. It needs both the path and the line (`condition = "AND"`).
# ENFORCED: ansible/tests/repo/test_gitleaks_manifest_digest_allowlist.py.
[[allowlists]]
description = "A host package manifest's secrets_inputs_sha256 is a content digest, never a credential"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''^usr/lib/homelab/manifest\.json$''']
regexTarget = "line"
regexes = ['''^\s*"secrets_inputs_sha256": "[0-9a-f]{64}",?\s*$''']
