---

# Auto-deploy stance. Flux applies the tag, so this gates no apply; the stance decides whether
# Renovate automerges a bump of the runner image below.
# DECIDED: `false`. The job is not idempotent under an extra run: both runners name their restore
# `restore-drill-${PVC}` and `cleanup()` deletes that name, so a gate Job beside a scheduled run
# could tear the other's restore down, and a bump of the runner image would run a real restore
# with nothing watching it. The stance matches janitorr's and crowdsec's, which pin the same
# `alpine/k8s` digest. Contradict this with a measured gate that cannot overlap the 04:10 UTC run.
k8s_autodeploy: false
k8s_autodeploy_reason: "the drill restores a real Volume, PV and PVC under a fixed name, so an extra run is not harmless; it runs on its own schedule and a bump of its runner image waits for a person"

# The namespace the stamp ConfigMap, the script ConfigMap, the CronJob and the RBAC live in. It
# mirrors `k3s_longhorn_restore_drill_namespace`, which backup health's readers read.
# tests/k8s/flux/test_restore_drill_stamps.py holds the pair equal, so a rename changes both
# sides in one PR.
longhorn_drill_namespace: homelab

# Needs bash, jq, curl and kubectl. BusyBox over musl, so tests/longhorn/_restore_drill.py runs the
# script in this digest.
longhorn_restore_drill_runner_image: alpine/k8s:1.37.2@sha256:7a82aeefea3d554a43a8676b137f2b88bae6c1fe11c13862b191b3a086cc28c0

# Restore timeout plus the probe pod's 300s bound plus a 600s margin; a test holds it above the
# first two.
longhorn_restore_drill_deadline_seconds: 3600
# Two schedule periods, the window `probe.py health` allows the newest firing, so a failed drill
# clears.
longhorn_restore_drill_job_ttl_seconds: 172800
# The SIGTERM-to-SIGKILL window covers one poll and the four deletes in `cleanup`; a TERM pending
# while bash parses `$(` runs no trap.
# The next run sweeps a Volume older than grace plus deadline.
longhorn_restore_drill_grace_seconds: 300
# Four deletes and a poll must fit in the grace period; test_longhorn_restore_drill_deadline.py
# holds that.
longhorn_restore_drill_delete_timeout_seconds: 60
longhorn_restore_drill_starting_deadline_seconds: 3600
# nobody. The script writes only /tmp, which the image leaves writable, and needs no home.
longhorn_restore_drill_uid: 65534
longhorn_restore_drill_cpu_limit: 500m
longhorn_restore_drill_mem_limit: 256Mi
longhorn_restore_drill_cpu_request: 10m
longhorn_restore_drill_mem_request: 64Mi

# Empty rotates one volume per night, least-recently-attempted first; a PVC name pins the drill, for
# debugging only.
# To drill one volume once, create a Job from the CronJob with RESTORE_DRILL_PIN=<pvc> (the role's
# CLAUDE.md has the commands).
# R2 volumes are in the rotation: each target is proven on the nights its own volumes come up.
k3s_longhorn_restore_drill_pvc: ""
# Skip a candidate whose actualSize exceeds this. Bounds one night's egress and wall-clock so a
# slow restore cannot read as a failed one. A backed-up volume excluded here is undrilled, and the
# drill publishes it to `excluded_oversize` so the backup heartbeat pages naming it. Raise
# this and the timeout below together.
# DECIDED: 4 GiB, raised from 2 GiB on 2026-08-24. The old value's rationale said it "excludes
# NOTHING today", but valheim-config's actualSize is 2.83 GiB, so a 2 GiB cap excluded a
# backed-up volume. This cap is applied to actualSize: compare `actualSize` from the Volume CR,
# never the stored-block total from `probe.py b2-longhorn`. The cost of 4 GiB is ~100 Class B
# GETs and ~1.34 GB egress once per 25-night rotation.
k3s_longhorn_restore_drill_max_actual_bytes: 4294967296
# Catches a mounted but EMPTY restore; deliberately low, since `files > 0` rejects empty mounts and
# this only rejects files holding nothing.
k3s_longhorn_restore_drill_min_bytes: 1
# Waives the two content assertions for restores that legitimately come back with no files, and
# nothing else.
# Drop a name once its volume holds data; the ceiling below also withdraws the waiver.
k3s_longhorn_restore_drill_empty_ok_pvcs:
  - n8n-files
# The waiver applies only while the source volume's actualSize stays under this, else an empty
# restore of a filled volume stamps success.
# 60 MiB sits ~11 MB above the 51 MB bare-ext4 band; raising it widens what a `files=0` restore is
# waived for.
k3s_longhorn_restore_drill_empty_ok_max_actual_bytes: 62914560
k3s_longhorn_restore_drill_image: python:3.15-alpine@sha256:0f9552bb28711333da16915ec146f5e6bb44a7fdac9ced15dc17c2e0206346dd
# A drill restores 51 MB in ~21s and the rotation admits volumes 25x that size: a slow restore
# is not itself a failure, but a hung one must not leave a
# Volume CR attached forever, and a timeout fires as a restore failure that nothing distinguishes
# from a real one. Keep this above what k3s_longhorn_restore_drill_max_actual_bytes can take.
# DECIDED: 2700s, raised from 1800s with the cap on 2026-08-24. To raise it further, raise
# longhorn_restore_drill_deadline_seconds with it, or the Job dies before the restore times out.
k3s_longhorn_restore_drill_timeout_s: 2700
k3s_longhorn_restore_drill_cron: "10 4 * * *"

manifests_rollout: ''
