---
# BuildKit rather than kaniko (archived upstream); `-rootless` because the daemonful variant wants a
# privileged pod.
image_builder_k8s_image: moby/buildkit:v0.35.0-rootless@sha256:5987568f92dafbfb679879de59c1cd8d26597f5f6635c314e166164e2615870c

# Renovate stance: whether an image bump here may automerge. `promote` deploys what merges.
# Denylisted on purpose, not by denylist absence: this role renders a Job and a ConfigMap, no
# Deployment at all, so there is nothing for `rollout status` to gate — the same class as
# configarr/media-volume/node-exporter. It is also not a services entry, so a promoted
# bump to image_builder_k8s_image (the buildkit tool itself, not a workload it builds) would match
# no play, apply nothing, and report success with nothing watching it land. It builds the images
# other roles consume, so a bad build here is upstream of every one of them.
k8s_autodeploy: false
k8s_autodeploy_reason: "renders a Job, no Deployment, nothing for rollout status to gate; not a services entry, so a promoted bump matches no play and deploys nothing while reporting success; builds the images other roles consume"

# Caller-supplied: image_builder_name, _tag, _dockerfile (rendered as `Dockerfile`), _context {src:
# dest} (dest is the COPY path), _context_files (same, verbatim, for sources Jinja must not touch).
image_builder_tag: latest
image_builder_context: {}
image_builder_context_files: {}

# Bounds a wedged build so a deploy fails with a message instead of hanging on the wait's own
# timeout.
image_builder_timeout: 900
