---
# A spare keeps rollback possible if the newest snapshot is corrupt or still coalescing. Floor of 2
# (claim.yml): a rollback snapshots and prunes first; 1 would delete the recovery point.
volume_snapshot_retain: 3

# Seconds to wait for a snapshot to report `readyToUse`. A Longhorn snapshot is a marker in the
# volume's chain rather than a data copy, so a healthy one settles in seconds; this is a
# ceiling for a wedged engine, not an expected wait.
#
# The wait is deliberately NOT best-effort: a snapshot that never becomes ready fails the deploy,
# because it is the recovery point the deploy is about to need. A detached volume is not a special
# case: Longhorn snapshots one on this same path (see this role's CLAUDE.md, "A detached volume
# is snapshotted on the ordinary path").
volume_snapshot_timeout: 120

volume_snapshot_poll_interval: 2

# Renovate stance: whether an image bump here may automerge. `promote` deploys what merges.
# This role deploys no workload of its own: it is a pre-apply step other roles include, it
# renders no manifest for `rollout status` to gate, and it pins no `_image:` var for Renovate
# to bump. Declared rather than added to `lib.k8s_roles.SHARED_ROLES`, because it carries a
# defaults/main.yml.
k8s_autodeploy: false
k8s_autodeploy_reason: "deploys no workload of its own — a pre-apply snapshot step other roles include; it renders no manifest and pins no image for Renovate to bump"

# At the cap Longhorn refuses snapshots, and this role snapshots before pruning, so deploys fail.
# Only volumes with a non-zero cap are measured ("0" is uncapped).
volume_snapshot_cap_warn_ratio: 0.9
