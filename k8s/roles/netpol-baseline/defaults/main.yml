---
# Rollback lever: set false and redeploy. Deleting the template leaves the live policy enforcing,
# since kubectl apply does not prune.
netpol_baseline_enforced: true

# `namespace` selects every pod except `netpol-baseline-exempt`, not a bare `podSelector: {}`.
# Setting `label` is the rollback.
netpol_baseline_scope: namespace

# Workloads with a tighter own NetworkPolicy; policies are additive, so selecting one here would
# widen it.
# The verify Job's `exempt` check reads this as an exact set in both directions.
netpol_baseline_exempt_workloads:
  - flaresolverr    # k8s/roles/prowlarr/templates/networkpolicy-flaresolverr.yaml.j2 (app=prowlarr, :8191)
  - headlamp        # k8s/roles/headlamp/templates/networkpolicy.yaml.j2
  - n8n             # k8s/roles/n8n/templates/networkpolicy.yaml.j2 (live name `n8n-broker`)
  - registry        # k8s/roles/registry/templates/networkpolicy.yaml.j2
  - ghcr-mirror     # k8s/roles/registry/templates/ghcr-mirror.yaml.j2
  - dockerhub-mirror  # k8s/roles/registry/templates/dockerhub-mirror.yaml.j2
  # Exempt because the baseline admits every port and this one is unauthenticated DevTools.
  - karakeep-chrome

# /32 HOST addresses on purpose: a /16 would silently cancel the whole policy.
netpol_baseline_node_cidrs: "{{ k3s_cni0_gateways }}"

# Cloudflare ranges, LAN and WireGuard, and the whole pod CIDR (in-cluster callers of `.local.`
# routes arrive as 10.42.x.y).
# `cloudflare_ips` is also traefik's trustedIPs, so a range change needs both roles deployed.
# IPv4 only: an IPv6 ipBlock fences nothing in a single-stack cluster and kube-router warns per
# CIDR.
netpol_baseline_traefik_https_sources: "{{ (cloudflare_ips | reject('search', ':') | list) + [lan_subnet, wg_client_subnet, k3s_pod_cidr] }}"

# Renovate stance: whether an image bump here may automerge. `promote` deploys what merges.
k8s_autodeploy: true
k8s_autodeploy_reason: "renders NetworkPolicies plus one verify Job and pins no image; Flux applies it, and the Job fails the revision if the live exempt set has drifted"

# Own flag and own node-CIDR list: widening the shared one would re-scope all 16 homelab workloads.
netpol_baseline_obs_enforced: true

netpol_baseline_obs_scope: namespace

# Empty on purpose: exempting an observability workload leaves it unfenced, or for prometheus, loki
# and alertmanager drops the baseline peers their callers need.
netpol_baseline_obs_exempt_workloads: []

# All four node addresses, where the homelab list carries only the two cni0 /32s: the cni0 pair
# (`k3s_cni0_gateways`) followed by the flannel.1 pair (`k3s_flannel_node_ips`), both from
# group_vars/all.yml. The callers each entry admits, in that order:
#   - daniel-box cni0: otelq's loopback path when loki/prometheus/tempo land on daniel-box, and
#     the API server's proxy for Headlamp's Prometheus plugin under the same condition.
#   - daniel-server cni0: otelq's loopback path when loki/prometheus/tempo land on daniel-server.
#   - daniel-box flannel.1: the observability cron, and the API server's proxy for Headlamp's
#     Prometheus plugin, when prometheus is cross-node.
#   - daniel-server flannel.1: no caller nameable; deliberate over-inclusion at the trust level
#     the homelab baseline already grants its own node bridges, covering a future cross-node host
#     caller running on daniel-server.
#
# The cni0 pair is load-bearing on BOTH nodes. loki, prometheus and tempo each publish a loopback
# hostPort for `otelq` (a workstation host process, see observability/CLAUDE.md), a hostPort binds
# only on the node the pod is scheduled to, and all three are unpinned single-replica
# Deployments, so either node's cni0 can originate otelq's path. Trimming the daniel-server
# entry breaks otelq when a pod reschedules there.
#
# The observability health cron is installed on daniel-box only (`services` in
# k8s/services.yml). When the unpinned prometheus lands on daniel-server, the cron's call is
# cross-node and arrives as the SENDING node's flannel.1, so it needs daniel-box's flannel.1.
netpol_baseline_obs_node_cidrs: "{{ k3s_cni0_gateways + k3s_flannel_node_ips }}"

# The probe's target table. ONE list, read by both halves of the probe, so the two cannot
# disagree: the verify Job's `gate` initContainer reads it, and its `legs` container dials
# one leg per row that has an `expect`. A row is gated whether or not it is dialled.
#
# Columns:
#   service — the Service name. It is the name the gate reads and the name the leg dials. It is
#             not always the pod label (scrutiny's pods are `app: scrutiny-web`).
#   plane   — `homelab`, `observability` or `flux-system`. It picks the namespace, through
#             netpol_baseline_probe_namespaces, and the lever: a homelab row runs only while
#             netpol_baseline_enforced is true, an observability row only while
#             netpol_baseline_obs_enforced is. A flux-system row has no lever and always runs,
#             because the flux role owns that namespace's fence and this role never renders it.
#   port    — the POD port, from the target's own NetworkPolicy `port:`. A dialled row may omit
#             it when `service` names a services entry; the Job then reads the entry's
#             `port` through `entry_port`, so the row follows the entry rather than copying it.
#             The lookup sits in the template because role defaults resolve without this repo's
#             template filters in the render guards.
#   service_port — the port the leg dials, for a Service that does NOT map its port to the pod
#             port 1:1. Absent on every row whose Service does, and the leg then dials `port`.
#             The fence is enforced on the pod port after the Service's DNAT, so `port` stays
#             the pod port the policy names, and `service_port` is only how the leg reaches it.
#             Read it from the Service's `spec.ports`, never from the pod.
#   expect  — `refused` (an inverted leg), `open` (the connection must succeed), or absent (the
#             gate checks the row, and no leg dials it).
#   policy  — the policy file that owns the fence, printed in the failure message.
#
# A WRONG PORT ON A `refused` ROW FAILS SILENTLY GREEN. A port nothing listens on makes `nc` fail,
# which is the PASS branch of an inverted leg. The gate proves the Service has a ready backend; it
# does not prove the port is the one that backend serves. Re-check a port against its source
# whenever you touch its row. A Service port the Service does not declare fails the same way, so
# a `service_port` row dials only a port an in-namespace caller is proven to reach.
#
# The verify pod is `app: netpol-baseline-verify`. No caller list in the repo names that label, so
# every `refused` row must refuse it. Its `netpol-probe: control` label admits it to speedtest:80,
# the sentinel, and to nothing else.
#
# terraria is ABSENT while the Games panel refuses to start it (`start_refused` on its
# `game_servers` entry in group_vars/all.yml). Its EndpointSlice is empty then, so its row would
# fail the gate on every netpol-baseline deploy.
#
# DECIDED: terraria's row stays a hand toggle and is not derived from whether terraria runs
# Its `expect: open` leg opens a TCP connection to :7777, and on 1.4.5.7 a bare TCP connect can
# crash the server. Starting it is only the first step of the restore checklist, so a row that
# followed the running state would dial a server that is not yet safe to dial, on every
# netpol-baseline deploy. Add the row once the image is past 1.4.5.7:
# `{service: terraria, plane: homelab, port: 7777, expect: open, policy: networkpolicy-terraria.yaml.j2}`.
# `tests/k8s/edge/test_netpol_probe_targets.py` fails if the row is present while the start is refused.
netpol_baseline_probe_targets:
  - {service: littlelink, plane: homelab, port: 3000, expect: refused, policy: networkpolicy.yaml.j2}
  # Per-workload caller lists: each admits named callers, and this pod is none of them.
  - {service: sonarr, plane: homelab, port: 8989, expect: refused, policy: "sonarr's netpol_from (k8s/services.yml)"}
  - {service: radarr, plane: homelab, port: 7878, expect: refused, policy: "radarr's netpol_from (k8s/services.yml)"}
  - {service: prowlarr, plane: homelab, port: 9696, expect: refused, policy: prowlarr/templates/networkpolicy-prowlarr.yaml.j2}
  - {service: qbittorrent, plane: homelab, port: 8080, expect: refused, policy: qbittorrent/templates/networkpolicy.yaml.j2}
  # grafana and tempo admit only the intra-namespace peer, which a homelab probe cannot exercise.
  - {service: prometheus, plane: observability, port: 9090, expect: refused, policy: networkpolicy-prometheus.yaml.j2}
  - {service: loki, plane: observability, port: 3100, expect: refused, policy: networkpolicy-loki.yaml.j2}
  # Two policies select alertmanager; written as two list items, the caller selectors would admit
  # this pod.
  - {service: alertmanager, plane: observability, port: 9093, expect: refused, policy: "networkpolicy-observability.yaml.j2 or networkpolicy-alertmanager.yaml.j2"}
  - {service: grafana, plane: observability}
  - {service: tempo, plane: observability}
  # The infra tier.
  - {service: authelia, plane: homelab, port: 9091, expect: refused, policy: "authelia's netpol_from (k8s/services.yml)"}
  - {service: crowdsec, plane: homelab, port: 8080, expect: refused, policy: networkpolicy-crowdsec.yaml.j2}
  - {service: nut, plane: homelab, port: 3493, expect: refused, policy: networkpolicy-nut.yaml.j2}
  - {service: mosquitto, plane: homelab, port: 1883, expect: refused, policy: networkpolicy-mosquitto.yaml.j2}
  # :53 is open to every source, so only the web port can show the fence going red.
  - {service: pihole, plane: homelab, port: 80, expect: refused, policy: networkpolicy-pihole.yaml.j2}
  # scrutiny's Service name differs from its pod label (`app: scrutiny-web`), the mistake most
  # likely to select nothing.
  - {service: home-assistant, plane: homelab, port: 8123, expect: refused, policy: "home-assistant's netpol_from (k8s/services.yml)"}
  - {service: loki-homelab, plane: homelab, port: 3100, expect: refused, policy: networkpolicy-loki-homelab.yaml.j2}
  - {service: scrutiny, plane: homelab, port: 8080, expect: refused, policy: "scrutiny's netpol_from, pod label scrutiny-web"}
  - {service: karakeep-meilisearch, plane: homelab, port: 7700, expect: refused, policy: "karakeep's netpol_fences (k8s/services.yml)"}
  # Each Service maps port 80 to a NAMED target port, so rows dial 80 and name the pod port behind
  # it.
  # The controllers' 8080 has no Service, so no row dials it.
  - {service: source-controller, plane: flux-system, port: 9090, service_port: 80, expect: refused, policy: "flux's allow-egress (flux/files/gotk-components.yaml)"}
  - {service: notification-controller, plane: flux-system, port: 9090, service_port: 80, expect: refused, policy: "flux's allow-egress (flux/files/gotk-components.yaml)"}
  - {service: webhook-receiver, plane: flux-system, port: 9292, service_port: 80, expect: refused, policy: "flux's allow-egress (flux/files/gotk-components.yaml)"}
  # The sentinel: the control leg dials it with a retry outside the table, so no `expect`.
  - {service: speedtest, plane: homelab}

netpol_baseline_probe_namespaces:
  homelab: "{{ k8s_namespace }}"
  observability: "{{ k8s_observability_namespace }}"
  flux-system: flux-system

netpol_baseline_probe_active: >-
  {{ netpol_baseline_probe_targets
     | selectattr('plane', 'in',
                  (['homelab'] if netpol_baseline_enforced | bool else [])
                  + (['observability'] if netpol_baseline_obs_enforced | bool else [])
                  + ['flux-system'])
     | list }}

manifests_rollout: ""

# The armed apply's `-n homelab` refuses these; Flux applies them after every other tag's
# Kustomization.
manifests_deferred_files:
  - networkpolicy-observability.yaml
  - networkpolicy-prometheus.yaml
  - networkpolicy-loki.yaml
  - networkpolicy-alertmanager.yaml

manifests_deferred_dir_name: netpol-baseline-observability
