---
# The only role that deletes real media.
#
# Digest-pinned: `jvm-stable` is a floating non-semver alias Renovate cannot version-track.
# Manual update: `docker pull ghcr.io/schaka/janitorr:jvm-stable`, take the new digest.
janitorr_k8s_image: ghcr.io/schaka/janitorr:jvm-stable@sha256:eecb604b6307f4ba5674bec7e3fc142d7212361571a1a9dc1f39e0fd069a4434

# Renovate stance: whether an image bump here may automerge. `promote` deploys what merges.
# Probe-less: the Deployment renders no readinessProbe, so `rollout status` would return the
# moment the pod reports Running and prove nothing. Sharper here than most of this class —
# janitorr is the one role in the fleet that deletes real media, so a wedged deploy that isn't
# caught could run the delete path against a broken app state with nothing watching.
k8s_autodeploy: false
k8s_autodeploy_reason: "probe-less — no readinessProbe on the Deployment; also the only role that deletes real media, so a wedge is not merely inert"

# "false" is the operator's decision to run live (dry-run cannot show media deletion). A STRING, not
# a bool:
# the shared template must render under plain Jinja (no `bool` filter); verify.yml asserts the live
# value.
janitorr_k8s_dry_run: "false"

# Whole tree at /data, no subPath: janitorr's symlink targets are absolute /data/media/... paths
# Jellyfin resolves via its own mount.
janitorr_k8s_media_claim: media-data

# No PVC: janitorr keeps no state, which also keeps it out of the Longhorn backup set.

# Mirrors resources('1.0', '1024M', '0.10', '128M').
janitorr_k8s_cpu_limit: "1"
janitorr_k8s_mem_limit: 1024Mi
janitorr_k8s_cpu_request: "100m"
janitorr_k8s_mem_request: 128Mi

# Match monitor-bridge's JANITORR_WINDOW=12h and JANITORR_STARTUP_GRACE_S=600.
janitorr_k8s_error_window_hours: 12
janitorr_k8s_startup_grace_seconds: 600

janitorr_k8s_health_schedule: "*/10 * * * *"

janitorr_k8s_health_verdict_configmap: janitorr-health-verdict

# Same two digests as configarr's health reader (configarr_k8s_health_image); kubectl comes from an
# alpine/k8s init container at /usr/bin/kubectl.
janitorr_k8s_health_image: python:3.15-alpine@sha256:0f9552bb28711333da16915ec146f5e6bb44a7fdac9ced15dc17c2e0206346dd
janitorr_k8s_health_kubectl_image: alpine/k8s:1.37.2@sha256:7a82aeefea3d554a43a8676b137f2b88bae6c1fe11c13862b191b3a086cc28c0

# Above the reader's worst case: two 30 s kubectl calls plus the cold pull of both images.
janitorr_k8s_health_deadline_seconds: 420
# TTL so a run the weekly reboot interrupts does not read Failed until two later runs fail; 30 min
# clears it within the hour after boot.
janitorr_k8s_health_job_ttl_seconds: 1800

janitorr_k8s_health_cpu_limit: "200m"
janitorr_k8s_health_mem_limit: 128Mi
janitorr_k8s_health_cpu_request: "10m"
janitorr_k8s_health_mem_request: 32Mi
