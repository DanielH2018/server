---
# No host file reads these keys: backup health derives arm state and schedules from the live
# objects.

# DECIDED: forward-only. A failed revision of this tag holds and leaves `prod`, because a reset to
# a revision before a disarm would re-arm B2 and restart the transaction-cap spiral. The hold
# clears only by hand: `gh variable set DEPLOY_HOLD --body none -R DanielH2018/server`. Full
# analysis: the H1 plan's *Forward-only tags and the promote rule*.
flux_forward_only: true

# DECIDED: never pruned. Under prune: true, a render that dropped a BackupTarget would make Flux
# delete it, and a lingering RecurringJob keeps running with its own `retain`. With prune: false a
# render that drops an object leaves it live. The cost is that an object removed here stays live
# until the operator deletes it (**operator-only**). Full analysis: the H1 plan's *Plumbing tags
# are never pruned*.
flux_prune: false

k8s_autodeploy: false
k8s_autodeploy_reason: "platform — the arm flags and the schedules govern every Longhorn backup; a wrong arm re-opens the B2 transaction-cap spiral, and host probes stay green through it"

# A plain variable, not a secret. A wrong region makes the target unreachable (`available: false`).
k3s_longhorn_b2_region: us-east-005

# 0 disables polling: each poll costs Class C LISTs and Class B cfg GETs that grow with retention,
# and a tripped cap makes every BackupVolume controller retry, so the failure burns the next day's
# allowance. Cost is UI staleness only.
k3s_longhorn_backupstore_poll_interval: 0

k3s_longhorn_backup_prefix: longhorn
# Whether the backup target is armed. false enforces a BLANK target URL - the containment
# lever for a B2 transaction-cap spiral (see the task comment).
#
# The spiral is driven purely by failure. BackupVolumeController.reconcile runs `longhorn backup
# ls --volume <vol>` — ONE LIST PER BackupVolume CR. Once the cap trips, B2 answers
# `AccessDenied Transaction cap exceeded`, a FAILED reconcile is requeued and a successful one
# is not, so the loop runs whatever pollInterval says. It runs at 40-110x the entire daily
# allowance, which is why it cannot recover on its own and why the daily reset alone is not a
# fix. A denied metadata GET surfaces as "cannot find volume.cfg in backupstore", NOT as a 403
# — a masked failure mode.
#
# Where the Class C goes, from the backupstore source:
#
#   1. THE PRUNE IS THE COST, and it is priced in DIRECTORIES, not bytes or changed blocks.
#      DeleteDeltaBlockBackup -> getBlockNamesForVolume walks `blocks/<lv1>/<lv2>/` with one
#      delimited ListObjects per directory (backupstore deltablock.go:1496-1510, s3.go:108), so a
#      volume's prune costs 1 + lv1dirs + lv2dirs LISTs — about 1.28 per stored block.
#   2. IT RUNS ONCE PER DELETED BACKUP, not once per run, so an over-retention backlog queues
#      dozens of tree walks worth days of cap. Delete such a backlog directly against the B2
#      API instead: deletes are Class A and unmetered, so the end state Longhorn wants costs
#      nothing to reach.
#   3. RE-ARMING ITSELF IS CHEAP. The target sync pulls one BackupVolume CR per remote prefix
#      and one Backup CR per remote backup, once. At pollInterval 0 nothing re-lists
#      afterwards: btc.go's isBackupTargetSyncRequired gates on SyncRequestedAt > LastSyncedAt
#      and no BackupStoreTimer exists to advance it.
#
# The storm is failure-driven — a failed sync returns before LastSyncedAt is set, so the gate
# never closes and every watch event re-lists — but it only starts once the cap is already
# gone. Keeping spend under the cap is therefore the whole defence, and the worst weekday shard
# projects at ~1,524 Class C against 2,500. `probe.py b2-budget` recomputes that projection from
# the live bucket; run it after adding a volume, because the cost grows with stored blocks and
# nothing else will announce the drift.
#
# DO NOT RE-ARM ON A TIMER, and do not re-arm without draining the over-retention backlog
# first — that ordering, not the clock, is what makes a re-arm hold.
k3s_longhorn_backup_armed: true

# 03:30 clears the daily secret-rotation cron. Steady state is the R2-routed volumes plus new PVCs.
k3s_longhorn_backup_cron: "30 3 * * *"
k3s_longhorn_backup_retain: 14

# 06:10 UTC follows both backup windows: a trim before the snapshot hands back blocks the snapshot
# re-pins.
k3s_longhorn_trim_cron: "10 6 * * *"

# Weekly tier: B2 transaction spend scales with volume COUNT per run — each backup pays fixed
# lock/list/config overhead plus per-block existence checks (HeadObject, Class B) — and even a
# Sunday-only weekly batch, stacked with the daily tier, retention pruning on both, and the
# 07:30 Sunday-reboot resync, blows both 2,500/day caps. Every B2-destined volume therefore
# backs up WEEKLY, sharded across the seven weekdays (declared shard = cron day-of-week,
# 0=Sunday) so no single cap-day carries more than 3 volumes' worth of transactions. The B2 set
# accepts a week-old worst-case restore; the R2-routed volumes keep the daily cadence,
# R2's caps being monthly and vast.
#
# retain 2 ≈ a fortnight of weeklies. Retention is what costs: a prune walks the volume's whole
# block tree (see k3s_longhorn_backup_armed), so the price is set by how many blocks the
# retained backups pin. A lower count pins fewer, and every prune is cheaper for it. The trade
# is recovery REACH: a corruption noticed on day 15 has no clean copy
# behind it. Raising this is a storage-and-transaction decision, not a free one.
#
# Note retention is enforced PER RECURRING JOB, over that job's own backups only, and only while
# the job still selects the volume — so this number does not govern the daily-era backups left
# behind when a volume moved into a weekday shard. Nothing prunes those;
# `scripts/backup/longhorn_reap.py backups` is their only owner.
k3s_longhorn_weekly_backup_minute_hour: "30 4"
k3s_longhorn_weekly_backup_retain: 2

# Longhorn has supported more than one BackupTarget since v1.8.0. A volume is routed by its
# OWN spec.backupTargetName, and
# RecurringJob carries no target field — so daily-backup and weekly-backup keep working
# unchanged and simply follow each volume to wherever it points. Nothing below changes how
# any volume is scheduled, only where its backups land.
#
# R2 is here for the axis B2 runs out of, not for capacity: 10M Class B operations/month and
# ZERO egress, against B2's 2,500/day Class B allowance, whose exhaustion takes the entire
# backup plane down and makes a restore drill read as data loss. R2's free storage
# is 10 GB against ~8.2 GB of live volume data, so it could not hold everything anyway.
k3s_longhorn_r2_armed: true

# R2's region is literally "auto"; it shares no configuration with B2.
k3s_longhorn_r2_region: auto
k3s_longhorn_r2_backup_prefix: longhorn

# 0 as for B2: a poll costs a metadata GET per volume per retained backup. Raise deliberately.
k3s_longhorn_r2_poll_interval: 0

manifests_rollout: ''
