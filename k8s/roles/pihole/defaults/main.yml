---
# Renovate-managed pin.
pihole_k8s_image: pihole/pihole:2026.09.0@sha256:5b9c8cf51de7d6d3f2240dbe72baf5f06e1fd39cb4d77a99fab4fa13e23bd1be
# Pinned (Renovate k8s-defaults manager). v-prefixed tags track upstream unbound releases.
pihole_k8s_unbound_image: klutchell/unbound:1.26.2@sha256:de8e624f84337bdb2d16540c0b203d5df2a981180421cb50ab4212b67542d8b4

# Renovate stance: whether an image bump here may automerge. `promote` deploys what merges.
# Platform: the LAN's DNS resolver. A failed deploy breaks name resolution fleet-wide, and
# etp-local-vips-blackout-on-node-join shows host probes stay green straight through that kind
# of outage — DNS-dependent tooling (including the ability to reach a fix) goes dark first.
# Also Recreate + PVC (the gravity/FTL databases) on its own state, which compounds the risk
# but isn't the primary reason.
k8s_autodeploy: false
k8s_autodeploy_reason: "platform — LAN DNS resolver; a failed deploy breaks name resolution fleet-wide, and host probes stay green through that kind of outage"

pihole_k8s_claim: pihole-etc
# Own claim: /etc/pihole is RWO and single-writer, and its contents are derivable.
pihole_k8s_claim_2: pihole-etc-2
# nobackup: every byte of /etc/pihole is derivable — gravity.db from the declared adlists
# below, pihole.toml from the FTLCONF env, dnsmasq.d from the shared template. pihole-FTL.db
# is query history: stats, not state.
pihole_k8s_storage_class: longhorn-nobackup
pihole_k8s_size: 2Gi

k8s_claims:
  - name: "{{ pihole_k8s_claim }}"
    storage_class: "{{ pihole_k8s_storage_class }}"
    size: "{{ pihole_k8s_size }}"
  - name: "{{ pihole_k8s_claim_2 }}"
    storage_class: "{{ pihole_k8s_storage_class }}"
    size: "{{ pihole_k8s_size }}"

# Unbound listens here because FTL owns :53 in the shared network namespace.
pihole_k8s_unbound_port: 5335

pihole_k8s_lan_ip: "{{ dns_k8s_vip }}"

# Pinned so cluster DNS forwards via kube-proxy to either pod, where the LAN VIP is subject to
# externalTrafficPolicy: Local. Immutable once bound: changing it means recreating the Service.
pihole_k8s_dns_cluster_ip: "{{ dns_k8s_cluster_ip }}"

# Use k8s-native units: "1.0" normalizes server-side and every apply reports "configured".
pihole_k8s_cpu_limit: "1"
pihole_k8s_mem_limit: 512Mi
pihole_k8s_cpu_request: 100m
pihole_k8s_mem_request: 320Mi
pihole_k8s_unbound_cpu_limit: 500m
pihole_k8s_unbound_mem_limit: 256Mi
pihole_k8s_unbound_cpu_request: 50m
pihole_k8s_unbound_mem_request: 32Mi

# Break-glass: false leaves the guard Job out, so a failing guard no longer holds `pihole`.
# Restore true in a second PR; CLAUDE.md has the procedure.
pihole_k8s_sibling_guard: true

# Desired blocklist state, reconciled into gravity.db by templates/verify/gravity.yaml.j2 (idempotent
# INSERT/UPDATE, then a gravity rebuild only when something changed). DECLARED rather than
# volume-seeded: pihole-FTL.db moves on every DNS query, so a seed could not be verified against
# a quiescent source.
# StevenBlack is Pi-hole's first-boot default; declaring it disabled keeps a fresh boot from
# silently re-enabling it.
pihole_k8s_adlists:
  - address: https://big.oisd.nl
    enabled: 1
  - address: https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts
    enabled: 0
# domainlist type 3 = regex deny.
pihole_k8s_regex_deny:
  - '(\.|^)logs\.roku\.com$'
  - '(\.|^)ads\.samsung\.com$'

# Instance 2 rolls in `pihole-deferred` after instance 1 is Ready; no Flux path runs a restart task.
manifests_rollout: ''

manifests_self_rollouts:
  - { name: pihole, kind: deploy }
  - { name: pihole-2, kind: deploy }

# The Deployment macro both instances' templates import. It renders no document of its own.
manifests_exclude_files: [pihole-deployment.yaml]

# Instance 2's Deployment renders into `pihole-deferred`, which waits on `pihole`.
manifests_deferred_files:
  - deployment-2.yaml

manifests_deferred_dir_name: pihole-instance-2
