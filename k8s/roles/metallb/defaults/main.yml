---
# MetalLB serves every LoadBalancer VIP (Traefik's edge, Pi-hole's DNS). The app manifest is an
# in-tree copy, files/upstream/metallb-native.yaml, byte for byte what the item's `url` serves.
# No render may fetch a URL (D5, C1), so the renderer attaches the copy to this tag's bundle
# verbatim, and `sha256` still describes what Flux applies. scripts/dev/vendor_manifest.py owns
# the item's shape and the refresh:
#   uv run python scripts/dev/vendor_manifest.py metallb
# Merging a bump of the version is the upgrade (H1 Open question 6): land it through land.sh,
# which runs the metallb-upgrade gates. Run the refresh in the same PR.
#
# extractVersion is load-bearing: metallb/metallb publishes the app (`v0.16.0`) and the Helm
# chart (`metallb-chart-0.16.1`) into one releases feed, and the chart runs a minor ahead of
# the app. Anchoring on a leading `v` reads app releases only. The `v` sits inside the version
# group because Renovate writes the extracted version back here, and the url needs the tag.
# renovate: datasource=github-releases depName=metallb/metallb extractVersion=^(?<version>v\d+\.\d+\.\d+)$
k3s_metallb_version: v0.16.2
metallb_vendored_manifests:
  - name: metallb-native.yaml
    url: "https://raw.githubusercontent.com/metallb/metallb/{{ k3s_metallb_version }}/config/manifests/metallb-native.yaml"
    fetched_url: "https://raw.githubusercontent.com/metallb/metallb/v0.16.2/config/manifests/metallb-native.yaml"
    sha256: "e5f7c268f114c446dc60aaad71b7cabf861f637743e033e354d7d48592807c6d"

# Must sit OUTSIDE the router's DHCP scope. The ingress VIP is in its own autoAssign: false pool, so
# only a Service naming it can claim it.
# `k3s_metallb_ingress_vip` lives in group_vars/all.yml because Pi-hole on daniel-server consumes it
# on a host that never runs this role.
k3s_metallb_pool: 10.0.0.241-10.0.0.250

# Request only: BestEffort pods are evicted first, and an evicted speaker drops every VIP its node
# announces; a memory limit would add an OOM-kill path (operator ruling).
# A kustomize patch cannot read a variable, so tests/k8s/edge/test_metallb_vendored_manifest.py holds
# each patch equal to its key.
k3s_metallb_controller_memory_request: 128Mi
k3s_metallb_speaker_memory_request: 128Mi

# DECIDED: never pruned. Under prune: true, a render that dropped the speaker, the controller or
# a CRD would make Flux delete it, and deleting a CRD deletes every IPAddressPool and
# L2Advertisement of its kind: every VIP, the edge and DNS, goes down at once. With prune: false
# a render that drops an object leaves it serving. The cost is that an object removed here stays
# live until the operator deletes it (**operator-only**). Full analysis: the H1 plan's
# *Plumbing tags are never pruned*.
flux_prune: false

# MetalLB's CRDs carry a conversion webhook, so a failed promote on this tag holds without resetting
# `prod`: a reset would apply an older vendored file over upgraded CRDs.
flux_forward_only: true

k8s_autodeploy: false
k8s_autodeploy_reason: "platform — MetalLB announces every LoadBalancer VIP; a bad apply or a CRD downgrade takes the edge and DNS offline together, and host probes stay green through that outage"

manifests_rollout: ''
