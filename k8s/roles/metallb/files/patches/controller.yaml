---
# Gives the MetalLB controller a memory REQUEST (no limit) so its pod leaves BestEffort, the
# kubelet's first eviction under node memory pressure (#8326). Upstream ships the container with
# no `resources`. The value is k3s_metallb_controller_memory_request in defaults/main.yml; a
# kustomize patch is copied verbatim and cannot read a variable, so
# tests/k8s/test_metallb_vendored_manifest.py holds the two equal.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller
  namespace: metallb-system
spec:
  template:
    spec:
      containers:
        - name: controller
          resources:
            requests:
              memory: 128Mi
