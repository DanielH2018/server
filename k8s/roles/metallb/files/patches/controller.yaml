---
# No memory limit by operator ruling: an OOM kill would drop the load balancer. The memory request
# is in defaults/main.yml, held equal by tests/k8s/test_metallb_vendored_manifest.py.
# The patch touches `resources` only: the controller writes the webhook's `caBundle` and
# `metallb-webhook-cert` at runtime.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller
  namespace: metallb-system
spec:
  template:
    spec:
      containers:
        - name: controller
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              cpu: 200m
