---
# Gives the MetalLB speaker requests and limits, so its pods are Burstable rather than
# BestEffort, the kubelet's first eviction under node memory pressure (#8326, #8542). The speaker
# announces every LoadBalancer VIP, so its eviction takes Traefik's edge and Pi-hole's DNS
# offline together. Upstream ships the container with no `resources`, and metallb-system has no
# LimitRange. The memory request is k3s_metallb_speaker_memory_request in defaults/main.yml; a
# kustomize patch is copied verbatim and cannot read a variable, so
# tests/k8s/test_metallb_vendored_manifest.py holds the two equal. The 21.6-day peak was 80Mi
# working set and under 4m CPU. The memory limit sits at more than three times it, because an
# OOMKill drops the VIPs as surely as an eviction. The CPU limit is wide, because a throttled
# speaker answers ARP and memberlist late.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: speaker
  namespace: metallb-system
spec:
  template:
    spec:
      containers:
        - name: speaker
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
