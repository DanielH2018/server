---
# Gives the MetalLB speaker a CPU and memory request and a CPU limit, and no memory limit, so its
# pods are Burstable rather than BestEffort, the kubelet's first eviction under node memory
# pressure. The speaker announces every LoadBalancer VIP, so its eviction takes
# Traefik's edge and Pi-hole's DNS offline together. An OOM kill would do the same, so the memory
# limit stays unset by operator ruling. Upstream ships the container with no
# `resources`, and metallb-system has no LimitRange. The memory request is
# k3s_metallb_speaker_memory_request in defaults/main.yml; a kustomize patch is copied verbatim
# and cannot read a variable, so tests/k8s/test_metallb_vendored_manifest.py holds the two equal.
# The CPU limit is wide, because a
# throttled speaker answers ARP and memberlist late.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: speaker
  namespace: metallb-system
spec:
  template:
    spec:
      containers:
        - name: speaker
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              cpu: 500m
