---
# The cluster home of autofix-bridge's containerized *arr remediation loop.
autofix_bridge_k8s_image: python:3.15-alpine@sha256:0f9552bb28711333da16915ec146f5e6bb44a7fdac9ced15dc17c2e0206346dd

# The Python files that make up the running bridge, mirroring monitor-bridge's ship list
# (defaults/main.yml there) and the same risk: a module missing here never reaches the
# ConfigMap, and the pod dies at import with ModuleNotFoundError the next time it rolls, on a
# workload that fixes *arr issues with no page of its own if it silently stops.
#
# autofix.py is this role's own file. bridge/common.py is monitor-bridge's canonical copy and
# jobs_metrics.py is crowdsec's, both shipped cross-role, never a second edited copy under this
# role's files/.
# ENFORCED by tests/services/test_autofix_bridge_modules.py.
# `name` is the ConfigMap key (no slash allowed); `path` is where the Deployment mounts it
# under /app. templates/script-configmap.yaml.j2 embeds each `src`. The shared module is `bridge/common.py` in
# both roles' pods, so `autofix.py` imports it the same way monitor-bridge's modules do.
autofix_bridge_modules:
  - name: autofix.py
    path: autofix.py
    src: "{{ role_file('files/autofix.py') }}"
  - name: bridge_common.py
    path: bridge/common.py
    src: "{{ role_file('files/bridge/common.py', role='monitor-bridge') }}"
  # crowdsec's check exporter (M6 batch B6b): the stdlib `homelab_check_*` gauge server, shipped
  # cross-role like bridge/common.py so the verdict has one implementation. autofix.py serves the
  # cycle's verdict through it on CHECK_EXPORTER_PORT.
  - name: jobs_metrics.py
    path: jobs_metrics.py
    src: "{{ role_file('files/jobs_metrics.py', role='crowdsec') }}"

# Renovate stance: whether an image bump here may automerge. `promote` deploys what merges.
# Observability: the auto-remediation twin of monitor-bridge — a broken deploy silently stops
# fixing *arr queue issues with no page of its own (AutofixBridgeStale is a slower
# backstop, not a rollout gate). ALSO renders no readinessProbe on its Deployment (probe-less),
# which compounds independently of the observability classification.
k8s_autodeploy: false
k8s_autodeploy_reason: "observability — auto-remediation loop; a broken deploy silently stops fixing arr issues. ALSO no readinessProbe (probe-less) — two independent reasons"

manifests_rollout: autofix-bridge
