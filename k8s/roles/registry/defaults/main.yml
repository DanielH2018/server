---
# Filesystem storage driver (REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY, see deployment.yaml.j2).
registry_k8s_image: registry:3.1.2@sha256:82f6ff4a7f982960c8aa51617fea3aabc485df6e55cce80d22deb1de36f1bc3c

# Renovate stance: whether an image bump here may automerge. `promote` deploys what merges.
# Dependency edges: registry is the
# image-supply path for n8n, n8n-runners, homelab-mcp, ical-proxy, nut, pi-peer-backup and
# code-server (homelab-mcp pulls with imagePullPolicy: Always — an outage here reaches it even
# without a new pull). ALSO Recreate + its own PVC (the blob store) — a failed image swap can
# also migrate its own stored blobs before the gate observes a fault, compounding the
# dependency-edge risk with a migrating-state-shaped risk on registry's own data.
k8s_autodeploy: false
k8s_autodeploy_reason: "dependency edges — image-supply path for n8n/homelab-mcp/ical-proxy/nut/pi-peer-backup/code-server/terraria/valheim/karakeep; no intra-tick ordering. ALSO Recreate + its own PVC (blob store) — two independent reasons. COUPLING NOTE for a future promotion: a revert drops recently-pushed digests from the blob store while nodes that already pulled them keep running until their next pull 404s"

# The address vars (k8s_registry_port / _host_ip / _pull_host) live in k8s/vars.yml
# because the k3s-server and k3s-agent host components need them too, to write containerd's
# trust config (templates/registries.yaml.j2 in each).

# longhorn-nobackup on purpose. Every image here is reproducible from a Dockerfile in this
# repo, so backing them up would spend B2 Class C transactions — already ~60% of the daily cap
# — on bytes a rebuild regenerates. Losing this volume costs a rebuild, not data.
registry_k8s_claim: registry-data
registry_k8s_storage_class: longhorn-nobackup
registry_k8s_size: 10Gi

# Zero TTL: the weekly GC's offline prune is the only thing that reclaims this store.
registry_k8s_ghcr_mirror_claim: registry-ghcr-mirror
registry_k8s_ghcr_mirror_size: 30Gi
registry_k8s_ghcr_mirror_keep_revisions: 3
registry_k8s_ghcr_mirror_debug_port: 5003
registry_k8s_ghcr_resume_image: python:3.15-alpine@sha256:0f9552bb28711333da16915ec146f5e6bb44a7fdac9ced15dc17c2e0206346dd
registry_k8s_ghcr_resume_port: 5004

registry_k8s_dockerhub_mirror_claim: registry-dockerhub-mirror
registry_k8s_dockerhub_mirror_size: 40Gi
registry_k8s_dockerhub_mirror_keep_revisions: 3
registry_k8s_dockerhub_mirror_debug_port: 5006

# The claim the renderer emits for this role, which the registry Kustomization applies.
k8s_claims:
  - name: "{{ registry_k8s_claim }}"
    storage_class: "{{ registry_k8s_storage_class }}"
    size: "{{ registry_k8s_size }}"
  - name: "{{ registry_k8s_ghcr_mirror_claim }}"
    storage_class: "{{ registry_k8s_storage_class }}"
    size: "{{ registry_k8s_ghcr_mirror_size }}"
  - name: "{{ registry_k8s_dockerhub_mirror_claim }}"
    storage_class: "{{ registry_k8s_storage_class }}"
    size: "{{ registry_k8s_dockerhub_mirror_size }}"

# False drops the registry-gc component from the host package; leaving it on reports a foreign
# registry's health to the operator's alerting.
registry_k8s_manage_gc: true

# Sunday 04:20, the quietest window: GC takes the ghcr-mirror offline for its duration.
# The registry-gc timer carries the same time as a literal.
registry_k8s_gc_cron_weekday: "0"
registry_k8s_gc_cron_hour: "4"
registry_k8s_gc_cron_minute: "20"

# The ghcr-mirror is down for up to this long, so it bounds an outage, not just a job.
registry_k8s_gc_deadline_s: 1200
# The Job log is the only record of what the last GC deleted.
registry_k8s_gc_ttl_s: 604800

# registry-gc.sh holds this flock; the deploy's restore takes it without waiting, so never mid-GC.
registry_k8s_gc_lock_file: /run/lock/registry-gc.lock

registry_k8s_crane_image: gcr.io/go-containerregistry/crane:v0.22.1@sha256:1f968817b95790bed063f71175aa6b8ff879fa17064020415f3e18bb6e6a36e1
# Not an image the fleet runs, so a failure cannot mean "that image changed".
registry_k8s_probe_source: alpine:3.22
registry_k8s_probe_repo: registry-selftest

# Needs busybox nc and musl getent; tracks the other probes (3.24), not registry_k8s_probe_source.
registry_k8s_netpol_probe_image: alpine:3.24@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf

# The CNI bridge gateway on daniel-box — `ip -4 addr show cni0` reads `10.42.0.1/24`, matching
# the live podCIDR `kubectl get node daniel-box -o jsonpath='{.spec.podCIDR}'` = 10.42.0.0/24.
# hostPort traffic (containerd's pull, see networkpolicy.yaml.j2) is
# SNAT'd to this address before it reaches the pod, so a podSelector cannot admit it — only an
# ipBlock can. A second node hosting the registry would need this widened to the full
# `k3s_cni0_gateways` list to admit that node's own cni0 gateway too. Aliases
# `k3s_cni0_gateways[0]` (`k8s/vars.yml`) rather than repeating the
# literal — daniel-box is index 0 there, and the verification above is what pins this to that
# single entry instead of the full pair netpol-baseline admits.
registry_k8s_netpol_cni_gateway: "{{ k3s_cni0_gateways[0] }}"

# daniel-server's flannel.1 address — `ip -4 addr show flannel.1` there reads 10.42.1.0/32.
# Its containerd's pulls of the ClusterIP mirror endpoint arrive
# SNAT'd to this; admitted so built images can run on that node (first consumer: nut).
#
# This pair is the pinned node's own cni0 gateway plus the OTHER node's flannel.1 address, and it
# is correct only while the pod stays pinned where `k8s_registry_node` puts it. Nothing but a test
# tied the three together — the pin is a nodeSelector in deployment.yaml.j2, these are two role
# defaults — so repointing the pin at daniel-server would leave daniel-box's own pulls arriving as
# 10.42.0.0 and denied, with the selftest job the only caller that says so (#1725). ENFORCED by
# tests/k8s/edge/test_registry_netpol_grants_follow_the_pinned_node.py.
registry_k8s_netpol_agent_flannel: 10.42.1.0/32

# restart_on: []: it reads no ConfigMap or Secret, and a restart drops every pull in flight.
manifests_extra_rollouts:
  - name: ghcr-mirror
    restart_on: []
  # The docker.io mirror (templates/dockerhub-mirror.yaml.j2), for the same reason.
  - name: dockerhub-mirror
    restart_on: []
