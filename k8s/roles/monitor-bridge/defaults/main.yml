---
# check.py lives in this role's files/ and every check runs here.
monitor_bridge_k8s_image: python:3.15-alpine@sha256:0f9552bb28711333da16915ec146f5e6bb44a7fdac9ced15dc17c2e0206346dd

# The deploy-pipeline exporter's listener (files/deploy_pipeline.py), the one thing this pod
# serves rather than pushes. config/env.yaml.j2 hands it to the process, the Service and the
# container port read it, and observability's deploy-pipeline scrape job targets it as a literal,
# because role defaults do not cross the deploy play's include_role loop.
# tests/services/test_deploy_pipeline_scrape.py holds that literal to this value.
monitor_bridge_deploy_pipeline_port: 9180

# The host-package builder's two page bounds (h3-pi-pilot.md, *Builder arms*), rendered into
# config/env.yaml.j2 as BUILDER_MAX_LAG_S and BUILDER_MAX_FETCH_AGE_S for the `host_packages` row.
# Lag: how long master may sit unbuilt (a trust, keyring or tools refusal, a rewritten master,
# a hold, an open rollout gate, a master that stays red) before the tile pages. The value here is
# the bound for every reason, 2 hours against a ~103 s master CI run. Fetch age: how old the builder's last successful `git fetch` may be,
# 30 minutes, which is 15 of its 2-minute runs and covers a dead timer or a missing token.
monitor_bridge_builder_max_lag_s: 7200
monitor_bridge_builder_max_fetch_age_s: 1800

# The Python files that make up the running bridge. This is the SHIP LIST: a module missing
# here never reaches the ConfigMap, and the pod dies at import with ModuleNotFoundError the
# next time it rolls — while the test suite stays green, because pytest imports from files/
# on disk and never consults this list.
#
# Deliberately explicit rather than a `files/*.py` glob: files/ also holds the pytest suite
# and conftest.py, which must not reach the image.
# ENFORCED by tests/services/test_monitor_bridge_modules.py, which fails when a runtime module
# in files/ is absent here, unless that test's CHECKOUT_ONLY set names it.
# Paths relative to files/. Each module ships in its own ConfigMap, named from the path with
# `.py` dropped and `/` and `_` replaced by `-`. Its key is the path with `/` replaced by `_`
# (a key cannot contain a slash), and the Deployment's `items:` mounts that key back at the
# path, so `checks/b2.py` ships in `monitor-bridge-script-checks-b2` as key `checks_b2.py`
# and lands at /app/checks/b2.py. Both derivations sit in templates/script-configmap.yaml.j2
# and templates/deployment.yaml.j2.
monitor_bridge_modules:
  - cli.py
  - check.py
  - registry.py
  - check_table.py
  - deploy_pipeline.py
  - verdict_export.py
  - bridge/types.py
  - bridge/config.py
  - bridge/config_host.py
  - bridge/config_service.py
  - bridge/config_io.py
  - bridge/net.py
  - bridge/sources.py
  - bridge/streaks.py
  - checks/b2.py
  - checks/r2.py
  - checks/host_thermal.py
  - checks/host_edge.py
  - checks/service.py
  - checks/host_packages.py
  - checks/notify.py
  - checks/cloudflare_ips.py
  - checks/healthchecks.py
  - checks/domain_registration.py
  - checks/wan.py
  - bridge/common.py
  - bridge/parsing.py
  - verdicts/host.py
  - verdicts/host_smart.py
  - verdicts/service.py
  - verdicts/storage.py
  - verdicts/notify.py

# Renovate stance: whether an image bump here may automerge. `promote` deploys what merges.
# Observability: this IS the alert pipeline — every threshold check in the fleet pushes through
# it, so a broken deploy cannot page about being broken. ALSO renders no readinessProbe on its
# Deployment (probe-less), which compounds even if this were ever removed from the "observability"
# class: `rollout status` would return the moment the pod reports Running and prove nothing.
k8s_autodeploy: false
k8s_autodeploy_reason: "observability — this IS the alert pipeline; a broken deploy cannot page about being broken. ALSO no readinessProbe (probe-less) — two independent reasons"

# What the Healthchecks.io console must carry for each off-site dead-man check, which
# checks/healthchecks.py compares against `GET /api/v3/checks/` every day. A Simple
# check's `timeout` and every `grace` are seconds, as the API returns them; a Cron check carries
# its expression and timezone.
#
# A literal rather than a reference to the cron variables, because those live in host components'
# defaults and in the pi-peer-backup, registry and observability roles' defaults, and role
# defaults do not cross the deploy play's include_role loop. tests/services/test_monitor_bridge_healthchecks_expected.py holds
# this list to those variables (through the deadman-cadences fragment's reader), so a cron
# cannot move in one place alone. The period-and-grace table in
# docs/healthchecks-io-deadman.md is the deadman-graces fragment, rendered from this list.
#
# pi-peer-backup alone runs in `tz`: it is a k8s CronJob with `timeZone: {{ tz }}`, and every
# other slug is a daniel-box host cron, which runs in UTC.
monitor_bridge_healthchecks_expected:
  - {slug: longhorn-backup-health, kind: simple, timeout: 600, grace: 1200}
  - {slug: daniel-box-disk-health, kind: simple, timeout: 600, grace: 1500}
  # Pinged by Alertmanager's always-firing Watchdog every
  # observability_alertmanager_watchdog_repeat_seconds, not by a cron. Its 600s period plus
  # 1200s grace hold the weekly reboot's gap.
  - {slug: alertmanager-watchdog, kind: simple, timeout: 600, grace: 1200}
  - {slug: etcd-snapshot-offbox, kind: cron, schedule: "45 2 * * *", tz: UTC, grace: 3600}
  - {slug: pi-peer-backup, kind: cron, schedule: "0 23 * * *", tz: "{{ tz }}", grace: 7200}
  # Two hours covers registry-gc.sh's worst case of two mirror phases, about 6000s.
  # tests/services/test_registry_gc_watchers_cover_the_worst_run.py derives it.
  - {slug: registry-gc, kind: cron, schedule: "20 4 * * 0", tz: UTC, grace: 7200}
  # initial_setup's three pinging crons: the weekly reboot pings one slug per host, and the Docker
  # prune and the worktree sweep one per host whose package lists the pi-docker or worktree-sweep
  # component.
  - {slug: weekly-reboot-daniel-box, kind: cron, schedule: "30 7 * * 0", tz: UTC, grace: 3600}
  - {slug: weekly-reboot-daniel-server, kind: cron, schedule: "30 7 * * 0", tz: UTC, grace: 3600}
  - {slug: weekly-reboot-daniel-pi, kind: cron, schedule: "30 7 * * 0", tz: UTC, grace: 3600}
  - {slug: daniel-pi-docker-prune, kind: cron, schedule: "30 6 * * *", tz: UTC, grace: 3600}
  - {slug: daniel-box-worktree-sweep, kind: cron, schedule: "20 4 * * 0", tz: UTC, grace: 3600}
  - {slug: daniel-server-worktree-sweep, kind: cron, schedule: "20 4 * * 0", tz: UTC, grace: 3600}

manifests_rollout: monitor-bridge

# Each entry renders k8s/templates/secret-default.yaml.j2 as secret-<name>.yaml:
# its `string_data` maps a Secret field to the SOPS key its value comes from.
render_secrets:
  # The credentials check.py reads from files. This Secret is mounted, never consumed by
  # `envFrom`, which injects every key as an env var. Nothing here may move to
  # monitor-bridge-env, and nothing `envFrom` needs may move here.
  - name: monitor-bridge-credentials
    string_data:
      # An unscoped Home Assistant long-lived token: full control of the house.
      ha_token: monitor_bridge_ha_token
      # The B2 credential Longhorn's backup target uses.
      b2_probe_application_key: longhorn_b2_application_key # gitleaks:allow — a SOPS key NAME, not a value
      cf_analytics_token: cloudflare_analytics_token
      # Reads speedtest-tracker's full result history.
      speedtest_api_token: speedtest_api_token
      # The Healthchecks.io project's read-only API key:
      # check settings and ping history, never ping URLs.
      healthchecks_api_read_only_key: healthchecks_api_read_only_key
  # The bridge's API keys, webhooks and SMTP login, consumed by `envFrom`, so every key
  # becomes an env var. A credential that must stay out of the environment goes in
  # monitor-bridge-credentials. Every other setting is a plain `env:` value from
  # config/env.yaml.j2, because a Secret's quoted numeric literal fails Flux's typed patch.
  - name: monitor-bridge-env
    string_data:
      # Actions read and Variables read on this repository
      # only, so it can neither clear a hold nor move a tag.
      DEPLOY_PIPELINE_GITHUB_TOKEN: monitor_bridge_deploy_pipeline_github_token
      N8N_API_KEY: n8n_api_key
      SONARR_API_KEY: sonarr_api_key
      RADARR_API_KEY: radarr_api_key
      # Bazarr's own key. SONARR_API_KEY and RADARR_API_KEY are the keys
      # other apps authenticate with.
      BAZARR_API_KEY: bazarr_api_key
      PROWLARR_API_KEY: prowlarr_api_key
      B2_PROBE_KEY_ID: longhorn_b2_key_id
      DISCORD_WEBHOOK_URL: monitor_discord_webhook_url
      DISCORD_CROWDSEC_WEBHOOK_URL: crowdsec_discord_webhook_url
      DISCORD_GITOPS_WEBHOOK_URL: discord_alert_webhook
      DISCORD_ARR_WEBHOOK_URL: arr_discord_webhook_url
      DISCORD_HEALTHCHECKS_WEBHOOK_URL: healthchecks_discord_webhook_url
      SMTP_USER: email
      SMTP_PASSWORD: smtp_notify_app_password
      CF_ACCOUNT_ID: r2_account_id
      R2_BUCKET: r2_bucket
