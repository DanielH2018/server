---
# Renovate's k8s-defaults manager tracks this pin. The tag stays beside the digest
# (`repo:tag@sha256:...`): a bare `repo@sha256:...` freezes the image with no update signal.
# The image's repository publishes a version tag per release, not per merge.
tft_assistant_k8s_image: ghcr.io/danielh2018/tft-assistant:0.2.31@sha256:e79a3a67c30f09713ee15208ac4c01ad64f2b396b1cb150617748fc9402fb66e

# Renovate stance: whether an image bump here may automerge. `promote` deploys what merges.
k8s_autodeploy: true
k8s_autodeploy_reason: "the data volume holds matches the crawl can fetch again and a page the pod rebuilds at start, and the kept volume is snapshotted before each revision and backed up weekly, so a bad release costs a stale page or a revert of the notes"
# Every auto-deployed role with a Recreate strategy and an RWO claim snapshots it before a
# revision. A revert of the data claim saves a re-crawl. A revert of the kept claim saves the notes.
k8s_autodeploy_snapshot_pvcs: [tft-assistant-data, tft-assistant-keep]

# The web container: the image's `serve` command over one static page and the edit store. The
# command holds 35 MB resident at its peak under 20 concurrent page loads. That figure is for
# image 0.2.5 and later: 0.2.4 loaded numpy and scikit-learn in this command and held 136 MB, so
# a pin below 0.2.5 needs 256Mi here.
tft_assistant_k8s_cpu_limit: "200m"
tft_assistant_k8s_mem_limit: 128Mi
tft_assistant_k8s_cpu_request: "10m"
tft_assistant_k8s_mem_request: 48Mi

# The crawler container. It idles on Riot's rate limit between builds. A build holds every board
# of a selection in memory, about 800 MB for 13,600 matches, and the image analyses 20,000 at most.
tft_assistant_k8s_crawler_cpu_limit: "1500m"
tft_assistant_k8s_crawler_mem_limit: 2Gi
tft_assistant_k8s_crawler_cpu_request: "100m"
tft_assistant_k8s_crawler_mem_request: 512Mi

# The node with memory to spare for a build.
tft_assistant_k8s_node: daniel-server

# The uid the containers run as, pinned rather than left to the image's named user.
# `tests/k8s/workloads/test_container_security_context.py::test_every_asserting_container_pins_a_uid`
# requires it. 10001 is the uid the image creates.
tft_assistant_k8s_uid: 10001

# The match store, the static-data cache and the built page. Every byte comes back from Riot's
# API and Community Dragon, so the volume is on the class no backup job reads. A match is about
# 4 KB stored.
tft_assistant_k8s_claim: tft-assistant-data
tft_assistant_k8s_storage_class: longhorn-nobackup
tft_assistant_k8s_size: 10Gi

# What no API gives back: the notes a reader writes, and the comp ids the notes are keyed by.
# The image keeps both under `keep/` of its state directory. This claim is on the class the
# backup jobs read, and its `weekly_backup_claims` entry in k8s/services.yml names its day.
# Both files are a few hundred kilobytes.
tft_assistant_k8s_keep_claim: tft-assistant-keep
tft_assistant_k8s_keep_storage_class: longhorn
tft_assistant_k8s_keep_size: 1Gi

k8s_claims:
  - name: "{{ tft_assistant_k8s_claim }}"
    storage_class: "{{ tft_assistant_k8s_storage_class }}"
    size: "{{ tft_assistant_k8s_size }}"
  - name: "{{ tft_assistant_k8s_keep_claim }}"
    storage_class: "{{ tft_assistant_k8s_keep_storage_class }}"
    size: "{{ tft_assistant_k8s_keep_size }}"
