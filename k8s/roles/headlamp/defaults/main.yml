---
# Tag KEPT alongside the digest (repo:tag@sha256) so Renovate's k8s-defaults manager still
# tracks it for digest-bump PRs — a bare repo@sha256 would freeze it with zero update signal.
headlamp_k8s_image: ghcr.io/headlamp-k8s/headlamp:v0.46.0@sha256:8a0ef97527544baa2b35825940ddf4db6e2d09c30cd5aa31fd269ff604cc8b75

# Renovate stance: whether an image bump here may automerge. `promote` deploys what merges.
# Stateless: RollingUpdate Deployment, no PVC, readinessProbe, digest-pinned image. The
# headlamp-verify Job is a one-shot check, not a workload the rollout gate needs to cover.
k8s_autodeploy: true
k8s_autodeploy_reason: "stateless RollingUpdate Deployment, no PVC, readinessProbe, digest-pinned image"

headlamp_k8s_cpu_limit: "500m"
headlamp_k8s_mem_limit: 256Mi
headlamp_k8s_cpu_request: "20m"
headlamp_k8s_mem_request: 64Mi
# The upstream image's uid/gid (charts/headlamp/templates/deployment.yaml runs 100:101).
headlamp_k8s_uid: 100
headlamp_k8s_gid: 101
# How long a browser session survives before Headlamp re-reads the ServiceAccount token.
headlamp_k8s_session_ttl: 86400
headlamp_k8s_netpol_probe_image: alpine:3.24@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf
# Only Flux's six groups aggregate into `view`, so any other group missing here leaves an empty
# resource list that reads as "none exist".
# Mirrors k3s_readonly_crd_api_groups plus two k3s-internal groups; that var is another role's
# default, out of scope for the k8s deploy play.
headlamp_k8s_crd_api_groups:
  - traefik.io
  - metallb.io
  - longhorn.io
  - helm.cattle.io
  - k3s.cattle.io

# Extra Headlamp plugins, installed by the `fetch-plugins` init container in
# deployment.yaml.j2. The upstream image already BUNDLES the Prometheus plugin
# (container/build-manifest.json in headlamp-k8s/headlamp names prometheus-0.9.1 for v0.45.0),
# so it is not listed: a second copy would show `static-plugins/prometheus (shipped)` beside
# `plugins/prometheus` in GET /plugins on the running pod.
# Before adding an entry here, read GET /plugins on the live pod, not the plugin's README.
#
# Each entry is a release of github.com/headlamp-k8s/plugins, tagged <name>-<version>. The init
# container downloads each tarball on every pod start, refuses a checksum mismatch, and refuses
# to start the pod when GitHub is unreachable. A dashboard down during a GitHub outage is the
# trade for keeping the plugin out of the image and out of git.
#
# One entry per plugin: name, version, sha256, and asset_prefix where the release needs one.
# Keep `name` first and `version` (quoted) on the next line: the `headlamp plugins` regex
# manager in renovate.json matches that layout, and its packageRule keeps the bump PR manual.
# `asset_prefix` exists because the asset name is not uniform across plugins: prometheus
# publishes `prometheus-0.9.1.tar.gz`, while flux publishes `headlamp-k8s-flux-0.7.0.tar.gz`.
# The version stays written once, so a bump rewrites the whole URL.
# The sha256 is NOT derivable from the release, so a bump PR is a signal the operator finishes:
#   gh release download <name>-<ver> -R headlamp-k8s/plugins -p '<asset_prefix><name>-<ver>.tar.gz' -D /tmp
#   sha256sum /tmp/<asset_prefix><name>-<ver>.tar.gz
headlamp_k8s_plugins:
  # Flux's Kustomizations, sources and Helm releases. Reads go through `view`, which
  # flux-view-flux-system aggregates into, so no headlamp_k8s_crd_api_groups entry is needed.
  # Its sync and suspend buttons fail as Forbidden by design: writes to Flux go through git.
  - name: flux
    version: "0.8.0"
    sha256: 48abf409e6f6e5b7898532d036e38c3d8b4329d646f2b3bf9af10f5f5a2b924f
    asset_prefix: "headlamp-k8s-"

# TWO pieces, both owned by hosts/components/k3s-server: `k3s_oidc_groups_prefix` + the Authelia
# group. The prefix keeps an Authelia group from colliding with a `system:` group. Cross-role by
# necessity: the API server mints the name from a host package this play never runs.
headlamp_k8s_oidc_group: "oidc:admins"

# Turning it on REPLACES the ServiceAccount identity with the browser's: the API SERVER decides, so
# this is only safe while daniel-box's apiserver trusts Authelia via authentication-config.yaml.j2
# (host package homelab-daniel-box, loaded by one windowed k3s restart; `--oidc-*` flags and the
# file are mutually exclusive).
# If that trust is removed, turn this off in the same change: the dashboard would log in and Forbid
# every call.
# The Authelia client and credential render either way; an unused client authorises nobody.
headlamp_k8s_oidc_enabled: true
# The client id is also the audience: Authelia's default `id_token_audience_mode: specification`
# puts only it in `aud`, which the API server matches against each issuer's `audiences`. Tied by
# test_headlamp_client_id_agrees_across_authelia_headlamp_and_k3s.
headlamp_k8s_oidc_client_id: headlamp
# THE PUBLIC name, and pinning it is forced by Headlamp's code rather than chosen. Headlamp
# reads `-oidc-idp-issuer-url` ONCE, at server start, and builds one `oidc.Provider` from it
# for every request (`oidcAuthConfig.IdpIssuerURL` in backend/cmd/headlamp.go at v0.45.0) —
# there is no per-request issuer and no way to serve two. So this one value decides where
# EVERY login goes, on both hostnames, and the LAN name would send public-route logins to
# `auth.local.<domain>`, which a browser off the LAN cannot resolve.
#
# The public name is the one that works from both sides: a LAN browser reaches
# `auth.<domain>` through Cloudflare, where an off-LAN browser reaches `auth.local.<domain>`
# not at all. THE COST IS REAL AND WORTH NAMING — a LAN Headlamp login depends on
# external DNS and the Cloudflare edge, so an edge outage takes it out even though both
# endpoints are three metres apart. Headlamp has no break-glass login form.
#
# The API server trusts BOTH issuers regardless (`k3s_oidc_issuer_urls`), so this choice is
# not a lockout: it decides which name a login goes through, not which token is accepted.
headlamp_k8s_oidc_issuer_url: "https://auth.{{ domain }}"
# EMPTY on purpose: Headlamp builds the callback from the incoming request, so one instance serves
# both hostnames; setting it pins every login to one.
# Both URIs are registered on the Authelia client; a callback Authelia does not know fails with
# `invalid_request`.
headlamp_k8s_oidc_callback_url: ""
# `openid` is NOT listed, and adding it would send it twice: Headlamp prepends it itself —
# `Scopes: append([]string{oidc.ScopeOpenID}, oidcAuthConfig.Scopes...)` in
# backend/cmd/headlamp.go at v0.45.0.
# `groups` is the one that carries the RBAC subject; without it the login succeeds and every
# list call is Forbidden.
headlamp_k8s_oidc_scopes: "profile,email,groups"

# The armed apply's `-n homelab` refuses these observability-namespace objects, so the renderer
# emits them as the deferred document `headlamp-deferred`.
manifests_deferred_files:
  - rbac-observability.yaml

manifests_deferred_dir_name: headlamp-observability

render_secrets:
  # The plaintext half of the Authelia client credential (Authelia holds only the pbkdf2 digest
  # `headlamp_oidc_client_secret_hash`), so rotate the two keys together.
  # Rendered while the login is off too, so arming it is one variable.
  - name: headlamp-oidc
    string_data:
      client_secret: headlamp_oidc_client_secret
