---
# The pins here keep their repo:tag@sha256 form so Renovate's docker manager still tracks them
# and opens digest-bump PRs. A bare repo@sha256 with NO tag is DIGEST_PINNED_EXEMPT
# (scripts/tests/test_renovate_managers.py) and gets ZERO Renovate tracking — the fully-manual
# pull-digest-redeploy loop tdarr is on.
karakeep_k8s_image: ghcr.io/karakeep-app/karakeep:release@sha256:6f7d32ef296ddf1fc7c67ff56b8a201b7006a6a47b92b202afee1338841b353d
karakeep_k8s_chrome_image: ghcr.io/karakeep-app/karakeep-chrome:release@sha256:00fb4fa9c37aa74c58e74d0bdd16c4e3b81dddb5f264917c879f9579c3b3ad95
# Literal: the renderer reads a role's Flux `timeout` only from a literal role default.
# The deadline must move with the timeout, or `rollout status` fails at the 600s default.
manifests_rollout_timeout: 1200s
karakeep_k8s_rollout_timeout: "{{ manifests_rollout_timeout }}"
# The budget of the karakeep-prepull Kustomization, whose Job pulls all four Deployments'
# images onto their node before the karakeep Kustomization applies
# (scripts/renderer/renderer_lib/prepull.py). `karakeep` and `karakeep-meilisearch` are
# `Recreate`, so without it the old pod stops before the new pod's pull starts, and a failed
# pull leaves karakeep down.
# The app image is 511 MB and the chrome image 449 MB, about 960 MB when one release moves
# both. GHCR has served this homelab as slowly as 0.145 MB/s (n8n's defaults) and pulls have
# run at 0.25 MB/s. The kubelet pulls one image after the other, so both at 0.25 MB/s take
# about 3840s. 4500s
# covers that down to 0.213 MB/s, and the app image alone down to 0.114 MB/s. The Job has no
# deadline, so a slower pull costs that revision its verdict, the Job keeps pulling, and Flux
# applies karakeep on a later retry. Only Flux reads it: the renderer adds the Kustomization
# for a published tag alone, so an Ansible deploy ignores it.
flux_prepull_timeout: 4500s
karakeep_k8s_meili_image: getmeili/meilisearch:v1.55.0@sha256:ff546679970126f8822e15d1b6a06bfbff1f2ce2e43f810cfb5258012f92de5c
# Built in-cluster. The base-image pin (uv `python3.15-trixie-slim` digest) lives in
# `templates/Dockerfile.j2`'s `FROM` line, where Renovate's dockerfile manager reads it. All five
# pinned pip deps below must resolve wheel-only under the base's interpreter, because
# trixie-slim ships no compiler and an sdist fallback crashloops the boot-time
# `uv pip install`.
#
# `k8s_built_image_tags` is a play-scoped fact k8s/image-builder publishes, so the `.get` fallback
# is what a deploy that skipped the build renders — see that role's CLAUDE.md.
karakeep_k8s_tagger_image: "{{ k8s_registry_pull_host }}/karakeep:{{ k8s_built_image_tags.get('karakeep', 'latest') }}"

# Renovate stance: whether an image bump here may automerge. `promote` deploys what merges.
# Three independent reasons, not one: (1) stateful — a meilisearch bump migrates the index in
# place (MEILI_UPGRADE_DB in deployment-meilisearch.yaml.j2), and upstream says that migration
# is not atomic, so a failure mid-flight needs a human to reindex rather than a retry; (2)
# probe-less — the time-tagger sub-deployment renders no readinessProbe, so `rollout status`
# would return on Running and prove nothing for it even if the primary Deployment were fine;
# (3) migrating state — strategy is Recreate and the config PVC comes from k8s_claims below
# (hardcoded ReadWriteOnce). Any one of the three would justify the denylist
# entry; a reason naming only one would miss the other two.
k8s_autodeploy: false
k8s_autodeploy_reason: "three reasons: (1) stateful — meilisearch migrates its index in place on a bump, non-atomically; (2) probe-less time-tagger sub-deployment; (3) migrating state — Recreate + RWO PVC. COUPLING NOTE for a future promotion: karakeep-meili is deliberately excluded from the snapshot, so reverting karakeep-data alone desyncs the search index until a manual reindex"
# Snapshotted before each revision because an app bump runs a one-way DB migration; meili is rebuilt
# by reindexing.
k8s_autodeploy_snapshot_pvcs: [karakeep-data]

# Each memory request below is its container's 7-day p95 working set rounded up to 64Mi: 946Mi for the app, 591Mi for chrome and 770Mi for meilisearch.
karakeep_k8s_cpu_limit: "2"
karakeep_k8s_mem_limit: 2048Mi
karakeep_k8s_cpu_request: "100m"
karakeep_k8s_mem_request: 960Mi
# Headless Chrome spikes, so a generous cap.
karakeep_k8s_chrome_cpu_limit: "2"
karakeep_k8s_chrome_mem_limit: 2048Mi
karakeep_k8s_chrome_cpu_request: "100m"
karakeep_k8s_chrome_mem_request: 640Mi
karakeep_k8s_meili_cpu_limit: "1"
karakeep_k8s_meili_mem_limit: 1024Mi
karakeep_k8s_meili_cpu_request: "100m"
karakeep_k8s_meili_mem_request: 832Mi
# cpu 1.0 is deliberate: the boot-time `uv pip install` and tag bursts CFS-throttle at 0.5.
karakeep_k8s_tagger_cpu_limit: "1"
karakeep_k8s_tagger_mem_limit: 512Mi
karakeep_k8s_tagger_cpu_request: "50m"
karakeep_k8s_tagger_mem_request: 64Mi

karakeep_k8s_pruner_schedule: "15 5 * * *"
karakeep_k8s_pruner_screenshot_days: 30
karakeep_k8s_pruner_delete_days: 90
# With it false the job logs what it would do and changes nothing, which is the way to pause it.
karakeep_k8s_pruner_apply: true
karakeep_k8s_pruner_max_deletes: 50
# Tags the time-tagger attaches as `attachedBy: human`; tests/test_archive_pruner.py keeps this
# equal to its tag union.
karakeep_k8s_pruner_auto_tags: ["0-1m", "1-5m", "0-5m", "5-10m", "10-15m", "15-30m", "30m+"]
karakeep_k8s_pruner_connect_budget_seconds: 300
# The renderer sets the `karakeep-verify` timeout above this.
karakeep_k8s_pruner_deadline_seconds: 600
# Must exceed one schedule period, because `probe.py health` judges the newest Job.
karakeep_k8s_pruner_job_ttl_seconds: 172800

karakeep_k8s_claim: karakeep-data
karakeep_k8s_storage_class: longhorn
karakeep_k8s_size: 4Gi

# The Meilisearch index: 286M, and deliberately NOT seeded and NOT backed up. It is a
# derived artifact: karakeep rebuilds it by reindexing from db.db, which IS seeded and backed
# up. The upgrade runbook in the role's CLAUDE.md already ends in "Reindex All Bookmarks".
karakeep_k8s_meili_claim: karakeep-meili
karakeep_k8s_meili_storage_class: longhorn-nobackup
karakeep_k8s_meili_size: 2Gi

# The time-tagger's script is vendored at files/karakeep-time-tagger.py rather than downloaded,
# because a ConfigMap must render from something that exists at render time and CI renders every
# template on a machine that has never deployed. It is 17K, far inside the 1M ConfigMap ceiling.
# The `karakeep-time-tagger-script-matches-its-pinned-sha256` row of tests/repo/_config_rows.py
# pins its sha256, and the `karakeep-time-tagger-fork-names-an-immutable-upstream-commit` row
# there holds the URL below to a full commit SHA.
# Forked from https://raw.githubusercontent.com/thiswillbeyourgithub/karakeep_python_api/37fa33fdd62b2ee5275ce8cdc1c86d29d0ec4237/community_scripts/karakeep-time-tagger/karakeep-time-tagger.py

# The claims the renderer emits for this role. The karakeep Kustomization applies them after the
# karakeep-snapshot Job.
# karakeep-meili is a plain claim on longhorn-nobackup: the Meilisearch index is derived from
# db.db and rebuilt with "Reindex All Bookmarks", so it is neither seeded nor worth B2
# transactions.
k8s_claims:
  - name: "{{ karakeep_k8s_claim }}"
    storage_class: "{{ karakeep_k8s_storage_class }}"
    size: "{{ karakeep_k8s_size }}"
  - name: "{{ karakeep_k8s_meili_claim }}"
    storage_class: "{{ karakeep_k8s_meili_storage_class }}"
    size: "{{ karakeep_k8s_meili_size }}"

# With pruner_apply true the gate run deletes, so it is a mutation; the named test shows a rerun
# changes nothing.
flux_cronjob_gates:
  karakeep-archive-pruner:
    kind: mutation
    rerun_safe: k8s/roles/karakeep/tests/test_archive_pruner.py::test_a_second_run_changes_nothing

image_builder_builds:
  - image_builder_name: karakeep
    image_builder_dockerfile: "{{ role_file('templates/Dockerfile.j2') }}"

# The drain gives every extra rollout below the budget of `manifests_rollout_timeout`.
# meilisearch reads MEILI_MASTER_KEY from this role's Secret as an ENV var, which is only
# injected at container start. Without this, rotating that key rolls `karakeep` with the new
# value while `karakeep-meilisearch` keeps serving the old one — the app and its search
# backend end up on different keys and the deploy reports green.
#
# time-tagger also reads a Secret value through env: KARAKEEP_PYTHON_API_KEY, via
# `secretKeyRef` in deployment-time-tagger.yaml.j2. Its script IS a plain (non-subPath)
# ConfigMap mount, so kubelet syncs a changed script and the `while true; sleep 900` loop
# re-execs it without a restart — but that mechanism only covers the script file, not the
# env var, which resolves once at pod start same as crowdsec's node agents. Without
# this line a rotated KARAKEEP_PYTHON_API_KEY lands in the Secret while the tagger keeps
# calling the API with the old key.
#
# chrome is listed so the batch drain WAITS on it, never so it restarts. Its one
# input that moves is `karakeep_k8s_chrome_image`, which Renovate bumps every few weeks: a
# bump changes chrome's pod template, so the apply rolls it, and without this entry nothing
# waits on that roll and the landing reads `VERDICT: settled` mid-pull. `restart_on: []`
# keeps the shared extra restart off it. chrome mounts no role-rendered config, reads no
# Secret and runs no built image, so all three signals would only restart it on an
# unrelated karakeep edit and drop any crawl in flight.
#
# ACCEPTED COST: the restart is gated on the render changing, not on the SECRET changing, so
# any karakeep manifest edit also rolls time-tagger, and this extra rollout is queued for
# the batch drain like any other, so the deploy waits on it. Unlike crowdsec's node agents,
# that wait should be cheap: time-tagger has no readinessProbe
# (deployment-time-tagger.yaml.j2, and karakeep_autodeploy_reason cites this as
# "probe-less"), so a pod counts Ready as soon as its main container starts, which needs only
# the wait-for-karakeep initContainer's TCP probe of the karakeep Service to succeed — and
# the batch already waits on karakeep's own primary rollout in parallel, so that Service is
# normally ready before or around the same time.
manifests_extra_rollouts:
  - name: karakeep-meilisearch
  - name: karakeep-time-tagger
  - name: karakeep-chrome
    restart_on: []

render_secrets:
  # A fresh value on either reads as everyone logged out or broken search, not a config error.
  - name: karakeep
    string_data:
      MEILI_MASTER_KEY: karakeep_meili_master_key
      NEXTAUTH_SECRET: karakeep_nextauth_secret
      OPENAI_API_KEY: karakeep_gemini_api_key
      KARAKEEP_PYTHON_API_KEY: karakeep_python_api_key
