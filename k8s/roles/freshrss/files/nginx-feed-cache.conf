proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=feed_cache:1m max_size=10m inactive=25h use_temp_path=off;

log_format cache '$remote_addr [$time_local] "$request" $status cache:$upstream_cache_status';

server {
    listen 80;
    access_log /var/log/nginx/access.log cache;

    location /health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    location / {
        proxy_pass https://rachelbythebay.com;
        proxy_ssl_server_name on;
        proxy_set_header Host rachelbythebay.com;
        proxy_set_header User-Agent "FreshRSS/feed-cache";
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_cache feed_cache;
        proxy_cache_valid 200 24h;
        proxy_cache_use_stale error timeout updating;
        proxy_cache_lock on;
        proxy_cache_revalidate on;
        proxy_ignore_headers Cache-Control Expires;
    }

    # Rest of World's feeds put unescaped `&` in media URLs, which FreshRSS rejects as invalid XML.
    location /restofworld/ {
        proxy_pass https://restofworld.org/;
        proxy_ssl_server_name on;
        proxy_set_header Host restofworld.org;
        proxy_set_header User-Agent "FreshRSS/feed-cache";
        # sub_filter cannot rewrite a compressed body.
        proxy_set_header Accept-Encoding "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_cache feed_cache;
        proxy_cache_valid 200 10m;
        proxy_cache_use_stale error timeout updating;
        proxy_cache_lock on;
        sub_filter_types application/xml;
        sub_filter_once off;
        sub_filter '&dpr=' '&amp;dpr=';
        sub_filter '&crop=' '&amp;crop=';
    }
}
