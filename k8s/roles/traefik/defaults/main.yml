---
# Digest-pinned, like this file's other images: the edge terminates TLS and carries the CrowdSec
# bouncer and the Authelia forward-auth chain, so a re-pull must not change it underneath. The
# tag alone is exact but mutable; the digest makes the pull reproducible. Renovate updates
# `tag@sha256:` pairs in place, as it does for wg_easy_k8s_image.
traefik_k8s_image: traefik:v3.7.18@sha256:9c437ac4f09ce6f4980a8544902d3475fdf70a1a7c578729581d2535dfa7d635

# The CRDs are a role of their own, `traefik-crds`, whose defaults pin its in-tree copy of
# upstream's definitions. That copy's version must share this image's minor:
# tests/k8s/test_traefik_crds.py fails a minor bump here until the copy is refreshed.

# Renovate stance: whether an image bump here may automerge. `promote` deploys what merges.
# Platform: this is the ingress edge everything else routes through. A failed deploy removes
# the ability to reach or observe anything else in the fleet, including this pod, and host
# probes stay green straight through that kind of outage. Recreate + a PVC (the acme.json cert
# store) compounds the risk but isn't the primary reason.
k8s_autodeploy: false
k8s_autodeploy_reason: "platform — ingress edge; a failed deploy removes the ability to reach or fix anything else, and host probes stay green through that kind of outage. COUPLING NOTE for a future promotion: the traefik-acme PVC holds the ACME account key and issued certs; reverting past a real rotation reinstates stale cert state"

traefik_k8s_http_port: 8000
traefik_k8s_https_port: 8443
traefik_k8s_ping_port: 8082

# Traefik's image has no passwd entry requirement; this UID owns the acme PVC via fsGroup.
traefik_k8s_uid: 65532

# Per-cluster subsystem switches. Both are true for prod and false for a staging cluster that
# has neither a Cloudflare account nor the SOPS keys behind one. They gate file-list inclusion,
# not just template branches, because the ACME half spans a PVC, a Secret, an init container and
# two volumes as well as the resolver block.
#
# DECIDED: these are one-way for a cluster that has already deployed with them on. traefik's
# tag prunes, so dropping a name from the file lists makes Flux delete the live object at the
# next promotion. Flipping either to false on prod therefore sheds a subsystem the edge
# still serves.
# The flags exist so a new cluster can come up without the subsystem, not so prod can shed it.
# Namespaces this cluster's Traefik watches. rbac.yaml.j2 renders one namespaced Role per
# entry, and static-config.yaml.j2 lists the same set as `providers.kubernetesCRD.namespaces`.
# ONE variable, so the two cannot drift.
# ENFORCED by tests/services/traefik/test_traefik_watched_namespaces.py, which compares the RENDERED
# manifests (Role namespaces vs the provider list), not the templates' text.
#
# Scoped to named namespaces: Traefik should not pick up an IngressRoute someone drops in an
# arbitrary one (kube-system in particular). `allowCrossNamespace` stays OFF, so every watched
# namespace carries its own copies of the rate-limit and authelia Middlewares rather than
# reaching into another's.
#
# DECIDED 2026-08-28: per-cluster, because an entry must name a namespace that EXISTS at
# deploy time. The two failure modes are asymmetric and both are per-cluster facts:
# a namespace Traefik watches with no Role fails SILENTLY (informers never sync, the host
# a Role for an absent namespace fails LOUDLY (`namespaces "observability" not found` aborts the
# deploy), because a cluster whose subset lacks observability has nothing else to create it.
traefik_k8s_watched_namespaces:
  - "{{ k8s_namespace }}"
  - "{{ k8s_observability_namespace }}"
  # Longhorn's namespace, for the single route k8s/roles/longhorn-ui adds to its UI.
  - "{{ k8s_longhorn_namespace }}"

traefik_k8s_manage_acme: true

# The CrowdSec bouncer plugin, the entrypoint Middleware that invokes it, and the agent
# sidecar that feeds the LAPI. False for a cluster that does not run the `crowdsec` role:
# `crowdsec:8080` does not resolve there, the sidecar crashloops, and the pod never reaches
# Ready — a false failure rather than a real one.
#
# DECIDED: role-local, and paired with authelia_k8s_manage_crowdsec rather than shared. The
# two surfaces are asymmetric: Traefik carries a bouncer plugin and a Middleware and
# ENFORCES bans, where Authelia carries only an agent and produces the failed-login lines
# the scenarios read.
traefik_k8s_manage_crowdsec: true

# The `traefik-precheck` Job, which refuses a bouncer key the LAPI rejects before Traefik rolls
# (`templates/precheck/bouncer-key.yaml.j2`). Off renders no Job, ConfigMap or Secret, and
# `traefik-precheck` keeps only the ServiceAccount. It renders nothing either while
# `traefik_k8s_manage_crowdsec` is false.
#
# DECIDED: the Job and its fence peer land in separate revisions, the peer first. #6095 landed
# the `traefik-precheck` peer in netpol-baseline's `networkpolicy-crowdsec.yaml.j2` with this
# false, and the flag went true once the live `crowdsec` NetworkPolicy listed the peer. Both in
# one revision deadlock: the fence refuses the Job, the failed Job holds `traefik`, and
# netpol-baseline, which applies after `traefik`, never applies the peer. So a change that
# removes the peer sets this false first, and re-enabling takes the same two steps. The
# template's header has the full chain.
traefik_k8s_bouncer_key_precheck: true

# The file-provider token gate (livesync-gate-secret.yaml.j2) and the file provider that
# reads it. False for a cluster that runs neither CouchDB nor homelab-mcp, which is what
# every router in that file routes to.
#
# DECIDED: a flag, not generated staging tokens. Slice 2a recorded the opposite — that
# generated values would render harmlessly — and that was wrong twice. The routers name
# backends a staging cluster does not run, so it is the same class as CrowdSec rather than
# an inert Secret. And staging's secrets file is encrypted to daniel-server's key alone and
# holds exactly one key by design, so minting tokens into it is operator work on that host,
# not something a deploy can arrange.
traefik_k8s_manage_livesync_gate: true

# Empty is production; staging while iterating avoids the shared 5/week duplicate-cert limit.
# Switching back needs `rm` of acme.json in the PVC plus a redeploy.
traefik_k8s_acme_ca_server: ""

traefik_k8s_acme_storage: 128Mi

traefik_k8s_acme_storage_class: longhorn

# An expression so traefik_k8s_manage_acme gates the claim; dict(...), not a brace literal, because
# offline renders keep a whole-value expression's type only when it holds no brace.
k8s_claims: >-
  {{ [dict(name='traefik-acme', storage_class=traefik_k8s_acme_storage_class, size=traefik_k8s_acme_storage)] if traefik_k8s_manage_acme | bool else [] }}

# Quantities in stored form ("1", not "1.0"): else every `kubectl apply` reports configured.
traefik_k8s_cpu_limit: "1"
traefik_k8s_mem_limit: 512Mi
traefik_k8s_cpu_request: "100m"
traefik_k8s_mem_request: 192Mi

# The CrowdSec bouncer plugin and the log-tailing agent sidecar. The sidecar parses this pod's
# access log locally and ships signals to the in-cluster LAPI, so its collections are the
# HTTP-side subset; the syslog/authelia parsers stay with the agents that read those logs.
# The static config reads the plugin version from this var, so the annotation below is the
# only place Renovate learns it.
# renovate: datasource=github-releases depName=maxlerebourg/crowdsec-bouncer-traefik-plugin
traefik_k8s_bouncer_plugin_version: v1.8.2

# In-repo local plugin, no version to pin. The name and module must agree with the manifest's
# `import`; tests/k8s/test_traefik_cloudflare_realip.py checks all four.
traefik_k8s_realip_plugin_name: cloudflarerealip
traefik_k8s_realip_plugin_module: homelab/cloudflarerealip
traefik_k8s_agent_collections: >-
  crowdsecurity/traefik crowdsecurity/http-cve crowdsecurity/whitelist-good-actors
# jellyfin-whitelist drops the 403 on playback progress POSTs and the 404 on missing thumbnails.
traefik_k8s_agent_parsers: crowdsecurity/jellyfin-whitelist
traefik_k8s_agent_cpu_limit: "0.5"
traefik_k8s_agent_mem_limit: 256Mi
traefik_k8s_agent_cpu_request: 50m
traefik_k8s_agent_mem_request: 128Mi
# sizeLimit is a backstop: hitting it means the rotate sidecar has stopped working.
traefik_k8s_access_log_size: 1Gi

traefik_k8s_logrotate_image: alpine:3.24@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf
traefik_k8s_logrotate_cpu_limit: "100m"
traefik_k8s_logrotate_mem_limit: 64Mi
traefik_k8s_logrotate_cpu_request: "10m"
traefik_k8s_logrotate_mem_request: 16Mi

# Threshold plus 2 generations plus the live file is ~300Mi worst case, under the 1Gi cap.
traefik_k8s_access_log_rotate_mb: 100
traefik_k8s_access_log_keep: 2

# The ACME Secret is concatenated: dropping its name is how traefik_k8s_manage_acme reaches it.
# rbac.yaml is one file so a single apply moves the cluster and namespaced halves together.
manifests_files: >-
  {{ ['rbac.yaml', 'rbac-binding.yaml', 'static-config.yaml', 'dynamic.yaml',
      'deployment.yaml', 'service.yaml', 'metrics-service.yaml',
      'dashboard-ingressroute.yaml', 'origin-pull-secret.yaml']
     + (['edge-selfcheck-ingressroute.yaml'] if traefik_k8s_manage_crowdsec | bool else [])
     + (['cloudflare-realip-plugin.yaml'] if traefik_k8s_manage_crowdsec | bool else [])
     + (['crowdsec-secret.yaml'] if traefik_k8s_manage_crowdsec | bool else [])
     + (['cf-token-secret.yaml'] if traefik_k8s_manage_acme | bool else [])
     + (['livesync-gate-secret.yaml'] if traefik_k8s_manage_livesync_gate | bool else []) }}
