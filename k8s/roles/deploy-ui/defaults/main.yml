---
# Renovate stance: whether an image bump here may automerge. `promote` deploys what merges.
# Route-only role: it renders no Deployment of its own, only a
# selector-less Service, its EndpointSlice and the IngressRoute onto deploy-ui.service on
# daniel-box. There is no workload to wait
# on. But the page behind this route starts landings and clears the deployer's hold, so a bad
# route change (auth accidentally dropped, the EndpointSlice pointed elsewhere) hands that to
# whoever reaches it — the deploy plane itself, with no workload here to roll back.
k8s_autodeploy: false
k8s_autodeploy_reason: "renders no Deployment — route-only (Service + EndpointSlice + IngressRoute) in front of deploy-ui.service on daniel-box; a bad route change exposes a page that starts landings and clears the deployer's hold"

manifests_rollout: ''

# The Games panel's scale-only identity (templates/games-rbac.yaml.j2, ADR-0033). It lives in the
# workload namespace, not kube-system, so no `system:serviceaccounts:kube-system` group binding
# can widen it, and outside cluster-base, which a rebuilt cluster applies before `homelab` exists.
deploy_ui_games_sa_name: homelab-games

# games-rbac.yaml declares the identity's token Secret, and its name does not say so.
manifests_secret_files: ['games-rbac.yaml']
