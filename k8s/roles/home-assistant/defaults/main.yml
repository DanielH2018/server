---
home_assistant_k8s_image: lscr.io/linuxserver/homeassistant:2026.11.3-ls269@sha256:6d895a49608cfdd7957bd6634169b2ed0ccd8e119d60fb21ffc5c9ee2dafbc79

# The budget of the home-assistant-prepull Kustomization, whose Job pulls this role's images onto
# its node before the home-assistant Kustomization applies
# (scripts/renderer/renderer_lib/prepull.py). The Deployment is `Recreate`, so without it the old
# pod stops before the new pod's pull starts, and HA is down for the whole pull. With it, the old
# pod keeps serving while the image arrives. The pinned amd64 image is 720.85 MB compressed,
# and GHCR, which serves lscr.io, serves this homelab at 0.145-0.53 MB/s. 4500s, code-server's budget, covers a full re-pull down to 0.16 MB/s. The Job has no
# deadline, so a pull slower still costs that revision its verdict, the Job keeps pulling, and
# Flux applies home-assistant on a later retry. Only Flux reads it: the renderer adds the
# Kustomization for a published tag alone, so an Ansible deploy ignores it.
flux_prepull_timeout: 4500s

# Renovate stance: whether an image bump here may automerge. `promote` deploys what merges.
# Migrating state — the sharpest case in the fleet: strategy is Recreate and the config volume
# is a ReadWriteOnce `k8s_claims` entry below, so a bad image swap can migrate
# the volume before the gate observes a fault and then fail the rollback redeploy against data
# it can no longer read. The linuxserver -lsNN scheme makes a breaking bump read as a MINOR
# (2026.6.3 -> 2026.7.0), so semver-based auto-merge policy would not even flag it as risky.
# Flux's home-assistant-snapshot Job snapshots the claim below before each revision applies. A failed
# revision that changes home-assistant writes the stateful hold without a reset, and the operator
# reverts the claim through docs/volume-snapshot-drills.md, so a bad swap can be
# reverted instead of leaving the .storage device/entity registries unreadable by the old image.
k8s_autodeploy: true
k8s_autodeploy_reason: "migrating state — Recreate + RWO PVC, protected by the home-assistant-snapshot Job before each revision and an operator revert to it after a failed one; -lsNN versioning still hides a breaking bump as a MINOR. WEIGHED: a companion-app long-lived token minted after the snapshot is invalidated by a revert, forcing that device to re-auth"
k8s_autodeploy_snapshot_pvcs: [home-assistant-config]

# A multi-line key no Flux placeholder can carry, so it ships as a SOPS-encrypted manifest and a
# placeholder render leaves it out.
render_sops_manifests: [google-sa-secret.yaml]

# The LSIO image has no `install`; the config-install initContainer needs alpine.
home_assistant_k8s_init_image: alpine:3.24@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf

# Each list is the single source of what ships: `validate_ha_config.py` fails the prek hook when a
# list and its directory disagree.
# Listed rather than globbed because a glob that ships nothing surfaces only as missing automations.
# The root is not swept on install (the PVC's own files live there), so removing a name leaves the
# old copy until deleted by hand.
home_assistant_root_files:
  - configuration.yaml
  - customize.yaml
  - ui-lovelace.yaml
  - input_boolean.yaml
  - input_select.yaml
  - input_number.yaml
  - input_datetime.yaml
  - timer.yaml
  - thresholds.yaml
  - scenes.yaml
  - templates.yaml
  - rest.yaml
  - cast_quit_app.py

home_assistant_automation_files:
  - alerts.yaml
  - display.yaml
  - fan-and-air.yaml
  - lighting.yaml
  - presence.yaml
  - system.yaml
  - wake-and-sleep.yaml

home_assistant_template_files:
  - diagnostics.jinja
  - fan.jinja
  - lighting.jinja
  - notify.jinja
  - ventilation.jinja

home_assistant_script_files:
  - alerts.yaml
  - fan.yaml
  - lighting.yaml
  - test-harness.yaml
  - wake-and-sleep.yaml

# The working set runs 949Mi-1414Mi, so 2Gi leaves room for recorder growth. Don't trim the recorder
# further to buy headroom; purge_keep_days is already 7.
home_assistant_k8s_cpu_limit: "1"
home_assistant_k8s_mem_limit: 2Gi
home_assistant_k8s_cpu_request: "100m"
home_assistant_k8s_mem_request: 1472Mi

# `longhorn` (backed up): .storage carries the device/entity registries, the hardest-to-rebuild tree
# in the homelab.
home_assistant_k8s_claim: home-assistant-config
home_assistant_k8s_storage_class: longhorn
home_assistant_k8s_size: 4Gi

k8s_claims:
  - name: "{{ home_assistant_k8s_claim }}"
    storage_class: "{{ home_assistant_k8s_storage_class }}"
    size: "{{ home_assistant_k8s_size }}"

manifests_rollout: home-assistant
