---
# Source of truth, shipped verbatim in the role's ConfigMap; UI edits are not persistent.
# resource_template reads zone.home lat/long so coordinates stay in .storage, never in git.
- resource_template: >-
    https://air-quality-api.open-meteo.com/v1/air-quality?latitude={{ state_attr('zone.home','latitude') }}&longitude={{ state_attr('zone.home','longitude') }}&current=pm2_5,pm10,us_aqi,ozone&timezone=America%2FChicago
  scan_interval: 1800
  sensor:
    - name: "Outdoor PM2.5"
      unique_id: outdoor_pm2_5
      value_template: "{{ value_json.current.pm2_5 }}"
      unit_of_measurement: "µg/m³"
      device_class: pm25
      state_class: measurement
    - name: "Outdoor PM10"
      unique_id: outdoor_pm10
      value_template: "{{ value_json.current.pm10 }}"
      unit_of_measurement: "µg/m³"
      device_class: pm10
      state_class: measurement
    # US AQI and Ozone are informational by design: AQI already folds in ozone, and the window
    # advisor's smoke guard gates on PM2.5 and PM10.
    - name: "Outdoor US AQI"
      unique_id: outdoor_us_aqi
      value_template: "{{ value_json.current.us_aqi }}"
      device_class: aqi
      state_class: measurement
    - name: "Outdoor Ozone"
      unique_id: outdoor_ozone
      value_template: "{{ value_json.current.ozone }}"
      unit_of_measurement: "µg/m³"
      device_class: ozone
      state_class: measurement
