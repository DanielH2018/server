# Configure a default setup of Home Assistant (frontend, api, etc)
default_config:

# Entity friendly-name / icon overrides (templated — see customize.yaml).
homeassistant:
  customize: !include customize.yaml
  # Instance URLs so the Google Cast receiver on the Nest Hub Max can reach the HA frontend when
  # casting a dashboard (cast.show_lovelace_view). Resolved from HA's secrets.yaml, which the role
  # renders from SOPS (external_url = Cloudflare public host, internal_url = LAN/WireGuard host).
  # They live in secrets.yaml because this file is copied verbatim — the domain var cannot be
  # inlined here (the HA-config validator rejects Jinja markers in configuration.yaml).
  external_url: !secret external_url
  internal_url: !secret internal_url

# Frontend theme — a compact dark theme for the Bedroom dashboard. It is defined but NOT pinned
# to the view: the pin makes the cast receiver throw on every connect-back cycle.
# ui-lovelace.yaml says how to re-pin it. Selectable per user in the profile meanwhile. Static color values only
# (no HA Jinja), so it is safe in this verbatim-copied file; one `frontend:` key, compatible with
# default_config. Tune the hex values to taste.
frontend:
  themes:
    nest_dark:
      primary-color: "#2196f3"
      accent-color: "#ff9800"
      primary-background-color: "#0f0f0f"
      secondary-background-color: "#1a1a1a"
      card-background-color: "#1e1e1e"
      ha-card-background: "#1e1e1e"
      divider-color: "rgba(255, 255, 255, 0.10)"
      primary-text-color: "#e8e8e8"
      secondary-text-color: "#9aa0a6"
      text-primary-color: "#e8e8e8"
      disabled-text-color: "#6b6b6b"
      app-header-background-color: "#1e1e1e"
      app-header-text-color: "#e8e8e8"
      state-icon-color: "#c4c8cc"
      paper-item-icon-color: "#c4c8cc"

# Automations and scenes are git-managed; edits in the UI are not persistent (directory include is
# read-only there).
automation: !include_dir_merge_list automations/
scene: !include scenes.yaml
# Reusable scripts, one file per topic under scripts/ (same read-only-in-the-UI contract as
# automations): bedroom_apply_natural (the "natural lighting state" dispatcher used by
# Tap Dial button 4 + the morning reset) and its bedroom_set_natural_brightness helper.
script: !include_dir_merge_named scripts/

# Helper booleans: the override flags the automations coordinate on.
input_boolean: !include input_boolean.yaml

# Helper selects: the test-harness scenario and speed pickers.
input_select: !include input_select.yaml

# Helper numbers: the expected-level accumulators the manual-change detectors read.
input_number: !include input_number.yaml

# Helper datetimes: the HA heartbeat and the last-wake stamp.
input_datetime: !include input_datetime.yaml

# Timers: fan-dial mode.
timer: !include timer.yaml

# A full HA restart loads the integration; scripts target the exact entity_id
# switch.bedroom_adaptive_lighting_bedroom.
adaptive_lighting:
  - name: "Bedroom"
    lights:
      - light.bedroom_lights
    min_brightness: 1
    max_brightness: 100
    min_color_temp: 2200
    max_color_temp: 4500
    sleep_brightness: 1
    sleep_color_temp: 2200
    take_over_control: true
    detect_non_ha_changes: false
    transition: 45

# The 16 `threshold` binary sensors the bedroom_threshold_alert automation consumes.
binary_sensor: !include thresholds.yaml

# HA Jinja stays out of configuration.yaml, whose validator rejects a Jinja marker.
template: !include templates.yaml

# Integrates sensor.ups_power into kWh for the Energy dashboard; method left because load is a step
# function.
sensor:
  - platform: integration
    source: sensor.ups_power
    name: "UPS Energy"
    unique_id: ups_energy
    unit_prefix: k
    unit_time: h
    method: left
    max_sub_interval: "00:05:00"
    round: 3

# Copied (files/rest.yaml), not inline, because HA Jinja stays out of configuration.yaml.
rest: !include rest.yaml

# Quits the HA dashboard on the bedroom Hub over a Cast connection of its own, for
# bedroom_display_dismiss when HA's turn_off has not taken effect (files/cast_quit_app.py).
# A non-zero exit logs on homeassistant.components.shell_command, which ha_runtime_error_alert
# covers. The interpreter is the image's own, which carries pychromecast.
# DECIDED: end the loop from this repo with a second connection, not wait on an upstream
# pychromecast fix.
shell_command:
  bedroom_display_quit_app: /usr/local/bin/python3 /config/cast_quit_app.py 10.0.0.137

# Recorder hygiene: default_config enables the recorder with defaults (SQLite, keep 10 days, record
# everything); a top-level recorder: block customizes it without disabling default_config. Trim the
# highest-churn, lowest-value entities so the DB stays lean — faster history queries + faster startup
# recovery after the (benign) unclean-shutdown WAL replay. Chosen from the ACTUAL top-churn entities in
# home-assistant_v2.db; none are needed for restore or any automation (those read LIVE state, not
# history): sun.sun is recomputed on boot, pm0_3 is an unused fine-particle count (alerts + dashboard
# use pm2_5/pm10), linkquality/last_seen are Zigbee diagnostics, as are the UPS load/voltage
# readings. The DB's daily page churn drives B2 billable growth, since Longhorn ships changed
# blocks, hence purge_keep_days 7.
# Automations and scripts are excluded by ENTITY, and only the high-churn ones. An exclude drops every event whose data.entity_id matches, not only state history:
# the excluded six record no `automation_triggered` / `script_started` event, so the historical
# logbook cannot say which of them changed a light. Every other automation and script keeps that
# attribution. A domain exclude would drop it for all of them.
recorder:
  purge_keep_days: 7
  exclude:
    entities:
      - automation.ha_heartbeat                              # ~10,000 runs/week
      - automation.bedroom_wake_ramp                         # ~6,000
      - automation.bedroom_fan_temperature_control           # ~5,700
      - automation.bedroom_fallback_wake_no_watch_alarm      # ~4,500
      - automation.bedroom_color_tracking                    # ~1,000
      - script.bedroom_apply_fan                             # ~5,800
      - sun.sun
      - sensor.bedroom_airgradient_one_pm0_3
      # Heartbeat helper — rewritten every minute by the ha_heartbeat automation; the live
      # last_changed is all monitor-bridge reads, so its history is pure churn.
      - input_datetime.ha_heartbeat
      # Expected-value coordination helpers — written on every fan apply / 5-min color-track tick
      # (the mediator's DREO echo-suppression + the color tracker's auto baseline). Read LIVE only;
      # their history is pure churn. Safe to drop from history — they restore via restore_state,
      # which is independent of the recorder (the manual-fan-survives-restart logic is unaffected).
      - input_number.bedroom_fan_expected_level
      - input_number.bedroom_light_expected_color_temp
      # High-frequency UPS diagnostics are churn; sensor.ups_power/_energy read live state and stay
      # recorded.
      - sensor.apc_ups_load
      - sensor.apc_ups_input_voltage
    entity_globs:
      - sensor.*_linkquality
      - sensor.*_last_seen

# default_config enables system_log without fire_event, so automation.ha_runtime_error_alert would
# never trigger. Required.
system_log:
  fire_event: true

# Expose HA metrics to the homelab Prometheus at /api/prometheus (core integration, bearer-auth).
# Scraped by the `home-assistant` job in the prometheus role; metrics are prefixed `hass_`. No
# `filter` — HA's default curated metric set (tune later only if cardinality is noisy).
prometheus:
  namespace: hass

http:
  use_x_forwarded_for: true
  # Which X-Forwarded-For entries HA skips when it looks for the client. HA reads XFF only from a
  # peer in this list, then walks XFF right-to-left and takes the first entry NOT in it. So the
  # list must hold every address that can appear to the RIGHT of the client, not only the peer.
  # NOT the same as Traefik's forwardedHeaders.trustedIPs, which governs Traefik trusting ITS
  # upstream. MFA, not ip_ban, is the real gate (see below).
  #
  # What HA receives, per route (Traefik's templates/dynamic.yaml.j2, above `cloudflare-realip`):
  #   - home-assistant.<domain>, Cloudflare-proxied. Traefik's `cloudflare-realip` Middleware
  #     replaces XFF with CF-Connecting-IP, then Traefik appends the connection address, which is
  #     the Cloudflare edge. HA sees XFF `client, edge` from a Traefik pod.
  #   - home-assistant.local.<domain>, direct. Traefik discards any client-sent XFF and sends the
  #     connection address alone. HA sees XFF `client`. A WireGuard peer arrives as the Pi's LAN
  #     address, because wg-easy masquerades its peers.
  #   - In-cluster callers (monitor-bridge, homelab-mcp) and the exec probes send no XFF, so HA
  #     uses the peer address.
  #
  # The Cloudflare ranges are here so HA skips the edge and resolves `client`. With the pod CIDR
  # alone HA resolves the EDGE as the client: ip_ban could ban a
  # Cloudflare edge and lock out everyone routed through it, and no failed login would be
  # attributed to its real source. The ranges are literal because this file ships verbatim
  # (lookup('file')) and cannot template `cloudflare_ips`. Literal rather than a `!secret`
  # because nothing validates the CIDRs before HA reads them, and a malformed entry can
  # crash-loop HA. ENFORCED: tests/services/network/test_ha_trusted_proxies_cover_cloudflare.py
  # fails when this list and estate/vars.yml `cloudflare_ips` differ, or an entry is not a
  # strict network. When monitor-bridge's cloudflare_ips_drift tile goes red and all.yml is
  # updated, that test goes red until this list follows.
  #
  # DECIDED: the whole pod CIDR, not Traefik's pod IP. Traefik opens a pod-to-pod connection
  # (MetalLB VIP -> Traefik pod -> HA pod, never SNAT'd to a node LAN IP), so its source is a
  # pod IP that changes on every restart, and flannel cannot pin one. A node's /24 is no
  # narrower in practice, since other pods share it. The cost: a pod the HA NetworkPolicy
  # admits on 8123 (homelab-mcp, monitor-bridge) could forge XFF to dodge ip_ban or misattribute
  # a log line. It cannot bypass auth: there is no `trusted_networks` auth provider. /16 not a
  # /24: the pod CIDR grows a /24 per node.
  # The pod CIDR is `k3s_pod_cidr` in k8s/vars.yml, written out here
  # because this file ships verbatim and cannot template it.
  # test_ha_trusted_proxies_cover_cloudflare.py reads the variable, so the two stay equal.
  trusted_proxies:
    - 10.42.0.0/16
    # Cloudflare, kept equal to `cloudflare_ips` in estate/vars.yml.
    - 173.245.48.0/20
    - 103.21.244.0/22
    - 103.22.200.0/22
    - 103.31.4.0/22
    - 104.16.0.0/13
    - 104.24.0.0/14
    - 108.162.192.0/18
    - 131.0.72.0/22
    - 141.101.64.0/18
    - 162.158.0.0/15
    - 172.64.0.0/13
    - 188.114.96.0/20
    - 190.93.240.0/20
    - 197.234.240.0/22
    - 198.41.128.0/17
    - 2400:cb00::/32
    - 2606:4700::/32
    - 2803:f800::/32
    - 2405:b500::/32
    - 2405:8100::/32
    - 2a06:98c0::/29
    - 2c0f:f248::/32
  # Auto-ban after 5 failed logins (delete a line in config/ip_bans.yaml to unban); Authelia is off
  # here.
  ip_ban_enabled: true
  login_attempts_threshold: 5

# Uses `dashboards:`, not the deprecated top-level `mode: yaml` (removed in HA 2026.8).
# The landing dashboard has no config option: set it as default in the UI (persists in .storage).
lovelace:
  dashboards:
    lovelace:
      mode: yaml
      filename: ui-lovelace.yaml
      title: Bedroom
      icon: mdi:bed
      show_in_sidebar: true

# Exposure is curated: expose_by_default is off, so only entities with `expose: true` reach Google.
google_assistant:
  project_id: !secret google_assistant_project_id
  service_account: !include google_service_account.json
  report_state: true
  expose_by_default: false
  entity_config:
    light.bedroom_lights:
      name: Bedroom Lights
      expose: true
    fan.tower_fan:
      name: Bedroom Fan
      expose: true
    # Scenes are activate-only to Google ("Hey Google, activate Bedroom Bright").
    scene.bedroom_bright:
      name: Bedroom Bright
      expose: true
    scene.bedroom_relax:
      name: Bedroom Relax
      expose: true
    scene.bedroom_nightlight:
      name: Bedroom Nightlight
      expose: true

# Cast is config-entry/UI-only (a YAML `cast:` is rejected); add the Hub by IP under Known hosts.
# Runbook: SETUP.md §11.

logger:
  default: info
  logs:
    # Silenced on purpose: its bare Tracebacks trip monitor-bridge's log-burst arm; a real
    # cast-controller failure is silenced too.
    pychromecast.controllers: critical
  # HA drops a record whose message matches one of these regexes before any handler sees it, so
  # it reaches neither stdout (`kubectl logs`) nor system_log. A failed cast logs its
  # `cast_show_view` args on this logger, and they carry the cast user's refresh_token.
  # DECIDED: drop the record at the logger rather than close `kubectl logs` (operator,
  # 2026-11-12). The cost is the only record of a failed cast; `HomeAssistantCastHeartbeatStorm` is its replacement signal.
  filters:
    homeassistant.util.logging:
      - "refresh_token"
