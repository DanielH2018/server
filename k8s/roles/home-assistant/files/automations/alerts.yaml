---
# Threshold, sensor-offline and calibration alerts, and the notification action/hold plumbing. Conventions: see README.md in this directory.

# Unified threshold alert engine: ALL `threshold` binary-sensors in thresholds.yaml (air
# quality CO2/PM2.5/VOC/NOx + the SEVERE tier, battery FP300/Tap Dial/T1/window sensor, humidity
# high/low, Pixel Watch next-alarm overdue) feed this ONE automation. Hysteresis lives in the
# threshold sensors, so this just reacts to off<->on edges, anchored on off<->on (NOT unknown) so an HA restart while bad doesn't re-alert and an unavailable
# source can't false-alert (sensor-offline owns offline). The category is encoded in each trigger id
# (<category>_bad / <category>_ok); everything else is derived generically from the triggering
# sensor. Per-category differences live in the `cfg` map: title, `pulse` (light flash, air quality
# only), `watch` (wrist buzz), `pierce` (sound through DND — severe air quality only), `recovery`
# (whether to send a "back to normal" notice). All notify routes through script.bedroom_notify
# (DND/sleep-aware channel + importance + watch mirroring). Adding a metric = one threshold sensor +
# add it to its category's two trigger lists; a NEW category = two trigger blocks + one `cfg` entry.
- id: bedroom_threshold_alert
  alias: Bedroom threshold alert
  description: Notify when any air-quality/battery/humidity threshold crosses; recovery when it clears; pulse the lights for air quality only.
  mode: queued
  max: 10
  trigger:
    - platform: state
      entity_id:
        - binary_sensor.bedroom_co2_high
        - binary_sensor.bedroom_pm2_5_high
        - binary_sensor.bedroom_voc_high
        - binary_sensor.bedroom_nox_high
      from: "off"
      to: "on"
      for: "00:00:30"
      id: airquality_bad
    - platform: state
      entity_id:
        - binary_sensor.bedroom_co2_high
        - binary_sensor.bedroom_pm2_5_high
        - binary_sensor.bedroom_voc_high
        - binary_sensor.bedroom_nox_high
      from: "on"
      to: "off"
      for: "00:00:30"
      id: airquality_ok
    - platform: state
      entity_id:
        - binary_sensor.bedroom_co2_severe
        - binary_sensor.bedroom_pm2_5_severe
        - binary_sensor.bedroom_voc_severe
        - binary_sensor.bedroom_nox_severe
      from: "off"
      to: "on"
      for: "00:00:30"
      id: airqualitysevere_bad
    - platform: state
      entity_id:
        - binary_sensor.bedroom_co2_severe
        - binary_sensor.bedroom_pm2_5_severe
        - binary_sensor.bedroom_voc_severe
        - binary_sensor.bedroom_nox_severe
      from: "on"
      to: "off"
      for: "00:00:30"
      id: airqualitysevere_ok
    - platform: state
      entity_id:
        - binary_sensor.bedroom_fp300_battery_low
        - binary_sensor.bedroom_tap_dial_battery_low
        - binary_sensor.bedroom_t1_battery_low
        - binary_sensor.bedroom_window_sensor_battery_low
      from: "off"
      to: "on"
      for: "00:01:00"
      id: battery_bad
    - platform: state
      entity_id:
        - binary_sensor.bedroom_fp300_battery_low
        - binary_sensor.bedroom_tap_dial_battery_low
        - binary_sensor.bedroom_t1_battery_low
        - binary_sensor.bedroom_window_sensor_battery_low
      from: "on"
      to: "off"
      for: "00:01:00"
      id: battery_ok
    - platform: state
      entity_id:
        - binary_sensor.bedroom_humidity_high
        - binary_sensor.bedroom_humidity_low
      from: "off"
      to: "on"
      for: "00:05:00"
      id: humidity_bad
    - platform: state
      entity_id:
        - binary_sensor.bedroom_humidity_high
        - binary_sensor.bedroom_humidity_low
      from: "on"
      to: "off"
      for: "00:05:00"
      id: humidity_ok
    - platform: state
      entity_id:
        - binary_sensor.bedroom_temp_high
        - binary_sensor.bedroom_temp_low
      from: "off"
      to: "on"
      for: "00:05:00"
      id: temperature_bad
    - platform: state
      entity_id:
        - binary_sensor.bedroom_temp_high
        - binary_sensor.bedroom_temp_low
      from: "on"
      to: "off"
      for: "00:05:00"
      id: temperature_ok
    - platform: state
      entity_id:
        - binary_sensor.pixel_watch_next_alarm_overdue_high
      from: "off"
      to: "on"
      for: "00:01:00"
      id: watch_bad
    - platform: state
      entity_id:
        - binary_sensor.pixel_watch_next_alarm_overdue_high
      from: "on"
      to: "off"
      for: "00:01:00"
      id: watch_ok
    - platform: state
      entity_id:
        - binary_sensor.outdoor_pm2_5_high
      from: "off"
      to: "on"
      for: "00:00:30"
      id: airqualityoutdoor_bad
    - platform: state
      entity_id:
        - binary_sensor.outdoor_pm2_5_high
      from: "on"
      to: "off"
      for: "00:00:30"
      id: airqualityoutdoor_ok
    - platform: state
      entity_id:
        - binary_sensor.outdoor_pm2_5_severe
      from: "off"
      to: "on"
      for: "00:00:30"
      id: airqualityoutdoorsevere_bad
    - platform: state
      entity_id:
        - binary_sensor.outdoor_pm2_5_severe
      from: "on"
      to: "off"
      for: "00:00:30"
      id: airqualityoutdoorsevere_ok
  action:
    # The threshold sensor's `entity_id` attribute points at its SOURCE sensor; the label strips a
    # trailing " high"/" low".
    - variables:
        category: "{{ trigger.id.split('_')[0] }}"
        edge: "{{ trigger.id.split('_')[1] }}"
        src: "{{ trigger.to_state.attributes.entity_id }}"
        label: "{{ trigger.to_state.attributes.friendly_name | replace(' high', '') | replace(' low', '') | replace(' severe', '') }}"
        value: "{{ states(src) }}"
        unit: "{{ state_attr(src, 'unit_of_measurement') or '' }}"
        unit_sp: "{{ ' ' ~ unit if unit else '' }}"
        # Same tag for bad + recovery → the recovery replaces the alert on the phone.
        tag: "threshold_alert_{{ trigger.entity_id }}"
        # Per-category routing flags. `pulse` = brief red light flash (air quality only). `watch` =
        # also buzz the wrist (glanceable). `pierce` = sound even while quiet/DND (severe air quality
        # only — the can't-miss tier). `alert_class` = what the alert is about, which decides whether
        # it is held while away (notify_route in custom_templates/notify.jinja; temperature is
        # `safety` because it is the net for an AC or heating failure in an empty home). `recovery` =
        # send a "back to normal" notice (severe skips it; the moderate recovery covers it). All
        # notify goes through script.bedroom_notify (DND-aware).
        cfg: >-
          {{ {'airquality':       {'bad': '⚠️ Air quality', 'ok': '✅ Air quality', 'pulse': true,  'watch': true,  'pierce': false, 'alert_class': 'comfort', 'recovery': true},
              'airqualitysevere': {'bad': '🚨 Air quality HIGH', 'ok': '✅ Air quality', 'pulse': true, 'watch': true, 'pierce': true, 'alert_class': 'safety', 'recovery': false},
              'battery':          {'bad': '🔋 Battery low', 'ok': '🔋 Battery OK', 'pulse': false, 'watch': false, 'pierce': false, 'alert_class': 'upkeep', 'recovery': true},
              'humidity':         {'bad': '💧 Humidity', 'ok': '💧 Humidity OK', 'pulse': false, 'watch': false, 'pierce': false, 'alert_class': 'comfort', 'recovery': true},
              'temperature':      {'bad': '🌡️ Temperature', 'ok': '🌡️ Temperature OK', 'pulse': false, 'watch': true,  'pierce': false, 'alert_class': 'safety', 'recovery': true},
              'watch':            {'bad': '⌚ Pixel Watch not reporting', 'ok': '⌚ Pixel Watch reporting', 'pulse': false, 'watch': false, 'pierce': false, 'alert_class': 'alert_chain', 'recovery': true},
              'airqualityoutdoor':       {'bad': '🌫️ Outdoor air', 'ok': '✅ Outdoor air', 'pulse': false, 'watch': true,  'pierce': false, 'alert_class': 'comfort', 'recovery': true},
              'airqualityoutdoorsevere': {'bad': '🚨 Outdoor air HIGH', 'ok': '✅ Outdoor air', 'pulse': false, 'watch': true, 'pierce': true, 'alert_class': 'safety', 'recovery': false}}[category] }}
        boost_actions: "{{ [{'action': 'BEDROOM_BOOST_FAN', 'title': 'Boost fan'}] if category in ['airquality', 'airqualitysevere'] else [] }}"
        # A sudden spike can cross both _high and _severe within one 30s window and fire two alerts;
        # flag a moderate whose severe sensor is already on so it is suppressed.
        severe_shadowed: >-
          {{ category in ['airquality', 'airqualityoutdoor']
             and is_state(trigger.entity_id | replace('_high', '_severe'), 'on') }}
    - choose:
        - conditions: "{{ edge == 'bad' }}"
          sequence:
            # Gate INSIDE the bad branch, not via the choose condition, so a shadowed moderate
            # cannot fall through to the recovery default.
            - if: "{{ not severe_shadowed }}"
              then:
                # Pulse only when the lights are already on, so it never wakes you or fights
                # Adaptive Lighting.
                # Before the notify, which a renamed notify service aborts.
                - if: "{{ cfg.pulse and is_state('light.bedroom_lights', 'on') }}"
                  then:
                    - service: script.bedroom_alert_pulse
                - service: script.bedroom_notify
                  data:
                    title: "{{ cfg.bad }}"
                    message: "{{ label }} is {{ value }}{{ unit_sp }}"
                    tag: "{{ tag }}"
                    watch: "{{ cfg.watch }}"
                    pierce: "{{ cfg.pierce }}"
                    alert_class: "{{ cfg.alert_class }}"
                    actions: "{{ boost_actions }}"
      default:
        - if: "{{ cfg.recovery }}"
          then:
            - service: script.bedroom_notify
              data:
                title: "{{ cfg.ok }}"
                message: "{{ label }} back to normal ({{ value }}{{ unit_sp }})"
                tag: "{{ tag }}"
                recovery: true
                alert_class: "{{ cfg.alert_class }}"
          else:
            # Severe air quality sends no recovery push by design, but its pierced alert left a
            # persistent HIGH note; dismiss it directly so it does not linger.
            - service: persistent_notification.dismiss
              data:
                notification_id: "{{ tag }}"

# The 5-min `for:` rides out HA restarts and the ~120s deploy recreate. The FP300 (battery Zigbee)
# goes unavailable only after Z2M's 60 min passive timeout, and Z2M availability MUST be enabled for
# it.
# The Tap Dial (RDM002) is deliberately NOT watched: it is a passive input, so disuse trips Z2M's
# timeout as a false positive;
# a dead dial is caught by binary_sensor.bedroom_tap_dial_battery_low.
# Adding a watched device = add its entity to BOTH trigger lists below. A brief flap can emit a lone
# recovery with no prior alert; accepted.
- id: bedroom_sensor_offline_alert
  alias: Bedroom sensor offline alert
  description: Notify when a bedroom-automation dependency (AirGradient/FP300/fan) goes unavailable; recovery notice when it returns.
  mode: queued
  max: 10
  trigger:
    - platform: state
      entity_id:
        - sensor.bedroom_airgradient_one_carbon_dioxide
        - binary_sensor.aqara_fp300_presence
        - fan.tower_fan
      to: "unavailable"
      for: "00:05:00"
      id: offline
    - platform: state
      entity_id:
        - sensor.bedroom_airgradient_one_carbon_dioxide
        - binary_sensor.aqara_fp300_presence
        - fan.tower_fan
      from: "unavailable"
      id: recovery
  action:
    # friendly_name is EMPTY while an entity is unavailable, so take the name from the AVAILABLE
    # side: to_state for recovery, from_state for offline.
    - variables:
        name: >-
          {{ (trigger.to_state.attributes.friendly_name
              if (trigger.to_state is not none and trigger.to_state.attributes.friendly_name is defined)
              else trigger.from_state.attributes.friendly_name)
             | default(trigger.entity_id, true) }}
        # Same tag for offline + recovery → the recovery replaces the alert on the phone.
        tag: "sensor_offline_{{ trigger.entity_id }}"
    - choose:
        # A dead dependency buzzes the watch but is routine for DND: an overnight offline sensor is
        # not worth waking for.
        - conditions: "{{ trigger.id == 'offline' }}"
          sequence:
            - service: script.bedroom_notify
              data:
                title: "⚠️ Sensor offline"
                message: "{{ name }} is offline (no data)"
                tag: "{{ tag }}"
                watch: true
                alert_class: alert_chain
      # from:"unavailable" edges only, so the remaining case (id == 'recovery') is the default.
      # Only notify recovery if the device was actually unavailable >= 5 min (the same threshold the
      # offline alert needs) — otherwise the unavailable→available blip on every HA/Z2M restart would
      # send a spurious "back online" with no preceding alert.
      default:
        - if: >-
            {{ trigger.from_state is not none and trigger.to_state is not none
               and (as_timestamp(trigger.to_state.last_changed) - as_timestamp(trigger.from_state.last_changed)) >= 300 }}
          then:
            - service: script.bedroom_notify
              data:
                title: "✅ Sensor back online"
                message: "{{ name }} is reporting again"
                tag: "{{ tag }}"
                recovery: true
                alert_class: alert_chain

# An alert that recovered while away was removed by its recovery, so it never appears in the digest.
- id: bedroom_flush_held_notifications
  alias: Bedroom flush held notifications
  description: On arrival home, deliver any still-unresolved away-held alerts as one digest, then clear them.
  mode: single
  trigger:
    - platform: state
      entity_id: person.daniel
      to: "home"
  condition:
    - condition: template
      value_template: >-
        {{ state_attr('sensor.bedroom_held_alerts', 'held') is mapping
           and state_attr('sensor.bedroom_held_alerts', 'held') | count > 0 }}
  action:
    - variables:
        held: "{{ state_attr('sensor.bedroom_held_alerts', 'held') }}"
        body: "{% from 'notify.jinja' import held_digest %}{{ held_digest(held) }}"
    # No continue_on_error: a failed push aborts before the `flushed` event, so the alerts stay held
    # for the next arrival.
    # ha_runtime_error_alert does not exclude this logger, so the failure raises its own alert.
    - service: notify.mobile_app_pixel_9_pro
      data:
        title: "🏠 While you were out ({{ held | count }})"
        message: "{{ body }}"
        data:
          tag: held_digest
    # Removes the delivered tags only, so an alert held after the read above stays for next time.
    - event: bedroom_held_alert
      event_data:
        action: flushed
        tags: "{{ held.keys() | list }}"

# Add a new button = add its case here + pass it in the actions list.
- id: bedroom_notification_action
  alias: Bedroom notification action
  description: Dispatch taps on actionable notification buttons (mobile_app_notification_action).
  mode: queued
  max: 10
  trigger:
    - platform: event
      event_type: mobile_app_notification_action
  action:
    - choose:
        # Boost fan engages the manual override (clear via Tap Dial button 4 or the morning reset);
        # it moves air, it does not lower CO2.
        - conditions: "{{ trigger.event.data.action == 'BEDROOM_BOOST_FAN' }}"
          sequence:
            - service: script.bedroom_fan_set
              data:
                reason: "boost"
        - conditions: "{{ trigger.event.data.action == 'BEDROOM_START_BEDTIME' }}"
          sequence:
            - service: script.bedroom_bedtime
        # Calls the apply_* scripts directly so they ignore the home-gates: the tracker is wrong
        # when you tap.
        - conditions: "{{ trigger.event.data.action == 'BEDROOM_AWAY_TURN_ON' }}"
          sequence:
            - service: script.bedroom_lights_set
              data:
                reason: "natural"
            - service: script.bedroom_fan_set
              data:
                reason: "auto"
            # Clear the "Left on" persistent note; the bedroom_away tag has no recovery path of its
            # own.
            - service: persistent_notification.dismiss
              data:
                notification_id: bedroom_away

# Triggers on the EDGE so a GPS glitch while present cannot fire it. The away guard requires >5 min
# not-home, so a brief glitch cannot alarm.
# watch + pierce: a security event reaches you even in DND.
- id: bedroom_unexpected_occupancy
  alias: Bedroom unexpected occupancy
  description: Alert (watch + pierce) when the bedroom is occupied while you're away.
  mode: single
  trigger:
    - platform: state
      entity_id: binary_sensor.aqara_fp300_presence
      from: "off"
      to: "on"
      for: "00:00:30"
  condition:
    - condition: template
      value_template: >-
        {{ states('person.daniel') not in ['home', 'unknown', 'unavailable']
           and (now() - states.person.daniel.last_changed).total_seconds() > 300 }}
  action:
    - service: script.bedroom_notify
      data:
        title: "🚨 Bedroom occupied"
        message: "Motion detected in the bedroom while you're away."
        tag: unexpected_occupancy
        alert_class: safety
        watch: true
        pierce: true

# NOTIFY-ONLY with an air-out-FIRST instruction: calibration sets the CURRENT reading as the 400 ppm
# baseline, so it must be done outdoors.
# No one-tap button: an accidental tap on stale indoor air would lock in a wrong baseline. Daily
# trigger + date condition (1st of Jan/Apr/Jul/Oct).
- id: bedroom_co2_calibration_reminder
  alias: Bedroom CO2 calibration reminder
  description: Quarterly nudge to recalibrate the AirGradient CO2 sensor against the outdoor ~400 ppm baseline.
  mode: single
  trigger:
    - platform: time
      at: "10:00:00"
  condition:
    - condition: template
      value_template: "{{ now().day == 1 and now().month in [1, 4, 7, 10] }}"
  action:
    - service: script.bedroom_notify
      data:
        title: "🌬️ CO₂ sensor calibration due"
        message: >-
          Air the room out (~15 min, window open) to reach the outdoor ~400 ppm baseline, then press
          the AirGradient "Calibrate CO₂" button (Settings → Devices → AirGradient ONE). Current
          reading: {{ states('sensor.bedroom_airgradient_one_carbon_dioxide') }} ppm.
        tag: co2_calibration_reminder
        alert_class: upkeep
