---
# The morning wake sequence and the bedtime prompt/sleep-mode entry. Conventions: see README.md in this directory.

# `alarm` runs the wake ramp; `fallback` (09:00) clears overrides on a no-alarm day.
- id: bedroom_morning_reset
  alias: Bedroom morning reset and wake
  description: At the alarm (wake ramp) + a 09:00 fallback (hygiene) — clear overnight overrides; gently wake if home.
  mode: single
  trigger:
    - platform: time
      at: sensor.bedroom_wake_start
      id: alarm
    - platform: time
      at: "09:00:00"
      id: fallback
  action:
    # Read the night's state BEFORE clearing it — script.bedroom_clear_overrides turns
    # bedroom_sleep_mode off, so the fallback branch below has no way to ask afterwards whether
    # the night was still running. HA evaluates a `variables:` step when it reaches it, so this
    # step's position is the whole mechanism.
    - variables:
        was_sleeping: "{{ is_state('input_boolean.bedroom_sleep_mode', 'on') }}"
        light_on: "{{ is_state('light.bedroom_lights', 'on') }}"
    # Daily hygiene (BOTH triggers): clear every overnight override (3 booleans + AL sleep) via the
    # shared script so sleep state / manual-off can't persist into the day. Single source of truth
    # with the test-harness reset (script.bedroom_clear_overrides).
    - service: script.bedroom_clear_overrides
    - if: "{{ is_state('person.daniel', 'home') }}"
      then:
        - service: script.bedroom_apply_fan
    # Gate on person.daniel, not the FP300: it drops a motionless sleeper, so presence can read off
    # when you need waking.
    - if: "{{ trigger.id == 'alarm' and is_state('person.daniel', 'home') }}"
      then:
        # Record the wake so bedroom_fallback_wake knows today is handled (never double-wake).
        - service: input_datetime.set_datetime
          target:
            entity_id: input_datetime.bedroom_last_wake
          data:
            datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
        - service: script.bedroom_lights_set
          data:
            reason: "natural"

    # Fallback: a no-alarm morning leaves the amber nightlight; `was_sleeping` keeps a real wake
    # from being clobbered.
    - if: "{{ trigger.id == 'fallback' and was_sleeping and light_on }}"
      then:
        - service: script.bedroom_lights_set
          data:
            reason: "natural"

# Stateless ticks resume after an HA restart. At window end (elapsed 45..46) hand back to AL;
# wake math lives in lighting.jinja.
- id: bedroom_wake_ramp
  alias: Bedroom wake ramp
  description: Drive the sunrise ramp once a minute through the wake window; hand back to AL at window end.
  mode: single
  trace:
    stored_traces: 90
  trigger:
    - platform: time_pattern
      minutes: "/1"
  condition:
    - condition: state
      entity_id: person.daniel
      state: "home"
    - condition: state
      entity_id: input_boolean.bedroom_manual_off
      state: "off"
  action:
    - variables:
        ws: "{{ states('sensor.bedroom_wake_start') }}"
        elapsed: "{{ (now() - as_datetime(ws)).total_seconds() / 60 if ws not in ['unknown', 'unavailable'] else -1 }}"
        in_window: "{% from 'lighting.jinja' import in_wake_window %}{{ in_wake_window(elapsed) | bool }}"
        # AL lists member bulbs in manual_control, not the group id: test the list length, never
        # membership.
        al_still_manual: "{{ (state_attr('switch.bedroom_adaptive_lighting_bedroom', 'manual_control') or []) | count > 0 }}"
        release_due: "{% from 'lighting.jinja' import in_wake_release_window %}{{ in_wake_release_window(elapsed) | bool and al_still_manual }}"
    - choose:
        - conditions: "{{ in_window }}"
          sequence:
            - service: script.bedroom_lights_set
              data:
                reason: "wake"
        # Past the ramp (catch-up window [45,90) min) AND AL still paused -> hand the room back to
        # Adaptive Lighting for the day: release manual control + apply so AL drives the natural
        # daylight brightness/color curve. The ramp has reached 100% by now, so AL takes over at full
        # brightness (its 45s transition then settles to the daytime target). NOT reason:"natural"
        # (ambient-fill): at window-end the lights are on at ~100%, so natural_brightness would read
        # the lights-DOMINATED FP300 illuminance (violating its "read while OFF" precondition) and
        # floor the room to ~11%. turn_on_lights:false so a mid-ramp manual-off is never re-lit.
        # release_due is a BOUNDED + idempotent gate (see in_wake_release_window): it self-heals on a
        # later tick if an HA restart/deploy or a gated-off minute spans the window end, and the
        # al_still_manual guard makes a repeat run a no-op so it can't stomp a later daytime manual pick.
        # DECIDED: the release does NOT arm input_number.bedroom_light_expected_color_temp.
        # Handing the room back leaves the tracker holding the ramp's warm 2200K while AL applies its
        # sun-curve color, so bedroom_color_track's ~150K "still auto" check fails and tracking parks.
        # That is correct here. bedroom_color_track exists only to drift the color while AL is TAKEN
        # OVER; once released, AL drives the color itself. Arming the tracker would put color_track
        # back to writing color on top of AL, and an explicit light.turn_on is exactly what marks the
        # group manually controlled again (AL take_over) — re-pausing the AL this branch just
        # released. Arming once would not even hold: AL keeps moving its color along the sun curve
        # and nothing re-arms the tracker as it drifts. Every writer that takes AL over again arms on
        # the way in (bedroom_set_natural_brightness, bedroom_apply_wake, and bedroom_lights_set's
        # wake_fallback branch), so the tracker is never both stale and needed. The Tap Dial writes
        # the lights directly and is meant to read as manual.
        - conditions: "{{ release_due }}"
          sequence:
            - service: adaptive_lighting.set_manual_control
              data:
                entity_id: switch.bedroom_adaptive_lighting_bedroom
                manual_control: false
            - service: adaptive_lighting.apply
              data:
                entity_id: switch.bedroom_adaptive_lighting_bedroom
                turn_on_lights: false

# Safety net when the watch alarm lags or is absent; defers to a real wake so the ramps never both
# drive lights.
- id: bedroom_fallback_wake
  alias: Bedroom fallback wake (no watch alarm)
  description: Weekday 06:00 safety-net wake ramp (stateless per-minute) when the watch alarm didn't arm the real wake.
  mode: single
  trace:
    stored_traces: 90
  trigger:
    - platform: time_pattern
      minutes: "/1"
  condition:
    - condition: state
      entity_id: person.daniel
      state: "home"
    # Mon-Fri only (weekday() 0=Mon .. 4=Fri).
    - condition: template
      value_template: "{{ now().weekday() < 5 }}"
  action:
    - variables:
        ws: "{{ states('sensor.bedroom_wake_start') }}"
        # A today-dated watch alarm (even post-fire, under wake_start's 2h grace) defers to
        # bedroom_wake_ramp.
        no_real_wake: >-
          {{ ws in ['unknown', 'unavailable'] or (as_datetime(ws) | as_local).date() != now().date() }}
        lw: "{{ states('input_datetime.bedroom_last_wake') }}"
        wake_today: >-
          {{ lw not in ['unknown', 'unavailable', ''] and as_datetime(lw).date() == now().date() }}
        # Clock window for the 06:00 fallback, [06:00, 06:45). Used ONLY to START the ramp (stamp the
        # anchor once); after that, elapsed since the anchor drives the frames so a late start / an HA
        # restart resumes cleanly regardless of the clock.
        in_start_window: "{{ now().hour == 6 and now().minute < 45 }}"
        # Epoch `timestamp` avoids mixing now()'s aware datetime with the naive state; -1 until an
        # anchor is stamped today.
        elapsed: >-
          {{ (now().timestamp() - state_attr('input_datetime.bedroom_last_wake', 'timestamp')) / 60
             if wake_today else -1 }}
        in_window: "{% from 'lighting.jinja' import in_wake_window %}{{ in_wake_window(elapsed) | bool }}"
        target: "{% from 'lighting.jinja' import wake_brightness %}{{ wake_brightness(elapsed) | int }}"
        al_still_manual: "{{ (state_attr('switch.bedroom_adaptive_lighting_bedroom', 'manual_control') or []) | count > 0 }}"
        release_due: "{% from 'lighting.jinja' import in_wake_release_window %}{{ in_wake_release_window(elapsed) | bool and al_still_manual }}"
    - choose:
        # START: stamp the anchor, clear overrides, apply the first frame, then greet LAST (a
        # renamed notify aborts what follows).
        - conditions:
            - "{{ no_real_wake }}"
            - "{{ in_start_window }}"
            - "{{ not wake_today }}"
          sequence:
            - service: input_datetime.set_datetime
              target:
                entity_id: input_datetime.bedroom_last_wake
              data:
                datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
            - service: script.bedroom_clear_overrides
            - service: script.bedroom_apply_fan
            - service: script.bedroom_lights_set
              data:
                reason: "wake_fallback"
                brightness_pct: >-
                  {% from 'lighting.jinja' import wake_brightness %}{{ wake_brightness(0) | int }}
            - service: script.bedroom_notify
              data:
                title: "☀️ Good morning"
                message: "Wake ramp starting on the 06:00 fallback (no watch alarm detected)."
                tag: sleep_morning
                alert_class: comfort
        # RAMP: inside the 45-min window on a stamped fallback morning -> apply ONE frame via the
        # sanctioned single writer. A mid-window HA restart resumes HERE on the next tick, because
        # elapsed is derived from the persisted anchor, not an in-process loop.
        # DECIDED: the fallback overrides manual_off like the alarm reset does, so START runs with it
        # on and clears it; only RAMP and RELEASE honour it, so a mid-ramp "off" still stops the
        # ramp.
        - conditions:
            - "{{ no_real_wake }}"
            - "{{ in_window }}"
            - "{{ is_state('input_boolean.bedroom_manual_off', 'off') }}"
          sequence:
            - service: script.bedroom_lights_set
              data:
                reason: "wake_fallback"
                brightness_pct: "{{ target }}"
        # RELEASE (catch-up window [45,90) min AND AL still paused): hand the room back to Adaptive
        # Lighting for the day. Bounded + idempotent (al_still_manual makes a repeat run a no-op),
        # exactly like bedroom_wake_ramp's release_due branch. The ramp reached 100% by window end, so
        # AL takes over at full brightness with no upward pop. person-home is a top-level condition, so
        # leaving mid-ramp stops the automation (no re-light of an empty room, no stale good-morning).
        # DECIDED: no tracker arm on release — same reasoning as bedroom_wake_ramp's
        # `DECIDED: the release does NOT arm input_number.bedroom_light_expected_color_temp`
        # in this file.
        - conditions:
            - "{{ no_real_wake }}"
            - "{{ release_due }}"
            - "{{ is_state('input_boolean.bedroom_manual_off', 'off') }}"
          sequence:
            - service: adaptive_lighting.set_manual_control
              data:
                entity_id: switch.bedroom_adaptive_lighting_bedroom
                manual_control: false
            - service: adaptive_lighting.apply
              data:
                entity_id: switch.bedroom_adaptive_lighting_bedroom
                turn_on_lights: false

# Only a person's toggle (user_id set) reaches the mediator; programmatic callers re-apply the fan
# themselves.
- id: bedroom_sleep_mode_fan
  alias: Bedroom sleep mode fan reapply
  description: Re-apply the fan (via the bedroom_fan_set mediator) when sleep_mode is toggled directly, so its level cap engages/releases at once.
  mode: single
  trigger:
    - platform: state
      entity_id: input_boolean.bedroom_sleep_mode
      from: "off"
      to: "on"
    - platform: state
      entity_id: input_boolean.bedroom_sleep_mode
      from: "on"
      to: "off"
  condition:
    - condition: template
      value_template: "{{ trigger.to_state.context.user_id is not none }}"
    - condition: state
      entity_id: input_boolean.bedroom_fan_manual
      state: "off"
    - condition: state
      entity_id: person.daniel
      state: "home"
  action:
    - service: script.bedroom_fan_set
      data:
        reason: "auto"

# Gated on home so it never sets up sleep or turns the fan on while away. Charging is deliberately
# NOT a trigger.
- id: bedroom_bedtime
  alias: Bedroom bedtime
  description: When phone Bedtime mode turns on while home, run the bedtime/sleep routine.
  mode: single
  trigger:
    - platform: state
      entity_id: binary_sensor.pixel_watch_3_bedtime_mode
      to: "on"
  condition:
    - condition: state
      entity_id: person.daniel
      state: "home"
  action:
    - service: script.bedroom_bedtime

# Bedtime prompt: at wind-down time (alarm − 8h, or the 22:30 fallback on no-alarm nights — see
# sensor.bedroom_winddown_start), if you're in the bedroom and haven't started bedtime, send a nudge
# with a "Start now" button (-> BEDROOM_START_BEDTIME -> script.bedroom_bedtime). Gated on present +
# not already in sleep mode + home, so it only nudges when you're around and haven't gone to bed.
- id: bedroom_bedtime_prompt
  alias: Bedroom bedtime prompt
  description: At wind-down time (alarm − 8h, or 22:30 fallback on no-alarm nights), if present and not yet in sleep mode, prompt to start the bedtime routine.
  mode: single
  trigger:
    - platform: time
      at: sensor.bedroom_winddown_start
      id: dynamic
    - platform: time
      at: "22:30:00"
      id: fallback
  condition:
    - condition: state
      entity_id: binary_sensor.aqara_fp300_presence
      state: "on"
    - condition: state
      entity_id: input_boolean.bedroom_sleep_mode
      state: "off"
    - condition: state
      entity_id: person.daniel
      state: "home"
    # The 22:30 fallback fires when no live dynamic prompt exists tonight (winddown unavailable or
    # already past).
    - condition: template
      value_template: >-
        {{ trigger.id == 'dynamic'
           or states('sensor.bedroom_winddown_start') in ['unknown', 'unavailable']
           or as_datetime(states('sensor.bedroom_winddown_start')) < now() }}
  action:
    - service: script.bedroom_notify
      data:
        title: "🌙 Ready for bed?"
        message: "Tap to start the bedtime routine."
        tag: bedtime_prompt
        alert_class: comfort
        actions:
          - action: BEDROOM_START_BEDTIME
            title: Start now
