---
# The bedroom display's dashboard/ambient switching. Conventions: see README.md in this directory.

# ── Nest Hub Max dashboard (cast to media_player.bedroom_display) ─────────────────────────────────
# Keep the Bedroom Lovelace view up on the Hub while the room is lit + awake; let it fall back to the
# Hub's ambient screen when dark or in sleep mode. Cast itself is config-entry/UI-only (known_hosts =
# 10.0.0.137); these just drive cast.show_lovelace_view / media_player.turn_off. Lux thresholds
# (show > 60, dark < 50; FP300 reads ~553 lights-on / ~48 lights-off) are STARTING POINTS — tune here.
- id: bedroom_display_show
  alias: Bedroom display keep dashboard up
  description: >-
    Re-cast the Bedroom Lovelace view to media_player.bedroom_display while the room is lit
    (FP300 illuminance > 60) and not in sleep mode. Only casts when the Hub is NOT already playing
    something (state != playing) so it never re-casts an already-shown dashboard (no flicker) nor
    overrides user-started media; re-establishes after an HA restart or when the Hub returns to its
    ambient screen. Holds off for 15 minutes after bedroom_display_dismiss runs, so daylight
    hovering around both lux thresholds cannot cast and dismiss in turn.
  mode: single
  trigger:
    - platform: homeassistant
      event: start
    - platform: time_pattern
      minutes: "/10"
    - platform: state
      entity_id: media_player.bedroom_display
      to:
        - idle
        - "off"
        - standby
      # A Cast socket reconnect sets the Hub to idle for a moment, and without a hold each one
      # re-cast into the same blocked socket window (2026-11-12, #8204).
      for: "00:01:00"
    - platform: state
      entity_id: input_boolean.bedroom_sleep_mode
      to: "off"
    - platform: numeric_state
      entity_id: sensor.aqara_fp300_illuminance
      above: 60
      for: "00:00:30"
  condition:
    # Only keep the dashboard up while you're actually home — otherwise a bright away-day (sun
    # pushes FP300 illuminance > 60 in an empty room) re-casts to the Hub every 10 min for nobody.
    # Mirrors the person-home gate every other bedroom on-path carries.
    - condition: state
      entity_id: person.daniel
      state: "home"
    - condition: state
      entity_id: input_boolean.bedroom_sleep_mode
      state: "off"
    - condition: numeric_state
      entity_id: sensor.aqara_fp300_illuminance
      above: 60
    # Lights-off daylight swung the FP300 between 40 and 87 for 12 minutes and met both 30 s holds
    # three times over (2026-11-12, #8411); the 50/60 gap is narrower than that noise.
    - condition: template
      value_template: >-
        {% set dismissed = state_attr('automation.bedroom_display_dismiss', 'last_triggered') %}
        {{ dismissed is none or now() - dismissed > timedelta(minutes=15) }}
    # The Hub must actually be reachable. When it's unavailable/unknown (powered off, off the
    # network, or its cast connection to HA is down), every re-cast fails — flooding the log with
    # pychromecast NotConnected errors on each attempt. Gate those states out so we only (re)cast
    # a Hub that can receive it.
    - condition: not
      conditions:
        - condition: state
          entity_id: media_player.bedroom_display
          state:
            - unavailable
            - unknown
    # Only (re)cast when the Hub isn't actively showing something — avoids flicker on an already-cast
    # dashboard and never clobbers user-started media (both report media_player state 'playing').
    - condition: not
      conditions:
        - condition: state
          entity_id: media_player.bedroom_display
          state: playing
  action:
    - service: cast.show_lovelace_view
      data:
        entity_id: media_player.bedroom_display
        dashboard_path: lovelace
        view_path: bedroom

- id: bedroom_display_dismiss
  alias: Bedroom display go ambient when dark or sleeping
  description: >-
    Send the Hub back to its ambient screen when the room goes dark (FP300 illuminance < 50) or
    sleep mode turns on, and re-check every 5 minutes until it leaves the HA dashboard
    (app_name == "Home Assistant Lovelace"). User-started media is never interrupted: the
    condition and the fallback script each act only on the dashboard app.
  mode: single
  max_exceeded: silent
  trigger:
    - platform: numeric_state
      entity_id: sensor.aqara_fp300_illuminance
      below: 50
      for: "00:00:30"
    - platform: state
      entity_id: input_boolean.bedroom_sleep_mode
      to: "on"
    # The Cast connect-back loop can make turn_off fail for hours (#8201), so retry until it lands.
    - platform: time_pattern
      minutes: "/5"
  condition:
    - condition: state
      entity_id: media_player.bedroom_display
      attribute: app_name
      state: "Home Assistant Lovelace"
    - condition: or
      conditions:
        - condition: numeric_state
          entity_id: sensor.aqara_fp300_illuminance
          below: 50
        - condition: state
          entity_id: input_boolean.bedroom_sleep_mode
          state: "on"
  action:
    # Fails while the loop holds HA's Cast socket thread; the fallback below covers that case.
    - service: media_player.turn_off
      continue_on_error: true
      target:
        entity_id: media_player.bedroom_display
    - wait_template: >-
        {{ not is_state_attr('media_player.bedroom_display', 'app_name', 'Home Assistant Lovelace') }}
      timeout: "00:00:15"
    # A Cast connection of its own, which the loop cannot block. It re-reads the running app
    # itself, so HA's stale view cannot make it stop user media.
    - if: "{{ not wait.completed }}"
      then:
        - service: shell_command.bedroom_display_quit_app
