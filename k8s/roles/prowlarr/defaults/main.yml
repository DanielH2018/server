---
prowlarr_k8s_image: lscr.io/linuxserver/prowlarr:3.1.0.5799-ls170@sha256:2806c9b763810589c42157730d547c293639e55c7610e9f5069314854639ec48

# Renovate stance: whether an image bump here may automerge. `promote` deploys what merges.
# Migrating state — strategy is Recreate and the config volume (indexer definitions + API keys)
# comes from k8s_claims below (hardcoded ReadWriteOnce). This role renders TWO
# Deployments (prowlarr + flaresolverr) and Flux gates both through the Kustomization's wait,
# so gatedness is not the issue; the PVC/Recreate shape is. The linuxserver -lsNN scheme also
# hides a breaking bump as a routine patch bump.
# Flux's prowlarr-snapshot Job snapshots the claim below before each revision applies. A failed
# revision that changes prowlarr writes the stateful hold without a reset, and the operator
# reverts the claim through docs/volume-snapshot-drills.md, so a bad swap can be
# reverted instead of leaving the indexer definitions and API keys unreadable by the old image.
k8s_autodeploy: true
k8s_autodeploy_reason: "migrating state — Recreate + RWO PVC, protected by the prowlarr-snapshot Job before each revision and an operator revert to it after a failed one; -lsNN versioning still hides a breaking bump. NOT about gatedness: both rendered Deployments (prowlarr + flaresolverr) gate correctly. WEIGHED: prowlarr pushes indexer config to the *arr apps, which store Prowlarr-assigned indexer IDs back; a revert desyncs those IDs until the next reconciliation or a manual re-sync. UNATTENDED RECOVERY DOES NOT APPLY HERE: sonarr, radarr, bazarr and jellyfin all self-heal a revert (rescan / re-download / existence check), so an operator reading the rollback alert for prowlarr should expect to re-sync indexers by hand"
# Only the config claim; flaresolverr uses an emptyDir. The snapshot is auto-deploy's recovery
# point.
k8s_autodeploy_snapshot_pvcs: [prowlarr-config]

# 84 M. Holds the indexer definitions and their API keys.
prowlarr_k8s_claim: prowlarr-config
# `longhorn`, backed up: `longhorn-nobackup` would leave a single frozen restore point.
prowlarr_k8s_storage_class: longhorn
prowlarr_k8s_size: 2Gi

# The rollout budget for BOTH Deployments, declared once. Read as Flux's health-check
# `timeout`, by the drain's `rollout status --timeout` and by
# `progressDeadlineSeconds` in both deployment templates. The deadline has to move with the
# timeout: at the 600s Kubernetes default, `rollout status` fails on ProgressDeadlineExceeded
# whatever `--timeout` says (the valheim role measured exactly that).
# Sized from a cold pull: daniel-server pulls the 292 MB flaresolverr digest in 8m53.87s and
# prowlarr's own 80 MB image in 3m40.96s, both uncached. The 300s default fails the deploy after
# its apply while the old flaresolverr pod serves throughout. That pod starts 535s after it is
# scheduled.
# DECIDED: 780s, which leaves 245s over the one measured pull. A cached image rolls in seconds,
# so the budget costs time only on a real hang.
# The literal is `manifests_rollout_timeout` because the renderer reads a role's Flux
# Kustomization `timeout` only from a literal role default (`role_defaults` in
# scripts/lib/k8s_roles.py); as an include var it would render Flux's 600s default.
manifests_rollout_timeout: 780s
prowlarr_k8s_rollout_timeout: "{{ manifests_rollout_timeout }}"

# The app-keys seed tests each app with its stored key, so verify waits on these rolled pods.
flux_verify_after:
  - lidarr
  - radarr
  - sonarr

# ── the app-keys seed (templates/app-keys-cronjob.yaml.j2) ──────────────────────────────────
# The same python:3.15-alpine digest flux_job_image pins; Renovate moves both in one PR.
prowlarr_k8s_app_keys_image: python:3.15-alpine@sha256:0f9552bb28711333da16915ec146f5e6bb44a7fdac9ced15dc17c2e0206346dd
# Hourly: Prowlarr pages (ApplicationLongTermStatusCheck) only after 6h of failed syncs, so a stale
# key is rewritten before it pages.
prowlarr_k8s_app_keys_schedule: "23 * * * *"
# TTL: one period plus the 300s deadline and a margin, so the newest run is always visible.
prowlarr_k8s_app_keys_job_ttl_seconds: 4200
# The renderer copies the seed's jobTemplate into `prowlarr-verify` as
# `prowlarr-app-keys-deploy-gate-<spec digest8>`, a real run once per revision. A second run
# writes nothing, so the gate is a post-apply mutation.
flux_cronjob_gates:
  prowlarr-app-keys:
    kind: mutation
    rerun_safe: k8s/roles/prowlarr/tests/test_seed_prowlarr_app_keys.py::test_a_second_run_writes_nothing

# ── flaresolverr ────────────────────────────────────────────────────────────────────────────
# Solves Cloudflare challenges for the indexers, which means it RENDERS ATTACKER-SUPPLIED PAGES
# in a headless browser. It is reachable by prowlarr and nothing else — a deliberate
# isolation, not an accident of layout.
#
# One flat namespace would silently WIDEN that to every workload in {{ k8s_namespace }}, so
# networkpolicy-flaresolverr.yaml.j2 holds it narrow: ingress on 8191 from pods labelled
# app=prowlarr only. INGRESS is the enforced direction on this cluster — n8n-broker proves it,
# and B3 proved egress policies here do nothing — so this is a control that actually holds, and
# the prowlarr-verify Job (templates/verify/) says so rather than assuming.
#
# Tag KEPT alongside the digest (repo:latest@sha256) so Renovate's k8s-defaults manager still
# tracks it for digest-bump PRs — a bare repo@sha256 would freeze it with zero update signal.
prowlarr_k8s_flaresolverr_image: ghcr.io/flaresolverr/flaresolverr:latest@sha256:c80ae007ce2ccdcd217a12426e4f039ef763ff90738c808d38810c3e59323767
prowlarr_k8s_flaresolverr_port: 8191

# Blast-radius caps for prowlarr itself; flaresolverr's own pair is below.
prowlarr_k8s_cpu_limit: "1"
prowlarr_k8s_mem_limit: 1024Mi
prowlarr_k8s_cpu_request: "100m"
prowlarr_k8s_mem_request: 128Mi

# Limit 2048Mi: a burst of overlapping solves OOM-kills the pod (137) at 1024Mi. DISABLE_MEDIA saves
# bandwidth, not memory, and strips stylesheets too; revert by setting it false.
prowlarr_k8s_fs_disable_media: true

prowlarr_k8s_fs_cpu_limit: "2"
prowlarr_k8s_fs_mem_limit: 2048Mi
prowlarr_k8s_fs_cpu_request: "100m"
prowlarr_k8s_fs_mem_request: 512Mi

# Upstream log defaults (debug, 50 files) churn the backup; see sonarr's defaults.
prowlarr_k8s_log_level: info
prowlarr_k8s_log_rotate: "10"

# The exportarr metrics sidecar (templates/exportarr.yml.j2). Pinned in this role's own defaults
# rather than once in group_vars, because Renovate's k8s-images manager matches
# `k8s/roles/*/defaults` and `_image:` keys only. sonarr and radarr carry the same pin, and
# tests/services/test_exportarr_sidecars.py::test_the_image_pins_stay_in_lockstep
# fails if the three drift apart.
prowlarr_k8s_exportarr_image: ghcr.io/onedr0p/exportarr:v2.3.0@sha256:af535d94061cf97a52e1661945ffba78c03f9443eae7c0da1a80a5a4be56b520

k8s_claims:
  - name: "{{ prowlarr_k8s_claim }}"
    storage_class: "{{ prowlarr_k8s_storage_class }}"
    size: "{{ prowlarr_k8s_size }}"

# flaresolverr rolls with maxUnavailable: 0: a failed rollout leaves the OLD pod serving unseen.
# manifests_rollout watches only `prowlarr`, so this entry queues flaresolverr for the drain check.
manifests_extra_rollouts:
  - name: flaresolverr

render_secrets:
  # Prowlarr offers no scoped read-only key, so exportarr uses its own API key.
  - name: prowlarr-exportarr
    string_data:
      api_key: prowlarr_api_key
