---
# Flux's controllers name `homelab-critical` and the read-only kubeconfig carries this Secret's
# token, so a rebuilt cluster applies this tag by hand before installing Flux.

# Mirrored because a k8s role's defaults are invisible to a host component and the reverse;
# tests/k8s/flux/test_cluster_base_mirrors_the_k3s_identity.py holds each pair equal.
cluster_base_readonly_sa_name: homelab-readonly
cluster_base_readonly_sa_namespace: kube-system

# A CRD group left off this list makes `kubectl get` on it fall back to sudo; `view` covers only
# Flux's six.
# headlamp_k8s_crd_api_groups mirrors this list.
k3s_readonly_crd_api_groups:
  - traefik.io
  - metallb.io
  - longhorn.io
  # Read by runbook_gates.py etcd-restore gate 3 (ETCDSnapshotFile). Granted `*` per group, so Addon
  # too;
  # both are safe to read and hold no keys.
  - k3s.cattle.io
  # Read by `k3s_gates.py host` to refuse a restart while a Plan is applying; read-only, no
  # credential.
  - upgrade.cattle.io

cluster_base_skip_probe_name: cluster-base-skip-probe

# DECIDED: never pruned. Deleting a PriorityClass or the read-only identity from the render
# would make Flux delete it, and the API server then refuses every pod that names the class and
# every kubectl call that runs as the identity. With prune: false a render that drops an object
# leaves it serving. The cost is that an object removed here stays live until the operator
# deletes it (**operator-only**). Full analysis: the H1 plan's *Plumbing tags are never pruned*.
flux_prune: false

# Flux applies the tag, so this gates no apply.
k8s_autodeploy: false
k8s_autodeploy_reason: "platform — the PriorityClasses every pod names and the read-only identity every diagnostic runs as; a bad apply stops pod admission or locks out kubectl, and host probes stay green through both"

manifests_rollout: ''
