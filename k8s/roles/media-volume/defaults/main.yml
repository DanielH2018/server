---
# All workloads must see ONE filesystem, or sonarr/radarr imports become copies instead of
# hardlinks.
media_volume_claim: media-data

# A STATIC local PV, because local-path names its directory pvc-<uuid>_<ns>_<claim>, reclaims
# Delete, and WaitForFirstConsumer leaves the directory absent before the seeding rsync.
# Named explicitly on the claim: two StorageClasses are default, so an omitted class is
# non-deterministic.
media_volume_storage_class: media-local
# Mode is inherited from daniel-server's containers/data (0755) and deliberately not enforced;
# hosts/lib/tests/test_box_k3s_host_half.py holds daniel-box's tmpfiles copy equal.
media_volume_host_path: /srv/media

# ADVISORY ONLY: no quota backs this directory. The claim requests the same number, because binding
# needs the request no larger than the capacity.
media_volume_size: 400Gi

# ReadWriteMany matches the PV and live claim; access modes are immutable. A claim created before
# the PV waits Pending until the PV's pre-bound `claimRef` binds it.
k8s_claims:
  - name: "{{ media_volume_claim }}"
    storage_class: "{{ media_volume_storage_class }}"
    size: "{{ media_volume_size }}"
    access_modes: [ReadWriteMany]

# Renovate stance: whether an image bump here may automerge. `promote` deploys what merges.
k8s_autodeploy: true
k8s_autodeploy_reason: "a StorageClass, a PV and a claim that re-apply unchanged, and a verify Job in media-volume-verify that Flux runs to completion whenever the PV or StorageClass render changes; no image pin of its own"

# No Deployment in this role — it is storage, not a workload.
manifests_rollout: ""
