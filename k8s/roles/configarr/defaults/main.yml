# configarr is not a service: it is a nightly reconcile that reads the *arrs and exits. So it
# is a CronJob, not a Deployment, and its health is reported by a second CronJob,
# configarr-health, that READS the last Job through its own ServiceAccount and records the
# verdict for Prometheus.
configarr_k8s_image: ghcr.io/raydak-labs/configarr:1.39.2@sha256:48893921c607e96e40310d3ced50a92584667a84595dc9b782f523d46267f2e7

# Renovate stance: whether an image bump here may automerge. `promote` deploys what merges.
k8s_autodeploy: true
k8s_autodeploy_reason: "CronJob gated on every revision by a gate Job in configarr-verify, which proves the new image RUNS and fails the revision on a sync that exits non-zero; the gate Job has no ownerReference, so concurrencyPolicy Forbid cannot keep a scheduled run off it, but the reconciler is convergent, so running the same sync twice is harmless; the configarr-health CronJob is gated the same way, and an extra run of it only re-reads the last Job and re-pushes its verdict"

# The gate Jobs Flux runs in `configarr-verify`, one per CronJob, which the renderer copies from
# each jobTemplate (scripts/renderer/renderer_lib/cronjob_gate.py).
# - configarr's gate run performs the reconcile, so it is a post-apply mutation. The sync
#   converges on its config, so a second run reports no change; the rerun_safe test fails the
#   rendered config on the shapes that would break that. It keeps the CronJob's backoffLimit: 0, and its Job keeps
#   `app: configarr`, which is the health reader's selector and sonarr's and radarr's admission.
# - configarr-health's run re-reads the last Job and re-records its verdict, and exits 0 unless the export fails,
#   so it is a verify gate: a run that starts proves the reader's image and ServiceAccount.
# DECIDED: the two gates run unordered (#5617). Flux applies both Jobs in one Kustomization, so
# the health gate can finish before the reconcile gate and record the previous run's verdict.
# That record repeats what the last */10 run wrote, so the rules see no transition, and the next
# scheduled run reports the fresh sync within 10 minutes, the wait the nightly sync already
# has. A failed sync fails configarr-verify on its own. Ordering the gates would need a second
# -verify Kustomization in the renderer, and dropping the health gate would lose the only
# deploy-time proof of the reader's Renovate-bumped images. The role CLAUDE.md has the long form.
flux_cronjob_gates:
  configarr:
    kind: mutation
    rerun_safe: k8s/roles/configarr/tests/test_configarr_gate.py::test_a_second_sync_reports_no_change
  configarr-health:
    kind: verify

# Independent of the health reader's schedule, which reads whatever the last run produced.
configarr_k8s_schedule: "30 4 * * *"

configarr_k8s_timeout: 300
# Two schedule periods, so a failed run clears; it must exceed one period because configarr-health
# judges the newest finished Job.
configarr_k8s_job_ttl_seconds: 172800

# Deliberately kept: `kubectl logs job/<n>` is the only record of what a run did, and the health
# reader reads it. History limits, not ttlSecondsAfterFinished — a TTL deletes a Succeeded Job on
# its own clock, and a health reader that finds no Job at all reports DOWN.
configarr_k8s_successful_history: 3
configarr_k8s_failed_history: 3

# 26 h ceiling, so a daily 04:30 sync that skips one night goes red rather than coasting on yesterday's log.
configarr_k8s_max_age_hours: 26

# */10: the rules read the verdict ConfigMap and the CronJob's last success; the age gate above
# turns a stale run red.
configarr_k8s_health_schedule: "*/10 * * * *"

# Written as annotations, which kube-state-metrics exports; ConfigarrHealthNotReporting holds the
# last success to three periods (1800s).
configarr_k8s_health_verdict_configmap: configarr-health-verdict

# kubectl comes from an init container of alpine/k8s at /usr/bin/kubectl; its minor matches the
# server's.
configarr_k8s_health_image: python:3.15-alpine@sha256:0f9552bb28711333da16915ec146f5e6bb44a7fdac9ced15dc17c2e0206346dd
configarr_k8s_health_kubectl_image: alpine/k8s:1.37.2@sha256:7a82aeefea3d554a43a8676b137f2b88bae6c1fe11c13862b191b3a086cc28c0

# Above the reader's worst case: two 30 s kubectl calls plus the cold pull of both images. A
# deadline firing before the container starts fails the deploy.
# The gate Job copies it, and `bundle.flux_files` raises the `configarr-verify` timeout above it.
configarr_k8s_health_deadline_seconds: 420
# How long a finished configarr-health Job, and so its pod, stays visible. A run the weekly reboot
# interrupts fails, and without a TTL it reads Failed until two later runs fail.
# 30 minutes clears it inside the hour after boot
# (tests/k8s/flux/test_reboot_window_cronjobs_age_out.py); the run's output is in Loki past that.
configarr_k8s_health_job_ttl_seconds: 1800

configarr_k8s_health_cpu_limit: "200m"
configarr_k8s_health_mem_limit: 128Mi
configarr_k8s_health_cpu_request: "10m"
configarr_k8s_health_mem_request: 32Mi

# Mirrors resources('0.50', '256M', '0.05', '16M').
configarr_k8s_cpu_limit: "500m"
configarr_k8s_mem_limit: 256Mi
configarr_k8s_cpu_request: "50m"
configarr_k8s_mem_request: 16Mi

# '' means skip the rollout entirely: there is no Deployment to wait on.
manifests_rollout: ""
