---
# Auto-deploy stance. Flux applies the tag, so this gates no apply; the stance decides whether
# Renovate automerges a bump of the python image below.
# DECIDED: `true`, as configarr's CronJob does. The image carries a stdlib script and no
# state, and every bump runs the reconcile once as a gate Job in `longhorn-reconcile-verify`,
# which fails the revision on a read or a write that errors. The role writes Volume labels, but
# a bump changes the interpreter and not the script, and a wrong label is one merge patch to
# undo. The alternative, `false`, would need a manual rule in renovate.json for the shared
# python digest, as the denied roles carry. Contradict this with a measured interpreter break.
k8s_autodeploy: true
k8s_autodeploy_reason: "CronJob gated on every revision by a gate Job in longhorn-reconcile-verify, which proves the new image RUNS the reconcile and fails the revision on a read or a write that errors; the gate Job has no ownerReference, so concurrencyPolicy Forbid cannot keep a scheduled run off it, but a patch to a label or a target already set is a no-op, so running the same plan twice is harmless"

longhorn_reconcile_k8s_image: python:3.15-alpine@sha256:0f9552bb28711333da16915ec146f5e6bb44a7fdac9ced15dc17c2e0206346dd

# DECIDED: hourly, at minute 17. The Ansible tasks this job replaces ran once per `k3s-bringup.yml`
# apply. Hourly bounds how long a PVC recreated from the `longhorn` class sits in the daily
# group after a deploy that put it on another tier. Minute 17 keeps the run clear of the :00 and
# :30 marks that Longhorn's own cluster-wide jobs and the */10 health readers share. The job
# writes nothing on a converged cluster, so the schedule costs two list calls an hour.
longhorn_reconcile_k8s_schedule: "17 * * * *"

# Below the `longhorn-reconcile-verify` Kustomization's 600s timeout, so a hung gate run fails on
# its own message.
longhorn_reconcile_k8s_deadline_seconds: 300
# Two schedule periods, so a failed run clears; it must exceed one period so the newest Job is
# readable.
longhorn_reconcile_k8s_job_ttl_seconds: 7200

# A run missed by more than half an hour is not made up: the next one reads the same state.
longhorn_reconcile_k8s_starting_deadline_seconds: 1800

longhorn_reconcile_k8s_uid: 65534

longhorn_reconcile_k8s_cpu_limit: 200m
longhorn_reconcile_k8s_mem_limit: 128Mi
longhorn_reconcile_k8s_cpu_request: 10m
longhorn_reconcile_k8s_mem_request: 32Mi

# No `default([])` on `services`: an empty result would return every r2 volume to B2 and every
# weekly volume to daily, so an undefined list must fail the render.

# Names are namespace/pvcName. Derived from `backup_claims` of home-critical entries and
# `r2_backup_claims`; edit the entry.
k3s_longhorn_r2_volumes: "{{ services | longhorn_r2_claims(k8s_namespace) }}"

# Derived: each `weekly_backup_claims` entry names its own shard (0=Sunday), so removing one moves
# no other volume.
# A PVC recreated from the `longhorn` class reverts to daily until the next hourly run.
k3s_longhorn_weekly_volumes: "{{ services | longhorn_weekly_claims(k8s_namespace) }}"

# Exclude only what regenerates: an excluded volume keeps one frozen restore point, never pruned or
# refreshed.
# Under a B2 cap use a staggered weekly group, not an exclusion.
k3s_longhorn_nobackup_volumes: "{{ services | longhorn_nobackup_claims(k8s_namespace) }}"

# The gate Job has no ownerReference to the CronJob, so Forbid does not cover it; an overlap
# computes the same plan.
flux_cronjob_gates:
  longhorn-reconcile:
    kind: mutation
    rerun_safe: k8s/roles/longhorn-reconcile/tests/test_longhorn_reconcile.py::test_a_second_run_changes_nothing

manifests_rollout: ''
