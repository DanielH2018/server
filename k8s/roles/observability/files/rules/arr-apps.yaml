# The *arr apps' own health checks, as their exportarr sidecars serve them on the `exportarr`
# scrape job. Plain YAML, never Jinja: prometheus-rules.yaml.j2 carries this file verbatim.
#
# exportarr's system collector exports each entry of an app's /api/v1/health as one
# `<app>_system_health_issues` series of value 1, labelled with the check's `source`, `type`
# and `message`. An app with no issues serves one series of value 0 with no `source`.
groups:
  - name: arr-apps
    rules:
      # A stale key fails every push with a 401 while RSS still works; only the long-term check is
      # read, since every rollout trips the short-term one.
      # `max by (source)` drops `instance` and `message`, either of which would resolve and re-fire
      # the alert under a new label set.
      # The absent() arms are conjoined with up == 1, so a failed scrape pages once, through
      # ScrapeTargetDown.
      - alert: ProwlarrAppSyncFailing
        expr: >-
          max by (source) (prowlarr_system_health_issues{job="exportarr", source="ApplicationLongTermStatusCheck"}) > 0
          or
          absent(up{job="exportarr", arr="prowlarr"})
          or
          (absent(prowlarr_system_health_issues{job="exportarr", arr="prowlarr"})
          and on() (up{job="exportarr", arr="prowlarr"} == 1))
        for: 30m
        labels:
          severity: warning
          service: prowlarr
        annotations:
          summary: >-
            prowlarr: {{ with query "prowlarr_system_health_issues{job='exportarr',source='ApplicationLongTermStatusCheck'} > 0"
            }}indexer sync has failed for 6 hours to {{ $m := (index . 0).Labels.message }}{{ if
            match "^All " $m }}every app{{ else }}{{ reReplaceAll ".*: " "" $m }}{{ end
            }}.{{ else }}exportarr serves no Prowlarr health, so a failing app sync is unseen.{{ end }}
          description: >-
            Prowlarr has failed to push its indexers to an app for 6 hours, or exportarr serves no
            Prowlarr health. A 401 in Prowlarr's log means a stale key: paste the app's API key
            into Prowlarr's Settings, Apps, then click Sync App Indexers.

      # A failing Connect notification silences every health error the app raises. One rule per app:
      # the exportarr job discovers its targets, so it cannot hand the alert a `service`.
      # `max` drops `instance` and `message`. The hour rides out a Discord outage.
      - alert: ArrNotificationsFailing
        expr: max(sonarr_system_health_issues{job="exportarr", source="NotificationStatusCheck"}) > 0
        for: 1h
        labels:
          severity: warning
          service: sonarr
        annotations:
          summary: >-
            sonarr: {{ with query "sonarr_system_health_issues{job='exportarr',source='NotificationStatusCheck'} > 0"
            }}{{ (index . 0).Labels.message }}{{ end }}.
          description: >-
            A Connect notification fails every send, so the app's health notifications miss Discord.
            A Discord 404 in the app's log means a deleted webhook, which the seed Job rewrites on
            the next rollout. A missing CustomScript needs its row fixed in Settings, Connect.

      - alert: ArrNotificationsFailing
        expr: max(radarr_system_health_issues{job="exportarr", source="NotificationStatusCheck"}) > 0
        for: 1h
        labels:
          severity: warning
          service: radarr
        annotations:
          summary: >-
            radarr: {{ with query "radarr_system_health_issues{job='exportarr',source='NotificationStatusCheck'} > 0"
            }}{{ (index . 0).Labels.message }}{{ end }}.
          description: >-
            A Connect notification fails every send, so the app's health notifications miss Discord.
            A Discord 404 in the app's log means a deleted webhook, which the seed Job rewrites on
            the next rollout. A missing CustomScript needs its row fixed in Settings, Connect.

      - alert: ArrNotificationsFailing
        expr: max(lidarr_system_health_issues{job="exportarr", source="NotificationStatusCheck"}) > 0
        for: 1h
        labels:
          severity: warning
          service: lidarr
        annotations:
          summary: >-
            lidarr: {{ with query "lidarr_system_health_issues{job='exportarr',source='NotificationStatusCheck'} > 0"
            }}{{ (index . 0).Labels.message }}{{ end }}.
          description: >-
            A Connect notification fails every send, so the app's health notifications miss Discord.
            A Discord 404 in the app's log means a deleted webhook, which the seed Job rewrites on
            the next rollout. A missing CustomScript needs its row fixed in Settings, Connect.

      - alert: ArrNotificationsFailing
        expr: max(prowlarr_system_health_issues{job="exportarr", source="NotificationStatusCheck"}) > 0
        for: 1h
        labels:
          severity: warning
          service: prowlarr
        annotations:
          summary: >-
            prowlarr: {{ with query "prowlarr_system_health_issues{job='exportarr',source='NotificationStatusCheck'} > 0"
            }}{{ (index . 0).Labels.message }}{{ end }}.
          description: >-
            A Connect notification fails every send, so the app's health notifications miss Discord.
            A Discord 404 in the app's log means a deleted webhook, which the seed Job rewrites on
            the next rollout. A missing CustomScript needs its row fixed in Settings, Connect.
