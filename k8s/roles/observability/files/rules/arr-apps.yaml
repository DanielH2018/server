# The *arr apps' own health checks, as their exportarr sidecars serve them on the `exportarr`
# scrape job. Plain YAML, never Jinja: prometheus-rules.yaml.j2 carries this file verbatim.
#
# exportarr's system collector exports each entry of an app's /api/v1/health as one
# `<app>_system_health_issues` series of value 1, labelled with the check's `source`, `type`
# and `message`. An app with no issues serves one series of value 0 with no `source`.
groups:
  - name: arr-apps
    rules:
      # Prowlarr pushes its indexers to Sonarr, Radarr and Lidarr with each app's API key, which
      # it stores in its own database. A stale key fails every push with a 401 while RSS still
      # works, so nothing else turns red. ApplicationLongTermStatusCheck reports an app whose
      # pushes have failed for 6 hours; the short-term check is not read, because every app
      # rollout trips it.
      # `max by (source)` drops `instance`, which moves with each Prowlarr pod, and `message`,
      # which lists the failing apps and changes as one recovers. Either would resolve the alert
      # and fire it again under a new label set.
      # The absent() arms fire when the check above cannot be read: no Prowlarr exportarr target
      # at all, or a scrape that succeeds and serves no health family. The family's arm is
      # conjoined with up == 1, so a failed scrape pages once, through ScrapeTargetDown.
      # When every app fails, Prowlarr's message is "All applications are unavailable ..." with
      # no list, so the summary names every app instead.
      - alert: ProwlarrAppSyncFailing
        expr: >-
          max by (source) (prowlarr_system_health_issues{job="exportarr", source="ApplicationLongTermStatusCheck"}) > 0
          or
          absent(up{job="exportarr", arr="prowlarr"})
          or
          (absent(prowlarr_system_health_issues{job="exportarr", arr="prowlarr"})
          and on() (up{job="exportarr", arr="prowlarr"} == 1))
        for: 30m
        labels:
          severity: warning
          service: prowlarr
        annotations:
          summary: >-
            prowlarr: {{ with query "prowlarr_system_health_issues{job='exportarr',source='ApplicationLongTermStatusCheck'} > 0"
            }}indexer sync has failed for 6 hours to {{ $m := (index . 0).Labels.message }}{{ if
            match "^All " $m }}every app{{ else }}{{ reReplaceAll ".*: " "" $m }}{{ end
            }}.{{ else }}exportarr serves no Prowlarr health, so a failing app sync is unseen.{{ end }}
          description: >-
            Prowlarr has failed to push its indexers to an app for 6 hours, or exportarr serves no
            Prowlarr health. A 401 in Prowlarr's log means a stale key: paste the app's API key
            into Prowlarr's Settings, Apps, then click Sync App Indexers.

      # NotificationStatusCheck reports a Connect notification whose sends fail: a deleted Discord
      # webhook, or a CustomScript whose file is gone. The app's own onHealthIssue posts go
      # through those notifications, so a failing one silences every health error the app raises,
      # Prowlarr's all-indexers-down among them.
      # One rule per app with exportarr, because the exportarr job discovers its targets and so
      # cannot hand the alert a `service`. `max` drops `instance` and `message`, which move with
      # each pod and each failing notification.
      # The hour rides out a Discord outage: the app retries on a backoff and clears the check on
      # the next good send, as one 30-minute Radarr episode did.
      - alert: ArrNotificationsFailing
        expr: max(sonarr_system_health_issues{job="exportarr", source="NotificationStatusCheck"}) > 0
        for: 1h
        labels:
          severity: warning
          service: sonarr
        annotations:
          summary: >-
            sonarr: {{ with query "sonarr_system_health_issues{job='exportarr',source='NotificationStatusCheck'} > 0"
            }}{{ (index . 0).Labels.message }}{{ end }}.
          description: >-
            A Connect notification in the app fails every send, so the app's own health
            notifications do not reach Discord. A Discord 404 in the app's log means the webhook
            was deleted: the seed Job writes arr_discord_webhook_url into each Discord (health)
            row on the next rollout. A missing CustomScript file needs its row fixed or removed in
            the app's Settings, Connect.

      - alert: ArrNotificationsFailing
        expr: max(radarr_system_health_issues{job="exportarr", source="NotificationStatusCheck"}) > 0
        for: 1h
        labels:
          severity: warning
          service: radarr
        annotations:
          summary: >-
            radarr: {{ with query "radarr_system_health_issues{job='exportarr',source='NotificationStatusCheck'} > 0"
            }}{{ (index . 0).Labels.message }}{{ end }}.
          description: >-
            A Connect notification in the app fails every send, so the app's own health
            notifications do not reach Discord. A Discord 404 in the app's log means the webhook
            was deleted: the seed Job writes arr_discord_webhook_url into each Discord (health)
            row on the next rollout. A missing CustomScript file needs its row fixed or removed in
            the app's Settings, Connect.

      - alert: ArrNotificationsFailing
        expr: max(lidarr_system_health_issues{job="exportarr", source="NotificationStatusCheck"}) > 0
        for: 1h
        labels:
          severity: warning
          service: lidarr
        annotations:
          summary: >-
            lidarr: {{ with query "lidarr_system_health_issues{job='exportarr',source='NotificationStatusCheck'} > 0"
            }}{{ (index . 0).Labels.message }}{{ end }}.
          description: >-
            A Connect notification in the app fails every send, so the app's own health
            notifications do not reach Discord. A Discord 404 in the app's log means the webhook
            was deleted: the seed Job writes arr_discord_webhook_url into each Discord (health)
            row on the next rollout. A missing CustomScript file needs its row fixed or removed in
            the app's Settings, Connect.

      - alert: ArrNotificationsFailing
        expr: max(prowlarr_system_health_issues{job="exportarr", source="NotificationStatusCheck"}) > 0
        for: 1h
        labels:
          severity: warning
          service: prowlarr
        annotations:
          summary: >-
            prowlarr: {{ with query "prowlarr_system_health_issues{job='exportarr',source='NotificationStatusCheck'} > 0"
            }}{{ (index . 0).Labels.message }}{{ end }}.
          description: >-
            A Connect notification in the app fails every send, so the app's own health
            notifications do not reach Discord. A Discord 404 in the app's log means the webhook
            was deleted: the seed Job writes arr_discord_webhook_url into each Discord (health)
            row on the next rollout. A missing CustomScript file needs its row fixed or removed in
            the app's Settings, Connect.
