      description: >-
        Read `journalctl -u homelab-updater -u homelab-reconcile` on daniel-server, fix the cause, then
        run `sudo /usr/lib/homelab/homelab-updater --clear-hold`. homelab_host_reconcile_ok has read 0
        for 15 minutes, so daniel-server installs no newer homelab package.
      runbook_url: https://docs.local.daniel-hunter.com/host-packages/
  - alert: ComposeUpFailed
    expr: homelab_compose_up_result{origin="daniel-pi"} == 0
    labels:
      severity: warning
      service: daniel-pi
      shadow: 'true'
    annotations:
      summary: 'daniel-pi: the last Compose run did not bring the project up.'
      description: >-
        compose-run on daniel-pi wrote homelab_compose_up_result 0 at package {{ $labels.sha }}: a key
        check, the config check, an image pull, compose-adopt or `docker compose up --wait` failed. Read
        `journalctl -u homelab-compose` and `docker ps -a` on daniel-pi.
  - alert: ComposeUpStale
    expr: |
      (
          homelab_compose_up_timestamp_seconds{origin="daniel-pi"}
          < on (origin) group_left node_boot_time_seconds{origin="daniel-pi"}
        or
          absent_over_time(homelab_compose_up_timestamp_seconds{origin="daniel-pi"}[1690s])
      )
      and on (origin)
        time() - node_boot_time_seconds{origin="daniel-pi"} > 1690
    labels:
      severity: warning
      service: daniel-pi
    annotations:
      summary: 'daniel-pi: the Compose project has not run since boot.'
      description: >-
        daniel-pi booted more than 1690s ago, and homelab_compose_up_timestamp_seconds still predates
        that boot or is missing, so the boot's compose-run wrote no result. Read `systemctl status homelab-compose`
        and `journalctl -b -u homelab-compose` on daniel-pi.
      runbook_url: https://docs.local.daniel-hunter.com/alert-runbooks/#composeupstale
  - alert: ComposeRestartUnreported
    expr: |
      homelab_host_unit_started_seconds{origin="daniel-pi",unit="homelab-compose.service"}
        > on (origin) group_left homelab_compose_up_timestamp_seconds{origin="daniel-pi"}
    for: 5m
    labels:
      severity: warning
      service: daniel-pi
    annotations:
      summary: 'daniel-pi: the Compose project wrote no result for reconcile''s last start of it.'
      description: >-
        homelab-reconcile started homelab-compose.service on daniel-pi, and homelab_compose_up_timestamp_seconds
        still predates that call, so compose-run wrote no result for it. Read `journalctl -u homelab-compose
        -u homelab-reconcile` on daniel-pi.
      runbook_url: https://docs.local.daniel-hunter.com/alert-runbooks/#composerestartunreported
  - alert: HostRebootOverdue
    expr: |
      (
          homelab_host_reboot_pending{origin="daniel-box"} == 1
        and on (origin)
          time() - homelab_host_reboot_pending_since_seconds{origin="daniel-box"} > 691200
      )
    for: 15m
    labels:
      severity: warning
      service: daniel-box
    annotations:
      summary: 'daniel-box: a reboot has been owed for more than 8 days.'
      description: >-
        Reconcile recorded a reboot-class package change on daniel-box more than 8 days ago, and the host
        has not booted since. Read `journalctl -t weekly-restart` on daniel-box and docs/host-packages.md,
        "Reboot-pending and activation-pending", then reboot the host.
      runbook_url: https://docs.local.daniel-hunter.com/host-packages/
  - alert: HostRebootOverdue
    expr: |
      (
          homelab_host_reboot_pending{origin="daniel-pi"} == 1
        and on (origin)
          time() - homelab_host_reboot_pending_since_seconds{origin="daniel-pi"} > 691200
      )
    for: 15m
    labels:
      severity: warning
      service: daniel-pi
    annotations:
      summary: 'daniel-pi: a reboot has been owed for more than 8 days.'
      description: >-
        Reconcile recorded a reboot-class package change on daniel-pi more than 8 days ago, and the host
        has not booted since. Read `journalctl -t weekly-restart` on daniel-pi and docs/host-packages.md,
        "Reboot-pending and activation-pending", then reboot the host.
      runbook_url: https://docs.local.daniel-hunter.com/host-packages/
  - alert: HostRebootOverdue
    expr: |
      (
          homelab_host_reboot_pending{origin="daniel-server"} == 1
        and on (origin)
          time() - homelab_host_reboot_pending_since_seconds{origin="daniel-server"} > 691200
      )
    for: 15m
    labels:
      severity: warning
      service: daniel-server
    annotations:
      summary: 'daniel-server: a reboot has been owed for more than 8 days.'
      description: >-
        Reconcile recorded a reboot-class package change on daniel-server more than 8 days ago, and the
        host has not booted since. Read `journalctl -t weekly-restart` on daniel-server and docs/host-packages.md,
        "Reboot-pending and activation-pending", then reboot the host.
      runbook_url: https://docs.local.daniel-hunter.com/host-packages/
  - alert: DockerEnginePinUnapplied
    expr: |
      (
          min_over_time(homelab_docker_engine_pending{job="node-pi",origin="daniel-pi"}[26h]) == 1
        and on (origin)
          present_over_time(homelab_docker_engine_pending{job="node-pi",origin="daniel-pi"}[1h] offset 26h)
      )
      unless on (origin) (up{job="node-pi"} == 0)
    labels:
      severity: warning
      service: daniel-pi
    annotations:
      summary: 'daniel-pi: the Docker engine has sat off its pins for more than 26 hours.'
      description: >-
        The Docker engine on daniel-pi has sat off its pins for 26 hours, so the 00:30 UTC homelab-docker-engine.timer
        did not apply them. Read `systemctl status homelab-docker-engine.timer homelab-updater.timer`
        and `journalctl -u homelab-docker-engine`, and docs/host-packages.md, "Host-plane pages".
      runbook_url: https://docs.local.daniel-hunter.com/host-packages/
  - alert: HostUpdateStale
    expr: |
      (
          time() - homelab_host_update_success_timestamp_seconds{job="node",origin="daniel-box"} > 3600
        or
          (
              absent(homelab_host_update_success_timestamp_seconds{job="node",origin="daniel-box"})
            and on (job, origin)
              up{job="node",origin="daniel-box"} == 1
          )
      )
    labels:
      severity: critical
      service: daniel-box
    annotations:
      summary: 'daniel-box: no successful homelab update for 60 minutes.'
      description: >-
        Read `systemctl status homelab-updater.timer` and `journalctl -u homelab-updater` on daniel-box.
        No homelab-updater run there has succeeded in 60 minutes, or its exporter is up and serves no
        success timestamp. The runbook lists what leaves it stale.
      runbook_url: https://docs.local.daniel-hunter.com/host-packages/
  - alert: HostUpdateStale
    expr: |
      (
          time() - homelab_host_update_success_timestamp_seconds{job="node-pi",origin="daniel-pi"} > 90000
        or
          (
              absent(homelab_host_update_success_timestamp_seconds{job="node-pi",origin="daniel-pi"})
            and on (job, origin)
              up{job="node-pi",origin="daniel-pi"} == 1
          )
      )
    labels:
      severity: critical
      service: daniel-pi
    annotations:
      summary: 'daniel-pi: no successful homelab update for 25 hours.'
      description: >-
        Read `systemctl status homelab-updater.timer` and `journalctl -u homelab-updater` on daniel-pi.
