    for: 5m
    labels:
      severity: critical
      service: daniel-box
    annotations:
      summary: 'daniel-box: the wired link eno1 is down, so the node runs on WiFi.'
      description: >-
        eno1 on daniel-box has had no carrier, or has been down, for 5 minutes. daniel-box serves Longhorn
        replicas over WiFi, and volumes on the other node get I/O errors. Restore the wire first: check
        the cable and the switch port, then run `ip -br link` on daniel-box.
      runbook_url: https://docs.local.daniel-hunter.com/alert-runbooks/#wiredlinkdown
