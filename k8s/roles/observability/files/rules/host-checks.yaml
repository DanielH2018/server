        carrier. The wired default route still wins, so the node has no internet and may not reach the
        other node. Read `journalctl -k -g eno1` and `journalctl -t wired-gateway` on daniel-box; a run
        of `NETDEV WATCHDOG` and `Reset adapter` lines means the NIC's transmit queue hung.
