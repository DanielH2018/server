          time() - homelab_host_update_success_timestamp_seconds{job="node",origin="daniel-server"} > 3600
        or
          (
              absent(homelab_host_update_success_timestamp_seconds{job="node",origin="daniel-server"})
            and on (job, origin)
              up{job="node",origin="daniel-server"} == 1
