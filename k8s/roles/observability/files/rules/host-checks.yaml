      )
      unless on (origin) (up{job="node"} == 0)
    labels:
      severity: warning
      service: daniel-box
    annotations:
      summary: 'daniel-box: the peer artifact sync has stopped reporting.'
      description: >-
        No sync-artifacts verdict newer than 15 minutes reached Prometheus from daniel-box, so the cron
