  - alert: DiskHealthFailed
    expr: homelab_check_success{check="disk-health",origin="daniel-box"} == 0
    labels:
      severity: critical
      service: daniel-box
    annotations:
      summary: 'daniel-box: the root disk check is red.'
      description: >-
        disk-health.sh on daniel-box read the root filesystem above its threshold, or df failed. Longhorn
        stops scheduling replicas on the node at 75%. homelab_disk_root_used_ratio{check="disk-health"}
        holds the share it read, and the `disk-health` syslog tag holds the run's message.
      runbook_url: https://docs.local.daniel-hunter.com/alert-runbooks/#diskhealthfailed
  - alert: DiskHealthNotReporting
    expr: |
      (
          time() - homelab_check_last_run_timestamp_seconds{check="disk-health",origin="daniel-box"} > 1500
        or
          absent_over_time(homelab_check_last_run_timestamp_seconds{check="disk-health",origin="daniel-box"}[1500s])
      )
      unless on (origin) (up{job="node"} == 0)
    labels:
      severity: critical
      service: daniel-box
    annotations:
      summary: 'daniel-box: the root disk check has stopped reporting.'
      description: >-
        No disk-health verdict newer than 25 minutes reached Prometheus from daniel-box's textfile collector,
        so nothing is watching the root disk. Read the `daniel-box disk health` cron and the `disk-health`
        syslog tag, then /var/lib/node-exporter-textfile/disk-health.prom on the host.
      runbook_url: https://docs.local.daniel-hunter.com/alert-runbooks/#diskhealthnotreporting
  - alert: ArtifactsSyncFailed
    expr: homelab_check_success{check="sync-artifacts",origin="daniel-box"} == 0
    labels:
      severity: warning
      service: daniel-box
    annotations:
      summary: 'daniel-box: the peer artifact sync is failing.'
      description: >-
        sync-artifacts.sh has failed a peer for claude_code_artifacts_sync_alert_after_failures consecutive
        runs, so that peer's artifacts are stale in the browser. Run `journalctl -t sync-artifacts` on
        daniel-box for the peer and its streak, then ssh to the named peer.
  - alert: ArtifactsSyncNotReporting
    expr: |
      (
          time() - homelab_check_last_run_timestamp_seconds{check="sync-artifacts",origin="daniel-box"} > 900
