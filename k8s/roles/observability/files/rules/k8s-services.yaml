# The cluster's Services, from kube-state-metrics' services collector, which the Prometheus job
# trims to kube_service_status_load_balancer_ingress. Plain YAML, never Jinja:
# prometheus-rules.yaml.j2 carries this file verbatim.
#
# MosquittoLanAddressNotPinned, JellyfinLanAddressNotPinned and PiholeLanAddressNotPinned verify
# each role's pinned LAN address on a metric (docs/archive/deploy/d5-bulk-move.md).
# Each carries verify="true", so the soak Job fails a revision that changes its service while
# it fires. The address is a literal because a rule file is never Jinja;
# tests/services/alert_rules/test_lan_address_rules_agree.py holds it, the namespace and the
# Service name to the rendered Service.
# TraefikIngressAddressNotPinned is the same check for traefik's reserved ingress VIP.
groups:
  - name: k8s-services
    rules:
      # MetalLB ignores an unrecognised annotation key, so a wrong prefix brings the Service up on
      # an auto-assigned address with every pod healthy; the LAN dials the pinned VIP.
      # The second arm is conjoined with up == 1 so ScrapeTargetDown owns a failed scrape.
      - alert: MosquittoLanAddressNotPinned
        expr: >-
          absent(up{job="kube-state-metrics"})
          or
          (absent(kube_service_status_load_balancer_ingress{job="kube-state-metrics", namespace="homelab", service="mosquitto-lan", ip="10.0.0.242"})
          and on() (up{job="kube-state-metrics"} == 1))
        for: 5m
        labels:
          severity: warning
          service: mosquitto
          verify: "true"
        annotations:
          summary: 'mosquitto: the mosquitto-lan Service does not hold its pinned LAN address.'
          description: >-
            homelab/mosquitto-lan has no LoadBalancer ingress at its pinned VIP for 5 minutes, or
            kube-state-metrics is not scraped. Home Assistant and the LAN publishers cannot reach
            the broker. MetalLB does not re-evaluate an existing allocation, so delete the Service
            and redeploy mosquitto.
      # TV and phone clients have the VIP typed in by hand.
      - alert: JellyfinLanAddressNotPinned
        expr: >-
          absent(up{job="kube-state-metrics"})
          or
          (absent(kube_service_status_load_balancer_ingress{job="kube-state-metrics", namespace="homelab", service="jellyfin-lan", ip="10.0.0.241"})
          and on() (up{job="kube-state-metrics"} == 1))
        for: 5m
        labels:
          severity: warning
          service: jellyfin
          verify: "true"
        annotations:
          summary: 'jellyfin: the jellyfin-lan Service does not hold its pinned LAN address.'
          description: >-
            homelab/jellyfin-lan has no LoadBalancer ingress at its pinned VIP for 5 minutes, or
            kube-state-metrics is not scraped. TV and phone clients that dial the VIP cannot reach
            Jellyfin. MetalLB does not re-evaluate an existing allocation, so delete the Service
            and redeploy jellyfin.
      # LAN clients get the VIP from the router's DHCP DNS option; CoreDNS uses the pinned
      # ClusterIP, so nothing else notices.
      - alert: PiholeLanAddressNotPinned
        expr: >-
          absent(up{job="kube-state-metrics"})
          or
          (absent(kube_service_status_load_balancer_ingress{job="kube-state-metrics", namespace="homelab", service="pihole-dns", ip="10.0.0.243"})
          and on() (up{job="kube-state-metrics"} == 1))
        for: 5m
        labels:
          severity: warning
          service: pihole
          verify: "true"
        annotations:
          summary: 'pihole: the pihole-dns Service does not hold its pinned LAN address.'
          description: >-
            homelab/pihole-dns has no LoadBalancer ingress at its pinned VIP for 5 minutes, or
            kube-state-metrics is not scraped. LAN clients that took the VIP from DHCP have no DNS
            resolver. MetalLB does not re-evaluate an existing allocation, so delete the Service
            and redeploy pihole.
      # Cloudflare's origin, the router's port-forward and LAN DNS hardcode the reserved ingress
      # VIP.
      - alert: TraefikIngressAddressNotPinned
        expr: >-
          absent(up{job="kube-state-metrics"})
          or
          (absent(kube_service_status_load_balancer_ingress{job="kube-state-metrics", namespace="homelab", service="traefik", ip="10.0.0.240"})
          and on() (up{job="kube-state-metrics"} == 1))
        for: 5m
        labels:
          severity: warning
          service: traefik
          verify: "true"
        annotations:
          summary: 'traefik: the Service does not hold the reserved ingress VIP.'
          description: >-
            homelab/traefik has no LoadBalancer ingress at the reserved VIP for 5 minutes, or
            kube-state-metrics is not scraped. Cloudflare, the router and the LAN DNS cannot reach
            the edge. MetalLB does not re-evaluate an existing allocation, so delete the Service
            and the next apply of traefik re-creates it.
          runbook_url: https://docs.local.daniel-hunter.com/alert-runbooks/#traefikingressaddressnotpinned
