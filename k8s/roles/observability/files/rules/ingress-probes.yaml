# The ingress probes: blackbox_exporter's probe of every routed ingress URL, read from the
# `blackbox-ingress` scrape job. Plain YAML, never Jinja:
# prometheus-rules.yaml.j2 carries this file verbatim. The design is
# docs/archive/monitoring/m4-blackbox-ingress.md, "The rules".
#
# The two per-target rules carry no literal `service`. Each series takes it from the scrape
# target that `prometheus.yaml.j2` renders per tile, and scripts/validate/alert_rules.py
# accepts that only while every selector names this one job and every target sets `service`.
# `page_tier` on the target picks which of the two rules fires, so severity stays a literal.
groups:
  - name: ingress-probes
    rules:
      # The ingress pager. `for: 2m` at the job's 60s interval is three strikes.
      - alert: IngressProbeFailedCritical
        expr: probe_success{job="blackbox-ingress", page_tier="critical"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: '{{ $labels.service }}: the ingress probe is failing.'
          description: >-
            Read probe_http_status_code for {{ $labels.instance }}, then the workload's log.
            blackbox_exporter's {{ $labels.module }} probe has failed for 2 minutes. A probe behind
            SSO expects Authelia's 302 and never reaches the backend, so read Traefik and Authelia
            first there.
          runbook_url: https://docs.local.daniel-hunter.com/alert-runbooks/#ingressprobefailedcritical
      # The same, for every service outside home-critical.
      - alert: IngressProbeFailed
        expr: probe_success{job="blackbox-ingress", page_tier="warning"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.service }}: the ingress probe is failing.'
          description: >-
            blackbox_exporter's {{ $labels.module }} probe of {{ $labels.instance }} has failed for
            2 minutes. A probe behind SSO expects Authelia's 302 and never reaches the backend, so a
            failure there is in Traefik or Authelia. Read probe_http_status_code for this instance,
            then the Traefik and Authelia logs.
      # This family's zero-series alert. A job dropped from prometheus.yml leaves both rules
      # above evaluating to nothing. ScrapeTargetDown fires on a member at 0, and a removed job
      # leaves no member, so only this rule watches it.
      - alert: IngressProbesMissing
        expr: absent(up{job="blackbox-ingress"})
        for: 10m
        labels:
          severity: warning
          service: observability
        annotations:
          summary: 'observability: Prometheus has lost the blackbox-ingress scrape job.'
          description: >-
            No up{job="blackbox-ingress"} series exists, so the blackbox-ingress job is gone
            from prometheus.yml or renders no target. No ingress probe can fire until the
            series is back.
      # Every target at 0 means the exporter itself is down; a single target at 0 is
      # ScrapeTargetDown's, and an Alertmanager inhibit holds it back while this fires.
      - alert: BlackboxExporterDown
        expr: max(up{job="blackbox-ingress"}) == 0
        for: 5m
        labels:
          severity: critical
          service: blackbox-exporter
        annotations:
          summary: 'blackbox-exporter: Prometheus cannot scrape it for any ingress probe.'
          description: >-
            Every blackbox-ingress target has failed its scrape for 5 minutes, so the exporter
            is down or unreachable from Prometheus and no ingress probe runs. The per-service
            ingress alerts go quiet while it lasts. Read the blackbox-exporter pod's events and
            log in the homelab namespace.
          runbook_url: https://docs.local.daniel-hunter.com/alert-runbooks/#blackboxexporterdown
