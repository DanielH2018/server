# The B5 Pi checks of M6 (docs/archive/monitoring/m6-retire-kuma.md, batch B5), the
# SD-card health heartbeat and the container-recovery heartbeat, plus the watchdog daemon and
# audit-log heartbeats. All four ship in the homelab-daniel-pi
# package (hosts/components/pi-heartbeats/) and write a `homelab_check_*` textfile to the
# `node-pi` scrape job, so these rules read the metric contract of
# docs/archive/monitoring/m3-textfile-timer.md. Plain YAML, never Jinja:
# prometheus-rules.yaml.j2 carries this file verbatim.
#
# Severity: the SD-health rules are critical (they mail), the recovery rules are warnings
# (Discord alone). `service` is the host as a literal, because a node is not a workload (M3's
# open question 3). Each pair is `<Check>Failed` and `<Check>NotReporting`, the shape M3 fixed: NotReporting reads
# the timestamp against the deadline, falls back to absent_over_time over the same deadline, and
# leaves a dead exporter to the `targets` check. The exporter guard names `job="node-pi"`, because
# the Pi scrapes under that job rather than `node`.
#
# Each deadline is the DEADLINE_S its producer renders: 2 x the timers' 300s period + 300s, as M3
# derives it. Both literals of a NotReporting rule are pinned to it by
# hosts/tests/pi/test_pi_heartbeat_textfiles.py (M1 convention 1).
#
# `PiRecoveryFailed` fires on every cycle that restarted a container, not only on a failed
# restart, because the producer reports `down` for those on purpose (the `# DECIDED:` marker in
# hosts/components/pi-heartbeats/templates/pi-recovery-health.sh.j2) and the textfile follows it.
groups:
  - name: pi-checks
    rules:
      - alert: PiSdHealthFailed
        expr: homelab_check_success{check="pi-sd-health",origin="daniel-pi"} == 0
        labels:
          severity: critical
          service: daniel-pi
        annotations:
          summary: 'daniel-pi: the SD-card health heartbeat reported a failure.'
          description: >-
            Read the `pi-sd-health` line in /var/log/pi-health/health.log on daniel-pi for the
            failing leg: a nonzero ext4 errors_count, a bad rotated-log verdict, or a /var/log that
            is not log2ram's tmpfs. Only a nonzero errors_count calls for an fsck and a new card.
          runbook_url: https://docs.local.daniel-hunter.com/alert-runbooks/#pisdhealthfailed
      - alert: PiSdHealthNotReporting
        expr: |
          (
              time() - homelab_check_last_run_timestamp_seconds{check="pi-sd-health",origin="daniel-pi"} > 900
            or
              absent_over_time(homelab_check_last_run_timestamp_seconds{check="pi-sd-health",origin="daniel-pi"}[900s])
          )
          unless on (origin) (up{job="node-pi"} == 0)
        labels:
          severity: critical
          service: daniel-pi
        annotations:
          summary: 'daniel-pi: the SD-card health heartbeat has stopped reporting.'
          description: >-
            No pi-sd-health verdict newer than 15 minutes reached Prometheus from daniel-pi's textfile
            collector, so nothing confirms the SD card is being watched. Read
            `systemctl status homelab-pi-sd-health.timer` on daniel-pi, then
            /var/lib/node-exporter-textfile/pi-sd-health.prom.
          runbook_url: https://docs.local.daniel-hunter.com/alert-runbooks/#pisdhealthnotreporting
      - alert: PiRecoveryFailed
        expr: homelab_check_success{check="pi-recovery-health",origin="daniel-pi"} == 0
        labels:
          severity: warning
          service: daniel-pi
        annotations:
          summary: 'daniel-pi: the container-recovery heartbeat found a container not running.'
          description: >-
            pi-recovery-health on daniel-pi ended with status=down: a watched container was not
            running, whether or not its restart took. The `pi-recovery-health` line in
            /var/log/pi-health/health.log names the container, why it died and any dockerd
            fault.
      - alert: PiRecoveryNotReporting
        expr: |
          (
              time() - homelab_check_last_run_timestamp_seconds{check="pi-recovery-health",origin="daniel-pi"} > 900
            or
              absent_over_time(homelab_check_last_run_timestamp_seconds{check="pi-recovery-health",origin="daniel-pi"}[900s])
          )
          unless on (origin) (up{job="node-pi"} == 0)
        labels:
          severity: warning
          service: daniel-pi
        annotations:
          summary: 'daniel-pi: the container-recovery heartbeat has stopped reporting.'
          description: >-
            No pi-recovery-health verdict newer than 15 minutes reached Prometheus from daniel-pi,
            so nothing confirms its containers are watched. Read
            `systemctl status homelab-pi-recovery.timer` there. Setting
            optimize_pi_recovery_restart_enabled false drops the timer and fires this on purpose.
          runbook_url: https://docs.local.daniel-hunter.com/alert-runbooks/#pirecoverynotreporting
      # `for` outlasts the stop an initial_setup apply holds on purpose; wd_keepalive keeps the
      # watchdog meanwhile.
      - alert: PiWatchdogFailed
        expr: homelab_check_success{check="pi-watchdog-health",origin="daniel-pi"} == 0
        for: 30m
        labels:
          severity: warning
          service: daniel-pi
        annotations:
          summary: 'daniel-pi: watchdog.service is not active.'
          description: >-
            watchdog.service on daniel-pi has not been active for 30 minutes, so the
            `max-load-1 = 24` load test is off. wd_keepalive still holds the hardware watchdog.
            Run `sudo systemctl start watchdog` on daniel-pi.
          runbook_url: https://docs.local.daniel-hunter.com/alert-runbooks/#piwatchdogfailed
      - alert: PiWatchdogNotReporting
        expr: |
          (
              time() - homelab_check_last_run_timestamp_seconds{check="pi-watchdog-health",origin="daniel-pi"} > 900
            or
              absent_over_time(homelab_check_last_run_timestamp_seconds{check="pi-watchdog-health",origin="daniel-pi"}[900s])
          )
          unless on (origin) (up{job="node-pi"} == 0)
        labels:
          severity: warning
          service: daniel-pi
        annotations:
          summary: 'daniel-pi: the watchdog daemon heartbeat has stopped reporting.'
          description: >-
            No pi-watchdog-health verdict newer than 15 minutes reached Prometheus from daniel-pi's
            textfile collector, so nothing confirms the watchdog daemon is being watched. Read
            `systemctl status homelab-pi-watchdog-health.timer` on daniel-pi, then
            /var/lib/node-exporter-textfile/pi-watchdog-health.prom.
      # A suspended auditd keeps its unit active, so the producer reads audit.log's age. `for`
      # outlasts a boot:
      # log2ram restores the log with its old mtime and the Pi has no clock until NTP answers.
      - alert: PiAuditFailed
        expr: homelab_check_success{check="pi-audit-health",origin="daniel-pi"} == 0
        for: 30m
        labels:
          severity: warning
          service: daniel-pi
        annotations:
          summary: 'daniel-pi: auditd is not writing its log.'
          description: >-
            pi-audit-health on daniel-pi has read status=down for 30 minutes: auditd.service is not
            active, or /var/log/audit/audit.log has had no write for an hour. Read
            `df -m /var/log` on daniel-pi, then run `sudo systemctl restart auditd`.
          runbook_url: https://docs.local.daniel-hunter.com/alert-runbooks/#piauditfailed
      - alert: PiAuditNotReporting
        expr: |
          (
              time() - homelab_check_last_run_timestamp_seconds{check="pi-audit-health",origin="daniel-pi"} > 900
            or
              absent_over_time(homelab_check_last_run_timestamp_seconds{check="pi-audit-health",origin="daniel-pi"}[900s])
          )
          unless on (origin) (up{job="node-pi"} == 0)
        labels:
          severity: warning
          service: daniel-pi
        annotations:
          summary: 'daniel-pi: the audit-log heartbeat has stopped reporting.'
          description: >-
            No pi-audit-health verdict newer than 15 minutes reached Prometheus from daniel-pi's
            textfile collector, so nothing confirms auditd is being watched. Read
            `systemctl status homelab-pi-audit-health.timer` on daniel-pi, then
            /var/lib/node-exporter-textfile/pi-audit-health.prom.
