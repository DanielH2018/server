# The monitor-bridge check exporter's own rules. Plain YAML, never Jinja: prometheus-rules.yaml.j2
# carries this file verbatim. The design is docs/target-architecture/monitoring/m6-retire-kuma.md,
# "The bridge as an exporter". The series come from the `monitor-bridge` scrape job, port 9181,
# which monitor-bridge's files/verdict_export.py serves.
#
# Both rules are `for: 10m`, two INTERVALs of 300s. The pod has no readinessProbe, so a restart
# reads `up == 0` for a scrape, and the first cycle after it has not yet set every row's gauge.
# Without the hold, either rule would fire on every monitor-bridge deploy.
groups:
  - name: bridge-exporter
    rules:
      # DECIDED: `service` names the thing checked, not the bridge that evaluates it (operator,
      # 2026-10-23). The eight row rules carry wan, discord, r2, cloudflare, healthchecks, domain
      # and b2 (twice). Only MonitorBridgeDown and BridgeCheckStale keep `service: monitor-bridge`, since
      # the bridge itself is what they report on. A page reading "B2Unreachable, service
      # monitor-bridge" points the operator at the wrong component. No route or inhibit matches
      # `service`; Alertmanager groups by [alertname, service], and alertname already separates
      # these rules.
      # THE WAN FAMILY: the gate row and the five rows behind it. Each rule reads one row's
      # `homelab_check_success` gauge, which the exporter sets to 0 when the row's verdict is
      # down. A dependent whose gate reads down is skipped and exports 0 in the same cycle as
      # the gate, so source and targets reach Alertmanager in one batch. No rule has a `for:`:
      # monitor-bridge's WAN body already needs both providers to fail, and no dependent is a
      # `startup_grace` row. `requires: wan` marks a dependent for the inhibit rule in
      # alertmanager-secret.yaml.j2, whose source is WANUnreachable. A row with no series stays
      # quiet here: BridgeCheckStale owns a missing row.
      - alert: WANUnreachable
        expr: homelab_check_success{job="monitor-bridge", check="wan_reachable"} == 0
        labels:
          severity: critical
          service: wan
        annotations:
          summary: monitor-bridge cannot reach the public internet.
          description: >-
            Check the router and the modem. Both WAN probe providers failed from monitor-bridge, so
            the house has no working link or no DNS, and the rows that need the internet are held.
            The probe's errors: `kubectl -n homelab logs deploy/monitor-bridge | grep 'DOWN
            wan_reachable '`.
          runbook_url: https://docs.local.daniel-hunter.com/alert-runbooks/#wanunreachable
      - alert: DiscordDeliveryFailing
        expr: homelab_check_success{job="monitor-bridge", check="discord"} == 0
        labels:
          severity: critical
          service: discord
          requires: wan
        annotations:
          summary: >-
            {{ with query "homelab_check_detail{job='monitor-bridge',check='discord'}" }}Alert delivery is failing on {{ range $i, $s := . | sortByLabel "detail" }}{{ if $i }}, {{ end }}{{ $s.Labels.detail }}{{ end }}.{{ else }}A Discord webhook no longer resolves, or the SMTP backstop login failed.{{ end }}
          description: >-
            Rotate the named Discord webhook in SOPS and redeploy its consumer, or fix the Gmail
            SMTP backstop login. The monitor-bridge log names which: `kubectl -n homelab logs
            deploy/monitor-bridge | grep 'DOWN discord '`.
          runbook_url: https://docs.local.daniel-hunter.com/alert-runbooks/#discorddeliveryfailing
      - alert: R2FreeTierHeadroomLow
        expr: homelab_check_success{job="monitor-bridge", check="r2_usage"} == 0
        labels:
          severity: critical
          service: r2
          requires: wan
        annotations:
          summary: >-
            {{ with query "homelab_check_detail{job='monitor-bridge',check='r2_usage'}" }}R2 usage is past 80% of the free tier on {{ range $i, $s := . | sortByLabel "detail" }}{{ if $i }}, {{ end }}{{ $s.Labels.detail }}{{ end }}.{{ else }}R2 usage is past 80% of the free tier on at least one arm.{{ end }}
          description: >-
            Month-to-date R2 storage, Class A operations, Class B operations or incomplete multipart
            uploads passed 80% of the free tier. Cloudflare offers no cap on R2, so this is the only
            boundary.
          runbook_url: https://docs.local.daniel-hunter.com/longhorn-backup-tiering/
      - alert: CloudflareIPRangesDrifted
        expr: homelab_check_success{job="monitor-bridge", check="cloudflare_ips_drift"} == 0
        labels:
          severity: warning
          service: cloudflare
          requires: wan
        annotations:
          summary: >-
            {{ with query "homelab_check_detail{job='monitor-bridge',check='cloudflare_ips_drift'}" }}Cloudflare's IP ranges differ from cloudflare_ips: {{ range $i, $s := . | sortByLabel "detail" }}{{ if $i }}, {{ end }}{{ $s.Labels.detail }}{{ end }}.{{ else }}Cloudflare's published IP ranges differ from the repo's cloudflare_ips list, or fetching them failed.{{ end }}
          description: >-
            cloudflare_ips in group_vars/all.yml sets Traefik's trustedIPs and the netpol
            allow-list. Update it and redeploy traefik, netpol-baseline and monitor-bridge. A
            failed fetch is retried every cycle; a match is re-checked daily.
      - alert: HealthchecksConsoleDrifted
        expr: homelab_check_success{job="monitor-bridge", check="healthchecks_drift"} == 0
        labels:
          severity: warning
          service: healthchecks
          requires: wan
        annotations:
          summary: >-
            {{ with query "homelab_check_detail{job='monitor-bridge',check='healthchecks_drift'}" }}Healthchecks.io checks differ from the documented schedule: {{ range $i, $s := . | sortByLabel "detail" }}{{ if $i }}, {{ end }}{{ $s.Labels.detail }}{{ end }}.{{ else }}A Healthchecks.io dead-man check differs from the documented schedule.{{ end }}
          description: >-
            The monitor-bridge log names each differing or missing slug. Fix the console, or
            change docs/healthchecks-io-deadman.md and monitor_bridge_healthchecks_expected
            together and redeploy monitor-bridge.
            Its DOWN line: `kubectl -n homelab logs deploy/monitor-bridge | grep 'DOWN healthchecks_drift '`.
          runbook_url: https://docs.local.daniel-hunter.com/healthchecks-io-deadman/
      - alert: DomainRegistrationUnreadable
        expr: homelab_check_success{job="monitor-bridge", check="domain_registration"} == 0
        labels:
          severity: warning
          service: domain
          requires: wan
        annotations:
          summary: monitor-bridge cannot read the domain's registration expiry over RDAP.
          description: >-
            The registry's RDAP record did not answer or carries no expiration event, so the
            days-left gauge holds its last read, or is absent after a restart. The
            monitor-bridge log names the error.
            Its DOWN line: `kubectl -n homelab logs deploy/monitor-bridge | grep 'DOWN domain_registration '`.
      # The registration's days left, which the domain_registration row exports as a gauge.
      # A lapsed domain stops ACME renewal, every public route and the WireGuard
      # endpoint name at once. The gauge keeps its last value through an RDAP failure, so no
      # `requires` label: a WAN outage does not move it. The page fires beside the warning,
      # since Alertmanager routes each on its own severity.
      - alert: DomainRegistrationExpiringSoon
        expr: homelab_domain_registration_expiry_days{job="monitor-bridge"} <= 45
        labels:
          severity: warning
          service: domain
        annotations:
          summary: >-
            The domain registration expires in {{ $value | printf "%.0f" }} days.
          description: >-
            The registry's RDAP record dates the domain's expiry {{ $value | printf "%.0f" }}
            days out. Renew it at the registrar, and turn on auto-renew if it is off.
      - alert: DomainRegistrationExpiring
        expr: homelab_domain_registration_expiry_days{job="monitor-bridge"} <= 14
        labels:
          severity: critical
          service: domain
        annotations:
          summary: >-
            The domain registration expires in {{ $value | printf "%.0f" }} days.
          description: >-
            The registry's RDAP record dates the domain's expiry {{ $value | printf "%.0f" }}
            days out. A lapse takes down ACME renewal, every public route, the WireGuard
            endpoint name and the alert plane's own notifications. Renew it at the registrar.
          runbook_url: https://docs.local.daniel-hunter.com/alert-runbooks/#domainregistrationexpiring
      # `ScrapeTargetDown` (service monitor-bridge, files/rules/
      # scrape-targets.yaml) pages a failed scrape of this job, and M1 convention 5 allows one
      # pager. The absent() arm is what that rule cannot see: a scrape job removed from
      # prometheus.yml. This rule pages that case.
      - alert: MonitorBridgeDown
        expr: up{job="monitor-bridge"} == 0 or absent(up{job="monitor-bridge"})
        for: 10m
        labels:
          severity: critical
          service: monitor-bridge
        annotations:
          summary: Prometheus cannot scrape monitor-bridge's check exporter.
          description: >-
            up{job="monitor-bridge"} has been 0 or missing for 10 minutes, so either the
            monitor-bridge pod is down or the monitor-bridge scrape job is gone from
            prometheus.yml. Read the pod's events and log in the homelab namespace.
          runbook_url: https://docs.local.daniel-hunter.com/alert-runbooks/#monitorbridgedown
      # This rule is the class-3 guard of
      # docs/failure-classes.md: a run loop that hangs behind a live HTTP thread keeps `up` at 1
      # and serves stale gauges. It is one aggregate alert, so a hung loop pages once rather than
      # once per row. The first arm finds any row whose timestamp is older than the row's own
      # deadline. The second finds a row count below homelab_check_rows, which the exporter sets
      # from the check table, so no literal here goes stale when a row is deleted. A dead
      # exporter has neither series, and MonitorBridgeDown owns that case.
      - alert: BridgeCheckStale
        expr: |
          count(
            time() - homelab_check_last_run_timestamp_seconds{job="monitor-bridge"}
            > homelab_check_deadline_seconds{job="monitor-bridge"}
          )
          or
          (
            count(homelab_check_success{job="monitor-bridge"})
            < on() homelab_check_rows{job="monitor-bridge"}
          )
        for: 10m
        labels:
          severity: critical
          service: monitor-bridge
        annotations:
          summary: >-
            {{ with query "time() - homelab_check_last_run_timestamp_seconds{job='monitor-bridge'} > homelab_check_deadline_seconds{job='monitor-bridge'}" }}monitor-bridge's verdicts have gone stale for {{ range $i, $s := . | sortByLabel "check" }}{{ if $i }}, {{ end }}{{ $s.Labels.check }}{{ end }}.{{ else }}monitor-bridge exports fewer check rows than homelab_check_rows counts.{{ end }}
          description: >-
            Read the monitor-bridge pod's log in the homelab namespace. The scrape works, but for 10
            minutes a row has aged past its deadline or fewer rows export homelab_check_success than
            homelab_check_rows counts, so the run loop is hung or skipping rows.
          runbook_url: https://docs.local.daniel-hunter.com/alert-runbooks/#bridgecheckstale
      # THE B2 FAMILY: the gate row and the one row behind it. Both rules are `for: 10m`, so the
      # two-minute gate dip of the weekly reboot does not page. The two rules share one `for:`
      # on purpose: the dependent must not page before its inhibit source exists, and both go
      # to 0 in the same cycle.
      # `B2Unreachable` sources the inhibit in alertmanager-secret.yaml.j2 for `requires: b2`.
      # The gate row reports a cap denial as down, so a cap breach pages once, and the
      # dependent's body is not called while the gate reads down, which keeps a billed listing
      # off every 300s cycle. B2 is the WAN gate's peer, not behind it, so a WAN outage lights
      # both. A row with no series stays quiet here: BridgeCheckStale owns a missing row.
      - alert: B2Unreachable
        expr: homelab_check_success{job="monitor-bridge", check="b2_reachable"} == 0
        for: 10m
        labels:
          severity: critical
          service: b2
        annotations:
          summary: Backblaze B2 refuses monitor-bridge's key, or the transaction cap is exceeded.
          description: >-
            monitor-bridge authenticates against B2 at most every 30 minutes. A cap denial looks the
            same as data loss, so read the monitor-bridge log message before assuming either.
            Its DOWN line: `kubectl -n homelab logs deploy/monitor-bridge | grep 'DOWN b2_reachable '`.
          runbook_url: https://docs.local.daniel-hunter.com/longhorn-backup-tiering/
      - alert: B2FreeTierHeadroomLow
        expr: homelab_check_success{job="monitor-bridge", check="b2_storage"} == 0
        for: 10m
        labels:
          severity: critical
          service: b2
          requires: b2
        annotations:
          summary: >-
            {{ with query "homelab_check_detail{job='monitor-bridge',check='b2_storage'}" }}The B2 storage check failed: {{ range $i, $s := . | sortByLabel "detail" }}{{ if $i }}, {{ end }}{{ $s.Labels.detail }}{{ end }}.{{ else }}B2 bucket usage is past the free-tier threshold.{{ end }}
          description: >-
            A drain is nearly free, but a prune pays per deleted backup, so read
            longhorn-backup-tiering before deleting anything.
          runbook_url: https://docs.local.daniel-hunter.com/longhorn-backup-tiering/
      # THE UNGATED FAMILY: the three rows with no `gate` column value. None reads
      # Prometheus, Loki or the WAN, and none is a `startup_grace` row, so no rule here carries
      # a `requires` label or a `for:`. `arr_queue` and `ha_heartbeat` streak one arm inside the
      # body (ARR_FETCH_CONSECUTIVE, HA_CONSECUTIVE) while their other arms page at once, and a
      # `for:` would hold the whole row (m6-retire-kuma.md, "Gates and grace"). Each rule's
      # `service` names the thing checked, per the DECIDED block above. A row with no series
      # stays quiet here: BridgeCheckStale owns a missing row.
      - alert: ArrQueueNeedsReview
        expr: homelab_check_success{job="monitor-bridge", check="arr_queue"} == 0
        labels:
          severity: warning
          service: arr
        annotations:
          summary: >-
            {{ with query "homelab_check_detail{job='monitor-bridge',check='arr_queue'}" }}Queue items need review: {{ range $i, $s := . | sortByLabel "detail" }}{{ if $i }}, {{ end }}{{ $s.Labels.detail }}{{ end }}.{{ else }}A Sonarr or Radarr queue item needs review, or an arr API stayed unreachable.{{ end }}
          description: >-
            A queue item is in warning, importBlocked, or importPending with a status message.
            An arr API that stays
            unreachable past ARR_FETCH_CONSECUTIVE cycles pages the same way. The monitor-bridge
            log in the homelab namespace names the release and the app.
      - alert: EtcdRestoreDrillFailing
        expr: homelab_check_success{job="monitor-bridge", check="etcd_restore_drill"} == 0
        labels:
          severity: warning
          service: etcd
        annotations:
          summary: The weekly etcd restore drill has not passed within 8 days.
          description: >-
            No list-only drill has ever passed, the last-success-list-only stamp on daniel-box is
            older than 8 days, or the pod cannot read the stamp. Run `journalctl -t
            etcd-restore-drill` on daniel-box and check the stamp's mode.
          runbook_url: https://docs.local.daniel-hunter.com/k3s-etcd-restore/
      - alert: HomeAssistantAutomationsStalled
        expr: homelab_check_success{job="monitor-bridge", check="ha_heartbeat"} == 0
        labels:
          severity: warning
          service: home-assistant
        annotations:
          summary: >-
            {{ with query "homelab_check_detail{job='monitor-bridge',check='ha_heartbeat'}" }}Home Assistant's check is failing on {{ range $i, $s := . | sortByLabel "detail" }}{{ if $i }}, {{ end }}{{ $s.Labels.detail }}{{ end }}.{{ else }}Home Assistant's scheduler heartbeat is stale, or HA banned an IP.{{ end }}
          description: >-
            Either HA is up with its automations not running, or HA banned an IP in the last
            hour. A ban of a cluster gateway locks out everything behind it, so read
            /config/ip_bans.yaml on a ban.
      # THE HOST-PACKAGES ROW: it sits in none of the four families. Its `gate` is `prometheus`
      # and it sits under `EXPORTER_DEPENDENT["node"]`: its builder arms read series that
      # daniel-box's node exporter publishes from its textfile directory, so a dead exporter
      # makes them absent, and Scrape Targets already names the dead exporter.
      # `unless on() (up{job="node"} == 0)` keeps the bridge's suppression: the rule is quiet
      # while any `node` target is down, as the bridge skips the row estate-wide (the DECIDED
      # block in monitor-bridge's check.py). The exclusion is in the expression, so the rule
      # needs no `requires` label and no inhibit rule. The `prometheus` gate needs no
      # counterpart, because Prometheus cannot evaluate this rule while it is down and the
      # Watchdog pages that. `for: 10m`: the row's two arms hold their own windows
      # (BUILDER_MAX_FETCH_AGE_S and BUILDER_MAX_LAG_S), and two bridge cycles of down keep the
      # weekly reboot's two-minute dip from paging. The row is not `startup_grace`.
      - alert: HostPackageBuilderStalled
        expr: |
          homelab_check_success{job="monitor-bridge", check="host_packages"} == 0
          unless on() (up{job="node"} == 0)
        for: 10m
        labels:
          severity: warning
          service: host-packages
        annotations:
          summary: >-
            {{ with query "homelab_check_detail{job='monitor-bridge',check='host_packages'}" }}The host-package builder is stalled: {{ range $i, $s := . | sortByLabel "detail" }}{{ if $i }}, {{ end }}{{ $s.Labels.detail }}{{ end }}.{{ else }}The host-package builder has stopped fetching master or has left a commit unbuilt.{{ end }}
          description: >-
            The builder fetched master over 30 minutes ago, or a commit has waited over 7200
            seconds to be built. The monitor-bridge log names the reason and sha, and
            docs/host-packages.md has the fix for each reason.
            Its DOWN line: `kubectl -n homelab logs deploy/monitor-bridge | grep 'DOWN host_packages '`.
          runbook_url: https://docs.local.daniel-hunter.com/host-packages/
      # THE STARTUP-GRACE FAMILY: the rows whose `gate` column reads `startup_grace`. The bridge
      # holds nothing for them, so each rule's `for: 10m` is the whole grace, and it rides out
      # the weekly reboot. A gauge that reads 0 for one 300s cycle spans five or six 1-minute
      # samples, so `for: 5m` fires on a one-cycle blip or not by scrape alignment. `for: 10m`
      # needs two consecutive down cycles. `n8n` and `speedtest` keep their in-body streaks,
      # on which the `for:` stacks. No row here has a gate, so no rule carries `requires` and
      # no inhibit rule reaches them. A row with no series stays quiet here: BridgeCheckStale
      # owns a missing row.
      - alert: N8nWorkflowsFailing
        expr: homelab_check_success{job="monitor-bridge", check="n8n"} == 0
        for: 10m
        labels:
          severity: warning
          service: n8n
        annotations:
          summary: >-
            {{ with query "homelab_check_detail{job='monitor-bridge',check='n8n'}" }}n8n workflows failing repeatedly: {{ range $i, $s := . | sortByLabel "detail" }}{{ if $i }}, {{ end }}{{ $s.Labels.detail }}{{ end }}.{{ else }}An active n8n workflow failed repeatedly, or several workflows are failing.{{ end }}
          description: >-
            An active workflow failed 3 times in a row, or 2 or more workflows are each failing
            repeatedly. The monitor-bridge log names the workflow; open its last execution in n8n.
            Its DOWN line: `kubectl -n homelab logs deploy/monitor-bridge | grep 'DOWN n8n '`.
      - alert: BazarrHealthDegraded
        expr: homelab_check_success{job="monitor-bridge", check="bazarr"} == 0
        for: 10m
        labels:
          severity: warning
          service: bazarr
        annotations:
          summary: >-
            {{ with query "homelab_check_detail{job='monitor-bridge',check='bazarr'}" }}Bazarr reports a problem with {{ range $i, $s := . | sortByLabel "detail" }}{{ if $i }}, {{ end }}{{ $s.Labels.detail }}{{ end }}.{{ else }}Bazarr rejects its sonarr or radarr API key, or reports a health issue.{{ end }}
          description: >-
            Bazarr's own copy of the sonarr or radarr API key is rejected, or Bazarr reports a
            health issue. Bazarr holds those keys in its UI, so a key rotation misses it. The
            monitor-bridge log names which.
            Its DOWN line: `kubectl -n homelab logs deploy/monitor-bridge | grep 'DOWN bazarr '`.
      - alert: ProwlarrIndexersFailing
        expr: homelab_check_success{job="monitor-bridge", check="prowlarr_indexers"} == 0
        for: 10m
        labels:
          severity: warning
          service: prowlarr
        annotations:
          summary: >-
            {{ with query "homelab_check_detail{job='monitor-bridge',check='prowlarr_indexers'}" }}Prowlarr indexers failing for a week or more: {{ range $i, $s := . | sortByLabel "detail" }}{{ if $i }}, {{ end }}{{ $s.Labels.detail }}{{ end }}.{{ else }}A Prowlarr indexer has been failing for a week or more.{{ end }}
          description: >-
            Prowlarr's own initialFailure puts an indexer at a week or more of failures. The Pirate
            Bay and 1337x are ignored as chronic flappers. The monitor-bridge log names the
            indexer.
            Its DOWN line: `kubectl -n homelab logs deploy/monitor-bridge | grep 'DOWN prowlarr_indexers '`.
      - alert: SmartHealthFailing
        expr: homelab_check_success{job="monitor-bridge", check="scrutiny"} == 0
        for: 10m
        labels:
          severity: critical
          service: scrutiny
        annotations:
          summary: >-
            {{ with query "homelab_check_detail{job='monitor-bridge',check='scrutiny'}" }}Scrutiny reports {{ range $i, $s := . | sortByLabel "detail" }}{{ if $i }}, {{ end }}{{ $s.Labels.detail }}{{ end }}.{{ else }}Scrutiny reports a failing drive, stale collector data or high NVMe wear.{{ end }}
          description: >-
            A drive failed its SMART self-assessment or an attribute threshold, its NVMe wear passed
            80%, or its collector data is older than 26h. This is the only drive-failure page. The
            log names the drive: `kubectl -n homelab logs deploy/monitor-bridge | grep 'DOWN
            scrutiny '`.
          runbook_url: https://docs.local.daniel-hunter.com/alert-runbooks/#smarthealthfailing
      - alert: SpeedtestDegraded
        expr: homelab_check_success{job="monitor-bridge", check="speedtest"} == 0
        for: 10m
        labels:
          severity: warning
          service: speedtest
        annotations:
          summary: >-
            {{ with query "homelab_check_detail{job='monitor-bridge',check='speedtest'}" }}The newest speedtest result failed on {{ range $i, $s := . | sortByLabel "detail" }}{{ if $i }}, {{ end }}{{ $s.Labels.detail }}{{ end }}.{{ else }}The newest speedtest result is stale, incomplete or under 100 Mbps.{{ end }}
          description: >-
            The last speedtest-tracker run is older than 8 h, did not complete, or downloaded
            under 100 Mbps. Open the speedtest UI and check its scheduler and last result.
      - alert: AirflowSchedulerDown
        expr: homelab_check_success{job="monitor-bridge", check="airflow_scheduler"} == 0
        for: 10m
        labels:
          severity: warning
          service: airflow
        annotations:
          summary: Airflow's scheduler is not running, so no warehouse rollup starts.
          description: >-
            The scheduler's own health server answers 503, or does not answer at all. No DAG run
            starts while the scheduler is down, so no `check` task fails either. Read the
            airflow-scheduler pod's state and log in the homelab namespace.
            Its DOWN line: `kubectl -n homelab logs deploy/monitor-bridge | grep 'DOWN airflow_scheduler '`.
