          /
            node_filesystem_size_bytes{origin="daniel-box", mountpoint=~"/|/boot|/boot/efi"}
        )
      ) > 90
    labels:
      severity: critical
      service: daniel-box
    annotations:
      summary: >-
        {{ $labels.origin }} {{ $labels.mountpoint }} is {{ $value | printf "%.0f" }}% full.
      description: >-
        {{ $labels.origin }} has its {{ $labels.mountpoint }} filesystem over 90% full. Longhorn stops
        scheduling replicas on a node at 75%. Read `df -h` on the host.
      runbook_url: https://docs.local.daniel-hunter.com/alert-runbooks/#hostdiskfull
