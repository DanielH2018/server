    expr: |
      label_replace(
        up{job="node-pi", origin="daniel-pi"} == 1
        unless on (origin, instance)
          node_load5{origin="daniel-pi"},
        "arm", "load", "", "")
      or
      label_replace(
        up{job="node-pi", origin="daniel-pi"} == 1
        unless on (origin, instance)
          node_memory_MemAvailable_bytes{origin="daniel-pi"},
        "arm", "memory", "", "")
      or
      label_replace(
        up{job="node-pi", origin="daniel-pi"} == 1
        unless on (origin, instance)
          node_filesystem_size_bytes{origin="daniel-pi", fstype!="tmpfs"},
        "arm", "filesystem", "", "")
      or
      label_replace(
        up{job="node-pi", origin="daniel-pi"} == 1
        unless on (origin, instance)
          node_filesystem_readonly{origin="daniel-pi", mountpoint=~"/|/boot/firmware"},
        "arm", "read-only", "", "")
      or
      label_replace(
        up{job="node-pi", origin="daniel-pi"} == 1
        unless on (origin, instance)
          node_timex_sync_status{origin="daniel-pi"},
        "arm", "clock", "", "")
    for: 10m
    labels:
      severity: warning
      service: daniel-pi
    annotations:
      summary: daniel-pi publishes no {{ $labels.arm }} series.
      description: >-
        daniel-pi is scraped but its node-exporter publishes no series for the {{ $labels.arm }} arm of
        the Pi checks, so nothing is watching it. Read the exporter on the host.
  - alert: PiUndervoltageMissing
    expr: |
      label_replace(
        up{job="node-pi", origin="daniel-pi"} == 1
        unless on (origin, instance)
          node_hwmon_in_lcrit_alarm_volts{origin="daniel-pi"},
        "arm", "undervoltage", "", "")
    for: 10m
    labels:
      severity: warning
      service: daniel-pi
    annotations:
      summary: daniel-pi publishes no undervoltage series.
      description: >-
        daniel-pi is scraped but its node-exporter publishes no node_hwmon_in_lcrit_alarm_volts series,
        so PiUndervoltage has nothing to read and a latched undervoltage alarm goes unseen. A renamed
        sensor or a blind hwmon collector is the usual cause. Read the Pi's hwmon collector on the host.
  - alert: UPSOnBattery
    expr: |
      max by (job, instance) (network_ups_tools_ups_status{flag="OB"}) > 0.5
    for: 10m
    labels:
      severity: critical
      service: nut-exporter
    annotations:
      summary: >-
        The UPS is on battery{{ with query "max(network_ups_tools_battery_charge)" }}, {{ . | first |
        value | printf "%.0f" }}% charged{{ end }}{{ with query "max(network_ups_tools_battery_runtime)"
        }}, about {{ . | first | value | humanizeDuration }} of runtime left{{ end }}.
      description: >-
        NUT reports ups.status OB for 10 minutes: mains power is gone and the UPS is carrying the load.
        Read the UPS on the NUT host.
      runbook_url: https://docs.local.daniel-hunter.com/alert-runbooks/#upsonbattery
  - alert: UPSBatteryLow
    expr: |
      max by (job, instance) (network_ups_tools_battery_charge) < 50
      unless on ()
        (max(network_ups_tools_ups_status{flag="OB"}) > 0.5)
    for: 10m
    labels:
      severity: critical
      service: nut-exporter
    annotations:
      summary: The UPS battery is at {{ $value | printf "%.0f" }}%.
      description: >-
        The UPS battery charge is under 50% (UPS_CHARGE_MIN_PCT) while mains power is on, for 10 minutes.
        Read the UPS on the NUT host.
      runbook_url: https://docs.local.daniel-hunter.com/alert-runbooks/#upsbatterylow
  - alert: UPSRuntimeLow
    expr: |
      max by (job, instance) (network_ups_tools_battery_runtime) < 300
      unless on ()
        (max(network_ups_tools_ups_status{flag="OB"}) > 0.5)
    for: 10m
    labels:
      severity: critical
      service: nut-exporter
    annotations:
      summary: The UPS has {{ $value | humanizeDuration }} of runtime.
      description: >-
        The UPS estimates under 5 minutes of runtime (UPS_RUNTIME_MIN_S) on a full charge, for 10 minutes.
        The battery has aged. Read the UPS on the NUT host.
      runbook_url: https://docs.local.daniel-hunter.com/alert-runbooks/#upsruntimelow
  - alert: UPSReplaceBattery
    expr: |
      max by (job, instance) (network_ups_tools_ups_status{flag="RB"}) > 0.5
      unless on ()
        (max(network_ups_tools_ups_status{flag="OB"}) > 0.5)
    for: 10m
    labels:
      severity: critical
      service: nut-exporter
    annotations:
      summary: The UPS asks for a battery replacement.
      description: >-
        NUT reports ups.status RB for 10 minutes: the UPS's own self-test says the battery needs replacing.
        This trips before charge or runtime read low.
      runbook_url: https://docs.local.daniel-hunter.com/alert-runbooks/#upsreplacebattery
  - alert: UPSSensorAbsent
    expr: |
      label_replace(
        up{job="nut"} == 1
        unless on (job, instance)
          network_ups_tools_battery_charge,
        "arm", "charge", "", "")
      or
      label_replace(
        up{job="nut"} == 1
        unless on (job, instance)
          network_ups_tools_battery_runtime,
        "arm", "runtime", "", "")
      or
      label_replace(
        up{job="nut"} == 1
        unless on (job, instance)
          network_ups_tools_ups_status{flag="RB"},
        "arm", "replace-battery", "", "")
      or
      label_replace(
        up{job="nut"} == 1
        unless on (job, instance)
          network_ups_tools_ups_status{flag="OB"},
        "arm", "on-battery", "", "")
    for: 10m
    labels:
      severity: critical
      service: nut-exporter
    annotations:
      summary: The UPS {{ $labels.arm }} series is absent.
      description: >-
        The NUT exporter answers its scrape but publishes no {{ $labels.arm }} series for 10 minutes,
        so the UPS is unmonitored on that arm. A renamed or removed series is the usual cause. Read nut-exporter's
        /ups_metrics.
      runbook_url: https://docs.local.daniel-hunter.com/alert-runbooks/#upssensorabsent
