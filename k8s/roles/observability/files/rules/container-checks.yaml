# The cAdvisor arms of the `restarts`, `oom` and `cpu` checks. Plain YAML, never Jinja:
# prometheus-rules.yaml.j2 carries this file verbatim. The design is M6's batch A2
# (docs/archive/monitoring/m6-retire-kuma.md, "Phase A") on M2's recipe.
#
# THE SELECTOR. Every query selects `container!="", container!="POD"`.
# DECIDED: cAdvisor metrics are never pinned to an `origin`. `origin` is applied by exactly one
# relabel rule, on the `node` job (observability/templates/prometheus.yaml.j2); the
# kubernetes-cadvisor job has none. PromQL does not match an absent label, so an origin-pinned
# cAdvisor query selects the empty vector and every rule built on it reads green forever,
# leaving OOM kills and sustained CFS throttling unmonitored outright.
#
# THE JOIN. A per-pod alert takes its C7 `service` label from homelab:pod_service:info, in the
# shape files/rules/k8s-workloads.yaml explains: a pod outside the mapping's domain fires with
# service="unmapped" and is never dropped.
#
# `for:` IS N x 300s for a bridge streak of N cycles (CPU_CONSECUTIVE=3, CADVISOR_CONSECUTIVE=2).
# N cycles span only (N-1) x 300s, but the bridge's first breaching cycle lands up to 300s after
# the condition starts, so N x 300s pages at most one cycle after the bridge would. The bridge
# also samples once per cycle, so a dip between two cycles never breaks its streak, and
# ContainerCPUThrottled smooths its condition over 5m to match (its comment says why).
# The restart and OOM arms have no streak: their 15m and 1h windows already hold them. Every
# range window is at least four scrape intervals, because the kubernetes-cadvisor job scrapes
# every 1m (see its comment in prometheus.yaml.j2).
groups:
  - name: container-checks
    rules:
      # K8sContainerCrashLooping counts the kubelet's restart counter; this arm counts
      # container_start_time_seconds changing, which also sees a recreated container.
      - alert: ContainerRestartLoop
        expr: |
          (
              (
                sum by (namespace, pod) (
                  changes(container_start_time_seconds{container!="", container!="POD"}[15m])
                ) > 3
              )
            * on(namespace, pod) group_left(service)
              homelab:pod_service:info
          )
          or
          label_replace(
              (
                sum by (namespace, pod) (
                  changes(container_start_time_seconds{container!="", container!="POD"}[15m])
                ) > 3
              )
            unless on(namespace, pod)
              homelab:pod_service:info,
            "service", "unmapped", "", ""
          )
        labels:
          severity: warning
        annotations:
          summary: >-
            {{ $labels.namespace }}/{{ $labels.pod }}: restarted a container more than 3 times in 15
            minutes.
          description: >-
            {{ $labels.pod }} had {{ $value | printf "%.0f" }} container starts in the last 15
            minutes. Read `kubectl -n {{ $labels.namespace }} describe pod {{ $labels.pod }}` for the last state.
      # Resolves one hour after the kill, so read the notification for the evidence.
      - alert: ContainerOOMKilled
        expr: |
          (
              (
                sum by (namespace, pod) (
                  increase(container_oom_events_total{container!="", container!="POD"}[1h])
                ) > 0
              )
            * on(namespace, pod) group_left(service)
              homelab:pod_service:info
          )
          or
          label_replace(
              (
                sum by (namespace, pod) (
                  increase(container_oom_events_total{container!="", container!="POD"}[1h])
                ) > 0
              )
            unless on(namespace, pod)
              homelab:pod_service:info,
            "service", "unmapped", "", ""
          )
        labels:
          severity: warning
        annotations:
          summary: >-
            {{ $labels.namespace }}/{{ $labels.pod }}: a container was OOM-killed in the last hour.
          description: >-
            {{ $labels.pod }} had an OOM kill within the last hour. Raise the container's memory
            limit in its role, or find the leak.
      # BOTH gates: the cores floor keeps a 0.1-cpu sidecar that bursts over its period slice from
      # paging; no cpu limit gives 0/0 = NaN, which no comparison matches.
      # max_over_time(...[5m:1m]) holds the condition through dips that would reset a bare `for:`,
      # and keeps the alert up to 5m after it clears.
      # The alert stays per pod, so a streak hopping between pods does not page.
      - alert: ContainerCPUThrottled
        expr: |
          (
              (
                max_over_time((
                    (
                        sum by (namespace, pod) (rate(container_cpu_cfs_throttled_periods_total{container!="", container!="POD"}[15m]))
                      /
                        sum by (namespace, pod) (rate(container_cpu_cfs_periods_total{container!="", container!="POD"}[15m]))
                    ) > 0.25
                  and
                    sum by (namespace, pod) (rate(container_cpu_cfs_throttled_seconds_total{container!="", container!="POD"}[15m])) > 0.05
                )[5m:1m])
              )
            * on(namespace, pod) group_left(service)
              homelab:pod_service:info
          )
          or
          label_replace(
              (
                max_over_time((
                    (
                        sum by (namespace, pod) (rate(container_cpu_cfs_throttled_periods_total{container!="", container!="POD"}[15m]))
                      /
                        sum by (namespace, pod) (rate(container_cpu_cfs_periods_total{container!="", container!="POD"}[15m]))
                    ) > 0.25
                  and
                    sum by (namespace, pod) (rate(container_cpu_cfs_throttled_seconds_total{container!="", container!="POD"}[15m])) > 0.05
                )[5m:1m])
              )
            unless on(namespace, pod)
              homelab:pod_service:info,
            "service", "unmapped", "", ""
          )
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.namespace }}/{{ $labels.pod }}: pinned at its CPU limit.'
          description: >-
            {{ $labels.pod }} had {{ $value | humanizePercentage }} of its CFS periods throttled
            over 15 minutes, for 15 minutes running. Raise the limit in its role or accept it;
            short bursts never reach this alert.
      # The cAdvisor census, one arm per check because the three vectors
      # differ in size: the cpu arm sees only pods that carry a cpu limit.
      # DECIDED: floor 20 pods, from measurement rather than intuition. Over the 7d to 2026-08-27
      # the pre-filter counts never fell below 98 (restarts), 98 (oom) and 70 (cpu); live values
      # were 99/99/71. The cpu arm counts the DIVISION, not its denominator: a PromQL binary op
      # drops series present on only one side, so re-measure from the division. 20 sits 3.5x
      # under the smallest trough, so a deploy draining pods cannot reach it, while a broken
      # selector or a vanished kubernetes-cadvisor job lands at 0. One floor for all three arms:
      # a floor applied to two of three would reproduce the selector-drift class inside its own
      # fix. Lowering it below about 70 blinds the cpu arm first.
      # `or vector(0)` is the zero-series case: a vanished kubernetes-cadvisor job leaves every
      # count() empty, and without it the arm would be silent exactly when blind. `for: 10m` is
      # CADVISOR_CONSECUTIVE (2) x 300s, and no shorter than ScrapeTargetDown's 10m, so a dead scrape pages its own alert first. No
      # inhibit: the per-pod rules read counters that a dead scrape leaves empty, so they go
      # quiet, and an inhibit keyed on ScrapeTargetDown would also mute this rule while one
      # node's cAdvisor is down and a selector break empties the other's. The `arm` label names
      # which vector is thin.
      - alert: CAdvisorCoverageShortfall
        expr: |
          label_replace(
            (count(sum by (namespace, pod) (changes(container_start_time_seconds{container!="", container!="POD"}[15m]))) or vector(0)) < 20,
            "arm", "restarts", "", "")
          or
          label_replace(
            (count(sum by (namespace, pod) (increase(container_oom_events_total{container!="", container!="POD"}[1h]))) or vector(0)) < 20,
            "arm", "oom", "", "")
          or
          label_replace(
            (count(
                sum by (namespace, pod) (rate(container_cpu_cfs_throttled_periods_total{container!="", container!="POD"}[15m]))
              /
                sum by (namespace, pod) (rate(container_cpu_cfs_periods_total{container!="", container!="POD"}[15m]))
            ) or vector(0)) < 20,
            "arm", "cpu", "", "")
        for: 10m
        labels:
          severity: warning
          service: observability
        annotations:
          summary: >-
            observability: cAdvisor covers {{ $value | printf "%.0f" }} pods for the {{ $labels.arm
            }} check, under the floor of 20.
          description: >-
            The {{ $labels.arm }} check reads a per-pod cAdvisor vector that holds
            {{ $value | printf "%.0f" }} pods where the estate holds about 70 to 100. The
            kubernetes-cadvisor job or a selector is broken, so the restart, OOM and CPU rules
            read green. Read the kubernetes-cadvisor targets on Prometheus.
          runbook_url: https://docs.local.daniel-hunter.com/alert-runbooks/#cadvisorcoverageshortfall
