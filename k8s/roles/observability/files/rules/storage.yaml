# The storage layer, read from the `longhorn`, `kubernetes-kubelet`, `node` and
# `kubernetes-apiserver` scrape jobs: the Longhorn volumes' redundancy, the claims' fullness, the
# snapshot space against a declared cap, each node's Longhorn disk against the replica scheduling
# floor, the CSI mounts and etcd's database size. Plain YAML, never Jinja:
# prometheus-rules.yaml.j2 carries this file verbatim. The design is
# docs/archive/monitoring/m6-retire-kuma.md, batch A5.
#
# All eleven are critical, so Discord and email.
#
# NO INHIBIT. PVCFreeFloorUnmonitored and PVCCoverageShortfall fire beside ScrapeTargetDown when
# a kubelet target dies, and the rest go quiet on a dead scrape. Neither carries `job` or
# `instance`, so an inhibit would need no `equal`, and one dead kubelet target would then mute
# the claim census while a selector break empties the other node's vector. The bridge row kept
# the same page on purpose, so two criticals for one dead kubelet target is the accepted outcome.
#
# THE LITERALS. Each threshold mirrors a value the deleted bridge rows carried. A ported
# threshold's `DECIDED:` marker on its rule is what a retune is reviewed against. A literal
# another role declares (valheim's transient, jellyfin's snapshot cap, the Longhorn disk floor)
# is held to that role by tests/services/alert_rules/test_storage_rule_literals.py.
#
# THE `for:` HOLDS. A bridge streak of N cycles is N x 300s, as in A2. The rows with no streak
# (fullness, the free-space floor, the read-only mount and the etcd size) hold for one bridge
# cycle, 5m: the bridge sampled once per cycle, and a rule evaluating every minute would
# otherwise page on a single scrape.
#
# LONGHORN'S ONE-HOT `state` LABEL. `longhorn_volume_robustness` carries four series per volume,
# one per state, valued 0 or 1. A rule selects on the label and never compares the value to an
# ordinal. The allow-list `state!~"healthy|unknown"` equals SAFE_ROBUSTNESS in monitor-bridge's
# longhorn_robustness.py, so a state Longhorn adds or renames pages instead of passing.
# `unknown` is a detached volume, such as a game server scaled to zero on purpose.
#
# DOUBLE SCRAPES. The two longhorn-manager pods report disjoint volume subsets. Each rule
# groups with `max by` so a series seen twice is one reading.
groups:
  - name: storage
    rules:
      # monitor-bridge's `longhorn_volumes`: a volume that lost redundancy. `k3s_longhorn_replica_count`
      # is 2, so `degraded` is a single copy, and `faulted` has no healthy replica left. `for: 15m`
      # is the bridge's 3-cycle streak x 300s, which rides out a node drain or the Sunday reboot.
      # DECIDED: `for: 15m`, the bridge's 3-cycle streak kept as is, to ride out a drain or reboot.
      - alert: LonghornVolumeDegraded
        expr: max by (volume, pvc, state) (longhorn_volume_robustness{state!~"healthy|unknown"} == 1)
        for: 15m
        labels:
          severity: critical
          service: longhorn
        annotations:
          summary: 'longhorn: volume {{ $labels.pvc }} is {{ $labels.state }}.'
          description: >-
            {{ $labels.volume }} (claim {{ $labels.pvc }}) has reported the robustness
            {{ $labels.state }} for 15 minutes. With two replicas, degraded is one copy from data
            loss and faulted is no healthy replica. `longhorn-disaster-recovery` has the rebuild
            and revert procedures.
          runbook_url: https://docs.local.daniel-hunter.com/longhorn-disaster-recovery/
      # The bridge's "no longhorn_volume_robustness series" branch: the one-hot shape guarantees a
      # `state="healthy"` series per volume even at value 0, so its absence means the exporter
      # went away, which is not the same as healthy. The second arm requires up == 1, so a failed
      # scrape stays ScrapeTargetDown's page (M1 convention 5). `for: 15m` is the bridge's
      # "scrape gap grace", its 3-cycle streak.
      # DECIDED: `for: 15m`, the bridge's 3-cycle streak kept as is.
      - alert: LonghornVolumesMissing
        expr: >-
          absent(up{job="longhorn"})
          or
          (
            absent(longhorn_volume_robustness{state="healthy"})
            and on () (up{job="longhorn"} == 1)
          )
        for: 15m
        labels:
          severity: critical
          service: longhorn
        annotations:
          summary: 'longhorn: Prometheus has lost the scrape job or its volume series.'
          description: >-
            Either no up{job="longhorn"} series exists, so the job is gone from prometheus.yml, or
            the scrape works and longhorn_volume_robustness is missing. Replica redundancy is
            UNMONITORED while this fires, which is not the same as healthy.
          runbook_url: https://docs.local.daniel-hunter.com/alert-runbooks/#longhornvolumesmissing
      # monitor-bridge's `pvc_fullness`, percentage arm: a claim over 85%. media-data
      # is excluded: a `local` PV that is the `/` filesystem the host disk rules already watch.
      # DECIDED: 85%, the bridge's value kept as is.
      # DECIDED: `for: 5m`, one bridge cycle, so a single scrape does not page.
      - alert: PVCFull
        expr: >-
          max by (namespace, persistentvolumeclaim) (
            100 * (1 - kubelet_volume_stats_available_bytes{persistentvolumeclaim!~"media-data"}
            / kubelet_volume_stats_capacity_bytes{persistentvolumeclaim!~"media-data"})
          ) > 85
        for: 5m
        labels:
          severity: critical
          service: longhorn
        annotations:
          summary: >-
            longhorn: the claim {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is over
            85% full.
          description: >-
            {{ $labels.persistentvolumeclaim }} is {{ $value | printf "%.0f" }}% full. A claim
            cannot borrow space, so expand the volume in its role.
          runbook_url: https://docs.local.daniel-hunter.com/alert-runbooks/#pvcfull
      # The `pvc_fullness` free-bytes floor, for a claim whose peak is a step rather than a
      # slope. The floor is valheim-server's largest transient, 3 GiB.
      # DECIDED: 3 GiB even though 85% of the 20Gi claim also breaches at 3 GiB free. The floor is
      # sized to the transient, not to open a gap under the percentage: a resize moves what 85%
      # means and leaves this where the copy is, which at the 10Gi the incident happened on was
      # 1.5 G more warning than the percentage gave.
      # DECIDED: `for: 5m`, one bridge cycle, so a single scrape does not page.
      - alert: PVCBelowFreeFloor
        expr: >-
          max by (namespace, persistentvolumeclaim) (
            kubelet_volume_stats_available_bytes{persistentvolumeclaim="valheim-server"}
          ) < 3221225472
        for: 5m
        labels:
          severity: critical
          service: longhorn
        annotations:
          summary: >-
            longhorn: the claim {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} has less
            free space than its largest transient.
          description: >-
            {{ $labels.persistentvolumeclaim }} has {{ $value | humanize1024 }}B free, under the
            3 GiB its updater stages before swapping the install in. Expand the volume in its role.
          runbook_url: https://docs.local.daniel-hunter.com/alert-runbooks/#pvcbelowfreefloor
      # A declared floor whose claim reports no free bytes is a breach, not silence: the arm above
      # evaluates to nothing exactly when its input vanishes. A valheim Deployment parked at zero
      # replicas mounts no volume, so the kubelet reports nothing by design: the `unless` mutes
      # the rule while kube-state-metrics reads zero replicas, and stays loud when it reads none.
      # DECIDED: `for: 5m`, one bridge cycle, so a single missed scrape does not page.
      - alert: PVCFreeFloorUnmonitored
        expr: >-
          absent(kubelet_volume_stats_available_bytes{persistentvolumeclaim="valheim-server"})
          unless on() (kube_deployment_spec_replicas{namespace="homelab",deployment="valheim"} == 0)
        for: 5m
        labels:
          severity: critical
          service: longhorn
        annotations:
          summary: 'longhorn: the kubelet reports no free bytes for the claim valheim-server.'
          description: >-
            PVCBelowFreeFloor reads kubelet_volume_stats_available_bytes for valheim-server and
            finds no series, so its free-space floor is UNMONITORED. The claim was renamed or
            excluded, or the kubelet stopped reporting it.
          runbook_url: https://docs.local.daniel-hunter.com/alert-runbooks/#pvcfreefloorunmonitored
      # The `pvc_fullness` census (32 claims): fewer claims visible than the floor means
      # the kubelet stats are not scraped, and an empty fullness vector reads like "no claim is
      # full". The count includes excluded claims, as the bridge's did. The kubelet job is the
      # claims' one source, and each node's target reports its own claims, so a dead
      # target drops the count below the floor and this rule does not wait on `up`. `for: 15m` is
      # the bridge's 3-cycle streak x 300s.
      # DECIDED: a floor of 32 claims, the bridge's value kept as is.
      # DECIDED: `for: 15m`, the bridge's 3-cycle claim-census streak kept as is.
      - alert: PVCCoverageShortfall
        expr: >-
          (count(count by (namespace, persistentvolumeclaim) (kubelet_volume_stats_capacity_bytes)) or vector(0)) < 32
        for: 15m
        labels:
          severity: critical
          service: longhorn
        annotations:
          summary: >-
            longhorn: {{ $value | printf "%.0f" }} claims report kubelet volume stats, below the
            floor of 32.
          description: >-
            Only {{ $value | printf "%.0f" }} claims report kubelet_volume_stats, below the floor
            of 32. PVC fullness is UNKNOWN, not OK. Read the kubernetes-kubelet targets, one
            per node.
          runbook_url: https://docs.local.daniel-hunter.com/alert-runbooks/#pvccoverageshortfall
      # monitor-bridge's `snapshot_headroom`: snapshot bytes against the declared
      # spec.snapshotMaxSize, at 0.9 of the cap. Longhorn refuses new
      # snapshots at the cap, which fails every deploy of the service. The rule names
      # jellyfin-config at 17179869184 bytes, the only capped volume. The snapshot metric carries `volume`
      # and the claim name lives on the capacity metric, so the join takes `pvc` from there;
      # `group` makes the capacity side a value of 1. The inner `max by (volume, snapshot)` is the
      # bridge's dedupe of a snapshot two managers report. `for: 15m` is the bridge's
      # 3-cycle streak x 300s.
      # DECIDED: page at 0.9 of the cap, the bridge's value kept as is.
      # DECIDED: `for: 15m`, the bridge's 3-cycle snapshot-cap streak kept as is.
      - alert: LonghornSnapshotNearCap
        expr: >-
          sum by (pvc) (
            max by (volume, snapshot) (longhorn_snapshot_actual_size_bytes)
            * on (volume) group_left (pvc)
            group by (volume, pvc) (longhorn_volume_capacity_bytes{pvc="jellyfin-config"})
          ) >= 17179869184 * 0.9
        for: 15m
        labels:
          severity: critical
          service: longhorn
        annotations:
          summary: 'longhorn: snapshot space of {{ $labels.pvc }} is at 90% of its cap.'
          description: >-
            {{ $labels.pvc }} holds {{ $value | humanize1024 }}B of snapshots against a cap of
            16 GiB. Longhorn refuses new snapshots at the cap rather than pruning, so the next
            deploy of the service fails until snapshots are deleted by hand.
          runbook_url: https://docs.local.daniel-hunter.com/alert-runbooks/#longhornsnapshotnearcap
      # A capped claim with a capacity series and no snapshot series is a breach, not green. A
      # capped volume is snapshotted on every deploy, so an empty reading means the exporter or
      # the join went away. Zero capacity series is LonghornVolumesMissing's case.
      # DECIDED: `for: 15m`, the bridge's 3-cycle snapshot-cap streak kept as is.
      - alert: LonghornSnapshotCapUnmonitored
        expr: >-
          group by (pvc) (longhorn_volume_capacity_bytes{pvc="jellyfin-config"})
          unless on (pvc)
          sum by (pvc) (
            max by (volume, snapshot) (longhorn_snapshot_actual_size_bytes)
            * on (volume) group_left (pvc)
            group by (volume, pvc) (longhorn_volume_capacity_bytes{pvc="jellyfin-config"})
          )
        for: 15m
        labels:
          severity: critical
          service: longhorn
        annotations:
          summary: >-
            longhorn: no snapshot series is reported for the capped claim {{ $labels.pvc }}.
          description: >-
            {{ $labels.pvc }} declares a snapshot cap and has no longhorn_snapshot_actual_size_bytes
            series, so its snapshot headroom is UNMONITORED, which is not the same as empty.
          runbook_url: https://docs.local.daniel-hunter.com/alert-runbooks/#longhornsnapshotcapunmonitored
      # A node's Longhorn disk past the replica scheduling floor. Longhorn's
      # storage-minimal-available-percentage is 25, its default, so above 75% used it refuses
      # replica placement on the node: a rebuild or a new volume then runs degraded, and only that
      # symptom pages. The ratio is the quantity Longhorn schedules on, and it covers both nodes
      # without a host package. node-exporter's root reading differs from it by about 21 GB, so
      # this rule reads the Longhorn series alone. 0.75 equals k3s-host-checks' k3s_disk_max_pct,
      # daniel-box's disk-health line, which test_storage_rule_literals.py holds the two to. An
      # absent series is LonghornVolumesMissing's case. `for: 15m` is the 3-cycle streak, as for
      # the other Longhorn rows: the disk grows by GB a day, so the hold costs no warning.
      # DECIDED: `for: 15m`, the 3-cycle streak of the other Longhorn rows.
      - alert: LonghornDiskOverSchedulingFloor
        expr: max by (node, disk) (longhorn_disk_usage_bytes / longhorn_disk_capacity_bytes) > 0.75
        for: 15m
        labels:
          severity: critical
          service: longhorn
        annotations:
          summary: >-
            longhorn: the disk on {{ $labels.node }} is past the 75% replica scheduling floor.
          description: >-
            Run `sudo k3s crictl rmi --prune` on {{ $labels.node }}, then read what else holds the
            space. Longhorn's disk {{ $labels.disk }} there is {{ $value | humanizePercentage }}
            used, and above 75% Longhorn places no replica on the node.
          runbook_url: https://docs.local.daniel-hunter.com/alert-runbooks/#longhorndiskoverschedulingfloor
      # monitor-bridge's `kubelet_plugin_readonly`: a CSI global mount remounted ext4
      # read-only after an iSCSI stall. Longhorn's own state stays healthy through it. The
      # selector takes every origin: the Pi has no kubelet plugin mounts, and a pin to one
      # origin would hide the same fault on another node. An absent series is healthy.
      # `for: 1m` is two scrapes: remounts last 2 to 6 minutes, and no CSI mount reads 1
      # otherwise. A remount that clears
      # while the node hosting Prometheus boots is never scraped; loki-homelab's
      # HostFilesystemRemountedReadOnly reads that one from the kernel log. A remount of
      # prometheus-data stops the Watchdog, which pages from Healthchecks.io.
      # DECIDED: `for: 1m`, two scrapes, shorter than the bridge's cycle: a remount lasts 2 to 6
      # minutes, so a 5m hold would miss the shorter ones.
      - alert: KubeletCSIMountReadOnly
        expr: node_filesystem_readonly{mountpoint=~"/var/lib/kubelet/plugins/.*"} == 1
        for: 1m
        labels:
          severity: critical
          service: longhorn
        annotations:
          summary: 'longhorn: the CSI mount {{ $labels.mountpoint }} is read-only.'
          description: >-
            {{ $labels.mountpoint }} remounted read-only after an iSCSI stall, behind a Longhorn
            volume that still reads healthy. Scale the workload to 0, wait for the volume to
            detach, and scale back.
          runbook_url: https://docs.local.daniel-hunter.com/alert-runbooks/#kubeletcsimountreadonly
      # monitor-bridge's `etcd_db_size`: the DB over 80% of its
      # 2147483648-byte backend quota. At the quota etcd goes read-only and the control plane stops
      # accepting writes. The size comes from `apiserver_storage_size_bytes`, which two jobs carry
      # with one value, so `max` reads it once. The bridge treats an absent series as UP, because
      # ScrapeTargetDown owns a dead apiserver scrape, so this rule has no census arm.
      # DECIDED: 80% of the 2 GiB quota, the bridge's value kept as is.
      # DECIDED: `for: 5m`, one bridge cycle, so a single scrape does not page.
      - alert: EtcdDBNearQuota
        expr: 100 * max(apiserver_storage_size_bytes) / 2147483648 >= 80
        for: 5m
        labels:
          severity: critical
          service: etcd
        annotations:
          summary: 'etcd: the database is at {{ $value | printf "%.0f" }}% of its 2 GiB quota.'
          description: >-
            The etcd database is {{ $value | printf "%.0f" }}% of its 2 GiB quota. At the quota
            etcd rejects every write and the control plane stops. Compact and defragment, or raise
            --etcd-arg=quota-backend-bytes. `k3s-etcd-restore` has the procedure.
          runbook_url: https://docs.local.daniel-hunter.com/alert-runbooks/#etcddbnearquota
