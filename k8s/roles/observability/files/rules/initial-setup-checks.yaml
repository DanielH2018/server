# The B2 host checks of M6 (docs/target-architecture/monitoring/m6-retire-kuma.md, batch B2): the
# generated-docs refresh, the eval sweep, the secret-rotation audit, the setup-plane drift check
# and the two Loki read-route witnesses, plus H7.51's checkout-sync on daniel-box, which pages
# from its first deploy. Each producer writes a `homelab_check_*` textfile to the
# `node` scrape job, so these rules read the metric contract of
# docs/target-architecture/monitoring/m3-textfile-timer.md. Plain YAML, never Jinja:
# prometheus-rules.yaml.j2 carries this file verbatim.
#
# THESE RULES PAGE SINCE M6's BATCH B2 CUTOVER-1B. Each one ports the tile of the same check,
# and Cutover-1a deleted the tile. Cutover-1b dropped the `shadow` label that held the rule back.
# Severity is `warning` because every one of the six tiles notified Discord only. `service` is the host as a literal, because a node is not a
# workload (M3's open question 3). Each pair is `<Check>Failed` and `<Check>NotReporting`, the
# shape M3 fixed: NotReporting reads the timestamp against the deadline, falls back to
# absent_over_time over the same deadline, and leaves a dead exporter to the `targets` check.
#
# Each deadline is the DEADLINE_S its producer renders, which equalled the interval of the
# tile it replaced. Both literals of a NotReporting rule are pinned to it by
# ansible/tests/services/test_not_reporting_rule_deadlines.py (M1 convention 1).
#
# The weekly reboot (about 07:35 to 07:50) leaves every writer's gap inside its deadline: the
# hourly witness writes at 07:23 and 08:23, and the daily and weekly checks run outside the
# window. The eval sweep's 7-day deadline means its NotReporting rule fires until the first sweep
# after the deploy writes its file, which pages once, as a warning, in that first week.
groups:
  - name: initial-setup-checks
    rules:
      # Replaced the "Docs Refresh" tile.
      - alert: DocsRefreshFailed
        expr: homelab_check_success{check="docs-refresh",origin="daniel-box"} == 0
        labels:
          severity: warning
          service: daniel-box
        annotations:
          summary: daniel-box's generated-docs refresh reported a failure.
          description: >-
            docs-refresh.sh on daniel-box ended with status=down: a generator, the shard-weight
            measurement or the site build failed, a previous run is unlanded or left the tree
            dirty, or the PR could not be published. The `docs-refresh` syslog tag holds the
            run's message.
      - alert: DocsRefreshNotReporting
        expr: |
          (
              time() - homelab_check_last_run_timestamp_seconds{check="docs-refresh",origin="daniel-box"} > 46800
            or
              absent_over_time(homelab_check_last_run_timestamp_seconds{check="docs-refresh",origin="daniel-box"}[46800s])
          )
          unless on (origin) (up{job="node"} == 0)
        labels:
          severity: warning
          service: daniel-box
        annotations:
          summary: daniel-box's generated-docs refresh has stopped reporting.
          description: >-
            No docs-refresh verdict newer than 13 hours reached Prometheus from daniel-box's
            textfile collector, so nothing confirms the generated docs are refreshing. Read the
            `Refresh generated docs` cron and the `docs-refresh` syslog tag, then
            /var/lib/node-exporter-textfile/docs-refresh.prom on the host.
      # Replaced the "Homelab Evals" tile.
      - alert: EvalSweepFailed
        expr: homelab_check_success{check="eval-run",origin="daniel-box"} == 0
        labels:
          severity: warning
          service: daniel-box
        annotations:
          summary: daniel-box's weekly eval sweep reported a failure.
          description: >-
            eval-run.sh on daniel-box ended with status=down: an eval case regressed, or an
            earlier PR is unlanded for a reason that needs a human. A missing anthropic_api_key
            skips the sweep and reads up. The `eval-run` syslog tag holds the run's message.
      - alert: EvalSweepNotReporting
        expr: |
          (
              time() - homelab_check_last_run_timestamp_seconds{check="eval-run",origin="daniel-box"} > 626400
            or
              absent_over_time(homelab_check_last_run_timestamp_seconds{check="eval-run",origin="daniel-box"}[626400s])
          )
          unless on (origin) (up{job="node"} == 0)
        labels:
          severity: warning
          service: daniel-box
        annotations:
          summary: daniel-box's weekly eval sweep has stopped reporting.
          description: >-
            No eval-run verdict newer than 7 days 6 hours reached Prometheus from daniel-box's textfile
            collector, so nothing confirms the eval sweep is running. Read the `Homelab eval
            sweep` cron and the `eval-run` syslog tag, then
            /var/lib/node-exporter-textfile/eval-run.prom on the host.
      # Replaced the "Secret Rotation" tile.
      - alert: SecretRotationAuditFailed
        expr: homelab_check_success{check="secret-rotation-audit",origin="daniel-box"} == 0
        labels:
          severity: warning
          service: daniel-box
        annotations:
          summary: daniel-box's secret-rotation audit reported a failure.
          description: >-
            secret-rotation-audit.sh on daniel-box ended with a non-zero exit code: a secret is
            past its rotation window, a secret in secrets.yml is missing from the registry, a
            registry row carries a tier with no cadence, or the gh CLI token is not
            authenticated. Run `secret_rotation.py audit` by hand to read which.
      - alert: SecretRotationAuditNotReporting
        expr: |
          (
              time() - homelab_check_last_run_timestamp_seconds{check="secret-rotation-audit",origin="daniel-box"} > 90000
            or
              absent_over_time(homelab_check_last_run_timestamp_seconds{check="secret-rotation-audit",origin="daniel-box"}[90000s])
          )
          unless on (origin) (up{job="node"} == 0)
        labels:
          severity: warning
          service: daniel-box
        annotations:
          summary: daniel-box's secret-rotation audit has stopped reporting.
          description: >-
            No secret-rotation-audit verdict newer than 25 hours reached Prometheus from
            daniel-box's textfile collector, so nothing confirms secret rotation is being
            audited. Read `systemctl status homelab-secret-rotation-audit` on daniel-box,
            then /var/lib/node-exporter-textfile/secret-rotation-audit.prom on the host.
      - alert: RecoveryKitStale
        expr: homelab_check_success{check="recovery-kit",origin="daniel-box"} == 0
        labels:
          severity: warning
          service: daniel-box
        annotations:
          summary: The off-site recovery kit is overdue for a refresh.
          description: >-
            The secret-rotation audit on daniel-box ran `recovery_kit.py check`, which found
            secrets/recovery_kit.yml missing, unreadable, dated after today, or older than
            MAX_AGE_DAYS. Run `uv run python scripts/secrets_mgmt/recovery_kit.py check` to read
            which. Refresh the kit (docs/longhorn-disaster-recovery.md, The off-site recovery
            kit), then run `recovery_kit.py record` and commit the stamp.
      # Replaced the "Loki Read Route (daniel-box)" tile.
      - alert: LokiReadRouteFailed
        expr: homelab_check_success{check="loki-read-route-health",origin="daniel-box"} == 0
        labels:
          severity: warning
          service: daniel-box
        annotations:
          summary: daniel-box cannot read Loki through the loki-homelab route.
          description: >-
            loki-read-route-health on daniel-box ran `probe.py loki-labels` through the
            loki-homelab IngressRoute and judged the answer down: the route returned 404 or an
            error, usually because the ClientIP guard rejects this host's source address. Read
            `systemctl status homelab-loki-route-witness` on daniel-box and the traefik pod's
            placement.
      - alert: LokiReadRouteNotReporting
        expr: |
          (
              time() - homelab_check_last_run_timestamp_seconds{check="loki-read-route-health",origin="daniel-box"} > 7200
            or
              absent_over_time(homelab_check_last_run_timestamp_seconds{check="loki-read-route-health",origin="daniel-box"}[7200s])
          )
          unless on (origin) (up{job="node"} == 0)
        labels:
          severity: warning
          service: daniel-box
        annotations:
          summary: daniel-box's Loki read-route witness has stopped reporting.
          description: >-
            No loki-read-route-health verdict newer than 2 hours reached Prometheus from
            daniel-box's textfile collector, so nothing confirms the Loki read route is being
            witnessed. Read `systemctl status homelab-loki-route-witness` on daniel-box, then
            /var/lib/node-exporter-textfile/loki-read-route-health.prom on the host.
      # Replaced the "Loki Read Route (daniel-server)" tile.
      - alert: LokiReadRouteFailed
        expr: homelab_check_success{check="loki-read-route-health",origin="daniel-server"} == 0
        labels:
          severity: warning
          service: daniel-server
        annotations:
          summary: daniel-server cannot read Loki through the loki-homelab route.
          description: >-
            loki-read-route-health on daniel-server ran `probe.py loki-labels` through the
            loki-homelab IngressRoute and judged the answer down: the route returned 404 or an
            error, usually because the ClientIP guard rejects this host's source address. Read
            `systemctl status homelab-loki-route-witness` on daniel-server and the traefik pod's
            placement.
      - alert: LokiReadRouteNotReporting
        expr: |
          (
              time() - homelab_check_last_run_timestamp_seconds{check="loki-read-route-health",origin="daniel-server"} > 7200
            or
              absent_over_time(homelab_check_last_run_timestamp_seconds{check="loki-read-route-health",origin="daniel-server"}[7200s])
          )
          unless on (origin) (up{job="node"} == 0)
        labels:
          severity: warning
          service: daniel-server
        annotations:
          summary: daniel-server's Loki read-route witness has stopped reporting.
          description: >-
            No loki-read-route-health verdict newer than 2 hours reached Prometheus from
            daniel-server's textfile collector, so nothing confirms the Loki read route is being
            witnessed. Read `systemctl status homelab-loki-route-witness` on daniel-server, then
            /var/lib/node-exporter-textfile/loki-read-route-health.prom on the host.
      # H7.51's checkout-sync, which takes over the deployer's dirty-tree page.
      - alert: CheckoutSyncFailed
        expr: homelab_check_success{check="checkout-sync",origin="daniel-box"} == 0
        labels:
          severity: warning
          service: daniel-box
        annotations:
          summary: daniel-box's primary checkout sync is refusing to fast-forward.
          description: >-
            homelab-checkout-sync on daniel-box refused its last run, so the primary checkout is
            not following master. homelab_checkout_sync_refused names the reason: a dirty tree
            (an untracked file counts), a branch other than master, a HEAD that origin/master
            does not descend from, an empty CI context set or walk bound, or a missing or
            refused GitHub token. Read `journalctl -t homelab-checkout-sync` on daniel-box.
      - alert: CheckoutSyncNotReporting
        expr: |
          (
              time() - homelab_check_last_run_timestamp_seconds{check="checkout-sync",origin="daniel-box"} > 7200
            or
              absent_over_time(homelab_check_last_run_timestamp_seconds{check="checkout-sync",origin="daniel-box"}[7200s])
          )
          unless on (origin) (up{job="node"} == 0)
        labels:
          severity: warning
          service: daniel-box
        annotations:
          summary: daniel-box's primary checkout sync has stopped reporting.
          description: >-
            No checkout-sync verdict newer than 2 hours reached Prometheus from daniel-box's
            textfile collector, so nothing confirms the primary checkout follows master. A
            fetch that keeps failing or a git-tree lock held for hours writes no verdict. Read
            `systemctl status homelab-checkout-sync` and `journalctl -t homelab-checkout-sync` on
            daniel-box, then /var/lib/node-exporter-textfile/checkout_sync.prom on the host.
