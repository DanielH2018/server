# The k3s upgrade Jobs (target slice H6, docs/archive/host/h6-k3s-suc.md, *Alerts*).
# Plain YAML, never Jinja: prometheus-rules.yaml.j2 carries this file verbatim.
#
# kube-state-metrics collects Jobs (`jobs` in --resources and in its ClusterRole), and SUC runs
# every Plan as a Job in the `system-upgrade` namespace. `service` is the deploy tag that owns
# the Jobs, so `probe.py health system-upgrade` reads these alerts.
groups:
  - name: k3s-upgrade
    rules:
      # Reads the Job's `Failed` condition, not the failed-pod count: SUC sets BackoffLimit, so a
      # pod can fail inside a Job that succeeds.
      # `keep_firing_for` outlasts the 900s TTL after which SUC deletes a failed Job plus the next
      # Job's deadline, so the alert does not resolve and re-fire.
      - alert: K3sUpgradeJobFailed
        expr: kube_job_failed{namespace="system-upgrade", condition="true"} == 1
        for: 0m
        keep_firing_for: 2h
        labels:
          severity: critical
          service: system-upgrade
        annotations:
          summary: 'system-upgrade: the k3s upgrade Job {{ $labels.job_name }} has failed.'
          description: >-
            Job {{ $labels.job_name }} carries a Failed condition. Read the Plan's conditions with
            `kubectl -n system-upgrade get plans`, then the Job's pods. A refusing prepare gate that
            outlasts the Job deadline ends here too. docs/k3s-upgrade.md says how to clear the hold
            and retry.
          runbook_url: https://docs.local.daniel-hunter.com/k3s-upgrade/
      # A healthy bump holds two kubelet versions for well under the 2-hour hold. The `absent()` arm
      # covers a lost scrape hiding a node left on the old version, and kube_job_failed being absent
      # when no upgrade Job exists.
      - alert: K3sNodeVersionSkew
        expr: >-
          count(count by (kubelet_version) (kube_node_info)) > 1
          or absent(kube_node_info)
        for: 2h
        labels:
          severity: warning
          service: system-upgrade
        annotations:
          summary: >-
            system-upgrade: {{ with query "kube_node_info" }}the nodes run mixed kubelet versions:
            {{ range $i, $s := . | sortByLabel "node" }}{{ if $i }}, {{ end }}{{ $s.Labels.node }}
            {{ $s.Labels.kubelet_version }}{{ end }}.{{ else }}kube_node_info is absent, so no
            kubelet version skew can be judged.{{ end }}
          description: >-
            For 2 hours kube_node_info has carried more than one kubelet_version, so an upgrade
            left one node behind, or has been absent, so the skew cannot be judged. Read
            `kubectl get nodes`, then `kubectl -n system-upgrade get plans`. docs/k3s-upgrade.md says how to
            finish or retry the upgrade.
          runbook_url: https://docs.local.daniel-hunter.com/k3s-upgrade/
      # homelab-k3s-restart writes these series every run, so a clean host reads 0 and an absent
      # series is not a pass.
      # `failed` is 1 after an attempt that did not bring k3s back or was killed; the unit makes one
      # attempt per hash, so the page stands until the operator recovers the node and removes
      # failed.sha256.
      - alert: K3sConfigRestartFailed
        expr: homelab_k3s_restart_failed{host="daniel-box"} == 1
        for: 0m
        labels:
          severity: critical
          service: daniel-box
        annotations:
          summary: 'daniel-box: homelab-k3s-restart failed to restart k3s.'
          description: >-
            Read `journalctl -u homelab-k3s-restart -p notice` on daniel-box and recover the node by
            hand if it is down. The last windowed restart of k3s.service did not end active, under a
            new MainPID, with the node Ready. The runbook says how to allow another attempt.
          runbook_url: https://docs.local.daniel-hunter.com/alert-runbooks/#k3sconfigrestartfailed
      # `pending` is 1 while the shipped config differs from the applied hash and a gate refused
      # the window's restart. 72 hours spans a weekend plus a refused Monday, and still pages a
      # gate that refuses every window.
      - alert: K3sConfigRestartPending
        expr: homelab_k3s_restart_pending{host="daniel-box"} == 1
        for: 72h
        labels:
          severity: warning
          service: daniel-box
        annotations:
          summary: 'daniel-box: a k3s config change has waited 72 hours for a restart.'
          description: >-
            homelab-k3s-restart has refused to restart k3s.service on daniel-box at every window
            for 72 hours. Read `journalctl -u homelab-k3s-restart -p notice` for the refusing
            gate, which is a Longhorn volume, a node, CoreDNS, a SUC run, a Flux promotion, or an
            unreadable API.
      # daniel-box alone has a term: daniel-server ships no k3s-restart component, and a term for it
      # would fire at once.
      # `absent()` keeps the equality matcher's label, so the alert carries `host`.
      - alert: K3sConfigRestartMetricsAbsent
        expr: absent(homelab_k3s_restart_failed{host="daniel-box"})
        for: 1h
        labels:
          severity: warning
          service: daniel-box
        annotations:
          summary: 'daniel-box: homelab-k3s-restart has written no metrics in an hour.'
          description: >-
            No homelab_k3s_restart_failed series carries host="daniel-box", so either the unit's
            textfile never reached Prometheus or the timer stopped. Read `systemctl list-timers
            homelab-k3s-restart.timer` and `journalctl -u homelab-k3s-restart -p notice` on
            daniel-box.
          runbook_url: https://docs.local.daniel-hunter.com/alert-runbooks/#k3sconfigrestartmetricsabsent
