# The B4 host checks of M6 (docs/archive/monitoring/m6-retire-kuma.md, batch B4): the
# two UPS secondary watchdogs, the three fake-remux heartbeats, the monthly etcd restore drill
# with its egress-fence leg, and the renovate notifier and agent. Each producer writes a
# `homelab_check_*` textfile to the `node` scrape job, so these rules read the metric contract of
# docs/archive/monitoring/m3-textfile-timer.md. Plain YAML, never Jinja:
# prometheus-rules.yaml.j2 carries this file verbatim.
#
# Severity: `critical` for both UPS secondaries and the full drill, which email as well as
# notify Discord, and `warning` for the rest. `service` is the host as a literal, because a node is not a workload (M3's open
# question 3). Each pair is `<Check>Failed` and `<Check>NotReporting`, the shape M3 fixed:
# NotReporting reads the timestamp against the deadline, falls back to absent_over_time over the
# same deadline, and leaves a dead exporter to the `targets` check.
#
# THE CHECK LABEL IS NOT ALWAYS THE SYSLOG TAG. M3 names a check file after its producer's tag,
# which assumes one verdict per tag. fake-remux-health pushes three tiles under one tag and the
# etcd drill orchestrator pushes two, so each verdict has its own check name: fake-remux-scan,
# fake-remux-replace, mkv-attachment-repair, etcd-restore-drill-vm and
# etcd-restore-drill-egress-fence.
#
# THE RENOVATE PAIR HAS NO Failed RULE. Both units run their textfile line as an ExecStartPost,
# which systemd runs only after a clean ExecStart, so the file only ever says success 1. A crash
# writes nothing, which reads as a missed beat. OnFailure pages the
# crash at once, and NotReporting is the rule that catches the missed beat.
#
# A DISARMED AGENT IS SILENT, NOT LATE. With renovate_agent_enabled false the timer is stopped,
# so the renovate-agent component ships renovate-agent-disarmed.prom (homelab_check_disarmed 1), and
# RenovateAgentNotReporting and host-checks.yaml's HostCheckOverdue both stay quiet on the check
# while the marker reads 1. Re-arming removes the marker, and the absent arm then fires until
# the next 06:00 run writes a verdict, so re-arm just before a run or expect that one warning.
#
# Each deadline is the DEADLINE_S its producer renders, and both literals of a NotReporting rule
# are pinned to it by hosts/tests/test_b4_rule_literals.py (M1 convention 1). The two
# 10-minute producers render 2 x period + 300 = 1500, M3's rule. The drills render their
# cadence plus slack, 3024000 (35 days). The renovate units render 129600 and 100800.
#
# The drills' NotReporting rules fire from the deploy until the first run after it writes its
# file, because a monthly producer cannot write earlier. The weekly reboot (about 07:35 to
# 07:50) leaves every writer's gap inside its deadline.
groups:
  - name: other-setup-checks
    rules:
      - alert: UpsSecondaryFailed
        expr: homelab_check_success{check="ups-secondary-health",origin="daniel-box"} == 0
        labels:
          severity: critical
          service: daniel-box
        annotations:
          summary: 'daniel-box: the UPS secondary watchdog reported a failure.'
          description: >-
            Run `systemctl is-active nut-monitor` and `upsc <endpoint> ups.status` on daniel-box.
            Its UPS secondary watchdog ended with status=down, so daniel-box would not power off on
            FSD. The `ups-secondary-health` syslog tag holds the message.
          runbook_url: https://docs.local.daniel-hunter.com/alert-runbooks/#upssecondaryfailed
      - alert: UpsSecondaryNotReporting
        expr: |
          (
              time() - homelab_check_last_run_timestamp_seconds{check="ups-secondary-health",origin="daniel-box"} > 1500
            or
              absent_over_time(homelab_check_last_run_timestamp_seconds{check="ups-secondary-health",origin="daniel-box"}[1500s])
          )
          unless on (origin) (up{job="node"} == 0)
        labels:
          severity: critical
          service: daniel-box
        annotations:
          summary: 'daniel-box: the UPS secondary watchdog has stopped reporting.'
          description: >-
            Run `systemctl status homelab-ups-watchdog.timer` and `journalctl -u
            homelab-ups-watchdog.service` on daniel-box. No ups-secondary-health verdict newer than
            25 minutes reached Prometheus, so nothing confirms its secondary upsmon can hear upsd.
          runbook_url: https://docs.local.daniel-hunter.com/alert-runbooks/#upssecondarynotreporting
      - alert: UpsSecondaryFailed
        expr: homelab_check_success{check="ups-secondary-health",origin="daniel-server"} == 0
        labels:
          severity: critical
          service: daniel-server
        annotations:
          summary: 'daniel-server: the UPS secondary watchdog reported a failure.'
          description: >-
            Run `systemctl is-active nut-monitor` and `upsc <endpoint> ups.status` on daniel-server.
            Its UPS secondary watchdog ended with status=down, so daniel-server would not power off
            on FSD. The `ups-secondary-health` syslog tag holds the message.
          runbook_url: https://docs.local.daniel-hunter.com/alert-runbooks/#upssecondaryfailed
      - alert: UpsSecondaryNotReporting
        expr: |
          (
              time() - homelab_check_last_run_timestamp_seconds{check="ups-secondary-health",origin="daniel-server"} > 1500
            or
              absent_over_time(homelab_check_last_run_timestamp_seconds{check="ups-secondary-health",origin="daniel-server"}[1500s])
          )
          unless on (origin) (up{job="node"} == 0)
        labels:
          severity: critical
          service: daniel-server
        annotations:
          summary: 'daniel-server: the UPS secondary watchdog has stopped reporting.'
          description: >-
            Run `systemctl status homelab-ups-watchdog.timer` and `journalctl -u
            homelab-ups-watchdog.service` on daniel-server. No ups-secondary-health verdict newer
            than 25 minutes reached Prometheus, so nothing confirms its secondary upsmon can hear
            upsd.
          runbook_url: https://docs.local.daniel-hunter.com/alert-runbooks/#upssecondarynotreporting
      - alert: FakeRemuxScanFailed
        expr: homelab_check_success{check="fake-remux-scan",origin="daniel-box"} == 0
        labels:
          severity: warning
          service: daniel-box
        annotations:
          summary: 'daniel-box: the fake-remux scan reported a failure.'
          description: >-
            fake-remux-health read the daily scan's state file and found a failure or a run
            older than 26 hours. Read the `fake-remux scan` cron and state.json in
            /var/lib/autofix-fake-remux. The `fake-remux-health` syslog tag holds the message.
      - alert: FakeRemuxScanNotReporting
        expr: |
          (
              time() - homelab_check_last_run_timestamp_seconds{check="fake-remux-scan",origin="daniel-box"} > 1500
            or
              absent_over_time(homelab_check_last_run_timestamp_seconds{check="fake-remux-scan",origin="daniel-box"}[1500s])
          )
          unless on (origin) (up{job="node"} == 0)
        labels:
          severity: warning
          service: daniel-box
        annotations:
          summary: 'daniel-box: the fake-remux heartbeat has stopped reporting the scan.'
          description: >-
            No fake-remux-scan verdict newer than 25 minutes reached Prometheus from daniel-box,
            so nothing confirms the scan's state file is being read. Read the `fake-remux health`
            cron and the `fake-remux-health` syslog tag, then
            /var/lib/node-exporter-textfile/fake-remux-scan.prom.
      - alert: FakeRemuxReplaceFailed
        expr: homelab_check_success{check="fake-remux-replace",origin="daniel-box"} == 0
        labels:
          severity: warning
          service: daniel-box
        annotations:
          summary: 'daniel-box: the fake-remux reconciler reported a failure.'
          description: >-
            fake-remux-health read the reconciler's state file and found a failure or a run
            older than 1.2 hours. Read the `fake-remux reconcile` cron and replace_state.json in
            /var/lib/autofix-fake-remux. The `fake-remux-health` syslog tag holds the message.
      - alert: FakeRemuxReplaceNotReporting
        expr: |
          (
              time() - homelab_check_last_run_timestamp_seconds{check="fake-remux-replace",origin="daniel-box"} > 1500
            or
              absent_over_time(homelab_check_last_run_timestamp_seconds{check="fake-remux-replace",origin="daniel-box"}[1500s])
          )
          unless on (origin) (up{job="node"} == 0)
        labels:
          severity: warning
          service: daniel-box
        annotations:
          summary: 'daniel-box: the fake-remux heartbeat has stopped reporting the reconciler.'
          description: >-
            No fake-remux-replace verdict newer than 25 minutes reached Prometheus from
            daniel-box, so nothing confirms the reconciler's state file is being read. Read the
            `fake-remux health` cron and the `fake-remux-health` syslog tag, then
            /var/lib/node-exporter-textfile/fake-remux-replace.prom.
      - alert: MkvAttachmentRepairFailed
        expr: homelab_check_success{check="mkv-attachment-repair",origin="daniel-box"} == 0
        labels:
          severity: warning
          service: daniel-box
        annotations:
          summary: 'daniel-box: the mkv attachment repair reported a failure.'
          description: >-
            fake-remux-health read the repair sweep's state file and found a failure or a run
            older than 1.2 hours. Read the `mkv attachment repair` cron and
            mkv_attachment_state.json in /var/lib/autofix-fake-remux. The `fake-remux-health`
            syslog tag holds the message.
      - alert: MkvAttachmentRepairNotReporting
        expr: |
          (
              time() - homelab_check_last_run_timestamp_seconds{check="mkv-attachment-repair",origin="daniel-box"} > 1500
            or
              absent_over_time(homelab_check_last_run_timestamp_seconds{check="mkv-attachment-repair",origin="daniel-box"}[1500s])
          )
          unless on (origin) (up{job="node"} == 0)
        labels:
          severity: warning
          service: daniel-box
        annotations:
          summary: 'daniel-box: the fake-remux heartbeat has stopped reporting the mkv repair.'
          description: >-
            No mkv-attachment-repair verdict newer than 25 minutes reached Prometheus from
            daniel-box, so nothing confirms the repair sweep's state file is being read. Read the
            `fake-remux health` cron and the `fake-remux-health` syslog tag, then
            /var/lib/node-exporter-textfile/mkv-attachment-repair.prom.
      - alert: EtcdRestoreDrillFailed
        expr: homelab_check_success{check="etcd-restore-drill-vm",origin="daniel-server"} == 0
        labels:
          severity: critical
          service: daniel-server
        annotations:
          summary: 'daniel-server: the monthly etcd restore drill failed.'
          description: >-
            etcd-restore-drill-vm on daniel-server ended with status=down: a preflight failed,
            the egress fence leaked, or the restore in the throwaway guest did not pass. Read the
            newest run directory under /var/log/etcd-restore-drill; the `etcd-restore-drill-vm`
            syslog tag holds the message.
          runbook_url: https://docs.local.daniel-hunter.com/k3s-etcd-restore/#the-full-drill-runs-monthly-in-a-throwaway-guest
      - alert: EtcdRestoreDrillNotReporting
        expr: |
          (
              time() - homelab_check_last_run_timestamp_seconds{check="etcd-restore-drill-vm",origin="daniel-server"} > 3024000
            or
              absent_over_time(homelab_check_last_run_timestamp_seconds{check="etcd-restore-drill-vm",origin="daniel-server"}[3024000s])
          )
          unless on (origin) (up{job="node"} == 0)
        labels:
          severity: critical
          service: daniel-server
        annotations:
          summary: 'daniel-server: the monthly etcd restore drill has stopped reporting.'
          description: >-
            Read homelab-etcd-restore-drill.timer and the journal of
            homelab-etcd-restore-drill.service on daniel-server. No etcd-restore-drill-vm verdict
            newer than 35 days reached Prometheus, so no drill has run since the last 1st-of-month
            slot plus four days of slack.
          runbook_url: https://docs.local.daniel-hunter.com/k3s-etcd-restore/#the-full-drill-runs-monthly-in-a-throwaway-guest
      - alert: EtcdRestoreDrillEgressFenceFailed
        expr: homelab_check_success{check="etcd-restore-drill-egress-fence",origin="daniel-server"} == 0
        labels:
          severity: warning
          service: daniel-server
        annotations:
          summary: "daniel-server: the etcd drill's egress fence leg reported a failure."
          description: >-
            The fence leg of etcd-restore-drill-vm dialled every fenced range from inside the
            throwaway guest and either found a leak or could not measure a range, so the fence is
            unproven there. Read egress-fence.log in the newest run directory under
            /var/log/etcd-restore-drill.
      - alert: EtcdRestoreDrillEgressFenceNotReporting
        expr: |
          (
              time() - homelab_check_last_run_timestamp_seconds{check="etcd-restore-drill-egress-fence",origin="daniel-server"} > 3024000
            or
              absent_over_time(homelab_check_last_run_timestamp_seconds{check="etcd-restore-drill-egress-fence",origin="daniel-server"}[3024000s])
          )
          unless on (origin) (up{job="node"} == 0)
        labels:
          severity: warning
          service: daniel-server
        annotations:
          summary: "daniel-server: the etcd drill's egress fence leg has stopped reporting."
          description: >-
            No etcd-restore-drill-egress-fence verdict newer than 35 days reached Prometheus from
            daniel-server, so the fence went unmeasured this month. A run that dies before the
            fence leg writes nothing. Read the newest run directory under
            /var/log/etcd-restore-drill.
          runbook_url: https://docs.local.daniel-hunter.com/alert-runbooks/#etcdrestoredrillegressfencenotreporting
      # No Failed rule: see the header.
      - alert: RenovateNotifyNotReporting
        expr: |
          (
              time() - homelab_check_last_run_timestamp_seconds{check="renovate-notify",origin="daniel-box"} > 129600
            or
              absent_over_time(homelab_check_last_run_timestamp_seconds{check="renovate-notify",origin="daniel-box"}[129600s])
          )
          unless on (origin) (up{job="node"} == 0)
        labels:
          severity: warning
          service: daniel-box
        annotations:
          summary: 'daniel-box: the renovate notifier has not completed a run in 36 hours.'
          description: >-
            No renovate-notify verdict newer than 36 hours reached Prometheus from daniel-box:
            the daily 13:00 timer did not fire or the run failed. Read
            `systemctl status homelab-renovate-notify.timer` and
            `journalctl -u homelab-renovate-notify`. This says nothing about Renovate itself.
          runbook_url: https://docs.local.daniel-hunter.com/alert-runbooks/#renovatenotifynotreporting
      # No Failed rule: see the header.
      - alert: RenovateAgentNotReporting
        expr: |
          (
              time() - homelab_check_last_run_timestamp_seconds{check="renovate-agent",origin="daniel-box"} > 100800
            or
              absent_over_time(homelab_check_last_run_timestamp_seconds{check="renovate-agent",origin="daniel-box"}[100800s])
          )
          unless on (origin) (homelab_check_disarmed{check="renovate-agent",origin="daniel-box"} == 1)
          unless on (origin) (up{job="node"} == 0)
        labels:
          severity: warning
          service: daniel-box
        annotations:
          summary: 'daniel-box: the renovate agent has not completed a clean run in 28 hours.'
          description: >-
            No renovate-agent verdict newer than 28 hours reached Prometheus from daniel-box's
            textfile collector: the daily 06:00 timer did not fire, the run crashed, or a
            worktree-blocked tick skipped it. Read `systemctl status homelab-renovate-agent.timer` and
            `journalctl -u homelab-renovate-agent`.
