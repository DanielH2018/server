# The Traefik edge, read from the `traefik-k8s` scrape job: the certificates it serves and the
# request counters. Plain YAML, never Jinja: prometheus-rules.yaml.j2 carries this file
# verbatim. The design is docs/archive/monitoring/m6-retire-kuma.md, batch A4.
#
# The scrape job sets no `service`, and Traefik's own `service` label names a backend, so every
# rule sets `service: traefik` as a literal. A rule that groups by Traefik's backend copies it to
# `backend` first with label_replace, because the literal replaces the series label of the same
# name. Each threshold carries the value of the monitor-bridge check it ports. A ported
# threshold's `DECIDED:` marker on its rule is what a retune is reviewed against.
#
# The volume floor (0.05 rps) is an `and` clause in each ratio rule: a single error
# on a near-idle route is not a 100% error ratio.
groups:
  - name: edge
    rules:
      # monitor-bridge's `cert` row. The series carry `cn`, `sans` and `serial`, so the alert
      # names every breaching certificate.
      # DECIDED: 14 days, the bridge's floor kept as is.
      - alert: CertExpiringSoon
        expr: (traefik_tls_certs_not_after{job="traefik-k8s"} - time()) / 86400 < 14
        for: 10m
        labels:
          severity: critical
          service: traefik
        annotations:
          summary: 'traefik: the certificate {{ $labels.cn }} expires within 14 days.'
          description: >-
            Traefik serves a certificate for {{ $labels.cn }} that expires in
            {{ $value | humanize }} days. Read Traefik's ACME log for a failed renewal, and
            `probe.py cert <host>` for the chain it serves.
          runbook_url: https://docs.local.daniel-hunter.com/alert-runbooks/#certexpiringsoon
      # `traefik5xx`: a backend's 5xx share over 5 minutes above 5%, behind the
      # volume floor.
      # DECIDED: 5% of requests over 5 minutes, held 5 minutes, only at 0.05 rps or more: the
      # bridge's values kept as is. The floor keeps one error on an idle route from reading 100%.
      - alert: TraefikBackend5xx
        expr: >-
          label_replace(
            (
              sum by (service) (rate(traefik_service_requests_total{job="traefik-k8s", code=~"5.."}[5m]))
              / sum by (service) (rate(traefik_service_requests_total{job="traefik-k8s"}[5m]))
              > 0.05
            )
            and
            (sum by (service) (rate(traefik_service_requests_total{job="traefik-k8s"}[5m])) >= 0.05),
            "backend", "$1", "service", "(.+)")
        for: 5m
        labels:
          severity: warning
          service: traefik
        annotations:
          summary: 'traefik: backend {{ $labels.backend }} answers over 5% of requests with a 5xx.'
          description: >-
            {{ $value | humanizePercentage }} of the requests Traefik sent to
            {{ $labels.backend }} in the last 5 minutes got a 5xx. Loki
            `{container="traefik"}` has the status codes, and the backend's own log has the
            cause.
      # `traefik_latency`: over 5% of a backend's requests slower than the 5.0s bucket,
      # with at least 3 of them in the window (the slow rate times the 300s window is the count),
      # behind the volume floor. The exempt services hold connections open, and the
      # histogram times a request to the end of its connection, so the regex excludes them from
      # every selector.
      # DECIDED: over 5% of requests past the 5.0s bucket, at least 3 slow requests in the 300s
      # window, and the 0.05 rps floor: the bridge's values kept as is.
      # The exempt services are headlamp (Kubernetes watch streams), home-assistant and
      # uptime-kuma (websocket UIs). A healthy stream lands past every bucket edge, since the
      # histogram times a request until its response completes. bazarr and prowlarr are not
      # exempt: an *arr indexer search takes 5-30s and the user waits for it, which is the
      # slowness this rule exists to catch. The regex matches `homelab-<name>-`, never the full
      # label, because the hash after it moves when an IngressRoute is renamed.
      # DECIDED: jellyfin is not exempt either (#6649). Its slow requests in the 168h soak were
      # MKV font fetches (`/Videos/<id>/<id>/Attachments/<n>`, 10 KB-8 MB, 5-8s each) at
      # playback start, 23-45 per episode: bounded responses the user waits on before subtitles
      # render. Its `/socket` WebSockets are streams (median 1204s), but at most 3 finished in
      # any 300s window and none moved the ratio past 5%. Exempting the service would blind the
      # rule to the attachment stall; a separate IngressRoute for `/socket` is the way to exempt
      # the WebSockets alone.
      # DECIDED: a 5-of-10-minute count, not `for: 5m`. The bridge pages this row on one bad
      # sample, and a burst that dips for a minute resets a `for:` hold, so 7 bad minutes of 10
      # on one backend never fired. keep_firing_for acts only after firing; [10m] rates smear
      # 4-minute bursts into pages.
      - alert: TraefikBackendSlow
        expr: >-
          label_replace(
            count_over_time(
              (
                (
                  (
                    sum by (service) (rate(traefik_service_request_duration_seconds_count{job="traefik-k8s", service!~"homelab-(headlamp|home-assistant|uptime-kuma)-.*"}[5m]))
                    - sum by (service) (rate(traefik_service_request_duration_seconds_bucket{job="traefik-k8s", le="5.0", service!~"homelab-(headlamp|home-assistant|uptime-kuma)-.*"}[5m]))
                  )
                  / sum by (service) (rate(traefik_service_request_duration_seconds_count{job="traefik-k8s", service!~"homelab-(headlamp|home-assistant|uptime-kuma)-.*"}[5m]))
                  > 0.05
                )
                and
                (
                  (
                    sum by (service) (rate(traefik_service_request_duration_seconds_count{job="traefik-k8s", service!~"homelab-(headlamp|home-assistant|uptime-kuma)-.*"}[5m]))
                    - sum by (service) (rate(traefik_service_request_duration_seconds_bucket{job="traefik-k8s", le="5.0", service!~"homelab-(headlamp|home-assistant|uptime-kuma)-.*"}[5m]))
                  ) * 300 >= 3
                )
                and
                (sum by (service) (rate(traefik_service_request_duration_seconds_count{job="traefik-k8s", service!~"homelab-(headlamp|home-assistant|uptime-kuma)-.*"}[5m])) >= 0.05)
              )[10m:1m]
            ) >= 5,
            "backend", "$1", "service", "(.+)")
        labels:
          severity: warning
          service: traefik
        annotations:
          summary: >-
            traefik: over 5% of backend {{ $labels.backend }}'s requests take longer than 5s.
          description: >-
            In {{ $value | printf "%.0f" }} of the last 10 minutes, over 5% of the requests to
            {{ $labels.backend }} in the trailing 5 minutes finished after the 5.0s histogram
            bucket. The backend is slow, not the edge. Its own log and its resource use are the
            next reads.
      # The bridge's "no 5.0s bucket" branch: a backend with traffic and no `le="5.0"` series
      # means Traefik's buckets changed, and the rule above reads that as quiet.
      - alert: TraefikLatencyBucketMissing
        expr: >-
          label_replace(
            sum by (service) (rate(traefik_service_request_duration_seconds_count{job="traefik-k8s", service!~"homelab-(headlamp|home-assistant|uptime-kuma)-.*"}[5m])) >= 0.05
            unless
            sum by (service) (rate(traefik_service_request_duration_seconds_bucket{job="traefik-k8s", le="5.0", service!~"homelab-(headlamp|home-assistant|uptime-kuma)-.*"}[5m])),
            "backend", "$1", "service", "(.+)")
        for: 10m
        labels:
          severity: warning
          service: traefik
        annotations:
          summary: 'traefik: no 5.0s latency bucket is emitted for {{ $labels.backend }}.'
          description: >-
            {{ $labels.backend }} serves requests but has no
            traefik_service_request_duration_seconds_bucket series with le="5.0", so
            TraefikBackendSlow cannot see it. Check the histogram buckets in Traefik's metrics
            configuration.
      # `traefik_404`: over 90% of ENTRYPOINT traffic is 404. The entrypoint
      # counter survives a total-404 edge, which erases the per-service series.
      # DECIDED: 90%, the bridge's value kept as is.
      - alert: TraefikEntrypoint404Flood
        expr: >-
          sum(rate(traefik_entrypoint_requests_total{job="traefik-k8s", code="404"}[5m]))
          / sum(rate(traefik_entrypoint_requests_total{job="traefik-k8s"}[5m]))
          > 0.9
          and on ()
          sum(rate(traefik_entrypoint_requests_total{job="traefik-k8s"}[5m])) >= 0.05
        for: 5m
        labels:
          severity: warning
          service: traefik
        annotations:
          summary: 'traefik: {{ $value | humanizePercentage }} of received requests get a 404.'
          description: >-
            {{ $value | humanizePercentage }} of the entrypoint traffic in the last 5 minutes
            was 404, the shape of an edge that lost its routers (#1322). Read Traefik's startup
            log for a router or plugin error.
      # `traefik_421`: a router answers 421 above 0.02 rps for three bridge
      # cycles (5 minutes apart, so 10 minutes between the first and
      # the third). A long-lived client connected while Traefik reconciled its routes and SNICheck
      # pinned the wrong TLS options on that connection.
      # DECIDED: 0.02 rps held 10 minutes, the bridge's rate and its three-cycle streak kept as
      # is, so a single 421 burst while Traefik reconciles does not page.
      # DECIDED: `for: 10m`, the bridge's three cycles, 5 minutes apart.
      - alert: TraefikRouter421
        expr: sum by (router) (rate(traefik_router_requests_total{job="traefik-k8s", code="421"}[5m])) > 0.02
        for: 10m
        labels:
          severity: warning
          service: traefik
        annotations:
          summary: 'traefik: router {{ $labels.router }} keeps answering 421.'
          description: >-
            {{ $labels.router }} answered 421 at {{ printf "%.2f" $value }} requests per second
            for 10 minutes. A client is wedged on a connection SNICheck pinned wrong. Restart the
            client that calls this router so it redials; a Traefik config change does not help.
      # This family's zero-series alert. A dropped `traefik-k8s` job, or a Traefik that scrapes
      # but exports no certificate or entrypoint series, leaves every rule above evaluating to
      # nothing. The bridge's cert row reads an empty vector as "cert metric unavailable" and
      # pages. The second arm requires up == 1, so a failed scrape stays the scrape-target
      # rule's page (M1 convention 5).
      - alert: EdgeMetricsMissing
        expr: >-
          absent(up{job="traefik-k8s"})
          or
          (
            (
              absent(traefik_tls_certs_not_after{job="traefik-k8s"})
              or
              absent(traefik_entrypoint_requests_total{job="traefik-k8s"})
            )
            and on () (up{job="traefik-k8s"} == 1)
          )
        for: 10m
        labels:
          severity: warning
          service: traefik
        annotations:
          summary: 'traefik: Prometheus has lost the scrape job or its edge series.'
          description: >-
            Either no up{job="traefik-k8s"} series exists, so the job is gone from
            prometheus.yml, or the scrape works and the certificate or entrypoint counters are
            missing. The edge rules cannot fire until the series are back.
