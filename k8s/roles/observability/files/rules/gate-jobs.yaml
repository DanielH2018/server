# The Jobs a landing waits on (#5675): flux_soak.py's `soak-<rev>`, each tag's
# `snapshot-<tag>-<rev>` and each tag's `<tag>-verify-<rev>`. Their durations were copied from
# Job logs into prose before kube-state-metrics collected jobs. Plain YAML, never Jinja:
# prometheus-rules.yaml.j2 carries this file verbatim.
#
# A Job still running has no completion time, so it records nothing here.
# kube_job_status_active says it runs, and kube_job_status_succeeded and
# kube_job_status_failed carry each Job's outcome. The group holds recording rules only, so
# nothing here routes to Alertmanager.
groups:
  - name: gate-jobs
    rules:
      - record: homelab:gate_job_duration_seconds
        expr: >-
          label_replace(
            kube_job_status_completion_time{job_name=~"soak-.+|snapshot-.+|.+-verify-.+"}
            - kube_job_status_start_time,
            "gate", "$1", "job_name", "(?:.*-)?(soak|snapshot|verify)-.+"
          )
