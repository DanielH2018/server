---
# Claude Code exports to localhost:4317 on each host, which keeps its own data (fixed by the chezmoi
# settings template).

# Pinned, Renovate-tracked.
observability_k8s_collector_image: otel/opentelemetry-collector-contrib:0.165.0@sha256:e40d61f10c9a617cca1ffd1be4d7e2b3a4b0f0001798ff07e58cabe82e618cea
observability_k8s_loki_image: grafana/loki:3.7.9@sha256:0db216b630ae1f348a1584c67f3cead8b4c1fc839169a39501db664744158e28
observability_k8s_prometheus_image: prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
# scripts/validate/alert_tools.sh reads this tag, as it reads the Prometheus one above, to
# provision amtool for the validate-alert-rules hook, so the Alertmanager this role runs and the
# amtool CI checks its config with move in one Renovate bump.
observability_k8s_alertmanager_image: prom/alertmanager:v0.35.0@sha256:e638797febd034838eca8b98cdbd46f951e9bf7f178777aa8669167406a9946c
# Grafana 12 removed Angular, so every `graph` panel must be converted to `timeseries` and
# deployed before a major bump, not alongside it.
#
# DECIDED: grafana-data stays on longhorn-nobackup (operator declined a backup 2026-08-21);
# dashboards and datasources are provisioned from git.
# Grafana's schema migrations are one-way, which is tolerable because of that: the DB holds
# only preferences, version history and annotations. Recovery is deleting the PVC.
observability_k8s_grafana_image: grafana/grafana:13.3.1@sha256:0615ec4fbd4072004b7d86b46ded63013a74b7d6eb1119273dd89e8fa25c13cf

# The budget of the observability-prepull Kustomization, whose Job pulls Grafana's image onto
# its node before the observability Kustomization applies
# (scripts/renderer/renderer_lib/prepull.py). Grafana is `Recreate`, so without it the
# dashboards are down for the whole pull. The pinned amd64 image is 482 MB, and 600s covers it
# down to 0.8 MB/s. The Job has no deadline, so a pull slower still costs that revision its
# verdict, the Job keeps pulling, and Flux applies observability on a later retry.
flux_prepull_timeout: 600s
# Grafana alone: the other images pin no node, and loki, tempo and kube-state-metrics carry no `sh`
# for the Job's script.
flux_prepull_workloads: [grafana]
# Distinct from k3s's bundled metrics-server: this exports kube_pod_status_ready and
# kube_deployment_status_*.
observability_k8s_kube_state_metrics_image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.20.0@sha256:42cfe3723a5f058171c627537fb57a3ea0f26e4380fa18555a95cb1a1b4cfc5b

# kube-state-metrics' custom-resource-state config for the Flux kinds. It produces
# gotk_resource_info, one series per Kustomization and OCIRepository, which the Flux
# controllers do not export themselves (docs/flux-deploy-plane.md).
#
# kube-state-metrics.yaml.j2 passes it inline as --custom-resource-state-config through
# to_json, not as a ConfigMap. The config then lives in the pod template, so a change here
# rolls kube-state-metrics through the apply, and the role gains no ConfigMap key for
# test_observability_config_rolls_one_workload.py to track.
#
# The metric name, the labels and `exported_namespace` follow fluxcd/flux2-monitoring-example,
# so upstream Flux boards and rules read these series unchanged, with one exception: a
# Kustomization's `revision` reads status.lastAppliedOriginRevision (`master@sha1:<sha>`), the
# field contracts.md C6 names, where upstream reads lastAppliedRevision (`prod@sha256:<digest>`),
# which names no commit. A second addition, `content_digest`, reads the annotation the renderer
# stamps on Kustomization `<tag>` (bundle.py:CONTENT_DIGEST). It is the digest of the tag's own
# rendered directory, so it holds across a master commit that moves `revision` without touching
# the tag, and C7's flux reference time matches on it. A change to the tag adds one
# short-lived series: the root Kustomization `homelab` stamps the new annotation and the tag's
# own Kustomization reports the new revision, in either order.
#
# kube-state-metrics drops a label whose path is absent. The flux role omits spec.suspend
# unless its suspend lever is on, so `suspended` is absent rather than "false" on an object
# Flux is reconciling, and a rule reading it matches suspended="true".
#
# Each kind here needs list and watch in the ClusterRole in kube-state-metrics.yaml.j2.
observability_ksm_flux_resource_state:
  kind: CustomResourceStateMetrics
  spec:
    resources:
      - groupVersionKind: {group: kustomize.toolkit.fluxcd.io, version: v1, kind: Kustomization}
        metricNamePrefix: gotk
        metrics:
          - name: resource_info
            help: The current state of a Flux Kustomization.
            each:
              type: Info
              info:
                labelsFromPath:
                  name: [metadata, name]
            labelsFromPath:
              exported_namespace: [metadata, namespace]
              ready: [status, conditions, "[type=Ready]", status]
              suspended: [spec, suspend]
              revision: [status, lastAppliedOriginRevision]
              content_digest: [metadata, annotations, homelab/content-digest]
              source_name: [spec, sourceRef, name]
      - groupVersionKind: {group: source.toolkit.fluxcd.io, version: v1, kind: OCIRepository}
        metricNamePrefix: gotk
        metrics:
          - name: resource_info
            help: The current state of a Flux OCIRepository.
            each:
              type: Info
              info:
                labelsFromPath:
                  name: [metadata, name]
            labelsFromPath:
              exported_namespace: [metadata, namespace]
              ready: [status, conditions, "[type=Ready]", status]
              suspended: [spec, suspend]
              revision: [status, artifact, revision]
              url: [spec, url]

# Renovate stance: whether an image bump here may automerge. `promote` deploys what merges.
# Observability: the Claude Code telemetry stack (collector/Loki/Prometheus/Grafana/Tempo/
# kube-state-metrics/Alertmanager) — a broken deploy blinds this whole diagnostic surface with nothing else
# watching it. ALSO Recreate + a PVC on each stateful sub-service (loki-data, grafana-data,
# prometheus-data, tempo-data, alertmanager-data) — several independently migrating-state-shaped Deployments behind
# one role, which compounds the risk across more than one component at once.
k8s_autodeploy: false
k8s_autodeploy_reason: "observability — the cluster metrics plane and Claude Code's own telemetry stack, one sub-image per workload across several Deployments. ALSO each stateful component (loki/grafana/prometheus/tempo/alertmanager) is Recreate + its own PVC — compounding, not single-component. COUPLING NOTE for a future promotion: UI-edited Grafana dashboards live only in the PVC until an export script round-trips them to git; a revert discards unsaved edits"

# longhorn-nobackup, not longhorn: Loki holds prompts, responses and tool output verbatim, which the
# default class would copy into B2. Loki and Prometheus are also bulky, regenerable state.
observability_storage_class: longhorn-nobackup
observability_loki_storage: 10Gi
observability_prometheus_storage: 12Gi
# Provisioned from ConfigMaps, so only UI state is lost; but allowUiUpdates is true, so a UI-edited
# board lives only here until export_grafana_dashboards.py round-trips it into git.
observability_grafana_storage: 1Gi
# A rebuild drops every active silence, so silenced alerts page again.
observability_alertmanager_storage: 1Gi

# Claims live beside their workloads in k8s_observability_namespace; applied by the directory apply
# after 00-namespace.yaml.
k8s_claims:
  - name: loki-data
    storage_class: "{{ observability_storage_class }}"
    size: "{{ observability_loki_storage }}"
    namespace: "{{ k8s_observability_namespace }}"
  - name: prometheus-data
    storage_class: "{{ observability_storage_class }}"
    size: "{{ observability_prometheus_storage }}"
    namespace: "{{ k8s_observability_namespace }}"
  - name: grafana-data
    storage_class: "{{ observability_storage_class }}"
    size: "{{ observability_grafana_storage }}"
    namespace: "{{ k8s_observability_namespace }}"
  - name: tempo-data
    storage_class: "{{ observability_storage_class }}"
    size: "{{ observability_tempo_storage }}"
    namespace: "{{ k8s_observability_namespace }}"
  - name: alertmanager-data
    storage_class: "{{ observability_storage_class }}"
    size: "{{ observability_alertmanager_storage }}"
    namespace: "{{ k8s_observability_namespace }}"

# Loopback hostPort on the node, deliberately not a MetalLB VIP: with content logging on, it must
# not be LAN-reachable.
# Paired with claude_code_otlp_host_ip/_port; test_claude_artifacts_node_timers.py holds them equal.
observability_otlp_port: 4317
observability_otlp_host_ip: 127.0.0.1
# otelq hardcodes 127.0.0.1 on 3100/9090/3200, so a ClusterIP-only Service is unreachable; these
# backends hold prompts verbatim, so the node listener must never bind 0.0.0.0.
observability_query_host_ip: 127.0.0.1

# Pinned because they are quoted as constants outside this repo: with hostPort on unpinned replicas
# only one node answers on loopback, and otelq/otel-sweep fall back to these addresses.
# spec.clusterIP is immutable; moving one means deleting the Service and updating the constants in
# both repos.
observability_loki_cluster_ip: 10.43.99.158
observability_prometheus_cluster_ip: 10.43.39.218
observability_tempo_cluster_ip: 10.43.4.147

# Every prompt and response is kept verbatim for this window.
observability_loki_retention: 744h
# Dashboard folders, each with the boards it provisions. The folders are the subdirectories of
# k8s/roles/observability/files/dashboards, which is the single source of truth for the JSON.
# templates/grafana-dashboards.yaml.j2 renders one ConfigMap per folder holding the boards listed
# here, so a board on disk that is not listed reaches no Grafana, and a listed board with no file
# fails the render. tests/services/dashboards/test_dashboard_configmaps.py holds the lists to the
# files, and names the entry a new board needs.
# DECIDED: this map has no folder-level prune, and that is deliberate (operator 2026-08-28).
# Dropping a folder here removes its volume and volumeMount from grafana.yaml.j2 (both
# rendered by `{% for folder in observability_dashboard_folders %}`, at the volumeMounts and volumes
# blocks) but leaves the live grafana-dashboards-<folder> ConfigMap behind. That orphan is INERT:
# the mount is by explicit per-folder volume name, so an unlisted ConfigMap is never mounted and
# never reaches Grafana. Adding a prune would trade an inert orphan for deletion behaviour that
# can remove a live ConfigMap — a worse failure than the one it closes. Reopen only with a
# case where the orphan is reachable, not merely present.
observability_dashboard_folders:
  AI:
    - claude-code-host-cgroups.json
    - claude-code-pipeline-health-cost-by-host.json
    - claude-code-usage-observability.json
  Apps:
    - exportarr-arr-stack.json
    - home-assistant-overview.json
    - speedtest-tracker.json
    - terraria-player-stats.json
    - valheim-player-stats.json
  Infrastructure:
    - alert-history.json
    - docker-and-system-monitoring.json
    - hardware-thermal.json
    - homelab-history.json
    - host-jobs.json
    - landings.json
    - longhorn-storage.json
    - node-exporter-full.json
    - ups-power-battery.json
  Logs:
    - logs.json
    - loki-internals.json
  Networking:
    - traefik-custom.json
  Security:
    - crowdsec-details-per-machine.json
    - crowdsec-insight.json
    - crowdsec-overview.json
    - lapi-metrics.json

# The uid MUST equal the `loki-homelab` datasource uid in templates/grafana.yaml.j2; a wrong one
# silently shows no deploy markers (test_deploy_annotations.py holds them in lockstep). No Grafana
# API call, so no standing write credential.
observability_loki_homelab_uid: bf4q19tuivta8e
# `|= "event=deploy"` before `| logfmt`: the line filter is far cheaper than parsing every syslog
# line.
observability_deploy_annotation_expr: '{job="syslog"} |= "event=deploy" | logfmt'
# A LogQL log query has one stream selector, so the soak Job's deploy line needs a second annotation
# query.
observability_flux_deploy_annotation_expr: >-
  {job="k8s", namespace="flux-system", container="soak"} |= "event=deploy" | logfmt

observability_prometheus_retention: 30d
# DECIDED: the size cap binds before the 30d time cap; read
# (time() - prometheus_tsdb_lowest_timestamp_seconds)/86400 before any retention claim.
#
# Deliberately well under observability_prometheus_storage (12Gi), not close to it. What the cap
# counts is persisted blocks PLUS the WAL and the m-mapped head chunks; what it does NOT cover is
# compaction, which needs room for the output block alongside its inputs. Sizing it near the
# volume is how a size-capped Prometheus still fills its disk; the ~58% ratio below is the
# thing to hold, not the absolute.
#
# Raising it does not defer a cardinality problem. With the four control-plane jobs at a 1m
# scrape interval, 30 days costs ~6.6GB (1957.7 samples/s x 1.297 bytes/sample = 219 MB/day).
observability_prometheus_retention_size: 7GB

# Tempo 3.0 refuses vParquet3 and earlier blocks, so the instance must already write vParquet4 (read
# /status/config).
observability_k8s_tempo_image: grafana/tempo:3.1.1@sha256:64e2fbd56d9c2b3412a4b430a58ea59e91a670b1e75f920a0c702213ad145044
observability_tempo_storage: 5Gi
# Own variable: spans are bulky, so this is the value most likely to need cutting first if the PVC
# fills.
observability_tempo_retention: 720h

# How often Alertmanager re-sends the always-firing Watchdog alert to its Healthchecks.io check,
# in whole seconds. alertmanager-secret.yaml.j2 renders it as the Watchdog route's
# `repeat_interval`, so no reader parses a duration string. The check's 600s period must stay
# well above it, or one late send pages. The M1 slice plan
# (docs/archive/monitoring/m1-alertmanager.md) sizes the check.
observability_alertmanager_watchdog_repeat_seconds: 60

# A rule file this list does not name never reaches Prometheus; add the group in the commit that
# adds its file (scripts/validate/alert_rules.py fails until they agree).
observability_rule_groups:
  - alerting-meta
  - workload-service
  - k8s-workloads
  - k8s-services
  - loki-homelab
  - flux
  - ingress-probes
  - host-checks
  - initial-setup-checks
  - gitops-checks
  - pi-checks
  - other-setup-checks
  - deploy-pipeline
  - gate-jobs
  - registry
  - bridge-exporter
  - container-checks
  - scrape-targets
  - log-pipeline
  - edge
  - storage
  - hosts
  - extra-probes
  - pod-producers
  - pods
  - k3s-upgrade
  - arr-apps

# The host table: every host, each with the scrape job that reads its node exporter and the age
# in seconds past which its last successful update pages. scripts/dev/gen_host_rules.py renders
# the host-checks and hosts rule groups from files/rule-tables/ over these hosts, one literal
# copy per host a rule's selector takes, and refuses to render while an inventory host is
# missing here.
# scripts/renderer/tests/host/test_renderer_host_update_limits.py fails a limit shorter than the
# longest gap between two of the host's updater fires plus the updater's TimeoutStartSec, read
# from the rendered timer and its drop-in. A host that ships homelab-docker-engine.timer also
# needs the gap that the engine run's mask opens: the run can hold the updater masked for its
# whole TimeoutStartSec. daniel-pi runs H3.13's daily drop-in, which fires at 03:05 after
# the 00:30 engine run ends, so its limit covers one day plus one updater run. daniel-box and
# daniel-server ship no drop-in, so the shared 5-minute schedule needs 3360s: 5 minutes, 60s of
# randomized delay and the 50-minute timeout. Their 3600s adds 4 minutes over that.
observability_expected_hosts:
  daniel-box: {job: node, limit_seconds: 3600}
  daniel-pi: {job: node-pi, limit_seconds: 90000}
  daniel-server: {job: node, limit_seconds: 3600}

# The telemetry workloads, as the {kind, name} pairs `manifests_self_rollouts` reads. The renderer stamps `checksum/restart` on each one's pod template
# (scripts/renderer/renderer_lib/restart.py), so a Secret or ConfigMap change rolls the
# workload that reads it.
#
# `restart_on` is the Ansible release record's field, and the renderer ignores it for a
# self-rollout entry (restart.py). Every entry is `[]`: a `secret` trigger would hold a reader
# to a roll that another Secret file's edit never made. A ConfigMap is hashed into its own pod
# template (`checksum/config`), so the apply moves the pod template and rolls the pod by
# itself; kube-state-metrics renders no ConfigMap at all, and every input it does have already
# lives in the pod template.
#
# `restart_secrets` names the rendered Secret files a workload's pod reads. prometheus
# file-mounts `prometheus-scrape-credentials`, grafana reads `grafana-admin` through
# `env.valueFrom`, and alertmanager file-mounts `alertmanager-config`, its whole config. The
# renderer derives the restart from the Secrets the pod template names, so an alertmanager
# config edit rolls alertmanager alone. The key stays as the declaration
# tests/services/scraping/test_observability_config_rolls_one_workload.py holds equal to the
# Secrets each pod reads. `origin-pull-secret.yaml` restarts nothing, because only a Traefik
# middleware reads it.
observability_stabilise_workloads:
  - { kind: deploy, name: loki, restart_on: [] }
  - kind: deploy
    name: prometheus
    restart_on: []
    restart_secrets: [secret-prometheus-scrape-credentials.yaml]
  - { kind: deploy, name: kube-state-metrics, restart_on: [] }
  - { kind: deploy, name: tempo, restart_on: [] }
  - { kind: daemonset, name: otel-collector, restart_on: [] }
  - kind: deploy
    name: grafana
    restart_on: []
    restart_secrets: [secret-grafana-admin.yaml, grafana-warehouse-datasource-secret.yaml]
  - kind: deploy
    name: alertmanager
    restart_on: []
    restart_secrets: [alertmanager-secret.yaml]

# The entry's `port` is Grafana's, whose Service grafana.yaml renders itself.
manifests_exclude_files: [service.yaml]

# The shared role waits on ONE Deployment in the homelab namespace; this role has several,
# elsewhere.
manifests_rollout: ''

# `namespace` is load-bearing: the fingerprints default to k8s_namespace.
manifests_self_rollouts: >-
  {{ observability_stabilise_workloads
     | map('combine', {'namespace': k8s_observability_namespace}) | list }}

render_secrets:
  - name: grafana-admin
    namespace: "{{ k8s_observability_namespace }}"
    string_data:
      password: grafana_admin_password
      # Authelia holds only the pbkdf2 digest `grafana_oidc_client_secret_hash`, so rotate the two
      # keys together.
      oidc_client_secret: grafana_oidc_client_secret
  # File-mounted via password_file or credentials_file, keeping values out of the prometheus-config
  # ConfigMap.
  - name: prometheus-scrape-credentials
    namespace: "{{ k8s_observability_namespace }}"
    string_data:
      ha_token: prometheus_ha_token
