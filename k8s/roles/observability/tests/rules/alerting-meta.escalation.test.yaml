# promtool unit tests for WarningUnresolved in files/rules/alerting-meta.yaml, whose hold runs
# to 48 hours. Run with `scripts/validate/alert_tools.sh promtool test rules <this file>`.
#
# The interval is file-wide, and a 50h case at alerting-meta.test.yaml's 1m step is 3,000
# steps, so every eval time and input series here steps by whole hours.
# `alert_conventions.rule_test_stem` counts these cases toward alerting-meta with the main
# file's, whose zero-series case covers this file too. Each case feeds a healthy Alertmanager scrape, because AlertmanagerMetricsMissing is a
# warning and would otherwise escalate beside the alert under test.
#
# The input is ALERTS itself, the series Prometheus writes for every rule's pending and firing
# alerts. tests/services/alertmanager/test_warning_escalation_exemptions.py holds the real rules'
# labels to the selector.
rule_files:
  - ../../files/rules/alerting-meta.yaml
evaluation_interval: 1h
tests:
  # A warning that fires for 60 hours escalates once it has held 48, and not before. The
  # original name and service move to escalated_from and escalated_service, and its other
  # labels stay.
  - interval: 1h
    input_series:
      - series: 'up{job="alertmanager", instance="alertmanager:9093"}'
        values: '1x60'
      - series: 'alertmanager_notifications_failed_total{job="alertmanager", instance="alertmanager:9093", integration="discord", reason="other"}'
        values: '0x60'
      - series: 'ALERTS{alertname="DocsRefreshFailed", alertstate="firing", severity="warning", service="daniel-box", check="docs-refresh", origin="daniel-box"}'
        values: '1x60'
    alert_rule_test:
      - eval_time: 47h
        alertname: WarningUnresolved
        exp_alerts: []
      - eval_time: 49h
        alertname: WarningUnresolved
        exp_alerts:
          - exp_labels:
              escalated_from: DocsRefreshFailed
              escalated_service: daniel-box
              check: docs-refresh
              origin: daniel-box
              severity: critical
              service: alert-escalation
            exp_annotations:
              summary: 'daniel-box: DocsRefreshFailed has fired as a warning for 48 hours.'
              description: >-
                Fix the warning DocsRefreshFailed for daniel-box, which has fired for 48 hours; the
                Karma link lists it with its own description and runbook. This page resolves when
                the warning does. A warning that holds by design takes the rule label escalate:
                "false".
              runbook_url: https://docs.local.daniel-hunter.com/alert-runbooks/#warningunresolved

  - interval: 1h
    input_series:
      - series: 'up{job="alertmanager", instance="alertmanager:9093"}'
        values: '1x50'
      - series: 'alertmanager_notifications_failed_total{job="alertmanager", instance="alertmanager:9093", integration="discord", reason="other"}'
        values: '0x50'
      - series: 'ALERTS{alertname="SystemdUnitsFailed", alertstate="firing", severity="warning", service="daniel-box", check="systemd-units", origin="daniel-box", unit="nut-monitor.service"}'
        values: '1x50'
      - series: 'ALERTS{alertname="SystemdUnitsFailed", alertstate="firing", severity="warning", service="daniel-box", check="systemd-units", origin="daniel-box", unit="systemd-fsck@dev-disk-by\\x2duuid-1.service"}'
        values: '1x50'
    alert_rule_test:
      - eval_time: 49h
        alertname: WarningUnresolved
        exp_alerts:
          - exp_labels:
              escalated_from: SystemdUnitsFailed
              escalated_service: daniel-box
              check: systemd-units
              origin: daniel-box
              unit: nut-monitor.service
              severity: critical
              service: alert-escalation
            exp_annotations:
              summary: >-
                daniel-box: SystemdUnitsFailed (nut-monitor.service) has fired as a warning for 48
                hours.
              description: >-
                Fix the warning SystemdUnitsFailed for daniel-box, which has fired for 48 hours; the
                Karma link lists it with its own description and runbook. This page resolves when
                the warning does. A warning that holds by design takes the rule label escalate:
                "false".
              runbook_url: https://docs.local.daniel-hunter.com/alert-runbooks/#warningunresolved
          - exp_labels:
              escalated_from: SystemdUnitsFailed
              escalated_service: daniel-box
              check: systemd-units
              origin: daniel-box
              unit: "systemd-fsck@dev-disk-by\\x2duuid-1.service"
              severity: critical
              service: alert-escalation
            exp_annotations:
              summary: >-
                daniel-box: SystemdUnitsFailed (systemd-fsck@dev-disk-by\x2duuid-1.service) has
                fired as a warning for 48 hours.
              description: >-
                Fix the warning SystemdUnitsFailed for daniel-box, which has fired for 48 hours; the
                Karma link lists it with its own description and runbook. This page resolves when
                the warning does. A warning that holds by design takes the rule label escalate:
                "false".
              runbook_url: https://docs.local.daniel-hunter.com/alert-runbooks/#warningunresolved

  - interval: 1h
    input_series:
      - series: 'up{job="alertmanager", instance="alertmanager:9093"}'
        values: '1x50'
      - series: 'alertmanager_notifications_failed_total{job="alertmanager", instance="alertmanager:9093", integration="discord", reason="other"}'
        values: '0x50'
      - series: 'ALERTS{alertname="SystemdUnitsFailed", alertstate="firing", severity="warning", service="daniel-box", check="systemd-units", origin="daniel-box", unit="homelab-builder.service", paged_by="homelab-alert"}'
        values: '1x50'
    alert_rule_test:
      - eval_time: 49h
        alertname: WarningUnresolved
        exp_alerts:
          - exp_labels:
              escalated_from: SystemdUnitsFailed
              escalated_service: daniel-box
              check: systemd-units
              origin: daniel-box
              unit: homelab-builder.service
              severity: critical
              service: alert-escalation
            exp_annotations:
              summary: >-
                daniel-box: SystemdUnitsFailed (homelab-builder.service) has fired as a warning for
                48 hours.
              description: >-
                Fix the warning SystemdUnitsFailed for daniel-box, which has fired for 48 hours; the
                Karma link lists it with its own description and runbook. This page resolves when
                the warning does. A warning that holds by design takes the rule label escalate:
                "false".
              runbook_url: https://docs.local.daniel-hunter.com/alert-runbooks/#warningunresolved

  - interval: 1h
    input_series:
      - series: 'up{job="alertmanager", instance="alertmanager:9093"}'
        values: '1x62'
      - series: 'alertmanager_notifications_failed_total{job="alertmanager", instance="alertmanager:9093", integration="discord", reason="other"}'
        values: '0x62'
      - series: 'ALERTS{alertname="EvalSweepFailed", alertstate="firing", severity="warning", service="daniel-box"}'
        values: '1x30 _ 1x30'
      - series: 'ALERTS{alertname="DocsRefreshFailed", alertstate="firing", severity="warning", service="daniel-box"}'
        values: '1x25 _x9 1x26'
    alert_rule_test:
      - eval_time: 61h
        alertname: WarningUnresolved
        exp_alerts:
          - exp_labels:
              escalated_from: EvalSweepFailed
              escalated_service: daniel-box
              severity: critical
              service: alert-escalation
            exp_annotations:
              summary: 'daniel-box: EvalSweepFailed has fired as a warning for 48 hours.'
              description: >-
                Fix the warning EvalSweepFailed for daniel-box, which has fired for 48 hours; the
                Karma link lists it with its own description and runbook. This page resolves when
                the warning does. A warning that holds by design takes the rule label escalate:
                "false".
              runbook_url: https://docs.local.daniel-hunter.com/alert-runbooks/#warningunresolved

  # None of these escalate after 60 hours: a pending warning, a critical (it already emails),
  # an info, a shadow and a drill alert (they page nobody), and a rule that opts out with
  # escalate="false".
  - interval: 1h
    input_series:
      - series: 'up{job="alertmanager", instance="alertmanager:9093"}'
        values: '1x60'
      - series: 'alertmanager_notifications_failed_total{job="alertmanager", instance="alertmanager:9093", integration="discord", reason="other"}'
        values: '0x60'
      - series: 'ALERTS{alertname="FluxSuspended", alertstate="pending", severity="warning", service="flux"}'
        values: '1x60'
      - series: 'ALERTS{alertname="EtcdRestoreDrillFailed", alertstate="firing", severity="critical", service="etcd"}'
        values: '1x60'
      - series: 'ALERTS{alertname="SomeInfo", alertstate="firing", severity="info", service="observability"}'
        values: '1x60'
      - series: 'ALERTS{alertname="TextfileCollectorError", alertstate="firing", severity="warning", service="daniel-box", shadow="true"}'
        values: '1x60'
      - series: 'ALERTS{alertname="HealthGateDrill", alertstate="firing", severity="warning", service="observability", drill="true"}'
        values: '1x60'
      - series: 'ALERTS{alertname="DeployHoldActive", alertstate="firing", severity="warning", service="deploy-pipeline", escalate="false"}'
        values: '1x60'
    alert_rule_test:
      - eval_time: 60h
        alertname: WarningUnresolved
        exp_alerts: []
