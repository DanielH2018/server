# promtool unit tests for files/rules/pi-checks.yaml. Run with
# `scripts/validate/alert_tools.sh promtool test rules <this file>`; the validate-alert-rules
# hook runs it on every commit that touches the rules.
#
# Both deadlines are 900s, so the cases step a minute at a time. `evaluation_interval` and every
# input series use 1m, which puts a sample on each evaluation and keeps the 5m lookback out of the
# arithmetic. The input series carry the labels the `node-pi` scrape job adds. promtool's `time()`
# is the evaluation time in seconds from 0, so a frozen timestamp series stays at 0 and a fresh one
# reads 60 x the minute index (`0+60xN`).
#
# A NotReporting rule fires with one of two label sets. Its first arm keeps the series' labels,
# `job` and `instance` included. Its absent_over_time arm carries only the equality matchers'
# `check` and `origin`.
rule_files:
  - ../../files/rules/pi-checks.yaml
evaluation_interval: 1m
tests:
  # The zero-series case: no input at all, so no verdict has existed for longer than any deadline.
  # Both NotReporting rules fire through absent_over_time, and no Failed rule has a series to read.
  - interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 30m
        alertname: PiSdHealthNotReporting
        exp_alerts:
          - exp_labels: {check: pi-sd-health, origin: daniel-pi, severity: critical, service: daniel-pi}
            exp_annotations:
              summary: daniel-pi's SD-card health heartbeat has stopped reporting.
              description: >-
                No pi-sd-health verdict newer than 15 minutes reached Prometheus from daniel-pi's
                textfile collector, so nothing confirms the SD card is being watched. Read
                `systemctl status homelab-pi-sd-health.timer` on daniel-pi, then
                /var/lib/node-exporter-textfile/pi-sd-health.prom.
      - eval_time: 30m
        alertname: PiSdHealthFailed
        exp_alerts: []
      - eval_time: 30m
        alertname: PiRecoveryNotReporting
        exp_alerts:
          - exp_labels: {check: pi-recovery-health, origin: daniel-pi, severity: warning, service: daniel-pi}
            exp_annotations:
              summary: daniel-pi's container-recovery heartbeat has stopped reporting.
              description: >-
                No pi-recovery-health verdict newer than 15 minutes reached Prometheus from daniel-pi's
                textfile collector, so nothing confirms the Pi's containers are being watched.
                Read `systemctl status homelab-pi-recovery.timer` on daniel-pi, then
                /var/lib/node-exporter-textfile/pi-recovery-health.prom. A host that sets
                optimize_pi_recovery_restart_enabled false drops the timer and fires this on
                purpose.
      - eval_time: 30m
        alertname: PiRecoveryFailed
        exp_alerts: []

  # Each Failed rule: a verdict of 0 fires it with the host's labels, and a verdict of 1 does not.
  # The first minutes are the control for the rest.
  - interval: 1m
    input_series:
      - series: 'homelab_check_success{check="pi-sd-health", instance="daniel-pi", job="node-pi", origin="daniel-pi"}'
        values: '1x3 0x3'
      - series: 'homelab_check_success{check="pi-recovery-health", instance="daniel-pi", job="node-pi", origin="daniel-pi"}'
        values: '1x3 0x3'
    alert_rule_test:
      - eval_time: 2m
        alertname: PiSdHealthFailed
        exp_alerts: []
      - eval_time: 4m
        alertname: PiSdHealthFailed
        exp_alerts:
          - exp_labels: {check: pi-sd-health, instance: daniel-pi, job: node-pi, origin: daniel-pi, severity: critical, service: daniel-pi}
            exp_annotations:
              summary: daniel-pi's SD-card health heartbeat reported a failure.
              description: >-
                pi-sd-health on daniel-pi ended with status=down: the root filesystem's ext4
                errors_count is nonzero or unreadable, the rotated-log integrity verdict is bad
                or stale, or /var/log is not log2ram's tmpfs. The `pi-sd-health` line in
                /var/log/pi-health/health.log names the failing leg. Only a nonzero
                errors_count calls for an fsck and a card replacement; a /var/log that is not
                a tmpfs means log2ram refused to start, and a reboot after its cause is fixed
                recovers it.
      - eval_time: 2m
        alertname: PiRecoveryFailed
        exp_alerts: []
      - eval_time: 4m
        alertname: PiRecoveryFailed
        exp_alerts:
          - exp_labels: {check: pi-recovery-health, instance: daniel-pi, job: node-pi, origin: daniel-pi, severity: warning, service: daniel-pi}
            exp_annotations:
              summary: daniel-pi's container-recovery heartbeat found a container not running.
              description: >-
                pi-recovery-health on daniel-pi ended with status=down: a watched container was
                not running, whether or not its restart took. The `pi-recovery-health` line in
                /var/log/pi-health/health.log names the container, why it died and any dockerd
                fault.

  # The file stopped being refreshed: node_exporter keeps serving the timestamp written at 0. The
  # first arm is quiet when the gap equals the deadline (15m) and fires one minute later.
  - interval: 1m
    input_series:
      - series: 'homelab_check_last_run_timestamp_seconds{check="pi-sd-health", instance="daniel-pi", job="node-pi", origin="daniel-pi"}'
        values: '0x30'
      - series: 'homelab_check_last_run_timestamp_seconds{check="pi-recovery-health", instance="daniel-pi", job="node-pi", origin="daniel-pi"}'
        values: '0x30'
      - series: 'up{instance="daniel-pi", job="node-pi", origin="daniel-pi"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 15m
        alertname: PiSdHealthNotReporting
        exp_alerts: []
      - eval_time: 16m
        alertname: PiSdHealthNotReporting
        exp_alerts:
          - exp_labels: {check: pi-sd-health, instance: daniel-pi, job: node-pi, origin: daniel-pi, severity: critical, service: daniel-pi}
            exp_annotations:
              summary: daniel-pi's SD-card health heartbeat has stopped reporting.
              description: >-
                No pi-sd-health verdict newer than 15 minutes reached Prometheus from daniel-pi's
                textfile collector, so nothing confirms the SD card is being watched. Read
                `systemctl status homelab-pi-sd-health.timer` on daniel-pi, then
                /var/lib/node-exporter-textfile/pi-sd-health.prom.
      - eval_time: 15m
        alertname: PiRecoveryNotReporting
        exp_alerts: []
      - eval_time: 16m
        alertname: PiRecoveryNotReporting
        exp_alerts:
          - exp_labels: {check: pi-recovery-health, instance: daniel-pi, job: node-pi, origin: daniel-pi, severity: warning, service: daniel-pi}
            exp_annotations:
              summary: daniel-pi's container-recovery heartbeat has stopped reporting.
              description: >-
                No pi-recovery-health verdict newer than 15 minutes reached Prometheus from daniel-pi's
                textfile collector, so nothing confirms the Pi's containers are being watched.
                Read `systemctl status homelab-pi-recovery.timer` on daniel-pi, then
                /var/lib/node-exporter-textfile/pi-recovery-health.prom. A host that sets
                optimize_pi_recovery_restart_enabled false drops the timer and fires this on
                purpose.

  # A healthy heartbeat writes every 5 minutes, so the timestamp keeps up and neither rule fires.
  - interval: 1m
    input_series:
      - series: 'homelab_check_last_run_timestamp_seconds{check="pi-sd-health", instance="daniel-pi", job="node-pi", origin="daniel-pi"}'
        values: '0+300x10'
      - series: 'homelab_check_last_run_timestamp_seconds{check="pi-recovery-health", instance="daniel-pi", job="node-pi", origin="daniel-pi"}'
        values: '0+300x10'
      - series: 'up{instance="daniel-pi", job="node-pi", origin="daniel-pi"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 10m
        alertname: PiSdHealthNotReporting
        exp_alerts: []
      - eval_time: 10m
        alertname: PiRecoveryNotReporting
        exp_alerts: []

  # The file is gone from minute 2, so the series goes stale while the exporter stays up. The
  # absent_over_time arm stays quiet while any sample lies inside the deadline window and fires
  # after it. The exporter-down group below differs only in `up`, so this group is its control.
  - interval: 1m
    input_series:
      - series: 'homelab_check_last_run_timestamp_seconds{check="pi-sd-health", instance="daniel-pi", job="node-pi", origin="daniel-pi"}'
        values: '0+60x1 stale'
      - series: 'up{instance="daniel-pi", job="node-pi", origin="daniel-pi"}'
        values: '1x40'
    alert_rule_test:
      - eval_time: 10m
        alertname: PiSdHealthNotReporting
        exp_alerts: []
      - eval_time: 30m
        alertname: PiSdHealthNotReporting
        exp_alerts:
          - exp_labels: {check: pi-sd-health, origin: daniel-pi, severity: critical, service: daniel-pi}
            exp_annotations:
              summary: daniel-pi's SD-card health heartbeat has stopped reporting.
              description: >-
                No pi-sd-health verdict newer than 15 minutes reached Prometheus from daniel-pi's
                textfile collector, so nothing confirms the SD card is being watched. Read
                `systemctl status homelab-pi-sd-health.timer` on daniel-pi, then
                /var/lib/node-exporter-textfile/pi-sd-health.prom.

  # The exporter is down from minute 2: `up` reads 0 and the series is gone, as in the control
  # above. PiHostDown pages a dead exporter, so the `unless` clause keeps both NotReporting rules
  # quiet past the point the control fires. Both Failed rules read a verdict of 0 that goes stale
  # with the scrape, so they too leave a dead Pi to PiHostDown (M6 batch B5 needs no inhibit).
  - interval: 1m
    input_series:
      - series: 'homelab_check_last_run_timestamp_seconds{check="pi-sd-health", instance="daniel-pi", job="node-pi", origin="daniel-pi"}'
        values: '0+60x1 stale'
      - series: 'homelab_check_last_run_timestamp_seconds{check="pi-recovery-health", instance="daniel-pi", job="node-pi", origin="daniel-pi"}'
        values: '0+60x1 stale'
      - series: 'homelab_check_success{check="pi-sd-health", instance="daniel-pi", job="node-pi", origin="daniel-pi"}'
        values: '0x1 stale'
      - series: 'homelab_check_success{check="pi-recovery-health", instance="daniel-pi", job="node-pi", origin="daniel-pi"}'
        values: '0x1 stale'
      - series: 'up{instance="daniel-pi", job="node-pi", origin="daniel-pi"}'
        values: '1x1 0x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: PiSdHealthNotReporting
        exp_alerts: []
      - eval_time: 30m
        alertname: PiRecoveryNotReporting
        exp_alerts: []
      - eval_time: 30m
        alertname: PiSdHealthFailed
        exp_alerts: []
      - eval_time: 30m
        alertname: PiRecoveryFailed
        exp_alerts: []

  # A short gap: stale samples between fresh timestamps, as a node-exporter roll leaves. A bare
  # absent() would fire at each stale minute; the absent_over_time arm still sees the earlier
  # samples and stays quiet.
  - interval: 1m
    input_series:
      - series: 'homelab_check_last_run_timestamp_seconds{check="pi-sd-health", instance="daniel-pi", job="node-pi", origin="daniel-pi"}'
        values: '0+60x3 stale stale 360+60x10'
      - series: 'up{instance="daniel-pi", job="node-pi", origin="daniel-pi"}'
        values: '1x15'
    alert_rule_test:
      - eval_time: 4m
        alertname: PiSdHealthNotReporting
        exp_alerts: []
      - eval_time: 12m
        alertname: PiSdHealthNotReporting
        exp_alerts: []

  # PiWatchdogFailed outlasts a stop an apply holds: the unit stops at minute 4, the rule waits out
  # its 30m `for` and fires, and the verdict returning to 1 at minute 44 quiets it.
  - interval: 1m
    input_series:
      - series: 'homelab_check_success{check="pi-watchdog-health", instance="daniel-pi", job="node-pi", origin="daniel-pi"}'
        values: '1x3 0x40 1x10'
    alert_rule_test:
      - eval_time: 33m
        alertname: PiWatchdogFailed
        exp_alerts: []
      - eval_time: 35m
        alertname: PiWatchdogFailed
        exp_alerts:
          - exp_labels: {check: pi-watchdog-health, instance: daniel-pi, job: node-pi, origin: daniel-pi, severity: warning, service: daniel-pi}
            exp_annotations:
              summary: daniel-pi's watchdog.service is not active.
              description: >-
                watchdog.service on daniel-pi has not been active for 30 minutes. wd_keepalive holds
                the device, so the board keeps its hardware watchdog, but the `max-load-1 = 24` load
                test is off. A stop or a daemon that died is the cause, because a restart leaves the
                daemon running. Run `sudo systemctl start watchdog` on daniel-pi. The
                `pi-watchdog-health` lines in /var/log/pi-health/health.log date the stop.
      - eval_time: 46m
        alertname: PiWatchdogFailed
        exp_alerts: []

  # An apply's stop, 8 minutes long, ends before the `for` does, so the rule never fires.
  - interval: 1m
    input_series:
      - series: 'homelab_check_success{check="pi-watchdog-health", instance="daniel-pi", job="node-pi", origin="daniel-pi"}'
        values: '1x3 0x7 1x40'
    alert_rule_test:
      - eval_time: 9m
        alertname: PiWatchdogFailed
        exp_alerts: []
      - eval_time: 40m
        alertname: PiWatchdogFailed
        exp_alerts: []

  # PiWatchdogNotReporting's three states: a frozen timestamp fires one minute past the deadline, a
  # fresh one stays quiet, and a dead exporter leaves it to PiHostDown.
  - interval: 1m
    input_series:
      - series: 'homelab_check_last_run_timestamp_seconds{check="pi-watchdog-health", instance="daniel-pi", job="node-pi", origin="daniel-pi"}'
        values: '0x30'
      - series: 'up{instance="daniel-pi", job="node-pi", origin="daniel-pi"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 15m
        alertname: PiWatchdogNotReporting
        exp_alerts: []
      - eval_time: 16m
        alertname: PiWatchdogNotReporting
        exp_alerts:
          - exp_labels: {check: pi-watchdog-health, instance: daniel-pi, job: node-pi, origin: daniel-pi, severity: warning, service: daniel-pi}
            exp_annotations:
              summary: daniel-pi's watchdog daemon heartbeat has stopped reporting.
              description: >-
                No pi-watchdog-health verdict newer than 15 minutes reached Prometheus from
                daniel-pi's textfile collector, so nothing confirms the watchdog daemon is being
                watched. Read `systemctl status homelab-pi-watchdog-health.timer` on daniel-pi,
                then /var/lib/node-exporter-textfile/pi-watchdog-health.prom.
  - interval: 1m
    input_series:
      - series: 'homelab_check_last_run_timestamp_seconds{check="pi-watchdog-health", instance="daniel-pi", job="node-pi", origin="daniel-pi"}'
        values: '0+300x10'
      - series: 'up{instance="daniel-pi", job="node-pi", origin="daniel-pi"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 10m
        alertname: PiWatchdogNotReporting
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: 'homelab_check_last_run_timestamp_seconds{check="pi-watchdog-health", instance="daniel-pi", job="node-pi", origin="daniel-pi"}'
        values: '0+60x1 stale'
      - series: 'up{instance="daniel-pi", job="node-pi", origin="daniel-pi"}'
        values: '1x1 0x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: PiWatchdogNotReporting
        exp_alerts: []

  # The file is gone with the exporter up, so the absent_over_time arm fires with only its matchers'
  # labels. The exporter-down case above is its control.
  - interval: 1m
    input_series:
      - series: 'homelab_check_last_run_timestamp_seconds{check="pi-watchdog-health", instance="daniel-pi", job="node-pi", origin="daniel-pi"}'
        values: '0+60x1 stale'
      - series: 'up{instance="daniel-pi", job="node-pi", origin="daniel-pi"}'
        values: '1x40'
    alert_rule_test:
      - eval_time: 10m
        alertname: PiWatchdogNotReporting
        exp_alerts: []
      - eval_time: 30m
        alertname: PiWatchdogNotReporting
        exp_alerts:
          - exp_labels: {check: pi-watchdog-health, origin: daniel-pi, severity: warning, service: daniel-pi}
            exp_annotations:
              summary: daniel-pi's watchdog daemon heartbeat has stopped reporting.
              description: >-
                No pi-watchdog-health verdict newer than 15 minutes reached Prometheus from
                daniel-pi's textfile collector, so nothing confirms the watchdog daemon is being
                watched. Read `systemctl status homelab-pi-watchdog-health.timer` on daniel-pi,
                then /var/lib/node-exporter-textfile/pi-watchdog-health.prom.

  # PiAuditFailed outlasts a silent log: the verdict drops at minute 4, the rule waits out its 30m
  # `for` and fires, and the verdict returning to 1 at minute 44 quiets it.
  - interval: 1m
    input_series:
      - series: 'homelab_check_success{check="pi-audit-health", instance="daniel-pi", job="node-pi", origin="daniel-pi"}'
        values: '1x3 0x40 1x10'
    alert_rule_test:
      - eval_time: 33m
        alertname: PiAuditFailed
        exp_alerts: []
      - eval_time: 35m
        alertname: PiAuditFailed
        exp_alerts:
          - exp_labels: {check: pi-audit-health, instance: daniel-pi, job: node-pi, origin: daniel-pi, severity: warning, service: daniel-pi}
            exp_annotations:
              summary: daniel-pi's auditd is not writing its log.
              description: >-
                pi-audit-health on daniel-pi has read status=down for 30 minutes. auditd.service is
                not active, or it is active and /var/log/audit/audit.log has had no write for an
                hour. auditd suspends logging when /var/log runs out of space, and only a restart
                resumes it. Read `df -m /var/log` on daniel-pi, then run `sudo systemctl restart
                auditd`. The `pi-audit-health` lines in /var/log/pi-health/health.log date the stop.
      - eval_time: 46m
        alertname: PiAuditFailed
        exp_alerts: []

  # The cycles after a boot read the restored log's old mtime. They end before the `for` does, so
  # the rule never fires.
  - interval: 1m
    input_series:
      - series: 'homelab_check_success{check="pi-audit-health", instance="daniel-pi", job="node-pi", origin="daniel-pi"}'
        values: '1x3 0x15 1x40'
    alert_rule_test:
      - eval_time: 18m
        alertname: PiAuditFailed
        exp_alerts: []
      - eval_time: 40m
        alertname: PiAuditFailed
        exp_alerts: []

  # PiAuditNotReporting: a frozen timestamp fires one minute past the deadline, and a dead exporter
  # leaves it to PiHostDown.
  - interval: 1m
    input_series:
      - series: 'homelab_check_last_run_timestamp_seconds{check="pi-audit-health", instance="daniel-pi", job="node-pi", origin="daniel-pi"}'
        values: '0x30'
      - series: 'up{instance="daniel-pi", job="node-pi", origin="daniel-pi"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 15m
        alertname: PiAuditNotReporting
        exp_alerts: []
      - eval_time: 16m
        alertname: PiAuditNotReporting
        exp_alerts:
          - exp_labels: {check: pi-audit-health, instance: daniel-pi, job: node-pi, origin: daniel-pi, severity: warning, service: daniel-pi}
            exp_annotations:
              summary: daniel-pi's audit-log heartbeat has stopped reporting.
              description: >-
                No pi-audit-health verdict newer than 15 minutes reached Prometheus from daniel-pi's
                textfile collector, so nothing confirms auditd is being watched. Read
                `systemctl status homelab-pi-audit-health.timer` on daniel-pi, then
                /var/lib/node-exporter-textfile/pi-audit-health.prom.
  - interval: 1m
    input_series:
      - series: 'homelab_check_last_run_timestamp_seconds{check="pi-audit-health", instance="daniel-pi", job="node-pi", origin="daniel-pi"}'
        values: '0+60x1 stale'
      - series: 'up{instance="daniel-pi", job="node-pi", origin="daniel-pi"}'
        values: '1x1 0x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: PiAuditNotReporting
        exp_alerts: []
