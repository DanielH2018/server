# promtool unit tests for files/rules/alerting-meta.yaml. Run with
# `scripts/validate/alert_tools.sh promtool test rules <this file>`; the validate-alert-rules
# hook runs it on every commit that touches the rules.
rule_files:
  - ../../files/rules/alerting-meta.yaml
evaluation_interval: 1m
tests:
  # The zero-series case: no input at all, so the scrape job is missing from the config.
  # AlertmanagerMetricsMissing fires through its first arm.
  - interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 11m
        alertname: AlertmanagerMetricsMissing
        exp_alerts:
          - exp_labels:
              job: alertmanager
              severity: warning
              service: observability
            exp_annotations:
              summary: Prometheus has lost Alertmanager's scrape job or its delivery counter.
              description: >-
                Either no up{job="alertmanager"} series exists, so the alertmanager job is gone
                from prometheus.yml, or the scrape works and
                alertmanager_notifications_failed_total is gone, as after an upgrade that
                renamed it. AlertmanagerNotificationsFailing cannot fire until the series is
                back.

  # The scrape works and the counter is gone. AlertmanagerMetricsMissing fires through its
  # second arm.
  - interval: 1m
    input_series:
      - series: 'up{job="alertmanager", instance="alertmanager:9093"}'
        values: '1x15'
    alert_rule_test:
      - eval_time: 11m
        alertname: AlertmanagerMetricsMissing
        exp_alerts:
          - exp_labels:
              job: alertmanager
              severity: warning
              service: observability
            exp_annotations:
              summary: Prometheus has lost Alertmanager's scrape job or its delivery counter.
              description: >-
                Either no up{job="alertmanager"} series exists, so the alertmanager job is gone
                from prometheus.yml, or the scrape works and
                alertmanager_notifications_failed_total is gone, as after an upgrade that
                renamed it. AlertmanagerNotificationsFailing cannot fire until the series is
                back.

  # A failed scrape: up reads 0 and the counter series are stale. ScrapeTargetDown pages
  # this condition, so the rule must stay quiet.
  - interval: 1m
    input_series:
      - series: 'up{job="alertmanager", instance="alertmanager:9093"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 30m
        alertname: AlertmanagerMetricsMissing
        exp_alerts: []

  # Healthy: the scrape works, the counter is present and flat, and the last reload succeeded.
  - interval: 1m
    input_series:
      - series: 'up{job="alertmanager", instance="alertmanager:9093"}'
        values: '1x40'
      - series: 'alertmanager_notifications_failed_total{job="alertmanager", instance="alertmanager:9093", integration="discord", reason="other"}'
        values: '0x40'
      - series: 'prometheus_config_last_reload_successful{job="prometheus", instance="localhost:9090"}'
        values: '1x40'
      - series: 'prometheus_rule_evaluation_failures_total{job="prometheus", instance="localhost:9090", rule_group="/etc/prometheus-rules/workload-service.yaml;workload-service"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 40m
        alertname: AlertmanagerMetricsMissing
        exp_alerts: []
      - eval_time: 40m
        alertname: AlertmanagerNotificationsFailing
        exp_alerts: []
      - eval_time: 40m
        alertname: PrometheusRuleReloadFailed
        exp_alerts: []
      - eval_time: 40m
        alertname: PrometheusRuleEvaluationFailures
        exp_alerts: []
      # The Watchdog fires whatever the input, and vector(1) carries no job or instance.
      - eval_time: 40m
        alertname: Watchdog
        exp_alerts:
          - exp_labels:
              severity: info
              service: observability
            exp_annotations:
              summary: The alert pipeline is alive. This alert always fires.

  # One failed Discord send. The alert fires per integration, and clears once the failure
  # leaves the 30-minute window.
  - interval: 1m
    input_series:
      - series: 'alertmanager_notifications_failed_total{job="alertmanager", instance="alertmanager:9093", integration="discord", reason="serverError"}'
        values: '0x5 1x60'
      - series: 'alertmanager_notifications_failed_total{job="alertmanager", instance="alertmanager:9093", integration="email", reason="other"}'
        values: '0x65'
    alert_rule_test:
      - eval_time: 10m
        alertname: AlertmanagerNotificationsFailing
        exp_alerts:
          - exp_labels:
              integration: discord
              severity: critical
              service: observability
            exp_annotations:
              summary: Alertmanager failed to deliver through discord.
              description: >-
                Alertmanager's discord integration failed at least one send in the last 30
                minutes, for a reason other than a rate limit. Read
                alertmanager_notifications_failed_total by reason, and the alertmanager pod's
                log.
              runbook_url: https://docs.local.daniel-hunter.com/alert-runbooks/#alertmanagernotificationsfailing
      - eval_time: 45m
        alertname: AlertmanagerNotificationsFailing
        exp_alerts: []

  # Every failure reason but a rate limit fires at once, one alert per integration.
  - interval: 1m
    input_series:
      - series: 'alertmanager_notifications_failed_total{job="alertmanager", instance="alertmanager:9093", integration="discord", reason="requestError"}'
        values: '0x5 1x20'
      - series: 'alertmanager_notifications_failed_total{job="alertmanager", instance="alertmanager:9093", integration="email", reason="templateError"}'
        values: '0x5 1x20'
      - series: 'alertmanager_notifications_failed_total{job="alertmanager", instance="alertmanager:9093", integration="webhook", reason="configError"}'
        values: '0x5 1x20'
    alert_rule_test:
      - eval_time: 7m
        alertname: AlertmanagerNotificationsFailing
        exp_alerts:
          - exp_labels: {integration: discord, severity: critical, service: observability}
            exp_annotations:
              summary: Alertmanager failed to deliver through discord.
              description: >-
                Alertmanager's discord integration failed at least one send in the last 30
                minutes, for a reason other than a rate limit. Read
                alertmanager_notifications_failed_total by reason, and the alertmanager pod's
                log.
              runbook_url: https://docs.local.daniel-hunter.com/alert-runbooks/#alertmanagernotificationsfailing
          - exp_labels: {integration: email, severity: critical, service: observability}
            exp_annotations:
              summary: Alertmanager failed to deliver through email.
              description: >-
                Alertmanager's email integration failed at least one send in the last 30
                minutes, for a reason other than a rate limit. Read
                alertmanager_notifications_failed_total by reason, and the alertmanager pod's
                log.
              runbook_url: https://docs.local.daniel-hunter.com/alert-runbooks/#alertmanagernotificationsfailing
          - exp_labels: {integration: webhook, severity: critical, service: observability}
            exp_annotations:
              summary: Alertmanager failed to deliver through webhook.
              description: >-
                Alertmanager's webhook integration failed at least one send in the last 30
                minutes, for a reason other than a rate limit. Read
                alertmanager_notifications_failed_total by reason, and the alertmanager pod's
                log.
              runbook_url: https://docs.local.daniel-hunter.com/alert-runbooks/#alertmanagernotificationsfailing
      - eval_time: 7m
        alertname: AlertmanagerNotificationsRateLimited
        exp_alerts: []

  # A rollout's burst of Discord rate limits that the retries deliver: 11 failures over two
  # minutes, then none. Neither rule fires, so the soak passes.
  - interval: 1m
    input_series:
      - series: 'alertmanager_notifications_failed_total{job="alertmanager", instance="alertmanager:9093", integration="discord", reason="rateLimited"}'
        values: '0x5 5 11x40'
    alert_rule_test:
      - eval_time: 7m
        alertname: AlertmanagerNotificationsFailing
        exp_alerts: []
      - eval_time: 7m
        alertname: AlertmanagerNotificationsRateLimited
        exp_alerts: []
      - eval_time: 12m
        alertname: AlertmanagerNotificationsRateLimited
        exp_alerts: []
      - eval_time: 20m
        alertname: AlertmanagerNotificationsRateLimited
        exp_alerts: []

  # A rate limit that persists past the retries pages after 10 minutes, and not before.
  - interval: 1m
    input_series:
      - series: 'alertmanager_notifications_failed_total{job="alertmanager", instance="alertmanager:9093", integration="discord", reason="rateLimited"}'
        values: '0+1x30'
    alert_rule_test:
      - eval_time: 9m
        alertname: AlertmanagerNotificationsRateLimited
        exp_alerts: []
      - eval_time: 13m
        alertname: AlertmanagerNotificationsRateLimited
        exp_alerts:
          - exp_labels: {integration: discord, severity: critical, service: observability}
            exp_annotations:
              summary: Alertmanager's discord sends have been rate limited for 10 minutes.
              description: >-
                The discord integration refused Alertmanager's sends as rate limited in every
                5-minute window for 10 minutes, so its retries are not getting through. Read
                the alertmanager pod's log, and look for an alert group that floods the
                receiver.
              runbook_url: https://docs.local.daniel-hunter.com/alert-runbooks/#alertmanagernotificationsratelimited
      - eval_time: 13m
        alertname: AlertmanagerNotificationsFailing
        exp_alerts: []

  # A reload that keeps failing fires after 10 minutes, and not before.
  - interval: 1m
    input_series:
      - series: 'prometheus_config_last_reload_successful{job="prometheus", instance="localhost:9090"}'
        values: '1 0x15'
    alert_rule_test:
      - eval_time: 5m
        alertname: PrometheusRuleReloadFailed
        exp_alerts: []
      - eval_time: 12m
        alertname: PrometheusRuleReloadFailed
        exp_alerts:
          - exp_labels:
              job: prometheus
              instance: localhost:9090
              severity: warning
              service: observability
            exp_annotations:
              summary: Prometheus failed to reload its config or rule files.
              description: >-
                localhost:9090 has reported a failed reload for 10 minutes, so it still
                evaluates the last rule set it loaded. Its log names the file it refused.

  # One failed evaluation in one group. The alert fires for that group alone, at once, and
  # clears once the failure leaves the 10-minute window.
  - interval: 1m
    input_series:
      - series: 'prometheus_rule_evaluation_failures_total{job="prometheus", instance="localhost:9090", rule_group="/etc/prometheus-rules/workload-service.yaml;workload-service"}'
        values: '0x5 1x30'
      - series: 'prometheus_rule_evaluation_failures_total{job="prometheus", instance="localhost:9090", rule_group="/etc/prometheus-rules/alerting-meta.yaml;alerting-meta"}'
        values: '0x35'
    alert_rule_test:
      - eval_time: 7m
        alertname: PrometheusRuleEvaluationFailures
        exp_alerts:
          - exp_labels:
              rule_group: /etc/prometheus-rules/workload-service.yaml;workload-service
              severity: warning
              service: observability
            exp_annotations:
              summary: >-
                Prometheus failed to evaluate a rule in
                /etc/prometheus-rules/workload-service.yaml;workload-service.
              description: >-
                At least one rule in /etc/prometheus-rules/workload-service.yaml;workload-service
                failed an evaluation in the last 10 minutes, so its output is missing or stale.
                The Prometheus log names the rule and the error.
      - eval_time: 20m
        alertname: PrometheusRuleEvaluationFailures
        exp_alerts: []
