              check: renovate-notify
              origin: daniel-box
            exp_annotations:
              summary: 'daniel-box: the renovate notifier has not completed a run in 36 hours.'
              description: >-
                No renovate-notify verdict newer than 36 hours reached Prometheus from
                daniel-box: the daily 13:00 timer did not fire or the run failed. Read
                `systemctl status homelab-renovate-notify.timer` and `journalctl -u
                homelab-renovate-notify`. This says nothing about Renovate itself.
              runbook_url: https://docs.local.daniel-hunter.com/alert-runbooks/#renovatenotifynotreporting
      - eval_time: 900h
        alertname: RenovateAgentNotReporting
        exp_alerts:
          - exp_labels:
              severity: warning
              service: daniel-box
              check: renovate-agent
              origin: daniel-box
            exp_annotations:
              summary: 'daniel-box: the renovate agent has not completed a clean run in 28 hours.'
              description: 'No renovate-agent verdict newer than 28 hours reached Prometheus from daniel-box''s
                textfile collector: the daily 06:00 timer did not fire, the run crashed, or a worktree-blocked
                tick skipped it. Read `systemctl status homelab-renovate-agent.timer` and `journalctl -u homelab-renovate-agent`.'
