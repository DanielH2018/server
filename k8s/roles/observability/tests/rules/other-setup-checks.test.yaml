# promtool unit tests for files/rules/other-setup-checks.yaml. Run with
# `scripts/validate/alert_tools.sh promtool test rules <this file>`; the validate-alert-rules
# hook runs it on every commit that touches the rules.
#
# Generated cases, one block per rule. A NotReporting case freezes the timestamp series at 0,
# which promtool's `time()` ages one second per second, so it sits just under its deadline at the
# first eval time and just over it at the second. The 10-minute producers step by the minute and
# the daily, monthly and renovate ones by the hour, so a sample is on every evaluation and the 5m
# lookback stays out of the arithmetic. A second case per NotReporting rule adds a dead `node`
# exporter (up == 0) and expects silence, because the `targets` check pages that. The input
# series carry the labels the `node` scrape job adds. A NotReporting rule fires with one of two
# label sets: its first arm keeps the series' labels, `job` and `instance` included, and its
# absent_over_time arm carries only the equality matchers' `check` and `origin`.
rule_files:
  - ../../files/rules/other-setup-checks.yaml
evaluation_interval: 1h
tests:
  - interval: 1h
    input_series: []
    alert_rule_test:
      - eval_time: 900h
        alertname: UpsSecondaryFailed
        exp_alerts: []
      - eval_time: 900h
        alertname: UpsSecondaryNotReporting
        exp_alerts:
          - exp_labels:
              severity: critical
              service: daniel-box
              check: ups-secondary-health
              origin: daniel-box
            exp_annotations:
              summary: 'daniel-box: the UPS secondary watchdog has stopped reporting.'
              description: >-
                Run `systemctl status homelab-ups-watchdog.timer` and `journalctl -u
                homelab-ups-watchdog.service` on daniel-box. No ups-secondary-health verdict newer
                than 25 minutes reached Prometheus, so nothing confirms its secondary upsmon can
                hear upsd.
              runbook_url: https://docs.local.daniel-hunter.com/alert-runbooks/#upssecondarynotreporting
          - exp_labels:
              severity: critical
              service: daniel-server
              check: ups-secondary-health
              origin: daniel-server
            exp_annotations:
              summary: 'daniel-server: the UPS secondary watchdog has stopped reporting.'
              description: >-
                Run `systemctl status homelab-ups-watchdog.timer` and `journalctl -u
                homelab-ups-watchdog.service` on daniel-server. No ups-secondary-health verdict
                newer than 25 minutes reached Prometheus, so nothing confirms its secondary upsmon
                can hear upsd.
              runbook_url: https://docs.local.daniel-hunter.com/alert-runbooks/#upssecondarynotreporting
      - eval_time: 900h
        alertname: FakeRemuxScanFailed
        exp_alerts: []
      - eval_time: 900h
        alertname: FakeRemuxScanNotReporting
        exp_alerts:
          - exp_labels:
              severity: warning
              service: daniel-box
              check: fake-remux-scan
              origin: daniel-box
            exp_annotations:
              summary: 'daniel-box: the fake-remux heartbeat has stopped reporting the scan.'
              description: >-
                No fake-remux-scan verdict newer than 25 minutes reached Prometheus from
                daniel-box, so nothing confirms the scan's state file is being read. Read the
                `fake-remux health` cron and the `fake-remux-health` syslog tag, then
                /var/lib/node-exporter-textfile/fake-remux-scan.prom.
      - eval_time: 900h
        alertname: FakeRemuxReplaceFailed
        exp_alerts: []
      - eval_time: 900h
        alertname: FakeRemuxReplaceNotReporting
        exp_alerts:
          - exp_labels:
              severity: warning
              service: daniel-box
              check: fake-remux-replace
              origin: daniel-box
            exp_annotations:
              summary: 'daniel-box: the fake-remux heartbeat has stopped reporting the reconciler.'
              description: >-
                No fake-remux-replace verdict newer than 25 minutes reached Prometheus from
                daniel-box, so nothing confirms the reconciler's state file is being read. Read
                the `fake-remux health` cron and the `fake-remux-health` syslog tag, then
                /var/lib/node-exporter-textfile/fake-remux-replace.prom.
      - eval_time: 900h
        alertname: MkvAttachmentRepairFailed
        exp_alerts: []
      - eval_time: 900h
        alertname: MkvAttachmentRepairNotReporting
