      - eval_time: 900h
        alertname: EtcdRestoreDrillFailed
        exp_alerts: []
      - eval_time: 900h
        alertname: EtcdRestoreDrillNotReporting
        exp_alerts:
          - exp_labels:
              severity: critical
              service: daniel-server
              check: etcd-restore-drill-vm
              origin: daniel-server
            exp_annotations:
              summary: 'daniel-server: the monthly etcd restore drill has stopped reporting.'
              description: >-
                Read homelab-etcd-restore-drill.timer and the journal of
                homelab-etcd-restore-drill.service on daniel-server. No etcd-restore-drill-vm
                verdict newer than 35 days reached Prometheus, so no drill has run since the last
                1st-of-month slot plus four days of slack.
              runbook_url: https://docs.local.daniel-hunter.com/k3s-etcd-restore/#the-full-drill-runs-monthly-in-a-throwaway-guest
      - eval_time: 900h
        alertname: EtcdRestoreDrillEgressFenceFailed
        exp_alerts: []
      - eval_time: 900h
        alertname: EtcdRestoreDrillEgressFenceNotReporting
        exp_alerts:
          - exp_labels:
              severity: warning
              service: daniel-server
              check: etcd-restore-drill-egress-fence
              origin: daniel-server
            exp_annotations:
              summary: "daniel-server: the etcd drill's egress fence leg has stopped reporting."
              description: >-
                No etcd-restore-drill-egress-fence verdict newer than 35 days reached Prometheus
                from daniel-server, so the fence went unmeasured this month. A run that dies
                before the fence leg writes nothing. Read the newest run directory under
                /var/log/etcd-restore-drill.
              runbook_url: https://docs.local.daniel-hunter.com/alert-runbooks/#etcdrestoredrillegressfencenotreporting
      - eval_time: 900h
