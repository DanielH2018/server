# promtool unit tests for files/rules/host-checks.yaml. Run with
# `scripts/validate/alert_tools.sh promtool test rules <this file>`; the validate-alert-rules
# hook runs it on every commit that touches the rules.
#
# The input series carry the labels the `node` scrape job adds: `job`, and `origin` and
# `instance`, both the node name. promtool's `time()` is the eval time in seconds from 0, so a
# fresh timestamp series reads 60 x the minute index (`0+60xN`), and a frozen one stays put.
#
# DiskHealthNotReporting fires with one of two label sets. Its first arm keeps the series'
# labels, `job` and `instance` included. Its absent_over_time arm carries only the equality
# matchers' `check` and `origin`. HostUpdateStale's two arms differ the same way.
#
# scripts/dev/gen_host_rules.py renders every host's copy of a rule from one entry of
# files/rule-tables/host-checks.yaml, so a case exercises one host per entry. A second host
# appears only to show that one host's series leave another's copy quiet, to keep the absent arm
# of another host's copy quiet (promtool compares every alert an alertname fires), or to play a
# scenario of its own.
rule_files:
  - ../../files/rules/host-checks.yaml
evaluation_interval: 1m
tests:
  # The zero-series case: no input at all, so no disk-health series has existed for longer
  # than the 1500s deadline. DiskHealthNotReporting fires through absent_over_time, and the
  # rules that read a series stay quiet.
  - interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 26m
        alertname: ClaudeTriagePollNotReporting
        exp_alerts:
          - exp_labels:
              check: claude-triage-poll
              origin: daniel-box
              severity: warning
              service: daniel-box
            exp_annotations:
              summary: 'daniel-box: the triage poller has stopped reporting.'
              description: >-
                No claude-triage-poll verdict newer than 660s from daniel-box, so the monitor
                triage poll has not completed a clean run. Read `systemctl status
                homelab-claude-triage-poll.timer` and `journalctl -u
                homelab-claude-triage-poll`. If you disabled the timer on purpose, delete this
                rule.
              runbook_url: https://docs.local.daniel-hunter.com/alert-runbooks/#claudetriagepollnotreporting
      - eval_time: 26m
        alertname: DiskHealthNotReporting
        exp_alerts:
          - exp_labels:
              check: disk-health
              origin: daniel-box
              severity: critical
              service: daniel-box
            exp_annotations:
              summary: 'daniel-box: the root disk check has stopped reporting.'
              description: >-
                No disk-health verdict newer than 25 minutes reached Prometheus from daniel-box's
                textfile collector, so nothing is watching the root disk. Read the `daniel-box
                disk health` cron and the `disk-health` syslog tag, then
                /var/lib/node-exporter-textfile/disk-health.prom on the host.
              runbook_url: https://docs.local.daniel-hunter.com/alert-runbooks/#diskhealthnotreporting
      - eval_time: 26m
        alertname: DiskHealthFailed
        exp_alerts: []
      - eval_time: 26m
        alertname: TextfileCollectorError
        exp_alerts: []
      - eval_time: 26m
        alertname: HostReconcileFailed
        exp_alerts: []
      - eval_time: 26m
        alertname: HostUpdateStale
        exp_alerts: []
      - eval_time: 26m
        alertname: WiredLinkDown
        exp_alerts: []
      - eval_time: 26m
        alertname: IscsiSessionStale
        exp_alerts: []
      - eval_time: 26m
        alertname: IscsiSessionsNotReporting
        exp_alerts:
          - exp_labels:
              check: iscsi-sessions
              origin: daniel-box
              severity: warning
              service: daniel-box
            exp_annotations:
              summary: 'daniel-box: the iSCSI session check has stopped reporting.'
              description: >-
                No iscsi-sessions verdict newer than 5 minutes reached Prometheus from daniel-box's
                textfile collector, so nothing is watching the node's iSCSI sessions. Read the
                log of the node-exporter pod's `iscsi-sessions` container on daniel-box.
          - exp_labels:
              check: iscsi-sessions
              origin: daniel-server
              severity: warning
              service: daniel-server
            exp_annotations:
              summary: 'daniel-server: the iSCSI session check has stopped reporting.'
              description: >-
                No iscsi-sessions verdict newer than 5 minutes reached Prometheus from
                daniel-server's textfile collector, so nothing is watching the node's iSCSI
                sessions. Read the log of the node-exporter pod's `iscsi-sessions` container
                on daniel-server.

  # The verdict turns red from minute 3 while the file stays fresh. DiskHealthFailed fires at once,
  # and DiskHealthNotReporting stays quiet.
  - interval: 1m
    input_series:
      - series: 'homelab_check_success{check="disk-health", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '1x2 0x5'
      - series: 'homelab_check_last_run_timestamp_seconds{check="disk-health", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '0+60x7'
      - series: 'up{instance="daniel-box", job="node", origin="daniel-box"}'
        values: '1x7'
    alert_rule_test:
      - eval_time: 2m
        alertname: DiskHealthFailed
        exp_alerts: []
      - eval_time: 4m
        alertname: DiskHealthFailed
        exp_alerts:
          - exp_labels:
              check: disk-health
              instance: daniel-box
              job: node
              origin: daniel-box
              severity: critical
              service: daniel-box
            exp_annotations:
              summary: 'daniel-box: the root disk check is red.'
              description: >-
                disk-health.sh on daniel-box read the root filesystem above its threshold, or
                df failed. Longhorn stops scheduling replicas on the node at 75%.
                homelab_disk_root_used_ratio{check="disk-health"} holds the share it read, and
                the `disk-health` syslog tag holds the run's message.
              runbook_url: https://docs.local.daniel-hunter.com/alert-runbooks/#diskhealthfailed
      - eval_time: 4m
        alertname: DiskHealthNotReporting
        exp_alerts: []

  # The file stopped being refreshed: node_exporter keeps serving the timestamp written at 0.
  # The first arm fires once the timestamp is more than 1500s old, between minutes 25 and 26.
  - interval: 1m
    input_series:
      - series: 'homelab_check_last_run_timestamp_seconds{check="disk-health", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '0x40'
      - series: 'up{instance="daniel-box", job="node", origin="daniel-box"}'
        values: '1x40'
    alert_rule_test:
      - eval_time: 24m
        alertname: DiskHealthNotReporting
        exp_alerts: []
      - eval_time: 26m
        alertname: DiskHealthNotReporting
        exp_alerts:
          - exp_labels:
              check: disk-health
              instance: daniel-box
              job: node
              origin: daniel-box
              severity: critical
              service: daniel-box
            exp_annotations:
              summary: 'daniel-box: the root disk check has stopped reporting.'
              description: >-
                No disk-health verdict newer than 25 minutes reached Prometheus from daniel-box's
                textfile collector, so nothing is watching the root disk. Read the `daniel-box
                disk health` cron and the `disk-health` syslog tag, then
                /var/lib/node-exporter-textfile/disk-health.prom on the host.
              runbook_url: https://docs.local.daniel-hunter.com/alert-runbooks/#diskhealthnotreporting

  # The file is gone from minute 6, so the series goes stale while the exporter stays up. The
  # absent_over_time arm fires once 1500s pass with no sample, after minute 30 and not
  # before. The exporter-down group below differs from this one only in `up`, so this group
  # is its control.
  - interval: 1m
    input_series:
      - series: 'homelab_check_last_run_timestamp_seconds{check="disk-health", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '0+60x5 stale'
      - series: 'up{instance="daniel-box", job="node", origin="daniel-box"}'
        values: '1x45'
    alert_rule_test:
      - eval_time: 29m
        alertname: DiskHealthNotReporting
        exp_alerts: []
      - eval_time: 40m
        alertname: DiskHealthNotReporting
        exp_alerts:
          - exp_labels:
              check: disk-health
              origin: daniel-box
              severity: critical
              service: daniel-box
            exp_annotations:
              summary: 'daniel-box: the root disk check has stopped reporting.'
              description: >-
                No disk-health verdict newer than 25 minutes reached Prometheus from daniel-box's
                textfile collector, so nothing is watching the root disk. Read the `daniel-box
                disk health` cron and the `disk-health` syslog tag, then
                /var/lib/node-exporter-textfile/disk-health.prom on the host.
              runbook_url: https://docs.local.daniel-hunter.com/alert-runbooks/#diskhealthnotreporting

  # The exporter is down from minute 6: `up` reads 0 and the series is gone, as in the
  # control above. The bridge's `targets` check pages the dead exporter, so the `unless`
  # clause keeps DiskHealthNotReporting quiet past the point the control fires.
  - interval: 1m
    input_series:
      - series: 'homelab_check_last_run_timestamp_seconds{check="disk-health", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '0+60x5 stale'
      - series: 'up{instance="daniel-box", job="node", origin="daniel-box"}'
        values: '1x5 0x40'
    alert_rule_test:
      - eval_time: 40m
        alertname: DiskHealthNotReporting
        exp_alerts: []

  # The zero-series case: no input at all, so no k3s cron has written a verdict
  # inside its deadline. Each NotReporting rule fires through absent_over_time, once the
  # longest deadline (90000s) has passed. The Failed rules read a series and stay quiet.
  - interval: 10m
    input_series: []
    alert_rule_test:
      - eval_time: 26h
        alertname: LonghornBackupHealthNotReporting
        exp_alerts:
          - exp_labels:
              check: longhorn-backup-health
              origin: daniel-box
              severity: critical
              service: daniel-box
            exp_annotations:
              summary: 'daniel-box: the longhorn-backup-health check has stopped reporting.'
              description: >-
                Read the `longhorn-backup-health` syslog tag on daniel-box, then
                /var/lib/node-exporter-textfile/longhorn-backup-health.prom. No verdict newer than
                25 minutes reached Prometheus, so nothing watches the Longhorn backup plane.
              runbook_url: https://docs.local.daniel-hunter.com/alert-runbooks/#longhornbackuphealthnotreporting
      - eval_time: 26h
        alertname: LonghornBackupHealthFailed
        exp_alerts: []
      - eval_time: 26h
        alertname: EtcdSnapshotOffboxNotReporting
        exp_alerts:
          - exp_labels:
              check: etcd-snapshot-offbox
              origin: daniel-box
              severity: critical
              service: daniel-box
            exp_annotations:
              summary: 'daniel-box: the etcd-snapshot-offbox check has stopped reporting.'
              description: >-
                Read the `etcd-snapshot-offbox` syslog tag on daniel-box, then
                /var/lib/node-exporter-textfile/etcd-snapshot-offbox.prom. No verdict newer than 25
                hours reached Prometheus, so nothing compares the cluster token with its off-box
                stamp.
              runbook_url: https://docs.local.daniel-hunter.com/alert-runbooks/#etcdsnapshotoffboxnotreporting
      - eval_time: 26h
        alertname: EtcdSnapshotOffboxFailed
        exp_alerts: []

  # Every check turns red from minute 3 while its file stays fresh. Each Failed
  # rule fires at once and no NotReporting rule does.
  - interval: 1m
    input_series:
      - series: 'homelab_check_success{check="longhorn-backup-health", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '1x2 0x5'
      - series: 'homelab_check_last_run_timestamp_seconds{check="longhorn-backup-health", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '0+60x7'
      - series: 'homelab_check_success{check="etcd-snapshot-offbox", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '1x2 0x5'
      - series: 'homelab_check_last_run_timestamp_seconds{check="etcd-snapshot-offbox", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '0+60x7'
      - series: 'up{instance="daniel-box", job="node", origin="daniel-box"}'
        values: '1x7'
    alert_rule_test:
      - eval_time: 2m
        alertname: LonghornBackupHealthFailed
        exp_alerts: []
      - eval_time: 4m
        alertname: LonghornBackupHealthFailed
        exp_alerts:
          - exp_labels:
              check: longhorn-backup-health
              instance: daniel-box
              job: node
              origin: daniel-box
              severity: critical
              service: daniel-box
            exp_annotations:
              summary: 'daniel-box: the Longhorn backup check is red.'
              description: >-
                longhorn_backup_health.py on daniel-box reported a failing backup-plane check: an
                unavailable backup target, a stale or errored backup, a failed job, or a restore
                drill that is overdue. `journalctl -t longhorn-backup-health` names the check. Read
                docs/longhorn-disaster-recovery.md after it.
              runbook_url: https://docs.local.daniel-hunter.com/longhorn-disaster-recovery/
      - eval_time: 4m
        alertname: LonghornBackupHealthNotReporting
        exp_alerts: []
      - eval_time: 2m
        alertname: EtcdSnapshotOffboxFailed
        exp_alerts: []
      - eval_time: 4m
        alertname: EtcdSnapshotOffboxFailed
        exp_alerts:
          - exp_labels:
              check: etcd-snapshot-offbox
              instance: daniel-box
              job: node
              origin: daniel-box
              severity: critical
              service: daniel-box
            exp_annotations:
              summary: 'daniel-box: the cluster-token drift check is red.'
              description: >-
                etcd-token-drift.sh on daniel-box found the cluster token changed since the off-box
                copy was stamped, or could not compare the two. `journalctl -t etcd-snapshot-offbox`
                names which. Read docs/k3s-etcd-restore.md after it.
              runbook_url: https://docs.local.daniel-hunter.com/k3s-etcd-restore/
      - eval_time: 4m
        alertname: EtcdSnapshotOffboxNotReporting
        exp_alerts: []

  # The file stops being refreshed: node_exporter keeps serving the timestamp
  # written at 0. The first arm fires once the timestamp is more than the deadline old, so
  # longhorn-backup-health (1500s) fires between minutes 25 and 26.
  - interval: 1m
    input_series:
      - series: 'homelab_check_last_run_timestamp_seconds{check="longhorn-backup-health", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '0x70'
      - series: 'up{instance="daniel-box", job="node", origin="daniel-box"}'
        values: '1x70'
    alert_rule_test:
      - eval_time: 24m
        alertname: LonghornBackupHealthNotReporting
        exp_alerts: []
      - eval_time: 26m
        alertname: LonghornBackupHealthNotReporting
        exp_alerts:
          - exp_labels:
              check: longhorn-backup-health
              instance: daniel-box
              job: node
              origin: daniel-box
              severity: critical
              service: daniel-box
            exp_annotations:
              summary: 'daniel-box: the longhorn-backup-health check has stopped reporting.'
              description: >-
                Read the `longhorn-backup-health` syslog tag on daniel-box, then
                /var/lib/node-exporter-textfile/longhorn-backup-health.prom. No verdict newer than
                25 minutes reached Prometheus, so nothing watches the Longhorn backup plane.
              runbook_url: https://docs.local.daniel-hunter.com/alert-runbooks/#longhornbackuphealthnotreporting

  # The exporter is down from minute 0 and every file is gone, so the bridge's
  # `targets` check pages the dead exporter and the `unless` clause keeps both
  # NotReporting rules quiet past the point the zero-series case fires them.
  - interval: 10m
    input_series:
      - series: 'up{instance="daniel-box", job="node", origin="daniel-box"}'
        values: '0x160'
    alert_rule_test:
      - eval_time: 26h
        alertname: LonghornBackupHealthNotReporting
        exp_alerts: []
      - eval_time: 26h
        alertname: EtcdSnapshotOffboxNotReporting
        exp_alerts: []

  # A short gap: one, then two failed scrapes mark the series stale between fresh timestamps,
  # as a node-exporter roll does. A bare absent() would fire at each stale minute; the
  # absent_over_time arm still sees the earlier samples and stays quiet.
  - interval: 1m
    input_series:
      - series: 'homelab_check_last_run_timestamp_seconds{check="disk-health", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '0+60x4 stale 360+60x4 stale stale 780+60x10'
      - series: 'up{instance="daniel-box", job="node", origin="daniel-box"}'
        values: '1x23'
    alert_rule_test:
      - eval_time: 5m
        alertname: DiskHealthNotReporting
        exp_alerts: []
      - eval_time: 11m
        alertname: DiskHealthNotReporting
        exp_alerts: []
      - eval_time: 12m
        alertname: DiskHealthNotReporting
        exp_alerts: []
      - eval_time: 20m
        alertname: DiskHealthNotReporting
        exp_alerts: []

  # daniel-box's collector fails from minute 3. TextfileCollectorError fires in shadow for
  # daniel-box once its 10m hold has passed, and daniel-server's rule stays quiet.
  - interval: 1m
    input_series:
      - series: 'node_textfile_scrape_error{instance="daniel-box", job="node", origin="daniel-box"}'
        values: '0x2 1x20'
      - series: 'node_textfile_mtime_seconds{file="disk-health.prom", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '1x22'
      - series: 'node_textfile_mtime_seconds{file="bad.prom", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '1x2 _x20'
      - series: 'node_textfile_scrape_error{instance="daniel-server", job="node", origin="daniel-server"}'
        values: '0x22'
    alert_rule_test:
      - eval_time: 12m
        alertname: TextfileCollectorError
        exp_alerts: []
      - eval_time: 14m
        alertname: TextfileCollectorError
        exp_alerts:
          - exp_labels:
              instance: daniel-box
              job: node
              origin: daniel-box
              severity: warning
              service: daniel-box
              shadow: "true"
            exp_annotations:
              summary: 'daniel-box: node_exporter cannot read a textfile, candidates: bad.prom.'
              description: >-
                Read the node-exporter log on daniel-box for the textfile it rejects: a file in
                /var/lib/node-exporter-textfile is malformed or unreadable, so every series in it is
                gone. The summary lists candidates, and the runbook says which files the list
                misses.
              runbook_url: https://docs.local.daniel-hunter.com/alert-runbooks/#textfilecollectorerror

  # The same failure on daniel-server fires its own rule, with daniel-server as `service`.
  - interval: 1m
    input_series:
      - series: 'node_textfile_scrape_error{instance="daniel-box", job="node", origin="daniel-box"}'
        values: '0x22'
      - series: 'node_textfile_scrape_error{instance="daniel-server", job="node", origin="daniel-server"}'
        values: '0x2 1x20'
    alert_rule_test:
      - eval_time: 14m
        alertname: TextfileCollectorError
        exp_alerts:
          - exp_labels:
              instance: daniel-server
              job: node
              origin: daniel-server
              severity: warning
              service: daniel-server
              shadow: "true"
            exp_annotations:
              summary: >-
                daniel-server: node_exporter cannot read a textfile, candidates: none known.
              description: >-
                Read the node-exporter log on daniel-server for the textfile it rejects: a file in
                /var/lib/node-exporter-textfile is malformed or unreadable, so every series in it is
                gone. The summary lists candidates, and the runbook says which files the list
                misses.
              runbook_url: https://docs.local.daniel-hunter.com/alert-runbooks/#textfilecollectorerror

  # daniel-pi's reconcile reads 0 from minute 0, so the host holds. HostReconcileFailed is
  # pending at 14 minutes and fires for daniel-pi alone at 16, past its 15-minute hold.
  - interval: 1m
    input_series:
      - series: 'homelab_host_reconcile_ok{instance="daniel-pi", job="node-pi", origin="daniel-pi"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 14m
        alertname: HostReconcileFailed
        exp_alerts: []
      - eval_time: 16m
        alertname: HostReconcileFailed
        exp_alerts:
          - exp_labels:
              instance: daniel-pi
              job: node-pi
              origin: daniel-pi
              severity: critical
              service: daniel-pi
            exp_annotations:
              summary: >-
                daniel-pi: the homelab package reconcile failed, so it installs no newer package.
              description: >-
                Read `journalctl -u homelab-updater -u homelab-reconcile` on daniel-pi, fix the
                cause, then run `sudo /usr/lib/homelab/homelab-updater --clear-hold`.
                homelab_host_reconcile_ok has read 0 for 15 minutes, so daniel-pi installs no newer
                homelab package.
              runbook_url: https://docs.local.daniel-hunter.com/host-packages/

  # daniel-pi's engine pins moved, and no run applied them. The pending series reads 0 for 2h,
  # then 1 with missed scrapes in it, as the Pi's weekly reboot leaves. The rule is quiet
  # at 6h and at 27h50m, 25h50m into the 1, inside the 25h51m a pin can legitimately wait. It
  # fires at 28h05m, past 26h, and the gaps do not delay it.
  - interval: 5m
    input_series:
      - series: 'homelab_docker_engine_pending{host="daniel-pi", instance="daniel-pi", job="node-pi", origin="daniel-pi"}'
        values: '0x23 1x99 _x2 1x100 _ 1x120'
      - series: 'up{instance="daniel-pi", job="node-pi", origin="daniel-pi"}'
        values: '1x350'
    alert_rule_test:
      - eval_time: 6h
        alertname: DockerEnginePinUnapplied
        exp_alerts: []
      - eval_time: 27h50m
        alertname: DockerEnginePinUnapplied
        exp_alerts: []
      - eval_time: 28h5m
        alertname: DockerEnginePinUnapplied
        exp_alerts:
          - exp_labels:
              host: daniel-pi
              instance: daniel-pi
              job: node-pi
              origin: daniel-pi
              severity: warning
              service: daniel-pi
            exp_annotations:
              summary: 'daniel-pi: the Docker engine has sat off its pins for more than 26 hours.'
              description: >-
                The Docker engine on daniel-pi has sat off its pins for 26 hours, so the 00:30
                UTC homelab-docker-engine.timer did not apply them. Read `systemctl status
                homelab-docker-engine.timer homelab-updater.timer` and `journalctl -u
                homelab-docker-engine`, and docs/host-packages.md, "Host-plane pages".
              runbook_url: https://docs.local.daniel-hunter.com/host-packages/

  # The issue's two cases on a series that starts at 1, as a fresh textfile does: 1 for 6h is
  # quiet, because no sample precedes the 26h window, and 1 for 26h fires.
  - interval: 5m
    input_series:
      - series: 'homelab_docker_engine_pending{host="daniel-pi", instance="daniel-pi", job="node-pi", origin="daniel-pi"}'
        values: '1x320'
    alert_rule_test:
      - eval_time: 6h
        alertname: DockerEnginePinUnapplied
        exp_alerts: []
      - eval_time: 26h
        alertname: DockerEnginePinUnapplied
        exp_alerts:
          - exp_labels:
              host: daniel-pi
              instance: daniel-pi
              job: node-pi
              origin: daniel-pi
              severity: warning
              service: daniel-pi
            exp_annotations:
              summary: 'daniel-pi: the Docker engine has sat off its pins for more than 26 hours.'
              description: >-
                The Docker engine on daniel-pi has sat off its pins for 26 hours, so the 00:30
                UTC homelab-docker-engine.timer did not apply them. Read `systemctl status
                homelab-docker-engine.timer homelab-updater.timer` and `journalctl -u
                homelab-docker-engine`, and docs/host-packages.md, "Host-plane pages".
              runbook_url: https://docs.local.daniel-hunter.com/host-packages/

  # The run applied the pins: the series falls back to 0 after 25h of 1, and the rule stays
  # quiet.
  - interval: 5m
    input_series:
      - series: 'homelab_docker_engine_pending{host="daniel-pi", instance="daniel-pi", job="node-pi", origin="daniel-pi"}'
        values: '1x300 0x40'
    alert_rule_test:
      - eval_time: 27h
        alertname: DockerEnginePinUnapplied
        exp_alerts: []

  # A dead exporter keeps the rule quiet over a 27h-old 1, leaving the page to
  # ScrapeTargetDown.
  - interval: 5m
    input_series:
      - series: 'homelab_docker_engine_pending{host="daniel-pi", instance="daniel-pi", job="node-pi", origin="daniel-pi"}'
        values: '1x340'
      - series: 'up{instance="daniel-pi", job="node-pi", origin="daniel-pi"}'
        values: '0x340'
    alert_rule_test:
      - eval_time: 27h
        alertname: DockerEnginePinUnapplied
        exp_alerts: []

  # daniel-pi reconciles, and daniel-box holds. daniel-box's rule fires with its own `service`,
  # and daniel-pi's stays quiet.
  - interval: 1m
    input_series:
      - series: 'homelab_host_reconcile_ok{instance="daniel-pi", job="node-pi", origin="daniel-pi"}'
        values: '1x20'
      - series: 'homelab_host_reconcile_ok{instance="daniel-box", job="node", origin="daniel-box"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 16m
        alertname: HostReconcileFailed
        exp_alerts:
          - exp_labels:
              instance: daniel-box
              job: node
              origin: daniel-box
              severity: critical
              service: daniel-box
            exp_annotations:
              summary: >-
                daniel-box: the homelab package reconcile failed, so it installs no newer package.
              description: >-
                Read `journalctl -u homelab-updater -u homelab-reconcile` on daniel-box, fix the
                cause, then run `sudo /usr/lib/homelab/homelab-updater --clear-hold`.
                homelab_host_reconcile_ok has read 0 for 15 minutes, so daniel-box installs no newer
                homelab package.
              runbook_url: https://docs.local.daniel-hunter.com/host-packages/
  # daniel-box's last success stays at 0 while its exporter is up. HostUpdateStale is quiet at
  # 59 minutes (3540s) and fires at 61 (3660s), past the 3600s limit.
  - interval: 1m
    input_series:
      - series: 'homelab_host_update_success_timestamp_seconds{instance="daniel-box", job="node", origin="daniel-box"}'
        values: '0x200'
      - series: 'up{instance="daniel-box", job="node", origin="daniel-box"}'
        values: '1x200'
    alert_rule_test:
      - eval_time: 59m
        alertname: HostUpdateStale
        exp_alerts: []
      - eval_time: 61m
        alertname: HostUpdateStale
        exp_alerts:
          - exp_labels:
              instance: daniel-box
              job: node
              origin: daniel-box
              severity: critical
              service: daniel-box
            exp_annotations:
              summary: 'daniel-box: no successful homelab update for 60 minutes.'
              description: >-
                Read `systemctl status homelab-updater.timer` and `journalctl -u homelab-updater` on
                daniel-box. No homelab-updater run there has succeeded in 60 minutes, or
                its exporter is up and serves no success timestamp. The runbook lists what leaves it
                stale.
              runbook_url: https://docs.local.daniel-hunter.com/host-packages/

  # A success timestamp that follows the clock keeps HostUpdateStale quiet.
  - interval: 1m
    input_series:
      - series: 'homelab_host_update_success_timestamp_seconds{instance="daniel-box", job="node", origin="daniel-box"}'
        values: '0+60x200'
      - series: 'up{instance="daniel-box", job="node", origin="daniel-box"}'
        values: '1x200'
    alert_rule_test:
      - eval_time: 61m
        alertname: HostUpdateStale
        exp_alerts: []

  # The exporter is up and serves no success timestamp. The absent arm fires with the equality
  # matchers' `job` and `origin` alone.
  - interval: 1m
    input_series:
      - series: 'up{instance="daniel-box", job="node", origin="daniel-box"}'
        values: '1x10'
    alert_rule_test:
      - eval_time: 5m
        alertname: HostUpdateStale
        exp_alerts:
          - exp_labels:
              job: node
              origin: daniel-box
              severity: critical
              service: daniel-box
            exp_annotations:
              summary: 'daniel-box: no successful homelab update for 60 minutes.'
              description: >-
                Read `systemctl status homelab-updater.timer` and `journalctl -u homelab-updater` on
                daniel-box. No homelab-updater run there has succeeded in 60 minutes, or
                its exporter is up and serves no success timestamp. The runbook lists what leaves it
                stale.
              runbook_url: https://docs.local.daniel-hunter.com/host-packages/

  # The exporter is down, so every series of the target is stale and the success timestamp
  # reads as absent. `up` at 0 keeps the absent arm quiet: a failed scrape is not a stale host.
  - interval: 1m
    input_series:
      - series: 'up{instance="daniel-box", job="node", origin="daniel-box"}'
        values: '0x10'
    alert_rule_test:
      - eval_time: 5m
        alertname: HostUpdateStale
        exp_alerts: []

  # daniel-pi's last success stays at 0 while node-pi answers (`up` at 1). HostUpdateStale is
  # quiet at 1491 minutes (89460s) and fires at 1501 (90060s) for daniel-pi alone: no other
  # host has series here. 1491 minutes is one day between the daily 03:05 fires,
  # then the next fire's delay and full run.
  - interval: 1m
    input_series:
      - series: 'homelab_host_update_success_timestamp_seconds{instance="daniel-pi", job="node-pi", origin="daniel-pi"}'
        values: '0x1510'
      - series: 'up{instance="daniel-pi", job="node-pi", origin="daniel-pi"}'
        values: '1x1510'
    alert_rule_test:
      - eval_time: 1491m
        alertname: HostUpdateStale
        exp_alerts: []
      - eval_time: 1501m
        alertname: HostUpdateStale
        exp_alerts:
          - exp_labels:
              instance: daniel-pi
              job: node-pi
              origin: daniel-pi
              severity: critical
              service: daniel-pi
            exp_annotations:
              summary: 'daniel-pi: no successful homelab update for 25 hours.'
              description: >-
                Read `systemctl status homelab-updater.timer` and `journalctl -u homelab-updater` on
                daniel-pi. No homelab-updater run there has succeeded in 25 hours, or its exporter
                is up and serves no success timestamp. The runbook lists what leaves it stale.
              runbook_url: https://docs.local.daniel-hunter.com/host-packages/

  # A success timestamp that follows the clock keeps daniel-pi's rule quiet. This is the
  # control for the group above.
  - interval: 1m
    input_series:
      - series: 'homelab_host_update_success_timestamp_seconds{instance="daniel-pi", job="node-pi", origin="daniel-pi"}'
        values: '0+60x1510'
      - series: 'up{instance="daniel-pi", job="node-pi", origin="daniel-pi"}'
        values: '1x1510'
    alert_rule_test:
      - eval_time: 1501m
        alertname: HostUpdateStale
        exp_alerts: []

  # node-pi answers and serves no success timestamp: the absent arm fires for daniel-pi.
  - interval: 1m
    input_series:
      - series: 'up{instance="daniel-pi", job="node-pi", origin="daniel-pi"}'
        values: '1x10'
    alert_rule_test:
      - eval_time: 5m
        alertname: HostUpdateStale
        exp_alerts:
          - exp_labels:
              job: node-pi
              origin: daniel-pi
              severity: critical
              service: daniel-pi
            exp_annotations:
              summary: 'daniel-pi: no successful homelab update for 25 hours.'
              description: >-
                Read `systemctl status homelab-updater.timer` and `journalctl -u homelab-updater` on
                daniel-pi. No homelab-updater run there has succeeded in 25 hours, or its exporter
                is up and serves no success timestamp. The runbook lists what leaves it stale.
              runbook_url: https://docs.local.daniel-hunter.com/host-packages/

  # node-pi fails its scrape (`up` at 0, a 30s-timeout miss on the Zero 2 W), so the success
  # timestamp reads as absent. The rule stays quiet: a failed scrape is not a stale host.
  - interval: 1m
    input_series:
      - series: 'up{instance="daniel-pi", job="node-pi", origin="daniel-pi"}'
        values: '0x10'
    alert_rule_test:
      - eval_time: 5m
        alertname: HostUpdateStale
        exp_alerts: []

  # The cable to daniel-box's eno1 is pulled at minute 3. Carrier reads 0, and the kernel's
  # operstate drops with it, so both arms of the rule are true at once and the alert fires
  # once. WiredLinkDown is pending at 7 minutes and fires for daniel-box at 9, past its
  # 5-minute hold. wlp4s0, the WiFi fallback, keeps carrier, and daniel-server's wired link
  # stays up, so neither raises an alert.
  - interval: 1m
    input_series:
      - series: 'node_network_carrier{device="eno1", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '1x2 0x10'
      - series: 'node_network_up{device="eno1", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '1x2 0x10'
      - series: 'node_network_carrier{device="wlp4s0", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '1x12'
      - series: 'node_network_carrier{device="enp88s0", instance="daniel-server", job="node", origin="daniel-server"}'
        values: '1x12'
      - series: 'node_network_up{device="enp88s0", instance="daniel-server", job="node", origin="daniel-server"}'
        values: '1x12'
    alert_rule_test:
      - eval_time: 7m
        alertname: WiredLinkDown
        exp_alerts: []
      - eval_time: 9m
        alertname: WiredLinkDown
        exp_alerts:
          - exp_labels:
              device: eno1
              instance: daniel-box
              job: node
              origin: daniel-box
              severity: critical
              service: daniel-box
            exp_annotations:
              summary: 'daniel-box: the wired link eno1 is down, so the node runs on WiFi.'
              description: >-
                eno1 on daniel-box has had no carrier, or has been down, for 5 minutes.
                daniel-box serves Longhorn replicas over WiFi, and volumes on the other node get
                I/O errors. Restore the wire first: check the cable and the switch port, then run
                `ip -br link` on daniel-box.
              runbook_url: https://docs.local.daniel-hunter.com/alert-runbooks/#wiredlinkdown

  # daniel-server's enp88s0 is set administratively down from minute 3, so node_exporter
  # serves no carrier series for it and only node_network_up reads 0. The `up` arm fires
  # daniel-server's rule. wlo1 losing carrier at the same time raises nothing, because no rule
  # reads the WiFi link.
  - interval: 1m
    input_series:
      - series: 'node_network_carrier{device="enp88s0", instance="daniel-server", job="node", origin="daniel-server"}'
        values: '1x2 stale'
      - series: 'node_network_up{device="enp88s0", instance="daniel-server", job="node", origin="daniel-server"}'
        values: '1x2 0x10'
      - series: 'node_network_carrier{device="wlo1", instance="daniel-server", job="node", origin="daniel-server"}'
        values: '1x2 0x10'
    alert_rule_test:
      - eval_time: 9m
        alertname: WiredLinkDown
        exp_alerts:
          - exp_labels:
              device: enp88s0
              instance: daniel-server
              job: node
              origin: daniel-server
              severity: critical
              service: daniel-server
            exp_annotations:
              summary: 'daniel-server: the wired link enp88s0 is down, so the node runs on WiFi.'
              description: >-
                enp88s0 on daniel-server has had no carrier, or has been down, for 5 minutes.
                daniel-server serves Longhorn replicas over WiFi, and volumes on the other node
                get I/O errors. Restore the wire first: check the cable and the switch port, then
                run `ip -br link` on daniel-server.
              runbook_url: https://docs.local.daniel-hunter.com/alert-runbooks/#wiredlinkdown

  # A three-minute flap, as a switch reboot leaves, reads carrier 0 at minutes 3 to 5 and
  # ends inside the 5-minute hold. The 5m evaluation sits inside the flap, so it fails if
  # the hold is dropped. The 9m evaluation shows the alert never fires after recovery.
  - interval: 1m
    input_series:
      - series: 'node_network_carrier{device="eno1", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '1x2 0x3 1x10'
      - series: 'node_network_up{device="eno1", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '1x15'
    alert_rule_test:
      - eval_time: 5m
        alertname: WiredLinkDown
        exp_alerts: []
      - eval_time: 9m
        alertname: WiredLinkDown
        exp_alerts: []

  # A FREE session on daniel-server, beside a logged-in one on daniel-box. IscsiSessionStale
  # fires for the FREE one after its 15m `for:` and never for the logged-in one. Both nodes'
  # check files stay fresh, so IscsiSessionsNotReporting stays quiet.
  - interval: 1m
    input_series:
      - series: 'homelab_iscsi_session_info{connection_state="failed", instance="daniel-server", job="node", origin="daniel-server", session="session2", state="FREE", target="iqn.2019-10.io.longhorn:pvc-1"}'
        values: '1x20'
      - series: 'homelab_iscsi_session_info{connection_state="up", instance="daniel-box", job="node", origin="daniel-box", session="session3", state="LOGGED_IN", target="iqn.2019-10.io.longhorn:pvc-2"}'
        values: '1x20'
      - series: 'homelab_check_last_run_timestamp_seconds{check="iscsi-sessions", instance="daniel-server", job="node", origin="daniel-server"}'
        values: '0+60x20'
      - series: 'homelab_check_last_run_timestamp_seconds{check="iscsi-sessions", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '0+60x20'
      - series: 'up{instance="daniel-server", job="node", origin="daniel-server"}'
        values: '1x20'
      - series: 'up{instance="daniel-box", job="node", origin="daniel-box"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: 14m
        alertname: IscsiSessionStale
        exp_alerts: []
      - eval_time: 16m
        alertname: IscsiSessionStale
        exp_alerts:
          - exp_labels:
              connection_state: failed
              instance: daniel-server
              job: node
              origin: daniel-server
              session: session2
              state: FREE
              target: iqn.2019-10.io.longhorn:pvc-1
              severity: warning
              service: daniel-server
            exp_annotations:
              summary: >-
                daniel-server: the iSCSI session session2 to iqn.2019-10.io.longhorn:pvc-1 reads
                FREE.
              description: >-
                session2 on daniel-server has read FREE for 15 minutes (target
                iqn.2019-10.io.longhorn:pvc-1). The next attach of that volume fails, and
                Longhorn deletes the pod every ~30s. Clean it up with
                docs/longhorn-disaster-recovery.md, "A stale iSCSI session blocks an attach".
              runbook_url: https://docs.local.daniel-hunter.com/longhorn-disaster-recovery/
      - eval_time: 16m
        alertname: IscsiSessionsNotReporting
        exp_alerts: []

  # daniel-box's check file stopped being refreshed at 0 while its exporter stays up, and
  # daniel-server's stays fresh. The stale-file arm fires once the timestamp is more than 300s old, between minutes 5 and 6.
  # The absent_over_time arm is the zero-series case's.
  - interval: 1m
    input_series:
      - series: 'homelab_check_last_run_timestamp_seconds{check="iscsi-sessions", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '0x10'
      - series: 'up{instance="daniel-box", job="node", origin="daniel-box"}'
        values: '1x10'
      - series: 'homelab_check_last_run_timestamp_seconds{check="iscsi-sessions", instance="daniel-server", job="node", origin="daniel-server"}'
        values: '0+60x10'
      - series: 'up{instance="daniel-server", job="node", origin="daniel-server"}'
        values: '1x10'
    alert_rule_test:
      - eval_time: 5m
        alertname: IscsiSessionsNotReporting
        exp_alerts: []
      - eval_time: 6m
        alertname: IscsiSessionsNotReporting
        exp_alerts:
          - exp_labels:
              check: iscsi-sessions
              instance: daniel-box
              job: node
              origin: daniel-box
              severity: warning
              service: daniel-box
            exp_annotations:
              summary: 'daniel-box: the iSCSI session check has stopped reporting.'
              description: >-
                No iscsi-sessions verdict newer than 5 minutes reached Prometheus from daniel-box's
                textfile collector, so nothing is watching the node's iSCSI sessions. Read the
                log of the node-exporter pod's `iscsi-sessions` container on daniel-box.

  # The same frozen file behind a dead exporter: the `unless` clause leaves it to the bridge's
  # `targets` check. The group above is its control.
  - interval: 1m
    input_series:
      - series: 'homelab_check_last_run_timestamp_seconds{check="iscsi-sessions", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '0x10'
      - series: 'up{instance="daniel-box", job="node", origin="daniel-box"}'
        values: '0x10'
      - series: 'homelab_check_last_run_timestamp_seconds{check="iscsi-sessions", instance="daniel-server", job="node", origin="daniel-server"}'
        values: '0+60x10'
      - series: 'up{instance="daniel-server", job="node", origin="daniel-server"}'
        values: '1x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: IscsiSessionsNotReporting
        exp_alerts: []
  # The two daniel-box crons. A failing verdict fires both Failed
  # rules and leaves both NotReporting rules quiet.
  - interval: 1m
    input_series:
      - series: 'homelab_check_success{check="sync-artifacts", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '0x30'
      - series: 'homelab_check_last_run_timestamp_seconds{check="sync-artifacts", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '0+60x30'
      - series: 'homelab_check_success{check="claude-otel-health", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '0x30'
      - series: 'homelab_check_last_run_timestamp_seconds{check="claude-otel-health", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '0+60x30'
      - series: 'up{instance="daniel-box", job="node", origin="daniel-box"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: ArtifactsSyncFailed
        exp_alerts:
          - exp_labels:
              check: sync-artifacts
              instance: daniel-box
              job: node
              origin: daniel-box
              severity: warning
              service: daniel-box
            exp_annotations:
              summary: 'daniel-box: the peer artifact sync is failing.'
              description: >-
                sync-artifacts.sh has failed a peer for claude_code_artifacts_sync_alert_after_failures
                consecutive runs, so that peer's artifacts are stale in the browser. Run `journalctl -t
                sync-artifacts` on daniel-box for the peer and its streak, then ssh to the named peer.
      - eval_time: 20m
        alertname: OtlpDoorClosed
        exp_alerts:
          - exp_labels:
              check: claude-otel-health
              instance: daniel-box
              job: node
              origin: daniel-box
              severity: warning
              service: daniel-box
            exp_annotations:
              summary: 'daniel-box: the telemetry OTLP receiver on loopback refuses connections.'
              description: >-
                Claude Code cannot export telemetry even with every pod Ready, because the hostPort
                DNAT is an iptables rule rather than a socket. Check the otel-collector DaemonSet pod
                on daniel-box, then the portmap rule.
      - eval_time: 20m
        alertname: ArtifactsSyncNotReporting
        exp_alerts: []
      - eval_time: 20m
        alertname: OtlpDoorNotReporting
        exp_alerts: []
  # The two NotReporting rules differ by their own deadline. The files were last written at
  # minute 0, so at 20m they are 1200s old: only the 900s sync rule fires. At 40m both do.
  - interval: 1m
    input_series:
      - series: 'homelab_check_success{check="sync-artifacts", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '1x40'
      - series: 'homelab_check_last_run_timestamp_seconds{check="sync-artifacts", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '0x40'
      - series: 'homelab_check_success{check="claude-otel-health", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '1x40'
      - series: 'homelab_check_last_run_timestamp_seconds{check="claude-otel-health", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '0x40'
      - series: 'up{instance="daniel-box", job="node", origin="daniel-box"}'
        values: '1x40'
    alert_rule_test:
      - eval_time: 20m
        alertname: ArtifactsSyncNotReporting
        exp_alerts:
          - exp_labels:
              check: sync-artifacts
              instance: daniel-box
              job: node
              origin: daniel-box
              severity: warning
              service: daniel-box
            exp_annotations: &sync_not_reporting
              summary: 'daniel-box: the peer artifact sync has stopped reporting.'
              description: >-
                No sync-artifacts verdict newer than 15 minutes reached Prometheus from
                daniel-box, so the cron stopped, or a hung run holds its flock. Read the `Sync
                peer Claude artifacts` cron and `journalctl -t sync-artifacts`, then
                /var/lib/node-exporter-textfile/sync-artifacts.prom on the host.
      - eval_time: 20m
        alertname: OtlpDoorNotReporting
        exp_alerts: []
      - eval_time: 40m
        alertname: OtlpDoorNotReporting
        exp_alerts:
          - exp_labels:
              check: claude-otel-health
              instance: daniel-box
              job: node
              origin: daniel-box
              severity: warning
              service: daniel-box
            exp_annotations: &otlp_not_reporting
              summary: 'daniel-box: the telemetry OTLP-door check has stopped reporting.'
              description: >-
                No claude-otel-health verdict newer than 25 minutes reached Prometheus from
                daniel-box, so nothing is watching the OTLP door. Read the `Claude Code
                telemetry health` cron and `journalctl -t claude-otel-health`, then
                /var/lib/node-exporter-textfile/claude-otel-health.prom on the host.
  # Zero-series case: no sample has ever arrived, so both rules fire through absent_over_time,
  # carrying only the equality matchers' `check` and `origin`.
  - interval: 1m
    input_series:
      - series: 'up{instance="daniel-box", job="node", origin="daniel-box"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 30m
        alertname: ArtifactsSyncNotReporting
        exp_alerts:
          - exp_labels:
              check: sync-artifacts
              origin: daniel-box
              severity: warning
              service: daniel-box
            exp_annotations: *sync_not_reporting
      - eval_time: 30m
        alertname: OtlpDoorNotReporting
        exp_alerts:
          - exp_labels:
              check: claude-otel-health
              origin: daniel-box
              severity: warning
              service: daniel-box
            exp_annotations: *otlp_not_reporting
  # A dead node exporter is the `targets` check's page, so both NotReporting rules stay quiet.
  - interval: 1m
    input_series:
      - series: 'up{instance="daniel-box", job="node", origin="daniel-box"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 30m
        alertname: ArtifactsSyncNotReporting
        exp_alerts: []
      - eval_time: 30m
        alertname: OtlpDoorNotReporting
        exp_alerts: []

  # daniel-box and daniel-pi write a fresh red aide-check verdict. AideCheckFailed fires for
  # daniel-box and not for daniel-pi, which schedules no AIDE scan, so a red verdict left from
  # before its timer went fires nothing.
  - interval: 1m
    input_series:
      - series: 'homelab_check_success{check="aide-check", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '0x10'
      - series: 'homelab_check_success{check="aide-check", instance="daniel-pi", job="node-pi", origin="daniel-pi"}'
        values: '0x10'
    alert_rule_test:
      - eval_time: 5m
        alertname: AideCheckFailed
        exp_alerts:
          - exp_labels:
              check: aide-check
              escalate: "false"
              instance: daniel-box
              job: node
              origin: daniel-box
              severity: warning
              service: daniel-box
            exp_annotations:
              summary: 'daniel-box: the weekly AIDE check failed or found an unexplained change.'
              description: >-
                aide-check on daniel-box ended with status=down: an unexplained file change, an
                AIDE error, or a held lock. Run `journalctl -t aide-check` on daniel-box. Once
                every path is reviewed, run `sudo /usr/lib/homelab/aide-check --accept`, then
                `sudo systemctl start homelab-aide-check.service`.
              runbook_url: https://docs.local.daniel-hunter.com/alert-runbooks/#aidecheckfailed
  # No AIDE file on any host, and every exporter is up. The absent_over_time arm fires for the
  # two k3s nodes and not for daniel-pi, which carries no AIDE rule.
  - interval: 1m
    input_series:
      - series: 'up{instance="daniel-box", job="node", origin="daniel-box"}'
        values: '1x10'
      - series: 'up{instance="daniel-server", job="node", origin="daniel-server"}'
        values: '1x10'
      - series: 'up{instance="daniel-pi", job="node-pi", origin="daniel-pi"}'
        values: '1x10'
    alert_rule_test:
      - eval_time: 5m
        alertname: AideCheckNotReporting
        exp_alerts:
          - exp_labels:
              check: aide-check
              origin: daniel-box
              severity: warning
              service: daniel-box
            exp_annotations:
              summary: 'daniel-box: the weekly AIDE check has stopped reporting.'
              description: >-
                No aide-check verdict newer than 626400s reached Prometheus from daniel-box, so
                nothing confirms the file-integrity scan still runs. Read the `Weekly AIDE file
                integrity check` cron and `journalctl -t aide-check`, then
                /var/lib/node-exporter-textfile/aide-check.prom on the host.
          - exp_labels:
              check: aide-check
              origin: daniel-server
              severity: warning
              service: daniel-server
            exp_annotations:
              summary: 'daniel-server: the weekly AIDE check has stopped reporting.'
              description: >-
                No aide-check verdict newer than 626400s reached Prometheus from daniel-server,
                so nothing confirms the file-integrity scan still runs. Read the `Weekly AIDE
                file integrity check` cron and `journalctl -t aide-check`, then
                /var/lib/node-exporter-textfile/aide-check.prom on the host.

  # daniel-server's rkhunter file holds a verdict taken 611000s before time 0, so the test runs
  # minutes rather than a week. RkhunterScanNotReporting's first arm stays quiet at 10m
  # (611600s old) and fires at 20m, past the 612000s deadline. The verdict was green, so
  # RkhunterScanFailed stays quiet. The other two exporters read down, which keeps their hosts'
  # absent arms out of the case.
  - interval: 1m
    input_series:
      - series: 'up{instance="daniel-box", job="node", origin="daniel-box"}'
        values: '0x25'
      - series: 'up{instance="daniel-pi", job="node-pi", origin="daniel-pi"}'
        values: '0x25'
      - series: 'homelab_check_success{check="rkhunter-check", instance="daniel-server", job="node", origin="daniel-server"}'
        values: '1x25'
      - series: 'homelab_check_last_run_timestamp_seconds{check="rkhunter-check", instance="daniel-server", job="node", origin="daniel-server"}'
        values: '-611000x25'
      - series: 'up{instance="daniel-server", job="node", origin="daniel-server"}'
        values: '1x25'
    alert_rule_test:
      - eval_time: 10m
        alertname: RkhunterScanNotReporting
        exp_alerts: []
      - eval_time: 20m
        alertname: RkhunterScanFailed
        exp_alerts: []
      - eval_time: 20m
        alertname: RkhunterScanNotReporting
        exp_alerts:
          - exp_labels:
              check: rkhunter-check
              instance: daniel-server
              job: node
              origin: daniel-server
              severity: warning
              service: daniel-server
            exp_annotations:
              summary: 'daniel-server: the weekly rkhunter scan has stopped reporting.'
              description: >-
                No rkhunter-check verdict newer than 612000s reached Prometheus from
                daniel-server, so nothing confirms the malware scan still runs. Read the `Weekly
                rkhunter malware scan` cron and `journalctl -t rkhunter-check`, then
                /var/lib/node-exporter-textfile/rkhunter-check.prom on the host.

  # A check no per-check rule names stops writing at time 0 with a 600s deadline. HostCheckOverdue
  # crosses its own deadline series at 11m, holds pending through 12m and fires at 13m. A pod exporter's check with
  # the same origin and an older timestamp is pods.yaml's to page, so it never appears here.
  - interval: 1m
    input_series:
      - series: 'homelab_check_last_run_timestamp_seconds{check="new-producer", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '0x15'
      - series: 'homelab_check_deadline_seconds{check="new-producer", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '600x15'
      - series: 'homelab_check_last_run_timestamp_seconds{check="cycle", instance="10.0.0.9:9100", job="autofix-bridge", origin="daniel-box"}'
        values: '0x15'
      - series: 'homelab_check_deadline_seconds{check="cycle", instance="10.0.0.9:9100", job="autofix-bridge", origin="daniel-box"}'
        values: '60x15'
      - series: 'up{instance="daniel-box", job="node", origin="daniel-box"}'
        values: '1x15'
    alert_rule_test:
      - eval_time: 9m
        alertname: HostCheckOverdue
        exp_alerts: []
      - eval_time: 12m
        alertname: HostCheckOverdue
        exp_alerts: []
      - eval_time: 13m
        alertname: HostCheckOverdue
        exp_alerts:
          - exp_labels:
              check: new-producer
              origin: daniel-box
              severity: warning
              service: daniel-box
            exp_annotations:
              summary: 'daniel-box: the new-producer check is past its own deadline.'
              description: >-
                The new-producer textfile on daniel-box holds a verdict older than the
                homelab_check_deadline_seconds it declares, so its producer stopped writing.
                Read /var/lib/node-exporter-textfile/new-producer.prom on the host, then the
                journal of the cron or timer that writes it.

  # The same overdue check with its producer disarmed on purpose: the marker keeps the rule quiet,
  # because the producer's own pair goes quiet on it too and leaves no inhibit source.
  - interval: 1m
    input_series:
      - series: 'homelab_check_last_run_timestamp_seconds{check="new-producer", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '0x15'
      - series: 'homelab_check_deadline_seconds{check="new-producer", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '600x15'
      - series: 'homelab_check_disarmed{check="new-producer", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '1x15'
      - series: 'up{instance="daniel-box", job="node", origin="daniel-box"}'
        values: '1x15'
    alert_rule_test:
      - eval_time: 13m
        alertname: HostCheckOverdue
        exp_alerts: []

  # daniel-pi's collector fails from minute 3. Its own TextfileCollectorError fires after 10m.
  - interval: 1m
    input_series:
      - series: 'node_textfile_scrape_error{instance="daniel-pi", job="node-pi", origin="daniel-pi"}'
        values: '0x2 1x20'
    alert_rule_test:
      - eval_time: 14m
        alertname: TextfileCollectorError
        exp_alerts:
          - exp_labels:
              instance: daniel-pi
              job: node-pi
              origin: daniel-pi
              severity: warning
              service: daniel-pi
              shadow: "true"
            exp_annotations:
              summary: 'daniel-pi: node_exporter cannot read a textfile, candidates: none known.'
              description: >-
                Read the node-exporter log on daniel-pi for the textfile it rejects: a file in
                /var/lib/node-exporter-textfile is malformed or unreadable, so every series in it is
                gone. The summary lists candidates, and the runbook says which files the list
                misses.
              runbook_url: https://docs.local.daniel-hunter.com/alert-runbooks/#textfilecollectorerror

  # The Pi's compose run reads 1, then 0 from minute 3. ComposeUpFailed fires with no hold.
  - interval: 1m
    input_series:
      - series: 'homelab_compose_up_result{host="daniel-pi", instance="daniel-pi", job="node-pi", origin="daniel-pi", sha="abcdef012345"}'
        values: '1x2 0x5'
    alert_rule_test:
      - eval_time: 2m
        alertname: ComposeUpFailed
        exp_alerts: []
      - eval_time: 4m
        alertname: ComposeUpFailed
        exp_alerts:
          - exp_labels:
              host: daniel-pi
              instance: daniel-pi
              job: node-pi
              origin: daniel-pi
              sha: abcdef012345
              severity: warning
              service: daniel-pi
              shadow: "true"
            exp_annotations:
              summary: 'daniel-pi: the last Compose run did not bring the project up.'
              description: >-
                compose-run on daniel-pi wrote homelab_compose_up_result 0 at package
                abcdef012345: a key check, the config check, an image pull, compose-adopt or
                `docker compose up --wait` failed. Read `journalctl -u homelab-compose` and
                `docker ps -a` on daniel-pi.

  # The Pi booted at time 0, and its compose result predates the boot, so the boot run never
  # wrote. ComposeUpStale waits out the 1690s grace (quiet at 20m) and fires at 30m.
  - interval: 1m
    input_series:
      - series: 'node_boot_time_seconds{instance="daniel-pi", job="node-pi", origin="daniel-pi"}'
        values: '0x40'
      - series: 'homelab_compose_up_timestamp_seconds{host="daniel-pi", instance="daniel-pi", job="node-pi", origin="daniel-pi"}'
        values: '-200000x40'
    alert_rule_test:
      - eval_time: 20m
        alertname: ComposeUpStale
        exp_alerts: []
      - eval_time: 30m
        alertname: ComposeUpStale
        exp_alerts:
          - exp_labels:
              host: daniel-pi
              instance: daniel-pi
              job: node-pi
              origin: daniel-pi
              severity: warning
              service: daniel-pi
            exp_annotations:
              summary: 'daniel-pi: the Compose project has not run since boot.'
              description: >-
                daniel-pi booted more than 1690s ago, and homelab_compose_up_timestamp_seconds
                still predates that boot or is missing, so the boot's compose-run wrote no
                result. Read `systemctl status homelab-compose` and `journalctl -b -u
                homelab-compose` on daniel-pi.
              runbook_url: https://docs.local.daniel-hunter.com/alert-runbooks/#composeupstale

  # The same boot, but the boot run writes 120s after it. A week-old result is quiet as long
  # as it follows the last boot.
  - interval: 1m
    input_series:
      - series: 'node_boot_time_seconds{instance="daniel-pi", job="node-pi", origin="daniel-pi"}'
        values: '0x40'
      - series: 'homelab_compose_up_timestamp_seconds{host="daniel-pi", instance="daniel-pi", job="node-pi", origin="daniel-pi"}'
        values: '-200000x2 120x38'
    alert_rule_test:
      - eval_time: 30m
        alertname: ComposeUpStale
        exp_alerts: []

  # The exporter serves a boot time but no compose result at all: the file is gone.
  - interval: 1m
    input_series:
      - series: 'node_boot_time_seconds{instance="daniel-pi", job="node-pi", origin="daniel-pi"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 20m
        alertname: ComposeUpStale
        exp_alerts: []
      - eval_time: 30m
        alertname: ComposeUpStale
        exp_alerts:
          - exp_labels:
              origin: daniel-pi
              severity: warning
              service: daniel-pi
            exp_annotations:
              summary: 'daniel-pi: the Compose project has not run since boot.'
              description: >-
                daniel-pi booted more than 1690s ago, and homelab_compose_up_timestamp_seconds
                still predates that boot or is missing, so the boot's compose-run wrote no
                result. Read `systemctl status homelab-compose` and `journalctl -b -u
                homelab-compose` on daniel-pi.
              runbook_url: https://docs.local.daniel-hunter.com/alert-runbooks/#composeupstale

  # A stale result fires while the exporter answers, and the rule goes quiet once the scrape
  # fails and every series goes stale, leaving the page to ScrapeTargetDown.
  - interval: 1m
    input_series:
      - series: 'node_boot_time_seconds{instance="daniel-pi", job="node-pi", origin="daniel-pi"}'
        values: '-100000x10 _x30'
      - series: 'homelab_compose_up_timestamp_seconds{host="daniel-pi", instance="daniel-pi", job="node-pi", origin="daniel-pi"}'
        values: '-200000x10 _x30'
    alert_rule_test:
      - eval_time: 5m
        alertname: ComposeUpStale
        exp_alerts:
          - exp_labels:
              host: daniel-pi
              instance: daniel-pi
              job: node-pi
              origin: daniel-pi
              severity: warning
              service: daniel-pi
            exp_annotations:
              summary: 'daniel-pi: the Compose project has not run since boot.'
              description: >-
                daniel-pi booted more than 1690s ago, and homelab_compose_up_timestamp_seconds
                still predates that boot or is missing, so the boot's compose-run wrote no
                result. Read `systemctl status homelab-compose` and `journalctl -b -u
                homelab-compose` on daniel-pi.
              runbook_url: https://docs.local.daniel-hunter.com/alert-runbooks/#composeupstale
      - eval_time: 30m
        alertname: ComposeUpStale
        exp_alerts: []

  # Reconcile restarted homelab-compose.service at 1000, after a digest bump, and compose-run
  # wrote nothing: the result still ends at 500. The rule is quiet at 4m inside its
  # 5m `for` and fires at 10m. Another unit's start time is ignored.
  - interval: 1m
    input_series:
      - series: 'homelab_host_unit_started_seconds{host="daniel-pi", instance="daniel-pi", job="node-pi", origin="daniel-pi", unit="homelab-compose.service"}'
        values: '1000x15'
      - series: 'homelab_host_unit_started_seconds{host="daniel-pi", instance="daniel-pi", job="node-pi", origin="daniel-pi", unit="homelab-secrets.service"}'
        values: '2000x15'
      - series: 'homelab_compose_up_timestamp_seconds{host="daniel-pi", instance="daniel-pi", job="node-pi", origin="daniel-pi"}'
        values: '500x15'
    alert_rule_test:
      - eval_time: 4m
        alertname: ComposeRestartUnreported
        exp_alerts: []
      - eval_time: 10m
        alertname: ComposeRestartUnreported
        exp_alerts:
          - exp_labels:
              host: daniel-pi
              instance: daniel-pi
              job: node-pi
              origin: daniel-pi
              unit: homelab-compose.service
              severity: warning
              service: daniel-pi
            exp_annotations:
              summary: >-
                daniel-pi: the Compose project wrote no result for reconcile's last start of it.
              description: >-
                homelab-reconcile started homelab-compose.service on daniel-pi, and
                homelab_compose_up_timestamp_seconds still predates that call, so compose-run
                wrote no result for it. Read `journalctl -u homelab-compose -u
                homelab-reconcile` on daniel-pi.
              runbook_url: https://docs.local.daniel-hunter.com/alert-runbooks/#composerestartunreported

  # The same restart, and compose-run wrote its result at 1040, after the call. Quiet.
  - interval: 1m
    input_series:
      - series: 'homelab_host_unit_started_seconds{host="daniel-pi", instance="daniel-pi", job="node-pi", origin="daniel-pi", unit="homelab-compose.service"}'
        values: '1000x15'
      - series: 'homelab_compose_up_timestamp_seconds{host="daniel-pi", instance="daniel-pi", job="node-pi", origin="daniel-pi"}'
        values: '1040x15'
    alert_rule_test:
      - eval_time: 10m
        alertname: ComposeRestartUnreported
        exp_alerts: []

  # daniel-box first owed a reboot 690000s before time 0, and a later package change rewrites
  # its reconcile file every minute without moving that time. It crosses the 691200s bound at
  # 20m, is quiet at 30m inside the 15m `for`, and fires at 40m. daniel-server has owed its
  # reboot for longer than 8 days, then reboots at 5m, and homelab-reconcile-metrics.service
  # rewrites its 1 to 0 at 10m. Its rule stays quiet, because the 1 never lasts 15m.
  - interval: 1m
    input_series:
      - series: 'homelab_host_reboot_pending{host="daniel-box", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '1x45'
      - series: 'homelab_host_reboot_pending_since_seconds{host="daniel-box", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '-690000x45'
      - series: 'node_textfile_mtime_seconds{file="/textfile/homelab_host_reconcile.prom", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '0+60x45'
      - series: 'homelab_host_reboot_pending{host="daniel-server", instance="daniel-server", job="node", origin="daniel-server"}'
        values: '1x9 0x35'
      - series: 'homelab_host_reboot_pending_since_seconds{host="daniel-server", instance="daniel-server", job="node", origin="daniel-server"}'
        values: '-700000x9 _x35'
    alert_rule_test:
      - eval_time: 30m
        alertname: HostRebootOverdue
        exp_alerts: []
      - eval_time: 40m
        alertname: HostRebootOverdue
        exp_alerts:
          - exp_labels:
              host: daniel-box
              instance: daniel-box
              job: node
              origin: daniel-box
              severity: warning
              service: daniel-box
            exp_annotations:
              summary: 'daniel-box: a reboot has been owed for more than 8 days.'
              description: >-
                Reconcile recorded a reboot-class package change on daniel-box more than 8 days
                ago, and the host has not booted since. Read `journalctl -t weekly-restart` on
                daniel-box and docs/host-packages.md, "Reboot-pending and activation-pending",
                then reboot the host.
              runbook_url: https://docs.local.daniel-hunter.com/host-packages/

  # daniel-box's rkhunter scan writes a fresh red verdict, and RkhunterScanFailed fires for it.
  - interval: 1m
    input_series:
      - series: 'homelab_check_success{check="rkhunter-check", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '0x10'
    alert_rule_test:
      - eval_time: 5m
        alertname: RkhunterScanFailed
        exp_alerts:
          - exp_labels:
              check: rkhunter-check
              escalate: "false"
              instance: daniel-box
              job: node
              origin: daniel-box
              severity: warning
              service: daniel-box
            exp_annotations:
              summary: 'daniel-box: the weekly rkhunter scan warned or did not complete.'
              description: >-
                rkhunter-check.sh on daniel-box ended with status=down: rkhunter raised a
                warning, a suspect file or a possible rootkit, or the scan wrote no summary.
                Read /var/log/rkhunter.log and `journalctl -t rkhunter-check` on daniel-box,
                then run `sudo systemctl start homelab-rkhunter-check.service`.
              runbook_url: https://docs.local.daniel-hunter.com/alert-runbooks/#rkhunterscanfailed

  # The claude_code timers. Every check file stopped being refreshed at 0 while both
  # exporters stay up. Each NotReporting rule stays quiet at its deadline and fires in the next
  # minute: claude-triage-poll at 660s, the three syncs at 2100s, the lander at 3300s. The two
  # syncs that run on both hosts fire once per host. The absent_over_time arm is the
  # zero-series case's.
  - interval: 1m
    input_series:
      - series: 'homelab_check_last_run_timestamp_seconds{check="claude-clone-sync", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '0x60'
      - series: 'homelab_check_last_run_timestamp_seconds{check="claude-clone-sync", instance="daniel-server", job="node", origin="daniel-server"}'
        values: '0x60'
      - series: 'homelab_check_last_run_timestamp_seconds{check="claude-dotfiles-sync", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '0x60'
      - series: 'homelab_check_last_run_timestamp_seconds{check="claude-dotfiles-sync", instance="daniel-server", job="node", origin="daniel-server"}'
        values: '0x60'
      - series: 'homelab_check_last_run_timestamp_seconds{check="claude-memory-sync", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '0x60'
      - series: 'homelab_check_last_run_timestamp_seconds{check="claude-triage-poll", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '0x60'
      - series: 'homelab_check_last_run_timestamp_seconds{check="claude-fanout-server-lander", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '0x60'
      # The daily snapshot's file was taken 171600s before time 0, so it is 174900s old at 55m.
      - series: 'homelab_check_last_run_timestamp_seconds{check="claude-pipeline-timeline", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '-171600x60'
      - series: 'up{instance="daniel-box", job="node", origin="daniel-box"}'
        values: '1x60'
      - series: 'up{instance="daniel-server", job="node", origin="daniel-server"}'
        values: '1x60'
    alert_rule_test:
      - eval_time: 55m
        alertname: ClaudePipelineTimelineNotReporting
        exp_alerts: []
      - eval_time: 56m
        alertname: ClaudePipelineTimelineNotReporting
        exp_alerts:
          - exp_labels:
              check: claude-pipeline-timeline
              instance: daniel-box
              job: node
              origin: daniel-box
              severity: warning
              service: daniel-box
            exp_annotations:
              summary: 'daniel-box: the pipeline timeline snapshot has stopped reporting.'
              description: >-
                No claude-pipeline-timeline verdict newer than 174900s from daniel-box, so the
                PR timeline snapshot is not running, and the journal inputs it saves rotate
                after about ten days. Read `systemctl status
                homelab-claude-pipeline-timeline.timer` and `journalctl -u
                homelab-claude-pipeline-timeline`.
              runbook_url: https://docs.local.daniel-hunter.com/alert-runbooks/#claudepipelinetimelinenotreporting
      - eval_time: 11m
        alertname: ClaudeTriagePollNotReporting
        exp_alerts: []
      - eval_time: 12m
        alertname: ClaudeTriagePollNotReporting
        exp_alerts:
          - exp_labels:
              check: claude-triage-poll
              instance: daniel-box
              job: node
              origin: daniel-box
              severity: warning
              service: daniel-box
            exp_annotations:
              summary: 'daniel-box: the triage poller has stopped reporting.'
              description: >-
                No claude-triage-poll verdict newer than 660s from daniel-box, so the monitor
                triage poll has not completed a clean run. Read `systemctl status
                homelab-claude-triage-poll.timer` and `journalctl -u
                homelab-claude-triage-poll`. If you disabled the timer on purpose, delete this
                rule.
              runbook_url: https://docs.local.daniel-hunter.com/alert-runbooks/#claudetriagepollnotreporting
      - eval_time: 35m
        alertname: ClaudeCloneSyncNotReporting
        exp_alerts: []
      - eval_time: 36m
        alertname: ClaudeCloneSyncNotReporting
        exp_alerts:
          - exp_labels:
              check: claude-clone-sync
              instance: daniel-box
              job: node
              origin: daniel-box
              severity: warning
              service: daniel-box
            exp_annotations:
              summary: 'daniel-box: the agent clone sync has stopped reporting.'
              description: >-
                No claude-clone-sync verdict newer than 2100s from daniel-box, so the agent's
                clone fast-forward has not completed a clean run. Read `systemctl status
                claude-clone-sync.timer` and `journalctl -u claude-clone-sync`. If you disabled
                the timer on purpose, delete this rule.
              runbook_url: https://docs.local.daniel-hunter.com/alert-runbooks/#claudeclonesyncnotreporting
          - exp_labels:
              check: claude-clone-sync
              instance: daniel-server
              job: node
              origin: daniel-server
              severity: warning
              service: daniel-server
            exp_annotations:
              summary: 'daniel-server: the agent clone sync has stopped reporting.'
              description: >-
                No claude-clone-sync verdict newer than 2100s from daniel-server, so the agent's
                clone fast-forward has not completed a clean run. Read `systemctl status
                claude-clone-sync.timer` and `journalctl -u claude-clone-sync`. If you disabled
                the timer on purpose, delete this rule.
              runbook_url: https://docs.local.daniel-hunter.com/alert-runbooks/#claudeclonesyncnotreporting
      - eval_time: 35m
        alertname: ClaudeDotfilesSyncNotReporting
        exp_alerts: []
      - eval_time: 36m
        alertname: ClaudeDotfilesSyncNotReporting
        exp_alerts:
          - exp_labels:
              check: claude-dotfiles-sync
              instance: daniel-box
              job: node
              origin: daniel-box
              severity: warning
              service: daniel-box
            exp_annotations:
