  # The weekly host-maintenance crons on daniel-box. Every check file holds a green verdict
  # taken 611000s before time 0, so each NotReporting rule's first arm stays quiet at 10m
  # (611600s old) and fires at 20m, past the 612000s deadline. The verdicts are green, so the
  # Failed rules stay quiet.
  - interval: 1m
    input_series:
      - series: 'up{instance="daniel-box", job="node", origin="daniel-box"}'
        values: '1x25'
      - series: 'homelab_check_success{check="apt-autoremove", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '1x25'
      - series: 'homelab_check_success{check="dpkg-purge", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '1x25'
      - series: 'homelab_check_success{check="firmware-update", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '1x25'
      - series: 'homelab_check_last_run_timestamp_seconds{check="apt-autoremove", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '-611000x25'
      - series: 'homelab_check_last_run_timestamp_seconds{check="dpkg-purge", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '-611000x25'
      - series: 'homelab_check_last_run_timestamp_seconds{check="firmware-update", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '-611000x25'
    alert_rule_test:
      - eval_time: 10m
        alertname: AptAutoremoveNotReporting
        exp_alerts: []
      - eval_time: 20m
        alertname: AptAutoremoveFailed
        exp_alerts: []
      - eval_time: 10m
        alertname: DpkgPurgeNotReporting
        exp_alerts: []
      - eval_time: 20m
        alertname: DpkgPurgeFailed
        exp_alerts: []
      - eval_time: 10m
        alertname: FirmwareUpdateNotReporting
        exp_alerts: []
      - eval_time: 20m
        alertname: FirmwareUpdateFailed
        exp_alerts: []
      - eval_time: 20m
        alertname: AptAutoremoveNotReporting
        exp_alerts:
          - exp_labels:
              check: apt-autoremove
              instance: daniel-box
              job: node
              origin: daniel-box
              severity: warning
              service: daniel-box
            exp_annotations:
              summary: 'daniel-box: the weekly apt autoremove has stopped reporting.'
              description: >-
                No apt-autoremove verdict newer than 612000s reached Prometheus from daniel-box,
                so nothing confirms the weekly apt autoremove still runs. Read the `Weekly apt
                autoremove` cron and `journalctl -t apt-autoremove`, then
                /var/lib/node-exporter-textfile/apt-autoremove.prom on the host.
              runbook_url: https://docs.local.daniel-hunter.com/alert-runbooks/#aptautoremovenotreporting
      - eval_time: 20m
        alertname: DpkgPurgeNotReporting
        exp_alerts:
          - exp_labels:
              check: dpkg-purge
              instance: daniel-box
              job: node
              origin: daniel-box
              severity: warning
              service: daniel-box
            exp_annotations:
              summary: >-
                daniel-box: the weekly dpkg purge of orphaned configs has stopped reporting.
              description: >-
                No dpkg-purge verdict newer than 612000s reached Prometheus from daniel-box, so
                nothing confirms the weekly dpkg purge still runs. Read the `Weekly dpkg purge
                orphaned configs` cron in root's crontab and `journalctl -t dpkg-purge`, then
                /var/lib/node-exporter-textfile/dpkg-purge.prom on the host.
      - eval_time: 20m
        alertname: FirmwareUpdateNotReporting
        exp_alerts:
          - exp_labels:
              check: firmware-update
              instance: daniel-box
              job: node
              origin: daniel-box
              severity: warning
              service: daniel-box
            exp_annotations:
              summary: 'daniel-box: the weekly firmware update has stopped reporting.'
              description: >-
                No firmware-update verdict newer than 612000s reached Prometheus from
                daniel-box, so nothing confirms the weekly firmware update still runs. Read the
                `Weekly firmware update` cron in root's crontab and `journalctl -t fwupd-auto`,
                then /var/lib/node-exporter-textfile/firmware-update.prom on the host.

  # Every host-maintenance job on daniel-box writes a fresh red verdict, and each Failed rule
  # fires.
  - interval: 1m
    input_series:
      - series: 'homelab_check_success{check="apt-autoremove", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '0x10'
      - series: 'homelab_check_success{check="dpkg-purge", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '0x10'
      - series: 'homelab_check_success{check="firmware-update", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '0x10'
      - series: 'homelab_check_last_run_timestamp_seconds{check="apt-autoremove", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '0+60x10'
      - series: 'homelab_check_last_run_timestamp_seconds{check="dpkg-purge", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '0+60x10'
      - series: 'homelab_check_last_run_timestamp_seconds{check="firmware-update", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '0+60x10'
    alert_rule_test:
      - eval_time: 5m
        alertname: AptAutoremoveFailed
        exp_alerts:
          - exp_labels:
              check: apt-autoremove
              instance: daniel-box
              job: node
              origin: daniel-box
              severity: warning
              service: daniel-box
            exp_annotations:
              summary: 'daniel-box: the weekly apt autoremove failed.'
              description: >-
                host-maintenance.sh apt-autoremove on daniel-box wrote success 0:
                apt-get autoremove exited non-zero. Read `journalctl -t
                apt-autoremove` on daniel-box for the command's output.
      - eval_time: 5m
        alertname: DpkgPurgeFailed
        exp_alerts:
          - exp_labels:
              check: dpkg-purge
              instance: daniel-box
              job: node
              origin: daniel-box
              severity: warning
              service: daniel-box
            exp_annotations:
              summary: 'daniel-box: the weekly dpkg purge of orphaned configs failed.'
              description: >-
                host-maintenance.sh dpkg-purge on daniel-box wrote success 0: the
                dpkg purge of removed packages' configs exited non-zero. Read
                `journalctl -t dpkg-purge` on daniel-box for the command's output.
      - eval_time: 5m
        alertname: FirmwareUpdateFailed
        exp_alerts:
          - exp_labels:
              check: firmware-update
              instance: daniel-box
              job: node
              origin: daniel-box
              severity: warning
              service: daniel-box
            exp_annotations:
              summary: 'daniel-box: the weekly firmware update failed.'
              description: >-
                host-maintenance.sh firmware-update on daniel-box wrote success 0:
                fwupdmgr update exited with an error rather than 0 or 2 (nothing to
                update). Read `journalctl -t fwupd-auto` on daniel-box for the
                command's output.

  # The guardrail audit pairs. Each host's verdict reads 0, so Failed fires. The files were
  # last written at minute 0, so at 10m they are 600s old and NotReporting holds; at 20m they
  # are 1200s old, past the 900s deadline, and it fires.
  - interval: 1m
    input_series:
      - series: 'homelab_check_success{check="claude-guardrail-audit", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '0x20'
      - series: 'homelab_check_last_run_timestamp_seconds{check="claude-guardrail-audit", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '0x20'
      - series: 'up{instance="daniel-box", job="node", origin="daniel-box"}'
        values: '1x20'
      - series: 'homelab_check_success{check="claude-guardrail-audit", instance="daniel-server", job="node", origin="daniel-server"}'
        values: '0x20'
      - series: 'homelab_check_last_run_timestamp_seconds{check="claude-guardrail-audit", instance="daniel-server", job="node", origin="daniel-server"}'
        values: '0x20'
      - series: 'up{instance="daniel-server", job="node", origin="daniel-server"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: ClaudeGuardrailAuditFailed
        exp_alerts:
          - exp_labels:
              check: claude-guardrail-audit
              instance: daniel-box
              job: node
              origin: daniel-box
              severity: warning
              service: daniel-box
            exp_annotations:
              summary: >-
                daniel-box: the audit watches on the Claude Code guardrail paths are not in place.
              description: >-
                claude-guardrail-audit on daniel-box ended with status=down: auditd is not
                running, kernel auditing is off, or a guardrail path has no watch, so guardrail
                writes leave no audit record. Run `journalctl -t claude-guardrail-audit` on
                daniel-box, then `systemctl status auditd`.
              runbook_url: https://docs.local.daniel-hunter.com/alert-runbooks/#claudeguardrailauditfailed
          - exp_labels:
              check: claude-guardrail-audit
              instance: daniel-server
              job: node
              origin: daniel-server
              severity: warning
              service: daniel-server
            exp_annotations:
              summary: >-
                daniel-server: the audit watches on the Claude Code guardrail paths are not in
                place.
              description: >-
                claude-guardrail-audit on daniel-server ended with status=down: auditd is not
                running, kernel auditing is off, or a guardrail path has no watch, so guardrail
                writes leave no audit record. Run `journalctl -t claude-guardrail-audit` on
                daniel-server, then `systemctl status auditd`.
              runbook_url: https://docs.local.daniel-hunter.com/alert-runbooks/#claudeguardrailauditfailed
      - eval_time: 10m
        alertname: ClaudeGuardrailAuditNotReporting
        exp_alerts: []
      - eval_time: 20m
        alertname: ClaudeGuardrailAuditNotReporting
        exp_alerts:
          - exp_labels:
              check: claude-guardrail-audit
              instance: daniel-box
              job: node
              origin: daniel-box
              severity: warning
              service: daniel-box
            exp_annotations:
              summary: 'daniel-box: the guardrail audit check has stopped reporting.'
              description: >-
                No claude-guardrail-audit verdict newer than 15 minutes reached Prometheus from
                daniel-box, so nothing reloads a watch an auditd restart dropped. Read
                `systemctl status homelab-claude-guardrail-audit.timer` and `journalctl -t
                claude-guardrail-audit`.
              runbook_url: https://docs.local.daniel-hunter.com/alert-runbooks/#claudeguardrailauditnotreporting
          - exp_labels:
              check: claude-guardrail-audit
              instance: daniel-server
              job: node
              origin: daniel-server
              severity: warning
              service: daniel-server
            exp_annotations:
              summary: 'daniel-server: the guardrail audit check has stopped reporting.'
              description: >-
                No claude-guardrail-audit verdict newer than 15 minutes reached Prometheus from
                daniel-server, so nothing reloads a watch an auditd restart dropped. Read
                `systemctl status homelab-claude-guardrail-audit.timer` and `journalctl -t
                claude-guardrail-audit`.
              runbook_url: https://docs.local.daniel-hunter.com/alert-runbooks/#claudeguardrailauditnotreporting

  # The guardrail acknowledgement pairs, on the audit pairs' timeline: Failed fires on the 0
  # verdict, NotReporting holds at 600s and fires at 1200s past the 900s deadline.
  - interval: 1m
    input_series:
      - series: 'homelab_check_success{check="claude-guardrail-ack", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '0x20'
      - series: 'homelab_check_last_run_timestamp_seconds{check="claude-guardrail-ack", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '0x20'
      - series: 'up{instance="daniel-box", job="node", origin="daniel-box"}'
        values: '1x20'
      - series: 'homelab_check_success{check="claude-guardrail-ack", instance="daniel-server", job="node", origin="daniel-server"}'
        values: '0x20'
      - series: 'homelab_check_last_run_timestamp_seconds{check="claude-guardrail-ack", instance="daniel-server", job="node", origin="daniel-server"}'
        values: '0x20'
      - series: 'up{instance="daniel-server", job="node", origin="daniel-server"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: ClaudeGuardrailAckFailed
        exp_alerts:
          - exp_labels:
              check: claude-guardrail-ack
              instance: daniel-box
              job: node
              origin: daniel-box
              severity: warning
              service: daniel-box
            exp_annotations:
              summary: 'daniel-box: the guardrail change poster is failing.'
              description: >-
                claude-guardrail-ack on daniel-box ended with status=down: it could not read a guardrail
                path, render the dotfiles, or deliver its Discord post. Until it clears, a change
                to a hook or a settings file reaches nobody. Run `journalctl -t claude-guardrail-ack`
                on daniel-box.
          - exp_labels:
              check: claude-guardrail-ack
              instance: daniel-server
              job: node
              origin: daniel-server
              severity: warning
              service: daniel-server
            exp_annotations:
              summary: 'daniel-server: the guardrail change poster is failing.'
              description: >-
                claude-guardrail-ack on daniel-server ended with status=down: it could not read a guardrail
                path, render the dotfiles, or deliver its Discord post. Until it clears, a change
                to a hook or a settings file reaches nobody. Run `journalctl -t claude-guardrail-ack`
                on daniel-server.
      - eval_time: 10m
        alertname: ClaudeGuardrailAckNotReporting
        exp_alerts: []
      - eval_time: 20m
        alertname: ClaudeGuardrailAckNotReporting
        exp_alerts:
          - exp_labels:
              check: claude-guardrail-ack
              instance: daniel-box
              job: node
              origin: daniel-box
              severity: warning
              service: daniel-box
            exp_annotations:
              summary: 'daniel-box: the guardrail change poster has stopped reporting.'
              description: >-
                No claude-guardrail-ack verdict newer than 15 minutes reached Prometheus from
                daniel-box, so no guardrail change is being posted. Read `systemctl status
                homelab-claude-guardrail-ack.timer` and `journalctl -t claude-guardrail-ack`,
                then /var/lib/node-exporter-textfile/claude-guardrail-ack.prom.
          - exp_labels:
              check: claude-guardrail-ack
              instance: daniel-server
              job: node
              origin: daniel-server
              severity: warning
              service: daniel-server
            exp_annotations:
              summary: 'daniel-server: the guardrail change poster has stopped reporting.'
              description: >-
                No claude-guardrail-ack verdict newer than 15 minutes reached Prometheus from
                daniel-server, so no guardrail change is being posted. Read `systemctl status
                homelab-claude-guardrail-ack.timer` and `journalctl -t claude-guardrail-ack`,
                then /var/lib/node-exporter-textfile/claude-guardrail-ack.prom.
  # SystemdUnitsFailed: every host counts a failed unit from minute 0. The 10m `for`
  # holds the page through the 9th minute, and each failed unit fires its own alert at the 10th:
  # daniel-box's two units, daniel-server's escaped unit, and one unnamed alert for daniel-pi,
  # which writes no per-unit series.
  - interval: 1m
    input_series:
      - series: 'up{instance="daniel-box", job="node", origin="daniel-box"}'
        values: '1x15'
      - series: 'up{instance="daniel-server", job="node", origin="daniel-server"}'
        values: '1x15'
      - series: 'up{instance="daniel-pi", job="node-pi", origin="daniel-pi"}'
        values: '1x15'
      - series: 'homelab_check_success{check="systemd-units", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '0x15'
      - series: 'homelab_check_last_run_timestamp_seconds{check="systemd-units", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '0+60x15'
      - series: 'homelab_check_success{check="systemd-units", instance="daniel-server", job="node", origin="daniel-server"}'
        values: '0x15'
      - series: 'homelab_check_last_run_timestamp_seconds{check="systemd-units", instance="daniel-server", job="node", origin="daniel-server"}'
        values: '0+60x15'
      - series: 'homelab_check_success{check="systemd-units", instance="daniel-pi", job="node-pi", origin="daniel-pi"}'
        values: '0x15'
      - series: 'homelab_check_last_run_timestamp_seconds{check="systemd-units", instance="daniel-pi", job="node-pi", origin="daniel-pi"}'
        values: '0+60x15'
      - series: 'homelab_systemd_unit_failed{check="systemd-units", instance="daniel-box", job="node", origin="daniel-box", unit="nut-monitor.service"}'
        values: '1x15'
      - series: 'homelab_systemd_unit_failed{check="systemd-units", instance="daniel-box", job="node", origin="daniel-box", unit="homelab-claude-pipeline-timeline.service"}'
        values: '1x15'
      - series: 'homelab_systemd_unit_failed{check="systemd-units", instance="daniel-server", job="node", origin="daniel-server", unit="systemd-fsck@dev-disk-by\\x2duuid-1.service"}'
        values: '1x15'
    alert_rule_test:
      - eval_time: 9m
        alertname: SystemdUnitsFailed
        exp_alerts: []
      - eval_time: 10m
        alertname: SystemdUnitsNotReporting
        exp_alerts: []
      - eval_time: 10m
        alertname: SystemdUnitsFailed
        exp_alerts:
          - exp_labels:
              check: systemd-units
              instance: daniel-box
              job: node
              origin: daniel-box
              severity: warning
              service: daniel-box
              unit: nut-monitor.service
            exp_annotations:
              summary: 'daniel-box: nut-monitor.service has failed.'
              description: >-
                Read `systemctl status <unit>` and `journalctl -u <unit> -b` on daniel-box, fix the
                cause, then run `systemctl reset-failed <unit>`; the next check resolves this alert.
                A summary that names no unit means the check named none, so run `systemctl --failed`
                on daniel-box.
              runbook_url: https://docs.local.daniel-hunter.com/alert-runbooks/#systemdunitsfailed
          - exp_labels:
              check: systemd-units
              instance: daniel-box
              job: node
              origin: daniel-box
              severity: warning
              service: daniel-box
              unit: homelab-claude-pipeline-timeline.service
            exp_annotations:
              summary: 'daniel-box: homelab-claude-pipeline-timeline.service has failed.'
              description: >-
                Read `systemctl status <unit>` and `journalctl -u <unit> -b` on daniel-box, fix the
                cause, then run `systemctl reset-failed <unit>`; the next check resolves this alert.
                A summary that names no unit means the check named none, so run `systemctl --failed`
                on daniel-box.
              runbook_url: https://docs.local.daniel-hunter.com/alert-runbooks/#systemdunitsfailed
          - exp_labels:
              check: systemd-units
              instance: daniel-server
              job: node
              origin: daniel-server
              severity: warning
              service: daniel-server
              unit: "systemd-fsck@dev-disk-by\\x2duuid-1.service"
            exp_annotations:
              summary: 'daniel-server: systemd-fsck@dev-disk-by\x2duuid-1.service has failed.'
              description: >-
                Read `systemctl status <unit>` and `journalctl -u <unit> -b` on daniel-server, fix
                the cause, then run `systemctl reset-failed <unit>`; the next check resolves this
                alert. A summary that names no unit means the check named none, so run `systemctl
                --failed` on daniel-server.
              runbook_url: https://docs.local.daniel-hunter.com/alert-runbooks/#systemdunitsfailed
          - exp_labels:
              check: systemd-units
              instance: daniel-pi
              job: node-pi
              origin: daniel-pi
              severity: warning
              service: daniel-pi
            exp_annotations:
              summary: 'daniel-pi: system units have failed that the check did not name.'
              description: >-
                Read `systemctl status <unit>` and `journalctl -u <unit> -b` on daniel-pi, fix the
                cause, then run `systemctl reset-failed <unit>`; the next check resolves this alert.
                A summary that names no unit means the check named none, so run `systemctl --failed`
                on daniel-pi.
              runbook_url: https://docs.local.daniel-hunter.com/alert-runbooks/#systemdunitsfailed
  # SystemdUnitsNotReporting's stale arm: a timestamp frozen at 0 crosses the 900s deadline
  # after the 15th minute, while the verdict stays green.
  - interval: 1m
    input_series:
      - series: 'up{instance="daniel-box", job="node", origin="daniel-box"}'
        values: '1x20'
      - series: 'homelab_check_success{check="systemd-units", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '1x20'
      - series: 'homelab_check_last_run_timestamp_seconds{check="systemd-units", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: SystemdUnitsNotReporting
        exp_alerts: []
      - eval_time: 16m
        alertname: SystemdUnitsFailed
        exp_alerts: []
      - eval_time: 16m
        alertname: SystemdUnitsNotReporting
        exp_alerts:
          - exp_labels:
              check: systemd-units
              instance: daniel-box
              job: node
              origin: daniel-box
              severity: warning
              service: daniel-box
            exp_annotations:
              summary: 'daniel-box: the failed-unit check has stopped reporting.'
              description: >-
                No systemd-units verdict newer than 900s reached Prometheus from daniel-box, so
                nothing is counting its failed units. Read `systemctl status
                homelab-systemd-units.timer` and `journalctl -t systemd-units` on daniel-box,
                then /var/lib/node-exporter-textfile/systemd-units.prom.
  # SystemdUnitsNotReporting's absent arm: daniel-box's file reports for 5 minutes and is gone,
  # so the arm fires once 900s pass with no sample. daniel-server never wrote one, as before its
  # package installs the timer, and its history guard keeps it quiet.
  - interval: 1m
    input_series:
      - series: 'up{instance="daniel-box", job="node", origin="daniel-box"}'
        values: '1x30'
      - series: 'up{instance="daniel-server", job="node", origin="daniel-server"}'
        values: '1x30'
      - series: 'up{instance="daniel-pi", job="node-pi", origin="daniel-pi"}'
        values: '1x30'
      - series: 'homelab_check_last_run_timestamp_seconds{check="systemd-units", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '0+60x5'
    alert_rule_test:
      - eval_time: 19m
        alertname: SystemdUnitsNotReporting
        exp_alerts: []
      - eval_time: 21m
        alertname: SystemdUnitsNotReporting
        exp_alerts:
          - exp_labels:
              check: systemd-units
              origin: daniel-box
              severity: warning
              service: daniel-box
            exp_annotations:
              summary: 'daniel-box: the failed-unit check has stopped reporting.'
              description: >-
                No systemd-units verdict newer than 900s reached Prometheus from daniel-box, so
                nothing is counting its failed units. Read `systemctl status
                homelab-systemd-units.timer` and `journalctl -t systemd-units` on daniel-box,
                then /var/lib/node-exporter-textfile/systemd-units.prom.

  # The dotfiles root mirror pairs: Failed fires on the 0 verdict, NotReporting holds at 1800s
  # and fires at 2400s past the 2100s deadline.
  - interval: 1m
    input_series:
      - series: 'homelab_check_success{check="claude-dotfiles-mirror", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '0x45'
      - series: 'homelab_check_last_run_timestamp_seconds{check="claude-dotfiles-mirror", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '0x45'
      - series: 'up{instance="daniel-box", job="node", origin="daniel-box"}'
        values: '1x45'
      - series: 'homelab_check_success{check="claude-dotfiles-mirror", instance="daniel-server", job="node", origin="daniel-server"}'
        values: '0x45'
      - series: 'homelab_check_last_run_timestamp_seconds{check="claude-dotfiles-mirror", instance="daniel-server", job="node", origin="daniel-server"}'
        values: '0x45'
      - series: 'up{instance="daniel-server", job="node", origin="daniel-server"}'
        values: '1x45'
    alert_rule_test:
      - eval_time: 10m
        alertname: ClaudeDotfilesMirrorFailed
        exp_alerts:
          - exp_labels:
              check: claude-dotfiles-mirror
              instance: daniel-box
              job: node
              origin: daniel-box
              severity: warning
              service: daniel-box
            exp_annotations:
              summary: 'daniel-box: the dotfiles root mirror refused a tag or could not fetch.'
              description: >-
                claude-dotfiles-mirror on daniel-box ended with status=down: it could not fetch
                the repo, or the newest tag is unsigned, signed by another key, or does not
                descend from the last verified tag. T2's config stays at the last verified tag.
                Run `journalctl -t claude-dotfiles-mirror` on daniel-box.
              runbook_url: https://docs.local.daniel-hunter.com/alert-runbooks/#claudedotfilesmirrorfailed
          - exp_labels:
              check: claude-dotfiles-mirror
              instance: daniel-server
              job: node
              origin: daniel-server
              severity: warning
              service: daniel-server
            exp_annotations:
              summary: 'daniel-server: the dotfiles root mirror refused a tag or could not fetch.'
              description: >-
                claude-dotfiles-mirror on daniel-server ended with status=down: it could not
                fetch the repo, or the newest tag is unsigned, signed by another key, or does
                not descend from the last verified tag. T2's config stays at the last verified
                tag. Run `journalctl -t claude-dotfiles-mirror` on daniel-server.
              runbook_url: https://docs.local.daniel-hunter.com/alert-runbooks/#claudedotfilesmirrorfailed
      - eval_time: 30m
        alertname: ClaudeDotfilesMirrorNotReporting
        exp_alerts: []
      - eval_time: 40m
        alertname: ClaudeDotfilesMirrorNotReporting
        exp_alerts:
          - exp_labels:
              check: claude-dotfiles-mirror
              instance: daniel-box
              job: node
              origin: daniel-box
              severity: warning
              service: daniel-box
            exp_annotations:
              summary: 'daniel-box: the dotfiles root mirror has stopped reporting.'
              description: >-
                No claude-dotfiles-mirror verdict newer than 35 minutes reached Prometheus from
                daniel-box, so no new dotfiles tag is being verified. Read `systemctl status
                homelab-claude-dotfiles-mirror.timer` and `journalctl -t
                claude-dotfiles-mirror`.
              runbook_url: https://docs.local.daniel-hunter.com/alert-runbooks/#claudedotfilesmirrornotreporting
          - exp_labels:
              check: claude-dotfiles-mirror
              instance: daniel-server
              job: node
              origin: daniel-server
              severity: warning
              service: daniel-server
            exp_annotations:
              summary: 'daniel-server: the dotfiles root mirror has stopped reporting.'
              description: >-
                No claude-dotfiles-mirror verdict newer than 35 minutes reached Prometheus from
                daniel-server, so no new dotfiles tag is being verified. Read `systemctl status
                homelab-claude-dotfiles-mirror.timer` and `journalctl -t
                claude-dotfiles-mirror`.
              runbook_url: https://docs.local.daniel-hunter.com/alert-runbooks/#claudedotfilesmirrornotreporting

  # The weekly summary pair: Failed fires on the 0 verdict, NotReporting holds at 169h, the
  # 608400s deadline, and fires an hour later. The 1h interval keeps every eval on a sample.
  - interval: 1h
    input_series:
      - series: 'homelab_check_success{check="claude-weekly-summary", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '0x200'
      - series: 'homelab_check_last_run_timestamp_seconds{check="claude-weekly-summary", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '0x200'
      - series: 'up{instance="daniel-box", job="node", origin="daniel-box"}'
        values: '1x200'
    alert_rule_test:
      - eval_time: 1h
        alertname: ClaudeWeeklySummaryFailed
        exp_alerts:
          - exp_labels:
              check: claude-weekly-summary
              instance: daniel-box
              job: node
              origin: daniel-box
              severity: warning
              service: daniel-box
            exp_annotations:
              summary: 'daniel-box: the weekly Claude runs summary did not post, or read a source.'
              description: >-
                claude-weekly-summary on daniel-box ended with status=down: the Discord post
                failed, or a source of run records could not be read. A failed post is retried by
                the next run. Run `journalctl -t claude-weekly-summary` on daniel-box.
      - eval_time: 169h
        alertname: ClaudeWeeklySummaryNotReporting
        exp_alerts: []
      - eval_time: 170h
        alertname: ClaudeWeeklySummaryNotReporting
        exp_alerts:
          - exp_labels:
              check: claude-weekly-summary
              instance: daniel-box
              job: node
              origin: daniel-box
              severity: warning
              service: daniel-box
            exp_annotations:
              summary: 'daniel-box: the weekly Claude runs summary has stopped reporting.'
              description: >-
                No claude-weekly-summary verdict newer than 169 hours from daniel-box, so last
                week's unattended runs were not summarised. Read `systemctl status
                homelab-claude-weekly-summary.timer` and `journalctl -t claude-weekly-summary`.
                If you disabled the timer on purpose, delete this rule.
              runbook_url: https://docs.local.daniel-hunter.com/alert-runbooks/#claudeweeklysummarynotreporting
  # KubeletShutdownLockMissing: the lock is missing from minute 0 and kubelet takes it at minute
  # 20. The 15m `for` holds the page through the 14th minute, and the next verdict of 1 resolves
  # it with no silence. The check keeps writing, so NotReporting stays quiet.
  - interval: 1m
    input_series:
      - series: 'up{instance="daniel-server", job="node", origin="daniel-server"}'
        values: '1x30'
      - series: 'homelab_check_success{check="kubelet-shutdown-lock", instance="daniel-server", job="node", origin="daniel-server"}'
        values: '0x20 1x10'
      - series: 'homelab_check_last_run_timestamp_seconds{check="kubelet-shutdown-lock", instance="daniel-server", job="node", origin="daniel-server"}'
        values: '0+60x30'
    alert_rule_test:
      - eval_time: 14m
        alertname: KubeletShutdownLockMissing
        exp_alerts: []
      - eval_time: 15m
        alertname: KubeletShutdownLockMissing
        exp_alerts:
          - exp_labels:
              check: kubelet-shutdown-lock
              instance: daniel-server
              job: node
              origin: daniel-server
              severity: warning
              service: daniel-server
            exp_annotations:
              summary: >-
                daniel-server: the kubelet holds no shutdown delay lock, so its next shutdown skips
                the pod drain.
              description: >-
                Without the lock, a shutdown stops pods undrained and can abort Longhorn's ext4
                journals. Read {job="k3s"} in loki-homelab for "Failed to start node shutdown
                manager" and the logind value it names, then restart k3s-agent.
              runbook_url: https://docs.local.daniel-hunter.com/alert-runbooks/#kubeletshutdownlockmissing
      - eval_time: 21m
        alertname: KubeletShutdownLockMissing
        exp_alerts: []
      - eval_time: 25m
        alertname: KubeletShutdownLockNotReporting
        exp_alerts: []
  # KubeletShutdownLockNotReporting: the check writes until minute 5 and then stops, so the
  # verdict is older than 900s from minute 21.
  - interval: 1m
    input_series:
      - series: 'up{instance="daniel-server", job="node", origin="daniel-server"}'
        values: '1x30'
      - series: 'homelab_check_last_run_timestamp_seconds{check="kubelet-shutdown-lock", instance="daniel-server", job="node", origin="daniel-server"}'
        values: '0+60x5 300x25'
    alert_rule_test:
      - eval_time: 20m
        alertname: KubeletShutdownLockNotReporting
        exp_alerts: []
      - eval_time: 21m
        alertname: KubeletShutdownLockNotReporting
        exp_alerts:
          - exp_labels:
              check: kubelet-shutdown-lock
              instance: daniel-server
              job: node
              origin: daniel-server
              severity: warning
              service: daniel-server
            exp_annotations:
              summary: 'daniel-server: the kubelet shutdown-lock check has stopped reporting.'
              description: >-
                No kubelet-shutdown-lock verdict newer than 900s reached Prometheus from
                daniel-server, so nothing reads kubelet's shutdown lock. Read `systemctl status
                homelab-kubelet-shutdown-lock.timer` and `journalctl -t kubelet-shutdown-lock`
                on daniel-server.
              runbook_url: https://docs.local.daniel-hunter.com/alert-runbooks/#kubeletshutdownlocknotreporting

  # checkout-sync on daniel-server refused (a dirty tree, say) from hour 3. CheckoutSyncFailed
  # fires for daniel-server alone, and daniel-box's green verdict keeps its copy quiet.
  - interval: 1h
    input_series:
      - series: 'homelab_check_success{check="checkout-sync", instance="daniel-server", job="node", origin="daniel-server"}'
        values: '1x3 0x3'
      - series: 'homelab_check_success{check="checkout-sync", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '1x6'
    alert_rule_test:
      - eval_time: 2h
        alertname: CheckoutSyncFailed
        exp_alerts: []
      - eval_time: 4h
        alertname: CheckoutSyncFailed
        exp_alerts:
          - exp_labels: {check: checkout-sync, instance: daniel-server, job: node, origin: daniel-server, severity: warning, service: daniel-server}
            exp_annotations:
              summary: 'daniel-server: the primary checkout sync is refusing to fast-forward.'
              description: >-
                homelab-checkout-sync on daniel-server refused its last run, so the primary
                checkout is not following master. The homelab_checkout_sync_refused metric names
                the reason; a dirty tree, an untracked file included, is the usual one. Read
                `journalctl -t homelab-checkout-sync` on daniel-server.
              runbook_url: https://docs.local.daniel-hunter.com/alert-runbooks/#checkoutsyncfailed

  # daniel-server's timestamp froze at 0 while daniel-box's stays fresh. The stale arm fires for
  # daniel-server once the timestamp is more than 7200s old, after hour 2.
  - interval: 1h
    input_series:
      - series: 'homelab_check_last_run_timestamp_seconds{check="checkout-sync", instance="daniel-server", job="node", origin="daniel-server"}'
        values: '0x4'
      - series: 'up{instance="daniel-server", job="node", origin="daniel-server"}'
        values: '1x4'
      - series: 'homelab_check_last_run_timestamp_seconds{check="checkout-sync", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '0+3600x4'
    alert_rule_test:
      - eval_time: 2h
        alertname: CheckoutSyncNotReporting
        exp_alerts: []
      - eval_time: 3h
        alertname: CheckoutSyncNotReporting
        exp_alerts:
          - exp_labels: {check: checkout-sync, instance: daniel-server, job: node, origin: daniel-server, severity: warning, service: daniel-server}
            exp_annotations:
              summary: 'daniel-server: the primary checkout sync has stopped reporting.'
              description: >-
                No checkout-sync verdict newer than 2 hours reached Prometheus from
                daniel-server, so nothing confirms the primary checkout follows master. A fetch
                that keeps failing or a git-tree lock held for hours writes no verdict. Read
                `journalctl -t homelab-checkout-sync` on daniel-server.
              runbook_url: https://docs.local.daniel-hunter.com/alert-runbooks/#checkoutsyncnotreporting

  # No checkout-sync series at all: the absent_over_time arm fires for every host whose package
  # lists the component.
  - interval: 1h
    input_series: []
    alert_rule_test:
      - eval_time: 3h
        alertname: CheckoutSyncNotReporting
        exp_alerts:
          - exp_labels: {check: checkout-sync, origin: daniel-box, severity: warning, service: daniel-box}
            exp_annotations:
              summary: 'daniel-box: the primary checkout sync has stopped reporting.'
              description: >-
                No checkout-sync verdict newer than 2 hours reached Prometheus from daniel-box,
                so nothing confirms the primary checkout follows master. A fetch that keeps
                failing or a git-tree lock held for hours writes no verdict. Read `journalctl -t
                homelab-checkout-sync` on daniel-box.
              runbook_url: https://docs.local.daniel-hunter.com/alert-runbooks/#checkoutsyncnotreporting
          - exp_labels: {check: checkout-sync, origin: daniel-server, severity: warning, service: daniel-server}
            exp_annotations:
              summary: 'daniel-server: the primary checkout sync has stopped reporting.'
              description: >-
                No checkout-sync verdict newer than 2 hours reached Prometheus from
                daniel-server, so nothing confirms the primary checkout follows master. A fetch
                that keeps failing or a git-tree lock held for hours writes no verdict. Read
                `journalctl -t homelab-checkout-sync` on daniel-server.
              runbook_url: https://docs.local.daniel-hunter.com/alert-runbooks/#checkoutsyncnotreporting
