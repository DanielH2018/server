# The HostUpdateStale rule for a one-host fixture map, {fixture-host: {job: node-fixture,
# limit_seconds: 11400}}. files/rules/host-checks.yaml carries one rule of this shape per entry
# of observability_expected_hosts, so host-checks.test.yaml loads this file beside it to give
# the rule its firing and silent cases. The host is one no
# inventory declares, so this rule never fires beside a shipped rule for a real host.
# tests/services/test_host_plane_rule_literals.py holds this file, and every shipped
# HostUpdateStale rule, equal to the rule it builds from a map entry. Never shipped: only
# observability_rule_groups' files reach Prometheus.
#
# The first arm reads a success timestamp past the limit. The second reads one that is absent
# while the host's exporter is up: a failed scrape marks every series of the target stale, and
# a dead exporter is not a stale host.
groups:
  - name: host-update-stale-fixture
    rules:
      - alert: HostUpdateStale
        expr: |
          (
              time() - homelab_host_update_success_timestamp_seconds{job="node-fixture",origin="fixture-host"} > 11400
            or
              (
                  absent(homelab_host_update_success_timestamp_seconds{job="node-fixture",origin="fixture-host"})
                and on (job, origin)
                  up{job="node-fixture",origin="fixture-host"} == 1
              )
          )
        labels:
          severity: critical
          service: fixture-host
        annotations:
          summary: fixture-host has had no successful homelab update for 3 hours 10 minutes.
          description: >-
            Read `systemctl status homelab-updater.timer` and `journalctl -u homelab-updater` on
            fixture-host. No homelab-updater run there has succeeded in 3 hours 10 minutes, or its
            exporter is up and serves no success timestamp. The runbook lists what leaves it stale.
          runbook_url: https://docs.local.daniel-hunter.com/host-packages/
