# promtool unit tests for files/rules/arr-apps.yaml. Run with
# `scripts/validate/alert_tools.sh promtool test rules <this file>`; the validate-alert-rules
# hook runs it on every commit that touches the rules.
#
# ProwlarrAppSyncFailing has the family's zero-series case, a scrape that serves no health
# family, a long-term application failure that keeps firing across a pod change and a
# recovering app, and a failure of every app. Three keep it silent: a healthy Prowlarr, a
# short-term application failure alone, and a failed scrape, which ScrapeTargetDown pages.
#
# ArrNotificationsFailing fires per app after its hour, across a pod change, and stays silent
# for a 30-minute failure that clears and for an app whose issues come from other checks.
rule_files:
  - ../../files/rules/arr-apps.yaml
evaluation_interval: 1m
tests:
  # The zero-series case: exportarr serves no Prowlarr health, so the sync cannot be judged.
  - interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 29m
        alertname: ProwlarrAppSyncFailing
        exp_alerts: []
      - eval_time: 30m
        alertname: ProwlarrAppSyncFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              service: prowlarr
              job: exportarr
              arr: prowlarr
            exp_annotations:
              summary: >-
                prowlarr: exportarr serves no Prowlarr health, so a failing app sync is unseen.
              description: >-
                Prowlarr has failed to push its indexers to an app for 6 hours, or exportarr
                serves no Prowlarr health. A 401 in Prowlarr's log means a stale key: paste the
                app's API key into Prowlarr's Settings, Apps, then click Sync App Indexers.

  # A healthy Prowlarr: the issues it carries are not application failures.
  - interval: 1m
    input_series:
      - series: 'up{job="exportarr", arr="prowlarr", instance="10.42.1.154:9707"}'
        values: '1x80'
      - series: 'prowlarr_system_health_issues{job="exportarr", arr="prowlarr", instance="10.42.1.154:9707", source="AllowedHostsCheck", type="warning", message="Allowed Hosts is not configured"}'
        values: '1x60'
      - series: 'prowlarr_system_health_issues{job="exportarr", arr="prowlarr", instance="10.42.1.154:9707", source="IndexerStatusCheck", type="warning", message="Indexers unavailable due to failures: YTS"}'
        values: '1x60'
    alert_rule_test:
      - eval_time: 60m
        alertname: ProwlarrAppSyncFailing
        exp_alerts: []

  # The short-term check alone stays quiet: every Sonarr or Radarr rollout trips it.
  - interval: 1m
    input_series:
      - series: 'up{job="exportarr", arr="prowlarr", instance="10.42.1.154:9707"}'
        values: '1x80'
      - series: 'prowlarr_system_health_issues{job="exportarr", arr="prowlarr", instance="10.42.1.154:9707", source="ApplicationStatusCheck", type="warning", message="Applications unavailable due to failures: Sonarr"}'
        values: '1x60'
    alert_rule_test:
      - eval_time: 60m
        alertname: ProwlarrAppSyncFailing
        exp_alerts: []

  # The long-term check fires after the hold and names the apps. The Prowlarr pod moves at 40m
  # and Radarr recovers at 50m, which changes `instance` and `message`; the alert keeps firing.
  - interval: 1m
    input_series:
      - series: 'up{job="exportarr", arr="prowlarr", instance="10.42.1.154:9707"}'
        values: '1x80'
      - series: 'prowlarr_system_health_issues{job="exportarr", arr="prowlarr", instance="10.42.1.104:9707", source="ApplicationLongTermStatusCheck", type="warning", message="Applications unavailable due to failures for more than 6 hours: Sonarr, Radarr"}'
        values: '1x40'
      - series: 'prowlarr_system_health_issues{job="exportarr", arr="prowlarr", instance="10.42.1.154:9707", source="ApplicationLongTermStatusCheck", type="warning", message="Applications unavailable due to failures for more than 6 hours: Sonarr, Radarr"}'
        values: '_x41 1x9'
      - series: 'prowlarr_system_health_issues{job="exportarr", arr="prowlarr", instance="10.42.1.154:9707", source="ApplicationLongTermStatusCheck", type="warning", message="Applications unavailable due to failures for more than 6 hours: Sonarr"}'
        values: '_x51 1x20'
    alert_rule_test:
      - eval_time: 29m
        alertname: ProwlarrAppSyncFailing
        exp_alerts: []
      - eval_time: 30m
        alertname: ProwlarrAppSyncFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              service: prowlarr
              source: ApplicationLongTermStatusCheck
            exp_annotations:
              summary: 'prowlarr: indexer sync has failed for 6 hours to Sonarr, Radarr.'
              description: >-
                Prowlarr has failed to push its indexers to an app for 6 hours, or exportarr
                serves no Prowlarr health. A 401 in Prowlarr's log means a stale key: paste the
                app's API key into Prowlarr's Settings, Apps, then click Sync App Indexers.
      - eval_time: 70m
        alertname: ProwlarrAppSyncFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              service: prowlarr
              source: ApplicationLongTermStatusCheck
            exp_annotations:
              summary: 'prowlarr: indexer sync has failed for 6 hours to Sonarr.'
              description: >-
                Prowlarr has failed to push its indexers to an app for 6 hours, or exportarr
                serves no Prowlarr health. A 401 in Prowlarr's log means a stale key: paste the
                app's API key into Prowlarr's Settings, Apps, then click Sync App Indexers.

  # Every app failing: Prowlarr's message carries no list, so the summary names every app.
  - interval: 1m
    input_series:
      - series: 'up{job="exportarr", arr="prowlarr", instance="10.42.1.154:9707"}'
        values: '1x40'
      - series: 'prowlarr_system_health_issues{job="exportarr", arr="prowlarr", instance="10.42.1.154:9707", source="ApplicationLongTermStatusCheck", type="warning", message="All applications are unavailable due to failures for more than 6 hours"}'
        values: '1x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: ProwlarrAppSyncFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              service: prowlarr
              source: ApplicationLongTermStatusCheck
            exp_annotations:
              summary: 'prowlarr: indexer sync has failed for 6 hours to every app.'
              description: >-
                Prowlarr has failed to push its indexers to an app for 6 hours, or exportarr
                serves no Prowlarr health. A 401 in Prowlarr's log means a stale key: paste the
                app's API key into Prowlarr's Settings, Apps, then click Sync App Indexers.

  # A scrape that succeeds and serves no health family: the check cannot be read.
  - interval: 1m
    input_series:
      - series: 'up{job="exportarr", arr="prowlarr", instance="10.42.1.154:9707"}'
        values: '1x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: ProwlarrAppSyncFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              service: prowlarr
              job: exportarr
              arr: prowlarr
            exp_annotations:
              summary: >-
                prowlarr: exportarr serves no Prowlarr health, so a failing app sync is unseen.
              description: >-
                Prowlarr has failed to push its indexers to an app for 6 hours, or exportarr
                serves no Prowlarr health. A 401 in Prowlarr's log means a stale key: paste the
                app's API key into Prowlarr's Settings, Apps, then click Sync App Indexers.

  # A failed scrape stays quiet here: ScrapeTargetDown pages it once.
  - interval: 1m
    input_series:
      - series: 'up{job="exportarr", arr="prowlarr", instance="10.42.1.154:9707"}'
        values: '0x60'
    alert_rule_test:
      - eval_time: 60m
        alertname: ProwlarrAppSyncFailing
        exp_alerts: []

  # A failing notification fires after the hour, per app. Prowlarr's pod moves at 40m, which
  # changes `instance`; the alert keeps firing. Sonarr's CustomScript warning fires on its own.
  - interval: 1m
    input_series:
      - series: 'prowlarr_system_health_issues{job="exportarr", arr="prowlarr", instance="10.42.1.104:9707", source="NotificationStatusCheck", type="error", message="All notifications are unavailable due to failures"}'
        values: '1x40'
      - series: 'prowlarr_system_health_issues{job="exportarr", arr="prowlarr", instance="10.42.1.154:9707", source="NotificationStatusCheck", type="error", message="All notifications are unavailable due to failures"}'
        values: '_x41 1x40'
      - series: 'sonarr_system_health_issues{job="exportarr", arr="sonarr", instance="10.42.0.31:9707", source="NotificationStatusCheck", type="warning", message="Notifications unavailable due to failures: Episode Trimmer"}'
        values: '1x80'
    alert_rule_test:
      - eval_time: 59m
        alertname: ArrNotificationsFailing
        exp_alerts: []
      - eval_time: 70m
        alertname: ArrNotificationsFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              service: prowlarr
            exp_annotations:
              summary: 'prowlarr: All notifications are unavailable due to failures.'
              description: >-
                A Connect notification in the app fails every send, so the app's own health
                notifications do not reach Discord. A Discord 404 in the app's log means the
                webhook was deleted: the seed Job writes arr_discord_webhook_url into each
                Discord (health) row on the next rollout. A missing CustomScript file needs its
                row fixed or removed in the app's Settings, Connect.
          - exp_labels:
              severity: warning
              service: sonarr
            exp_annotations:
              summary: 'sonarr: Notifications unavailable due to failures: Episode Trimmer.'
              description: >-
                A Connect notification in the app fails every send, so the app's own health
                notifications do not reach Discord. A Discord 404 in the app's log means the
                webhook was deleted: the seed Job writes arr_discord_webhook_url into each
                Discord (health) row on the next rollout. A missing CustomScript file needs its
                row fixed or removed in the app's Settings, Connect.

  # A 30-minute failure that clears, as during a Discord outage, stays quiet. So does an app
  # whose health issues come from other checks.
  - interval: 1m
    input_series:
      - series: 'radarr_system_health_issues{job="exportarr", arr="radarr", instance="10.42.0.35:9707", source="NotificationStatusCheck", type="error", message="All notifications are unavailable due to failures"}'
        values: '_x10 1x30 _x40'
      - series: 'prowlarr_system_health_issues{job="exportarr", arr="prowlarr", instance="10.42.1.154:9707", source="IndexerStatusCheck", type="warning", message="Indexers unavailable due to failures: YTS"}'
        values: '1x80'
    alert_rule_test:
      - eval_time: 80m
        alertname: ArrNotificationsFailing
        exp_alerts: []
