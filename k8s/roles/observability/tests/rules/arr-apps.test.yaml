# promtool unit tests for files/rules/arr-apps.yaml. Run with
# `scripts/validate/alert_tools.sh promtool test rules <this file>`; the validate-alert-rules
# hook runs it on every commit that touches the rules.
#
# ProwlarrAppSyncFailing has the family's zero-series case, a long-term application failure
# that fires it, one that keeps firing across a pod change and a recovering app, and two that
# keep it silent: a healthy Prowlarr, and a short-term application failure alone.
rule_files:
  - ../../files/rules/arr-apps.yaml
evaluation_interval: 1m
tests:
  # The zero-series case: exportarr serves no Prowlarr health, so the sync cannot be judged.
  - interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 29m
        alertname: ProwlarrAppSyncFailing
        exp_alerts: []
      - eval_time: 30m
        alertname: ProwlarrAppSyncFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              service: prowlarr
              job: exportarr
            exp_annotations:
              summary: >-
                prowlarr: exportarr serves no Prowlarr health, so a failing app sync is unseen.
              description: >-
                Prowlarr has failed to push its indexers to an app for 6 hours, or exportarr
                serves no Prowlarr health. A 401 in Prowlarr's log means a stale key: paste the
                app's API key into Prowlarr's Settings, Apps, then click Sync App Indexers.

  # A healthy Prowlarr: the issues it carries are not application failures.
  - interval: 1m
    input_series:
      - series: 'prowlarr_system_health_issues{job="exportarr", arr="prowlarr", instance="10.42.1.154:9707", source="AllowedHostsCheck", type="warning", message="Allowed Hosts is not configured"}'
        values: '1x60'
      - series: 'prowlarr_system_health_issues{job="exportarr", arr="prowlarr", instance="10.42.1.154:9707", source="IndexerStatusCheck", type="warning", message="Indexers unavailable due to failures: YTS"}'
        values: '1x60'
    alert_rule_test:
      - eval_time: 60m
        alertname: ProwlarrAppSyncFailing
        exp_alerts: []

  # The short-term check alone stays quiet: every Sonarr or Radarr rollout trips it.
  - interval: 1m
    input_series:
      - series: 'prowlarr_system_health_issues{job="exportarr", arr="prowlarr", instance="10.42.1.154:9707", source="ApplicationStatusCheck", type="warning", message="Applications unavailable due to failures: Sonarr"}'
        values: '1x60'
    alert_rule_test:
      - eval_time: 60m
        alertname: ProwlarrAppSyncFailing
        exp_alerts: []

  # The long-term check fires after the hold and names the apps. The Prowlarr pod moves at 40m
  # and Radarr recovers at 50m, which changes `instance` and `message`; the alert keeps firing.
  - interval: 1m
    input_series:
      - series: 'prowlarr_system_health_issues{job="exportarr", arr="prowlarr", instance="10.42.1.104:9707", source="ApplicationLongTermStatusCheck", type="warning", message="Applications unavailable due to failures for more than 6 hours: Sonarr, Radarr"}'
        values: '1x40'
      - series: 'prowlarr_system_health_issues{job="exportarr", arr="prowlarr", instance="10.42.1.154:9707", source="ApplicationLongTermStatusCheck", type="warning", message="Applications unavailable due to failures for more than 6 hours: Sonarr, Radarr"}'
        values: '_x41 1x9'
      - series: 'prowlarr_system_health_issues{job="exportarr", arr="prowlarr", instance="10.42.1.154:9707", source="ApplicationLongTermStatusCheck", type="warning", message="Applications unavailable due to failures for more than 6 hours: Sonarr"}'
        values: '_x51 1x20'
    alert_rule_test:
      - eval_time: 29m
        alertname: ProwlarrAppSyncFailing
        exp_alerts: []
      - eval_time: 30m
        alertname: ProwlarrAppSyncFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              service: prowlarr
              source: ApplicationLongTermStatusCheck
            exp_annotations:
              summary: 'prowlarr: indexer sync has failed for 6 hours to Sonarr, Radarr.'
              description: >-
                Prowlarr has failed to push its indexers to an app for 6 hours, or exportarr
                serves no Prowlarr health. A 401 in Prowlarr's log means a stale key: paste the
                app's API key into Prowlarr's Settings, Apps, then click Sync App Indexers.
      - eval_time: 70m
        alertname: ProwlarrAppSyncFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              service: prowlarr
              source: ApplicationLongTermStatusCheck
            exp_annotations:
              summary: 'prowlarr: indexer sync has failed for 6 hours to Sonarr.'
              description: >-
                Prowlarr has failed to push its indexers to an app for 6 hours, or exportarr
                serves no Prowlarr health. A 401 in Prowlarr's log means a stale key: paste the
                app's API key into Prowlarr's Settings, Apps, then click Sync App Indexers.
