---
# The stdlib is the whole dependency — the exporter reads sysfs and serves http.server — so the
# image is the same digest-pinned python:3.15-alpine monitor-bridge runs, rather than a second
# base image to track. Renovate's k8s-defaults manager bumps it by digest.
gpu_exporter_k8s_image: python:3.15-alpine@sha256:0f9552bb28711333da16915ec146f5e6bb44a7fdac9ced15dc17c2e0206346dd

# Renovate stance: whether an image bump here may automerge. `promote` deploys what merges.
# TRUE, for pihole-exporter's reason: this pod is read-only, holds no path any workload
# depends on, and drives dashboards alone. Losing it to a bad bump costs a GPU graph, and
# transcoding — which is what it measures — keeps working regardless.
k8s_autodeploy: true
k8s_autodeploy_reason: "read-only sysfs poller with a tcpSocket readinessProbe; no workload reads it, so a bad image bump costs the GPU dashboards rather than transcoding itself"

# Reading four small sysfs files per scrape. The floor here is the Python interpreter, not the
# work.
gpu_exporter_k8s_cpu_limit: "100m"
gpu_exporter_k8s_mem_limit: 64Mi
gpu_exporter_k8s_cpu_request: "10m"
gpu_exporter_k8s_mem_request: 24Mi

manifests_rollout: gpu-exporter

# No Service, though the entry carries a `port`: the `gpu` scrape job discovers each pod, and
# a ClusterIP over the two pods would flip one series between two GPUs (CLAUDE.md).
manifests_exclude_files: [service.yaml]
