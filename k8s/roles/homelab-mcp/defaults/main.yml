---
homelab_mcp_k8s_image: "{{ k8s_registry_pull_host }}/homelab-mcp:{{ k8s_built_image_tags.get('homelab-mcp', 'latest') }}"

# Renovate stance: whether an image bump here may automerge. `promote` deploys what merges.
# Stateless RollingUpdate Deployment, no PVC, readinessProbe. The image tag is a mutable
# :latest built in-cluster (imagePullPolicy: Always), not an upstream tag Renovate can bump
# blind — every rebuild is this repo's own image-builder run, not a vendor's release.
k8s_autodeploy: true
k8s_autodeploy_reason: "stateless RollingUpdate Deployment, no PVC, readinessProbe, in-cluster-built image under this repo's own control. NOTHING CAN TRIGGER AN AUTOMERGE: homelab_mcp_k8s_image is a registry-built <pull-host>/homelab-mcp ref, listed in REGISTRY_BUILT_IMAGES (scripts/tests/test_renovate_managers.py) — no upstream ref for Renovate to compare against and no version for it to offer. Only templates/Dockerfile.j2's FROM line moves, and every automerge rule in renovate.json is custom.regex-only, so that dockerfile-manager bump never automerges. The stance is correct and harmless, not active"

# Blast-radius caps.
homelab_mcp_k8s_cpu_limit: 500m
homelab_mcp_k8s_mem_limit: 256Mi
homelab_mcp_k8s_cpu_request: 50m
homelab_mcp_k8s_mem_request: 32Mi

# Each is a read-only hostPath mount from the pinned node's checkout; secrets/ stays out.
homelab_mcp_source_dirs:
  - k8s
  - estate
  - tests

image_builder_builds:
  - image_builder_name: homelab-mcp
    image_builder_dockerfile: "{{ role_file('templates/Dockerfile.j2') }}"
    # Raw files, not templates: app.py embeds PromQL whose {{...}} braces Jinja would eat.
    image_builder_context_files:
      "{{ role_file('files/app.py') }}": app.py
      "{{ role_file('files/safe_reads.py') }}": safe_reads.py
      "{{ role_file('files/k8s_reads.py') }}": k8s_reads.py
      # Outside this role: an edit moves the content tag, so promote rebuilds the image.
      "{{ repo_file('scripts/diagnostics/probe_lib/obs_api.py') }}": obs_api.py

manifests_rollout: homelab-mcp

render_secrets:
  - name: homelab-mcp-secrets
    string_data:
      HOMELAB_MCP_TOKEN: homelab_mcp_token
      HOMELAB_HA_TOKEN: claude_ha_token
