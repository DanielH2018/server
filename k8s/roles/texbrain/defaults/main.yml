---
# Built from DanielH2018/texbrain, a fork of swimmingbrain/texbrain that adds only a Dockerfile, an
# nginx config and a GHCR workflow, so merging upstream stays conflict-free. Upstream publishes
# no image, tags or releases, so pinning it directly would be a bare commit SHA with no update
# signal.
#
# The tag stays alongside the digest (repo:latest@sha256), as in bento_pdf_k8s_image: a bare
# repo@sha256 is invisible to Renovate's k8s image manager. The fork's CI pushes :latest on every
# merge to main, and Renovate opens the digest bump.
texbrain_k8s_image: ghcr.io/danielh2018/texbrain:latest@sha256:c97188d8b271fab5ab611c91bcfa18ba7b4e91f4fac5a484b1821d3f21f75f76

# Renovate stance: whether an image bump here may automerge. `promote` deploys what merges.
# Stateless: RollingUpdate Deployment, no PVC, readinessProbe on the only Deployment, and
# the image is digest-pinned rather than a mutable tag.
k8s_autodeploy: true
k8s_autodeploy_reason: "stateless RollingUpdate Deployment, no PVC, readinessProbe, digest-pinned image"

# The UID nginx-unprivileged runs as, and the fsGroup: emptyDir is root-owned 0755, so it EPERMs.
texbrain_k8s_uid: 101

# nginx gzips the 1.8 MB WebAssembly engine on a cold request; the limit covers that.
texbrain_k8s_cpu_limit: "500m"
texbrain_k8s_mem_limit: 256Mi
texbrain_k8s_cpu_request: "50m"
texbrain_k8s_mem_request: 32Mi
