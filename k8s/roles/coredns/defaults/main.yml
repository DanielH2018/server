---
# The templates are derived from k3s's manifests/coredns.yaml at k3s_version, with `%{...}%`
# written as k3s substitutes it.
# A k3s bump refreshes them by hand; hosts/tests/k3s/test_coredns_image_follows_bundled_manifest.py ties
# them to the version.

# The CoreDNS image k3s v1.37.2+k3s1 bundles, with `%{SYSTEM_DEFAULT_REGISTRY}%` replaced by the
# empty string as k3s stages it. The k3s addon does not reconcile it (the `.skip` marker), so
# this pin is the only thing that moves the image: a k3s bump changes k3s_version, the test's
# excerpt, this pin and any template change in one PR.
#
# Renovate must not bump it alone: the k8s image manager matches every `_image:` key in a k8s
# role's defaults, and renovate.json disables this one. The image is whatever k3s bundles.
#
# The digest is the tag's index digest, and a k3s bump moves it by hand with the tag
# (docs/k3s-upgrade.md). The test holds the pin to the digest it records for the excerpt's tag.
coredns_image: rancher/mirrored-coredns-coredns:1.14.7@sha256:7efd3c635b03efd68c4e8398fc45f0d993d0e9ab016f72c1cefb0fd6d01aa286

# `clusterIP` is immutable, so the render writes the address the cluster holds; it must sit inside
# k3s_service_cidr.
coredns_cluster_ip: 10.43.0.10

# Deliberately NOT the node's resolv.conf: forward's default `random` policy treats those resolvers
# as peers, so half of cluster queries would lose Pi-hole's ad-blocking and local records.
# The first entry is the pihole-dns Service's CLUSTER IP, not the LAN VIP: externalTrafficPolicy:
# Local blackholes VIP traffic.
# The node's cold-boot invariant does not apply: CoreDNS cannot run before the cluster does.
coredns_upstreams:
  - "{{ dns_k8s_cluster_ip }}"
  - 1.1.1.1
  - 1.0.0.1

# `policy sequential` alone makes every query wait out a dead Pi-hole; health_check and max_fails
# mark it down.
coredns_health_check: 5s
coredns_max_fails: 2

# DECIDED: never pruned. Under prune: true, a render that dropped the Deployment, the Service or
# the RBAC would make Flux delete it, and cluster DNS stops until something replaces it. Flux's
# own controllers resolve GHCR through this DNS, so Flux could not fetch the bundle that
# restores it. With prune: false a render that drops an object leaves it serving. The cost is
# that an object removed here stays live until the operator deletes it (**operator-only**).
# Full analysis: the H1 plan's *Plumbing tags are never pruned*.
flux_prune: false

# DECIDED: forward-only. A failed revision holds rather than resets `prod`, because a reset
# would re-fetch an older bundle through the DNS that just failed. Full analysis: the H1 plan's
# *Forward-only tags and the promote rule*.
flux_forward_only: true

# Flux applies the tag, so this gates no apply.
k8s_autodeploy: false
k8s_autodeploy_reason: "platform — cluster DNS for every pod and for Flux's own controllers; a bad Corefile or a pod that fails to start stops name resolution, and Flux resolves GHCR through the DNS it owns"

manifests_rollout: ''
