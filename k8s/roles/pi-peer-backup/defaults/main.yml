---
pi_peer_backup_k8s_image: "{{ k8s_registry_pull_host }}/pi-peer-backup:{{ k8s_built_image_tags.get('pi-peer-backup', 'latest') }}"

# Renovate stance: whether an image bump here may automerge. `promote` deploys what merges.
k8s_autodeploy: true
k8s_autodeploy_reason: "CronJob gated on every revision by a gate Job in pi-peer-backup-verify, which proves the new image RUNS and fails the revision on a run that exits non-zero; the gate Job has no ownerReference, so concurrencyPolicy Forbid cannot keep a scheduled run off it, but the rsync mirror is retention-free, so the extra run is idempotent. NOTHING CAN TRIGGER AN AUTOMERGE: the only pin, pi_peer_backup_k8s_image, is a registry-built image listed in REGISTRY_BUILT_IMAGES (scripts/tests/test_renovate_managers.py) — no upstream ref for Renovate to compare against and no version for it to offer — so what moves is the FROM in templates/Dockerfile.j2, and every automerge rule in renovate.json is custom.regex-only, so that dockerfile-manager bump never automerges. The stance is correct and harmless, not active."

pi_peer_backup_k8s_claim: pi-peer-backup-data
# Plain `longhorn`, not -nobackup: the Saturday B2 shard is this volume's reason to exist.
pi_peer_backup_k8s_storage_class: longhorn
# 128Mi, not 100Mi: Longhorn rejects sizes that are not a multiple of the 16Mi backup block size.
pi_peer_backup_k8s_size: 128Mi
# 23:00 local follows `tz`, so its UTC slot moves with DST; both clear the UTC Longhorn jobs.
# At 04:30 UTC the pod's attach makes weekly-backup-d6 skip this volume and still finish green.
# test_pi_peer_backup_schedule_clears_the_longhorn_slots.py holds the slot clear.
pi_peer_backup_k8s_schedule: "0 23 * * *"
# TTL is two schedule periods and must exceed one: `probe.py health` judges the newest Job.
pi_peer_backup_k8s_job_ttl_seconds: 172800

pi_peer_backup_k8s_verdict_configmap: pi-peer-backup-verdict

# The Pi account the job connects as, which holds the pull key's forced command.
pi_peer_backup_ssh_user: ubuntu

# Both PI_SRC and the key's forced command must name this path; the forced command refuses others.
pi_peer_backup_src_dir: "/home/{{ sys_user }}/server/containers/wg-easy/config/"

# No Flux placeholder can carry a multi-line private key, so it ships as a SOPS-encrypted manifest.
render_sops_manifests: [ssh-key-secret.yaml]

k8s_claims:
  - name: "{{ pi_peer_backup_k8s_claim }}"
    storage_class: "{{ pi_peer_backup_k8s_storage_class }}"
    size: "{{ pi_peer_backup_k8s_size }}"

flux_cronjob_gates:
  pi-peer-backup: {kind: verify}

image_builder_builds:
  - image_builder_name: pi-peer-backup
    image_builder_dockerfile: "{{ role_file('templates/Dockerfile.j2') }}"
    # Embedded verbatim (lookup('file')) — a shell script Jinja must not touch.
    image_builder_context_files:
      "{{ role_file('files/pull-pi-peers.sh') }}": pull-pi-peers.sh

manifests_rollout: ''
