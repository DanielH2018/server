---
# Vendored byte for byte; refresh with `uv run python scripts/dev/vendor_manifest.py longhorn`.
# A version bump is the upgrade: one minor per PR, refresh in the same PR, never automerged
# (docs/longhorn-upgrade.md).
# renovate: datasource=github-releases depName=longhorn/longhorn
k3s_longhorn_version: v1.13.0
longhorn_vendored_manifests:
  - name: longhorn.yaml
    url: "https://raw.githubusercontent.com/longhorn/longhorn/{{ k3s_longhorn_version }}/deploy/longhorn.yaml"
    fetched_url: "https://raw.githubusercontent.com/longhorn/longhorn/v1.13.0/deploy/longhorn.yaml"
    sha256: "d0f99488e7b2789312d45b0127ce7388df71a971e6fca2085e88635303cc0a1f"

# Request only: upstream's empty resources give BestEffort and oom_score_adj 1000, and a limit would
# add a cgroup-cap kill path.
# The patch holds the literal; tests/longhorn/test_longhorn_control_plane_resources.py holds the two
# equal.
k3s_longhorn_manager_memory_request: 256Mi

# Request only, for the manager's reasons above; a test holds the patch equal to this key.
k3s_longhorn_global_manager_memory_request: 64Mi

# Anti-affinity is only preferred, so a third replica adds no failover on two nodes; a test holds
# the patch equal to this key.
k3s_longhorn_global_manager_replicas: 2

# Memory REQUEST only (no limit) for the four csi-* sidecar Deployments (csi-attacher,
# csi-provisioner, csi-resizer, csi-snapshotter), applied through the
# `system-managed-csi-components-resource-limits` Setting (templates/settings.yaml.j2).
# longhorn-driver-deployer creates the Deployments at runtime with `resources: {}`, which gives
# BestEffort QoS and oom_score_adj 1000, the same exposure as the manager above. A csi-* sidecar
# held 97 MB anon-rss at an OOM kill, while the four run a p95 working set of 39-63Mi and a
# maximum of 65Mi. The request covers the OOM-kill reading rather than the p95, and changing it
# rolls the four Deployments once.
#
# DECIDED: the v1 instance-manager keeps no memory request, because Longhorn offers no way to set
# one. Its 7-day p95 working set is 1565Mi on daniel-box and 1272Mi on daniel-server, and the
# scheduler counts that memory as free. Each node's kubelet `system-reserved` memory covers that
# working set instead. longhorn-manager builds the pod
# from its InstanceManager CR, and the builder sets `resources` only from
# GetInstanceManagerCPURequirement (longhorn-manager v1.13.0,
# controller/instance_manager_controller.go). No Setting, annotation or CR field carries a memory
# value. `data-engine-memory-size` sizes v2 hugepages only. The Setting above covers the CSI
# components, not the instance-manager. A patch on the pod does not persist, because the manager
# owns the pod and recreates it. An admission mutation would persist, since the manager's drift
# check compares only CPU (controller/controller_manager.go:IsSameGuaranteedCPURequirement).
# It is rejected all the same. The pod is bound by `nodeName`, so the kubelet's admission is its
# only fit check, and a memory request adds a second dimension that check can refuse at boot.
# A fault in the mutator would also block the pod that serves every v1 engine on its node.
# Revisit when Longhorn adds an instance-manager memory setting.
#
# DECIDED: the Setting is the one writer. longhorn-manager's SettingController treats the Setting
# as the source of truth for these four containers' `resources` and clears any field it does not
# name, hourly. A second writer, such as a CronJob patching the request onto the Deployments, is
# cleared by the manager and rolls each Deployment about twice an hour. The driver deployer also
# reads the Setting when it creates a Deployment, so a recreated one starts with the request.
k3s_longhorn_csi_sidecar_memory_request: 96Mi

# Changing either rolls the plugin DaemonSet once; safe for RWX because the NFS mount lives in the
# host's mount namespace.
k3s_longhorn_csi_plugin_memory_request: 64Mi
k3s_longhorn_csi_node_sidecar_memory_request: 32Mi

# Each memory limit is at least 3x its peak, since an OOMKill restarts the container like an
# eviction; a test holds each patch equal to its key.
k3s_longhorn_ui_resources:
  requests: {cpu: 10m, memory: 16Mi}
  limits: {cpu: 200m, memory: 64Mi}
k3s_longhorn_driver_deployer_resources:
  requests: {cpu: 10m, memory: 32Mi}
  limits: {cpu: 200m, memory: 128Mi}
k3s_longhorn_driver_deployer_wait_resources:
  requests: {cpu: 10m, memory: 16Mi}
  limits: {cpu: 100m, memory: 32Mi}
k3s_longhorn_share_manager_pre_pull_resources:
  requests: {cpu: 5m, memory: 8Mi}
  limits: {cpu: 50m, memory: 32Mi}

# The engine-image DaemonSet (`engine-image-ei-<hash>`) has no key here, and its pods run
# BestEffort. longhorn-manager v1.13.0 builds it at runtime in
# controller/engine_image_controller.go:createEngineImageDaemonSetSpec with no `resources`, and
# no Longhorn Setting sets them.
#
# DECIDED: accept BestEffort for the engine-image pods (#8500). The render does not contain the
# DaemonSet, so a kustomize patch cannot reach it. A CronJob patch or a mutating webhook would be
# a second writer beside longhorn-manager, the conflict the csi-* Setting avoids. A
# LimitRange in `longhorn-system` would also give the instance-managers default limits, which can
# OOM-kill them. The exposure is low: each pod copies the `longhorn` binary onto the host and
# sleeps, with a 2-7Mi working set and a 30-day peak of 40Mi, and its DaemonSet recreates an
# evicted pod. Revisit this when upstream adds a Setting for engine-image resources; it then
# belongs in templates/settings.yaml.j2 like the csi-* request above.

# Two replicas, one per node: more than nodes would leave every volume degraded.
# Reaches volumes through the Setting only because the replaced StorageClass omits numberOfReplicas.
k3s_longhorn_replica_count: 2

# How hard Longhorn checks a snapshot disk file against its recorded checksum. Upstream's
# default is `fast-check`, which re-hashes only when the file is unhashed or its mtime moved —
# and upstream states plainly that "filesystem-unaware corruption cannot be detected" in that
# mode (longhorn-manager v1.12.1, types/setting.go). Bit rot does not move mtime, so the exact
# failure this setting exists to catch goes uncovered in that mode.
#
# `enabled` hashes every snapshot disk file on the snapshot-data-integrity-cronjob schedule
# (`0 0 */7 * *` here — the 1st, 8th, 15th, 22nd and 29th). That is CPU and disk-read work on a
# two-node cluster whose storage control plane was OOM-killed once under memory pressure
# (#1243), so the cost was measured before this was kept. DECIDED: keep `enabled`. MEASURED
# on a fire forced by overriding the schedule key below, 73 snapshots across 44 volumes (50 GB of
# replica data per node): the run took 6m21s and read ~24 GB per node at 40-57 MB/s. The hashing
# CPU is instance-manager's own, 0.21 → 0.37-0.50 cores over the window. instance-manager's
# working set did not move (1.44 GB before, during and after), MemAvailable never dropped below
# 17.5 GB, and no Longhorn pod restarted — the memory pressure the OOM kill warns about did not
# appear. Six minutes every seventh day at 00:00 UTC is acceptable.
k3s_longhorn_snapshot_data_integrity: enabled

# `0 0 */7 * *` is a day-of-month step (UTC): 1st, 8th, 15th, 22nd, 29th. To fire early, land a
# one-shot daily minute, then revert.
# Never use `*/N`: a stranded full-hash schedule risks OOM-killing the storage control plane.
k3s_longhorn_snapshot_data_integrity_cronjob: "0 0 */7 * *"

# true attaches a detached volume in maintenance mode for the backup; without it pi-peer-backup-data
# is silently skipped.
k3s_longhorn_backup_detached_volumes: "true"

# NEW VOLUMES ONLY: block size is immutable per volume, so PVCs created at 2 stay at 2 until
# recreated. Accepts 2 or 16.
# Governed by the Setting, not the StorageClass: a StorageClass parameter beats the setting and is
# immutable.
k3s_longhorn_backup_block_size: 16

# Upstream's 0 means engines never follow the manager; 3 upgrades healthy volumes a few at a time,
# and Longhorn skips degraded ones.
k3s_longhorn_concurrent_engine_upgrade: 3

# What Longhorn does with a pod whose node goes down while the pod holds an RWO volume.
# `do-nothing` is upstream's default: the pod stays Terminating, so its volume stays attached
# to the dead node, until an operator force-deletes it. The rejected values
# (`delete-statefulset-pod`, `delete-deployment-pod`,
# `delete-both-statefulset-and-deployment-pod`) have Longhorn force-delete the pod and move the
# volume to the survivor unattended.
# DECIDED: `do-nothing` — keep the stateful failover a human step on this two-node cluster.
# There is no fencing and no third node, so Longhorn cannot tell a dead daniel-server from one
# cut off from daniel-box: an automatic delete on a partition would run a second copy of the
# workload against the other replica. The survivor also lacks the memory for the lost node's
# whole load until the shed set is scaled to zero (docs/break-glass.md, *daniel-server is
# dead*), and that step is manual too. Stateless pods still reschedule on their own. Revisit
# when a third node or a fencing mechanism exists.
k3s_longhorn_node_down_pod_deletion_policy: do-nothing

# Literal because the renderer reads a role's Flux timeout from `manifests_rollout_timeout`. A
# timeout on a forward-only tag writes DEPLOY_HOLD, so 10m covers a cold-pull version bump across
# two sequential pods plus driver-deployer, ui and global-manager (`wait: true`).
manifests_rollout_timeout: 10m

# DECIDED: never pruned. Under prune: true, a render that dropped the manager DaemonSet or a CRD
# would make Flux delete it, and deleting a Longhorn CRD deletes every Volume, Engine and Replica
# CR of its kind: every PVC detaches at once. With prune: false a render that drops an object
# leaves it serving. The cost is that an object removed here, or retired by a later upstream
# release, stays live until the operator deletes it (**operator-only**). Full analysis: the H1
# plan's *Plumbing tags are never pruned*.
flux_prune: false

# Longhorn supports no downgrade, so a failed promote on this tag holds without resetting `prod`;
# forward_only.py reads the flag from a top-level line.
flux_forward_only: true

k8s_autodeploy: false
k8s_autodeploy_reason: "platform — Longhorn holds every PVC; a bad apply or a version skip detaches or corrupts the volumes under every stateful service, and host probes stay green through that outage"

manifests_rollout: ''
