---
# Requests and limits from defaults/main.yml; a kustomize patch cannot read a variable, so
# tests/longhorn/test_longhorn_control_plane_resources.py holds them equal.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: longhorn-ui
  namespace: longhorn-system
spec:
  template:
    spec:
      containers:
        - name: longhorn-ui
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 64Mi
