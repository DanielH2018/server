---
# A separate file because longhorn-manager.yaml names only the manager container, which stays
# request-only; tests/longhorn/test_longhorn_control_plane_resources.py holds the values equal.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: longhorn-manager
  namespace: longhorn-system
spec:
  template:
    spec:
      containers:
        - name: pre-pull-share-manager-image
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 50m
              memory: 32Mi
