---
# Memory request and two replicas from defaults/main.yml; a kustomize patch cannot read a variable,
# so tests/longhorn/test_longhorn_control_plane_resources.py holds them equal.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: longhorn-global-manager
  namespace: longhorn-system
spec:
  replicas: 2
  template:
    spec:
      containers:
        - name: longhorn-global-manager
          resources:
            requests:
              memory: 64Mi
