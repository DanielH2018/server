---
# Memory request only, so the pod leaves BestEffort (oom_score_adj 1000) without a limit-based OOM
# kill path.
# The value is in defaults/main.yml; tests/longhorn/test_longhorn_control_plane_resources.py holds
# the two equal.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: longhorn-manager
  namespace: longhorn-system
spec:
  template:
    spec:
      containers:
        - name: longhorn-manager
          resources:
            requests:
              memory: 256Mi
