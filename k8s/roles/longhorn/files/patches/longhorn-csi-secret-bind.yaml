---
# Drops upstream's cluster-wide Secret `get` binding, safe because no class carries a
# `csi.storage.k8s.io/*-secret-*` parameter and no volume is encrypted.
# A class that adds one needs this file and longhorn-csi-secret-role.yaml removed first
# (tests/longhorn/test_longhorn_csi_secret_grant.py).
# The tag renders `prune: false`, so the live copy stays until the operator deletes it.
$patch: delete
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: longhorn-csi-secret-bind
