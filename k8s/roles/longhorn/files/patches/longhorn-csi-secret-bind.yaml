---
# Drops upstream's binding that gives longhorn-csi-service-account cluster-wide `get` on every
# Secret (#5969). Longhorn v1.13.0 ships it as a compatibility default for StorageClasses that
# carry a `csi.storage.k8s.io/*-secret-*` parameter, and documents deleting it for a manifest
# install: https://longhorn.io/docs/1.13.0/important-notes/#optional-restriction-of-csi-controller-secret-access
# Neither class here carries such a parameter (longhorn-storageclass.yaml,
# templates/storageclass-nobackup.yaml.j2), the cluster has no VolumeSnapshotClass, and no
# volume is encrypted. A class that adds one needs this file and longhorn-csi-secret-role.yaml
# removed first. ansible/tests/longhorn/test_longhorn_csi_secret_grant.py holds both deletions.
# The tag renders `prune: false`, so dropping the object here leaves the live copy in place
# until the operator deletes it.
$patch: delete
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: longhorn-csi-secret-bind
