---
# Stable stream only: Lidarr cannot go back from nightly or plugins without restoring its database.
lidarr_k8s_image: lscr.io/linuxserver/lidarr:3.1.6.5079-ls50@sha256:c4285344c994b34e1ae7db8d57c1702dcfe88b8e10c98a0cdf0f74aba8b58b9c

# Renovate stance: whether an image bump here may automerge. `promote` deploys what merges.
# Flux's lidarr-snapshot Job snapshots the claim below before each revision applies, so a bad
# swap that migrates lidarr.db can be reverted (docs/volume-snapshot-drills.md).
k8s_autodeploy: true
k8s_autodeploy_reason: "migrating state — Recreate + RWO PVC, protected by the lidarr-snapshot Job before each revision and an operator revert to it after a failed one; -lsNN versioning still hides a breaking bump. WEIGHED: lidarr also mounts media-data (shared, not reverted); a revert rewinds import history while the files stay, recoverable by a library rescan"
k8s_autodeploy_snapshot_pvcs: [lidarr-config]
k8s_autodeploy_unreverted_claims: [media-data]

manifests_rollout_timeout: 660s
lidarr_k8s_rollout_timeout: "{{ manifests_rollout_timeout }}"

# lidarr.db holds the library and the absolute root-folder path, /data/media/music.
lidarr_k8s_claim: lidarr-config
lidarr_k8s_storage_class: longhorn
lidarr_k8s_size: 2Gi

# Whole data tree: hardlinks from /data/torrents need one mount spanning both.
lidarr_k8s_media_claim: media-data

# No Docker mods.
lidarr_k8s_docker_mods: ""

lidarr_k8s_cpu_limit: "1"
lidarr_k8s_mem_limit: 1024Mi
lidarr_k8s_cpu_request: "100m"
lidarr_k8s_mem_request: 128Mi

lidarr_k8s_log_level: info
lidarr_k8s_log_rotate: "10"

lidarr_k8s_exportarr_image: ghcr.io/onedr0p/exportarr:v2.3.0@sha256:af535d94061cf97a52e1661945ffba78c03f9443eae7c0da1a80a5a4be56b520

# The image's s6 init drops to PUID 1000 (lsio_env).
lidarr_k8s_uid: 1000

# The quality profiles the seed Job in templates/verify/quality-profiles.yaml.j2 declares, named
# by Lidarr's own quality names. The seed adopts a live profile of the same name and never
# deletes one. `Standard` and `Lossless` are profiles Lidarr ships, so they are updated in place.
#
# DECIDED: the operator's ruling on #8190 (2026-11-12). The lossy profile allows MP3 320, MP3 VBR
# V0, AAC 256 and above, and Opus 192 and above, with cutoff MP3 320. Lidarr 3.1.6.5079 has no
# Opus quality, so the profile drops the Opus tier rather than stand in OGG Vorbis for it, and
# no Vorbis tier is allowed. AAC-VBR is the AAC tier above AAC-256. The
# lossless profile allows 16-bit FLAC only, so `FLAC 24bit`, ALAC and the rest stay unallowed.
# `Standard` sets upgradeAllowed true, because its cutoff does nothing without it, and
# `Lossless` sets it false, because it allows one quality.
lidarr_quality_profiles:
  - name: Standard
    upgrade_allowed: true
    cutoff: MP3-320
    allowed:
      - MP3-VBR-V0
      - MP3-320
      - AAC-256
      - AAC-320
      - AAC-VBR
  - name: Lossless
    upgrade_allowed: false
    cutoff: FLAC
    allowed:
      - FLAC

# ── the stall sweep (templates/stall-sweep-cronjob.yaml.j2) ─────────────────────────────────
# The same python:3.15-alpine digest flux_job_image pins; Renovate moves both in one PR.
lidarr_k8s_stall_sweep_image: python:3.15-alpine@sha256:0f9552bb28711333da16915ec146f5e6bb44a7fdac9ced15dc17c2e0206346dd
# Hourly. A dead torrent blocks no queue slot, so a late removal costs only time.
lidarr_k8s_stall_sweep_schedule: "41 * * * *"
# TTL: one period plus the 300s deadline and a margin, so the newest run is always visible.
lidarr_k8s_stall_sweep_job_ttl_seconds: 4200
# false reports what the sweep would remove and removes nothing; true removes.
lidarr_k8s_stall_sweep_armed: true
# The renderer copies the sweep's jobTemplate into `lidarr-verify` as
# `lidarr-stall-sweep-deploy-gate-<spec digest8>`, a real run once per revision. A second run
# finds nothing more to remove, so the gate is a post-apply mutation.
flux_cronjob_gates:
  lidarr-stall-sweep:
    kind: mutation
    rerun_safe: k8s/roles/lidarr/tests/test_sweep_lidarr_stalls.py::test_a_second_run_removes_nothing
# The sweep's gate reads qBittorrent, so verify waits on its rolled pod.
flux_verify_after:
  - qbittorrent

k8s_claims:
  - name: "{{ lidarr_k8s_claim }}"
    storage_class: "{{ lidarr_k8s_storage_class }}"
    size: "{{ lidarr_k8s_size }}"

render_secrets:
  # lidarr's API key. lidarr adopts it through LIDARR__AUTH__APIKEY, and the exportarr
  # sidecar authenticates with it.
  - name: lidarr-exportarr
    string_data:
      api_key: lidarr_api_key
  # qBittorrent's WebUI API key, which the stall sweep reads torrents with.
  - name: lidarr-stall-sweep
    string_data:
      qbt_api_key: qbittorrent_api_key
