---
sonarr_k8s_image: lscr.io/linuxserver/sonarr:develop-5.0.0.3041-ls212@sha256:c8c4a3dcb49e1bd3ee19cf33e128837fdd6615e7a6b69cf02326133e193e4c29

# Renovate stance: whether an image bump here may automerge. `promote` deploys what merges.
# The Sonarr image itself takes no automerge: renovate.json has a rule for the v5 beta channel.
# Migrating state — strategy is Recreate and the config volume comes from
# k8s_claims below (hardcoded ReadWriteOnce), so a bad image swap can migrate the library
# database + root-folder paths before the gate observes a fault, then fail the rollback
# redeploy against data it can no longer read. The linuxserver -lsNN scheme hides a breaking
# bump as a routine patch bump.
# Flux's sonarr-snapshot Job snapshots the claim below before each revision applies. A failed
# revision that changes sonarr writes the stateful hold without a reset, and the operator
# reverts the claim through docs/volume-snapshot-drills.md, so a bad swap can be
# reverted instead of leaving the library database and root-folder paths unreadable by the old
# image.
k8s_autodeploy: true
k8s_autodeploy_reason: "migrating state — Recreate + RWO PVC, protected by the sonarr-snapshot Job before each revision and an operator revert to it after a failed one; -lsNN versioning still hides a breaking bump. WEIGHED: sonarr also mounts media-data (shared RWX, not reverted); a revert rewinds import/rename history while the files stay where they were left, so it desyncs into duplicate-import attempts or a missed-file state, recoverable by a library rescan"
k8s_autodeploy_snapshot_pvcs: [sonarr-config]
# Claims this role MOUNTS but does not revert — the WEIGHED clause in the reason above, stated
# where a test can read it. media-data is rendered by k8s/media-volume, so no guard that reads
# what this role creates can see the coupling.
k8s_autodeploy_unreverted_claims: [media-data]

# Read as Flux's health-check timeout and by progressDeadlineSeconds, so the two cannot drift.
# A literal `manifests_rollout_timeout`: the renderer reads a Flux timeout only from a literal role
# default.
manifests_rollout_timeout: 660s
sonarr_k8s_rollout_timeout: "{{ manifests_rollout_timeout }}"

# ── the config database ─────────────────────────────────────────────────────────────────────
# 85 M / 221 files. `longhorn`, not longhorn-nobackup: sonarr.db holds the library and the
# absolute root-folder paths — it is exactly the state worth snapshotting.
sonarr_k8s_claim: sonarr-config
# longhorn: backed up; excluding it would leave one frozen restore point.
sonarr_k8s_storage_class: longhorn
sonarr_k8s_size: 2Gi

# Mounted at /data: sonarr stores absolute paths, so a mismatch fails only at import.
sonarr_k8s_media_claim: media-data

sonarr_k8s_docker_mods: linuxserver/mods:radarr-striptracks

sonarr_k8s_cpu_limit: "1"
sonarr_k8s_mem_limit: 1024Mi
sonarr_k8s_cpu_request: "100m"
sonarr_k8s_mem_request: 128Mi

# Upstream's debug and Rotate 50 churn the logs dir, which inflates Longhorn backups; this cuts it.
sonarr_k8s_log_level: info
sonarr_k8s_log_rotate: "10"

# The exportarr metrics sidecar (templates/exportarr.yml.j2). Pinned HERE, in the role's own
# defaults, rather than once in group_vars: Renovate's k8s-images manager matches
# `k8s/roles/*/defaults` and `_image:` keys only, so a shared var one directory up is invisible
# to it and to the coverage test — the escape `crowdsec_k8s_image` made from group_vars.
# radarr and prowlarr carry the same pin for the same reason, and
# tests/services/scraping/test_exportarr_sidecars.py::test_the_image_pins_stay_in_lockstep
# fails if the three drift apart.
sonarr_k8s_exportarr_image: ghcr.io/onedr0p/exportarr:v2.3.0@sha256:af535d94061cf97a52e1661945ffba78c03f9443eae7c0da1a80a5a4be56b520

k8s_claims:
  - name: "{{ sonarr_k8s_claim }}"
    storage_class: "{{ sonarr_k8s_storage_class }}"
    size: "{{ sonarr_k8s_size }}"

# ── the air-date guard (templates/air-date-guard-cronjob.yaml.j2) ───────────────────────────
# Removes and blocklists a queued grab whose release was published before its episode aired,
# the rule Sonarr v5 carries as a Release Profile's air-date restriction, applied after the
# grab. files/sonarr_air_date_guard.py holds the rule and what it leaves alone. Retire it once
# a Release Profile carries the rule.
sonarr_k8s_air_date_guard_image: python:3.15-alpine@sha256:0f9552bb28711333da16915ec146f5e6bb44a7fdac9ced15dc17c2e0206346dd
# Every 5 minutes, matching monitor-bridge's queue-warning cycle, so a fake goes before it pages.
sonarr_k8s_air_date_guard_schedule: "*/5 * * * *"
sonarr_k8s_air_date_guard_deadline_seconds: 240
# How long a finished sonarr-air-date-guard Job, and so its pod, stays visible. A run the weekly reboot
# interrupts fails, and without a TTL it reads Failed until three later runs fail.
# 30 minutes clears it inside the hour after boot
# (tests/k8s/flux/test_reboot_window_cronjobs_age_out.py); the run's output is in Loki past that.
sonarr_k8s_air_date_guard_job_ttl_seconds: 1800
# v5's grace period of -1 day. Backtested over this library's history from
# 2023-04: for standard series it would have removed 13 of the 16 grabs marked failed by hand,
# and 1 of the releases Sonarr imported (a Rick and Morty episode published 4 days before
# air). At 3h it removes all 16 and 5 imported ones, all Netflix or Disney+ drops whose TVDB
# air date is a later broadcast.
sonarr_k8s_air_date_guard_grace_hours: 24
# TVDB air dates for anime are off by up to a week, so the rule removes real releases.
sonarr_k8s_air_date_guard_skip_series_types: [anime]
# A Sonarr series tag that exempts a show whose real releases come out early.
sonarr_k8s_air_date_guard_exempt_tag: allow-early
# More removals than this in one run means the dates are wrong, not that fakes arrived.
sonarr_k8s_air_date_guard_max_removals: 5
# False makes every run, the deploy gate's included, a dry-run report.
sonarr_k8s_air_date_guard_apply: true

flux_cronjob_gates:
  sonarr-air-date-guard:
    kind: mutation
    rerun_safe: k8s/roles/sonarr/tests/test_sonarr_air_date_guard.py::test_a_second_run_removes_nothing

# Named by fake-remux's config in hosts/components/fake-remux/defaults/main.yml; change both.
sonarr_k8s_cluster_ip: 10.43.114.186

render_secrets:
  # Sonarr's own API key: sonarr offers no scoped read-only key.
  - name: sonarr-exportarr
    string_data:
      api_key: sonarr_api_key
