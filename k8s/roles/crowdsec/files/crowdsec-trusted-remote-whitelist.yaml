name: local/trusted-remote-whitelist
description: "Whitelist trusted remote clients (pinned VPN exits)"
# Exempts the operator's browsing through a pinned VPN exit: shared datacenter IPs trip http-probing
# and 403-bf and self-ban.
# Trade-off: this also exempts anyone else exiting through the same IP, so keep entries /32 and
# never widen to a provider range.
# Exit IPs rotate: add the new one and redeploy traefik.
whitelist:
  reason: "Trusted remote — operator's pinned VPN exit(s)"
  ip:
    - "87.249.134.18" # Mullvad multihop exit
    - "68.235.46.141" # VPN exit (TZULO, AS11878)
