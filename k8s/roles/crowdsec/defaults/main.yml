---
# Log-parsing agents live next to the logs: sidecars in the traefik and authelia pods, and the
# node-agent DaemonSet.

# crowdsec_k8s_image / crowdsec_k8s_sidecar_agents / crowdsec_k8s_lapi_port /
# crowdsec_k8s_appsec_port live in k8s/vars.yml — the app pods' sidecars and traefik's
# bouncer middleware consume them too, and role defaults are invisible across roles.

# Renovate stance: whether an image bump here may automerge. `promote` deploys what merges.
# Platform: the in-cluster LAPI + AppSec + decision engine every bouncer (including traefik's
# middleware) queries. A failed deploy could open or close traffic unpredictably fleet-wide.
# Also Recreate + PVC (the decision DB) on its own state, which compounds the risk but isn't
# the primary reason. crowdsec_k8s_image itself lives in k8s/vars.yml (shared with the
# traefik sidecar and bouncer middleware), not here — this declaration covers the role, and
# renovate.json's `manual — k8s_autodeploy: false` rule names k8s/vars.yml beside this
# file so the pin's bump opens without automerge like any denied role's.
k8s_autodeploy: false
k8s_autodeploy_reason: "platform — LAPI/AppSec/decision engine every bouncer queries; a failed deploy can open or close traffic unpredictably fleet-wide. COUPLING NOTE for a future promotion: crowdsec-db also holds LAPI machine registrations; a revert past an agent registration leaves that agent's stored password valid but the machine unknown"

# Decision DB + hub state. Small: decisions are rows, the hub is megabytes.
crowdsec_k8s_claim: crowdsec-db
crowdsec_k8s_storage_class: longhorn
crowdsec_k8s_size: 1Gi

# The claim the renderer emits for this role, which the crowdsec Kustomization applies.
k8s_claims:
  - name: "{{ crowdsec_k8s_claim }}"
    storage_class: "{{ crowdsec_k8s_storage_class }}"
    size: "{{ crowdsec_k8s_size }}"

# Includes the two transitive deps `cscli hub upgrade` never installs, and two AppSec starter
# collections (NOT the full OWASP CRS).
crowdsec_k8s_collections: >-
  crowdsecurity/linux crowdsecurity/traefik LePresidente/authelia crowdsecurity/http-cve
  crowdsecurity/whitelist-good-actors crowdsecurity/appsec-virtual-patching
  crowdsecurity/appsec-generic-rules

# The engine pod's in-pod agent registers under this name; the sidecar machines are registered by
# the lapi-register initContainer.
crowdsec_k8s_engine_machine: engine-local

crowdsec_k8s_cpu_limit: "1"
crowdsec_k8s_mem_limit: 512Mi
crowdsec_k8s_cpu_request: 100m
crowdsec_k8s_mem_request: 128Mi

# Machine names must match the DaemonSet's AGENT_USERNAME pattern k8s-node-agent-<nodeName>; add a
# line when a node joins.
crowdsec_k8s_node_agent_machines:
  - k8s-node-agent-daniel-box
  - k8s-node-agent-daniel-server
crowdsec_k8s_node_agent_collections: "crowdsecurity/linux crowdsecurity/whitelist-good-actors"

# One initContainer copies the statically linked `cscli` out of crowdsec_k8s_image and another
# copies kubectl out of alpine/k8s;
# the same digests as configarr's health reader.
crowdsec_k8s_jobs_image: python:3.15-alpine@sha256:0f9552bb28711333da16915ec146f5e6bb44a7fdac9ced15dc17c2e0206346dd
crowdsec_k8s_jobs_kubectl_image: alpine/k8s:1.37.2@sha256:7a82aeefea3d554a43a8676b137f2b88bae6c1fe11c13862b191b3a086cc28c0

# The budget of the crowdsec-prepull Kustomization, whose Job pulls the engine pod's three images
# onto k8s_primary_node before the crowdsec Kustomization applies
# (scripts/renderer/renderer_lib/prepull.py). The Deployment is `Recreate`, so without it the
# LAPI is down for the whole pull. The pinned amd64 images are alpine/k8s's 320.8 MB,
# crowdsec_k8s_image's 169.3 MB and python's 20.4 MB, 510.5 MB in all, every one from Docker
# Hub. 600s covers the set down to 0.85 MB/s. The Job has no deadline, so a pull
# slower still costs that revision its verdict, the Job keeps pulling, and Flux applies crowdsec
# on a later retry. Only Flux reads it: the renderer adds the Kustomization for a published tag
# alone, so an Ansible deploy ignores it.
flux_prepull_timeout: 600s

# Sized from peak RSS (python 12 MB, cscli 61-63 MB, kubectl 136 MB): the allowlist and AppSec
# verify overlap at minutes 0/15/30/45, about 250 MB, and the limit doubles it because an OOM kill
# takes the whole pod out of Ready.
# Read the peak with
# `probe.py metric 'container_memory_working_set_bytes{container="crowdsec-jobs"}'`.
crowdsec_k8s_jobs_cpu_limit: "500m"
crowdsec_k8s_jobs_mem_limit: 512Mi
crowdsec_k8s_jobs_cpu_request: "10m"
crowdsec_k8s_jobs_mem_request: 144Mi

# The /64 is visible only on daniel-box's host network, so the crowdsec-home-ips CronJob runs there
# and writes both halves to the ConfigMap; the crowdsec-jobs sidecar syncs the allowlist from it.
crowdsec_k8s_home_ips_period_minutes: 5
crowdsec_k8s_home_ips_configmap: crowdsec-home-ips
# Below the period so a hung run ends before the next slot, and below the `crowdsec-verify`
# timeout. A run takes at most 150s.
crowdsec_k8s_home_ips_deadline_seconds: 240
# How long a finished crowdsec-home-ips Job, and so its pod, stays visible. A run the weekly reboot
# interrupts fails, and without a TTL it reads Failed until two later runs fail.
# 30 minutes clears it inside the hour after boot
# (tests/k8s/flux/test_reboot_window_cronjobs_age_out.py); the run's output is in Loki past that.
crowdsec_k8s_home_ips_job_ttl_seconds: 1800
# The Job keeps no ownerReference to the CronJob, so `concurrencyPolicy: Forbid` does not keep a
# scheduled firing off a gate run;
# an overlap patches the ConfigMap twice with one lookup's values.
flux_cronjob_gates:
  crowdsec-home-ips:
    kind: mutation
    rerun_safe: k8s/roles/crowdsec/tests/test_home_ips_discover.py::test_a_second_run_patches_the_same_values
# The ban proof reads the edge's answer and traefik depends on crowdsec: without waiting on the
# edge, the Job races traefik's `Recreate` roll and can pass against the old pod. Only Flux reads it
# (`RoleDefaults.verify_after`).
flux_verify_after:
  - traefik
# Three CronJob periods: the allowlist pushes down once the lookup time is older, so a dead
# discovery pages.
crowdsec_k8s_home_ips_stale_after_seconds: "{{ crowdsec_k8s_home_ips_period_minutes * 60 * 3 }}"

# Env resolves once at pod start and the shared restart rolls only `manifests_rollout`, so without
# this a rotated crowdsec_k8s_agent_password leaves node agents on the old value.
# ACCEPTED COST: any crowdsec manifest edit rolls both node agents; per-node auth.log parsing is
# blank meanwhile (wait-for-lapi absorbs up to 120s).
manifests_extra_rollouts:
  - name: crowdsec-node-agent
    kind: daemonset
