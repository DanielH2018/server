---
# Renovate stance: whether an image bump here may automerge. `promote` deploys what merges.
# Route-only role: it renders no Deployment of its own, only the
# IngressRoute + middlewares for the Longhorn UI that ships with the upstream manifest
# the `longhorn` role applies. There is no workload of ours
# to wait on. But the UI it fronts is the storage control plane — it deletes volumes,
# replicas and B2 backups, and the only gate on it is the authelia middleware this role
# renders — so a bad route change (auth accidentally dropped, wrong Service targeted) is a
# platform-class exposure risk even though nothing here is a workload to roll back.
k8s_autodeploy: false
k8s_autodeploy_reason: "renders no Deployment — route-only (IngressRoute + middlewares) in front of the Longhorn UI, which has no auth of its own; a bad route change risks exposing the storage control plane"

manifests_rollout: ''

# The entry's `port` is the upstream longhorn-frontend Service's, which the `longhorn`
# role's vendored `files/upstream/longhorn.yaml` installs.
manifests_exclude_files: [service.yaml]
