---
# generic-device-plugin advertises arbitrary /dev nodes as schedulable extended resources.
# Chosen over the vendor AMD plugin (which targets ROCm compute, not the render node VAAPI uses)
# and over smarter-device-manager (same idea, larger config surface).
# Pinned by digest, Renovate-trackable.
# `:latest` plus a digest, not a version tag, because upstream publishes no version tags at all
# — every tag is `latest` or a commit SHA, none semver. The digest is what actually pins. The
# `:latest` is there so Renovate's k8s-defaults manager matches the line and can offer digest
# bumps — a digest-only pin slips its regex and would age forever with no update signal, which
# CI's Renovate extract check (scripts/validate/renovate_extract.py) refuses.
dri_device_plugin_k8s_image: ghcr.io/squat/generic-device-plugin:latest@sha256:8dc84958301f054bf72d9753a7a2c9af3d6642a9844b34d1171b3f2cdb4a15f6

# Renovate stance: whether an image bump here may automerge. `promote` deploys what merges.
# Under Flux the gate is the K8sExtendedResourceMissing verify alert the soak reads, not a
# rollout wait. A readiness probe on /health would prove only the HTTP listener, not that the
# plugin registered its gRPC socket with the kubelet — rollout status would go green on an
# unregistered plugin. This workload advertises the /dev/dri render node as a schedulable
# resource, which jellyfin's GPU transcoding depends on.
k8s_autodeploy: false
k8s_autodeploy_reason: "no rollout gate proves the plugin works — the soak reads the K8sExtendedResourceMissing alert instead; even a /health readinessProbe would only prove the HTTP listener, not that the plugin registered its gRPC socket with the kubelet, and an unregistered plugin makes jellyfin and tdarr unschedulable"

# A scheduling allowance, not a hardware fact: jellyfin and tdarr both want the render node and the
# GPU multiplexes fine.
dri_device_plugin_count: 4

# After a reboot the kubelet can re-admit a GPU pod before this plugin re-registers, and the
# rejected pod stays Failed beside its replacement. The CronJob deletes those pods;
# files/dri_admission_reaper.py has the rule. Every 15 minutes, so a tombstone from the weekly
# reboot is gone well inside the hour after boot.
# The add-on namespaces where the job also deletes every Failed pod a Job owns. They run
# Jobs this repo does not render: k3s's helm-install Jobs and Longhorn's backup Jobs, which no
# `ttlSecondsAfterFinished` reaches. system-upgrade is not listed: the SUC controller's
# SYSTEM_UPGRADE_JOB_TTL_SECONDS_AFTER_FINISH (900) ages its Plan Jobs out on their own.
# Each namespace gets a Role in templates/admission-reaper-rbac.yaml.j2.
# DECIDED: the add-on sweep stays in this role rather than a role of its own. It runs the same
# script on the same schedule, and a second role would add a services entry and an image
# pin for one more predicate. It runs as its own CronJob and ServiceAccount in kube-system; the
# cronjob template's DECIDED note says why. Rationale in this role's CLAUDE.md.
dri_device_plugin_reaper_job_namespaces: [kube-system, longhorn-system]
dri_device_plugin_reaper_image: python:3.15-alpine@sha256:0f9552bb28711333da16915ec146f5e6bb44a7fdac9ced15dc17c2e0206346dd
dri_device_plugin_reaper_schedule: "*/15 * * * *"
# One list and a delete or two take seconds; `open_url` retries a refused connect for 60s.
dri_device_plugin_reaper_deadline_seconds: 120
# The job's own runs age out too, so a run the reboot interrupts does not become the next tombstone.
dri_device_plugin_reaper_job_ttl_seconds: 1800

manifests_rollout: ''
