---
artifacts_k8s_image: python:3.15-alpine@sha256:0f9552bb28711333da16915ec146f5e6bb44a7fdac9ced15dc17c2e0206346dd

# Renovate stance: whether an image bump here may automerge. `promote` deploys what merges.
# Stateless Deployment, RollingUpdate, no PVC, HTTP readinessProbe, and the base image tag
# above is a real version, not a mutable :latest or an -lsNN scheme that hides a breaking bump.
# Deliberately unprefixed: one constant key name every role uses, so the completeness guard
# can check for it without knowing the role's own prefix.
k8s_autodeploy: true
k8s_autodeploy_reason: "stateless RollingUpdate Deployment, no PVC, readinessProbe gates the rollout, pinned image tag"

# Each name is a ConfigMap key and a file under `files/`; a module missing here dies at import.
artifacts_modules:
  - _gui_html.py
  - _page_scripts.py
  - artifact_meta.py
  - artifact_server.py

# hostPath pins the pod to ONE node; other hosts' trees are synced in by homelab-sync-artifacts.
artifacts_k8s_node: "{{ k8s_primary_node }}"

# The tree Claude Code's artifact-design skill writes to on each host.
artifacts_host_dir: /home/ubuntu/.claude/artifacts
# Empty means no agent tree: the mount, volume and index source disappear.
# The pod reads it through the group grant (2750 claude:ubuntu), not DAC_OVERRIDE; claude-code
# creates it.
artifacts_agent_dir: /var/lib/claude/.claude/artifacts
# The triage controller's report tree, apart from the agent's so `claude` cannot fake a report.
# Empty means no mount; equals report_dir in claude-triage-pins.j2.
artifacts_triage_dir: "{{ '/var/lib/claude-triage-ctl/reports' if hosts[artifacts_k8s_node].claude_code_triage_enabled else '' }}"
# One subdirectory per host, which becomes the /a/<host>/ path segment the index and GUI filter on.
artifacts_peer_dir: /home/ubuntu/.claude/artifacts-peer

# Outside /home/ubuntu, which `claude` cannot traverse (0750). Change it with the dotfiles'
# CLAUDE_ARTIFACT_STARS_FILE and claude_code_artifacts_stars_file.
artifacts_stars_dir: /var/lib/artifact-stars
artifacts_stars_name: stars.txt

# Days without an update before retention-sweep deletes an artifact; equals the dotfiles'
# CLAUDE_ARTIFACT_RETENTION_DAYS. The star button counts down to it.
artifacts_retention_days: 30
# The /a/<host>/ trees a retention-sweep prunes, so only their star buttons count down. daniel-server
# and the agent user run no sweep, so their trees keep every artifact.
artifacts_swept_hosts:
  - "{{ artifacts_k8s_node }}"

# Its twin claude_code_artifacts_peer_sources must list the same entries.
artifacts_peer_sources:
  - name: daniel-server
    ssh_target: daniel-server
    path: /home/ubuntu/.claude/artifacts
    stars_path: /home/ubuntu/.claude/artifact-stars.txt

# Components with no containers_list entry; one that gains an entry leaves this list.
artifacts_platform_services:
  - k3s
  - unbound
  - cert-manager

# Services no inventory lists but older artifacts mention; add a retired service here, don't drop
# it.
# prometheus, tempo and otel-collector are live but absent from services, so they belong here.
artifacts_retired_services:
  - beszel
  - calibre
  - calibre-web
  - calmerge
  - change-detection
  - duplicati
  - file-browser
  - foundry
  - guacamole
  - happy
  - jellyseerr
  - kopia
  - minecraft
  - otel-collector
  - portainer
  - portainer-agent
  - prometheus
  - readarr
  - tempo
  - uptime-kuma
  - wallabag
  - watchtower

# The index is built per request from ~50 files; the pod is idle between page loads.
artifacts_k8s_cpu_limit: "500m"
artifacts_k8s_mem_limit: 128Mi
artifacts_k8s_cpu_request: "10m"
artifacts_k8s_mem_request: 32Mi
