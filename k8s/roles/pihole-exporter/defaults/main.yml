---
# ekofr/pihole-exporter. v1.0.0 is the release that added Pi-hole v6 support. Pinned by tag
# (Renovate k8s-defaults manager), like the pihole role's own images.
#
# An exporter is needed at all because Pi-hole v6 serves no Prometheus endpoint of its own.
# Against the live pod, `GET /metrics` on the pihole Service returns 404, and
# `GET /api/info/version` returns 401 — the v6 JSON API exists but is authenticated, and
# nothing there speaks the exposition format. Re-check before replacing this with a native
# scrape; an upstream that grew `/metrics` would make the whole role redundant.
pihole_exporter_k8s_image: ekofr/pihole-exporter:v1.4.0@sha256:bd849cd5e0f7f89bf38943d7988c5facfd603d9813c4c089fcff8ed121f718bb

# Renovate stance: whether an image bump here may automerge. `promote` deploys what merges.
# TRUE where the `pihole` role it reads from is denylisted. The two have opposite blast radii:
# a failed pihole deploy breaks name resolution fleet-wide, while this pod holds no DNS path at
# all — it polls the admin API and serves metrics. A bad image bump costs the DNS dashboards.
k8s_autodeploy: true
k8s_autodeploy_reason: "read-only poller of Pi-hole's admin API with a readinessProbe; holds no DNS path, so a bad image bump costs dashboards rather than name resolution (unlike the denylisted `pihole` role)"

# Scrape BOTH instances: DNS is balanced across two FTLs, each with its own DB, so one reports half.
# The exporter labels every series with `hostname`, so dashboards sum.
pihole_exporter_k8s_targets:
  - "pihole.{{ k8s_namespace }}.svc.cluster.local"
  - "pihole-2-web.{{ k8s_namespace }}.svc.cluster.local"

pihole_exporter_k8s_cpu_limit: "200m"
pihole_exporter_k8s_mem_limit: 64Mi
pihole_exporter_k8s_cpu_request: "10m"
pihole_exporter_k8s_mem_request: 16Mi

manifests_rollout: pihole-exporter

# Declares the pihole-env key so a pihole_password rotation rolls this pod.
manifests_outside_secrets:
  - name: pihole-env
    keys: [pihole_password]
