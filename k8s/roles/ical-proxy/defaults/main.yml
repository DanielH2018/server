---
ical_proxy_k8s_image: "{{ k8s_registry_pull_host }}/ical-proxy:{{ k8s_built_image_tags.get('ical-proxy', 'latest') }}"  # Renovate offers no version for this ref — see k8s_autodeploy_reason

# Renovate stance: whether an image bump here may automerge. `promote` deploys what merges.
# Stateless RollingUpdate Deployment, no PVC, readinessProbe. Internal-only (no public route),
# image is in-cluster-built via image-builder, not an upstream tag Renovate bumps blind.
k8s_autodeploy: true
k8s_autodeploy_reason: "stateless RollingUpdate Deployment, no PVC, readinessProbe, in-cluster-built image, internal-only route. NOTHING CAN TRIGGER AN AUTOMERGE: ical_proxy_k8s_image is a registry-built <pull-host>/ical-proxy ref, listed in REGISTRY_BUILT_IMAGES (scripts/tests/test_renovate_managers.py) — no upstream ref for Renovate to compare against and no version for it to offer. Only templates/Dockerfile.j2's FROM line moves, and every automerge rule in renovate.json is custom.regex-only, so that dockerfile-manager bump never automerges. The stance is correct and harmless, not active"

# Blast-radius caps.
ical_proxy_k8s_cpu_limit: 500m
# The working set plateaus near 108 MiB once the feeds are parsed, so 128Mi left too little room.
ical_proxy_k8s_mem_limit: 256Mi
ical_proxy_k8s_cpu_request: 50m
ical_proxy_k8s_mem_request: 96Mi

image_builder_builds:
  - image_builder_name: ical-proxy
    image_builder_dockerfile: "{{ role_file('templates/Dockerfile.j2') }}"
    # Flat key (ConfigMap keys cannot contain '/'). ical_proxy.py, not app.py, so it cannot shadow
    # homelab-mcp's app.py in a shared pytest session; the image runs it as app.py.
    image_builder_context:
      "{{ role_file('files/ical_proxy.py') }}": app.py

manifests_rollout: ical-proxy

render_secrets:
  # Private calendar URLs: possession of a URL is access to its feed.
  - name: ical-proxy-env
    string_data:
      GOOGLE_ICS_URL: calendar_1
      GOOGLE_ICS_URL_2: calendar_2
      OBSIDIAN_GIST_URL: calendar_4
