---
# Pinned like the observability Loki (Renovate-tracked).
loki_homelab_k8s_image: grafana/loki:3.7.9@sha256:0db216b630ae1f348a1584c67f3cead8b4c1fc839169a39501db664744158e28
# The cluster log shipper.
loki_homelab_k8s_alloy_image: grafana/alloy:v1.20.1@sha256:2aa2099af76c0098d4af7a4d6e48f86cb66dc1a000222ad927a1c67c6542d13f

# Renovate stance: whether an image bump here may automerge. `promote` deploys what merges.
# Observability: the log store the Alert History reconstruction, the ruler's own rules
# (homelab-logs) and monitor-bridge's remaining LogQL check (the HA ban arm) read from
# — a broken deploy blinds those without
# paging about it. ALSO Recreate + a PVC (loki-homelab-data) on its
# own state, which compounds the risk but isn't the primary reason.
k8s_autodeploy: false
k8s_autodeploy_reason: "observability — log store other monitors read from; a broken deploy blinds them without paging. ALSO Recreate + PVC on its own log data"

# `longhorn-nobackup` on purpose: logs are bulky, rotating, and reconstructible in spirit; the
# 31-day retention is the real bound.
loki_homelab_claim: loki-homelab-data
loki_homelab_size: 5Gi
loki_homelab_storage_class: longhorn-nobackup

# The claim the renderer emits for this role, which the loki-homelab Kustomization applies
# (#3387).
k8s_claims:
  - name: "{{ loki_homelab_claim }}"
    storage_class: "{{ loki_homelab_storage_class }}"
    size: "{{ loki_homelab_size }}"

loki_homelab_retention: 744h

# The Loki ruler's rule groups, one file each under files/rules/, carried into the
# loki-homelab-rules ConfigMap by templates/rules-configmap.yaml.j2. The list names each file
# because the offline renderer has no fileglob, so a file it does not name never reaches the
# ruler. scripts/validate/alert_rules.py fails when the files, this list and the rendered
# ConfigMap's keys disagree.
loki_homelab_rule_groups:
  - homelab-logs

loki_homelab_cpu_limit: "1"
loki_homelab_mem_limit: 1024Mi
loki_homelab_cpu_request: "100m"
loki_homelab_mem_request: 256Mi

# Flux prunes by its own inventory, which holds the Alloy ClusterRole and ClusterRoleBinding,
# so dropping one deletes it live.
manifests_rollout: loki-homelab

# manifests_rollout names the loki-homelab DEPLOYMENT; the Alloy shipper reads the same
# ConfigMap and is a DaemonSet, so it is rolled as an extra. The shared role skips the
# restart on the run that created it, and queues it for the batch drain like any other.
manifests_extra_rollouts:
  - name: alloy
    kind: daemonset
