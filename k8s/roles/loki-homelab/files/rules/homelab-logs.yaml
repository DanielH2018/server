# The Loki ruler's LogQL rules for the cluster log store. The ruler sends each firing alert to
# Alertmanager in the observability namespace (templates/configmap.yaml.j2's ruler block).
# `interval: 5m` matches monitor-bridge's INTERVAL, so the ruler issues the bridge's query
# load rather than five times it under Loki's 1m default.
#
# lokitool parses every expression in the validate-alert-rules hook. LogQL has no counterpart
# to `promtool test rules`, so nothing here is unit-tested into firing; M5's slice plan
# (docs/archive/monitoring/m5-loki-ruler.md, *The rules*) states what checks each
# rule instead. tests/services/scraping/test_loki_stream_labels.py holds every selector to the
# labels and values Alloy emits, and holds each silence rule to its side of the Pi boundary.
#
# Every selector is a literal copied from `loki_streams` in estate/vars.yml, because this
# file is never rendered. No annotation templates a log line's text, so no line content
# reaches Discord or email.
#
# Each alert pages through Alertmanager; this file is the only pager for Loki log ingestion.
groups:
  - name: homelab-logs
    interval: 5m
    rules:
      # The `machine` matcher keeps daniel-pi's syslog out: a Pi stream would keep the count above
      # zero in a cluster outage.
      - alert: LokiHostLogsSilent
        expr: absent_over_time({job=~"authlog|syslog", machine!="daniel-pi"}[3h])
        labels:
          severity: warning
          service: loki-homelab
        annotations:
          summary: >-
            loki-homelab: the cluster hosts' syslog and authlog have shipped nothing in 3 hours.
          description: >-
            No authlog or syslog line from daniel-box or daniel-server reached loki-homelab in
            3 hours, so the Alloy file-tail pipeline is down. Read the alloy DaemonSet's pods
            and their log in the homelab namespace.
      - alert: LokiPodLogsSilent
        expr: absent_over_time({job="k8s"}[30m])
        labels:
          severity: warning
          service: loki-homelab
        annotations:
          summary: 'loki-homelab: no pod log has arrived in 30 minutes.'
          description: >-
            No line from any cluster pod reached loki-homelab in 30 minutes, so the Alloy
            pod-log pipeline is down. Read the alloy DaemonSet's pods and their log in the
            homelab namespace.
      - alert: LokiPiLogsSilent
        expr: absent_over_time({job="pi"}[3h])
        labels:
          severity: warning
          service: daniel-pi
        annotations:
          summary: 'daniel-pi: the containers have shipped nothing to loki-homelab in 3 hours.'
          description: >-
            No container log line from daniel-pi reached loki-homelab in 3 hours. Read the
            alloy container on daniel-pi with `probe.py pi containers`.
      # Counts, per container, the lines that match the pattern over 1h in the cluster pod and
      # daniel-pi container streams, and fires when one container exceeds 20. `error` is
      # deliberately absent from the pattern: it appears in ordinary output constantly, and an
      # alert on it gets ignored. These four mean the process gave up. `for: 5m` is the startup
      # grace. No container is on an ignore list.
      #
      # DECIDED: stays at 20, and home-assistant stays OUT of any ignore list. #1784 proposed
      # raising this or ignoring that container, after `fatal log lines in 1h: home-assistant (23)`
      # and `(26)` held k3s Workload Health red for 46 and 43 minutes. Both were declined on the
      # measurement: over the 4 days to 2026-09-11 this selector and pattern matched home-assistant
      # ZERO times, so the burst is episodic rather than chronic, and a permanent ignore would blind
      # the arm on a container that is normally silent. The 7d query times out against Loki, so "no
      # matches in 4d" cannot see a burst; it establishes that HA is not chronically noisy, NOT
      # that those lines were benign. Raise this only from a window that contains a burst and a
      # reason to call it ordinary.
      - alert: WorkloadLogErrors
        expr: sum by (container) (count_over_time({job=~"k8s|pi"} |~ `(?i)(panic:|fatal|traceback|out of memory)` [1h])) > 20
        for: 5m
        labels:
          severity: warning
          service: k3s
        annotations:
          summary: '{{ $labels.container }}: logged more than 20 fatal-pattern lines in an hour.'
          description: >-
            {{ $labels.container }} logged {{ $value }} lines matching panic, fatal, traceback
            or out of memory in the last hour, so it may be failing at its job while its pod
            reads Ready. Read that container's log in loki-homelab to see the lines.
      # 6h window: an hourly cron failing every run reaches 4 Tracebacks, so `> 3` pages on it but
      # not on one failure.
      # Syslog only: authlog's sudo `COMMAND=` lines echo arguments. No `shadow` label; `service`
      # stays literal.
      - alert: HostLogErrors
        expr: sum by (machine, program) (count_over_time({job="syslog", machine!="daniel-pi"} |~ `(?i)(panic:|fatal|traceback|out of memory)` [6h])) > 3
        labels:
          severity: warning
          service: host-syslog
        annotations:
          summary: >-
            {{ $labels.machine }}: {{ $labels.program }} logged more than 3 fatal-pattern lines in 6
            hours.
          description: >-
            {{ $labels.program }} on {{ $labels.machine }} logged {{ $value }} syslog lines
            matching panic, fatal, traceback or out of memory in the last 6 hours. Read
            {job="syslog", program="{{ $labels.program }}"} in loki-homelab to see the lines.
      # Case-sensitive on purpose: a container's own cgroup OOM logs lower case and is covered
      # elsewhere.
      # The second arm is daniel-pi's, whose `pi_health` stream has no `program` label.
      - alert: HostOutOfMemoryKill
        expr: >-
          (
            sum by (machine) (count_over_time({job="syslog", machine!="daniel-pi", program="kernel"} |= "Out of memory: Killed process" [1h]))
            or
            sum by (machine) (count_over_time({job="syslog", machine="daniel-pi", filename="/var/log/pi-health/journal.log"} |= "kernel: Out of memory: Killed process" [1h]))
          ) > 0
        labels:
          severity: warning
          service: host-syslog
        annotations:
          summary: '{{ $labels.machine }}: the kernel OOM-killed a process in the last hour.'
          description: >-
            The kernel on {{ $labels.machine }} logged {{ $value }} OOM kills in the last hour, so
            the node ran out of memory. Read {job="syslog", program="kernel"} in loki-homelab, or
            on daniel-pi {machine="daniel-pi", filename="/var/log/pi-health/journal.log"}.
      # The 1h range keeps a post-boot remount firing past the weekly reboot's mute.
      # A remount of this Loki's own claim stores no line; KubeletCSIMountReadOnly pages on that.
      - alert: HostFilesystemRemountedReadOnly
        expr: >-
          sum by (machine) (count_over_time({job="syslog", machine!="daniel-pi", program="kernel"} |= "Remounting filesystem read-only" [1h])) > 0
        labels:
          severity: critical
          service: longhorn
        annotations:
          summary: >-
            {{ $labels.machine }}: the kernel remounted a filesystem read-only in the last hour.
          description: >-
            Scale the workload on the remounted device to 0, wait for its Longhorn volume to detach,
            and scale back. The kernel on {{ $labels.machine }} logged {{ $value }} "Remounting
            filesystem read-only" lines in the last hour; {job="syslog", program="kernel"} in
            loki-homelab names the device.
          runbook_url: https://docs.local.daniel-hunter.com/alert-runbooks/#hostfilesystemremountedreadonly
      - alert: HomeAssistantCastHeartbeatStorm
        expr: >-
          sum(count_over_time({job="k8s", container="home-assistant"} |= "Heartbeat timeout" [1h])) > 30
        labels:
          severity: warning
          service: home-assistant
        annotations:
          summary: >-
            home-assistant: the Cast connection to the bedroom display reset more than 30 times in
            an hour.
          description: >-
            home-assistant logged {{ $value }} pychromecast "Heartbeat timeout" lines in the last
            hour, so the Cast connect-back loop is running and dashboard casts to the Nest Hub
            fail. k8s/roles/home-assistant/docs/platform.md describes the loop and the
            quit-app fallback.
      # A failed cycle logs none of the three success lines, so 15m (three cycles) without one is a
      # dead updater.
      # The `pod` regex is the Deployment name plus ReplicaSet and pod suffixes. Edits restart Loki.
      - alert: CloudflareDdnsDirectUpdateSilent
        expr: absent_over_time({job="k8s", container="cloudflare-ddns", pod=~"cloudflare-ddns-direct-.*"} |~ `are already up to date|Updated an outdated|Added a new` [15m])
        labels:
          severity: warning
          service: cloudflare-ddns
        annotations:
          summary: >-
            cloudflare-ddns: cloudflare-ddns-direct has logged no successful update in 15 minutes.
          description: >-
            The cloudflare-ddns-direct pod logged neither "already up to date" nor a record
            change for 15 minutes, so the unproxied terraria and valheim records are not being
            kept current. Read the cloudflare-ddns-direct pod's log in the homelab namespace.
      - alert: CloudflareDdnsProxiedUpdateSilent
        expr: absent_over_time({job="k8s", container="cloudflare-ddns", pod=~"cloudflare-ddns-proxied-.*"} |~ `are already up to date|Updated an outdated|Added a new` [15m])
        labels:
          severity: warning
          service: cloudflare-ddns
        annotations:
          summary: >-
            cloudflare-ddns: cloudflare-ddns-proxied has logged no successful update in 15 minutes.
          description: >-
            The cloudflare-ddns-proxied pod logged neither "already up to date" nor a record
            change for 15 minutes, so the proxied apex record is not being kept current. Read the
            cloudflare-ddns-proxied pod's log in the homelab namespace.
