---
# Renovate's k8s-defaults manager tracks this pin. Keep the tag alongside a digest
# (`repo:tag@sha256:...`) — a bare `repo@sha256:...` freezes the image with no update signal.
vaultwarden_k8s_image: vaultwarden/server:1.37.5@sha256:4fe17f415f90087377d37c755e0ea3cf189dcc6794e49cdd2a9adbb4937d9e1f

# Renovate stance: whether an image bump here may automerge. `promote` deploys what merges.
# Vaultwarden migrates its database schema on start, and this is the password store.
k8s_autodeploy: false
k8s_autodeploy_reason: "password store with schema migrations on upgrade; an unattended bump could migrate the vault database with nobody watching"

vaultwarden_k8s_replicas: 1

# A bool. True for exactly one landing while the operator registers the single account; the
# same PR narrows vaultwarden_k8s_allowed_sources to the registering device's /32.
vaultwarden_k8s_signups_allowed: false

# k8s_primary_node's pod subnet (its spec.podCIDR). Traefik and wg-easy are both pinned there.
vaultwarden_k8s_primary_node_pod_cidr: 10.42.0.0/24

# The only sources the IngressRoute admits, matched on the remote address. Traefik's Service is
# externalTrafficPolicy: Local, so that is the real client.
# DECIDED: the primary node's pod subnet and no other cluster range (operator, 2026-11-26).
# WireGuard peers arrive as wg-easy's pod IP, which changes on every restart, and no cheap change
# gives wg-easy a stable source. The /24 also admits every other pod on that node, which the
# master password, 2FA and the login rate limit still face; the whole pod CIDR is refused.
vaultwarden_k8s_allowed_sources:
  - "{{ lan_subnet }}"
  - "{{ vaultwarden_k8s_primary_node_pod_cidr }}"

# The only sources Vaultwarden takes X-Real-IP from, which keys its login rate limit: Traefik's
# node. A host process or admitted pod on that node could still set the header; one on
# daniel-server cannot.
vaultwarden_k8s_trusted_proxies: "{{ vaultwarden_k8s_primary_node_pod_cidr }}"

vaultwarden_k8s_cpu_limit: "500m"
vaultwarden_k8s_mem_limit: 256Mi
vaultwarden_k8s_cpu_request: "50m"
vaultwarden_k8s_mem_request: 64Mi

# The image runs as root by default; any uid works once /data is writable, which fsGroup gives.
vaultwarden_k8s_uid: 1000

# SQLite DB, attachments, sends and the RSA signing key all live under /data.
vaultwarden_k8s_claim: vaultwarden-data
vaultwarden_k8s_storage_class: longhorn
vaultwarden_k8s_size: 1Gi

k8s_claims:
  - name: "{{ vaultwarden_k8s_claim }}"
    storage_class: "{{ vaultwarden_k8s_storage_class }}"
    size: "{{ vaultwarden_k8s_size }}"
