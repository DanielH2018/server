# The Plan Jobs' deadline bounds (H6, *SUC through Flux*). Upstream's default is 900 seconds. The
# server Plan sets 3600 and the agent Plan 5400 in `jobActiveDeadlineSecs`, and the controller
# caps a Plan's deadline at the MAX below, so the MAX must admit the agent's. The literals equal
# `system_upgrade_server_deadline_secs` and `system_upgrade_agent_deadline_secs` in
# defaults/main.yml, which ansible/roles/k8s/system-upgrade/tests/test_system_upgrade_role.py holds.
apiVersion: v1
kind: ConfigMap
metadata:
  name: default-controller-env
  namespace: system-upgrade
data:
  SYSTEM_UPGRADE_JOB_ACTIVE_DEADLINE_SECONDS: "3600"
  SYSTEM_UPGRADE_JOB_ACTIVE_DEADLINE_SECONDS_MAX: "5400"
  # Upstream's job.go reads this variable (v0.20.2), and the vendored manifest sets 99. At 99 a
  # failing `prepare` retries until the Job deadline. At 2 it ends in `JobFailed` after three pods.
  # The literal equals `system_upgrade_job_backoff_limit` in defaults/main.yml, which the role's
  # test holds. The controller reads its environment at start only.
  SYSTEM_UPGRADE_JOB_BACKOFF_LIMIT: "2"
