---
# The release files/gotk-components.yaml was generated at. A bump regenerates that file by
# hand, with the pipeline its first line names (CLAUDE.md), because Renovate can rewrite this
# line but cannot run `flux install`. tests/k8s/test_flux_role.py fails a bump whose
# vendored header still names the old release.
# renovate: datasource=github-releases depName=fluxcd/flux2
flux_version: v2.9.6

# prune: false: a controller upgrade dropping a CRD would delete that CRD and every object of its
# kind; `deletionPolicy: Orphan` covers only deleting the Kustomization.
# The lever reaches `flux` alone; `flux-deferred` keeps prune: true.
flux_prune: false

k8s_autodeploy: false
k8s_autodeploy_reason: "platform: the deploy controller itself. A bump of flux_version must be regenerated by hand"

flux_namespace: flux-system

# `restart_on: []` on every entry is required: without it the shared default records `restart:
# true` for all three controllers on any changed render, and nothing here restarts one.
# No signal applies: no controller reads a Secret or ConfigMap through env, envFrom or subPath, and
# a pod-template change rolls the controller through the apply itself.
flux_controllers:
  - { kind: deploy, name: source-controller, restart_on: [] }
  - { kind: deploy, name: kustomize-controller, restart_on: [] }
  - { kind: deploy, name: notification-controller, restart_on: [] }

# runAsUser and runAsGroup pin the uid all three images declare (`USER 65534:65534`) beside
# upstream's `runAsNonRoot`.
flux_pod_patch:
  spec:
    revisionHistoryLimit: 3
    template:
      spec:
        enableServiceLinks: false
        securityContext:
          runAsUser: 65534
          runAsGroup: 65534

# The filter refuses a volume this map does not name, so a regeneration that adds one fails the
# render.
flux_volume_suffixes:
  data: data
  tmp: tmp
  temp: tmp

# A worker on a health-waiting Kustomization is held until the check settles: the rollout batch
# width keeps the play's concurrency, and one more worker is the soak's.
# chained_timeout.py's CONCURRENT is the width alone; tests/k8s/test_flux_role.py fails a drift
# between the three.
flux_controller_args:
  kustomize-controller:
    - "--concurrent={{ k8s_rollout_batch_width | int + 1 }}"

# A `resources` merge patch the flux_components filter applies to a controller's first
# container, replacing upstream's value for the keys it names. The limit stays upstream's 1Gi.
# DECIDED: kustomize-controller requests 192Mi (2026-10-23, D5 step 31), sized to the exit-7
# peak of 174002176 B (about 166 MiB) plus headroom. The
# long form is in this role's CLAUDE.md.
flux_controller_resources:
  kustomize-controller:
    requests:
      memory: 192Mi

# The OCIRepository follows the tag with no pull secret, so the package must stay public
# (docs/flux-deploy-plane.md).
flux_artifact_url: oci://ghcr.io/danielh2018/homelab-manifests
flux_artifact_tag: prod

# Go regular expressions for `matchOIDCIdentity`; forge.py holds the same identity as
# SIGNER_IDENTITY/SIGNER_ISSUER and tests/k8s/test_flux_sync.py fails a drift.
flux_signer_subject: '^https://github\.com/DanielH2018/server/\.github/workflows/promote\.yml@refs/heads/master$'
flux_signer_issuer: '^https://token\.actions\.githubusercontent\.com$'

# Break-glass promotion (docs/break-glass.md): True renders the in-cluster registry over plain HTTP,
# verified against the public key below.
# The operator flips it in an emergency commit and reverts it afterwards.
flux_break_glass: false
flux_break_glass_url: "oci://{{ k8s_registry_push_host }}/homelab-manifests"
flux_break_glass_tag: break-glass
# The Secret holds the public half alone; the private half stays in the break-glass kit.
flux_break_glass_secret: flux-break-glass-key
flux_break_glass_public_key: |
  -----BEGIN PUBLIC KEY-----
  MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAETtflCTeC8+z7IyMVDsUnrqeCgNcS
  iyWO5ALzv7WNgSdFHRSX+oscTgeIBHYzfEeS60TbahTNhf7OzX+pGYXowA==
  -----END PUBLIC KEY-----

# A multi-line PEM and two all-digit IDs no Flux placeholder can carry, so it ships as a
# SOPS-encrypted manifest and a placeholder render leaves it out.
render_sops_manifests: [github-status-secret.yaml]

# The repository notification-controller posts commit statuses to.
flux_github_repository_url: https://github.com/DanielH2018/server

# Refused when true. Flux applies its own sync objects, so a suspend rendered on
# the OCIRepository `homelab` would stop the source that has to fetch the commit clearing it,
# and the renderer fails the render instead (scripts/renderer/renderer_lib/suspension.py). To
# stop everything, suspend that OCIRepository by hand, with its resume beside it:
# docs/flux-deploy-plane.md, *Recovering Flux by hand*. sync.yaml.j2 renders no suspend.
flux_sync_suspend: false

# True renders `verify-drill`, which follows an unsigned tag and must read Ready=False. False drops
# it and `flux-deferred`'s prune deletes it, so that Kustomization keeps prune: true.
flux_verify_drill: false

# The one image every Job Flux applies runs, such as `<tag>-snapshot`'s. The same python:3.15-alpine digest monitor_bridge_k8s_image
# pins, and Renovate's k8s-images manager moves both in one PR, as one dependency. The renderer
# reads it here (scripts/renderer/renderer_lib/snapshot.py); no task of this role does.
flux_job_image: python:3.15-alpine@sha256:0f9552bb28711333da16915ec146f5e6bb44a7fdac9ced15dc17c2e0206346dd

# These kinds' CRDs come from components.yaml, so one directory apply would refuse them on a cluster
# lacking the CRDs;
# flux-deferred depends on `flux`, so they apply after.
manifests_deferred_files:
  - sync.yaml

manifests_deferred_dir_name: flux-sync

# The shared role waits on ONE Deployment in {{ k8s_namespace }}; this role has three elsewhere, and
# the `flux` Kustomization's `wait` checks all three.
manifests_rollout: ''

# The release record still needs this role's workloads, to fingerprint their pod templates in
# flux-system.
manifests_self_rollouts: >-
  {{ flux_controllers | map('combine', {'namespace': flux_namespace}) | list }}
