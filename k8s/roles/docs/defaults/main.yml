---
# nginx-unprivileged: stock nginx binds 80, which fails at startup under `capabilities: drop:
# [ALL]`.
docs_k8s_image: nginxinc/nginx-unprivileged:1.31-alpine@sha256:b5047b9b76845eac124358373c6852377c52e4b05834a47647e955dd91cb8f1e

# Renovate stance: whether an image bump here may automerge. `promote` deploys what merges.
# Stateless Deployment, RollingUpdate, no PVC, HTTP readinessProbe, and the tag above is a
# real version rather than a mutable :latest.
# Deliberately unprefixed: one constant key name every role uses, so the completeness guard
# can check for it without knowing the role's own prefix.
k8s_autodeploy: true
k8s_autodeploy_reason: "stateless RollingUpdate Deployment, no PVC, readinessProbe gates the rollout, pinned image tag"

# hostPath pins the pod to ONE node: the built tree exists only on daniel-box, and elsewhere an
# empty directory serves a 404 instead of failing visibly.
docs_k8s_node: "{{ k8s_primary_node }}"

# NOT inside the repo checkout: a GitOps `git pull` rewrites that tree, and replacing a served
# directory mid-request is a failure with no upside.
docs_host_site_dir: "/home/{{ sys_user }}/docs-site"

# The site is static files served from page cache; nginx is idle between loads.
docs_k8s_cpu_limit: "500m"
docs_k8s_mem_limit: 128Mi
docs_k8s_cpu_request: "10m"
docs_k8s_mem_request: 32Mi
