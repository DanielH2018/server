---
# The k3s services, one entry per deploy tag. A service's description is its role's CLAUDE.md.
#
# List order is only the toposort's tiebreak. scripts/renderer/template_filters/toposort.py
# derives the CRD, authelia and applies-last edges; any other constraint is `depends_on:`.
#
# auth_tier: the Authelia policy of the LAN name, required beside `use_authelia: true`. The
#   public name is always two_factor.
# tier: home-edge | home-automation | platform (template_filters/service_tier.py). An untiered
#   service can be shed when a node is lost.
# backup_claims: a home-critical entry's volumes on the daily R2 list.
# r2_backup_claims: the same for an untiered entry whose data nothing can re-derive (ADR 0007).
# weekly_backup_claims: {claim: B2 shard}, 0 (Sunday) to 6. Change a shard only to rebalance
#   B2's daily transaction cap; give a new claim the lightest weekday.
# no_backup_claims: bound claims forced out of the backup set, each with its reason. A
#   `longhorn`-class claim in none of these keys is backed up daily to B2.
# metrics: scrape jobs (scripts/renderer/template_filters/scrape_jobs.py).
# netpol_from: callers the baseline does not admit, rendered by netpol-baseline.
# netpol_role_owned, role_owned: the role renders that fence itself, so it ships with the role.
# homepage_widget: adds homepage to the callers.
containers_list:
  - name: crowdsec
    no_backup_claims: [crowdsec-db]  # decisions re-derive from logs
    hostname: "crowdsec-lapi"
    probe: false  # `ScrapeTargetDown` and the homelab_check_* gauges cover it
    port: 8080
    use_authelia: false  # agents and bouncers authenticate with machine keys
    tier: home-edge
    metrics:
      - job: crowdsec
        port: 6060
      - job: crowdsec-jobs
        port: 9182
        interval: 1m
  - name: cluster-base
  - name: metallb
  - name: coredns
  - name: longhorn
  - name: longhorn-reconcile
    depends_on: [longhorn]
  - name: longhorn-backup
    depends_on: [longhorn]
  - name: longhorn-restore-drill
    depends_on: [longhorn]
  - name: traefik-crds
    tier: home-edge
  - name: traefik
    port: 8080
    # crowdsec first: its LAPI must hold the machine credential before the agent sidecar starts.
    depends_on: [crowdsec, traefik-crds]
    metrics:
      - job: traefik-k8s
        # Not the LoadBalancer Service, which would put :8080 on the LAN VIP.
        service: traefik-metrics
        port: 8080
        interval: 1m
    tier: home-edge
    backup_claims: [traefik-acme]
  - name: authelia
    hostname: "auth"
    port: 9091
    use_authelia: false
    tier: home-edge
    backup_claims: [authelia-config]
    netpol_from:
      - traefik  # forwardauth-middleware.yaml.j2
    netpol_fences:
      - app: authelia-redis
        port: 6379
        from: [authelia]
        role_owned: true
  - name: bento-pdf
    hostname: "bento-pdf"
    port: 8080
    use_authelia: true
    auth_tier: one_factor
  - name: texbrain
    hostname: "texbrain"
    port: 8080
    use_authelia: true
    auth_tier: one_factor
  - name: headlamp
    hostname: "headlamp"
    port: 4466
    # The pod uses its ServiceAccount token unsafely, so this is the only gate on the dashboard.
    use_authelia: true
    auth_tier: one_factor
    netpol_role_owned: true
    netpol_from:
      - traefik
  - name: deploy-ui
    hostname: "deploy"
    port: 8790
    # The only access control.
    use_authelia: true
    auth_tier: two_factor  # the page starts land.sh
  - name: longhorn-ui
    hostname: "longhorn"
    port: 80
    # The only access control: the UI has no login.
    use_authelia: true
    auth_tier: two_factor  # the UI deletes volumes and their backup chain
  - name: dri-device-plugin
  - name: media-volume
  - name: sonarr
    weekly_backup_claims: {sonarr-config: 6}  # Sat
    depends_on: [media-volume]
    hostname: "sonarr"
    port: 8989
    use_authelia: true
    auth_tier: one_factor
    service_extra_ports:
      - name: metrics
        port: 9707
    netpol_role_owned: true
    netpol_from:
      - traefik
      - janitorr
      - configarr
      - monitor-bridge
      - autofix-bridge
      - bazarr
      - prowlarr
      - sonarr-verify
      - janitorr-verify
    homepage_widget: true
  - name: qbittorrent
    weekly_backup_claims: {qbittorrent-config: 4}  # Thu
    depends_on: [media-volume]
    hostname: "qbittorrent"
    port: 8080
    use_authelia: true
    auth_tier: one_factor
    netpol_role_owned: true
    netpol_from:
      - traefik
      - sonarr
      - radarr
      - lidarr
      - qbittorrent-reach-probe
      - qbittorrent-prefs-check
    homepage_widget: true
  - name: radarr
    weekly_backup_claims: {radarr-config: 2}  # Tue
    depends_on: [media-volume]
    hostname: "radarr"
    port: 7878
    use_authelia: true
    auth_tier: one_factor
    service_extra_ports:
      - name: metrics
        port: 9707
    netpol_role_owned: true
    netpol_from:
      - traefik
      - janitorr
      - configarr
      - monitor-bridge
      - autofix-bridge
      - bazarr
      - prowlarr
      - radarr-verify
      - janitorr-verify
    homepage_widget: true
  - name: prowlarr
    weekly_backup_claims: {prowlarr-config: 4}  # Thu
    hostname: "prowlarr"
    # DECIDED: LAN-only by operator ruling 2026-11-15 (#8514); WireGuard covers remote use.
    public_route: false
    port: 9696
    use_authelia: true
    auth_tier: one_factor
    service_extra_ports:
      - name: metrics
        port: 9707
    netpol_role_owned: true
    netpol_from:
      - traefik
      - monitor-bridge
      - sonarr
      - radarr
      - lidarr
      - prowlarr-verify
  - name: bazarr
    weekly_backup_claims: {bazarr-config: 5}  # Fri
    depends_on: [media-volume]
    hostname: "bazarr"
    # DECIDED: LAN-only by operator ruling 2026-11-15 (#8514); WireGuard covers remote use.
    public_route: false
    port: 6767
    use_authelia: true
    auth_tier: one_factor
    netpol_role_owned: true
    netpol_from:
      - traefik
      - monitor-bridge  # the Bazarr Health check dials bazarr:6767

  - name: jellyfin
    weekly_backup_claims: {jellyfin-config: 1}  # Mon
    depends_on: [media-volume, dri-device-plugin]
    hostname: "jellyfin"
    probe: false  # blackbox-extra's tcp_connect target covers it
    port: 8096
    use_authelia: false  # TV and phone apps cannot complete a web SSO flow

  - name: tdarr
    weekly_backup_claims: {tdarr-server: 1, tdarr-configs: 2}  # Mon, Tue
    depends_on: [media-volume, dri-device-plugin]
    hostname: "tdarr"
    port: 8265
    use_authelia: true
    auth_tier: one_factor

  - name: configarr
    depends_on: [sonarr, radarr]

  - name: janitorr
    depends_on: [media-volume, sonarr, radarr, jellyfin]

  - name: observability
    # Grafana only. The other workloads hold prompt content, so none gets an ingress route.
    hostname: "grafana"
    port: 3000
    use_authelia: true
    auth_tier: one_factor
    # Must match the host the `prometheus-monitoring` IngressRoute hardcodes.
    extra_hostnames:
      - "prometheus"
  - name: littlelink
    hostname: "www"
    port: 3000
    use_authelia: false  # public landing page
  - name: speedtest
    hostname: "speedtest"
    # DECIDED: LAN-only by operator ruling 2026-11-15 (#8514); WireGuard covers remote use.
    public_route: false
    port: 80
    use_authelia: true
    auth_tier: one_factor
    # Reads `up == 0` until the app's `prometheus_enabled` setting is turned on by hand.
    metrics:
      - job: speedtest
        path: /prometheus
    netpol_from:
      - monitor-bridge  # SPEEDTEST_URL
  - name: cloudflare-ddns
  - name: freshrss
    weekly_backup_claims: {freshrss-config: 5}  # Fri
    hostname: "freshrss"
    port: 80
    use_authelia: true
    auth_tier: one_factor
    netpol_fences:
      - app: freshrss-feed-cache
        port: 80
        from:
          - freshrss  # the subscription URL is in FreshRSS's database, so no grep finds this caller
  - name: navidrome
    weekly_backup_claims: {navidrome-data: 3}  # Wed
    depends_on: [media-volume]
    hostname: "navidrome"
    port: 4533
    use_authelia: true
    auth_tier: one_factor
    # Subsonic clients cannot pass forward-auth; navidrome authenticates each request.
    bridge_bypass_prefixes:
      - /rest/
    # Parking navidrome means dropping this too, or its target reads `up == 0` and pages.
    metrics:
      - job: navidrome
  - name: livesync
    hostname: "livesync"
    probe: false  # blackbox-extra's http_401 target covers it
    port: 5984
    # Clients use basic auth and cannot pass 2FA. Traefik's livesync-gate-secret serves the
    # names; a bare `Host(livesync…)` router added beside it would bypass the token gate.
    use_authelia: false
    netpol_from:
      - vault-mcp  # livesync-cli mirrors the vault for Claude's vault connector
  - name: homepage
    hostname: "homepage"
    port: 3000
    use_authelia: true
    auth_tier: one_factor
  - name: peanut
    hostname: "peanut"
    port: 8080
    use_authelia: true
    auth_tier: one_factor
  - name: artifacts
    hostname: "artifacts"
    port: 8080
    use_authelia: true
    auth_tier: one_factor
  - name: docs
    hostname: "docs"
    port: 8080
    use_authelia: true
    auth_tier: one_factor
  - name: homelab-mcp
    # No hostname: the bearer-token router in Traefik's livesync-gate-secret is the only route.
    port: 8000
    use_authelia: false
    service_port_name: http
  - name: karakeep
    weekly_backup_claims: {karakeep-data: 3}  # Wed
    hostname: "karakeep"
    port: 3000
    use_authelia: true
    auth_tier: one_factor
    # Public; all but /api/health need a Bearer key. Never `/api/`, which reaches next-auth at
    # /api/auth/*. The trailing slashes keep siblings such as /api-docs out; the app calls
    # exactly /api/assets and /api/health, which take none.
    bridge_bypass_prefixes:
      - /api/v1/
      - /api/trpc/
      - /api/assets
      - /api/health
    netpol_from:
      - karakeep-time-tagger  # its init container waits on karakeep:3000
      - karakeep-archive-pruner  # REST API
    netpol_fences:
      - app: karakeep-meilisearch
        port: 7700
        from: [karakeep]
        role_owned: true
      # Exempt from the baseline, so this is the only policy on unauthenticated DevTools.
      - app: karakeep-chrome
        port: 9222
        from: [karakeep]
        role_owned: true
  - name: registry
    # Unauthenticated registry: an ingress would put push access on the LAN.
    tier: platform
  - name: n8n
    weekly_backup_claims: {n8n-data: 0, n8n-files: 5}  # Sun, Fri
    hostname: "n8n"
    port: 5678
    use_authelia: true
    auth_tier: two_factor  # arbitrary workflow execution
    # Webhook callers have no session. The trailing slash keeps /webhook-test/ out.
    bridge_bypass_prefixes:
      - /webhook/

  # DECIDED: mosquitto-data stays out of the daily R2 tier (#3389). It holds retained
  # messages and QoS session state the three clients republish on reconnect, on the
  # longhorn-nobackup class, so the broker is tiered for placement and alerting only.
  - name: mosquitto
    tier: home-automation

  - name: zigbee2mqtt
    depends_on: [mosquitto]
    hostname: "zigbee2mqtt"
    port: 8080
    use_authelia: true
    auth_tier: one_factor
    service_port_name: http
    tier: home-automation
    backup_claims: [zigbee2mqtt-data]

  - name: home-assistant
    hostname: "home-assistant"
    # Records HA's own listener; changing it moves the Service and route but not the listener.
    port: 8123
    use_authelia: false  # forward-auth breaks the companion app; HA's login + TOTP gates
    service_port_name: http
    tier: home-automation
    backup_claims: [home-assistant-config]
    netpol_from:
      - airflow-task  # HA_URL in homelab_warehouse/ha_rollup.py
      - homelab-mcp  # HA_URL
      - monitor-bridge  # HA_URL

  - name: pihole
    hostname: "pihole"
    probe: false  # blackbox-extra's dns_a_homepage target covers it
    port: 80
    use_authelia: true
    auth_tier: one_factor
    tier: home-edge
  - name: pihole-exporter
    # The port it dials on the Pi-holes, not one it serves.
    port: 80
    depends_on: [pihole]
    # Each scrape logs in to both Pi-holes, hence 1m. A panel must sum over `hostname`.
    metrics:
      - job: pihole
        port: 9617
        interval: 1m

  - name: gpu-exporter
    port: 9101

  - name: ical-proxy
    hostname: "ical-proxy"
    probe: false  # blackbox-extra's /calendar1.ics target covers it
    port: 5000
    use_authelia: false
    # The feeds are private and unauthenticated, so in-cluster callers stay enumerated here.
    netpol_from:
      - blackbox-exporter  # the /calendar1.ics probe
    homepage_widget: true

  - name: wg-easy
    weekly_backup_claims: {wg-easy-config: 4}  # Thu
    tier: platform
    hostname: "wg-easy"
    port: 51821
    udp_port: 51820
    use_authelia: true
    auth_tier: one_factor
    default_dns: "{{ dns_k8s_vip }}"

  - name: code-server
    weekly_backup_claims: {code-server-workspace: 0}  # Sun
    # Unread extension cache; the keepers are in code-server-workspace.
    no_backup_claims: [code-server-config]
    hostname: "code-server"
    port: 8443
    use_authelia: true
    auth_tier: two_factor  # a shell as the repo user

  - name: terraria
    weekly_backup_claims: {terraria-config: 3}  # Wed

  - name: valheim
    weekly_backup_claims: {valheim-config: 2}  # Tue

  - name: loki-homelab
    hostname: "loki-homelab"
    probe: false  # `ScrapeTargetDown` covers it
    port: 3100
    use_authelia: false
    # Change `port` and the configmap's http_listen_port together.
    metrics:
      - job: loki-homelab
        interval: 1m
  - name: game-stats
    weekly_backup_claims: {terraria-stats-data: 0, valheim-stats-data: 1}  # Sun, Mon
    depends_on: [loki-homelab]
    metrics:
      - job: terraria-stats
        service: terraria-stats
        port: 9420
      - job: valheim-stats
        service: valheim-stats
        port: 9420
  - name: monitor-bridge
    tier: platform
    port: 9181
    metrics:
      - job: monitor-bridge
        interval: 1m
  - name: node-exporter
  - name: autofix-bridge
    metrics:
      - job: autofix-bridge
        port: 9183
        interval: 1m
  - name: nut
    tier: platform
  - name: nut-exporter
    metrics:
      - job: nut
        port: 9199
        # `/metrics` carries no UPS reading.
        path: /ups_metrics
        interval: 1m
        # The scrape fails if the exporter finds several UPSes and no `ups`.
        params:
          ups: ["{{ nut_ups_name | default('apc-ups') }}"]
  - name: pi-peer-backup
    weekly_backup_claims: {pi-peer-backup-data: 6}  # Sat
  - name: scrutiny
    weekly_backup_claims: {scrutiny-web-config: 6}  # Sat
    no_backup_claims: [scrutiny-influxdb-data]  # SMART TSDB; the daily collector runs rebuild it
    hostname: "scrutiny"
    probe: false  # blackbox-extra's /api/health target covers it
    port: 8080
    use_authelia: true
    auth_tier: one_factor
    netpol_app: scrutiny-web  # the pod label differs from the entry name
    netpol_from:
      - scrutiny-collector  # COLLECTOR_API_ENDPOINT
      - monitor-bridge  # SCRUTINY_URL
      - homelab-mcp  # SCRUTINY_URL
      - airflow-task  # SCRUTINY_URL in homelab_warehouse/smart_history.py
    homepage_widget: true
  - name: flux
    tier: platform
  - name: system-upgrade
    tier: platform
  - name: blackbox-exporter
    port: 9115
  - name: karma
    hostname: "karma"
    port: 8080
    use_authelia: true
    auth_tier: two_factor
  - name: lidarr
    platform: k8s
    weekly_backup_claims: {lidarr-config: 6}  # Sat
    depends_on: [media-volume]
    hostname: "lidarr"
    port: 8686
    use_authelia: true
    auth_tier: one_factor
    service_extra_ports:
      - name: metrics
        port: 9707
    netpol_role_owned: true
    netpol_from:
      - traefik
      - prowlarr
      - slskd
      - lidarr-verify
    homepage_widget: true
  - name: slskd
    depends_on: [media-volume]
    hostname: "slskd"
    # DECIDED: LAN-only by operator ruling 2026-11-15 (#8514); WireGuard covers remote use.
    public_route: false
    port: 5030
    use_authelia: true
    auth_tier: one_factor
    homepage_widget: true
    no_backup_claims: [slskd-config]  # settings and transfer history; downloads live on media-data
  - name: vaultwarden
    # Credentials edited this week cannot be re-derived (ADR 0007).
    r2_backup_claims: [vaultwarden-data]
    hostname: "vaultwarden"
    port: 8080
    # Bitwarden clients cannot follow Authelia's 302; the role's source allowlist gates instead.
    use_authelia: false
    public_route: false
  - name: airflow
    # Holds daily history that its sources discard within a week.
    r2_backup_claims: [airflow-postgres-data]
    hostname: "airflow"
    port: 8080
    use_authelia: true
    auth_tier: two_factor  # the UI can clear and backfill runs, which write to the warehouse
    netpol_from: [airflow-task, airflow-dag-processor]  # the execution API
    netpol_role_owned: true
    netpol_fences:
      - app: airflow-scheduler
        port: 8974
        from: [blackbox-exporter]  # the scheduler health probe
        role_owned: true
  - name: tft-assistant
    hostname: "tft"
    port: 8080
    use_authelia: true
    auth_tier: one_factor
  - name: vault-mcp
    # The vault claim holds the decrypted vault; both rebuild from livesync's CouchDB.
    no_backup_claims: [vault-mcp-vault, vault-mcp-db]
    depends_on: [livesync]  # the pod reads livesync's Secret
    port: 8000
  - name: netpol-baseline
