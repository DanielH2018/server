extends: existence
message: "Noun stack '%s' — rewrite as a phrase with a verb or a preposition."
# A warning, not an error: the pattern has false positives, and it points at prose worth rereading.
level: warning
nonword: true
tokens:
  - '\b([A-Z]?[a-z]+ ){3,}(state|check|status|target|policy|config|setting|mode)\b'
