  # no hostname: nothing dials the controllers from outside their namespace but Prometheus,
  # and the role fences that itself.
  - name: flux
    platform: k8s
    tier: platform
  # system-upgrade-controller, its CRD and the two k3s Plans (docs/target-architecture/host/
  # h6-k3s-suc.md, H6.1b). Born Flux-owned, so every Ansible path skips it from its first commit.
  # The Plans select no node until H6.3c and H6.3d widen `system_upgrade_nodes`. No port and no
  # hostname: nothing dials the controller, and the namespace denies all ingress.
  - name: system-upgrade
    platform: k8s
    tier: platform
  # The ingress probes' exporter (docs/target-architecture/monitoring/m4-blackbox-ingress.md).
  # No depends_on: the plan states no order against observability.
  - name: blackbox-exporter
    platform: k8s
    # Flux applies blackbox-exporter through `promote`, and every Ansible path skips it (D5, Wave
    # A's last PR).
    port: 9115
  # Deploys LAST: every workload role must finish before this role fences the namespace
  # (docs/networkpolicy-slice-answers.md). K8S_APPLIES_LAST in filter_plugins/toposort.py gives
  # it an edge onto every other entry, so it applies last wherever it sits in this list, and an
  # entry appended after it still deploys before it (#4833).
  #
  # Not for the usual "after traefik" reason — this role renders no Traefik CRDs, and a
  # NetworkPolicy peer podSelector is a label match evaluated at connection time, so
  # `app: traefik` resolves whether or not a traefik pod exists when the policy is applied.
  #
  # Its batch does not matter. tasks/k8s_batch.yml drains rollouts only at the END of a
  # batch, so a role sharing this role's batch may still be rolling when it runs. The role's
  # first task drains them itself, so its exempt-set reads, its policy applies and its probe
  # all run against settled workloads, never against a shared end-of-batch drain. That drain
  # waits only for roles deployed BEFORE this one, which is why it applies last.
  - name: netpol-baseline
    platform: k8s
    # Flux applies netpol-baseline through `promote` and checks the policies in
    # `netpol-baseline-verify`, which depends on `netpol-baseline-deferred` (D5, Wave D's last
    # flip).
