# Exact patch: uv resolves a bare minor to whatever it has. Must track .python-version.
# Bump the dotfiles `python` pin and chezmoi apply on both hosts first, or units find no Python.
host_python_version: "3.15.2"

domain: daniel-hunter.com

# Linux Vars
sys_user: ubuntu
tz: America/Chicago
puid: 1000
pgid: 1000
# Narrow /24, not the broader RFC1918 range (see traefik's trustedIPs comment).
lan_subnet: "10.0.0.0/24"
# Also the DHCP server: only it knows leased device names, so Pi-hole forwards PTR lookups here.
lan_router_ip: "10.0.0.1"
# Exists only so comments citing wg-easy's client range share one name; no template reads it.
wg_client_subnet: "10.8.0.0/24"
# Panel finds pods by `app=<deployment>` and console by Loki `container=<server deployment>`.
# `start_refused` blocks start/restart with that reason; stop stays allowed.
game_servers:
  - name: terraria
    deployments: [terraria, terraria-stats]
    # 1.4.5.7 crashes on any bare TCP connect, so the port monitor stays off until the image is
    # newer.
    start_refused: "issue #822: Terraria 1.4.5.7 crashes on a bare TCP connect; follow the restore checklist first"
  - name: valheim
    deployments: [valheim, valheim-stats]
# Fixed PAN ids so a redeploy never regenerates the mesh; network_key is sensitive (SOPS).
slzb_ip: 10.0.0.127

# The label values loki-homelab's streams carry, one entry per stream role. Both Alloy
# configs stamp their streams from this map: k8s/roles/loki-homelab for the cluster nodes and
# hosts/components/pi-compose/services/alloy for daniel-pi. monitor-bridge's LogQL selectors in config/env.yaml.j2
# are rendered from it too.
#
# A consumer that cannot render a var is compared against it instead: the Grafana dashboards,
# the observability deploy-annotation expr, probe.py's alert reconstruction and monitor-bridge's
# Python constants. tests/services/scraping/test_loki_stream_labels.py holds both directions:
# every value here is emitted, and every `job` value a consumer selects is one listed here.
#
# Only daniel-pi's streams name a `machine`. A cluster stream's machine is the node's HOSTNAME,
# which Alloy reads at runtime, so no inventory value can own it.
#
# Two roles share `job: syslog`. That is deliberate: one parser and one board read every
# host's verdict lines. It is also why monitor-bridge's file-tail arm must exclude
# pi_health's machine.
loki_streams:
  cluster_pods:
    job: k8s
  host_syslog:
    job: syslog
  host_authlog:
    job: authlog
  k8s_audit:
    job: k8s-audit
  host_k3s:
    job: k3s
  host_audit:
    job: audit
  pi_containers:
    job: pi
    machine: daniel-pi
  pi_health:
    job: syslog
    machine: daniel-pi

# By hostname, never anycast IP, so DNS failure is part of the probe. Empty disables the gate.
# Must equal bridge/config_io.py:WAN_PROBE_DEFAULT (test-enforced).
wan_probe_urls:
  - https://cloudflare.com/cdn-cgi/trace
  - https://www.google.com/generate_204
# Paired with the k8s/nut pod's nodeSelector.
ups_host: daniel-server
# Window, Alertmanager mute and promote.yml cron derive from these; written twice they drift:
# a reboot moved without the window pages straight through it.
weekly_reboot_minute: 30
weekly_reboot_hour: 7
# Cron day-of-week, 0 = Sunday.
weekly_reboot_weekday: 0
# Hosts go down this many minutes AFTER the cron fires; the maintenance window length derives from
# it.
weekly_reboot_shutdown_delay_minutes: 5
# Hosts run Etc/UTC, NOT `tz` (America/Chicago): a window derived in `tz` would open at midday and
# page.
weekly_reboot_timezone: UTC
# Slack for a monitor flipping around the cron: the hosts go down only after the shutdown delay.
weekly_reboot_mute_lead_minutes: 5
# Measured node recovery ~16 min plus room; alertmanager-secret.yaml.j2 computes the window.
weekly_reboot_mute_recovery_minutes: 40

# --- The CI gate every deploy path grades by ---
#
# Check-run names that must be green on a master commit before anything deploys it. These are
# GitHub's check-run NAMES, which are also the strings branch protection calls contexts, so they
# must match ci.yml's `name:` EXACTLY, and that file carries a comment saying as much.
# `renovate config validator` is deliberately not required, but NOT because it skips: ci.yml's
# guard is `if: github.event_name != 'pull_request' || steps.scope.outputs.changed == 'true'`,
# whose left operand is true on a push, so it runs unconditionally on master. It is excluded
# because a red renovate.json does not change what a deploy renders or applies: the config is
# consumed by the hosted Mend app when it opens PRs, a plane no deploy path touches. Blocking the
# gate on it would park every later image bump behind a dependency-management fault.
#
# Four readers share the list, so it lives here: `scripts/deploy_tools/promote.py decide`, the
# host packages' builder, `homelab-checkout-sync` and
# `tests/repo/ci_workflows/test_ci_contexts_match_workflows.py`. `decide` reads this file by path and
# refuses anything but a non-empty list of strings, so this key stays a literal list. `scripts/deploy_tools/await_ci.py` names it in a comment.
#
# A change to this key or to `ci_ancestor_walk_max` reaches daniel-box only through its host
# package: the builder and checkout-sync components render both into `homelab-daniel-box`, so
# they take effect when daniel-box installs the package version carrying them. Until then a
# renamed CI job leaves both waiting on the old name.
ci_required_contexts:
  - prek (lint + validate + tests + secrets)

# How far back from a non-green tip the gate walks for a green ancestor; each step is a GitHub
# request.
# Keep small (anonymous quota is 60/hour). A non-positive-integer value stops both readers.
ci_ancestor_walk_max: 10

# Physical location, feeds the homepage weather widget.
lat: 38.89
long: -77.08
