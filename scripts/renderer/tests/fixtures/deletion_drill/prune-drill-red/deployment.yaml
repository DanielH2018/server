apiVersion: apps/v1
kind: Deployment
metadata:
  name: holder
  namespace: prune-drill-red
spec:
  replicas: 1
  selector:
    matchLabels:
      app: holder
  template:
    metadata:
      labels:
        app: holder
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: holder
          image: "@DRILL_IMAGE@"
          command: [sleep, "3600"]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data
