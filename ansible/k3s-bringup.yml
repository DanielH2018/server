---
# Slice 0 of the k3s migration: stand up a single-node cluster on daniel-box.
# Plan: docs/k3s-migration/slice-0-cluster-foundation.md
#
# Run ON daniel-box (the play's hosts: defaults to the local hostname, same as deploy.yml):
#   uv run ansible-playbook ansible/k3s-bringup.yml
#
# Do NOT trust `--check` here: nearly every task is ansible.builtin.command, which check
# mode skips rather than simulates, so a dry run reports green having proved nothing. The
# fail-closed guards below (daniel-box only, no Docker) are the real safety net.
#
# Deliberately a separate playbook rather than a role in initial_setup.yml: that playbook
# runs on every host, and k3s must not land on daniel-server until slice 7.
- name: Bring up the k3s cluster
  hosts: "{{ target | default(lookup('pipe', 'hostname')) }}"
  # Facts are gathered explicitly after the SOPS sudo password is set — same reason as
  # initial_setup.yml: with gather_facts: true the play escalates before secrets load, so
  # a passworded-sudo host would need --ask-become-pass.
  gather_facts: false
  pre_tasks:
    - name: Load encrypted secrets and set the become password (shared preamble)
      ansible.builtin.import_tasks: pre_tasks/load_secrets.yml
      tags: always

    - name: Gather facts (escalated — the become password is now available)
      ansible.builtin.setup:
      tags: always

    - name: Refuse to run anywhere but daniel-box
      # daniel-server joins the cluster in slice 7, after its Docker workload has drained.
      # Running this against it today would put k3s's iptables rules on top of Docker's on
      # the host that serves everything.
      ansible.builtin.assert:
        that: inventory_hostname == 'daniel-box'
        fail_msg: >-
          This playbook targets daniel-box only. daniel-server joins the cluster in slice 7
          — see docs/k3s-migration/slice-0-cluster-foundation.md.
      tags: always
  roles:
    - { role: k3s, tags: ["k3s"] }

# Phase F (slice-7 §F): join an agent node. Deliberately opt-in — the play matches no
# hosts unless invoked with `-e join_agent=daniel-server`, and it overrides hosts.ini's
# `ansible_connection=local` (correct for each host running its OWN plays, wrong for
# driving the join from daniel-box). Deploy the server-side firewall allows first:
#   uv run ansible-playbook ansible/k3s-bringup.yml --tags join-firewall
#   uv run ansible-playbook ansible/k3s-bringup.yml -e join_agent=daniel-server
- name: Join an agent node to the cluster
  hosts: "{{ join_agent | default([]) }}"
  gather_facts: false
  vars:
    ansible_connection: ssh
    ansible_host: "{{ server_ip }}"
    ansible_user: "{{ sys_user }}"
  pre_tasks:
    - name: Load encrypted secrets and set the become password (shared preamble)
      ansible.builtin.import_tasks: pre_tasks/load_secrets.yml
      tags: always

    - name: Refuse to join anything but daniel-server
      # The only planned agent. A typo'd join_agent must not enroll the Pi.
      ansible.builtin.assert:
        that: inventory_hostname == 'daniel-server'
        fail_msg: >-
          Phase F joins daniel-server only — see docs/k3s-migration/slice-7-drain-and-join.md.
      tags: always
  tasks:
    - name: Join this host as a k3s agent
      ansible.builtin.include_role:
        name: k3s
        tasks_from: agent
      tags: [k3s_agent]
