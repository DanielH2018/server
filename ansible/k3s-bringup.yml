---
# Slice 0 of the k3s migration: stand up a single-node cluster on daniel-box.
# Plan: docs/archive/k3s-migration/slice-0-cluster-foundation.md
#
# Run ON daniel-box (the play's hosts: defaults to the local hostname, same as deploy.yml):
#   uv run ansible-playbook ansible/k3s-bringup.yml
#
# Do NOT trust `--check` here: nearly every task is ansible.builtin.command, which check
# mode skips rather than simulates, so a dry run reports green having proved nothing. The
# fail-closed guards below (daniel-box only, no Docker) are the real safety net.
#
# Deliberately a separate playbook rather than a role in initial_setup.yml: that playbook
# runs on every host, and the server role must land on daniel-box alone. daniel-server joined
# as an AGENT in slice 7 (2026-08-14) — that is the opt-in join play further down, not this one.
- name: Bring up the k3s cluster
  hosts: "{{ target | default(lookup('pipe', 'hostname')) }}"
  # Facts are gathered explicitly after the SOPS sudo password is set — same reason as
  # initial_setup.yml: with gather_facts: true the play escalates before secrets load, so
  # a passworded-sudo host would need --ask-become-pass.
  gather_facts: false
  pre_tasks:
    - name: Load encrypted secrets and set the become password (shared preamble)
      ansible.builtin.import_tasks: pre_tasks/load_secrets.yml
      tags: always

    - name: Gather facts (escalated — the become password is now available)
      ansible.builtin.setup:
      tags: always

    - name: Refuse to run on a host that is not a k3s server node
      # daniel-box is the prod control-plane node. daniel-server is an AGENT — running the
      # server role against it would stand up a second control plane on a node that already
      # belongs to this cluster. daniel-stage is the staging cluster's own single node
      # (docs/staging-cluster.md); it is a server for a DIFFERENT cluster, not a second one
      # for this.
      #
      # DECIDED: an allowlist, not `inventory_hostname not in k3s_agent_hosts`. Inverting it
      # would admit every host nobody remembered to deny, which is the same shape as the
      # accident this assert exists to prevent. A new server node is a deliberate edit to
      # k3s_server_hosts; ansible/tests/test_k3s_server_hosts.py keeps it that way.
      ansible.builtin.assert:
        that: inventory_hostname in k3s_server_hosts
        fail_msg: >-
          This playbook's server role targets {{ k3s_server_hosts | join(', ') }} only, and
          this host is {{ inventory_hostname }}. To (re)join daniel-server as an agent, use
          the opt-in join plays below with -e join_agent=daniel-server.
      tags: always
  roles:
    - { role: k3s, tags: ["k3s"] }

# Phase F (slice-7 §F): join an agent node. Deliberately opt-in — the join plays match no
# hosts unless invoked with `-e join_agent=daniel-server`. Three plays, not one: the join
# play overrides hosts.ini's `ansible_connection=local` (correct for each host running
# its OWN plays, wrong for driving the join from daniel-box), and play-level connection
# vars POISON every delegated task — a delegate_to inherits them and ssh-dials the wrong
# box. So anything that must run on daniel-box (token read, secrets load, verification)
# lives in its own daniel-box play, handing facts across via hostvars. Deploy the
# server-side firewall allows first:
#   uv run ansible-playbook ansible/k3s-bringup.yml --tags join-firewall
#   uv run ansible-playbook ansible/k3s-bringup.yml -e join_agent=daniel-server --tags k3s_agent
- name: Read the join credentials on the server node
  hosts: "{{ join_agent | default([]) is truthy | ternary('daniel-box', []) }}"
  gather_facts: false
  pre_tasks:
    - name: Load encrypted secrets and set the become password (shared preamble)
      ansible.builtin.import_tasks: pre_tasks/load_secrets.yml
      tags: always
  tasks:
    - name: Read the cluster join token
      tags: [k3s_agent]
      ansible.builtin.slurp:
        src: /var/lib/rancher/k3s/server/node-token
      become: true
      register: k3s_join_token_slurp
      no_log: true

    - name: Stage the join credentials for the agent play
      tags: [k3s_agent]
      ansible.builtin.set_fact:
        k3s_join_token_b64: "{{ k3s_join_token_slurp.content }}"
        k3s_join_become_password: "{{ become_password }}"
      no_log: true

- name: Join an agent node to the cluster
  hosts: "{{ join_agent | default([]) }}"
  gather_facts: false
  vars:
    ansible_connection: ssh
    ansible_host: "{{ hostvars[inventory_hostname]['server_ip'] }}"
    ansible_user: "{{ hostvars[inventory_hostname]['sys_user'] }}"
  pre_tasks:
    - name: Take the become password staged by the server play
      ansible.builtin.set_fact:
        ansible_become_password: "{{ hostvars['daniel-box']['k3s_join_become_password'] }}"
      no_log: true
      tags: always

    - name: Refuse to join anything but daniel-server
      # The only planned agent. A typo'd join_agent must not enroll the Pi.
      ansible.builtin.assert:
        that: inventory_hostname == 'daniel-server'
        fail_msg: >-
          Phase F joins daniel-server only — see docs/archive/k3s-migration/slice-7-drain-and-join.md.
      tags: always
  tasks:
    - name: Join this host as a k3s agent
      ansible.builtin.include_role:
        name: k3s
        tasks_from: agent
      vars:
        k3s_join_token: "{{ hostvars['daniel-box']['k3s_join_token_b64'] | b64decode | trim }}"
      tags: [k3s_agent]

- name: Verify the joined node from the server side
  hosts: "{{ join_agent | default([]) is truthy | ternary('daniel-box', []) }}"
  gather_facts: false
  # ansible_become_password still set from the first play's preamble (same host, same run).
  tasks:
    - name: Verify the agent node registered, is Ready, and holds no Longhorn disk
      ansible.builtin.include_role:
        name: k3s
        tasks_from: agent_verify
      vars:
        k3s_join_node: "{{ join_agent }}"
        k3s_join_node_ip: "{{ hostvars[join_agent]['server_ip'] }}"
      tags: [k3s_agent]
