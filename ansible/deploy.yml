---
- name: Deploy Containers
  hosts: "{{ target | default(lookup('pipe', 'hostname')) }}"
  gather_facts: true
  pre_tasks:
    # `-e target=<other host>` looks like it drives that host remotely. For daniel-server and
    # daniel-box it does not: both are `ansible_connection=local` in hosts.ini, so the target
    # only selects whose *variables* to use — every task still executes HERE. Ansible reports
    # the run against the named host either way, so nothing in the output says otherwise.
    #
    # Left unguarded that silently writes the other host's containers/ tree, secrets included,
    # onto the local disk before dying on a missing docker CLI. That happened on 2026-08-03:
    # `-e target=daniel-server` from daniel-box wrote daniel-server's uptime-kuma compose file
    # and its Kuma ADMIN password onto daniel-box. Fail before any task can write instead.
    #
    # daniel-pi is `ansible_connection=ssh` and genuinely remote, so it stays allowed — the
    # documented `-e target=daniel-pi` workflow is unaffected.
    - name: Refuse a local-connection deploy aimed at a different host
      ansible.builtin.assert:
        that: ansible_connection | default('smart') != 'local' or inventory_hostname == _local_hostname
        fail_msg: >-
          Refusing to deploy: target '{{ inventory_hostname }}' is ansible_connection=local, so
          its tasks would run on '{{ _local_hostname }}' and write that host's files here.
          Run the deploy on {{ inventory_hostname }} itself.
        quiet: true
      vars:
        _local_hostname: "{{ lookup('pipe', 'hostname') }}"
      tags: always

    - name: Load encrypted secrets and set the become password (shared preamble)
      ansible.builtin.import_tasks: pre_tasks/load_secrets.yml
      tags: always

    # Snapshot before the filter below overwrites it. set_fact persists for the host across
    # plays and takes precedence over the inventory var, so without this the k8s play would
    # filter the ALREADY-Docker-filtered list — on daniel-box, where every entry is k8s, that
    # is an empty list, and the play runs to completion having deployed nothing.
    - name: Preserve the unfiltered container list for the k8s play
      ansible.builtin.set_fact:
        containers_list_unfiltered: "{{ containers_list }}"
      tags: always

    # Must precede build_dep_map: a k8s-platform entry should never reach
    # dependency resolution, the dep closure, or the docker_container_info
    # state check below.
    - name: Restrict this play to Docker-platform containers
      ansible.builtin.set_fact:
        containers_list: "{{ containers_list | filter_by_platform('docker') }}"
      tags: always

    - name: Build role dependency map
      ansible.builtin.set_fact:
        _container_deps_map: "{{ containers_list | build_dep_map(playbook_dir, ansible_run_tags) }}"
      tags: always

    - name: Sort containers by dependency order
      ansible.builtin.set_fact:
        containers_list: "{{ containers_list | toposort_containers(_container_deps_map) }}"
      tags: always

    - name: Compute dependency closure for tagged containers
      ansible.builtin.set_fact:
        _deps_to_check: "{{ containers_list | dep_closure(_container_deps_map, ansible_run_tags) }}"
      when: "'all' not in ansible_run_tags"
      tags: always

    - name: Check running state of dependencies
      community.docker.docker_container_info:
        name: "{{ item.name }}"
      register: _container_state_results
      loop: "{{ _deps_to_check }}"
      ignore_errors: true
      when: "'all' not in ansible_run_tags"
      tags: always

    - name: Expand tagged deployment to include unmet dependencies
      # `selectattr('container', 'defined')` before the none-check is load-bearing, not
      # belt-and-braces: the state task above is `ignore_errors`, and a FAILED result has no
      # `container` key at all, so `rejectattr('container', 'none')` raises
      # "object of type 'dict' has no attribute 'container'" and takes the whole play down.
      #
      # It fails that way whenever community.docker cannot import its `docker`/`requests` deps
      # on the target. Running on the host itself that never happens — uv's venv supplies them
      # (repo CLAUDE.md) — but driving the play from another host over SSH selects the target's
      # SYSTEM python, which has neither. So a cross-host `-e target=` deploy died here while
      # the identical local run was fine.
      #
      # A container whose state could not be read is treated as not-running, which expands its
      # dependencies. That errs toward deploying more, and deploying an already-running
      # dependency is idempotent — the safe direction to be wrong in.
      ansible.builtin.set_fact:
        containers_list: >-
          {{
            containers_list | expand_with_deps(
              _container_deps_map,
              ansible_run_tags,
              _container_state_results.results
                | default([])
                | selectattr('container', 'defined')
                | rejectattr('container', 'none')
                | selectattr('container.State.Running', 'equalto', true)
                | map(attribute='item.name')
                | list
            )
          }}
      when: "'all' not in ansible_run_tags"
      tags: always

  tasks:
    - name: Run roles
      ansible.builtin.include_role:
        name: "{{ container_item.name }}"
        apply:
          # Effective tags default to the role name (mirrors _tags() in
          # filter_plugins/toposort.py); entries may still override with `tags:`.
          tags: "{{ container_item.tags | default([container_item.name]) }}"
      loop: "{{ containers_list }}"
      loop_control:
        loop_var: container_item
      tags: always

# Second play, not a branch inside the first: the Docker play's pre_tasks run
# docker_container_info against every dependency, which has nothing to say about a k8s
# workload and fails outright on a host with no Docker. Keeping them separate also means a
# broken k8s manifest cannot stop a Docker deploy, and vice versa.
#
# Self-guarding on hosts that run no k8s workloads: filter_by_platform returns [] there and
# the loop does nothing, so this needs no `when: inventory_hostname == ...` to skip
# daniel-server.
- name: Deploy k8s workloads
  hosts: "{{ target | default(lookup('pipe', 'hostname')) }}"
  gather_facts: true
  pre_tasks:
    - name: Load encrypted secrets and set the become password (shared preamble)
      ansible.builtin.import_tasks: pre_tasks/load_secrets.yml
      tags: always

    - name: Restrict this play to k8s-platform containers
      # No toposort here. Ordering is list order in host_vars, and it matters exactly once:
      # the traefik role installs the Traefik CRDs that every other service's IngressRoute
      # and Middleware depend on, so traefik is listed first. Three services do not justify
      # a second dependency graph; revisit if slice 2 makes the ordering non-obvious.
      # Sourced from the snapshot, NOT from containers_list — the Docker play above has already
      # overwritten that fact with its own filtered subset.
      ansible.builtin.set_fact:
        containers_list: "{{ containers_list_unfiltered | filter_by_platform('k8s') }}"
      tags: always

    - name: Create the workload namespace
      ansible.builtin.command:
        cmd: "k3s kubectl create namespace {{ k8s_namespace }} --dry-run=client -o yaml"
      register: deploy_k8s_ns_manifest
      become: true
      changed_when: false
      when: containers_list | length > 0
      tags: always

    - name: Apply the workload namespace
      ansible.builtin.command:
        cmd: k3s kubectl apply -f -
        stdin: "{{ deploy_k8s_ns_manifest.stdout }}"
      register: deploy_k8s_ns_apply
      become: true
      changed_when: "'created' in deploy_k8s_ns_apply.stdout"
      when: containers_list | length > 0
      tags: always

    - name: Start with an empty rollout queue
      # Facts persist for the host across plays and across a resumed run, so a queue left over
      # from an earlier play would be drained here against workloads this play never touched.
      ansible.builtin.set_fact:
        k8s_pending_rollouts: []
        k8s_stabilise_watch: []
      tags: always

  tasks:
    # Batched rather than one flat loop: roles/k8s/manifests no longer waits on its own rollout
    # (see tasks/k8s_rollout_drain.yml), so the batch boundary is what bounds how many workloads
    # roll at once. List order still holds within and across batches, which is what traefik's CRDs
    # and authelia's middleware depend on.
    - name: Deploy k8s workloads in batches
      ansible.builtin.include_tasks: tasks/k8s_batch.yml
      loop: "{{ containers_list | batch(k8s_rollout_batch_width | int) | list }}"
      loop_control:
        loop_var: container_batch
        label: "{{ container_batch | map(attribute='name') | join(', ') }}"
      tags: always

  post_tasks:
    # One stabilisation window for the whole play instead of one per changed service. Runs after
    # the last batch has drained, so every workload it watches has completed its rollout.
    - name: Confirm every rollout stayed healthy
      ansible.builtin.include_tasks: post_tasks/k8s_stabilise_gate.yml
      tags: always
