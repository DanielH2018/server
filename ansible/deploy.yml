---
- name: Deploy Containers
  hosts: "{{ target | default(lookup('pipe', 'hostname')) }}"
  # An escalated task imports from this tree's .venv as root, and the root-owned
  # __pycache__ that leaves behind blocks the worktree's removal. See
  # ansible/tests/deploy/test_plays_disable_bytecode_writes.py.
  environment:
    PYTHONDONTWRITEBYTECODE: "1"
  gather_facts: false
  vars:
    # Read only by the preamble's stub-file refusal. True only where this play deploys nothing
    # from a stub file: a host with no Docker entry. Read before the filter below, so it filters
    # the inventory list itself. A stubbed `-e target=daniel-pi` run stops before any Pi role.
    load_secrets_stubs_allowed: "{{ containers_list | default([]) | filter_by_platform('docker') | length == 0 }}"
  pre_tasks:
    # The preamble refuses a local-connection deploy aimed at a different host before any task
    # can write. Its comment and tests/deploy/test_local_connection_target.py carry the why.
    - name: Load encrypted secrets and set the become password (shared preamble)
      ansible.builtin.import_tasks: pre_tasks/load_secrets.yml
      tags: always

    # Snapshot before the filter below overwrites it. set_fact persists for the host across
    # plays and takes precedence over the inventory var, so without this the k8s play would
    # filter the ALREADY-Docker-filtered list — on daniel-box, where every entry is k8s, that
    # is an empty list, and the play runs to completion having deployed nothing.
    - name: Preserve the unfiltered container list for the k8s play
      ansible.builtin.set_fact:
        containers_list_unfiltered: "{{ containers_list }}"
      tags: always

    # Runs in list order, with no dependency resolution: daniel-pi is the only Docker host, and
    # its one ordering constraint (docker-proxy before autoheal) is its containers_list order.
    # ansible/tests/deploy/test_platform_filter_real_inventory.py pins that order.
    - name: Restrict this play to Docker-platform containers
      ansible.builtin.set_fact:
        containers_list: "{{ containers_list | filter_by_platform('docker') }}"
      tags: always

  tasks:
    - name: Run roles
      ansible.builtin.include_role:
        name: "{{ container_item.name }}"
        apply:
          # Effective tags default to the role name; entries may still override with `tags:`.
          tags: "{{ container_item.tags | default([container_item.name]) }}"
      loop: "{{ containers_list }}"
      loop_control:
        loop_var: container_item
      tags: always

# Second play, not a branch inside the first: the k8s play has its own ordering pre_tasks and
# batched rollout, and keeping the plays separate means a broken k8s manifest cannot stop a
# Docker deploy, and vice versa.
#
# Self-guarding on hosts that run no k8s workloads: filter_by_platform returns [] there and
# the loop does nothing, so this needs no `when: inventory_hostname == ...` to skip
# daniel-server.
- name: Deploy k8s workloads
  hosts: "{{ target | default(lookup('pipe', 'hostname')) }}"
  # An escalated task imports from this tree's .venv as root, and the root-owned
  # __pycache__ that leaves behind blocks the worktree's removal. See
  # ansible/tests/deploy/test_plays_disable_bytecode_writes.py.
  environment:
    PYTHONDONTWRITEBYTECODE: "1"
  gather_facts: false
  vars:
    # Read only by the preamble's stub-file refusal, which also requires k8s_dry_run.
    load_secrets_stubs_allowed: true
  pre_tasks:
    - name: Load encrypted secrets and set the become password (shared preamble)
      ansible.builtin.import_tasks: pre_tasks/load_secrets.yml
      tags: always

    - name: Restrict this play to k8s-platform containers
      # Sourced from the snapshot, NOT from containers_list — the Docker play above has already
      # overwritten that fact with its own filtered subset.
      ansible.builtin.set_fact:
        containers_list: "{{ containers_list_unfiltered | filter_by_platform('k8s') }}"
      tags: always

    # Toposorted rather than list order, through build_k8s_dep_map and toposort_containers in
    # filter_plugins/toposort.py. Three edges are derived, not hand-listed: traefik-CRD and
    # authelia-middleware from the role's own templates and its `use_authelia` flag, and each
    # K8S_APPLIES_LAST role (netpol-baseline) after every other entry. The edges no template
    # carries are declared as `depends_on:` on the containers_list entry in host_vars: crowdsec
    # before traefik (the LAPI machine credential), sonarr and radarr before configarr, and
    # dri-device-plugin before jellyfin and tdarr. Stable sort, so on the live inventory —
    # where every entry already sits in a valid topological order — this is a no-op (see
    # ansible/tests/deploy/test_k8s_toposort.py).
    #
    # Built from the FULL list, never a tag-narrowed one: this play applies
    # `--tags` per-role inside the batch loop below rather than narrowing containers_list
    # first, so a closure-only map would leave every role outside a tagged run's closure with
    # no traefik/authelia edge at all.
    - name: Build k8s role dependency map
      ansible.builtin.set_fact:
        _k8s_container_deps_map: "{{ containers_list | build_k8s_dep_map(playbook_dir) }}"
      tags: always

    - name: Sort k8s containers by dependency order
      ansible.builtin.set_fact:
        containers_list: "{{ containers_list | toposort_containers(_k8s_container_deps_map) }}"
      tags: always

    # No pre_task applies the `homelab` Namespace or its LimitRange. The shared kind
    # `homelab-namespace` is their only writer (D5 step 30), and a gate here on role ownership
    # would let one handback re-arm a second writer beside it. A handed-back role still deploys,
    # because Flux keeps the Namespace. ansible/tests/deploy/test_k8s_play_applies_no_namespace.py
    # holds that.
    #
    # Before the batches, so a retired service's IngressRoutes and claim are gone before any
    # role applies. Gated because it is a write, and a host with no k8s workloads has no staged
    # manifests to read. It serves only a service that was Ansible-owned on the PR's base:
    # arm 4 of scripts/validate/render_diff_gates.py refuses a flux-owned name in
    # k8s_retired_services, which retires by two PRs instead (docs/flux-deploy-plane.md,
    # *Retiring a flux-owned service*).
    - name: Tear down retired k8s services
      ansible.builtin.include_tasks: tasks/k8s_retire.yml
      loop: "{{ k8s_retired_services | default([]) }}"
      loop_control:
        loop_var: retired_service
        label: "{{ retired_service.name }}"
      when:
        - not k8s_dry_run | bool
        - containers_list | length > 0
      tags: always

    - name: Start with an empty rollout queue
      # Facts persist for the host across plays and across a resumed run, so a queue left over
      # from an earlier play would be drained here against workloads this play never touched.
      ansible.builtin.set_fact:
        k8s_pending_rollouts: []
        k8s_stabilise_watch: []
        # Same reason, and it bites harder here: a leftover entry names an image this play never
        # built, so post_tasks/k8s_image_drift_gate.yml would assert a stale digest against pods a
        # `--tags` run has no business inspecting.
        k8s_built_images: []
        # A consumer role reads this to build its own image ref. A leftover entry from an earlier
        # play names a tag the registry may no longer serve, which a `--tags` run that skips the
        # building role would then render into a manifest and fail to pull.
        k8s_built_image_tags: {}
      tags: always

  tasks:
    # Batched rather than one flat loop: roles/k8s/manifests does not wait on its own rollout
    # (see roles/k8s/manifests/tasks/drain.yml), so the batch boundary is what bounds how many workloads
    # roll at once. The toposorted order from the pre_tasks above still holds within and across
    # batches, which is what traefik's CRDs and authelia's middleware depend on.
    #
    # `ansible_owned` drops an entry that carries `owner` (Flux applies it, or a handback has
    # released it) here and not in the containers_list fact above: templates read that fact, and
    # pihole and uptime-kuma read it through hostvars, so an entry Ansible skips still has to be
    # visible to them. docs/target-architecture/deploy/d2-first-leaf.md has the ownership flag.
    - name: Deploy k8s workloads in batches
      ansible.builtin.include_tasks: tasks/k8s_batch.yml
      loop: "{{ containers_list | ansible_owned | batch(k8s_rollout_batch_width | int) | list }}"
      loop_control:
        loop_var: container_batch
        label: "{{ container_batch | map(attribute='name') | join(', ') }}"
      tags: always

  post_tasks:
    # One stabilisation window for the whole play instead of one per changed service. Runs after
    # the last batch has drained, so every workload it watches has completed its rollout.
    - name: Confirm every rollout stayed healthy
      ansible.builtin.include_tasks: post_tasks/k8s_stabilise_gate.yml
      tags: always

    # AFTER the stabilisation gate, not before: it compares running pods against the registry, and
    # a pod that is still being replaced has not finished resolving its image. The two gates ask
    # different questions — that one asks whether the rollout stayed up, this one asks whether a
    # rollout happened at all.
    - name: Confirm every built image actually reached a pod
      ansible.builtin.include_tasks: post_tasks/k8s_image_drift_gate.yml
      tags: always
