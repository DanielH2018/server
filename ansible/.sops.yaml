---
# SOPS encryption config — the age recipients that ansible/vars/secrets.yml (and any
# .yml/.yaml under vars/ or secrets/) is encrypted to. These are PUBLIC age keys, not
# secret, so this file is tracked. SOPS searches upward from the encrypted file, so this
# (ansible/.sops.yaml) is the config used for ansible/vars/secrets.yml — keep it here, not
# at the repo root. Private keys live only at ~/.config/sops/age/keys.txt per host and are
# never committed (see .gitignore keys.txt/*.agekey/*.key rules + the gitleaks hook).
#
# Multi-recipient is OR: ANY listed key decrypts the WHOLE file. Every host that must
# decrypt secrets needs a private key matching a recipient below.
#
# Add a host (e.g. the Pi):
#   1. On that host:  ansible-playbook ansible/bootstrap.yml --limit <host>
#      (generates the host's own age key, prints its PUBLIC key — no secret needed).
#   2. Append the printed pubkey to the comma-separated `age:` string below — it is ONE quoted
#      scalar, not a YAML list, so a per-key trailing comment is impossible; extend the
#      position->host note above it instead.
#   3. On a host that can already decrypt (daniel-server):
#        sops updatekeys ansible/vars/secrets.yml
#      then commit the re-encrypted secrets.yml + this file, and `git pull` on the host.
# Remove a host's access the same way: delete its key here, re-run `sops updatekeys`.
creation_rules:
  # STAGING FIRST, and the order is the entire mechanism. SOPS applies the FIRST matching rule,
  # and the production rule below matches `vars/secrets-staging.yml` by path just as well. With
  # these two swapped, a `sops` create encrypts the staging file to all four production
  # recipients — the exact opposite of what this rule exists to do, and silently.
  # ENFORCED by ansible/tests/test_sops_staging_rule.py.
  #
  # DECIDED: daniel-server's key ALONE — not daniel-box's, and not the off-box recovery key.
  # `pre_tasks/load_secrets.yml` decrypts with `delegate_to: localhost`, so the CONTROLLER
  # decrypts, and daniel-server is the only host that can route to the staging guest
  # (docs/staging-cluster.md, Decision 2). No recovery key because there is nothing to recover:
  # staging holds generated values and no real credential, so a lost key means regenerate.
  #
  # Not tracked by scripts/secrets_mgmt/secret_rotation.py, which hardcodes secrets.yml. Also
  # deliberate — a rotation schedule over disposable fake values is noise, not coverage.
  - path_regex: vars/secrets-staging\.ya?ml$
    age: "age1shgt54wq7y9pk4nksxcfr5s539rh2g5uqkh9t2jlx6wj4a8aq34q4cyg7k"
  - path_regex: .*(vars|secrets)\/.*\.ya?ml$
    # Recipients (multi-recipient = OR; ANY one key decrypts the whole file).
    # First key = daniel-server, second = daniel-pi, third = OFF-BOX RECOVERY key
    # (private half lives only in the operator's password manager, added 2026-06-11 —
    # the DR escape hatch if both hosts' ~/.config/sops/age/keys.txt are lost),
    # fourth = daniel-box (added 2026-08-01 during its bring-up; appended rather than
    # inserted so the three existing positions above stay put).
    age: "age1shgt54wq7y9pk4nksxcfr5s539rh2g5uqkh9t2jlx6wj4a8aq34q4cyg7k,age1934n4c4xe4rfnpczex2nkr4nlc3c820yu47ehyt6adljx5wmk58sspvpyf,age1nplxuas350e777k3cqvfe8v2tccm8t7rqh66t7z692f6zyt9ra2svwfeyp,age1h29wmm6fa9zfq3ld72l4efen3fwf59s9xxyzva8xqulzp997td0qpwsjc4"
