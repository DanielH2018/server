---
# Shared SOPS secret-load preamble, imported under `pre_tasks:` by deploy.yml + initial_setup.yml.
# MUST be pre_tasks, not tasks: a play runs pre_tasks -> roles -> tasks, so under `tasks:` this would
# load AFTER the roles and any role templating a secret (e.g. gitops_deploy's config.env) would see
# it undefined. `become: false` on all three: initial_setup.yml sets play-level `become: true` and
# would otherwise escalate at secret-load — before the become password is known, forcing
# --ask-become-pass on a passworded-sudo host; it's a no-op for deploy.yml (no play-level become).
# Fails on a host not yet onboarded to SOPS (no age key / community.sops collection) — run
# ansible/bootstrap.yml first to break that chicken-and-egg. See bootstrap.yml header.
#
# WHICH file is a per-host decision (`secrets_file`), and the assert below is what makes that safe.
# `load_vars` runs `run_once: true`, so it resolves `secrets_file` for whichever host Ansible
# happens to reach first and then applies that ONE file to the whole play. Every play in this repo
# is single-host today — `hosts:` is a literal or `{{ target | default(hostname) }}` — but `target`
# takes a group as readily as a host name, so `-e target=homeservers` is one flag away from a play
# spanning daniel-stage and production. Getting that wrong in the dangerous direction puts every
# production credential in scope on the host whose stated purpose is being broken
# (docs/staging-cluster.md, Decision 5). Failing loudly is the only safe reading of a mixed play.
# ENFORCED by ansible/tests/test_load_secrets_by_host.py.
- name: Refuse to load secrets for a play whose hosts disagree on which file to load
  ansible.builtin.assert:
    that: ansible_play_hosts_all | map('extract', hostvars, 'secrets_file') | unique | length == 1
    fail_msg: >-
      This play spans hosts with different `secrets_file` values
      ({{ ansible_play_hosts_all | map('extract', hostvars, 'secrets_file') | unique | list }}),
      and the secret load is `run_once`, so ONE of them would silently apply to all of them.
      Run the play once per group instead — a staging host and a production host cannot share
      a secret load.
  run_once: true # noqa run-once[task]
  become: false
  tags: always

- name: Load encrypted secrets
  community.sops.load_vars:
    file: "{{ secrets_file }}"
  delegate_to: localhost
  run_once: true # noqa run-once[task]
  become: false
  tags: always

- name: Use the SOPS-stored sudo password for privilege escalation
  ansible.builtin.set_fact:
    ansible_become_password: "{{ become_password }}"
  no_log: true
  become: false
  when: become_password is defined
  tags: always
