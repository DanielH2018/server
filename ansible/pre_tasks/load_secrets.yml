---
# Shared SOPS secret-load preamble, imported under `pre_tasks:` by every playbook that reads a secret.
# MUST be pre_tasks, not tasks: a play runs pre_tasks -> roles -> tasks, so under `tasks:` this would
# load AFTER the roles and any role templating a secret (e.g. gitops_deploy's config.env) would see
# it undefined. `become: false` on the first three: initial_setup.yml sets play-level `become: true`
# and would otherwise escalate at secret-load — before the become password is known, forcing
# --ask-become-pass on a passworded-sudo host; it's a no-op for deploy.yml (no play-level become).
#
# The last task gathers facts, so every importing play sets `gather_facts: false` and opens the
# same way. A play that needs no facts opts out with `load_secrets_gather_facts: false` in its
# `vars:`. ENFORCED by ansible/tests/deploy/test_playbooks_gather_through_the_preamble.py.
# Fails on a host not yet onboarded to SOPS (no age key / community.sops collection) — run
# ansible/bootstrap.yml first to break that chicken-and-egg. See bootstrap.yml header.
#
# The assert below checks WHICH MACHINE runs the play. Both cluster nodes are pinned
# `ansible_connection=local` (inventory/hosts.ini), so `-e target=<host>`
# selects that host's VARIABLES while every task still executes on the machine you typed the
# command on. Selection and execution are separate, and only the first is what `target` controls.
# The recap then reads green for a play that touched the wrong host.
#
# For example, `initial_setup.yml --tags setup_drift -e target=daniel-server`, run from
# daniel-box, writes the whole setup-drift reader onto daniel-box and exits 0, leaving
# daniel-server with none of the three artifacts. This is not specific to that role — nut_host is gated to
# `ups_host: daniel-server`, so the same invocation installs the UPS shutdown chain on the host
# that is not attached to the UPS.
#
# Where reaching another machine IS intended, the repo already overrides the connection at the
# play: k3s-bringup.yml's agent-join play sets `ansible_connection: ssh` in its `vars:`. This
# assert reads that override, so it passes there and fails only where the override is absent.
# ENFORCED by ansible/tests/deploy/test_local_connection_target.py.
- name: Refuse to run a local-connection host's play from a different machine
  ansible.builtin.assert:
    that: >-
      (ansible_connection | default('ssh')) != 'local'
      or inventory_hostname == lookup('pipe', 'hostname')
    fail_msg: >-
      This play targets {{ inventory_hostname }}, which is pinned `ansible_connection=local`,
      but it is running on {{ lookup('pipe', 'hostname') }}. Every task would execute HERE while
      reporting {{ inventory_hostname }} — a green recap for a play that touched the wrong host.
      Run it on {{ inventory_hostname }} itself, or set `ansible_connection: ssh` in the play's
      `vars:` the way k3s-bringup.yml's agent-join play does.
  become: false
  tags: always

# The next two asserts keep a secret stub file (`scripts/renderer/shadow_diff.py stubs`, target
# slice R1) inside a k8s dry run. A stub file reaching a real run would apply placeholder
# credentials, so the refusal sits here: every playbook that reads a secret imports this file,
# and it runs before any role, ahead of image-builder's build, crowdsec's machine registration
# and every other task that could send a stub to a live system. A refusal later in the play
# would run after them. `docs/homelab-render.md` has the operator's view.
#
# Both run on a STUB RUN: the sentinel `homelab_secret_stubs` is true, or any secret key already
# resolves to its stub form. They read before the SOPS load below, so on a run with no stub file
# no key is defined yet and the trigger is false. The second half catches a stub file whose
# sentinel was stripped. The key names come from the ciphertext `secrets.yml`; only its keys are
# read, so nothing is decrypted.
#
# The shared names live in task `vars:`, never in a set_fact. A fact set here would persist into
# deploy.yml's second play, and an extra var of the same name would outrank it.
# ENFORCED by ansible/tests/deploy/test_load_secrets_refuses_stub_files.py.
- name: Refuse a secret stub file outside a k8s dry run
  # Only deploy.yml sets `load_secrets_stubs_allowed`: true in its k8s play, and in its Docker
  # play true only where the host's containers_list holds no Docker entry. Any other playbook,
  # or deploy.yml aimed at daniel-pi, stops here even with `-e k8s_dry_run=true`.
  # It also requires the sentinel. Role tasks that must not send a stub to a live system skip
  # on `homelab_secret_stubs` (sonarr's API reads), so a stub file stripped of its sentinel is
  # refused here rather than left to run them.
  ansible.builtin.assert:
    that: >-
      not (
        (homelab_secret_stubs | default(false) | bool)
        or (load_secrets_stub_keys | homelab_unstubbed_keys(load_secrets_stub_values) | length)
          < (load_secrets_stub_keys | length)
      )
      or (
        (k8s_dry_run | default(false) | bool)
        and (load_secrets_stubs_allowed | default(false) | bool)
        and (homelab_secret_stubs | default(false) | bool)
      )
    fail_msg: >-
      A secret stub file was passed to a run that is not a k8s dry run of deploy.yml, or one
      whose `homelab_secret_stubs: true` sentinel is missing. Stub values are placeholders, and
      a real run would apply them. Pass the stub file that `shadow_diff.py stubs` writes, whole,
      only to `deploy.sh --dry-run` on a host whose containers_list holds no Docker entry.
  vars: &load_secrets_stub_vars
    load_secrets_stub_keys: >-
      {{ lookup('ansible.builtin.file', playbook_dir ~ '/vars/secrets.yml') | from_yaml
      | homelab_stub_keys }}
    # '' for an undefined key, which is never a stub, so it counts as unstubbed.
    load_secrets_stub_values: "{{ query('ansible.builtin.vars', *load_secrets_stub_keys, default='') }}"
  become: false
  tags: always

- name: Refuse a stub file that does not stub every key
  # Every value this sees is a stub from the extra-vars file or undefined, because the SOPS load
  # has not run, and the message names keys only. Extra vars outrank what load_vars loads, so a
  # key stubbed here stays stubbed after it. A stub file written before `/add-secret` added a
  # key fails here and names that key. The manifests role repeats the check rather than
  # trusting a flag from this task, which is why it sets none.
  ansible.builtin.assert:
    that: >-
      not (
        (homelab_secret_stubs | default(false) | bool)
        or (load_secrets_stub_keys | homelab_unstubbed_keys(load_secrets_stub_values) | length)
          < (load_secrets_stub_keys | length)
      )
      or (load_secrets_stub_keys | homelab_unstubbed_keys(load_secrets_stub_values) | length) == 0
    fail_msg: >-
      The secret stub file does not stub these keys:
      {{ load_secrets_stub_keys | homelab_unstubbed_keys(load_secrets_stub_values) | join(', ') }}.
      Rewrite it with `uv run python scripts/renderer/shadow_diff.py stubs` from this tree.
  vars: *load_secrets_stub_vars
  become: false
  tags: always

- name: Load encrypted secrets
  community.sops.load_vars:
    file: secrets.yml
  delegate_to: localhost
  run_once: true # noqa run-once[task]
  become: false
  tags: always

- name: Use the SOPS-stored sudo password for privilege escalation
  ansible.builtin.set_fact:
    ansible_become_password: "{{ become_password }}"
  no_log: true
  become: false
  when: become_password is defined
  tags: always

# Deliberately no `become: false`: the gather inherits the play's become, so a play with
# play-level `become: true` gathers escalated, after the task above set the become password.
# With `gather_facts: true` such a play escalated at fact-gathering, before this file ran, and a
# passworded-sudo host (daniel-server) needed --ask-become-pass.
- name: Gather facts (after the become password is set)
  ansible.builtin.setup:
  when: load_secrets_gather_facts | default(true) | bool
  tags: always
