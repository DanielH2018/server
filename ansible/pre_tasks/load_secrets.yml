---
# Shared SOPS secret-load preamble, imported under `pre_tasks:` by every playbook that reads a secret.
# MUST be pre_tasks, not tasks: a play runs pre_tasks -> roles -> tasks, so under `tasks:` this would
# load AFTER the roles and any role templating a secret (e.g. gitops_deploy's config.env) would see
# it undefined. `become: false` on the first three: initial_setup.yml sets play-level `become: true`
# and would otherwise escalate at secret-load — before the become password is known, forcing
# --ask-become-pass on a passworded-sudo host; it's a no-op for deploy.yml (no play-level become).
#
# The last task gathers facts, so every importing play sets `gather_facts: false` and opens the
# same way. A play that needs no facts opts out with `load_secrets_gather_facts: false` in its
# `vars:`. ENFORCED by ansible/tests/deploy/test_playbooks_gather_through_the_preamble.py.
# Fails on a host not yet onboarded to SOPS (no age key / community.sops collection) — run
# ansible/bootstrap.yml first to break that chicken-and-egg. See bootstrap.yml header.
#
# The assert below checks WHICH MACHINE runs the play. Both cluster nodes are pinned
# `ansible_connection=local` (inventory/hosts.ini), so `-e target=<host>`
# selects that host's VARIABLES while every task still executes on the machine you typed the
# command on. Selection and execution are separate, and only the first is what `target` controls.
# The recap then reads green for a play that touched the wrong host.
#
# For example, `initial_setup.yml --tags setup_drift -e target=daniel-server`, run from
# daniel-box, writes the whole setup-drift reader onto daniel-box and exits 0, leaving
# daniel-server with none of the three artifacts. This is not specific to that role — nut_host is gated to
# `ups_host: daniel-server`, so the same invocation installs the UPS shutdown chain on the host
# that is not attached to the UPS.
#
# Where reaching another machine IS intended, the repo already overrides the connection at the
# play: k3s-bringup.yml's agent-join play sets `ansible_connection: ssh` in its `vars:`. This
# assert reads that override, so it passes there and fails only where the override is absent.
# ENFORCED by ansible/tests/deploy/test_local_connection_target.py.
- name: Refuse to run a local-connection host's play from a different machine
  ansible.builtin.assert:
    that: >-
      (ansible_connection | default('ssh')) != 'local'
      or inventory_hostname == lookup('pipe', 'hostname')
    fail_msg: >-
      This play targets {{ inventory_hostname }}, which is pinned `ansible_connection=local`,
      but it is running on {{ lookup('pipe', 'hostname') }}. Every task would execute HERE while
      reporting {{ inventory_hostname }} — a green recap for a play that touched the wrong host.
      Run it on {{ inventory_hostname }} itself, or set `ansible_connection: ssh` in the play's
      `vars:` the way k3s-bringup.yml's agent-join play does.
  become: false
  tags: always

- name: Load encrypted secrets
  community.sops.load_vars:
    file: secrets.yml
  delegate_to: localhost
  run_once: true # noqa run-once[task]
  become: false
  tags: always

- name: Use the SOPS-stored sudo password for privilege escalation
  ansible.builtin.set_fact:
    ansible_become_password: "{{ become_password }}"
  no_log: true
  become: false
  when: become_password is defined
  tags: always

# Deliberately no `become: false`: the gather inherits the play's become, so a play with
# play-level `become: true` gathers escalated, after the task above set the become password.
# With `gather_facts: true` such a play escalated at fact-gathering, before this file ran, and a
# passworded-sudo host (daniel-server) needed --ask-become-pass.
- name: Gather facts (after the become password is set)
  ansible.builtin.setup:
  when: load_secrets_gather_facts | default(true) | bool
  tags: always
