  - "103.21.244.0/22"
  - "103.22.200.0/22"
  - "103.31.4.0/22"
  - "104.16.0.0/13"
  - "104.24.0.0/14"
  - "108.162.192.0/18"
  - "131.0.72.0/22"
  - "141.101.64.0/18"
  - "162.158.0.0/15"
  - "172.64.0.0/13"
  - "188.114.96.0/20"
  - "190.93.240.0/20"
  - "197.234.240.0/22"
  - "198.41.128.0/17"
  - "2400:cb00::/32"
  - "2606:4700::/32"
  - "2803:f800::/32"
  - "2405:b500::/32"
  - "2405:8100::/32"
  - "2a06:98c0::/29"
  - "2c0f:f248::/32"

# Exact patch, not `3.14`. uv resolves a bare minor to whatever it already has, so two hosts
# drift apart with nothing asking for either. Eighteen host scripts run on this and must be the
# same interpreter on both machines. The minor must track
# .python-version — ansible/tests/setup/test_host_python_pin.py enforces both halves.
host_python_version: "3.14.6"

# The git-tree lock (ADR-0011, ADR-0017): every job that mutates or snapshots the primary
# checkout takes it. Host templates read this var, and Python reads `deploy_locks.TREE_LOCK`
# in the gitops_deploy role's files/. Those are the only two definitions of the path, and
# ansible/tests/deploy/test_tree_lock_single_definition.py holds them equal (#3276).
server_git_tree_lock: /var/lock/server-git-tree.lock

# Linux Vars
sys_user: ubuntu
tz: America/Chicago
puid: 1000
pgid: 1000
# Apt origins unattended-upgrades may install from, BEYOND the security pockets the distro's
# 50unattended-upgrades already allows (`${distro_id}:${distro_codename}`, `-security`, and the
# two ESM pockets). Rendered into 52unattended-upgrades-local as `Origins-Pattern::` entries,
# which APPEND to the distro's list rather than displacing it.
#
# Every entry MUST use the `key=value,key=value` form, never the legacy `origin:archive` form
# that 50unattended-upgrades uses. unattended-upgrade rewrites a legacy entry to `o=X,a=Y`
# (see get_allowed_origins_legacy in /usr/bin/unattended-upgrade), so it can only ever match a
# repo that publishes a `Suite:` field. The GitHub CLI repo does not: measured via python-apt,
# its package file reads origin='gh', archive='', codename='stable'.
# `gh:stable` therefore matched nothing and upgraded nothing while reading as configured — it
# shipped that way in 2fc0b537 and this is the fix. ENFORCED by
# ansible/tests/setup/test_unattended_origins_pattern.py.
#
# `origin=Ubuntu,archive=<codename>-updates` is the non-security pocket the login MOTD counts
# as "N updates can be applied immediately". Without it those sit unapplied. Kernel upgrades
# land here, and Automatic-Reboot stays false — the Sunday 07:30 restart cron takes them.
#
# `origin=gh,codename=stable` is the GitHub CLI's own repo. Third-party origins are opt-in one
# at a time, never wildcarded. Note the Pi's Docker repo is deliberately NOT here: a docker-ce
# upgrade restarts the daemon, and nothing should do that unattended.
#
# Set to [] on a host to revert that host to security-only.
unattended_upgrades_origins_patterns:
  - "origin=${distro_id},archive=${distro_codename}-updates"
  - "origin=gh,codename=stable"
# Docker
docker_network: proxy
# Intel iGPU/QuickSync passthrough (jellyfin/tdarr hardware transcode via /dev/dri).
# False by default — override to true in a host's host_vars if the machine has one.
has_igpu: false
# ── Host hardware capability flags ─────────────────────────────────────────────────
# Each names ONE hardware fact that a task in roles/setup/initial_setup gates on. They
# replace `inventory_hostname == '<host>'` literals, so replacing a machine is a host_vars
# edit rather than a sweep through three task files.
#
# They live here rather than in the role's defaults for the reason `ops_cron_host` gives
# below: `scripts/deploy_tools/land_reach.py:_eval_when` resolves a gate against
# `group_vars/all.yml` + `host_vars` only, and a name it cannot resolve reads as "every
# host" — an over-broad verdict.
#
# ENFORCED by ansible/tests/setup/test_initial_setup_host_gates.py, which censuses the gates
# and asserts each flag's effective value on all three hosts.
#
# Whether this host's board has so little RAM that a heavy apt step OOM-kills without a
# disk-backed swapfile. False by default; daniel-pi (a 512 MB Zero 2 W) overrides it true.
# Gates initial_setup's swapfile + watchdog-stop preamble and the apt-show-versions purge.
has_low_memory_board: false
# Whether this host boots a Raspberry Pi kernel, so it needs the `linux-raspi` package.
# Separate from the flag above on purpose: "is a Pi board" and "is memory-constrained" are
# two facts, and a 4 GB Pi would carry this one alone.
has_raspi_kernel: false
# Whether this host has enough RAM that reclaiming page cache beats swapping service heaps,
# so initial_setup lowers vm.swappiness to 10. False by default; daniel-server (30 GB) and
# daniel-box (28 GiB, the control plane) override it true.
has_ample_ram: false
# AutoKuma id of the managed notification provider (a static entity defined in the
# uptime-kuma role); the kuma() macro links every monitor to it via notification_name_list.
kuma_notification_id: discord
# Uptime Kuma "docker host" id referenced by AutoKuma docker monitors; the same id on
# every host so far, so it lives here — override per-host if one ever diverges.
kuma_docker_host: 1
# Docker-type monitors are retired fleet-wide: the kuma() macro suppresses its docker branch
# and the per-container tiles are superseded by the `docker-fleet` push check (uptime-kuma
# role's host cron). Cluster-side AutoKuma cannot reach the private docker-proxy socket
# anyway. Flip back to true to restore every docker monitor unchanged — AutoKuma recreates
# them from the labels, but history does not survive the round-trip.
kuma_docker_monitors: false
# Physical LAN subnet, narrow /24 (not the broader RFC1918 range — see traefik's trustedIPs
# comment for why that distinction matters). Same for every host so far; override per-host
# if a new host sits on a different LAN.
lan_subnet: "10.0.0.0/24"
# The LAN's default gateway. It is also the LAN's DHCP server, so it is the only host that
# knows the names of the devices it leased addresses to — Pi-hole's dnsmasq config forwards
# the LAN reverse zone here so PTR lookups return those names instead of nothing. Verified
# against the live router: `dig -x 10.0.0.1 @10.0.0.1` answers `Docsis-Gateway`.
lan_router_ip: "10.0.0.1"
# The production cluster's pod and Service ranges — k3s's defaults, which this cluster has
# never overridden. Global rather than k3s role defaults because the consumer is the
# hypervisor role on daniel-server: the staging guest's egress fence has to name them, and a
# role's defaults are not visible to a different role in a different playbook.
#
# Anything reachable in these two ranges is reachable from the staging guest unless the fence
# names them, and that includes prod's Longhorn API, which is unauthenticated and carries a
# mutating `diskUpdate` action. lan_subnet alone does not cover it — a ClusterIP is not on the
# LAN.
k3s_pod_cidr: "10.42.0.0/16"
k3s_service_cidr: "10.43.0.0/16"
# The two k3s nodes' cni0 bridge gateway addresses, verified per node with
# `ip -4 -o addr show cni0`. Global rather than netpol-baseline's role default because a
# second role (loki-homelab's monitoring route) also has to admit exactly these two
# addresses, and role defaults are not visible to a different role. netpol_baseline_node_cidrs
# (netpol-baseline/defaults/main.yml) reads this rather than repeating the literals.
k3s_cni0_gateways:
  - 10.42.0.1/32
  - 10.42.1.1/32
# DECIDED: cni0 alone, for netpol_baseline_node_cidrs. The censused host caller has a fallback.
# `netpol_baseline_node_cidrs` reads the pair above and NOT the flannel pair below, deliberately.
# A host process reaching a baseline-selected pod on the other node is denied — measured
# 2026-09-10 (#1725) with the pod's node as the only variable: from daniel-box, sonarr's
# ClusterIP (pod on daniel-box) answered 200 while prowlarr's (pod on daniel-server) timed out,
# and from daniel-server the two verdicts swapped. The census found ONE host caller of that
# shape, `get_via_service()` in scripts/diagnostics/postflight.py, and it already falls back to
# the workload's Traefik route when the ClusterIP does not answer (#1633) — which is why the
# *arr `-monitoring` routes had to admit the flannel pair in #1697. Traefik itself is immune: its
# policy's first ingress rule carries ports 8000/8443 with no `from:`, so the three host crons
# that dial it are unaffected by this list. Adding the flannel pair here would re-scope every pod
# the namespace-scoped baseline selects, to buy a fast path that already has a working fallback.
# Contradict this with a NAMED host caller that has no route fallback.
# The two nodes' flannel.1 VXLAN addresses — the OTHER source a host process can arrive as.
# Which of the two sets a host request carries depends on where the traefik pod sits: traffic
# to a pod on the SAME node leaves via cni0 and arrives as that node's cni0 gateway above,
# while traffic to a pod on the OTHER node crosses the overlay and arrives as the sending
# node's flannel.1 address. Traefik is pinned to daniel-box, so daniel-box arrives as
# 10.42.0.1 and daniel-server as 10.42.1.0 — measured 2026-09-10 (#1693): from a
# daniel-server shell `ip route get` to a daniel-box pod reads `src 10.42.1.0`, and the same
# day's #1683 measurement read `ClientHost: 10.42.1.0` off Traefik's access log.
#
# Separate from k3s_cni0_gateways rather than merged into it: netpol-baseline reads that
# variable for 16 workloads' NetworkPolicies, and admitting the overlay addresses to a route
# must not silently widen those. A route with ANY host-process caller reads both lists: the
# cni0 pair alone matches only while traefik happens to sit on the caller's node, and nothing
# ties the traefik nodeSelector to a route's grants (#1697). loki-homelab's read route and the
# three *arr `-monitoring` routes are the readers, and each is guarded by a test in
# ansible/tests/k8s/.
#
# Verified per node with `ip -4 -o addr show flannel.1` (daniel-box: 10.42.0.0,
# daniel-server: 10.42.1.0).
k3s_flannel_node_ips:
  - 10.42.0.0/32
  - 10.42.1.0/32
# wg-easy v15 picks its own client pool internally (no WG_DEFAULT_ADDRESS env in this
# deploy) rather than Ansible assigning it, so this isn't a Service/Deployment input —
# it exists purely so the comments that describe wg-easy's client range (traefik's
# trustedIPs note, authelia's bypass policy, docker_install's bridge-carve-out) cite one
# name instead of repeating the literal.
wg_client_subnet: "10.8.0.0/24"
# code-server's read-only docker-proxy is gated on this host_var, not containers_list (a
# tagged `deploy.yml --tags docker-proxy` set_facts containers_list to the filtered
# dependency closure, which would drop code-server and render False). Override per-host.
has_code_server: false
# The k3s cluster's ingress VIP, served by MetalLB from a dedicated autoAssign: false pool.
# Global rather than a k3s role default because two hosts consume it: daniel-box's k8s
# Traefik Service claims it, and Pi-hole answers the cluster hostnames with it.
k3s_metallb_ingress_vip: 10.0.0.240
# The cluster MQTT broker's pinned LoadBalancer VIP. Global for the same two-hosts reason.
# MQTT is raw TCP — this VIP, not a Traefik hostname, is how it crosses hosts.
mqtt_k8s_vip: 10.0.0.242
# The cluster Pi-hole's pinned LAN DNS VIP. Global for the same two-hosts reason —
# daniel-box's pihole-dns Service claims it, and wg-easy's WG_DEFAULT_DNS points here.
dns_k8s_vip: 10.0.0.243
# The same Service's ClusterIP, pinned. Global because two roles need it and neither owns
# the other: roles/k8s/pihole claims it on the Service, and roles/setup/k3s names it in the
# CoreDNS Corefile so cluster DNS forwards to Pi-hole first. Cluster DNS uses this rather
# than the VIP above because kube-proxy reaches either Pi-hole pod through a ClusterIP,
# where the LoadBalancer's externalTrafficPolicy: Local blackholes traffic the MetalLB
# announcer would have to forward to another node.
dns_k8s_cluster_ip: 10.43.252.187
# Jellyfin's dedicated LAN LoadBalancer VIP — a second path distinct from the Traefik
# ingress VIP. Global for the same cross-role reason: roles/k8s/jellyfin's service-lan
# claims it, and roles/k8s/uptime-kuma's VIP port tile probes it.
jellyfin_k8s_lan_ip: 10.0.0.241
# The terraria server's replica count. Global because two roles render it and neither owns
# the other: roles/k8s/terraria's Deployment IS the server, and roles/k8s/game-stats'
# terraria-stats exporter only has a console to tail while the server is up. Role defaults
# are invisible across roles, so a `terraria_k8s_replicas | default(1)` written in game-stats
# would render 1 forever and never say so.
#
# Scaled to zero on operator request — the server is not wanted up, and on 1.4.5.7 it cannot
# stay up while anything opens a TCP connection to it (issue #822).
#
# Declarative rather than a live `kubectl scale`, for two reasons. The next
# `./scripts/deploy.sh --tags terraria` re-applies that Deployment and would reset a live scale
# back to 1; and the read-only ServiceAccount cannot scale anything anyway, so Ansible is the
# only write path. `session-health.py`'s `_is_scaled_to_zero` already reads a deliberate
# `spec.replicas: 0` as intentional rather than as an outage, so the SessionStart banner stays
# quiet without a suppression list.
#
# This is NOT covered by test_every_snapshot_role_restores_its_own_replicas, which requires
# `replicas >= 1`: that guard reads roles declaring `k8s_autodeploy_snapshot_pvcs`, and terraria
# declares none. If terraria ever opts into pre-deploy snapshots, this zero and that guard
# collide, and the guard is the one that is right.
#
# Three renders follow this value, and all three must move together — the server Deployment,
# the terraria-stats Deployment, and observability's `terraria-stats` Prometheus scrape job,
# which is gated on it because a job whose target has no pod pages the scrape-target check.
#
# To bring it back, see the restore checklist on issue #822. Setting this to 1 is the first of
# two steps and the port monitor is deliberately NOT the second — do not restore the Kuma tile
# until the image is past 1.4.5.7.
terraria_k8s_replicas: 0
# Shared between roles/k8s/crowdsec (the engine that runs LAPI+AppSec) and roles/k8s/traefik
# (the bouncer plugin middleware + the log-tailing agent sidecar). Cross-role, and role
# defaults are invisible across roles.
crowdsec_k8s_image: crowdsecurity/crowdsec:v1.8.1
crowdsec_k8s_agent_username: k8s-traefik-agent
# The authelia pod's agent sidecar. Here, not in the authelia role's defaults, because the
# k8s/crowdsec role registers the machine and only group_vars crosses that boundary.
crowdsec_k8s_authelia_agent_machine: k8s-authelia-agent
crowdsec_k8s_lapi_port: 8080
crowdsec_k8s_appsec_port: 7422
# SLZB-06M Zigbee coordinator (network-attached) + pinned Zigbee PAN identity. pan_id and
# ext_pan_id are network identifiers, not secrets, and are fixed so a templated-config
# redeploy never regenerates the mesh; the matching network_key IS sensitive and lives in
# SOPS as zigbee_network_key.
slzb_ip: 10.0.0.127
zigbee_pan_id: 6754
zigbee_ext_pan_id: [221, 187, 17, 34, 51, 68, 85, 102]
# Every service answers on its plain name: `hostname:` in host_vars is the whole story, and no
# hostname-suffix variable exists.
#
# Namespace every workload lands in. One namespace rather than one per service: Traefik
# Middleware references are namespace-scoped, and cross-namespace references would cost a
# qualified name on every route that follows, for no isolation this homelab needs.
k8s_namespace: homelab

# The cluster's k3s server / control-plane node. Every nodeSelector pin, node-affinity
# preference and `hostvars[...]` lookup that means "this cluster's primary node" reads this
# rather than the literal hostname, so a second cluster can be deployed to from the same
# source. Prod resolves it to daniel-box; a single-node staging cluster resolves it to its
# own node. See docs/archive/staging-cluster.md, Decision 7.
#
# NOT a statement about WHY any given workload is pinned — the reasons differ (VIP
# announcement, hostPath locality, registry loopback) and are recorded at each pin. This
# variable only answers "which node is the primary one here".
k8s_primary_node: daniel-box

# Hosts k3s-bringup.yml will install a k3s SERVER on. One entry: daniel-box is prod's control
# plane. daniel-server is deliberately absent —
# it is an agent in prod's cluster, and installing a server there would give one node two
# control planes.
#
# An allowlist rather than a denylist, so a host nobody thought about is refused rather than
# admitted. ENFORCED by ansible/tests/setup/test_k3s_server_hosts.py.
k3s_server_hosts:
  - daniel-box

# Hosts that render setup-plane templates but run NO manifest-prune-check, so nothing there can
# report a stale render. That check is installed by roles/setup/k3s/tasks/health-crons.yml,
# imported only from that role's main.yml, which k3s-bringup.yml asserts onto k3s_server_hosts —
# so it exists on daniel-box alone, while daniel-server renders the entire UPS shutdown chain.
#
# An allowlist for the same reason as k3s_server_hosts above, though the failure directions
# differ: naming a host that already runs manifest-prune-check gives it a second, redundant
# reader, while forgetting one leaves it unwatched. Redundancy is the safe direction, so a host
# in doubt belongs here. daniel-pi is deliberately absent — it renders setup templates
# (optimize_pi) but stamps none, so a reader there would report only that it is unarmed.
# ENFORCED by ansible/tests/deploy/test_setup_drift_check.py.
setup_drift_check_hosts:
  - daniel-server

# Hosts that witness the Loki read route, one Kuma monitor each. That route's only
# caller is `probe.py loki-labels` / `loki-query` running as a HOST process, and its guard is a
# ClientIP set of node-owned addresses — so a pod cannot witness it, and a single host cannot
# either: which address a host arrives as depends on where the traefik pod sits, so the route
# can be dead from one node and reachable from the other.
#
# Both prod cluster nodes and nothing else. daniel-pi is not in the ClientIP set at all. An
# allowlist for the same reason as k3s_server_hosts above. ENFORCED by
# ansible/tests/setup/test_loki_route_witness.py.
loki_route_witness_hosts:
  - daniel-box
  - daniel-server

# The endpoints the host crons probe to tell "this house's link is gone" from "the source I asked
# refused me". Read by `wan_reachable` in kuma-push-lib.sh, which is the host-side
# peer of monitor-bridge's `wan_reachable` gate — that gate runs in the bridge's loop and cannot
# reach a cron pushing its own tile from the host.
#
# Two independent providers, by hostname, never an anycast IP. The reasoning is
# `ansible/roles/k8s/monitor-bridge/files/checks/wan.py`'s docstring: an outage can include DNS
# failure, so resolution has to be part of what is probed, and one provider's own outage must
# not silence a caller reading the other.
#
# The SAME two URLs the bridge defaults to (`bridge/config_io.py:WAN_PROBE_DEFAULT`), pinned equal
# by ansible/tests/setup/test_wan_probe_urls_match_the_bridge.py — two halves of one gate
# disagreeing about what "the internet" means is the drift that test exists to refuse. Empty
# disables the host-side gate, the same way an empty WAN_PROBE_URLS disables the bridge's.
wan_probe_urls:
  - https://cloudflare.com/cdn-cgi/trace
  - https://www.google.com/generate_204

# Seconds after boot in which the witness skips its run. Shorter than its hourly cron, so at most
# one slot is ever skipped — the constraint kuma-push-lib.sh's boot_grace_active documents. After
# a restart the last pod reached Ready 5m18s after boot, so a witness firing inside this window
# would report the route down while Traefik was still starting.
loki_route_witness_boot_grace_s: 600

# Hosts that get the developer tooling `initial_setup --tags tooling` installs: uv, the uv-
# managed CLI tools (ansible-core, ansible-lint, prek), the pinned host Python, the
# /usr/local/bin/uv symlink systemd and cron read, and the pinned Vale binary the prek `vale`
# hook runs. The same list gates `Install Git hooks`, because prek is what that task runs.
#
# The predicate is "somebody commits from this host", not "this host holds a checkout".
# daniel-pi is deliberately absent: it holds a checkout, but it is driven remotely over ssh and
# nobody commits from it. The Pi has neither uv nor vale and runs the distro's Python 3.12, and
# provisioning a pinned Python 3.14 on a 512 MB Zero 2 W is not wanted.
#
# An allowlist for the same reason as k3s_server_hosts above — a host nobody thought about is
# refused rather than provisioned. ENFORCED by ansible/tests/setup/test_dev_tooling_hosts.py.
dev_tooling_hosts:
  - daniel-box
  - daniel-server

# Past this, the checkout the drift arms compare against is reported as its own fault. A host
# without gitops-deploy does not refresh its tree — daniel-server was measured 39 commits behind
# origin — and a stale tree makes the render arm compare a stale render against
# the stale template it came from, which agree. So the arm reads green exactly when the host is
# furthest behind, which is the laundering this threshold exists to prevent.
setup_drift_tree_max_days: 14

# Pod Security Admission labels, applied to homelab and observability.
#
# WARN AND AUDIT ONLY — deliberately no `enforce`. PSA is a namespace-level control and this
# cluster puts 241 manifests in one namespace, so a single level would have to cover `nut`
# and the `scrutiny` collector (privileged), `node-exporter` (hostNetwork), four hostPath
# mounts and `registry`'s hostPort alongside every ordinary web app. Enforcing `baseline`
# today would refuse seven workloads in homelab and four more in observability.
#
# So this is the measuring instrument, not the fence. `warn` returns the violation to
# whoever applies the manifest; `audit` records it in the apiserver audit log. Together they
# produce the exact rejection list a decision about splitting namespaces needs.
#
# PSA evaluates at pod CREATE and UPDATE only, so adding these evicts nothing.
#
# ROLLBACK: set to {} and redeploy. Unlike the k3s server flags this is a real rollback —
# `kubectl apply` owns these labels, so removing them from the manifest removes them live.
k8s_psa_labels:
  pod-security.kubernetes.io/warn: baseline
  pod-security.kubernetes.io/audit: baseline

# Default container resources, applied to homelab and observability.
#
# A LimitRange, and deliberately NOT a ResourceQuota. Every container this repo renders
# already carries requests and limits, so this changes nothing on the Ansible path. It
# exists for the objects that never take that path — a hand-created pod, a Helm chart, a
# `kubectl run`.
#
# DEFAULTS ONLY — no `min`, no `max`. A `min`/`max` REJECTS every pod outside the band,
# including ones this repo already renders at 2Gi and 4Gi, while a default only fills in
# what was left out. Same reason there is no ResourceQuota: a namespace CPU/memory quota
# makes requests and limits MANDATORY on every pod in it.
#
# DEFAULTS STILL HAVE ONE REJECTION PATH, and it is why the ceiling is not tighter. A
# container that sets a REQUEST and no limit is given `default` as its limit — and if that
# lands below the request it stated, the API server refuses the pod. Requests-only is how a
# lot of Helm charts ship, so the ceiling must sit above anything one plausibly asks for.
# Hence 2Gi: already the joint-most-common memory limit here and 1/14th of a node, so it
# bounds a runaway while leaving the rejection path essentially unreachable.
#
# LimitRange evaluates at pod CREATE only, so adding this evicts nothing.
#
# NOT WATCHED BY manifest-prune-check. `limitrange` is absent from its kind list, and adding
# it would make the check red on day one: homelab's copy is applied inline from deploy.yml
# beside the namespace, so it appears in no staged manifest dir and reads as an orphan.
#
# ROLLBACK: set to {} and redeploy. That stops it being APPLIED; it does not remove the live
# object (the same trap as kubectl-apply-leaves-orphaned-objects). To remove it live:
#   kubectl delete limitrange default-container-limits -n homelab
#   kubectl delete limitrange default-container-limits -n observability
#
# DECIDED: 40x CPU / 32x memory default-to-request, two namespaces only; do not tighten it, and
# do not extend it to longhorn-system (instance-manager already peaks near a 2Gi limit).
k8s_default_limitrange:
  defaultRequest:
    cpu: 50m
    memory: 64Mi
  default:
    cpu: "2"
    memory: 2Gi

# apiserver audit log. Here rather than in roles/setup/k3s/defaults because TWO roles read
# these: setup/k3s arms the flags and writes the policy, and loki-homelab's promtail tails
# the file so the log is readable in Grafana instead of only by root on daniel-box.
#
# Only daniel-box writes a log — the path is under the k3s SERVER data directory and the
# agent node runs no apiserver. Promtail declares the job on both nodes anyway, because a
# DaemonSet carries one config; on daniel-server the path matches nothing.
#
# The policy path and the three rotation limits stay in the k3s role; nothing outside it
# reads them.
k3s_audit_log_enabled: true
k3s_audit_log_dir: /var/lib/rancher/k3s/server/logs
k3s_audit_log_path: "{{ k3s_audit_log_dir }}/audit.log"
# Embedded etcd's metrics endpoint. Here, not in roles/setup/k3s/defaults, for the same reason
# as the audit log above: TWO roles read it. setup/k3s puts --etcd-expose-metrics in the server
# args, and observability's prometheus.yaml.j2 gates its `etcd` scrape job on the same value, so
# the port and its only consumer cannot drift apart.
#
# k3s serves etcd metrics on 2381 either way. The flag moves the bind from 127.0.0.1 to
# 0.0.0.0, which is the whole point: Prometheus scrapes from the pod network and a
# loopback-bound port is unreachable from there. Plain HTTP, no auth, by k3s's design — the
# same posture as the kubelet's :10250, which also binds all interfaces and is protected by the
# host's default-deny UFW policy rather than by transport auth. The endpoint exposes counters
# and latencies, never key material or object data.
#
# Arming it needs a k3s-bringup.yml run: the installer rewrites the unit and RESTARTS k3s. The
# API server is briefly unavailable; running workloads keep running.
#
# DECIDED: off, and the DB-size risk is covered by a proxy instead. The restart above also
# re-encrypts every Secret (#2294), k3s-bringup.yml is manual-plane by construction, and the
# flag opens an unauthenticated :2381 — more cost than the gap is worth on a single voter,
# where leader changes and WAL fsync latency carry little signal anyway. The one series that
# does matter, the DB size against its 2 GiB quota, is readable WITHOUT the flag:
# `apiserver_storage_size_bytes` is scraped unconditionally, and #2403 reports it matching the
# etcd snapshot's size. monitor-bridge's `etcd_db_size` check reads it (files/checks/cluster_etcd.py,
# #2403). Reopen this with evidence that fsync latency or leader churn is what broke, not
# with the observation that the etcd series are empty — that is this decision, not a finding.
k3s_etcd_expose_metrics: false
# How long the play holds after every `rollout status` returns before declaring the deploy
# healthy (post_tasks/k8s_stabilise_gate.yml). `rollout status` returns on Available, which
# READINESS alone satisfies, so a container killed by a failing LIVENESS probe reports a
# clean deploy and then crashloops. Must exceed a probe's initialDelaySeconds +
# failureThreshold x periodSeconds; the slowest in the repo is ~35s. Paid ONCE per play.
k8s_rollout_stabilise_seconds: 60

# How many k8s roles deploy.yml applies before draining their rollouts (tasks/k8s_batch.yml).
# THIS IS A CONCURRENCY LIMIT ON ROLLOUTS, NOT ON WATCHING THEM. Roles carry no inline
# `rollout status`, so the width is the only thing bounding how many workloads restart at once.
#
# Sized deliberately low. 37 of the 50 Deployments here use strategy `Recreate`, which
# deletes the old pod before starting the new one — so a wide batch is not "extra surge
# replicas", it is N simultaneous Longhorn RWO detach/attach cycles and N simultaneous
# availability gaps. Widen only against a measured run.
k8s_rollout_batch_width: 5

# Opt-in no-mutation mode for the k8s plane: `-e k8s_dry_run=true`, or `scripts/deploy.sh
# --dry-run`. Renders every manifest to a temp dir and runs `kubectl apply --dry-run=server`
# against the LIVE API server, so CRDs, admission and schema defaulting all judge the
# manifests for real, then throws the temp dir away.
#
# Deliberately weaker than a staging cluster and stronger than `--check`: --check skips the
# apply entirely, so the manifests are never seen by an API server at all, and its skipped
# tasks break downstream consumers besides. Dry-run catches render bugs, bad
# apiVersions/field names, CRD-ordering mistakes and schema drift. It does NOT catch
# scheduling, PVC binding, probe or rollout behaviour — that needs a real cluster.
#
# Global rather than a role default: deploy.yml's own pre_tasks apply the namespace, so the
# flag must be visible before any role runs.
k8s_dry_run: false
# "This run must not change the cluster", whichever mode asked for it. `--check` and
# k8s_dry_run want the same tasks skipped for different reasons, and a role that guards only
# one of them is guarded against neither in practice — a `--check`-clean image-builder would
# still build and PUSH an image under a dry run.
k8s_no_mutate: "{{ ansible_check_mode or (k8s_dry_run | bool) }}"
# Telemetry lives apart from the service workloads. Global rather than a role default
# because TWO roles need it: observability puts its workloads here, and the traefik role must
# list it under the CRD provider's watched namespaces — Traefik ignores IngressRoutes in
# namespaces it is not told to watch, silently, with the route reporting no error at all.
k8s_observability_namespace: observability
# Longhorn's own namespace, fixed by the upstream manifest roles/setup/k3s applies. Named
# here because TWO roles need it: longhorn-ui puts its route and middleware copies there,
# and the traefik role must list it under the CRD provider's watched namespaces.
k8s_longhorn_namespace: longhorn-system
# Whether k8s IngressRoutes also match the PUBLIC host (`<svc>.<domain>`) alongside the LAN
# `<svc>.local.<domain>`. The pairing test_routes_stay_lan_only_* enforces the invariant.
# Infrastructure APIs opt out per-route with the macro's public=false (the CrowdSec LAPI is
# the standing example).
k8s_public_route: true
# The Traefik certificate resolver every IngressRoute names, or "" for a cluster that has
# none. Prod resolves certificates through the `cloudflare` ACME DNS-01 resolver defined in
# the traefik role's static config.
#
# Empty means Traefik serves its own default self-signed certificate for the route. That is
# the staging cluster's whole TLS story (docs/archive/staging-cluster.md, Decision 4): staging holds
# no Cloudflare token and must never issue against the real domain's ACME account and rate
# limit, and nothing on staging needs to TRUST a certificate — the gate asks whether
# manifests render, apply, schedule, bind and roll out, which a probe answers with `curl -k`.
# A generated internal CA would buy trust nothing reads, and cost a keypair, a Secret and a
# rotation story.
#
# The `tls:` block stays present either way, and that is load-bearing rather than tidy: an
# IngressRoute on the `https` entrypoint with NO `spec.tls` becomes a non-TLS router and is
# never a candidate for an HTTPS request at all. That failure is invisible from the object —
# it applies cleanly, `kubectl get` shows it, Traefik logs nothing. See the header of
# monitoring_route in ansible/templates/ingressroute.yml.j2.
# ENFORCED by ansible/tests/k8s/test_k8s_manifests.py, which fails any rendered IngressRoute
# serving the https entrypoint without a tls block.
#
# `domains:` goes with the resolver, not with TLS. It is the SAN set ACME is instructed to
# request; with no resolver it instructs nothing, so it is omitted rather than left as
# decoration a reader would mistake for a constraint.
k8s_tls_cert_resolver: cloudflare
# daniel-server's address as the cluster sees it on the wire. Monitoring routes are
# ClientIP-gated to it so an un-Authelia'd route is reachable from that host and from
# nowhere else on the LAN — see ingressroute.yml.j2 for why ClientIP is sound here.
#
# A literal rather than hostvars['daniel-server'].server_ip: the k8s play runs against
# daniel-box, and daniel-server is not necessarily in its play's hostvars.
k8s_bridge_client_ip: 10.0.0.161
# daniel-pi's address as the cluster sees it. A literal for exactly the reason above: the k8s
# play runs against daniel-box, and daniel-pi is not in that play's hostvars — `hostvars` is also
# undefined in the manifest-render test harness, so a hostvars lookup here renders fine under
# Ansible and fails the repo's own guards.
#
# Two consumers: loki-homelab's push-only IngressRoute (ClientIP allowlist) and the Pi's two
# static Prometheus scrape jobs.
k8s_pi_client_ip: 10.0.0.139
# daniel-box's own LAN address, as a POD sees it. A literal for the same reason as the two
# above, and needed for the same reason despite daniel-box being the host the k8s play runs
# on: `server_ip` is a host_var, so a manifest that used it would render correctly under
# Ansible and blow up in the manifest-render test harness, which has no host_vars either.
#
# Two consumers: the `coredns-host` scrape job and deploy-ui's EndpointSlice. A pod cannot
# reach the host forwarder at 127.0.0.1 — that is the pod's own loopback — so the job needs
# the node's routable address; deploy-ui needs it because its backend is a host process
# (deploy-ui.service) rather than a pod.
k8s_node_client_ip: 10.0.0.215
# The port daniel-box's host CoreDNS publishes its Prometheus endpoint on. DUPLICATED FROM
# `k3s_host_dns_metrics_port` in roles/setup/k3s/defaults/main.yml, deliberately: role
# defaults are only in scope while that role runs, and the k8s play never includes it, so a
# reference across the boundary is undefined rather than shared. The two are kept equal by
# ansible/tests/setup/test_coredns_metrics_port_agrees.py — a drift would leave this job scraping
# a closed port, which surfaces as a permanently down target rather than as anything subtle.
k8s_node_dns_metrics_port: 9253
# In-cluster image registry. Two addresses for the same registry, and both are needed
# because the two consumers sit on opposite sides of the pod boundary:
#
#   PUSH  — a builder pod reaches it over the Service, `registry.<namespace>.svc:<port>`.
#           `localhost` inside a pod means that pod, not the node.
#   PULL  — containerd reaches it at k8s_registry_pull_host, through a loopback hostPort.
#           containerd is a host process with no route to a ClusterIP by name.
#
# Here rather than in the registry role's defaults because roles/setup/k3s also needs them,
# to write the containerd trust config — a role cannot read another role's defaults.
k8s_registry_port: 5000
# Loopback for the same reason observability's OTLP receiver is: this registry has no auth and
# no TLS, so it must not be reachable from the LAN.
k8s_registry_host_ip: 127.0.0.1
# Image references in manifests are `{{ k8s_registry_pull_host }}/<name>:<tag>`. The mirror
# KEY in every node's registries.yaml is this same string, so one image reference is
# node-portable — what differs per node is the mirror ENDPOINT behind it: daniel-box (which
# runs the registry) resolves it to the loopback hostPort, agents to the pinned ClusterIP
# below over flannel.
k8s_registry_pull_host: "localhost:{{ k8s_registry_port }}"
# The registry Service's pinned ClusterIP (spec.clusterIP in the registry role) — pinned
# because agents' registries.yaml must name it as the mirror endpoint, and containerd is a
# host process that resolves no cluster DNS. Plain HTTP between nodes crosses the LAN inside
# the flannel vxlan, unencrypted — accepted for the homelab tier (both endpoints are our own
# hosts on our own switch; the alternative is a CA + cert rotation for one hop).
k8s_registry_cluster_ip: 10.43.51.14
# The node that runs the registry Deployment (nodeSelector) and therefore resolves the
# mirror to its own loopback hostPort. Follows the cluster: a staging deploy must push and
# pull its own images, never the prod registry, where a staging build could overwrite a tag
# prod pulls and cause a prod rollout. See docs/archive/staging-cluster.md, Decision 8.
k8s_registry_node: "{{ k8s_primary_node }}"
# The PUSH half of the pair described above. Fully qualified rather than bare `registry`,
# because a builder Job's pod may not carry a search domain that resolves the short name,
# and a wrong namespace here surfaces inside the pod as a DNS failure that reads like a
# network fault rather than a config one.
k8s_registry_push_host: "registry.{{ k8s_namespace }}.svc.cluster.local:{{ k8s_registry_port }}"
# The UPS's USB host: gates the nut_host role (host-side secondary upsmon + udev rule) in
# initial_setup.yml, paired with the k8s/nut pod's nodeSelector.
ups_host: daniel-server
# Whether a host that is NOT ups_host also runs the host-side secondary upsmon — the process
# that actually powers a machine off when the pod's primary raises FSD. Read in a play-level
# `when:` in initial_setup.yml, which is why it lives here rather than in the role's defaults
# alongside the other `_armed` switches.
#
# daniel-box DOES draw from the same UPS, measured by sampling `upsc
# apc-ups@127.0.0.1` every 3s while modulating a 16-core burn on daniel-box (daniel-server
# idle) moved ups.load by ~5 points ≈ 45 W, three transitions phase-locked to the burn across
# two cycles. Without a secondary upsmon there, daniel-server powers off cleanly while daniel-box
# — etcd, Longhorn's primary replicas, Kuma, Prometheus, Traefik, LAN DNS — is hard-cut at
# battery end. daniel-box is armed in host_vars/daniel-box.yml, where the reasoning sits.
#
# DEFAULT FALSE ON PURPOSE, and it stays false here. A secondary upsmon's entire job is to power
# the machine off, so a mistake is an unplanned shutdown, and a wrong SHUTDOWNCMD or an
# unreachable upsd is indistinguishable from a working one while mains power is up. Arm a host
# in its own host_vars, and only after the console-attended `upsmon -c fsd` drill has passed
# there. Arming is also not a lone edit: it presupposes an ONBATT delay that does not stop the
# machine two minutes into a blip — see nut_onbatt_shutdown_delay in roles/k8s/nut/defaults.
nut_host_secondary_armed: false
# The one host that checks for open Renovate PRs and posts the Discord digest (see
# renovate_notify CLAUDE.md) — fleet-wide by nature (it queries the GitHub repo, not anything
# host-local), so running it on more than one host would duplicate every notification.
# Doesn't matter which host, but must be exactly one.
renovate_notify_host: daniel-box
# The one host that runs the unattended Renovate agent (see renovate_agent CLAUDE.md). Same
# "exactly one host" reasoning as renovate_notify_host, and here for the same scope reason —
# but with a harder constraint on WHICH host: the agent needs Claude Code installed and logged
# in, a gh CLI logged in as the repo owner, and the primary checkout the landings deploy from.
# Arming the timer is a separate switch, renovate_agent_enabled in the role's defaults.
renovate_agent_host: daniel-box
# Which host runs the fake-remux detector + reconciler — daniel-box, where the media stack
# lives. Here rather than in the role's defaults because initial_setup.yml's `when:` on the
# role entry is evaluated before that role's defaults are in scope, the same reason
# renovate_notify_host is.
fake_remux_host: daniel-box
# The Raspberry Pi that gets the SD-card, log2ram and Pi-health tuning in the optimize_pi role.
# Here rather than in the role's defaults for the reason fake_remux_host gives above.
optimize_pi_host: daniel-pi
# The one host that runs the repo-level ops crons `initial_setup/tasks/crons.yml` gates to a
# single host: the worktree sweep, the infrastructure-map refresh, the generated-docs refresh
# and the weekly eval sweep. They need the primary checkout, uv, gh
# and a local kubectl, which daniel-box is the only host to carry together.
#
# Here rather than in the role's defaults for the reason fake_remux_host gives above, plus one
# the reader in scripts/deploy_tools/land_reach.py adds: `_eval_when` resolves a gate against
# group_vars + host_vars only, and a name it cannot resolve reads as "every host", which is an
# over-broad verdict.
ops_cron_host: daniel-box
# The one host that writes k8s render records (roles/setup/render_records). It must be
# the host the release records name, because the staleness reader refuses a render record
# whose `host` differs, and the host whose primary checkout the GitOps deployer fetches.
render_records_host: daniel-box
# The way out: false runs the role's absent arm on render_records_host, which stops the timer
# and removes the units, the worktree and the role's directories. To move the producer, apply
# false on the old host first, then change render_records_host.
#
# Arming presupposes that every host write in a role this renders is guarded on
# `not k8s_dry_run | bool`; without that guard an hourly dry run would install that tree's host
# scripts, crons and node-staged modules ahead of their landing. The uptime-kuma tile is gated
# on this too, so setting it false leaves no tile red.
render_records_enabled: true
# The producer runs hourly at this minute. Here rather than in the role's defaults because the
# uptime-kuma role derives the monitor's interval from the same cadence below.
render_records_minute: 17
# The render-records push monitor's interval. One hourly period, plus the ~8-minute render
# (8m16s for 58 services), plus one 40-minute restart of a run that deferred on a
# pending CI walk, rounded up. A shorter one flaps on an ordinary deferral; a longer one leaves
# a stopped producer unread for longer than the records it last wrote stay useful.
render_records_push_interval_s: 7200
# ── weekly reboot ──────────────────────────────────────────────────────────────────────────
# When every host in the play restarts itself. TWO roles read this: initial_setup installs the
# `Weekly system restart` cron from it (roles/setup/initial_setup/tasks/crons.yml), and
# uptime-kuma derives the Kuma maintenance window that keeps the restart from paging Discord
# (roles/k8s/uptime-kuma/defaults/main.yml). It lives here rather than in either role's
# defaults because a schedule written twice drifts: a reboot moved without the window is a
# Sunday morning of DOWN messages, and a window moved without the reboot suppresses nothing.
weekly_reboot_minute: 30
weekly_reboot_hour: 7
# Cron day-of-week, 0 = Sunday.
weekly_reboot_weekday: 0
# The `+5` in the cron job's `shutdown -r +5`. The hosts go down this many minutes AFTER the
# cron fires, so 07:30 + 5 = 07:35 is when the monitors actually start failing. The maintenance
# window's length is derived from it, so shortening the delay shortens the window.
weekly_reboot_shutdown_delay_minutes: 5
# The clock those three fields are read on. A host crontab fires on the HOST's local time, and
# every host here runs Etc/UTC (`timedatectl` on daniel-box and daniel-server) — NOT
# `tz`, which is America/Chicago and is the containers' display timezone. The two differ by five
# or six hours, so a maintenance window derived from these values in `tz` would open at an
# arbitrary Sunday midday and page straight through the reboot.
weekly_reboot_timezone: UTC
# Whether this host runs its own gitops_deploy pull-based auto-deployer. FALSE by default:
# daniel-box is the one deployer, and a host nobody has thought about yet gets the teardown arm
# rather than a timer that deploys to production on its own. Arming a host is `has_gitops: true` in its host_vars plus
# `initial_setup.yml --tags gitops_deploy`; see gitops_deploy CLAUDE.md.
has_gitops: false
# Whether this host runs Docker. FALSE by default: daniel-pi is the only Docker host, both
# cluster nodes run k3s's own containerd, and the k3s role fails closed on a node that already
# runs Docker. A host nobody thought about gets the teardown arm rather than a second container
# runtime. daniel-pi overrides this true.
has_docker: false
# The Docker engine packages, listed once because three tasks must agree on the set:
# docker_install installs them, initial_setup's host-basics HOLDS them before its
# dist-upgrade, and docker_install's teardown unholds them before its purge. An upgrade of
# docker-ce or containerd.io restarts the daemon and replaces the containerd shim under every
# running container, so on a has_docker host these move
# only through `--tags docker-engine-upgrade`, which stops the containers first and recreates
# them after. docker-ce-rootless-extras is not here: it arrives as a Recommends of docker-ce,
# and upgrading it restarts nothing.
docker_engine_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-compose-plugin
  - docker-buildx-plugin
# Whether rsyslog runs on this host. True by default -- it writes /var/log/{syslog,auth.log},
# which promtail ships and the crowdsec node agent tails. daniel-pi overrides this false:
# optimize_pi MASKS rsyslog there (journald is the log of record, and rsyslog's text logs
# landed in the RAM-backed log2ram tmpfs), so initial_setup's rsyslog filter tasks skip it --
# their `Restart rsyslog` handler fails on a masked unit.
has_rsyslog: true
# Whether this host runs VMs under KVM/libvirt. Default OFF and opted into per host, like
# has_github_cli: exactly one host needs it (daniel-server, for the monthly etcd restore
# drill's throwaway guest), and a hypervisor appearing on a node by default is a third writer
# of firewall state next to k3s and any container runtime. daniel-server overrides this true.
has_hypervisor: false
# Whether this host holds a checkout of THIS repository at ~/server. True by default — every
# host built by initial_setup.yml has had one, which is why a handful of tasks reach for
# `{{ playbook_dir }}` or `~/server/...` with no gate at all. No host overrides it false; the
# gate stays because those tasks would fail outright on a host that is driven over ssh and
# never checks the repo out.
#
# NOT derivable from ansible_connection. daniel-pi is `connection=ssh` and DOES hold a
# checkout (/home/ubuntu/server/ansible exists there), so deriving this
# from the connection type would skip three tasks that work on the Pi today.
has_repo_checkout: true

# The libvirt NAT network the hypervisor host builds, as a CIDR. The monthly etcd restore
# drill's throwaway guest attaches to it. Here
# rather than in the hypervisor role's defaults because two roles need one source of truth: the
# hypervisor role builds the network from a gateway plus a netmask, while `initial_setup`
# fences that network off the production LAN and needs the prefix form. A fence keyed to the
# wrong network is not a weaker fence, it is no fence at all — so
# ansible/tests/staging/test_staging_egress_fence.py asserts this prefix contains the role's
# gateway and matches its netmask.
staging_net_cidr: "192.168.140.0/24"
# The full etcd restore drill, run monthly in a throwaway guest on the hypervisor host (the
# mechanism is the hypervisor_etcd_drill_* block in roles/setup/hypervisor). Here
# rather than in that role because two roles read them: the hypervisor role installs the cron,
# and k8s/uptime-kuma sizes the push tile's deadline from the same cadence.
#
# Monthly, 1st, 11:20 UTC. The value of a restore drill is in the last time it PASSED, so it
# runs as often as it is cheap — one ~8 MB snapshot download from R2 and ~5 minutes of a 2-vCPU
# guest. Daytime, clear of every backup window (02:45 snapshot, 03:30/04:30 Longhorn, 04:10
# Longhorn drill), and off the Monday 10:20 list-only slot on daniel-box so the two never read
# as one event. The deadline below is derived from THIS cadence rather than a yearly floor — a
# yearly alarm over a monthly cron would let eleven failures pass in silence.
etcd_drill_full_cron: "20 11 1 * *"
# DEADLINE IS DERIVED FROM THE CRONTAB: the longest gap between two 1st-of-month runs is 31
# days (2678400 s), plus four days of slack for a late run or a host that was down that day.
# ENFORCED by ansible/tests/staging/test_etcd_drill_vm.py, which pins it between the cron's
# period and twice it.
etcd_drill_full_kuma_interval_s: 3024000
# Per-user developer environment: the chezmoi-managed dotfiles (DanielH2018/dotfiles) and
# Claude Code. Both default OFF and are opted into per host — daniel-server already has both
# installed by hand and shouldn't have them re-provisioned underneath it, and the Pi
# (512 MB Zero 2 W) can carry neither. has_chezmoi needs no credential of its own: the
# dotfiles repo is public, so chezmoi clones it anonymously. has_github_cli still runs
# first where a host sets both, for the reason initial_setup.yml gives at its entry.
has_github_cli: false
has_chezmoi: false
has_claude_code: false

# Physical location, feeds the homepage weather widget.
lat: 38.89
long: -77.08
