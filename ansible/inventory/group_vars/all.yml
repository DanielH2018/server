# Exact patch, not `3.14`. uv resolves a bare minor to whatever it already has, which is how
# the two hosts ended up on 3.14.6 and 3.14.5 with nothing asking for either. Eighteen host
# scripts run on this and must be the same interpreter on both machines. The minor must track
# .python-version — ansible/tests/test_host_python_pin.py enforces both halves.
host_python_version: "3.14.6"

# Linux Vars
sys_user: ubuntu
tz: America/Chicago
puid: 1000
pgid: 1000
# Apt origins unattended-upgrades may install from, BEYOND the security pockets the distro's
# 50unattended-upgrades already allows (`${distro_id}:${distro_codename}`, `-security`, and the
# two ESM pockets). Rendered into 52unattended-upgrades-local as `Origins-Pattern::` entries,
# which APPEND to the distro's list rather than displacing it.
#
# Every entry MUST use the `key=value,key=value` form, never the legacy `origin:archive` form
# that 50unattended-upgrades uses. unattended-upgrade rewrites a legacy entry to `o=X,a=Y`
# (see get_allowed_origins_legacy in /usr/bin/unattended-upgrade), so it can only ever match a
# repo that publishes a `Suite:` field. The GitHub CLI repo does not: measured on daniel-box
# 2026-08-24 via python-apt, its package file reads origin='gh', archive='', codename='stable'.
# `gh:stable` therefore matched nothing and upgraded nothing while reading as configured — it
# shipped that way in 2fc0b537 and this is the fix. ENFORCED by
# ansible/tests/test_unattended_origins_pattern.py.
#
# `origin=Ubuntu,archive=<codename>-updates` is the non-security pocket the login MOTD counts
# as "N updates can be applied immediately". Security-only was the policy until 2026-08-24;
# without it those sit unapplied forever, which is what the MOTD was reporting. Kernel upgrades
# land here, and Automatic-Reboot stays false — the Sunday 07:30 restart cron takes them.
#
# `origin=gh,codename=stable` is the GitHub CLI's own repo. Third-party origins are opt-in one
# at a time, never wildcarded. Note the Pi's Docker repo is deliberately NOT here: a docker-ce
# upgrade restarts the daemon, and nothing should do that unattended.
#
# Set to [] on a host to revert that host to security-only.
unattended_upgrades_origins_patterns:
  - "origin=${distro_id},archive=${distro_codename}-updates"
  - "origin=gh,codename=stable"
# Docker
docker_network: proxy
# Intel iGPU/QuickSync passthrough (jellyfin/tdarr hardware transcode via /dev/dri).
# False by default — override to true in a host's host_vars if the machine has one.
has_igpu: false
# Default web-UI exposure mode for hosts. `traefik` = route UIs through Traefik
# (Authelia-gated when use_authelia). Override to `lan` on LAN-only hosts (daniel-pi)
# to publish UI ports bound to the host's LAN IP instead. Consumed by expose.yml.j2.
expose_mode: traefik
# AutoKuma id of the managed notification provider (a static entity defined in the
# uptime-kuma role); the kuma() macro links every monitor to it via notification_name_list.
kuma_notification_id: discord
# Uptime Kuma "docker host" id referenced by AutoKuma docker monitors; the same id on
# every host so far, so it lives here — override per-host if one ever diverges.
kuma_docker_host: 1
# Docker-type monitors are retired fleet-wide: the kuma() macro suppresses its docker branch
# and the per-container tiles are superseded by the `docker-fleet` push check (uptime-kuma
# role's host cron). Cluster-side AutoKuma cannot reach the private docker-proxy socket
# anyway. Flip back to true to restore every docker monitor unchanged — AutoKuma recreates
# them from the labels, but history does not survive the round-trip.
kuma_docker_monitors: false
# Physical LAN subnet, narrow /24 (not the broader RFC1918 range — see traefik's trustedIPs
# comment for why that distinction matters). Same for every host so far; override per-host
# if a new host sits on a different LAN.
lan_subnet: "10.0.0.0/24"
# The production cluster's pod and Service ranges — k3s's defaults, which this cluster has
# never overridden. Global rather than k3s role defaults because the consumer is the
# hypervisor role on daniel-server: the staging guest's egress fence has to name them, and a
# role's defaults are not visible to a different role in a different playbook.
#
# Anything reachable in these two ranges is reachable from the staging guest unless the fence
# names them, and that is not theoretical: on 2026-08-28 the guest read prod's Longhorn API
# unauthenticated at 10.43.152.244, including its mutating `diskUpdate` action. lan_subnet
# alone does not cover it — a ClusterIP is not on the LAN.
k3s_pod_cidr: "10.42.0.0/16"
k3s_service_cidr: "10.43.0.0/16"
# code-server's read-only docker-proxy is gated on this host_var, not containers_list (a
# tagged `deploy.yml --tags docker-proxy` set_facts containers_list to the filtered
# dependency closure, which would drop code-server and render False). Override per-host.
has_code_server: false
# The k3s cluster's ingress VIP, served by MetalLB from a dedicated autoAssign: false pool.
# Global rather than a k3s role default because two hosts consume it: daniel-box's k8s
# Traefik Service claims it, and Pi-hole answers the cluster hostnames with it.
k3s_metallb_ingress_vip: 10.0.0.240
# The cluster MQTT broker's pinned LoadBalancer VIP. Global for the same two-hosts reason.
# MQTT is raw TCP — this VIP, not a Traefik hostname, is how it crosses hosts.
mqtt_k8s_vip: 10.0.0.242
# The cluster Pi-hole's pinned LAN DNS VIP. Global for the same two-hosts reason —
# daniel-box's pihole-dns Service claims it, and wg-easy's WG_DEFAULT_DNS points here.
dns_k8s_vip: 10.0.0.243
# The same Service's ClusterIP, pinned. Global because two roles need it and neither owns
# the other: roles/k8s/pihole claims it on the Service, and roles/setup/k3s names it in the
# CoreDNS Corefile so cluster DNS forwards to Pi-hole first. Cluster DNS uses this rather
# than the VIP above because kube-proxy reaches either Pi-hole pod through a ClusterIP,
# where the LoadBalancer's externalTrafficPolicy: Local blackholes traffic the MetalLB
# announcer would have to forward to another node.
dns_k8s_cluster_ip: 10.43.252.187
# Jellyfin's dedicated LAN LoadBalancer VIP — a second path distinct from the Traefik
# ingress VIP. Global for the same cross-role reason: roles/k8s/jellyfin's service-lan
# claims it, and roles/k8s/uptime-kuma's VIP port tile probes it.
jellyfin_k8s_lan_ip: 10.0.0.241
# Shared between roles/k8s/crowdsec (the engine that runs LAPI+AppSec) and roles/k8s/traefik
# (the bouncer plugin middleware + the log-tailing agent sidecar). Cross-role, and role
# defaults are invisible across roles.
crowdsec_k8s_image: crowdsecurity/crowdsec:v1.7.8
crowdsec_k8s_agent_username: k8s-traefik-agent
crowdsec_k8s_server_agent_machine: daniel-server-agent
# The authelia pod's agent sidecar. Here, not in the authelia role's defaults, because the
# k8s/crowdsec role registers the machine and only group_vars crosses that boundary.
crowdsec_k8s_authelia_agent_machine: k8s-authelia-agent
crowdsec_k8s_lapi_port: 8080
crowdsec_k8s_appsec_port: 7422
# SLZB-06M Zigbee coordinator (network-attached) + pinned Zigbee PAN identity. pan_id and
# ext_pan_id are network identifiers, not secrets, and are fixed so a templated-config
# redeploy never regenerates the mesh; the matching network_key IS sensitive and lives in
# SOPS as zigbee_network_key.
slzb_ip: 10.0.0.127
zigbee_pan_id: 6754
zigbee_ext_pan_id: [221, 187, 17, 34, 51, 68, 85, 102]
# `k8s_hostname_suffix` (was "-k8s") is retired: every service answers on its plain name.
# Do not reintroduce it — `hostname:` in host_vars is the whole story.
#
# Namespace every workload lands in. One namespace rather than one per service: Traefik
# Middleware references are namespace-scoped, and cross-namespace references would cost a
# qualified name on every route that follows, for no isolation this homelab needs.
k8s_namespace: homelab

# The cluster's k3s server / control-plane node. Every nodeSelector pin, node-affinity
# preference and `hostvars[...]` lookup that means "this cluster's primary node" reads this
# rather than the literal hostname, so a second cluster can be deployed to from the same
# source. Prod resolves it to daniel-box; a single-node staging cluster resolves it to its
# own node. See docs/staging-cluster.md, Decision 7.
#
# NOT a statement about WHY any given workload is pinned — the reasons differ (VIP
# announcement, hostPath locality, registry loopback) and are recorded at each pin. This
# variable only answers "which node is the primary one here".
k8s_primary_node: daniel-box

# Hosts k3s-bringup.yml will install a k3s SERVER on. Two entries, two clusters: daniel-box
# is prod's control plane, daniel-stage is the staging cluster's single node. daniel-server
# is deliberately absent — it is an agent in prod's cluster, and installing a server there
# would give one node two control planes.
#
# An allowlist rather than a denylist, so a host nobody thought about is refused rather than
# admitted. ENFORCED by ansible/tests/test_k3s_server_hosts.py.
k3s_server_hosts:
  - daniel-box
  - daniel-stage

# Which SOPS file `pre_tasks/load_secrets.yml` decrypts, chosen per host. Production is the
# default so a host nobody thought about gets the production file and fails closed on a
# missing key, rather than silently running with no secrets at all.
#
# daniel-stage overrides it. The point is scope, not templating: staging renders none of
# these values onto the guest today, but loading secrets.yml at all puts every production
# credential in the play's variable scope, and "no role happens to reference it" is a much
# weaker promise than the one docs/staging-cluster.md Decision 5 makes.
#
# Resolved relative to ansible/vars/. ENFORCED by ansible/tests/test_load_secrets_by_host.py,
# which also checks every file named by any host actually exists.
secrets_file: secrets.yml

# Pod Security Admission labels, applied to homelab and observability.
#
# WARN AND AUDIT ONLY — deliberately no `enforce`. PSA is a namespace-level control and this
# cluster puts 241 manifests in one namespace, so a single level would have to cover `nut`
# and the `scrutiny` collector (privileged), `node-exporter` (hostNetwork), four hostPath
# mounts and `registry`'s hostPort alongside every ordinary web app. Enforcing `baseline`
# today would refuse seven workloads in homelab and four more in observability.
#
# So this is the measuring instrument, not the fence. `warn` returns the violation to
# whoever applies the manifest; `audit` records it in the apiserver audit log. Together they
# produce the exact rejection list a decision about splitting namespaces needs.
#
# PSA evaluates at pod CREATE and UPDATE only, so adding these evicts nothing.
#
# ROLLBACK: set to {} and redeploy. Unlike the k3s server flags this is a real rollback —
# `kubectl apply` owns these labels, so removing them from the manifest removes them live.
k8s_psa_labels:
  pod-security.kubernetes.io/warn: baseline
  pod-security.kubernetes.io/audit: baseline

# Default container resources, applied to homelab and observability.
#
# A LimitRange, and deliberately NOT a ResourceQuota. Every container this repo renders
# already carries requests and limits, so this changes nothing on the Ansible path. It
# exists for the objects that never take that path — a hand-created pod, a Helm chart, a
# `kubectl run`.
#
# DEFAULTS ONLY — no `min`, no `max`. A `min`/`max` REJECTS every pod outside the band,
# including ones this repo already renders at 2Gi and 4Gi, while a default only fills in
# what was left out. Same reason there is no ResourceQuota: a namespace CPU/memory quota
# makes requests and limits MANDATORY on every pod in it.
#
# DEFAULTS STILL HAVE ONE REJECTION PATH, and it is why the ceiling is not tighter. A
# container that sets a REQUEST and no limit is given `default` as its limit — and if that
# lands below the request it stated, the API server refuses the pod. Requests-only is how a
# lot of Helm charts ship, so the ceiling must sit above anything one plausibly asks for.
# Hence 2Gi: already the joint-most-common memory limit here and 1/14th of a node, so it
# bounds a runaway while leaving the rejection path essentially unreachable.
#
# LimitRange evaluates at pod CREATE only, so adding this evicts nothing.
#
# NOT WATCHED BY manifest-prune-check. `limitrange` is absent from its kind list, and adding
# it would make the check red on day one: homelab's copy is applied inline from deploy.yml
# beside the namespace, so it appears in no staged manifest dir and reads as an orphan.
#
# ROLLBACK: set to {} and redeploy. That stops it being APPLIED; it does not remove the live
# object (the same trap as kubectl-apply-leaves-orphaned-objects). To remove it live:
#   kubectl delete limitrange default-container-limits -n homelab
#   kubectl delete limitrange default-container-limits -n observability
k8s_default_limitrange:
  defaultRequest:
    cpu: 50m
    memory: 64Mi
  default:
    cpu: "2"
    memory: 2Gi

# apiserver audit log. Here rather than in roles/setup/k3s/defaults because TWO roles read
# these: setup/k3s arms the flags and writes the policy, and loki-homelab's promtail tails
# the file so the log is readable in Grafana instead of only by root on daniel-box.
#
# Only daniel-box writes a log — the path is under the k3s SERVER data directory and the
# agent node runs no apiserver. Promtail declares the job on both nodes anyway, because a
# DaemonSet carries one config; on daniel-server the path matches nothing.
#
# The policy path and the three rotation limits stay in the k3s role; nothing outside it
# reads them.
k3s_audit_log_enabled: true
k3s_audit_log_dir: /var/lib/rancher/k3s/server/logs
k3s_audit_log_path: "{{ k3s_audit_log_dir }}/audit.log"
# Embedded etcd's metrics endpoint. Here, not in roles/setup/k3s/defaults, for the same reason
# as the audit log above: TWO roles read it. setup/k3s puts --etcd-expose-metrics in the server
# args, and claude-otel's prometheus.yaml.j2 gates its `etcd` scrape job on the same value, so
# the port and its only consumer cannot drift apart.
#
# k3s serves etcd metrics on 2381 either way. The flag moves the bind from 127.0.0.1 to
# 0.0.0.0, which is the whole point: Prometheus scrapes from the pod network and a
# loopback-bound port is unreachable from there. Plain HTTP, no auth, by k3s's design — the
# same posture as the kubelet's :10250, which also binds all interfaces and is protected by the
# host's default-deny UFW policy rather than by transport auth. The endpoint exposes counters
# and latencies, never key material or object data.
#
# Arming it needs a k3s-bringup.yml run: the installer rewrites the unit and RESTARTS k3s. The
# API server is briefly unavailable; running workloads keep running.
k3s_etcd_expose_metrics: false
# How long the play holds after every `rollout status` returns before declaring the deploy
# healthy (post_tasks/k8s_stabilise_gate.yml). `rollout status` returns on Available, which
# READINESS alone satisfies, so a container killed by a failing LIVENESS probe reports a
# clean deploy and then crashloops. Must exceed a probe's initialDelaySeconds +
# failureThreshold x periodSeconds; the slowest in the repo is ~35s. Paid ONCE per play.
k8s_rollout_stabilise_seconds: 60

# How many k8s roles deploy.yml applies before draining their rollouts (tasks/k8s_batch.yml).
# THIS IS A CONCURRENCY LIMIT ON ROLLOUTS, NOT ON WATCHING THEM. The inline `rollout status`
# that used to sit in every role is what held the cluster to one rolling service at a time;
# batching removes it, so the width is now the only thing bounding how many workloads
# restart at once.
#
# Sized deliberately low. 37 of the 50 Deployments here use strategy `Recreate`, which
# deletes the old pod before starting the new one — so a wide batch is not "extra surge
# replicas", it is N simultaneous Longhorn RWO detach/attach cycles and N simultaneous
# availability gaps. This cluster has been bitten by Longhorn under exactly that load.
# Widen only against a measured run.
k8s_rollout_batch_width: 5

# Opt-in no-mutation mode for the k8s plane: `-e k8s_dry_run=true`, or `scripts/deploy.sh
# --dry-run`. Renders every manifest to a temp dir and runs `kubectl apply --dry-run=server`
# against the LIVE API server, so CRDs, admission and schema defaulting all judge the
# manifests for real, then throws the temp dir away.
#
# Deliberately weaker than a staging cluster and stronger than `--check`: --check skips the
# apply entirely, so the manifests are never seen by an API server at all, and its skipped
# tasks break downstream consumers besides. Dry-run catches render bugs, bad
# apiVersions/field names, CRD-ordering mistakes and schema drift. It does NOT catch
# scheduling, PVC binding, probe or rollout behaviour — that needs a real cluster.
#
# Global rather than a role default: deploy.yml's own pre_tasks apply the namespace, so the
# flag must be visible before any role runs.
k8s_dry_run: false
# "This run must not change the cluster", whichever mode asked for it. `--check` and
# k8s_dry_run want the same tasks skipped for different reasons, and a role that guards only
# one of them is guarded against neither in practice — image-builder was fully `--check`-clean
# and would still have built and PUSHED an image under a dry run.
k8s_no_mutate: "{{ ansible_check_mode or (k8s_dry_run | bool) }}"
# Roles that mutate the cluster OUTSIDE roles/k8s/manifests and are therefore not covered by
# the flag — sidecar ConfigMaps built with `kubectl create`, netpol-probe Jobs deleted and
# recreated, `exec -i` piping config into a live pod, image builds pushed to the registry,
# seed-volume scaling Deployments to zero. Dry-running these would half-apply: the manifest
# apply is suppressed while the side-car mutation still fires.
#
# deploy.yml asserts against this list and REFUSES the run rather than half-applying.
# Shrinking it means guarding a role's own kubectl calls on k8s_no_mutate and deleting its
# entry.
#
# The refusal keys on `ansible_run_tags`, so it only reaches roles the operator NAMES. That
# is sound for every role below because none is reachable as a dependency — verified by
# test_k8s_dry_run.py, since the k8s roles carry no meta/main.yml and include one another
# only by literal name. `seed-volume`, `image-builder` and `cronjob-gate` ARE reachable that
# way, which is why they are guarded internally on k8s_no_mutate instead of listed here.
k8s_dry_run_unsupported:
  - autofix-bridge
  - claude-otel
  - crowdsec
  - headlamp
  - loki-homelab
  - media-volume
  - monitor-bridge
  - n8n
  - n8n-images
  - pihole
  - prowlarr
  - registry
  - terraria-stats
  - traefik
  - valheim-stats

# Telemetry lives apart from the service workloads. Global rather than a role default
# because TWO roles need it: claude-otel puts its workloads here, and the traefik role must
# list it under the CRD provider's watched namespaces — Traefik ignores IngressRoutes in
# namespaces it is not told to watch, silently, with the route reporting no error at all.
k8s_observability_namespace: observability
# Longhorn's own namespace, fixed by the upstream manifest roles/setup/k3s applies. Named
# here because TWO roles need it: longhorn-ui puts its route and middleware copies there,
# and the traefik role must list it under the CRD provider's watched namespaces.
k8s_longhorn_namespace: longhorn-system
# Whether k8s IngressRoutes also match the PUBLIC host (`<svc>.<domain>`) alongside the LAN
# `<svc>.local.<domain>`. The pairing test_routes_stay_lan_only_* enforces the invariant.
# Infrastructure APIs opt out per-route with the macro's public=false (the CrowdSec LAPI is
# the standing example).
k8s_public_route: true
# The Traefik certificate resolver every IngressRoute names, or "" for a cluster that has
# none. Prod resolves certificates through the `cloudflare` ACME DNS-01 resolver defined in
# the traefik role's static config.
#
# Empty means Traefik serves its own default self-signed certificate for the route. That is
# the staging cluster's whole TLS story (docs/staging-cluster.md, Decision 4): staging holds
# no Cloudflare token and must never issue against the real domain's ACME account and rate
# limit, and nothing on staging needs to TRUST a certificate — the gate asks whether
# manifests render, apply, schedule, bind and roll out, which a probe answers with `curl -k`.
# A generated internal CA would buy trust nothing reads, and cost a keypair, a Secret and a
# rotation story.
#
# The `tls:` block stays present either way, and that is load-bearing rather than tidy: an
# IngressRoute on the `https` entrypoint with NO `spec.tls` becomes a non-TLS router and is
# never a candidate for an HTTPS request at all. That failure is invisible from the object —
# it applies cleanly, `kubectl get` shows it, Traefik logs nothing — and it cost most of
# 2026-08-07. See the header of monitoring_route in ansible/templates/ingressroute.yml.j2.
# ENFORCED by ansible/tests/test_k8s_manifests.py, which fails any rendered IngressRoute
# serving the https entrypoint without a tls block.
#
# `domains:` goes with the resolver, not with TLS. It is the SAN set ACME is instructed to
# request; with no resolver it instructs nothing, so it is omitted rather than left as
# decoration a reader would mistake for a constraint.
k8s_tls_cert_resolver: cloudflare
# daniel-server's address as the cluster sees it on the wire. Monitoring routes are
# ClientIP-gated to it so an un-Authelia'd route is reachable from that host and from
# nowhere else on the LAN — see ingressroute.yml.j2 for why ClientIP is sound here.
#
# A literal rather than hostvars['daniel-server'].server_ip: the k8s play runs against
# daniel-box, and daniel-server is not necessarily in its play's hostvars.
k8s_bridge_client_ip: 10.0.0.161
# daniel-pi's address as the cluster sees it. A literal for exactly the reason above: the k8s
# play runs against daniel-box, and daniel-pi is not in that play's hostvars — `hostvars` is also
# undefined in the manifest-render test harness, so a hostvars lookup here renders fine under
# Ansible and fails the repo's own guards.
#
# Two consumers: loki-homelab's push-only IngressRoute (ClientIP allowlist) and the Pi's two
# static Prometheus scrape jobs.
k8s_pi_client_ip: 10.0.0.139
# In-cluster image registry. Two addresses for the same registry, and both are needed
# because the two consumers sit on opposite sides of the pod boundary:
#
#   PUSH  — a builder pod reaches it over the Service, `registry.<namespace>.svc:<port>`.
#           `localhost` inside a pod means that pod, not the node.
#   PULL  — containerd reaches it at k8s_registry_pull_host, through a loopback hostPort.
#           containerd is a host process with no route to a ClusterIP by name.
#
# Here rather than in the registry role's defaults because roles/setup/k3s also needs them,
# to write the containerd trust config — a role cannot read another role's defaults.
k8s_registry_port: 5000
# Loopback for the same reason claude-otel's OTLP receiver is: this registry has no auth and
# no TLS, so it must not be reachable from the LAN.
k8s_registry_host_ip: 127.0.0.1
# Image references in manifests are `{{ k8s_registry_pull_host }}/<name>:<tag>`. The mirror
# KEY in every node's registries.yaml is this same string, so one image reference is
# node-portable — what differs per node is the mirror ENDPOINT behind it: daniel-box (which
# runs the registry) resolves it to the loopback hostPort, agents to the pinned ClusterIP
# below over flannel.
k8s_registry_pull_host: "localhost:{{ k8s_registry_port }}"
# The registry Service's pinned ClusterIP (spec.clusterIP in the registry role) — pinned
# because agents' registries.yaml must name it as the mirror endpoint, and containerd is a
# host process that resolves no cluster DNS. Plain HTTP between nodes crosses the LAN inside
# the flannel vxlan, unencrypted — accepted for the homelab tier (both endpoints are our own
# hosts on our own switch; the alternative is a CA + cert rotation for one hop).
k8s_registry_cluster_ip: 10.43.51.14
# The node that runs the registry Deployment (nodeSelector) and therefore resolves the
# mirror to its own loopback hostPort. Follows the cluster: a staging deploy must push and
# pull its own images, never the prod registry, where a staging build could overwrite a tag
# prod pulls and cause a prod rollout. See docs/staging-cluster.md, Decision 8.
k8s_registry_node: "{{ k8s_primary_node }}"
# The PUSH half of the pair described above. Fully qualified rather than bare `registry`,
# because a builder Job's pod may not carry a search domain that resolves the short name,
# and a wrong namespace here surfaces inside the pod as a DNS failure that reads like a
# network fault rather than a config one.
k8s_registry_push_host: "registry.{{ k8s_namespace }}.svc.cluster.local:{{ k8s_registry_port }}"
# The UPS's USB host: gates the nut_host role (host-side secondary upsmon + udev rule) in
# initial_setup.yml, paired with the k8s/nut pod's nodeSelector.
ups_host: daniel-server
# Whether a host that is NOT ups_host also runs the host-side secondary upsmon — the process
# that actually powers a machine off when the pod's primary raises FSD. Read in a play-level
# `when:` in initial_setup.yml, which is why it lives here rather than in the role's defaults
# alongside the other `_armed` switches.
#
# daniel-box DOES draw from the same UPS, measured 2026-08-20: sampling `upsc
# apc-ups@127.0.0.1` every 3s while modulating a 16-core burn on daniel-box (daniel-server
# idle) moved ups.load by ~5 points ≈ 45 W, three transitions phase-locked to the burn across
# two cycles. Before 2026-08-28 that meant daniel-server powered off cleanly while daniel-box —
# etcd, Longhorn's primary replicas, Kuma, Prometheus, Traefik, LAN DNS — was hard-cut at
# battery end. daniel-box is now armed in host_vars/daniel-box.yml, where the reasoning sits.
#
# DEFAULT FALSE ON PURPOSE, and it stays false here. A secondary upsmon's entire job is to power
# the machine off, so a mistake is an unplanned shutdown, and a wrong SHUTDOWNCMD or an
# unreachable upsd is indistinguishable from a working one while mains power is up. Arm a host
# in its own host_vars, and only after the console-attended `upsmon -c fsd` drill has passed
# there. Arming is also not a lone edit: it presupposes an ONBATT delay that does not stop the
# machine two minutes into a blip — see nut_onbatt_shutdown_delay in roles/k8s/nut/defaults.
nut_host_secondary_armed: false
# The one host that checks for open Renovate PRs and posts the Discord digest (see
# renovate_notify CLAUDE.md) — fleet-wide by nature (it queries the GitHub repo, not anything
# host-local), so running it on more than one host would duplicate every notification.
# Doesn't matter which host, but must be exactly one.
renovate_notify_host: daniel-box
# Which host runs the fake-remux detector + reconciler — daniel-box, where the media stack
# lives. Here rather than in the role's defaults because initial_setup.yml's `when:` on the
# role entry is evaluated before that role's defaults are in scope, the same reason
# renovate_notify_host is.
fake_remux_host: daniel-box
# Whether this host runs its own gitops_deploy pull-based auto-deployer. True by default —
# every full host redeploys its own containers_list independently on a git push (see
# gitops_deploy CLAUDE.md). daniel-pi overrides this false: it is memory-constrained and
# driven manually over SSH, not by GitOps, by design.
has_gitops: true
# Whether this host runs Docker. True by default — it is the container runtime the whole
# containers_list plane is built on. daniel-box overrides this false: it is the k3s node, and
# k3s ships its own containerd plus flannel/kube-proxy iptables rules. A bare
# initial_setup.yml run once installed Docker there and tripped the k3s role's fail-closed
# "already runs Docker" guard; this gate is what stops that recurring, since relying on the
# operator to remember --tags is what let it happen.
has_docker: true
# Whether this host runs VMs under KVM/libvirt. Default OFF and opted into per host, like
# has_github_cli: exactly one host needs it (daniel-server, for the staging cluster), and a
# hypervisor appearing on a node by default is a third writer of firewall state next to k3s
# and any container runtime. daniel-server overrides this true.
has_hypervisor: false

# The staging-cluster guest. Declared here rather than in the hypervisor role's defaults
# because two places need one source of truth: the role reserves this MAC->IP pair in the
# staging network's DHCP, and the inventory entry that reaches the guest names the same
# address. The MAC uses QEMU's 52:54:00 OUI and is fixed so the reservation is stable across
# a rebuild of the guest. See docs/staging-cluster.md.
staging_vm_hostname: daniel-stage
staging_vm_mac: "52:54:00:5a:11:e0"
staging_vm_ip: 192.168.140.10
# The staging network itself, as a CIDR. Here rather than in the hypervisor role's defaults
# for the same reason as the guest above: two roles need one source of truth. The hypervisor
# role builds the libvirt network from a gateway plus a netmask; `initial_setup` fences that
# network off the production LAN and needs the prefix form. A fence keyed to the wrong
# network is not a weaker fence, it is no fence at all — so
# ansible/tests/test_staging_net_cidr_agrees.py asserts this prefix contains the role's
# gateway and matches its netmask.
staging_net_cidr: "192.168.140.0/24"
# Per-user developer environment: the chezmoi-managed dotfiles (DanielH2018/dotfiles) and
# Claude Code. Both default OFF and are opted into per host — daniel-server already has both
# installed by hand and shouldn't have them re-provisioned underneath it, and the Pi
# (512 MB Zero 2 W) can carry neither. has_github_cli brings the git credential helper that
# lets a host clone private repos, which has_chezmoi requires.
has_github_cli: false
has_chezmoi: false
has_claude_code: false

# Physical location, feeds the homepage weather widget.
lat: 38.89
long: -77.08
