---
server_ip: 10.0.0.215
# Cloud-init (subiquity) image, like the Pi: sshd's real config is the drop-in, not the
# bare /etc/ssh/sshd_config. Verified on the host — /etc/ssh/sshd_config.d/ contains only
# 50-cloud-init.conf. The SSH-hardening tasks have no `create:` fallback, so a wrong value
# here fails initial_setup.yml outright.
ssh_config_path: /etc/ssh/sshd_config.d/50-cloud-init.conf
# Slice 1 of the k3s migration (docs/k3s-migration/slice-1-ingress-sso-leaf.md). Every entry
# is platform: k8s, so deploy.yml's Docker play filters them all out and its k8s play picks
# them up — the keys are otherwise the same ones the Docker entries use, which is the point
# of the platform key.
#
# ORDER IS LOAD-BEARING and there is no toposort on this play: the traefik role installs the
# Traefik CRDs that every IngressRoute and Middleware below depends on, and bento-pdf's route
# references the `authelia` Middleware the authelia role creates.
#
# `hostname` carries the -k8s suffix while the Docker twin still serves the unsuffixed name.
# Single-label on purpose — bento-pdf-k8s.local.<domain> is covered by the existing
# *.local.<domain> wildcard cert; a nested bento-pdf.k8s.local.<domain> would not be.
containers_list:
  - name: traefik
    platform: k8s
    port: 8080
  - name: authelia
    platform: k8s
    hostname: "auth{{ k8s_hostname_suffix }}"
    port: 9091
    use_authelia: false
  - name: bento-pdf
    platform: k8s
    hostname: "bento-pdf{{ k8s_hostname_suffix }}"
    port: 8080
    use_authelia: true
  # Claude Code telemetry sink. No `port` and no `hostname` on purpose: it has no Traefik
  # route at all. Claude Code runs on this HOST and exports to 127.0.0.1:4317, reaching the
  # collector through a hostPort rather than the ingress — content logging is on, so nothing
  # here should be reachable from the LAN. Grafana (slice 2) is what will earn a hostname.
  #
  # Ordering IS load-bearing on this list (no toposort in the k8s play): this must follow
  # traefik, whose CRDs the IngressRoute and Middlewares below depend on, and authelia,
  # whose Service the forward-auth Middleware points at.
  #
  # `hostname`/`port` describe Grafana specifically — the only routed workload here. The
  # collector, Loki, Prometheus and Tempo are all reached on the node's loopback via
  # hostPort rather than the ingress — the three query backends so that `otelq`, which
  # hardcodes 127.0.0.1, can read them from the host. None of them has an ingress route.
  # Cluster infrastructure, not a service: makes /dev/dri/renderD128 schedulable as
  # `devic.es/dri` so jellyfin and tdarr can request it without being privileged (slice 4, B1).
  # No port/hostname — nothing routes to it.
  - name: dri-device-plugin
    platform: k8s
  # The shared /data volume the nine media workloads mount (slice 4, B2). Storage, not a
  # service: no port, no hostname, nothing routes to it. Must precede every media workload —
  # a pod that mounts an undeclared claim stays Pending, and WaitForFirstConsumer makes that
  # look like a scheduling problem rather than a missing volume.
  #
  # Its 19 G seeding copy does NOT run on an ordinary deploy. It is gated behind
  # `-e media_volume_sync=true` because the rsync mirrors with --delete: harmless before
  # cutover, and after cutover it would erase whatever qbittorrent has downloaded since.
  - name: media-volume
    platform: k8s
  # Slice 4, B3 — the first \*arr in the cluster, and NOT the authoritative one. Runs a copy of
  # the live config against the B2 media volume while Docker's sonarr keeps serving, to rehearse
  # the footgun this slice is built around: sonarr stores ABSOLUTE in-container paths, so the
  # library looks intact right up until an import fails.
  #
  # Must follow media-volume: it mounts that claim at /data, and a pod whose claim does not exist
  # stays Pending.
  #
  # It holds the real indexers and download client, so what keeps it from acting on them matters:
  # every one of those targets is a DOCKER network name that does not resolve in the cluster. An
  # egress NetworkPolicy was tried first and is NOT enforced here — see the role's
  # isolation-probe-job.yaml.j2, which asserts the boundary that actually holds on every deploy.
  - name: sonarr
    platform: k8s
    hostname: "sonarr{{ k8s_hostname_suffix }}"
    port: 8989
    use_authelia: true
    # Cut over 2026-08-07 (B4c). The Docker copy is stopped and unmanaged, so daniel-server's
    # Traefik forwards the UNSUFFIXED names here — restoring bookmarks and any client pointing
    # at sonarr.local, which 404'd between the cutover and this.
    bridge_hostname: sonarr
  # Slice 4, B4b — BUILT BUT NOT DEPLOYED. The entry has to exist (a k8s role without one fails
  # validate_k8s_manifests.py), but `qbittorrent_k8s_enabled` defaults to FALSE and every task
  # in the role is gated on it. Without that gate this entry alone would be enough: gitops runs
  # ansible/deploy.yml, which is a plain containers_list loop, so the next tick would stand up a
  # second qbittorrent holding the same torrent state. Released in B4c.
  #
  # The slice's only genuinely new shape — a WireGuard/Mullvad sidecar sharing the pod's netns,
  # gating qbittorrent's start so it cannot talk to a tracker before the kill-switch exists.
  - name: qbittorrent
    platform: k8s
    hostname: "qbittorrent{{ k8s_hostname_suffix }}"
    port: 8080
    use_authelia: true
    # Cut over 2026-08-07 (B4c). The Docker copy is stopped and unmanaged, so daniel-server's
    # Traefik forwards the UNSUFFIXED names here — restoring bookmarks and any client pointing
    # at qbittorrent.local, which 404'd between the cutover and this.
    bridge_hostname: qbittorrent
  # Slice 4, B4a — the three remaining \*arrs, ALL held by their own `<svc>_k8s_enabled: false`
  # for the same reason as qbittorrent above: the entry is mandatory for
  # validate_k8s_manifests.py, and gitops would otherwise deploy them unattended.
  #
  # They also cannot be deployed one at a time, and the reason is worth keeping: standing up
  # prowlarr makes the bare name `prowlarr` resolve, which is exactly what the rehearsing
  # sonarr's isolation probe fails on. D3's "one window" is enforced, not remembered.
  - name: radarr
    platform: k8s
    hostname: "radarr{{ k8s_hostname_suffix }}"
    port: 7878
    use_authelia: true
    # Cut over 2026-08-07 (B4c). The Docker copy is stopped and unmanaged, so daniel-server's
    # Traefik forwards the UNSUFFIXED names here — restoring bookmarks and any client pointing
    # at radarr.local, which 404'd between the cutover and this.
    bridge_hostname: radarr
  # Brings a second workload with it — flaresolverr, which renders attacker-supplied Cloudflare
  # pages. Under Compose that sat on its own network; here an INGRESS NetworkPolicy keeps it
  # reachable from prowlarr alone, so the move to one namespace is a narrowing rather than a
  # widening. Ingress is the direction that is actually enforced on this cluster (B3).
  - name: prowlarr
    platform: k8s
    hostname: "prowlarr{{ k8s_hostname_suffix }}"
    port: 9696
    use_authelia: true
    # Cut over 2026-08-07 (B4c). The Docker copy is stopped and unmanaged, so daniel-server's
    # Traefik forwards the UNSUFFIXED names here — restoring bookmarks and any client pointing
    # at prowlarr.local, which 404'd between the cutover and this.
    bridge_hostname: prowlarr
  - name: bazarr
    platform: k8s
    hostname: "bazarr{{ k8s_hostname_suffix }}"
    port: 6767
    use_authelia: true
    # Cut over 2026-08-07 (B4c). The Docker copy is stopped and unmanaged, so daniel-server's
    # Traefik forwards the UNSUFFIXED names here — restoring bookmarks and any client pointing
    # at bazarr.local, which 404'd between the cutover and this.
    bridge_hostname: bazarr

  # The slice's exit criterion (B5), and the first workload anywhere to request the
  # `devic.es/dri` extended resource the B1 device plugin advertises.
  #
  # use_authelia stays FALSE, as it was under Compose, and that is load-bearing rather than an
  # oversight: Jellyfin's clients are TV and phone apps that cannot complete a web SSO flow. The
  # public route keeps flowing through daniel-server's Traefik and CrowdSec while
  # k8s_public_route is false, and the bridge only applies Authelia when use_authelia is true —
  # so the unsuffixed name below stays open to those clients exactly as before.
  - name: jellyfin
    platform: k8s
    hostname: "jellyfin{{ k8s_hostname_suffix }}"
    port: 8096
    use_authelia: false
    bridge_hostname: jellyfin

  # B6. Alone like jellyfin, and for a related reason — it shares no hardlink seam. What sets it
  # apart is that it holds the GPU for minutes at a time on real files and rewrites the library
  # IN PLACE: the one media service where a wrong mount does lasting damage rather than a failed
  # request. Its /media mount is consequently the only read-write one among the consumers.
  - name: tdarr
    platform: k8s
    hostname: "tdarr{{ k8s_hostname_suffix }}"
    port: 8265
    use_authelia: true
    bridge_hostname: tdarr

  # Slice 4, B7a. No `port`, no `hostname`, no `bridge_hostname` — and none of that is an
  # omission. configarr is a nightly reconcile that reads the two *arrs and exits, so it ports to
  # a CronJob with no Service and nothing to route to. Must follow sonarr and radarr: it addresses
  # them by bare Service name, which is why `base_url: http://sonarr:8989` survives the port
  # unchanged.
  - name: configarr
    platform: k8s

  - name: claude-otel
    platform: k8s
    hostname: "grafana{{ k8s_hostname_suffix }}"
    port: 3000
    use_authelia: true
    # Slice 3 (D8). Prometheus' own name, so Pi-hole answers it with the cluster VIP instead of
    # the local.<domain> wildcard that points at daniel-server. monitor-bridge runs there and
    # cannot reach this host's ClusterIP or its loopback-pinned hostPort, so this name plus the
    # role's query-only `prometheus-monitoring` IngressRoute is the whole path in. Keep the two
    # in step: the route matches this exact host, hardcoded as prometheus{{ k8s_hostname_suffix }}.
    extra_hostnames:
      - "prometheus{{ k8s_hostname_suffix }}"
  # Slice 2, batch A (docs/k3s-migration/slice-2-leaf-apps.md). The Docker twin serves `www`;
  # this one answers on www-k8s until cutover. use_authelia mirrors the Docker entry and its
  # reason: this is the public link-in-bio landing page, so a login gate would break it.
  - name: littlelink
    platform: k8s
    hostname: "www{{ k8s_hostname_suffix }}"
    port: 3000
    use_authelia: false
    # Cut over 2026-08-05. No bridge_probe_path, and that is not an omission: with no
    # forward-auth in front of it, the ordinary littlelink-bridge monitor already reaches the
    # app itself, so this is the one bridged service whose normal monitor is end-to-end. That
    # makes it the canary for the bridge mechanism the gated services depend on.
    bridge_hostname: www
  # Slice 2, batch B. First PVC seeded from daniel-server, and the first k8s Secret
  # (Laravel's APP_KEY) — deliberately on a service whose data is disposable, so the
  # seed-volume mechanic is proven where a botched copy costs nothing.
  - name: speedtest
    platform: k8s
    hostname: "speedtest{{ k8s_hostname_suffix }}"
    port: 80
    use_authelia: true
    # First service behind the strangler bridge. Setting this adds a second, ClientIP-guarded
    # IngressRoute route for the UNSUFFIXED hostnames, which daniel-server forwards here once
    # its Docker copy is gone. Unset for a service whose Docker twin is still serving them.
    bridge_hostname: speedtest
    # An app endpoint that answers without a session, so a monitor can traverse the whole
    # bridge instead of stopping at Authelia's 302. Verified against the running container:
    # `{"message":"Speedtest Tracker is running!"}`, no data in it. Exposed LAN-only.
    bridge_probe_path: /api/healthcheck
    # No bridge_lan_prefixes. There was one for /api/ — homepage's speedtest widget reads
    # /api/speedtest/latest — but the widget now resolves speedtest.local to the cluster VIP
    # directly and never reaches the Docker edge. This was the weaker of the two: homepage
    # passes no credentials to speedtest, so the route really was unauthenticated, and it
    # covered the entire API rather than the one endpoint the probe above matches. Removed
    # 2026-08-06 with no caller left to break — see the freshrss entry for the log evidence.
  # No hostname/port: two headless DDNS clients with no web UI and no Traefik route, the
  # same shape as claude-otel's collector. Both copies run until cutover and write the same
  # values to the same records, which is idempotent at Cloudflare.
  - name: cloudflare-ddns
    platform: k8s
  # Slice 2, batch C — the first services whose data actually matters. Both seed a
  # `longhorn` (backed-up) PVC from daniel-server.
  - name: freshrss
    platform: k8s
    hostname: "freshrss{{ k8s_hostname_suffix }}"
    port: 80
    use_authelia: true
    # Cut over 2026-08-05. Nothing else changes: FreshRSS keeps its base_url in the seeded
    # config.php, which already reads https://freshrss.<domain> — it was written by the Docker
    # copy, so the cutover makes it correct rather than requiring an edit.
    bridge_hostname: freshrss
    # Returns the bare string `OK` without a session, so it proves PHP is executing while
    # exposing nothing. Safe ONLY because the probe router matches an exact Path: the GReader
    # API's real endpoints live at /api/greader.php/reader/api/0/..., which do not match and
    # so still fall through to the main router and Authelia.
    bridge_probe_path: /api/greader.php
    # No bridge_lan_prefixes. There was one for /api/greader.php/ — homepage's FreshRSS widget
    # reads unread counts over the GReader API — but the widget no longer takes that path: it
    # resolves freshrss.local to the cluster VIP directly (homepage's extra_hosts), so it never
    # reaches the Docker edge. Traefik's access log over the route's whole lifetime recorded
    # four requests across both LAN routers, all from daniel-server and all mine while
    # debugging; no other client ever used it. Removed 2026-08-06 because it was strictly wider
    # than the probe above: Path() matches one endpoint, PathPrefix() opened the whole GReader
    # subtree without forward-auth. Restore it if a LAN RSS client should reach the GReader API
    # at freshrss.local without SSO — FreshRSS's own 401 is the gate, not this route.
  # port 8000, not 80 — uWSGI serves directly, there is no nginx in front of it. The Docker
  # entry has said 8000 all along; assuming 80 here cost a five-minute rollout timeout with a
  # perfectly healthy app behind a probe pointed at a closed port.
  - name: healthchecks
    platform: k8s
    hostname: "healthchecks{{ k8s_hostname_suffix }}"
    port: 8000
    use_authelia: true
    bridge_hostname: healthchecks
    # No bridge_probe_path: the bypass below already reaches the app without a session, so a
    # second unauthenticated route would be a second hole for no extra signal. The monitor
    # probes /ping/<all-zero uuid> and treats 404 as healthy — Django answering 404 for an
    # unknown check proves the app ran, and a 400 instead would mean ALLOWED_HOSTS is wrong.
    bridge_bypass_prefixes:
      - /ping/
  # Slice 2, batch E. CouchDB for Obsidian LiveSync. use_authelia mirrors the Docker entry and
  # its reason: the LiveSync client uses non-interactive basic auth and cannot pass 2FA, so
  # CouchDB's own require_valid_user is the gate.
  #
  # Its data volume is longhorn-NOBACKUP (see the role's defaults), which makes this the first
  # migrated service whose PVC the backup plane deliberately ignores — kopiaignore.j2 excludes
  # the same directory today, for the B2-churn reason recorded there. The slice-2 doc's claim
  # that batch E "grows the backed-up set" is therefore wrong for livesync.
  - name: livesync
    platform: k8s
    hostname: "livesync{{ k8s_hostname_suffix }}"
    port: 5984
    use_authelia: false
    # Cut over 2026-08-06.
    bridge_hostname: livesync
    # The only bridge so far that suppresses the generic Host router. livesync's edge routing is
    # not "everything on this host": the sync API is gated on a secret header and /_utils is
    # carved out behind Authelia at priority 200, so an unconditional Host router would forward
    # traffic straight past the token check. The four replacements are hand-written in the
    # traefik role's config.yml.j2; the service and serversTransport are still generated, and a
    # guard test fails if nothing references them.
    bridge_custom_routers: true
    # `/` and it is genuinely end-to-end, which no other gated service manages. Everywhere else
    # the probe path has to be an endpoint that answers without a session; here EVERY endpoint
    # answers without one, because require_valid_user means CouchDB replies 401 rather than
    # redirecting. So a 401 through this route was produced by CouchDB, in the cluster, having
    # crossed the bridge — the same quality of signal littlelink's 200 gives. Measured: `/` and
    # `/_up` both return 401 unauthenticated.
    #
    # It is exposed LAN-only, like every probe route, and it exposes nothing: an unauthenticated
    # caller gets the 401 and stops there.
    bridge_probe_path: /
    # A bridged request is metered TWICE — the Docker edge router and this cluster route — and
    # the tighter ceiling wins. The Docker side gave livesync a 20x limiter (rate-limit-livesync,
    # 6000/min) because CouchDB replication is extremely chatty; without the matching override
    # here the cluster's default 300/min silently re-imposed exactly what that exemption existed
    # to remove, and a phone mid-pull got 429s within the hour of cutover.
    bridge_rate_limit: rate-limit-bridge-livesync
  # Slice 2, batch E. Four workloads — the app, headless Chrome, Meilisearch and the time-tagger
  # — which is the largest single service in the slice. Only the app is routed; the other three
  # are reached in-cluster by Service name, and those names are load-bearing because karakeep
  # addresses them exactly as it addressed the Compose service keys.
  - name: karakeep
    platform: k8s
    hostname: "karakeep{{ k8s_hostname_suffix }}"
    port: 3000
    use_authelia: true
    # Cut over 2026-08-06. NEXTAUTH_URL follows this (see the role's deployment template): the
    # sign-in redirect has to name the hostname the browser actually arrived on, and getting it
    # wrong does not fail at startup — the pod goes ready and login bounces users somewhere that
    # does not resolve for them.
    bridge_hostname: karakeep
    # Reproduces the karakeep-api Docker router, which has always been public: /api/v1 is
    # Bearer-token authenticated, and the browser extension and mobile app cannot pass 2FA. This
    # carries an existing hole across rather than opening one — but it is still public, hence the
    # entry in BRIDGE_BYPASS_PREFIXES.
    #
    # The trailing slash is load-bearing, carried across from that label: PathPrefix(`/api`)
    # would also match siblings like /api-docs and widen the bypass to them.
    #
    # No bridge_lan_prefixes for homepage's widget: this bypass generates a `.local` router as
    # well as a public one, and the widget calls /api/. A second route would be a second hole
    # for nothing.
    #
    # No bridge_rate_limit either. Unlike livesync there is no rate-limit-karakeep at the edge —
    # karakeep has always run under the shared 300/min `rate-limit`, and rate-limit-bridge is
    # the same 300/150/1m keyed the same way, so the double-metering the macro guards against
    # meters it at the ceiling it already lives under.
    bridge_bypass_prefixes:
      - /api/
  # Slice 2, batch R. No hostname/port and no Traefik route on purpose: this is an
  # unauthenticated plain-HTTP registry, reachable only on the node's loopback via hostPort
  # and in-cluster via its Service. Giving it an ingress would put push access on the LAN.
  - name: registry
    platform: k8s
  # Slice 2, batch D. Not a service — a deploy-time image build, entered here because that is
  # how a k8s role gets invoked and tagged. No hostname, no port, no route: it produces the two
  # images n8n runs and exits. Separate from k8s/n8n rather than folded into it because a
  # BuildKit rebuild is minutes of work that every n8n redeploy would otherwise pay.
  - name: n8n-images
    platform: k8s
  # Migrated 2026-08-06, batch D. THE ONLY SERVICE IN THIS SLICE WITH NO COEXISTENCE WINDOW:
  # its scheduled workflows (RSS polls, a daily email, a TickTick calendar sync) would each
  # fire twice with both copies running, and the TickTick sync writes to a third party. So the
  # Docker copy was stopped before the seed and the first deploy WAS the cutover — hence
  # bridge_hostname being set from the outset, unlike every entry above it.
  - name: n8n
    platform: k8s
    hostname: "n8n{{ k8s_hostname_suffix }}"
    port: 5678
    use_authelia: true
    bridge_hostname: n8n
    # Reproduces the compose template's `n8n-webhook` router. External services POST here with
    # no session — Authelia would not fail loudly, it would silently break every registered
    # webhook while the callers keep reporting success. Public on purpose; the trailing slash
    # keeps /webhook-test/ (the dev-only endpoint) out, exactly as the Docker rule did.
    bridge_bypass_prefixes:
      - /webhook/
    # No bridge_lan_prefixes for monitor-bridge's check_n8n API poll, and that is not an
    # omission. A route via the Docker edge is unreachable from the container that needs it:
    # Traefik publishes its ports from the `apps` network, and a container cannot reach
    # hostIP:publishedPort when the publishing container shares its own bridge (same-bridge
    # hairpin NAT — see docs/k3s-migration/slice-2-leaf-apps.md). The check talks to the -k8s
    # name and the cluster VIP directly instead — see the -monitoring IngressRoute in the
    # role's ingressroute.yaml.j2.
# Enabled 2026-08-01, once this host's first manual initial_setup.yml + deploy.yml run
# finished green — the condition README §4 sets. It stays false before that because the
# gitops_deploy handler shells a full deploy at the end of initial_setup.yml and fails the
# play with it, so a single bad service would take down the whole OS-hardening run.
has_gitops: true
# This is the k3s node — it must NOT have Docker. k3s brings its own containerd and its
# flannel/kube-proxy iptables rules; daniel-box was chosen to go first precisely because it
# had no container runtime. A bare `initial_setup.yml` (no --tags) installed Docker here on
# 2026-08-01, which tripped the k3s role's fail-closed guard and blocked k3s-bringup.yml.
# Docker was purged the same day. Keep this false — it is what makes the removal hold.
has_docker: false
# Developer environment, opted in (both default false in group_vars/all.yml). profile
# "server" matches daniel-server and pulls the full CLI toolchain on first apply.
# Claude Code still needs one interactive `claude login` on this host afterwards —
# the role installs the binary but cannot mint the OAuth credential.
has_github_cli: true
has_chezmoi: true
has_claude_code: true
# Deliberately unset. This is an AMD Ryzen 7 8845HS with a Radeon 780M — /dev/dri/renderD128
# already exists, and `has_igpu` means "pass /dev/dri through", which AMD uses for VAAPI too
# (README §7). It gates nothing while containers_list is empty; set it when jellyfin/tdarr
# land here. The i915 modprobe task self-skips on a non-Intel GPU either way.
#
# Superseded for the k8s workloads by render_gid below: in the cluster a container reaches the
# render node through the device plugin plus group membership, not through a device passthrough
# flag. has_igpu remains the Docker-side switch.
# has_igpu: true

# The `render` group's GID on THIS host, verified 2026-08-08 (`getent group render` → 993).
#
# Host-specific by nature, which is why it is here rather than in a role default. The device
# plugin gets a container past the cgroup v2 device filter; this gets it past the file mode
# (/dev/dri/renderD128 is crw-rw---- root:render and the pods run as uid 1000). Nothing
# guarantees 993 on another machine, and daniel-server joining the cluster at slice 7 is exactly
# when a hardcoded one would silently become wrong — the symptom would be EACCES on open,
# distinct from the EPERM that means the cgroup filter refused (B1/D2).
render_gid: 993
