---
server_ip: 10.0.0.215
# Cloud-init (subiquity) image, like the Pi: sshd's real config is the drop-in, not the
# bare /etc/ssh/sshd_config. Verified on the host — /etc/ssh/sshd_config.d/ contains only
# 50-cloud-init.conf. The SSH-hardening tasks have no `create:` fallback, so a wrong value
# here fails initial_setup.yml outright.
ssh_config_path: /etc/ssh/sshd_config.d/50-cloud-init.conf
# Slice 1 of the k3s migration (docs/k3s-migration/slice-1-ingress-sso-leaf.md). Every entry
# is platform: k8s, so deploy.yml's Docker play filters them all out and its k8s play picks
# them up — the keys are otherwise the same ones the Docker entries use, which is the point
# of the platform key.
#
# ORDER IS LOAD-BEARING and there is no toposort on this play: the traefik role installs the
# Traefik CRDs that every IngressRoute and Middleware below depends on, and bento-pdf's route
# references the `authelia` Middleware the authelia role creates.
#
# `hostname` carries the -k8s suffix while the Docker twin still serves the unsuffixed name.
# Single-label on purpose — bento-pdf-k8s.local.<domain> is covered by the existing
# *.local.<domain> wildcard cert; a nested bento-pdf.k8s.local.<domain> would not be.
containers_list:
  - name: traefik
    platform: k8s
    port: 8080
  - name: authelia
    platform: k8s
    hostname: "auth{{ k8s_hostname_suffix }}"
    port: 9091
    use_authelia: false
  - name: bento-pdf
    platform: k8s
    hostname: "bento-pdf{{ k8s_hostname_suffix }}"
    port: 8080
    use_authelia: true
  # Claude Code telemetry sink. No `port` and no `hostname` on purpose: it has no Traefik
  # route at all. Claude Code runs on this HOST and exports to 127.0.0.1:4317, reaching the
  # collector through a hostPort rather than the ingress — content logging is on, so nothing
  # here should be reachable from the LAN. Grafana (slice 2) is what will earn a hostname.
  #
  # Ordering IS load-bearing on this list (no toposort in the k8s play): this must follow
  # traefik, whose CRDs the IngressRoute and Middlewares below depend on, and authelia,
  # whose Service the forward-auth Middleware points at.
  #
  # `hostname`/`port` describe Grafana specifically — the only routed workload here. The
  # collector is reached on the node's loopback via hostPort, not through the ingress, and
  # Loki/Prometheus have no route at all.
  - name: claude-otel
    platform: k8s
    hostname: "grafana{{ k8s_hostname_suffix }}"
    port: 3000
    use_authelia: true
  # Slice 2, batch A (docs/k3s-migration/slice-2-leaf-apps.md). The Docker twin serves `www`;
  # this one answers on www-k8s until cutover. use_authelia mirrors the Docker entry and its
  # reason: this is the public link-in-bio landing page, so a login gate would break it.
  - name: littlelink
    platform: k8s
    hostname: "www{{ k8s_hostname_suffix }}"
    port: 3000
    use_authelia: false
    # Cut over 2026-08-05. No bridge_probe_path, and that is not an omission: with no
    # forward-auth in front of it, the ordinary littlelink-bridge monitor already reaches the
    # app itself, so this is the one bridged service whose normal monitor is end-to-end. That
    # makes it the canary for the bridge mechanism the gated services depend on.
    bridge_hostname: www
  # Slice 2, batch B. First PVC seeded from daniel-server, and the first k8s Secret
  # (Laravel's APP_KEY) — deliberately on a service whose data is disposable, so the
  # seed-volume mechanic is proven where a botched copy costs nothing.
  - name: speedtest
    platform: k8s
    hostname: "speedtest{{ k8s_hostname_suffix }}"
    port: 80
    use_authelia: true
    # First service behind the strangler bridge. Setting this adds a second, ClientIP-guarded
    # IngressRoute route for the UNSUFFIXED hostnames, which daniel-server forwards here once
    # its Docker copy is gone. Unset for a service whose Docker twin is still serving them.
    bridge_hostname: speedtest
    # An app endpoint that answers without a session, so a monitor can traverse the whole
    # bridge instead of stopping at Authelia's 302. Verified against the running container:
    # `{"message":"Speedtest Tracker is running!"}`, no data in it. Exposed LAN-only.
    bridge_probe_path: /api/healthcheck
  # No hostname/port: two headless DDNS clients with no web UI and no Traefik route, the
  # same shape as claude-otel's collector. Both copies run until cutover and write the same
  # values to the same records, which is idempotent at Cloudflare.
  - name: cloudflare-ddns
    platform: k8s
  # Slice 2, batch C — the first services whose data actually matters. Both seed a
  # `longhorn` (backed-up) PVC from daniel-server.
  - name: freshrss
    platform: k8s
    hostname: "freshrss{{ k8s_hostname_suffix }}"
    port: 80
    use_authelia: true
    # Cut over 2026-08-05. Nothing else changes: FreshRSS keeps its base_url in the seeded
    # config.php, which already reads https://freshrss.<domain> — it was written by the Docker
    # copy, so the cutover makes it correct rather than requiring an edit.
    bridge_hostname: freshrss
    # Returns the bare string `OK` without a session, so it proves PHP is executing while
    # exposing nothing. Safe ONLY because the probe router matches an exact Path: the GReader
    # API's real endpoints live at /api/greader.php/reader/api/0/..., which do not match and
    # so still fall through to the main router and Authelia.
    bridge_probe_path: /api/greader.php
  # port 8000, not 80 — uWSGI serves directly, there is no nginx in front of it. The Docker
  # entry has said 8000 all along; assuming 80 here cost a five-minute rollout timeout with a
  # perfectly healthy app behind a probe pointed at a closed port.
  - name: healthchecks
    platform: k8s
    hostname: "healthchecks{{ k8s_hostname_suffix }}"
    port: 8000
    use_authelia: true
    bridge_hostname: healthchecks
    # No bridge_probe_path: the bypass below already reaches the app without a session, so a
    # second unauthenticated route would be a second hole for no extra signal. The monitor
    # probes /ping/<all-zero uuid> and treats 404 as healthy — Django answering 404 for an
    # unknown check proves the app ran, and a 400 instead would mean ALLOWED_HOSTS is wrong.
    bridge_bypass_prefixes:
      - /ping/
  # Slice 2, batch R. No hostname/port and no Traefik route on purpose: this is an
  # unauthenticated plain-HTTP registry, reachable only on the node's loopback via hostPort
  # and in-cluster via its Service. Giving it an ingress would put push access on the LAN.
  - name: registry
    platform: k8s
# Enabled 2026-08-01, once this host's first manual initial_setup.yml + deploy.yml run
# finished green — the condition README §4 sets. It stays false before that because the
# gitops_deploy handler shells a full deploy at the end of initial_setup.yml and fails the
# play with it, so a single bad service would take down the whole OS-hardening run.
has_gitops: true
# This is the k3s node — it must NOT have Docker. k3s brings its own containerd and its
# flannel/kube-proxy iptables rules; daniel-box was chosen to go first precisely because it
# had no container runtime. A bare `initial_setup.yml` (no --tags) installed Docker here on
# 2026-08-01, which tripped the k3s role's fail-closed guard and blocked k3s-bringup.yml.
# Docker was purged the same day. Keep this false — it is what makes the removal hold.
has_docker: false
# Developer environment, opted in (both default false in group_vars/all.yml). profile
# "server" matches daniel-server and pulls the full CLI toolchain on first apply.
# Claude Code still needs one interactive `claude login` on this host afterwards —
# the role installs the binary but cannot mint the OAuth credential.
has_github_cli: true
has_chezmoi: true
has_claude_code: true
# Deliberately unset. This is an AMD Ryzen 7 8845HS with a Radeon 780M — /dev/dri/renderD128
# already exists, and `has_igpu` means "pass /dev/dri through", which AMD uses for VAAPI too
# (README §7). It gates nothing while containers_list is empty; set it when jellyfin/tdarr
# land here. The i915 modprobe task self-skips on a non-Intel GPU either way.
# has_igpu: true
