---
server_ip: 10.0.0.215
# The link carrying server_ip. setup/k3s pins the address on it statically, so k3s still
# starts when the gateway's DHCP server is down (#3882). Confirm the gateway keeps server_ip
# out of its DHCP pool before applying it: with DHCPv4 off, nothing renews a lease on it.
k3s_node_static_link: eno1
# The MediaTek MT7922, the fallback uplink while eno1 has no carrier (setup/k3s,
# tasks/static-address.yml).
k3s_node_wifi_link: wlp4s0
# daniel-server's node-to-node traffic (6443/8472/10250, k3s_join_server_ports) is
# UFW-allowed here by the k3s-server component's k3s-join-* rules. Derived from daniel-server's one
# literal (#4063).
k3s_agent_node_ips:
  - "{{ hostvars['daniel-server'].server_ip }}"
# Cloud-init (subiquity) image: sshd's real config is the drop-in, not the bare
# /etc/ssh/sshd_config. The sshd and integrity-scans components read this path, so a wrong
# value points them at a file sshd never loads.
ssh_config_path: /etc/ssh/sshd_config.d/50-cloud-init.conf
# fwupd is installed here (`dpkg -l fwupd`, 2026-10-31), so the host-maintenance component ships
# the weekly firmware update. group_vars/all.yml defaults this false.
has_fwupd: true
# Reconciler mode: live = grab a genuine replacement, verify (host ffprobe), delete the
# fake + import. off/shadow also available.
autofix_fake_remux_replace_mode: live
# The reconciler's git-tracked selection policy, rendered to policy.json by the
# autofix-bridge role. Quality range is deferred to Sonarr's profile — no resolution floor,
# no codec ban; authenticity is enforced post-download, codec-agnostically.
autofix_fake_remux_policy:
  deny_release_groups: [NTRX]
  prefer_release_groups: [VARYG]
  prefer_indexers: [Nyaa.si, Knaben]
  depreference_codecs: [av1]
  gop_max_s: 5
  min_size_gb: 0.4
  max_size_gb: 8.0  # sanity ceiling — wide enough for a genuine 2160p WEB-DL episode
  max_concurrent_replacements: 5
  searches_per_tick: 2
  search_spacing_s: 20
  download_stall_hours: 12
  import_timeout_s: 3600
  grab_grace_s: 300
  max_attempts: 3
  history_retention_days: 14

# This is the k3s node — it must NOT have Docker. k3s brings its own containerd and its
# flannel/kube-proxy iptables rules, which Docker's own iptables rules break. Keep this false.
has_docker: false
# Developer environment, opted in (both default false in group_vars/all.yml). Claude Code
# still needs one interactive `claude login` here afterwards — the package installs the binary
# but cannot mint the OAuth credential.
has_github_cli: true
has_chezmoi: true
has_claude_code: true
# The only memory store sessions write; claude-memory-sync.timer copies it, one-way and
# overwriting, to daniel-server (issue #3123, the operator's decision of 2026-10-01).
claude_code_memory_sync_enabled: true
# Lands a finished daniel-server fan-out batch's PR when its review record and its PR both pass
# autoland.py's rule (issue #5496, the operator's go-ahead of 2026-10-18). False removes the
# timer and its units, and every server batch stops at its PR again.
claude_code_fanout_server_lander_enabled: true
# Snapshots the per-PR pipeline timeline daily, before its journal inputs rotate (issue #5661).
# False removes the timer and its units; the snapshots stay.
claude_code_pipeline_timeline_enabled: true
# The D5 flip pre-merge checks as one sudoers-granted wrapper (issue #5494); daniel-box holds the
# cluster-admin kubeconfig. False removes the grant, the wrapper, the flux copy and the state dir.
claude_code_takeover_check_enabled: true
# The read-only root inspector, `rootq` (issue #6323), for the operator's account.
# False removes the grant, the shim and the script.
claude_code_rootq_enabled: true
# The same inspector for the agent user through a socket (issue #6350). False removes the
# socket, its units, the helper, the client and the group, and the agent leaves the group.
claude_code_rootq_socket_enabled: true
# The `claude` Unix user the operator's Claude sessions move to, with no sudo and no read on
# /home/ubuntu. It needs one interactive `claude` login as that user, like has_claude_code
# above. False expires the account and keeps its home.
claude_code_agent_user_enabled: true
# The account claude-rc.service runs as: the phone's sessions run as the agent user. The first
# apply after this lands restarts the host and drops live sessions, copies the operator's memory
# store into the agent's once, and needs one interactive `/login` as `claude` afterwards
# (docs/claude-agent-user.md, slice 4). Rollback: set it to `ubuntu`, or delete this line.
# Rolled back to `ubuntu` on 2026-11-08 while GitHub support restores the agent account's
# GitHub access. To move the phone's sessions back to the agent, set this to
# "{{ claude_code_agent_user }}".
claude_code_user: ubuntu
# That account's uid, which must equal the `claude` entry in hosts/daniel-box/package.yml's
# `users:`. claude-rc.service binds /run/user/<uid> into its sandbox and points the user bus
# there, so `systemd-run --user` works from a phone session (#6764). It has no default: a host
# that sets claude_code_user to a non-operator account and not this fails its render.
claude_code_user_uid: 996
# claude-land@<n>.service: the agent user starts it to land its own PR as the operator, under
# land.sh's landing policy. False removes the unit, its polkit rule and its approval list.
claude_code_lander_enabled: true
# claude-triage@<episode>.service: one capped, diagnose-only session as the agent user per monitor
# episode, with a report and a Discord page (docs/claude-agent-user.md, "Alert-triggered
# triage"). Needs claude_code_triage_claude_oauth_token in secrets.yml. False removes the units,
# the rule, the code and the config, and keeps the records.
claude_code_triage_enabled: true
# The agent user's own Node, @playwright/mcp, Chromium and homelab-ui MCP registration, so a
# phone session can check that a UI renders (#4058). False removes all four.
claude_code_agent_homelab_ui_enabled: true
# The agent user takes the operator's dotfiles through chezmoi, under their `agent` flag, in
# place of the hand-picked config copy (operator, 2026-10-10; docs/claude-agent-user.md, "The
# operator's dotfiles"). A dotfiles source without the flag is refused and changes nothing.
# Rollback: delete this line; the copy comes back on the next apply.
claude_code_agent_dotfiles: true
# Slice 6 (docs/claude-agent-user.md): sessions here are meant to run as `claude`, but background
# jobs and fan-out still start as ubuntu. The login caps leave user-1000.slice, and
# claude-cgroup-metrics.sh counts any `claude` process uid 1000 still runs. No alert rule reads
# that count, so such a process never pages (#5125). Rollback: delete both lines.
claude_code_login_uids: []
claude_code_watch_uids: ["{{ claude_code_login_uid }}"]
# `has_igpu` is deliberately unset. It means "pass /dev/dri through" (README §7) and is the
# Docker-side switch; for the k8s workloads render_gid below supersedes it, because in the
# cluster a container reaches the render node through the device plugin plus group
# membership rather than a device passthrough flag.
#
# The `render` group's GID on THIS host. Host-specific by nature, which is why it is here
# rather than in a role default. The device plugin gets a container past the cgroup v2
# device filter; this gets it past the file mode (/dev/dri/renderD128 is crw-rw----
# root:render and the pods run as uid 1000). Nothing guarantees 993 on another machine, and
# the symptom of a wrong value is EACCES on open — distinct from the EPERM that means the
# cgroup filter refused.
render_gid: 993

# The unattended Renovate agent (hosts/components/renovate-agent). The timer fires at 06:00
# America/Chicago daily and spends one headless session over the open Renovate PRs, landing up
# to renovate_agent_max_prs of them through the renovate-agent-land@ lander. Setting this back
# to false stops and disables the timer; that is the rollback.
#
# Disarmed on 2026-10-03 and re-armed on 2026-10-05, once the session ran as its own user on
# a repo-scoped token with no contents write (renovate_agent_gh_token) and the lander unit
# alone could merge. Do not arm it again without both in place.
renovate_agent_enabled: true

# The window in which homelab-k3s-restart may restart k3s (H6.3b, hosts/components/k3s-restart).
# An OnCalendar value, read by the component's timer: host_vars sit above a component's defaults,
# so each host's package carries its own slot (H3, *Component variables*). The slot falls between
# the `*/10` and `*/30` cron fires at 11:30 and the next at 11:40, misses the `*/15` fire at
# 11:45 and the hourly :23 timer, and skips the 1st of the month, when the hypervisor drill starts
# at 11:20 on daniel-server. hosts/lib/tests/test_k3s_restart_window.py derives all of that from
# the schedules, and re-checks any move.
k3s_restart_window: "Mon..Fri *-*-02..31 11:32:00"
