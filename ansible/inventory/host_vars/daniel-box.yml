---
server_ip: 10.0.0.215
# daniel-server's node-to-node traffic (6443/8472/10250, k3s_join_server_ports) is
# UFW-allowed here via the k3s role's join-firewall tag.
k3s_agent_node_ips:
  - 10.0.0.161
# Cloud-init (subiquity) image: sshd's real config is the drop-in, not the bare
# /etc/ssh/sshd_config. The SSH-hardening tasks have no `create:` fallback, so a wrong
# value here fails initial_setup.yml outright.
ssh_config_path: /etc/ssh/sshd_config.d/50-cloud-init.conf
# 28 GiB of RAM on the control-plane node — etcd, Longhorn and Prometheus hold heaps that
# must not be swapped, so initial_setup lowers vm.swappiness to 10 here. Measured at the
# default swappiness of 60: 18 GiB available, 15 GiB page cache, 166 MiB already in swap.
# group_vars/all.yml defaults this false.
has_ample_ram: true
# Reconciler mode: live = grab a genuine replacement, verify (host ffprobe), delete the
# fake + import. off/shadow also available.
autofix_fake_remux_replace_mode: live
# The reconciler's git-tracked selection policy, rendered to policy.json by the
# autofix-bridge role. Quality range is deferred to Sonarr's profile — no resolution floor,
# no codec ban; authenticity is enforced post-download, codec-agnostically.
autofix_fake_remux_policy:
  deny_release_groups: [NTRX]
  prefer_release_groups: [VARYG]
  prefer_indexers: [Nyaa.si, Knaben]
  depreference_codecs: [av1]
  gop_max_s: 5
  min_size_gb: 0.4
  max_size_gb: 8.0  # sanity ceiling — wide enough for a genuine 2160p WEB-DL episode
  max_concurrent_replacements: 5
  searches_per_tick: 2
  search_spacing_s: 20
  download_stall_hours: 12
  import_timeout_s: 3600
  grab_grace_s: 300
  max_attempts: 3
  history_retention_days: 14

# The k8s play (ansible/deploy.yml) toposorts this list with build_k8s_dep_map /
# toposort_containers (ansible/filter_plugins/toposort.py) rather than deploying it in list
# order. The traefik-CRD and authelia-middleware edges below are derived automatically, from
# each role's own templates and its `use_authelia` flag — a new entry gets them for free and
# does not need to be positioned by hand. List order is kept only as the toposort's tiebreak,
# so today's order stays the sorted order and a diff here still reads as "nothing moved".
#
# Every `use_authelia: true` entry also declares `auth_tier: one_factor | two_factor` — the
# Authelia policy its LAN name (`<hostname>.local.<domain>`) gets. The authelia role renders
# its per-service access_control rules from these (filter_plugins/authelia_access.py), and an
# entry that attaches the middleware without a tier fails the render, so no service rides the
# `*.local` wildcard by omission. The public name is two_factor whatever is declared here. A
# scoped bypass (uptime-kuma's push API, scrutiny's read-only probes) has no per-service shape
# and stays a hand-written rule in the authelia template; the entry's tier is what its UI gets.
#
# `tier:` ranks a service, and is declared here once and derived elsewhere
# (filter_plugins/service_tier.py, #3389). `home-edge` is the edge (crowdsec, traefik), SSO
# (authelia) and LAN DNS (pihole); `home-automation` is the automation chain (mosquitto,
# zigbee2mqtt, home-assistant). Together they are the `home-critical` group, the services the
# house and SSO stop working without. `platform` is critical without being home-critical: the
# registry, the alert bridge, the UPS primary and the remote-access tunnel. Each tier names one
# PriorityClass, and a tiered role's templates take it from `tier_priority_class` rather than
# writing it (#3452). A home-critical entry's `backup_claims` names its Longhorn
# volumes worth a daily backup; the k3s role's `k3s_longhorn_r2_volumes` is those claims, and
# `ansible/tests/longhorn/test_r2_tier_is_derived.py` checks them against the role's rendered
# PVCs. A tiered entry with no `backup_claims` holds nothing worth a daily copy.
containers_list:
  # crowdsec must precede traefik: the traefik pod carries a crowdsec agent sidecar that logs
  # into this engine's LAPI, and a post-deploy task in this role registers the machine
  # credential — so the engine must exist before a traefik rollout starts the sidecar. Not
  # derivable from a template, so it is declared as traefik's `depends_on:` below rather than
  # hand-positioned; see K8S_CRD_EDGE_EXEMPT in toposort.py for why the reverse (CRD) edge is
  # exempted here instead of cycling against it.
  #
  # The cost accepted for that: this role renders an IngressRoute (the LAPI's LAN face)
  # ahead of traefik installing the CRDs. Harmless on the running cluster; on a rebuild it
  # is the one first-run ordering failure we accept, because the credential constraint wins.
  - name: crowdsec
    platform: k8s
    # daniel-server's agent and its traefik bouncer authenticate here with machine/bouncer
    # keys, so use_authelia false is load-bearing. hostname also feeds the Pi-hole
    # per-service DNS override.
    hostname: "crowdsec-lapi"
    port: 8080
    use_authelia: false
    # crowdsec-db is in k3s_longhorn_nobackup_volumes: decisions re-derive from logs.
    tier: home-edge
  - name: traefik
    platform: k8s
    port: 8080
    depends_on: [crowdsec]
    tier: home-edge
    backup_claims: [traefik-acme]
  - name: authelia
    platform: k8s
    # This portal's name is the OIDC issuer Jellyfin's SSO plugin points at.
    hostname: "auth"
    port: 9091
    use_authelia: false
    tier: home-edge
    backup_claims: [authelia-config]
  - name: bento-pdf
    platform: k8s
    # Single-label on purpose — bento-pdf.local.<domain> is covered by the existing
    # *.local.<domain> wildcard cert; a nested bento-pdf.k8s.local.<domain> would not be.
    hostname: "bento-pdf"
    port: 8080
    use_authelia: true
    auth_tier: one_factor
  - name: texbrain
    platform: k8s
    # Single label, for the same wildcard-cert reason as bento-pdf above.
    hostname: "texbrain"
    port: 8080
    use_authelia: true
    auth_tier: one_factor
  # Read-only cluster UI. use_authelia is load-bearing rather than decorative: the pod runs
  # with -unsafe-use-service-account-token, so this Middleware is the only thing between a
  # browser and the dashboard's (read-only) cluster identity.
  - name: headlamp
    platform: k8s
    hostname: "headlamp"
    port: 4466
    use_authelia: true
    auth_tier: one_factor
  # Route-only: the backend is deploy-ui.service on this host (roles/setup/deploy_ui), reached
  # through a selector-less Service. use_authelia is the whole access control, and the tier is
  # two_factor because the page starts land.sh/deploy.sh and clears the deployer's hold on a
  # stolen password alone.
  - name: deploy-ui
    platform: k8s
    hostname: "deploy"
    port: 8790
    use_authelia: true
    auth_tier: two_factor
  # Route-only entry: Longhorn's workloads come from the upstream manifest roles/setup/k3s
  # applies, and this role adds nothing but the IngressRoute plus the middleware copies it
  # needs inside longhorn-system. `port` is longhorn-frontend's Service port. use_authelia
  # is the entire access control — Longhorn's UI has no login of its own. two_factor: the UI
  # deletes volumes, replicas and their B2 backup chain on a stolen password alone, a heavier
  # blast radius than code-server/n8n.
  - name: longhorn-ui
    platform: k8s
    hostname: "longhorn"
    port: 80
    use_authelia: true
    auth_tier: two_factor
  # Makes /dev/dri/renderD128 schedulable as `devic.es/dri` so jellyfin and tdarr can
  # request it without being privileged. No port/hostname — nothing routes to it.
  - name: dri-device-plugin
    platform: k8s
  # The shared /data volume the nine media workloads mount. Storage, not a service.
  # Must precede every media workload — a pod that mounts an undeclared claim stays
  # Pending, and WaitForFirstConsumer makes that look like a scheduling problem rather
  # than a missing volume.
  #
  # Its seeding copy does NOT run on an ordinary deploy: it is gated behind
  # `-e media_volume_sync=true` because the rsync mirrors with --delete, which would erase
  # whatever qbittorrent has downloaded. See the role's tasks/sync.yml.
  - name: media-volume
    platform: k8s
  # Mounts media-volume's claim at /data, so `depends_on` puts it after that role — as it does
  # for every other media-data mounter below. ansible/tests/deploy/test_k8s_toposort.py pins
  # each pair.
  - name: sonarr
    platform: k8s
    depends_on: [media-volume]
    hostname: "sonarr"
    port: 8989
    use_authelia: true
    auth_tier: one_factor
    service_extra_ports:
      # The exportarr sidecar's scrape port. Named, and so is the primary port the shared
      # default renders beside it: Kubernetes rejects a Service mixing named and unnamed
      # ports, and rejects it at APPLY time, after every repo-side check has read green.
      - name: metrics
        port: 9707
    # Callers of roles/k8s/sonarr/templates/networkpolicy.yaml.j2, the additive fence on
    # this port; the header there says why each class of caller is listed. The role renders it
    # itself so `--tags sonarr` carries its own fence, hence netpol_role_owned.
    netpol_role_owned: true
    netpol_from:
      - traefik         # deliberate, not redundant — see the policy's header
      - janitorr        # templates/config/application.yml.j2 — deploy-time verify too
      - configarr       # CronJob; its pod template carries app: configarr
      - monitor-bridge  # env-secret.yaml.j2, cluster FQDN
      - autofix-bridge  # env-secret.yaml.j2, cluster FQDN
      - bazarr          # app DB, bare name — see the policy's header
      - prowlarr        # Application Sync writes indexers in — see the policy's header
      - homepage        # dashboard widget, ClusterIP — see the policy's header
  # Runs a WireGuard/Mullvad sidecar sharing the pod's netns, gating qbittorrent's start so
  # it cannot talk to a tracker before the kill-switch exists.
  - name: qbittorrent
    platform: k8s
    depends_on: [media-volume]
    hostname: "qbittorrent"
    port: 8080
    use_authelia: true
    auth_tier: one_factor
  - name: radarr
    platform: k8s
    depends_on: [media-volume]
    hostname: "radarr"
    port: 7878
    use_authelia: true
    auth_tier: one_factor
    service_extra_ports:
      # The exportarr sidecar's scrape port. Named, and so is the primary port the shared
      # default renders beside it: Kubernetes rejects a Service mixing named and unnamed
      # ports, and rejects it at APPLY time, after every repo-side check has read green.
      - name: metrics
        port: 9707
    # Callers of roles/k8s/radarr/templates/networkpolicy.yaml.j2, the additive fence on
    # this port; the header there says why each class of caller is listed. The role renders it
    # itself so `--tags radarr` carries its own fence, hence netpol_role_owned.
    netpol_role_owned: true
    netpol_from:
      - traefik         # deliberate, not redundant — see the policy's header
      - janitorr
      - configarr
      - monitor-bridge
      - autofix-bridge
      - bazarr
      - prowlarr        # Application Sync writes indexers in — see the policy's header
      - homepage        # dashboard widget, ClusterIP — see the policy's header
  # Brings a second workload with it — flaresolverr, which renders attacker-supplied
  # Cloudflare pages. An INGRESS NetworkPolicy keeps it reachable from prowlarr alone;
  # ingress is the direction actually enforced on this cluster.
  - name: prowlarr
    platform: k8s
    hostname: "prowlarr"
    port: 9696
    use_authelia: true
    auth_tier: one_factor
    service_extra_ports:
      # The exportarr sidecar's scrape port. Named, and so is the primary port the shared
      # default renders beside it: Kubernetes rejects a Service mixing named and unnamed
      # ports, and rejects it at APPLY time, after every repo-side check has read green.
      - name: metrics
        port: 9707
    # Callers of roles/k8s/prowlarr/templates/networkpolicy-prowlarr.yaml.j2, the additive fence on
    # this port; the header there says why each class of caller is listed. The role renders it
    # itself so `--tags prowlarr` carries its own fence, hence netpol_role_owned.
    netpol_role_owned: true
    netpol_from:
      - traefik                    # deliberate, not redundant — see the policy's header
      - monitor-bridge
      - sonarr
      - radarr
      - flaresolverr-netpol-probe  # control leg of this role's own isolation probe
  - name: bazarr
    platform: k8s
    depends_on: [media-volume]
    hostname: "bazarr"
    port: 6767
    use_authelia: true
    auth_tier: one_factor

  # use_authelia stays FALSE, and that is load-bearing rather than an oversight: Jellyfin's
  # clients are TV and phone apps that cannot complete a web SSO flow.
  - name: jellyfin
    platform: k8s
    depends_on: [media-volume]
    hostname: "jellyfin"
    port: 8096
    use_authelia: false

  # Holds the GPU for minutes at a time on real files and rewrites the library IN PLACE —
  # the one media service where a wrong mount does lasting damage rather than a failed
  # request. Its /media mount is consequently the only read-write one among the consumers.
  - name: tdarr
    platform: k8s
    depends_on: [media-volume]
    hostname: "tdarr"
    port: 8265
    use_authelia: true
    auth_tier: one_factor

  # A nightly reconcile that reads the two *arrs and exits, so it is a CronJob with no
  # Service and nothing to route to. Must follow sonarr and radarr: it addresses them by
  # bare Service name.
  - name: configarr
    platform: k8s

  # No web UI, so no route. Must follow sonarr, radarr AND jellyfin: it addresses all three
  # by bare Service name, and its verify step reads a symlink from inside the jellyfin pod.
  - name: janitorr
    platform: k8s
    depends_on: [media-volume, sonarr, radarr, jellyfin]

  - name: observability
    platform: k8s
    # `hostname`/`port` describe Grafana — the only routed workload here. The OTEL
    # collector, Loki, Prometheus and Tempo are reached on the node's loopback via hostPort
    # so `otelq`, which hardcodes 127.0.0.1, can read them from the host. Content logging is
    # on, so none of them gets an ingress route.
    hostname: "grafana"
    port: 3000
    use_authelia: true
    auth_tier: one_factor
    # Prometheus' own name, so Pi-hole answers it with the cluster VIP instead of the
    # local.<domain> wildcard pointing at daniel-server. monitor-bridge runs there and
    # cannot reach this host's ClusterIP or its loopback-pinned hostPort, so this name plus
    # the role's query-only `prometheus-monitoring` IngressRoute is the whole path in. Keep
    # the two in step — that route hardcodes `prometheus`.
    extra_hostnames:
      - "prometheus"
  # The public link-in-bio landing page, so a login gate would break it.
  - name: littlelink
    platform: k8s
    hostname: "www"
    port: 3000
    use_authelia: false
  - name: speedtest
    platform: k8s
    hostname: "speedtest"
    port: 80
    use_authelia: true
    auth_tier: one_factor
    # Callers beyond the baseline, rendered by netpol-baseline's networkpolicy-callers.yaml.j2.
    # Browsers arrive through traefik and prometheus scrapes `/prometheus` on this port; the
    # baseline already admits both on every port. The baseline's node CIDRs are two /32 cni0
    # host addresses, so no pod-network caller is covered by them.
    netpol_from:
      # SPEEDTEST_URL (monitor-bridge/templates/env-secret.yaml.j2): the check that reads the
      # newest result row. A failed run leaves no other trace, because the container logs only
      # its pre-run connectivity ping.
      - monitor-bridge
  # Headless DDNS client: no web UI, no Traefik route.
  - name: cloudflare-ddns
    platform: k8s
  - name: freshrss
    platform: k8s
    hostname: "freshrss"
    port: 80
    use_authelia: true
    auth_tier: one_factor
  # Parked at replicas 0 — see roles/k8s/navidrome/defaults/main.yml. The entry stays in the
  # list so the Deployment, Service and route keep being reconciled; only the pod count is 0.
  - name: navidrome
    platform: k8s
    hostname: "navidrome"
    port: 4533
    use_authelia: true
    auth_tier: one_factor
  # port 8000, not 80 — uWSGI serves directly, there is no nginx in front of it. Assuming
  # 80 costs a five-minute rollout timeout with a perfectly healthy app behind a probe
  # pointed at a closed port.
  - name: healthchecks
    platform: k8s
    hostname: "healthchecks"
    port: 8000
    use_authelia: true
    auth_tier: one_factor
  # CouchDB for Obsidian LiveSync. use_authelia is false because the LiveSync client uses
  # non-interactive basic auth and cannot pass 2FA — CouchDB's own require_valid_user is
  # the gate. Its data volume is longhorn-NOBACKUP, so the backup plane ignores this PVC
  # deliberately (see the role's defaults).
  - name: livesync
    platform: k8s
    hostname: "livesync"
    port: 5984
    use_authelia: false
    # NO IngressRoute at all, and that is load-bearing rather than an omission. Its names
    # are served by the X-Sync-Token gate in the k8s Traefik's Secret-mounted file provider
    # (roles/k8s/traefik/templates/livesync-gate-secret.yaml.j2 — token router, Authelia'd
    # /_utils carve-out at priority 200, and the LAN-only Kuma probe router whose CouchDB
    # 401 is the end-to-end signal). The token stays out of CRDs because the readonly
    # kubeconfig can read IngressRoutes but is RBAC-denied Secrets. Replication keeps its
    # 20x limiter there — the default 300/min 429'd a phone mid-pull within an hour.
    #
    # No bare `Host(livesync…)` router may be added beside the gate's: that would break the
    # gate's whole invariant, that a request without the token matches NO router and 404s
    # before CouchDB. `hostname` stays only to feed the Pi-hole override and Kuma's
    # hostAliases.
  - name: homepage
    platform: k8s
    hostname: "homepage"
    port: 3000
    use_authelia: true
    auth_tier: one_factor
  # UPS web UI. Reads upsd over the in-cluster `nut` Service.
  - name: peanut
    platform: k8s
    hostname: "peanut"
    port: 8080
    use_authelia: true
    auth_tier: one_factor
  # Browses every host's ~/.claude/artifacts at one authenticated URL. Serves hostPath
  # trees, so the pod is pinned to daniel-box and daniel-server's copy is rsynced in by a
  # cron there. Answers on both the LAN and the public name — a link is the only way anyone
  # reaches an artifact, so one that resolves inside the LAN alone fails wherever the
  # reader is.
  - name: artifacts
    platform: k8s
    hostname: "artifacts"
    port: 8080
    use_authelia: true
    auth_tier: one_factor
  # MkDocs Material site over docs/, built on this host by scripts/docs/build_docs.py and served
  # from a hostPath. Sits next to artifacts because they are the same shape: nginx-class
  # static serving over a daniel-box tree, reachable on both the LAN and public names behind
  # Authelia. The role's ingressroute template records why it stopped being LAN-only.
  - name: docs
    platform: k8s
    hostname: "docs"
    port: 8080
    use_authelia: true
    auth_tier: one_factor
  # Read-only MCP server. No hostname/ingressroute — its bearer-token router lives in the
  # edge gate Secret (roles/k8s/traefik/templates/livesync-gate-secret.yaml.j2), matching
  # only mcp.local.<domain>, so no dnsmasq override or public router may exist for it.
  - name: homelab-mcp
    platform: k8s
    port: 8000
    use_authelia: false
    # Named Service port, which the shared default Service renders on request.
    service_port_name: http
  # Brings three unrouted workloads with it — headless Chrome, Meilisearch and the
  # time-tagger — reached in-cluster by Service name. Those names are load-bearing:
  # karakeep addresses them by those names.
  - name: karakeep
    platform: k8s
    hostname: "karakeep"
    port: 3000
    use_authelia: true
    auth_tier: one_factor
    # The browser extension and mobile app authenticate with Bearer API keys and cannot pass
    # 2FA, so the paths they call are public on purpose. Each prefix is one the app itself
    # key-gates (packages/api/index.ts in the pinned image): the extension and the app speak
    # tRPC at /api/trpc/, the app uploads to /api/assets and reads /api/assets/<id>, and
    # /api/v1/ is the REST API. The list is an allow-list, not `/api/` — that prefix also
    # reaches next-auth's /api/auth/* (password login, no app-side throttle) and cookie-session
    # auth on every other child, which would leave the app password as the only gate on the
    # internet.
    # The trailing slashes are load-bearing: PathPrefix(`/api`) would also match siblings like
    # /api-docs. /api/assets has none because the mobile upload POSTs to exactly that path;
    # nothing else under /api/ starts with `assets`.
    bridge_bypass_prefixes:
      - /api/v1/
      - /api/trpc/
      - /api/assets
    # Callers beyond the baseline, rendered by netpol-baseline's networkpolicy-callers.yaml.j2.
    # Browsers arrive through traefik and prometheus scrapes this port; the baseline admits both.
    netpol_from:
      # The `wait-for-karakeep` init container (karakeep/templates/deployment-time-tagger.yaml.j2)
      # dials karakeep:3000 every 5s until it connects. Denied, the new tagger pod sits in Init
      # forever while the old one keeps running, so the rollout never completes. The first
      # census missed it because it excluded karakeep's own role: read a role's own templates
      # for init containers and wait loops (`grep -rn 'create_connection\|nc -z'`) too.
      - karakeep-time-tagger
  # An unauthenticated plain-HTTP registry, reachable only on the node's loopback via
  # hostPort and in-cluster via its Service. Giving it an ingress would put push access on
  # the LAN.
  - name: registry
    platform: k8s
    tier: platform
  # two_factor even on the LAN: arbitrary workflow execution on a stolen
  # password alone. /webhook/ below is unaffected — that route carries no forward-auth at all,
  # and monitor-bridge's check_n8n rides the API-key route.
  - name: n8n
    platform: k8s
    hostname: "n8n"
    port: 5678
    use_authelia: true
    auth_tier: two_factor
    # External services POST here with no session. Authelia would not fail loudly — it
    # would silently break every registered webhook while the callers keep reporting
    # success. The trailing slash keeps /webhook-test/ (dev-only) out.
    bridge_bypass_prefixes:
      - /webhook/

  # No port/hostname/route — MQTT is raw TCP and crosses hosts on the role's pinned MetalLB
  # VIP (mosquitto_k8s_lan_ip), not through Traefik.
  # DECIDED: mosquitto-data stays out of the daily R2 tier (#3389). It holds retained
  # messages and QoS session state the three clients republish on reconnect, on the
  # longhorn-nobackup class, so the broker is tiered for placement and alerting only.
  - name: mosquitto
    platform: k8s
    tier: home-automation

  # Must follow mosquitto — z2m resolves the broker by bare Service name. The SLZB
  # coordinator accepts one client, hence `strategy: Recreate` in the role.
  - name: zigbee2mqtt
    platform: k8s
    depends_on: [mosquitto]
    hostname: "zigbee2mqtt"
    port: 8080
    use_authelia: true
    auth_tier: one_factor
    # Named Service port, which the shared default Service renders on request.
    service_port_name: http
    tier: home-automation
    backup_claims: [zigbee2mqtt-data]

  # use_authelia false: forward-auth breaks the companion app, so HA's own login + TOTP is
  # the gate. Reaches mosquitto by Service name.
  - name: home-assistant
    platform: k8s
    hostname: "home-assistant"
    port: 8123
    use_authelia: false
    # Named Service port, which the shared default Service renders on request.
    service_port_name: http
    tier: home-automation
    backup_claims: [home-assistant-config]
    # Callers beyond the baseline, rendered by netpol-baseline's networkpolicy-callers.yaml.j2.
    # prometheus scrapes this port and browsers arrive through traefik; the baseline admits
    # both. probe.py's `ha` subcommands run on a node, so the baseline's cni0 /32s cover them.
    netpol_from:
      - homelab-mcp     # HA_URL (homelab-mcp/templates/deployment.yaml.j2), Claude's read tools
      - monitor-bridge  # HA_URL (monitor-bridge/templates/env-secret.yaml.j2), the
                        # scheduler-stuck check the container healthcheck cannot see

  # LAN DNS on its own pinned VIP (dns_k8s_vip). Not seeded: blocklist state is declared in
  # the role defaults (pihole_k8s_adlists) and everything else in /etc/pihole regenerates.
  - name: pihole
    platform: k8s
    hostname: "pihole"
    port: 80
    use_authelia: true
    auth_tier: one_factor
    # Both pihole-etc claims are longhorn-nobackup: every byte regenerates.
    tier: home-edge
  # Pi-hole v6 serves no Prometheus endpoint, so this polls its admin API and exports
  # `pihole_*` — for BOTH instances, since each FTL keeps its own query database and one alone
  # reports half the house's volume. `port` is the port it DIALS on the Pi-holes, not one it
  # serves; it renders no IngressRoute, so no route derives from it. `depends_on: [pihole]`
  # because it reads its password out of the `pihole-env` Secret that role renders, rather than
  # holding a second copy of the credential.
  - name: pihole-exporter
    platform: k8s
    port: 80
    depends_on: [pihole]

  # GPU utilization per node, from DRM sysfs. A DaemonSet with no Service and no IngressRoute —
  # Prometheus discovers its pods individually — so no ordering edge derives from its templates
  # and none is needed: it reads the kernel, not another workload.
  - name: gpu-exporter
    platform: k8s

  - name: ical-proxy
    platform: k8s
    hostname: "ical-proxy"
    port: 5000
    use_authelia: false
    # Callers beyond the baseline, rendered by netpol-baseline's networkpolicy-callers.yaml.j2.
    # ADDED 2026-08-24 with the ical-proxy route narrowing. The app serves unauthenticated
    # private calendar feeds (/calendar{1,2,4}.ics is all of it, and there is no health
    # endpoint). The route's ClientIP guard was once widened to the whole pod CIDR so the Kuma
    # prober could reach it, which let any pod read the calendars: demonstrated live with a 200
    # and 847,922 bytes. So the two real callers moved off the edge onto the ClusterIP, where a
    # podSelector can tell them apart; everything arriving through Traefik carries Traefik's
    # identity. The baseline admits only traefik, prometheus and the node CIDRs, so without
    # this list both callers are denied. Traefik keeps its access through the baseline, and the
    # daniel-server-guarded route still works.
    netpol_from:
      - homepage     # the three calendar widgets
      - uptime-kuma  # the "iCal Proxy k8s" monitor, which probes /calendar1.ics

  # The tunnel answers on the node IP (the wg-easy-udp Service's externalIP) rather than a
  # VIP: router UIs forward to devices, and VIPs have no lease. There is no password_hash on
  # either side: v15 owns its admin credentials in its own SQLite DB. Rotation is `cli db:admin:reset`
  # inside the pod — see roles/k8s/wg-easy/defaults/main.yml.
  - name: wg-easy
    platform: k8s
    tier: platform
    hostname: "wg-easy"
    port: 51821
    udp_port: 51820
    use_authelia: true
    auth_tier: one_factor
    default_dns: "{{ dns_k8s_vip }}"

  - name: uptime-kuma
    platform: k8s
    hostname: "uptime-kuma"
    port: 3001
    use_authelia: true
    auth_tier: one_factor
    # Callers beyond the baseline, rendered by netpol-baseline's networkpolicy-callers.yaml.j2.
    # Everything that pushes a heartbeat dials :3001 directly rather than through traefik.
    # Host crons arrive with a node address and are covered by the baseline's cni0 /32s, and
    # browsers arrive through traefik. The `autokuma` sidecar needs no entry: it reaches Kuma
    # over pod-local loopback, which no NetworkPolicy evaluates.
    netpol_from:
      - monitor-bridge           # KUMA_URL (monitor-bridge/templates/env-secret.yaml.j2)
      - autofix-bridge           # KUMA_URL (autofix-bridge/templates/env-secret.yaml.j2)
      - cloudflare-ddns-direct   # push URL (cloudflare-ddns/templates/deployment-direct.yaml.j2)
      - cloudflare-ddns-proxied  # push URL (cloudflare-ddns/templates/deployment-proxied.yaml.j2)
      # push_url (pi-peer-backup/templates/secret.yaml.j2), a CronJob. The first census read
      # Deployments only and missed it: its 2026-08-21 run succeeded and lost its heartbeat.
      - pi-peer-backup
      - kuma-status-page-sync    # KUMA__URL + deadman push (uptime-kuma's status-page-sync CronJob)
      - kuma-maintenance-sync    # KUMA__URL (uptime-kuma's maintenance-sync CronJob)

  # Runs WITHOUT docker plumbing — no DOCKER_HOST, so no in-IDE docker CLI or devcontainers.
  # Image built in-cluster from the containers role's Dockerfile, which is the build source.
  # two_factor even on the LAN: a shell as the repo user on a stolen password alone.
  - name: code-server
    platform: k8s
    hostname: "code-server"
    port: 8443
    use_authelia: true
    auth_tier: two_factor

  # No port/hostname: nothing routes over HTTP. The game's TCP 7777 answers on the node IP
  # via its Service (the wg-easy pattern — the router's forward points at this device).
  - name: terraria
    platform: k8s

  # Same shape as terraria: nothing about it is HTTP — the game answers UDP 2456-2457 on
  # the node IP via its own Service.
  - name: valheim
    platform: k8s

  # The homelab log store — a SECOND cluster Loki, deliberately separate from observability's,
  # which holds verbatim prompts and stays loopback-only. The route is ClientIP-gated
  # (monitoring_route), so use_authelia is moot but stated. Ships with the pod-log promtail
  # DaemonSet.
  - name: loki-homelab
    platform: k8s
    hostname: "loki-homelab"
    port: 3100
    use_authelia: false
  # MUST follow loki-homelab: both exporters tail their game pod's console lines from that
  # Loki. No web UI — each :9420 exporter is scraped in-cluster (observability prometheus jobs
  # terraria-stats and valheim-stats), so no port/route derives.
  - name: game-stats
    platform: k8s
    depends_on: [loki-homelab]
  # The bridge twins, neither of which has a route — both are pushers. monitor-bridge runs
  # every metric/API check; autofix-bridge is the *arr remediation loop.
  - name: monitor-bridge
    platform: k8s
    tier: platform
  # Host metrics for BOTH nodes.
  - name: node-exporter
    platform: k8s
  - name: autofix-bridge
    platform: k8s
  # The NUT primary (upsd + usbhid-ups + upsmon). The pod is pinned to daniel-server, the
  # UPS's USB host — a physical pin that never unwinds. The host's secondary upsmon, the
  # thing that actually powers daniel-server off on FSD, is the nut_host role and keeps its
  # 127.0.0.1:3493 target via hostPort.
  - name: nut
    platform: k8s
    tier: platform
  # The Prometheus face of the same upsd, as its own workload rather than a sidecar: the nut pod
  # is privileged and USB-pinned, and a sidecar there would restart the shutdown chain on every
  # exporter bump. No port and no route derive — it is a scrape target only.
  - name: nut-exporter
    platform: k8s
  # Nightly CronJob: the Pi's WireGuard peer keys land on a Longhorn PVC the WEEKLY tier
  # carries to B2 on its Saturday shard (`k3s_longhorn_weekly_volumes`, `# Sat`), and the job
  # pushes the "WG Pi Peer Backup" monitor directly. The job is nightly; the OFF-SITE copy is
  # weekly, so there is no same-day off-site restore point.
  - name: pi-peer-backup
    platform: k8s
  # SMART monitoring. UI behind Authelia; /api/* is bypassed for LAN machine traffic (the
  # collector's POSTs and monitor-bridge's summary reads) in the authelia role's config.
  - name: scrutiny
    platform: k8s
    hostname: "scrutiny"
    port: 8080
    use_authelia: true
    auth_tier: one_factor
  # LAST on purpose, and it must NOT sit in traefik's rollout batch.
  #
  # Not for the usual "after traefik" reason — this role renders no Traefik CRDs, and a
  # NetworkPolicy peer podSelector is a label match evaluated at connection time, so
  # `app: traefik` resolves whether or not a traefik pod exists when the policy is applied.
  #
  # What DOES constrain the position is the role's probe job. tasks/k8s_batch.yml drains
  # rollouts only at the END of a batch, and traefik is replicas: 1 with strategy: Recreate,
  # so inside traefik's own batch there is a window with zero traefik pods — and the probe's
  # first assertion dials traefik:80. Sharing a batch would fail the probe on timing,
  # aborting the play with the fencing already applied. Running last also guarantees
  # littlelink (the probe's liveness and isolation target) is settled before the probe runs.
  #
  # Being last is safe: the selector is the opt-in label `netpol-baseline: enforced`, so the
  # policy only affects pods already carrying it.
  - name: netpol-baseline
    platform: k8s
# False until this host's first manual initial_setup.yml + deploy.yml run finishes green
# (README §4): the gitops_deploy handler shells a full deploy at the end of
# initial_setup.yml and fails the play with it, so one bad service would take down the
# whole OS-hardening run.
has_gitops: true
# k8s auto-deploy. Eligibility is an image-only diff to a non-denylisted service's
# defaults/main.yml — see roles/setup/gitops_deploy/defaults/main.yml, where every denylist
# entry carries its reason. The cleared pilot list means the denylist alone governs.
#
# DO NOT hand-maintain the eligible list here. Run
# `uv run python scripts/dev/k8s_autodeploy_counts.py` — it derives eligible/denied from the
# role sources, and the partition is CI-enforced by
# test_k8s_autodeploy_guard.py::test_every_role_is_either_denied_or_declares_itself_deployable.
# A list written here goes stale silently and reads as current; see the memory
# `autodeploy-counts-must-be-measured-not-computed`.
#
# code-server, homelab-mcp and ical-proxy are absent from the denylist deliberately: their
# pins are Jinja registry refs Renovate cannot reach, so they can never qualify (design §7).
# That is a structural fact about those roles, not a count, so it keeps.
#
# NOT yet proven end-to-end: no real Renovate PR has ever traversed this path. The drill
# covered deploy → gate → restore; the deployer's git plumbing around it (detect → ff-merge
# → deploy → catch → hold → reset → redeploy → Discord) has never run.
gitops_deploy_k8s_autodeploy_enabled: true
gitops_deploy_k8s_autodeploy_pilot: []
# This is the k3s node — it must NOT have Docker. k3s brings its own containerd and its
# flannel/kube-proxy iptables rules, and the k3s role's fail-closed guard blocks
# k3s-bringup.yml on a node that runs Docker. Keep this false.
has_docker: false
# Developer environment, opted in (both default false in group_vars/all.yml). Claude Code
# still needs one interactive `claude login` here afterwards — the role installs the binary
# but cannot mint the OAuth credential.
has_github_cli: true
has_chezmoi: true
has_claude_code: true
# The only memory store sessions write; claude-memory-sync.timer copies it, one-way and
# overwriting, to daniel-server (issue #3123, the operator's decision of 2026-10-01).
claude_code_memory_sync_enabled: true
# `has_igpu` is deliberately unset. It means "pass /dev/dri through" (README §7) and is the
# Docker-side switch; for the k8s workloads render_gid below supersedes it, because in the
# cluster a container reaches the render node through the device plugin plus group
# membership rather than a device passthrough flag.
#
# The `render` group's GID on THIS host. Host-specific by nature, which is why it is here
# rather than in a role default. The device plugin gets a container past the cgroup v2
# device filter; this gets it past the file mode (/dev/dri/renderD128 is crw-rw----
# root:render and the pods run as uid 1000). Nothing guarantees 993 on another machine, and
# the symptom of a wrong value is EACCES on open — distinct from the EPERM that means the
# cgroup filter refused.
render_gid: 993
# Run the host-side secondary upsmon here, so a UPS shutdown powers this node off cleanly
# instead of letting it run to battery end and lose power mid-write. This node holds etcd,
# Longhorn's primary replicas, Traefik, Kuma, Prometheus and LAN DNS, so the unclean cut was the
# most expensive one in the fleet. It draws from the same UPS as daniel-server (measured,
# see group_vars/all.yml).
#
# NOT A LONE EDIT. Arming at a 120 s ONBATT delay would stop the control plane two minutes into
# any blip — worse availability than the hard cut it replaces, since most outages never reach
# two minutes. The delay is 300 in roles/k8s/nut/defaults/main.yml, and that ordering is what
# the role's own comment prescribes.
#
# DEPLOY ORDER, and it is not optional: run the console-attended `upsmon -c fsd` drill from
# roles/k8s/nut/CLAUDE.md before this reaches the host. Setting it true installs a chain whose
# only job is to power this machine off, and a broken chain is indistinguishable from a working
# one while mains power is up. The role asserts upsd is reachable at deploy time, which catches
# a stale ClusterIP snapshot then; `nut_host_watchdog_armed` (roles/nut_host/defaults/main.yml)
# is what re-checks it afterwards, every 10 minutes via ups-secondary-health.sh.
nut_host_secondary_armed: true

# The unattended Renovate agent (roles/setup/renovate_agent). The timer
# fires at 15:00 UTC daily and spends one headless session over the open Renovate PRs, merging
# and landing up to renovate_agent_max_prs of them. Setting this back to false stops and
# disables the timer; that is the rollback. There is no alive monitor yet, so a timer that
# stops firing shows up only as a growing backlog in the renovate-notify digest.
#
# Disarmed on 2026-10-03, pending a repo-scoped GitHub token for the unattended session and a
# separate lander unit that alone holds the token able to merge. Re-arm only with both in place.
renovate_agent_enabled: false
