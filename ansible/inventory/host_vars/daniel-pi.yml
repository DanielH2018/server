---
server_ip: 10.0.0.139
# The Pi's one address literal (#3719). Ansible SSHes to it, and group_vars' k8s_pi_client_ip
# reads it through hostvars, so hosts.ini carries no ansible_host for this host.
ansible_host: "{{ server_ip }}"
ssh_config_path: /etc/ssh/sshd_config.d/50-cloud-init.conf
# `domain` is inherited from group_vars/all.yml (daniel-hunter.com), exactly like every other
# host — the Pi carries no host-specific override. It is a plain variable, not a secret
# (operator ruling, 2026-10-14). The only domain consumer here is wg-easy's WG_HOST
# (wireguard.daniel-hunter.com — the one hostname with a DNS record at the public IP). A
# host-specific `domain: daniel-pi.com` override would be wrong: that zone does not resolve,
# and the shared value is what keeps it out of the VPN endpoint. To
# give a future Pi-exposed service a "daniel-pi" hostname, use a `pi.`-prefixed subdomain of the
# working zone (e.g. glances.pi.daniel-hunter.com — real DNS via cloudflare-ddns), not a
# separate daniel-pi.com zone.
# Escalation-prompt budget for a 456 MB Zero 2 W. ansible-core's ssh plugin waits
# `2 + timeout` seconds for sudo's prompt (plugins/connection/ssh.py, "Timeout (%ds) waiting
# for privilege escalation prompt"), and `timeout` defaults to 10 — so a sudo that takes
# longer than 12 s to prompt reads as UNREACHABLE, not as slow. Measured with every container
# in its limit (alloy 30 MiB of 96): 456 MB total, 308 used,
# 148 available, 319 MB of swap in use on the SD card, load average 1.21 — the host daemons
# (alloy, dockerd, containerd, node_exporter) hold the RAM, and sudo pages in behind them.
# 30 s (32 s at the prompt) is four times the observed floor and still fails fast. This is the
# per-host spelling of `[defaults] timeout`; there is no become-specific timeout var in the
# pinned core. A retry loop is the wrong shape: the wait is the whole cost.
ansible_ssh_timeout: 30
# No Ansible GitOps auto-deploy path to the Pi (accepted) — memory-constrained, and its Ansible-era
# services are driven manually over SSH. The package path (homelab-updater, H3 and H5) deploys the
# services in compose_services without this key. See gitops_deploy CLAUDE.md.
# Kept explicit even though group_vars/all.yml defaults it false: the deployer's own refusal
# (`deploy_inventory.declares_no_gitops`) greps THIS file's text for a top-level
# `has_gitops: false` and fails open when the key is absent, so deleting the line would disarm
# the code-side half of the gate.
has_gitops: false
# The only Docker host, so this is the one host that
# opts IN to the engine (group_vars/all.yml defaults it false). Every service in
# containers_list and compose_services below runs on it.
has_docker: true
# A 512 MB Zero 2 W: the one host where a heavy apt step OOM-kills without the disk-backed
# swapfile, so initial_setup's swap + watchdog-stop preamble and its apt-show-versions purge
# run here and nowhere else. group_vars/all.yml defaults both flags false.
has_low_memory_board: true
# Boots the Raspberry Pi kernel, so `linux-raspi` is a real package here.
has_raspi_kernel: true
# optimize_pi masks rsyslog here (journald is the log of record; rsyslog's text logs landed in
# the RAM-backed log2ram tmpfs), so initial_setup must not render its rsyslog filter or
# notify `Restart rsyslog` -- a masked unit fails that handler and the recap reads failed=1
# for a run whose changes are all live. See group_vars/all.yml for the default.
has_rsyslog: false
# Disk-backed swap for the 512 MB Zero 2 W. The RAM-resident zram (optimize_pi) can't add
# real capacity, so heavy one-shot apt/dpkg steps (apt-show-versions cache build, `upgrade: dist`,
# AIDE init) OOM-kill mid-transaction and corrupt the package DB. Created by the initial_setup
# role BEFORE its apt tasks run. See ansible/roles/setup/initial_setup/tasks/main.yml.
pi_swapfile_path: /swapfile
pi_swapfile_size: 1G
# Slow healthcheck cadence on the Zero 2 W: every probe is 2 runc invocations (multi-
# threaded Go — ~20-30 PIDs each incl. threads). At the template defaults (10-30s across
# 6 containers) that was ~10 forks/sec, constant RCU expedited-stall warnings (~150/hr in
# the journal) and 13% CPU PSI at idle. Templates fall back to their own defaults where
# this is unset (the server keeps 10s/30s).
container_healthcheck_interval: 60s
# Wide timeout and retries on the same board: a Pi deploy's memory thrash (load1 8-17, PSI
# full 20-25% in every window measured over 20 days) stalls a `wget`/`pgrep` exec through runc
# past a 5-10s timeout — and past Docker's 30s default — three times running. The container
# reads `unhealthy`, autoheal restarts it, and the `start` half can fail at the OCI runtime
# ("Timeout waiting for systemd to create scope"), leaving it Exited until pi-recovery-health
# starts it. An exec that eventually returns is not a failure; 60s covers the stalls seen and
# 5 retries cover a window that outlasts one. wg-easy reads them too, over the probe its
# image ships (its compose block carries timing and no `test:`). Templates fall back
# to their own values (5-10s, 3) where these are unset. Detection latency worst-case =
# 5 x (60s interval + 60s timeout)
# = 10 min, against a 5-min Kuma monitor from outside for wg-easy — the reason a
# dead process is not the case this trades against: `restart: unless-stopped` covers that at
# once, the healthcheck only covers a wedged-but-running one.
container_healthcheck_timeout: 60s
container_healthcheck_retries: 5
containers_list:
  - name: wg-easy
    port: 51821
    udp_port: 51822
    # DECIDED: no Authelia and no PASSWORD_HASH on the Pi's wg-easy UI (accepted risk
    # 2026-06-23); the UI binds the LAN IP. See ansible/roles/containers/wg-easy/CLAUDE.md.
    # LAN-only host, so the admin UI is open to anyone on the Pi's LAN (it's bound to the LAN
    # IP, never internet-exposed or on the tunnel). To gate it, add a PASSWORD_HASH env from
    # SOPS.
    use_authelia: false
    networks:
      - proxy
  # Host metrics for the central Prometheus are NOT a container here: node_exporter runs as a
  # host unit from roles/setup/optimize_pi (section 10), on the LAN IP and port 9100 the
  # cluster's `node-pi` scrape job reads. The cluster `node` scrape job uses pod discovery, so
  # it covers the two k3s nodes and structurally cannot reach a host that runs no kubelet.
  #
  # NOTE for whoever adds the next node-exporter host: check_disk and check_mem scan every
  # origin reporting node_*, and this host is excluded from both (HOST_METRIC_ORIGIN_EXCLUDE
  # in monitor-bridge's check.py) because check_pi_pressure already owns Pi disk and memory
  # against thresholds sized for a 456 MB box.
  #
  # Container logs to loki-homelab. Needs docker-proxy, which the package's `homelab` project runs
  # (compose_services below): discovery goes through that read-only proxy rather than the raw
  # Docker socket, and it needs the `proxy` network to reach it.
  #
  # Sized carefully — this is a 456 MB Zero 2 W. GOMEMLIMIT/GOMAXPROCS are set in the compose
  # template and the cap is 96M; if the measured RSS sits near the cap rather than near
  # 48 MiB, this host cannot afford a log shipper and the right answer is a syslog forwarder,
  # not a bigger limit. Host logs are deliberately NOT shipped: rsyslog is inactive here.
  - name: alloy
    port: 12345
    use_authelia: false
    networks:
      - proxy
# The Pi's services that the `homelab-daniel-pi` package deploys as one Compose project (H5).
# A service lives in exactly one of this key and containers_list: Ansible's Docker play
# deploys containers_list, and the package deploys this key. Entries keep containers_list's
# field names. It holds the canary, docker-proxy (H5.6) and autoheal (H5.7). Every reader of the
# Pi's services reads both keys and fails on a missing one, so keep the key even when it is
# empty. The cluster templates that read it are named in
# docs/target-architecture/host/h5-pi-compose.md (The service list).
compose_services:
  # H5.2b's canary: a digest-pinned busybox that proves the package runs a service and that an
  # included file receives a value from the Compose env file. It has no Ansible-era counterpart,
  # so no legacy entry names it. H5.10 removes it.
  - name: pi-canary
  # The read-only Docker socket proxy, which serves Alloy's docker_sd log discovery. The
  # package's service file also declares the docker-proxy-lifecycle sub-proxy (restart-only,
  # serves autoheal), and docker-proxy-codeserver under has_code_server. Legacy entry:
  # /home/ubuntu/server/containers/docker-proxy/docker-compose.yml (project `docker-proxy`).
  - name: docker-proxy
    use_authelia: false
    networks:
      - proxy
  # Restarts unhealthy containers through docker-proxy-lifecycle, which the docker-proxy service
  # file declares, so its service file carries `depends_on: docker-proxy-lifecycle`. Legacy entry:
  # /home/ubuntu/server/containers/autoheal/docker-compose.yml (project `autoheal`).
  - name: autoheal
    use_authelia: false
    networks:
      # lifecycle-only: reaches docker-proxy-lifecycle (write proxy), not the broad nets
      - lifecycle
