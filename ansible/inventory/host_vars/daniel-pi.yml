---
server_ip: 10.0.0.139
ssh_config_path: /etc/ssh/sshd_config.d/50-cloud-init.conf
# `domain` is inherited from SOPS (secrets.yml → daniel-hunter.com), exactly like
# daniel-server — the Pi carries no host-specific override. The only domain consumer
# here is wg-easy's WG_HOST (wireguard.daniel-hunter.com — the one hostname with a DNS
# record at the public IP; verified resolving). A former `domain: daniel-pi.com` override
# was removed 2026-06-11: that zone does not resolve, and it was only harmless because the
# SOPS value shadowed it (un-shadowed it would have broken the VPN endpoint). To give a
# future Pi-exposed service a "daniel-pi" hostname, use a `pi.`-prefixed subdomain of the
# working zone (e.g. dozzle.pi.daniel-hunter.com — real DNS via cloudflare-ddns), not a
# separate daniel-pi.com zone.
# LAN-only host: publish web UIs bound to the LAN IP instead of routing through Traefik.
expose_mode: lan
# No GitOps auto-deploy path to the Pi (accepted, 2026-06-30) — memory-constrained and driven
# manually over SSH. See gitops_deploy CLAUDE.md.
has_gitops: false
# Disk-backed swap for the 512 MB Zero 2 W. The RAM-resident zram (optimize_pi) can't add
# real capacity, so heavy one-shot apt/dpkg steps (apt-show-versions cache build, `upgrade: dist`,
# AIDE init) OOM-kill mid-transaction and corrupt the package DB. Created by the initial_setup
# role BEFORE its apt tasks run. See ansible/roles/setup/initial_setup/tasks/main.yml.
pi_swapfile_path: /swapfile
pi_swapfile_size: 1G
# Slow healthcheck cadence on the Zero 2 W: every probe is 2 runc invocations (multi-
# threaded Go — ~20-30 PIDs each incl. threads). At the template defaults (10-30s across
# 6 containers) that was ~10 forks/sec, constant RCU expedited-stall warnings (~150/hr in
# the journal) and 13% CPU PSI at idle. Templates fall back to their own defaults where
# this is unset (the server keeps 10s/30s). Detection latency worst-case = 60s x 3 retries.
container_healthcheck_interval: 60s
containers_list:
  # Read-only Docker socket proxy — serves glances + dozzle; the hardcoded
  # docker-proxy-lifecycle sub-proxy (restart-only) serves autoheal.
  - name: docker-proxy
    use_authelia: false
    networks:
      - proxy
  - name: wg-easy
    port: 51821
    udp_port: 51822
    # Accepted risk: LAN-only host, so no Authelia AND no PASSWORD_HASH — the admin UI is
    # open to anyone on the Pi's LAN (it's bound to the LAN IP, never internet-exposed or on
    # the tunnel). To gate it, add a PASSWORD_HASH env from SOPS. See the wg-easy CLAUDE.md.
    use_authelia: false
    networks:
      - proxy
  - name: glances
    port: 61208
    use_authelia: false
    networks:
      - proxy
  - name: dozzle
    port: 8080
    use_authelia: false
    networks:
      - proxy
  # portainer-agent retired 2026-08-09 with the server's Portainer (slice-7 Phase B, design
  # decision 4). Its host artifacts — /etc/portainer-agent-firewall.sh, the systemd oneshot,
  # and the DOCKER-USER rules for :9001 — were removed imperatively at retire time; nothing
  # in Ansible recreates them. Role in roles/containers/archive/.
  - name: autoheal
    use_authelia: false
    networks:
      # lifecycle-only: reaches docker-proxy-lifecycle (write proxy), not the broad nets
      - lifecycle
  # Host metrics for the central Prometheus. Until this landed the Pi contributed no time
  # series at all: the cluster `node` scrape job uses pod discovery, so it covers the two k3s
  # nodes and structurally cannot reach a host that runs no kubelet. The Pi's only central
  # signal was check_pi_pressure polling glances, which yields one binary Kuma monitor and
  # keeps no history — nothing to graph, nothing to alert on a trend.
  #
  # `port` is the published metrics port, not a web UI. Nothing routes it: expose_mode is
  # `lan` on this host, so it binds the LAN IP and Prometheus scrapes it directly.
  #
  # NOTE for whoever adds the next node-exporter host: check_disk and check_mem scan every
  # origin reporting node_*, and this host is excluded from both (HOST_METRIC_ORIGIN_EXCLUDE
  # in monitor-bridge's check.py) because check_pi_pressure already owns Pi disk and memory
  # against thresholds sized for a 456 MB box.
  - name: node-exporter
    port: 9100
    use_authelia: false
    networks:
      - proxy
  # Container logs to loki-homelab. MUST follow docker-proxy: discovery goes through that
  # read-only proxy rather than the raw Docker socket, and it needs the `proxy` network to
  # reach it.
  #
  # Sized carefully — this is a 456 MB Zero 2 W. GOMEMLIMIT/GOMAXPROCS are set in the compose
  # template and the cap is 96M; if the measured RSS sits near the cap rather than near
  # 48 MiB, this host cannot afford a log shipper and the right answer is a syslog forwarder,
  # not a bigger limit. Host logs are deliberately NOT shipped: rsyslog is inactive here.
  - name: promtail
    port: 9080
    use_authelia: false
    networks:
      - proxy
