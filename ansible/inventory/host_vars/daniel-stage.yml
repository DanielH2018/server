---
# The staging cluster's single node — a KVM guest on daniel-server, not physical hardware.
# Built by roles/setup/hypervisor; see docs/staging-cluster.md.
#
# REACHABLE ONLY FROM daniel-server. The guest sits on a libvirt NAT network
# (192.168.140.0/24) that exists inside that host, so daniel-box — the controller for
# deploy.yml — cannot route to it at all. Anything targeting this host runs on
# daniel-server: `uv run ansible-playbook <play> -e target=daniel-stage`, from there.
# That is Decision 2 of the spec working as intended, not a gap: a staging cluster that
# could announce on the prod L2 is the one design where staging can hurt prod.

# Its address on the staging NAT network. This is a DHCP reservation keyed on
# staging_vm_mac, declared in group_vars/all.yml — not a lease — so it is stable across a
# rebuild of the guest. Both this and the reservation read the same variable, and
# ansible/tests/test_staging_vm.py asserts the domain and the network agree on the MAC.
server_ip: "{{ staging_vm_ip }}"

# Stock Ubuntu cloud image. NOT the Pi's sshd_config.d/50-cloud-init.conf path: the noble
# cloud image ships an /etc/ssh/sshd_config.d/ directory but the hardening tasks have no
# `create:` fallback, so this names the file that exists.
ssh_config_path: /etc/ssh/sshd_config

# No Compose services — the staging subset is k8s-only by design (docs/staging-cluster.md,
# Decision 6). deploy.yml dies in its first pre_task if this is undefined at all.
#
# Order matters: the play has no toposort and runs this list in order, so traefik stays
# first — it installs the CRDs every later IngressRoute needs.
# `staging_expect` on an entry below is Phase C slice 2 (docs/staging-phase-c.md, Decision 2):
# what this service must ANSWER, not merely that its pod came up. Every value was measured
# against the live cluster on 2026-08-28, never inferred — an expectation nobody checked is a
# second thing that can be wrong.
#
# It exists because "the play exited zero" cannot see a route. ical-proxy deployed with
# `68 ok, 0 failed` and the stabilisation gate passing while every one of its routes returned
# 404, its ClientIP guard naming an address no NAT guest can present. And 200 is the WRONG
# expectation for a forward-authed route: freshrss must answer 302, and a 200 there would mean
# the Authelia middleware silently stopped applying.
#
# Only routable services carry it. node-exporter has no IngressRoute and registry deliberately
# has none — an ingress would put push access on the LAN. `staging_expectations.py` derives that
# from each role's own manifest list and fails if a routable service is missing an expectation,
# so growing the subset cannot quietly grow the gate's blind spot.
containers_list:
  - name: traefik
    platform: k8s
    port: 8080
    # The dashboard route, behind the authelia middleware — hence 302 rather than 200.
    staging_expect:
      - hostname: traefik
        path: /
        status: 302

  # The forward-auth gate, and the mechanism no other manifest exercises: a Middleware that
  # other roles' IngressRoutes reference by name (docs/staging-cluster.md, Decision 6). Placed
  # AFTER traefik, whose CRDs define that Middleware, and BEFORE freshrss, which references it.
  # The play has no toposort and runs in list order.
  #
  # Its credentials are generated fakes, per Decision 5 — this portal guards nothing real, and
  # what staging gates is whether the manifests render and the pod reaches Ready.
  - name: authelia
    platform: k8s
    hostname: "auth"
    port: 9091
    use_authelia: false
    # The portal itself, which is what separates "Authelia is up" from "the middleware is
    # wired" when freshrss below redirects to it.
    staging_expect:
      - hostname: auth
        path: /
        status: 200

  # The first real app: Deployment through PVC through IngressRoute. Placed AFTER traefik,
  # which installs the CRDs its IngressRoute needs — the play has no toposort and runs in
  # list order.
  #
  # `use_authelia: true`, matching prod, since the entry above now supplies the Middleware.
  # It was false while Authelia was absent: an IngressRoute referencing a Middleware that
  # does not exist is not a route that merely skips auth.
  - name: freshrss
    platform: k8s
    hostname: "freshrss"
    port: 80
    use_authelia: true
    # 302, and the direction matters: a 200 here would mean the forward-auth middleware stopped
    # applying, which is the failure this whole expectation mechanism exists to catch.
    staging_expect:
      - hostname: freshrss
        path: /
        status: 302

  # The subset's only DaemonSet, and the mechanism no Deployment exercises: per-node
  # scheduling and hostPath mounts (docs/staging-cluster.md, Decision 6). It needs no
  # per-cluster switch — the manifest reads two variables, both of which staging supplies,
  # and it pins no node. Its /proc and /sys mounts exist in a VM unchanged.
  #
  # Nothing scrapes it here. Prod's scraper is claude-otel's prometheus, which is not in the
  # staging subset, so what this proves is that the DaemonSet schedules, mounts and passes its
  # readiness probe — which is what a manifest-correctness gate is for.
  - name: node-exporter
    platform: k8s

  # The in-cluster registry, entered only because ical-proxy below is BUILT rather than
  # pulled: k8s/image-builder pushes to it and containerd pulls back from it. It is not part
  # of the subset's mechanism coverage in its own right. Placed before ical-proxy — the play
  # has no toposort and runs in list order.
  #
  # Its agent-half pull self-test needs no per-cluster switch: selftest-pull-job.yaml.j2
  # renders that half only when `k3s_agent_node_ips` is non-empty, and this cluster has no
  # agent node.
  - name: registry
    platform: k8s

  # The `image-builder` path end to end — build, push, pull, deploy (docs/staging-cluster.md,
  # Decision 6). The smallest of the seven built images, and the only one that needs no
  # external credential.
  #
  # Its three calendar URLs are generated and point at a .invalid name, so the refresh loop
  # fails every cycle and says so in the pod log. That noise is EXPECTED here and is not a
  # symptom: the probes are tcpSocket, so the pod still reaches Ready. Anything that ever
  # reads staging pod logs looking for errors has to know this one is permanent.
  - name: ical-proxy
    platform: k8s
    hostname: "ical-proxy"
    port: 5000
    use_authelia: false
    # Both directions, because this is the service that proved the mechanism necessary. Its
    # route is a monitoring_route: Host + PathPrefix(/calendar) + a ClientIP guard. So
    # /calendar1.ics must answer 200 and / must answer 404 — the 404 is the PathPrefix working,
    # not a fault. Before #548 BOTH returned 404 and every other check read green.
    staging_expect:
      - hostname: ical-proxy
        path: /calendar1.ics
        status: 200
      - hostname: ical-proxy
        path: /
        status: 404

# One container runtime, and it is k3s's. Same reasoning that keeps Docker off the two
# cluster nodes: k3s ships its own containerd, and a second runtime's iptables chains land
# on top of its. roles/setup/k3s asserts this on both node paths.
has_docker: false

# Staging does not deploy itself. The GitOps pipeline is what staging is meant to GATE, in
# Phase C; a staging host that pulls and deploys its own commits would be gating itself.
has_gitops: false

# It is a guest, not a VM host.
has_hypervisor: false

# ---------------------------------------------------------------------------
# k3s server overrides. Prod runs roles/setup/k3s with nothing overridden; every
# entry below is staging declining work that only makes sense against prod, or
# naming its own network instead of the LAN. See docs/staging-cluster.md.
# ---------------------------------------------------------------------------

# This cluster's only node, so it is also its primary: the MetalLB announcement
# and every workload pin resolve here instead of naming prod's daniel-box.
k8s_primary_node: daniel-stage

# No B2 or R2. Staging holds no real credential by design (Decision 5), and a
# backup target configured with a fake one fails for a reason that is not a bug.
k3s_manage_backup_targets: false

# No heartbeats. These push into prod's Kuma and Healthchecks.io, so a staging
# failure would page a real operator about a cluster that is meant to break.
k3s_manage_health_crons: false

# MetalLB announces inside the libvirt NAT network, never on the prod L2 — the
# one design where staging can hurt prod (Decision 2). Both ranges sit above the
# network's DHCP pool (.50-.99) and below its broadcast address.
k3s_metallb_pool: 192.168.140.241-192.168.140.250
k3s_metallb_ingress_vip: 192.168.140.240

# Straight to Cloudflare. Prod forwards to Pi-hole's cluster IP first, and
# Pi-hole is not in the staging subset (Decision 6), so that upstream would name
# a Service that does not exist.
k3s_coredns_upstreams:
  - 1.1.1.1
  - 1.0.0.1

# No behaviour probe. It needs a name only the configured upstream answers and
# NXDOMAIN everywhere else — `pi.hole` is that against Pi-hole, but nothing is
# against a public resolver, so the probe could not tell a working forward from
# a broken one. Empty skips it rather than running a check that cannot fail.
k3s_coredns_probe_name: ""

# One node, so one replica. Prod runs 2 across daniel-box and daniel-server; asking for 2
# here would leave every volume permanently Degraded, since there is no second node to
# schedule the other replica on (docs/staging-cluster.md, Decision 3).
k3s_longhorn_replica_count: 1

# ---------------------------------------------------------------------------
# Traefik overrides. Everything here is staging declining a subsystem that needs a
# credential it does not hold or a backend it does not run — see docs/staging-cluster.md,
# Decision 4. With all four set, a census of the traefik role's templates leaves no
# variable unaccounted for outside all.yml, the role defaults and `domain`.
# ---------------------------------------------------------------------------

# LAN names only. Prod routes match `<svc>.<domain>` alongside `<svc>.local.<domain>`; a
# staging route on the public name would collide with prod's in any resolver that saw both.
k8s_public_route: false

# No certificate resolver, so Traefik serves its own default self-signed certificate. The
# `tls:` block itself stays — an IngressRoute on the https entrypoint WITHOUT one is a
# non-TLS router and is never matched against an HTTPS request at all.
k8s_tls_cert_resolver: ""

# No ACME. There is no Cloudflare token here, and issuing would spend the real domain's
# account and its duplicate-certificate rate limit on a cluster meant to be broken.
# Watched namespaces. Prod's default adds `observability`, which this cluster has no
# claude-otel to create — the first staging Traefik deploy aborted on
# `namespaces "observability" not found` applying the per-namespace Roles.
traefik_k8s_watched_namespaces:
  - "{{ k8s_namespace }}"
  - "{{ k8s_longhorn_namespace }}"
# No seeding: `freshrss_k8s_source_path` is a path on daniel-server that Docker's removal
# took with it, so a fresh PVC here would fail the copy. FreshRSS runs its own first-boot
# setup against the empty volume instead, and freshrss/templates/pvc.yaml.j2 creates the
# claim that seed-volume would otherwise have created.
freshrss_k8s_manage_seed: false

# No pre-apply Longhorn snapshots on this cluster. HOST-WIDE, not per role: k8s/manifests
# gates the k8s/volume-snapshot include on this list being non-empty, and an empty list here
# outranks every role's own declaration. That breadth is intended — every reason below is a
# property of the cluster, not of freshrss.
#
# DECIDED 2026-08-28. Reasons 2 and 3 are what hold it now — reason 1 forced the original
# decision and has since been fixed, so the list stays empty by choice rather than by blocker:
#
# 1. FIXED 2026-08-28, and no longer a reason to keep this empty — recorded because it was the
#    reason that forced the decision. k8s/volume-snapshot resolved the deploy tag with `git
#    rev-parse` and `chdir` into `{{ playbook_dir }}/..` ON THE TARGET, which worked only
#    because hosts.ini pins both cluster nodes to `connection=local`. daniel-stage is a
#    genuinely remote host with no checkout, so the task failed with "Unable to change
#    directory before execution" — a latent bug in a shared role with 13 callers rather than a
#    staging quirk. The task now carries `delegate_to: localhost`.
# 2. The snapshot is taken BEFORE the apply, and on this cluster `pvc.yaml` is what creates
#    the claim — so at snapshot time the volume does not exist yet.
# 3. It would protect nothing anyway. The role exists to make a bad image bump reversible on a
#    volume carrying migrating state from the Docker era. Staging has none: the volume is
#    created empty seconds later, and the data is disposable by design.
k8s_autodeploy_snapshot_pvcs: []


traefik_k8s_manage_acme: false

# The drift check pushes to prod's Kuma, same reason as k3s_manage_health_crons above.
traefik_k8s_manage_cloudflare_drift_check: false

# No WAF. The `crowdsec` role is not in the subset, so `crowdsec:8080` does not resolve —
# the agent sidecar would crashloop and the pod would never reach Ready. Two flags rather
# than one because the roles are gated separately on purpose (see the authelia role's
# defaults); the reason is the same for both.
traefik_k8s_manage_crowdsec: false
authelia_k8s_manage_crowdsec: false

# No OIDC provider. Its only relying party is Jellyfin, which is not in this subset, so the
# block would be dead configuration demanding three more generated credentials — including an
# RSA keypair — for a client that cannot connect. Forward-auth is unaffected, and forward-auth
# is the mechanism freshrss exercises here.
authelia_k8s_manage_oidc: false

# No registry garbage collection. Its script pushes the GC result into prod's Kuma, same
# reason as k3s_manage_health_crons above. Nothing here needs collecting either: this
# registry holds one small image and the cluster is rebuilt rather than kept.
registry_k8s_manage_gc: false

# The single caller a `monitoring_route` admits, named as this cluster's network sees it. The
# global value is daniel-server's LAN address, which no source inside the libvirt NAT can ever
# present — so ical-proxy's route rendered correctly here and answered 404 to everything,
# because the ClientIP guard could not be satisfied by construction rather than because
# anything was broken.
#
# 192.168.140.1 is daniel-server's own address on virbr-stage, which is what it presents when
# it dials the staging VIP. The other three consumers of this variable (claude-otel's
# prometheus, its ingressroute, loki-homelab's push route) are not in this subset, so the
# override reaches ical-proxy alone.
k8s_bridge_client_ip: 192.168.140.1

# No token gate. Every router in it routes to CouchDB or homelab-mcp, neither of which runs
# here, and its two tokens are the only traefik variables staging's secrets file lacks.
traefik_k8s_manage_livesync_gate: false

# ---------------------------------------------------------------------------
# Secrets. Staging holds no real credential, so it does not load the file that
# holds them (docs/staging-cluster.md, Decision 5).
# ---------------------------------------------------------------------------

# Encrypted to daniel-server's age key alone — the CONTROLLER decrypts, because
# load_secrets.yml runs `delegate_to: localhost`, and daniel-server is the only
# host that can route here. This is about SCOPE: no role templates a production
# value onto the guest today, but loading secrets.yml would put every one of
# them in the play's variable scope on a host meant to be broken.
secrets_file: secrets-staging.yml
