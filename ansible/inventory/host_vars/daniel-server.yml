---
server_ip: 10.0.0.161
# The link carrying server_ip. k3s-bringup.yml's agent-address play pins the address on it
# statically, so the k3s agent still starts when the gateway's DHCP server is down (#3891).
# The gateway reserves server_ip for this NIC (operator, 2026-10-10). wlo1 keeps its DHCP
# route at metric 600 as the fallback. That fallback wins only because static-address.yml sets
# ignore_routes_with_linkdown on this link (#4510). The pin also holds the link's IPv6 RA route
# at metric 100, so IPv6 prefers it over wlo1 too (#4561).
k3s_node_static_link: enp88s0
# The Intel AX201. The installer's 00-installer-config-wifi.yaml joined it first; the k3s
# role's 80-homelab-wifi-fallback.yaml merges on top and pins the metric-600 route.
k3s_node_wifi_link: wlo1
ssh_config_path: /etc/ssh/sshd_config
# Intel XE iGPU present — enables /dev/dri passthrough for jellyfin/tdarr hardware transcode.
has_igpu: true
# 30 GB of RAM with swap sitting unused, so initial_setup lowers vm.swappiness to 10 here —
# reclaiming page cache beats swapping service heaps. daniel-pi runs the OPPOSITE tuning
# (swappiness 130, zram-eager) in optimize_pi. group_vars/all.yml defaults this false.
has_ample_ram: true
# Dissolves docker-proxy-codeserver and the `codeserver` net from the docker-proxy compose.
has_code_server: false
# Empty, and no Docker: this host runs the k3s agent, the nut pod's hardware, and the
# nut_host shutdown chain — nothing else.
containers_list: []

# No engine, so no deployer to run. The gitops watchdog lives on — the cluster bridge
# watches daniel-box's deployer instead.
has_docker: false
# Kept explicit even though group_vars/all.yml defaults it false: the deployer's own refusal
# (`deploy_inventory.declares_no_gitops`) greps THIS file's text for a top-level
# `has_gitops: false` and fails open when the key is absent, so deleting the line would disarm
# the code-side half of the gate.
has_gitops: false

# The VM host. This is the only host with VT-x, spare RAM and no control-plane role. It runs
# the monthly etcd restore drill's throwaway guest — see roles/setup/hypervisor/CLAUDE.md.
has_hypervisor: true

# Claude Code session host for issue-fanout agents. The Remote Control unit
# stays on daniel-box; agents here stop at `gh pr create` and a daniel-box session lands the
# PR, because the k8s play, the connection=local pin and the per-host lock keep deploys there.
has_claude_code: true
claude_code_rc_enabled: false
# The `claude` agent user, so a fan-out launched as `claude` on daniel-box can place a batch
# here (docs/claude-agent-user.md, slice 5). Its batches stop at the PR as before. It needs one
# interactive `/login` as `claude` here, and its signing key registered on the agent's GitHub
# account, after the first apply. False expires the account and keeps its home.
claude_code_agent_user_enabled: true
# The read-only root inspector, `rootq` (issue #6323), for the operator and the agent user.
# False removes the grant, the shim and the script.
claude_code_rootq_enabled: true
# daniel-box's agent logs in here as `claude` with the key agent_peers.yml generates there.
# False removes the key and the ssh-users membership.
claude_agent_ssh_login_enabled: true
# The agent user takes the operator's dotfiles here too, as on daniel-box. A fan-out batch
# launched as `claude` needs the claude-guard shim they deploy: since #6116 every headless
# launch names claude-guard's prompt server, and refuses to start without the shim (#6117).
# Rollback: delete this line; the hand-picked config copy comes back on the next apply.
claude_code_agent_dotfiles: true

# DECIDED: 18G fleet cap, derived the way defaults/main.yml derives daniel-box's 14G.
# Measured on daniel-server 2026-10-17. Re-derive all of it if you change this:
#   RAM: MemTotal 32,478,052 kB = 31.0 GiB.
#   Unreclaimable footprint, as cgroup anon: kubepods.slice 5.31 GiB + machine.slice 0.00 GiB
#     (the daniel-stage KVM guest, retired 2026-09-29 — #2941) + system.slice 0.69 GiB =
#     6.0 GiB. Budgeted at 8.4 GiB (+40%) so k3s can grow without racing the fleet.
#   Kernel: SUnreclaim 0.64 GiB. Page cache left free for Longhorn I/O: ~3 GiB.
#   31.0 - 8.4 - 0.6 - 3 = 19.0 GiB available to the fleet, so 18G leaves ~1 GiB unspent.
#     Do not raise it past the 19.0 GiB, because the throttle stalls whichever cgroup loses
#     the reclaim race and the homelab plane is the one that must not.
# History: 10G until 2026-09-26, then 13G against a budget that still counted the KVM guest's
#   4.75 GiB, then 18G on 2026-10-17 at user request, to run three fan-out batches here as
#   daniel-box does. The 2026-09-09 reading was kubepods.slice 4.98 GiB + machine.slice 4.75
#   GiB + system.slice 0.58 GiB.
# With the RC unit disabled, user-1000.slice is the only plane here, so the 17G login cap is
# the effective per-plane bound and the fleet cap only matters once a second plane appears.
claude_code_fleet_memory_high: 18G
# 2G is under a third of this host's 7 GiB swap (`free -g`) — the same
# shape as daniel-box's "a quarter of its 8 GiB" reasoning in defaults/main.yml:117-119.
claude_code_fleet_swap_max: 2G
claude_code_rc_memory_high: 17G
claude_code_rc_memory_swap_max: 2G
# 8 cores against daniel-box's 16. The bound that matters is workers x concurrent runs, not
# workers (defaults/main.yml): 4 x 3 fan-out agents is 12 workers, ~1.2 GB against the 17G
# login cap. CPU is not what failed, so the count is not scaled down with the cores.
claude_code_rc_pytest_workers: 4
