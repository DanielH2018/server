---
server_ip: 10.0.0.161
ssh_config_path: /etc/ssh/sshd_config
# Intel XE iGPU present — enables /dev/dri passthrough for jellyfin/tdarr hardware transcode.
has_igpu: true
has_code_server: true
# scrutiny-collector's SMART source device (see scrutiny role CLAUDE.md) — override per host
# if the NVMe enumerates differently, or drop the scrutiny role entirely if the host has none.
scrutiny_nvme_device: /dev/nvme0
# Physical location, feeds the homepage weather widget. Only this host runs homepage.
lat: 38.89
long: -77.08
# The SLZB coordinator + PAN identity vars moved to group_vars/all.yml on 2026-08-09
# (slice 5, B2): z2m's config now renders on daniel-box, and the values were never
# host-specific — the coordinator is a network device.
# Self-hosted happy (slopus/happy, standalone shape) — pinned upstream commit for the
# ansible.builtin.git checkout that becomes the Docker build context (see
# roles/containers/happy). No usable release tag exists yet: the newest tag (v3) predates
# the standalone.ts/PGlite architecture (verified missing from that ref, 2026-07-19), and
# the cli-* tags are the npm CLI package's own releases, not the server. Bump this SHA to
# update; a redeploy then rebuilds from the new checkout.
happy_git_version: 3f161de70541b1cedaf0b7547ed70889d8dae22d
containers_list:
  # Organization: Core Services (proxy network)
  - name: traefik
    use_authelia: true
    networks:
      - proxy
  - name: authelia
    use_authelia: false
    networks:
      - proxy
  # crowdsec (the Metabase dashboard — the engine always lived in the traefik role) retired
  # 2026-08-09 at slice-6 B2c: it rides in the cluster engine pod now, reading the LIVE
  # decision DB. The Docker copy had been showing the retired local LAPI's frozen DB since
  # B2b. Role archived at roles/containers/archive/crowdsec.
  # portainer retired 2026-08-09 (slice-7 Phase B / design decision 4, executed): replaced by
  # nothing — kubectl/k9s serve the cluster, `docker ps` covers the shrinking residual set.
  # Took its whole cohort: docker-proxy-portainer (lived in this role's compose), homepage's
  # widget (and homepage's `proxy` net membership, which existed only for it), the Pi's
  # portainer-agent + its DOCKER-USER firewall, and portainer_manager_host. Role in
  # roles/containers/archive/.
  - name: docker-proxy
    use_authelia: false
    # NOT on `apps` (Security M1, 2026-07-01): this read-only proxy runs CONTAINERS=1, and
    # `GET /containers/{id}/json` returns EVERY container's Env (secrets). haproxy can't
    # body-filter, so the only lever is who can reach it — keeping it off `apps` stops the
    # internet-facing app fleet (n8n/karakeep/freshrss/livesync/…) from enumerating every
    # service's secrets. code-server (the lone apps-side consumer) gets its own dedicated
    # `docker-proxy-codeserver` on the private `codeserver` net instead. proxy/monitoring
    # consumers (traefik provider, homepage, grafana, autokuma, prometheus/cadvisor, glances)
    # are unaffected — they reach it over those nets.
    networks:
      - proxy
      - monitoring
  - name: homepage
    port: 3000
    use_authelia: true
    # `proxy` dropped 2026-08-09 with the Portainer widget — it was the sole reason homepage
    # sat on that net (the 2026-06-24 lesson, now moot). Remaining widgets reach their
    # targets over apps/monitoring or via .local hostnames.
    networks:
      - apps
      - monitoring
      - media
      - homepage_private
  - name: autoheal
    use_authelia: false
    networks:
      # lifecycle-only: reaches docker-proxy-lifecycle (write proxy), not the broad nets
      - lifecycle
  # watchtower retired 2026-08-09 (slice-7 Phase B dissolve): Renovate owns image updates —
  # every remaining image is pinned and PR-driven, so an unsupervised puller was pure risk
  # (the per-service watchtower.enable=false labels it obeyed are now dead metadata and go
  # with each remaining template as it retires). Role in roles/containers/archive/.
  # cloudflare-ddns was retired from this host on 2026-08-05 — the first service slice 2
  # actually cut over. It now runs in k3s (roles/k8s/cloudflare-ddns), and its two Kuma
  # dead-man's-switches moved to uptime-kuma's own compose because AutoKuma derives monitors
  # from a running container's labels.
  #
  # It went first because it is the only migrated service with no Traefik route: no hostname
  # to repoint, no public path, and so none of the ingress work the others are still waiting
  # on. The role under roles/containers/cloudflare-ddns is deliberately left in place — it is
  # the rollback, and re-adding an entry here is the whole of it.
  # Organization: Apps network
  - name: peanut
    port: 8080
    use_authelia: true
    networks:
      - apps
  - name: pihole
    port: 80
    use_authelia: true
    networks:
      - apps
  - name: kopia
    port: 51515
    use_authelia: true
    networks:
      # Dedicated isolation net shared only with Traefik. Kopia runs intentionally
      # unauthenticated (Kopia basic-auth bug workaround); keeping it off `apps`
      # stops other app containers reaching kopia:51515 directly.
      - kopia
  - name: wg-easy
    port: 51821
    udp_port: 51820
    use_authelia: true
    # Server-only admin auth: bcrypt hash of the wg-easy admin password (SOPS). Closes the
    # unauthenticated admin API otherwise reachable to every monitoring-net neighbor (Authelia
    # only gates the Traefik ingress). The Pi's wg-easy entry omits this — accepted LAN-only risk.
    password_hash: "{{ wg_easy_password_hash }}"
    # DNS baked into generated WireGuard client configs → the cluster Pi-hole VIP
    # (slice-6 B3 cutover, 2026-08-09; was this host's Docker Pi-hole), so
    # *.local.<domain> resolves over the tunnel (private homelab path that bypasses
    # Cloudflare/CrowdSec). Mobile full-tunnel clients use it directly; desktop
    # split-tunnel clients override it (hosts file) to keep general DNS on Mullvad.
    # NB: the DNS lives in each client's IMPORTED config — existing clients keep the
    # old .161 until their config is re-exported/re-imported, which must happen (or be
    # accepted) before the Docker Pi-hole retires at the end of the drain.
    default_dns: "{{ dns_k8s_vip }}"
    # On `monitoring`, NOT `apps`: wg-easy must not share a Docker bridge with the
    # containers behind the host-published ports WG clients reach (Traefik 80/443 ->
    # apps, Pi-hole 53 -> apps, Portainer 9000 -> proxy, Jellyfin DLNA -> media). Reaching
    # a same-bridge container via a host-published port hairpins: the DNAT'd reply
    # returns straight across the bridge, bypassing the host's reverse-NAT, so conntrack
    # drops it and the WG client times out. `monitoring` is cross-bridge from all of them
    # (only Traefik is host-published there, and its 80/443 DNAT to its apps IP), and
    # Traefik is on it so the wg-easy UI still routes. See docs/wireguard-private-homelab-access.md.
    networks:
      - monitoring
  # Organization: Smart home — fully migrated to the cluster on 2026-08-09 (slice 5).
  # mosquitto retired last (B1's final step): the k8s broker behind the mqtt_k8s_vip
  # LoadBalancer serves z2m, HA, and the operator's mosquitto_pub; nothing pointed at the
  # Docker copy for its whole soak (connection log: only its own healthcheck). The former
  # `mqtt` and `ups` isolation nets retired with it.
  # zigbee2mqtt moved to daniel-box on 2026-08-09 (slice 5, B2) as a k8s Deployment — the
  # SLZB coordinator is network-attached, so nothing tied it to this host. The containers
  # role stays as the config-template source (the k8s Secret renders it), same split as
  # configarr. Unsuffixed zigbee2mqtt.<domain> forwards to the cluster via bridge_hostname.
  # home-assistant moved to daniel-box on 2026-08-09 (slice 5, B3) as a k8s Deployment. The
  # containers role stays as the config-authoring home (validate-ha-config, the macro tests,
  # the skills anchor there); the k8s role ships its files. Unsuffixed home-assistant.<domain>
  # forwards to the cluster via bridge_hostname, so the companion app's route never changed.
  # Its former `ups` and `mqtt` isolation nets retire with the mosquitto cleanup.
  # Organization: Development
  - name: code-server
    port: 8443
    use_authelia: true
    # `apps` stays networks[0] (the Traefik route binds to it). `codeserver` is the private
    # isolation net to its OWN read-only docker-proxy (docker-proxy-codeserver) — so it keeps
    # its in-IDE `docker` CLI without the shared docker-proxy having to sit on `apps` (Security M1).
    networks:
      - apps
      - codeserver
  # n8n moved to k3s on 2026-08-06 behind the strangler bridge, taking its task-runner sidecar
  # with it (n8n-runners was never its own entry here). Unlike the earlier migrations there was
  # no coexistence window — two schedulers against one database would double-fire every
  # scheduled workflow — so the Docker copy was stopped before the seed rather than after.
  # Rolling back is re-adding this entry, restoring N8N_URL in the monitor-bridge template, and
  # removing bridge_hostname from daniel-box's; containers/n8n/data is still on disk.
  # karakeep moved to k3s on 2026-08-06 behind the strangler bridge, taking three helper
  # workloads with it (headless Chrome, Meilisearch, the time-tagger) — none of which were ever
  # their own entry here. Rolling back is re-adding this entry and removing bridge_hostname from
  # daniel-box's; the Meilisearch index is rebuilt by reindexing either way.
  # Organization: Media
  # freshrss moved to k3s on 2026-08-05 behind the strangler bridge, taking its feed-cache
  # sidecar with it — that was a second service inside this one compose, never its own entry.
  # Rolling back is re-adding this entry and removing bridge_hostname from daniel-box's.
  # ── slice 4, B4c: the five that share the hardlink seam moved to k3s 2026-08-07 ──────────
  # qbittorrent (with its wireguard sidecar), sonarr, radarr, prowlarr (with flaresolverr) and
  # bazarr now run on daniel-box. Removed from this list rather than merely stopped, because
  # gitops runs deploy.yml as a plain containers_list loop and would otherwise recreate and
  # restart every one of them on the next tick.
  #
  # They moved TOGETHER and had to: sonarr and radarr import by hardlink from /data/torrents
  # into /data/media, and link() only works when one filesystem holds both. Splitting them
  # across hosts would have turned every import into a silent copy.
  #
  # Rolling back is re-adding these five entries and setting <svc>_k8s_enabled: false on
  # daniel-box. The config directories under containers/ are untouched — the migration only
  # ever read them.
  # jellyfin moved to daniel-box on 2026-08-08 (slice 4, B5). Not part of the five above — it
  # only READS the library, so it shares no hardlink seam and needed no shared window. What it
  # needed was the GPU: it is the first workload to request the `devic.es/dri` resource the B1
  # device plugin advertises, which is why it is the slice's exit criterion.
  #
  # Rolling back is re-adding this entry and setting jellyfin_k8s_enabled: false on daniel-box.
  # containers/jellyfin/config is untouched — the migration only ever read it. One caveat the
  # other five do not have: the cluster copy converts /config/encoding.xml from qsv to vaapi
  # (D12) on its own volume, so a rollback returns to an Intel-configured Docker copy correctly,
  # but re-seeding the cluster from a rolled-back source would need that conversion again.
  # tdarr moved to daniel-box on 2026-08-08 (slice 4, B6), hours after jellyfin. Same reason it
  # went alone: no hardlink seam, but it needs the GPU. Rolling back is re-adding this entry and
  # setting tdarr_k8s_enabled: false on daniel-box. The internal node's ID follows the hostname,
  # so it registered as `daniel-box` against a database written by `daniel-server` — that turned
  # out to be a non-event (one node listed after the move, not two), and a rollback is the same
  # rename in reverse.
  # configarr moved to daniel-box on 2026-08-08 (slice 4, B7a), as a CronJob rather than a
  # Deployment — it was never a service. Rolling back is re-adding this entry, deleting the
  # cluster CronJob, and putting the `configarr` AutoKuma label back on monitor-bridge (it now
  # lives on uptime-kuma, pushed by a health cron on daniel-box; the token is unchanged, so the
  # monitor and its history are the same object either way).
  # janitorr moved to daniel-box on 2026-08-08 (slice 4, B7b) — the LAST of the nine, and the only
  # one that deletes real media, so it went dry first and was flipped live only after its symlinks
  # were proven to resolve inside Jellyfin's namespace. Rolling back is re-adding this entry,
  # scaling the cluster Deployment to 0, and putting the `Janitorr Errors` AutoKuma label back on
  # monitor-bridge (it now lives on uptime-kuma, pushed by a health cron on daniel-box; the token
  # is unchanged, so the monitor and its history are the same object either way).
  # Organization: Monitoring
  - name: prometheus
    port: 9090
    use_authelia: true
    networks:
      - monitoring
      - apps  # reach home-assistant:8123 for the /api/prometheus scrape (mirrors monitor-bridge)
  - name: grafana
    port: 3000
    use_authelia: true
    networks:
      - monitoring
  - name: tempo
    port: false
    use_authelia: false
    networks:
      # monitoring only: the otel-collector exports Claude Code spans to tempo:4317 and
      # Grafana's Tempo datasource queries tempo:3200 over this net. No web UI of its own
      # (traces are read through Grafana), so no port/Authelia and nothing published.
      - monitoring
  - name: otel-collector
    port: false
    use_authelia: false
    networks:
      # monitoring only: Prometheus scrapes otel-collector:8889 and the collector pushes
      # event logs to loki:3100 over this net. OTLP 4317/4318 are published to host loopback
      # for Claude Code, which runs on the host (not a container). No web UI, so no port/Authelia.
      - monitoring
  # glances retired 2026-08-09 (slice-7 Phase B dissolve): node-exporter + cAdvisor already
  # feed the same host metrics to Prometheus/Grafana, so this was a second, unscraped copy
  # of data the monitoring plane owns. Homepage's glances-widget Monitoring section went
  # with it — those readings live in Grafana. The Pi's own glances copy is untouched (it was
  # never part of the 46-entry disposition). Role in roles/containers/archive/.
  - name: uptime-kuma
    port: 3001
    use_authelia: true
    networks:
      - monitoring
  - name: scrutiny
    port: 8080
    use_authelia: true
    networks:
      - monitoring
  - name: homelab-mcp
    port: 8000
    # No public Host rule ANYWHERE: the route is hand-written in the traefik role's file
    # provider, matches only mcp.local.<domain> + the bearer header, and slice-6 B4's
    # reverse bridge skips entries carrying this key so the cluster edge never grows a
    # public router for it either.
    public_route: false
    # Read-only MCP server exposing live state to Claude Code (LAN-only, token-gated at
    # Traefik + re-checked in-app). No Authelia — a headless MCP client can't pass 2FA.
    # networks: proxy (Traefik reaches the token-gated route), monitoring (prometheus +
    # loki + uptime-kuma + scrutiny + docker-proxy), apps (home-assistant:8123 for the
    # ha_state tool — same precedent as monitor-bridge/prometheus joining apps for HA).
    use_authelia: false
    networks:
      - proxy
      - monitoring
      - apps
  # ARCHIVED 2026-07-19 — happy mothballed: containers removed, live PGlite+blob data
  # deleted, daemon timer disabled + redeploy cron removed on the host. Retained for revival:
  # the role, the traefik happy/happy-webapp routes, the SOPS handy_master_secret, and the
  # src/ checkout. To revive: uncomment this entry and run `deploy.yml --tags traefik,happy`
  # (rebuilds from src; the deleted data means every machine/session re-pairs from scratch).
  # - name: happy
  #   port: 3005
  #   use_authelia: false
  #   networks:
  #     - proxy
  - name: monitor-bridge
    port: false
    use_authelia: false
    networks:
      # monitoring: reach prometheus + uptime-kuma. kopia: query the backup source's
      # status without putting kopia on the broad monitoring net (trusted-infra access,
      # like traefik). apps: reach the n8n public API at n8n:5678 (workflow-failure check)
      # AND home-assistant:8123 (HA automation-heartbeat check). media: reach sonarr:8989 +
      # radarr:7878 for the queue-warning check (2026-07-02; same precedent as homepage
      # joining media). No web UI, so no port / Authelia.
      - monitoring
      - kopia
      - apps
      - media
  - name: autofix-bridge
    port: false
    use_authelia: false
    networks:
      # media: reach sonarr:8989 + radarr:7878 (queue read + blocklist/search writes).
      # monitoring: push to uptime-kuma:3001 AND egress to the *arr Discord webhook. No web UI.
      - media
      - monitoring
  # Organization: Miscellaneous (apps network)
  # healthchecks moved to k3s on 2026-08-05, the last of slice 2's routed services. Its
  # /ping/ bypass moved with it: that was a Docker label on this container, so it died with
  # the container and is reproduced by the bridge's bridge_bypass_prefixes. The note this
  # replaces explained why it sat on `apps` rather than `monitoring` — it was
  # internet-reachable unauthenticated on /ping/ and so must not share a net with
  # docker-proxy. That reasoning now applies to the bypass routers instead.
  - name: bento-pdf
    port: 8080
    use_authelia: true
    networks:
      - apps
  # littlelink moved to k3s on 2026-08-05, behind the same strangler bridge as speedtest. It
  # stays public and un-gated there — the reason the Docker entry carried use_authelia: false
  # is unchanged by the platform: this is the public link-in-bio landing page (www), so a login
  # gate would break it. Rolling back is re-adding this entry and removing bridge_hostname from
  # daniel-box's.
  # livesync moved to k3s on 2026-08-06, behind the strangler bridge. Its edge routers are the
  # only hand-written ones in the bridge — the sync API's X-Sync-Token gate and the Authelia'd
  # /_utils carve-out both live in the traefik role's config.yml.j2 now, the latter having moved
  # off this container's labels, where it would have died with it. Rolling back is re-adding this
  # entry, removing bridge_hostname/bridge_custom_routers from daniel-box's, and restoring the
  # livesync-utils labels in the livesync role's compose template.
  - name: ical-proxy
    port: false
    use_authelia: false
    networks:
      - homepage_private
  # speedtest moved to k3s on 2026-08-05 — the first service retired behind a strangler
  # bridge. Its hostnames still arrive here and are forwarded to the cluster VIP by the
  # <name>-bridge-* routers in the traefik role's config.yml.j2, which are generated from
  # daniel-box's inventory. Rolling back is re-adding this entry and removing bridge_hostname
  # from that one; both must move together, which test_strangler_bridge.py enforces.
  # Organization: Game servers (apps network)
  - name: terraria
    # No HTTP port — exposed over a dedicated raw-TCP Traefik entrypoint (terraria,
    # :7777) plus a direct 7778->7777 host publish; can't carry Authelia forward-auth.
    use_authelia: false
    # Dedicated isolation net (2026-07-02 review M3, kopia pattern): terraria is the only
    # internet entry point with NO CrowdSec/rate-limit chain (raw TCP), so it must not sit
    # on the shared `apps` net where a game-protocol exploit could reach ~15 services'
    # unauthenticated container ports. Only traefik joins `terraria` alongside it; it
    # needs to reach nothing (terraria-stats reads its console via Loki, not the net).
    networks:
      - terraria
  - name: terraria-stats
    # Headless sidecar: reads terraria console lines from Loki, serves Prometheus
    # metrics on :9420. No web UI -> no port/Authelia. monitoring net = reach Loki
    # and be scraped by Prometheus.
    port: false
    use_authelia: false
    networks:
      - monitoring
