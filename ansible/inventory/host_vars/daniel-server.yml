---
server_ip: 10.0.0.161
ssh_config_path: /etc/ssh/sshd_config
# Intel XE iGPU present — enables /dev/dri passthrough for jellyfin/tdarr hardware transcode.
has_igpu: true
# Dissolves docker-proxy-codeserver and the `codeserver` net from the docker-proxy compose.
has_code_server: false
# Empty since Docker was uninstalled here on 2026-08-14. This host now runs the k3s agent,
# the nut pod's hardware, and the nut_host shutdown chain — nothing else. Every service
# that used to be listed here moved to roles/k8s/ or retired; the retired roles and the
# per-service migration record are in git history and docs/archive/k3s-migration/.
containers_list: []

# No engine, so no deployer to run. The gitops watchdog lives on — the cluster bridge
# watches daniel-box's deployer instead.
has_docker: false
has_gitops: false

# The staging-cluster VM host. This is the only host with VT-x, spare RAM and no
# control-plane role, so the second k3s runs here as a KVM guest rather than beside prod.
# See docs/staging-cluster.md, Decision 1.
has_hypervisor: true

# Claude Code session host for issue-fanout agents (spec 2026-09-06). The Remote Control unit
# stays on daniel-box; agents here stop at `gh pr create` and a daniel-box session lands the
# PR, because the k8s play, the connection=local pin and the per-host lock keep deploys there.
has_claude_code: true
claude_code_rc_enabled: false

# DECIDED: 13G fleet cap, derived the way defaults/main.yml derives daniel-box's 14G.
# Measured on daniel-server 2026-09-09. Re-derive all of it if you change this:
#   RAM: MemTotal 32,478,080 kB = 31.0 GiB.
#   Unreclaimable footprint, as cgroup anon: kubepods.slice 4.98 GiB + machine.slice (the
#     daniel-stage KVM guest) 4.75 GiB + system.slice 0.58 GiB = 10.3 GiB. Budgeted at
#     14.4 GiB (+40%) so k3s and the guest can grow without racing the fleet.
#   Kernel: SUnreclaim 0.48 GiB. Page cache left free for Longhorn I/O: ~3 GiB.
#   31.0 - 14.4 - 0.5 - 3 = 13.1 GiB available to the fleet. The cap was 10G until
#     2026-09-26, leaving ~3 GiB unspent. It was raised to 13G at user request to fit one
#     more fan-out batch, which leaves ~0.1 GiB unspent. Do not raise it past the 13.1 GiB,
#     because the throttle stalls whichever cgroup loses the reclaim race and the homelab
#     plane is the one that must not.
# Re-measured 2026-09-26 before the raise: anon was kubepods.slice 3.95 GiB + machine.slice
#   5.65 GiB + system.slice 0.62 GiB = 10.2 GiB, inside its 14.4 GiB budget.
# With the RC unit disabled, user-1000.slice is the only plane here, so the 11G login cap is
# the effective per-plane bound and the fleet cap only matters once a second plane appears.
claude_code_fleet_memory_high: 13G
# 2G is under a third of this host's 7 GiB swap (`free -g`, measured 2026-09-09) — the same
# shape as daniel-box's "a quarter of its 8 GiB" reasoning in defaults/main.yml:117-119.
claude_code_fleet_swap_max: 2G
claude_code_rc_memory_high: 11G
claude_code_rc_memory_swap_max: 2G
# 8 cores against daniel-box's 16. The bound that matters is workers x concurrent runs, not
# workers (defaults/main.yml): 4 x 3 fan-out agents is 12 workers, ~1.2 GB against the 11G
# login cap. CPU is not what failed, so the count is not scaled down with the cores.
claude_code_rc_pytest_workers: 4
