# `ansible_connection=local` means `-e target=<that host>` selects the host's VARIABLES and runs
# every task on the machine you typed the command on. Selection and execution are separate, and
# `target` controls only the first — so a play for a local-connection host must be run ON that
# host, or override `ansible_connection: ssh` in the play's `vars:` the way k3s-bringup.yml's
# agent-join play does. ENFORCED since 2026-08-29 by an assert in pre_tasks/load_secrets.yml
# (ansible/tests/deploy/test_local_connection_target.py). Before it existed,
# `initial_setup.yml --tags setup_drift -e target=daniel-server` run from daniel-box installed
# the whole role onto daniel-box and exited 0.
[homeservers]
daniel-server  ansible_connection=local
# daniel-pi: driven remotely over SSH (`-e target=daniel-pi`), from whichever node you run the
# play on. ubuntu has NOPASSWD sudo + key auth.
daniel-pi   ansible_host=10.0.0.139 ansible_user=ubuntu ansible_connection=ssh
# daniel-box: playbooks are run ON it (bring-up.sh derives the host from `hostname`).
daniel-box  ansible_connection=local
# daniel-stage: the staging cluster's KVM guest, on daniel-server's libvirt NAT network.
# Driven remotely over SSH FROM daniel-server only (`-e target=daniel-stage`) — daniel-box
# cannot route to 192.168.140.0/24, which is internal to the other host. Built by
# roles/setup/hypervisor; see docs/staging-cluster.md.
daniel-stage  ansible_host=192.168.140.10 ansible_user=ubuntu ansible_connection=ssh
