---
# A stub kept until H7.20a deletes it with the role. H7.24b emptied `sops_setup` to a
# `meta: end_role`, so this playbook applies nothing. The host packages ship `sops` and `age`
# (`hosts/components/sops/`), and `hosts/bootstrap-host.sh` creates the host's age key.
#
# Its one use is the rollback in `ansible/roles/setup/sops_setup/CLAUDE.md`: after a revert of
# H7.24b restores the role's tasks, this playbook re-installs `sops`, because it has no
# secret-loading pre_task and `initial_setup.yml` cannot run without `sops` on PATH.
- name: Bootstrap a host for SOPS (no encrypted-secret dependency)
  hosts: "{{ target | default(lookup('pipe', 'hostname')) }}"
  # An escalated task imports from this tree's .venv as root, and the root-owned
  # __pycache__ that leaves behind blocks the worktree's removal. See
  # ansible/tests/deploy/test_plays_disable_bytecode_writes.py.
  environment:
    PYTHONDONTWRITEBYTECODE: "1"
  become: true
  gather_facts: true
  roles:
    - { role: sops_setup, tags: ["sops_setup"] }
