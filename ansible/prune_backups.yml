---
# Delete stranded Longhorn backups straight out of B2, through the B2 API. One mode, a dry run
# unless you pass -e prune_apply=true.
#
#   b2-drain        whole stranded volume prefixes, straight out of B2 through the B2 API.
#
# BACKUP CRs ARE DELETED ELSEWHERE. This playbook deletes B2 OBJECTS. Deleting Longhorn Backup
# CRs — a migrated volume's old chain, or a retired seed — is
# scripts/backup/longhorn_reap_orphan_backups.py, whose selection and safety floors are unit
# tested rather than written in Jinja. Those two modes lived here until #3279:
#
#   sudo .venv/bin/python -B scripts/backup/longhorn_reap_orphan_backups.py \
#     --mode migrated-chain --claim sonarr-config [--apply]
#   sudo .venv/bin/python -B scripts/backup/longhorn_reap_orphan_backups.py \
#     --mode seeds [--claim valheim-config] [--seed-floor 2] [--apply]
#
# WHICH PATH TO USE. The reaper deletes through Longhorn, which reaches both backup targets, R2
# (the daily tier) and B2 (the weekly shards). It is also the expensive one: each Longhorn backup
# deletion walks the volume's whole block tree, about 1.28 B2 Class C transactions per stored
# block (`probe.py b2-budget` prints the per-volume figure). This playbook goes through the B2
# API instead: one listing for the entire store (5 Class C, measured) plus Class A deletes, which
# are unmetered. It reaches B2 only, never R2, so a daily-tier volume's chain goes through the
# reaper's migrated-chain mode, one claim at a time. Scoping and measurements:
# docs/archive/b2-api-drain-scoping.md.
#
# Usage:
#   uv run ansible-playbook ansible/prune_backups.yml -i ansible/inventory/hosts.ini \
#     -e prune_mode=b2-drain -e prune_volumes=pvc-aaa,pvc-bbb    (or -e prune_volumes_file=<path>)
#
# Read the dry run, then re-run the same command with -e prune_apply=true.
#
# ---------------------------------------------------------------------------------------------
# b2-drain (prune_backups/tasks/b2-drain.yml)
#
# WHAT THIS MODE ADDS over running the script by hand: the SOPS credentials, and the live
# Longhorn volume list the script refuses to act without. The safety logic lives in the script
# (scripts/backup/b2_drain.py) where it is unit-tested: it refuses everything on an empty live
# list, and refuses by name any requested volume that still exists. Twenty volume names is 820
# characters, which no shell pastes reliably on one line, so use prune_volumes_file for a full
# sweep.
- name: Prune stranded Longhorn backups
  hosts: daniel-box
  # An escalated task imports from this tree's .venv as root, and the root-owned
  # __pycache__ that leaves behind blocks the worktree's removal. See
  # ansible/tests/deploy/test_plays_disable_bytecode_writes.py.
  environment:
    PYTHONDONTWRITEBYTECODE: "1"
  connection: local
  gather_facts: false
  vars:
    # Nothing here reads a fact.
    load_secrets_gather_facts: false
    # One mode, and the selector stays: `-e prune_mode=b2-drain` is the command an operator has
    # in their shell history, and the assert below is what redirects the two retired modes to
    # the reaper rather than failing on a missing task file.
    prune_modes: [b2-drain]
    prune_apply: false
    # The b2-drain mode's command. It sits here rather than in the mode's task file because
    # the scripts reference page (scripts/lib/script_classify.py) credits a script's caller only
    # from a line in a top-level playbook that runs it.
    prune_drain_argv: [uv, run, python, scripts/backup/b2_drain.py]
    # The repo this playbook is part of, not a fixed path: a path naming a worktree goes stale
    # when the worktree is removed, and the drain is the one path nobody re-runs after a
    # success.
    prune_repo: "{{ playbook_dir | dirname }}"
    prune_drain_live_file: /tmp/longhorn-live-volumes.txt
  pre_tasks:
    # The preamble's first task refuses this local-connection play when it runs anywhere but
    # daniel-box. Without it, a run from daniel-server drains B2 from there under a daniel-box
    # recap.
    - name: Load encrypted secrets and set the become password (shared preamble)
      ansible.builtin.import_tasks: pre_tasks/load_secrets.yml
      tags: always

    - name: Require a known mode
      ansible.builtin.assert:
        that: (prune_mode | default('')) in prune_modes
        fail_msg: >-
          pass -e prune_mode=b2-drain, the only mode this playbook carries.
          Got {{ prune_mode | default('nothing') }}. The migrated-chain and seeds modes are
          scripts/backup/longhorn_reap_orphan_backups.py --mode migrated-chain --claim <pvc>
          and --mode seeds since #3279: they delete Longhorn Backup CRs, and their selection
          and floors are unit tested there.

  tasks:
    - name: Run the requested mode
      ansible.builtin.include_tasks: "prune_backups/tasks/{{ prune_mode }}.yml"
