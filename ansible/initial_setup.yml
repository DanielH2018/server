---
- name: Initial Server Setup
  hosts: "{{ target | default(lookup('pipe', 'hostname')) }}"
  # An escalated task imports from this tree's .venv as root, and the root-owned
  # __pycache__ that leaves behind blocks the worktree's removal. See
  # ansible/tests/deploy/test_plays_disable_bytecode_writes.py.
  environment:
    PYTHONDONTWRITEBYTECODE: "1"
  become: true
  # The shared preamble gathers facts once the SOPS-stored sudo password is set; -K still
  # works as an override.
  gather_facts: false
  pre_tasks:
    - name: Load encrypted secrets and set the become password (shared preamble)
      ansible.builtin.import_tasks: pre_tasks/load_secrets.yml
      tags: always
  roles:
    - { role: config_files, tags: ["config_files"] }
    - { role: initial_setup, tags: ["initial_setup"] }
    - { role: sops_setup, tags: ["sops_setup"] }
    # Unconditional: the role dispatches on has_docker internally (install.yml vs
    # teardown.yml). A role gated here is skipped, and a skipped role reaps nothing.
    - { role: docker_install, tags: ["docker_install"] }
    # Unconditional for the same reason as docker_install: the role dispatches on
    # has_hypervisor internally, so a host that turns it off still gets the teardown half.
    # After docker_install, so a host retiring one runtime has done that before gaining the
    # other — both write firewall state, and doing them in one run in this order means they
    # never overlap.
    - { role: hypervisor, tags: ["hypervisor"] }
    - { role: gitops_deploy, tags: ["gitops_deploy"] }
    # After gitops_deploy: it reads /var/lib/gitops-deploy and dispatches on has_gitops.
    - { role: deploy_ui, tags: ["deploy_ui"] }
    # Per-user, become: false throughout — they manage the connecting user's home, not
    # root's. Placed after docker_install so the OS is fully set up before the dotfiles
    # land on top of it.
    # Before chezmoi_setup, though not as a credential dependency: the dotfiles repo is
    # public and clones anonymously. What the order buys is the rendered
    # ~/.gitconfig. The dotfiles template writes the `gh auth git-credential` helper only when
    # `gh` is already on PATH at the moment chezmoi renders it, and falls back to a timed
    # credential cache otherwise — a fallback that then stands until the next apply.
    - { role: github_cli, tags: ["github_cli"], when: has_github_cli }
    - { role: chezmoi_setup, tags: ["chezmoi"], when: has_chezmoi }
    - { role: claude_code, tags: ["claude_code"], when: has_claude_code }
    - { role: renovate_notify, tags: ["renovate_notify"], when: inventory_hostname == renovate_notify_host }
    # After claude_code: the agent's ExecStart is the `claude` binary that role installs.
    # The role installs on renovate_agent_host regardless of renovate_agent_enabled; that var
    # decides only whether the timer is armed, so the rollback is a var flip and a re-run.
    - { role: renovate_agent, tags: ["renovate_agent"], when: inventory_hostname == renovate_agent_host }
    # After gitops_deploy, whose /opt modules and config.env the producer reads, and after
    # github_cli, whose login its CI walk authenticates with. render_records_enabled: false
    # is the way out; it runs the role's absent arm on this host.
    - { role: render_records, tags: ["render_records"], when: inventory_hostname == render_records_host }
    # Host half of the UPS stack (udev rule + secondary upsmon that performs the real
    # poweroff); the primary is the k8s/nut pod pinned to ups_host.
    #
    # ups_host runs it unconditionally — it owns the USB UPS. Any OTHER host runs only the
    # client half, and only once nut_host_secondary_armed is set for it. daniel-box is armed
    # (host_vars/daniel-box.yml): it draws from the same UPS (measured) and would otherwise
    # take a hard cut at battery end. A secondary upsmon's job is to
    # power the machine off, so arming a further host without the console-attended
    # `upsmon -c fsd` drill risks an unplanned shutdown of it.
    - role: nut_host
      tags: ["nut_host"]
      when: inventory_hostname == ups_host or nut_host_secondary_armed | bool
    - { role: optimize_pi, tags: ["optimize_pi"], when: inventory_hostname == optimize_pi_host }
    # The fake-remux detector + reconciler run on the media stack's host (fake_remux_host).
    # Host-conditional like optimize_pi/renovate_notify.
    - { role: fake_remux, tags: ["fake_remux"], when: inventory_hostname == fake_remux_host }
