---
- name: Check for n8n executions since the runner fix
  hosts: "{{ target | default(lookup('pipe', 'hostname')) }}"
  gather_facts: false
  pre_tasks:
    - name: Load encrypted secrets and set the become password (shared preamble)
      ansible.builtin.import_tasks: pre_tasks/load_secrets.yml
  tasks:
    - name: Resolve the n8n ClusterIP
      ansible.builtin.command:
        argv: [k3s, kubectl, -n, homelab, get, svc, n8n, -o, 'jsonpath={.spec.clusterIP}']
      become: true
      changed_when: false
      register: n8n_ip
    - name: Fetch executions
      ansible.builtin.uri:
        url: "http://{{ n8n_ip.stdout }}:5678/api/v1/executions?limit=50"
        headers:
          X-N8N-API-KEY: "{{ n8n_api_key }}"
      register: e
      no_log: true
    - name: Failures since the rollout
      ansible.builtin.debug:
        msg: >-
          newest={{ (e.json.data | map(attribute='startedAt') | sort | last) | default('none') }};
          since_2021Z={{ e.json.data | selectattr('startedAt', 'gt', '2026-08-08T20:21:00.000Z') | list | count }}
