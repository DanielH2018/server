---
# Since E1 (grafana container -> cluster) and the 2026-08-13 loki cut, this role deploys
# only promtail (a Docker-host tailer until the Phase F join, KL2). The E1-era tasks that
# rendered datasources/dashboards/admin_password for the retired Docker grafana were
# removed 2026-08-13 — the cluster grafana mounts its admin Secret directly and reads the
# dashboards tree from this role's files/ via k8s/claude-otel/tasks/dashboards.yml.
- name: Create required directories
  tags: [config]
  ansible.builtin.include_role:
    name: common
    tasks_from: setup_dirs.yml
  vars:
    common_dirs_to_create:
      - "{{ container_item.name }}"

- name: Create promtail-config.yml from template
  tags: [config]
  ansible.builtin.template:
    src: promtail-config.yml.j2
    dest: "/home/{{ sys_user }}/server/containers/{{ role_name }}/promtail-config.yaml"
    mode: "0664"
  register: grafana_cfg_promtail

- name: Deploy Container
  tags: [deploy]
  ansible.builtin.include_role:
    name: common
    tasks_from: docker_deploy.yml
  vars:
    common_config_changed: "{{ grafana_cfg_promtail is changed }}"
