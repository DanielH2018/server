---
- name: Create required directories
  tags: [config]
  ansible.builtin.include_role:
    name: common
    tasks_from: setup_dirs.yml
  vars:
    common_dirs_to_create:
      - "{{ container_item.name }}"

- name: Deploy monitor-bridge check script
  tags: [config]
  ansible.builtin.copy:
    src: check.py
    dest: "/home/{{ sys_user }}/server/containers/{{ container_item.name }}/check.py"
    mode: "0644"
  register: monitor_bridge_check

# The ha_token / b2_probe_application_key file renders retired with the Phase F split
# (2026-08-14): the HA and B2 checks moved to the cluster twin, whose credentials mount
# from its env-secret. Clean up the previously rendered copies.
- name: Remove the retired credential files
  tags: [config]
  ansible.builtin.file:
    path: "/home/{{ sys_user }}/server/containers/{{ container_item.name }}/{{ item }}"
    state: absent
  loop:
    - ha_token
    - b2_probe_application_key

# Slice-7 Phase D KD2 (2026-08-10): the one push check superseding the ~27 per-container
# AutoKuma docker-type monitors. Lives here — not the uptime-kuma role, which retired to the
# cluster the same day — because this role is the host-side check owner.
- name: Deploy the docker-fleet heartbeat script
  tags: [cron]
  ansible.builtin.template:
    src: docker-fleet-health.sh.j2
    dest: /usr/local/bin/docker-fleet-health.sh
    owner: "{{ sys_user }}"
    group: "{{ sys_user }}"
    mode: "0755"
  become: true

- name: Schedule the docker-fleet heartbeat
  tags: [cron]
  # Every 5 min; the Kuma push monitor's interval is 600s so one missed run never pages —
  # two do, matching the crowdsec-home-allowlist cadence for cron-fed push monitors.
  ansible.builtin.cron:
    name: "Docker fleet health"
    minute: "*/5"
    job: "/usr/local/bin/docker-fleet-health.sh"
    user: "{{ sys_user }}"
  become: true

- name: Deploy Container
  tags: [deploy]
  ansible.builtin.include_role:
    name: common
    tasks_from: docker_deploy.yml
  vars:
    # check.py is bind-mounted (./check.py:/app/check.py); the loop reads it once at
    # startup, so only a recreate applies a code change. Without this, a check.py-only
    # edit (no compose change) leaves recreate: auto and the new logic silently never
    # deploys. See repo-root CLAUDE.md + common/CLAUDE.md.
    common_config_changed: "{{ monitor_bridge_check is changed }}"
