---
- name: Create required directories
  tags: [config]
  ansible.builtin.include_role:
    name: common
    tasks_from: setup_dirs.yml
  vars:
    common_dirs_to_create:
      - "{{ container_item.name }}/crowdsec-config"

- name: Create CrowdSec acquis.yaml from template
  tags: [config]
  ansible.builtin.template:
    src: crowdsec-acquis.yaml.j2
    dest: "/home/{{ sys_user }}/server/containers/traefik/crowdsec-config/acquis.yaml"
    mode: "0664"
  become: true
  register: traefik_cfg_acquis

- name: Deploy Container
  tags: [deploy]
  ansible.builtin.include_role:
    name: common
    tasks_from: docker_deploy.yml
  vars:
    common_config_changed: "{{ traefik_cfg_acquis is changed }}"

- name: Wait for CrowdSec to be healthy
  tags: [deploy]
  community.docker.docker_container_info:
    name: crowdsec
  register: traefik_crowdsec_health
  until: traefik_crowdsec_health.container.State.Health.Status == "healthy"
  retries: 10
  delay: 10

- name: Enable WAL mode in CrowdSec SQLite config
  tags: [deploy]
  ansible.builtin.lineinfile:
    path: "/home/{{ sys_user }}/server/containers/traefik/crowdsec-config/config.yaml"
    insertafter: '^\s*db_path:'
    line: '  use_wal: true'
    regexp: '^\s*use_wal:'
  become: true
  register: traefik_crowdsec_wal_config

- name: Restart CrowdSec to apply WAL config # noqa no-handler
  tags: [deploy]
  community.docker.docker_compose_v2:
    project_src: "/home/{{ sys_user }}/server/containers/traefik"
    services:
      - crowdsec
    state: restarted
  become: true
  when: traefik_crowdsec_wal_config.changed

- name: Wait for CrowdSec to be healthy after WAL config change # noqa no-handler
  tags: [deploy]
  community.docker.docker_container_info:
    name: crowdsec
  register: traefik_crowdsec_health_post_wal
  until: traefik_crowdsec_health_post_wal.container.State.Health.Status == "healthy"
  retries: 10
  delay: 10
  when: traefik_crowdsec_wal_config.changed

- name: Update CrowdSec hub
  tags: [deploy]
  community.docker.docker_container_exec:
    container: crowdsec
    command: cscli hub update
  changed_when: false

- name: Upgrade CrowdSec hub
  tags: [deploy]
  community.docker.docker_container_exec:
    container: crowdsec
    command: cscli hub upgrade
  changed_when: false

- name: Ensure CrowdSec dependency collections are installed
  # `cscli hub upgrade` refreshes installed items in place but NEVER installs a collection's
  # newly-declared transitive dependency, so linux sat "tainted by missing
  # crowdsecurity/whitelist-good-actors" indefinitely — silently dropping good-actor
  # false-positive suppression (2026-07-04 review M2). This is also in the crowdsec
  # COLLECTIONS env (installed at container init), but re-asserting it here heals a deploy
  # that doesn't recreate crowdsec and guards against a future hub bump silently regressing
  # it. Idempotent; no --force, so a locally-modified item is never clobbered. `install` on
  # an already-present item exits 0 ("nothing to install").
  tags: [deploy]
  community.docker.docker_container_exec:
    container: crowdsec
    command: cscli collections install crowdsecurity/whitelist-good-actors
  register: traefik_crowdsec_dep_collections
  changed_when: "'installed' in (traefik_crowdsec_dep_collections.stdout | lower)"
  failed_when: traefik_crowdsec_dep_collections.rc != 0

- name: Ensure Crowdsec hub update and upgrade job exists
  tags: [cron]
  ansible.builtin.cron:
    name: "Update Crowdsec Hub"
    minute: "15"
    hour: "7"
    job: "docker exec crowdsec cscli hub update && docker exec crowdsec cscli hub upgrade"
    user: root
    state: present
  become: true

# ── E7 retirement tombstones (2026-08-13) ──────────────────────────────────────────────────
# The Docker edge (traefik + Authelia) retired: the k8s edge serves everything and its
# Authelia owns auth.<domain> now. Everything below unwinds what the old edge left running on
# this host — its systemd units, crons, scripts, and monitor state dirs — so a host that has
# already deployed past E7 converges to the demoted-agent-only state above. Drop these
# tombstones once every host has deployed past E7 (mirrors the home-allowlist tombstone this
# block itself replaces, live since B2 and removed below).

- name: Stop and disable retired traefik-edge systemd units
  tags: [config]
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: false
    state: stopped
    daemon_reload: true
  become: true
  failed_when: false
  loop:
    - docker-user-rules.service
    - docker-user-seed.service
    - traefik-init.service

- name: Remove retired traefik-edge systemd unit files
  tags: [config]
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ item }}"
    state: absent
  become: true
  loop:
    - docker-user-rules.service
    - docker-user-seed.service
    - traefik-init.service

- name: Reload systemd after removing retired unit files
  tags: [config]
  ansible.builtin.systemd:
    daemon_reload: true
  become: true

- name: Retire the traefik-edge crons
  tags: [cron]
  ansible.builtin.cron:
    name: "{{ item.name }}"
    user: "{{ item.user }}"
    state: absent
  become: true
  loop:
    - { name: "Verify DOCKER-USER origin lock", user: root }
    - { name: "Check Cloudflare IP allowlist drift", user: "{{ sys_user }}" }
    - { name: "Verify CrowdSec AppSec WAF", user: root }

- name: Remove retired traefik-edge scripts
  tags: [config]
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  become: true
  loop:
    - /etc/docker-user-rules.sh
    - /usr/local/bin/docker-user-verify.sh
    - /usr/local/bin/cloudflare-ip-drift.sh
    - /usr/local/bin/appsec-verify.sh
    - /usr/local/lib/traefik-lib.sh

- name: Remove retired traefik-edge monitor state directories
  tags: [config]
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  become: true
  loop:
    - /var/lib/docker-user-rules
    - /var/lib/cloudflare-ip-drift
    - /var/lib/crowdsec-appsec

- name: Remove the retired Traefik logrotate config
  tags: [config]
  ansible.builtin.file:
    path: /etc/logrotate.d/traefik
    state: absent
  become: true
