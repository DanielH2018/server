---
# Deploy after the stack it feeds, so they're up first. Sequencing is computed by the
# toposort filter in deploy.yml from these names (which must match containers_list entries),
# not by Ansible meta dependencies.
#
# Since slice-7 D7 the collector forwards everything to the CLUSTER claude-otel collector
# (nothing local consumes it), so it has no local deps at all — it queues its export until
# the cluster answers.
role_deps: []
