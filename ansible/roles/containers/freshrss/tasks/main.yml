---
- name: Create required directories
  tags: [config]
  ansible.builtin.include_role:
    name: common
    tasks_from: setup_dirs.yml
  vars:
    common_dirs_to_create:
      - "{{ container_item.name }}/config"

- name: Copy feed-cache nginx config
  tags: [config]
  ansible.builtin.copy:
    src: nginx-feed-cache.conf
    dest: "/home/{{ sys_user }}/server/containers/{{ role_name }}/nginx-feed-cache.conf"
    mode: "0644"
  register: freshrss_cache_conf

- name: Deploy Container
  tags: [deploy]
  ansible.builtin.include_role:
    name: common
    tasks_from: docker_deploy.yml
  vars:
    # The nginx config is bind-mounted, so a change to it does not alter the compose hash.
    # Without this the feed-cache keeps serving the old config after a deploy.
    common_config_changed: "{{ freshrss_cache_conf is changed }}"
