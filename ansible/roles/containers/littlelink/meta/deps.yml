---
# `traefik` is not yet in daniel-cloud's containers_list — toposort silently ignores a
# dep that is absent from the host's list, so declaring it now is safe and becomes
# load-bearing the moment the node's edge role lands.
# Add `authelia` here only if decision 2 in the design settles on Authelia-on-node
# rather than Cloudflare Access.
role_deps:
  - traefik
