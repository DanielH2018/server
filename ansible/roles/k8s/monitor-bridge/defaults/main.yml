---
# check.py lives in this role's files/ and every check runs here.
monitor_bridge_k8s_image: python:3.14-alpine@sha256:f6a589d43c42b9e7f7dc67a12d37132491f362859a5d750607710cc56da3bc72

# The Python files that make up the running bridge. This is the SHIP LIST: a module missing
# here never reaches the ConfigMap, and the pod dies at import with ModuleNotFoundError the
# next time it rolls — while the test suite stays green, because pytest imports from files/
# on disk and never consults this list.
#
# Deliberately explicit rather than a `files/*.py` glob: files/ also holds the pytest suite
# and conftest.py, which must not reach the image.
# ENFORCED by ansible/tests/services/test_monitor_bridge_modules.py, which fails when a runtime module
# in files/ is absent here.
# Paths relative to files/. The ConfigMap key for each is the path with `/` replaced by
# `_` (a key cannot contain a slash), and the Deployment's `items:` mounts that key back at
# the path, so `checks/b2.py` ships as key `checks_b2.py` and lands at /app/checks/b2.py.
# Both derivations sit in tasks/main.yml and templates/deployment.yaml.j2; the copy loop
# below creates the subdirectories first.
monitor_bridge_modules:
  - cli.py
  - check.py
  - registry.py
  - gitops_markers.py
  - gitops_ledger.py
  - longhorn_robustness.py
  - gates.py
  - bridge/types.py
  - bridge/config.py
  - bridge/config_host.py
  - bridge/config_service.py
  - bridge/config_cluster.py
  - bridge/config_io.py
  - bridge/net.py
  - bridge/streaks.py
  - bridge/msgfmt.py
  - checks/logs.py
  - checks/storage.py
  - checks/b2.py
  - checks/r2.py
  - checks/host.py
  - checks/host_thermal.py
  - checks/host_edge.py
  - checks/cluster.py
  - checks/cluster_rollout.py
  - checks/cluster_zero.py
  - checks/cluster_etcd.py
  - checks/cluster_traefik.py
  - checks/service.py
  - checks/gitops.py
  - checks/notify.py
  - checks/cloudflare_ips.py
  - checks/healthchecks.py
  - checks/wan.py
  - bridge/common.py
  - bridge/parsing.py
  - verdicts/cluster.py
  - verdicts/host.py
  - verdicts/host_cgroups.py
  - verdicts/host_power.py
  - verdicts/host_smart.py
  - verdicts/service.py
  - verdicts/storage.py
  - verdicts/logs.py
  - verdicts/notify.py

# Every Kuma push monitor this bridge feeds, one row each (#3659). `registry.build_checks()` is
# still the authority on which checks exist and what each runs; this table is what the deploy
# needs to know about them, so a check's name is the one spelling both sides share:
#
# - `templates/env-secret.yaml.j2` renders one `KUMA_PUSH_<NAME>` per row, the env var
#   `bridge.types.push_env(name)` reads.
# - `token` names the SOPS secret holding the push token, `monitor_bridge_<name>_push_token` for
#   a new check. Ten rows predate that rule and keep their old name, because renaming a secret is
#   a rotation.
#
# DECIDED: `token` is spelled out on every row rather than derived from `name`.
# scripts/secrets_mgmt/consumers.py finds who to redeploy after a rotation by grepping each
# role's files for the secret's name, so a derived name would drop monitor-bridge from that
# census and leave the pod pushing a revoked token.
#
# Adding a check still takes these hand edits:
# - a `check_*` body;
# - its `Check` row in registry.py;
# - a row here;
# - the SOPS secret (`/add-secret`, then `secret_rotation.py sync`);
# - its tile in k8s/uptime-kuma/templates/static-monitors.yaml.j2 (#3781 would derive the tile);
# - for a gated check, its gate set in gates.py. For PROM_DEPENDENT that also means the
#   enumeration in this role's CLAUDE.md, which
#   tests/test_claude_md_prom_dependent_enumeration.py pins.
# This table cut only the env-secret entry and the KUMA_PUSH_* spelling (#3659).
# tests/test_push_check_table.py holds the table equal to the registry plus the four gates, and
# each row's token to a declared SOPS secret.
# ansible/tests/services/test_kuma_static_monitors.py joins each rendered token to a push tile.
monitor_bridge_push_checks:
  - {name: disk, token: monitor_bridge_disk_push_token}
  - {name: cert, token: monitor_bridge_cert_push_token}
  - {name: memory, token: monitor_bridge_mem_push_token}
  # Retargeted 2026-08-14 (Phase G): restarts, oom and cpu re-armed against the
  # kubernetes-cadvisor job on the tokens of their Docker-era monitors.
  - {name: restarts, token: monitor_bridge_restarts_push_token}
  - {name: oom, token: monitor_bridge_oom_push_token}
  - {name: cpu, token: monitor_bridge_cpu_push_token}
  - {name: targets, token: monitor_bridge_targets_push_token}
  - {name: traefik5xx, token: monitor_bridge_traefik_push_token}
  - {name: traefik_latency, token: monitor_bridge_traefik_latency_push_token}
  - {name: traefik_404, token: monitor_bridge_traefik_404_push_token}
  - {name: traefik_421, token: monitor_bridge_traefik_421_push_token}
  - {name: n8n, token: monitor_bridge_n8n_push_token}
  - {name: arr_queue, token: monitor_bridge_arr_queue_push_token}
  - {name: bazarr, token: monitor_bridge_bazarr_push_token}
  - {name: prowlarr_indexers, token: monitor_bridge_prowlarr_indexers_push_token}
  - {name: gitops_alive, token: monitor_bridge_gitops_alive_push_token}
  - {name: gitops_status, token: monitor_bridge_gitops_status_push_token}
  - {name: etcd_restore_drill, token: monitor_bridge_etcd_drill_push_token}
  - {name: etcd_db_size, token: monitor_bridge_etcd_db_size_push_token}
  - {name: scrutiny, token: monitor_bridge_scrutiny_push_token}
  - {name: host_temp, token: monitor_bridge_host_temp_push_token}
  - {name: ups, token: monitor_bridge_ups_push_token}
  - {name: pi_pressure, token: monitor_bridge_pi_push_token}
  - {name: ha_heartbeat, token: monitor_bridge_ha_push_token}
  - {name: speedtest, token: monitor_bridge_speedtest_push_token}
  - {name: loki_ingestion, token: monitor_bridge_loki_push_token}
  # The SOPS name predates the Alloy cutover; renaming a secret is a rotation, so it stays.
  - {name: shipper_dropped, token: monitor_bridge_promtail_dropped_push_token}
  - {name: swallowed_verdicts, token: monitor_bridge_swallowed_verdicts_push_token}
  - {name: kuma_notify_failures, token: monitor_bridge_kuma_notify_failures_push_token}
  - {name: discord, token: monitor_bridge_discord_push_token}
  - {name: r2_usage, token: monitor_bridge_r2_usage_push_token}
  - {name: cloudflare_ips_drift, token: monitor_bridge_cloudflare_drift_push_token}
  - {name: healthchecks_drift, token: monitor_bridge_healthchecks_drift_push_token}
  - {name: b2_storage, token: monitor_bridge_b2_storage_push_token}
  - {name: k8s_workloads, token: monitor_bridge_k8s_workloads_push_token}
  - {name: cluster_targets, token: monitor_bridge_cluster_targets_push_token}
  - {name: longhorn_volumes, token: monitor_bridge_longhorn_volumes_push_token}
  - {name: pvc_fullness, token: monitor_bridge_pvc_push_token}
  # Armed 2026-09-10 (#1627). Its tile in k8s/uptime-kuma reads the same variable unguarded, so
  # both halves fail loudly on a missing token instead of rendering away (#1632).
  - {name: snapshot_headroom, token: monitor_bridge_snapshot_headroom_push_token}
  - {name: kubelet_plugin_readonly, token: monitor_bridge_kubelet_readonly_push_token}
  # The four reachability gates, which check.run_once pushes through gates._gate.
  - {name: prometheus, token: monitor_bridge_prometheus_push_token}
  - {name: loki_reachable, token: monitor_bridge_loki_reachable_push_token}
  - {name: b2_reachable, token: monitor_bridge_b2_reachable_push_token}
  - {name: wan_reachable, token: monitor_bridge_wan_reachable_push_token}

# Auto-deploy stance — read by gitops_deploy (see the k8s auto-deploy coverage design).
# Observability: this IS the alert pipeline — every threshold check in the fleet pushes through
# it, so a broken deploy cannot page about being broken. ALSO renders no readinessProbe on its
# Deployment (probe-less), which compounds even if this were ever removed from the "observability"
# class: `rollout status` would return the moment the pod reports Running and prove nothing.
k8s_autodeploy: false  # noqa var-naming[no-role-prefix]
k8s_autodeploy_reason: "observability — this IS the alert pipeline; a broken deploy cannot page about being broken. ALSO no readinessProbe (probe-less) — two independent reasons"  # noqa var-naming[no-role-prefix]

# What the Healthchecks.io console must carry for each off-site dead-man check, which
# checks/healthchecks.py compares against `GET /api/v3/checks/` every day. A Simple
# check's `timeout` and every `grace` are seconds, as the API returns them; a Cron check carries
# its expression and timezone.
#
# A literal rather than a reference to the cron variables, because those live in the setup/k3s,
# k8s/pi-peer-backup and k8s/registry defaults, and role defaults do not cross the deploy play's
# include_role loop. ansible/tests/services/test_monitor_bridge_healthchecks_expected.py holds
# this list to those variables (through the deadman-cadences fragment's reader) and to the
# period-and-grace table in docs/healthchecks-io-deadman.md, so a cron or a grace cannot move
# in one place alone.
#
# pi-peer-backup alone runs in `tz`: it is a k8s CronJob with `timeZone: {{ tz }}`, and every
# other slug is a daniel-box host cron, which runs in UTC.
monitor_bridge_healthchecks_expected:
  - {slug: longhorn-backup-health, kind: simple, timeout: 600, grace: 1200}
  - {slug: daniel-box-disk-health, kind: simple, timeout: 600, grace: 1500}
  - {slug: uptime-kuma-alive, kind: simple, timeout: 600, grace: 1200}
  - {slug: manifest-prune-check, kind: cron, schedule: "15 5 * * *", tz: UTC, grace: 7200}
  - {slug: etcd-snapshot-offbox, kind: cron, schedule: "45 2 * * *", tz: UTC, grace: 3600}
  - {slug: pi-peer-backup, kind: cron, schedule: "0 23 * * *", tz: "{{ tz }}", grace: 7200}
  - {slug: registry-gc, kind: cron, schedule: "20 4 * * 0", tz: UTC, grace: 3600}
  # initial_setup's two pinging crons: the weekly reboot pings one slug per host, the Docker
  # prune one per has_docker host.
  - {slug: weekly-reboot-daniel-box, kind: cron, schedule: "30 7 * * 0", tz: UTC, grace: 3600}
  - {slug: weekly-reboot-daniel-server, kind: cron, schedule: "30 7 * * 0", tz: UTC, grace: 3600}
  - {slug: weekly-reboot-daniel-pi, kind: cron, schedule: "30 7 * * 0", tz: UTC, grace: 3600}
  - {slug: daniel-pi-docker-prune, kind: cron, schedule: "30 6 * * *", tz: UTC, grace: 3600}
