---
# THE monitor-bridge since the Docker uninstall (2026-08-14) — the Phase F twin that
# outlived its remnant. check.py lives in this role's files/ and every check runs here.
monitor_bridge_k8s_image: python:3.14-alpine@sha256:05b2b8b732ecd268fee8727a369f936f022d1321b59befd13c30ede22769dcdc

# The Python files that make up the running bridge. This is the SHIP LIST: a module missing
# here never reaches the ConfigMap, and the pod dies at import with ModuleNotFoundError the
# next time it rolls — while the test suite stays green, because pytest imports from files/
# on disk and never consults this list.
#
# Deliberately explicit rather than a `files/*.py` glob: files/ also holds the pytest suite
# and conftest.py, which must not reach the image.
# ENFORCED by ansible/tests/test_monitor_bridge_modules.py, which fails when a runtime module
# in files/ is absent here.
monitor_bridge_modules:
  - check.py
  - bridge_common.py
  - bridge_parsing.py
  - verdicts_cluster.py
  - verdicts_host.py
  - verdicts_service.py

# Auto-deploy stance — read by gitops_deploy (see the k8s auto-deploy coverage design).
# Observability: this IS the alert pipeline — every threshold check in the fleet pushes through
# it, so a broken deploy cannot page about being broken. ALSO renders no readinessProbe on its
# Deployment (probe-less), which compounds even if this were ever removed from the "observability"
# class: `rollout status` would return the moment the pod reports Running and prove nothing.
k8s_autodeploy: false  # noqa var-naming[no-role-prefix]
k8s_autodeploy_reason: "observability — this IS the alert pipeline; a broken deploy cannot page about being broken. ALSO no readinessProbe (probe-less) — two independent reasons"  # noqa var-naming[no-role-prefix]
