---
# monitor-bridge: THE bridge since the Docker uninstall (2026-08-14). Born at the
# Phase F drain as the cluster twin of the daniel-server sidecar; the remnant retired
# with Docker, check.py moved into this role's files/, and every check runs here (the
# gitops pair against daniel-box's own deployer via hostPath).

- name: Create the staging directory
  tags: [config]
  ansible.builtin.file:
    path: /etc/rancher/k3s/monitor-bridge
    state: directory
    mode: "0755"
    owner: root
    group: root
  become: true
  when: not k8s_dry_run | bool

# `ansible.builtin.copy` does not create a parent directory, and the modules are packages
# under files/ (`bridge/`, `checks/`, `verdicts/`), so the staging tree needs them first.
- name: Create the staging subdirectories
  tags: [config]
  ansible.builtin.file:
    path: "/etc/rancher/k3s/monitor-bridge/{{ item }}"
    state: directory
    mode: "0755"
    owner: root
    group: root
  become: true
  loop: "{{ monitor_bridge_modules | map('dirname') | reject('equalto', '') | unique | list }}"
  when: not k8s_dry_run | bool

- name: Stage the bridge modules on the node
  tags: [config]
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/roles/k8s/monitor-bridge/files/{{ item }}"
    dest: "/etc/rancher/k3s/monitor-bridge/{{ item }}"
    mode: "0644"
    owner: root
    group: root
  become: true
  loop: "{{ monitor_bridge_modules }}"
  register: monitor_bridge_script
  when: not k8s_dry_run | bool

# The pod-roll trigger must cover EVERY module, not just check.py. The ConfigMap updating is
# not enough on its own: a mounted ConfigMap change does not restart a Deployment, so without
# this the pod keeps running the code it started with until something else rolls it — and an
# edit confined to a split-out module would deploy, read green, and change nothing live.
# Sorted before hashing so the trigger is a function of the module SET, not the list order
# in defaults — a reorder there is not an edit worth a pod roll (#2157).
#
# Hashed off the SOURCE files, not off the `monitor_bridge_script` register, because the stage
# above is skipped on a dry run (#2614) and a skipped loop leaves `.results` undefined —
# `default([]) | join(',') | hash('sha1')` is the sha1 of the empty string, a real digest that
# silently moves the annotation rather than falling back to the macro's `unstaged`. `rstrip=False`
# is what makes these bytes the ones `copy` hashed, so the value is unchanged either way; the
# reasoning is in ansible/templates/checksum-annotation.yml.j2.
- name: Combine the staged module checksums into one pod-roll trigger
  tags: [config]
  ansible.builtin.set_fact:
    monitor_bridge_script_checksum: >-
      {%- set ns = namespace(hashes=[]) -%}
      {%- for module in monitor_bridge_modules -%}
      {%- set _ = ns.hashes.append(lookup('ansible.builtin.file',
          playbook_dir ~ '/roles/k8s/monitor-bridge/files/' ~ module, rstrip=False)
          | hash('sha1')) -%}
      {%- endfor -%}
      {{ ns.hashes | sort | join(',') | hash('sha1') }}

# check.py is Jinja-hostile (PromQL selectors carry {…} braces), so it becomes a
# ConfigMap via kubectl --from-file — the terraria-stats/claude-otel pattern.
#
# One --from-file per module rather than --from-file=<dir>: the staging directory also holds
# the rendered configmap.yaml below, and the directory form would fold that into the ConfigMap
# as a key of itself. The key is the module's path with `/` replaced by `_`, because a key
# cannot contain a slash; the Deployment's `items:` mounts it back at the path.
- name: Render the script ConfigMap manifest
  tags: [config]
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      k3s kubectl -n {{ k8s_namespace }} create configmap monitor-bridge-script
      {% for module in monitor_bridge_modules %}
      --from-file={{ module | replace('/', '_') }}=/etc/rancher/k3s/monitor-bridge/{{ module }}
      {% endfor %}
      --dry-run=client -o yaml > /etc/rancher/k3s/monitor-bridge/configmap.yaml
    executable: /bin/bash
  become: true
  changed_when: monitor_bridge_script is changed
  when: not k8s_dry_run | bool

# Server-side apply, because the client-side form stores the WHOLE object again in the
# `last-applied-configuration` annotation, and annotations are capped at 262144 bytes. Every
# module in `monitor_bridge_modules` goes into one ConfigMap and the total is already well past
# that (~322 KB across 24 modules on 2026-09-05, and the list only grows); JSON-escaped into
# that annotation it crossed the cap on 2026-09-01 and `kubectl apply` refused the ConfigMap
# ("metadata.annotations: Too long") while the pod kept running the previous code. Read the
# count off the ship list rather than trusting the figure here. Server-side apply writes no
# such annotation.
# `--force-conflicts` takes ownership of the data keys from the client-side field manager that
# applied them before the switch; without it the first server-side apply is rejected.
# Server-side apply prints the same line whether or not anything changed, so the changed
# signal is the staged files, the same register the render task uses.
# ENFORCED by ansible/tests/k8s/test_script_configmaps_apply_server_side.py.
- name: Apply the script ConfigMap
  tags: [deploy]
  ansible.builtin.command:
    cmd: >-
      k3s kubectl apply --server-side --force-conflicts
      -f /etc/rancher/k3s/monitor-bridge/configmap.yaml
  become: true
  # Skipped on a dry run or --check. k8s/manifests only dry-runs its own apply, so without this
  # guard a dry run would really write this ConfigMap (#2588).
  when: not k8s_no_mutate
  register: monitor_bridge_cm_apply
  changed_when: monitor_bridge_script is changed

- name: Deploy monitor-bridge to the cluster
  ansible.builtin.include_role:
    name: k8s/manifests
  vars:
    manifests_service: monitor-bridge
    manifests_rollout: monitor-bridge
    manifests_files:
      - deployment.yaml
    manifests_secret_files:
      - env-secret.yaml
      # Listed here so verify_secret_keys reconciles it too — and so the three keys removed
      # from env-secret.yaml are patched OUT of the live monitor-bridge-env Secret, which
      # `kubectl apply` would otherwise leave behind indefinitely.
      - credentials-secret.yaml
