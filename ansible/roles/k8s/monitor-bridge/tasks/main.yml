---
# monitor-bridge: every check runs here, the gitops pair against daniel-box's own deployer
# via hostPath. check.py lives in this role's files/.

# The script ConfigMaps are templates/script-configmap.yaml.j2, rendered with the rest of the
# manifests, so a module edit rolls the pod through the renderer's restart checksum.
#
# Flux applies this role through `promote` since #5594, so no Flux path runs this include; it
# stays for the handback. The unlabelled `monitor-bridge-script` ConfigMap the retired tasks
# applied was deleted by hand once (#5548).
- name: Deploy monitor-bridge to the cluster
  ansible.builtin.include_role:
    name: k8s/manifests
  vars:
    manifests_rollout: monitor-bridge
