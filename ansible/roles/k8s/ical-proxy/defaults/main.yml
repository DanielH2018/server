---
# Slice-7 Phase C (2026-08-10). Built in-cluster by this role via k8s/image-builder from the
# containers role's Dockerfile — roles/containers/ical-proxy stays as the build source and
# test home (the n8n/configarr split), only its inventory entry retired.
ical_proxy_k8s_image: "{{ k8s_registry_pull_host }}/ical-proxy:latest"

# Resource caps mirrored from the compose template (M1 values, k8s-native units).
ical_proxy_k8s_cpu_limit: 500m
ical_proxy_k8s_mem_limit: 128Mi
ical_proxy_k8s_cpu_request: 50m
ical_proxy_k8s_mem_request: 16Mi
