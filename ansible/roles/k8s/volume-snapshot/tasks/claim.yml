---
# One claim's worth of work: resolve its Longhorn volume, snapshot it, wait for the snapshot to
# be usable, then prune this service's older snapshots of that same volume.
#
# Included per claim from main.yml, which resolves the deploy tag once for all of them.

# `check_mode: false` for the same reason as the deploy tag in main.yml: a command task is
# skipped under --check, and a skipped read fails its consumer rather than itself. This one is
# also the only thing that proves the claim exists and is bound, which is worth having a dry run
# actually check.
- name: Resolve the Longhorn volume backing {{ volume_snapshot_claim }}
  tags: [deploy]
  # argv, not a folded `cmd:` string. `ansible.builtin.command` shlex-splits a `cmd`, so a
  # jsonpath is only safe there while it happens to contain no spaces — and a later edit that
  # adds a `{range ...}` turns the whole call into a silently wrong one. Slice 4 shipped exactly
  # that and made a branch dead code for a round. argv invokes no shell and has no quoting layer
  # to get wrong.
  ansible.builtin.command:
    argv:
      - k3s
      - kubectl
      - -n
      - "{{ k8s_namespace }}"
      - get
      - pvc
      - "{{ volume_snapshot_claim }}"
      - -o
      - 'jsonpath={.spec.volumeName}'
  become: true
  changed_when: false
  check_mode: false
  register: volume_snapshot_pvc

- name: Check the Longhorn volume binding for {{ volume_snapshot_claim }}
  tags: [deploy]
  # A `get` against a Pending PVC returns rc 0 and an empty `volumeName`, so nothing above
  # fails. Left unchecked, the Snapshot CR below would be created with `volume: ""` — which
  # Longhorn rejects, but several tasks later and with an error naming the CR rather than the
  # claim. Fail here, where the message can say which claim.
  ansible.builtin.assert:
    that:
      - volume_snapshot_pvc.stdout | default('') | trim | length > 0
    fail_msg: >-
      PVC {{ k8s_namespace }}/{{ volume_snapshot_claim }} has no spec.volumeName — it does not
      exist, or it is still Pending. {{ volume_snapshot_service }} cannot be given a recovery
      point, so the deploy is stopping before it changes anything.
    quiet: true

- name: Name the pre-deploy snapshot for {{ volume_snapshot_claim }}
  tags: [deploy]
  # The name is deterministic from service + deploy tag + claim + this run's token. 7b
  # reconstructs `autodeploy-<svc>-<sha8>-<claim>` without being told what the CR was called, and
  # that string survives verbatim as a PREFIX of the real name — never as the whole name, because
  # the run token below makes it non-unique by design.
  #
  # The claim suffix is a deliberate extension of the design's `autodeploy-<svc>-<sha8>`: a
  # service with two RWO claims (pihole has exactly that) would otherwise produce two Snapshot
  # CRs with one name, and the second `apply` would fight the first over `spec.volume` instead
  # of taking a second snapshot.
  #
  # The run-token suffix (main.yml, once per role run) exists so redeploying an older commit —
  # the manual rollback this slice exists to enable — never collides with that commit's earlier
  # deploy. Without it, `autodeploy-<svc>-<sha8>-<claim>` alone would already name a Snapshot CR
  # from that earlier deploy, markRemoved but not yet gone, and `apply` would report "unchanged"
  # or fail against the markRemoved CR instead of taking a fresh snapshot. The consequence: one
  # SHA can now own SEVERAL snapshots sharing the `autodeploy-<svc>-<sha8>-<claim>` prefix (a
  # dirty tree deployed twice from the same commit is the other way to get here). 7b's prefix
  # match is therefore not a unique lookup — it must pick the NEWEST of however many it finds.
  #
  # `volume_snapshot_prefix` deliberately omits the tag AND the token: it is what the prune below
  # selects on, and it must match this service's snapshots from EVERY deploy, not just this one.
  ansible.builtin.set_fact:
    volume_snapshot_volume: "{{ volume_snapshot_pvc.stdout | trim }}"
    volume_snapshot_prefix: "autodeploy-{{ volume_snapshot_service }}-"
    volume_snapshot_name: >-
      autodeploy-{{ volume_snapshot_service }}-{{ volume_snapshot_sha.stdout | trim }}-{{ volume_snapshot_claim }}-{{ volume_snapshot_run_token }}

# `apply`, not `create`: `create` would fail with AlreadyExists on the one case the run token
# doesn't rule out — two runs of this role landing in the same wall-clock second, so
# `now(utc=true, fmt='%Y%m%d%H%M%S')` gives them the identical name. Apply reports "unchanged"
# there and the earlier of the two snapshots stands as the recovery point for both. Every other
# run — a retry a moment later, a redeploy of an older commit, a dirty tree deployed twice — gets
# its own token and its own snapshot; CLAUDE.md's "the tag's determinism" section records what
# that means for 7b's prefix match.
- name: Take a pre-deploy Longhorn snapshot of {{ volume_snapshot_claim }}
  tags: [deploy]
  when: not (k8s_no_mutate | bool)
  ansible.builtin.command:
    argv:
      - k3s
      - kubectl
      - apply
      - -f
      - "-"
    stdin: |
      apiVersion: longhorn.io/v1beta2
      kind: Snapshot
      metadata:
        name: {{ volume_snapshot_name }}
        namespace: longhorn-system
      spec:
        volume: {{ volume_snapshot_volume }}
        createSnapshot: true
  become: true
  register: volume_snapshot_apply
  changed_when: "'created' in volume_snapshot_apply.stdout"

# Skipped rather than run under a no-mutation guard, for cronjob-gate's reason: the snapshot
# this waits on is created by the task above, which the same guard skips. Reading a PREVIOUS
# deploy's snapshot and calling it this run's recovery point would be a lie, and an unguarded
# poll would burn the whole timeout on every dry run and then fail.
#
# `readyToUse` and `markRemoved` are read together so the failure below can tell the two apart.
- name: Wait for the pre-deploy snapshot to become usable for {{ volume_snapshot_claim }}
  tags: [deploy]
  when: not (k8s_no_mutate | bool)
  ansible.builtin.command:
    argv:
      - k3s
      - kubectl
      - -n
      - longhorn-system
      - get
      - snapshots.longhorn.io
      - "{{ volume_snapshot_name }}"
      - -o
      - 'jsonpath={.status.readyToUse}{"|"}{.status.markRemoved}'
  become: true
  changed_when: false
  register: volume_snapshot_ready
  until: volume_snapshot_ready.stdout | default('') | split('|') | first == 'true'
  retries: "{{ (volume_snapshot_timeout | int / 5) | round | int }}"
  delay: 5
  # Suppressed so the tasks below can explain WHY, rather than Ansible aborting on the last
  # attempt's rc with nothing but "ran out of retries". It is not a silent swallow: one of the
  # next two tasks always resolves the same condition, either into a fail or a named skip.
  failed_when: false

# Only read when the wait above did not succeed — this is what turns "engine did not complete
# the snapshot" from a guess into a fact the decision below can act on.
#
# `check_mode: false` and `failed_when: false` for the same reason as every other read here: a
# skipped or errored read must not silently starve the decision task's condition, which is
# evaluated whether this task ran or not (`| default('')`) and needs the real answer when it did.
- name: Read the Longhorn volume state for {{ volume_snapshot_claim }}
  tags: [deploy]
  when:
    - not (k8s_no_mutate | bool)
    - volume_snapshot_ready.stdout | default('') | split('|') | first != 'true'
  ansible.builtin.command:
    argv:
      - k3s
      - kubectl
      - -n
      - longhorn-system
      - get
      - volumes.longhorn.io
      - "{{ volume_snapshot_volume }}"
      - -o
      - 'jsonpath={.status.state}'
  become: true
  changed_when: false
  check_mode: false
  failed_when: false
  register: volume_snapshot_volume_state

# Computed unconditionally (whenever mutation is allowed at all), not only when the wait
# failed, and always from THIS claim's own `volume_snapshot_ready` — never `default(false)`
# fallback to a stale value. `include_tasks: claim.yml` runs this file once per claim in one
# loop, and `set_fact` values are host facts that persist across loop iterations; if this task
# were skipped whenever the wait already succeeded, a later claim that also succeeds would
# inherit an EARLIER claim's `volume_snapshot_detached` verdict instead of getting its own. The
# leading `first == 'true'` clause below makes a stale `volume_snapshot_volume_state` from a
# previous claim harmless too: when this claim's own snapshot is ready, the expression is false
# on that clause alone regardless of what an earlier claim's volume-state read left behind.
- name: Decide whether this claim's unready snapshot is a detached-volume case for {{ volume_snapshot_claim }}
  tags: [deploy]
  when: not (k8s_no_mutate | bool)
  ansible.builtin.set_fact:
    volume_snapshot_detached: >-
      {{ (volume_snapshot_ready.stdout | default('') | split('|') | first) != 'true'
         and (volume_snapshot_ready.stdout | default('') | split('|') | last) != 'true'
         and (volume_snapshot_volume_state.stdout | default('') | trim) != 'attached' }}

# --------------------------------------------------- the maintenance-mode attach (slice 7b)
#
# 7a stopped here and warned: a detached volume has no running engine, so the snapshot above
# could not complete. 7b reuses k8s/longhorn-api and the maintenance-mode attach k8s/volume-revert
# proved (attach with disableFrontend, wait, act, detach) to attach the volume long enough to take
# the snapshot, then leaves it exactly as it found it.
#
# Every task below runs only for THIS claim's detached case, and every one carries BOTH guards:
# k8s_no_mutate (nothing here may run under --check/--dry-run) and volume_snapshot_detached
# (nothing here may run for a claim whose snapshot already succeeded above).
#
# ANY failure in this sequence — no longhorn-manager on this node, the attach never reaching
# `attached` with `disableFrontend: true`, the retaken snapshot never becoming usable — falls
# through to the warn-and-skip task below rather than failing the deploy: a detached volume is
# not itself an error (see the two legitimate cases in CLAUDE.md), and this attempt is
# best-effort on top of that ruling. `failed_when: false` on the API calls and waits, plus
# `longhorn_api_required: false` on the resolve below, are what make a failure inside this block
# non-fatal — NOT `ignore_errors` on the resolve's `include_role`. `ignore_errors` on a dynamic
# include only catches a failure of the include statement itself, never a fatal `fail()` raised
# by a task the include pulls in — documented Ansible behaviour, proven here by
# `test_longhorn_api_soft_mode_survives_no_manager` in test_longhorn_api.py, which runs the real
# (unmodified) k8s/longhorn-api role through a scratch play and shows `ignore_errors` alone does
# NOT stop the play from aborting. `longhorn_api_required: false` makes k8s/longhorn-api itself
# choose not to raise, which is the only thing that works. The "Fold" task at the end reads what
# happened and decides whether the claim is still the detached case.
- name: Resolve the node-local Longhorn API to attach {{ volume_snapshot_claim }}
  tags: [deploy]
  when:
    - not (k8s_no_mutate | bool)
    - volume_snapshot_detached | bool
  ansible.builtin.include_role:
    name: k8s/longhorn-api
    tasks_from: resolve.yml
  vars:
    longhorn_api_required: false

- name: Attach the volume in maintenance mode for {{ volume_snapshot_claim }}
  tags: [deploy]
  when:
    - not (k8s_no_mutate | bool)
    - volume_snapshot_detached | bool
    - longhorn_api_resolved | default(false) | bool
  # `disableFrontend: true` IS maintenance mode — the only attach a snapshot on a volume with
  # no other engine can use. No `attachmentID`: the detach below omits it too, and both then key
  # the ticket "" — see k8s/volume-revert's CLAUDE.md for the manager.Attach/Detach behaviour
  # this depends on.
  ansible.builtin.uri:
    url: "{{ longhorn_api }}/v1/volumes/{{ volume_snapshot_volume }}?action=attach"
    method: POST
    body_format: json
    body:
      hostId: "{{ longhorn_api_node }}"
      disableFrontend: true
    status_code: 200
    timeout: "{{ volume_snapshot_api_timeout }}"
  register: volume_snapshot_maint_attach
  failed_when: false

# Single condition, matching k8s/volume-revert's own attach wait: only `state == 'attached'`.
# Folding `disableFrontend` into the same `until` (7b's first cut) means a volume that reaches
# `attached` with the frontend still enabled burns the WHOLE timeout before giving up, since the
# compound condition never becomes true and `until` has no way to fail fast on the half that
# already settled. The separate assert below is what checks the frontend flag, immediately.
- name: Wait for the maintenance-mode attach for {{ volume_snapshot_claim }}
  tags: [deploy]
  when:
    - not (k8s_no_mutate | bool)
    - volume_snapshot_detached | bool
    - longhorn_api_resolved | default(false) | bool
    - (volume_snapshot_maint_attach.status | default(0) | int) == 200
  ansible.builtin.command:
    argv:
      - k3s
      - kubectl
      - -n
      - longhorn-system
      - get
      - volumes.longhorn.io
      - "{{ volume_snapshot_volume }}"
      - -o
      - 'jsonpath={.status.state}{"|"}{.spec.disableFrontend}'
  become: true
  changed_when: false
  register: volume_snapshot_maint_wait
  until: volume_snapshot_maint_wait.stdout | default('') | split('|') | first == 'attached'
  retries: "{{ (volume_snapshot_state_timeout | int / volume_snapshot_poll_interval | int) | round | int }}"
  delay: "{{ volume_snapshot_poll_interval }}"
  failed_when: false

# The frontend half of the wait above, split out so a volume that reached `attached` with the
# frontend still enabled fails immediately rather than after burning the whole timeout — see the
# comment on the wait task. `ignore_errors: true` on a plain leaf task like this one DOES
# suppress a failure and let the play continue (verified against a throwaway play 2026-08-21) —
# unlike `ignore_errors` on the dynamic `include_role` above, which does not. The two look
# similar and behave completely differently; that is the whole reason the include above no
# longer uses it.
- name: Assert the maintenance-mode attach really set disableFrontend for {{ volume_snapshot_claim }}
  tags: [deploy]
  when:
    - not (k8s_no_mutate | bool)
    - volume_snapshot_detached | bool
    - longhorn_api_resolved | default(false) | bool
    - (volume_snapshot_maint_attach.status | default(0) | int) == 200
  ansible.builtin.assert:
    that:
      - volume_snapshot_maint_wait.stdout | default('') | split('|') | last == 'true'
    fail_msg: >-
      Longhorn volume {{ volume_snapshot_volume }} came back as
      '{{ volume_snapshot_maint_wait.stdout | default('') }}' (state|disableFrontend) after the
      maintenance-mode attach, so its frontend is live — a snapshot taken now would be no more
      reliable than one taken on a normal attach, and this attempt counts as failed.
    quiet: true
  ignore_errors: true
  register: volume_snapshot_maint_frontend

# Computed unconditionally whenever this claim started detached — never a stale value from an
# earlier claim's attempt, the same invariant the original "Decide whether ... detached-volume
# case" task above documents. Read with `default({})`/`default(false)` throughout: any of the
# three inputs can be entirely unset if an earlier step in this sequence never ran (no manager
# on this node, the attach never returning 200), and that must read as failure rather than raise
# on the missing var.
- name: Decide whether the maintenance-mode attach succeeded for {{ volume_snapshot_claim }}
  tags: [deploy]
  when:
    - not (k8s_no_mutate | bool)
    - volume_snapshot_detached | bool
  ansible.builtin.set_fact:
    volume_snapshot_maintenance_attached: >-
      {{ ((volume_snapshot_maint_attach | default({})).status | default(0) | int) == 200
         and ((volume_snapshot_maint_wait | default({})).stdout | default('') | split('|') | first) == 'attached'
         and not ((volume_snapshot_maint_frontend | default({})).failed | default(true)) }}

# Same name, same CR as the first attempt above (`volume_snapshot_name`) — the prune's "found
# this run's own snapshot" assert and the wait below both key on it, and a different name would
# make the prune fail and strand this run's snapshot outside its own retention window.
- name: Retake the pre-deploy snapshot now the volume is attached for {{ volume_snapshot_claim }}
  tags: [deploy]
  when:
    - not (k8s_no_mutate | bool)
    - volume_snapshot_detached | bool
    - volume_snapshot_maintenance_attached | bool
  ansible.builtin.command:
    argv:
      - k3s
      - kubectl
      - apply
      - -f
      - "-"
    stdin: |
      apiVersion: longhorn.io/v1beta2
      kind: Snapshot
      metadata:
        name: {{ volume_snapshot_name }}
        namespace: longhorn-system
      spec:
        volume: {{ volume_snapshot_volume }}
        createSnapshot: true
  become: true
  register: volume_snapshot_apply
  changed_when: "'created' in volume_snapshot_apply.stdout or 'configured' in volume_snapshot_apply.stdout"

# Reuses `volume_snapshot_ready` — the same register the first attempt's wait used — so the
# existing "Fail on a snapshot that never became usable" task and the prune block below, both
# written before 7b, keep working unmodified against whichever attempt actually produced a
# result. `failed_when: false`: an engine that attached but still can't snapshot in time must
# fall through to the existing fail task below (which now fires, because the Fold task clears
# `volume_snapshot_detached` whenever the attach itself succeeded), not abort here with no
# detach performed.
- name: Wait for the retaken snapshot to become usable for {{ volume_snapshot_claim }}
  tags: [deploy]
  when:
    - not (k8s_no_mutate | bool)
    - volume_snapshot_detached | bool
    - volume_snapshot_maintenance_attached | bool
  ansible.builtin.command:
    argv:
      - k3s
      - kubectl
      - -n
      - longhorn-system
      - get
      - snapshots.longhorn.io
      - "{{ volume_snapshot_name }}"
      - -o
      - 'jsonpath={.status.readyToUse}{"|"}{.status.markRemoved}'
  become: true
  changed_when: false
  register: volume_snapshot_ready
  until: volume_snapshot_ready.stdout | default('') | split('|') | first == 'true'
  retries: "{{ (volume_snapshot_timeout | int / 5) | round | int }}"
  delay: 5
  failed_when: false

# Guarded on the attach outcome ALONE, never on whether the retaken snapshot became ready. A
# snapshot that stays stuck after a successful attach must not leave the volume attached in
# maintenance mode — a stale attachment ticket costs the NEXT deploy's own maintenance-mode
# attach (this one, or k8s/volume-revert's) a full 180s state wait before it fails, naming the
# wrong cause. Recorded in this slice's design notes, not in either role's own CLAUDE.md.
- name: Detach the volume after the maintenance-mode snapshot attempt for {{ volume_snapshot_claim }}
  tags: [deploy]
  when:
    - not (k8s_no_mutate | bool)
    - volume_snapshot_detached | bool
    - volume_snapshot_maintenance_attached | bool
  ansible.builtin.uri:
    url: "{{ longhorn_api }}/v1/volumes/{{ volume_snapshot_volume }}?action=detach"
    method: POST
    body_format: json
    body: {}
    status_code: 200
    timeout: "{{ volume_snapshot_api_timeout }}"

# The only proof that a 200 detach actually detached — never suppressed, matching
# k8s/volume-revert's own final wait.
- name: Wait for the detach after the maintenance-mode snapshot attempt for {{ volume_snapshot_claim }}
  tags: [deploy]
  when:
    - not (k8s_no_mutate | bool)
    - volume_snapshot_detached | bool
    - volume_snapshot_maintenance_attached | bool
  ansible.builtin.command:
    argv:
      - k3s
      - kubectl
      - -n
      - longhorn-system
      - get
      - volumes.longhorn.io
      - "{{ volume_snapshot_volume }}"
      - -o
      - 'jsonpath={.status.state}'
  become: true
  changed_when: false
  register: volume_snapshot_maint_detach_wait
  until: volume_snapshot_maint_detach_wait.stdout | default('') | trim == 'detached'
  retries: "{{ (volume_snapshot_state_timeout | int / volume_snapshot_poll_interval | int) | round | int }}"
  delay: "{{ volume_snapshot_poll_interval }}"

# The one place `volume_snapshot_detached` changes meaning: from here down it means "still
# unprotected", not "was plainly detached". A successful maintenance attach clears it — whether
# or not the retake above actually became ready — so the existing fail task below can catch a
# genuinely stuck engine post-attach, and the existing prune block can run once there is a real
# snapshot. `default(false)` fails closed: a claim that somehow reaches here with no recorded
# outcome stays counted as unprotected rather than silently clearing the flag it never earned.
- name: Fold the maintenance-mode attempt back into the detached-volume decision for {{ volume_snapshot_claim }}
  tags: [deploy]
  when:
    - not (k8s_no_mutate | bool)
    - volume_snapshot_detached | bool
  ansible.builtin.set_fact:
    volume_snapshot_detached: "{{ not (volume_snapshot_maintenance_attached | default(false) | bool) }}"

# Ruling from slice 7a task 2, narrowed by 7b: a detached volume no longer skips outright — the
# maintenance-mode attach above is tried first, and only when THAT fails does this fire. Two
# realistic ways the attach itself fails, and failing the deploy over either would block a
# legitimate action: no longhorn-manager pod on this node, or the attach/wait/retake sequence
# timing out. An operator's own workload scaled to zero, and a brand-new service's first deploy
# (k8s/seed-volume leaves the volume detached, no Deployment has ever attached it), both now GET
# a real snapshot through the attach above rather than reaching this warning — see CLAUDE.md.
#
# The gap this leaves is real and must stay visible rather than glossed: the apply below may
# set replicas back above zero, the pod starts, and it can migrate the on-disk format with no
# recovery point behind it. A silent skip would defeat the point of the slice, so this warns by
# name — service, claim, and the fact that the deploy proceeds unprotected — rather than only
# in a debug log nobody reads.
- name: Warn and skip the snapshot for a detached volume backing {{ volume_snapshot_claim }}
  tags: [deploy]
  when:
    - not (k8s_no_mutate | bool)
    - volume_snapshot_detached | bool
  ansible.builtin.debug:
    msg: >-
      WARNING: {{ volume_snapshot_service }}'s claim {{ volume_snapshot_claim }} (Longhorn
      volume {{ volume_snapshot_volume }}) is not attached
      (status.state='{{ volume_snapshot_volume_state.stdout | default('') | trim or 'unknown' }}'),
      and the maintenance-mode attach that would have let Longhorn snapshot it anyway also
      failed. Skipping the pre-deploy snapshot for this claim and continuing the deploy — THIS
      DEPLOY IS UNPROTECTED for {{ volume_snapshot_claim }}: if the apply scales
      {{ volume_snapshot_service }} back up and the new pod migrates its on-disk format, there is
      no recovery point to revert to. A first deploy and a deliberate scale-to-zero both take a
      real snapshot through the maintenance-mode attach now — reaching this warning means that
      attach itself failed (no longhorn-manager reachable on this node, or it never reached
      attached state in time); investigate before trusting a revert of
      {{ volume_snapshot_claim }}.

- name: Fail on a snapshot that never became usable for {{ volume_snapshot_claim }}
  tags: [deploy]
  when:
    - not (k8s_no_mutate | bool)
    - volume_snapshot_ready.stdout | default('') | split('|') | first != 'true'
    - not (volume_snapshot_detached | bool)
  ansible.builtin.fail:
    msg: >-
      The pre-deploy snapshot {{ volume_snapshot_name }} of Longhorn volume
      {{ volume_snapshot_volume }} did not report readyToUse within
      {{ volume_snapshot_timeout }}s (last read: '{{ volume_snapshot_ready.stdout | default('') }}',
      as readyToUse|markRemoved; volume state:
      '{{ volume_snapshot_volume_state.stdout | default('') | trim or 'unknown' }}').
      {{ 'It is markRemoved. Every run gets its own token in the name, so a same-second collision
      with an earlier run is one way to reach this — but an operator, the Longhorn UI, or a
      concurrent prune deleting this run''s own snapshot during the wait produces the identical
      state. Check who or what deleted {{ volume_snapshot_name }} before assuming a collision.
      Retrying a moment later gets a fresh token and a fresh name regardless of the cause.'
      if (volume_snapshot_ready.stdout | default('') | split('|') | last) == 'true'
      else 'The volume is attached and the engine did not complete the snapshot in time — this
      is not the detached-volume case (that one skips and warns instead of failing here), so it
      is a genuine stuck engine or an overloaded cluster. Retrying the deploy is reasonable;
      raising volume_snapshot_timeout is the fix if it keeps happening.' }}
      Stopping before the apply: {{ volume_snapshot_service }} would be deployed with no way
      back.

# ------------------------------------------------------------------------------------ pruning
#
# Guarded as a whole, not just at the delete. Under a no-mutation run the snapshot above was
# never taken, so a prune computed from the live list would be counting a retention window that
# does not include this run's snapshot — and would delete a real one during a dry run.
#
# Filtered by volume in the jsonpath rather than by name alone. Two services can share a name
# prefix (`valheim` and `valheim-stats`), and while they never share a volume, keying the
# retention window on the volume makes that impossible instead of merely unlikely.
#
# The volume filter is one comparison because kubectl's jsonpath has no `&&` — verified
# 2026-08-21, `unrecognized character in action: U+0026`. markRemoved and the name prefix are
# therefore filtered in Jinja below.
#
# Also skipped for a detached-volume claim: this claim's snapshot was never taken, so there is
# nothing of this run's to find in the listing, and the "found this run's snapshot" assert a
# few tasks down would fail for a claim that was deliberately, correctly skipped.
- name: List this service's live snapshots of {{ volume_snapshot_claim }}
  tags: [deploy]
  when:
    - not (k8s_no_mutate | bool)
    - not (volume_snapshot_detached | bool)
  ansible.builtin.command:
    argv:
      - k3s
      - kubectl
      - -n
      - longhorn-system
      - get
      - snapshots.longhorn.io
      - -o
      - 'jsonpath={range .items[?(@.spec.volume=="{{ volume_snapshot_volume }}")]}{.metadata.creationTimestamp}{"|"}{.status.markRemoved}{"|"}{.metadata.name}{"\n"}{end}'
  become: true
  changed_when: false
  register: volume_snapshot_existing

- name: Choose which older snapshots to prune for {{ volume_snapshot_claim }}
  tags: [deploy]
  when:
    - not (k8s_no_mutate | bool)
    - not (volume_snapshot_detached | bool)
  # markRemoved snapshots are dropped from the window rather than counted in it. A CR that
  # survives its own delete is normal here (see CLAUDE.md), and counting three of those as the
  # retained three would make the next pass delete live snapshots to make room.
  #
  # `ne 'true'` rather than `equalto 'false'`: a snapshot read moments after creation can have
  # `status.markRemoved` still unpopulated, rendering `<ts>||<name>` here. An `equalto 'false'`
  # filter drops that line — including THIS run's own snapshot — out of the listing entirely,
  # and the "found this run's snapshot" assert a few tasks down fails the deploy before the
  # apply over a field that just hasn't been written yet. Not-removed is the correct read of an
  # empty value; only an explicit `true` means removed.
  #
  # Sorted on the creationTimestamp field, newest first, so the slice below keeps the newest N
  # and hands back the rest. `volume_snapshot_retain` is clamped to a floor of 1: the newest
  # snapshot is never a candidate whatever the caller passes, because 7b reverts to it and a
  # retention pass that races a rollback destroys the recovery point it exists to protect.
  ansible.builtin.set_fact:
    volume_snapshot_live: >-
      {{ volume_snapshot_existing.stdout_lines | default([])
         | map('split', '|')
         | rejectattr('1', 'equalto', 'true')
         | selectattr('2', 'match', volume_snapshot_prefix)
         | sort(attribute='0', reverse=true)
         | map(attribute='2') | list }}
    volume_snapshot_keep: "{{ [volume_snapshot_retain | int, 1] | max }}"

- name: Check that the snapshot listing found this run's snapshot for {{ volume_snapshot_claim }}
  tags: [deploy]
  when:
    - not (k8s_no_mutate | bool)
    - not (volume_snapshot_detached | bool)
  # The listing above is the input to a DELETE, so a listing that silently returns nothing —
  # a jsonpath the shlex split tore in half, a field Longhorn renamed — must fail rather than
  # read as "nothing to prune". The snapshot taken a few tasks up is a known member of the set,
  # so its absence proves the read is broken and not that the volume is empty.
  ansible.builtin.assert:
    that:
      - volume_snapshot_name in volume_snapshot_live
    fail_msg: >-
      The snapshot listing for volume {{ volume_snapshot_volume }} does not contain
      {{ volume_snapshot_name }}, which this play just created and waited for. The listing is
      broken, so the prune below would be deleting from a set it cannot see. Read
      {{ volume_snapshot_live | length }} live snapshot(s) with prefix
      '{{ volume_snapshot_prefix }}'.
    quiet: true

# `--wait=false` is not optional. A Snapshot CR carries a `longhorn.io` finalizer: the delete
# sets `markRemoved: true` and waits for the volume to coalesce the data, and a default
# `kubectl delete` blocks on that — measured hanging a drill for twelve minutes on 2026-08-21.
#
# So the CR persisting after a successful delete is the expected outcome, not a failure. A
# snapshot whose only child is `volume-head` cannot be folded away while the volume is attached
# at all; it clears at the next detach. Nothing here treats "the CR is gone" as success.
#
# `--ignore-not-found` because a concurrent prune (a second deploy of the same service, the
# orphan reaper) may have removed it already, and re-reporting that as a deploy failure would
# be noise.
- name: Prune snapshots beyond the retention window for {{ volume_snapshot_claim }}
  tags: [deploy]
  when:
    - not (k8s_no_mutate | bool)
    - not (volume_snapshot_detached | bool)
  ansible.builtin.command:
    argv:
      - k3s
      - kubectl
      - -n
      - longhorn-system
      - delete
      - snapshots.longhorn.io
      - "{{ item }}"
      - --wait=false
      - --ignore-not-found
  become: true
  # Defensive `default()` on both sides of the slice, for a detached-volume claim where
  # `volume_snapshot_live`/`volume_snapshot_keep` are never set (the "Choose which older
  # snapshots" task above shares this task's `volume_snapshot_detached` guard, so it is skipped
  # too). Verified 2026-08-21: when a task's `when:` does not reference `item` and evaluates
  # false, Ansible skips it without templating `loop:` at all, so this is not observed to be
  # reachable today — but relying on that rather than stating it costs nothing here, and it is
  # exactly the "registered var from a skipped task" trap this repo has hit before. `default([])`
  # on an empty list slices to `[]` at any start index, which is why `default(1)` on the keep
  # side is only for symmetry, not because a bad value would otherwise matter.
  loop: "{{ (volume_snapshot_live | default([]))[(volume_snapshot_keep | default(1) | int) :] }}"
  changed_when: true
