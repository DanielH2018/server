---
# How many autodeploy- snapshots to keep per volume. Three, not one: slice 7b reverts to the
# most recent, and keeping a spare means a rollback is still possible if the newest snapshot is
# the one that is corrupt or still coalescing.
#
# Clamped to a floor of 2 where it is used (claim.yml), not 1: a rollback run takes its OWN
# snapshot and prunes BEFORE k8s/volume-revert reads the chain, so at prune time the chain holds
# that new snapshot AND the earlier pre-deploy one the revert is about to need. A floor of 1
# would keep only the newest and delete the very recovery point the revert step right after it
# depends on — see this role's CLAUDE.md ("The revert needs two, not one"). A caller passing `0`
# or `1` still keeps both.
volume_snapshot_retain: 3

# Seconds to wait for a snapshot to report `readyToUse`. A Longhorn snapshot is a marker in the
# volume's chain rather than a data copy, so a healthy one settles in seconds — this is a
# ceiling for a wedged engine, not an expected wait, and a larger number costs nothing on a
# good deploy.
#
# The wait is deliberately NOT best-effort: a snapshot that never becomes ready fails the
# deploy, because it is the recovery point the deploy is about to need — with one exception.
# A detached volume (an operator's own workload scaled to zero) cannot be snapshotted at all,
# and that case skips with a loud warning instead of failing. See claim.yml and this role's
# CLAUDE.md ("A detached volume cannot be snapshotted at all, and that is not fatal").
volume_snapshot_timeout: 120

# The maintenance-mode attach 7b uses to snapshot a detached volume — proven unreachable by the
# task-6 drill (volume-claim attaches first, and Longhorn snapshots a detached volume anyway; see
# "The maintenance-mode attach is not reachable through a deploy" in this role's CLAUDE.md), so
# unlike k8s/volume-revert's matching pair this isn't under the same budget pressure to tighten.
# Left at the pre-drill values rather than following volume_revert_state_timeout/api_timeout
# down to 90/30 (task 6b) — same drill, same Longhorn operation, but this path runs on the
# FORWARD deploy for all 13 opted-in services, not inside the rollback's own timeout.
volume_snapshot_state_timeout: 180
volume_snapshot_poll_interval: 2
volume_snapshot_api_timeout: 60

# Auto-deploy stance — read by gitops_deploy (see the k8s auto-deploy coverage design).
# This role deploys no workload of its own: it is a pre-apply step other roles include, it
# renders no manifest for `rollout status` to gate, and it pins no `_image:` var for Renovate
# to bump. Declared rather than added to the filter plugin's SHARED_ROLES, because it carries a
# defaults/main.yml — the same choice cronjob-gate and image-builder make for the same reason.
k8s_autodeploy: false  # noqa var-naming[no-role-prefix]
k8s_autodeploy_reason: "deploys no workload of its own — a pre-apply snapshot step other roles include; it renders no manifest and pins no image for Renovate to bump"  # noqa var-naming[no-role-prefix]
