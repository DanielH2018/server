---
# Digest-pinned 2026-08-06, once the Docker twin was retired and this became the only copy.
# `:latest` was inherited from the Docker role rather than chosen, and a k8s rollout re-pulls
# on every pod recreate, so an upstream push silently changed what ran. The digest is the one
# taken from the running pod at cutover.
#
# The tag is KEPT (repo:latest@sha256) so Renovate's docker manager still tracks it and opens
# digest-bump PRs — a bare repo@sha256 would freeze it with zero update signal, which is worse
# than the floating tag it replaces. That tracking is what the k8s-defaults custom manager in
# renovate.json provides; before it existed no image in any k8s role was watched at all.
littlelink_k8s_image: ghcr.io/techno-tim/littlelink-server:latest@sha256:e84ea9d93b60362cf9e292dba43adb604e375d9206d5fcf1de6bb766a20aabd1

# Auto-deploy stance — read by gitops_deploy (see the k8s auto-deploy coverage design).
# Stateless RollingUpdate Deployment, no PVC, readinessProbe, digest-pinned image.
k8s_autodeploy: true  # noqa var-naming[no-role-prefix]
k8s_autodeploy_reason: "stateless RollingUpdate Deployment, no PVC, readinessProbe, digest-pinned image"  # noqa var-naming[no-role-prefix]

# Mirrors resources('0.50', '128M', '0.05', '16M') in the compose template.
littlelink_k8s_cpu_limit: "500m"
littlelink_k8s_mem_limit: 128Mi
littlelink_k8s_cpu_request: "50m"
littlelink_k8s_mem_request: 16Mi
