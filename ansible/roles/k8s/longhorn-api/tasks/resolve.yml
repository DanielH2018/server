---
# The Longhorn HTTP API is reachable from a node's host netns ONLY via that node's own
# longhorn-manager pod. The longhorn-manager NetworkPolicy's `from:` is entirely podSelectors,
# so host-originated traffic matches no rule and the cross-node pod refuses the connection.
# The `longhorn-backend` ClusterIP has one endpoint per node, which makes it a coin flip:
# 2 of 8 measured GETs succeeded. `ansible/seed_volume_backup.yml:14-17` records
# the same finding from the other direction and chose CRs instead.
#
# `-o json` and the `ready_manager_ip` filter, not a jsonpath of `.status.podIP`: the jsonpath
# returned every pod on the node, ready or not, so a revert could aim at a manager that was
# still starting. The filter (`ansible/filter_plugins/longhorn_manager.py`) is the one rule the
# trim cron and the snapshot reaper use too: Running, and every container ready (#3736). During a
# Longhorn upgrade the manager restarts, and this read then finds no ready pod. volume-revert
# resolves once, before it touches any claim, so the revert fails there with nothing moved,
# rather than partway through at an API call to a manager that is not serving.
#
# `check_mode: false` because this is a read whose value the two tasks below depend on. A
# command task is SKIPPED under --check by default, and a skipped read does not fail — it fails
# a downstream consumer with an undefined attribute instead (see `volume-snapshot`'s "Resolve
# the deploy tag" task for the same reasoning). The command is a plain read, so running it for real under `--check` is
# harmless — this makes the role safe for any future caller rather than resting on every caller
# remembering to gate its own include.
- name: Resolve this node's own longhorn-manager pod IP
  tags: [deploy]
  ansible.builtin.command:
    argv:
      - k3s
      - kubectl
      - -n
      - longhorn-system
      - get
      - pod
      - -l
      - app=longhorn-manager
      - --field-selector
      - spec.nodeName={{ ansible_hostname }}
      - -o
      - json
  become: true
  changed_when: false
  check_mode: false
  register: longhorn_api_pod

- name: Pick this node's ready longhorn-manager pod
  tags: [deploy]
  ansible.builtin.set_fact:
    longhorn_api_ip: "{{ (longhorn_api_pod.stdout | from_json)['items'] | ready_manager_ip(ansible_hostname) }}"

# A missing ready manager is always fatal: the one caller, k8s/volume-revert, has no fallback
# for a rollback with no API. #2740 retired the only caller that had one, and soft mode with it.
#
# `ignore_errors: true` on the `include_role` that pulls this file in does NOT make this
# non-fatal: it suppresses a failure of the include STATEMENT, not a `fail()` raised by a task
# the include pulls in. A future caller with a fallback needs a flag read here, in this role.
- name: Fail when this node runs no ready longhorn-manager
  tags: [deploy]
  ansible.builtin.fail:
    msg: >-
      No ready longhorn-manager pod on {{ ansible_hostname }}, so the Longhorn API is unreachable
      from here. The ClusterIP is not a fallback — it load-balances to the cross-node manager, which
      the NetworkPolicy refuses for host-originated traffic.
  when: longhorn_api_ip | length == 0

- name: Record the API base
  tags: [deploy]
  ansible.builtin.set_fact:
    longhorn_api: "http://{{ longhorn_api_ip }}:9500"
    longhorn_api_node: "{{ ansible_hostname }}"
