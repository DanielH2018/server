---
- name: Deploy cloudflare-ddns to the cluster
  ansible.builtin.include_role:
    name: k8s/manifests
  vars:
    manifests_service: cloudflare-ddns
    manifests_files:
      - deployment-proxied.yaml
      - deployment-direct.yaml
    manifests_secret_files:
      - secret.yaml
    # This role ships two Deployments and neither is named after the service, so the shared
    # wait cannot find one. Skipped here and both waited on explicitly below.
    manifests_rollout: ""
    # Both Deployments read their Kuma push token from the Secret through env, and env is
    # resolved once at pod start — so a rotated token reaches the Secret and the running pods
    # keep pushing the old one until something restarts them. `manifests_rollout: ""` above
    # opts out of the shared WAIT, and the shared rollout-RESTART is gated on that same
    # variable being non-empty, so emptying it silently took the restart with it. Naming both
    # Deployments here restores the restart: the extra-rollouts task carries no such gate.
    # Found on 2026-08-30, when rotating the two ddns push tokens left both pods 7d14h old
    # and both monitors DOWN behind a green deploy.
    manifests_extra_rollouts:
      - name: cloudflare-ddns-direct
      - name: cloudflare-ddns-proxied

- name: Wait for the cloudflare-ddns rollouts
  tags: [deploy]
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n {{ k8s_namespace }} rollout status
      deploy/cloudflare-ddns-{{ item }} --timeout=300s
  loop:
    - proxied
    - direct
  become: true
  changed_when: false
