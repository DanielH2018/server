---
- name: Deploy cloudflare-ddns to the cluster
  ansible.builtin.include_role:
    name: k8s/manifests
  vars:
    # This role ships two Deployments and neither is named after the service, so the shared
    # wait cannot find one.
    manifests_rollout: ""
    # Both Deployments read their Kuma push token from the Secret through env, and env is
    # resolved once at pod start — so a rotated token reaches the Secret and the running pods
    # keep pushing the old one until something restarts them. `manifests_rollout: ""` above
    # opts out of the shared WAIT, and the shared rollout-RESTART is gated on that same
    # variable being non-empty, so emptying it silently drops the restart with it. Naming both
    # Deployments here restores the restart: the extra-rollouts task carries no such gate.
    # Without it, rotating the two ddns push tokens leaves both pods on the old token and both
    # monitors DOWN behind a green deploy.
    manifests_extra_rollouts:
      - name: cloudflare-ddns-direct
      - name: cloudflare-ddns-proxied
