---
# Same image the Docker role runs — both copies stay on the same tag through coexistence so
# a difference in behaviour between them is never the image. Tag KEPT alongside the digest
# (repo:latest@sha256) so Renovate's k8s-defaults manager still tracks it for digest-bump PRs —
# a bare repo@sha256 would freeze it with zero update signal (2026-08-13 pin).
cloudflare_ddns_k8s_image: favonia/cloudflare-ddns:latest@sha256:61013368c8f95981c0bb8bf56d962078d8b4e95724a554fa2dabb20d6e478097

# Auto-deploy stance — read by gitops_deploy (see the k8s auto-deploy coverage design).
k8s_autodeploy: false  # noqa var-naming[no-role-prefix]
k8s_autodeploy_reason: "unprobeable, not merely probe-less — favonia/cloudflare-ddns is a scratch image running an outbound update loop with no HTTP server, no listener and no shell, so no httpGet, tcpSocket or exec readinessProbe can exist. Both rendered Deployments are therefore ungated: the role sets manifests_rollout: '', which skips the shared rollout wait AND the stability soak, and nothing replaces them."  # noqa var-naming[no-role-prefix]
# Mirrors resources('0.25', '64M', '0.05', '16M') in the compose template, per container.
cloudflare_ddns_k8s_cpu_limit: "250m"
cloudflare_ddns_k8s_mem_limit: 64Mi
cloudflare_ddns_k8s_cpu_request: "50m"
cloudflare_ddns_k8s_mem_request: 16Mi

# (The Kuma heartbeat needs no vars anymore: Kuma runs in this namespace, so the
# deployments push to the Service URL `http://uptime-kuma:3001` directly. The old
# hostAliases pin to daniel-server's edge was removed at the slice-7 bridge teardown,
# which deleted the forward-bridge router that path depended on.)
