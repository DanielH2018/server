---
# Builds n8n's two images into the cluster registry. Separate from a k8s/n8n role because n8n
# itself has not migrated: this is the half that had to come first, since nothing could have
# migrated n8n without an image to run.
#
# Both builds live in ONE role, and are ordered rather than parallel, because n8n and its task
# runners are version-coupled the way karakeep and Meilisearch are. Both Dockerfiles FROM a
# `:latest` upstream tag — the repo's documented rolling tier for built images (see
# test_every_dockerfile_is_renovate_visible) — so building them back to back is what keeps a
# release boundary from landing between the two. `docker compose build` had that property for
# free by building both in one invocation; here it has to be stated.

- name: Build the n8n image
  ansible.builtin.include_role:
    name: k8s/image-builder
  vars:
    image_builder_name: n8n
    image_builder_dockerfile: "{{ playbook_dir }}/roles/k8s/n8n-images/templates/Dockerfile.j2"

- name: Build the n8n task-runners image
  ansible.builtin.include_role:
    name: k8s/image-builder
  vars:
    image_builder_name: n8n-runners
    image_builder_dockerfile: "{{ playbook_dir }}/roles/k8s/n8n-images/templates/Dockerfile-runners.j2"
    # The one file either Dockerfile COPYs. The key must be the exact path the COPY names,
    # since the ConfigMap mount puts each key at the context root under that name.
    image_builder_context:
      "{{ playbook_dir }}/roles/k8s/n8n-images/templates/config/n8n-task-runners.json.j2": n8n-task-runners.json
