# Auto-deploy stance — read by gitops_deploy (see the k8s auto-deploy coverage design).
k8s_autodeploy: true  # noqa var-naming[no-role-prefix]
k8s_autodeploy_reason: "builds two images via k8s/image-builder, which waits on each build for complete-or-failed and then asserts the new tag exists in the registry — a stronger gate than rollout status; note it renders no manifest of its own, so the shape guards pass over empty lists and the gate is image-builder's, asserted separately by test_gating_shared_roles_actually_wait. NOTHING CAN TRIGGER THIS PROMOTION: the role declares no *_image: var at all — its pins are the FROM lines in templates/Dockerfile.j2 and Dockerfile-runners.j2 — while split_k8s_auto_deploy promotes only a push whose sole changed path under the role is defaults/main.yml AND whose diff there is image-only, so no diff can satisfy both; renovate.json's n8n group says the same, that a bump is realised only by an operator-driven rebuild (deploy.sh --tags n8n-images,n8n). The promotion is correct and harmless, not active. It also does not address the standing risk the earlier reason recorded: n8n, a separate role, can pick up a bad image on its own next deploy with nothing here catching it first."  # noqa var-naming[no-role-prefix]
