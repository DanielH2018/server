---
# The tag stays alongside the digest (repo:latest@sha256) so Renovate's k8s-defaults manager
# tracks it for digest-bump PRs — a bare repo@sha256 would freeze it with zero update signal.
speedtest_k8s_image: lscr.io/linuxserver/speedtest-tracker:latest@sha256:3f8a2d06703bde3a6d04dcc8178fcd6251b601ce3b8b52958779d5335b5719d1

# Auto-deploy stance — read by gitops_deploy (see the k8s auto-deploy coverage design).
# Auto-deploy is on although strategy is Recreate and speedtest_k8s_claim below is seeded
# from k8s_claims below, which hardcodes ReadWriteOnce — the migrating-state shape
# (Recreate + RWO PVC) that keeps sonarr/radarr/prowlarr off the list. k8s/manifests takes a
# pre-apply Longhorn snapshot of that claim and reverts it if the deploy fails. The data at
# risk is regenerable speed-test history (see the storage-class comment below).
k8s_autodeploy: true  # noqa var-naming[no-role-prefix]
k8s_autodeploy_reason: "migrating state — Recreate + an RWO PVC, now protected by the pre-apply Longhorn snapshot and revert added in slice 7b. Same shape as sonarr/prowlarr; the data at risk was already regenerable speed-test history"  # noqa var-naming[no-role-prefix]
# The pre-apply Longhorn snapshot k8s/manifests takes via k8s/volume-snapshot.
# Declared regardless of k8s_autodeploy — protects a manual deploy too, and the revert it
# enables is what this role's auto-deploy depends on.
k8s_autodeploy_snapshot_pvcs: [speedtest-config]  # noqa var-naming[no-role-prefix]

speedtest_k8s_cpu_limit: "1"
speedtest_k8s_mem_limit: 512Mi
speedtest_k8s_cpu_request: "100m"
speedtest_k8s_mem_request: 64Mi

# Volume. `longhorn-nobackup` on purpose: /config holds a real database.sqlite (23M), but it is observational speed-test history and the Laravel APP_KEY that
# decrypts it lives in SOPS, so a rebuilt instance works. Backing it up would spend B2
# Class C transactions — already near two thirds of the daily cap — on regenerable data.
# Losing it loses history, not function. Change the class here if that trade stops holding.
speedtest_k8s_claim: speedtest-config
speedtest_k8s_storage_class: longhorn-nobackup
speedtest_k8s_size: 1Gi

# The claim k8s/manifests renders and applies for this role, ahead of the pre-apply snapshot.
k8s_claims:  # noqa var-naming[no-role-prefix]
  - name: "{{ speedtest_k8s_claim }}"
    storage_class: "{{ speedtest_k8s_storage_class }}"
    size: "{{ speedtest_k8s_size }}"
