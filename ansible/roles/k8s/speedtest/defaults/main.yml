---
# Same image the Docker role runs — both copies stay on the same tag through coexistence so
# a difference in behaviour between them is never the image. Tag KEPT alongside the digest
# (repo:latest@sha256) so Renovate's k8s-defaults manager still tracks it for digest-bump PRs —
# a bare repo@sha256 would freeze it with zero update signal (2026-08-13 pin).
speedtest_k8s_image: lscr.io/linuxserver/speedtest-tracker:latest@sha256:e095f60b019819ea5a265e220bfb16d4e620c767f25005a065d73cab7c187c49

# Auto-deploy stance — read by gitops_deploy (see the k8s auto-deploy coverage design).
# Eligible today only by absence from gitops_deploy_k8s_autodeploy_denylist, not because the
# shape is safe: strategy is Recreate and speedtest_k8s_claim below is seeded through
# k8s/seed-volume, which hardcodes ReadWriteOnce — the same migrating-state shape (Recreate +
# RWO PVC) that keeps sonarr/radarr/prowlarr off the list. Data lost this way is regenerable
# history (see the storage-class comment below), which is why speedtest was the original
# slice-1 pilot — but the shape itself is not different from the denylisted roles.
k8s_autodeploy: true  # noqa var-naming[no-role-prefix]
k8s_autodeploy_reason: "NOT independently safe — eligible only by denylist absence; Recreate + RWO seed-volume PVC is the migrating-state shape, same class as sonarr/prowlarr (data lost is regenerable history, which is why this was the original pilot)"  # noqa var-naming[no-role-prefix]

# Mirrors resources('1.0', '512M', '0.10', '64M') in the compose template.
speedtest_k8s_cpu_limit: "1"
speedtest_k8s_mem_limit: 512Mi
speedtest_k8s_cpu_request: "100m"
speedtest_k8s_mem_request: 64Mi

# Volume. `longhorn-nobackup` on purpose: /config holds a real database.sqlite (23M at
# migration time), but it is observational speed-test history and the Laravel APP_KEY that
# decrypts it lives in SOPS, so a rebuilt instance works. Backing it up would spend B2
# Class C transactions — already near two thirds of the daily cap — on regenerable data.
# Losing it loses history, not function. Change the class here if that trade stops holding.
speedtest_k8s_claim: speedtest-config
speedtest_k8s_storage_class: longhorn-nobackup
speedtest_k8s_size: 1Gi
speedtest_k8s_source_path: /home/ubuntu/server/containers/speedtest/config
