---
# Seed BEFORE the workload starts. The Deployment mounts the same claim, so creating the PVC
# here and letting seed-volume populate it first means the pod never sees an empty /config and
# never runs Laravel's first-boot migrations against a volume that is about to be overwritten.
- name: Seed the speedtest config volume
  tags: [deploy]
  ansible.builtin.include_role:
    name: k8s/seed-volume
  vars:
    seed_volume_service: speedtest
    seed_volume_claim: "{{ speedtest_k8s_claim }}"
    seed_volume_source_path: "{{ speedtest_k8s_source_path }}"
    seed_volume_storage_class: "{{ speedtest_k8s_storage_class }}"
    seed_volume_size: "{{ speedtest_k8s_size }}"

- name: Deploy speedtest to the cluster
  ansible.builtin.include_role:
    name: k8s/manifests
  vars:
    manifests_service: speedtest
    manifests_files:
      - deployment.yaml
      - service.yaml
      - ingressroute.yaml
    manifests_secret_files:
      - secret.yaml
