---
# No Flux path runs this file: the tag is flux-owned from its first commit. It stays so the role
# has the shape every k8s role has, and the renderer reads the include's vars. The one object is
# the stamp ConfigMap in `homelab`, which `ansible/deploy.yml` creates. There is no workload to
# roll.
- name: Deploy the Longhorn restore-drill stamps to the cluster
  ansible.builtin.include_role:
    name: k8s/manifests
  vars:
    manifests_prune_namespace: "{{ longhorn_drill_namespace }}"
    manifests_rollout: ''
