---
# Same image the Docker role runs — both copies stay on the same tag through coexistence so
# a difference in behaviour between them is never the image. Tag KEPT alongside the digest
# (repo:latest@sha256) so Renovate's k8s-defaults manager still tracks it for digest-bump PRs —
# a bare repo@sha256 would freeze it with zero update signal (2026-08-13 pin).
healthchecks_k8s_image: lscr.io/linuxserver/healthchecks:latest@sha256:f8a148973d8b90587549674db70836f154eda474c0b87382b86064f2442c2f43

# Auto-deploy stance — read by gitops_deploy (see the k8s auto-deploy coverage design).
# Observability: the dead-man's-switch check-in monitor crons ping — a broken deploy stops
# noticing a cron that stopped, with no other check watching for that. It ALSO independently
# matches the migrating-state shape: Recreate + a real PVC seeded through k8s/seed-volume
# (hardcoded ReadWriteOnce) holding the check definitions and ping history — a bad image swap
# can migrate that volume before the gate observes a fault, same class as sonarr/prowlarr.
# Either reason alone would justify the denylist entry.
k8s_autodeploy: false  # noqa var-naming[no-role-prefix]
k8s_autodeploy_reason: "observability — cron dead-man's-switch monitor. ALSO Recreate + RWO seed-volume PVC (migrating-state shape) — two independent reasons. COUPLING NOTE for a future promotion: check UUIDs here are baked into ping URLs in unrelated crons fleet-wide; a revert past a check's creation leaves those crons pinging a dead UUID, silently dropped"  # noqa var-naming[no-role-prefix]

# Mirrors resources('0.50', '512M', '0.05', '64M') in the compose template.
healthchecks_k8s_cpu_limit: "500m"
healthchecks_k8s_mem_limit: 512Mi
healthchecks_k8s_cpu_request: "50m"
healthchecks_k8s_mem_request: 64Mi

# 532K and 2 files at migration time — the check definitions and ping history.
healthchecks_k8s_claim: healthchecks-config
healthchecks_k8s_storage_class: longhorn
healthchecks_k8s_size: 1Gi
healthchecks_k8s_source_path: /home/ubuntu/server/containers/healthchecks/config
