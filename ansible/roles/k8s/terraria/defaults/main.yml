---
# Built in-cluster rather than pulled, since 2026-08-31. The upstream image cannot run as a
# non-root uid — its entrypoint hardcodes /root, which is 0700 — so a one-layer image that chowns
# HOME is what lets this workload drop root and its DAC_OVERRIDE. templates/Dockerfile.j2 carries
# the evidence and the CrashLoopBackOff it came from.
#
# The upstream DIGEST PIN did not go away, it moved into that Dockerfile's FROM line, which is
# where Renovate's built-in dockerfile manager reads it. What changes is how a bump is realised:
# built images carry automerge: false, so a digest PR is applied by an operator rebuild
# (`./scripts/deploy.sh --tags terraria`) rather than by the deployer applying a pin. That is a
# small delta here precisely because k8s_autodeploy is already false below — nothing was applying
# this pin automatically anyway.
terraria_k8s_image: "{{ k8s_registry_pull_host }}/terraria:latest"

# Auto-deploy stance — read by gitops_deploy (see the k8s auto-deploy coverage design).
# Two independent reasons: (1) probe-less — the Deployment renders no readinessProbe, so
# `rollout status` would return the moment the pod reports Running; (2) migrating state —
# strategy is Recreate and the worlds/config PVC is seeded through k8s/volume-claim (hardcoded
# ReadWriteOnce), holding the one irreplaceable dataset the backup consolidation exists to
# protect. Either alone would justify the denylist entry.
k8s_autodeploy: false  # noqa var-naming[no-role-prefix]
k8s_autodeploy_reason: "two reasons: (1) probe-less — no readinessProbe; (2) migrating state — Recreate + RWO volume-claim PVC holding irreplaceable worlds"  # noqa var-naming[no-role-prefix]

# 36 M of worlds + config at the port — `longhorn`, BACKED UP: this is the one
# irreplaceable dataset the backup consolidation (backup-consolidation-longhorn.md, BL1)
# moved the whole service for.
terraria_k8s_claim: terraria-config
terraria_k8s_size: 1Gi
terraria_k8s_storage_class: longhorn
# Migration history (until 2026-08-14). The SOURCE on the pre-migration Docker host had world
# files root-owned 600; the unprivileged copy required a sudo staging step. The live volume,
# migrated via this role until 2026-09-01, holds uid-1000 and measured 1000:1000 drwxr-xr-x on
# 2026-08-31. The epoch is spelled out because reading the old source state as live state is
# what kept a DAC_OVERRIDE grant looking necessary for three weeks after it had stopped being so.

# Mirrors resources('2.0', '2048M', '0.25', '512M').
terraria_k8s_cpu_limit: "2"
terraria_k8s_mem_limit: 2048Mi
terraria_k8s_cpu_request: "250m"
terraria_k8s_mem_request: 512Mi

# Scaled to zero on 2026-09-02, on operator request — the server is not wanted up right now, and
# on 1.4.5.7 it cannot stay up while anything opens a TCP connection to it (issue #822).
#
# Declarative rather than a live `kubectl scale`, for two reasons. The next
# `./scripts/deploy.sh --tags terraria` re-applies this Deployment and would reset a live scale
# back to 1; and the read-only ServiceAccount cannot scale anything anyway, so Ansible is the
# only write path. `session-health.py`'s `_is_scaled_to_zero` already reads a deliberate
# `spec.replicas: 0` as intentional rather than as an outage, so the SessionStart banner stays
# quiet without a suppression list.
#
# This is NOT covered by test_every_snapshot_role_restores_its_own_replicas, which requires
# `replicas >= 1`: that guard reads roles declaring `k8s_autodeploy_snapshot_pvcs`, and terraria
# declares none. If terraria ever opts into pre-deploy snapshots, this zero and that guard
# collide, and the guard is the one that is right.
#
# To bring it back, see the restore checklist on issue #822. Setting this to 1 is the first of
# two steps and the port monitor is deliberately NOT the second — do not restore the Kuma tile
# until the image is past 1.4.5.7.
terraria_k8s_replicas: 0
