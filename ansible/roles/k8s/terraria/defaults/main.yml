---
# Built in-cluster rather than pulled, since 2026-08-31. The upstream image cannot run as a
# non-root uid — its entrypoint hardcodes /root, which is 0700 — so a one-layer image that chowns
# HOME is what lets this workload drop root and its DAC_OVERRIDE. templates/Dockerfile.j2 carries
# the evidence and the CrashLoopBackOff it came from.
#
# The upstream DIGEST PIN did not go away, it moved into that Dockerfile's FROM line, which is
# where Renovate's built-in dockerfile manager reads it. What changes is how a bump is realised:
# built images carry automerge: false, so a digest PR is applied by an operator rebuild
# (`./scripts/deploy.sh --tags terraria`) rather than by the deployer applying a pin. That is a
# small delta here precisely because k8s_autodeploy is already false below — nothing was applying
# this pin automatically anyway.
terraria_k8s_image: "{{ k8s_registry_pull_host }}/terraria:latest"

# Auto-deploy stance — read by gitops_deploy (see the k8s auto-deploy coverage design).
# Two independent reasons: (1) probe-less — the Deployment renders no readinessProbe, so
# `rollout status` would return the moment the pod reports Running; (2) migrating state —
# strategy is Recreate and the worlds/config PVC is seeded through k8s/seed-volume (hardcoded
# ReadWriteOnce), holding the one irreplaceable dataset the backup consolidation exists to
# protect. Either alone would justify the denylist entry.
k8s_autodeploy: false  # noqa var-naming[no-role-prefix]
k8s_autodeploy_reason: "two reasons: (1) probe-less — no readinessProbe; (2) migrating state — Recreate + RWO seed-volume PVC holding irreplaceable worlds"  # noqa var-naming[no-role-prefix]

# 36 M of worlds + config at the port — `longhorn`, BACKED UP: this is the one
# irreplaceable dataset the backup consolidation (backup-consolidation-longhorn.md, BL1)
# moved the whole service for.
terraria_k8s_claim: terraria-config
terraria_k8s_size: 1Gi
terraria_k8s_storage_class: longhorn
# Overridden at the cutover seed. Describes the SOURCE on the pre-migration Docker host, where
# the world files were root-owned 600 and the unprivileged ssh|tar pipeline could not read them in
# place — a one-shot play staged a sudo copy first (the wg-easy pattern). It is NOT a description
# of the live volume, which the seed landed uid-1000 and which measured 1000:1000 drwxr-xr-x on
# 2026-08-31. The epoch is spelled out because reading this as live state is what kept a
# DAC_OVERRIDE grant looking necessary for three weeks after it had stopped being so.
terraria_k8s_source_path: /home/ubuntu/server/containers/terraria/config

# Mirrors resources('2.0', '2048M', '0.25', '512M').
terraria_k8s_cpu_limit: "2"
terraria_k8s_mem_limit: 2048Mi
terraria_k8s_cpu_request: "250m"
terraria_k8s_mem_request: 512Mi
