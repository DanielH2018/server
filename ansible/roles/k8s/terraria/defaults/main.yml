---
# Built in-cluster rather than pulled. The upstream image cannot run as a
# non-root uid — its entrypoint hardcodes /root, which is 0700 — so a one-layer image that chowns
# HOME is what lets this workload drop root and its DAC_OVERRIDE. templates/Dockerfile.j2 carries
# the evidence.
#
# The upstream DIGEST PIN lives in that Dockerfile's FROM line, which is where Renovate's
# built-in dockerfile manager reads it. Built images carry automerge: false, so a digest PR is
# applied by an operator rebuild (`./scripts/deploy.sh --tags terraria`) rather than by the
# deployer applying a pin. That is a small difference here because k8s_autodeploy is false
# below.
terraria_k8s_image: "{{ k8s_registry_pull_host }}/terraria:{{ k8s_built_image_tags.get('terraria', 'latest') }}"

# Auto-deploy stance — read by gitops_deploy (see the k8s auto-deploy coverage design).
# Two independent reasons: (1) probe-less — the Deployment renders no readinessProbe, so
# `rollout status` would return the moment the pod reports Running; (2) migrating state —
# strategy is Recreate and the worlds/config PVC comes from k8s_claims below (hardcoded
# ReadWriteOnce), holding the one irreplaceable dataset the backup consolidation exists to
# protect. Either alone would justify the denylist entry.
k8s_autodeploy: false  # noqa var-naming[no-role-prefix]
k8s_autodeploy_reason: "two reasons: (1) probe-less — no readinessProbe; (2) migrating state — Recreate + RWO volume-claim PVC holding irreplaceable worlds"  # noqa var-naming[no-role-prefix]

# 36 M of worlds + config — `longhorn`, BACKED UP: this is the one irreplaceable dataset in
# the service.
terraria_k8s_claim: terraria-config
terraria_k8s_size: 1Gi
terraria_k8s_storage_class: longhorn
# The live volume's files are owned 1000:1000 (drwxr-xr-x), so the server needs no
# DAC_OVERRIDE grant.

terraria_k8s_cpu_limit: "2"
terraria_k8s_mem_limit: 2048Mi
terraria_k8s_cpu_request: "250m"
terraria_k8s_mem_request: 512Mi

# terraria_k8s_replicas is NOT here: it lives in inventory (group_vars/all.yml), because
# k8s/game-stats renders the terraria-stats exporter at the same count and role defaults do
# not cross a role boundary.

# The claim k8s/manifests renders and applies for this role, ahead of the pre-apply snapshot.
k8s_claims:  # noqa var-naming[no-role-prefix]
  - name: "{{ terraria_k8s_claim }}"
    storage_class: "{{ terraria_k8s_storage_class }}"
    size: "{{ terraria_k8s_size }}"
