---
- name: Build the terraria image
  ansible.builtin.include_role:
    name: k8s/image-builder
  vars:
    image_builder_name: terraria
    image_builder_dockerfile: "{{ playbook_dir }}/roles/k8s/terraria/templates/Dockerfile.j2"

- name: Create the terraria config volume claim
  tags: [deploy]
  ansible.builtin.include_role:
    name: k8s/volume-claim
  vars:
    volume_claim_service: terraria
    volume_claim_name: "{{ terraria_k8s_claim }}"
    volume_claim_storage_class: "{{ terraria_k8s_storage_class }}"
    volume_claim_size: "{{ terraria_k8s_size }}"

- name: Deploy terraria to the cluster
  ansible.builtin.include_role:
    name: k8s/manifests
  vars:
    manifests_service: terraria
    manifests_rollout: terraria
    manifests_files:
      - deployment.yaml
      - service.yaml
