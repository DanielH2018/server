---
# No Flux path runs this file: the tag is flux-owned from its first commit. It stays so the role
# has the shape every k8s role has, and the renderer reads the include's vars. The objects are the
# CronJob, its ConfigMap (the script and the desired tiers) and its RBAC. There is no workload to
# roll, and the objects live in `longhorn-system`, which the `longhorn` tag creates.
- name: Deploy the Longhorn reconcile job to the cluster
  ansible.builtin.include_role:
    name: k8s/manifests
  vars:
    manifests_prune_namespace: "{{ k8s_longhorn_namespace }}"
    manifests_rollout: ''
