---
# Built in-cluster (k8s/image-builder): alpine + rsync/openssh/curl around the pull
# script. Pullable on either node.
pi_peer_backup_k8s_image: "{{ k8s_registry_pull_host }}/pi-peer-backup:{{ k8s_built_image_tags.get('pi-peer-backup', 'latest') }}"

# Auto-deploy stance — read by gitops_deploy (see the k8s auto-deploy coverage design).
k8s_autodeploy: true  # noqa var-naming[no-role-prefix]
k8s_autodeploy_reason: "CronJob gated at deploy time by k8s/cronjob-gate, which proves the new image RUNS but deliberately does not enforce a successful run; concurrencyPolicy Forbid and a retention-free rsync mirror, so the gate's one-off run is idempotent and a briefly unreachable Pi is reported rather than fatal. NOTHING CAN TRIGGER THIS PROMOTION: the only pin, pi_peer_backup_k8s_image, is a registry-built image listed in REGISTRY_BUILT_IMAGES (scripts/tests/test_renovate_managers.py) — no upstream ref for Renovate to compare against and no version for it to offer — so what moves is the FROM in templates/Dockerfile.j2, which is not the defaults/main.yml path split_k8s_auto_deploy promotes. The promotion is correct and harmless, not active."  # noqa var-naming[no-role-prefix]

pi_peer_backup_k8s_claim: pi-peer-backup-data
# 23:00 local. The Longhorn jobs that touch this PVC fire in UTC — the 03:30 daily tick, the
# 04:10 restore drill and the 04:30 weekly shard (weekly-backup-d6, Saturday) — and this
# CronJob follows `tz`, so the UTC slot it lands on moves with DST: 04:00 under CDT, 05:00
# under CST. Both are clear of all three. A slot at 04:30 UTC collides with weekly-backup-d6:
# the pod's CSI attach lands just before the recurring job looks at the volume, the job
# refuses it ("invalid state for recurring job: attaching") and the shard finishes green with
# the volume skipped. test_pi_peer_backup_schedule_clears_the_longhorn_slots.py holds the slot
# clear under both offsets.
pi_peer_backup_k8s_schedule: "0 23 * * *"

# The one directory the pull key may read. Named once because two places must agree on it:
# the CronJob's PI_SRC and the forced command sshd pins the key to (files/pi-peer-backup-shell.sh
# refuses any other path).
pi_peer_backup_src_dir: "/home/{{ sys_user }}/server/containers/wg-easy/config/"
