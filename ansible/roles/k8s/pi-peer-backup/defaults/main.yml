---
# Built in-cluster (k8s/image-builder): alpine + rsync/openssh/curl around the pull
# script. Pullable on either node since the 2026-08-14 registry re-plumb.
pi_peer_backup_k8s_image: "{{ k8s_registry_pull_host }}/pi-peer-backup:latest"

# Auto-deploy stance — read by gitops_deploy (see the k8s auto-deploy coverage design).
k8s_autodeploy: true  # noqa var-naming[no-role-prefix]
k8s_autodeploy_reason: "CronJob gated at deploy time by k8s/cronjob-gate, which proves the new image RUNS but deliberately does not enforce a successful run; concurrencyPolicy Forbid and a retention-free rsync mirror, so the gate's one-off run is idempotent and a briefly unreachable Pi is reported rather than fatal. NOTHING CAN TRIGGER THIS PROMOTION: the only pin, pi_peer_backup_k8s_image, is a registry-built image listed in REGISTRY_BUILT_IMAGES (scripts/test_renovate_managers.py) — no upstream ref for Renovate to compare against and no version for it to offer — so what moves is the FROM in templates/Dockerfile.j2, which is not the defaults/main.yml path split_k8s_auto_deploy promotes. The promotion is correct and harmless, not active."  # noqa var-naming[no-role-prefix]

pi_peer_backup_k8s_claim: pi-peer-backup-data
# 23:30 local, same slot the daniel-server host cron held (clear of the 03:30 Longhorn
# nightly, which snapshots the PVC this fills).
pi_peer_backup_k8s_schedule: "30 23 * * *"
