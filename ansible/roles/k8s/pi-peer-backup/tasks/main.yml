---
# A nightly CronJob rsyncs daniel-pi's wg-easy peer configs into a Longhorn PVC (the
# 03:30 daily-backup group carries it to B2) and reports its verdict to Prometheus through a
# ConfigMap.
#
# Flux owns this role, so no Flux path runs either include below; they stay until R4 deletes them.
# promote's `images` job builds the image, and the renderer's
# gate Job in `pi-peer-backup-verify` replaced the k8s/cronjob-gate include this file held.
# The two daniel-pi writes moved to roles/setup/k8s_host_files/tasks/pi-peer-backup.yml.

- name: Build the pi-peer-backup image
  ansible.builtin.include_role:
    name: k8s/image-builder

# The claim is `k8s_claims` in defaults/main.yml; k8s/manifests renders and applies it.
- name: Deploy pi-peer-backup to the cluster
  ansible.builtin.include_role:
    name: k8s/manifests
    # The prune k8s/manifests arms by default (its manifests_prune DECIDED comment). The
    # render stamps homelab/role on the CronJob, both Secrets and the k8s_claims claim; the fixed
    # allowlist names neither Secret nor PersistentVolumeClaim, so those two are applied but
    # never pruned. k8s/image-builder stages its build Job and ConfigMap under
    # `build-pi-peer-backup/`, outside this directory.
