---
# The GATE, not the exit criterion. These prove the render node is reachable and that VAAPI
# encode works from inside the running Jellyfin pod. They do NOT prove Jellyfin's own transcode path works: that needs a real
# playback with a bitrate that forces a transcode, and it is checked by hand. Keep the two
# claims apart; a green run here is a starting line.

# WITHOUT THIS, EVERY PROOF BELOW RUNS AGAINST THE OUTGOING POD. k8s/manifests does not wait
# for a rollout — it QUEUES it for k8s/manifests/tasks/drain.yml, which drains the whole batch at the end.
# So a role's own verify tasks run before its rollout completes, and the pod lookup returns the
# pod that is being replaced, so a proof that genuinely differs between old and new pod can
# fail a deploy that had in fact succeeded.
#
# `rollout status` and NOT a readiness wait. Three primitives look like gates and are all
# satisfied by the OLD pod: `wait --for=condition=Available deploy/x` (Available is true of the
# old ReplicaSet), `wait --for=condition=ready pod -l app=x` (the old pod is Ready until it
# stops), and `--field-selector status.phase=Running` (phase stays Running while Terminating —
# that word is kubectl rendering deletionTimestamp, not a phase). Only `rollout status` gates on
# the new ReplicaSet. See ansible/tests/deploy/test_inline_rollout_gates.py.
- name: Wait for the jellyfin rollout to finish before verifying it
  tags: [deploy]
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n {{ k8s_namespace }} rollout status deployment/jellyfin --timeout=300s
  become: true
  changed_when: false
  when: not ansible_check_mode

- name: Find the running jellyfin pod
  tags: [deploy]
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n {{ k8s_namespace }} get pod -l app=jellyfin
      --field-selector status.phase=Running -o jsonpath={.items[0].metadata.name}
  become: true
  changed_when: false
  register: jellyfin_k8s_pod

# ── the media mount depth ───────────────────────────────────────────────────────────────────
# The GPU probes cannot see a mount one level too shallow: the pod is Ready, the UI lists the
# full library from its own tables, and every play dies with an IO error on /data/tv/....
# This check asks whether the media is where Jellyfin's database says it is.
#
# Asserting BOTH directions is what makes this precise rather than decorative: the library roots
# must be present, AND `torrents` must be absent from /data. Presence of the latter is the exact
# signature of mounting the volume root instead of its `media` subdirectory, and it is the thing
# that is easy to get wrong here because the *arrs legitimately DO mount the root.
- name: Prove the library is where Jellyfin's database expects it
  tags: [deploy]
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n {{ k8s_namespace }} exec {{ jellyfin_k8s_pod.stdout }} -c jellyfin --
      sh -c "test -d /data/tv && test -d /data/movies && test -d /data/media/tv
      && ! test -e /data/torrents && echo LIBRARY_PATHS_OK;
      f=$(find /data/tv -type f -name '*.mkv' | head -1);
      echo probing ${f:-NONE};
      head -c 1024 \"$f\" > /dev/null && echo LIBRARY_READ_OK; ls /data"
  become: true
  changed_when: false
  register: jellyfin_k8s_library
  # Both, because they are different claims. The paths existing says the mount is at the right
  # depth; reading a byte out of a real library file is what the failing playback was actually
  # doing when it raised its IO error.
  failed_when: >-
    'LIBRARY_PATHS_OK' not in jellyfin_k8s_library.stdout or
    'LIBRARY_READ_OK' not in jellyfin_k8s_library.stdout

- name: Show the library check
  tags: [deploy]
  ansible.builtin.debug:
    msg: "{{ jellyfin_k8s_library.stdout_lines }}"

# The failure this catches: the device NODE is visible via the plugin, but an open() returns
# EPERM ("Operation not permitted") when the cgroup v2 device filter has not admitted it. A
# permission problem would say "Permission denied" instead.
#
# `: < dev` OPENS AND CLOSES WITHOUT READING, and that distinction is the whole task.
# `head -c 1` would block forever once the device plugin makes open() succeed: a DRM render
# node has no bytes to hand a sequential read, so the read never returns and the deploy hangs
# with no output.
- name: Prove the render node can actually be opened
  tags: [deploy]
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n {{ k8s_namespace }} exec {{ jellyfin_k8s_pod.stdout }} --
      sh -c "id; ls -l /dev/dri/renderD128; : < /dev/dri/renderD128 && echo OPEN_OK"
  become: true
  changed_when: false
  register: jellyfin_k8s_device
  failed_when: "'OPEN_OK' not in jellyfin_k8s_device.stdout"

- name: Show the device check
  tags: [deploy]
  ansible.builtin.debug:
    msg: "{{ jellyfin_k8s_device.stdout_lines }}"

# Jellyfin's OWN bundled ffmpeg, not the system one — that is the binary a transcode actually
# runs, and it carries its own driver directory (/usr/lib/jellyfin-ffmpeg/lib/dri).
- name: Encode through VAAPI with Jellyfin's own ffmpeg
  tags: [deploy]
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n {{ k8s_namespace }} exec {{ jellyfin_k8s_pod.stdout }} --
      /usr/lib/jellyfin-ffmpeg/ffmpeg -v error
      -init_hw_device vaapi=va:/dev/dri/renderD128 -filter_hw_device va
      -f lavfi -i testsrc=size=1280x720:rate=30:duration=3
      -vf format=nv12,hwupload -c:v h264_vaapi -f null -
  become: true
  changed_when: false
  register: jellyfin_k8s_vaapi
  failed_when: jellyfin_k8s_vaapi.rc != 0

- name: Report the VAAPI encode
  tags: [deploy]
  ansible.builtin.debug:
    msg: >-
      VAAPI h264 encode succeeded inside the jellyfin pod
      ({{ 'no stderr' if not jellyfin_k8s_vaapi.stderr else jellyfin_k8s_vaapi.stderr }})

# HDR tone-mapping, tested against the backend Jellyfin ACTUALLY uses on this hardware.
#
# Do not test OpenCL here: it is the wrong dependency and gives a false alarm. On AMD VAAPI, Jellyfin tone-maps with
# **libplacebo over Vulkan** — its own logs say `VAAPI device ... supports Vulkan DRM interop`
# and every transcode it launches carries `-init_hw_device vulkan=vk@dr -filter_hw_device vk`.
# OpenCL is the Intel/NVIDIA path and its absence here costs nothing.
#
# The device setup below is copied from a real Jellyfin command line rather than invented, so
# this exercises the same graph a genuine HDR playback would build.
#
# The one thing that genuinely does NOT work on this GPU is `tonemap_vaapi` (Jellyfin's "VPP
# tone mapping"), which fails with `VAAPI driver doesn't support HDR` — Mesa's radeonsi exposes
# VAEntrypointVideoProc but no HDR processing. That is why EnableVppTonemapping is switched off
# by the conversion in the Deployment, and it should stay off.
#
# Reported rather than enforced: the library is all bt709, so a regression here costs nothing
# and failing an unrelated deploy over it would be disproportionate.
- name: Test the HDR tone-mapping path (libplacebo over Vulkan)
  tags: [deploy]
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n {{ k8s_namespace }} exec {{ jellyfin_k8s_pod.stdout }} -c jellyfin --
      sh -c "/usr/lib/jellyfin-ffmpeg/ffmpeg -v error
      -init_hw_device drm=dr:/dev/dri/renderD128 -init_hw_device vaapi=va@dr
      -init_hw_device vulkan=vk@dr -filter_hw_device vk
      -f lavfi -i testsrc=size=1280x720:rate=30:duration=2
      -vf 'format=p010,setparams=color_primaries=bt2020:color_trc=smpte2084:colorspace=bt2020nc,hwupload=derive_device=vulkan,libplacebo=format=nv12:tonemapping=bt.2390:colorspace=bt709:color_primaries=bt709:color_trc=bt709:range=tv,hwupload=derive_device=vaapi'
      -c:v h264_vaapi -f null - && echo TONEMAP_OK"
  become: true
  changed_when: false
  register: jellyfin_k8s_tonemap
  failed_when: false

- name: Report the tone-mapping situation
  tags: [deploy]
  ansible.builtin.debug:
    msg: >-
      {{ 'HDR tone-mapping works — libplacebo/Vulkan built the graph and encoded through VAAPI.'
         if 'TONEMAP_OK' in jellyfin_k8s_tonemap.stdout
         else 'HDR TONE-MAPPING BROKEN (' ~ (jellyfin_k8s_tonemap.stderr | trim | truncate(200)) ~ ').
               SDR playback is unaffected and will not show this.' }}
