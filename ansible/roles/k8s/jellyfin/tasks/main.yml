---
# The media server. jellyfin only reads the library, so it shares no hardlink seam with the
# *arrs. What it does need is the GPU: this is the first workload to request the
# `devic.es/dri` resource the device plugin advertises.

# The claim is `k8s_claims` in defaults/main.yml; k8s/manifests renders and applies it.
#
# Flux owns this role (D5, Wave D), so it runs no other task. The snapshot-space cap is the
# `jellyfin-snapshot-cap` Job and the render-node and library checks are the `jellyfin-verify`
# Job, both in templates/verify/. The pinned LAN address is checked by observability's
# `JellyfinLanAddressNotPinned` rule.
- name: Deploy jellyfin to the cluster
  ansible.builtin.include_role:
    name: k8s/manifests
