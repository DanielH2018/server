---
# Slice 4, B5 — the media server, and the slice's exit criterion.
#
# Unlike the five that cut over in B4c, jellyfin has no hardlink seam to share: it only READS the
# library. What makes it the exit criterion is the GPU — it is the first workload to request the
# `devic.es/dri` extended resource the B1 device plugin advertises, so a wrong answer here is a
# wrong answer about the whole media plane on this host.
# The same tag the Docker copy ran, so a behavioural difference between the two is never the
# image. NOT the opencl-intel DOCKER_MODS variant — see D8/D12.
jellyfin_k8s_image: lscr.io/linuxserver/jellyfin:10.11.10ubu2404-ls35

# Auto-deploy stance — read by gitops_deploy (see the k8s auto-deploy coverage design).
# Migrating state — strategy is Recreate and the config volume is seeded through
# k8s/seed-volume (hardcoded ReadWriteOnce), so a bad image swap can migrate the library
# database, artwork and trickplay data before the gate observes a fault, then fail the rollback
# redeploy against data it can no longer read. Also the fleet's only workload requesting the
# `devic.es/dri` GPU resource — a wrong image can wedge transcoding in a way a plain
# readinessProbe never sees.
# Promoted in slice 7b (2026-08-21): k8s/manifests now takes a pre-apply Longhorn snapshot of
# the claim below and reverts it if the deploy fails, so a bad swap reverts to the snapshot
# instead of leaving the library database, artwork and trickplay data unreadable by the old image.
k8s_autodeploy: true  # noqa var-naming[no-role-prefix]
k8s_autodeploy_reason: "migrating state — Recreate + RWO seed-volume PVC, now protected by the pre-apply Longhorn snapshot and revert; also the only GPU (devic.es/dri) workload in the fleet. WEIGHED: jellyfin also mounts media-data (shared RWX, not reverted); a revert rewinds the library cache and watch history, self-healing on a rescan"  # noqa var-naming[no-role-prefix]
# Slice 7a task 3 — the pre-apply Longhorn snapshot k8s/manifests takes via k8s/volume-snapshot.
# Declared regardless of k8s_autodeploy — protects a manual deploy too, and slice 7b's revert
# is what this role's auto-deploy now depends on.
k8s_autodeploy_snapshot_pvcs: [jellyfin-config]  # noqa var-naming[no-role-prefix]
# Claims this role MOUNTS but does not revert — the WEIGHED clause in the reason above, stated
# where a test can read it. media-data is rendered by k8s/media-volume, so no guard that reads
# what this role creates can see the coupling (2026-08-22 review M2).
k8s_autodeploy_unreverted_claims: [media-data]  # noqa var-naming[no-role-prefix]

# 206 M at B5, of which ~180 M is data/ (the library database, artwork, trickplay). longhorn, not
# longhorn-nobackup: re-scanning a library rebuilds the metadata but loses watch state, user
# accounts and API keys.
jellyfin_k8s_claim: jellyfin-config
# `longhorn` — backed up. Briefly `longhorn-nobackup` on 2026-08-08, after B2's TRANSACTION cap
# fired twice in a week (08-02, 08-08) as slice 4 took Longhorn's daily run from 4 to 15 backups and
# incremental backups bound bandwidth, not transactions. Returned the same day: the exclusion left
# this volume with a single frozen 08-08 restore point, and whether steady-state incrementals are
# actually the problem cannot be read off anything Longhorn or B2 expose. So it is being tested
# rather than assumed, with B2 Reachable as the readout. docs/b2-transaction-cap-monitoring-gaps.md.
jellyfin_k8s_storage_class: longhorn
jellyfin_k8s_size: 3Gi
jellyfin_k8s_source_path: /home/ubuntu/server/containers/jellyfin/config

# READ-ONLY, and mounted TWICE — see the deployment template. Not a tidy-up target.
jellyfin_k8s_media_claim: media-data

# ── the GPU ─────────────────────────────────────────────────────────────────────────────────
# The extended resource the B1 device plugin advertises. Requesting it is what gets the render
# node into the container's cgroup device allowlist; `hostPath` alone does not, which B1 proved
# with an EPERM (not EACCES) on open(). The GID below is the other half — the plugin gets the
# container past the cgroup, group membership gets it past the file mode.
jellyfin_k8s_dri_resource: devic.es/dri

# ── the LAN address (D7) ────────────────────────────────────────────────────────────────────
# The Docker copy bound 8096 to daniel-server's LAN IP for direct-by-IP clients. That becomes a
# MetalLB LoadBalancer, PINNED rather than pool-assigned: `homelab-pool` has autoAssign, so an
# unpinned Service takes whatever is free and can move on recreate — and this address is typed
# into TV and phone clients by hand. A moving one is worse than a chosen one.
#
# The two UDP discovery ports (1900 SSDP, 7359 auto-discovery) are deliberately NOT here. Both
# are multicast/broadcast and MetalLB in L2 mode does not carry multicast to pods; D7 resolved
# this by establishing nobody uses DLNA. That is what keeps this pod off `hostNetwork`.
# jellyfin_k8s_lan_ip moved to group_vars/all.yml (cross-role: the uptime-kuma VIP tile
# reads it, and role defaults are invisible across roles).

# What the server advertises to clients as its own address. Was `{{ server_ip }}` (daniel-server)
# under Compose; the LAN VIP above is the same idea on the new host.
jellyfin_k8s_published_url: "http://{{ jellyfin_k8s_lan_ip }}:8096"

# ── jellyfin-ani-sync (AniList watch-status sync) ───────────────────────────────────────────
# The plugin pushes watch status and episode progress to AniList. It sends no score — its
# AniList client calls SaveMediaListEntry(mediaId, status, progress, ...) and the word `score`
# appears nowhere in it — so it cannot overwrite a rating set by hand on AniList. That is what
# makes "rate on AniList, sync from Jellyfin" safe to run together, and it is the reason this
# role installs the plugin at all rather than a rating bridge. docs/anilist-integration.md.
#
# PINNED one release behind on purpose. The current release 4.4.0.0 declares targetAbi
# 10.11.11.0, and Jellyfin's loader rejects a plugin whose targetAbi is NEWER than the server;
# jellyfin_k8s_image above is 10.11.10. 4.1.0.0 declares 10.11.6.0 and loads. Raise this and
# the image together, never the plugin alone.
jellyfin_k8s_anisync_version: "4.1.0.0"
# URL and checksum both come from the plugin's published manifest.json. The MD5 was verified
# against the actual download, not copied on trust.
jellyfin_k8s_anisync_url: "https://github.com/vosmiic/jellyfin-ani-sync/releases/download/v4.1/10.11.6.-.ani-sync_4.1.0.0.zip"
jellyfin_k8s_anisync_md5: "4d95c608192395b72efe57551a6f2ae0"
# The installer runs on python, not the alpine:3.24 the sibling init container uses. See the
# deployment template for why: the release is a .zip and /config is owned by uid {{ puid }}, so
# an alpine container would need `apk add unzip` as root — and root there holds no
# DAC_OVERRIDE and so could not write what it had unpacked. Named here rather than written
# into the template because Renovate's k8s-defaults manager only scans defaults/main.yml.
jellyfin_k8s_anisync_init_image: python:3.14-alpine

jellyfin_k8s_cpu_limit: "4"
jellyfin_k8s_mem_limit: 4096Mi
jellyfin_k8s_cpu_request: "250m"
# 2Gi against measured working-set peaks of 1.85GiB and 2.8GiB across two pod incarnations
# (2026-08-29). The request is the kubelet's eviction datum — it ranks pods that exceed their
# request ahead of those that don't — so a 256Mi request put jellyfin in the worst bucket while
# genuinely needing several GiB. Stays under the 4096Mi limit, so QoS remains Burstable.
# Preventative: 37 pods at homelab-best-effort priority evict ahead of it, and no pod on this
# cluster has ever OOMKilled.
jellyfin_k8s_mem_request: 2Gi
