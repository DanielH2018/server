---
# The media server. jellyfin has no hardlink seam to share: it only READS the library. Its
# risk is the GPU — it is the first workload to request the `devic.es/dri` extended resource
# the device plugin advertises, so a wrong answer here is a wrong answer about the whole media
# plane on this host.
# 10.11.11 because jellyfin-ani-sync 4.4.0.0 targets that ABI (see the plugin pin below).
# NOT the opencl-intel DOCKER_MODS variant — see D8/D12.
jellyfin_k8s_image: lscr.io/linuxserver/jellyfin:10.11.11ubu2604-ls47

# Auto-deploy stance — read by gitops_deploy (see the k8s auto-deploy coverage design).
# Migrating state — strategy is Recreate and the config volume is a ReadWriteOnce claim
# (`k8s_claims` below), so a bad image swap can migrate the library
# database, artwork and trickplay data before the gate observes a fault, then fail the rollback
# redeploy against data it can no longer read. Also the fleet's only workload requesting the
# `devic.es/dri` GPU resource — a wrong image can wedge transcoding in a way a plain
# readinessProbe never sees.
# k8s/manifests takes a pre-apply Longhorn snapshot of the claim below and reverts it if the
# deploy fails, so a bad swap reverts to the snapshot
# instead of leaving the library database, artwork and trickplay data unreadable by the old image.
k8s_autodeploy: true  # noqa var-naming[no-role-prefix]
k8s_autodeploy_reason: "migrating state — Recreate + RWO config PVC, now protected by the pre-apply Longhorn snapshot and revert; also the only GPU (devic.es/dri) workload in the fleet. WEIGHED: jellyfin also mounts media-data (shared RWX, not reverted); a revert rewinds the library cache and watch history, self-healing on a rescan"  # noqa var-naming[no-role-prefix]
# The pre-apply Longhorn snapshot k8s/manifests takes via k8s/volume-snapshot. Declared
# regardless of k8s_autodeploy — protects a manual deploy too, and the revert is what this
# role's auto-deploy depends on.
k8s_autodeploy_snapshot_pvcs: [jellyfin-config]  # noqa var-naming[no-role-prefix]
# Claims this role MOUNTS but does not revert — the WEIGHED clause in the reason above, stated
# where a test can read it. media-data is rendered by k8s/media-volume, so no guard that reads
# what this role creates can see the coupling.
k8s_autodeploy_unreverted_claims: [media-data]  # noqa var-naming[no-role-prefix]

# data/ holds the library database, artwork and trickplay. longhorn, not
# longhorn-nobackup: re-scanning a library rebuilds the metadata but loses watch state, user
# accounts and API keys.
jellyfin_k8s_claim: jellyfin-config
# `longhorn` — backed up. Excluding it (`longhorn-nobackup`) leaves a single frozen restore
# point, and nothing Longhorn or B2 expose shows whether steady-state incrementals drive B2's
# TRANSACTION cap. B2 Reachable is the readout. docs/archive/b2-transaction-cap-monitoring-gaps.md.
jellyfin_k8s_storage_class: longhorn
# 8Gi: the library database, artwork and trickplay data in data/ outgrew 3Gi and tripped
# Jellyfin's own startup capacity check (StorageHelper.TestDataDirectorySize requires 2GiB
# free). Cache and transcode scratch live on an emptyDir (see the `jellyfin-cache` volume
# below), so this is ordinary durable-data growth. Longhorn's
# `allowVolumeExpansion` is true on the `longhorn` StorageClass, and 8Gi (8589934592 bytes) is
# a multiple of 16MiB and of every smaller block-size candidate, so the expansion is real
# regardless of which size Longhorn checks against.
jellyfin_k8s_size: 8Gi

# The claim k8s/manifests renders and applies for this role (#3387).
k8s_claims:  # noqa var-naming[no-role-prefix]
  - name: "{{ jellyfin_k8s_claim }}"
    storage_class: "{{ jellyfin_k8s_storage_class }}"
    size: "{{ jellyfin_k8s_size }}"

# Cap on the AGGREGATE size of this volume's snapshots, in bytes — Longhorn's
# `Volume.Spec.snapshotMaxSize`. `"0"`, the fleet-wide default, means uncapped, and this role
# takes a pre-apply Longhorn snapshot on every deploy (k8s_autodeploy_snapshot_pvcs above), so
# the backend could grow without bound behind a PVC that is itself capped at 8Gi.
#
# THE NUMBER IS NOT A JUDGEMENT CALL. Longhorn accepts "0" or a value no smaller than
# `Volume.Spec.Size` x 2, "because Longhorn requires at least two snapshots to function
# properly" (longhorn.io/docs/1.12.1, Snapshot Space Management). 2 x 8Gi = 16 GiB is therefore
# the smallest legal cap, and it is also what Longhorn itself writes when a volume is expanded.
# So this is derived from jellyfin_k8s_size rather than written out: a later raise of the PVC
# size past half of a hardcoded cap would leave a value the admission webhook refuses, and the
# refusal would land on every jellyfin deploy from then on.
#
# Written out in pure Jinja rather than with `human_to_bytes`, which is an Ansible filter the
# k8s manifest render guard does not carry (it shims only `bool`); a defaults value using one
# fails `scripts/validate/k8s_manifests.py` with "No filter named ...". The `Gi` suffix the
# slice assumes is asserted by the test, so a unit change fails loudly rather than silently
# producing a wrong number.
# 16 GiB against ~1.9 GiB of live snapshots is roughly 8x headroom — deliberately
# loose, because a cap that is REACHED does not prune, it refuses: Longhorn stops accepting new
# snapshots until some are deleted, and k8s/volume-snapshot snapshots BEFORE it prunes. A tight
# cap would latch, failing every jellyfin deploy and the weekly backup job with it.
jellyfin_k8s_snapshot_max_size: "{{ (jellyfin_k8s_size[:-2] | int) * 2 * 1024 * 1024 * 1024 }}"

# READ-ONLY, and mounted TWICE — see the deployment template. Not a tidy-up target.
jellyfin_k8s_media_claim: media-data

# ── the GPU ─────────────────────────────────────────────────────────────────────────────────
# The extended resource the device plugin advertises. Requesting it is what gets the render
# node into the container's cgroup device allowlist; `hostPath` alone does not, and fails with
# an EPERM (not EACCES) on open(). The GID below is the other half — the plugin gets the
# container past the cgroup, group membership gets it past the file mode.
jellyfin_k8s_dri_resource: devic.es/dri

# ── the LAN address (D7) ────────────────────────────────────────────────────────────────────
# Direct-by-IP clients reach 8096 through a MetalLB LoadBalancer, PINNED rather than pool-assigned: `homelab-pool` has autoAssign, so an
# unpinned Service takes whatever is free and can move on recreate — and this address is typed
# into TV and phone clients by hand. A moving one is worse than a chosen one.
#
# The two UDP discovery ports (1900 SSDP, 7359 auto-discovery) are deliberately NOT here. Both
# are multicast/broadcast and MetalLB in L2 mode does not carry multicast to pods; nobody uses
# DLNA, which keeps this pod off `hostNetwork`.
# jellyfin_k8s_lan_ip lives in group_vars/all.yml (cross-role: the uptime-kuma VIP tile
# reads it, and role defaults are invisible across roles).

# What the server advertises to clients as its own address — the LAN VIP above.
jellyfin_k8s_published_url: "http://{{ jellyfin_k8s_lan_ip }}:8096"

# ── jellyfin-ani-sync (AniList watch-status sync) ───────────────────────────────────────────
# The plugin pushes watch status and episode progress to AniList. It sends no score — its
# AniList client calls SaveMediaListEntry(mediaId, status, progress, ...) and the word `score`
# appears nowhere in it — so it cannot overwrite a rating set by hand on AniList. That is what
# makes "rate on AniList, sync from Jellyfin" safe to run together, and it is the reason this
# role installs the plugin at all rather than a rating bridge. docs/anilist-integration.md.
#
# The plugin declares a targetAbi, and Jellyfin's loader rejects one NEWER than the server —
# silently, behind a green rollout. 4.4.0.0 declares 10.11.11.0; jellyfin_k8s_image above is
# 10.11.11. Raise this and the image together, never the plugin alone. The Renovate PR for
# this pin is deliberately manual (renovate.json names it): Renovate can bump the version but
# not the image, the asset filename (it leads with the targetAbi) or the MD5.
# ansible/tests/services/test_anisync_pin_matches_server.py refuses the mismatch.
jellyfin_k8s_anisync_version: "4.4.0.0"
# URL and checksum both come from the plugin's published manifest.json. The MD5 was verified
# against the actual download, not copied on trust.
jellyfin_k8s_anisync_url: "https://github.com/vosmiic/jellyfin-ani-sync/releases/download/v4.4/10.11.11.-.ani-sync_4.4.0.0.zip"
jellyfin_k8s_anisync_md5: "0d398377b33c27840c021779497c72dc"
# ── Intro Skipper (skip-intro / skip-credits media segments) ────────────────────────────────
# Detects intro and credit sequences by audio fingerprint and publishes them through Jellyfin's
# Media Segments API. Every client that speaks that API then draws the skip button itself —
# upstream's README states plainly that "as of Jellyfin 10.10, Intro Skipper does NOT modify
# the UI", so there is no index.html injection here and `/usr/share/jellyfin/web` is never
# written. That is what lets this install stay a plain file drop into the config volume.
#
# The release line is per JELLYFIN version, not per plugin version: upstream tags are
# `10.11/v1.10.11.23` and `12.0/v12.0.2.8`, two lines maintained in parallel. Take the 10.11
# line while jellyfin_k8s_image is a 10.11 build; a 12.0 asset declares a targetAbi the loader
# rejects, silently, exactly as the ani-sync note above describes.
jellyfin_k8s_introskipper_version: "1.10.11.24"
# The zip carries ONLY IntroSkipper.dll — no meta.json, unlike the ani-sync release. The init
# container writes one from the fields below, so Jellyfin reads the plugin's real GUID and name
# instead of falling back to a manifest it derives from the directory name (that fallback sets
# the id to an MD5 of the folder and AutoUpdate to false).
jellyfin_k8s_introskipper_target_abi: "10.11.11.0"
jellyfin_k8s_introskipper_guid: "c83d86bb-a1e0-4c35-a113-e2101cf4ee6b"
# URL and targetAbi come from the plugin's published manifest
# (github.com/intro-skipper/manifest, 10.11/manifest.json). The checksum does NOT: upstream
# publishes an MD5 there, and this pins the sha256 GitHub itself reports for the asset
# (`gh release view --repo intro-skipper/intro-skipper 10.11/v1.10.11.24 --json assets`), the
# same stronger digest headlamp_k8s_plugins uses. Verified against the actual download.
jellyfin_k8s_introskipper_url: "https://github.com/intro-skipper/intro-skipper/releases/download/10.11/v1.10.11.24/intro-skipper-v1.10.11.24.zip"
jellyfin_k8s_introskipper_sha256: "719c7131455bb12461ed88cdbdec8bca02fd2ae406e7c4cbf0e18e458d8d5755"

# ── Webhook (playback / library events out to HTTP endpoints) ───────────────────────────────
# Jellyfin's own first-party plugin (owner `jellyfin` in the official manifest), installed so
# playback and library events can drive Home Assistant. Installing
# the plugin is the half that has to live in the repo; the destination is configured in the
# dashboard and stored on the config PVC, exactly as ani-sync's OAuth token is.
#
# 21.0.0.0, NOT the newest. Version 22.0.0.0 declares targetAbi 12.0.0.0, and
# Jellyfin's loader rejects a plugin built for a NEWER server silently — the same trap the two
# pins above record. 21.0.0.0 declares 10.11.8.0, which the 10.11.11 image satisfies.
#
# Distributed from repo.jellyfin.org rather than a GitHub release, so there is no `gh release`
# asset digest to prefer: this pins the MD5 the official manifest.json publishes, verified
# against the actual download (`curl -sSL ... | md5sum`), the same way the ani-sync MD5 was.
# The zip DOES carry its own meta.json — so unlike Intro Skipper, nothing here writes one.
jellyfin_k8s_webhook_version: "21.0.0.0"
jellyfin_k8s_webhook_target_abi: "10.11.8.0"
jellyfin_k8s_webhook_url: "https://repo.jellyfin.org/files/plugin/webhook/webhook_21.0.0.0.zip"
jellyfin_k8s_webhook_md5: "fa75f479e66fba83827d4542dbff5f95"

# ── Merge Versions (collapses duplicate quality versions into one library entry) ─────────────
# It merges the several files a movie can have — 1080p and
# 2160p, or a remux beside a web-dl — into a single library entry whose versions the client
# offers in a picker, instead of listing the same film three times. Third-party
# (`danieladov/jellyfin-plugin-mergeversions`), and NOT in the official
# repo.jellyfin.org manifest, so the targetAbi and the digest come from the plugin's own
# published manifest and release asset rather than from Jellyfin's.
#
# 10.11.0.1, NOT the newest. Upstream tags the release line by JELLYFIN version, the way Intro
# Skipper does — `10.11.0.1` and `12.0.0` are the two live lines — and 12.0.0 declares targetAbi
# 12.0, which a 10.11 server's loader rejects silently behind a green rollout. Take the 10.11
# line while jellyfin_k8s_image is a 10.11 build.
jellyfin_k8s_mergeversions_version: "10.11.0.1"
# targetAbi and guid come from the plugin's published manifest
# (danieladov/JellyfinPluginManifest, master manifest.json). The CHECKSUM does not: that
# manifest publishes an MD5, and this pins the sha256 GitHub itself reports for the asset, the
# stronger digest Intro Skipper's pin already uses. Verified by downloading the zip and hashing
# it — sha256 79afd802…, and the manifest's own MD5 ea467eb9… agrees on the same
# bytes, so two independent digests attest to one download.
jellyfin_k8s_mergeversions_target_abi: "10.11.0.0"
jellyfin_k8s_mergeversions_guid: "f21bbed8-3a97-4d8b-88b2-48aaa65427cb"
jellyfin_k8s_mergeversions_url: "https://github.com/danieladov/jellyfin-plugin-mergeversions/releases/download/10.11.0.1/Jellyfin.Plugin.MergeVersions.zip"
jellyfin_k8s_mergeversions_sha256: "79afd80219176cadccb05752971072a9fc74dc1122327dcf37c3d8c4ebf0809b"
# The zip carries ONLY Jellyfin.Plugin.MergeVersions.dll — no meta.json, so this install is
# Intro Skipper's shape and not Webhook's: the init container writes the manifest from the guid,
# name and targetAbi above. Without it Jellyfin's LoadManifest invents one from the directory
# name, setting the id to an MD5 of the folder and AutoUpdate to false.


# ── Media Cleaner (rule-based deletion of watched media) ─────────────────────────────────────
# The plugin with the largest blast radius: it DELETES MEDIA FILES on a schedule, by rule. It
# is pinned with a version, checksum, recorded targetAbi and a test like the four beside it,
# because a plugin that deletes is a different risk class from an unpinned dashboard install,
# and an image bump must not drop it silently.
#
# WHAT IS STILL NOT IN GIT, and cannot be: which libraries it may delete from, and every rule
# that decides what goes. That is plugin configuration under
# /config/data/plugins/configurations/, the same shape as bazarr's provider list — the repo owns
# that the plugin is installed and at which version, never what it is pointed at. Read the rules
# from the dashboard's Troubleshooting tab, which renders a DRY-RUN report of what a real run
# would delete, before changing anything there.
#
# From v3.4.0 on, the release also ships a MediaCleaner-12.0.zip. The deployment template sets
# `autoUpdate: false` in every plugin's meta.json, which stops Jellyfin's own `Update Plugins`
# scheduled task fetching an unpinned build.
#
# THE VERSION ENCODES THE SERVER ABI IN ITS FOURTH SEGMENT, which no sibling pin here does.
# Upstream ships ONE release tag (`v3.2.0`) carrying three per-ABI assets —
# MediaCleaner-10.10.7.zip, MediaCleaner-10.11.0.zip, MediaCleaner-10.11.9.zip — and publishes
# each as its own manifest version: `3.2.0.101007`, `3.2.0.101100`, `3.2.0.101109`. The fourth
# segment is `<major><minor:02d><patch:02d>` of the targetAbi, so 10.11.9 becomes 101109. Picking
# the wrong asset is therefore a SILENT choice: all three are the same plugin release and only
# the embedded ABI differs, and Jellyfin rejects one built for a newer server without logging a
# failure. ansible/tests/services/test_mediacleaner_install.py re-derives that encoding from the
# targetAbi rather than trusting the three values to have been copied consistently.
jellyfin_k8s_mediacleaner_version: "3.7.0.101109"
# The newest ABI variant the 10.11.11 image satisfies. v3.7.0 also ships a 12.0 variant, which
# this image would reject without logging a failure.
jellyfin_k8s_mediacleaner_target_abi: "10.11.9.0"
jellyfin_k8s_mediacleaner_url: "https://github.com/shemanaev/jellyfin-plugin-media-cleaner/releases/download/v3.7.0/MediaCleaner-10.11.9.zip"
# sha256, the digest GitHub reports for the asset itself — verified by downloading the zip and
# hashing it (v3.7.0). The plugin's published manifest (shemanaev/jellyfin-plugin-repo,
# master manifest.json) carries an MD5, 6580d2fa3aa033dc2cfe317a2dfa4be3, and it agrees on the
# same bytes, so two independent digests attest to one download. The zip's own meta.json declares
# version 3.7.0.101109 and targetAbi 10.11.9.0, matching the two pins above.
jellyfin_k8s_mediacleaner_sha256: "8d66770e1d7253bc391c60bae9091677f41a1ea797efb3bfa9b1fcb9958cc8ed"
# The zip carries its own meta.json beside MediaCleaner.dll and MediaCleaner.Core.dll, so this
# install is WEBHOOK's shape, not Intro Skipper's: nothing here writes a manifest, and no guid
# is needed as an input. For the record, the manifest declares
# 607fee77-97eb-41fe-bf22-26844d99ffb0 — that is the id the plugin's configuration directory is
# already bound to, which is why a dashboard-installed copy and this one are the same plugin to
# Jellyfin rather than two.

# ── No SSO-Auth plugin ──────────────────────────────────────────────────────────────────────
# The deployment template's `sweep-unlisted-plugins` init container removes the plugin
# directory from the PVC, as it does for every plugin not installed here. Upstream
# 9p4/jellyfin-plugin-sso publishes no Jellyfin 12 build — its newest release, 4.0.0.4, still
# declares targetAbi 10.11.0.0 — so it blocks any move to the 12 image line.
#
# This role runs `use_authelia: false` and jellyfin.<domain> is a PUBLIC route, so the route
# falls back to Jellyfin's own local accounts: no OIDC, no 2FA. `use_authelia: true` would
# protect the route but breaks native clients.

# The image every plugin container runs on — the five installers and the allowlist sweep
# alike. Python, not the alpine:3.24 the sibling init
# container uses. See the deployment template for why: the releases are .zips and /config is
# owned by uid {{ puid }}, so an alpine container would need `apk add unzip` as root — and root
# there holds no DAC_OVERRIDE and so could not write what it had unpacked. Named here rather
# than written into the template because Renovate's k8s-defaults manager only scans
# defaults/main.yml.
jellyfin_k8s_plugin_init_image: python:3.14-alpine@sha256:9e9fde4d32eedce0b661d9ab91e826b62dddf28e928c230ec55f1866cac66b01

jellyfin_k8s_cpu_limit: "4"
jellyfin_k8s_mem_limit: 4096Mi
jellyfin_k8s_cpu_request: "250m"
# 2Gi against measured working-set peaks of 1.85GiB and 2.8GiB across two pod incarnations.
# The request is the kubelet's eviction datum — it ranks pods that exceed their
# request ahead of those that don't — so a 256Mi request put jellyfin in the worst bucket while
# genuinely needing several GiB. Stays under the 4096Mi limit, so QoS remains Burstable.
# Preventative: 37 pods at homelab-best-effort priority evict ahead of it.
jellyfin_k8s_mem_request: 2Gi
