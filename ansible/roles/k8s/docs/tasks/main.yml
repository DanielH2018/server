---
# The site directory the pod mounts is a host write, so roles/setup/k8s_host_files/tasks/docs.yml
# creates it through the setup plane (D5's conversion PR for docs). A Flux-owned role runs no
# task, so a host write left here would stop at the flip.
- name: Deploy the docs site to the cluster
  ansible.builtin.include_role:
    name: k8s/manifests
