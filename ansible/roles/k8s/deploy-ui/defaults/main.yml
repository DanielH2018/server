---
# Auto-deploy stance — read by gitops_deploy (see the k8s auto-deploy coverage design).
# Route-only role (see tasks/main.yml): it renders no Deployment of its own, only a
# selector-less Service, its EndpointSlice and the IngressRoute onto deploy-ui.service on
# daniel-box. `manifests_rollout: ''` already tells the shared role there is nothing to wait
# on. But the page behind this route starts deploys and clears the deployer's hold, so a bad
# route change (auth accidentally dropped, the EndpointSlice pointed elsewhere) hands that to
# whoever reaches it — the deploy plane itself, with no workload here to roll back.
k8s_autodeploy: false  # noqa var-naming[no-role-prefix]
k8s_autodeploy_reason: "renders no Deployment — route-only (Service + EndpointSlice + IngressRoute) in front of deploy-ui.service on daniel-box; a bad route change exposes a page that starts deploys and clears the deployer's hold"  # noqa var-naming[no-role-prefix]
