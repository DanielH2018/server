---
# Built in-cluster (k8s/image-builder) from this role's Dockerfile — successor to the
# Docker sidecar's `build: context: .`. Pulled on daniel-server through the agent-side
# registries.yaml mirror (ClusterIP endpoint); see k8s_registry_cluster_ip in
# group_vars/all.yml.
nut_k8s_image: "{{ k8s_registry_pull_host }}/nut:latest"

# Auto-deploy stance — read by gitops_deploy (see the k8s auto-deploy coverage design).
# NOT probe-less — verified against templates/deployment.yaml.j2, this Deployment DOES render
# a readinessProbe (and a livenessProbe). The denylist comment block groups this role under
# "probe-less Deployments," which is stale for nut specifically; the real reason is the
# deployment.yaml.j2 comment right above `strategy: type: Recreate` — the USB device and the
# loopback hostPort are both node-exclusive, so a rolling update would fight the old pod for
# both. That, plus this being the pod half of the UPS/nut_host emergency-shutdown chain
# (privileged: true, direct /dev/bus/usb access) makes it worth a human watching every deploy,
# regardless of probe coverage.
k8s_autodeploy: false  # noqa var-naming[no-role-prefix]
k8s_autodeploy_reason: "NOT probe-less (has a readinessProbe) despite the denylist comment grouping — real reason: USB-passthrough + node-exclusive hostPort (Recreate strategy) on the UPS shutdown-chain pod, privileged:true"  # noqa var-naming[no-role-prefix]

# Mirrors resources('0.50', '128M', '0.05', '16M') in the retired compose template.
nut_k8s_cpu_limit: "500m"
nut_k8s_mem_limit: 128Mi
nut_k8s_cpu_request: "50m"
nut_k8s_mem_request: 16Mi

# Seconds on battery before the primary raises FSD and every ARMED secondary shuts down. Made
# explicit 2026-08-24: it was referenced ONLY as `{{ nut_onbatt_shutdown_delay | default(120) }}`
# in templates/config-secret.yaml.j2 and defined nowhere in the live tree, so the real value was
# invisible unless you read the Jinja default. The one remaining definition was in
# roles/containers/archive/peanut, a retired role.
#
# RAISED 120 -> 300 on 2026-08-28, as the prerequisite for arming daniel-box. This timer fires
# that many seconds into ANY mains interruption, not at battery end, so at 120 a three-minute
# blip cost a full cluster restart. Measured the same day on daniel-server
# (`upsc apc-ups@127.0.0.1`): battery.runtime 987 at battery.charge 100 and ups.load 43, against
# ups.realpower.nominal 900. Arming the control-plane node at 120 would have turned "daniel-box
# rides out a short outage" into "daniel-box stops two minutes in" — a regression dressed as a
# fix, which is why the arming and this raise land together.
#
# WHY 300 AND NOT THE WHOLE BATTERY. This timer is the ride-out knob, not the safety net.
# `AT LOWBATT * EXECUTE lowbatt` in templates/config-secret.yaml.j2 raises FSD as soon as the UPS
# asserts LB, which this unit does at battery.charge.low 10 or battery.runtime.low 120, so the
# end of the battery is already covered by a different trigger. 300 rides out the blips that
# dominate residential outages while leaving ~11 minutes of measured runtime for two poweroffs,
# and that margin absorbs battery ageing and a load above today's 43%. Going higher is a
# follow-up to take after a drill has shown how long the two hosts actually need, not a free win.
#
# There is exactly ONE upssched (the pod, the primary), so FSD is a single global event every
# secondary sees at the same moment, and this value delays every armed host equally. That is the
# intent rather than a limitation: see the DECIDED marker at FINALDELAY in
# roles/nut_host/templates/host-upsmon.conf.j2 for why the two hosts need no staggering.
#
# Order of operations when arming a further host: raise this FIRST, run the console-attended
# `upsmon -c fsd` drill there, and only then set nut_host_secondary_armed for it.
nut_onbatt_shutdown_delay: 300
