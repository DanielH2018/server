---
# nut runs in-cluster, pinned to daniel-server (the UPS's USB host).
# The host-side half of the stack — udev rule + secondary upsmon that performs the real
# poweroff — lives in the nut_host role (initial_setup.yml). The pod publishes the
# 127.0.0.1:3493 loopback as a hostPort, which is what that secondary upsmon connects to.

- name: Build the nut image
  ansible.builtin.include_role:
    name: k8s/image-builder
  vars:
    image_builder_name: nut
    image_builder_dockerfile: "{{ playbook_dir }}/roles/k8s/nut/templates/Dockerfile.j2"
    # Embedded verbatim (lookup('file')) — shell scripts Jinja must not touch.
    image_builder_context_files:
      "{{ playbook_dir }}/roles/k8s/nut/files/entrypoint.sh": entrypoint.sh
      "{{ playbook_dir }}/roles/k8s/nut/files/upssched-cmd": upssched-cmd

- name: Deploy nut to the cluster
  ansible.builtin.include_role:
    name: k8s/manifests
  vars:
    # DECIDED: nut stays off `manifests_prune` (#3388, operator decision 2026-10-05). Arming it
    # adds the role label to this Deployment and restarts the UPS monitor once, which leaves
    # about a minute without power-cut shutdown coverage. #3388 counts nut as deliberately
    # excluded. The prune is armed by default since #3662, so this line is the opt-out.
    # Flux owns nut since D5.17, so this include runs only after a handback. The renderer still
    # reads the line and leaves the role label off nut's objects; Flux's own prune tracks them
    # by its inventory, not by that label.
    manifests_prune: false
    manifests_rollout: nut
