---
# valheim-stats' half of game-stats: its script ConfigMap. The manifests apply is main.yml's.
#
# No volume-claim include, unlike terraria.yml: there is nothing to seed.
# The PVC is declared in templates/pvc-valheim.yaml.j2 and starts empty.

- name: Create the staging directory for valheim-stats
  tags: [config]
  ansible.builtin.file:
    path: /etc/rancher/k3s/valheim-stats
    state: directory
    mode: "0755"
    owner: root
    group: root
  become: true
  when: not k8s_dry_run | bool

- name: Stage the stats script on the node for valheim-stats
  tags: [config]
  ansible.builtin.copy:
    src: valheim_stats.py
    dest: /etc/rancher/k3s/valheim-stats/valheim_stats.py
    mode: "0644"
    owner: root
    group: root
  become: true
  register: game_stats_valheim_script
  when: not k8s_dry_run | bool

# valheim_stats.py does `import stats_lib` for the skeleton it shares with terraria-stats
# (Loki fetch, cursor handling, metric rendering, the HTTP handler, the run loop). Staged
# before the ConfigMap render, same as the entry script: a window in which the ConfigMap
# exists without this sibling is a pod that dies at import on its next roll.
- name: Install the shared stats_lib module beside the valheim stats script
  tags: [config]
  ansible.builtin.import_tasks: stage.yml
  vars:
    game_stats_lib_dest_dir: /etc/rancher/k3s/valheim-stats

# The pod-roll trigger must cover BOTH staged modules, not just valheim_stats.py — the
# manifests role only restarts on manifest changes, and neither script is one. An edit
# confined to stats_lib.py would deploy, read green, and change nothing live otherwise. Sorted
# before hashing so the trigger is a function of the pair, not of which is written first.
#
# Hashed off the SOURCE files, not off the two stage registers: both stages are skipped on a dry
# run, and `.checksum` on a skipped result is Undefined, which would raise here rather
# than fall back. `rstrip=False` makes these the bytes `copy` hashed, so the value is unchanged.
- name: Combine the staged module checksums into one pod-roll trigger for valheim-stats
  tags: [config]
  ansible.builtin.set_fact:
    game_stats_valheim_script_checksum: >-
      {{ [lookup('ansible.builtin.file', role_path ~ '/files/valheim_stats.py', rstrip=False) | hash('sha1'),
          game_stats_lib_checksum] | sort | join(',') | hash('sha1') }}

# The script is Jinja-hostile (its Prometheus exposition strings carry {…} braces), so it
# becomes a ConfigMap via kubectl --from-file, never via a template — the same reasoning
# as terraria-stats, observability's dashboards, and image-builder's context files.
- name: Render the script ConfigMap manifest for valheim-stats
  tags: [config]
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      k3s kubectl -n {{ k8s_namespace }} create configmap valheim-stats-script
      --from-file=valheim_stats.py=/etc/rancher/k3s/valheim-stats/valheim_stats.py
      {{ game_stats_lib_from_file }}
      --dry-run=client -o yaml > /etc/rancher/k3s/valheim-stats/configmap.yaml
    executable: /bin/bash
  become: true
  changed_when: game_stats_valheim_script is changed or game_stats_lib_stage is changed
  when: not k8s_dry_run | bool

# Server-side, like monitor-bridge's: client-side apply re-stores the whole object in an
# annotation capped at 262144 bytes, which a bridge ConfigMap can exceed. This script is far
# smaller, but one apply form across the four script ConfigMaps is one thing to get right.
# --force-conflicts takes the data keys from the client-side field manager that applied them
# earlier. Server-side apply prints the same line whether or not anything changed,
# so the changed signal is the staged files. ENFORCED by
# ansible/tests/k8s/test_script_configmaps_apply_server_side.py.
- name: Apply the script ConfigMap for valheim-stats
  tags: [deploy]
  ansible.builtin.command:
    cmd: >-
      k3s kubectl apply --server-side --force-conflicts
      -f /etc/rancher/k3s/valheim-stats/configmap.yaml
  become: true
  # Skipped on a dry run or --check. k8s/manifests only dry-runs its own apply, so without this
  # guard a dry run would really write this ConfigMap.
  when: not k8s_no_mutate
  register: game_stats_valheim_cm_apply
  changed_when: game_stats_valheim_script is changed or game_stats_lib_stage is changed
