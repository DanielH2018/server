---
# game-stats: the playtime exporters for the two hand-run game servers, terraria-stats and
# valheim-stats. Each reads its game pod's console lines from loki-homelab, folds them into
# all-time per-player stats (SQLite on a Longhorn PVC) and serves Prometheus metrics on :9420.
# The scrape jobs live in observability's prometheus.yaml.j2 (job_name: terraria-stats and
# valheim-stats).
#
# Every cluster object is named for its game, not for this role — the Deployments, their
# `app:` labels, the Services, the ConfigMaps and both claims — so the scrape jobs and
# netpol-baseline's Loki policy read them by those names.
#
# ONE k8s/manifests include for both games, not one each. The include prunes every staged file
# its caller does not name, so a second include under the same `manifests_service` would delete
# the first one's manifests. The consequence: a render change to either game restarts both pods.

- name: Stage terraria-stats' scripts and apply its ConfigMap
  ansible.builtin.import_tasks: terraria.yml

- name: Stage valheim-stats' scripts and apply its ConfigMap
  ansible.builtin.import_tasks: valheim.yml

- name: Deploy terraria-stats and valheim-stats to the cluster
  ansible.builtin.include_role:
    name: k8s/manifests
  vars:
    # The script ConfigMaps are applied from their own staging directories without the role
    # label, so the prune never selects them.
    manifests_rollout: terraria-stats
    manifests_extra_rollouts:
      - name: valheim-stats
    manifests_files:
      - deployment-terraria.yaml
      - service-terraria.yaml
      - deployment-valheim.yaml
      - service-valheim.yaml

# Leftovers from #2813, which merged the terraria-stats and valheim-stats roles into this one
# (#3088). The manifests role prunes only inside its own `manifests_service` directory, so the
# two old staging directories kept their copies of these same objects, and each old service kept
# its release record. `terraria-stats-claims/` was the retired k8s/volume-claim role's staging
# directory, which the shared sweep in k8s/manifests cannot reach because it is keyed on `game-stats` (#3387).
# Keep `/etc/rancher/k3s/terraria-stats/`: tasks/terraria.yml still stages it.
- name: Remove the staged manifests and release records the pre-#2813 roles left behind
  tags: [config]
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/rancher/k3s/manifests/terraria-stats
    - /etc/rancher/k3s/manifests/valheim-stats
    - /etc/rancher/k3s/manifests/terraria-stats-claims
    - /var/lib/homelab/k8s-releases.d/terraria-stats.json
    - /var/lib/homelab/k8s-releases.d/terraria-stats.previous.json
    - /var/lib/homelab/k8s-releases.d/valheim-stats.json
    - /var/lib/homelab/k8s-releases.d/valheim-stats.previous.json
  become: true
  when: not k8s_dry_run | bool
