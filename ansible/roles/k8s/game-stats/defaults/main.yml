---
# Stock image, not an image-builder build: both stats scripts and stats_lib.py are pure stdlib,
# mounted from a ConfigMap, so a build would add a layer and change nothing that runs.
game_stats_k8s_image: python:3.14-alpine@sha256:f6a589d43c42b9e7f7dc67a12d37132491f362859a5d750607710cc56da3bc72

# Auto-deploy stance — read by gitops_deploy (see the k8s auto-deploy coverage design).
# Games: companion stats exporters for the hand-operated terraria and valheim servers — grouped
# with them operationally, not deployed unattended. Each ALSO independently matches the
# migrating-state shape: Recreate + a ReadWriteOnce PVC holding the all-time SQLite DB. Loki's
# ~31-day window cannot reconstruct terraria's totals, and valheim's were never seeded, so a lost
# volume starts them at zero with nothing to rebuild from.
k8s_autodeploy: false  # noqa var-naming[no-role-prefix]
k8s_autodeploy_reason: "games — companions to the hand-operated terraria and valheim servers. ALSO Recreate + RWO PVCs holding irreplaceable stats — two independent reasons"  # noqa var-naming[no-role-prefix]

# terraria-stats-data rides the weekly backup tier: a tiny file of irreplaceable totals.
game_stats_terraria_claim: terraria-stats-data
game_stats_terraria_pvc_size: 1Gi
game_stats_terraria_storage_class: longhorn

# valheim-stats-data has NO seed: there is no history anywhere to import, so the totals start
# at zero. Backed-up tier all the same — the file is the only copy of numbers that cannot be
# recomputed (Loki only retains 31 days).
game_stats_valheim_claim: valheim-stats-data
game_stats_valheim_pvc_size: 1Gi
game_stats_valheim_storage_class: longhorn

# The claims k8s/manifests renders and applies for this role, ahead of the workload.
k8s_claims:  # noqa var-naming[no-role-prefix]
  - name: "{{ game_stats_terraria_claim }}"
    storage_class: "{{ game_stats_terraria_storage_class }}"
    size: "{{ game_stats_terraria_pvc_size }}"
  - name: "{{ game_stats_valheim_claim }}"
    storage_class: "{{ game_stats_valheim_storage_class }}"
    size: "{{ game_stats_valheim_pvc_size }}"
