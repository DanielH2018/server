---
# Claude Code telemetry stack, slice 1: collector + Loki + Prometheus.
#
# Claude Code runs on the daniel-box HOST and exports to localhost:4317 — that endpoint is
# fixed by the chezmoi settings template, which enables telemetry on every host except
# daniel-pi and states the intent plainly: "Every host exports to localhost:4317 and every
# host keeps its own data."
#
# Tempo (traces) and Grafana are deliberately out of slice 1. Data lands and is queryable
# without them; adding either changes nothing about whether collection works.

# Pinned, Renovate-tracked. Same collector build the Docker side runs so config stays portable.
claude_otel_collector_image: otel/opentelemetry-collector-contrib:0.157.0
claude_otel_loki_image: grafana/loki:3.3.0
claude_otel_prometheus_image: prom/prometheus:v3.0.1
claude_otel_grafana_image: grafana/grafana:11.4.0
# Slice 3 (D8). Distinct from the metrics-server k3s already bundles: that serves the
# resource-metrics API for `kubectl top`/HPA, while this exports kube_pod_status_ready and
# kube_deployment_status_* — the only readiness signal the seven routeless workloads have.
claude_otel_kube_state_metrics_image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.14.0

# longhorn-nobackup, NOT longhorn. Two reasons, either sufficient on its own:
#   - Volume: Loki with content logging on grows fast, and Prometheus TSDB is high-churn.
#     Both are the "bulky, regenerable state" the Docker side already keeps out of Kopia.
#   - Sensitivity: content logging is ON, so Loki holds prompts, responses and tool output
#     verbatim. The default class would copy transcript-grade data into B2 automatically.
claude_otel_storage_class: longhorn-nobackup
claude_otel_loki_storage: 10Gi
claude_otel_prometheus_storage: 5Gi
# Grafana keeps only its own SQLite (users, prefs, starred dashboards). Datasources and
# dashboards are provisioned from ConfigMaps, so this volume is small and losing it costs
# nothing but UI state — it is on the no-backup class for that reason, not just size.
claude_otel_grafana_storage: 1Gi

# OTLP gRPC, bound to loopback ON THE NODE via hostPort. Deliberately not a MetalLB VIP:
# with content logging on, this must not be reachable from the LAN. Loopback is the whole
# access control, exactly as the chezmoi bundle intends.
claude_otel_otlp_port: 4317
claude_otel_otlp_host_ip: 127.0.0.1
# Query-side twin of claude_otel_otlp_host_ip, for Loki/Prometheus/Tempo. `otelq` is a
# host process and hardcodes 127.0.0.1 on 3100/9090/3200, so a ClusterIP-only Service is
# unreachable to it. Loopback is load-bearing for the same reason as the collector's:
# these backends hold prompts, responses and tool output verbatim, so the node-side
# listener must never bind 0.0.0.0.
claude_otel_query_host_ip: 127.0.0.1

# 744h (31d), carried over from the bundle's loki-config.yaml along with the compactor that
# enforces it. Retention matters more here than in a normal log store: every prompt and
# response is retained verbatim for this window.
claude_otel_loki_retention: 744h
# Dashboard folders ported from daniel-server's Grafana (slice 3, B4). These are the
# subdirectories of roles/containers/grafana/files/dashboards, which stays the single source of
# truth for the JSON — the cluster mounts the same files rather than keeping a second copy.
#
# `AI` was excluded during B4 (uid collision with a vendored copy), reconciled 2026-08-07 into
# the shared tree ("one file, both Grafanas"), then re-homed HERE at D7 (2026-08-10): the Docker
# Grafana lost its Tempo datasource and its claude metrics stream when the otel-collector became
# a forwarder into this stack, so this cluster's Grafana is the board's only consumer — the AI
# folder now stages from this role's files/dashboards/AI, the rest still from the shared tree.
claude_otel_dashboard_folders:
  - AI
  - Apps
  - Infrastructure
  - Logs
  - Networking
  - Security

claude_otel_prometheus_retention: 30d
# Deliberately well under claude_otel_prometheus_storage (5Gi), not close to it. The cap bounds
# persisted BLOCKS only — the WAL, the in-memory head as it flushes, and compaction (which needs
# room for the output block alongside its inputs) all consume the same PVC on top of this number.
# Sizing it near the volume is how a size-capped Prometheus still fills its disk.
claude_otel_prometheus_retention_size: 3GB

# Traces (slice 3). Claude Code emits spans only with both CLAUDE_CODE_ENHANCED_TELEMETRY_BETA
# and OTEL_TRACES_EXPORTER set — the chezmoi settings template already sets both, so this is
# purely a matter of giving them somewhere to land.
claude_otel_tempo_image: grafana/tempo:2.8.1
claude_otel_tempo_storage: 5Gi
# 720h (30d) — the same window as the Prometheus retention, a day under Loki's 744h. Its own
# variable rather than a shared one because spans are per-turn and far bulkier than counters,
# so this is the value most likely to need cutting first if the PVC fills.
claude_otel_tempo_retention: 720h

# Self-monitoring (templates/telemetry-health.sh.j2). Pushes to a static Kuma monitor rather
# than being polled, because monitor-bridge runs on daniel-server and cannot see this cluster.
#
# */10, matching the Longhorn backup heartbeat: this queries the k8s API and Prometheus rather
# than reading a local file, and the fastest thing it watches (a 15m export-failure window)
# does not move faster than that. The Kuma monitor's heartbeat interval must stay above this
# (see the uptime-kuma role) so a dead cron trips the watchdog.
claude_otel_health_cron_minute: "*/10"
