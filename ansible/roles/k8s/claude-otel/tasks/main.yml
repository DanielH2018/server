---
# The Claude Code telemetry stack: collector + Loki + Prometheus (slice 1), Grafana behind
# Authelia (slice 2), Tempo + the traces pipeline (slice 3).

- name: Build the ported Grafana dashboard ConfigMaps
  ansible.builtin.include_tasks: dashboards.yml

- name: Render and apply the Claude Code telemetry manifests
  ansible.builtin.include_role:
    name: k8s/manifests
  vars:
    manifests_service: claude-otel
    manifests_files:
      - 00-namespace.yaml
      - collector.yaml
      - loki.yaml
      - prometheus.yaml
      # After prometheus.yaml: that file now carries the ServiceAccount/ClusterRole the
      # cadvisor discovery needs, and kube-state-metrics is a scrape target of it.
      - kube-state-metrics.yaml
      - tempo.yaml
      - middlewares.yaml
      - grafana.yaml
      - ingressroute.yaml
      # Must follow middlewares.yaml — it references the `rate-limit` Middleware, which
      # Traefik will not resolve across namespaces.
      # (ingest-ingressroute retired 2026-08-13 with the D7 forwarder — the collector
      # DaemonSet gives every node its own loopback hostPort, so nothing ingests over
      # the LAN anymore.)
      - prometheus-ingressroute.yaml
    manifests_secret_files:
      - grafana-secret.yaml
      - scrape-credentials-secret.yaml
    # The shared role waits on ONE Deployment in {{ k8s_namespace }}; this role has three,
    # in a different namespace. Skip its wait and roll our own below.
    manifests_rollout: ''

- name: Restart the telemetry workloads after a config change
  tags: [deploy]
  # `manifests_rollout: ''` above skips the shared role's WAIT, and skipping it also skips
  # its rollout-restart — so without this a ConfigMap edit applies to the object, reports
  # changed, and never reaches the running pod. Caught on the first config edit: the
  # collector kept serving the previous config with the deploy fully green.
  #
  # Skipped for a Deployment this run created — its pods are already on the new config, and
  # `rollout restart` races the initial rollout.
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n {{ k8s_observability_namespace }}
      rollout restart {{ item.kind }}/{{ item.name }}
  loop:
    # otel-collector is a DaemonSet since the Phase F drain (per-node loopback OTLP).
    - { kind: deploy, name: loki }
    - { kind: deploy, name: prometheus }
    - { kind: deploy, name: kube-state-metrics }
    - { kind: deploy, name: tempo }
    - { kind: daemonset, name: otel-collector }
    - { kind: deploy, name: grafana }
  loop_control:
    label: "{{ item.name }}"
  become: true
  changed_when: true
  when:
    - manifests_render is changed or manifests_secret_render is changed
    - not manifests_apply.stdout is search('\.apps/' ~ item.name ~ ' created')

- name: Wait for the telemetry workloads to roll out
  tags: [deploy]
  # Loki first: the collector's log pipeline exports to it, and a collector that starts
  # against a missing Loki logs export failures until it happens to retry successfully.
  # Ordering here makes the first-deploy logs readable rather than alarming.
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n {{ k8s_observability_namespace }} rollout status
      {{ item.kind }}/{{ item.name }} --timeout=300s
  loop:
    - { kind: deploy, name: loki }
    - { kind: deploy, name: prometheus }
    - { kind: deploy, name: kube-state-metrics }
    - { kind: deploy, name: tempo }
    - { kind: daemonset, name: otel-collector }
    - { kind: deploy, name: grafana }
  loop_control:
    label: "{{ item.name }}"
  become: true
  changed_when: false

# This role skips the shared role's wait (manifests_rollout: '') and rolls its own above, so it
# must also opt into the stabilisation gate explicitly — the wait it replaced is exactly the one
# that cannot see a post-readiness liveness failure. kube-state-metrics crashlooped through a
# green deploy here on 2026-08-07.
#
# It used to opt in by importing assert_stable.yml, which carried its own 60s `pause`. That pause
# was the single most expensive task in the role and it duplicated the play-level window in
# post_tasks/k8s_stabilise_gate.yml: measured 2026-08-22 on a full deploy (pid 2004861), 60.02s
# of the role's 69.0s. Handing the workloads to the play gate instead removes the second pause
# and is STRICTER, not weaker — these six are deployed in batch 4 of 11, so the gate observes
# them for the remainder of the run rather than for exactly 60s.
#
# Roles on the normal path get this snapshot from roles/k8s/rollout-drain, which never sees these
# six because nothing queued them into k8s_pending_rollouts. Queueing them there instead is not
# an option: the drain runs at the END of the batch, and "Sync the live Grafana admin password"
# below `kubectl exec`s into deploy/grafana, so it needs the rollout above to have already
# finished. The wait stays; only the pause moves.
- name: Snapshot the telemetry workloads' restart counts for the end-of-play gate
  tags: [deploy]
  # AFTER the wait above, never before. Reading restart counts while the old pod is still
  # terminating captures the OUTGOING pod's counts, and its replacement starts at zero — so the
  # gate's `after <= before` comparison would pass no matter what happened. Same reasoning, and
  # the same trap, as the snapshot task in roles/k8s/rollout-drain.
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n {{ k8s_observability_namespace }} get pods
      -l app={{ item.name }}
      -o jsonpath={.items[*].status.containerStatuses[*].restartCount}
  loop: "{{ claude_otel_stabilise_workloads }}"
  loop_control:
    label: "{{ item.name }}"
  register: claude_otel_restarts_before
  become: true
  changed_when: false
  when:
    - manifests_render is changed or manifests_secret_render is changed
    - not ansible_check_mode

- name: Fail if a telemetry pod selector matched no pods
  tags: [deploy]
  # Carried over from assert_stable.yml, and it is the one way this gate could go quietly
  # false-green: a selector matching nothing reports zero restarts and passes every comparison.
  # All six carry the repo-wide `app: <workload-name>` label; assert it rather than assume it.
  ansible.builtin.assert:
    that: item.stdout | trim | length > 0
    fail_msg: >-
      No pods matched `-l app={{ item.item.name }}` in namespace
      {{ k8s_observability_namespace }}, so the stabilisation gate has nothing to watch.
      Either the workload sets a different pod label than `app: {{ item.item.name }}`,
      or it has no pods at all.
    quiet: true
  # The producer above is gated on `manifests_render is changed or manifests_secret_render is
  # changed`. A SKIPPED task still sets the variable it registers to — to a result carrying
  # `skipped: true` and NO `stdout` key — so on any deploy that changes something other than
  # the manifests (a dashboards-only change is the common one) every entry here is a skip
  # result and `item.stdout` raises "object of type 'dict' has no attribute 'stdout'". Filter
  # to what the producer actually ran rather than mirroring its `when:`, so a partial skip
  # still asserts over the entries that did produce output.
  loop: "{{ claude_otel_restarts_before.results | default([]) | rejectattr('skipped', 'defined') | list }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: not ansible_check_mode

- name: Hand the telemetry workloads to the end-of-play stabilisation gate
  tags: [deploy]
  # noqa var-naming[no-role-prefix] — k8s_stabilise_watch is play-scoped by design, an
  # accumulator post_tasks/k8s_stabilise_gate.yml drains. Same reasoning as k8s_pending_rollouts
  # in roles/k8s/manifests.
  #
  # `namespace` is carried per entry because the gate reads it per item — these six are the only
  # workloads in the run that do not live in k8s_namespace.
  ansible.builtin.set_fact:
    k8s_stabilise_watch: >-
      {{ (k8s_stabilise_watch | default([]))
         + [{
              'name': item.item.name,
              'namespace': k8s_observability_namespace,
              'kind': item.item.kind,
              'restarts_before': item.stdout,
            }] }}
  # Same skipped-register filter as the assert above, and for the same reason: `item.stdout`
  # does not exist on a skip result. Without it this task fails identically once the assert
  # stops failing first.
  loop: "{{ claude_otel_restarts_before.results | default([]) | rejectattr('skipped', 'defined') | list }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: not ansible_check_mode

# GF_SECURITY_ADMIN_PASSWORD (the grafana-admin Secret) is only consulted when Grafana
# initialises its database, so on an existing install a rotated grafana_admin_password
# never reaches the live admin user — SOPS and the actual login diverge silently. Same
# fix the retired Docker grafana role carried: `grafana cli admin reset-admin-password`
# writes straight to the DB and needs no knowledge of the CURRENT password. Gated on the
# secret render changing (also fires on a scrape-credentials rotation — harmless, it
# re-sets the same password); retries because a freshly-rolled Grafana is still running
# its schema migrations for a few seconds.
- name: Sync the live Grafana admin password with SOPS # noqa no-handler
  tags: [deploy]
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n {{ k8s_observability_namespace }} exec deploy/grafana --
      grafana cli admin reset-admin-password {{ grafana_admin_password }}
  become: true
  # NOT under --check, unlike the read-only probe below: this resets a live credential. It is
  # also latently broken there — check mode skips the command, so `rc` is undefined, the
  # `until` below can never match, and the run would die after 5 retries. That only stays
  # hidden while the secret happens not to differ, which is the condition guarding it.
  when: manifests_secret_render is changed and not ansible_check_mode
  register: claude_otel_admin_password_sync
  until: (claude_otel_admin_password_sync.rc | default(1)) == 0
  retries: 5
  delay: 10
  changed_when: (claude_otel_admin_password_sync.rc | default(1)) == 0
  no_log: true

- name: Read back the OTLP listener's bind address
  tags: [deploy]
  # The one property that cannot be inferred from a green rollout. hostPort/hostIP is what
  # makes the collector reachable from the HOST (Claude Code is not a container), and a
  # missing hostIP would silently bind 0.0.0.0 — publishing a receiver that carries prompts
  # and responses verbatim to the whole LAN. Assert it rather than trust the manifest.
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n {{ k8s_observability_namespace }} get daemonset otel-collector
      -o jsonpath={.spec.template.spec.containers[0].ports[0].hostIP}
  register: claude_otel_bind
  become: true
  changed_when: false
  # Runs under --check too: this only reads. Skipped, it leaves stdout empty and the assert
  # below fails the run — losing exactly the check that keeps a prompt-carrying receiver off
  # the LAN, on the one mode where you most want it evaluated before touching anything.
  check_mode: false

- name: Fail if the OTLP receiver is not pinned to loopback
  tags: [deploy]
  ansible.builtin.assert:
    that: claude_otel_bind.stdout == claude_otel_otlp_host_ip
    fail_msg: >-
      OTLP receiver is bound to '{{ claude_otel_bind.stdout | default('(unset)') }}',
      expected '{{ claude_otel_otlp_host_ip }}'. With content logging enabled this
      receiver must not be reachable off the node.
    quiet: true

- name: Deploy the telemetry-stack heartbeat
  tags: [cron]
  # Runs as {{ sys_user }}, not root: it reads the cluster through that user's read-only
  # kubeconfig, which is the whole point — the cron cannot mutate anything.
  ansible.builtin.template:
    src: telemetry-health.sh.j2
    dest: /usr/local/bin/claude-otel-health.sh
    mode: "0755"
    owner: root
    group: root
  become: true
  no_log: true  # renders the Kuma push token

- name: Schedule the telemetry-stack heartbeat
  tags: [cron]
  ansible.builtin.cron:
    name: "Claude Code telemetry health"
    minute: "{{ claude_otel_health_cron_minute }}"
    user: "{{ sys_user }}"
    job: "/usr/local/bin/claude-otel-health.sh"
    cron_file: claude-otel-health
  become: true
