---
# The Claude Code telemetry stack: collector + Loki + Prometheus (slice 1), Grafana behind
# Authelia (slice 2), Tempo + the traces pipeline (slice 3).

- name: Render and apply the Claude Code telemetry manifests
  ansible.builtin.include_role:
    name: k8s/manifests
  vars:
    manifests_service: claude-otel
    manifests_files:
      - 00-namespace.yaml
      - collector.yaml
      - loki.yaml
      - prometheus.yaml
      # After prometheus.yaml: that file now carries the ServiceAccount/ClusterRole the
      # cadvisor discovery needs, and kube-state-metrics is a scrape target of it.
      - kube-state-metrics.yaml
      - tempo.yaml
      - middlewares.yaml
      - grafana.yaml
      - grafana-dashboard.yaml
      - ingressroute.yaml
      # Must follow middlewares.yaml — it references the `rate-limit` Middleware, which
      # Traefik will not resolve across namespaces.
      - prometheus-ingressroute.yaml
    manifests_secret_files:
      - grafana-secret.yaml
    # The shared role waits on ONE Deployment in {{ k8s_namespace }}; this role has three,
    # in a different namespace. Skip its wait and roll our own below.
    manifests_rollout: ''

- name: Restart the telemetry workloads after a config change
  tags: [deploy]
  # `manifests_rollout: ''` above skips the shared role's WAIT, and skipping it also skips
  # its rollout-restart — so without this a ConfigMap edit applies to the object, reports
  # changed, and never reaches the running pod. Caught on the first config edit: the
  # collector kept serving the previous config with the deploy fully green.
  #
  # Skipped for a Deployment this run created — its pods are already on the new config, and
  # `rollout restart` races the initial rollout.
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n {{ k8s_observability_namespace }} rollout restart deploy/{{ item }}
  loop:
    - loki
    - prometheus
    - kube-state-metrics
    - tempo
    - otel-collector
    - grafana
  become: true
  changed_when: true
  when:
    - manifests_render is changed or manifests_secret_render is changed
    - not manifests_apply.stdout is search('deployment.apps/' ~ item ~ ' created')

- name: Wait for the telemetry workloads to roll out
  tags: [deploy]
  # Loki first: the collector's log pipeline exports to it, and a collector that starts
  # against a missing Loki logs export failures until it happens to retry successfully.
  # Ordering here makes the first-deploy logs readable rather than alarming.
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n {{ k8s_observability_namespace }} rollout status
      deploy/{{ item }} --timeout=300s
  loop:
    - loki
    - prometheus
    - kube-state-metrics
    - tempo
    - otel-collector
    - grafana
  become: true
  changed_when: false

- name: Read back the OTLP listener's bind address
  tags: [deploy]
  # The one property that cannot be inferred from a green rollout. hostPort/hostIP is what
  # makes the collector reachable from the HOST (Claude Code is not a container), and a
  # missing hostIP would silently bind 0.0.0.0 — publishing a receiver that carries prompts
  # and responses verbatim to the whole LAN. Assert it rather than trust the manifest.
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n {{ k8s_observability_namespace }} get deploy otel-collector
      -o jsonpath={.spec.template.spec.containers[0].ports[0].hostIP}
  register: claude_otel_bind
  become: true
  changed_when: false

- name: Fail if the OTLP receiver is not pinned to loopback
  tags: [deploy]
  ansible.builtin.assert:
    that: claude_otel_bind.stdout == claude_otel_otlp_host_ip
    fail_msg: >-
      OTLP receiver is bound to '{{ claude_otel_bind.stdout | default('(unset)') }}',
      expected '{{ claude_otel_otlp_host_ip }}'. With content logging enabled this
      receiver must not be reachable off the node.
    quiet: true

- name: Deploy the telemetry-stack heartbeat
  tags: [cron]
  # Runs as {{ sys_user }}, not root: it reads the cluster through that user's read-only
  # kubeconfig, which is the whole point — the cron cannot mutate anything.
  ansible.builtin.template:
    src: telemetry-health.sh.j2
    dest: /usr/local/bin/claude-otel-health.sh
    mode: "0755"
    owner: root
    group: root
  become: true
  no_log: true  # renders the Kuma push token

- name: Schedule the telemetry-stack heartbeat
  tags: [cron]
  ansible.builtin.cron:
    name: "Claude Code telemetry health"
    minute: "{{ claude_otel_health_cron_minute }}"
    user: "{{ sys_user }}"
    job: "/usr/local/bin/claude-otel-health.sh"
    cron_file: claude-otel-health
  become: true
