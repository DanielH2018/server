---
# Ports daniel-server's Grafana dashboards into the cluster Grafana (slice 3, B4).
#
# The JSON is NOT copied into this role. roles/k8s/claude-otel/files/dashboards stays the one
# source of truth and both Grafanas mount the same files, so a board edited for one is not
# silently stale in the other — a second copy is how the two Claude Code boards diverged in the
# first place (see claude_otel_dashboard_folders for why `AI` is excluded).
#
# Built with `kubectl create configmap --from-file --dry-run=client` rather than a Jinja template.
# The role's other ConfigMap (grafana-dashboard.yaml.j2) inlines its JSON in a raw block, and that
# does not scale here: ~730 KB across sixteen files, none of which contains any Jinja to render.
# Generating the YAML instead keeps the dashboards as dashboards and leaves nothing to escape.
#
# Applied SERVER-SIDE, in their own directory, deliberately kept out of the one the manifests role
# applies. Client-side `kubectl apply` records the whole object in the
# kubectl.kubernetes.io/last-applied-configuration annotation, and annotations are capped at
# 262144 bytes — so the first attempt failed with:
#
#   The ConfigMap "grafana-dashboards-infrastructure" is invalid:
#   metadata.annotations: Too long: may not be more than 262144 bytes
#
# The cap is on the ANNOTATION, not the ConfigMap (1 MiB), so splitting the folder further does not
# help: node-exporter-full.json is 442 KB on its own and would breach it alone. Server-side apply
# does not write that annotation at all, which is precisely the problem it was introduced to solve.
# Scoped to these objects rather than switching the shared manifests role wholesale — every other
# manifest in this repo is small and client-side apply is fine for them.

- name: Create the directories for the dashboard ConfigMap manifests
  tags: [config]
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0700"
    owner: root
    group: root
  loop:
    - /etc/rancher/k3s/manifests/claude-otel
    - /etc/rancher/k3s/dashboard-manifests
    # The injector's output tree. Created here rather than left to the script so its
    # ownership and mode match every other node-side directory this role writes.
    - /etc/rancher/k3s/dashboards-annotated
  become: true

- name: Remove dashboard ConfigMaps from the client-side apply directory
  tags: [config]
  # They were briefly written here, where the manifests role's client-side `apply -f <dir>/` picks
  # up everything present — which is exactly what hit the annotation cap. Leaving one behind fails
  # every subsequent deploy of this role, so the removal has to be explicit rather than implied by
  # the new path.
  ansible.builtin.file:
    path: "/etc/rancher/k3s/manifests/claude-otel/grafana-dashboards-{{ item | lower }}.yaml"
    state: absent
  loop: "{{ claude_otel_dashboard_folders }}"
  become: true

- name: Remove the retired vendored Claude Code dashboard manifest
  tags: [config]
  # The manifests role applies its whole directory, so dropping a file from `manifests_files`
  # only stops it being RE-RENDERED — the previously written copy keeps getting applied on every
  # deploy, forever. The vendored grafana-dashboard.yaml is gone (its board is now the shared
  # AI/claude-code.json), so the file and the object it created both have to be removed
  # explicitly rather than merely un-listed.
  ansible.builtin.file:
    path: /etc/rancher/k3s/manifests/claude-otel/grafana-dashboard.yaml
    state: absent
  become: true

- name: Remove the retired vendored Claude Code dashboard ConfigMap
  tags: [deploy]
  ansible.builtin.command:
    cmd: >-
      k3s kubectl delete configmap grafana-dashboards
      --namespace {{ k8s_observability_namespace }} --ignore-not-found
  become: true
  register: claude_otel_vendored_cm_removed
  changed_when: "'deleted' in claude_otel_vendored_cm_removed.stdout"

- name: Stage the shared Grafana dashboards on the node
  tags: [config]
  ansible.builtin.copy:
    # Every folder is role-owned now: `AI` since D7, the rest since the Docker Grafana role
    # was retired and its shared tree moved into this role's files/.
    src: "dashboards/{{ item }}/"
    dest: "/etc/rancher/k3s/dashboards/{{ item }}/"
    mode: "0644"
    owner: root
    group: root
  loop: "{{ claude_otel_dashboard_folders }}"
  become: true
  register: claude_otel_dashboards_staged

# `copy` with a directory source never deletes anything at the destination, so a dashboard removed
# or RENAMED in the repo leaves its old file here forever — and the ConfigMap below is built
# `--from-file` this tree, so the retired board keeps being provisioned. Exactly the failure the
# vendored-manifest task above already describes: dropping a file from the source "only stops it
# being RE-RENDERED".
#
# `backups.json` was renamed to `backups-b2-usage.json` and the original survived here, so BOTH
# were live. Retiring the renamed file on 2026-08-28 left the original still provisioning the
# identical dead board, with every repo-side check green.
- name: Find the staged dashboards that no longer exist in the role
  tags: [config]
  ansible.builtin.find:
    paths: "/etc/rancher/k3s/dashboards/{{ item }}"
    patterns: "*.json"
  loop: "{{ claude_otel_dashboard_folders }}"
  become: true
  changed_when: false
  register: claude_otel_staged_found

- name: Build the staged paths the role's own files justify
  tags: [config]
  ansible.builtin.set_fact:
    claude_otel_valid_staged: >-
      {{ claude_otel_valid_staged | default([]) + (
         lookup('ansible.builtin.fileglob', role_path ~ '/files/dashboards/' ~ item ~ '/*.json', wantlist=True)
         | map('basename')
         | map('regex_replace', '^', '/etc/rancher/k3s/dashboards/' ~ item ~ '/')
         | list) }}
  loop: "{{ claude_otel_dashboard_folders }}"

- name: Remove staged dashboards with no file behind them
  tags: [config]
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: >-
    {{ claude_otel_staged_found.results | map(attribute='files') | flatten
       | map(attribute='path') | difference(claude_otel_valid_staged) }}
  become: true

# Grafana has no global annotation setting — the query lives in each dashboard's own JSON, and
# all of these ship an empty annotations list. Injecting here covers every board, present and
# future, from one place instead of sixteen hand-edits that would drift.
#
# Reads the STAGED tree and writes a DERIVED one, deliberately. Editing the staged copy in place
# would make the copy task above see a checksum mismatch next deploy, restore the pristine JSON,
# and the injector would re-inject — `changed` forever, and a Grafana rollout on every deploy.
# The script is a pure function of its input, so this tree is stable when nothing changed.
- name: Inject the deploy-annotation query into the staged dashboards
  tags: [config]
  ansible.builtin.command:
    cmd: >-
      {{ ansible_playbook_python }} {{ playbook_dir }}/../scripts/grafana/inject_dashboard_annotations.py
      --src /etc/rancher/k3s/dashboards
      --dest /etc/rancher/k3s/dashboards-annotated
      --uid {{ claude_otel_loki_homelab_uid }}
      --expr {{ claude_otel_deploy_annotation_expr | quote }}
  become: true
  register: claude_otel_dashboards_annotated
  # The script writes a file only when its content actually differs, so the tree is the honest
  # signal — but the command itself cannot report that. The ConfigMap build below reads this
  # tree and the manifest write after it carries the real changed verdict, exactly as it did
  # before this task existed.
  changed_when: false

# The injector writes a file per input and never removes one, so the annotated tree needs the same
# prune as the staged tree it derives from — otherwise pruning only the staged copy moves the stale
# file one hop down the chain and the ConfigMap, built from THIS directory, is unchanged.
- name: Find the annotated dashboards that no longer have a staged source
  tags: [config]
  ansible.builtin.find:
    paths: "/etc/rancher/k3s/dashboards-annotated/{{ item }}"
    patterns: "*.json"
  loop: "{{ claude_otel_dashboard_folders }}"
  become: true
  changed_when: false
  register: claude_otel_annotated_found

- name: Remove annotated dashboards with no staged source
  tags: [config]
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: >-
    {{ claude_otel_annotated_found.results | map(attribute='files') | flatten
       | map(attribute='path')
       | difference(claude_otel_valid_staged
                    | map('regex_replace', '/dashboards/', '/dashboards-annotated/') | list) }}
  become: true

- name: Build a ConfigMap manifest per dashboard folder
  tags: [config]
  # Generation only — writes nothing and touches no cluster state, hence changed_when: false.
  # The apply that follows (in the manifests role) is what can change anything.
  ansible.builtin.command:
    cmd: >-
      k3s kubectl create configmap grafana-dashboards-{{ item | lower }}
      --namespace {{ k8s_observability_namespace }}
      --from-file=/etc/rancher/k3s/dashboards-annotated/{{ item }}
      --dry-run=client -o yaml
  loop: "{{ claude_otel_dashboard_folders }}"
  become: true
  changed_when: false
  register: claude_otel_dashboard_configmaps

- name: Write the dashboard ConfigMap manifests
  tags: [config]
  ansible.builtin.copy:
    content: "{{ item.stdout }}\n"
    dest: "/etc/rancher/k3s/dashboard-manifests/grafana-dashboards-{{ item.item | lower }}.yaml"
    mode: "0644"
    owner: root
    group: root
  loop: "{{ claude_otel_dashboard_configmaps.results }}"
  loop_control:
    label: "{{ item.item }}"
  become: true
  register: claude_otel_dashboard_manifests

- name: Apply the dashboard ConfigMaps
  tags: [deploy]
  # --force-conflicts because the four folders small enough to succeed on the first (client-side)
  # attempt are already owned by that field manager; server-side apply refuses to take fields from
  # another owner without it. Harmless for the rest — this role is the only writer of these.
  ansible.builtin.command:
    cmd: >-
      k3s kubectl apply --server-side --force-conflicts
      -f /etc/rancher/k3s/dashboard-manifests/
  become: true
  register: claude_otel_dashboards_applied
  # Server-side apply prints `serverside-applied` for every object whether or not it changed
  # anything, so its output cannot be read for a changed verdict the way the client-side apply's
  # created/configured/unchanged can. The manifest write above is the honest signal: these
  # ConfigMaps' contents change exactly when the files generated from the dashboard JSON change.
  # The apply itself still runs unconditionally, so drift is corrected either way — this only
  # governs what gets REPORTED as changed.
  changed_when: claude_otel_dashboard_manifests is changed

# ── prune keys the apply above cannot remove ──────────────────────────────────────────────────
# A BACKSTOP, not the fix. The stale `backups.json` key was caused by the two derived trees never
# being pruned (see the two prune pairs above) — the ConfigMap was rebuilt `--from-file` a directory
# that still held the file, so the key was regenerated legitimately every run. This task was written
# first on the theory that server-side apply could not drop a key owned by the old
# `kubectl-client-side-apply` manager; that theory was wrong, and this task was inert on its own,
# skipping because the live keys and the annotated tree agreed with each other.
#
# It earns its place anyway: SSA prunes a field only when the same manager owns it, so if a key ever
# IS orphaned — a hand-applied board, a manager change — the tree prunes above cannot see it, since
# they only compare files to files. Keeping it means the two failure modes have one owner each
# rather than a shared assumption. It writes nothing when the sets agree, which is the normal case.
- name: Read the live dashboard ConfigMap keys
  tags: [deploy]
  ansible.builtin.command:
    cmd: >-
      k3s kubectl get configmap grafana-dashboards-{{ item | lower }}
      --namespace {{ k8s_observability_namespace }}
      --ignore-not-found -o jsonpath={.data}
  loop: "{{ claude_otel_dashboard_folders }}"
  become: true
  changed_when: false
  register: claude_otel_dashboard_live_keys

- name: Find the dashboard files each ConfigMap should carry
  tags: [deploy]
  ansible.builtin.find:
    paths: "/etc/rancher/k3s/dashboards-annotated/{{ item }}"
    patterns: "*.json"
  loop: "{{ claude_otel_dashboard_folders }}"
  become: true
  register: claude_otel_dashboard_source_files

# A merge patch setting each stale key to null, which is how a strategic/merge patch deletes a map
# entry. Skipped entirely when the difference is empty, so a clean cluster issues no write and
# reports unchanged — the normal case, and the reason this is safe to run on every deploy.
- name: Remove dashboard keys with no file behind them
  tags: [deploy]
  vars:
    live_keys: "{{ (claude_otel_dashboard_live_keys.results[idx].stdout | default('{}', true) | from_json).keys() | list }}"
    want_keys: "{{ claude_otel_dashboard_source_files.results[idx].files | map(attribute='path') | map('basename') | list }}"
    stale_keys: "{{ live_keys | difference(want_keys) }}"
  ansible.builtin.command:
    cmd: >-
      k3s kubectl patch configmap grafana-dashboards-{{ item | lower }}
      --namespace {{ k8s_observability_namespace }} --type=merge
      -p {{ {'data': dict(stale_keys | zip([None] * (stale_keys | length)))} | to_json | quote }}
  loop: "{{ claude_otel_dashboard_folders }}"
  loop_control:
    index_var: idx
    label: "{{ item }}: {{ stale_keys | join(', ') | default('nothing stale', true) }}"
  become: true
  when: stale_keys | length > 0
  changed_when: true
