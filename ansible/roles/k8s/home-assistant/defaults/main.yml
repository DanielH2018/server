---
# DOCKER_MODS rides along (HACS).
home_assistant_k8s_image: lscr.io/linuxserver/homeassistant:2026.10.2-ls257@sha256:38ca271323058a45cefa5829d58a15761df669f598862ae084d41e0a11d211d2

# The budget of the home-assistant-prepull Kustomization, whose Job pulls this role's images onto
# its node before the home-assistant Kustomization applies
# (scripts/renderer/renderer_lib/prepull.py). The Deployment is `Recreate`, so without it the old
# pod stops before the new pod's pull starts, and HA is down for the whole pull. With it, the old
# pod keeps serving while the image arrives. MEASURED 2026-10-22 (#5855): the pinned amd64 image
# is 720.85 MB compressed, and GHCR, which serves lscr.io, has served this homelab at 0.145-0.53
# MB/s. 4500s, code-server's budget, covers a full re-pull down to 0.16 MB/s. The Job has no
# deadline, so a pull slower still costs that revision its verdict, the Job keeps pulling, and
# Flux applies home-assistant on a later retry. Only Flux reads it: the renderer adds the
# Kustomization for a published tag alone, so an Ansible deploy ignores it.
flux_prepull_timeout: 4500s  # noqa var-naming[no-role-prefix]

# Auto-deploy stance — read by gitops_deploy (see the k8s auto-deploy coverage design).
# Migrating state — the sharpest case in the fleet: strategy is Recreate and the config volume
# is a ReadWriteOnce `k8s_claims` entry below, so a bad image swap can migrate
# the volume before the gate observes a fault and then fail the rollback redeploy against data
# it can no longer read. The linuxserver -lsNN scheme makes a breaking bump read as a MINOR
# (2026.6.3 -> 2026.7.0), so semver-based auto-merge policy would not even flag it as risky.
# Flux's home-assistant-snapshot Job snapshots the claim below before each revision applies. A failed
# revision that changes home-assistant writes the stateful hold without a reset, and the operator
# reverts the claim through docs/volume-snapshot-drills.md, so a bad swap can be
# reverted instead of leaving the .storage device/entity registries unreadable by the old image.
k8s_autodeploy: true  # noqa var-naming[no-role-prefix]
k8s_autodeploy_reason: "migrating state — Recreate + RWO PVC, protected by the home-assistant-snapshot Job before each revision and an operator revert to it after a failed one; -lsNN versioning still hides a breaking bump as a MINOR. WEIGHED: a companion-app long-lived token minted after the snapshot is invalidated by a revert, forcing that device to re-auth"  # noqa var-naming[no-role-prefix]
# The claim snapshotted before each revision applies. Under Flux the renderer turns this
# list into the home-assistant-snapshot Kustomization, whose Job snapshots it before home-assistant applies
# (D5.2a). After a handback, k8s/manifests takes the same snapshot through k8s/volume-snapshot.
# The snapshot is the recovery point this role's auto-deploy depends on.
k8s_autodeploy_snapshot_pvcs: [home-assistant-config]  # noqa var-naming[no-role-prefix]

# The manifests whose Secret holds a multi-line key, which no Flux placeholder can carry. A
# placeholder render (scripts/renderer, target slice R2) leaves each out, and D3 ships it as a
# SOPS-encrypted manifest instead. Ansible renders and applies it like any other secret file.
# `sops-manifest-entries` in scripts/renderer/renderer_lib/secret_checks.py holds each entry
# to one Secret of `SOPS_MANIFEST_KEYS` keys.
render_sops_manifests: [google-sa-secret.yaml]  # noqa var-naming[no-role-prefix]

# The LSIO image has no `install`; the config-install initContainer needs alpine instead.
# Same init image peanut and zigbee2mqtt use.
home_assistant_k8s_init_image: alpine:3.24@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6

# The four lists below name every file the ConfigMaps carry into the pod, one list per tree
# under files/. Each is the single source of what ships: configmap.yaml.j2 loops over it, the
# init container installs whatever the ConfigMap holds, and `validate_ha_config.py` fails the
# prek hook when a list and its directory disagree. Listed rather than globbed because a glob
# that shipped nothing would surface only as missing automations at runtime. A new file is
# added to its list and nowhere else.
#
# files/*.yaml, installed at the root of /config: configuration.yaml and the files it pulls
# in by name. The root is not swept on install (the PVC's own files live there), so removing
# a name here leaves the old copy on the PVC until it is deleted by hand.
home_assistant_root_files:
  - configuration.yaml
  - customize.yaml
  - ui-lovelace.yaml
  - input_boolean.yaml
  - input_select.yaml
  - input_number.yaml
  - input_datetime.yaml
  - timer.yaml
  - thresholds.yaml
  - scenes.yaml
  - templates.yaml
  - rest.yaml

# files/automations/*.yaml, one file per topic, merged into the `automation:` list by
# `!include_dir_merge_list automations/` in configuration.yaml.
home_assistant_automation_files:
  - alerts.yaml
  - display.yaml
  - fan-and-air.yaml
  - lighting.yaml
  - presence.yaml
  - system.yaml
  - wake-and-sleep.yaml

# files/custom_templates/*.jinja, the shared Jinja macros. This is what makes "a new .jinja
# ships automatically" true — the file only has to be listed here.
home_assistant_template_files:
  - diagnostics.jinja
  - fan.jinja
  - lighting.jinja
  - ventilation.jinja

# files/scripts/*.yaml, the same shape for scripts: one file per topic, merged into the
# `script:` mapping by `!include_dir_merge_named scripts/`.
home_assistant_script_files:
  - alerts.yaml
  - fan.yaml
  - lighting.yaml
  - test-harness.yaml
  - wake-and-sleep.yaml

# Memory limit 2Gi: across 9 pod generations the working set ran 949Mi-1414Mi, with the
# peak pod at 1387Mi. 2Gi puts steady state near 65% and leaves room for recorder growth.
# Don't trim the recorder further to buy headroom; purge_keep_days is already 7.
home_assistant_k8s_cpu_limit: "1"
home_assistant_k8s_mem_limit: 2Gi
home_assistant_k8s_cpu_request: "100m"
home_assistant_k8s_mem_request: 256Mi

# 140 M at planning (71 M of it the recorder SQLite); sized for recorder growth. `longhorn`
# (backed up): .storage carries the device/entity registries — the highest-value,
# hardest-to-rebuild tree in the homelab, per the kopia restore-drill's own comment.
home_assistant_k8s_claim: home-assistant-config
home_assistant_k8s_storage_class: longhorn
home_assistant_k8s_size: 4Gi

# The claims the renderer emits for this role. The home-assistant Kustomization applies them after
# the home-assistant-snapshot Job; after a handback, k8s/manifests applies them ahead of the
# pre-apply snapshot.
k8s_claims:  # noqa var-naming[no-role-prefix]
  - name: "{{ home_assistant_k8s_claim }}"
    storage_class: "{{ home_assistant_k8s_storage_class }}"
    size: "{{ home_assistant_k8s_size }}"
