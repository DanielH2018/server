---
# Same image the Docker role runs — both copies stay on the same tag through coexistence so a
# difference in behaviour between them is never the image. DOCKER_MODS rides along (HACS);
# whether the mod layer applies under containerd is a B3 gate, checked at first boot.
home_assistant_k8s_image: lscr.io/linuxserver/homeassistant:2026.6.3-ls221

# Auto-deploy stance — read by gitops_deploy (see the k8s auto-deploy coverage design).
# Migrating state — the sharpest case in the fleet: strategy is Recreate and the config volume
# is seeded through k8s/volume-claim (hardcoded ReadWriteOnce), so a bad image swap can migrate
# the volume before the gate observes a fault and then fail the rollback redeploy against data
# it can no longer read. The linuxserver -lsNN scheme makes a breaking bump read as a MINOR
# (2026.6.3 -> 2026.7.0), so semver-based auto-merge policy would not even flag it as risky.
# Promoted in slice 7b (2026-08-21): k8s/manifests now takes a pre-apply Longhorn snapshot of
# the claim below and reverts it if the deploy fails, so a bad swap reverts to the snapshot
# instead of leaving the .storage device/entity registries unreadable by the old image.
k8s_autodeploy: true  # noqa var-naming[no-role-prefix]
k8s_autodeploy_reason: "migrating state — Recreate + RWO volume-claim PVC, now protected by the pre-apply Longhorn snapshot and revert; -lsNN versioning still hides a breaking bump as a MINOR. WEIGHED: a companion-app long-lived token minted after the snapshot is invalidated by a revert, forcing that device to re-auth"  # noqa var-naming[no-role-prefix]
# Slice 7a task 3 — the pre-apply Longhorn snapshot k8s/manifests takes via k8s/volume-snapshot.
# Declared regardless of k8s_autodeploy: protects a manual deploy the same way it would an
# auto-deploy, and slice 7b's revert is what this role's auto-deploy now depends on.
k8s_autodeploy_snapshot_pvcs: [home-assistant-config]  # noqa var-naming[no-role-prefix]

# The LSIO image has no `install`; the config-install initContainer needs alpine instead.
# Same init image peanut and zigbee2mqtt use.
home_assistant_k8s_init_image: alpine:3.24@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b

# Mirrors resources('1.0', '1536M', '0.10', '256M') in the compose template, except the memory
# limit. Raised 1536Mi -> 2Gi on 2026-08-16: over the preceding week and 9 pod generations the
# working set ran 949Mi-1414Mi, i.e. 62-92% of the old limit, with the then-current pod peaking
# at 1387Mi (90.3%). No OOMKill ever fired — `kube_pod_container_status_last_terminated_reason`
# returned no data at all — so 1536Mi had held, but with no deliberate margin and no documented
# rationale for the figure. 2Gi puts steady state near 65% and leaves room for recorder growth.
# Don't trim the recorder further to buy headroom; purge_keep_days is already 7.
home_assistant_k8s_cpu_limit: "1"
home_assistant_k8s_mem_limit: 2Gi
home_assistant_k8s_cpu_request: "100m"
home_assistant_k8s_mem_request: 256Mi

# 140 M at planning (71 M of it the recorder SQLite); sized for recorder growth. `longhorn`
# (backed up): .storage carries the device/entity registries — the highest-value,
# hardest-to-rebuild tree in the homelab, per the kopia restore-drill's own comment.
home_assistant_k8s_claim: home-assistant-config
home_assistant_k8s_storage_class: longhorn
home_assistant_k8s_size: 4Gi
