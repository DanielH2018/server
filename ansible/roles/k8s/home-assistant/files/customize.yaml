# Managed by Ansible (roles/k8s/home-assistant). Entity friendly-name + icon overrides.
# `customize:` applies because these entities are not renamed in HA's UI entity registry
# (a UI rename would take precedence). Names are neutral — add room prefixes if you like.
sensor.apc_ups_battery_charge:
  friendly_name: UPS Battery
  icon: mdi:battery-charging
sensor.apc_ups_load:
  friendly_name: UPS Load
  icon: mdi:gauge
sensor.apc_ups_battery_runtime:
  friendly_name: UPS Runtime
  icon: mdi:timer-outline
sensor.apc_ups_input_voltage:
  friendly_name: UPS Input Voltage
  icon: mdi:flash
sensor.apc_ups_status:
  friendly_name: UPS Status
  icon: mdi:power-plug
fan.tower_fan:
  friendly_name: Tower Fan
  icon: mdi:fan
sensor.tower_fan_temperature:
  friendly_name: Fan Temperature
binary_sensor.aqara_fp300_presence:
  friendly_name: Presence
  icon: mdi:motion-sensor
binary_sensor.aqara_fp300_pir_detection:
  friendly_name: PIR Detection
sensor.aqara_fp300_illuminance:
  friendly_name: Illuminance
# Aqara T1 (GZCGQ11LM), added 2026-08-31 — a dedicated ambient illuminance sensor mounted clear
# of the bedroom bulbs. Deliberately NOT `Illuminance`: the FP300 above already owns that name,
# and two entities sharing a display name is unreadable on a dashboard. "Ambient" is the whole
# distinction between them — see docs/lighting-and-presence.md.
sensor.aqara_t1_illuminance:
  friendly_name: Ambient Illuminance
sensor.aqara_fp300_temperature:
  friendly_name: Temperature
sensor.aqara_fp300_humidity:
  friendly_name: Humidity
# Sonoff SNZB-04 contact sensor. Z2M maps the contact cluster to device_class: door for every
# SNZB-04, and it is mounted on a window here, so override it. `window` renders the same
# Open/Closed states with a window icon and the right voice-assistant phrasing.
binary_sensor.window_sensor_contact:
  device_class: window
