---
# Slice 5, B3 — built ahead of the cutover window, held by the enabled flag (see defaults).


- name: Create the home-assistant config volume claim
  tags: [deploy]
  ansible.builtin.include_role:
    name: k8s/volume-claim
  vars:
    volume_claim_service: home-assistant
    volume_claim_name: "{{ home_assistant_k8s_claim }}"
    volume_claim_storage_class: "{{ home_assistant_k8s_storage_class }}"
    volume_claim_size: "{{ home_assistant_k8s_size }}"

- name: Deploy home-assistant to the cluster
  ansible.builtin.include_role:
    name: k8s/manifests
  vars:
    manifests_service: home-assistant
    manifests_rollout: home-assistant
    manifests_files:
      - configmap.yaml
      - deployment.yaml
      - service.yaml
      - ingressroute.yaml
    manifests_secret_files:
      - secret.yaml
