---

# The config claim is a `k8s_claims` entry in defaults/main.yml, which k8s/manifests renders and
# applies ahead of the workload (#3387).
- name: Deploy home-assistant to the cluster
  ansible.builtin.include_role:
    name: k8s/manifests
  vars:
    manifests_service: home-assistant
    # Live prune: an object dropped from manifests_files is deleted on the next deploy (#3388).
    manifests_prune: true
    manifests_rollout: home-assistant
    manifests_files:
      - configmap.yaml
      - deployment.yaml
      - service.yaml
      - ingressroute.yaml
    manifests_secret_files:
      - secret.yaml
