---
# Navidrome: one Deployment, one Longhorn claim, one Authelia-gated route.
#
# The claim is `k8s_claims` in defaults/main.yml, which k8s/manifests renders and applies
# ahead of the workload (#3387).
- name: Deploy navidrome to the cluster
  ansible.builtin.include_role:
    name: k8s/manifests
