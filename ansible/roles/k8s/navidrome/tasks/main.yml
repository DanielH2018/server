---
# Navidrome: one Deployment, one Longhorn claim, one Authelia-gated route.
#
# The claim is `k8s_claims` in defaults/main.yml, which k8s/manifests renders and applies
# ahead of the workload (#3387).
- name: Deploy navidrome to the cluster
  ansible.builtin.include_role:
    name: k8s/manifests
  vars:
    manifests_service: navidrome
    # The route is listed only while the workload has pods (see templates/ingressroute.yaml.j2).
    # Parking the workload drops the name, and the prune deletes the live IngressRoute.
    manifests_files: >-
      {{ ['deployment.yaml', 'service.yaml']
         + (['ingressroute.yaml'] if navidrome_k8s_replicas | int > 0 else []) }}
