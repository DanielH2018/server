---
# Navidrome — Subsonic-compatible music server.
#
# Pinned tag@sha256 rather than a bare digest: the k8s-images Renovate manager keys on
# `_image:` in this file and needs the tag to read a version stream, and a bare repo@sha256
# would freeze the pin with no update signal (same reasoning as texbrain_k8s_image).
navidrome_k8s_image: ghcr.io/navidrome/navidrome:0.64.2@sha256:38dc2727bfcfd5ede290f8ada114fc90368146f265ae4701ddddbcbe2a44ee52

# Renovate stance: whether an image bump here may automerge. `promote` deploys what merges.
# A bump can migrate the SQLite index on the Recreate + RWO claim below, so the
# navidrome-snapshot Job snapshots it before each revision applies, as radarr's does.
k8s_autodeploy: true
k8s_autodeploy_reason: "migrating state — Recreate + RWO PVC holding the SQLite index, protected by the navidrome-snapshot Job before each revision and an operator revert to it after a failed one. WEIGHED: navidrome also mounts media-data read-only, which a revert never touches; a rewound index only rescans the library"
k8s_autodeploy_snapshot_pvcs: [navidrome-data]
# Mounted, never reverted: the library on the shared media volume, read-only here.
k8s_autodeploy_unreverted_claims: [media-data]

# Declarative rather than a live `kubectl scale`: Flux's drift correction resets a live scale
# to the rendered `replicas`, and the read-only ServiceAccount cannot scale anything anyway.
# Zero parks the role: the route drops out of `manifests_files` below, but the snapshot
# declaration above must go with it (test_every_snapshot_role_restores_its_own_replicas).
navidrome_k8s_replicas: 1

# The image's own entrypoint runs as root. Run it as the fleet's ubuntu uid instead, so the
# Longhorn volume's files are owned by the same user everything else here writes as.
navidrome_k8s_uid: 1000

# The library: `media/music` on the shared media volume, mounted read-only at this path.
# daniel-box's homelab-media-volume tmpfiles line creates the directory.
navidrome_k8s_music_dir: /music
navidrome_k8s_media_claim: media-data
navidrome_k8s_media_subpath: media/music

# SQLite index plus the transcoding cache. 2Gi is headroom, not a measurement: the library
# started empty, so there was nothing to size against.
navidrome_k8s_claim: navidrome-data
navidrome_k8s_storage_class: longhorn
navidrome_k8s_size: 2Gi

navidrome_k8s_cpu_limit: "1"
navidrome_k8s_mem_limit: 512Mi
navidrome_k8s_cpu_request: "50m"
navidrome_k8s_mem_request: 64Mi

# The claim the renderer emits for this role, which the navidrome Kustomization applies (#3387).
k8s_claims:
  - name: "{{ navidrome_k8s_claim }}"
    storage_class: "{{ navidrome_k8s_storage_class }}"
    size: "{{ navidrome_k8s_size }}"

# The route is listed only while the workload has pods (see templates/ingressroute.yaml.j2).
# Parking the workload drops the name, and the prune deletes the live IngressRoute.
manifests_files: >-
  {{ ['deployment.yaml', 'service.yaml']
     + (['ingressroute.yaml'] if navidrome_k8s_replicas | int > 0 else []) }}
