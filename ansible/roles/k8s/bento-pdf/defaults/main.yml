---
# Tag KEPT alongside the digest (repo:latest@sha256) so Renovate's k8s-defaults manager still
# tracks it for digest-bump PRs — a bare repo@sha256 would freeze it with zero update signal.
bento_pdf_k8s_image: ghcr.io/alam00000/bentopdf:latest@sha256:039239902a01e58a5a0f52e29039fafa18ffc2a481bb8acd807599f1c6dde7ef

# Auto-deploy stance — read by gitops_deploy (see the k8s auto-deploy coverage design).
# Stateless: RollingUpdate Deployment, no PVC, readinessProbe on the only Deployment, and the
# image is digest-pinned rather than a mutable tag.
k8s_autodeploy: true  # noqa var-naming[no-role-prefix]
k8s_autodeploy_reason: "stateless RollingUpdate Deployment, no PVC, readinessProbe, digest-pinned image"  # noqa var-naming[no-role-prefix]

bento_pdf_k8s_cpu_limit: "500m"
bento_pdf_k8s_mem_limit: 256Mi
bento_pdf_k8s_cpu_request: "50m"
bento_pdf_k8s_mem_request: 32Mi
# nginx-unprivileged runs as this UID. It is also the fsGroup: an emptyDir has no mode knob
# and mounts 0755 root-owned, so without an fsGroup the container EPERMs on its own scratch
# directories.
bento_pdf_k8s_uid: 101
