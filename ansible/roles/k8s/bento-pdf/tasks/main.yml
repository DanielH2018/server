---
- name: Deploy bento-pdf to the cluster
  ansible.builtin.include_role:
    name: k8s/manifests
  vars:
    manifests_service: bento-pdf
    # Live prune: an object dropped from manifests_files is deleted on the next deploy (#3388).
    manifests_prune: true
    manifests_files:
      - deployment.yaml
      - service.yaml
      - ingressroute.yaml
