---
# Slice 6, B1 — the in-cluster CrowdSec engine: LAPI + AppSec + the decision DB.
# Log-parsing agents live NEXT TO the logs, not here: the k8s traefik pod carries a
# tailing sidecar (roles/k8s/traefik), and daniel-server's engine demotes to an agent
# against this LAPI at B2. See docs/k3s-migration/slice-6-edge-cutover.md (D1-D3).

# crowdsec_k8s_image / crowdsec_k8s_agent_username / crowdsec_k8s_lapi_port /
# crowdsec_k8s_appsec_port live in group_vars/all.yml — the traefik role's sidecar and
# bouncer middleware consume them too, and role defaults are invisible across roles.
crowdsec_k8s_metrics_port: 6060

# Auto-deploy stance — read by gitops_deploy (see the k8s auto-deploy coverage design).
# Platform: the in-cluster LAPI + AppSec + decision engine every bouncer (including traefik's
# middleware) queries. A failed deploy could open or close traffic unpredictably fleet-wide.
# Also Recreate + PVC (the decision DB) on its own state, which compounds the risk but isn't
# the primary reason. crowdsec_k8s_image itself lives in group_vars/all.yml (shared with the
# traefik sidecar and bouncer middleware), not here — this declaration covers the role.
k8s_autodeploy: false  # noqa var-naming[no-role-prefix]
k8s_autodeploy_reason: "platform — LAPI/AppSec/decision engine every bouncer queries; a failed deploy can open or close traffic unpredictably fleet-wide"  # noqa var-naming[no-role-prefix]

# Decision DB + hub state. Small: decisions are rows, the hub is megabytes.
crowdsec_k8s_claim: crowdsec-db
crowdsec_k8s_storage_class: longhorn
crowdsec_k8s_size: 1Gi

# Same set as the Docker engine (traefik role compose) — including the two transitive
# deps `cscli hub upgrade` never auto-installs (http-cve, whitelist-good-actors) and the
# two AppSec starter collections (deliberately NOT the full OWASP CRS). Kept identical so
# the B1 "scenario parity" gate is a straight diff.
crowdsec_k8s_collections: >-
  crowdsecurity/linux crowdsecurity/traefik LePresidente/authelia crowdsecurity/http-cve
  crowdsecurity/whitelist-good-actors crowdsecurity/appsec-virtual-patching
  crowdsecurity/appsec-generic-rules

# The engine pod's own in-pod agent registers itself via the image entrypoint under this
# name; the traefik-sidecar machine ({{ crowdsec_k8s_agent_username }} from group_vars) is
# registered by this role's post-deploy task. Both use SOPS crowdsec_k8s_agent_password.
crowdsec_k8s_engine_machine: engine-local

crowdsec_k8s_cpu_limit: "1"
crowdsec_k8s_mem_limit: 512Mi
crowdsec_k8s_cpu_request: 100m
crowdsec_k8s_mem_request: 128Mi

# The Metabase dashboard (B2c), riding in the engine pod so it can read the decision DB on
# the RWO PVC. Pinned (Renovate-tracked like every k8s image — the Docker copy's weekly
# unpinned rebuild retires with it). The app DB is DELIBERATELY ephemeral: the Docker copy
# kept it in an image layer rebuilt weekly, so pod restarts resetting it is not a
# regression — the seed zip IS the state.
crowdsec_k8s_metabase_image: metabase/metabase:v0.63.5
crowdsec_k8s_metabase_seed_url: https://crowdsec-statics-assets.s3-eu-west-1.amazonaws.com/metabase_sqlite.zip
crowdsec_k8s_dashboard_port: 3000
crowdsec_k8s_metabase_mem_limit: 2048Mi
crowdsec_k8s_metabase_mem_request: 256Mi
crowdsec_k8s_metabase_cpu_limit: "1"
crowdsec_k8s_metabase_cpu_request: 100m

# ── node-agent DaemonSet (Phase F drain, 2026-08-13) ────────────────────────────────────
# Per-node auth.log/SSH agents — the demoted Docker agent's successor, extended to
# daniel-box (whose host SSH signal nothing covered before). Machine names must match
# the DaemonSet's AGENT_USERNAME pattern k8s-node-agent-<nodeName>; add a line when a
# node joins the cluster.
crowdsec_k8s_node_agent_machines:
  - k8s-node-agent-daniel-box
  - k8s-node-agent-daniel-server
# Same pair the demoted Docker agent ran: linux for auth.log/SSH scenarios,
# whitelist-good-actors to suppress good-actor false positives on them.
crowdsec_k8s_node_agent_collections: "crowdsecurity/linux crowdsecurity/whitelist-good-actors"
