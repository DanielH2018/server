---
# The in-cluster CrowdSec engine: LAPI + AppSec + the decision DB.
# Log-parsing agents live NEXT TO the logs, not here: the traefik and authelia pods each carry
# a tailing sidecar (ansible/templates/crowdsec-agent.yml.j2), and the node-agent DaemonSet below reads each node's
# auth.log.

# crowdsec_k8s_image / crowdsec_k8s_sidecar_agents / crowdsec_k8s_lapi_port /
# crowdsec_k8s_appsec_port live in group_vars/all.yml — the app pods' sidecars and traefik's
# bouncer middleware consume them too, and role defaults are invisible across roles.

# Auto-deploy stance — read by gitops_deploy (see the k8s auto-deploy coverage design).
# Platform: the in-cluster LAPI + AppSec + decision engine every bouncer (including traefik's
# middleware) queries. A failed deploy could open or close traffic unpredictably fleet-wide.
# Also Recreate + PVC (the decision DB) on its own state, which compounds the risk but isn't
# the primary reason. crowdsec_k8s_image itself lives in group_vars/all.yml (shared with the
# traefik sidecar and bouncer middleware), not here — this declaration covers the role, and
# renovate.json's `manual — k8s_autodeploy: false` rule names group_vars/all.yml beside this
# file so the pin's bump opens without automerge like any denied role's.
k8s_autodeploy: false  # noqa var-naming[no-role-prefix]
k8s_autodeploy_reason: "platform — LAPI/AppSec/decision engine every bouncer queries; a failed deploy can open or close traffic unpredictably fleet-wide. COUPLING NOTE for a future promotion: crowdsec-db also holds LAPI machine registrations; a revert past an agent registration leaves that agent's stored password valid but the machine unknown"  # noqa var-naming[no-role-prefix]

# Decision DB + hub state. Small: decisions are rows, the hub is megabytes.
crowdsec_k8s_claim: crowdsec-db
crowdsec_k8s_storage_class: longhorn
crowdsec_k8s_size: 1Gi

# The claim k8s/manifests renders and applies for this role (#3387).
k8s_claims:  # noqa var-naming[no-role-prefix]
  - name: "{{ crowdsec_k8s_claim }}"
    storage_class: "{{ crowdsec_k8s_storage_class }}"
    size: "{{ crowdsec_k8s_size }}"

# Including the two transitive deps `cscli hub upgrade` never auto-installs (http-cve,
# whitelist-good-actors) and the two AppSec starter collections (deliberately NOT the full
# OWASP CRS).
crowdsec_k8s_collections: >-
  crowdsecurity/linux crowdsecurity/traefik LePresidente/authelia crowdsecurity/http-cve
  crowdsecurity/whitelist-good-actors crowdsecurity/appsec-virtual-patching
  crowdsecurity/appsec-generic-rules

# The engine pod's own in-pod agent registers itself via the image entrypoint under this
# name; the app-sidecar machines (crowdsec_k8s_sidecar_agents in group_vars) are
# registered by the lapi-register initContainer. All use SOPS crowdsec_k8s_agent_password.
crowdsec_k8s_engine_machine: engine-local

crowdsec_k8s_cpu_limit: "1"
crowdsec_k8s_mem_limit: 512Mi
crowdsec_k8s_cpu_request: 100m
crowdsec_k8s_mem_request: 128Mi

# ── node-agent DaemonSet ────────────────────────────────────────────────────────────────
# Per-node auth.log/SSH agents. Machine names must match
# the DaemonSet's AGENT_USERNAME pattern k8s-node-agent-<nodeName>; add a line when a
# node joins the cluster.
crowdsec_k8s_node_agent_machines:
  - k8s-node-agent-daniel-box
  - k8s-node-agent-daniel-server
# linux for auth.log/SSH scenarios,
# whitelist-good-actors to suppress good-actor false positives on them.
crowdsec_k8s_node_agent_collections: "crowdsecurity/linux crowdsecurity/whitelist-good-actors"

# ── crowdsec-jobs sidecar ───────────────────────────────────────────────────────────────
# The remote allowlist, the AppSec verify and the bouncer prune run in this sidecar of the
# engine pod (templates/deployment.yaml.j2, files/crowdsec_jobs.py). They were daniel-box
# root crons that reached cscli through `kubectl exec` until H2.4b
# (docs/target-architecture/host/h2-shrink-host-plane.md, Steps item 11); tasks/main.yml keeps
# the absent arms that remove them.
#
# The sidecar runs the repo's pinned python image. One initContainer copies `cscli` out of
# crowdsec_k8s_image, which is statically linked at the pinned digest (`file` on the amd64
# layer's /usr/local/bin/cscli, 2026-10-18), so it runs in any image. Another copies kubectl
# out of alpine/k8s, which keeps the binary at /usr/bin/kubectl. The same two digests as
# configarr's health reader (configarr_k8s_health_image), whose defaults record the evidence.
crowdsec_k8s_jobs_image: python:3.14-alpine@sha256:f6a589d43c42b9e7f7dc67a12d37132491f362859a5d750607710cc56da3bc72
crowdsec_k8s_jobs_kubectl_image: alpine/k8s:1.37.1@sha256:712dc5385d1c1a3f83b747fa9e40f64d433a97f72ff42f9755ff7dd1f62846e4

# The budget of the crowdsec-prepull Kustomization, whose Job pulls the engine pod's three images
# onto k8s_primary_node before the crowdsec Kustomization applies
# (scripts/renderer/renderer_lib/prepull.py). The Deployment is `Recreate`, so without it the
# LAPI is down for the whole pull. MEASURED 2026-10-22 (#5867): the pinned amd64 images are
# alpine/k8s's 320.8 MB, crowdsec_k8s_image's 169.3 MB and python's 20.4 MB, 510.5 MB in all,
# every one from Docker Hub. Docker Hub served a 420 MB layer at 23.5-25.2 MB/s on daniel-box,
# about 22s for the set. 600s covers it down to 0.85 MB/s. The Job has no deadline, so a pull
# slower still costs that revision its verdict, the Job keeps pulling, and Flux applies crowdsec
# on a later retry. Only Flux reads it: the renderer adds the Kustomization for a published tag
# alone, so an Ansible deploy ignores it.
flux_prepull_timeout: 600s  # noqa var-naming[no-role-prefix]

# Sized from peak RSS measured with `/usr/bin/time -f %M` on 2026-10-18: python 12 MB, the
# pinned cscli 61-63 MB, kubectl 136 MB. At minutes 0, 15, 30 and 45 the remote allowlist
# (python, then kubectl or cscli) and the AppSec verify (python, then cscli) run at once beside
# the scheduler, about 250 MB at worst. The limit doubles that, because an OOM kill here takes
# the whole pod out of Ready, and with it the LAPI out of its Service, until the container
# restarts. The request is the idle scheduler with headroom.
#
# H2.4c's home allowlist (python, then kubectl, then cscli, one at a time) starts one minute
# later. It overlaps those two only when they outlive a minute, which their 180s and 300s
# timeouts allow. All three at their peak is about 400 MB, inside the limit with no doubling.
# Not re-measured with the fourth job; read the container's peak with `probe.py metric
# 'container_memory_working_set_bytes{container="crowdsec-jobs"}'` after the deploy.
crowdsec_k8s_jobs_cpu_limit: "500m"
crowdsec_k8s_jobs_mem_limit: 512Mi
crowdsec_k8s_jobs_cpu_request: "10m"
crowdsec_k8s_jobs_mem_request: 64Mi

# ── home allowlist ──────────────────────────────────────────────────────────────────────
# The home public IPv4 and IPv6 /64 reach the `home-ips` allowlist in two halves, the
# operator's ruling of 2026-10-18 on #5701 (H2.4c). The crowdsec-home-ips CronJob runs on
# daniel-box's host network, the only place the /64 is visible, and writes both into the
# crowdsec-home-ips ConfigMap (files/home_ips_discover.py). The crowdsec-jobs sidecar syncs the
# allowlist from it (files/home_allowlist.py). The host cron's period, every 5 minutes.
crowdsec_k8s_home_ips_period_minutes: 5
crowdsec_k8s_home_ips_configmap: crowdsec-home-ips
# Below the period, so a hung run ends before the next slot, and below the `crowdsec-verify`
# Kustomization's timeout, which the renderer raises above the gate Job's deadline, so a hung
# gate run fails on its own message. A run takes at most 150s: ipify and the ConfigMap patch at
# 10s each plus 60s of connect retries, and the two WAN probes at 5s each with none.
crowdsec_k8s_home_ips_deadline_seconds: 240
# The CronJob's one-off run per role revision, `crowdsec-home-ips-deploy-gate-<spec digest8>` in
# `crowdsec-verify`. It replaced the `k8s/cronjob-gate` include at crowdsec's flip. The run
# patches the same ConfigMap a scheduled firing patches, from the same lookup, so a second run
# writes the same values and the gate is a post-apply mutation. The Job keeps no ownerReference
# to the CronJob, so `concurrencyPolicy: Forbid` no longer keeps a scheduled firing off a gate
# run, and an overlap patches the ConfigMap twice with one lookup's values.
flux_cronjob_gates:  # noqa var-naming[no-role-prefix]
  crowdsec-home-ips:
    kind: mutation
    rerun_safe: ansible/roles/k8s/crowdsec/tests/test_home_ips_discover.py::test_a_second_run_patches_the_same_values
# The tags whose rolled pod `crowdsec-verify` probes, so it waits on their Kustomizations as well
# as on `crowdsec` (#5999). The ban proof reads the edge's answer, and traefik also depends on
# crowdsec, so without the edge the Job races traefik's `Recreate` roll and can pass against the
# old Traefik pod. A bouncer-key rotation rolls both pods and renames the Job, because
# `config-secret.yaml.j2` reads the key; with the edge it then runs only once the rolled Traefik
# pod is Ready. Only Flux reads it (`ordering.verify_after`).
flux_verify_after:  # noqa var-naming[no-role-prefix]
  - traefik
# Three CronJob periods: the sidecar's home allowlist pushes down once the ConfigMap's lookup
# time is older, so a dead discovery pages.
crowdsec_k8s_home_ips_stale_after_seconds: "{{ crowdsec_k8s_home_ips_period_minutes * 60 * 3 }}"
