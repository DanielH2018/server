---
- name: Deploy crowdsec to the cluster
  ansible.builtin.include_role:
    name: k8s/manifests
  vars:
    manifests_service: crowdsec
    manifests_files:
      - pvc.yaml
      - deployment.yaml
      - service.yaml
      - ingressroute.yaml
    manifests_secret_files:
      - config-secret.yaml

- name: Register the remote agent machines on the LAPI
  tags: [deploy]
  # The image entrypoint only registers ITS OWN pod's agent (AGENT_USERNAME env); the
  # sidecar in the traefik pod and daniel-server's demoted engine (B2) are additional
  # machines and must exist before they can log in. Password travels over exec stdin so
  # it never appears in argv (host `ps`) or the k8s audit trail; no_log keeps it out of
  # Ansible output. Idempotent: adds only when the machine is absent, prints ADDED so
  # changed_when is accurate.
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n {{ k8s_namespace }} exec -i deploy/crowdsec -- sh -c
      'read -r pw; cscli machines list -o raw | grep -q "^{{ item }}," ||
      { cscli machines add {{ item }} --password "$pw" -f /dev/null && echo ADDED; }'
    stdin: "{{ crowdsec_k8s_agent_password }}"
  loop:
    - "{{ crowdsec_k8s_agent_username }}"
    - "{{ crowdsec_k8s_server_agent_machine }}"
  register: crowdsec_k8s_machine_add
  become: true
  no_log: true
  changed_when: "'ADDED' in crowdsec_k8s_machine_add.stdout"

- name: Create the home-ips allowlist on the LAPI
  tags: [deploy]
  # Moved from the containers/traefik role at B2b: `cscli allowlists` is LAPI-machine-only
  # ("local API is disabled -- this command must be run on the local API machine" from the
  # demoted agent, live 2026-08-09), so allowlist management follows the LAPI here.
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n {{ k8s_namespace }} exec deploy/crowdsec -c crowdsec --
      cscli allowlists create home-ips --description 'Home IPs'
  register: crowdsec_k8s_allowlist_create
  become: true
  failed_when:
    - crowdsec_k8s_allowlist_create.rc != 0
    - "'already exist' not in (crowdsec_k8s_allowlist_create.stderr | default('') | lower)"
  changed_when: crowdsec_k8s_allowlist_create.rc == 0

- name: Create the home-allowlist state directory
  tags: [cron]
  ansible.builtin.file:
    path: /var/lib/crowdsec-home-allowlist
    state: directory
    mode: "0755"
    owner: root
    group: root
  become: true

- name: Deploy the home-allowlist updater
  tags: [cron]
  ansible.builtin.template:
    src: crowdsec-update-home-allowlist.sh.j2
    dest: /usr/local/bin/crowdsec-update-home-allowlist.sh
    mode: "0750"
    owner: root
    group: root
  become: true

- name: Schedule the home-allowlist updater
  tags: [cron]
  # root, not sys_user: the script execs into the engine pod, which needs the root
  # kubeconfig — the readonly SA cannot exec. Every 5 min like its daniel-server
  # predecessor; it pushes the same Kuma monitor directly (no monitor-bridge hop).
  ansible.builtin.cron:
    name: "CrowdSec home allowlist"
    minute: "*/5"
    user: root
    job: "/usr/local/bin/crowdsec-update-home-allowlist.sh"
    cron_file: crowdsec-home-allowlist
  become: true

- name: Enforcement gate (opt-in via --tags b1-gate)
  ansible.builtin.import_tasks: verify.yml
