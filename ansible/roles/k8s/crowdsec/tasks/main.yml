---
# The remote allowlist, the bouncer prune and the AppSec verify were daniel-box root crons
# until H2.4b (docs/target-architecture/host/h2-shrink-host-plane.md, Steps item 11), and the
# home allowlist until H2.4c (Steps item 12). They run in the engine pod's crowdsec-jobs sidecar
# instead (templates/deployment.yaml.j2), and the home allowlist's address lookup in the
# crowdsec-home-ips CronJob (templates/home-ips-cronjob.yaml.j2). These absent arms remove the
# crons and their files ahead of the k8s/manifests include, so each host cron is gone before
# the sidecar that replaces it starts. They stay until D5's conversion PR moves them into
# setup/k8s_host_files, and H7 deletes them. ansible/tests/repo/_retired_cron_row.py holds the
# crons' arms to the tree.
- name: Remove the retired remote-allowlist cron
  tags: [cron]
  ansible.builtin.cron:
    name: "CrowdSec remote allowlist"
    user: root
    cron_file: crowdsec-remote-allowlist
    state: absent
  become: true
  when: not k8s_dry_run | bool

- name: Remove the retired bouncer-prune cron
  tags: [cron]
  ansible.builtin.cron:
    name: "CrowdSec bouncer prune"
    user: root
    cron_file: crowdsec-bouncer-prune
    state: absent
  become: true
  when: not k8s_dry_run | bool

- name: Remove the retired AppSec verify cron
  tags: [cron]
  ansible.builtin.cron:
    name: "CrowdSec AppSec verify"
    user: root
    cron_file: crowdsec-appsec-verify
    state: absent
  become: true
  when: not k8s_dry_run | bool

- name: Remove the retired home allowlist cron
  tags: [cron]
  ansible.builtin.cron:
    name: "CrowdSec home allowlist"
    user: root
    cron_file: crowdsec-home-allowlist
    state: absent
  become: true
  when: not k8s_dry_run | bool

- name: Remove the retired crowdsec cron scripts from the host
  tags: [cron]
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /usr/local/bin/crowdsec-update-remote-allowlist.sh
    - /opt/crowdsec-remote-allowlist
    - /usr/local/bin/crowdsec-prune-bouncers.sh
    - /opt/crowdsec-bouncer-prune
    - /usr/local/bin/crowdsec-appsec-verify.sh
    - /usr/local/bin/crowdsec-update-home-allowlist.sh
    - /opt/crowdsec-home-allowlist
    # The host cron's last values. The allowlist itself holds the stored entries since H2.4c.
    - /var/lib/crowdsec-home-allowlist
  become: true
  when: not k8s_dry_run | bool

# The claim is `k8s_claims` in defaults/main.yml; k8s/manifests renders and applies it.
- name: Deploy crowdsec to the cluster
  ansible.builtin.include_role:
    name: k8s/manifests
  vars:
    # The node agents read AGENT_PASSWORD from this role's Secret through `secretKeyRef`
    # (node-agent-daemonset.yaml.j2), and env is resolved once at pod start. The shared
    # config-change restart rolls only `manifests_rollout` — deploy/crowdsec — so without this
    # line a rotated crowdsec_k8s_agent_password lands in Secret crowdsec-env while every
    # DaemonSet pod keeps logging in with the old value, behind a green deploy.
    #
    # ACCEPTED COST: that restart is gated on the render changing, not on the SECRET changing,
    # so any crowdsec manifest edit rolls both node agents while the engine Deployment is
    # itself rolling. Per-node auth.log parsing is blank for that window; the wait-for-lapi
    # init container absorbs up to 120s of it, and the LAPI keeps its own decisions.
    manifests_extra_rollouts:
      - name: crowdsec-node-agent
        kind: daemonset
    # The prune k8s/manifests arms by default (its manifests_prune DECIDED comment). The
    # render stamps homelab/role on every document, the k8s_claims claim included; the fixed
    # allowlist never names Secret or PersistentVolumeClaim, so config-secret and crowdsec-db
    # are applied but never pruned. The tasks below only exec into the pod.

- name: Wait for the crowdsec rollout before talking to the LAPI
  when: not k8s_no_mutate
  tags: [deploy]
  # ONE OF TWO ROLES THAT MUST WAIT INLINE (k8s/registry is the other). k8s/manifests
  # deliberately does NOT wait — it queues the rollout for k8s/manifests/tasks/drain.yml at the end of the
  # batch (see that role's header for the 1386s-to-max() rationale). Most roles tolerate that,
  # because nothing else in them touches the workload they just rolled. This role does: the
  # tasks below `exec` into deploy/crowdsec to reach the LAPI, and the batch drain runs long
  # after them. ansible/tests/deploy/test_inline_rollout_gates.py pins both.
  #
  # Without this gate a manifest change makes the role fail against the pod it just restarted
  # — and `no_log` on the task below censors the body, so it surfaces as a bare "Module
  # failed: non-zero return code" that reads like a credential problem.
  #
  # `rollout status`, not `wait --for=condition=Available`: this Deployment is single-replica,
  # so the OLD pod satisfies Available and the wait returns instantly. Returns immediately when
  # nothing rolled, so the no-change deploy pays nothing. 300s is headroom over a cold image
  # pull: the worst measured roll was ~3.5 min cold and 73s warm.
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n {{ k8s_namespace }} rollout status deploy/crowdsec --timeout=300s
  become: true
  changed_when: false

- name: Register the remote agent machines on the LAPI
  when: not k8s_no_mutate
  tags: [deploy]
  # The image entrypoint only registers ITS OWN pod's agent (AGENT_USERNAME env); the
  # sidecars in the app pods (crowdsec_k8s_sidecar_agents) and the node agents are additional
  # machines and must exist before they can log in. Password travels over exec stdin so
  # it never appears in argv (host `ps`) or the k8s audit trail; no_log keeps it out of
  # Ansible output. Idempotent: adds only when the machine is absent, prints ADDED so
  # changed_when is accurate.
  # `-c crowdsec`: the pod also runs the crowdsec-jobs sidecar, so exec names its container.
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n {{ k8s_namespace }} exec -i deploy/crowdsec -c crowdsec -- sh -c
      'read -r pw; cscli machines list -o raw | grep -q "^{{ item }}," ||
      { cscli machines add {{ item }} --password "$pw" -f /dev/null && echo ADDED; }'
    stdin: "{{ crowdsec_k8s_agent_password }}"
  loop: "{{ (crowdsec_k8s_sidecar_agents.values() | list) + crowdsec_k8s_node_agent_machines }}"
  register: crowdsec_k8s_machine_add
  become: true
  no_log: true
  changed_when: "'ADDED' in crowdsec_k8s_machine_add.stdout"

- name: Create the home-ips allowlist on the LAPI
  when: not k8s_no_mutate
  tags: [deploy]
  # `cscli allowlists` is LAPI-machine-only ("local API is disabled -- this command must be
  # run on the local API machine" from an agent), so allowlist management runs on the LAPI.
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n {{ k8s_namespace }} exec deploy/crowdsec -c crowdsec --
      cscli allowlists create home-ips --description 'Home IPs'
  register: crowdsec_k8s_allowlist_create
  become: true
  failed_when:
    - crowdsec_k8s_allowlist_create.rc != 0
    - "'already exist' not in (crowdsec_k8s_allowlist_create.stderr | default('') | lower)"
  changed_when: crowdsec_k8s_allowlist_create.rc == 0

- name: Create the remote-ips allowlist on the LAPI
  when: not k8s_no_mutate
  tags: [deploy]
  # The home-ips sibling above, for the operator's authenticated remote exits.
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n {{ k8s_namespace }} exec deploy/crowdsec -c crowdsec --
      cscli allowlists create remote-ips --description 'Authenticated remote exits, TTL-managed by remote_allowlist.py'
  register: crowdsec_k8s_remote_allowlist_create
  become: true
  failed_when:
    - crowdsec_k8s_remote_allowlist_create.rc != 0
    - "'already exist' not in (crowdsec_k8s_remote_allowlist_create.stderr | default('') | lower)"
  changed_when: crowdsec_k8s_remote_allowlist_create.rc == 0

# After the rollout wait, so the run's lookup lands in the ConfigMap the sidecar of the new pod
# reads. An extra run looks the same addresses up and writes them again. The CronJob is on the
# host network and needs no fence, so the gate run's patch meets no NetworkPolicy.
- name: Gate the crowdsec-home-ips deploy on a one-off run
  tags: [deploy]
  ansible.builtin.include_role:
    name: k8s/cronjob-gate
  vars:
    cronjob_gate_name: crowdsec-home-ips

- name: Enforcement gate (opt-in via --tags b1-gate)
  # NOT UNDER --check. The gate proves enforcement by mutating real state — it bans a real
  # LAN host, then probes from that host expecting 403. Check mode skips `command`, so the
  # ban never happens; but the probe carries retries/until, and a skipped task has no stdout
  # for `until: ... == "403"` to match. It would burn all 8 retries and fail the run on a
  # task that had correctly changed nothing.
  #
  # Skipping is the only honest option: the gate is unprovable in check mode BY CONSTRUCTION,
  # since you cannot demonstrate a ban is enforced without taking the ban. Making it run
  # anyway (check_mode: false) would have a dry run ban a host and reach out over ssh, which
  # is exactly what --check exists to promise it will not do.
  #
  # `when` on an import_tasks propagates to every task in the file, so this one line covers
  # all four. Nothing is lost: the gate carries no persistent state for --check to drift-detect.
  # k8s_no_mutate rather than ansible_check_mode alone, so a k8s_dry_run skips it too.
  when: not k8s_no_mutate
  ansible.builtin.import_tasks: verify.yml
