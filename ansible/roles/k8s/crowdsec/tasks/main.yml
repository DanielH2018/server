---
# Flux owns crowdsec (D5, its own window), so no Ansible run reaches this file. The Flux
# successors: the `crowdsec-home-ips` gate run is a `flux_cronjob_gates` entry in
# defaults/main.yml, the ban-and-lift gate is the `crowdsec-verify` Job in templates/verify/,
# and the `crowdsec` Kustomization's `wait` gates the rollout.
#
# The agent machines and the two operator allowlists are registered by the lapi-register
# initContainer (templates/deployment.yaml.j2) before the LAPI serves, not by a task here. The
# absent arms for the host crons H2 retired are in setup/k8s_host_files/tasks/crowdsec.yml.
#
# The claim is `k8s_claims` in defaults/main.yml; k8s/manifests renders and applies it.
- name: Deploy crowdsec to the cluster
  ansible.builtin.include_role:
    name: k8s/manifests
  vars:
    # The node agents read AGENT_PASSWORD from this role's Secret through `secretKeyRef`
    # (node-agent-daemonset.yaml.j2), and env is resolved once at pod start. The shared
    # config-change restart rolls only `manifests_rollout` — deploy/crowdsec — so without this
    # line a rotated crowdsec_k8s_agent_password lands in Secret crowdsec-env while every
    # DaemonSet pod keeps logging in with the old value, behind a green deploy.
    #
    # ACCEPTED COST: that restart is gated on the render changing, not on the SECRET changing,
    # so any crowdsec manifest edit rolls both node agents while the engine Deployment is
    # itself rolling. Per-node auth.log parsing is blank for that window; the wait-for-lapi
    # init container absorbs up to 120s of it, and the LAPI keeps its own decisions.
    manifests_extra_rollouts:
      - name: crowdsec-node-agent
        kind: daemonset
    # The prune k8s/manifests arms by default (its manifests_prune DECIDED comment). The
    # render stamps homelab/role on every document, the k8s_claims claim included; the fixed
    # allowlist never names Secret or PersistentVolumeClaim, so config-secret and crowdsec-db
    # are applied but never pruned.
