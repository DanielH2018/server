---
# Where release_stamp.yml records which commit produced each service's applied manifests.
#
# Under /var/lib/homelab/ with the setup plane's two stamp manifests
# (setup-deployed-manifest.d, setup-render-manifest.d) because it answers the same class of
# question for the k8s plane. World-readable, unlike the 0700 render dir it describes: the
# record holds file names, checksums and a commit id, and a reader that needs root is a reader
# nobody runs. `probe.py releases` is that reader.
manifests_release_dir: /var/lib/homelab/k8s-releases.d

# The host-local HMAC key both records' `secret_digest` is keyed with. root, 0600,
# created on first use by files/secret_hmac.py and never copied, printed or committed. Outside
# k8s-releases.d, whose records are 0644. Deleting it re-keys every future digest, so each
# service with secret manifests reads stale until its next deploy writes a fresh release record.
manifests_secret_digest_key: /var/lib/homelab/k8s-secret-digest.key

# Render-only mode. Under `k8s_dry_run`, render_record.yml digests the throwaway
# render the same way release_stamp.yml digests an applied one and writes it here, so
# `probe.py releases --stale-only` can compare what is applied against what the tree would
# render. Off by default: a hand-run `--dry-run` is normally a branch, and a render record
# names a tree the staleness reader must be able to trust. The render cron passes it with -e.
# A separate directory, never k8s-releases.d, because a render is not a release.
manifests_render_record: false
manifests_render_record_dir: /var/lib/homelab/k8s-renders.d

# Live prune (#1076, #3388). `kubectl apply -f <dir>/` only adds/updates, so a manifest
# dropped from manifests_files leaves its live object running — the "Prune staged manifests
# dropped from the file lists" task only deletes the STAGED FILE, never the live object.
# manifest-prune-check.sh pages about that gap after the fact; this is the in-place fix.
#
# DECIDED: armed per role, moving to every role a slice at a time. The operator overturned the
# earlier "default false, hand-label each template" marker on 2026-10-04 (#3388). Its first
# blocker was a missing mechanism: a role arming the prune now renders through
# ansible/templates/role-labelled.yaml.j2, which stamps `homelab/role: <service>` onto every
# document, so no template needs a hand edit. Its second blocker is a cost, not a hazard: an
# orphan whose staged file was deleted before its role was armed never receives the label and
# needs one kubectl delete by hand. The prune cannot see such an orphan, so arming a role that
# still has one is safe, and manifest-prune-check.sh keeps flagging it. registry, bazarr,
# littlelink, texbrain, navidrome, qbittorrent, terraria, code-server, n8n, valheim, scrutiny,
# tdarr, home-assistant and game-stats are armed. The default stays false until every role is, because flipping it moves every role's
# rendered bytes and needs one full deploy.
manifests_prune: false

# The kinds the prune may delete, one list for every armed role. Namespaced kinds only: the
# apply passes `-n`, and a cluster-scoped kind would be listed outside that scope. Secret and
# PersistentVolumeClaim are absent and must stay absent: a pruned Secret loses a rotated value
# no re-apply can restore, and a pruned claim loses its data. A kind a role renders that is not
# listed here is never pruned, which is the safe direction.
# ansible/tests/deploy/test_manifests_prune.py holds both rules.
manifests_prune_allowlist:
  - apps/v1/Deployment
  - apps/v1/DaemonSet
  - batch/v1/CronJob
  - core/v1/ConfigMap
  - core/v1/Service
  - core/v1/ServiceAccount
  - networking.k8s.io/v1/NetworkPolicy
  - traefik.io/v1alpha1/IngressRoute
  - traefik.io/v1alpha1/Middleware

# The rollout budget `k8s/manifests/tasks/drain.yml` waits for a workload whose role passes no
# `manifests_rollout_timeout` of its own — the ONE place that number is written, so a role that
# needs more overrides it rather than the shared value drifting per call site.
#
# 600s covers a rollout that has to pull its image cold over a domestic line: prowlarr needs
# 780s for an 8m54s pull of the 292 MB flaresolverr image, and sonarr and radarr need 660s.
# The pull time is set by image size and registry weather rather than by anything in the repo,
# so a flat default has to cover the slow end.
#
# WHY 600 AND NOT MORE. `rollout status` exits non-zero the moment Kubernetes marks a Deployment
# ProgressDeadlineExceeded, which it does after `progressDeadlineSeconds` — default 600 — without
# progress. A shared budget above 600 is therefore unreachable until every role's template
# renders a matching deadline, which is a change across ~23 roles rather than this one line.
# 600s is the most this default can be worth on its own. A role that genuinely needs more raises BOTH numbers, the way prowlarr,
# sonarr, radarr and valheim do.
#
# WHY NOT DERIVE IT FROM THE IMAGE SIZE. The size the registry reports is the pull's
# numerator only, the denominator is the link, and a budget that reads a remote manifest makes
# every k8s role's rollout depend on a registry round-trip that can itself fail. The cost of the flat value is a slower failure on a genuinely stuck rollout; the health
# gate reports that either way.
#
# Read by `ansible/tests/_helpers.py:MANIFESTS_ROLLOUT_DEFAULT_S`, which is what the two budget
# guards and the inline-gate census size themselves against — so raising this re-derives them.
manifests_rollout_timeout_default: 600s

# Which of this role's three change signals queues a `rollout restart` for a rollout entry, and
# so which of them makes the release record expect a fresh `restartedAt` from that workload.
# Every entry gets all three unless it names its own `restart_on:`.
#
# A role with `manifests_rollout: ''` restarts its own workloads, and `manifests_render is
# changed` is a per-ROLE signal, not a per-workload one: observability renders six workloads from
# eight manifests, so one changed manifest read as "all six changed" and restarted all six.
# Such a role narrows each `manifests_self_rollouts` entry — `restart_on: [secret]` for a
# workload whose only un-hashable input is a Secret, `restart_on: []` for one whose ConfigMap is
# hashed into its own pod template (`ansible/templates/checksum-annotation.yml.j2`), where the
# apply itself does the rolling and `manifests_rolled_by_apply` reports it.
manifests_restart_triggers_default: [config, secret, image]

# Manifest basenames this role renders from a SHARED template under `ansible/templates/` when
# the caller's own role ships no `templates/<basename>.j2`. A role's own template
# always wins; this is the fallback, not an override.
#
# `service.yaml` is one call to the `service()` macro, which reads the name and port off
# `container_item`. A named port or an exportarr sidecar's second port come from
# `service_port_name` and `service_extra_ports` on the containers_list entry.
#
# `ingressroute.yaml` is one call to the `ingressroute()` macro with the name, hostname, port
# and `use_authelia` the entry already carries. A role whose route needs a parameter the entry
# does not carry — extra middlewares, `public=false`, a bypass prefix, a render condition —
# keeps its own template. A route rendered from the shared template leaves no string in the
# role, so `ansible/filter_plugins/toposort.py` derives the deploy's traefik ordering edge
# from the entry's `hostname`.
#
# The render task below resolves the source per file, so the fallback costs nothing for a
# role that ships its own template, and the prune keep-set is unchanged: the caller still
# names `service.yaml` in `manifests_files`, which is what the prune and the digest both read.
#
# `scripts/lib/k8s_roles.py:SHARED_MANIFEST_DEFAULTS` mirrors this map so the offline render
# harnesses render what a deploy renders; `ansible/tests/k8s/test_shared_manifest_defaults.py`
# holds the two in step.
manifests_shared_defaults:
  service.yaml: service-default.yaml.j2
  ingressroute.yaml: ingressroute-default.yaml.j2
