---
# Where release_stamp.yml records which commit produced each service's applied manifests.
#
# Under /var/lib/homelab/ with the setup plane's two stamp manifests
# (setup-deployed-manifest.d, setup-render-manifest.d) because it answers the same class of
# question for the k8s plane. World-readable, unlike the 0700 render dir it describes: the
# record holds file names, checksums and a commit id, and a reader that needs root is a reader
# nobody runs. `probe.py releases` is that reader.
manifests_release_dir: /var/lib/homelab/k8s-releases.d

# Render-only mode (#2574). Under `k8s_dry_run`, render_record.yml digests the throwaway
# render the same way release_stamp.yml digests an applied one and writes it here, so
# `probe.py releases --stale-only` can compare what is applied against what the tree would
# render. Off by default: a hand-run `--dry-run` is normally a branch, and a render record
# names a tree the staleness reader must be able to trust. The render cron passes it with -e.
# A separate directory, never k8s-releases.d, because a render is not a release.
manifests_render_record: false
manifests_render_record_dir: /var/lib/homelab/k8s-renders.d

# Opt-in live prune (#1076). `kubectl apply -f <dir>/` only adds/updates, so a manifest
# dropped from manifests_files leaves its live object running — the "Prune staged manifests
# dropped from the file lists" task above only deletes the STAGED FILE, never the live object.
# manifest-prune-check.sh pages about that gap after the fact; this is the in-place fix.
#
# DECIDED: default false, armed per-role rather than globally. Two things block a global flip:
# (1) there is no shared metadata-labels macro yet, so every one of the other ~63 roles would
# need its templates hand-edited to carry `homelab/role: <service>` before --prune could ever
# see their objects — doing that without a proven mechanism first is the wrong order. (2) a
# label added to a role's manifests only protects objects APPLIED AFTER the label lands: an
# orphan whose staged file was already deleted before this feature shipped (the
# claude-otel-ingest IngressRoute this issue names) never receives the label and stays
# invisible to `-l homelab/role=...` — it still needs one manual kubectl delete, same as today.
# roles/k8s/registry is the one role armed so far, proving the mechanism end-to-end on a role
# with a normal Deployment+Service+NetworkPolicy shape. Arming another role means: label its
# object metadata the same way, list every kind it renders in manifests_prune_kinds (the
# default --prune-allowlist misses NetworkPolicy and every Traefik CRD), and never include
# Secret or PersistentVolumeClaim — see the guard test on that.
manifests_prune: false
manifests_prune_kinds: []

# The rollout budget `k8s/rollout-drain` waits for a workload whose role passes no
# `manifests_rollout_timeout` of its own — the ONE place that number is written, so a role that
# needs more overrides it rather than the shared value drifting per call site.
#
# 600s, raised from 300s on 2026-09-24 (#2377). 300s bounded a rollout that had to pull its
# image cold over a domestic line, and three roles bought their way out of it one incident at a
# time: prowlarr 780s (#2369, an 8m54s pull of the 292 MB flaresolverr image), sonarr and radarr
# 660s (#2370), then bazarr, whose drain gave up at 300.27s while the pod it was waiting for
# entered `running` 34 seconds later. Every other role carried the same exposure, decided by
# image size and registry weather rather than by anything in the repo.
#
# WHY 600 AND NOT MORE. `rollout status` exits non-zero the moment Kubernetes marks a Deployment
# ProgressDeadlineExceeded, which it does after `progressDeadlineSeconds` — default 600 — without
# progress. A shared budget above 600 is therefore unreachable until every role's template
# renders a matching deadline, which is a change across ~23 roles rather than this one line.
# 600s is the most this default can be worth on its own, and it covers the bazarr case with
# 266s to spare. A role that genuinely needs more raises BOTH numbers, the way prowlarr,
# sonarr, radarr and valheim do.
#
# WHY NOT DERIVE IT FROM THE IMAGE SIZE. #2377 weighed reading the compressed size off the
# registry manifest and scaling the budget by it. It is not taken here: the size the registry
# reports is the pull's numerator only, the denominator is the link, and a budget that reads a
# remote manifest makes every k8s role's rollout depend on a registry round-trip that can itself
# fail. The cost of the flat value is a slower failure on a genuinely stuck rollout; the health
# gate reports that either way.
#
# Read by `ansible/tests/_helpers.py:MANIFESTS_ROLLOUT_DEFAULT_S`, which is what the two budget
# guards and the inline-gate census size themselves against — so raising this re-derives them.
manifests_rollout_timeout_default: 600s
