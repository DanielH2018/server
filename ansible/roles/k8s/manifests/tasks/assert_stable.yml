---
# Post-rollout stabilisation gate, shared by every k8s role.
#
# `kubectl rollout status` returns as soon as the Deployment reports Available, and Available is
# driven by READINESS. A container whose LIVENESS probe is misconfigured passes readiness, flips
# the Deployment to Available, and only THEN starts getting killed — so `rollout status` returns
# success and the play reports failed=0 while the workload settles into CrashLoopBackOff.
#
# Hit for real on 2026-08-07: kube-state-metrics' liveness probe pointed at the telemetry port,
# where /livez does not exist. Every start logged a clean, successful startup, the kubelet killed
# it ~35s later on a 404, and the deploy reported ok=41 failed=0.
#
# RESTART COUNT IS THE SIGNAL, not readiness. The first version of this gate compared
# .status.readyReplicas against .spec.replicas and did NOT catch the very bug it was written for:
# kube-state-metrics restarts and passes readiness again within a second, so with the probe
# re-broken deliberately the Deployment read `desired=1 ready=1 updated=1` while the pod sat at
# `READY 1/1  RESTARTS 3`. A crashloop that recovers between kills is invisible to every
# readiness-derived field. Both checks are kept below — readiness catches a workload that stays
# down, restarts catch one that flaps.

- name: Record restart counts before the stabilisation window
  tags: [deploy]
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n {{ manifests_stabilise_namespace }} get pods -l app={{ item }}
      -o jsonpath={.items[*].status.containerStatuses[*].restartCount}
  loop: "{{ manifests_stabilise_deployments }}"
  register: manifests_restarts_before
  become: true
  changed_when: false

- name: Fail if the pod selector matched no pods
  tags: [deploy]
  # This gate assumes the repo-wide `app: <deployment-name>` pod label. That assumption is the
  # one way it could go quietly false-green — a selector matching nothing reports zero restarts
  # and passes. Assert the match is non-empty so a renamed label fails loudly here instead.
  ansible.builtin.assert:
    that: item.stdout | trim | length > 0
    fail_msg: >-
      No pods matched `-l app={{ item.item }}` in namespace {{ manifests_stabilise_namespace }},
      so the stabilisation gate has nothing to watch. Either the Deployment sets a different pod
      label than `app: {{ item.item }}`, or it has no pods at all.
    quiet: true
  loop: "{{ manifests_restarts_before.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Let liveness probes run before declaring the rollout healthy
  tags: [deploy]
  # A liveness failure needs initialDelaySeconds + failureThreshold x periodSeconds to surface —
  # ~35s for the probe config that caused the incident, so the default window is set past it.
  # This pause is the whole cost of the gate, and it is paid only when manifests actually changed.
  ansible.builtin.pause:
    seconds: "{{ k8s_rollout_stabilise_seconds }}"

- name: Re-read restart counts after the stabilisation window
  tags: [deploy]
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n {{ manifests_stabilise_namespace }} get pods -l app={{ item }}
      -o jsonpath={.items[*].status.containerStatuses[*].restartCount}
  loop: "{{ manifests_stabilise_deployments }}"
  register: manifests_restarts_after
  become: true
  changed_when: false

- name: Re-read deployment readiness after the stabilisation window
  tags: [deploy]
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n {{ manifests_stabilise_namespace }} get deploy {{ item }}
      -o jsonpath={.spec.replicas}|{.status.readyReplicas}|{.status.updatedReplicas}
  loop: "{{ manifests_stabilise_deployments }}"
  register: manifests_ready_after
  become: true
  changed_when: false

- name: Fail if a workload restarted during the stabilisation window
  tags: [deploy]
  ansible.builtin.assert:
    that:
      - (item.1.stdout.split() | select() | map('int') | sum)
        <= (item.0.stdout.split() | select() | map('int') | sum)
    fail_msg: >-
      {{ item.0.item }} restarted during the {{ k8s_rollout_stabilise_seconds }}s window after its
      rollout reported success — container restarts went from
      {{ item.0.stdout.split() | select() | map('int') | sum }} to
      {{ item.1.stdout.split() | select() | map('int') | sum }}. A liveness probe that fails
      after readiness has already passed produces exactly this, and the application log will look
      clean because every start genuinely succeeds. Inspect it with:
      k3s kubectl -n {{ manifests_stabilise_namespace }} describe pod -l app={{ item.0.item }}
    quiet: true
  loop: "{{ manifests_restarts_before.results | zip(manifests_restarts_after.results) | list }}"
  loop_control:
    label: "{{ item.0.item }}"

- name: Fail if a workload is not fully ready after the stabilisation window
  tags: [deploy]
  ansible.builtin.assert:
    that:
      # An absent readyReplicas renders as an empty string, not 0 — hence the default() on each.
      - (item.stdout.split('|')[1] | default('0', true) | int) == (item.stdout.split('|')[0] | int)
      - (item.stdout.split('|')[2] | default('0', true) | int) == (item.stdout.split('|')[0] | int)
    fail_msg: >-
      {{ item.item }} is not fully ready {{ k8s_rollout_stabilise_seconds }}s after its rollout
      reported success (desired|ready|updated = {{ item.stdout }}).
    quiet: true
  loop: "{{ manifests_ready_after.results }}"
  loop_control:
    label: "{{ item.item }}"
