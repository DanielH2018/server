---
# Reconcile ONE declared Secret doc against its live object. Split out of
# verify_secret_keys.yml so a manifest carrying several Secrets (crowdsec's
# config-secret.yaml) reconciles every one of them, not just the first.
#
# Caller supplies `manifests_vsk_secret` (looped from the parsed Secret docs).

- name: Read the live Secret's keys ({{ manifests_vsk_secret.metadata.name }})
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n {{ manifests_vsk_secret.metadata.namespace }}
      get secret {{ manifests_vsk_secret.metadata.name }} -o json
  register: manifests_vsk_live
  become: true
  changed_when: false
  # Check mode skips command tasks, leaving stdout undefined and the from_json below
  # failing the whole k8s play — so this read runs even under --check. It only reads,
  # and the patch task that consumes it is still gated by check mode as normal.
  check_mode: false
  # Under --check the apply hasn't run, so a not-yet-deployed Secret is absent rather
  # than a failure; any other non-zero rc still fails.
  failed_when: manifests_vsk_live.rc != 0 and 'NotFound' not in manifests_vsk_live.stderr
  no_log: true

- name: Patch out keys the manifest no longer declares ({{ manifests_vsk_secret.metadata.name }})
  vars:
    manifests_vsk_declared: >-
      {{ (manifests_vsk_secret.data | default({})).keys() | list
         + (manifests_vsk_secret.stringData | default({})).keys() | list }}
    manifests_vsk_stale: >-
      {{ ((manifests_vsk_live.stdout | default('{}', true) | from_json).data | default({}))
         .keys() | list | difference(manifests_vsk_declared) }}
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n {{ manifests_vsk_secret.metadata.namespace }}
      patch secret {{ manifests_vsk_secret.metadata.name }} --type=json
      -p '[{"op":"remove","path":"/data/{{ item }}"}]'
  loop: "{{ manifests_vsk_stale }}"
  become: true
  changed_when: true
