---
# Shared render -> apply -> wait cycle for every k8s workload role.
#
# Included by roles/k8s/<service>/tasks/main.yml, which must set:
#   manifests_service       service name (also the manifest subdirectory)
#   manifests_files         list of template basenames rendered world-readable
#   manifests_secret_files  list rendered 0600 with no_log (anything carrying a secret)
#   manifests_rollout       Deployment to wait on; set '' to skip the wait entirely
#
# Derived here, not passed in:
#   manifests_image_changed  true when k8s/image-builder rebuilt this service's image to a new
#                            digest in this play — a rollout trigger in its own right, since a
#                            rebuild behind a mutable tag leaves the Deployment spec unchanged
#
# Named `manifests` rather than `common` so its ansible-lint variable prefix does not
# collide with the Docker-side roles/containers/common namespace.
#
# `src` is derived from manifests_service rather than passed in. A relative src resolves
# against the role owning this task file — this one — so the caller's templates are invisible
# to it. Passing `{{ role_path }}` through `vars:` does not work either: include_role vars are
# templated lazily in the INCLUDED role's context, so role_path resolves right back to this
# role and every render fails with "Could not find or access
# .../k8s/manifests/templates/<name>.j2".
#
# Manifests land under /etc/rancher/k3s/manifests/ and are applied explicitly. NOT
# /var/lib/rancher/k3s/server/manifests/ — k3s's auto-deploy controller re-applies that
# directory on every restart and takes ownership of what it finds, which fights Ansible
# for the same resources.

- name: Create the manifest directory for {{ manifests_service }}
  tags: [config]
  ansible.builtin.file:
    path: "/etc/rancher/k3s/manifests/{{ manifests_service }}"
    state: directory
    mode: "0700"
    owner: root
    group: root
  become: true

- name: Render manifests for {{ manifests_service }}
  tags: [config]
  ansible.builtin.template:
    src: "{{ playbook_dir }}/roles/k8s/{{ manifests_service }}/templates/{{ item }}.j2"
    dest: "/etc/rancher/k3s/manifests/{{ manifests_service }}/{{ item }}"
    mode: "0644"
    owner: root
    group: root
  loop: "{{ manifests_files | default([]) }}"
  become: true
  register: manifests_render

- name: Render secret manifests for {{ manifests_service }}
  tags: [config]
  # Separate loop rather than a conditional no_log: these carry decrypted SOPS values, and
  # keeping them in their own task makes the 0600 + no_log pair impossible to lose in a
  # later edit to the ordinary manifest list.
  no_log: true
  ansible.builtin.template:
    src: "{{ playbook_dir }}/roles/k8s/{{ manifests_service }}/templates/{{ item }}.j2"
    dest: "/etc/rancher/k3s/manifests/{{ manifests_service }}/{{ item }}"
    mode: "0600"
    owner: root
    group: root
  loop: "{{ manifests_secret_files | default([]) }}"
  become: true
  register: manifests_secret_render

- name: Find staged manifests for {{ manifests_service }}
  tags: [config]
  ansible.builtin.find:
    paths: "/etc/rancher/k3s/manifests/{{ manifests_service }}"
    file_type: file
  register: manifests_staged
  become: true

- name: Prune staged manifests dropped from the file lists for {{ manifests_service }}
  tags: [config]
  # `kubectl apply -f <dir>/` sweeps every file in the directory, so a file merely dropped
  # from manifests_files keeps re-applying its objects on every deploy — the retirement
  # renders green while the live object resurrects. Bit for real 2026-08-13: the retired
  # claude-otel-ingest IngressRoute was deleted live at 18:51 and silently re-created by the
  # 18:53 deploy from its stale staged file. Deleting the file here makes dropping a name
  # from the list the complete staging-side retirement; the already-live object still needs
  # one kubectl delete, which the manifest-prune-check cron flags.
  ansible.builtin.file:
    path: "/etc/rancher/k3s/manifests/{{ manifests_service }}/{{ item }}"
    state: absent
  loop: >-
    {{ manifests_staged.files | map(attribute='path') | map('basename')
       | difference((manifests_files | default([])) + (manifests_secret_files | default([])))
       | list }}
  become: true

- name: Apply manifests for {{ manifests_service }}
  tags: [deploy]
  # TRAP: `apply` only prunes map keys (Secret/ConfigMap data entries) on objects it has a
  # last-applied baseline for. An object first created by anything else — `kubectl create`,
  # a bootstrap script — silently KEEPS removed keys forever while the deploy reports green.
  # Bit the static-monitors Secret 2026-08-10, and TWICE more on 2026-08-14 (the
  # monitor-bridge-env CHECKS_SKIP crashloop; the zombie-monitor resurrection) — the
  # earlier "kubectl replace it once" advice was itself the re-breaker: replace strips the
  # last-applied annotation, so the crack reopens on every use. Secrets are therefore
  # key-reconciled explicitly after this apply (verify_secret_keys.yml below).
  ansible.builtin.command:
    cmd: "k3s kubectl apply -f /etc/rancher/k3s/manifests/{{ manifests_service }}/"
  register: manifests_apply
  become: true
  changed_when: "'created' in manifests_apply.stdout or 'configured' in manifests_apply.stdout"

- name: Reconcile secret keys against the rendered manifests for {{ manifests_service }}
  tags: [deploy]
  ansible.builtin.include_tasks: verify_secret_keys.yml
  loop: "{{ manifests_secret_files | default([]) }}"
  loop_control:
    loop_var: secret_file

# Whether k8s/image-builder rebuilt THIS service's image to a new digest earlier in the play.
# Keyed on manifests_service because every built image is named after the role that deploys it
# — including n8n, whose image is built by the separate n8n-images role in an earlier batch,
# which works because k8s_rebuilt_images is play-scoped rather than role-scoped.
- name: Note whether a rebuilt image needs rolling for {{ manifests_service }}
  tags: [deploy]
  ansible.builtin.set_fact:
    manifests_image_changed: "{{ manifests_service in (k8s_rebuilt_images | default([])) }}"

- name: Roll the deployment after a config change for {{ manifests_service }}
  tags: [deploy]
  # A ConfigMap/Secret edit does not restart the pods consuming it — `kubectl apply` updates
  # the object and nothing else. Without this a config change deploys green and only takes
  # effect at the next unrelated restart. Same failure the docker_deploy role's
  # common_config_changed wiring exists to prevent (roles/containers/common/CLAUDE.md).
  #
  # A REBUILT IMAGE needs this too, for the same reason. Built images are pushed to a mutable
  # tag, so a rebuild changes what `:latest` resolves to while leaving the Deployment spec
  # byte-identical — nothing in the spec changed, so nothing rolls, and the new image sits in
  # the registry unused. k8s/image-builder records which images actually changed digest.
  #
  # Skipped when this run created the Deployment: it is already running the new config, and
  # `rollout restart` on one whose pods have not appeared yet races the initial rollout.
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n {{ k8s_namespace }} rollout restart
      deploy/{{ manifests_rollout | default(manifests_service) }}
  become: true
  changed_when: true
  when:
    - manifests_rollout | default(manifests_service) | length > 0
    - manifests_render is changed or manifests_secret_render is changed or manifests_image_changed
    - not manifests_apply.stdout is search('deployment.apps/' ~ (manifests_rollout | default(manifests_service)) ~ ' created')

- name: Queue the batch drain for the rollout of {{ manifests_service }}
  tags: [deploy]
  # noqa var-naming[no-role-prefix] — k8s_pending_rollouts is deliberately play-scoped, not
  # manifests_-scoped: it is an accumulator every role in a batch appends to and
  # roles/k8s/rollout-drain consumes. A role prefix would make it look role-local, which is
  # exactly the wrong mental model for a fact that outlives this role.
  # DOES NOT WAIT. The rollout is watched by ansible/tasks/k8s_rollout_drain.yml at the end of this
  # role's batch, together with every other rollout the batch started — 1386s of serial waiting
  # across 31 services on 2026-08-15 becomes max() per batch instead of sum().
  #
  # `changed` is recorded here, not recomputed at the drain: it decides whether the stabilisation
  # gate watches this workload, and manifests_render/manifests_secret_render are role-scoped facts
  # that the next role in the batch overwrites.
  ansible.builtin.set_fact:
    k8s_pending_rollouts: >-
      {{ (k8s_pending_rollouts | default([])) + [{
           'name': manifests_rollout | default(manifests_service),
           'namespace': k8s_namespace,
           'kind': 'deploy',
           'timeout': manifests_rollout_timeout | default('300s'),
           'changed': (manifests_render is changed) or (manifests_secret_render is changed)
                      or manifests_image_changed,
         }] }}
  when: manifests_rollout | default(manifests_service) | length > 0
