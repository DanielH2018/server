---
# Drain the pending-rollout accumulator: wait for every rollout queued since the last drain,
# CONCURRENTLY, then snapshot restart counts for the deferred stabilisation gate.
#
# WHY THIS EXISTS. roles/k8s/manifests queues each rollout instead of running `kubectl rollout
# status` inline after its own apply. Inline waits would be serial because Ansible is serial,
# not because anything about the cluster is — `kubectl apply` is asynchronous and k3s
# reconciles every workload concurrently.
#
# Draining in batches (ansible/tasks/k8s_batch.yml) makes k8s_rollout_batch_width the explicit
# bound on how many workloads roll at once.
#
# WHY A SHELL LOOP RATHER THAN async/async_status. Each rollout needs its OWN timeout — sonarr and
# radarr carry manifests_rollout_timeout: 660s because their unpinned striptracks DOCKER_MODS
# reinstalls on every start (~5 min). Backgrounding N `rollout status` calls in one task expresses that directly and
# reports every failure in one place, where async would need a fire loop, an async_status poll
# loop, and its own per-item timeout plumbing to say the same thing.
#
# EVERY TASK HERE IS `tags: [always]`, NOT `[deploy]`, AND THAT IS LOAD-BEARING. k8s_batch.yml
# unions the service tag onto roles/k8s/manifests through `apply:`, so that role's `[deploy]` tasks
# match `--tags <svc>`. This role gets no such union. Tagged `[deploy]` its tasks would be filtered out
# of every tag-filtered run — which is every gitops-deploy run — so nothing would be waited on and
# the stabilisation gate would never fire, while the play still reported failed=0.
#
# `always` is safe rather than over-eager because the tasks are guarded on an empty queue:
# `--skip-tags deploy` skips the `[deploy]`-tagged queueing task in roles/k8s/manifests, leaving
# k8s_pending_rollouts empty, and everything below no-ops.
#
# NOT `kubectl wait --for=condition=Available`, which looks like the tidy one-task version and is
# wrong here. Available means `availableReplicas >= replicas - maxUnavailable`; every Deployment in
# this namespace is single-replica, and the 13 RollingUpdate ones have maxUnavailable 25% -> 0, so
# the OLD pod satisfies it for the entire rolling update and the wait returns before the new pod is
# scheduled. Only `rollout status` gates on the new ReplicaSet.

- name: Wait for the queued rollouts to finish
  tags: [always]
  when:
    - k8s_pending_rollouts | default([]) | length > 0
    - not ansible_check_mode
  become: true
  changed_when: false
  ansible.builtin.shell:
    executable: /bin/bash
    # `wait -n` is not used: we want every failure reported, not the first. Each background job
    # writes its own name on failure so the output names the workload.
    cmd: |
      set -uo pipefail
      declare -a pids=() names=()
      {% for r in k8s_pending_rollouts %}
      k3s kubectl -n {{ r.namespace }} rollout status {{ r.kind }}/{{ r.name }} \
        --timeout={{ r.timeout }} >/dev/null 2>&1 &
      pids+=($!); names+=("{{ r.name }}")
      {% endfor %}
      rc=0
      for i in "${!pids[@]}"; do
        if ! wait "${pids[$i]}"; then
          echo "rollout did not complete: ${names[$i]}" >&2
          rc=1
        fi
      done
      exit $rc

# Restart counts are snapshotted HERE, after the rollouts complete — not back in the role. Reading
# them right after `rollout restart` would capture the OUTGOING pod's counts; the replacement pod
# starts at zero, so the gate's `after <= before` comparison would pass no matter what happened.
- name: Snapshot restart counts for the workloads that changed
  tags: [always]
  when:
    - _k8s_drain_watch | length > 0
    - not ansible_check_mode
  become: true
  changed_when: false
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n {{ item.namespace }} get pods
      -l app={{ item.name }}
      -o jsonpath={.items[*].status.containerStatuses[*].restartCount}
  loop: "{{ _k8s_drain_watch }}"
  loop_control:
    label: "{{ item.name }}"
  register: _manifests_drain_restarts
  vars:
    _k8s_drain_watch: "{{ k8s_pending_rollouts | default([]) | selectattr('changed') | list }}"

# A workload deliberately scaled to zero has no pods, and that is NOT the typo the assert below
# exists to catch. Reading the desired count is what tells the two apart. A Deployment carries
# `.spec.replicas` and a DaemonSet `.status.desiredNumberScheduled`; only one exists per kind, so
# concatenating the two jsonpaths yields exactly one number either way.
- name: Read the desired pod count for the workloads that changed
  tags: [always]
  when:
    - _k8s_drain_watch | length > 0
    - not ansible_check_mode
  become: true
  changed_when: false
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n {{ item.namespace }} get {{ item.kind }} {{ item.name }}
      -o jsonpath={.spec.replicas}{.status.desiredNumberScheduled}
  loop: "{{ _k8s_drain_watch }}"
  loop_control:
    label: "{{ item.name }}"
  register: _manifests_drain_desired
  vars:
    _k8s_drain_watch: "{{ k8s_pending_rollouts | default([]) | selectattr('changed') | list }}"

# Asserted at the point the selector is read: a label that matches
# nothing reports zero restarts and would sail through the comparison at the end of the play.
#
# Exempting a zero-replica workload does not weaken it. The typo this catches is a workload that
# SHOULD have pods and whose label does not reach them, and that case still fails — the exemption
# needs the cluster to agree the desired count is zero, which a mislabelled running workload never
# reports. The end-of-play gate already handles a zero correctly on its own: an absent
# readyReplicas defaults to 0 and equals a desired 0, and an empty restart snapshot sums to 0 on
# both sides of `after <= before`.
- name: Fail if a pod selector matched no pods
  tags: [always]
  when: not ansible_check_mode
  ansible.builtin.assert:
    that: >-
      item.0.stdout | trim | length > 0
      or (item.1.stdout | trim | default('0', true) | int) == 0
    fail_msg: >-
      No pods matched `-l app={{ item.0.item.name }}` in namespace {{ item.0.item.namespace }},
      and the cluster wants {{ item.1.stdout | trim | default('0', true) }} of them, so the
      stabilisation gate has nothing to watch. The workload sets a different pod label than
      `app: {{ item.0.item.name }}`.
    quiet: true
  loop: >-
    {{ (_manifests_drain_restarts.results | default([]))
       | zip(_manifests_drain_desired.results | default([])) | list }}
  loop_control:
    label: "{{ item.0.item.name }}"

- name: Carry the snapshot into the end-of-play stabilisation gate
  tags: [always]
  # noqa var-naming[no-role-prefix] — k8s_stabilise_watch is play-scoped: the end-of-play
  # post_tasks/k8s_stabilise_gate.yml reads it, long after this role has returned.
  # Same guard as the assert above: the snapshot task is skipped
  # under --check, so its results carry no `stdout` and building the fact off item.stdout
  # fails while resolving its own args. There is nothing to gate on in check mode anyway —
  # no rollout happened — and the end-of-play gate defaults this to an empty list.
  when: not ansible_check_mode
  ansible.builtin.set_fact:
    k8s_stabilise_watch: >-
      {{ (k8s_stabilise_watch | default([]))
         + [item.item | combine({'restarts_before': item.stdout})] }}
  loop: "{{ _manifests_drain_restarts.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name }}"

- name: Clear the pending-rollout queue
  tags: [always]
  # noqa var-naming[no-role-prefix] — the play-scoped accumulator; see the queue task in main.yml.
  ansible.builtin.set_fact:
    k8s_pending_rollouts: []
