---
# Reconcile a rendered Secret's keys against the live object. `kubectl apply` only
# prunes keys it has a last-applied baseline for, and a single historical
# `kubectl create`/`replace` breaks that silently and indefinitely — removing a key
# from the template then deploys green while the live Secret keeps it. Bit three times
# (static-monitors 2026-08-10; monitor-bridge-env CHECKS_SKIP crashloop and the
# static-monitors zombie-monitor resurrection, both 2026-08-14 — see the
# kubectl-apply-leaves-stale-secret-keys memory), so the machine enforces it now:
# any live key the rendered manifest doesn't declare is patched out right after apply.
#
# Caller supplies `secret_file` (looped from manifests_secret_files).

- name: Read the rendered secret manifest ({{ secret_file }})
  ansible.builtin.slurp:
    src: "/etc/rancher/k3s/manifests/{{ manifests_service }}/{{ secret_file }}"
  register: manifests_vsk_raw
  become: true
  no_log: true

- name: Parse the declared Secret docs ({{ secret_file }})
  ansible.builtin.set_fact:
    manifests_vsk_secrets: >-
      {{ manifests_vsk_raw.content | b64decode | from_yaml_all | select()
         | selectattr('kind', 'defined') | selectattr('kind', 'equalto', 'Secret') | list }}
  no_log: true

# One Secret per file is the fleet-wide shape; a second doc would silently skip
# reconciliation for it, so fail loudly instead and handle the new shape deliberately.
- name: Refuse a multi-Secret file ({{ secret_file }})
  ansible.builtin.assert:
    that: manifests_vsk_secrets | length == 1
    fail_msg: >-
      {{ secret_file }} holds {{ manifests_vsk_secrets | length }} Secret docs; this reconcile
      handles exactly one — extend verify_secret_keys.yml before adding more.

- name: Read the live Secret's keys ({{ secret_file }})
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n {{ manifests_vsk_secrets[0].metadata.namespace }}
      get secret {{ manifests_vsk_secrets[0].metadata.name }} -o json
  register: manifests_vsk_live
  become: true
  changed_when: false
  no_log: true

- name: Patch out keys the manifest no longer declares ({{ secret_file }})
  vars:
    manifests_vsk_declared: >-
      {{ (manifests_vsk_secrets[0].data | default({})).keys() | list
         + (manifests_vsk_secrets[0].stringData | default({})).keys() | list }}
    manifests_vsk_stale: >-
      {{ ((manifests_vsk_live.stdout | from_json).data | default({})).keys() | list
         | difference(manifests_vsk_declared) }}
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n {{ manifests_vsk_secrets[0].metadata.namespace }}
      patch secret {{ manifests_vsk_secrets[0].metadata.name }} --type=json
      -p '[{"op":"remove","path":"/data/{{ item }}"}]'
  loop: "{{ manifests_vsk_stale }}"
  become: true
  changed_when: true
