---
# Reconcile a rendered Secret's keys against the live object. `kubectl apply` only
# prunes keys it has a last-applied baseline for, and a single historical
# `kubectl create`/`replace` breaks that silently and indefinitely — removing a key
# from the template then deploys green while the live Secret keeps it. Bit three times
# (static-monitors 2026-08-10; monitor-bridge-env CHECKS_SKIP crashloop and the
# static-monitors zombie-monitor resurrection, both 2026-08-14 — see the
# kubectl-apply-leaves-stale-secret-keys memory), so the machine enforces it now:
# any live key the rendered manifest doesn't declare is patched out right after apply.
#
# EVERY Secret doc in the file is reconciled, not just the first. This started as a
# one-doc reconcile with an assert refusing anything else, on the belief that one Secret
# per file was the fleet-wide shape. It isn't — crowdsec's config-secret.yaml.j2 has
# carried two since slice-6 B2a, and the assert never fired because no full deploy ran
# between the reconcile landing (2026-08-14) and the -k8s suffix retirement (2026-08-15),
# which is what finally tripped it. Refusing the shape was the safe half of the job; the
# unsafe half is that the second doc's stale keys were never reconciled at all.
#
# Caller supplies `secret_file` (looped from manifests_secret_files).

- name: Read the rendered secret manifest ({{ secret_file }})
  ansible.builtin.slurp:
    src: "/etc/rancher/k3s/manifests/{{ manifests_service }}/{{ secret_file }}"
  register: manifests_vsk_raw
  become: true
  no_log: true

- name: Parse the declared Secret docs ({{ secret_file }})
  ansible.builtin.set_fact:
    manifests_vsk_secrets: >-
      {{ manifests_vsk_raw.content | b64decode | from_yaml_all | select()
         | selectattr('kind', 'defined') | selectattr('kind', 'equalto', 'Secret') | list }}
  no_log: true

# A secret_file declaring no Secret at all is a template that silently stopped emitting
# one — reconciling nothing would read as success.
- name: Refuse a secret manifest declaring no Secret ({{ secret_file }})
  ansible.builtin.assert:
    that: manifests_vsk_secrets | length > 0
    fail_msg: >-
      {{ secret_file }} declares no Secret doc — it is listed in manifests_secret_files,
      so this is a template that stopped emitting one rather than an empty file.

- name: Reconcile each declared Secret ({{ secret_file }})
  ansible.builtin.include_tasks: reconcile_secret_doc.yml
  loop: "{{ manifests_vsk_secrets }}"
  loop_control:
    loop_var: manifests_vsk_secret
    label: "{{ manifests_vsk_secret.metadata.name }}"
