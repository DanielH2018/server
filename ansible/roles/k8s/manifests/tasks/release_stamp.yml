---
# Record WHICH COMMIT produced the manifests that were just applied for this service.
#
# THE PROBLEM. Nothing on either node can answer "which commit produced the manifests currently
# live for sonarr". The rendered manifests persist at /etc/rancher/k3s/manifests/<service>/, but
# they are overwritten in place on every deploy and carry no identity, so the tree is a mutable
# working copy rather than a release. `deploy.sh` renders from whatever git tree it runs in
# (scripts/deploy_tools/deploy_staleness.py states the problem in full), which makes the
# question genuinely open rather than merely unrecorded: on 2026-08-19 a worktree 48 commits
# behind master reverted claude-otel for nine minutes, and the only reason anyone noticed was a
# scrape-target count moving for no reason the diff explained.
#
# Three guards already compensate for this — the /var/lock/server-git-tree.lock, deploy.sh's
# exit-4 staleness refusal, and the fact cache pinning a deleted worktree's venv. Each is
# sound. All three exist because the artifact has no name. This gives it one.
#
# WHAT THIS IS NOT. It is not a deploy gate and it refuses nothing. It is a record written after
# a successful apply, so a later reader can tell a release apart from the tree it came from.
# `uv run python scripts/diagnostics/probe.py releases` is that reader.
#
# WHY THE RENDERED BYTES, not the repo sources. stamp_render.yml already hashes repo sources for
# the setup plane, and that answers a different question ("is the deployed copy the repo's
# copy"). A twelve-factor release is build PLUS config, and on this plane the config is the
# per-host Ansible variables that only exist after rendering. Two commits can render identical
# manifests and one commit can render differently on two hosts; only the rendered bytes
# distinguish those cases.
#
# SECRET MANIFESTS ARE RECORDED BY NAME, NEVER HASHED. A sha256 leaks nothing, but the files in
# manifests_secret_files are rendered under `no_log: true` from decrypted SOPS values, and
# hashing them adds a new read path over that output — a task result, a fact, and anything that
# later prints either. `grep-on-a-script-prints-the-secret-it-embeds` has three occurrences in
# this homelab's memory and every one ended in a rotation. The release identity is complete
# without them: a secret manifest changes only when a secret changes, which the rotation
# registry already tracks.
#
# Included from main.yml after the apply and the secret-key reconcile. Never under k8s_dry_run:
# that mode persists nothing, so a record would name a release that does not exist.

- name: Resolve the release identity for {{ manifests_service }}
  tags: [deploy]
  # Commit, dirty flag and the digest of the rendered bytes, through the one file render_record.yml
  # also includes. A digest computed twice is two digests.
  ansible.builtin.include_tasks: release_digest.yml

- name: Create the k8s release record directory
  tags: [deploy]
  ansible.builtin.file:
    path: "{{ manifests_release_dir }}"
    state: directory
    mode: "0755"
    owner: root
    group: root
  become: true

- name: Reset the rollout expectation for {{ manifests_service }}
  tags: [deploy]
  # set_fact is host-scoped and outlives this role, so without the reset the next service in
  # the batch would append to the previous one's list.
  ansible.builtin.set_fact:
    manifests_release_rollouts: []

- name: Work out which workloads this apply must roll for {{ manifests_service }}
  tags: [deploy]
  # `restart` mirrors the condition on the two `rollout restart` tasks in main.yml, one entry per
  # workload they would target: the primary (`manifests_rollout`, empty for a role that rolls
  # its own or nothing) and every `manifests_extra_rollouts` entry. `probe.py health` reads
  # `restart: true` as "this apply queued a restart, so the workload's `restartedAt` must be
  # newer than `applied_at`" -- the predicate issue #1867 asks for. A gate that compared pod
  # age against a deploy's start would fail every idempotent re-run; this fires only where the
  # play itself decided a roll was due. `kubectl rollout restart` stamps `restartedAt` on the
  # workload's pod template, so a queued restart that never reached the workload reads as one.
  #
  # The `created` clause is the same one the restart tasks carry: a workload this apply created
  # is not restarted (it races the initial rollout), so none is expected of it either. So is
  # the `manifests_rolled_by_apply` clause: a workload whose pod template the apply changed is
  # already rolling and is not restarted (#1988), so no `restartedAt` is expected of it -- the
  # drain and the rollout-complete half of the gate still cover the roll the apply started. An
  # extra entry's own `kind` and `image` win over the defaults, as in the extra restart task.
  #
  # `manifests_self_rollouts` is the third source (issue #1902): the workloads a role with
  # `manifests_rollout: ''` restarts through a PRIVATE task after this role returns
  # (claude-otel's loop, pihole's roll_one.yml). Those tasks gate on the same three facts, so
  # the record can hold the expectation for them; appending from the private task itself is
  # too late, since the record is written here, before that task runs. An entry here reaches
  # `rollouts[]` and nothing else -- not the shared restart, not the batch drain -- which is
  # exactly what those roles opted out of.
  ansible.builtin.set_fact:
    manifests_release_rollouts: >-
      {{ manifests_release_rollouts + [{
           'name': manifests_release_target.name,
           'kind': manifests_release_target.kind | default(manifests_rollout_kind | default('deploy')),
           'restart': (
             (manifests_render is changed) or (manifests_secret_render is changed)
             or ((manifests_release_target.image | default(manifests_release_target.name))
                 in (k8s_rebuilt_images | default([])))
           ) and not (manifests_apply.stdout | default('')) is search(
             (manifests_release_target.kind | default(manifests_rollout_kind | default('deploy')) == 'daemonset')
             | ternary('daemonset.apps/', 'deployment.apps/')
             ~ manifests_release_target.name ~ ' created')
           and not manifests_rolled_by_apply.get(manifests_release_target.name, false),
         }] }}
  loop: >-
    {{ ((manifests_rollout | default(manifests_service) | length > 0)
        | ternary([{'name': manifests_rollout | default(manifests_service),
                    'kind': manifests_rollout_kind | default('deploy'),
                    'image': manifests_service}], []))
       + (manifests_extra_rollouts | default([]))
       + (manifests_self_rollouts | default([])) }}
  loop_control:
    loop_var: manifests_release_target
    label: "{{ manifests_release_target.name }}"

- name: Look for an existing release record for {{ manifests_service }}
  tags: [deploy]
  ansible.builtin.stat:
    path: "{{ manifests_release_dir }}/{{ manifests_service }}.json"
  register: manifests_release_current
  become: true

- name: Keep the previous release record for {{ manifests_service }}
  tags: [deploy]
  # DECIDED: one step of history, not an append-only log. The question a record has to answer in
  # an incident is "what was live before this deploy", and one step answers it. An unbounded
  # JSONL grows by one line per service per deploy — up to 54 lines every 30-minute tick — and
  # would need rotation, a rotation cron, and a monitor for the rotation cron. Depth beyond one
  # step is what git history is for: every record names a commit, so the trail continues there.
  ansible.builtin.copy:
    src: "{{ manifests_release_dir }}/{{ manifests_service }}.json"
    dest: "{{ manifests_release_dir }}/{{ manifests_service }}.previous.json"
    remote_src: true
    mode: "0644"
    owner: root
    group: root
  become: true
  when: manifests_release_current.stat.exists

- name: Write the release record for {{ manifests_service }}
  tags: [deploy]
  ansible.builtin.copy:
    dest: "{{ manifests_release_dir }}/{{ manifests_service }}.json"
    mode: "0644"
    owner: root
    group: root
    content: "{{ manifests_release_record | to_nice_json }}\n"
  become: true
  vars:
    manifests_release_record:
      service: "{{ manifests_service }}"
      commit: "{{ manifests_release_sha }}"
      commit_short: "{{ manifests_release_sha[:8] }}"
      # A dirty tree renders bytes no commit reproduces, so the commit above is a near-miss
      # rather than an identity. Recording it as a field beats omitting the commit: the operator
      # still gets a starting point, and knows not to read it as exact.
      tree_dirty: "{{ manifests_release_dirty }}"
      applied_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
      # The inventory host whose host_vars layered into this render (#2532). The header's own
      # justification for hashing rendered bytes is that one commit can render differently on
      # two hosts, so without this the record states a fact it cannot be traced back to. It is
      # implicit only while a record is read on the node that wrote it; a reader comparing a
      # record against a fresh render needs to know which vars layered in. A record written
      # before this field carries no host, and a reader must read that absence as "unknown"
      # rather than as a mismatch — each service gains the field on its next deploy.
      host: "{{ inventory_hostname }}"
      render_dir: "{{ manifests_dest_dir }}"
      manifests: "{{ manifests_release_files }}"
      # Computed in release_digest.yml, which render_record.yml also includes, so a render-mode
      # dry run produces a digest comparable with this one.
      #
      # DECIDED: this digest names the bytes an apply wrote, and only a play reproduces it.
      # Issue #2505 proposed deciding staleness by comparing it against a fresh render, which
      # would retire the five path narrowings in `probe.py releases --stale-only`. The offline
      # harness cannot feed that: it stubs SOPS values and a placeholder `domain`, and matched 9
      # of 57 records on 2026-09-25. A render-mode dry run matched all 45 services it can reach
      # (#2574). The narrowings stay until three gaps close: a match is blind to secret
      # manifests (#2586), nothing renders on a schedule (#2587), and 13 services cannot be
      # dry-run (#2588). Full reasoning in this role's CLAUDE.md, under `## Release records`.
      manifests_digest: "{{ manifests_release_digest }}"
      # Names only — see the header. The count is what makes a dropped secret manifest visible.
      secret_manifests: "{{ manifests_secret_files | default([]) | sort }}"
      # [{name, kind, restart}] -- see the task that builds it above.
      rollouts: "{{ manifests_release_rollouts }}"
