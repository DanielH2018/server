---
radarr_k8s_image: lscr.io/linuxserver/radarr:6.4.4.10685-ls326@sha256:51a9ac2a9eb47afc833541e5fd6c11b86eb9f810694c22fa2429e3078e9194b2

# Renovate stance: whether an image bump here may automerge. `promote` deploys what merges.
# Migrating state — strategy is Recreate and the config volume comes from
# k8s_claims below (hardcoded ReadWriteOnce), so a bad image swap can migrate the library
# database + root-folder paths before the gate observes a fault, then fail the rollback
# redeploy against data it can no longer read. The linuxserver -lsNN scheme hides a breaking
# bump as a routine patch bump.
# Flux's radarr-snapshot Job snapshots the claim below before each revision applies. A failed
# revision that changes radarr writes the stateful hold without a reset, and the operator
# reverts the claim through docs/volume-snapshot-drills.md, so a bad swap can be
# reverted instead of leaving the library database and root-folder paths unreadable by the old
# image.
k8s_autodeploy: true
k8s_autodeploy_reason: "migrating state — Recreate + RWO PVC, protected by the radarr-snapshot Job before each revision and an operator revert to it after a failed one; -lsNN versioning still hides a breaking bump. WEIGHED: radarr also mounts media-data (shared RWX, not reverted); a revert rewinds import/rename history while the files stay where they were left, so it desyncs into duplicate-import attempts or a missed-file state, recoverable by a library rescan"
# The claim snapshotted before each revision applies. Under Flux the renderer turns this
# list into the radarr-snapshot Kustomization, whose Job snapshots it before radarr applies
# (D5.2a). The snapshot is the recovery point this role's auto-deploy depends on.
k8s_autodeploy_snapshot_pvcs: [radarr-config]
# Claims this role MOUNTS but does not revert — the WEIGHED clause in the reason above, stated
# where a test can read it. media-data is rendered by k8s/media-volume, so no guard that reads
# what this role creates can see the coupling.
k8s_autodeploy_unreverted_claims: [media-data]

# The rollout budget, declared once. Read as Flux's health-check `timeout` and by
# `progressDeadlineSeconds` in templates/deployment.yaml.j2, so the two cannot drift. A first
# boot installing DOCKER_MODS takes up to 10 minutes. That is the whole of Flux's 600s default,
# so the default leaves no margin over the startupProbe that allows it.
# The deadline has to move with the budget: at the 600s Kubernetes default, `rollout status`
# fails on ProgressDeadlineExceeded whatever `--timeout` says, so the last 60s of this budget
# is unreachable unless the deadline is rendered from this variable too.
# The literal is `manifests_rollout_timeout` because the renderer reads a role's Flux
# Kustomization `timeout` only from a literal role default (`role_fields` in
# scripts/lib/k8s_roles.py); as an include var it would render Flux's 600s default (#5464).
manifests_rollout_timeout: 660s
radarr_k8s_rollout_timeout: "{{ manifests_rollout_timeout }}"

# 30 M. longhorn, not longhorn-nobackup: radarr.db holds the library and the absolute
# root-folder paths.
radarr_k8s_claim: radarr-config
# `longhorn` — backed up. Excluding this volume would leave it with a single frozen restore
# point. B2 Reachable is the readout for whether its incrementals strain B2's TRANSACTION cap.
radarr_k8s_storage_class: longhorn
radarr_k8s_size: 2Gi

# The WHOLE data tree at /data, exactly as sonarr mounts it — radarr imports by hardlink from
# /data/torrents into /data/media, and that link() only works if one mount spans both.
radarr_k8s_media_claim: media-data

# TheCaptain989's striptracks mod.
radarr_k8s_docker_mods: linuxserver/mods:radarr-striptracks

radarr_k8s_cpu_limit: "1"
radarr_k8s_mem_limit: 1024Mi
radarr_k8s_cpu_request: "100m"
radarr_k8s_mem_request: 128Mi

# See roles/k8s/sonarr/defaults/main.yml for the full rationale: upstream defaults are
# LogLevel=debug / Rotate=50 / SizeLimit=1MB, and the churn that produces is what inflates the
# backup, not the capped size. Bound via RADARR__LOG__* — Radarr's Bootstrap.cs binds
# LogOptions to the "Radarr:Log" section and registers AddEnvironmentVariables() unprefixed.
radarr_k8s_log_level: info
radarr_k8s_log_rotate: "10"

# The exportarr metrics sidecar (templates/exportarr.yml.j2). Pinned in this role's own defaults
# rather than once in group_vars, because Renovate's k8s-images manager matches
# `roles/k8s/*/defaults` and `_image:` keys only. sonarr and prowlarr carry the same pin, and
# ansible/tests/services/test_exportarr_sidecars.py::test_the_image_pins_stay_in_lockstep
# fails if the three drift apart.
radarr_k8s_exportarr_image: ghcr.io/onedr0p/exportarr:v2.3.0@sha256:af535d94061cf97a52e1661945ffba78c03f9443eae7c0da1a80a5a4be56b520

# The claim the renderer emits for this role. The radarr Kustomization applies it after the
# radarr-snapshot Job.
k8s_claims:
  - name: "{{ radarr_k8s_claim }}"
    storage_class: "{{ radarr_k8s_storage_class }}"
    size: "{{ radarr_k8s_size }}"
