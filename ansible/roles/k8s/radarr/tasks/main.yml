---
# Slice 4, B4a — the film \*arr, the closest clone of the sonarr role.
#
# HELD until B4c by radarr_k8s_enabled. See the role defaults for why the flag exists rather than
# the inventory entry simply being absent.

- name: Report that radarr is held until the cutover
  tags: [always]
  when: not radarr_k8s_enabled | bool
  ansible.builtin.debug:
    msg: >-
      radarr is built but NOT deployed (radarr_k8s_enabled is false). The five services that share
      the hardlink seam cut over in one window (D3); this is released in B4c.

# Seeded BEFORE the workload, so the app never runs its first-boot setup against an empty /config
# that is about to be overwritten. The Docker copy is still writing, so a coexistence seed is torn
# by construction — only B4c's force=true seed against a STOPPED source is authoritative.
- name: Seed the radarr config volume
  tags: [deploy]
  when: radarr_k8s_enabled | bool
  ansible.builtin.include_role:
    name: k8s/seed-volume
  vars:
    seed_volume_service: radarr
    seed_volume_claim: "{{ radarr_k8s_claim }}"
    seed_volume_source_path: "{{ radarr_k8s_source_path }}"
    seed_volume_storage_class: "{{ radarr_k8s_storage_class }}"
    seed_volume_size: "{{ radarr_k8s_size }}"
    seed_volume_quiesce:
      - radarr

- name: Deploy radarr to the cluster
  when: radarr_k8s_enabled | bool
  ansible.builtin.include_role:
    name: k8s/manifests
  vars:
    manifests_service: radarr
    manifests_files:
      - deployment.yaml
      - service.yaml
      - ingressroute.yaml
      # The query-only door for monitor-bridge on daniel-server (slice 4, B4c).
      - ingressroute-monitoring.yaml
