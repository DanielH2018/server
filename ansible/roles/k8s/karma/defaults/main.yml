---
# Renovate's k8s-defaults manager tracks this pin. Keep the tag alongside a digest
# (`repo:tag@sha256:...`) if you pin by digest — a bare `repo@sha256:...` freezes the image
# with no update signal at all.
karma_k8s_image: ghcr.io/prymitive/karma:v0.134@sha256:479c7bfad3c176b9c35c5a48c2ad8fa72d748f204314daff748fb51488f043da

# Renovate stance: whether an image bump here may automerge. `promote` deploys what merges.
# `lib.k8s_roles.k8s_autodeploy_denylist` raises on a role that declares neither. The reason is what makes the stance reviewable, so replace the text below
# with the property that actually decides it.
k8s_autodeploy: true
k8s_autodeploy_reason: "a stateless viewer over Alertmanager: a broken bump loses the dashboard, never an alert or a page"

# Every `severity` value the alert rules use, in sort order: Karma ranks alert groups by list
# position and colours each value's label chip. ansible/roles/k8s/karma/tests/test_karma_config.py
# fails when a rule under observability/files/rules or loki-homelab/files/rules uses a value
# missing here.
karma_severities:
  - {value: critical, color: "#d9534f"}
  - {value: warning, color: "#f0ad4e"}
  - {value: info, color: "#5bc0de"}

karma_k8s_cpu_limit: "500m"
karma_k8s_mem_limit: 256Mi
karma_k8s_cpu_request: "50m"
karma_k8s_mem_request: 64Mi

# The uid the container runs as, pinned rather than left to the image's named user.
# `ansible/tests/k8s/test_container_security_context.py::test_every_asserting_container_pins_a_uid`
# requires it: a pod asserting runAsNonRoot with no runAsUser still passes admission after a
# tag bump moves that named user to a different uid. Read the image's own uid and set it here.
# The image is plain gcr.io/distroless/static, whose user is root; 65532 is distroless's
# `nonroot` uid, chosen here. Karma writes nothing to disk, so no fsGroup-owned path depends on it.
karma_k8s_uid: 65532
