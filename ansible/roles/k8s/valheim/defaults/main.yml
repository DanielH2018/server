---
# The community-valheim-tools package publishes semver tags (the old
# ghcr.io/lloesche/valheim-server package is stuck on `latest`/`dev`). Pinning the semver tag hands the bump to Renovate —
# unlike terraria, this image does NOT need a rolling-tag exception.
#
# This tag pins the WRAPPER, not the game. SteamCMD fetches the current Valheim build on every
# start, so the server is always on the latest release regardless of what this says; the tag
# is the wrapper's own release.
valheim_k8s_image: ghcr.io/community-valheim-tools/valheim-server:1.4.1@sha256:f34d67ba8023e343b10ffda0144759a8c8d986f276510460315a01051bed8a6d

# The first-boot budget for this server, declared ONCE, as `manifests_rollout_timeout` below.
# Three readers take it. The renderer sets it as the valheim Kustomization's `timeout`, Flux's
# health-check wait (C3's per-role fields, `role_fields` in scripts/lib/k8s_roles.py). The
# renderer reads only a literal role default, so the value cannot be an include var or a Jinja
# expression: before D5.15 it was an include var, and the flip would have rendered the 600s
# default, below the startupProbe's own 60 x 15s. `progressDeadlineSeconds` in
# templates/deployment.yaml.j2 reads it through `valheim_k8s_rollout_timeout`. k8s/manifests'
# `rollout status --timeout` reads the same default, but only after a handback to Ansible. The
# wait and the deadline have to move together: at a deadline below the budget, the wait fails
# on ProgressDeadlineExceeded whatever its timeout says, and at a budget below the deadline the
# wait gives up first and the extra deadline is never reached.
#
# 1800s rather than 900s because nothing in the repo records a first boot completing inside
# 900s. A measured rollout was still pulling this image at 10 minutes and was marked
# ProgressDeadlineExceeded at the 600s Kubernetes default, while the pod carried on fine
# underneath. Between that pull and the ~1.8 G SteamCMD download into an empty install PVC,
# first boot needs the room; a cached restart rolls in seconds and never spends it.
#
# Under Flux, raising it costs a genuinely stuck rollout a slower failure: the Kustomization
# holds one of kustomize-controller's workers for the whole budget, and `verify`'s derived
# wait grows on a revision that changes valheim (docs/flux-deploy-plane.md, *The timeout
# follows the chain*).
manifests_rollout_timeout: 1800s  # noqa var-naming[no-role-prefix]
valheim_k8s_rollout_timeout: "{{ manifests_rollout_timeout }}"

# The budget of the valheim-prepull Kustomization, whose Job pulls the server image and the mods
# image onto daniel-box before the valheim Kustomization applies
# (scripts/renderer/renderer_lib/prepull.py). The Deployment is `Recreate`, so without it the
# server is down for the whole pull. MEASURED 2026-10-22 (#5855): the pinned amd64 server image
# is 369.78 MB compressed from GHCR, which has served this homelab at 0.145-0.53 MB/s; the mods
# image is alpine plus two plugin DLLs. 2700s covers the full re-pull down to 0.137 MB/s. The Job
# has no deadline, so a pull slower still costs that revision its verdict, the Job keeps pulling,
# and Flux applies valheim on a later retry. Only Flux reads it: the renderer adds the
# Kustomization for a published tag alone, so an Ansible deploy ignores it.
flux_prepull_timeout: 2700s  # noqa var-naming[no-role-prefix]

# ── BepInEx and the mod set ─────────────────────────────────────────────────────────────
# BEPINEX=true makes the image install BepInExPack Valheim beside the vanilla server in
# /opt/valheim/bepinex and run the server through it. Mutually exclusive with VALHEIM_PLUS,
# which this server does not use.
#
# DERIVED, not set by hand: BepInEx is on exactly when there is a plugin to load. The two can
# otherwise drift in both directions, and both are silent — mods listed with BepInEx off means
# a vanilla server that reports every plugin copied into place, and BepInEx on with an empty
# list means a modded launch path carrying nothing.
valheim_k8s_bepinex: "{{ 'true' if valheim_k8s_mods | length > 0 else 'false' }}"

# The plugin DLLs are baked into an image built by k8s/image-builder from templates/Dockerfile.j2
# and copied into the plugins tree by the `mods` initContainer. Built rather than downloaded at
# boot so a Thunderstore outage cannot silently bring the server up vanilla — see the Dockerfile.
#
# `valheim`, not `valheim-mods`: k8s/manifests keys `k8s_rebuilt_images` on `manifests_service`,
# so a rebuilt image rolls the Deployment only when the built image's name matches the role's.
valheim_k8s_mods_image: "{{ k8s_registry_pull_host }}/valheim:{{ k8s_built_image_tags.get('valheim', 'latest') }}"

# ── The mod set ─────────────────────────────────────────────────────────────────────────
# Every entry is a Thunderstore release, pinned by version AND sha256 — the build verifies the
# checksum before it unpacks, so a re-uploaded archive fails the build instead of reaching the
# server. To bump one, read the new version and URL from
# `https://thunderstore.io/api/experimental/package/<namespace>/<name>/`, download it and
# `sha256sum` it, then merge: the content tag moves, CI pushes it and `promote` rolls the pod.
#
# BepInExPack is NOT listed: the image installs and updates it on its own.
#
# EVERY MOD HERE IS CLIENT-SIDE TOO. Some mods use ServerSync, which pushes the server's config
# to matching clients and can refuse a client whose version differs. Players need the same
# versions installed locally.
#
# ORE THROUGH PORTALS NEEDS NO MOD. `valheim_k8s_server_args` sets the vanilla `portals casual`
# world modifier.
#
# The prose below lives ABOVE the list rather than beside each entry: ansible-lint's YAML
# parser rejects a long comment run inside a collection ("too many consecutive comments before
# resolving collection entry"), while `yaml.safe_load` accepts it.
#
# TEN MODS THAT FAILED ON VALHEIM 1.0 WERE REMOVED ON 2026-10-19. They had sat commented out
# below this list. Seven threw on load, one was never deployed because its assembly carried
# the same broken reference, and two loaded cleanly but nothing needed them. Each
# one's pinned version, sha256 and recorded boot-log error are in #5776, the PR that removed
# them. Check that history before re-adding any of them.
#
# A SERVERSYNC VERSION LINE IS NOT PROOF A MOD WORKS. The log prints
# `Sending <mod> version <x> ... to the client` on every join because ServerSync registers
# statically. It kept printing for a plugin whose type initializer had thrown.
#
# Vet each entry before adding it, by checking each assembly for a `ZRoutedRpc.Everybody`
# reference. That is necessary, NOT sufficient: a Harmony `Undefined target method` failure is
# invisible to any string check, so the boot log is what decides. Add one entry AT A TIME and
# read the log between its own `Loading [...]` line and the next before adding another.
valheim_k8s_mods:
  # Vetted by checking that neither DLL references ZRoutedRpc.Everybody, the field l-1.0.7
  # removed. Necessary, not sufficient — confirm by the boot log's `Loading [...]` lines, not
  # by pod Ready.
  - name: Server_devcommands
    version: 1.113.0
    url: https://thunderstore.io/package/download/JereKuusela/Server_devcommands/1.113.0/
    sha256: 82e2f539ee31076303fce3e7415ef8e3cea47e434398ce186a7c608520edcaee
  - name: AchievementEnabler
    version: 0.3.2
    url: https://thunderstore.io/package/download/MidnightMods/AchievementEnabler/0.3.2/
    sha256: 2e7346d86a975f9c1c8a3e3a7d4599fcad186114e0ccea1078e24ea17fd07d46
# Auto-deploy stance — read by gitops_deploy (see the k8s auto-deploy coverage design).
# Two independent reasons: (1) probe-less — the
# Deployment renders no readinessProbe at all, same shape as terraria; (2) migrating state —
# strategy is Recreate and valheim-config comes from k8s_claims below (hardcoded
# ReadWriteOnce), holding worlds/lists/prefs. Either alone would justify the denylist entry.
k8s_autodeploy: false  # noqa var-naming[no-role-prefix]
k8s_autodeploy_reason: "two reasons: (1) probe-less — no readinessProbe at all; (2) migrating state — Recreate + RWO PVC holding worlds"  # noqa var-naming[no-role-prefix]

# ── two volumes, deliberately on different backup postures ──────────────────────────────
# /config is the irreplaceable half: worlds_local (the Dedicated world, ~7 M live plus the
# image's own rotating .db/.fwl backups), adminlist/bannedlist/permittedlist, and prefs.
# BACKED UP — this is the only reason the service is worth restoring at all.
valheim_k8s_claim: valheim-config
valheim_k8s_size: 5Gi
valheim_k8s_storage_class: longhorn
# The hourly zips go to /opt/valheim/backups on the nobackup claim (BACKUPS_DIRECTORY in
# the deployment), so this claim carries only the world and the lists.
# The seed files are root-owned but world-readable (644/755), so unlike terraria's 600 worlds
# this needs no sudo staging; the seed pod's `tar -p --numeric-owner` restores uid 0, which
# is also the uid the server runs as (PUID/PGID default to 0).

# /opt/valheim is the SteamCMD install — a 1.8 G download that unpacks to 2.2 G — and
# entirely re-downloadable.
# nobackup, so it never costs B2 bytes (the cap is already a live constraint), but a real
# PVC rather than an emptyDir: the image re-runs steamcmd on every start, and an emptyDir
# would turn each pod recreate into a 1.8 G cold download instead of a delta check.
#
# DECIDED: 20Gi, not the 10Gi it was until 2026-09-17, because the volume holds THREE copies
# of the install at rest and a FOURTH during every game update. The image keeps steamcmd's
# own tree (dl/server), the rsync'd vanilla copy (server) and the BepInEx merge (bepinex),
# which with the three-day zip rotation measured 7.7 G steady on 2026-09-17. A Steam update
# then rsyncs server + the BepInEx pack into bepinex.tmp before swapping it in, so the merge
# needs one more install's worth free. At 10Gi that was 2.1 G free against a 2.2 G copy: the
# l-1.0.14 update on 2026-09-17 hit ENOSPC four times in an hour, the hourly world zip failed
# alongside it, and the PVC Fullness tile went DOWN (#1866). Longhorn thin-provisions, so
# the unused half costs nothing on disk; it exists so the peak sits near 55% rather than
# 100%. longhorn-nobackup allows expansion, so this line grows the live claim in place.
valheim_k8s_server_claim: valheim-server
valheim_k8s_server_size: 20Gi
# nobackup: every byte here is re-downloadable from Steam, and B2 is the scarce resource.
valheim_k8s_server_storage_class: longhorn-nobackup
# The largest single transient an update writes to the claim: the fourth install copy in
# bepinex.tmp, 2.2 G measured, declared as 3 GiB so the floor fires before the
# copy is refused rather than at it. monitor-bridge's PVC_MIN_FREE names this claim with this
# value: the percentage arm cannot warn before a step-shaped peak, so the check pages
# while free bytes are below the transient, whatever the percentage reads. The number lives
# here because the workload's own updater is the only thing that knows it; nothing exports
# it. monitor-bridge/tests/test_check_pvc_floors.py fails when the two declarations drift.
valheim_k8s_server_update_transient_bytes: 3221225472

# ── server identity ─────────────────────────────────────────────────────────────────────
# The name stays stable so returning players' saved entries keep matching. The password lives
# in SOPS as valheim_server_pass; an earlier value is in this PUBLIC repo's history, so it is
# treated as disclosed and never reused.
valheim_k8s_server_name: "DBoy's Server"
# Created on first boot because no worlds_local entry of this name exists.
#
# The old `Dedicated` world is NOT deleted, and nothing in the image touches it once this name
# changes: the server is launched with `-world "$WORLD_NAME"` (valheim-server), and the hourly
# backup archives `$WORLDS_DIR/$WORLD_NAME` rather than the worlds_local directory
# (valheim-backup). Both read at v1.2.0. So reverting is this one line back to `Dedicated` —
# worth keeping, because it is the VANILLA save and a modded world is not reliably readable by
# a vanilla server afterwards.
valheim_k8s_world_name: Midgard
# Listed in the in-game community browser. Steam's server query (port 2457) only
# answers for public servers; a private server is join-by-IP only.
valheim_k8s_server_public: "true"

# Space-separated SteamID64 list. The image's `common` script (write_adminlist) rewrites
# /config/adminlist.txt from this var on every boot when it is non-empty, so the list here is
# the source of truth rather than anything edited in-place on the PVC.
valheim_k8s_admin_ids: "76561198091839404"

# Extra Valheim CLI arguments, appended to the launch line by the image's `SERVER_ARGS`.
#
# `portals casual` lets ore and metal through portals. It is a VANILLA world modifier — the game gained these with the world-modifier system, so
# this needs no mod at all, which is why AdvancedPortals being disabled costs nothing here.
# The other values are `hard` (the default: no metals) and `veryhard` (no items at all).
#
# A modifier applies at launch and is not written into the world, so changing this line and
# redeploying is the whole procedure, in both directions.
valheim_k8s_server_args: "-modifier portals casual"

# The dedicated server simulates the whole world in RAM and wants headroom, not a tight cap.
valheim_k8s_cpu_limit: "6"
valheim_k8s_mem_limit: 9216Mi
valheim_k8s_cpu_request: "750m"
valheim_k8s_mem_request: 3072Mi

# The claims k8s/manifests renders and applies for this role, ahead of the workload: the
# backed-up world claim and the nobackup SteamCMD install.
k8s_claims:  # noqa var-naming[no-role-prefix]
  - name: "{{ valheim_k8s_claim }}"
    storage_class: "{{ valheim_k8s_storage_class }}"
    size: "{{ valheim_k8s_size }}"
  - name: "{{ valheim_k8s_server_claim }}"
    storage_class: "{{ valheim_k8s_server_storage_class }}"
    size: "{{ valheim_k8s_server_size }}"
