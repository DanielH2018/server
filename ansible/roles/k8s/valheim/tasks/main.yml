---
# Valheim reactivated onto k3s, 2026-08-13. Archived on Docker at 6f942bd2 (2026-01-07);
# the world it left behind on daniel-server was last saved 2025-11-22 and is migrated here.
#
# Only /config is populated. /opt/valheim (the SteamCMD install) gets an empty nobackup PVC and
# the image populates it on first start — a ~1.8 G download that takes several minutes, so
# the first rollout is slow and the startupProbe budget is sized for it.

- name: Create the valheim config volume claim
  tags: [deploy]
  ansible.builtin.include_role:
    name: k8s/volume-claim
  vars:
    volume_claim_service: valheim
    volume_claim_name: "{{ valheim_k8s_claim }}"
    volume_claim_storage_class: "{{ valheim_k8s_storage_class }}"
    volume_claim_size: "{{ valheim_k8s_size }}"

- name: Deploy valheim to the cluster
  ansible.builtin.include_role:
    name: k8s/manifests
  vars:
    manifests_service: valheim
    manifests_rollout: valheim
    # 300s is not enough for the first boot: the pod is not Ready until SteamCMD has pulled
    # ~1.8 G into the empty install PVC and the world has loaded.
    manifests_rollout_timeout: 900s
    manifests_files:
      - pvc.yaml
      - deployment.yaml
      - service.yaml
    manifests_secret_files:
      - secret.yaml
