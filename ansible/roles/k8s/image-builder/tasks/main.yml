---
# Build one image inside the cluster and push it to the in-cluster registry.
#
# Written generically because three services in this fleet are built rather than pulled (n8n,
# n8n-runners, and metabase/code-server behind them), and because the alternative — a build
# block inside each service's role — would copy the securityContext reasoning into every one of
# them, where it would drift.
#
# Callers set image_builder_name / _dockerfile / _context / _tag; see defaults/main.yml.
#
# UNDER --check the BUILD is skipped and the three REGISTRY READS still run. Building and pushing
# an image is the most mutating thing in this play, so a dry run must not do it; but the reads
# are HTTP GETs against the registry, and running them is what keeps check mode honest. With no
# build, the pre- and post-build digests are read from the same unchanged tag and compare equal,
# so `k8s_rebuilt_images` correctly stays empty and no workload is queued for a rollout.
#
# Left unguarded, every dry run reached "Fail on an unsuccessful build" — check mode skips the
# Job apply, so nothing ever succeeded — and failed the whole play with an empty build log.
#
# THE BUILD IS ALSO SKIPPED when the rendered context is byte-identical to the last run's and
# the registry already serves the tag. `image_builder_building` (below) is the single fact every
# build-path task is gated on, and the same reasoning as check mode applies to the reads: they
# still run, both digests come back equal, and no rollout is queued. `image_builder_force=true`
# overrides it — see defaults/main.yml for the base-image CVE case it exists for.

- name: Assert the builder was given something to build
  tags: [config]
  ansible.builtin.assert:
    that:
      - image_builder_name is defined
      - image_builder_dockerfile is defined
    fail_msg: >-
      k8s/image-builder needs image_builder_name and image_builder_dockerfile. Without them it
      would render a Job that builds nothing and reports success.

- name: Create the build manifest directory for {{ image_builder_name }}
  tags: [config]
  ansible.builtin.file:
    path: "/etc/rancher/k3s/manifests/build-{{ image_builder_name }}"
    state: directory
    mode: "0700"
    owner: root
    group: root
  become: true

- name: Render the build context and job for {{ image_builder_name }}
  tags: [config]
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/rancher/k3s/manifests/build-{{ image_builder_name }}/{{ item }}"
    # 0600 and no_log because a build context is templated with the same variables everything
    # else here is, so it CAN carry a secret even though neither of n8n's two files does today.
    # Treated like a rendered Secret manifest rather than the 0644 a plain manifest gets, so the
    # first context that does carry one is already handled.
    mode: "0600"
    owner: root
    group: root
  loop:
    - context-configmap.yaml
    - build-job.yaml
  become: true
  no_log: true
  # This register IS the build gate — `template` already compares content, so nothing else has
  # to hash it. On a loop the flag is the OR across items, which is what the gate wants: either
  # file changing means rebuild. `no_log` censors the register's CONTENT, not its `changed`
  # flag; measured 2026-08-22 in both the looped and unlooped shapes, because a suppressed flag
  # would fail silently as a permanently stale image rather than as an error.
  register: image_builder_render

# The digest the tag resolves to BEFORE the build, so it can be compared with the one after.
# Every image here is pushed to a mutable tag (`:latest`), which means a rebuild changes what
# the tag points at while leaving the Deployment spec byte-identical — and a Deployment whose
# spec has not changed does not roll. Without this comparison a rebuilt image simply never
# reaches a running pod unless some manifest happened to change in the same play.
#
# 404 is expected and not an error: the first ever build of an image has no previous digest.
- name: Read the pre-build digest of {{ image_builder_name }}
  tags: [deploy]
  ansible.builtin.uri:
    url: "http://{{ k8s_registry_host_ip }}:{{ k8s_registry_port }}/v2/{{ image_builder_name }}/manifests/{{ image_builder_tag }}"
    method: HEAD
    headers:
      Accept: application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json
    status_code: [200, 404]
  register: image_builder_digest_before
  changed_when: false
  # Reads only, and its counterpart below reads the same tag — see the header.
  check_mode: false

# The gate. Every image here rebuilt on every full deploy before this existed, costing ~106s
# across the seven of them for a result that was byte-identical five times out of seven.
#
# It answers only "is there anything to build". Whether we are ALLOWED to build stays a separate
# `not k8s_no_mutate` clause on each task below, deliberately not folded in here: that guard is
# what keeps a dry run from pushing an image, and `ansible/tests/test_k8s_dry_run.py` reads it
# textually at each mutating task. Folding it behind this fact would still be correct and would
# make the check unable to see it — a safety test that has to follow an indirection is one that
# stops catching the next role to get this wrong.
#
# Every clause resolves toward BUILDING when it cannot tell, because the two failure directions
# are not symmetric: a needless build costs 15 seconds and is visible in the log, while a
# wrongly skipped one ships a stale image indefinitely and reports success. So an absent or
# skipped render register builds, and a registry that answers anything but 200 builds.
#
# `.changed | default(true)` rather than the idiomatic `is changed`, which reads a missing key
# as False and so treats a register carrying no comparison at all as "nothing changed" — the
# one direction this gate must never fail in.
- name: Decide whether a build is needed for {{ image_builder_name }}
  tags: [deploy]
  ansible.builtin.set_fact:
    image_builder_building: >-
      {{ image_builder_force | bool
         or image_builder_digest_before.status | default(0) != 200
         or image_builder_render is not defined
         or image_builder_render.skipped | default(false)
         or image_builder_render.changed | default(true) }}

- name: Apply the build context for {{ image_builder_name }}
  tags: [deploy]
  when:
    - not k8s_no_mutate
    - image_builder_building | bool
  ansible.builtin.command:
    cmd: >-
      k3s kubectl apply -f
      /etc/rancher/k3s/manifests/build-{{ image_builder_name }}/context-configmap.yaml
  become: true
  changed_when: true

# A Job's pod template is immutable, so an existing Job cannot be re-applied — and re-applying
# a COMPLETED one would report success from the previous run's result, which is the failure
# this whole role exists to make impossible.
- name: Clear the previous build of {{ image_builder_name }}
  tags: [deploy]
  when:
    - not k8s_no_mutate
    - image_builder_building | bool
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n {{ k8s_namespace }} delete job build-{{ image_builder_name }}
      --ignore-not-found
  become: true
  changed_when: true

- name: Build and push {{ image_builder_name }}
  tags: [deploy]
  when:
    - not k8s_no_mutate
    - image_builder_building | bool
  ansible.builtin.command:
    cmd: >-
      k3s kubectl apply -f
      /etc/rancher/k3s/manifests/build-{{ image_builder_name }}/build-job.yaml
  become: true
  changed_when: true

# --for=condition=complete alone hangs until the deadline when a build FAILS, because a failed
# Job never gets that condition. Waiting on either resolves immediately in both directions; the
# assert below is what turns "finished" into "succeeded".
- name: Wait for the build to finish for {{ image_builder_name }}
  tags: [deploy]
  when:
    - not k8s_no_mutate
    - image_builder_building | bool
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail &&
      k3s kubectl -n {{ k8s_namespace }} wait --for=condition=complete
      job/build-{{ image_builder_name }} --timeout={{ image_builder_timeout }}s ||
      k3s kubectl -n {{ k8s_namespace }} wait --for=condition=failed
      job/build-{{ image_builder_name }} --timeout=10s
    executable: /bin/bash
  become: true
  changed_when: false

- name: Read the build result for {{ image_builder_name }}
  tags: [deploy]
  # Skipped WITH the build rather than run as a read. It reads the Job the tasks above create,
  # which in a no-mutation run does not exist — and in a skipped-build run is the PREVIOUS
  # build's Job, whose success says nothing about this one. The two consumers below therefore
  # lead with `image_builder_building` — Ansible short-circuits a `when` list, so that clause is
  # what keeps them from dereferencing this task's absent stdout.
  when:
    - not k8s_no_mutate
    - image_builder_building | bool
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n {{ k8s_namespace }} get job build-{{ image_builder_name }}
      -o jsonpath={.status.succeeded}
  register: image_builder_result
  become: true
  changed_when: false

# The build log is the only place a Dockerfile error is explained, and the pod is garbage
# collected with the Job on the next run — so it is pulled out here rather than left for an
# operator to find after it is gone.
- name: Show the failed build log for {{ image_builder_name }}
  tags: [deploy]
  when:
    - not k8s_no_mutate
    - image_builder_building | bool
    - image_builder_result.stdout | trim != "1"
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n {{ k8s_namespace }} logs job/build-{{ image_builder_name }} --tail=50
  register: image_builder_log
  become: true
  changed_when: false
  failed_when: false

- name: Fail on an unsuccessful build of {{ image_builder_name }}
  tags: [deploy]
  when:
    - not k8s_no_mutate
    - image_builder_building | bool
    - image_builder_result.stdout | trim != "1"
  ansible.builtin.fail:
    msg: >-
      Building {{ image_builder_name }}:{{ image_builder_tag }} failed. Last lines of the build
      log:
      {{ image_builder_log.stdout | default('(no log — the pod never started; check the Job events)') }}

# The build reporting success proves buildkit exited 0, not that the image is retrievable under
# the name a manifest will reference. Those differ whenever the push half is misconfigured, so
# the registry is asked directly.
- name: Confirm the registry now serves the built tag for {{ image_builder_name }}
  tags: [deploy]
  ansible.builtin.uri:
    url: "http://{{ k8s_registry_host_ip }}:{{ k8s_registry_port }}/v2/{{ image_builder_name }}/tags/list"
    return_content: true
  register: image_builder_tags
  failed_when: image_builder_tag not in (image_builder_tags.json.tags | default([]))
  changed_when: false
  # Runs under --check, where it asserts something slightly weaker but still worth knowing: the
  # registry serves the tag the manifests reference. Only a host that has never built this image
  # fails here in check mode, and "the registry has no {{ image_builder_name }}" is a true and
  # useful thing for a dry run to say.
  check_mode: false

# DECIDED: no `when: image_builder_building` here, unlike the four tasks above. Reading the digest
# on a SKIPPED build is what lets post_tasks/k8s_image_drift_gate.yml see a stale pod sitting in
# front of an unchanged registry tag — the case that hid nut's week-old image for 90 minutes on
# 2026-08-27. Gating this for consistency with its siblings is the obvious tidy-up and it blinds
# the gate. ENFORCED by ansible/tests/test_built_image_drift_gate.py.
- name: Read the post-build digest of {{ image_builder_name }}
  tags: [deploy]
  ansible.builtin.uri:
    url: "http://{{ k8s_registry_host_ip }}:{{ k8s_registry_port }}/v2/{{ image_builder_name }}/manifests/{{ image_builder_tag }}"
    method: HEAD
    headers:
      Accept: application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json
    status_code: [200]
  register: image_builder_digest_after
  changed_when: false
  check_mode: false

# Play-scoped, like k8s_pending_rollouts and for the same reason: k8s/manifests runs as a
# separate role include and cannot read this role's variables. It reads this list to decide
# whether the workload needs rolling even though no manifest changed.
#
# A missing digest on either side falls back to "changed", so an unreadable header rolls the
# workload rather than silently skipping it — the safe direction for a deploy.
- name: Record the changed image digest for {{ image_builder_name }}
  tags: [deploy]
  ansible.builtin.set_fact:
    # noqa var-naming[no-role-prefix] — deliberately play-scoped, shared with k8s/manifests.
    k8s_rebuilt_images: >-
      {{ (k8s_rebuilt_images | default([])) + [image_builder_name] }}
  when: >-
    image_builder_digest_before.docker_content_digest | default('') !=
    image_builder_digest_after.docker_content_digest | default('')

# Every image this play touched, with the digest the registry serves for it RIGHT NOW — read by
# post_tasks/k8s_image_drift_gate.yml once the rollouts have drained.
#
# Recorded unconditionally, where k8s_rebuilt_images above is recorded only on a digest change.
# That difference is the whole point. The gate catches a pod running something other than what the
# registry serves, and the two ways that happens are opposites:
#
#   1. The digest MOVED and nothing rolled — an earlier run died between the push and the rollout
#      queue, so k8s_rebuilt_images never named the image.
#   2. The digest did NOT move on this run, because the build short-circuited on a byte-identical
#      context with the tag already served — while the pod in front of it is still stale from (1).
#
# Keying this on a digest change would see (1) and be blind to (2), which is the half that hides.
# nut sat on a week-old image for 90 minutes across two deploys on 2026-08-27, behind a green 1/1
# and a passing `probe.py health`, because run 2 short-circuited and reported nothing.
#
# DECIDED: hangs off "Read the post-build digest", which is deliberately NOT gated on
# image_builder_building — unlike the build, the result read and the failure paths above. That is
# what lets a skipped build still contribute a digest here. Folding that read under
# image_builder_building as an optimisation would blind the gate on exactly case (2);
# ansible/tests/test_built_image_drift_gate.py fails if that guard reappears.
- name: Record the registry digest for the drift gate of {{ image_builder_name }}
  tags: [deploy]
  when: not k8s_no_mutate
  ansible.builtin.set_fact:
    # noqa var-naming[no-role-prefix] — deliberately play-scoped, read by post_tasks/.
    k8s_built_images: >-
      {{ (k8s_built_images | default([]))
         + [{'name': image_builder_name,
             'digest': image_builder_digest_after.docker_content_digest | default('')}] }}
