---
# Same image the Docker role runs — both copies stay on the same tag through coexistence so a
# difference in behaviour between them is never the image. Tag KEPT alongside the digest
# (repo:latest@sha256) so Renovate's k8s-defaults manager still tracks it for digest-bump PRs —
# a bare repo@sha256 would freeze it with zero update signal (2026-08-13 pin).
homepage_k8s_image: ghcr.io/gethomepage/homepage:latest@sha256:a0b71c8e757298d02560186bab9fbe3fc2d375c523a62cc1019177b37e48aa28
# The seed-config initContainer just needs `cp`; alpine is the smallest image that has it.
homepage_k8s_init_image: alpine:3.24

# Auto-deploy stance — read by gitops_deploy (see the k8s auto-deploy coverage design).
# Stateless: RollingUpdate Deployment, no PVC — unlike freshrss/speedtest/zigbee2mqtt it carries
# no seed-volume step, since all its state (services/widgets/bookmarks/CSS) is rendered
# templates, not runtime data. readinessProbe present, image digest-pinned.
k8s_autodeploy: true  # noqa var-naming[no-role-prefix]
k8s_autodeploy_reason: "stateless RollingUpdate Deployment, no PVC (config is rendered templates, not runtime state), readinessProbe, digest-pinned image"  # noqa var-naming[no-role-prefix]

homepage_k8s_cpu_limit: "500m"
homepage_k8s_mem_limit: 256Mi
homepage_k8s_cpu_request: "50m"
homepage_k8s_mem_request: 32Mi

# The PromQL behind the Headlamp tile's customapi widget (services.yaml.j2). It lives here
# rather than inline because services.yaml.j2 renders it through `| urlencode` into a GET query
# string, and the percent-encoded form is unreviewable.
#
# ONE QUERY, FOUR COUNTERS, and the shape is load-bearing. homepage's customapi widget takes a
# single URL, so four counts have to arrive in one response. Each counter is wrapped
# `label_replace(vector(scalar(<count> or vector(0))), "k", "<name>", "", "")` and the four are
# joined with `or`:
#   - `scalar()` collapses a count to a bare number and `vector()` lifts it back to a one-sample
#     series, which is what lets `or` concatenate four otherwise-unrelated counts.
#   - the inner `or vector(0)` is what makes an EMPTY match render as 0. Without it `count()`
#     over nothing returns no series, `scalar()` of that is NaN, and the tile reads "NaN" for
#     exactly the healthy case (zero degraded deployments) it exists to confirm.
#   - `label_replace` is LOAD-BEARING, and not for display: `or` is set union over series
#     SIGNATURES, and four bare `vector()` samples all carry the empty signature — so without a
#     distinguishing label the union collapses to ONE result and the tile renders a single
#     number. Measured 2026-08-23: dropping label_replace returned `result` of length 1, not 4.
#     The names it assigns are also what makes the query legible when curled by hand, which is
#     how you check the widget's positional mappings still line up (services.yaml.j2).
# Counts, not gauges: cluster and node CPU/memory are already on this dashboard twice
# (config/widgets.yaml.j2's kubernetes info widget, and this tile's own namespace/podSelector pod
# stats), so repeating them here would add nothing visible.
homepage_k8s_headlamp_cluster_query: >-
  label_replace(vector(scalar(count(kube_node_status_condition{condition="Ready",status="true"} == 1) or vector(0))), "k", "Nodes Ready", "", "")
  or label_replace(vector(scalar(count(kube_pod_status_phase{phase="Running"} == 1) or vector(0))), "k", "Pods Running", "", "")
  or label_replace(vector(scalar(count(kube_pod_status_phase{phase=~"Pending|Failed|Unknown"} == 1) or vector(0))), "k", "Pods Not Running", "", "")
  or label_replace(vector(scalar(count(kube_deployment_status_replicas_unavailable > 0) or vector(0))), "k", "Deploys Degraded", "", "")
