---
# No volume-claim step, unlike freshrss/speedtest/zigbee2mqtt: homepage carries no runtime
# state. Every byte under /app/config is Ansible-rendered on every deploy, so nothing needs
# seeding.

- name: Deploy homepage to the cluster
  ansible.builtin.include_role:
    name: k8s/manifests
  vars:
    manifests_service: homepage
    manifests_files:
      - rbac.yaml
      - deployment.yaml
      - service.yaml
      - ingressroute.yaml
      - icons-configmap.yaml
    manifests_secret_files:
      - config-secret.yaml
