---
# generic-device-plugin advertises arbitrary /dev nodes as schedulable extended resources.
# Chosen over the vendor AMD plugin (which targets ROCm compute, not the render node VAAPI uses)
# and over smarter-device-manager (same idea, larger config surface).
# Pinned by digest, Renovate-trackable. The digest is the exact image validated against the
# whole VAAPI path — encode at 10.9x realtime — so the version that was proven is the version
# that ships.
# `:latest` plus a digest, not a version tag, because upstream publishes no version tags at all
# — every tag is `latest` or a commit SHA, none semver. The digest is what actually pins. The
# `:latest` is there so Renovate's
# k8s-defaults manager matches the line and can offer digest bumps — a digest-only pin slips
# its regex and would age forever with no update signal, which the repo's own guard test
# (test_every_k8s_role_image_is_renovate_tracked) refuses.
dri_device_plugin_k8s_image: ghcr.io/squat/generic-device-plugin:latest@sha256:dc192e164c69b03f156765793a1be62ca437709ae477b27ca7d8f3dcf5021576

# Auto-deploy stance — read by gitops_deploy (see the k8s auto-deploy coverage design).
# Under Flux the gate is the K8sExtendedResourceMissing verify alert the soak reads, not a
# rollout wait. Even a probe would not close this: a readiness probe on /health would
# prove only the HTTP listener, not that the plugin registered its gRPC socket with the kubelet
# — rollout status would go green on an unregistered plugin. This is also the workload that
# advertises the /dev/dri render node as a schedulable resource — jellyfin's GPU transcoding
# depends on it, so a wedge here has a downstream victim with no rollout gate of its own
# watching for it either.
k8s_autodeploy: false  # noqa var-naming[no-role-prefix]
k8s_autodeploy_reason: "no rollout gate proves the plugin works — the soak reads the K8sExtendedResourceMissing alert instead; even a /health readinessProbe would only prove the HTTP listener, not that the plugin registered its gRPC socket with the kubelet, and an unregistered plugin makes jellyfin and tdarr unschedulable"  # noqa var-naming[no-role-prefix]

# How many pods may hold the render node at once. It is one physical device; this is a scheduling
# allowance, not a hardware fact — jellyfin and tdarr both want it, and the GPU multiplexes fine.
dri_device_plugin_count: 4

# ── the admission reaper (templates/admission-reaper-cronjob.yaml.j2) ──────────────────────
# After a reboot the kubelet can re-admit a GPU pod before this plugin re-registers, and the
# rejected pod stays Failed beside its replacement (#6367). The CronJob deletes those pods;
# files/dri_admission_reaper.py has the rule. Every 15 minutes, so a tombstone from the weekly
# reboot is gone well inside the hour after boot.
# The add-on namespaces where the job also deletes every Failed pod a Job owns (#6460). They run
# Jobs this repo does not render: k3s's helm-install Jobs and Longhorn's backup Jobs, which no
# `ttlSecondsAfterFinished` reaches. system-upgrade is not listed: the SUC controller's
# SYSTEM_UPGRADE_JOB_TTL_SECONDS_AFTER_FINISH (900) ages its Plan Jobs out on their own.
# Each namespace gets a Role in templates/admission-reaper-rbac.yaml.j2.
# DECIDED: the add-on sweep stays in this role rather than a role of its own. It runs the same
# script on the same schedule, and a second role would add a containers_list entry and an image
# pin for one more predicate. It runs as its own CronJob and ServiceAccount in kube-system; the
# cronjob template's DECIDED note says why. Rationale in this role's CLAUDE.md.
dri_device_plugin_reaper_job_namespaces: [kube-system, longhorn-system]
dri_device_plugin_reaper_image: python:3.14-alpine@sha256:f6a589d43c42b9e7f7dc67a12d37132491f362859a5d750607710cc56da3bc72
dri_device_plugin_reaper_schedule: "*/15 * * * *"
# One list and a delete or two take seconds; `open_url` retries a refused connect for 60s.
dri_device_plugin_reaper_deadline_seconds: 120
# The job's own runs age out too, so a run the reboot interrupts does not become the next
# tombstone. The output is in Loki past this.
dri_device_plugin_reaper_job_ttl_seconds: 1800
