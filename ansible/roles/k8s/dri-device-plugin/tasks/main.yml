---
# Makes /dev/dri/renderD128 schedulable as `devic.es/dri`.
#
# WHY THIS EXISTS AT ALL, since a hostPath looks simpler: Kubernetes has
# no `devices:` field of its own, and a hostPath mount of /dev/dri is NOT enough. Measured:
# the device node appears in the container with the right group and mode, and every
# open() still fails with EPERM, because cgroup v2 governs device access via an eBPF filter and
# nothing had declared the device to the CRI. A device plugin is what declares it, which is what
# populates the allowlist. See docs/archive/k3s-migration/slice-4-media-cluster.md D2.
#
# It is also the only privileged component in the media stack, and deliberately so: it holds the
# privilege in one small auditable DaemonSet instead of spreading it across long-running media
# services. Consumers stay unprivileged and just request the resource.
# Flux owns this role, so no Flux path runs the include below; it stays for a handback
# (docs/flux-deploy-plane.md) and because the renderer reads the `manifests_*` vars from it. The
# rollout wait and the `devic.es/dri` readback this file ran after it are gone with the flip. The
# soak's verify is M2's `K8sExtendedResourceMissing` rule (`verify="true"`,
# ansible/roles/k8s/observability/files/rules/k8s-workloads.yaml): it fires when no node reports
# allocatable `devic.es/dri` above 0, which is the property the readback asserted.
- name: Render and apply the DRI device plugin
  ansible.builtin.include_role:
    name: k8s/manifests
  vars:
    # The DaemonSet lives in kube-system, so the armed apply and its prune run there.
    manifests_prune_namespace: kube-system
    manifests_rollout: ''
