---
# Seed BEFORE the workload starts, so karakeep never runs its first-boot setup against an empty
# /data that is about to be overwritten.
- name: Seed the karakeep data volume
  tags: [deploy]
  ansible.builtin.include_role:
    name: k8s/seed-volume
  vars:
    seed_volume_service: karakeep
    seed_volume_claim: "{{ karakeep_k8s_claim }}"
    seed_volume_source_path: "{{ karakeep_k8s_source_path }}"
    seed_volume_storage_class: "{{ karakeep_k8s_storage_class }}"
    seed_volume_size: "{{ karakeep_k8s_size }}"
    # Both write to karakeep-data — the app continuously, the tagger every 15 minutes — so a
    # re-seed at cutover has to stop them. chrome and meilisearch are left running: neither
    # touches this claim.
    seed_volume_quiesce:
      - karakeep
      - karakeep-time-tagger

- name: Deploy karakeep to the cluster
  ansible.builtin.include_role:
    name: k8s/manifests
  vars:
    manifests_service: karakeep
    # meilisearch reads MEILI_MASTER_KEY from this role's Secret as an ENV var, which is only
    # injected at container start. Without this, rotating that key rolls `karakeep` with the new
    # value while `karakeep-meilisearch` keeps serving the old one — the app and its search
    # backend end up on different keys and the deploy reports green.
    #
    # time-tagger also reads a Secret value through env: KARAKEEP_PYTHON_API_KEY, via
    # `secretKeyRef` in deployment-time-tagger.yaml.j2. Its script IS a plain (non-subPath)
    # ConfigMap mount, so kubelet syncs a changed script and the `while true; sleep 900` loop
    # re-execs it without a restart — but that mechanism only covers the script file, not the
    # env var, which resolves once at pod start same as crowdsec's node agents (#689). Without
    # this line a rotated KARAKEEP_PYTHON_API_KEY lands in the Secret while the tagger keeps
    # calling the API with the old key.
    #
    # chrome is still absent: it mounts no role-rendered config at all.
    #
    # ACCEPTED COST: the restart is gated on the render changing, not on the SECRET changing, so
    # any karakeep manifest edit now also rolls time-tagger, and this extra rollout is queued for
    # the batch drain like any other, so the deploy waits on it. Unlike crowdsec's node agents
    # (#689), that wait should be cheap: time-tagger has no readinessProbe
    # (deployment-time-tagger.yaml.j2, and karakeep_autodeploy_reason cites this as
    # "probe-less"), so a pod counts Ready as soon as its main container starts, which needs only
    # the wait-for-karakeep initContainer's TCP probe of the karakeep Service to succeed — and
    # the batch already waits on karakeep's own primary rollout in parallel, so that Service is
    # normally ready before or around the same time.
    manifests_extra_rollouts:
      - name: karakeep-meilisearch
      - name: karakeep-time-tagger
    manifests_files:
      - configmap.yaml
      - middleware.yaml
      # The Meilisearch index gets a claim but no seed — see pvc-meili.yaml.j2.
      - pvc-meili.yaml
      - deployment.yaml
      - deployment-chrome.yaml
      - deployment-meilisearch.yaml
      - deployment-time-tagger.yaml
      - service.yaml
      - ingressroute.yaml
    manifests_secret_files:
      - secret.yaml
