---
# The time-tagger's image, a one-layer chown over the pinned uv base so the tagger can run as
# uid 1000. Built under the name `karakeep`, not `karakeep-time-tagger`: k8s/manifests
# keys `k8s_rebuilt_images` on `manifests_service`, so a mismatched name pushes an image whose
# rebuild rolls no pod. The rollout it needs is the tagger's,
# which `manifests_extra_rollouts` below already queues on every manifest change, and a rebuild
# changes the manifest because the pin below names the content tag.
- name: Build the karakeep time-tagger image
  ansible.builtin.include_role:
    name: k8s/image-builder
  vars:
    image_builder_name: karakeep
    image_builder_dockerfile: "{{ playbook_dir }}/roles/k8s/karakeep/templates/Dockerfile.j2"

# Both claims are `k8s_claims` in defaults/main.yml, which k8s/manifests renders and applies
# ahead of the workload (#3387).
- name: Deploy karakeep to the cluster
  ansible.builtin.include_role:
    name: k8s/manifests
  vars:
    # No `manifests_rollout_timeout` here: defaults/main.yml sets it, where the renderer reads
    # it for Flux's `timeout` and k8s/manifests reads it for the rollout wait. An include var
    # of that name would override the default and loop through `karakeep_k8s_rollout_timeout`.
    # The drain gives every extra rollout below the same budget.
    # meilisearch reads MEILI_MASTER_KEY from this role's Secret as an ENV var, which is only
    # injected at container start. Without this, rotating that key rolls `karakeep` with the new
    # value while `karakeep-meilisearch` keeps serving the old one — the app and its search
    # backend end up on different keys and the deploy reports green.
    #
    # time-tagger also reads a Secret value through env: KARAKEEP_PYTHON_API_KEY, via
    # `secretKeyRef` in deployment-time-tagger.yaml.j2. Its script IS a plain (non-subPath)
    # ConfigMap mount, so kubelet syncs a changed script and the `while true; sleep 900` loop
    # re-execs it without a restart — but that mechanism only covers the script file, not the
    # env var, which resolves once at pod start same as crowdsec's node agents. Without
    # this line a rotated KARAKEEP_PYTHON_API_KEY lands in the Secret while the tagger keeps
    # calling the API with the old key.
    #
    # chrome is listed so the batch drain WAITS on it, never so it restarts (#4564). Its one
    # input that moves is `karakeep_k8s_chrome_image`, which Renovate bumps every few weeks: a
    # bump changes chrome's pod template, so the apply rolls it, and before this entry nothing
    # waited on that roll and the landing read `VERDICT: settled` mid-pull. `restart_on: []`
    # keeps the shared extra restart off it. chrome mounts no role-rendered config, reads no
    # Secret and runs no built image, so all three signals would only restart it on an
    # unrelated karakeep edit and drop any crawl in flight.
    #
    # ACCEPTED COST: the restart is gated on the render changing, not on the SECRET changing, so
    # any karakeep manifest edit also rolls time-tagger, and this extra rollout is queued for
    # the batch drain like any other, so the deploy waits on it. Unlike crowdsec's node agents,
    # that wait should be cheap: time-tagger has no readinessProbe
    # (deployment-time-tagger.yaml.j2, and karakeep_autodeploy_reason cites this as
    # "probe-less"), so a pod counts Ready as soon as its main container starts, which needs only
    # the wait-for-karakeep initContainer's TCP probe of the karakeep Service to succeed — and
    # the batch already waits on karakeep's own primary rollout in parallel, so that Service is
    # normally ready before or around the same time.
    manifests_extra_rollouts:
      - name: karakeep-meilisearch
      - name: karakeep-time-tagger
      - name: karakeep-chrome
        restart_on: []
    # networkpolicy-chrome.yaml and networkpolicy-meilisearch.yaml render from THIS role's
    # templates rather than netpol-baseline's on purpose, as for authelia's redis policy. The
    # `wait-for-deps` initContainer in deployment.yaml.j2 retries karakeep-chrome:9222 and
    # karakeep-meilisearch:7700 in an unbounded loop, so with either policy absent a
    # `--tags karakeep` deploy stages a pod that sits in Init forever. Co-located, the three
    # ship together or not at all. Both files carry the reasoning.
    #
    # `kubectl apply -f <dir>` is alphabetical, so on a cluster with no policy yet
    # deployment.yaml lands before both networkpolicy files and the pod may wait in Init for the
    # seconds until they arrive. The wait is unbounded, so it resolves on its own — which is the
    # whole difference from the split: the policy arrives in the same deploy rather than never.

# One run of the archive pruner now, so a deploy shows its log at once rather than at the next
# 05:15. With karakeep_k8s_pruner_apply false that run is a dry-run report. The extra run is
# safe with apply on too: the rules key on age, so it acts only on what is already due.
# karakeep may still be rolling here (manifests drains rollouts at the end of the batch), which
# the script's connect retry covers. See ansible/roles/k8s/cronjob-gate/CLAUDE.md.
- name: Gate the karakeep deploy on a one-off archive-pruner run
  tags: [deploy]
  ansible.builtin.include_role:
    name: k8s/cronjob-gate
  vars:
    cronjob_gate_name: karakeep-archive-pruner
