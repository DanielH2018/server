---
# Seed BEFORE the workload starts, so karakeep never runs its first-boot setup against an empty
# /data that is about to be overwritten.
- name: Seed the karakeep data volume
  tags: [deploy]
  ansible.builtin.include_role:
    name: k8s/seed-volume
  vars:
    seed_volume_service: karakeep
    seed_volume_claim: "{{ karakeep_k8s_claim }}"
    seed_volume_source_path: "{{ karakeep_k8s_source_path }}"
    seed_volume_storage_class: "{{ karakeep_k8s_storage_class }}"
    seed_volume_size: "{{ karakeep_k8s_size }}"
    # Both write to karakeep-data — the app continuously, the tagger every 15 minutes — so a
    # re-seed at cutover has to stop them. chrome and meilisearch are left running: neither
    # touches this claim.
    seed_volume_quiesce:
      - karakeep
      - karakeep-time-tagger

- name: Deploy karakeep to the cluster
  ansible.builtin.include_role:
    name: k8s/manifests
  vars:
    manifests_service: karakeep
    # meilisearch reads MEILI_MASTER_KEY from this role's Secret as an ENV var, which is only
    # injected at container start. Without this, rotating that key rolls `karakeep` with the new
    # value while `karakeep-meilisearch` keeps serving the old one — the app and its search
    # backend end up on different keys and the deploy reports green.
    #
    # chrome and time-tagger are deliberately absent. chrome mounts no role-rendered config at
    # all, and the tagger's script is a plain (non-subPath) ConfigMap mount, so kubelet syncs the
    # file and its `while true; sleep 900` loop re-execs the new copy without a restart.
    manifests_extra_rollouts:
      - name: karakeep-meilisearch
    manifests_files:
      - configmap.yaml
      - middleware.yaml
      # The Meilisearch index gets a claim but no seed — see pvc-meili.yaml.j2.
      - pvc-meili.yaml
      - deployment.yaml
      - deployment-chrome.yaml
      - deployment-meilisearch.yaml
      - deployment-time-tagger.yaml
      - service.yaml
      - ingressroute.yaml
    manifests_secret_files:
      - secret.yaml
