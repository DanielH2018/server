---
# These were kept identical to the Docker role's images, digests included, so that during
# coexistence a difference in behaviour between the two was never the image. Coexistence ended with
# the migration (2026-08-14) and roles/containers/archive/karakeep is now a frozen historical copy,
# so this file is the only live source — it is free to move ahead of the archived compose template
# and has (see the tagger's 3.14 bump below). The karakeep app and the uv base keep their
# repo:tag@sha256 form so Renovate's docker manager still tracks them; see the compose template for
# why the tag must be kept alongside the digest.
karakeep_k8s_image: ghcr.io/karakeep-app/karakeep:release@sha256:64d6a9bbf2d37b5c808cf06b5d87f1f1c7846fdd3844724145a9741aeb06fd31
karakeep_k8s_chrome_image: zenika/alpine-chrome:124  # moved off gcr.io/zenika-hub/alpine-chrome
# (2026-08-13): permanent Renovate lookup failure there ("Repository Problems" on the dashboard) —
# switched to the Docker Hub mirror, verified to carry the same :124 tag before the swap. No digest
# pin: a registry mirror doesn't guarantee an identical index digest to the gcr.io original.
karakeep_k8s_meili_image: getmeili/meilisearch:v1.41.0
# 3.12 -> 3.14 (2026-08-16): the last interpreter in the repo still off the 3.14 the workflows,
# .python-version and every other python image pin. The digest moves WITH the tag — a runtime
# resolves repo:tag@sha256 by digest, so bumping only the tag would read 3.14 here and still run
# 3.12 in the pod. Index digest for python3.14-bookworm-slim, and all five pinned pip deps below
# resolve wheel-only under 3.14 (bookworm-slim has no compiler, so an sdist fallback would
# crashloop the boot-time `uv pip install`).
karakeep_k8s_tagger_image: ghcr.io/astral-sh/uv:python3.14-bookworm-slim@sha256:7cf77f594be8042dab6daa9fe326f90962252268b4f120a7f5dccce4d947e6c1

# Auto-deploy stance — read by gitops_deploy (see the k8s auto-deploy coverage design).
# Three independent reasons, not one: (1) stateful/manual-upgrade — meilisearch DB-format
# migrations are not always backward-compatible, so a bump needs a human watching; (2)
# probe-less — the time-tagger sub-deployment renders no readinessProbe, so `rollout status`
# would return on Running and prove nothing for it even if the primary Deployment were fine;
# (3) migrating state — strategy is Recreate and the config PVC is seeded through
# k8s/seed-volume (hardcoded ReadWriteOnce). Any one of the three would justify the denylist
# entry; a reason naming only one would miss the other two.
k8s_autodeploy: false  # noqa var-naming[no-role-prefix]
k8s_autodeploy_reason: "three reasons: (1) stateful — meilisearch DB-format migration; (2) probe-less time-tagger sub-deployment; (3) migrating state — Recreate + RWO seed-volume PVC"  # noqa var-naming[no-role-prefix]

# Mirrors resources('2.0', '2048M', '0.10', '128M') in the compose template.
karakeep_k8s_cpu_limit: "2"
karakeep_k8s_mem_limit: 2048Mi
karakeep_k8s_cpu_request: "100m"
karakeep_k8s_mem_request: 128Mi
# Headless Chrome spikes; same generous cap the compose template gives it.
karakeep_k8s_chrome_cpu_limit: "2"
karakeep_k8s_chrome_mem_limit: 2048Mi
karakeep_k8s_chrome_cpu_request: "100m"
karakeep_k8s_chrome_mem_request: 128Mi
# Mirrors resources('1.0', '1024M', '0.10', '128M').
karakeep_k8s_meili_cpu_limit: "1"
karakeep_k8s_meili_mem_limit: 1024Mi
karakeep_k8s_meili_cpu_request: "100m"
karakeep_k8s_meili_mem_request: 128Mi
# Mirrors resources('1.0', '512M', '0.05', '64M'). cpu 1.0 is deliberate: the boot-time
# `uv pip install` plus the per-cycle tag burst CFS-throttled ~67% of periods at the old 0.5.
karakeep_k8s_tagger_cpu_limit: "1"
karakeep_k8s_tagger_mem_limit: 512Mi
karakeep_k8s_tagger_cpu_request: "50m"
karakeep_k8s_tagger_mem_request: 64Mi

# 487M at migration time — the bookmark library, archived page snapshots and db.db. On
# `longhorn` (backed up), matching the Docker side, where the bind mount under containers/ is
# deliberately in Kopia scope for exactly this reason.
karakeep_k8s_claim: karakeep-data
karakeep_k8s_storage_class: longhorn
karakeep_k8s_size: 4Gi
karakeep_k8s_source_path: /home/ubuntu/server/containers/karakeep/data

# The Meilisearch index: 286M today, and deliberately NOT seeded and NOT backed up. It is a
# derived artifact — the compose template calls it "rebuildable by reindexing from this data"
# and keeps it in a named volume outside Kopia for the same reason. Copying it would mean
# reading a root-owned Docker volume out of /var/lib/docker, to reproduce state that karakeep
# regenerates from db.db on request. The upgrade runbook in the role's CLAUDE.md already ends
# in "Reindex All Bookmarks"; a migration is the same situation.
karakeep_k8s_meili_claim: karakeep-meili
karakeep_k8s_meili_storage_class: longhorn-nobackup
karakeep_k8s_meili_size: 2Gi

# The time-tagger's script is vendored at files/karakeep-time-tagger.py rather than downloaded,
# because a ConfigMap must render from something that exists at render time and CI renders every
# template on a machine that has never deployed. It is 17K, far inside the 1M ConfigMap ceiling.
# test_karakeep_time_tagger_script.py pins it to the Docker role's get_url checksum.
