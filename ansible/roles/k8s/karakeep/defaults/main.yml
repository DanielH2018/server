---
# The pins here keep their repo:tag@sha256 form so Renovate's docker manager still tracks them
# and opens digest-bump PRs. A bare repo@sha256 with NO tag is DIGEST_PINNED_EXEMPT
# (scripts/tests/test_renovate_managers.py) and gets ZERO Renovate tracking — the fully-manual
# pull-digest-redeploy loop tdarr is on.
karakeep_k8s_image: ghcr.io/karakeep-app/karakeep:release@sha256:69ae5315c618b7c14c1af3e34c6e211acdb231793af424ecd1cab0b70691d987
# karakeep's own headless-shell build. karakeep publishes the sidecar its app is tested against
# (docker/chrome/Dockerfile: chromedp/headless-shell pinned by digest, plus USER 65534:65534), so
# the browser tracks the app's release cadence instead of a third party's.
#
# `release` is a moving tag behind a digest, the same shape as karakeep_k8s_image above, so the
# k8s-defaults manager's `matchUpdateTypes: [digest]` rule bumps it after its soak.
karakeep_k8s_chrome_image: ghcr.io/karakeep-app/karakeep-chrome:release@sha256:4ad61127638dd27bfe685222787c5780dd1d083d23a7658c39af657775814c44
# The rollout budget for all four Deployments, declared once. Read as Flux's
# health-check `timeout`, by the drain's `rollout status --timeout` and by `progressDeadlineSeconds` in every deployment template. The
# deadline has to move with the timeout: at the 600s Kubernetes default, `rollout status` fails
# on ProgressDeadlineExceeded whatever `--timeout` says.
# Sized from the chrome image, the one karakeep pull that outlasts the shared 600s: daniel-server
# pulled the 449,334,662-byte karakeep-chrome digest in 14m13.354s on 2026-10-12 (#4564). 1200s
# is that pull with prowlarr's ~1.4x margin. Its cost is a genuinely stuck karakeep rollout
# failing at 20 minutes rather than 10. A cached image rolls in seconds, so the budget costs time
# only on a real hang or a cold pull.
# The literal is `manifests_rollout_timeout` because the renderer reads a role's Flux
# Kustomization `timeout` only from a literal role default (`role_fields` in
# scripts/lib/k8s_roles.py); as an include var it would render Flux's 600s default (#5464).
manifests_rollout_timeout: 1200s  # noqa var-naming[no-role-prefix]
karakeep_k8s_rollout_timeout: "{{ manifests_rollout_timeout }}"
# The budget of the karakeep-prepull Kustomization, whose Job pulls all four Deployments'
# images onto their node before the karakeep Kustomization applies
# (scripts/renderer/renderer_lib/prepull.py). `karakeep` and `karakeep-meilisearch` are
# `Recreate`, so without it the old pod stops before the new pod's pull starts. On 2026-10-19
# (#5778) a digest bump left karakeep down for 20 minutes: the pull ran 16.5 minutes and then
# failed on a corrupt layer, with the old pod already gone.
# MEASURED 2026-10-22 from GHCR's amd64 manifests: the app image is 511,337,699 bytes and the
# chrome image 449,327,469, about 960 MB when one release moves both. The pulls measured at
# 0.25 MB/s (#5778, one 40 MB layer in 2m40s) and 0.53 MB/s (#4564, the chrome digest in
# 14m13s), and GHCR has served this homelab as slowly as 0.145 MB/s (n8n's defaults). The
# kubelet pulls one image after the other, so both at 0.25 MB/s take about 3840s. 4500s
# covers that down to 0.213 MB/s, and the app image alone down to 0.114 MB/s. The Job has no
# deadline, so a slower pull costs that revision its verdict, the Job keeps pulling, and Flux
# applies karakeep on a later retry. Only Flux reads it: the renderer adds the Kustomization
# for a published tag alone, so an Ansible deploy ignores it.
flux_prepull_timeout: 4500s  # noqa var-naming[no-role-prefix]
karakeep_k8s_meili_image: getmeili/meilisearch:v1.55.0@sha256:ff546679970126f8822e15d1b6a06bfbff1f2ce2e43f810cfb5258012f92de5c
# Built in-cluster. The base-image pin (uv `python3.14-bookworm-slim` digest) lives in
# `templates/Dockerfile.j2`'s `FROM` line, where Renovate's dockerfile manager reads it. All five
# pinned pip deps below must resolve wheel-only under the base's interpreter, because
# bookworm-slim ships no compiler and an sdist fallback crashloops the boot-time
# `uv pip install`.
#
# `k8s_built_image_tags` is a play-scoped fact k8s/image-builder publishes, so the `.get` fallback
# is what a deploy that skipped the build renders — see that role's CLAUDE.md.
karakeep_k8s_tagger_image: "{{ k8s_registry_pull_host }}/karakeep:{{ k8s_built_image_tags.get('karakeep', 'latest') }}"

# Auto-deploy stance — read by gitops_deploy (see the k8s auto-deploy coverage design).
# Three independent reasons, not one: (1) stateful — a meilisearch bump migrates the index in
# place (MEILI_UPGRADE_DB in deployment-meilisearch.yaml.j2), and upstream says that migration
# is not atomic, so a failure mid-flight needs a human to reindex rather than a retry; (2)
# probe-less — the time-tagger sub-deployment renders no readinessProbe, so `rollout status`
# would return on Running and prove nothing for it even if the primary Deployment were fine;
# (3) migrating state — strategy is Recreate and the config PVC comes from k8s_claims below
# (hardcoded ReadWriteOnce). Any one of the three would justify the denylist
# entry; a reason naming only one would miss the other two.
k8s_autodeploy: false  # noqa var-naming[no-role-prefix]
k8s_autodeploy_reason: "three reasons: (1) stateful — meilisearch migrates its index in place on a bump, non-atomically; (2) probe-less time-tagger sub-deployment; (3) migrating state — Recreate + RWO PVC. COUPLING NOTE for a future promotion: karakeep-meili is deliberately excluded from the snapshot, so reverting karakeep-data alone desyncs the search index until a manual reindex"  # noqa var-naming[no-role-prefix]
# The claim snapshotted before each revision applies. Under Flux the renderer turns this
# list into the karakeep-snapshot Kustomization, whose Job snapshots it before karakeep applies
# (D5.2a). After a handback, k8s/manifests takes the same snapshot through k8s/volume-snapshot.
# Declared regardless of k8s_autodeploy, because an app bump runs karakeep's own one-way DB
# migration on db.db at boot. karakeep-meili stays out on purpose:
# it is rebuilt by reindexing, and the COUPLING NOTE above records the desync a revert causes.
k8s_autodeploy_snapshot_pvcs: [karakeep-data]  # noqa var-naming[no-role-prefix]

karakeep_k8s_cpu_limit: "2"
karakeep_k8s_mem_limit: 2048Mi
karakeep_k8s_cpu_request: "100m"
karakeep_k8s_mem_request: 128Mi
# Headless Chrome spikes, so a generous cap.
karakeep_k8s_chrome_cpu_limit: "2"
karakeep_k8s_chrome_mem_limit: 2048Mi
karakeep_k8s_chrome_cpu_request: "100m"
karakeep_k8s_chrome_mem_request: 128Mi
# Mirrors resources('1.0', '1024M', '0.10', '128M').
karakeep_k8s_meili_cpu_limit: "1"
karakeep_k8s_meili_mem_limit: 1024Mi
karakeep_k8s_meili_cpu_request: "100m"
karakeep_k8s_meili_mem_request: 128Mi
# Mirrors resources('1.0', '512M', '0.05', '64M'). cpu 1.0 is deliberate: the boot-time
# `uv pip install` plus the per-cycle tag burst CFS-throttled ~67% of periods at 0.5.
karakeep_k8s_tagger_cpu_limit: "1"
karakeep_k8s_tagger_mem_limit: 512Mi
karakeep_k8s_tagger_cpu_request: "50m"
karakeep_k8s_tagger_mem_request: 64Mi

# The archive pruner (cronjob-archive-pruner.yaml.j2, files/karakeep_archive_pruner.py). A
# bookmark's age is days since its `modifiedAt`, which Karakeep sets when it is archived.
# After the first threshold the job detaches the screenshot; after the second it deletes the
# bookmark unless it is favourited, has a note or highlights, or carries a manually attached tag.
karakeep_k8s_pruner_schedule: "15 5 * * *"
karakeep_k8s_pruner_screenshot_days: 30
karakeep_k8s_pruner_delete_days: 90
# The operator read the dry runs' logs and turned this on on 2026-10-12. With it false the
# job logs what it would do and changes nothing, which is the way to pause it.
karakeep_k8s_pruner_apply: true
# A ceiling on deletions per run, so a bad clock or a misread response cannot empty the
# library in one night.
karakeep_k8s_pruner_max_deletes: 50
# Tags Karakeep records as `attachedBy: human` that no person attached. The time-tagger attaches
# through the REST API, whose default is `human`, and its script uses two sets of names: the
# `TIME_TAGS` list and what `estimate_reading_time` returns. tests/test_archive_pruner.py
# keeps this list equal to the union. A tag a rules-engine `addTag` attaches is `human` too;
# add it here if a dry run shows it protecting bookmarks.
karakeep_k8s_pruner_auto_tags: ["0-1m", "1-5m", "0-5m", "5-10m", "10-15m", "15-30m", "30m+"]
# The first API call retries for this long, covering kube-router's lag in admitting a new
# pod's source IP and a karakeep pod that is mid-restart when the deploy gate fires.
karakeep_k8s_pruner_connect_budget_seconds: 300
# The renderer sets the `karakeep-verify` timeout above this, so a hung gate run fails on its
# own deadline (scripts/renderer/renderer_lib/ordering.py:VERIFY_DEADLINE_MARGIN_S).
karakeep_k8s_pruner_deadline_seconds: 600

# 487M — the bookmark library, archived page snapshots and db.db. On `longhorn` (backed up)
# because it holds the only copy of the library.
karakeep_k8s_claim: karakeep-data
karakeep_k8s_storage_class: longhorn
karakeep_k8s_size: 4Gi

# The Meilisearch index: 286M, and deliberately NOT seeded and NOT backed up. It is a
# derived artifact: karakeep rebuilds it by reindexing from db.db, which IS seeded and backed
# up. The upgrade runbook in the role's CLAUDE.md already ends in "Reindex All Bookmarks".
karakeep_k8s_meili_claim: karakeep-meili
karakeep_k8s_meili_storage_class: longhorn-nobackup
karakeep_k8s_meili_size: 2Gi

# The time-tagger's script is vendored at files/karakeep-time-tagger.py rather than downloaded,
# because a ConfigMap must render from something that exists at render time and CI renders every
# template on a machine that has never deployed. It is 17K, far inside the 1M ConfigMap ceiling.
# test_karakeep_time_tagger_script.py pins it to the upstream commit URL and sha256.

# The claims the renderer emits for this role. The karakeep Kustomization applies them after the
# karakeep-snapshot Job; after a handback, k8s/manifests applies them ahead of the pre-apply
# snapshot.
# karakeep-meili is a plain claim on longhorn-nobackup: the Meilisearch index is derived from
# db.db and rebuilt with "Reindex All Bookmarks", so it is neither seeded nor worth B2
# transactions.
k8s_claims:  # noqa var-naming[no-role-prefix]
  - name: "{{ karakeep_k8s_claim }}"
    storage_class: "{{ karakeep_k8s_storage_class }}"
    size: "{{ karakeep_k8s_size }}"
  - name: "{{ karakeep_k8s_meili_claim }}"
    storage_class: "{{ karakeep_k8s_meili_storage_class }}"
    size: "{{ karakeep_k8s_meili_size }}"

# Under Flux the renderer copies the pruner CronJob into one Job per role revision, in
# `karakeep-verify` (scripts/renderer/renderer_lib/cronjob_gate.py). It replaced the
# k8s/cronjob-gate include at the flip. With
# karakeep_k8s_pruner_apply true the run deletes, so it is a mutation, and the named test shows
# a second run changes nothing.
flux_cronjob_gates:  # noqa var-naming[no-role-prefix]
  karakeep-archive-pruner:
    kind: mutation
    rerun_safe: ansible/roles/k8s/karakeep/tests/test_archive_pruner.py::test_a_second_run_changes_nothing
