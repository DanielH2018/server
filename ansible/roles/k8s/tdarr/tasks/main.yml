---
# Slice 4, B6 — tdarr.
#
# It moves alone, like jellyfin. What makes it its own batch is not the seam but the workload:
# it holds the GPU for minutes at a time on real files and rewrites the library IN PLACE, so it
# is the one media service where a wrong mount does lasting damage rather than a failed request.


# Two claims, created BEFORE the workload so the pod has PVCs to mount when it starts.
- name: Seed the tdarr server database
  tags: [deploy]
  ansible.builtin.include_role:
    name: k8s/volume-claim
  vars:
    volume_claim_service: tdarr
    volume_claim_name: "{{ tdarr_k8s_server_claim }}"
    volume_claim_storage_class: "{{ tdarr_k8s_storage_class }}"
    volume_claim_size: "{{ tdarr_k8s_server_size }}"

- name: Seed the tdarr flow and plugin configs
  tags: [deploy]
  ansible.builtin.include_role:
    name: k8s/volume-claim
  vars:
    volume_claim_service: tdarr
    volume_claim_name: "{{ tdarr_k8s_configs_claim }}"
    volume_claim_storage_class: "{{ tdarr_k8s_storage_class }}"
    volume_claim_size: "{{ tdarr_k8s_configs_size }}"

- name: Deploy tdarr to the cluster
  ansible.builtin.include_role:
    name: k8s/manifests
  vars:
    manifests_service: tdarr
    manifests_files:
      - deployment.yaml
      - service.yaml
      - ingressroute.yaml

- name: Prove the GPU and the library are reachable from inside the pod
  tags: [deploy]
  ansible.builtin.include_tasks: verify.yml
  # Every proof in verify.yml is about the pod this deploy rolled out. --check rolls nothing
  # out and skips the pod lookup, so the proofs would exec against nothing and their reports
  # would error on check-mode skip results. Same gate as jellyfin's (#2351).
  when: not ansible_check_mode
