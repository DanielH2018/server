---
# tdarr holds the GPU for minutes at a time on real files and rewrites the library IN PLACE, so
# it is the one media service where a wrong mount does lasting damage rather than a failed request.
#
# Flux owns tdarr (D5, Wave D), so no Ansible run reaches this file. The image pre-pull is the
# `tdarr-prepull` Kustomization (`flux_prepull_timeout` in defaults/main.yml), the VAAPI encode
# is the Deployment's `vaapi-encode` initContainer, and the device and library checks are the
# `tdarr-verify` Job in templates/verify/.

# Both claims are `k8s_claims` in defaults/main.yml, which k8s/manifests renders and applies
# ahead of the workload (#3387).
- name: Deploy tdarr to the cluster
  ansible.builtin.include_role:
    name: k8s/manifests
