---
# tdarr holds the GPU for minutes at a time on real files and rewrites the library IN PLACE, so
# it is the one media service where a wrong mount does lasting damage rather than a failed request.

# Both claims are `k8s_claims` in defaults/main.yml, which k8s/manifests renders and applies
# ahead of the workload (#3387).
- name: Deploy tdarr to the cluster
  ansible.builtin.include_role:
    name: k8s/manifests
  vars:
    manifests_service: tdarr
    # Live prune: an object dropped from manifests_files is deleted on the next deploy (#3388).
    manifests_prune: true
    # A cold pull of the 1.4 GiB image outlasts the shared default; the measurement is in
    # defaults/main.yml because the template's progressDeadlineSeconds reads it too.
    manifests_rollout_timeout: "{{ tdarr_k8s_rollout_timeout }}"
    manifests_files:
      - deployment.yaml
      - service.yaml
      - ingressroute.yaml

- name: Prove the GPU and the library are reachable from inside the pod
  tags: [deploy]
  ansible.builtin.include_tasks: verify.yml
  # Every proof in verify.yml is about the pod this deploy rolled out. --check rolls nothing
  # out and skips the pod lookup, so the proofs would exec against nothing and their reports
  # would error on check-mode skip results. Same gate as jellyfin's.
  when: not ansible_check_mode
