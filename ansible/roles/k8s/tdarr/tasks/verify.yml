---
# The GATE, not the exit criterion — same split as the jellyfin role. These prove the render node
# is reachable from tdarr's pod and that the library is writable. The actual
# proof is a real library file transcoding to completion and the output playing, which needs a
# job run and a human.

# WITHOUT THIS, EVERY PROOF BELOW RUNS AGAINST THE OUTGOING POD. k8s/manifests does not wait
# for a rollout — it QUEUES it for k8s/manifests/tasks/drain.yml, which drains the whole batch at the end.
# So a role's own verify tasks run before its rollout completes, and the pod lookup returns the
# pod that is being replaced, so a proof that differs between old and new pod fails a deploy
# that succeeded.
#
# `rollout status` and NOT a readiness wait — the old pod satisfies every readiness-shaped
# check, including the `--field-selector status.phase=Running` below, because phase stays
# Running while Terminating. See ansible/tests/deploy/test_inline_rollout_gates.py.
- name: Wait for the tdarr rollout to finish before verifying it
  tags: [deploy]
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n {{ k8s_namespace }} rollout status deployment/tdarr
      --timeout={{ tdarr_k8s_rollout_timeout }}
  become: true
  changed_when: false
  when: not ansible_check_mode

- name: Find the running tdarr pod
  tags: [deploy]
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n {{ k8s_namespace }} get pod -l app=tdarr
      --field-selector status.phase=Running -o jsonpath={.items[0].metadata.name}
  become: true
  changed_when: false
  register: tdarr_k8s_pod

# `: < dev` opens and closes WITHOUT reading. Reading blocks forever on a DRM render node once
# open() succeeds.
- name: Prove the render node can actually be opened
  tags: [deploy]
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n {{ k8s_namespace }} exec {{ tdarr_k8s_pod.stdout }} --
      sh -c "id; ls -l /dev/dri/renderD128; : < /dev/dri/renderD128 && echo OPEN_OK"
  become: true
  changed_when: false
  register: tdarr_k8s_device
  failed_when: "'OPEN_OK' not in tdarr_k8s_device.stdout"

- name: Show the device check
  tags: [deploy]
  ansible.builtin.debug:
    msg: "{{ tdarr_k8s_device.stdout_lines }}"

# The encode through tdarr's own ffmpeg is not here: the Deployment's `vaapi-encode`
# initContainer runs it before tdarr starts (#5451), so a failed encode holds the pod in
# Init and fails the `rollout status` gate above rather than an exec here.

# The library is the thing tdarr can damage, so prove it is both present and WRITABLE before
# trusting the pod. A read-only or empty /media reads as "no work to do" in the UI rather than as
# a fault — tdarr would simply report a library of zero files and look idle.
#
# Guarded on k8s_no_mutate: the touch/rm probe writes to the live media volume, which --dry-run
# must not do. Under `--check`/`--dry-run` this whole task (and its report below) is skipped, so
# a dry run proves the manifest but not library writability — the manifest apply itself is
# `--dry-run=server` under those modes, so no new pod exists to prove it against anyway.
- name: Prove the library is mounted and writable
  tags: [deploy]
  when: not k8s_no_mutate
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n {{ k8s_namespace }} exec {{ tdarr_k8s_pod.stdout }} --
      sh -c "ls /media | head -5; touch /media/.tdarr-write-probe && rm /media/.tdarr-write-probe
      && echo WRITABLE_OK"
  become: true
  changed_when: false
  register: tdarr_k8s_media
  failed_when: "'WRITABLE_OK' not in tdarr_k8s_media.stdout"

- name: Report the library check
  tags: [deploy]
  when: not k8s_no_mutate
  ansible.builtin.debug:
    msg: "{{ tdarr_k8s_media.stdout_lines }}"
