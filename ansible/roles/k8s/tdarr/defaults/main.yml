---
# Slice 4, B6 — the heaviest transcode consumer, and the workload that will find VAAPI's edges.
# B5 proved the device is reachable and that a 3-second synthetic encode succeeds; this one runs
# real files through it for minutes at a time.
# Pinned by DIGEST, carried across from the compose template along with its reason: tdarr is
# stateful AND rewrites library files in place. Upstream ships dev-tagged builds Renovate
# cannot track by version (this digest = dev_2.78.01, 2026-06-12), so a VERSION bump stays
# manual: pull :latest, take the new digest, redeploy. That is NOT the same as a DIGEST bump
# staying manual — renovate.json's k8s digest-bump packageRule automerges a re-push of this
# same tag after a 3-day soak (see the k8s_autodeploy_reason below), so this pin alone does not
# keep tdarr off auto-update.
#
# The `:latest` prefix is NOT redundant with the digest, and the compose copy does without it
# only because a different lint governs there. The digest is what pins; the tag is what
# Renovate's k8s-defaults manager matches on, and a digest-only pin slips its regex and would
# age forever with no update signal — which test_every_k8s_role_image_is_renovate_tracked
# refuses. Same shape as the dri-device-plugin role's pin, for the same reason.
tdarr_k8s_image: ghcr.io/haveagitgat/tdarr:latest@sha256:e5163f305367b47baacee761aa98f420fb4e46a8e5db22b197f23a550f96dd6b

# Auto-deploy stance — read by gitops_deploy (see the k8s auto-deploy coverage design).
# Promoted in slice 7b (2026-08-21) on deploy mechanics alone: k8s/manifests takes a pre-apply
# Longhorn snapshot of both config claims below and reverts them on a failed deploy. Two
# read-only audits then held it back (2026-08-22) — the snapshot/revert machinery itself works
# fine here, so this is not that hazard recurring. Three compounding reasons:
#   1. tdarr also mounts `media-data` (tdarr_k8s_media_claim below) — a shared RWX volume that
#      is NOT in k8s_autodeploy_snapshot_pvcs and is never reverted — and rewrites library files
#      on it IN PLACE, replacing the original with the transcode. Reverting the job/library DB
#      to before a completed transcode cannot undo that rewrite: the DB then points at an
#      untranscoded original that no longer exists on media-data, or re-transcodes a file it
#      already finished. Destructive and irreversible, unlike the recoverable bookkeeping desync
#      its siblings (zigbee2mqtt, livesync, qbittorrent) have for the same "state coupled
#      outside the volume" reason.
#   2. It declares two claims (tdarr-configs, tdarr-server) and volume-revert reverts per claim,
#      so a failed deploy can leave the pair at different points in time.
#   3. The digest pin's "stays manual" intent is enforced by nothing: it is true only for
#      VERSION bumps, since upstream ships no stable tag Renovate can read a semver out of. A
#      digest re-push is a different kind of update, and renovate.json's digest-bump rule
#      matches ansible/roles/k8s/** with automerge + platformAutomerge true after a 3-day soak,
#      with no tdarr exclusion — exactly what a `:latest@sha256:` pin receives.
# k8s_autodeploy_snapshot_pvcs stays declared below: it still protects a manual deploy.
k8s_autodeploy: false  # noqa var-naming[no-role-prefix]
k8s_autodeploy_reason: "state coupled outside the volume — rewrites media-data (shared RWX, not reverted) in place, an irreversible transcode the snapshot/revert can't undo; ALSO non-atomic two-claim revert (tdarr-configs, tdarr-server); ALSO the digest pin's 'stays manual' intent is unenforced — renovate.json automerges a digest re-push after a 3-day soak with no tdarr exclusion"  # noqa var-naming[no-role-prefix]
# Slice 7a task 3 — the pre-apply Longhorn snapshot k8s/manifests takes via k8s/volume-snapshot.
# Two claims, two seeds — same pairing as tdarr_k8s_server_claim/tdarr_k8s_configs_claim below.
# Declared regardless of k8s_autodeploy — protects a manual deploy.
k8s_autodeploy_snapshot_pvcs: [tdarr-configs, tdarr-server]  # noqa var-naming[no-role-prefix]

# ── two config claims, not one ──────────────────────────────────────────────────────────────
# /app/server is the 204 M database (library state, transcode history, node registrations) and
# /app/configs is 20 K of flow/plugin definitions. They are separate mounts in the compose file
# and stay separate here: seeding one claim from the tdarr directory root would drag logs/ and
# transcode_cache/ onto Longhorn as well, which is precisely the write-heavy churn the volumes
# below keep off it.
tdarr_k8s_server_claim: tdarr-server
tdarr_k8s_server_size: 3Gi
tdarr_k8s_server_source_path: /home/ubuntu/server/containers/tdarr/server

tdarr_k8s_configs_claim: tdarr-configs
tdarr_k8s_configs_size: 1Gi
tdarr_k8s_configs_source_path: /home/ubuntu/server/containers/tdarr/configs

# `longhorn` — backed up. Briefly `longhorn-nobackup` on 2026-08-08, after B2's TRANSACTION cap
# fired twice in a week (08-02, 08-08) as slice 4 took Longhorn's daily run from 4 to 15 backups and
# incremental backups bound bandwidth, not transactions. Returned the same day: the exclusion left
# this volume with a single frozen 08-08 restore point, and whether steady-state incrementals are
# actually the problem cannot be read off anything Longhorn or B2 expose. So it is being tested
# rather than assumed, with B2 Reachable as the readout. docs/b2-transaction-cap-monitoring-gaps.md.
tdarr_k8s_storage_class: longhorn

# ── the media mount ─────────────────────────────────────────────────────────────────────────
# READ-WRITE, unlike jellyfin's two read-only mounts, and that asymmetry is the point: tdarr
# rewrites library files IN PLACE. It is the one media consumer that must be able to.
#
# subPath `media` at /media, NOT the whole tree at /data. That reproduces the compose mount
# (containers/data/media -> /media) exactly, and the path matters for the same reason it does
# for the *arrs (D4): tdarr's database stores absolute in-container paths, so a library rooted
# anywhere else loads fine and then fails to match a single file. It gets no access to
# torrents/ — nothing in tdarr's job reaches into an in-flight download.
tdarr_k8s_media_claim: media-data
tdarr_k8s_media_subpath: media

tdarr_k8s_webui_port: 8265
# The server port internal nodes connect to. `internalNode: true` means the only node is the one
# inside this container, reaching it over loopback — so this is deliberately NOT in the Service.
# Exposing it would publish an unauthenticated control channel for a process that rewrites media.
tdarr_k8s_server_port: 8266

# The extended resource the dri-device-plugin advertises (dri-device-plugin daemonset.yaml.j2).
# Named here rather than spelled inline in the manifest, so the manifest reads unambiguously.
# It is NOT in lockstep with anything, and the comment here said it was until 2026-08-23b review
# L7: jellyfin_k8s_dri_resource is a SEPARATE literal that happens to match, as are the plugin's
# DaemonSet and monitor-bridge's K8S_EXTENDED_RESOURCES default. Four independent strings.
# A rename catching only some of them leaves this pod requesting a resource nothing advertises —
# unschedulable, not a loud error — or leaves monitor-bridge fail-closed-paging for a resource
# that is fine. ansible/tests/test_dri_resource_name_agrees.py is what actually couples them.
tdarr_k8s_dri_resource: devic.es/dri

tdarr_k8s_cpu_limit: "6"
tdarr_k8s_mem_limit: 4096Mi
tdarr_k8s_cpu_request: "250m"
tdarr_k8s_mem_request: 256Mi
