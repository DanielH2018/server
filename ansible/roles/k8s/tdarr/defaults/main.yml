---
# tdarr is the heaviest transcode consumer: it runs real files through VAAPI for minutes at a time.
# Pinned by a VERSION TAG plus its digest, because tdarr is stateful AND rewrites library files in
# place. Upstream pushes a numeric tag to ghcr.io for every release, so Renovate reads the version
# off the tag and a major release arrives labelled as one. The `:latest@sha256:` pin this
# replaced changed only its digest, which is how #4550 carried Tdarr v3 with no version anywhere
# in its title, body or diff (#4555). The image's OCI version label reads `dev_<version>_<date>`
# on every build, this one included; `dev_` names upstream's build channel, not a pre-release.
#
# The digest is what pins; the tag is what Renovate's k8s-defaults manager matches on. A
# digest-only pin slips its regex and would age forever with no update signal, which
# test_every_k8s_role_image_is_renovate_tracked refuses. A bump never merges itself: renovate.json
# turns automerge off for every role the auto-deploy denylist holds, this one included.
tdarr_k8s_image: ghcr.io/haveagitgat/tdarr:3.00.00@sha256:7ba5325ea64951181a30f2a8d5bbc4fc0985e4c275ea1d09d15491b47b4cd8d6

# The rollout budget, declared once. Read by THREE places, so none of them can drift: the
# `manifests_rollout_timeout` passed to k8s/manifests in tasks/main.yml, the inline `rollout
# status` gate in tasks/verify.yml, and `progressDeadlineSeconds` in templates/deployment.yaml.j2.
# The deadline has to move with the budget: at the 600s Kubernetes default, `rollout status`
# fails on ProgressDeadlineExceeded whatever `--timeout` says.
#
# The image is 1432 MiB compressed (node status `sizeBytes`, 2026-10-09), five times
# flaresolverr's. Its pull on daniel-box took 25m37s on 2026-10-08 (`Pulling` at 23:50:48,
# container started 00:16:25, #3689), about 0.93 MiB/s. That is not a one-evening ghcr.io
# outlier: prowlarr's 278 MiB flaresolverr pull took 8m54s (#2369), about 0.52 MiB/s, so a
# tdarr pull sits between 1537s and roughly 2750s on this line. 3000s covers the slow end, the
# rule manifests_rollout_timeout_default states. The Deployment is `Recreate`, so tasks/main.yml
# pulls the image before the apply and the old pod serves through the pull (#3875). The budget
# still covers a cold pull: it also bounds that pre-pull task.
tdarr_k8s_rollout_timeout: 3000s

# Auto-deploy stance — read by gitops_deploy (see the k8s auto-deploy coverage design).
# k8s/manifests takes a pre-apply Longhorn snapshot of both config claims below and reverts
# them on a failed deploy, and that machinery works here. Auto-deploy stays off for two
# compounding reasons:
#   1. tdarr also mounts `media-data` (tdarr_k8s_media_claim below) — a shared RWX volume that
#      is NOT in k8s_autodeploy_snapshot_pvcs and is never reverted — and rewrites library files
#      on it IN PLACE, replacing the original with the transcode. Reverting the job/library DB
#      to before a completed transcode cannot undo that rewrite: the DB then points at an
#      untranscoded original that no longer exists on media-data, or re-transcodes a file it
#      already finished. Destructive and irreversible, unlike the recoverable bookkeeping desync
#      its siblings (zigbee2mqtt, livesync, qbittorrent) have for the same "state coupled
#      outside the volume" reason.
#   2. It declares two claims (tdarr-configs, tdarr-server) and volume-revert reverts per claim,
#      so a failed deploy can leave the pair at different points in time.
# k8s_autodeploy_snapshot_pvcs stays declared below: it still protects a manual deploy.
k8s_autodeploy: false  # noqa var-naming[no-role-prefix]
k8s_autodeploy_reason: "state coupled outside the volume — rewrites media-data (shared RWX, not reverted) in place, an irreversible transcode the snapshot/revert can't undo; ALSO non-atomic two-claim revert (tdarr-configs, tdarr-server)"  # noqa var-naming[no-role-prefix]
# The pre-apply Longhorn snapshot k8s/manifests takes via k8s/volume-snapshot.
# Two claims, two seeds — same pairing as tdarr_k8s_server_claim/tdarr_k8s_configs_claim below.
# Declared regardless of k8s_autodeploy — protects a manual deploy.
k8s_autodeploy_snapshot_pvcs: [tdarr-configs, tdarr-server]  # noqa var-naming[no-role-prefix]

# ── two config claims, not one ──────────────────────────────────────────────────────────────
# /app/server is the 204 M database (library state, transcode history, node registrations) and
# /app/configs is 20 K of flow/plugin definitions. They stay two claims rather than one:
# seeding one claim from the tdarr directory root would drag logs/ and
# transcode_cache/ onto Longhorn as well, which is precisely the write-heavy churn the volumes
# below keep off it.
tdarr_k8s_server_claim: tdarr-server
tdarr_k8s_server_size: 3Gi

tdarr_k8s_configs_claim: tdarr-configs
tdarr_k8s_configs_size: 1Gi

# `longhorn` — backed up. Excluding this volume would leave it with a single frozen restore
# point. B2 Reachable is the readout for whether its incrementals strain B2's TRANSACTION cap.
tdarr_k8s_storage_class: longhorn

# The claims k8s/manifests renders and applies for this role, ahead of the workload.
k8s_claims:  # noqa var-naming[no-role-prefix]
  - name: "{{ tdarr_k8s_server_claim }}"
    storage_class: "{{ tdarr_k8s_storage_class }}"
    size: "{{ tdarr_k8s_server_size }}"
  - name: "{{ tdarr_k8s_configs_claim }}"
    storage_class: "{{ tdarr_k8s_storage_class }}"
    size: "{{ tdarr_k8s_configs_size }}"

# ── the media mount ─────────────────────────────────────────────────────────────────────────
# READ-WRITE, unlike jellyfin's two read-only mounts, and that asymmetry is the point: tdarr
# rewrites library files IN PLACE. It is the one media consumer that must be able to.
#
# subPath `media` at /media, NOT the whole tree at /data. The path matters for the same reason
# it does
# for the *arrs (D4): tdarr's database stores absolute in-container paths, so a library rooted
# anywhere else loads fine and then fails to match a single file. It gets no access to
# torrents/ — nothing in tdarr's job reaches into an in-flight download.
tdarr_k8s_media_claim: media-data
tdarr_k8s_media_subpath: media

tdarr_k8s_webui_port: 8265
# The server port internal nodes connect to. `internalNode: true` means the only node is the one
# inside this container, reaching it over loopback — so this is deliberately NOT in the Service.
# Exposing it would publish an unauthenticated control channel for a process that rewrites media.
tdarr_k8s_server_port: 8266

# The extended resource the dri-device-plugin advertises (dri-device-plugin daemonset.yaml.j2).
# Named here rather than spelled inline in the manifest, so the manifest reads unambiguously.
# It is NOT in lockstep with anything: jellyfin_k8s_dri_resource is a SEPARATE literal that
# happens to match, as are the plugin's DaemonSet and the cluster's extended-resource check,
# which watches the name kube-state-metrics sanitises it to. A rename catching only some of them
# leaves this pod requesting a resource nothing advertises — unschedulable, not a loud error — or
# leaves the extended-resource check paging fail-closed for a resource that is fine.
# ansible/tests/services/test_dri_resource_name_agrees.py is what actually couples them.
tdarr_k8s_dri_resource: devic.es/dri

tdarr_k8s_cpu_limit: "6"
tdarr_k8s_mem_limit: 4096Mi
tdarr_k8s_cpu_request: "250m"
tdarr_k8s_mem_request: 256Mi
