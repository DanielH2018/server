---
# No Flux path runs this file: the tag is flux-owned from its first commit. It stays so the role
# has the shape every k8s role has, and the renderer reads the include's vars. The controller and
# the CRD are in files/upstream/, which the renderer attaches to the bundle verbatim, and the
# Plans are templates. The include has no workload of its own to roll.
- name: Deploy system-upgrade-controller to the cluster
  ansible.builtin.include_role:
    name: k8s/manifests
  vars:
    manifests_rollout: ''
