---
livesync_k8s_image: couchdb:3.5.2@sha256:5fc596110eac7f412173a7d9de14f70aa5d3e816790fb6e70642755d4a4cf464

# Auto-deploy stance — read by gitops_deploy (see the k8s auto-deploy coverage design).
# DENIED — state coupling, not missing recovery. The volume's state is coupled to something
# the snapshot cannot capture: the CouchDB revisions on connected Obsidian clients. A revert rewinds the server's B-tree while
# every synced client still holds the newer revisions it already pushed, and replaying those
# against the reverted DB invites a conflict storm an un-reverted rollback would not cause.
# The snapshot and revert machinery work fine here — they are not why this is denied.
k8s_autodeploy: false  # noqa var-naming[no-role-prefix]
k8s_autodeploy_reason: "state coupled outside the volume — reverting the CouchDB B-tree to a snapshot desynchronises it from connected Obsidian clients' already-synced revisions, inviting a conflict storm an un-reverted rollback would not cause; the pre-apply snapshot and revert work fine and are not the blocker"  # noqa var-naming[no-role-prefix]
# The pre-apply Longhorn snapshot k8s/manifests takes via k8s/volume-snapshot.
# Declared regardless of k8s_autodeploy — protects a manual deploy too.
k8s_autodeploy_snapshot_pvcs: [livesync-data]  # noqa var-naming[no-role-prefix]
livesync_k8s_cpu_limit: "1"
livesync_k8s_mem_limit: 1024Mi
livesync_k8s_cpu_request: "100m"
livesync_k8s_mem_request: 128Mi

# On longhorn-NOBACKUP, and that is the deliberate part. It is a CouchDB B-tree rewritten
# daily — a new content-defined object every snapshot, so it dedupes poorly — and it drives
# B2 hidden-version churn. The vault's source of truth is the markdown on each Obsidian
# client, and LiveSync's "Rebuild everything" re-uploads the DB from a device, so the server
# copy is regenerable.
#
# Backing it up would therefore ADD recurring B2 load, against a Class C budget of ~1,660/day
# with a 2,500 cap.
livesync_k8s_claim: livesync-data
livesync_k8s_storage_class: longhorn-nobackup
livesync_k8s_size: 2Gi

# The claim k8s/manifests renders and applies for this role, ahead of the pre-apply snapshot.
k8s_claims:  # noqa var-naming[no-role-prefix]
  - name: "{{ livesync_k8s_claim }}"
    storage_class: "{{ livesync_k8s_storage_class }}"
    size: "{{ livesync_k8s_size }}"
