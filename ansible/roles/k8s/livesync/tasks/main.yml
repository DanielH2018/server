---
# Create the data volume claim BEFORE deploying the workload, so the pod has a PVC to mount
# when it starts.
- name: Create the livesync data volume claim
  tags: [deploy]
  ansible.builtin.include_role:
    name: k8s/seed-volume
  vars:
    seed_volume_service: livesync
    seed_volume_claim: "{{ livesync_k8s_claim }}"
    seed_volume_storage_class: "{{ livesync_k8s_storage_class }}"
    seed_volume_size: "{{ livesync_k8s_size }}"

- name: Deploy livesync to the cluster
  ansible.builtin.include_role:
    name: k8s/manifests
  vars:
    manifests_service: livesync
    manifests_files:
      - configmap.yaml
      - deployment.yaml
      - service.yaml
    manifests_secret_files:
      - secret.yaml
