---
# The claim is `k8s_claims` in defaults/main.yml; k8s/manifests renders and applies it.
- name: Deploy livesync to the cluster
  ansible.builtin.include_role:
    name: k8s/manifests
  vars:
    manifests_service: livesync
    manifests_files:
      - configmap.yaml
      - deployment.yaml
      - service.yaml
    manifests_secret_files:
      - secret.yaml
