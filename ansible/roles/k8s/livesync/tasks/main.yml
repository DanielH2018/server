---
# Seed BEFORE the workload starts. CouchDB writes a fresh _users/_dbs set on first boot against
# an empty data dir, so a pod that started first would leave the seed copying over a database
# the running process already holds open.
- name: Seed the livesync data volume
  tags: [deploy]
  ansible.builtin.include_role:
    name: k8s/seed-volume
  vars:
    seed_volume_service: livesync
    seed_volume_claim: "{{ livesync_k8s_claim }}"
    seed_volume_source_path: "{{ livesync_k8s_source_path }}"
    seed_volume_storage_class: "{{ livesync_k8s_storage_class }}"
    seed_volume_size: "{{ livesync_k8s_size }}"

- name: Deploy livesync to the cluster
  ansible.builtin.include_role:
    name: k8s/manifests
  vars:
    manifests_service: livesync
    manifests_files:
      - configmap.yaml
      - deployment.yaml
      - service.yaml
      - ingressroute.yaml
    manifests_secret_files:
      - secret.yaml
