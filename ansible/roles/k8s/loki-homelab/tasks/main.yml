---
# Slice-7 Phase D.2 (2026-08-10): the homelab log store, SEPARATE from the claude-otel Loki
# by decision KL1 (slice-7-phase-d-loki.md) — merging would give the verbatim-prompts store
# the LAN route it deliberately lacks. Ships with the KL3 pod-log DaemonSet, which is what
# un-darkens terraria-stats and restores log-based checks for cluster services.

- name: Deploy loki-homelab to the cluster
  ansible.builtin.include_role:
    name: k8s/manifests
  vars:
    manifests_service: loki-homelab
    manifests_rollout: loki-homelab
    manifests_files:
      - configmap.yaml
      - pvc.yaml
      - deployment.yaml
      - service.yaml
      - ingressroute.yaml
      - promtail-daemonset.yaml

- name: Restart the promtail DaemonSet after a config change
  tags: [deploy]
  # manifests_rollout above names the loki-homelab DEPLOYMENT, so the shared role's
  # rollout-restart only ever reaches that one object; promtail reads the same ConfigMap and
  # is a DaemonSet. This makes config delivery to it explicit, matching what claude-otel
  # does for its own collector DaemonSet.
  #
  # Belt-and-braces by intent: promtail also reloads its config file on its own (it logs
  # "Reloading configuration file"), so this is a guarantee rather than the sole delivery
  # path — a ConfigMap propagating to a mounted volume is eventually-consistent, and a
  # deploy that reports green should not depend on that timing.
  #
  # Skipped when this run created the DaemonSet — its pods start on the new config already,
  # and `rollout restart` would race the initial rollout.
  ansible.builtin.command:
    cmd: k3s kubectl -n {{ k8s_namespace }} rollout restart daemonset/promtail
  become: true
  changed_when: true
  when:
    - manifests_render is changed
    - not manifests_apply.stdout is search('daemonset\.apps/promtail created')
