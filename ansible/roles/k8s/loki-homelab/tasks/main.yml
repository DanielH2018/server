---
# The homelab log store, SEPARATE from the observability Loki — merging would give the
# verbatim-prompts store the LAN route it deliberately lacks. Ships with the pod-log DaemonSet
# (Grafana Alloy) that feeds terraria-stats and the log-based checks for cluster services.

- name: Deploy loki-homelab to the cluster
  ansible.builtin.include_role:
    name: k8s/manifests
  vars:
    manifests_service: loki-homelab
    manifests_rollout: loki-homelab
    manifests_files:
      - configmap.yaml
      - pvc.yaml
      - deployment.yaml
      - service.yaml
      - ingressroute.yaml
      # daniel-pi's push-only door. A separate router rather than another CIDR on the one
      # above — see the template for why that distinction is the whole point.
      - ingressroute-push.yaml
      - alloy-daemonset.yaml
    # manifests_rollout names the loki-homelab DEPLOYMENT; the Alloy shipper reads the same
    # ConfigMap and is a DaemonSet, so it is rolled as an extra. The shared role skips the
    # restart on the run that created it, and queues it for the batch drain like any other.
    manifests_extra_rollouts:
      - name: alloy
        kind: daemonset
