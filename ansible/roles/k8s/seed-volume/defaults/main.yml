---
# Auto-deploy stance — read by gitops_deploy (see the k8s auto-deploy coverage design).
# NOT covered by the completeness/consistency guard: _roles() in
# ansible/tests/test_k8s_autodeploy_guard.py excludes shared roles ("manifests", "seed-volume"),
# so this declaration is inert even for the guard, not just for the deployer. seed-volume is
# absent from gitops_deploy_k8s_autodeploy_denylist today, which makes it auto-deployable by the
# CSV's own rule — declared false here because that is the honest answer, not the current one:
# it renders a bare Pod (seed-pod.yaml.j2), never a Deployment, so there is nothing for
# `rollout status` to gate, and it is the shared PVC-seeding path every migrating-state role
# above (prowlarr, sonarr, home-assistant, ...) depends on — a stray auto-deploy here has an
# outsized blast radius for a role that is otherwise invisible to this whole mechanism. Whoever
# writes 1b needs to decide whether the filter plugin reads shared roles at all.
k8s_autodeploy: false  # noqa var-naming[no-role-prefix]
k8s_autodeploy_reason: "renders a bare Pod, not a Deployment — nothing for rollout status to gate; shared PVC-seeding path for every migrating-state role, so a stray auto-deploy has outsized blast radius. Absent from the CSV denylist and NOT covered by the completeness/consistency guard (_roles() excludes shared roles) — a real gap, not a mirrored one"  # noqa var-naming[no-role-prefix]

# Where the data comes from. daniel-server is the only source in slice 2 — every Docker
# service being migrated lives there — but it is a variable because slice 5 moves services
# off the Pi.
seed_volume_source_host: daniel-server
# Absolute path on the source host. No default: a wrong guess here silently seeds the wrong
# directory, and the failure only shows up as an application that has lost its data.
# seed_volume_source_path: /home/ubuntu/server/containers/<svc>/config

# PVC. seed_volume_claim defaults to <service>-data in the calling role.
seed_volume_size: 1Gi
seed_volume_storage_class: longhorn
# Mount point inside the short-lived seed pod. Not the application's mount path — nothing in
# this role knows or cares where the real workload will mount the claim.
seed_volume_mount: /data
# busybox tar + sha256sum are enough, and a small image keeps the seed pod's own startup off
# the critical path of a migration window where the Docker service is already stopped.
seed_volume_image: alpine:3.24
# How long the seed pod lingers before its own timeout kills it, in case a play dies between
# creating the pod and deleting it. Long enough for a slow copy, short enough not to leak.
seed_volume_pod_ttl: 3600
# Bypass the .seeded marker and re-copy. The cutover run sets this; see tasks/main.yml.
seed_volume_force: false

# Whether a source that changes mid-copy is acceptable. Derived from seed_volume_force rather
# than set independently, because the two always want opposite answers and tying them removes
# a flag someone has to remember:
#
#   coexistence seed (force=false) — the Docker service is still running and still writing, so
#   a torn snapshot is unavoidable and fine. The k8s copy is not authoritative yet.
#
#   cutover seed (force=true) — the Docker service has been stopped precisely so the source
#   holds still. A source that moves here means it was NOT stopped, and accepting that copy
#   would silently lose whatever was written after the read began.
seed_volume_allow_moving_source: "{{ not (seed_volume_force | default(false) | bool) }}"
