---
# Copy a Docker bind-mount directory from another host into a Longhorn PVC, and prove the
# copy landed before saying so.
#
# Callers set:
#   seed_volume_service        service name (labels the manifest directory)
#   seed_volume_claim          PVC name
#   seed_volume_source_path    absolute path on seed_volume_source_host
#   seed_volume_size / _storage_class   as needed
#   seed_volume_quiesce        Deployments to scale to zero for the copy (default none)
#
# The verification is the point of this role. A partial copy is the failure mode that matters
# — livesync losing notes, n8n losing credentials — and it is invisible without an explicit
# comparison, because a half-populated volume mounts and starts perfectly well.
#
# ONE-SHOT AND IDEMPOTENT. A `.seeded` marker inside the volume makes a rerun a no-op. That
# marker is load-bearing in the other direction too: rerunning against a volume the
# application has since written to would overwrite live data with a stale snapshot.
#
# AND CHEAP, because that no-op runs 25 times on every deploy. Reading the marker means mounting
# the volume, which means the seed pod — 8 tasks to learn nothing changed. So a successful seed
# also annotates the PVC `homelab.daniel-hunter.com/seeded=true`, and a run that sees the
# annotation skips the pod cycle entirely. The annotation is a projection of the marker, not a
# replacement for it: the marker remains the authority, and any run that does start a seed pod
# still reads it. See THE SHORT-CIRCUIT below.
#
# A ROLE THAT SEEDS TWO CLAIMS WILL TRIP THE SSH RATE-LIMITER. Each seed opens several
# connections to the source host, and `ufw limit ssh` there REJECTs the 6th within 30 s, so the
# second claim dies on
#     ssh: connect to host 10.0.0.161 port 22: Connection refused
# after the first has succeeded (measured 2026-08-08 building the tdarr role, which seeds
# /app/server and /app/configs). It self-clears in ~60 s. Re-run WITHOUT seed_volume_force to
# resume: the completed claim's marker makes it skip while the unseeded one still copies.
# Re-running WITH force would re-copy both, which is safe but pointlessly re-transfers the
# claim that already verified.
#
# EXCEPT AT CUTOVER, which is why seed_volume_force exists. Slice 2 seeds each volume twice:
# once while both copies run, so the k8s workload has real data to be exercised against, and
# again at cutover once the Docker service is stopped and the source has stopped moving. Only
# the second copy is authoritative. Pass seed_volume_force=true for it — the marker alone
# would make the run that actually matters a silent no-op.
#
# THE SOURCE MUST BE QUIESCENT. Stop the Docker service before running this. Nothing here can
# detect a file being rewritten mid-stream; it would checksum the copy against a source that
# has since moved and report a mismatch it cannot explain.
#
# SO MUST THE DESTINATION, at a re-seed. The first seed runs before the workload exists, so
# this only matters at cutover — by then the k8s copy has been serving and writing for hours.
# Pass seed_volume_quiesce with the Deployments that write to the claim (karakeep: the app and
# its time-tagger, both SQLite writers; not chrome or meilisearch, which touch a different
# volume) and they are scaled to zero for the copy and back afterwards.

# k8s/manifests creates this too, but seed-volume deliberately runs BEFORE it — the workload
# must not start against an unseeded claim — so it cannot rely on that. Both are idempotent.
- name: Create the manifest directory for {{ seed_volume_service }}
  tags: [config]
  ansible.builtin.file:
    path: "/etc/rancher/k3s/manifests/{{ seed_volume_service }}"
    state: directory
    mode: "0700"
    owner: root
    group: root
  become: true

# WHERE THE SEED POD HAS TO RUN. It mounts the service's RWO claim, so if the workload is
# already running, that volume is attached to the node the workload sits on. An
# unconstrained seed pod scheduled onto the *other* node wedges in ContainerCreating with
#     Multi-Attach error for volume "pvc-..." Volume is already used by pod(s) ...
# until the 180s wait below gives up and fails the play — taking every service ordered
# after it in containers_list with it.
#
# This is not a race that retrying wins. Measured 2026-08-14 across seven services and ten
# attempts: the scheduler put the seed pod on daniel-box every single time, while every
# affected workload sat on daniel-server. It went unnoticed until then because it cannot
# happen on a single-node cluster, and daniel-server only joined on 2026-08-13.
#
# So ask the cluster where the volume actually is, rather than hoping. Both lookups come
# back empty on a first seed — the PVC is unbound and nothing is attached yet — and the
# template then omits the nodeSelector, leaving the scheduler free to place the pod, which
# is correct: there is no workload to collide with.
#
# Two reads in one kubectl call, because this is the hot path: 25 claims are seeded on every
# deploy and every one of them is already seeded, so the whole cost of this role in steady
# state is module executions that conclude "nothing to do". Folding the seed-state read into
# the lookup that had to happen anyway makes the short-circuit below free.
- name: Find the PersistentVolume and prior seed state for {{ seed_volume_claim }}
  tags: [config]
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n {{ k8s_namespace }} get pvc {{ seed_volume_claim }}
      -o jsonpath={.spec.volumeName}|{.metadata.annotations.homelab\.daniel-hunter\.com/seeded}
  register: seed_volume_pv
  become: true
  changed_when: false
  # A missing PVC is the first-seed case, not an error.
  failed_when: false

# THE SHORT-CIRCUIT. When the annotation says this claim is already seeded, everything the seed
# pod exists to do — start it, wait for it, read the in-volume `.seeded` marker, delete it — is
# a round trip to learn something already recorded on the PVC. Skipping it drops 8 of this
# role's 12 tasks per claim.
#
# It reads the annotation rather than the `.seeded` marker because the marker is INSIDE the
# volume, and the only way to read it is the pod cycle this is trying to avoid. The annotation
# is that marker projected somewhere readable without mounting anything; the task at the bottom
# of this file is what keeps the two in step.
#
# `kubectl apply` does not prune it. The PVC template declares no annotations, and client-side
# apply only removes keys that were in the previous last-applied-configuration — verified live
# on freshrss-config, whose baseline carries `"annotations":{}` while four controller-set
# annotations survive every apply.
#
# FORCE ALWAYS TAKES THE LONG PATH. seed_volume_force exists precisely to overrule the marker at
# a cutover (see this file's header), so a gate that outranked it would silently turn the one
# run that matters into a no-op — the same failure test_seed_volume_force.py guards from the
# other direction.
- name: Note the PV and whether the seed pod can be skipped for {{ seed_volume_claim }}
  tags: [config]
  ansible.builtin.set_fact:
    seed_volume_pv_name: "{{ seed_volume_pv.stdout | default('') | split('|') | first | trim }}"
    seed_volume_short_circuit: >-
      {{ (seed_volume_pv.stdout | default('') | split('|') | last | trim) == 'true'
         and not (seed_volume_force | default(false) | bool) }}

# VolumeAttachment is the authoritative answer to "which node is this volume on" — it is
# what the attach/detach controller writes, and it is what the Multi-Attach check reads.
# Filtering on status.attached matters: a detaching volume keeps its object briefly.
- name: Find the attached node for {{ seed_volume_claim }}
  tags: [config]
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      k3s kubectl get volumeattachment --no-headers
      -o custom-columns=PV:.spec.source.persistentVolumeName,NODE:.spec.nodeName,ATTACHED:.status.attached
      | awk -v pv={{ seed_volume_pv_name | quote }} '$1==pv && $3=="true" {print $2; exit}'
    executable: /bin/bash
  register: seed_volume_attachment
  become: true
  changed_when: false
  failed_when: false
  # Only the seed pod needs pinning, so a run that starts no seed pod needs no answer.
  when:
    - not (seed_volume_short_circuit | bool)
    - seed_volume_pv_name | length > 0

# Deliberately NOT gated on the short-circuit, unlike the lookup that feeds it. set_fact
# persists for the host across role invocations, so skipping this would leave the PREVIOUS
# claim's node pinned here — and the next claim that does render a seed pod would inherit it.
# Running it always is cheap and self-clearing: a skipped lookup registers no stdout, so the
# default below resolves to the empty string, which is the same "let the scheduler choose"
# answer a first seed gets.
- name: Note which node the seed pod must be pinned to
  tags: [config]
  ansible.builtin.set_fact:
    seed_volume_node: "{{ (seed_volume_attachment.stdout | default('')) | trim }}"

- name: Render the volume manifests for {{ seed_volume_service }}
  tags: [config]
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/rancher/k3s/manifests/{{ seed_volume_service }}/{{ item }}"
    mode: "0644"
    owner: root
    group: root
  # pvc.yaml always: this role is the only thing that creates the PVC for the 16 caller roles
  # that render no PVC template of their own, so the short-circuit must never skip it.
  # seed-pod.yaml only when a seed pod is going to be started.
  loop: >-
    {{ ['pvc.yaml'] + ([] if seed_volume_short_circuit | bool else ['seed-pod.yaml']) }}
  become: true

- name: Create the PVC for {{ seed_volume_claim }}
  tags: [deploy]
  ansible.builtin.command:
    cmd: "k3s kubectl apply -f /etc/rancher/k3s/manifests/{{ seed_volume_service }}/pvc.yaml"
  register: seed_volume_pvc
  become: true
  changed_when: "'created' in seed_volume_pvc.stdout"

- name: Start the seed pod for {{ seed_volume_claim }}
  tags: [deploy]
  when: not (seed_volume_short_circuit | bool)
  ansible.builtin.command:
    cmd: "k3s kubectl apply -f /etc/rancher/k3s/manifests/{{ seed_volume_service }}/seed-pod.yaml"
  register: seed_volume_pod
  become: true
  changed_when: "'created' in seed_volume_pod.stdout"

- name: Wait for the seed pod to be ready
  tags: [deploy]
  when: not (seed_volume_short_circuit | bool)
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n {{ k8s_namespace }} wait --for=condition=Ready
      pod/seed-{{ seed_volume_claim }} --timeout=180s
  become: true
  changed_when: false

- name: Check the seed marker on {{ seed_volume_claim }}
  tags: [deploy]
  when: not (seed_volume_short_circuit | bool)
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n {{ k8s_namespace }} exec seed-{{ seed_volume_claim }} --
      test -f {{ seed_volume_mount }}/.seeded
  register: seed_volume_marker
  become: true
  failed_when: false
  changed_when: false

# Everything below runs only when a copy actually happens. Verifying on a run that copied
# nothing compares a point-in-time snapshot against a source the Docker twin is still writing
# to, so it fails the moment the two diverge — which, for a service under coexistence, is
# within minutes. That made every later deploy of an already-seeded service fail on a
# difference that is expected and correct.
# The short-circuit branch is FIRST and returns a hard false, which matters more here than
# anywhere else in this file. Skipping the seed pod skips the marker check with it, so there is
# no marker reading to consult — and a skipped Ansible task still registers, as a dict with no
# `rc`, so an expression that reaches for it gets whatever that dict happens to yield rather
# than an answer. Any form that consults the marker here resolves to "copy": measured by
# mutating this expression to the tidier `(seed_volume_marker.rc | default(1)) != 0 or force`,
# which renders True and would tar a long-gone source over all 25 live volumes.
#
# The else branch deliberately has no default on `.rc`: it is only reachable when the marker
# task ran, so an undefined `.rc` there means an invariant broke, and stopping the play is the
# correct answer to that. A default would convert it into a silent copy. Jinja's conditional
# expression is lazy, so the else branch is not evaluated when the short-circuit is taken.
- name: Decide whether this run copies
  tags: [deploy]
  ansible.builtin.set_fact:
    seed_volume_copying: >-
      {{ false if (seed_volume_short_circuit | bool)
         else (seed_volume_marker.rc != 0 or seed_volume_force | default(false) | bool) }}

# Scaled to zero BEFORE the source is read, not just before the tar, because the destination
# checksum below must see a volume nothing is writing to. Leaving the workload up does not
# corrupt anything — the verification catches it — but it makes the cutover seed fail every
# time, and the failure reads as a copy bug rather than a running pod.
# A Deployment that does not exist yet is the normal FIRST seed: the workload is applied after
# this role runs, precisely so it never starts against an unseeded claim. `kubectl scale` has no
# --ignore-not-found (checked against v1.36), so NotFound is tolerated explicitly. Only that one
# string — any other scale failure is still fatal, because silently continuing would seed a
# volume the workload is still writing to.
- name: Quiesce the workloads writing to {{ seed_volume_claim }}
  tags: [deploy]
  when: seed_volume_copying | bool
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n {{ k8s_namespace }} scale deploy/{{ item }} --replicas=0 --timeout=120s
  loop: "{{ seed_volume_quiesce | default([]) }}"
  become: true
  register: seed_volume_scaled
  changed_when: seed_volume_scaled.rc == 0
  failed_when:
    - seed_volume_scaled.rc != 0
    - '"NotFound" not in seed_volume_scaled.stderr'

# Same reasoning, plus one of its own: with no pods matching the selector, `kubectl wait` exits
# non-zero with "no matching resources found" — which is the state this is waiting FOR.
- name: Wait for the quiesced pods to be gone
  tags: [deploy]
  when: seed_volume_copying | bool
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n {{ k8s_namespace }} wait --for=delete pod
      -l app={{ item }} --timeout=120s
  loop: "{{ seed_volume_quiesce | default([]) }}"
  become: true
  register: seed_volume_gone
  changed_when: false
  failed_when:
    - seed_volume_gone.rc != 0
    - '"no matching resources found" not in seed_volume_gone.stderr'

# always, because a failed copy that left the app scaled to zero is a silent outage: the play
# aborts before k8s/manifests would re-apply the Deployment and put the replicas back.
- name: Seed and verify with the destination held still
  block:
    - name: Run the copy and verification
      tags: [deploy]
      ansible.builtin.include_tasks: copy.yml
  always:
    - name: Restore the quiesced workloads
      tags: [deploy]
      when: seed_volume_copying | default(false) | bool
      # --replicas=1 matches every manifest that uses this role; each is a single replica
      # because its PVC is ReadWriteOnce. k8s/manifests re-applies the Deployment afterwards
      # anyway, so the manifest stays the source of truth if that ever changes.
      ansible.builtin.command:
        cmd: >-
          k3s kubectl -n {{ k8s_namespace }} scale deploy/{{ item }} --replicas=1
      loop: "{{ seed_volume_quiesce | default([]) }}"
      become: true
      register: seed_volume_restored
      changed_when: seed_volume_restored.rc == 0
      # NotFound tolerated for the same reason as the quiesce above — on a first seed there is
      # nothing to restore, and failing here would abort the play in its `always`, which is the
      # one place a failure hides the real one.
      failed_when:
        - seed_volume_restored.rc != 0
        - '"NotFound" not in seed_volume_restored.stderr'
- name: Remove the seed pod
  tags: [deploy]
  when: not (seed_volume_short_circuit | bool)
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n {{ k8s_namespace }} delete pod seed-{{ seed_volume_claim }}
      --ignore-not-found --wait=false
  become: true
  changed_when: true

# Project the in-volume `.seeded` marker onto the PVC, where the next deploy can read it
# without mounting anything. Reaching this task means the volume is seeded: either the marker
# check found it, or copy.yml verified a fresh copy — a copy that failed verification aborts
# the play well before here.
#
# Unconditional on the long path, so this self-heals. On the first deploy after this change no
# PVC carries the annotation, so all 25 claims run the full pod cycle once and are annotated;
# every deploy after that short-circuits. The same recovery covers an annotation stripped by
# k8s/volume-revert.
- name: Record the seeded state of {{ seed_volume_claim }}
  tags: [deploy]
  when: not (seed_volume_short_circuit | bool)
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n {{ k8s_namespace }} annotate pvc {{ seed_volume_claim }}
      homelab.daniel-hunter.com/seeded=true --overwrite
  become: true
  # Always changed rather than parsing kubectl's wording: the long path is the exceptional one
  # (a first seed, a forced re-seed, or a recovery after a revert), so this reports changed on
  # the runs where something genuinely did happen and never runs at all on a steady-state deploy.
  changed_when: true
