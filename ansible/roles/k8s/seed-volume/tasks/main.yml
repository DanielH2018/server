---
# Entry point. The role's real work is seed.yml; this file exists only to gate it on
# k8s_no_mutate.
#
# The gate has to live HERE rather than at the 25 call sites, because that is what the earlier
# tag-based refusal in deploy.yml got wrong: it asserted against `ansible_run_tags`, which is
# what the operator typed, while what actually runs is the role closure. `--tags freshrss`
# names no unsupported role and still reached this one — measured 2026-08-16, a dry run of
# freshrss started and removed a real seed pod against freshrss's live Longhorn PVC.
#
# `import_tasks`, not `include_tasks`: a static import propagates this `when` to every task in
# seed.yml AND inherits the caller's tags cleanly. A dynamic include would need the tags
# forwarded by hand, which is the same `--tags deploy` trap the manifests role already hit.
#
# COVERAGE LIMIT, deliberate: skipping the seed means a dry run of a service whose PVC does not
# exist yet validates its Deployment without ever proving the volume can be provisioned or
# populated. Nothing at admission checks that a referenced PVC exists, so the apply passes
# regardless. Dry-run is not a substitute for deploying a genuinely new service.
- name: Seed the volume
  ansible.builtin.import_tasks: seed.yml
  when: not k8s_no_mutate
