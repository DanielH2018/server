---
# Slice 4, B7a — the nightly TRaSH-guide reconcile.
#
# No Deployment, no Service, no route: configarr runs, reconciles the two *arrs, and exits. What
# ports here is the CronJob plus the health cron that reads it; the config itself is rendered from
# the Docker role's template, so the grab policy has exactly one source.

- name: Deploy configarr to the cluster
  ansible.builtin.include_role:
    name: k8s/manifests
  vars:
    manifests_service: configarr
    manifests_files:
      - cronjob.yaml
    manifests_secret_files:
      - config-secret.yaml
    # No Deployment to wait on. The manifests role treats '' as "skip the rollout entirely",
    # which is the whole reason that option exists.
    manifests_rollout: ""

# THE ONE CONSUMER-SIDE BARRIER IN THE k8s PLAY. The reconcile below runs against sonarr and radarr
# over HTTP, and both are listed BEFORE configarr in containers_list. While roles/k8s/manifests
# waited on its own rollout inline, that ordering alone guaranteed they were live by now; it no
# longer does, because the wait is deferred to the end of the batch. Without this drain the Job
# fires into sonarr's ~5-minute startup (its unpinned striptracks DOCKER_MODS reinstalls on every
# boot, which is why it carries manifests_rollout_timeout: 660s) and reconciles against a dead API.
#
# Draining HERE rather than making sonarr/radarr wait inline is what keeps the batching worth
# having: they still roll concurrently with their batch, and this pays max(sonarr, radarr) once
# instead of sonarr + radarr serially.
- name: Wait for the *arrs to finish rolling out before reconciling against them
  ansible.builtin.include_role:
    name: k8s/rollout-drain

# A CronJob has no rollout to wait on, so an image bump would otherwise deploy unobserved: the
# apply reports success and the first thing to actually run the new image is the 04:30 firing,
# hours later. Carried over from the Docker role for a second reason too — a config.yml edit
# that only took effect at the next 04:30 would leave a deploy reporting success while the
# *arrs still run yesterday's policy.
#
# What makes the extra out-of-band run safe is that configarr is a convergent reconciler —
# running the same sync twice changes nothing. Not concurrencyPolicy: Forbid, which is set but
# only covers one direction: the gate run suppresses the next SCHEDULED firing (verified
# 2026-08-21 — a `--from=cronjob` Job does carry a controller ownerReference), while a gate run
# created into an already-running scheduled one still overlaps. That window is 26s live
# (09:30:00 → 09:30:26). See ansible/roles/k8s/cronjob-gate/CLAUDE.md.
- name: Gate the configarr deploy on a one-off run
  tags: [deploy]
  ansible.builtin.include_role:
    name: k8s/cronjob-gate
  vars:
    cronjob_gate_name: configarr

- name: Install the configarr health reader
  tags: [config]
  ansible.builtin.file:
    path: /opt/configarr-health
    state: directory
    owner: "{{ sys_user }}"
    group: "{{ sys_user }}"
    mode: "0755"
  become: true

- name: Install the configarr health reader scripts
  tags: [config]
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/opt/configarr-health/{{ item | basename }}"
    owner: "{{ sys_user }}"
    group: "{{ sys_user }}"
    mode: "0755"
  loop:
    - configarr_health.py
    - configarr_health_logic.py
    # The verdict logic, unchanged and still owned by the Docker role, whose tests live beside it.
    # Copied rather than duplicated for the same reason host_lib.py is: the sibling copy is what
    # `import configarr_status` resolves at runtime, and a second edited copy is how two callers
    # quietly stop agreeing about what a failed sync looks like.
    - "{{ role_path }}/files/configarr_status.py"
  become: true

- name: Deploy the configarr sync heartbeat
  tags: [cron]
  ansible.builtin.template:
    src: configarr-health.sh.j2
    dest: /usr/local/bin/configarr-health.sh
    mode: "0755"
    owner: root
    group: root
  become: true
  no_log: true  # renders the Kuma push token

- name: Schedule the configarr sync heartbeat
  tags: [cron]
  ansible.builtin.cron:
    name: "configarr sync health"
    minute: "{{ configarr_k8s_health_cron_minute }}"
    user: "{{ sys_user }}"
    job: "/usr/local/bin/configarr-health.sh"
    cron_file: configarr-health
  become: true

# Reported, not enforced. A failed guide sync is the monitor's job to page — failing the deploy
# over a transient *arr outage is exactly what the retired wrapper avoided by always exiting 0.
# Running the reader here also proves it works, on the deploy that installs it.
- name: Report what the health reader makes of the reconcile
  tags: [deploy]
  ansible.builtin.command:
    cmd: >-
      /usr/local/bin/uv run --no-project --no-python-downloads --python {{ host_python_version }}
      /opt/configarr-health/configarr_health.py
  environment:
    CONFIGARR_NAMESPACE: "{{ k8s_namespace }}"
    CONFIGARR_MAX_AGE_H: "{{ configarr_k8s_max_age_hours }}"
  changed_when: false
  failed_when: false
  register: configarr_k8s_health

- name: Show the configarr verdict
  tags: [deploy]
  ansible.builtin.debug:
    msg: "{{ configarr_k8s_health.stdout_lines | default(['(no output)']) }}"
