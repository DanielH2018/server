---
# autofix-bridge on k8s: the containerized *arr remediation sidecar. The two fake-remux
# crons live in roles/setup/fake_remux.

- name: Create the staging directory
  tags: [config]
  ansible.builtin.file:
    path: /etc/rancher/k3s/autofix-bridge
    state: directory
    mode: "0755"
    owner: root
    group: root
  become: true
  when: not k8s_dry_run | bool

# `ansible.builtin.copy` does not create a parent directory, and the shared module lives in
# a package (`bridge/common.py`), so the staging tree needs the directory first.
- name: Create the staging subdirectories
  tags: [config]
  ansible.builtin.file:
    path: "/etc/rancher/k3s/autofix-bridge/{{ item }}"
    state: directory
    mode: "0755"
    owner: root
    group: root
  become: true
  loop: "{{ autofix_bridge_modules | map(attribute='path') | map('dirname') | reject('equalto', '') | unique | list }}"
  when: not k8s_dry_run | bool

- name: Stage the bridge modules on the node
  tags: [config]
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "/etc/rancher/k3s/autofix-bridge/{{ item.path }}"
    mode: "0644"
    owner: root
    group: root
  become: true
  loop: "{{ autofix_bridge_modules }}"
  loop_control:
    label: "{{ item.name }}"
  register: autofix_bridge_script
  when: not k8s_dry_run | bool

# The pod-roll trigger must cover EVERY module, not just autofix.py — see monitor-bridge's
# identically-named task for why: a ConfigMap update alone does not restart a Deployment, so an
# edit confined to bridge/common.py would deploy, read green, and change nothing live. Sorted
# before hashing for the same reason as there: the module set, not the list order, rolls the pod.
# Hashed off the source files rather than the stage's register, for the reason monitor-bridge's
# identically-named task records: the stage is skipped on a dry run.
- name: Combine the staged module checksums into one pod-roll trigger
  tags: [config]
  ansible.builtin.set_fact:
    autofix_bridge_script_checksum: >-
      {%- set ns = namespace(hashes=[]) -%}
      {%- for module in autofix_bridge_modules -%}
      {%- set _ = ns.hashes.append(lookup('ansible.builtin.file', module.src, rstrip=False)
          | hash('sha1')) -%}
      {%- endfor -%}
      {{ ns.hashes | sort | join(',') | hash('sha1') }}

# One --from-file per module rather than --from-file=<dir>, for the same reason as
# monitor-bridge: the staging directory also holds the rendered configmap.yaml below.
- name: Render the script ConfigMap manifest
  tags: [config]
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      k3s kubectl -n {{ k8s_namespace }} create configmap autofix-bridge-script
      {% for item in autofix_bridge_modules %}
      --from-file={{ item.name }}=/etc/rancher/k3s/autofix-bridge/{{ item.path }}
      {% endfor %}
      --dry-run=client -o yaml > /etc/rancher/k3s/autofix-bridge/configmap.yaml
    executable: /bin/bash
  become: true
  changed_when: autofix_bridge_script is changed
  when: not k8s_dry_run | bool

# Server-side, like monitor-bridge's: client-side apply re-stores the whole object in an
# annotation capped at 262144 bytes, which a bridge ConfigMap can exceed. This script is far
# smaller, but one apply form across the four script ConfigMaps is one thing to get right.
# --force-conflicts takes the data keys from the client-side field manager that applied them
# earlier. Server-side apply prints the same line whether or not anything changed,
# so the changed signal is the staged file. ENFORCED by
# ansible/tests/k8s/test_script_configmaps_apply_server_side.py.
- name: Apply the script ConfigMap
  tags: [deploy]
  ansible.builtin.command:
    cmd: >-
      k3s kubectl apply --server-side --force-conflicts
      -f /etc/rancher/k3s/autofix-bridge/configmap.yaml
  become: true
  # Skipped on a dry run or --check. k8s/manifests only dry-runs its own apply, so without this
  # guard a dry run would really write this ConfigMap.
  when: not k8s_no_mutate
  register: autofix_bridge_cm_apply
  changed_when: autofix_bridge_script is changed

- name: Deploy autofix-bridge to the cluster
  ansible.builtin.include_role:
    name: k8s/manifests
  vars:
    # The script ConfigMap is applied above from its own directory, unlabelled, so the prune
    # never selects it.
    manifests_rollout: autofix-bridge
    manifests_files:
      - deployment.yaml
    manifests_secret_files:
      - env-secret.yaml
