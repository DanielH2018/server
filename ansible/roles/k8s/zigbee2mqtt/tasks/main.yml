---
# Cutover seed: run with -e seed_volume_force=true AFTER stopping the Docker z2m — the source
# must hold still (seed-volume rejects a moving source under force), and the SLZB accepts one
# client, so the stop is required on both counts.
- name: Seed the zigbee2mqtt data volume
  tags: [deploy]
  ansible.builtin.include_role:
    name: k8s/seed-volume
  vars:
    seed_volume_service: zigbee2mqtt
    seed_volume_claim: "{{ zigbee2mqtt_k8s_claim }}"
    seed_volume_source_path: "{{ zigbee2mqtt_k8s_source_path }}"
    seed_volume_storage_class: "{{ zigbee2mqtt_k8s_storage_class }}"
    seed_volume_size: "{{ zigbee2mqtt_k8s_size }}"

- name: Deploy zigbee2mqtt to the cluster
  ansible.builtin.include_role:
    name: k8s/manifests
  vars:
    manifests_service: zigbee2mqtt
    manifests_files:
      - pvc.yaml
      - deployment.yaml
      - service.yaml
      - ingressroute.yaml
    manifests_secret_files:
      - config-secret.yaml
