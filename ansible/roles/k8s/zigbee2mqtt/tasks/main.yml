---
# The k8s/seed-volume include this role used to open was dropped on 2026-09-01, when that role
# stopped seeding and became PVC creation alone. It named the SAME claim this role's own
# pvc.yaml.j2 renders, so the two created one claim twice. wg-easy dropped its include for the
# same reason at the v15 upgrade (2026-08-23); see the note at the top of its tasks/main.yml.
# The PVC is created by the manifests role below, from pvc.yaml.j2, which is already first in
# manifests_files.
- name: Deploy zigbee2mqtt to the cluster
  ansible.builtin.include_role:
    name: k8s/manifests
  vars:
    manifests_service: zigbee2mqtt
    manifests_files:
      - pvc.yaml
      - deployment.yaml
      - service.yaml
      - ingressroute.yaml
    manifests_secret_files:
      - config-secret.yaml
