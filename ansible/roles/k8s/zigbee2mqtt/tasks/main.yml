---
# No k8s/volume-claim include: it would name the SAME claim this role's own pvc.yaml.j2
# renders, creating one claim twice. The manifests role below creates the PVC from pvc.yaml.j2,
# which is first in manifests_files.
- name: Deploy zigbee2mqtt to the cluster
  ansible.builtin.include_role:
    name: k8s/manifests
  vars:
    manifests_service: zigbee2mqtt
    manifests_files:
      - pvc.yaml
      - deployment.yaml
      - service.yaml
      - ingressroute.yaml
    manifests_secret_files:
      - config-secret.yaml
