---
# The claim is `k8s_claims` in defaults/main.yml; k8s/manifests renders and applies it.
- name: Deploy zigbee2mqtt to the cluster
  ansible.builtin.include_role:
    name: k8s/manifests
  vars:
    manifests_files:
      - deployment.yaml
      - service.yaml
      - ingressroute.yaml
    manifests_secret_files:
      - config-secret.yaml
