---
# Same image the Docker role runs — both copies stay on the same tag through coexistence so a
# difference in behaviour between them is never the image.
zigbee2mqtt_k8s_image: ghcr.io/koenkk/zigbee2mqtt:2.12.0

# Auto-deploy stance — read by gitops_deploy (see the k8s auto-deploy coverage design).
# Migrating state — strategy is Recreate and the data volume (pairing state, coordinator
# backup, device/group config, the pinned network key material) is seeded through
# k8s/seed-volume (hardcoded ReadWriteOnce), so a bad image swap can migrate that volume before
# the gate observes a fault. Losing it means re-pairing every Zigbee device by hand.
# Promoted in slice 7b (2026-08-21): k8s/manifests now takes a pre-apply Longhorn snapshot of
# the claim below and reverts it if the deploy fails, so a bad swap reverts to the snapshot
# instead of stranding the pairing/coordinator state behind an image that can no longer read it.
k8s_autodeploy: true  # noqa var-naming[no-role-prefix]
k8s_autodeploy_reason: "migrating state — Recreate + RWO seed-volume PVC holding pairing/coordinator state, now protected by the pre-apply Longhorn snapshot and revert; losing the volume outright still means re-pairing every device"  # noqa var-naming[no-role-prefix]
# Slice 7a task 3 — the pre-apply Longhorn snapshot k8s/manifests takes via k8s/volume-snapshot.
# Declared regardless of k8s_autodeploy — protects a manual deploy too, and slice 7b's revert
# is what this role's auto-deploy now depends on.
k8s_autodeploy_snapshot_pvcs: [zigbee2mqtt-data]  # noqa var-naming[no-role-prefix]

# The config-install initContainer needs alpine (`install`). Same init image peanut and
# home-assistant use.
zigbee2mqtt_k8s_init_image: alpine:3.24

# Mirrors resources('0.50', '256M', '0.05', '64M') in the compose template.
zigbee2mqtt_k8s_cpu_limit: "500m"
zigbee2mqtt_k8s_mem_limit: 256Mi
zigbee2mqtt_k8s_cpu_request: "50m"
zigbee2mqtt_k8s_mem_request: 64Mi

# In-cluster the broker is one Service hop away; the shared config template defaults to the
# LAN VIP for the Docker render.
zigbee2mqtt_k8s_mqtt_broker: mosquitto

# 63 M at cutover: database.db, devices.yaml, coordinator_backup.json — the device pairings.
# `longhorn` (backed up), not nobackup: this is the least regenerable smart-home state short
# of re-pairing every device by hand.
zigbee2mqtt_k8s_claim: zigbee2mqtt-data
zigbee2mqtt_k8s_storage_class: longhorn
zigbee2mqtt_k8s_size: 2Gi
zigbee2mqtt_k8s_source_path: /home/ubuntu/server/containers/zigbee2mqtt/data
