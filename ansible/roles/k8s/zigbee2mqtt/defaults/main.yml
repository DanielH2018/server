---
# Same image the Docker role runs — both copies stay on the same tag through coexistence so a
# difference in behaviour between them is never the image.
zigbee2mqtt_k8s_image: ghcr.io/koenkk/zigbee2mqtt:2.12.0

# Auto-deploy stance — read by gitops_deploy (see the k8s auto-deploy coverage design).
# DENIED — state coupling, not missing recovery. Slice 7b task 7 promoted this role
# (2026-08-21) on deploy mechanics alone: Recreate + RWO volume-claim PVC, now protected by
# the pre-apply Longhorn snapshot and revert. The scope decision the same day held it back,
# because the volume's state is coupled to something the snapshot cannot capture: the
# SLZB-06M coordinator's own NVRAM keeps the network key and frame counters. A revert puts
# database.db/devices.yaml/coordinator_backup.json back to the snapshot while the coordinator
# keeps counting from where it actually got to, so paired devices can go silent and recovery
# is re-pairing each one by hand. The snapshot and revert machinery work fine here — they are
# not why this is denied.
k8s_autodeploy: false  # noqa var-naming[no-role-prefix]
k8s_autodeploy_reason: "state coupled outside the volume — the SLZB-06M coordinator's NVRAM holds the network key and frame counters, so reverting zigbee2mqtt-data to a snapshot desynchronises it from the coordinator and can silence paired devices; the pre-apply snapshot and revert work fine and are not the blocker"  # noqa var-naming[no-role-prefix]
# Slice 7a task 3 — the pre-apply Longhorn snapshot k8s/manifests takes via k8s/volume-snapshot.
# Declared regardless of k8s_autodeploy — protects a manual deploy too.
k8s_autodeploy_snapshot_pvcs: [zigbee2mqtt-data]  # noqa var-naming[no-role-prefix]

# The config-install initContainer needs alpine (`install`). Same init image peanut and
# home-assistant use.
zigbee2mqtt_k8s_init_image: alpine:3.24@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b

zigbee2mqtt_k8s_cpu_limit: "500m"
zigbee2mqtt_k8s_mem_limit: 256Mi
zigbee2mqtt_k8s_cpu_request: "50m"
zigbee2mqtt_k8s_mem_request: 64Mi

# In-cluster the broker is one Service hop away; the shared config template defaults to the
# LAN VIP for the Docker render.
zigbee2mqtt_k8s_mqtt_broker: mosquitto

# 63 M at cutover: database.db, devices.yaml, coordinator_backup.json — the device pairings.
# `longhorn` (backed up), not nobackup: this is the least regenerable smart-home state short
# of re-pairing every device by hand.
zigbee2mqtt_k8s_claim: zigbee2mqtt-data
zigbee2mqtt_k8s_storage_class: longhorn
zigbee2mqtt_k8s_size: 2Gi
