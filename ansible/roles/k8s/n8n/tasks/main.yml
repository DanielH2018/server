---
# n8n is the first migration in this slice with NO coexistence window, and that is a property of
# the app rather than a shortcut. Its 7 workflows include scheduled ones — RSS polls, a daily
# email, a TickTick calendar sync — and two n8n processes against the same database each run
# their own scheduler. Coexistence would double-fire every schedule and double-write to TickTick.
# See docs/archive/k3s-migration/slice-2-leaf-apps.md.

- name: Create the n8n data volume claim
  tags: [deploy]
  ansible.builtin.include_role:
    name: k8s/volume-claim
  vars:
    volume_claim_service: n8n
    volume_claim_name: "{{ n8n_k8s_claim }}"
    volume_claim_storage_class: "{{ n8n_k8s_storage_class }}"
    volume_claim_size: "{{ n8n_k8s_size }}"
    # n8n itself is the only writer of this claim; the runners hold no volume. The claim
    # is created empty on first cluster deployment.

- name: Deploy n8n to the cluster
  ansible.builtin.include_role:
    name: k8s/manifests
  vars:
    manifests_service: n8n
    # deployment-runners.yaml is a second Deployment running a second built image. Without this
    # it was rolled by nothing: the rebuilt-image trigger keys on manifests_service (`n8n`) while
    # image-builder records `n8n-runners`, and the rollout targets one name regardless.
    manifests_extra_rollouts:
      - name: n8n-runners
        image: n8n-runners
    manifests_files:
      - pvc-files.yaml
      - networkpolicy.yaml
      - service.yaml
      - deployment.yaml
      - deployment-runners.yaml
      - ingressroute.yaml
    manifests_secret_files:
      - secret.yaml

# ── prove the NetworkPolicy, rather than assuming it ────────────────────────────────────────
# This is the cluster's first NetworkPolicy. kube-router's controller has been running since
# bringup with nothing to enforce, so "the controller is up" is not evidence that a policy has
# any effect — and a policy that silently does nothing is worse than no policy, because it gets
# described as a control. The positive half is already covered: the runners' wait-for-broker
# initContainer connects to n8n:5679, so a Running runners pod proves the allow rule works.
# This is the negative half.
- name: Render the broker-isolation probe
  tags: [deploy]
  ansible.builtin.template:
    src: netpol-probe-job.yaml.j2
    dest: /etc/rancher/k3s/manifests/n8n/netpol-probe-job.yaml
    mode: "0644"
    owner: root
    group: root
  become: true

- name: Remove any previous broker-isolation probe
  tags: [deploy]
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n {{ k8s_namespace }} delete job n8n-netpol-probe
      --ignore-not-found --wait=true
  become: true
  changed_when: true

# The probe's FIRST act is a control check against n8n:5678, and it exits 1 if that fails —
# deliberately, because a probe that cannot reach the service proves nothing about the policy.
# That control races n8n's own rollout. roles/k8s/manifests no longer waits inline; it queues the
# rollout for k8s/rollout-drain, which drains at the END of the play (see that role's header), so
# without this wait the probe fires while n8n is still rolling and the control fails on a service
# that is merely not up YET. Observed 2026-08-16: n8n's pod started 14:52, the probe ran 14:53:04
# and failed 4s later with "CONTROL FAILED: cannot reach n8n:5678 either" — a red deploy that said
# nothing about the NetworkPolicy. Re-running against an already-up n8n passed.
#
# `rollout status`, NOT `kubectl wait --for=condition=Available`: n8n is single-replica, so the OLD
# pod satisfies Available for the whole rolling update and the wait returns before the new pod is
# even scheduled. Same reasoning, and the same measurement, as rollout-drain/tasks/main.yml:32.
- name: Wait for n8n to finish rolling before probing it
  tags: [deploy]
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n {{ k8s_namespace }} rollout status
      deploy/n8n --timeout=300s
  become: true
  changed_when: false

- name: Run the broker-isolation probe
  tags: [deploy]
  ansible.builtin.command:
    cmd: "k3s kubectl apply -f /etc/rancher/k3s/manifests/n8n/netpol-probe-job.yaml"
  become: true
  changed_when: true

- name: Wait for the broker-isolation probe to finish
  tags: [deploy]
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n {{ k8s_namespace }} wait --for=condition=complete
      job/n8n-netpol-probe --timeout=120s
  become: true
  changed_when: false
  # The Job succeeds only when the connection is REFUSED or times out. A pod that is not the
  # runners reaching 5679 fails the Job, and therefore the deploy.
  register: n8n_netpol_probe
  failed_when: n8n_netpol_probe.rc != 0

- name: Report the broker-isolation result
  tags: [deploy]
  ansible.builtin.debug:
    msg: >-
      NetworkPolicy n8n-broker verified: a pod without app=n8n-runners cannot reach
      n8n:{{ n8n_k8s_broker_port }}, and the runners' initContainer proves the runners can.
