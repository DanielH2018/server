---
# n8n has no coexistence window, because two n8n processes against the same database each run
# their own scheduler. Coexistence would double-fire every scheduled workflow (RSS polls, a daily
# email, a TickTick calendar sync) and double-write to TickTick.

# Both builds come first and are ordered rather than parallel, because n8n and its task runners
# are version-coupled the way karakeep and Meilisearch are. Building them back to back keeps a
# release boundary from landing between the two. They also have to come before the render: the
# two image pins read the `k8s_built_image_tags` fact image-builder publishes, and without it they
# fall back to `:latest`. Each build is gated on its rendered context changing, so an n8n deploy
# with no Dockerfile change pays two registry HEADs, not a BuildKit run.
- name: Build the n8n image
  ansible.builtin.include_role:
    name: k8s/image-builder
  vars:
    image_builder_name: n8n
    image_builder_dockerfile: "{{ playbook_dir }}/roles/k8s/n8n/templates/Dockerfile.j2"

- name: Build the n8n task-runners image
  ansible.builtin.include_role:
    name: k8s/image-builder
  vars:
    image_builder_name: n8n-runners
    image_builder_dockerfile: "{{ playbook_dir }}/roles/k8s/n8n/templates/Dockerfile-runners.j2"
    # The one file either Dockerfile COPYs. The key must be the exact path the COPY names,
    # since the ConfigMap mount puts each key at the context root under that name.
    image_builder_context:
      "{{ playbook_dir }}/roles/k8s/n8n/templates/config/n8n-task-runners.json.j2": n8n-task-runners.json

# Both claims are `k8s_claims` in defaults/main.yml, which k8s/manifests renders and applies
# ahead of the workload (#3387). n8n itself is the only writer of either; the runners hold no
# volume.
- name: Deploy n8n to the cluster
  ansible.builtin.include_role:
    name: k8s/manifests
  vars:
    manifests_service: n8n
    # deployment-runners.yaml is a second Deployment running a second built image. Without this
    # nothing rolls it: the rebuilt-image trigger keys on manifests_service (`n8n`) while
    # image-builder records `n8n-runners`, and the rollout targets one name regardless.
    manifests_extra_rollouts:
      - name: n8n-runners
        image: n8n-runners
    manifests_files:
      - networkpolicy.yaml
      - service.yaml
      - deployment.yaml
      - deployment-runners.yaml
      - ingressroute.yaml
    manifests_secret_files:
      - secret.yaml

# ── prove the NetworkPolicy, rather than assuming it ────────────────────────────────────────
# "The controller is up" is not evidence that a policy has any effect, and a policy that silently
# does nothing is worse than no policy, because it gets described as a control. The positive half
# is covered: the runners' wait-for-broker initContainer connects to n8n:5679, so a Running
# runners pod proves the allow rule works. This is the negative half.
# ITS OWN DIRECTORY, not `manifests/n8n/`. That directory belongs to `k8s/manifests`,
# whose prune task deletes every file in it the caller does not name in `manifests_files` — and
# no caller names this probe, because it is this role's own file rather than a manifest of the
# workload. Staged there it would be deleted at the start of every n8n deploy and re-rendered a few
# tasks later: two permanently `changed` tasks on an idempotent run. `n8n-netpol` follows
# `headlamp-netpol` and `prowlarr-netpol` — a sibling name no role's `manifests_service` claims,
# so no `kubectl apply -f <dir>/` sweeps it either.
- name: Create the n8n probe manifest directory
  tags: [deploy]
  ansible.builtin.file:
    path: /etc/rancher/k3s/manifests/n8n-netpol
    state: directory
    mode: "0700"
    owner: root
    group: root
  become: true
  when: not k8s_dry_run | bool

- name: Render the broker-isolation probe
  tags: [deploy]
  ansible.builtin.template:
    src: netpol-probe-job.yaml.j2
    dest: /etc/rancher/k3s/manifests/n8n-netpol/netpol-probe-job.yaml
    mode: "0644"
    owner: root
    group: root
  become: true
  when: not k8s_dry_run | bool

- name: Remove any previous broker-isolation probe
  when: not k8s_no_mutate
  tags: [deploy]
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n {{ k8s_namespace }} delete job n8n-netpol-probe
      --ignore-not-found --wait=true
  become: true
  changed_when: true

# The probe asserts that n8n:5678 is REFUSED from an unlabelled pod, and a refusal proves the
# policy only if n8n is up: a pod that is merely not ready YET refuses the same way, and the Job
# would go green for a reason that has nothing to do with the NetworkPolicy. This wait is what
# makes the refusal attributable. roles/k8s/manifests does not wait inline; it queues
# the rollout for k8s/manifests/tasks/drain.yml, which drains at the END of the play.
#
# `rollout status`, NOT `kubectl wait --for=condition=Available`: n8n is single-replica, so the OLD
# pod satisfies Available for the whole rolling update and the wait returns before the new pod is
# even scheduled. Same reasoning, and the same measurement, as manifests/tasks/drain.yml:32.
- name: Wait for n8n to finish rolling before probing it
  when: not k8s_no_mutate
  tags: [deploy]
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n {{ k8s_namespace }} rollout status
      deploy/n8n --timeout=300s
  become: true
  changed_when: false

- name: Run the broker-isolation probe
  when: not k8s_no_mutate
  tags: [deploy]
  ansible.builtin.command:
    cmd: "k3s kubectl apply -f /etc/rancher/k3s/manifests/n8n-netpol/netpol-probe-job.yaml"
  become: true
  changed_when: true

- name: Wait for the broker-isolation probe to finish
  when: not k8s_no_mutate
  tags: [deploy]
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n {{ k8s_namespace }} wait --for=condition=complete
      job/n8n-netpol-probe --timeout=120s
  become: true
  changed_when: false
  # The Job succeeds only when BOTH connections are REFUSED or time out. An unlabelled pod
  # reaching 5678 (traefik and monitor-bridge only) or 5679 (the runners only) fails the Job,
  # and therefore the deploy.
  register: n8n_netpol_probe
  failed_when: n8n_netpol_probe.rc != 0

- name: Report the broker-isolation result
  when: not k8s_no_mutate
  tags: [deploy]
  ansible.builtin.debug:
    msg: >-
      NetworkPolicy n8n-broker verified: an unlabelled pod reaches neither
      n8n:{{ container_item.port }} (traefik and monitor-bridge only) nor
      n8n:{{ n8n_k8s_broker_port }} (the runners only); the runners' initContainer proves the
      runners can reach the broker.
