---
# Built from templates/Dockerfile.j2 and Dockerfile-runners.j2 (an extra JS package, the runners
# config file); no upstream tag carries either. Since n8n's flip (#5546) Flux applies this role:
# the promote workflow's `images` job builds both and pushes them to GHCR under their content
# tags, and the renderer points these refs there with `imagePullPolicy: IfNotPresent`.
#
# The `:latest` fallback is what an Ansible render without the `k8s_built_image_tags` fact gets.
# tasks/main.yml still builds both images ahead of the render, for the handback to Ansible; no
# Flux path runs it.
#
# Renovate cannot track the two vars below (they are local registry refs, not upstream ones) — the
# FROM lines in the Dockerfiles are what actually moves, and Renovate's built-in dockerfile manager
# watches those. test_renovate_managers.py exempts these vars by name for that reason.
n8n_k8s_image: "{{ k8s_registry_pull_host }}/n8n:{{ k8s_built_image_tags.get('n8n', 'latest') }}"
n8n_k8s_runners_image: "{{ k8s_registry_pull_host }}/n8n-runners:{{ k8s_built_image_tags.get('n8n-runners', 'latest') }}"

# Auto-deploy stance — read by gitops_deploy (see the k8s auto-deploy coverage design).
# Two independent reasons: (1) probe-less — the n8n-runners sub-deployment (which executes
# every workflow's actual code) renders no readinessProbe, so `rollout status` would return on
# Running and prove nothing for it; (2) migrating state — strategy is Recreate and n8n-data (the
# `data` PVC, n8n_k8s_claim below) comes from k8s_claims below (hardcoded ReadWriteOnce)
# and holds the credential-encryption key + SQLite database co-located (see the DR note in
# CLAUDE.md) — a bad image swap can migrate it before the gate observes a fault. n8n-files
# (n8n_k8s_files_claim) is a SEPARATE, unseeded claim for the /files mount.
k8s_autodeploy: false  # noqa var-naming[no-role-prefix]
k8s_autodeploy_reason: "two reasons: (1) probe-less n8n-runners sub-deployment; (2) migrating state — Recreate + RWO PVC (n8n-data) holding the encryption key + credentials DB. COUPLING NOTE for a future promotion: n8n declares TWO claims, n8n-data and n8n-files — a revert of one without the other desyncs which workflow-referenced /files paths actually exist against the credentials/workflow state in n8n-data"  # noqa var-naming[no-role-prefix]

# One set of blast-radius caps for both workloads.
n8n_k8s_cpu_limit: "2"
n8n_k8s_mem_limit: 2048Mi
n8n_k8s_cpu_request: "100m"
n8n_k8s_mem_request: 128Mi

# Holds workflows, execution history, the encrypted credentials in
# database.sqlite AND the key that decrypts them in `config`. On `longhorn` (backed up to B2),
# matching the Docker side, where the bind mount under containers/ is deliberately in Kopia's
# scope for exactly this reason.
#
# Losing this claim loses the credentials AND the key together — they are co-located by design
# (see the role's CLAUDE.md on why the key is deliberately NOT also in SOPS).
n8n_k8s_claim: n8n-data
n8n_k8s_storage_class: longhorn
n8n_k8s_size: 4Gi

# The `/files` mount. Empty, but a claim rather than an
# emptyDir because a workflow references /files/PAL_E4389.pdf — so the path is live, and an
# emptyDir would silently turn "the file persists" into "the file vanishes on restart", which
# fails at workflow-run time rather than at deploy time. Nothing to seed; created empty.
n8n_k8s_files_claim: n8n-files
# `longhorn` (backed up) rather than longhorn-nobackup: unlike a search index, nothing
# regenerates a file a workflow wrote here.
n8n_k8s_files_storage_class: longhorn
n8n_k8s_files_size: 1Gi

# The claims k8s/manifests renders and applies for this role, ahead of the workload.
k8s_claims:  # noqa var-naming[no-role-prefix]
  - name: "{{ n8n_k8s_claim }}"
    storage_class: "{{ n8n_k8s_storage_class }}"
    size: "{{ n8n_k8s_size }}"
  - name: "{{ n8n_k8s_files_claim }}"
    storage_class: "{{ n8n_k8s_files_storage_class }}"
    size: "{{ n8n_k8s_files_size }}"

# The task-runner broker port. Not container_item.port (5678, the UI) — a second port on the
# same Service, so N8N_RUNNERS_TASK_BROKER_URI stays http://n8n:5679 and the runners image
# needs no change.
n8n_k8s_broker_port: 5679

# The budget of the n8n-prepull Kustomization, whose Job pulls both Deployments' images onto
# their node before the n8n Kustomization applies (scripts/renderer/renderer_lib/prepull.py).
# `n8n` is `Recreate`, so without it the old pod stops before the new pod's pull starts and n8n
# is down for the whole pull. With it, the old pod keeps serving while the images arrive.
# MEASURED 2026-10-18 (#5546): a Renovate base bump re-pulls nearly both images from GHCR,
# n8n's 273.4 MB and n8n-runners' 191.4 MB, 464.8 MB in all; the kubelet pulls them one after
# the other. Eight 20-30s samples of one blob ran 0.145-0.359 MB/s across both nodes, so the
# full re-pull takes about 1300s at the fastest and 3205s at the slowest. 3600s covers it
# down to 0.129 MB/s. The Job has no deadline, so a pull slower still costs that revision its
# verdict, the Job keeps pulling, and Flux applies n8n on a later retry. Only Flux reads it:
# the renderer adds the Kustomization for a published tag alone, so an Ansible deploy
# ignores it.
flux_prepull_timeout: 3600s  # noqa var-naming[no-role-prefix]

# The runners' readiness gate (see deployment-runners.yaml.j2). alpine because busybox `nc -z`
# is all it needs and the image is already the fleet's small-utility choice.
n8n_k8s_wait_image: alpine:3.24@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
