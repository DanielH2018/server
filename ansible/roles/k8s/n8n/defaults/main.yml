---
# Built in-cluster by the n8n-images role and pulled from the node-local registry — unlike every
# other k8s role here, which pulls a published image. The Docker side builds these two from
# templates/Dockerfile.j2 and Dockerfile-runners.j2 (an extra JS package, the runners config
# file); no upstream tag carries either, so the cluster has to build them too.
#
# ORDERING: deploy the `n8n-images` tag before this one on a fresh cluster, or both pods sit in
# ImagePullBackOff. Not an include_role here on purpose — a rebuild is minutes of BuildKit work
# and every redeploy of n8n would pay it.
#
# `:latest` on the LOCAL registry tag is correct rather than lazy: the tag is mutable by design and
# a rebuild pushes over it. That is unrelated to the UPSTREAM base, which is pinned — see the
# Dockerfile headers in roles/k8s/n8n-images/templates for why a floating FROM has no updater.
#
# BUILD AND ROLL IN ONE PLAY:
#     ./scripts/deploy.sh --tags "n8n-images,n8n"
#
# A rebuild under an unchanged tag changes no manifest, and `imagePullPolicy: Always` is consulted
# only when a pod is CREATED — so nothing about the rebuild alone would roll the Deployment. The
# image-builder role closes that: it reads the tag's digest before and after the build and appends
# the image to `k8s_rebuilt_images`, which roles/k8s/manifests turns into `manifests_image_changed`
# and rolls on. (Before that wiring, `--tags n8n-images` then `--tags n8n` both reported green while
# the old pods kept running the old image — which is how the 2026-08-08 `@n8n/di` fix looked
# deployed and was not.)
#
# The constraint that remains is SCOPE: `k8s_rebuilt_images` is a play-scoped fact, so the rebuild
# and the rollout must happen in the SAME ansible-playbook run. Two separate runs lose the fact and
# leave the old pods up — the original failure, by a different route. Hence the single command
# above. Rolling by hand is the fallback if they ever do get separated:
#     k3s kubectl -n homelab rollout restart deploy/n8n deploy/n8n-runners
#
# Renovate cannot track the two vars below (they are local registry refs, not upstream ones) — the
# FROM lines in the Dockerfiles are what actually moves, and Renovate's built-in dockerfile manager
# watches those. test_renovate_managers.py exempts these vars by name for that reason.
n8n_k8s_image: "{{ k8s_registry_pull_host }}/n8n:latest"
n8n_k8s_runners_image: "{{ k8s_registry_pull_host }}/n8n-runners:latest"

# Auto-deploy stance — read by gitops_deploy (see the k8s auto-deploy coverage design).
# Two independent reasons: (1) probe-less — the n8n-runners sub-deployment (which executes
# every workflow's actual code) renders no readinessProbe, so `rollout status` would return on
# Running and prove nothing for it; (2) migrating state — strategy is Recreate and n8n-data (the
# `data` PVC, n8n_k8s_claim below) is seeded through k8s/seed-volume (hardcoded ReadWriteOnce)
# and holds the credential-encryption key + SQLite database co-located (see the DR note in
# CLAUDE.md) — a bad image swap can migrate it before the gate observes a fault. n8n-files
# (n8n_k8s_files_claim) is a SEPARATE, unseeded claim for the /files mount.
k8s_autodeploy: false  # noqa var-naming[no-role-prefix]
k8s_autodeploy_reason: "two reasons: (1) probe-less n8n-runners sub-deployment; (2) migrating state — Recreate + RWO seed-volume PVC (n8n-data) holding the encryption key + credentials DB. COUPLING NOTE for a future promotion: n8n declares TWO claims, n8n-data and n8n-files — a revert of one without the other desyncs which workflow-referenced /files paths actually exist against the credentials/workflow state in n8n-data"  # noqa var-naming[no-role-prefix]

# Mirrors resources('2.0', '2048M', '0.10', '128M') in the compose template, for both workloads.
n8n_k8s_cpu_limit: "2"
n8n_k8s_mem_limit: 2048Mi
n8n_k8s_cpu_request: "100m"
n8n_k8s_mem_request: 128Mi

# 225M at migration time: workflows, execution history, the encrypted credentials in
# database.sqlite AND the key that decrypts them in `config`. On `longhorn` (backed up to B2),
# matching the Docker side, where the bind mount under containers/ is deliberately in Kopia's
# scope for exactly this reason.
#
# Losing this claim loses the credentials AND the key together — they are co-located by design
# (see the role's CLAUDE.md on why the key is deliberately NOT also in SOPS).
n8n_k8s_claim: n8n-data
n8n_k8s_storage_class: longhorn
n8n_k8s_size: 4Gi
n8n_k8s_source_path: /home/ubuntu/server/containers/n8n/data

# The `/files` mount. EMPTY at migration time (last written Oct 2025), but a claim rather than an
# emptyDir because a workflow references /files/PAL_E4389.pdf — so the path is live, and an
# emptyDir would silently turn "the file persists" into "the file vanishes on restart", which
# fails at workflow-run time rather than at deploy time. Nothing to seed; created empty.
n8n_k8s_files_claim: n8n-files
n8n_k8s_files_storage_class: longhorn
n8n_k8s_files_size: 1Gi

# The task-runner broker port. Not container_item.port (5678, the UI) — a second port on the
# same Service, so N8N_RUNNERS_TASK_BROKER_URI stays byte-identical to the compose template's
# http://n8n:5679 and the runners image needs no change.
n8n_k8s_broker_port: 5679

# The runners' readiness gate (see deployment-runners.yaml.j2). alpine because busybox `nc -z`
# is all it needs and the image is already the fleet's small-utility choice — seed-volume uses
# the same one.
n8n_k8s_wait_image: alpine:3.24
