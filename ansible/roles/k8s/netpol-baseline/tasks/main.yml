---
# Both levers are read in two places that coerce differently, so a value neither place would
# reject on its own is checked here once, before anything is applied.
#
#   netpol_baseline_enforced — an `if ... | bool` in the template and `when: ... | bool` below.
#     Matched now, but a typo (`fasle`) is False to `| bool` on both sides: the allow-all body
#     renders, every probe task skips, and the deploy is green while nothing is fenced.
#   netpol_baseline_scope — the template branches on `== 'namespace'` with a bare else,
#     so `Namespace`, `ns` or `all` all fall through to the slice-1 label selector. At slice 5
#     that means the whole-namespace default-deny silently does not happen while every check
#     passes.
#   netpol_baseline_obs_enforced — the observability twin of netpol_baseline_enforced, same
#     `| bool` trap on both the template's `if` and the probe tasks' `when:` (slice 3's own probe
#     work, task 6). A typo here is silent in the same direction: allow-all renders, the probe
#     skips, and the deploy reports green while observability is unfenced.
- name: Check the netpol-baseline levers
  ansible.builtin.assert:
    that:
      - netpol_baseline_enforced | string | lower in ['true', 'false']
      - netpol_baseline_scope in ['label', 'namespace']
      - netpol_baseline_obs_enforced | string | lower in ['true', 'false']
      - netpol_baseline_obs_scope in ['label', 'namespace']
    fail_msg: >-
      netpol-baseline: netpol_baseline_enforced must be true or false (got
      {{ netpol_baseline_enforced | to_json }}), netpol_baseline_scope and
      netpol_baseline_obs_scope must each be 'label' or 'namespace' (got
      {{ netpol_baseline_scope | to_json }} and {{ netpol_baseline_obs_scope | to_json }}), and
      netpol_baseline_obs_enforced must be true or false (got
      {{ netpol_baseline_obs_enforced | to_json }}).
    quiet: true

# Slice 5's gate, and it reads the CLUSTER rather than the rendered templates on purpose.
# `ansible/tests/test_netpol_baseline_labels.py` already pins the exempt set against the
# templates — but during slice 4.5 the templates and the cluster disagreed for ~16 hours
# (n8n-runners rendered its label and the live Deployment did not carry it) with that guard
# green throughout. Under namespace scope the same drift is worse in both directions: a pod
# missing its exemption gets this baseline's allow-list added on top of a tighter policy, and a
# pod carrying an exemption nothing else covers is fenced by nothing at all.
#
# Runs only under namespace scope: under label scope the exemption selects nothing, so there is
# nothing to be wrong about.
- name: Read the workloads live-exempt from the baseline
  tags: [deploy]
  when:
    - netpol_baseline_scope == 'namespace'
    - not k8s_no_mutate
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n {{ k8s_namespace }} get pods -l netpol-baseline-exempt
      -o jsonpath={.items[*].metadata.labels.app}
  become: true
  changed_when: false
  register: netpol_baseline_live_exempt

# Deliberately an exact set comparison, not a subset check in either direction. `| unique` because
# a rollout briefly runs two pods of the same app, and `| sort` because jsonpath returns them in
# whatever order the API server lists.
- name: Fail if the live exempt set is not exactly netpol_baseline_exempt_workloads
  tags: [deploy]
  when:
    - netpol_baseline_scope == 'namespace'
    - not k8s_no_mutate
  ansible.builtin.assert:
    that:
      - netpol_baseline_live_exempt.stdout.split() | unique | sort
        == netpol_baseline_exempt_workloads | sort
    fail_msg: >-
      netpol-baseline: the workloads exempt in the cluster are not the ones this role expects,
      so the namespace baseline must not be applied yet.
      live: {{ netpol_baseline_live_exempt.stdout.split() | unique | sort | to_json }},
      expected: {{ netpol_baseline_exempt_workloads | sort | to_json }}.
      A name missing from `live` is a workload about to have this baseline's allow-list ADDED on
      top of its own tighter policy — deploy that workload's role first. A name in `live` that is
      not expected is a pod fenced by nothing; remove its `netpol-baseline-exempt` label or add it
      to netpol_baseline_exempt_workloads with the policy that covers it.
    quiet: true

# The observability twin of the gate above. Slice 5 flipped BOTH baselines to namespace scope,
# but only homelab got a cluster-side reconcile — the gate is scoped `-n {{ k8s_namespace }}` and
# gated on `netpol_baseline_scope`, so observability ran opt-out with nothing checking who had
# opted out. The repo path is covered (test_netpol_baseline_labels.py pins the exempt set across
# ALL rendered docs, not just homelab's), which is exactly the coverage that was green throughout
# the ~16h slice-4.5 drift: a test reads the templates, and the drift is in the cluster.
#
# The expected set is empty, so this reads as "assert nothing here is exempt". That is the whole
# point — in a namespace with no bespoke policies, an exemption is not a narrower fence, it is no
# fence.
- name: Read the workloads live-exempt from the observability baseline
  tags: [deploy]
  when:
    - netpol_baseline_obs_scope == 'namespace'
    - not k8s_no_mutate
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n {{ k8s_observability_namespace }} get pods -l netpol-baseline-exempt
      -o jsonpath={.items[*].metadata.labels.app}
  become: true
  changed_when: false
  register: netpol_baseline_obs_live_exempt

- name: Fail if observability's live exempt set is not exactly netpol_baseline_obs_exempt_workloads
  tags: [deploy]
  when:
    - netpol_baseline_obs_scope == 'namespace'
    - not k8s_no_mutate
  ansible.builtin.assert:
    that:
      - netpol_baseline_obs_live_exempt.stdout.split() | unique | sort
        == netpol_baseline_obs_exempt_workloads | sort
    fail_msg: >-
      netpol-baseline: the workloads exempt in {{ k8s_observability_namespace }} are not the ones
      this role expects, so the observability baseline must not be applied yet.
      live: {{ netpol_baseline_obs_live_exempt.stdout.split() | unique | sort | to_json }},
      expected: {{ netpol_baseline_obs_exempt_workloads | sort | to_json }}.
      Nothing in this namespace carries a bespoke policy, so a name in `live` is a pod fenced by
      nothing at all — remove its `netpol-baseline-exempt` label, or add it here together with
      the policy that covers it.
    quiet: true

# No Deployment, so manifests_rollout is empty — there is nothing to wait on. The policy takes
# effect on apply.
- name: Deploy the namespace ingress baseline
  ansible.builtin.include_role:
    name: k8s/manifests
  vars:
    manifests_service: netpol-baseline
    manifests_rollout: ""
    manifests_files:
      - networkpolicy.yaml
      - networkpolicy-observability.yaml
      - networkpolicy-prometheus.yaml
      - networkpolicy-loki.yaml
      - networkpolicy-traefik.yaml
      - networkpolicy-authelia.yaml
      - networkpolicy-crowdsec.yaml
      - networkpolicy-pihole.yaml
      - networkpolicy-mosquitto.yaml
      - networkpolicy-nut.yaml
      - networkpolicy-jellyfin.yaml
      - networkpolicy-netpol-sentinel.yaml
      - networkpolicy-karakeep.yaml
      - networkpolicy-karakeep-chrome.yaml
      - networkpolicy-karakeep-meilisearch.yaml
      - networkpolicy-freshrss-feed-cache.yaml
      - networkpolicy-scrutiny-influxdb.yaml
      - networkpolicy-scrutiny-web.yaml
      - networkpolicy-loki-homelab.yaml
      - networkpolicy-home-assistant.yaml
      - networkpolicy-uptime-kuma.yaml
      - networkpolicy-terraria.yaml
      - networkpolicy-valheim.yaml
      - networkpolicy-wg-easy.yaml

# ── prove the policy is enforced, rather than merely applied ────────────────────────────────
# DECIDED: the five probe blocks below stay hand-copied — do not fold them into an
# `include_tasks` loop. Tried 2026-08-23: it works and it shrinks this file from 955 lines to
# 470, with ansible-lint green at production profile. It also breaks
# `test_k8s_autodeploy_guard.py::test_auto_deployable_roles_gate_every_batch_workload_they_render`.
# That test's `_batch_gated_names` matches each rendered Job name against a LITERAL
# `wait --for=condition=complete job/<name>` in the task text. Under a loop the wait reads
# `job/netpol-baseline-probe{{ probe.suffix }}`, which the scanner cannot match: the wait still
# runs, but the check that catches a genuinely ungated probe Job stops working for this role.
# N Jobs need N literal wait statements, so the duplication is the guard's substrate — and
# planting literal names somewhere the scanner happens to read would be a dodge, not a fix.
# Same class as textual-guard-checks-break-on-indirection.
#
# Its own directory: `kubectl apply -f <dir>` reads every file in the directory it is given, and
# a Job's pod template is immutable, so a Job left beside the policy would be re-applied as
# either a no-op or an error.
- name: Create the netpol-baseline probe manifest directory
  tags: [config]
  ansible.builtin.file:
    path: /etc/rancher/k3s/manifests/netpol-baseline-probe
    state: directory
    mode: "0700"
    owner: root
    group: root
  become: true

- name: Render the netpol-baseline probe
  tags: [config]
  ansible.builtin.template:
    src: netpol-probe-job.yaml.j2
    dest: /etc/rancher/k3s/manifests/netpol-baseline-probe/netpol-probe-job.yaml
    mode: "0644"
    owner: root
    group: root
  become: true

- name: Clear the previous netpol-baseline probe run
  tags: [deploy]
  when:
    - netpol_baseline_enforced | bool
    - not k8s_no_mutate
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n {{ k8s_namespace }} delete job netpol-baseline-probe
      --ignore-not-found --wait=true
  become: true
  changed_when: true

- name: Run the netpol-baseline probe
  tags: [deploy]
  when:
    - netpol_baseline_enforced | bool
    - not k8s_no_mutate
  ansible.builtin.command:
    cmd: >-
      k3s kubectl apply -f
      /etc/rancher/k3s/manifests/netpol-baseline-probe/netpol-probe-job.yaml
  become: true
  changed_when: true

# 130s, not 180s, and the same on all five probe waits below. Sized against two numbers rather
# than picked:
#
#   * the FLOOR is each probe Job's own `activeDeadlineSeconds: 120`. A wait shorter than that
#     would report a timeout on a probe the cluster still considers legitimately running — the
#     `until nc -w 5 -z speedtest 80` retry loop in the probe scripts is bounded at 12
#     iterations and can legitimately run into the deadline on a DROP path. So the Job's own
#     deadline stays the thing that decides, and this only has to outlast it.
#   * the CEILING is `K8S_DEPLOY_TIMEOUT_S` (900s), which gitops_deploy gives the whole
#     unattended deploy. Measured live 2026-08-20, all five probes on daniel-box with the image
#     cached: 8s, 10s, 4s, 5s, 8s — 35s of waiting in total. The 180s form put the arithmetic
#     worst case at 5 x 180 = the entire budget.
#
# The five-timeouts-in-a-row worst case is not actually reachable: each wait is followed by its
# own `Fail if … did not complete`, so the play aborts at the FIRST probe that does not
# complete. The real worst case is the successful probes plus one timeout. Lowering the timeout
# is still worth it — it cuts 50s of dead wall time off every failing deploy, and it makes the
# arithmetic bound (5 x 130 = 650s) fit the budget for a reader who does not trace the fail
# tasks.
- name: Wait for the netpol-baseline probe
  tags: [deploy]
  when:
    - netpol_baseline_enforced | bool
    - not k8s_no_mutate
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n {{ k8s_namespace }} wait --for=condition=complete
      job/netpol-baseline-probe --timeout=130s
  become: true
  changed_when: false
  register: netpol_baseline_probe
  failed_when: false

# Deliberately unconditional on the wait's outcome (not `when: netpol_baseline_probe is
# succeeded`): with backoffLimit: 0 a failing probe never satisfies --for=condition=complete, so
# the wait above times out. If Report/Show only ran on success, the play would abort at the wait
# with nothing but "timed out waiting for the condition" — none of the four assertion messages
# the probe was written specifically to print. Logs must be fetched from the failed Job before
# the failure below stops the play.
#
# `failed_when: false` for the same reason the wait above has it, one level further out: if the
# pod never starts (image pull failure, node pressure, an admission rejection) there are no logs
# and `kubectl logs` exits non-zero. Without the guard the play aborts HERE — before Show and
# before the descriptive fail — which is precisely the outcome this ordering exists to avoid.
- name: Report the netpol-baseline probe
  tags: [deploy]
  when:
    - netpol_baseline_enforced | bool
    - not k8s_no_mutate
  ansible.builtin.command:
    cmd: "k3s kubectl -n {{ k8s_namespace }} logs job/netpol-baseline-probe"
  become: true
  changed_when: false
  register: netpol_baseline_probe_log
  failed_when: false

# stdout_lines is [] when the pod never ran, so print stderr (where "container not found" and the
# other kubectl-side reasons land) and a next step, rather than an empty list.
- name: Show the netpol-baseline probe result
  tags: [deploy]
  when:
    - netpol_baseline_enforced | bool
    - not k8s_no_mutate
  ansible.builtin.debug:
    msg: >-
      {{ netpol_baseline_probe_log.stdout_lines
         or ['no probe output. kubectl logs said: '
             ~ (netpol_baseline_probe_log.stderr | default('') | trim | default('(nothing)', true)),
             'Inspect with: sudo k3s kubectl -n ' ~ k8s_namespace
             ~ ' describe job netpol-baseline-probe'] }}

- name: Fail if the netpol-baseline probe did not complete
  tags: [deploy]
  # Ansible short-circuits a `when` list, so `not k8s_no_mutate` is what keeps
  # netpol_baseline_probe.rc from being dereferenced on a dry run, where the wait that registers
  # it never ran.
  when:
    - netpol_baseline_enforced | bool
    - not k8s_no_mutate
    - netpol_baseline_probe.rc != 0
  ansible.builtin.fail:
    msg: >-
      netpol-baseline probe did not complete (rc={{ netpol_baseline_probe.rc }}).
      {{ 'It printed no output at all, so the pod never ran its script — this is a scheduling,
      image-pull or admission failure, NOT an assertion failure; see the describe command above.'
      if not netpol_baseline_probe_log.stdout_lines else
      'See the logged assertion output above for which of the four checks failed.' }}

# ── slice 2: prove the per-workload allow policies admit exactly their listed callers ──────────
# Own directory, same reason as the slice-1 probe above: `kubectl apply -f <dir>` reads every
# file in the directory it is given, and a Job's pod template is immutable.
- name: Create the netpol-baseline-probe-slice2 manifest directory
  tags: [config]
  ansible.builtin.file:
    path: /etc/rancher/k3s/manifests/netpol-baseline-probe-slice2
    state: directory
    mode: "0700"
    owner: root
    group: root
  become: true

- name: Render the netpol-baseline-probe-slice2 probe
  tags: [config]
  ansible.builtin.template:
    src: netpol-probe-slice2-job.yaml.j2
    dest: /etc/rancher/k3s/manifests/netpol-baseline-probe-slice2/netpol-probe-slice2-job.yaml
    mode: "0644"
    owner: root
    group: root
  become: true

# The slice-2 probe's assertions are INVERTED (see netpol-probe-slice2-job.yaml.j2): a failed
# `nc` is the PASS case. That means a crashlooping or scaled-to-zero target reads
# identically to a correctly-fenced one — both produce "unreachable" — and the probe would print
# "isolated: ... unreachable from an unlisted caller" and exit 0 for a reason that has nothing to
# do with the policy. Slice 1's probe avoids this with its own liveness leg (assertion 3, through
# traefik to littlelink); slice 2 cannot reuse that shape because sonarr is Authelia-gated — a
# forwardauth 302 would look like a healthy backend without the request ever reaching the app,
# the exact trap slice 1's probe header documents as the reason it picks an UNauthed app instead.
# So the liveness check happens here, at the layer that already has cluster access, gating the
# probe itself rather than living inside it.
#
# EndpointSlice, not `get endpoints`: EndpointSlice states readiness per address, as a condition on
# each entry (`.endpoints[].conditions.ready`), so one jsonpath filter selects exactly the ready
# backends. Endpoints can express readiness too — `subsets[].addresses` against
# `subsets[].notReadyAddresses` — and rc alone already separates the two failure cases there
# (`get endpoints <missing>` exits non-zero with NotFound; an existing Service with no ready
# backends exits 0). So this is a choice about reading readiness directly, not the only way to ask.
# Same query shape as roles/k8s/pihole/tasks/main.yml's own endpoint-readiness check.
- name: Read the slice-2 probe targets' endpoint readiness
  tags: [deploy]
  when:
    - netpol_baseline_enforced | bool
    - not k8s_no_mutate
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n {{ k8s_namespace }} get endpointslice -l kubernetes.io/service-name={{ item }}
      -o jsonpath={.items[*].endpoints[?(@.conditions.ready==true)].targetRef.name}
  become: true
  changed_when: false
  register: netpol_baseline_probe_slice2_targets
  # One entry per target the probe asserts against. Adding an assertion to
  # netpol-probe-slice2-job.yaml.j2 without adding its target here reopens the silent-green hole
  # this gate exists to close.
  loop:
    - sonarr
    - radarr
    - prowlarr
    - qbittorrent

# Not best-effort: a silent pass here is exactly the failure mode this task exists to close, so
# an empty result — whether from zero ready addresses or a query that could not be answered —
# fails the play rather than letting the probe run and misreport.
- name: Fail if any slice-2 probe target has no ready endpoint
  tags: [deploy]
  when:
    - netpol_baseline_enforced | bool
    - not k8s_no_mutate
  ansible.builtin.assert:
    that: item.stdout | trim | length > 0
    fail_msg: >-
      {{ item.item }} has no ready endpoint, so the slice-2 probe was not run. Its assertions are
      inverted — a failed connection is the PASS case — so it cannot tell "fenced by the policy"
      apart from "nothing is listening"; running it against a down target would report green for
      the wrong reason. Fix {{ item.item }}'s readiness first (check
      `sudo k3s kubectl -n {{ k8s_namespace }} get pods -l app={{ item.item }}` and its rollout
      status), then re-run this deploy so the probe's result is attributable to the policy again.
    quiet: true
  loop: "{{ netpol_baseline_probe_slice2_targets.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Clear the previous netpol-baseline-probe-slice2 run
  tags: [deploy]
  when:
    - netpol_baseline_enforced | bool
    - not k8s_no_mutate
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n {{ k8s_namespace }} delete job netpol-baseline-probe-slice2
      --ignore-not-found --wait=true
  become: true
  changed_when: true

- name: Run the netpol-baseline-probe-slice2 probe
  tags: [deploy]
  when:
    - netpol_baseline_enforced | bool
    - not k8s_no_mutate
  ansible.builtin.command:
    cmd: >-
      k3s kubectl apply -f
      /etc/rancher/k3s/manifests/netpol-baseline-probe-slice2/netpol-probe-slice2-job.yaml
  become: true
  changed_when: true

- name: Wait for the netpol-baseline-probe-slice2 probe
  tags: [deploy]
  when:
    - netpol_baseline_enforced | bool
    - not k8s_no_mutate
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n {{ k8s_namespace }} wait --for=condition=complete
      job/netpol-baseline-probe-slice2 --timeout=130s
  become: true
  changed_when: false
  register: netpol_baseline_probe_slice2
  failed_when: false

# Same reasoning as the slice-1 Report task above: unconditional on the wait's outcome, and
# `failed_when: false`, so a failing probe still gets its logs fetched and shown before the play
# aborts, instead of dying at the wait with nothing but "timed out waiting for the condition".
- name: Report the netpol-baseline-probe-slice2 probe
  tags: [deploy]
  when:
    - netpol_baseline_enforced | bool
    - not k8s_no_mutate
  ansible.builtin.command:
    cmd: "k3s kubectl -n {{ k8s_namespace }} logs job/netpol-baseline-probe-slice2"
  become: true
  changed_when: false
  register: netpol_baseline_probe_slice2_log
  failed_when: false

# stdout_lines is [] when the pod never ran, so print stderr (where "container not found" and the
# other kubectl-side reasons land) and a next step, rather than an empty list.
- name: Show the netpol-baseline-probe-slice2 result
  tags: [deploy]
  when:
    - netpol_baseline_enforced | bool
    - not k8s_no_mutate
  ansible.builtin.debug:
    msg: >-
      {{ netpol_baseline_probe_slice2_log.stdout_lines
         or ['no probe output. kubectl logs said: '
             ~ (netpol_baseline_probe_slice2_log.stderr | default('') | trim | default('(nothing)', true)),
             'Inspect with: sudo k3s kubectl -n ' ~ k8s_namespace
             ~ ' describe job netpol-baseline-probe-slice2'] }}

- name: Fail if the netpol-baseline-probe-slice2 probe did not complete
  tags: [deploy]
  # Ansible short-circuits a `when` list, so `not k8s_no_mutate` is what keeps
  # netpol_baseline_probe_slice2.rc from being dereferenced on a dry run, where the wait that
  # registers it never ran.
  when:
    - netpol_baseline_enforced | bool
    - not k8s_no_mutate
    - netpol_baseline_probe_slice2.rc != 0
  ansible.builtin.fail:
    msg: >-
      netpol-baseline-probe-slice2 did not complete (rc={{ netpol_baseline_probe_slice2.rc }}).
      {{ 'It printed no output at all, so the pod never ran its script — this is a scheduling,
      image-pull or admission failure, NOT an assertion failure; see the describe command above.'
      if not netpol_baseline_probe_slice2_log.stdout_lines else
      'See the logged assertion output above for which check failed.' }}

# ── slice 3: prove the observability namespace's per-workload allow policies admit exactly ────
# ── their listed cross-namespace callers ────────────────────────────────────────────────────
# Own directory, same reason as the slice-1/2 probes above: `kubectl apply -f <dir>` reads every
# file in the directory it is given, and a Job's pod template is immutable.
#
# Gated on netpol_baseline_obs_enforced, NOT netpol_baseline_enforced — the observability
# fencing has its own lever (defaults/main.yml), separate from the homelab-namespace one slices
# 1-2 already run under.
- name: Create the netpol-baseline-probe-slice3 manifest directory
  tags: [config]
  ansible.builtin.file:
    path: /etc/rancher/k3s/manifests/netpol-baseline-probe-slice3
    state: directory
    mode: "0700"
    owner: root
    group: root
  become: true

- name: Render the netpol-baseline-probe-slice3 probe
  tags: [config]
  ansible.builtin.template:
    src: netpol-probe-slice3-job.yaml.j2
    dest: /etc/rancher/k3s/manifests/netpol-baseline-probe-slice3/netpol-probe-slice3-job.yaml
    mode: "0644"
    owner: root
    group: root
  become: true

# The slice-3 probe's assertions are INVERTED, same as slice 2's: a failed `nc` is the PASS
# case. That means a crashlooping or scaled-to-zero target reads identically to a correctly-
# fenced one, so this gate proves prometheus, loki, grafana and tempo are actually up before the
# probe runs — otherwise "unreachable" could mean either "fenced" or "down", and the probe would
# report green for the wrong reason. grafana and tempo are included even though the probe itself
# does not connect to them: the probe's own header explains why (podSelector: {} intra-namespace
# peer, exercised for real in Task 6 Step 5, not by this probe) — but this same readiness check
# is the natural place to prove all four observability targets are live before that later step
# leans on them too.
#
# EndpointSlice, not `get endpoints` — same reasoning and same jsonpath as the slice-2 gate
# above. Namespace is {{ k8s_observability_namespace }} here, not {{ k8s_namespace }}: these are
# observability's own Services, not the homelab ones slice 2 checks.
- name: Read the slice-3 probe targets' endpoint readiness
  tags: [deploy]
  when:
    - netpol_baseline_obs_enforced | bool
    - not k8s_no_mutate
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n {{ k8s_observability_namespace }} get endpointslice
      -l kubernetes.io/service-name={{ item }}
      -o jsonpath={.items[*].endpoints[?(@.conditions.ready==true)].targetRef.name}
  become: true
  changed_when: false
  register: netpol_baseline_probe_slice3_targets
  # One entry per observability target this task proves is up. Adding an assertion to
  # netpol-probe-slice3-job.yaml.j2 without adding its target here reopens the silent-green hole
  # this gate exists to close.
  loop:
    - prometheus
    - loki
    - grafana
    - tempo

# Not best-effort: a silent pass here is exactly the failure mode this task exists to close, so
# an empty result — whether from zero ready addresses or a query that could not be answered —
# fails the play rather than letting the probe run and misreport. Fails closed: an unreadable
# result is a failure, not a pass.
- name: Fail if any slice-3 probe target has no ready endpoint
  tags: [deploy]
  when:
    - netpol_baseline_obs_enforced | bool
    - not k8s_no_mutate
  ansible.builtin.assert:
    that: item.stdout | trim | length > 0
    fail_msg: >-
      {{ item.item }} has no ready endpoint in {{ k8s_observability_namespace }}, so the slice-3
      probe was not run. Its assertions are inverted — a failed connection is the PASS case — so
      it cannot tell "fenced by the policy" apart from "nothing is listening"; running it against
      a down target would report green for the wrong reason. Fix {{ item.item }}'s readiness
      first (check `sudo k3s kubectl -n {{ k8s_observability_namespace }} get pods -l app={{
      item.item }}` and its rollout status), then re-run this deploy so the probe's result is
      attributable to the policy again.
    quiet: true
  loop: "{{ netpol_baseline_probe_slice3_targets.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Clear the previous netpol-baseline-probe-slice3 run
  tags: [deploy]
  when:
    - netpol_baseline_obs_enforced | bool
    - not k8s_no_mutate
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n {{ k8s_namespace }} delete job netpol-baseline-probe-slice3
      --ignore-not-found --wait=true
  become: true
  changed_when: true

- name: Run the netpol-baseline-probe-slice3 probe
  tags: [deploy]
  when:
    - netpol_baseline_obs_enforced | bool
    - not k8s_no_mutate
  ansible.builtin.command:
    cmd: >-
      k3s kubectl apply -f
      /etc/rancher/k3s/manifests/netpol-baseline-probe-slice3/netpol-probe-slice3-job.yaml
  become: true
  changed_when: true

- name: Wait for the netpol-baseline-probe-slice3 probe
  tags: [deploy]
  when:
    - netpol_baseline_obs_enforced | bool
    - not k8s_no_mutate
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n {{ k8s_namespace }} wait --for=condition=complete
      job/netpol-baseline-probe-slice3 --timeout=130s
  become: true
  changed_when: false
  register: netpol_baseline_probe_slice3
  failed_when: false

# Same reasoning as the slice-1/2 Report tasks above: unconditional on the wait's outcome, and
# `failed_when: false`, so a failing probe still gets its logs fetched and shown before the play
# aborts, instead of dying at the wait with nothing but "timed out waiting for the condition".
- name: Report the netpol-baseline-probe-slice3 probe
  tags: [deploy]
  when:
    - netpol_baseline_obs_enforced | bool
