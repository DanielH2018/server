---
# Both levers are read in two places that coerce differently, so a value neither place would
# reject on its own is checked here once, before anything is applied.
#
#   netpol_baseline_enforced — an `if ... | bool` in the template and `when: ... | bool` below.
#     Matched now, but a typo (`fasle`) is False to `| bool` on both sides: the allow-all body
#     renders, every probe task skips, and the deploy is green while nothing is fenced.
#   netpol_baseline_scope — the template branches on `== 'namespace'` with a bare else,
#     so `Namespace`, `ns` or `all` all fall through to the label selector. That means
#     the whole-namespace default-deny silently does not happen while every check passes.
#   netpol_baseline_obs_enforced — the observability twin of netpol_baseline_enforced, same
#     `| bool` trap on both the template's `if` and the probe tasks' `when:`. A typo here is silent in the same direction: allow-all renders, the probe
#     skips, and the deploy reports green while observability is unfenced.
- name: Check the netpol-baseline levers
  ansible.builtin.assert:
    that:
      - netpol_baseline_enforced | string | lower in ['true', 'false']
      - netpol_baseline_scope in ['label', 'namespace']
      - netpol_baseline_obs_enforced | string | lower in ['true', 'false']
      - netpol_baseline_obs_scope in ['label', 'namespace']
    fail_msg: >-
      netpol-baseline: netpol_baseline_enforced must be true or false (got
      {{ netpol_baseline_enforced | to_json }}), netpol_baseline_scope and
      netpol_baseline_obs_scope must each be 'label' or 'namespace' (got
      {{ netpol_baseline_scope | to_json }} and {{ netpol_baseline_obs_scope | to_json }}), and
      netpol_baseline_obs_enforced must be true or false (got
      {{ netpol_baseline_obs_enforced | to_json }}).
    quiet: true

# The namespace-scope gate, and it reads the CLUSTER rather than the rendered templates on
# purpose. `ansible/tests/k8s/test_netpol_baseline_labels.py` already pins the exempt set
# against the templates — but the templates and the cluster can disagree (a template renders
# a label the live Deployment does not carry) with that guard green. Under namespace scope the same drift is worse in both directions: a pod
# missing its exemption gets this baseline's allow-list added on top of a tighter policy, and a
# pod carrying an exemption nothing else covers is fenced by nothing at all.
#
# Runs only under namespace scope: under label scope the exemption selects nothing, so there is
# nothing to be wrong about.
- name: Read the workloads live-exempt from the baseline
  tags: [deploy]
  when:
    - netpol_baseline_scope == 'namespace'
    - not k8s_no_mutate
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n {{ k8s_namespace }} get pods -l netpol-baseline-exempt
      -o jsonpath={.items[*].metadata.labels.app}
  become: true
  changed_when: false
  register: netpol_baseline_live_exempt

# Deliberately an exact set comparison, not a subset check in either direction. `| unique` because
# a rollout briefly runs two pods of the same app, and `| sort` because jsonpath returns them in
# whatever order the API server lists.
- name: Fail if the live exempt set is not exactly netpol_baseline_exempt_workloads
  tags: [deploy]
  when:
    - netpol_baseline_scope == 'namespace'
    - not k8s_no_mutate
  ansible.builtin.assert:
    that:
      - netpol_baseline_live_exempt.stdout.split() | unique | sort
        == netpol_baseline_exempt_workloads | sort
    fail_msg: >-
      netpol-baseline: the workloads exempt in the cluster are not the ones this role expects,
      so the namespace baseline must not be applied yet.
      live: {{ netpol_baseline_live_exempt.stdout.split() | unique | sort | to_json }},
      expected: {{ netpol_baseline_exempt_workloads | sort | to_json }}.
      A name missing from `live` is a workload about to have this baseline's allow-list ADDED on
      top of its own tighter policy — deploy that workload's role first. A name in `live` that is
      not expected is a pod fenced by nothing; remove its `netpol-baseline-exempt` label or add it
      to netpol_baseline_exempt_workloads with the policy that covers it.
    quiet: true

# The observability twin of the gate above. Both baselines run under namespace scope, and the
# gate above is scoped `-n {{ k8s_namespace }}` and gated on `netpol_baseline_scope`, so
# observability needs its own cluster-side reconcile of who has opted out. The repo path is
# covered (test_netpol_baseline_labels.py pins the exempt set across ALL rendered docs, not just
# homelab's), but a test reads the templates, and the drift is in the cluster.
#
# The expected set is empty, so this reads as "assert nothing here is exempt". That is the whole
# point — in a namespace with no bespoke policies, an exemption is not a narrower fence, it is no
# fence.
- name: Read the workloads live-exempt from the observability baseline
  tags: [deploy]
  when:
    - netpol_baseline_obs_scope == 'namespace'
    - not k8s_no_mutate
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n {{ k8s_observability_namespace }} get pods -l netpol-baseline-exempt
      -o jsonpath={.items[*].metadata.labels.app}
  become: true
  changed_when: false
  register: netpol_baseline_obs_live_exempt

- name: Fail if observability's live exempt set is not exactly netpol_baseline_obs_exempt_workloads
  tags: [deploy]
  when:
    - netpol_baseline_obs_scope == 'namespace'
    - not k8s_no_mutate
  ansible.builtin.assert:
    that:
      - netpol_baseline_obs_live_exempt.stdout.split() | unique | sort
        == netpol_baseline_obs_exempt_workloads | sort
    fail_msg: >-
      netpol-baseline: the workloads exempt in {{ k8s_observability_namespace }} are not the ones
      this role expects, so the observability baseline must not be applied yet.
      live: {{ netpol_baseline_obs_live_exempt.stdout.split() | unique | sort | to_json }},
      expected: {{ netpol_baseline_obs_exempt_workloads | sort | to_json }}.
      Nothing in this namespace carries a bespoke policy, so a name in `live` is a pod fenced by
      nothing at all — remove its `netpol-baseline-exempt` label, or add it here together with
      the policy that covers it.
    quiet: true

# No Deployment, so manifests_rollout is empty — there is nothing to wait on. The policy takes
# effect on apply.
- name: Deploy the namespace ingress baseline
  ansible.builtin.include_role:
    name: k8s/manifests
  vars:
    manifests_rollout: ""
    # The observability namespace's baseline and its two caller policies, which the armed
    # apply's `-n homelab` refuses (#3575). The shared role renders, prunes and digests them in
    # their own directory, and the task below applies them.
    manifests_deferred_files:
      - networkpolicy-observability.yaml
      - networkpolicy-prometheus.yaml
      - networkpolicy-loki.yaml
    manifests_deferred_dir_name: netpol-baseline-observability

# No --prune and no -n: each document names its own namespace. Applied before the probes,
# because the slice-3 probe tests these exact policies. A dry run skips this apply, so the
# server-side dry run never sees these three documents, the same gap headlamp's observability
# RBAC has.
- name: Apply the observability namespace's policies
  when: not k8s_no_mutate
  tags: [deploy]
  ansible.builtin.command:
    cmd: "k3s kubectl apply -f {{ manifests_deferred_dir }}/"
  become: true
  register: netpol_baseline_observability_apply
  changed_when: >-
    'created' in netpol_baseline_observability_apply.stdout
    or 'configured' in netpol_baseline_observability_apply.stdout

# ── prove the policies are enforced, rather than merely applied ─────────────────────────────
# DECIDED: probe pods need no per-node placement; ingress NetworkPolicy is enforced on the
# DESTINATION node, and the probe targets schedule onto daniel-server.
#
# DECIDED: one probe Job driven by `netpol_baseline_probe_targets`, not one Job per rollout slice
# (#3813). The five slice Jobs recorded the order the default-deny rollout happened in, which no
# probe needs. They stayed hand-copied while there were five, because folding them into an
# `include_tasks` loop breaks `_batch_gated_names` in `ansible/tests/deploy/_autodeploy_batch.py`: it credits a Job only
# against a LITERAL `wait --for=condition=complete job/<name>`, and a looped wait reads
# `job/netpol-baseline-probe{{ suffix }}`. One Job has one literal wait, so the guard still reads
# it. Add a target as a table row, never as a second Job.
#
# Its own directory: `kubectl apply -f <dir>` reads every file in the directory it is given, and
# a Job's pod template is immutable, so a Job left beside the policy would be re-applied as
# either a no-op or an error.
- name: Create the netpol-baseline probe manifest directory
  tags: [config]
  ansible.builtin.file:
    path: /etc/rancher/k3s/manifests/netpol-baseline-probe
    state: directory
    mode: "0700"
    owner: root
    group: root
  become: true
  when: not k8s_dry_run | bool

# The per-slice probes rendered into these until #3813 merged them. Nothing reads them now.
- name: Remove the retired per-slice probe directories
  tags: [config]
  ansible.builtin.file:
    path: "/etc/rancher/k3s/manifests/netpol-baseline-probe-{{ item }}"
    state: absent
  become: true
  when: not k8s_dry_run | bool
  loop: [slice2, slice3, slice4, slice45]

- name: Render the netpol-baseline probe
  tags: [config]
  ansible.builtin.template:
    src: netpol-probe-job.yaml.j2
    dest: /etc/rancher/k3s/manifests/netpol-baseline-probe/netpol-probe-job.yaml
    mode: "0644"
    owner: root
    group: root
  become: true
  when: not k8s_dry_run | bool

# Most of the probe's legs are INVERTED: a failed `nc` is the PASS case. A crashlooping or
# scaled-to-zero target reads identically to a correctly fenced one, and the probe would print
# "isolated" for a reason that has nothing to do with the policy. So every active row is proved
# up first, at the layer that has cluster access. The `open` legs are gated for the opposite
# reason: they must succeed, so a down target would read as a policy fault. Rows with no `expect`
# are gated without being dialled.
#
# EndpointSlice, not `get endpoints`: an EndpointSlice states readiness per address
# (`.endpoints[].conditions.ready`). The gate and the Job read the same list, so a leg cannot be
# added without its gate.
- name: Read the probe targets' endpoint readiness
  tags: [deploy]
  when: not k8s_no_mutate
  ansible.builtin.command:
    # `endpoints[*]`, NOT `endpoints[?(@.conditions.ready==true)]`. A Service with no ready pods
    # keeps its EndpointSlice and sets `endpoints: null` rather than `[]`, and kubectl's jsonpath
    # filter cannot filter nil: it exits 1 with `<nil> is not array or slice` and a 3 KB dump of
    # the object. So the READ would die before the assert below could name the target. Measured
    # against the live cluster: the filter form exits 1 on terraria (0 replicas) and 0 on
    # freshrss, while this form exits 0 on both, empty and `true` respectively.
    #
    # Readiness is still asserted: the path returns each endpoint's `conditions.ready`, and the
    # assert requires an explicit `true`. Selecting `targetRef.name` under `[*]` would have been
    # null-safe too, and would have counted a NOT-ready endpoint as present.
    cmd: >-
      k3s kubectl
      -n {{ k8s_namespace if item.plane == 'homelab' else k8s_observability_namespace }}
      get endpointslice -l kubernetes.io/service-name={{ item.service }}
      -o jsonpath={.items[*].endpoints[*].conditions.ready}
  become: true
  changed_when: false
  register: netpol_baseline_probe_targets_ready
  loop: "{{ netpol_baseline_probe_active }}"
  loop_control:
    label: "{{ item.service }}"

# Not best-effort: an empty result, from zero ready addresses or from a query that could not be
# answered, fails the play rather than letting the probe run and misreport. A non-empty stdout is
# not enough: a target whose only endpoint is `false` would read as present.
- name: Fail if any probe target has no ready endpoint
  tags: [deploy]
  when: not k8s_no_mutate
  ansible.builtin.assert:
    that: "'true' in item.stdout.split()"
    fail_msg: >-
      {{ item.item.service }} ({{ item.item.plane }}) has no ready endpoint, so the netpol-baseline
      probe was not run. Most of its legs are inverted: a failed connection is the PASS case, so
      it cannot tell "fenced by the policy" apart from "nothing is listening". Fix
      {{ item.item.service }}'s readiness first, then re-run this deploy so the probe's result is
      attributable to the policy again.
    quiet: true
  loop: "{{ netpol_baseline_probe_targets_ready.results }}"
  loop_control:
    label: "{{ item.item.service }}"

# Every task from here runs while either lever is on. The table rows of a plane whose lever is
# off are not rendered, so the Job tests only what is meant to be enforced.
- name: Clear the previous netpol-baseline probe run
  tags: [deploy]
  when:
    - netpol_baseline_probe_active | length > 0
    - not k8s_no_mutate
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n {{ k8s_namespace }} delete job netpol-baseline-probe
      --ignore-not-found --wait=true
  become: true
  changed_when: true

- name: Run the netpol-baseline probe
  tags: [deploy]
  when:
    - netpol_baseline_probe_active | length > 0
    - not k8s_no_mutate
  ansible.builtin.command:
    cmd: >-
      k3s kubectl apply -f
      /etc/rancher/k3s/manifests/netpol-baseline-probe/netpol-probe-job.yaml
  become: true
  changed_when: true

# 310s. The FLOOR is the Job's own `activeDeadlineSeconds: 300`: a shorter wait would report a
# timeout on a probe the cluster still considers legitimately running, and the Job's deadline
# should be the clock that decides. The CEILING is `K8S_DEPLOY_TIMEOUT_S` (1440s), which
# gitops_deploy gives the whole unattended deploy. Measured live with the five slice Jobs this
# one replaced, image cached: 8s, 10s, 4s, 5s, 8s.
- name: Wait for the netpol-baseline probe
  tags: [deploy]
  when:
    - netpol_baseline_probe_active | length > 0
    - not k8s_no_mutate
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n {{ k8s_namespace }} wait --for=condition=complete
      job/netpol-baseline-probe --timeout=310s
  become: true
  changed_when: false
  register: netpol_baseline_probe
  failed_when: false

# Deliberately unconditional on the wait's outcome (not `when: netpol_baseline_probe is
# succeeded`): with backoffLimit: 0 a failing probe never satisfies --for=condition=complete, so
# the wait above times out. If Report/Show only ran on success, the play would abort at the wait
# with nothing but "timed out waiting for the condition", none of the messages the probe was
# written to print. Logs must be fetched from the failed Job before the failure below stops the
# play.
#
# `failed_when: false` for the same reason the wait above has it, one level further out: if the
# pod never starts (image pull failure, node pressure, an admission rejection) there are no logs
# and `kubectl logs` exits non-zero. Without the guard the play aborts HERE, before Show and
# before the descriptive fail.
- name: Report the netpol-baseline probe
  tags: [deploy]
  when:
    - netpol_baseline_probe_active | length > 0
    - not k8s_no_mutate
  ansible.builtin.command:
    cmd: "k3s kubectl -n {{ k8s_namespace }} logs job/netpol-baseline-probe"
  become: true
  changed_when: false
  register: netpol_baseline_probe_log
  failed_when: false

# stdout_lines is [] when the pod never ran, so print stderr (where "container not found" and the
# other kubectl-side reasons land) and a next step, rather than an empty list.
- name: Show the netpol-baseline probe result
  tags: [deploy]
  when:
    - netpol_baseline_probe_active | length > 0
    - not k8s_no_mutate
  ansible.builtin.debug:
    msg: >-
      {{ netpol_baseline_probe_log.stdout_lines
         or ['no probe output. kubectl logs said: '
             ~ (netpol_baseline_probe_log.stderr | default('') | trim | default('(nothing)', true)),
             'Inspect with: sudo k3s kubectl -n ' ~ k8s_namespace
             ~ ' describe job netpol-baseline-probe'] }}

- name: Fail if the netpol-baseline probe did not complete
  tags: [deploy]
  # Ansible short-circuits a `when` list, so `not k8s_no_mutate` is what keeps
  # netpol_baseline_probe.rc from being dereferenced on a dry run, where the wait that registers
  # it never ran.
  when:
    - netpol_baseline_probe_active | length > 0
    - not k8s_no_mutate
    - netpol_baseline_probe.rc != 0
  ansible.builtin.fail:
    msg: >-
      netpol-baseline probe did not complete (rc={{ netpol_baseline_probe.rc }}).
      {{ 'It printed no output at all, so the pod never ran its script. This is a scheduling,
      image-pull or admission failure, NOT an assertion failure; see the describe command above.'
      if not netpol_baseline_probe_log.stdout_lines else
      'The last line of the logged output above names the leg that failed.' }}
