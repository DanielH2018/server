    mode: "0644"
    owner: root
    group: root
  become: true

# Five of this probe's seven legs are INVERTED, so a crashlooping or scaled-to-zero target reads
# identically to a correctly-fenced one. This gate proves the targets are up first — otherwise
# "unreachable" could mean either "fenced" or "down".
#
# The two non-inverted legs are gated here too, for the opposite reason: speedtest and terraria
# must SUCCEED, so a target that is down would fail the probe and read as a policy fault.
#
# NOTE the Service names, not the pod labels: `scrutiny` is scrutiny-web's Service. Querying
# `scrutiny-web` here would find no EndpointSlice and fail the gate on a healthy workload.
- name: Read the slice-4.5 probe targets' endpoint readiness
  tags: [deploy]
  when:
    - netpol_baseline_enforced | bool
    - not k8s_no_mutate
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n {{ k8s_namespace }} get endpointslice -l kubernetes.io/service-name={{ item }}
      -o jsonpath={.items[*].endpoints[?(@.conditions.ready==true)].targetRef.name}
