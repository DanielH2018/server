  # this gate exists to close.
  loop:
    - speedtest
    - home-assistant
    - uptime-kuma
    - loki-homelab
    - scrutiny
    - karakeep-meilisearch
    - terraria

- name: Fail if any slice-4.5 probe target has no ready endpoint
  tags: [deploy]
  when:
    - netpol_baseline_enforced | bool
    - not k8s_no_mutate
  ansible.builtin.assert:
    that: item.stdout | trim | length > 0
    fail_msg: >-
      {{ item.item }} has no ready endpoint, so the slice-4.5 probe was not run. Most of its
      assertions are inverted — a failed connection is the PASS case — so it cannot tell "fenced
      by the policy" apart from "nothing is listening"; running it against a down target would
      report green for the wrong reason. Fix {{ item.item }}'s readiness first, then re-run this
      deploy so the probe's result is attributable to the policy again.
    quiet: true
  loop: "{{ netpol_baseline_probe_slice45_targets.results }}"
  loop_control:
    label: "{{ item.item }}"

