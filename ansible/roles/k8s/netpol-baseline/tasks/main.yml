---
# Flux applies this role through `promote`, and every Ansible path skips it (D5, Wave D's last
# flip). No task here runs. The renderer reads this include for the files it renders and the
# deferred directory the observability policies go to, so the vars below stay.
#
# The checks this file ran before it applied are gone, and each has a successor (#5685):
#   - The lever asserts ("Check the netpol-baseline levers") are the `LEVER_ASSERTS` literal in
#     tests/test_netpol_baseline_flux_gates.py, which applies each predicate to the render
#     context. Flux takes no `-e`, so a typo cannot reach a Flux render past CI.
#   - The two live exempt-set gates are the `exempt` check of the `gate` initContainer in
#     `netpol-baseline-verify` (files/netpol_baseline_verify.py). It runs after the apply, so
#     drift fails the Job and the revision's soak acts on it, where the task refused the apply.
#   - The probe tasks are `netpol-baseline-verify`, which depends on `netpol-baseline-deferred`.
#
# No Deployment, so manifests_rollout is empty. The policy takes effect on apply.
- name: Deploy the namespace ingress baseline
  ansible.builtin.include_role:
    name: k8s/manifests
  vars:
    manifests_rollout: ""
    # The observability namespace's baseline and its three caller policies, which the armed
    # apply's `-n homelab` refuses (#3575). The renderer writes them to
    # `cluster/netpol-baseline-deferred/`, which Flux applies after every other tag's
    # Kustomization.
    manifests_deferred_files:
      - networkpolicy-observability.yaml
      - networkpolicy-prometheus.yaml
      - networkpolicy-loki.yaml
      - networkpolicy-alertmanager.yaml
    manifests_deferred_dir_name: netpol-baseline-observability
