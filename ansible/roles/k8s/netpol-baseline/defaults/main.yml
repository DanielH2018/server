---
# The activation lever, and the rollback lever: set false and redeploy. NOT a deletion —
# `kubectl apply` does not prune, so removing this role's template would leave the live policy
# enforcing with nothing in the repo describing it.
#
# Landed false so the role could be applied and its list position verified without fencing
# anything; flipped true 2026-08-16 once the six slice-1 workloads were deployed carrying
# `netpol-baseline: enforced` and confirmed as exactly six selected pods.
netpol_baseline_enforced: true

# `label`     — the policy selects only pods carrying `netpol-baseline: enforced` (slices 1-4)
# `namespace` — the policy selects every pod via `podSelector: {}` (slice 5)
netpol_baseline_scope: label

# The node-side bridge addresses, for traffic that arrives with a node IP: containerd image
# pulls, hostPort paths, and the three host crons that dial traefik. Verified per node with
# `ip -4 -o addr show cni0`. These are /32 HOST addresses on purpose — see the plan's Global
# Constraints for why a /16 here would silently cancel the whole policy.
netpol_baseline_node_cidrs:
  - 10.42.0.1/32
  - 10.42.1.1/32

# Matches headlamp_k8s_netpol_probe_image and registry_k8s_netpol_probe_image.
netpol_baseline_probe_image: alpine:3.24

# Slice 3 fences the observability namespace. It carries its OWN enforcement flag and its
# OWN node-CIDR list, deliberately: the shared netpol_baseline_node_cidrs is read by the 16
# workloads slices 1 and 2 already deployed, and widening it would re-scope all of them.
netpol_baseline_obs_enforced: false

# All four node addresses, where the homelab list carries only the two cni0 /32s.
#
# prometheus has no node pin, so it can land on daniel-server. When it does, the claude-otel
# health cron — installed on daniel-box only (`containers_list` in host_vars/daniel-box.yml; no
# entry, and no `delegate_to`, for daniel-server) — calling its ClusterIP is cross-node. By
# slice 2's own evidence, a cross-node host->pod packet arrives as the SENDING node's flannel.1,
# so that caller needs daniel-box's own flannel.1 (10.42.0.0/32), not daniel-server's.
#
# The two daniel-server entries (10.42.1.1/32 cni0, 10.42.1.0/32 flannel.1) are therefore not
# required by any caller nameable today — kept anyway as deliberate over-inclusion, at the same
# trust level the homelab baseline already grants its own node bridges, and to cover a future
# caller running on daniel-server.
#
# Verified per node with `ip -4 -o addr show flannel.1` (daniel-box: 10.42.0.0, daniel-server:
# 10.42.1.0) — matches these entries exactly, same as the cni0 addresses below.
netpol_baseline_obs_node_cidrs:
  - 10.42.0.1/32    # daniel-box cni0
  - 10.42.1.1/32    # daniel-server cni0 (no caller nameable today; deliberate over-inclusion)
  - 10.42.0.0/32    # daniel-box flannel.1 (the claude-otel cron, when prometheus is cross-node)
  - 10.42.1.0/32    # daniel-server flannel.1 (no caller nameable today; deliberate over-inclusion)
