---
# The activation lever, and the rollback lever: set false and redeploy. NOT a deletion —
# `kubectl apply` does not prune, so removing this role's template would leave the live policy
# enforcing with nothing in the repo describing it.
#
# Landed false so the role could be applied and its list position verified without fencing
# anything; flipped true 2026-08-16 once the six slice-1 workloads were deployed carrying
# `netpol-baseline: enforced` and confirmed as exactly six selected pods.
netpol_baseline_enforced: true

# `label`     — the policy selects only pods carrying `netpol-baseline: enforced` (slices 1-4)
# `namespace` — the policy selects every pod EXCEPT those carrying `netpol-baseline-exempt`
#               (slice 5). Not a bare `podSelector: {}`: see the template for why.
#
# This is also the rollback lever for slice 5 — set back to `label` and redeploy. Every workload
# still carries its opt-in label, so nothing else has to move.
netpol_baseline_scope: namespace

# The workloads that opt OUT under namespace scope, by `app` label. Each owns a NetworkPolicy
# TIGHTER than this baseline, and policies are additive: selecting one here would ADD traefik,
# prometheus and both node CIDRs on top of its own allow-list.
#
# Read as an exact set, in both directions, by the live gate in tasks/main.yml — a name missing
# from the cluster is a widening about to happen, and a name in the cluster but not here is a pod
# fenced by nothing at all. `ansible/tests/test_netpol_baseline_labels.py` pins the same set
# against the rendered templates; the gate exists because the templates and the cluster can
# disagree, and did for ~16 hours during slice 4.5.
netpol_baseline_exempt_workloads:
  - flaresolverr    # roles/k8s/prowlarr/templates/networkpolicy.yaml.j2 (app=prowlarr, :8191)
  - headlamp        # roles/k8s/headlamp/templates/networkpolicy.yaml.j2
  - n8n             # roles/k8s/n8n/templates/networkpolicy.yaml.j2 (live name `n8n-broker`)
  - registry        # roles/k8s/registry/templates/networkpolicy.yaml.j2
  # netpol-baseline/templates/networkpolicy-karakeep-chrome.yaml.j2 (app=karakeep, :9222).
  # Exempt because the baseline admits every port and this one is unauthenticated DevTools.
  - karakeep-chrome

# The node-side bridge addresses, for traffic that arrives with a node IP: containerd image
# pulls, hostPort paths, and the three host crons that dial traefik. Verified per node with
# `ip -4 -o addr show cni0`. These are /32 HOST addresses on purpose — see the plan's Global
# Constraints for why a /16 here would silently cancel the whole policy.
netpol_baseline_node_cidrs:
  - 10.42.0.1/32
  - 10.42.1.1/32

# Matches headlamp_k8s_netpol_probe_image and registry_k8s_netpol_probe_image.
netpol_baseline_probe_image: alpine:3.24

# Auto-deploy stance — read by gitops_deploy (see the k8s auto-deploy coverage design).
k8s_autodeploy: true  # noqa var-naming[no-role-prefix]
k8s_autodeploy_reason: "renders NetworkPolicies plus five probe Jobs, all gated to completion; an _image:-only diff touches only the pinned probe image, the policies re-apply unchanged, and the role hard-fails if the live exempt set has drifted"  # noqa var-naming[no-role-prefix]

# Slice 3 fences the observability namespace. It carries its OWN enforcement flag and its
# OWN node-CIDR list, deliberately: the shared netpol_baseline_node_cidrs is read by the 16
# workloads slices 1 and 2 already deployed, and widening it would re-scope all of them.
netpol_baseline_obs_enforced: true

# Observability's own scope lever, separate from netpol_baseline_scope for the same reason its
# enforcement flag and node-CIDR list are separate: the two namespaces are rolled out and rolled
# back independently. Same two values, same meaning.
netpol_baseline_obs_scope: namespace

# Observability's expected exempt set, reconciled against the cluster by the same gate the
# homelab baseline gets. Empty, and empty deliberately: nothing in this namespace has a bespoke
# policy to be fenced by, so a pod carrying `netpol-baseline-exempt` here is fenced by NOTHING.
# Declared as a variable rather than hardcoding `== []` in the assert so that adding an
# observability exemption is one edit in the same place as the homelab one, and so the failure
# message can name what was expected.
netpol_baseline_obs_exempt_workloads: []

# All four node addresses, where the homelab list carries only the two cni0 /32s.
#
# The cni0 pair (10.42.0.1/32, 10.42.1.1/32) is load-bearing on BOTH nodes, not just
# daniel-box's: loki, prometheus and tempo each publish a loopback hostPort for `otelq` (a
# workstation host process — see claude-otel/CLAUDE.md), a hostPort binds only on the node the
# pod is actually scheduled to, and all three are unpinned single-replica Deployments — so
# whichever node one lands on is where otelq's loopback path, and therefore that node's own
# cni0, originates. Trimming either cni0 entry on the reasoning that "daniel-server has no
# caller nameable today" breaks otelq the moment that pod reschedules there.
#
# prometheus has no node pin, so it can also land on daniel-server. When it does, the claude-otel
# health cron — installed on daniel-box only (`containers_list` in host_vars/daniel-box.yml; no
# entry, and no `delegate_to`, for daniel-server) — calling its ClusterIP is cross-node. By
# slice 2's own evidence, a cross-node host->pod packet arrives as the SENDING node's flannel.1,
# so that caller needs daniel-box's own flannel.1 (10.42.0.0/32), not daniel-server's.
#
# Only the daniel-server flannel.1 entry (10.42.1.0/32) has no caller nameable today — kept
# anyway as deliberate over-inclusion, at the same trust level the homelab baseline already
# grants its own node bridges, and to cover a future cross-node host caller running on
# daniel-server.
#
# Verified per node with `ip -4 -o addr show flannel.1` (daniel-box: 10.42.0.0, daniel-server:
# 10.42.1.0) — matches these entries exactly, same as the cni0 addresses below.
netpol_baseline_obs_node_cidrs:
  - 10.42.0.1/32    # daniel-box cni0 (otelq's loopback path when loki/prometheus/tempo land here)
  - 10.42.1.1/32    # daniel-server cni0 (otelq's loopback path when loki/prometheus/tempo land here)
  - 10.42.0.0/32    # daniel-box flannel.1 (the claude-otel cron, when prometheus is cross-node)
  - 10.42.1.0/32    # daniel-server flannel.1 (no caller nameable today; deliberate over-inclusion)
