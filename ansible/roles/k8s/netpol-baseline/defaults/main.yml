---
# The activation lever, and the rollback lever: set false and redeploy. NOT a deletion —
# `kubectl apply` does not prune, so removing this role's template would leave the live policy
# enforcing with nothing in the repo describing it.
netpol_baseline_enforced: true

# `label`     — the policy selects only pods carrying `netpol-baseline: enforced`
# `namespace` — the policy selects every pod EXCEPT those carrying `netpol-baseline-exempt`.
#               Not a bare `podSelector: {}`: see the template for why.
#
# Setting `label` and redeploying is the rollback lever for `namespace`. Every workload still
# carries its opt-in label, so nothing else has to move.
netpol_baseline_scope: namespace

# The workloads that opt OUT under namespace scope, by `app` label. Each owns a NetworkPolicy
# TIGHTER than this baseline, and policies are additive: selecting one here would ADD traefik,
# prometheus and both node CIDRs on top of its own allow-list.
#
# Read as an exact set, in both directions, by the live gate in tasks/main.yml — a name missing
# from the cluster is a widening about to happen, and a name in the cluster but not here is a pod
# fenced by nothing at all. `ansible/tests/k8s/test_netpol_baseline_labels.py` pins the same set
# against the rendered templates; the gate exists because the templates and the cluster can
# disagree.
netpol_baseline_exempt_workloads:
  - flaresolverr    # roles/k8s/prowlarr/templates/networkpolicy-flaresolverr.yaml.j2 (app=prowlarr, :8191)
  - headlamp        # roles/k8s/headlamp/templates/networkpolicy.yaml.j2
  - n8n             # roles/k8s/n8n/templates/networkpolicy.yaml.j2 (live name `n8n-broker`)
  - registry        # roles/k8s/registry/templates/networkpolicy.yaml.j2
  # roles/k8s/karakeep/templates/networkpolicy-chrome.yaml.j2 (app=karakeep, :9222).
  # Exempt because the baseline admits every port and this one is unauthenticated DevTools.
  - karakeep-chrome

# The node-side bridge addresses, for traffic that arrives with a node IP: containerd image
# pulls, hostPort paths, and the three host crons that dial traefik. These are /32 HOST
# addresses on purpose — see the plan's Global Constraints for why a /16 here would silently
# cancel the whole policy. Sourced from group_vars' `k3s_cni0_gateways` (verified per node
# with `ip -4 -o addr show cni0`) rather than repeated here — loki-homelab's monitoring route
# and this role's own mosquitto/nut policies all admit the same two addresses.
netpol_baseline_node_cidrs: "{{ k3s_cni0_gateways }}"

# Every source admitted to traefik's :8443 (the https entrypoint's POD port) by
# networkpolicy-traefik.yaml.j2. Cloudflare's published ranges, so a public `Host(x.<domain>)`
# is reachable only through Cloudflare's edge; the LAN and the WireGuard client range, which
# reach the `.local.` names direct; and the whole pod CIDR, because in-cluster callers of a
# `.local.` route (the Kuma prober, monitor-bridge, homepage's widgets, ~14 roles) reach the
# VIP as their own 10.42.x.y address. Composed here rather than in the template so a test can
# read the list by name and a fifth source is a one-line change.
#
# `cloudflare_ips` is the same list traefik's forwardedHeaders.trustedIPs reads, so a Cloudflare
# range change needs a netpol-baseline deploy as well as traefik's — cloudflare-ip-drift.sh
# (roles/k8s/traefik) names both when it alarms.
netpol_baseline_traefik_https_sources: "{{ cloudflare_ips + [lan_subnet, wg_client_subnet, k3s_pod_cidr] }}"

# Matches headlamp_k8s_netpol_probe_image and registry_k8s_netpol_probe_image.
netpol_baseline_k8s_probe_image: alpine:3.24@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6

# Auto-deploy stance — read by gitops_deploy (see the k8s auto-deploy coverage design).
k8s_autodeploy: true  # noqa var-naming[no-role-prefix]
k8s_autodeploy_reason: "renders NetworkPolicies plus one probe Job, gated to completion; an _image:-only diff touches only the pinned probe image, the policies re-apply unchanged, and the role hard-fails if the live exempt set has drifted"  # noqa var-naming[no-role-prefix]

# The observability namespace fence. It carries its OWN enforcement flag and its
# OWN node-CIDR list, deliberately: the shared netpol_baseline_node_cidrs is read by the 16
# homelab workloads, and widening it would re-scope all of them.
netpol_baseline_obs_enforced: true

# Observability's own scope lever, separate from netpol_baseline_scope for the same reason its
# enforcement flag and node-CIDR list are separate: the two namespaces are rolled out and rolled
# back independently. Same two values, same meaning.
netpol_baseline_obs_scope: namespace

# Observability's expected exempt set, reconciled against the cluster by the same gate the
# homelab baseline gets. Empty, and empty deliberately: nothing in this namespace has a bespoke
# policy to be fenced by, so a pod carrying `netpol-baseline-exempt` here is fenced by NOTHING.
# Declared as a variable rather than hardcoding `== []` in the assert so that adding an
# observability exemption is one edit in the same place as the homelab one, and so the failure
# message can name what was expected.
netpol_baseline_obs_exempt_workloads: []

# All four node addresses, where the homelab list carries only the two cni0 /32s.
#
# The cni0 pair (10.42.0.1/32, 10.42.1.1/32) is load-bearing on BOTH nodes, not just
# daniel-box's: loki, prometheus and tempo each publish a loopback hostPort for `otelq` (a
# workstation host process — see observability/CLAUDE.md), a hostPort binds only on the node the
# pod is actually scheduled to, and all three are unpinned single-replica Deployments — so
# whichever node one lands on is where otelq's loopback path, and therefore that node's own
# cni0, originates. Trimming either cni0 entry on the reasoning that "daniel-server has no
# caller nameable today" breaks otelq the moment that pod reschedules there.
#
# prometheus has no node pin, so it can also land on daniel-server. When it does, the observability
# health cron — installed on daniel-box only (`containers_list` in host_vars/daniel-box.yml; no
# entry, and no `delegate_to`, for daniel-server) — calling its ClusterIP is cross-node. A
# cross-node host->pod packet arrives as the SENDING node's flannel.1,
# so that caller needs daniel-box's own flannel.1 (10.42.0.0/32), not daniel-server's.
#
# Only the daniel-server flannel.1 entry (10.42.1.0/32) has no caller nameable today — kept
# anyway as deliberate over-inclusion, at the same trust level the homelab baseline already
# grants its own node bridges, and to cover a future cross-node host caller running on
# daniel-server.
#
# Verified per node with `ip -4 -o addr show flannel.1` (daniel-box: 10.42.0.0, daniel-server:
# 10.42.1.0) — matches these entries exactly, same as the cni0 addresses below.
netpol_baseline_obs_node_cidrs:
  - 10.42.0.1/32    # daniel-box cni0 (otelq's loopback path when loki/prometheus/tempo land here; the API server's proxy for Headlamp's Prometheus plugin, same condition)
  - 10.42.1.1/32    # daniel-server cni0 (otelq's loopback path when loki/prometheus/tempo land here)
  - 10.42.0.0/32    # daniel-box flannel.1 (the observability cron, and the API server's proxy for Headlamp's Prometheus plugin, when prometheus is cross-node)
  - 10.42.1.0/32    # daniel-server flannel.1 (no caller nameable today; deliberate over-inclusion)

# The probe's target table. ONE list, read by both halves of the probe, so the two cannot
# disagree: the readiness gate in tasks/main.yml loops it, and netpol-probe-job.yaml.j2 renders
# one `nc` leg per row that has an `expect`. A row is gated whether or not it is dialled.
#
# Columns:
#   service — the Service name. It is the name the gate reads and the name the leg dials. It is
#             not always the pod label (scrutiny's pods are `app: scrutiny-web`).
#   plane   — `homelab` or `observability`. It picks the namespace and the lever: a homelab row
#             runs only while netpol_baseline_enforced is true, an observability row only while
#             netpol_baseline_obs_enforced is.
#   port    — the POD port, from the target's own NetworkPolicy `port:`. Every target here maps
#             Service port to pod port 1:1.
#   expect  — `refused` (an inverted leg), `open` (the connection must succeed), or absent (the
#             gate checks the row, and no leg dials it).
#   policy  — the policy file that owns the fence, printed in the failure message.
#   replicas — optional. The target's replica count, templated from the variable that sets it.
#             A row whose count is 0 is dropped from netpol_baseline_probe_active, so it is
#             neither gated nor dialled. A scaled-to-zero Service has an empty EndpointSlice,
#             and gating it would fail every full `deploy.yml`.
#
# A WRONG PORT ON A `refused` ROW FAILS SILENTLY GREEN. A port nothing listens on makes `nc` fail,
# which is the PASS branch of an inverted leg. The gate proves the Service has a ready backend; it
# does not prove the port is the one that backend serves. Re-check a port against its source
# whenever you touch its row.
#
# The probe pod is `app: netpol-baseline-probe`. No caller list in the repo names that label, so
# every `refused` row must refuse it. Its `netpol-probe: control` label admits it to speedtest:80,
# the sentinel, and to nothing else.
#
netpol_baseline_probe_targets:
  # The namespace baseline: an app with no in-cluster caller. The probe's HTTPS liveness leg
  # reaches the same app through traefik, which is the allowed path.
  - {service: littlelink, plane: homelab, port: 3000, expect: refused, policy: networkpolicy.yaml.j2}
  # Per-workload caller lists: each admits named callers, and this pod is none of them.
  - {service: sonarr, plane: homelab, port: 8989, expect: refused, policy: "sonarr's netpol_from (host_vars/daniel-box.yml)"}
  - {service: radarr, plane: homelab, port: 7878, expect: refused, policy: "radarr's netpol_from (host_vars/daniel-box.yml)"}
  - {service: prowlarr, plane: homelab, port: 9696, expect: refused, policy: prowlarr/templates/networkpolicy-prowlarr.yaml.j2}
  - {service: qbittorrent, plane: homelab, port: 8080, expect: refused, policy: qbittorrent/templates/networkpolicy.yaml.j2}
  # Cross-namespace callers. Ports from observability/templates/prometheus.yaml.j2 and loki.yaml.j2.
  # grafana and tempo admit only the intra-namespace `podSelector: {}` peer, which a probe in the
  # homelab namespace cannot exercise. They are gated so the observability plane is proved up.
  - {service: prometheus, plane: observability, port: 9090, expect: refused, policy: networkpolicy-prometheus.yaml.j2}
  - {service: loki, plane: observability, port: 3100, expect: refused, policy: networkpolicy-loki.yaml.j2}
  - {service: grafana, plane: observability}
  - {service: tempo, plane: observability}
  # The infra tier.
  - {service: authelia, plane: homelab, port: 9091, expect: refused, policy: networkpolicy-authelia.yaml.j2}
  - {service: crowdsec, plane: homelab, port: 8080, expect: refused, policy: networkpolicy-crowdsec.yaml.j2}
  - {service: nut, plane: homelab, port: 3493, expect: refused, policy: networkpolicy-nut.yaml.j2}
  - {service: mosquitto, plane: homelab, port: 1883, expect: refused, policy: networkpolicy-mosquitto.yaml.j2}
  # One target per fencing shape the last rollout slice introduced: a fan-in app
  # (home-assistant, uptime-kuma), a cross-namespace one (loki-homelab), a sub-workload behind a
  # parent (karakeep-meilisearch), and one whose Service name differs from its pod label
  # (scrutiny, pods `app: scrutiny-web`), the mistake most likely to select nothing.
  - {service: home-assistant, plane: homelab, port: 8123, expect: refused, policy: "home-assistant's netpol_from (host_vars/daniel-box.yml)"}
  - {service: uptime-kuma, plane: homelab, port: 3001, expect: refused, policy: "uptime-kuma's netpol_from (host_vars/daniel-box.yml)"}
  - {service: loki-homelab, plane: homelab, port: 3100, expect: refused, policy: networkpolicy-loki-homelab.yaml.j2}
  - {service: scrutiny, plane: homelab, port: 8080, expect: refused, policy: "scrutiny's netpol_from, pod label scrutiny-web"}
  - {service: karakeep-meilisearch, plane: homelab, port: 7700, expect: refused, policy: "karakeep's netpol_fences (host_vars/daniel-box.yml)"}
  # terraria follows `terraria_k8s_replicas` (group_vars/all.yml) through its `replicas` column:
  # scaling the server back up restores this open-port leg and its gate with no edit here.
  - {service: terraria, plane: homelab, port: 7777, expect: open, policy: networkpolicy-terraria.yaml.j2, replicas: "{{ terraria_k8s_replicas | int }}"}
  # The sentinel. The probe's control leg dials it with a retry, outside the table, so the row
  # has no `expect`.
  - {service: speedtest, plane: homelab}

# The rows whose lever is on and whose target is scaled above zero. The gate loops this and the
# Job renders from it, so a plane with its lever off, or a row at `replicas: 0`, is neither gated
# nor dialled. A row with a `replicas` column sorts after the rows without one.
netpol_baseline_probe_active: >-
  {{ (netpol_baseline_probe_targets | rejectattr('replicas', 'defined') | list
      + netpol_baseline_probe_targets | selectattr('replicas', 'defined')
        | selectattr('replicas', 'gt', 0) | list)
     | selectattr('plane', 'in',
                  (['homelab'] if netpol_baseline_enforced | bool else [])
                  + (['observability'] if netpol_baseline_obs_enforced | bool else []))
     | list }}
