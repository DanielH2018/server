---
# nut-exporter: DRuggeri/nut_exporter as a NUT network client, turning upsd's variables into
# first-class Prometheus series. Before this role, UPS state reached Grafana only as `hass_*`
# series scraped out of Home Assistant — which routes a power-loss signal through a workload the
# UPS itself protects. The scrape job lives in claude-otel's prometheus.yaml.j2 (job_name: nut).

- name: Deploy nut-exporter to the cluster
  ansible.builtin.include_role:
    name: k8s/manifests
  vars:
    manifests_service: nut-exporter
    manifests_rollout: nut-exporter
    manifests_files:
      - deployment.yaml
      - service.yaml
