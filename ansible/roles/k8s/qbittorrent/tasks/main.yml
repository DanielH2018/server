---
# qbittorrent behind its Mullvad tunnel (slice 4, B4b). The slice's only genuinely new shape:
# two containers in one pod, a VPN sidecar that gates the app's start, and a kill-switch that
# has to be taught the cluster's CIDRs. See D11 in docs/archive/k3s-migration/slice-4-media-cluster.md.
#
# NOT DEPLOYED BEFORE THE CUTOVER WINDOW. Two qbittorrents holding the same torrent state would
# both announce to trackers from different addresses, and the second one's view of what is
# complete is stale the moment the first one writes. There is no coexistence mode for this
# service the way there is for a read-mostly \*arr — which is D3's "one window", again.


- name: Create the qbittorrent config volume claim
  tags: [deploy]
  # ONE volume for both containers, matching the Compose file — wireguard's wg0.conf and
  # qbittorrent's settings live in the same tree.
  ansible.builtin.include_role:
    name: k8s/seed-volume
  vars:
    seed_volume_service: qbittorrent
    seed_volume_claim: "{{ qbittorrent_k8s_claim }}"
    seed_volume_storage_class: "{{ qbittorrent_k8s_storage_class }}"
    seed_volume_size: "{{ qbittorrent_k8s_size }}"

- name: Deploy qbittorrent to the cluster
  ansible.builtin.include_role:
    name: k8s/manifests
  vars:
    manifests_service: qbittorrent
    manifests_files:
      # The policy is listed FIRST so it exists before the pod can be scheduled. `kubectl apply
      # -f <dir>` does not guarantee that ordering, which is why the gap is also survivable: the
      # pod takes seconds to pull and start, and the policy is applied in the same call.
      - networkpolicy.yaml
      - deployment.yaml
      - service.yaml
      # The Docker-era `wireguard:8080` name, which radarr's and sonarr's databases still hold
      # as the download client host (D11 / slice-4:542). Same pod, alias name.
      - service-wireguard.yaml
      - ingressroute.yaml
    # 0600 on disk, rendered under no_log — the Mullvad key and account number.
    manifests_secret_files:
      - secret.yaml

- name: Prove the tunnel carries the traffic
  tags: [deploy]
  ansible.builtin.include_tasks: verify.yml

# LOG-ONLY drift check for files/apply_prefs.py's DESIRED throughput preferences (2026-08-27
# review, Medium). No Kuma monitor and no push token — see prefs-check.sh.j2's header. Same
# shape as janitorr's own cron pair below: an install dir + copied script, then a rendered
# wrapper that carries the credential and is scheduled separately.

- name: Install the qbittorrent prefs-check directory
  tags: [config]
  ansible.builtin.file:
    path: /opt/qbittorrent-prefs-check
    state: directory
    owner: "{{ sys_user }}"
    group: "{{ sys_user }}"
    mode: "0755"
  become: true

- name: Install the qbittorrent prefs-check script
  tags: [config]
  ansible.builtin.copy:
    src: apply_prefs.py
    dest: /opt/qbittorrent-prefs-check/apply_prefs.py
    owner: "{{ sys_user }}"
    group: "{{ sys_user }}"
    mode: "0755"
  become: true

- name: Deploy the qbittorrent prefs-check wrapper
  tags: [cron]
  ansible.builtin.template:
    src: prefs-check.sh.j2
    dest: /usr/local/bin/qbittorrent-prefs-check.sh
    # DECIDED: 0700 owned by sys_user, not 0755 — the script interpolates the qBittorrent WebUI
    # password directly (same shape as janitorr-health.sh.j2's Kuma token), and at 0755 any
    # local account could read it.
    mode: "0700"
    owner: "{{ sys_user }}"
    group: "{{ sys_user }}"
  become: true
  no_log: true  # renders qbittorrent_username / qbittorrent_password

- name: Schedule the qbittorrent prefs-check drift check
  tags: [cron]
  ansible.builtin.cron:
    name: "qbittorrent prefs drift check"
    hour: "{{ qbittorrent_k8s_prefs_check_cron_hour }}"
    minute: "{{ qbittorrent_k8s_prefs_check_cron_minute }}"
    user: "{{ sys_user }}"
    job: "/usr/local/bin/qbittorrent-prefs-check.sh"
    cron_file: qbittorrent-prefs-check
  become: true
