---
# qbittorrent behind its Mullvad tunnel (slice 4, B4b). The slice's only genuinely new shape:
# two containers in one pod, a VPN sidecar that gates the app's start, and a kill-switch that
# has to be taught the cluster's CIDRs. See D11 in docs/k3s-migration/slice-4-media-cluster.md.
#
# NOT DEPLOYED BEFORE THE CUTOVER WINDOW. Two qbittorrents holding the same torrent state would
# both announce to trackers from different addresses, and the second one's view of what is
# complete is stale the moment the first one writes. There is no coexistence mode for this
# service the way there is for a read-mostly \*arr — which is D3's "one window", again.

- name: Report that qbittorrent is held until the cutover
  tags: [always]
  when: not qbittorrent_k8s_enabled | bool
  ansible.builtin.debug:
    msg: >-
      qbittorrent is built but NOT deployed (qbittorrent_k8s_enabled is false). Two copies
      holding the same torrent state cannot coexist — this is released in B4c, once the Docker
      copy is stopped. See the role defaults.

- name: Seed the qbittorrent config volume
  tags: [deploy]
  when: qbittorrent_k8s_enabled | bool
  # ONE volume for both containers, matching the Compose file — wireguard's wg0.conf and
  # qbittorrent's settings live in the same tree.
  #
  # qBittorrent writes its session state (torrent list, resume data) on a timer and at exit, so
  # a coexistence seed is torn by construction. Only the cutover seed, force=true against a
  # STOPPED source, is authoritative.
  ansible.builtin.include_role:
    name: k8s/seed-volume
  vars:
    seed_volume_service: qbittorrent
    seed_volume_claim: "{{ qbittorrent_k8s_claim }}"
    seed_volume_source_path: "{{ qbittorrent_k8s_source_path }}"
    seed_volume_storage_class: "{{ qbittorrent_k8s_storage_class }}"
    seed_volume_size: "{{ qbittorrent_k8s_size }}"
    seed_volume_quiesce:
      - qbittorrent

- name: Deploy qbittorrent to the cluster
  when: qbittorrent_k8s_enabled | bool
  ansible.builtin.include_role:
    name: k8s/manifests
  vars:
    manifests_service: qbittorrent
    manifests_files:
      # The policy is listed FIRST so it exists before the pod can be scheduled. `kubectl apply
      # -f <dir>` does not guarantee that ordering, which is why the gap is also survivable: the
      # pod takes seconds to pull and start, and the policy is applied in the same call.
      - networkpolicy.yaml
      - deployment.yaml
      - service.yaml
      # The Docker-era `wireguard:8080` name, which radarr's and sonarr's databases still hold
      # as the download client host (D11 / slice-4:542). Same pod, alias name.
      - service-wireguard.yaml
      - ingressroute.yaml
    # 0600 on disk, rendered under no_log — the Mullvad key and account number.
    manifests_secret_files:
      - secret.yaml

- name: Prove the tunnel carries the traffic
  tags: [deploy]
  when: qbittorrent_k8s_enabled | bool
  ansible.builtin.include_tasks: verify.yml
