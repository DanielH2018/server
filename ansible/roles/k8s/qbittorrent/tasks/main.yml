---
# qbittorrent behind its Mullvad tunnel: two containers in one pod, a VPN sidecar that gates
# the app's start, and a kill-switch that has to be taught the cluster's CIDRs.
#
# The config claim is `k8s_claims` in defaults/main.yml, which k8s/manifests renders and applies
# ahead of the workload (#3387).

# The prefs drift check was a daniel-box host cron until H2.5d
# (docs/target-architecture/host/h2-shrink-host-plane.md, Steps item 15). These absent arms
# remove it, ahead of the k8s/manifests include, so the host cron is gone before the CronJob
# that replaces it exists. They stay until D5's conversion PR moves them into
# setup/k8s_host_files, and H7 deletes them. ansible/tests/repo/_retired_cron_row.py holds the
# cron's arm to the tree. The role never stamped a setup-deployed fragment, so none is removed.
- name: Remove the retired qbittorrent prefs drift check cron
  tags: [cron]
  ansible.builtin.cron:
    name: "qbittorrent prefs drift check"
    user: "{{ sys_user }}"
    cron_file: qbittorrent-prefs-check
    state: absent
  become: true
  when: not k8s_dry_run | bool

- name: Remove the retired qbittorrent prefs-check script from the host
  tags: [config]
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /usr/local/bin/qbittorrent-prefs-check.sh
    - /opt/qbittorrent-prefs-check
  become: true
  when: not k8s_dry_run | bool

- name: Deploy qbittorrent to the cluster
  ansible.builtin.include_role:
    name: k8s/manifests

- name: Prove the tunnel carries the traffic
  tags: [deploy]
  ansible.builtin.include_tasks: verify.yml

# After verify.yml, which waits out the rollout the render just queued. A gate run straight
# after the apply would meet the replacement pod inside the sidecar's startup window, up to
# five minutes, and always log "cannot reach". The fence that admits the check's label came
# with the CronJob in the apply above. An extra run reads the same preferences and logs the
# same verdict, and writes nothing.
- name: Gate the qbittorrent-prefs-check deploy on a one-off run
  tags: [deploy]
  ansible.builtin.include_role:
    name: k8s/cronjob-gate
  vars:
    cronjob_gate_name: qbittorrent-prefs-check
