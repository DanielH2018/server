---
# B4b's two proofs. Neither is "the pod is Running", which for this service means very little:
# a healthy-looking tunnel with a kill-switch that has eaten the cluster's return path, or a
# dead tunnel leaking in the clear, both present as a green rollout.
#
# UNDER --check, proof 1 RUNS and proof 2 does not. The split is what each task does to the
# cluster, not how useful it is: proof 1 only reads (a `get`, an outbound GET, and an exec that
# runs curl in a pod that already exists), so a dry run can evaluate the leak assertion for real
# — which is the single most valuable thing --check can tell you about this service. Proof 2
# CREATES a pod, and a dry run must not.

# WAIT FOR THE NEW POD BEFORE ASSERTING ANYTHING ABOUT "THE" POD.
#
# roles/k8s/manifests does NOT wait for the rollout — it QUEUES it, and roles/k8s/rollout-drain
# runs `rollout status` for the whole batch afterwards (a deliberate 2026-08-09 change, so N
# waits overlap instead of serialising). A role's own verify.yml therefore runs BEFORE its
# rollout completes, and `get pod -l app=qbittorrent` returns the OUTGOING pod.
#
# That went unnoticed while every proof here happened to hold for the old pod too — a tunnel and
# a return path look the same either side of a roll. Proof 3 is the first assertion whose answer
# genuinely differs between the two, and it failed the 2026-08-27 deploy against a pod that was
# already Terminating while the new pod, correctly mounted, came up seconds later.
#
# `rollout status` and not `wait --for=condition=Available`: Available flips on the OLD
# ReplicaSet and returns instantly, so it would reintroduce exactly this bug. See
# ansible/tests/deploy/test_inline_rollout_gates.py.
#
# This is one inline wait for one role, not a reversal of the batch drain. It is warranted here
# because this file's assertions are pod-identity-sensitive; the drain still owns the batch. The
# wait is a no-op when nothing rolled.
- name: Wait for the qbittorrent rollout to finish before verifying it
  tags: [deploy]
  # Recreate strategy: the old pod must terminate fully before the new one is created, and the
  # wireguard sidecar's startupProbe then allows up to 5 min for the tunnel. 8 min covers both
  # with margin. A timeout here is a real failure — the rollout genuinely did not complete.
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n {{ k8s_namespace }} rollout status deployment/qbittorrent --timeout=480s
  become: true
  changed_when: false
  when: not ansible_check_mode

- name: Find the qbittorrent pod
  tags: [deploy]
  # THE FIELD-SELECTOR DOES NOT EXCLUDE A TERMINATING POD, so do not read it as a second gate.
  # `.status.phase` stays `Running` until the containers actually stop — "Terminating" is a
  # display state kubectl derives from `metadata.deletionTimestamp`, not a phase. It only rules
  # out a Pending or Failed pod, which matters when the new pod is still pulling. The
  # `rollout status` wait above is the load-bearing part; this is a narrower guard, not a backup
  # for it.
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n {{ k8s_namespace }} get pod -l app=qbittorrent
      --field-selector=status.phase=Running
      -o jsonpath={.items[0].metadata.name}
  become: true
  changed_when: false
  check_mode: false
  register: qbittorrent_k8s_pod

# ── proof 1: egress really leaves through Mullvad ───────────────────────────────────────────
# Comparing the two public addresses is a stronger statement than `wg show wg0`, which only says
# an interface exists. It is also the same question am.i.mullvad.net answers, without depending
# on Mullvad's API being up — the transient failures of which used to restart this tunnel
# needlessly under Docker.
- name: Read this host's public address
  tags: [deploy]
  ansible.builtin.uri:
    url: https://api.ipify.org
    return_content: true
  become: false
  check_mode: false
  register: qbittorrent_k8s_host_ip

- name: Read the public address the tunnel presents
  tags: [deploy]
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n {{ k8s_namespace }} exec {{ qbittorrent_k8s_pod.stdout }} -c wireguard --
      curl -fsm 15 https://api.ipify.org
  become: true
  changed_when: false
  check_mode: false
  register: qbittorrent_k8s_tunnel_ip

- name: Fail if qbittorrent's traffic is not going through the tunnel
  tags: [deploy]
  ansible.builtin.assert:
    that:
      - qbittorrent_k8s_tunnel_ip.stdout | trim | length > 0
      - qbittorrent_k8s_tunnel_ip.stdout | trim != qbittorrent_k8s_host_ip.content | trim
    fail_msg: >-
      The pod's public address ({{ qbittorrent_k8s_tunnel_ip.stdout | trim }}) matches this
      host's, so traffic is LEAVING IN THE CLEAR rather than through Mullvad. Scale qbittorrent
      to zero before doing anything else — this is the failure the kill-switch exists to make
      impossible, and it means the kill-switch is not installed either.
    success_msg: >-
      Egress leaves through the tunnel: the pod presents
      {{ qbittorrent_k8s_tunnel_ip.stdout | trim }}, this host presents
      {{ qbittorrent_k8s_host_ip.content | trim }}.

# ── proof 2: the kill-switch has not eaten the cluster's return path ────────────────────────
# From INSIDE the cluster, not from this host. The host's address sits in lan_subnet, which the
# Compose allow-list already covered, so a request from here would pass even with the pod-CIDR
# entry missing — and pod CIDR is exactly what Traefik and the kubelet's probes arrive from.
# This is the D11 trap, tested at the only source address that can detect it.
#
# IT RETRIES FOR ~40s, AND THE RETRY IS THE WHOLE POINT OF THE LOOP — not defensive padding.
# kube-router's source-pod lookup lags pod creation, so a pod that dials immediately is not yet
# matched by this policy's `from:` selector and its connection is REJECTED. That surfaces as
#
#   wget: can't connect to remote host (10.43.115.232): Connection refused
#
# which reads exactly like the kill-switch having eaten the return path — the failure this task
# exists to detect — while the service is entirely healthy. Measured 2026-08-27: the probe failed
# on four consecutive runs while sonarr and radarr both returned valid=true on a LIVE
# downloadclient test, and all three addresses answered 200 from the host.
#
# A single dial therefore made this gate fail closed on a race, which blocks every deploy of this
# role. Distinguishing the two causes is what the loop buys: a genuine kill-switch fault stays
# refused for the full 40s, where the race clears in seconds.
#
# `Connection refused` rather than a timeout is also the tell that this is a REJECT and not a
# DROP, so do not read it as a NetworkPolicy that merely omits the caller.
- name: Reach the WebUI from a pod, as Traefik does
  tags: [deploy]
  # Skipped under --check, unlike proof 1 above: this is the one task in the file that creates a
  # cluster object rather than reading one. `--rm` cleans it up, but a dry run should not be
  # scheduling pods at all — and there is no read-only way to ask this question, since the whole
  # point is to originate the request from the pod CIDR.
  when: not ansible_check_mode
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n {{ k8s_namespace }} run qbittorrent-reach-probe
      --labels app=qbittorrent-reach-probe
      --rm -i --restart=Never --image={{ qbittorrent_k8s_probe_image }}
      --command -- sh -c
      "for i in $(seq 1 20); do
         wget -q -T 5 -O /dev/null http://qbittorrent:{{ container_item.port }}/ &&
         { echo REACHED; exit 0; };
         sleep 2;
       done; echo UNREACHABLE; exit 1"
  become: true
  changed_when: false
  register: qbittorrent_k8s_reach
  failed_when: "'REACHED' not in qbittorrent_k8s_reach.stdout"

- name: Report the tunnel and the return path
  tags: [deploy]
  ansible.builtin.debug:
    msg: >-
      qbittorrent is reachable from the pod network on
      {{ container_item.port }} and its egress presents
      {{ qbittorrent_k8s_tunnel_ip.stdout | trim }}, not
      {{ qbittorrent_k8s_host_ip.content | trim }} — so the kill-switch allows the cluster in
      while still forcing traffic out through Mullvad.

# ── proof 3: the modcache is populated, so an lscr.io outage is survivable ──────────────────
# The gate for the one-mount fix in deployment.yaml.j2. LSIO's docker-mods script applies a
# cached mod when the registry lookup fails, and that path RAN during the 9h/107-restart
# incident and found an empty cache — because /modcache was container-local and died with the
# pod. Asserting the tarball is on the volume is what turns "the mount is declared" into "the
# fallback has something to fall back to".
#
# READ-ONLY, so it runs under --check alongside proof 1. If the mod could not be fetched at all
# the pod never passes its startupProbe and the rollout fails long before this task.
- name: List the wireguard sidecar's modcache
  tags: [deploy]
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n {{ k8s_namespace }} exec {{ qbittorrent_k8s_pod.stdout }} -c wireguard --
      sh -c "grep -q ' /modcache ' /proc/mounts && echo MOUNTED; ls -1 /modcache"
  become: true
  changed_when: false
  check_mode: false
  register: qbittorrent_k8s_modcache

- name: Fail if the mod is not cached on the volume
  tags: [deploy]
  ansible.builtin.assert:
    that:
      # BOTH halves, and the first one is the one with teeth. mod-init creates /modcache inside
      # the container and caches there whether or not a volume is mounted, so a tarball on its
      # own proves NOTHING about surviving a restart — it is thrown away with the pod. Asserting
      # only the file passed happily against a pod with no mount at all (measured 2026-08-27,
      # which is how this was caught). /proc/mounts is what distinguishes the volume from the
      # container's own filesystem.
      - "'MOUNTED' in qbittorrent_k8s_modcache.stdout_lines"
      - qbittorrent_k8s_modcache.stdout_lines | select('search', '[.]tar[.]xz$') | list | length > 0
    fail_msg: >-
      /modcache is not a persistent mount, or holds no mod tarball, so a failed lscr.io fetch
      would strand this pod exactly as it did for 9 hours on 2026-08-16. The sidecar reports:
      {{ qbittorrent_k8s_modcache.stdout_lines | join(', ') | default('nothing', true) }}.
      Check the /modcache volumeMount in deployment.yaml.j2 and the sidecar's mod-init log.
    success_msg: >-
      /modcache is a persistent mount and holds the mod
      ({{ qbittorrent_k8s_modcache.stdout_lines | select('search', '[.]tar[.]xz$') | join(', ') }}),
      so a start that cannot reach lscr.io applies the cached copy instead of stranding.

# A LEFTOVER LOCK IS THE NEW FAILURE MODE THIS MOUNT INTRODUCES, so name it here rather than
# leaving the next person to rediscover it during an outage. docker-mods holds
# /modcache/<name>.lock for the duration of a download; a pod killed mid-download leaves it
# behind, and later starts WAIT on it and then skip the mod — which presents as no tunnel and a
# restarting pod, the same symptom as the outage this cache exists to prevent. Warns rather than
# fails, because a lock is legitimate while a download is genuinely in flight.
- name: Warn if a modcache lock is present
  tags: [deploy]
  ansible.builtin.debug:
    msg: >-
      A modcache lock file is present
      ({{ qbittorrent_k8s_modcache.stdout_lines | select('search', '[.]lock$') | join(', ') }}).
      If no download is in flight it is stale, and later starts will skip the mod — delete it
      from the volume. See this role's CLAUDE.md.
  when: qbittorrent_k8s_modcache.stdout_lines | select('search', '[.]lock$') | list | length > 0
