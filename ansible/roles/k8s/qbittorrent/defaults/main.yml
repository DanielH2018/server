---
# Tag KEPT alongside the digest (repo:latest@sha256) so Renovate's k8s-defaults manager still
# tracks it for digest-bump PRs — a bare repo@sha256 would freeze it with zero update signal
# (2026-08-13 pin).
qbittorrent_k8s_image: lscr.io/linuxserver/qbittorrent:latest@sha256:6816d2b144b1eb97665f886e41e18a14d026ba78c9d0953fc68a1211ea819433
qbittorrent_k8s_wireguard_image: lscr.io/linuxserver/wireguard:latest@sha256:3abfd4b82212106e357989750b9c0c9859aa511f5305a9a55c18c8de7198b655

# The throwaway pod verify.yml runs to prove the tunnel's return path. It is a defaults key
# here rather than a cross-role read from sonarr, because a cross-role default is only in
# scope when that role ran in the same play. The Jinja `default()` that covered the miss was
# invisible to Renovate's k8s-defaults manager, so it sat on alpine:3.22 while every other
# alpine pin moved to 3.24 with nothing to raise a PR about it.
qbittorrent_k8s_probe_image: alpine:3.24

# Auto-deploy stance — read by gitops_deploy (see the k8s auto-deploy coverage design).
# DENIED for state coupling, not missing recovery. The snapshot and revert machinery work
# fine here; the problem is that the config volume's state is coupled to something a snapshot
# cannot capture — the data volume (media-data, torrents/ subpath) its bookkeeping references.
# A revert rewinds in-flight torrent bookkeeping while the data volume does not move, so the
# two disagree about what is on disk. The WireGuard kill-switch surviving a container restart
# is a separate live trap that a revert does not clear either; see this role's CLAUDE.md.
k8s_autodeploy: false  # noqa var-naming[no-role-prefix]
k8s_autodeploy_reason: "state coupled outside the volume — reverting qbittorrent-config to a snapshot rewinds in-flight torrent bookkeeping while the media-data volume it references does not move; the pre-apply snapshot and revert work fine and are not the blocker"  # noqa var-naming[no-role-prefix]
# The pre-apply Longhorn snapshot k8s/manifests takes via k8s/volume-snapshot. Declared
# regardless of k8s_autodeploy — it protects a manual deploy too.
k8s_autodeploy_snapshot_pvcs: [qbittorrent-config]  # noqa var-naming[no-role-prefix]

# One config volume, two containers: wireguard and qbittorrent both mount it at /config. It
# looks like a mistake and is not — they write different subtrees, and splitting them would
# strand wg0.conf away from the mod that regenerates it.
qbittorrent_k8s_claim: qbittorrent-config
# Backed up. Excluding it was tried and reverted the same day: the exclusion left this volume
# with a single frozen restore point, and whether steady-state incrementals actually drive
# B2's transaction cap cannot be read off anything Longhorn or B2 expose. So it is being
# tested rather than assumed — docs/b2-transaction-cap-monitoring-gaps.md.
qbittorrent_k8s_storage_class: longhorn
qbittorrent_k8s_size: 1Gi
qbittorrent_k8s_source_path: /home/ubuntu/server/containers/qbittorrent/config

# torrents/ ONLY, via subPath — NOT the whole media tree. Carried across from the Compose
# comment and its reason (2026-07-02 review M2): qbittorrent handles the fleet's largest
# untrusted-input surface, and it has no business with write access to the book and film
# library. The hardlink-import concern that unifies the \*arr mounts is theirs alone — link()
# happens inside sonarr/radarr, whose single mount spans torrents/ AND media/.
qbittorrent_k8s_media_claim: media-data
qbittorrent_k8s_torrents_subpath: torrents

qbittorrent_k8s_webui_port: 8080
qbittorrent_k8s_torrenting_port: 6881

# ── the tunnel ──────────────────────────────────────────────────────────────────────────────
qbittorrent_k8s_mullvad_location: us-qas
qbittorrent_k8s_mullvad_mod: linuxserver/mods:wireguard-mullvad

# THE KILL-SWITCH ALLOW-LIST, and the one line in this file most likely to cause a silent
# outage. The mod installs iptables rules that REJECT anything not leaving via wg0, except to
# these ranges. The Compose value has three entries; the cluster needs the pod CIDR
# (10.42.0.0/16 — where Traefik's requests and the kubelet's probes come from, so their replies
# must be allowed back) and the Service CIDR (10.43.0.0/16 — cluster DNS).
#
# WRITTEN AS ONE /15, AND THAT IS NOT A TIDY-UP. 10.42.0.0/15 spans exactly those two /16s.
# Listing them separately fails, because the mod turns every entry into BOTH an iptables ACCEPT
# and an `ip route add ... via <gw>` — and flannel has already installed
# `10.42.0.0/16 via 10.42.0.1` in every pod. The duplicate route returns
#
#     RTNETLINK answers: File exists
#
# which wg-quick treats as fatal: it tears the interface back down and reports
# "Tunnel /config/wg_confs/wg0.conf failed", with nothing in the message about routes. Measured
# 2026-08-07 during B4c. The Compose value never hit this because Docker's bridge installs no
# matching supernet route. The /15 duplicates nothing and yields the same ACCEPT coverage.
qbittorrent_k8s_lan_networks: "192.168.0.0/24,{{ lan_subnet }},172.16.0.0/12,10.42.0.0/15"

# NOT /run/secrets, which is the Compose convention and does not survive the port:
# /var/run/secrets is where Kubernetes projects the ServiceAccount token, and a read-only
# Secret volume over it leaves runc unable to create the mountpoint. There is a guard test for
# exactly this (ansible/tests/test_k8s_manifests.py).
qbittorrent_k8s_secret_mount: /mullvad

qbittorrent_k8s_wg_cpu_limit: "1"
qbittorrent_k8s_wg_mem_limit: 256Mi
qbittorrent_k8s_wg_cpu_request: "50m"
qbittorrent_k8s_wg_mem_request: 32Mi
qbittorrent_k8s_cpu_limit: "2"
qbittorrent_k8s_mem_limit: 2048Mi
qbittorrent_k8s_cpu_request: "100m"
qbittorrent_k8s_mem_request: 256Mi
