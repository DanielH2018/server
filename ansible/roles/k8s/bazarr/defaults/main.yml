---

bazarr_k8s_image: lscr.io/linuxserver/bazarr:v1.6.1-ls365

# Auto-deploy stance — read by gitops_deploy (see the k8s auto-deploy coverage design).
# Migrating state — strategy is Recreate and the config volume comes from
# k8s_claims below (hardcoded ReadWriteOnce), so a bad image swap can migrate the database
# holding subtitle-path state before the gate observes a fault. Same class as sonarr/radarr;
# the linuxserver -lsNN scheme hides a breaking bump as a routine patch bump.
# k8s/manifests takes a pre-apply Longhorn snapshot of the claim below and reverts it if the
# deploy fails, so the migrating-state risk is covered. -lsNN still hides a breaking bump as a
# patch bump, but a bad swap reverts to the snapshot instead of stranding a live deploy
# against migrated data.
k8s_autodeploy: true  # noqa var-naming[no-role-prefix]
k8s_autodeploy_reason: "migrating state — Recreate + RWO volume-claim PVC, now protected by the pre-apply Longhorn snapshot and revert; -lsNN versioning still hides a breaking bump as a patch bump. WEIGHED: bazarr also mounts media-data (shared RWX, not reverted); a revert forgets subtitle files it already wrote there, largely self-healing since bazarr checks existence before re-downloading"  # noqa var-naming[no-role-prefix]
# The pre-apply Longhorn snapshot k8s/manifests takes via k8s/volume-snapshot. Declared
# regardless of k8s_autodeploy — protects a manual deploy too, and the revert is what this
# role's auto-deploy depends on.
k8s_autodeploy_snapshot_pvcs: [bazarr-config]  # noqa var-naming[no-role-prefix]
# Claims this role MOUNTS but does not revert — the WEIGHED clause in the reason above, stated
# where a test can read it. media-data is rendered by k8s/media-volume, so no guard that reads
# what this role creates can see the coupling.
k8s_autodeploy_unreverted_claims: [media-data]  # noqa var-naming[no-role-prefix]

# 3.7 M — the smallest *arr config, but still the database holding the paths.
bazarr_k8s_claim: bazarr-config
# `longhorn` — backed up. Excluding it (`longhorn-nobackup`) leaves a single frozen restore
# point, and nothing Longhorn or B2 expose shows whether steady-state incrementals drive B2's
# TRANSACTION cap. B2 Reachable is the readout. docs/archive/b2-transaction-cap-monitoring-gaps.md.
bazarr_k8s_storage_class: longhorn

# Mounted at /data/media via subPath — NOT the whole tree. bazarr never imports, so it has no
# hardlink seam to preserve and no reason to see /data/torrents.
bazarr_k8s_media_claim: media-data

# Mirrors resources('1.0', '1024M', '0.10', '128M').
bazarr_k8s_cpu_limit: "1"
bazarr_k8s_mem_limit: 1024Mi
bazarr_k8s_cpu_request: "100m"
bazarr_k8s_mem_request: 128Mi

# The claim k8s/manifests renders and applies for this role, ahead of the pre-apply snapshot.
k8s_claims:  # noqa var-naming[no-role-prefix]
  - name: "{{ bazarr_k8s_claim }}"
    storage_class: "{{ bazarr_k8s_storage_class }}"
    size: 1Gi
