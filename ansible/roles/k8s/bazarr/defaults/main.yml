---
# HELD UNTIL B4c. See the qbittorrent role's defaults for why this flag exists rather than the
# entry simply being absent.
#
# bazarr has a coexistence hazard the \*arrs do not: it addresses sonarr and radarr by bare name,
# and `sonarr` ALREADY resolves in this namespace (B3 deployed it). A cluster bazarr would
# therefore connect to the cluster sonarr immediately and start writing subtitle files into
# /srv/media — diverging the B2 copy from daniel-server, which the next delta sync would then
# either revert or, with --delete, remove.
bazarr_k8s_enabled: true  # flipped 2026-08-07 by B4c — the Docker copy is stopped and unmanaged

bazarr_k8s_image: lscr.io/linuxserver/bazarr:v1.5.6-ls350

# 3.7 M at B4a — the smallest config in the slice, but still the database holding the paths.
bazarr_k8s_claim: bazarr-config
# longhorn-nobackup since 2026-08-08: B2's TRANSACTION cap fired twice in a week (08-02, 08-08)
# as slice 4 took Longhorn's daily run from 4 to 15 backups, and incremental backups bound
# bandwidth, not transactions. Operator's call, taken with the cost stated: this volume keeps only
# the frozen 08-08 03:30 restore point it already had (never pruned, never refreshed), and kopia's
# copy under containers/ on daniel-server is older still, frozen at the 08-07 cutover.
#
# The live PVC was provisioned on `longhorn` and storageClassName is immutable, so this default
# only governs a volume rebuilt from scratch; the existing one is held out of the backup set by
# k3s_longhorn_nobackup_volumes. See docs/b2-transaction-cap-monitoring-gaps.md.
bazarr_k8s_storage_class: longhorn-nobackup
bazarr_k8s_size: 1Gi
bazarr_k8s_source_path: /home/ubuntu/server/containers/bazarr/config

# Mounted at /data/media via subPath — NOT the whole tree. bazarr never imports, so it has no
# hardlink seam to preserve and no reason to see /data/torrents.
bazarr_k8s_media_claim: media-data

# Mirrors resources('1.0', '1024M', '0.10', '128M').
bazarr_k8s_cpu_limit: "1"
bazarr_k8s_mem_limit: 1024Mi
bazarr_k8s_cpu_request: "100m"
bazarr_k8s_mem_request: 128Mi
