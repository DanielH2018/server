---
# HELD UNTIL B4c. See the qbittorrent role's defaults for why this flag exists rather than the
# entry simply being absent.
#
# bazarr has a coexistence hazard the \*arrs do not: it addresses sonarr and radarr by bare name,
# and `sonarr` ALREADY resolves in this namespace (B3 deployed it). A cluster bazarr would
# therefore connect to the cluster sonarr immediately and start writing subtitle files into
# /srv/media — diverging the B2 copy from daniel-server, which the next delta sync would then
# either revert or, with --delete, remove.
bazarr_k8s_enabled: true  # flipped 2026-08-07 by B4c — the Docker copy is stopped and unmanaged

bazarr_k8s_image: lscr.io/linuxserver/bazarr:v1.5.6-ls350

# Auto-deploy stance — read by gitops_deploy (see the k8s auto-deploy coverage design).
# Migrating state — strategy is Recreate and the config volume is seeded through
# k8s/seed-volume (hardcoded ReadWriteOnce), so a bad image swap can migrate the database
# holding subtitle-path state before the gate observes a fault. Same class as sonarr/radarr;
# the linuxserver -lsNN scheme hides a breaking bump as a routine patch bump.
k8s_autodeploy: false  # noqa var-naming[no-role-prefix]
k8s_autodeploy_reason: "migrating state — Recreate + RWO seed-volume PVC; -lsNN versioning hides a breaking bump"  # noqa var-naming[no-role-prefix]

# 3.7 M at B4a — the smallest config in the slice, but still the database holding the paths.
bazarr_k8s_claim: bazarr-config
# `longhorn` — backed up. Briefly `longhorn-nobackup` on 2026-08-08, after B2's TRANSACTION cap
# fired twice in a week (08-02, 08-08) as slice 4 took Longhorn's daily run from 4 to 15 backups and
# incremental backups bound bandwidth, not transactions. Returned the same day: the exclusion left
# this volume with a single frozen 08-08 restore point, and whether steady-state incrementals are
# actually the problem cannot be read off anything Longhorn or B2 expose. So it is being tested
# rather than assumed, with B2 Reachable as the readout. docs/b2-transaction-cap-monitoring-gaps.md.
bazarr_k8s_storage_class: longhorn
bazarr_k8s_size: 1Gi
bazarr_k8s_source_path: /home/ubuntu/server/containers/bazarr/config

# Mounted at /data/media via subPath — NOT the whole tree. bazarr never imports, so it has no
# hardlink seam to preserve and no reason to see /data/torrents.
bazarr_k8s_media_claim: media-data

# Mirrors resources('1.0', '1024M', '0.10', '128M').
bazarr_k8s_cpu_limit: "1"
bazarr_k8s_mem_limit: 1024Mi
bazarr_k8s_cpu_request: "100m"
bazarr_k8s_mem_request: 128Mi
