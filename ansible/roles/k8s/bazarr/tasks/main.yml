---
# Slice 4, B4a — subtitles. Mounts /data/media only — it never imports.
#


- name: Create the bazarr config volume claim
  tags: [deploy]
  ansible.builtin.include_role:
    name: k8s/volume-claim
  vars:
    volume_claim_service: bazarr
    volume_claim_name: "{{ bazarr_k8s_claim }}"
    volume_claim_storage_class: "{{ bazarr_k8s_storage_class }}"

- name: Deploy bazarr to the cluster
  ansible.builtin.include_role:
    name: k8s/manifests
  vars:
    manifests_service: bazarr
    manifests_files:
      # Listed FIRST so it exists before the pod can be scheduled. Ordering within a single
      # `kubectl apply -f <dir>` is not guaranteed, which is why the pod also cannot be reached
      # in the gap: it takes seconds to pull and start, and the policy is applied in the same
      # call. Same reasoning as roles/k8s/prowlarr.
      - networkpolicy-bazarr.yaml
      - deployment.yaml
      - service.yaml
      - ingressroute.yaml
