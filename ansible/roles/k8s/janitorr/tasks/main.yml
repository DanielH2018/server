---
# Slice 4, B7b — the last of the nine. No Service, no route, no PVC: janitorr has no web UI and
# keeps no state of its own. What it has is write access to the whole media tree, which is why it
# ships with dry-run on and why verify.yml is a gate rather than a formality.

# Read by the Docker role's application.yml.j2 through lookup('template'), which defaults it to
# false so only this side runs dry. A set_fact rather than an include_role var because the render
# happens inside the manifests role, and an include var there would have to carry that role's
# `manifests_` prefix to satisfy ansible-lint — which would put janitorr's deletion switch under
# a name that says nothing about janitorr.
- name: Select the dry-run mode janitorr's config renders with
  tags: [config]
  ansible.builtin.set_fact:
    janitorr_dry_run: "{{ janitorr_k8s_dry_run }}"

- name: Deploy janitorr to the cluster
  ansible.builtin.include_role:
    name: k8s/manifests
  vars:
    manifests_service: janitorr
    manifests_files:
      - deployment.yaml
    manifests_secret_files:
      - config-secret.yaml

- name: Verify janitorr
  ansible.builtin.import_tasks: verify.yml

- name: Install the janitorr health reader directory
  tags: [config]
  ansible.builtin.file:
    path: /opt/janitorr-health
    state: directory
    owner: "{{ sys_user }}"
    group: "{{ sys_user }}"
    mode: "0755"
  become: true

- name: Install the janitorr health reader scripts
  tags: [config]
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/opt/janitorr-health/{{ item | basename }}"
    owner: "{{ sys_user }}"
    group: "{{ sys_user }}"
    mode: "0755"
  loop:
    - janitorr_health.py
    - janitorr_health_logic.py
    # The kubectl runner this reader and configarr's used to carry a byte-identical copy of.
    # Copied INTO this /opt dir rather than imported from a shared path: the reader does a
    # sys.path.insert of its own directory and nothing else, which is the sibling-copy pattern
    # gitops_deploy.py and renovate_notify.py already use for this same file.
    - "{{ role_path }}/../../setup/common/files/host_lib.py"
  become: true

- name: Deploy the janitorr error heartbeat
  tags: [cron]
  ansible.builtin.template:
    src: janitorr-health.sh.j2
    dest: /usr/local/bin/janitorr-health.sh
    # DECIDED: 0700 owned by sys_user, not 0755 — the script interpolates a live Kuma push token
    # into its URL, and at 0755 any local account could read it and forge or suppress this
    # monitor's heartbeat. Owner is sys_user, NOT root: the cron below runs as sys_user, so
    # root:root 0700 would make it unreadable to its own caller. That is why this diverges from
    # registry-gc.sh (0700 root:root) and the crowdsec scripts (0750 root:root) — both of those
    # are root-run crons. Match the mode to the precedent, but the owner to the cron user.
    mode: "0700"
    owner: "{{ sys_user }}"
    group: "{{ sys_user }}"
  become: true
  no_log: true  # renders the Kuma push token

- name: Schedule the janitorr error heartbeat
  tags: [cron]
  ansible.builtin.cron:
    name: "janitorr error health"
    minute: "{{ janitorr_k8s_health_cron_minute }}"
    user: "{{ sys_user }}"
    job: "/usr/local/bin/janitorr-health.sh"
    cron_file: janitorr-health
  become: true
