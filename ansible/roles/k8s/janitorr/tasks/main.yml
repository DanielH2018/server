---
# Slice 4, B7b — the last of the nine. No Service, no route, no PVC: janitorr has no web UI and
# keeps no state of its own. What it has is write access to the whole media tree, which is why it
# ships with dry-run on and why verify.yml is a gate rather than a formality.

# Read by the Docker role's application.yml.j2 through lookup('template'), which defaults it to
# false so only this side runs dry. A set_fact rather than an include_role var because the render
# happens inside the manifests role, and an include var there would have to carry that role's
# `manifests_` prefix to satisfy ansible-lint — which would put janitorr's deletion switch under
# a name that says nothing about janitorr.
- name: Select the dry-run mode janitorr's config renders with
  tags: [config]
  ansible.builtin.set_fact:
    janitorr_dry_run: "{{ janitorr_k8s_dry_run }}"

- name: Deploy janitorr to the cluster
  ansible.builtin.include_role:
    name: k8s/manifests
  vars:
    manifests_service: janitorr
    manifests_files:
      - deployment.yaml
    manifests_secret_files:
      - config-secret.yaml

- name: Verify janitorr
  ansible.builtin.import_tasks: verify.yml
  # Every proof in verify.yml is about the pod this deploy rolled out. --check rolls nothing
  # out and skips the rollout wait, so the proofs would test the running pod and their reports
  # would error on check-mode skip results (#2323).
  when: not ansible_check_mode

- name: Install the janitorr health reader directory
  tags: [config]
  ansible.builtin.file:
    path: /opt/janitorr-health
    state: directory
    owner: "{{ sys_user }}"
    group: "{{ sys_user }}"
    mode: "0755"
  become: true

- name: Install the shared host_lib helper beside the janitorr health reader
  tags: [config]
  # Before the reader, not in the same loop after it: the cron invokes the reader by absolute
  # path, so a window in which it exists without its sibling import is a spurious page. The
  # reader does a sys.path.insert of its own directory and nothing else, which is why the file
  # is copied in rather than imported from a shared location.
  ansible.builtin.import_tasks: "{{ role_path }}/../../setup/common/tasks/install_host_lib.yml"
  vars:
    host_lib_dir: /opt/janitorr-health
    host_lib_owner: "{{ sys_user }}"

- name: Install the janitorr health reader scripts
  tags: [config]
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/opt/janitorr-health/{{ item | basename }}"
    owner: "{{ sys_user }}"
    group: "{{ sys_user }}"
    mode: "0755"
  loop:
    - janitorr_health.py
    - janitorr_health_logic.py
  become: true

# The reader scripts and their host_lib sibling were `copy:`-deployed and watched by nothing
# (#2590): setup-drift-lib.sh's deployed-code arm only compares pairs a role declared, so a
# stale copy here ran behind a drift check reporting "deployed code matches the repo". Tagged
# `config` like the copies above, so a `--tags config` run stamps exactly what it just wrote.
- name: Record the deployed janitorr health reader code
  tags: [config]
  ansible.builtin.import_tasks: "{{ role_path }}/../../setup/common/tasks/stamp_deployed.yml"
  vars:
    stamp_deployed_name: janitorr
    stamp_deployed_pairs:
      # Spelled as literals, not through a var: the copy<->stamp guard in
      # ansible/tests/setup/test_host_lib_sibling_copies.py compares these strings against the
      # include's `host_lib_dir` as written, so a var here reads to it as the wrong directory.
      - live: /opt/janitorr-health/host_lib.py
        src: ansible/roles/setup/common/files/host_lib.py
      - live: /opt/janitorr-health/janitorr_health.py
        src: ansible/roles/k8s/janitorr/files/janitorr_health.py
      - live: /opt/janitorr-health/janitorr_health_logic.py
        src: ansible/roles/k8s/janitorr/files/janitorr_health_logic.py

- name: Deploy the janitorr error heartbeat
  tags: [cron]
  ansible.builtin.template:
    src: janitorr-health.sh.j2
    dest: /usr/local/bin/janitorr-health.sh
    # DECIDED: 0700 owned by sys_user, not 0755 — the script interpolates a live Kuma push token
    # into its URL, and at 0755 any local account could read it and forge or suppress this
    # monitor's heartbeat. Owner is sys_user, NOT root: the cron below runs as sys_user, so
    # root:root 0700 would make it unreadable to its own caller. That is why this diverges from
    # registry-gc.sh (0700 root:root) and the crowdsec scripts (0750 root:root) — both of those
    # are root-run crons. Match the mode to the precedent, but the owner to the cron user.
    mode: "0700"
    owner: "{{ sys_user }}"
    group: "{{ sys_user }}"
  become: true
  no_log: true  # renders the Kuma push token

- name: Schedule the janitorr error heartbeat
  tags: [cron]
  ansible.builtin.cron:
    name: "janitorr error health"
    minute: "{{ janitorr_k8s_health_cron_minute }}"
    user: "{{ sys_user }}"
    job: "/usr/local/bin/janitorr-health.sh"
    cron_file: janitorr-health
  become: true
