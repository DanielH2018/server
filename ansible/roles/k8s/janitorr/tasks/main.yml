---
# No Service, no route, no PVC: janitorr has no web UI and keeps no state of its own. What it
# has is write access to the whole media tree, which is why verify.yml is a gate rather than a
# formality.

# Read by templates/config/application.yml.j2 through lookup('template'), which defaults it to
# false. A set_fact rather than an include_role var because the render
# happens inside the manifests role, and an include var there would have to carry that role's
# `manifests_` prefix to satisfy ansible-lint — which would put janitorr's deletion switch under
# a name that says nothing about janitorr.
- name: Select the dry-run mode janitorr's config renders with
  tags: [config]
  ansible.builtin.set_fact:
    janitorr_dry_run: "{{ janitorr_k8s_dry_run }}"

# The health reader was a daniel-box host cron until H2.5c
# (docs/target-architecture/host/h2-shrink-host-plane.md, Steps item 14). These absent arms
# remove it, ahead of the k8s/manifests include, so the host cron is gone before the CronJob
# that replaces it exists. They stay until D5's conversion PR moves them into
# setup/k8s_host_files, and H7 deletes them. ansible/tests/repo/_retired_cron_row.py holds the
# cron's and the fragment's arms to the tree.
- name: Remove the retired janitorr error heartbeat cron
  tags: [cron]
  ansible.builtin.cron:
    name: "janitorr error health"
    user: "{{ sys_user }}"
    cron_file: janitorr-health
    state: absent
  become: true
  when: not k8s_dry_run | bool

- name: Remove the retired janitorr health reader from the host
  tags: [config]
  # The fragment goes with the code it stamped: left behind, setup drift compares four live
  # paths that no longer exist and turns DOWN.
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /usr/local/bin/janitorr-health.sh
    - /opt/janitorr-health
    - /var/lib/homelab/setup-deployed-manifest.d/janitorr
  become: true
  when: not k8s_dry_run | bool

- name: Deploy janitorr to the cluster
  ansible.builtin.include_role:
    name: k8s/manifests

- name: Verify janitorr
  ansible.builtin.import_tasks: verify.yml
  # Every proof in verify.yml is about the pod this deploy rolled out. --check rolls nothing
  # out and skips the rollout wait, so the proofs would test the running pod and their reports
  # would error on check-mode skip results.
  when: not ansible_check_mode
