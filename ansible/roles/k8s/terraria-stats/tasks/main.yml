---
# terraria-stats on k8s (Phase F drain, 2026-08-13): reads the terraria pod's console
# lines from loki-homelab, folds them into all-time per-player stats (SQLite on a
# Longhorn PVC, seeded from the Docker copy), serves Prometheus metrics on :9420.
# The scrape job lives in claude-otel's prometheus.yaml.j2 (job_name: terraria-stats).

- name: Seed the stats DB from the Docker copy
  ansible.builtin.include_role:
    name: k8s/volume-claim
  vars:
    volume_claim_service: terraria-stats
    volume_claim_name: terraria-stats-data
    volume_claim_size: "{{ terraria_stats_k8s_pvc_size }}"

- name: Create the staging directory
  tags: [config]
  ansible.builtin.file:
    path: /etc/rancher/k3s/terraria-stats
    state: directory
    mode: "0755"
    owner: root
    group: root
  become: true

- name: Stage the stats script on the node
  tags: [config]
  ansible.builtin.copy:
    src: stats.py
    dest: /etc/rancher/k3s/terraria-stats/stats.py
    mode: "0644"
    owner: root
    group: root
  become: true
  register: terraria_stats_script

# The script is Jinja-hostile (its Prometheus exposition strings carry {…} braces), so
# it becomes a ConfigMap via kubectl --from-file, never via a template — the same
# reasoning as claude-otel's dashboards and image-builder's context files.
- name: Render the script ConfigMap manifest
  tags: [config]
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      k3s kubectl -n {{ k8s_namespace }} create configmap terraria-stats-script
      --from-file=stats.py=/etc/rancher/k3s/terraria-stats/stats.py
      --dry-run=client -o yaml > /etc/rancher/k3s/terraria-stats/configmap.yaml
    executable: /bin/bash
  become: true
  changed_when: terraria_stats_script is changed

# Server-side, like monitor-bridge's: client-side apply re-stores the whole object in an
# annotation capped at 262144 bytes, which the bridge crossed on 2026-09-01. This script is far
# smaller, but one apply form across the four script ConfigMaps is one thing to get right.
# --force-conflicts takes the data keys from the client-side field manager that applied them
# before the switch. Server-side apply prints the same line whether or not anything changed,
# so the changed signal is the staged file. ENFORCED by
# ansible/tests/test_script_configmaps_apply_server_side.py.
- name: Apply the script ConfigMap
  tags: [deploy]
  ansible.builtin.command:
    cmd: >-
      k3s kubectl apply --server-side --force-conflicts
      -f /etc/rancher/k3s/terraria-stats/configmap.yaml
  become: true
  register: terraria_stats_cm_apply
  changed_when: terraria_stats_script is changed

- name: Deploy terraria-stats to the cluster
  ansible.builtin.include_role:
    name: k8s/manifests
  vars:
    manifests_service: terraria-stats
    manifests_rollout: terraria-stats
    manifests_files:
      - deployment.yaml
      - service.yaml
