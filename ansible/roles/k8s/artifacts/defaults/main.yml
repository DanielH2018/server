---
# Same base image as the other stdlib-only Python workloads here (monitor-bridge,
# autofix-bridge) — artifact_server.py imports nothing off PyPI, so there is no wheel to
# build and no image to maintain.
artifacts_k8s_image: python:3.14-alpine@sha256:f6a589d43c42b9e7f7dc67a12d37132491f362859a5d750607710cc56da3bc72

# Auto-deploy stance — read by gitops_deploy (see the k8s auto-deploy coverage design).
# Stateless Deployment, RollingUpdate, no PVC, HTTP readinessProbe, and the base image tag
# above is a real version, not a mutable :latest or an -lsNN scheme that hides a breaking bump.
# Deliberately unprefixed: one constant key name every role uses, so the completeness guard
# can check for it without knowing the role's own prefix.
k8s_autodeploy: true  # noqa var-naming[no-role-prefix]
k8s_autodeploy_reason: "stateless RollingUpdate Deployment, no PVC, readinessProbe gates the rollout, pinned image tag"  # noqa var-naming[no-role-prefix]

# The Python files that make up the running server, mirroring autofix-bridge's
# `autofix_bridge_modules` and carrying the same risk: a module missing here never reaches the
# ConfigMap, and the pod dies at import with ModuleNotFoundError.
#
# Each name is both the ConfigMap key and the file under `files/`, because the Deployment
# mounts the whole ConfigMap at /app and `python3 /app/artifact_server.py` imports its
# siblings by their plain module name. Order is the render order and nothing else.
# ENFORCED by ansible/tests/services/test_artifacts_configmap.py, which compares this list
# against the files on disk in both directions.
artifacts_modules:
  - _gui_html.py
  - artifact_meta.py
  - artifact_server.py

# hostPath pins the pod to ONE node. daniel-box is the control-plane node, where Ansible
# runs and where most sessions work, so its tree is the local mount and every other host's
# is synced in by roles/setup/claude_code's peer sync, which runs on its twin
# claude_code_artifacts_node. ansible/tests/setup/test_claude_code_artifacts_node_crons.py
# holds this and every other twin below equal to the claude_code key.
artifacts_k8s_node: "{{ k8s_primary_node }}"

# The tree Claude Code's artifact-design skill writes to on each host.
artifacts_host_dir: /home/ubuntu/.claude/artifacts
# The agent user's tree (docs/claude-agent-user.md, slice 4): where sessions that run as
# `claude` write. Empty means "no agent tree" and the mount, the volume and the index source
# all disappear. It defaults on only where the agent user is enabled, so a host without one
# does not mount a path that is not there. The index lists it as the host
# `<artifacts_k8s_node>-claude`, beside the operator's `<artifacts_k8s_node>`.
# The pod is not root: it runs as puid:pgid (the operator), so it reads this tree through the
# group grant on the directory (2750 claude:ubuntu, default ACL g:ubuntu:rX), not through
# DAC_OVERRIDE. This role does not create the directory; roles/setup/claude_code does.
artifacts_agent_dir: "{{ '/var/lib/claude/.claude/artifacts' if (claude_code_agent_user_enabled | default(false) | bool) else '' }}"
# Where daniel-box holds the other hosts' copies: one subdirectory per host, which becomes
# the /a/<host>/ path segment the index and the GUI filter on. roles/setup/claude_code's peer
# sync writes them, from its twin claude_code_artifacts_peer_dir.
artifacts_peer_dir: /home/ubuntu/.claude/artifacts-peer

# The star list the GUI writes: one `<host>/<relpath>` line per starred artifact, which
# prune-artifacts.sh (dotfiles) on each host skips. It is the pod's only writable mount.
# Outside /home/ubuntu because the agent user's prune reads it too, and `claude` cannot
# traverse /home/ubuntu (0750). The dotfiles point daniel-box's CLAUDE_ARTIFACT_STARS_FILE at
# this path, so a change here needs the same change in settings.base.json there, and in
# claude_code_artifacts_stars_file, the copy the peer sync pushes.
artifacts_stars_dir: /var/lib/artifact-stars
artifacts_stars_name: stars.txt

# The peer hosts whose artifact trees the pod serves, one read-only mount of
# artifacts_peer_dir/<name> per entry. roles/setup/claude_code's peer sync pulls each one onto
# daniel-box and owns the transport fields; its twin claude_code_artifacts_peer_sources must
# list the same entries.
artifacts_peer_sources:
  - name: daniel-server
    ssh_target: daniel-server
    path: /home/ubuntu/.claude/artifacts
    stars_path: /home/ubuntu/.claude/artifact-stars.txt

# Platform components that carry no containers_list entry because they are installed by
# roles/setup/k3s rather than deployed as workloads. Longhorn is the reason this list exists:
# it is the most-discussed subject in the corpus and matched nothing without it.
artifacts_platform_services:
  - longhorn
  - k3s
  - metallb
  - coredns
  - unbound
  - cert-manager

# Services no inventory lists, but that older artifacts are about — a document reviewing the
# kopia retirement is only findable by service if the name is still recognised. Retiring a
# service should add its name here rather than dropping it from the index.
# prometheus, tempo and otel-collector are live in the observability namespace, but they are
# absent from containers_list for the same reason, so they belong here.
artifacts_retired_services:
  - beszel
  - calibre
  - calibre-web
  - calmerge
  - change-detection
  - duplicati
  - file-browser
  - foundry
  - guacamole
  - happy
  - jellyseerr
  - kopia
  - minecraft
  - otel-collector
  - portainer
  - portainer-agent
  - prometheus
  - readarr
  - tempo
  - wallabag
  - watchtower

# The index is built per request from ~50 files; the pod is idle between page loads.
artifacts_k8s_cpu_limit: "500m"
artifacts_k8s_mem_limit: 128Mi
artifacts_k8s_cpu_request: "10m"
artifacts_k8s_mem_request: 32Mi
