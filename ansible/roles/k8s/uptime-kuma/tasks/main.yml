---
# Uptime Kuma + AutoKuma sidecar.

# Both claims are `k8s_claims` in defaults/main.yml, which k8s/manifests renders and applies
# ahead of the workload (#3387).

# The AutoKuma id (the declaration's filename) is what the status-page group rules are written
# against, and it is invisible over Kuma's API — `monitor list` returns display names and numeric
# ids, and the id-to-name map lives in AutoKuma's own SQLite on an RWO PVC. Rendering the
# declarations here is the only place both halves exist at once.
#
# no_log because the rendered declarations carry every push token, the Discord webhook and the
# SMTP password. Only the id and the display name reach the ConfigMap.
- name: Read the AutoKuma declarations back as data
  tags: [deploy]
  no_log: true
  ansible.builtin.set_fact:
    kuma_declarations: >-
      {{ dict(files.keys() | map('regex_replace', '\.json$', '') | list
              | zip(files.values() | map('from_json') | list)) }}
  vars:
    files: >-
      {{ (lookup('template', playbook_dir + '/roles/k8s/uptime-kuma/templates/static-monitors.yaml.j2')
          | from_yaml).stringData }}

# The index is built by parsing a render, so a change to how that template is shaped could leave
# it EMPTY — and an empty index renders a valid ConfigMap, applies cleanly, and gives the sync a
# page with no monitors on it. A census that finds nothing has to fail here rather than deploy.
- name: Check the declaration index is populated
  tags: [deploy]
  ansible.builtin.assert:
    that: kuma_declarations | length > 50
    fail_msg: >-
      parsed only {{ kuma_declarations | length }} AutoKuma declarations out of
      static-monitors.yaml.j2; the status page would be rendered from an empty index

# AutoKuma refuses a push token that is not 32 letters and digits with one WARN per sync and
# never creates the monitor, so its pusher gets 404 and nothing pages (#3985). A token added by
# hand through sops is checked by nothing else.
#
# DECIDED: no no_log on this assert, though it reads kuma_declarations. The filter returns
# AutoKuma ids only, never a token, and no_log would hide the ids its message exists to name.
- name: Check every push token is in the format AutoKuma accepts
  tags: [deploy]
  ansible.builtin.assert:
    that: kuma_declarations | kuma_malformed_push_tokens | length == 0
    fail_msg: >-
      AutoKuma would refuse these push monitors, because each push_token is not 32 letters and
      digits: {{ kuma_declarations | kuma_malformed_push_tokens | join(', ') }}. Re-mint each
      token with `openssl rand -hex 16` (the add-secret skill has the sops command).

- name: Deploy uptime-kuma to the cluster
  ansible.builtin.include_role:
    name: k8s/manifests
  vars:
    # The two Secrets are never pruned: Secret is not in manifests_prune_allowlist.
    manifests_rollout: uptime-kuma
    # Listed rather than derived: static-monitors.yaml is a Secret (it carries every push
    # token) whose name does not say so, and the derivation reads secrecy off the name.
    manifests_secret_files:
      - secret.yaml
      - static-monitors.yaml

# autokuma-data was staged by k8s/volume-claim under `autokuma-claims/`, a directory the shared
# sweep in k8s/manifests cannot reach because it is keyed on `uptime-kuma` (#3387). The claim
# renders through `k8s_claims` now, so the staged copy is stale.
- name: Remove the k8s/volume-claim staging directory autokuma-data left behind
  tags: [config]
  ansible.builtin.file:
    path: /etc/rancher/k3s/manifests/autokuma-claims
    state: absent
  become: true
  when: not k8s_dry_run | bool
