---
# Slice-7 Phase D step 3 (2026-08-10): Uptime Kuma + AutoKuma sidecar. Built ahead of the
# cutover, deployed only inside it — see the flag comment in defaults.

- name: Create the Kuma data volume claim
  tags: [deploy]
  ansible.builtin.include_role:
    name: k8s/seed-volume
  vars:
    seed_volume_service: uptime-kuma
    seed_volume_claim: "{{ uptime_kuma_k8s_claim }}"
    seed_volume_storage_class: "{{ uptime_kuma_k8s_storage_class }}"
    seed_volume_size: "{{ uptime_kuma_k8s_size }}"

- name: Create the AutoKuma entity-map volume claim
  tags: [deploy]
  ansible.builtin.include_role:
    name: k8s/seed-volume
  vars:
    seed_volume_service: autokuma
    seed_volume_claim: "{{ uptime_kuma_k8s_autokuma_claim }}"
    seed_volume_storage_class: "{{ uptime_kuma_k8s_storage_class }}"
    seed_volume_size: "{{ uptime_kuma_k8s_autokuma_size }}"

- name: Deploy uptime-kuma to the cluster
  ansible.builtin.include_role:
    name: k8s/manifests
  vars:
    manifests_service: uptime-kuma
    manifests_rollout: uptime-kuma
    manifests_files:
      - deployment.yaml
      - service.yaml
      - ingressroute.yaml
    manifests_secret_files:
      - secret.yaml
      - static-monitors.yaml
