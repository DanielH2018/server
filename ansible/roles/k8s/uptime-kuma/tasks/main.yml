---
# Render only the two claims, which stay until the role's second retirement PR
# (docs/flux-deploy-plane.md, *Retiring a flux-owned service*). They are `k8s_claims` in
# defaults/main.yml, and each carries `kustomize.toolkit.fluxcd.io/prune: disabled`.

- name: Deploy uptime-kuma to the cluster
  ansible.builtin.include_role:
    name: k8s/manifests
  vars:
    # The renderer refuses a restart target that names no workload in the render.
    manifests_rollout: ''
