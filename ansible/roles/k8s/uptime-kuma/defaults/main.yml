---
# Flipped 2026-08-10 in the step-4 cutover window (slice-7-phase-d-kuma.md): the Docker
# pair is stopped and removed (compose file kept for rollback beside the tar snapshot),
# both volumes force-seeded, and this instance is the alerting spine now.
uptime_kuma_k8s_enabled: true

# SAME tag as the Docker copy on purpose — the seeded SQLite crosses hosts, not versions.
uptime_kuma_k8s_image: louislam/uptime-kuma:2.5.0
# Pinned (the Docker sidecar ran :latest): the k8s-defaults Renovate manager only tracks
# versioned pins, and v2.0.0 is what the KD5 gate verified (docker.enabled, static-file
# notification entities, on_delete semantics).
autokuma_k8s_image: ghcr.io/bigboot/autokuma:2.0.0

# 1.5 G live at planning (heartbeat history) — `longhorn`, BACKED UP, which the Docker copy
# deliberately never was (kopiaignore). The migration upgrades the DB from "unrecoverable"
# to "nightly Longhorn backup".
uptime_kuma_k8s_claim: uptime-kuma-data
uptime_kuma_k8s_size: 4Gi
uptime_kuma_k8s_storage_class: longhorn
uptime_kuma_k8s_source_path: /home/ubuntu/server/containers/uptime-kuma/data

# AutoKuma's OWN entity-id map (1.1 M live). It must move with Kuma's DB or the new
# instance manages nothing and static files would recreate duplicates (KD5 gate finding).
uptime_kuma_k8s_autokuma_claim: autokuma-data
uptime_kuma_k8s_autokuma_size: 1Gi
uptime_kuma_k8s_autokuma_source_path: /home/ubuntu/server/containers/uptime-kuma/autokuma-data

# Mirrors resources('0.50', '512M', '0.05', '64M') for kuma; autokuma is a reconciler.
uptime_kuma_k8s_cpu_limit: "500m"
uptime_kuma_k8s_mem_limit: 512Mi
uptime_kuma_k8s_cpu_request: "50m"
uptime_kuma_k8s_mem_request: 64Mi
autokuma_k8s_cpu_limit: "250m"
autokuma_k8s_mem_limit: 128Mi
autokuma_k8s_cpu_request: "20m"
autokuma_k8s_mem_request: 32Mi

# Minutes before Kuma re-notifies about a monitor that is STILL down. Kuma's own default is 0,
# which means "notify once on the down transition and then never again" — so until 2026-08-16
# every one of the static push monitors produced exactly one Discord message per outage, however
# long it ran. A tile that went down at 04:30 was silent by breakfast and stayed silent all day.
#
# 6h rather than hourly: these monitors watch things that take a human intervention to fix, so a
# faster resend would mostly train the reader to mute the channel — which is the failure mode that
# loses the NEXT alert. Applied uniformly and asserted by a test, rather than set per-tile, so a
# new monitor cannot be added without one (the GitOps tile was the known instance; the gap was
# every push monitor).
kuma_push_resend_interval_minutes: 360

# One monitor is held at 0, deliberately and temporarily.
#
# `k3s Longhorn Backup` has been DOWN since 04:30 on 2026-08-16 and cannot come back on its own:
# the weekly tier has never completed a backup, so all 22 sharded volumes report as uncovered,
# and the earliest any shard can clear is its next weekly run. It also notifies email, not just
# Discord. Turning on a 6-hourly resend against a condition with no available action is how the
# channel gets muted, which costs the NEXT alert — the same reasoning that set 360 everywhere
# else, pointed the other way.
#
# LIFT THIS when the first weekly-backup-dN run completes and the tile goes green: delete the
# override, delete the entry in test_kuma_static_monitors.py's held set, redeploy uptime-kuma.
# It is a hold, not a revert — the fleet-wide 360 above is unchanged.
kuma_longhorn_backup_resend_interval_minutes: 0
