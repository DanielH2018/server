---
# Flipped 2026-08-10 in the step-4 cutover window (slice-7-phase-d-kuma.md): the Docker
# pair is stopped and removed (compose file kept for rollback beside the tar snapshot),
# and this instance is the alerting spine now.
# SAME tag as the Docker copy on purpose — the seeded SQLite crosses hosts, not versions.
uptime_kuma_k8s_image: louislam/uptime-kuma:2.5.3
# Pinned (the Docker sidecar ran :latest): the k8s-defaults Renovate manager only tracks
# versioned pins. v2.0.0 is what the KD5 gate verified (docker.enabled, static-file
# notification entities, on_delete semantics); 2.1.0-rc.2 is a deliberate prerelease, taken on
# 2026-08-21 because it is the only release where `resendInterval` reaches a push monitor — see
# the caveat under kuma_push_resend_interval_minutes.
#
# Two rc-2 mechanisms this deployment now depends on, read from the tagged source rather than
# the changelog: `@/path` in an env value reads the file and strips one trailing newline
# (kuma-client/src/config.rs, resolve_file_ref), and a health/metrics HTTP server listens on
# 8090 unless AUTOKUMA__HEALTHCHECK_PORT is emptied (autokuma/src/config.rs). The published
# image builds the DEFAULT feature set, which is Kuma v2 — `uptime-kuma-v1` is opt-in and the
# Dockerfile's ARG FEATURES is empty.
autokuma_k8s_image: ghcr.io/bigboot/autokuma:2.1.0-rc.2

# Auto-deploy stance — read by gitops_deploy (see the k8s auto-deploy coverage design).
# Observability: this IS the alerting spine every push/HTTP monitor and the Discord chain depend
# on — a broken deploy cannot page about being broken. It ALSO independently matches the
# migrating-state shape: Recreate + a real PVC seeded through k8s/volume-claim (hardcoded
# ReadWriteOnce) holding the heartbeat history — a bad image swap can migrate that volume before
# the gate observes a fault, same class as sonarr/prowlarr. Either reason alone would justify
# the denylist entry.
k8s_autodeploy: false  # noqa var-naming[no-role-prefix]
k8s_autodeploy_reason: "observability — the alerting spine; a broken deploy cannot page about being broken. ALSO Recreate + RWO volume-claim PVC (migrating-state shape) — two independent reasons. COUPLING NOTE for a future promotion: two PVCs (uptime-kuma-data, autokuma-data) that must revert together; a partial revert desyncs AutoKuma's entity-ID map from Kuma's DB, the same shape as the recorded KD5 migration finding"  # noqa var-naming[no-role-prefix]

# 1.5 G live at planning (heartbeat history) — `longhorn`, BACKED UP, which the Docker copy
# deliberately never was (kopiaignore). The migration upgrades the DB from "unrecoverable"
# to "nightly Longhorn backup".
uptime_kuma_k8s_claim: uptime-kuma-data
uptime_kuma_k8s_size: 4Gi
uptime_kuma_k8s_storage_class: longhorn

# AutoKuma's OWN entity-id map (1.1 M live). It must move with Kuma's DB or the new
# instance manages nothing and static files would recreate duplicates (KD5 gate finding).
uptime_kuma_k8s_autokuma_claim: autokuma-data
uptime_kuma_k8s_autokuma_size: 1Gi

# Mirrors resources('0.50', '512M', '0.05', '64M') for kuma; autokuma is a reconciler.
uptime_kuma_k8s_cpu_limit: "500m"
uptime_kuma_k8s_mem_limit: 512Mi
uptime_kuma_k8s_cpu_request: "50m"
uptime_kuma_k8s_mem_request: 64Mi
# Seconds between AutoKuma reconcile passes — see the env comment in deployment.yaml.j2 for why
# the upstream default of 5 was costing ~34k SQLite writes a day. A deploy's new monitors appear
# within this many seconds; postflight's `count(monitor_status)` check does not race it.
autokuma_k8s_sync_interval: 60

# What AutoKuma does with a live entity that has no declaration file. `delete` is the committed
# stance (the deployment template carries the reasoning). Override to `keep` on the command line
# for one deploy when the sidecar image itself is changing, then redeploy at the default.
autokuma_k8s_on_delete: delete

autokuma_k8s_cpu_limit: "250m"
autokuma_k8s_mem_limit: 128Mi
autokuma_k8s_cpu_request: "20m"
autokuma_k8s_mem_request: 32Mi

# Minutes before Kuma re-notifies about a monitor that is STILL down. Kuma's own default is 0,
# which means "notify once on the down transition and then never again" — so until 2026-08-16
# every one of the static push monitors produced exactly one Discord message per outage, however
# long it ran. A tile that went down at 04:30 was silent by breakfast and stayed silent all day.
#
# 6h rather than hourly: these monitors watch things that take a human intervention to fix, so a
# faster resend would mostly train the reader to mute the channel — which is the failure mode that
# loses the NEXT alert. Applied uniformly and asserted by a test, rather than set per-tile, so a
# new monitor cannot be added without one (the GitOps tile was the known instance; the gap was
# every push monitor).
kuma_push_resend_interval_minutes: 360

# Heartbeat window for the 34 push monitors monitor-bridge feeds. The bridge pushes each of them
# once per loop (INTERVAL=300s), so this is how many consecutive pushes may go missing before Kuma
# flips the tile DOWN — and, because a push monitor's watchdog is the only thing that notices a
# dead bridge, it is also the detection latency for the bridge itself.
#
# 1200 = 4x the loop, tolerating THREE missed pushes; it was 600, tolerating one. The 2026-08-30
# restart is what moved it: hosts went down at 07:36:31 and the last pod reached Ready at 07:45:06,
# an 8m35s outage, but the bridge's last push landed before 07:36 and its first after was ~07:45 —
# a gap over 600s, so nine bridge-fed tiles flipped DOWN and notified for a single event that had
# already ended. At 1200 that gap is absorbed and a genuinely dead bridge still pages, 20 min in
# rather than 10.
#
# NOT `max_retries`, which is the other way to buy the same tolerance and is the reason this knob
# exists instead. Every push monitor holds max_retries=0 deliberately (2026-06-12, see the
# monitor-bridge CLAUDE.md): with retries, Kuma parks a pushed `down` in PENDING and its own
# heartbeat watchdog — which only `up` pushes satisfy — crosses maxretries first, so the Discord
# message reads "No heartbeat in the time window" instead of the check's named offender. Widening
# the window costs none of that: no PENDING state, and an explicit `down` push still flips the tile
# immediately and carries its message.
#
# The four 600s push monitors that are NOT bridge-fed keep their own interval, because their
# feeders run on their own cadences: CrowdSec Home Allowlist, Daniel Pi SD Health, Daniel Pi
# Recovery, Arr Auto-Block. `test_bridge_push_monitors_share_one_interval` is what keeps the split
# honest, deriving bridge membership from the bridge's own env-secret rather than from a list here.
kuma_bridge_push_interval: 1200

# HISTORY, measured 2026-08-21: on AutoKuma v2.0.0 this value reached the 25 http monitors and
# NONE of the 50 push monitors. v2.0.0 declared `resendInterval` on MonitorHttp, MonitorJsonQuery
# and MonitorKeyword only; MonitorPush had no such field, so serde dropped it and every push tile
# notified once per outage — the exact failure the fleet-wide 360 was introduced to fix. Upstream
# moved the field into `with_monitor_common_fields_impl!` in 2.1.0-rc.1 (#152), where every
# variant carries it, and taking that prerelease on 2026-08-21 is what closed the gap.

# No monitor is held at 0. `k3s Longhorn Backup` was, from 2026-08-16 to 2026-08-21, while the
# weekly tier had never completed a backup and every sharded volume reported uncovered — a
# condition no operator could clear, so a 6-hourly resend would only have trained the channel to
# be muted. The hold lifted on 2026-08-21: the weekly tier completed its shard run at 04:30 and
# the tile went green, so the fleet-wide 360 above now covers this monitor like every other.
#
# Kept as a comment because the shape recurs: a tile that is down, cannot recover without an
# event nobody controls, and notifies email as well as Discord is the case a hold is for. Add
# the override back plus an entry in test_kuma_static_monitors.py's RESEND_HELD, and write the
# condition that lifts it.

# ── status page group sync ─────────────────────────────────────────────────────────────────
# Kuma's status page at /status/<slug> — the one Homepage's `uptimekuma` widget reads
# (roles/k8s/homepage/templates/services.yaml.j2). The CronJob below owns its group list; the
# page object itself is hand-created and stays that way. Do NOT declare it as an AutoKuma
# `status_page` entity: AutoKuma at the pinned tag CREATES a status page and never edits one
# (sync.rs's `match (merge, current)` has no StatusPage arm, on the pin and on master), and
# with on_delete=delete a declaration that ever disappeared would delete the live page.
kuma_status_page_slug: containers
# Same build matrix and tag as autokuma_k8s_image above (.github/workflows/docker-build-push.yml
# builds ghcr.io/bigboot/kuma from Dockerfile.cli) — the CLI and the sidecar speak to the same
# Kuma through the same kuma-client, so they move together.
kuma_cli_k8s_image: ghcr.io/bigboot/kuma:2.1.0-rc.2
# Quarter-hourly. Membership only changes on a deploy, and a run that finds nothing to do costs
# one pod and writes nothing at all.
# The render and heartbeat stages are stdlib Python; per-role pin like every other
# python:3.14-alpine consumer here, so Renovate tracks them one by one.
kuma_status_page_sync_image: python:3.14-alpine@sha256:05b2b8b732ecd268fee8727a369f936f022d1321b59befd13c30ede22769dcdc
kuma_status_page_sync_schedule: "*/15 * * * *"
kuma_status_page_sync_deadline_seconds: 300

# Ordered. Each declared monitor lands in the FIRST group one of whose patterns matches its
# AutoKuma id (the filename in static-monitors.yaml.j2, not the display name), and group order
# here is the display order on the page. Patterns are Python `re.search`.
#
# `Other` is a runtime safety net, not a destination: a new declaration that matches nothing
# still reaches the page instead of vanishing. test_status_page_groups.py asserts it stays
# EMPTY for the committed declarations, so adding a monitor without placing it fails CI rather
# than quietly appending it to a junk drawer.
kuma_status_page_groups:
  - name: Services
    match:
      - "-k8s$"
      - "^pihole-k8s-dns$"
      - "^jellyfin-lan-vip$"
      - "^k3s-speedtest$"
      - "^loki$"
      - "^livesync-bridge$"
      - "^email-to-rss$"
      - "^slzb-coordinator$"
      - "^monitor-bridge-(ha|n8n)$"
  - name: Cluster Health
    match:
      - "^k3s-container-"
      - "^k3s-cpu-"
      - "^monitor-bridge-k8s-workloads$"
      - "^crowdsec-"
  - name: Observability
    match:
      - "^monitor-bridge-(prometheus|targets|cluster-prometheus|cluster-targets)$"
      - "^monitor-bridge-(loki|loki-reachable|promtail-dropped|discord)$"
      - "^monitor-bridge-traefik"
      - "^claude-otel-health$"
      - "^remember-logs-health$"
  - name: Backups & Storage
    match:
      - "^longhorn-backup$"
      - "^monitor-bridge-(longhorn-volumes|pvc-fullness)$"
      - "^monitor-bridge-(b2-reachable|b2-storage|r2-usage)$"
      - "^etcd-"
  - name: Hosts & Power
    match:
      - "^daniel-box-disk$"
      - "^monitor-bridge-(disk|mem|cert|scrutiny|ups)$"
      - "^ups-secondary"
      - "^host-temperature$"
      - "^cloudflare-(ddns|ip-drift)"
  - name: Raspberry Pi
    match:
      - "^daniel-pi-"
      - "^monitor-bridge-pi$"
      - "^wg-easy-pi-peers$"
  - name: Media Automation
    match:
      - "^configarr$"
      - "^monitor-bridge-(janitorr|arr-queue|bazarr|prowlarr-indexers)$"
      - "^autofix-fake-remux"
      - "^mkv-attachment-repair$"
      - "^arr-autoblock$"
  - name: Automation & Drift
    match:
      - "^gitops-deploy-"
      - "^renovate-"
      - "-drift-check$"
      - "^github-ruleset-drift$"
      - "^secret-rotation$"
      - "^docs-refresh$"
      - "^manifest-prune-check$"
      - "^release-staleness-check$"
      - "^homelab-eval-sweep$"
      - "^staging-backfill-ratchet$"
      - "^status-page-sync$"
  - name: Other
    match:
      - ".*"

kuma_status_page_sync_cpu_limit: "200m"
kuma_status_page_sync_mem_limit: 128Mi
kuma_status_page_sync_cpu_request: "10m"
kuma_status_page_sync_mem_request: 32Mi
