---
# This instance is the alerting spine.
uptime_kuma_k8s_image: louislam/uptime-kuma:2.5.5@sha256:c74379ac4509ce2d2c2633f509e67003ee2e45b6e995c5e43fc101f45a0e1fbe
# Pinned: the k8s-defaults Renovate manager only tracks
# versioned pins. 2.1.0-rc.2 is a deliberate prerelease: it is the only release where
# `resendInterval` reaches a push monitor — see the caveat under uptime_kuma_k8s_push_resend_down_beats.
#
# This deployment depends on two rc-2 mechanisms, read from the tagged source rather than
# the changelog: `@/path` in an env value reads the file and strips one trailing newline
# (kuma-client/src/config.rs, resolve_file_ref), and a health/metrics HTTP server listens on
# 8090 unless AUTOKUMA__HEALTHCHECK_PORT is emptied (autokuma/src/config.rs). The published
# image builds the DEFAULT feature set, which is Kuma v2 — `uptime-kuma-v1` is opt-in and the
# Dockerfile's ARG FEATURES is empty.
uptime_kuma_k8s_autokuma_image: ghcr.io/bigboot/autokuma:2.1.0-rc.2@sha256:12ed0e5085feeac65db760c1a3e3d4fa3acea0e7dc4c0e601e2ea64d82485a45

# Auto-deploy stance — read by gitops_deploy (see the k8s auto-deploy coverage design).
# Observability: this IS the alerting spine every push/HTTP monitor and the Discord chain depend
# on — a broken deploy cannot page about being broken. It ALSO independently matches the
# migrating-state shape: Recreate + a real ReadWriteOnce PVC (a `k8s_claims` entry) holding
# the heartbeat history — a bad image swap can migrate that volume before
# the gate observes a fault, same class as sonarr/prowlarr. Either reason alone would justify
# the denylist entry.
k8s_autodeploy: false  # noqa var-naming[no-role-prefix]
k8s_autodeploy_reason: "observability — the alerting spine; a broken deploy cannot page about being broken. ALSO Recreate + RWO PVC (migrating-state shape) — two independent reasons. COUPLING NOTE for a future promotion: two PVCs (uptime-kuma-data, autokuma-data) that must revert together; a partial revert desyncs AutoKuma's entity-ID map from Kuma's DB, the same shape as the recorded KD5 migration finding"  # noqa var-naming[no-role-prefix]

# Heartbeat history, 1.5 G at sizing.
uptime_kuma_k8s_claim: uptime-kuma-data
uptime_kuma_k8s_size: 4Gi
uptime_kuma_k8s_storage_class: longhorn

# AutoKuma's OWN entity-id map (1.1 M at sizing). It must move with Kuma's DB, or AutoKuma
# manages nothing and static files recreate duplicates.
uptime_kuma_k8s_autokuma_claim: autokuma-data
uptime_kuma_k8s_autokuma_size: 1Gi

# The claims k8s/manifests renders and applies for this role, ahead of the workload.
k8s_claims:  # noqa var-naming[no-role-prefix]
  - name: "{{ uptime_kuma_k8s_claim }}"
    storage_class: "{{ uptime_kuma_k8s_storage_class }}"
    size: "{{ uptime_kuma_k8s_size }}"
  - name: "{{ uptime_kuma_k8s_autokuma_claim }}"
    storage_class: "{{ uptime_kuma_k8s_storage_class }}"
    size: "{{ uptime_kuma_k8s_autokuma_size }}"

# Mirrors resources('0.50', '512M', '0.05', '64M') for kuma; autokuma is a reconciler.
uptime_kuma_k8s_cpu_limit: "500m"
uptime_kuma_k8s_mem_limit: 512Mi
uptime_kuma_k8s_cpu_request: "50m"
uptime_kuma_k8s_mem_request: 64Mi
# Seconds between AutoKuma reconcile passes — see the env comment in deployment.yaml.j2 for why
# the upstream default of 5 was costing ~34k SQLite writes a day. A deploy's new monitors appear
# within this many seconds; postflight's `count(monitor_status)` check does not race it.
uptime_kuma_k8s_autokuma_sync_interval: 60

# What AutoKuma does with a live entity that has no declaration file. `delete` is the committed
# stance (the deployment template carries the reasoning). Override to `keep` on the command line
# for one deploy when the sidecar image itself is changing, then redeploy at the default.
uptime_kuma_k8s_autokuma_on_delete: delete

uptime_kuma_k8s_autokuma_cpu_limit: "250m"
uptime_kuma_k8s_autokuma_mem_limit: 128Mi
uptime_kuma_k8s_autokuma_cpu_request: "20m"
uptime_kuma_k8s_autokuma_mem_request: 32Mi

# Consecutive DOWN heartbeats before Kuma re-notifies about a monitor that is STILL down. Kuma's
# own default is 0, which means "notify once on the down transition and then never again" — so
# a static push monitor would produce exactly one Discord message per outage, however long it
# ran.
#
# A BEAT COUNT, NOT MINUTES. Kuma compares `downCount` against `resendInterval` on every DOWN
# beat (server/model/monitor.js and the push route in server/routers/api-router.js) and the UI
# labels the field "Resend Notification if Down X times consecutively". A bridge-fed tile
# accumulates one DOWN beat per bridge push (every 300s) plus one per heartbeat window
# (uptime_kuma_k8s_bridge_push_interval, 1200s) — 15 an hour — so a count of 360 would resend once a DAY,
# not every six hours.
#
# 90 is six hours at that cadence. Six hours rather than hourly: these monitors watch things
# that take a human intervention to fix, so a faster resend would mostly train the reader to
# mute the channel — which is the failure mode that loses the NEXT alert. The same count on a
# tile fed by a slower cron resends less often (a 30-minute cron on a 3600s window is 3 beats an
# hour, 30h), and a DEAD bridge leaves only the window's own beats (3 an hour, 30h). Neither is
# expressible in minutes, which is why the unit is beats. The bridge is the fastest feeder in
# the estate, so no tile can beat faster than its 12 pushes an hour plus its own window's
# watchdog beats: at the narrowest window (360s) that is 22 an hour and 90 beats is ~4h, the
# floor `test_kuma_push_resend_beats.py` holds. Applied uniformly and asserted by a test,
# rather than set per-tile, so a new monitor cannot be added without one.
uptime_kuma_k8s_push_resend_down_beats: 90

# Heartbeat window for the 34 push monitors monitor-bridge feeds. The bridge pushes each of them
# once per loop (INTERVAL=300s), so this is how many consecutive pushes may go missing before Kuma
# flips the tile DOWN — and, because a push monitor's watchdog is the only thing that notices a
# dead bridge, it is also the detection latency for the bridge itself.
#
# 1200 = 4x the loop, tolerating THREE missed pushes. A host restart leaves the bridge silent
# for a gap over 600s (measured: an 8m35s outage, last push before the hosts went down, first
# push ~9 minutes later), so a 600s window flipped nine bridge-fed tiles DOWN and notified for
# an event that had already ended. At 1200 that gap is absorbed and a genuinely dead bridge
# still pages, 20 min in rather than 10.
#
# NOT `max_retries`, which is the other way to buy the same tolerance and is the reason this knob
# exists instead. Every push monitor holds max_retries=0 deliberately (see the
# monitor-bridge CLAUDE.md): with retries, Kuma parks a pushed `down` in PENDING and its own
# heartbeat watchdog — which only `up` pushes satisfy — crosses maxretries first, so the Discord
# message reads "No heartbeat in the time window" instead of the check's named offender. Widening
# the window costs none of that: no PENDING state, and an explicit `down` push still flips the tile
# immediately and carries its message.
#
# The four 600s push monitors that are NOT bridge-fed keep their own interval, because their
# feeders run on their own cadences: CrowdSec Home Allowlist, Daniel Pi SD Health, Daniel Pi
# Recovery, Arr Auto-Block. `test_bridge_push_monitors_share_one_interval` is what keeps the split
# honest, deriving bridge membership from the bridge's own env-secret rather than from a list here.
uptime_kuma_k8s_bridge_push_interval: 1200

# AutoKuma v2.0.0 declares `resendInterval` on MonitorHttp, MonitorJsonQuery and MonitorKeyword
# only. MonitorPush has no such field there, so serde drops it and every push tile notifies once
# per outage. 2.1.0-rc.1 moved the field into `with_monitor_common_fields_impl!`, where every
# variant carries it, so the AutoKuma pin must stay at or above that release.

# No monitor is held at 0. A tile that is down, cannot recover without an event nobody
# controls, and notifies email as well as Discord is the case a hold is for: a 6-hourly resend
# would only train the channel to be muted. To hold one, add the override plus an entry in
# test_kuma_static_monitors.py's RESEND_HELD, and write the condition that lifts it.

# ── status page group sync ─────────────────────────────────────────────────────────────────
# Kuma's status page at /status/<slug> — the one Homepage's `uptimekuma` widget reads
# (roles/k8s/homepage/templates/config/services.yaml.j2). The CronJob below owns its group list; the
# page object itself is hand-created and stays that way. Do NOT declare it as an AutoKuma
# `status_page` entity: AutoKuma at the pinned tag CREATES a status page and never edits one
# (sync.rs's `match (merge, current)` has no StatusPage arm, on the pin and on master), and
# with on_delete=delete a declaration that ever disappeared would delete the live page.
uptime_kuma_k8s_status_page_slug: containers
# Same build matrix and tag as uptime_kuma_k8s_autokuma_image above (.github/workflows/docker-build-push.yml
# builds ghcr.io/bigboot/kuma from Dockerfile.cli) — the CLI and the sidecar speak to the same
# Kuma through the same kuma-client, so they move together.
uptime_kuma_k8s_cli_image: ghcr.io/bigboot/kuma:2.1.0-rc.2@sha256:08ac3d0bc4b1e9efc7a2ace3fd69152ac8fa4f6eb418cf7fba37c684d124def6
# Quarter-hourly. Membership only changes on a deploy, and a run that finds nothing to do costs
# one pod and writes nothing at all.
# The render and heartbeat stages are stdlib Python; per-role pin like every other
# python:3.14-alpine consumer here, so Renovate tracks them one by one.
uptime_kuma_k8s_status_page_sync_image: python:3.14-alpine@sha256:f6a589d43c42b9e7f7dc67a12d37132491f362859a5d750607710cc56da3bc72
uptime_kuma_k8s_status_page_sync_schedule: "*/15 * * * *"
# The job WAITS OUT a Kuma restart rather than failing through it. Kuma is unreachable on two
# routine events:
#   - a deploy rollout. `strategy: Recreate` plus autokuma's startupProbe (the pod is NotReady,
#     and so out of the Service endpoints, until autokuma's first full reconcile lands) leaves
#     an endpoint gap of about 103s, from SIGTERM to pod Ready.
#   - the Sunday "Weekly system restart" cron (initial_setup/tasks/crons.yml, 07:30 +
#     `shutdown -r +5`). daniel-server is down 07:35 to about 07:48 and Kuma is Ready again at
#     ~07:51, so the 07:45 run has no chance. That one is a GUARANTEED weekly failure, not a
#     race.
# 800s stays inside the 900s cron period, so `concurrencyPolicy: Forbid` skips at most the one
# following tick. Move this and the schedule together.
uptime_kuma_k8s_status_page_sync_deadline_seconds: 800
# How long the `dump` stage keeps retrying, per pod. `backoffLimit: 1` runs two pods inside the
# ONE job deadline above, so this is budgeted at under half of it, leaving room for pod startup
# and for the render/apply/beat stages that follow.
uptime_kuma_k8s_status_page_sync_dump_budget_seconds: 350
# Measured worst case for one dump attempt: kuma-client gives up on the connect after ~9s
# (42s / 3 attempts on a failed run, minus the 5s sleep), plus that sleep,
# plus slack. The template divides the budget above by this to get the attempt count, so the
# loop exits with its own `kuma read failed` diagnostic rather than being killed mid-attempt
# by the deadline — a deadline kill reports DeadlineExceeded and says nothing about Kuma.
uptime_kuma_k8s_status_page_sync_dump_attempt_seconds: 15
# How long a finished Job — and so its pods and logs — stays visible. Without a TTL a failed
# Job sits in `get pods` as Init:Error until two LATER failures displace it, so a stale
# failure reads as a live fault. The Status Page
# Sync push monitor goes DOWN after 30 min of silence and its description sends the reader to
# the newest Job logs, so the TTL has to outlive that window with room to be read. Two hours
# does, and the render stage's output is in Loki (`{namespace="homelab", container="render"}`)
# past that; a day keeps a red row in Headlamp far longer than anyone needs it.
# `failedJobsHistoryLimit: 2` still caps how many sit inside the window.
uptime_kuma_k8s_status_page_sync_job_ttl_seconds: 7200

# Ordered. Each declared monitor lands in the FIRST group one of whose patterns matches its
# AutoKuma id (the filename in static-monitors.yaml.j2, not the display name), and group order
# here is the display order on the page. Patterns are Python `re.search`.
#
# `Other` is a runtime safety net, not a destination: a new declaration that matches nothing
# still reaches the page instead of vanishing. test_status_page_groups.py asserts it stays
# EMPTY for the committed declarations, so adding a monitor without placing it fails CI rather
# than quietly appending it to a junk drawer.
#
# monitor-bridge's tiles need no pattern here: templates/status-page-sync-configmap.yaml.j2
# pins each one into the group its row's `status_group` names in that role's check_table.py.
uptime_kuma_k8s_status_page_groups:
  - name: Services
    match:
      - "-k8s$"
      - "^pihole-k8s-dns$"
      - "^jellyfin-lan-vip$"
      - "^loki$"
      - "^email-to-rss$"
      - "^slzb-coordinator$"
  - name: Cluster Health
    match:
      - "^crowdsec-"
  - name: Observability
    match:
      # A routing signal, not a per-app tile: it probes ping@internal behind the edge's own
      # self-check path, so it groups with the other edge observability tiles rather than
      # with Services.
      - "^homelab-edge-allclear$"
      - "^claude-otel-health$"
      # One tile per cluster node, both watching the same route from different source addresses.
      # An edge/observability signal rather than a per-app tile, like the all-clear probe above.
      - "^loki-read-route-"
  - name: Backups & Storage
    match:
      - "^longhorn-backup$"
      # The registry PVC's only space reclaim: a storage tile, not an automation one.
      - "^registry-gc$"
      - "^etcd-"
  - name: Hosts & Power
    match:
      - "^daniel-box-disk$"
      - "^ups-secondary"
      - "^cloudflare-(ddns|ip-drift)"
  - name: Raspberry Pi
    match:
      - "^daniel-pi-"
      - "^wg-easy-pi-peers$"
  - name: Media Automation
    match:
      - "^configarr$"
      # A janitorr cron's tile, named for the bridge only for Kuma history; not a bridge row.
      - "^monitor-bridge-janitorr$"
      - "^autofix-fake-remux"
      - "^mkv-attachment-repair$"
      - "^arr-autoblock$"
  - name: Automation & Drift
    match:
      - "^renovate-"
      - "-drift-check$"
      - "^github-ruleset-drift$"
      - "^github-interaction-limit$"
      - "^secret-rotation$"
      - "^docs-refresh$"
      - "^manifest-prune-check$"
      - "^release-staleness-check$"
      - "^render-records$"
      - "^homelab-eval-sweep$"
      - "^status-page-sync$"
      - "^artifacts-sync$"
  - name: Other
    match:
      - ".*"

uptime_kuma_k8s_status_page_sync_cpu_limit: "200m"
uptime_kuma_k8s_status_page_sync_mem_limit: 128Mi
uptime_kuma_k8s_status_page_sync_cpu_request: "10m"
uptime_kuma_k8s_status_page_sync_mem_request: 32Mi

# ── weekly-reboot maintenance window ───────────────────────────────────────────────────────
# Kuma suppresses a monitor's notifications while a maintenance window covering it is open.
# The `Weekly system restart` cron takes every host down on Sunday morning, and each of
# the ~85 monitors would page Discord for it. One blanket window over every monitor is the
# operator's decision, with its cost accepted: a REAL outage starting inside the window is
# silent until the window closes.
#
# AutoKuma cannot declare it. `autokuma/src/entity.rs` at the pinned 2.1.0-rc.2 has
# DockerHost, Notification, Monitor, Tag and StatusPage and no Maintenance variant, so the
# window is reconciled over the API by the CronJob below — the same shape, and the same
# kuma-cli image, as the status-page sync above.
uptime_kuma_k8s_maintenance_window_title: Weekly system restart
uptime_kuma_k8s_maintenance_window_description: >-
  Declared from Ansible by the kuma-maintenance-sync CronJob (roles/k8s/uptime-kuma), derived
  from the weekly_reboot_* schedule in group_vars/all.yml. It covers every monitor that is not
  already DOWN when it opens, so a real outage that starts inside it is silent until it closes.
# How long before the reboot cron fires the window opens. The hosts do not go down until
# `shutdown -r +{{ weekly_reboot_shutdown_delay_minutes }}`, so this is not the time to the
# outage — it is slack for a monitor that flips in the seconds around the cron, and for a
# heartbeat window that was already half-spent when the shutdown landed.
uptime_kuma_k8s_maintenance_window_lead_minutes: 5
# The window's timezone, which must be the reboot cron's clock — `weekly_reboot_timezone`, UTC.
# It cannot be spelled `UTC`. kuma-client parses the identifier against its own 424-entry
# timezones.json (kuma-client/build.rs generates the enum from it) and that list carries neither
# `UTC` nor `Etc/UTC`, so a file saying either fails to load with `invalid value ... a valid
# timezone identifier` and the apply stage writes nothing. Atlantic/Reykjavik is in the list and
# is +00:00 all year with no DST, so it IS the hosts' clock; Europe/London and Europe/Dublin are
# +00:00 in winter only and would drift an hour every summer.
# `test_the_window_is_declared_on_the_reboot_cron_s_clock` holds the offset.
uptime_kuma_k8s_maintenance_window_timezone: Atlantic/Reykjavik
# How long after the reboot itself the window stays open. Measured: daniel-server
# was down 07:35 to 07:48:25 and Kuma was Ready again at ~07:51, and the status-page sync
# records ~16 minutes with no Service endpoint at all. 40 minutes is that recovery plus room
# for a slow boot (07:38 and 07:41 on the two preceding Sundays) and for the bridge-fed tiles,
# whose 1200s window means a tile can flip DOWN up to 20 minutes after the last missed push.
# With the 5-minute lead and the 5-minute shutdown delay this is a 50-minute window: 07:25 to
# 08:15 at the committed schedule. render_maintenance.py does that sum; nothing here repeats it.
uptime_kuma_k8s_maintenance_recovery_allowance_minutes: 40
# How far ahead of the window's opening a sync run leaves out the monitors already DOWN (#3506).
# Kuma pages `MAINTENANCE -> DOWN`, so a monitor carried DOWN through the window pages again
# when it closes. One sync period exactly: only the :20 run five minutes before the 07:25
# opening falls inside it, and the next run puts the monitors back.
# `test_exactly_one_sync_run_a_week_leaves_down_monitors_out` holds it to one run.
uptime_kuma_k8s_maintenance_down_exclusion_minutes: 60
# Hourly, so a deploy that adds a monitor is covered within the hour rather than at the next
# reboot. The MINUTE is not free: an `edit` lands `bean.run(true)` in Kuma
# (server/socket-handlers/maintenance-socket-handler.js), which restarts the window's own cron
# job, so a run inside the open window could lift the suppression it exists to provide.
# `test_maintenance_window.py::test_the_sync_never_runs_inside_the_window_it_declares` holds
# the separation against a move of either schedule.
uptime_kuma_k8s_maintenance_sync_schedule: "20 * * * *"
# Same three-part retry budget as the status-page sync, and for the same reason: Kuma's Service
# has no endpoint for ~100s of a deploy rollout, so a dump that gives up early turns a routine
# rollout into a failed Job. This job does not straddle the Sunday reboot the way that one does
# — both of its neighbouring runs fall outside the window — so the budget only has to cover a
# rollout, and it is carried at the same value rather than tuned down to the minimum that fits.
uptime_kuma_k8s_maintenance_sync_deadline_seconds: 800
uptime_kuma_k8s_maintenance_sync_dump_budget_seconds: 350
uptime_kuma_k8s_maintenance_sync_dump_attempt_seconds: 15
# Long enough that a failed Job's logs outlive the hour to the next run, short enough that a
# red row does not sit in Headlamp for days — the reasoning under
# uptime_kuma_k8s_status_page_sync_job_ttl_seconds, at this job's slower cadence.
uptime_kuma_k8s_maintenance_sync_job_ttl_seconds: 7200

uptime_kuma_k8s_maintenance_sync_cpu_limit: "200m"
uptime_kuma_k8s_maintenance_sync_mem_limit: 128Mi
uptime_kuma_k8s_maintenance_sync_cpu_request: "10m"
uptime_kuma_k8s_maintenance_sync_mem_request: 32Mi
