---
# Flipped 2026-08-10 in the step-4 cutover window (slice-7-phase-d-kuma.md): the Docker
# pair is stopped and removed (compose file kept for rollback beside the tar snapshot),
# both volumes force-seeded, and this instance is the alerting spine now.
# SAME tag as the Docker copy on purpose — the seeded SQLite crosses hosts, not versions.
uptime_kuma_k8s_image: louislam/uptime-kuma:2.5.3
# Pinned (the Docker sidecar ran :latest): the k8s-defaults Renovate manager only tracks
# versioned pins. v2.0.0 is what the KD5 gate verified (docker.enabled, static-file
# notification entities, on_delete semantics); 2.1.0-rc.2 is a deliberate prerelease, taken on
# 2026-08-21 because it is the only release where `resendInterval` reaches a push monitor — see
# the caveat under kuma_push_resend_interval_minutes.
#
# Two rc-2 mechanisms this deployment now depends on, read from the tagged source rather than
# the changelog: `@/path` in an env value reads the file and strips one trailing newline
# (kuma-client/src/config.rs, resolve_file_ref), and a health/metrics HTTP server listens on
# 8090 unless AUTOKUMA__HEALTHCHECK_PORT is emptied (autokuma/src/config.rs). The published
# image builds the DEFAULT feature set, which is Kuma v2 — `uptime-kuma-v1` is opt-in and the
# Dockerfile's ARG FEATURES is empty.
autokuma_k8s_image: ghcr.io/bigboot/autokuma:2.1.0-rc.2

# Auto-deploy stance — read by gitops_deploy (see the k8s auto-deploy coverage design).
# Observability: this IS the alerting spine every push/HTTP monitor and the Discord chain depend
# on — a broken deploy cannot page about being broken. It ALSO independently matches the
# migrating-state shape: Recreate + a real PVC seeded through k8s/seed-volume (hardcoded
# ReadWriteOnce) holding the heartbeat history — a bad image swap can migrate that volume before
# the gate observes a fault, same class as sonarr/prowlarr. Either reason alone would justify
# the denylist entry.
k8s_autodeploy: false  # noqa var-naming[no-role-prefix]
k8s_autodeploy_reason: "observability — the alerting spine; a broken deploy cannot page about being broken. ALSO Recreate + RWO seed-volume PVC (migrating-state shape) — two independent reasons. COUPLING NOTE for a future promotion: two PVCs (uptime-kuma-data, autokuma-data) that must revert together; a partial revert desyncs AutoKuma's entity-ID map from Kuma's DB, the same shape as the recorded KD5 migration finding"  # noqa var-naming[no-role-prefix]

# 1.5 G live at planning (heartbeat history) — `longhorn`, BACKED UP, which the Docker copy
# deliberately never was (kopiaignore). The migration upgrades the DB from "unrecoverable"
# to "nightly Longhorn backup".
uptime_kuma_k8s_claim: uptime-kuma-data
uptime_kuma_k8s_size: 4Gi
uptime_kuma_k8s_storage_class: longhorn
uptime_kuma_k8s_source_path: /home/ubuntu/server/containers/uptime-kuma/data

# AutoKuma's OWN entity-id map (1.1 M live). It must move with Kuma's DB or the new
# instance manages nothing and static files would recreate duplicates (KD5 gate finding).
uptime_kuma_k8s_autokuma_claim: autokuma-data
uptime_kuma_k8s_autokuma_size: 1Gi
uptime_kuma_k8s_autokuma_source_path: /home/ubuntu/server/containers/uptime-kuma/autokuma-data

# Mirrors resources('0.50', '512M', '0.05', '64M') for kuma; autokuma is a reconciler.
uptime_kuma_k8s_cpu_limit: "500m"
uptime_kuma_k8s_mem_limit: 512Mi
uptime_kuma_k8s_cpu_request: "50m"
uptime_kuma_k8s_mem_request: 64Mi
# Seconds between AutoKuma reconcile passes — see the env comment in deployment.yaml.j2 for why
# the upstream default of 5 was costing ~34k SQLite writes a day. A deploy's new monitors appear
# within this many seconds; postflight's `count(monitor_status)` check does not race it.
autokuma_k8s_sync_interval: 60

# What AutoKuma does with a live entity that has no declaration file. `delete` is the committed
# stance (the deployment template carries the reasoning). Override to `keep` on the command line
# for one deploy when the sidecar image itself is changing, then redeploy at the default.
autokuma_k8s_on_delete: delete

autokuma_k8s_cpu_limit: "250m"
autokuma_k8s_mem_limit: 128Mi
autokuma_k8s_cpu_request: "20m"
autokuma_k8s_mem_request: 32Mi

# Minutes before Kuma re-notifies about a monitor that is STILL down. Kuma's own default is 0,
# which means "notify once on the down transition and then never again" — so until 2026-08-16
# every one of the static push monitors produced exactly one Discord message per outage, however
# long it ran. A tile that went down at 04:30 was silent by breakfast and stayed silent all day.
#
# 6h rather than hourly: these monitors watch things that take a human intervention to fix, so a
# faster resend would mostly train the reader to mute the channel — which is the failure mode that
# loses the NEXT alert. Applied uniformly and asserted by a test, rather than set per-tile, so a
# new monitor cannot be added without one (the GitOps tile was the known instance; the gap was
# every push monitor).
kuma_push_resend_interval_minutes: 360

# HISTORY, measured 2026-08-21: on AutoKuma v2.0.0 this value reached the 25 http monitors and
# NONE of the 50 push monitors. v2.0.0 declared `resendInterval` on MonitorHttp, MonitorJsonQuery
# and MonitorKeyword only; MonitorPush had no such field, so serde dropped it and every push tile
# notified once per outage — the exact failure the fleet-wide 360 was introduced to fix. Upstream
# moved the field into `with_monitor_common_fields_impl!` in 2.1.0-rc.1 (#152), where every
# variant carries it, and taking that prerelease on 2026-08-21 is what closed the gap.

# No monitor is held at 0. `k3s Longhorn Backup` was, from 2026-08-16 to 2026-08-21, while the
# weekly tier had never completed a backup and every sharded volume reported uncovered — a
# condition no operator could clear, so a 6-hourly resend would only have trained the channel to
# be muted. The hold lifted on 2026-08-21: the weekly tier completed its shard run at 04:30 and
# the tile went green, so the fleet-wide 360 above now covers this monitor like every other.
#
# Kept as a comment because the shape recurs: a tile that is down, cannot recover without an
# event nobody controls, and notifies email as well as Discord is the case a hold is for. Add
# the override back plus an entry in test_kuma_static_monitors.py's RESEND_HELD, and write the
# condition that lifts it.
