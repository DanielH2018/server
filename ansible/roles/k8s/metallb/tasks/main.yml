---
# No Flux path runs this file: the tag is flux-owned from its first commit. It stays so the role
# has the shape every k8s role has, and the renderer reads the include's vars. The workloads are
# in files/upstream/metallb-native.yaml, which the renderer attaches to the bundle, so the include
# has no workload of its own to roll.
- name: Deploy MetalLB to the cluster
  ansible.builtin.include_role:
    name: k8s/manifests
  vars:
    manifests_rollout: ''
