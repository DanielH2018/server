---
# Renders and applies the Grafana dashboard ConfigMaps. roles/k8s/observability/files/dashboards
# is the one source of truth for the JSON, and templates/grafana-dashboards.yaml.j2 renders one
# ConfigMap per folder from it, with the deploy-annotation queries injected.
#
# Applied SERVER-SIDE, from their own directory, deliberately kept out of the one the manifests
# role applies. Client-side `kubectl apply` records the whole object in the
# kubectl.kubernetes.io/last-applied-configuration annotation, and annotations are capped at
# 262144 bytes — so the first attempt failed with:
#
#   The ConfigMap "grafana-dashboards-infrastructure" is invalid:
#   metadata.annotations: Too long: may not be more than 262144 bytes
#
# The cap is on the ANNOTATION, not the ConfigMap (1 MiB), so splitting the folder further does not
# help: node-exporter-full.json is 413 KB on its own and would breach it alone. Server-side apply
# does not write that annotation at all, which is precisely the problem it was introduced to solve.
# Scoped to these objects rather than switching the shared manifests role wholesale — every other
# manifest in this repo is small and client-side apply is fine for them.
#
# Once observability is flux-owned none of this runs: the template renders into the role's bundle
# and Flux applies it server-side. The staging trees the old tasks wrote under /etc/rancher/k3s/
# are removed by roles/setup/k8s_host_files/tasks/observability.yml.

- name: Create the directory for the dashboard ConfigMap manifests
  tags: [config]
  ansible.builtin.file:
    path: /etc/rancher/k3s/manifests/observability-dashboards
    state: directory
    mode: "0700"
    owner: root
    group: root
  become: true

- name: Remove dashboard ConfigMaps from the client-side apply directory
  tags: [config]
  # They were briefly written here, where the manifests role's client-side `apply -f <dir>/` picks
  # up everything present — which is exactly what hit the annotation cap. Leaving one behind fails
  # every subsequent deploy of this role, so the removal has to be explicit rather than implied by
  # the new path.
  ansible.builtin.file:
    path: "/etc/rancher/k3s/manifests/observability/grafana-dashboards-{{ item | lower }}.yaml"
    state: absent
  loop: "{{ observability_dashboard_folders | list }}"
  become: true

- name: Remove the retired vendored Claude Code dashboard manifest
  tags: [config]
  # The manifests role applies its whole directory, so dropping a file from `manifests_files`
  # only stops it being RE-RENDERED — the previously written copy keeps getting applied on every
  # deploy, forever. The file and the object it created both have to be removed explicitly
  # rather than merely un-listed.
  ansible.builtin.file:
    path: /etc/rancher/k3s/manifests/observability/grafana-dashboard.yaml
    state: absent
  become: true

- name: Remove the retired vendored Claude Code dashboard ConfigMap
  when: not k8s_no_mutate
  tags: [deploy]
  ansible.builtin.command:
    cmd: >-
      k3s kubectl delete configmap grafana-dashboards
      --namespace {{ k8s_observability_namespace }} --ignore-not-found
  become: true
  register: observability_vendored_cm_removed
  changed_when: "'deleted' in observability_vendored_cm_removed.stdout"

- name: Render the dashboard ConfigMap manifests
  tags: [config]
  ansible.builtin.template:
    src: grafana-dashboards.yaml.j2
    dest: /etc/rancher/k3s/manifests/observability-dashboards/grafana-dashboards.yaml
    mode: "0644"
    owner: root
    group: root
  become: true
  register: observability_dashboard_manifests

- name: Apply the dashboard ConfigMaps
  when: not k8s_no_mutate
  tags: [deploy]
  # --force-conflicts because the four folders small enough to succeed on the first (client-side)
  # attempt are already owned by that field manager; server-side apply refuses to take fields from
  # another owner without it. Harmless for the rest — this role is the only writer of these.
  ansible.builtin.command:
    cmd: >-
      k3s kubectl apply --server-side --force-conflicts
      -f /etc/rancher/k3s/manifests/observability-dashboards/
  become: true
  register: observability_dashboards_applied
  # Server-side apply prints `serverside-applied` for every object whether or not it changed
  # anything, so its output cannot be read for a changed verdict the way the client-side apply's
  # created/configured/unchanged can. The render above is the honest signal: these ConfigMaps'
  # contents change exactly when the rendered manifest changes. The apply itself still runs
  # unconditionally, so drift is corrected either way — this only governs what gets REPORTED as
  # changed.
  changed_when: observability_dashboard_manifests is changed

# ── prune keys the apply above cannot remove ──────────────────────────────────────────────────
# A BACKSTOP. Server-side apply prunes a field only when the same manager owns it, so if a key is
# ever orphaned — a hand-applied board, a manager change — the apply above leaves it in place. It
# writes nothing when the live keys and the listed boards agree, which is the normal case.
- name: Read the live dashboard ConfigMap keys
  tags: [deploy]
  ansible.builtin.command:
    cmd: >-
      k3s kubectl get configmap grafana-dashboards-{{ item | lower }}
      --namespace {{ k8s_observability_namespace }}
      --ignore-not-found -o jsonpath={.data}
  loop: "{{ observability_dashboard_folders | list }}"
  become: true
  changed_when: false
  register: observability_dashboard_live_keys

# A merge patch setting each stale key to null, which is how a strategic/merge patch deletes a map
# entry. Skipped entirely when the difference is empty, so a clean cluster issues no write and
# reports unchanged — the normal case, and the reason this is safe to run on every deploy.
- name: Remove dashboard keys with no board behind them
  tags: [deploy]
  vars:
    live_keys: "{{ (observability_dashboard_live_keys.results[idx].stdout | default('{}', true) | from_json).keys() | list }}"
    want_keys: "{{ observability_dashboard_folders[item] }}"
    stale_keys: "{{ live_keys | difference(want_keys) }}"
  ansible.builtin.command:
    cmd: >-
      k3s kubectl patch configmap grafana-dashboards-{{ item | lower }}
      --namespace {{ k8s_observability_namespace }} --type=merge
      -p {{ {'data': dict(stale_keys | zip([None] * (stale_keys | length)))} | to_json | quote }}
  loop: "{{ observability_dashboard_folders | list }}"
  loop_control:
    index_var: idx
    label: "{{ item }}: {{ stale_keys | join(', ') | default('nothing stale', true) }}"
  become: true
  when:
    - not k8s_no_mutate
    - stale_keys | length > 0
  changed_when: true
