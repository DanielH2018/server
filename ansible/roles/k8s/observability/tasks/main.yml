---
# The Claude Code telemetry stack: collector + Loki + Prometheus, Grafana behind Authelia,
# Tempo + the traces pipeline.

- name: Build the ported Grafana dashboard ConfigMaps
  # Guarded at the include rather than task by task: every task in dashboards.yml either writes
  # the node (three staging trees, the annotated copies, the ConfigMap manifests) or reads one
  # of those trees back, and the guard propagates to all of them. Nothing in this role's
  # rendered manifests reads a fact the file sets, so skipping it moves no digest.
  when: not k8s_dry_run | bool
  ansible.builtin.include_tasks: dashboards.yml

- name: Render and apply the Claude Code telemetry manifests
  ansible.builtin.include_role:
    name: k8s/manifests
  vars:
    # Every namespaced document lives in k8s_observability_namespace, so the armed apply and its
    # prune run there. The dashboard ConfigMaps are applied from their own directory, unlabelled,
    # so the prune never selects them.
    manifests_prune_namespace: "{{ k8s_observability_namespace }}"
    # The entry's `port` is Grafana's, whose Service grafana.yaml renders itself.
    manifests_exclude_files: [service.yaml]
    # The shared role waits on ONE Deployment in {{ k8s_namespace }}; this role has several,
    # in a different namespace. Skip its wait and roll our own below.
    manifests_rollout: ''
    # ...but tell the release record which workloads that private restart targets, so
    # `probe.py health` can hold them to a roll. The same list the restart loop below and the
    # stabilisation snapshot iterate. Every entry declares `restart_on: []`, so the record
    # stamps `restart: false` for each, and the amend after the restart raises it for the
    # workloads that restart actually rolled. The shared role neither restarts nor
    # drains these; it does fingerprint each one's pod template across the apply, so the loop
    # below can skip a workload the apply already rolled. `namespace` is load-bearing
    # for that: the fingerprints default to k8s_namespace, and these workloads live in
    # k8s_observability_namespace -- without it both reads fail, every entry reads "not
    # rolled", and an image bump rolls each workload twice.
    manifests_self_rollouts: >-
      {{ observability_stabilise_workloads
         | map('combine', {'namespace': k8s_observability_namespace}) | list }}

# The per-file signal the restart, the snapshot and the Grafana password sync read. The shared
# role's `manifests_secret_render` is one register over every Secret file this role renders,
# so `is changed` on it fires for any of them: an Alertmanager config edit restarted Prometheus
# and Grafana and exec'd the Grafana CLI. Its loop runs in `manifests_secret_files_resolved`
# order, so each result's position names its file. The pairing never reads a result's `item`,
# which the render's `no_log` might censor; it reads only `changed`, which survives `no_log`
# (ansible/tests/k8s/test_observability_secret_restarts.py runs a real `no_log` loop to show
# it).
- name: Check that every Secret render reported whether it changed
  tags: [deploy]
  # A result with no `changed` key, or a result count that does not match the file list,
  # would pair the wrong flag with a file or select nothing at all. Selecting nothing skips
  # every restart and leaves a pod on its previous Secret behind a green deploy, so this
  # stops the run instead.
  ansible.builtin.assert:
    that:
      - manifests_secret_render.results | length == manifests_secret_files_resolved | length
      - manifests_secret_render.results | selectattr('changed', 'undefined') | list | length == 0
    fail_msg: >-
      The secret render registered {{ manifests_secret_render.results | default([]) | length }}
      results for {{ manifests_secret_files_resolved | length }} files, or a result without
      `changed`. The per-file restart cannot tell which Secret changed.
    quiet: true

- name: List the Secret files whose render changed
  tags: [deploy]
  ansible.builtin.set_fact:
    observability_changed_secret_files: >-
      {{ manifests_secret_files_resolved
         | zip(manifests_secret_render.results | map(attribute='changed') | list)
         | selectattr('1') | map(attribute='0') | list }}

- name: Restart the telemetry workloads whose secret changed
  tags: [deploy]
  # `manifests_rollout: ''` above skips the shared role's WAIT, and skipping it also skips its
  # rollout-restart — so without a restart here a config edit applies to the object, reports
  # changed, and never reaches the running pod.
  #
  # Each ConfigMap is hashed into its OWN pod template (`checksum/config`), so a ConfigMap edit
  # moves that one pod template and the apply rolls that one pod. Restarting on
  # `manifests_render is changed` instead would restart all of them on a per-ROLE signal, for
  # an edit none of them read. What the annotation cannot cover is a Secret — hashing one into a
  # world-readable annotation would open a read path over it — so this task runs for exactly
  # the workloads that read a Secret whose file changed: each entry's `restart_secrets` names
  # the rendered files its pod reads, met against `observability_changed_secret_files`. An
  # Alertmanager config edit restarts Alertmanager alone.
  #
  # Skipped for a Deployment this run created — its pods are already on the new config, and
  # `rollout restart` races the initial rollout. Skipped too for a workload the apply itself
  # rolled — its pod template changed, which an image-pin bump does — read from the shared
  # role's fingerprint verdict, `manifests_rolled_by_apply`: a second roll costs a spare pod
  # per Deployment and a full re-pull on the Recreate ones.
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n {{ k8s_observability_namespace }}
      rollout restart {{ item.kind }}/{{ item.name }}
  loop: "{{ observability_stabilise_workloads }}"
  loop_control:
    label: "{{ item.name }}"
  become: true
  changed_when: true
  register: observability_secret_restart
  when:
    # A dry-run render is always `changed` and its apply rolled nothing, so without this every
    # dry run would restart the live workloads.
    - not k8s_no_mutate
    - item.restart_secrets | default([]) | intersect(observability_changed_secret_files) | length > 0
    # `| default('')`: if the apply's stdout cannot be read, fall through to "not created" and
    # restart. Read the two failure directions before changing it — they are not symmetric. A
    # spurious restart races only a first-ever creation, which happens once per workload and
    # recovers; a missed restart leaves the pod serving the previous config with the deploy
    # fully green, which is the bug this task exists to prevent. Without the default, an unreadable register is not a wrong answer but a hard
    # failure: `object of type 'dict' has no attribute 'stdout'`, mid-loop.
    - not (manifests_apply.stdout | default('')) is search('\.apps/' ~ item.name ~ ' created')
    - not manifests_rolled_by_apply.get(item.name, false)

- name: Wait for the telemetry workloads to roll out
  tags: [deploy]
  # Loki first: the collector's log pipeline exports to it, and a collector that starts
  # against a missing Loki logs export failures until it happens to retry successfully.
  # Ordering here makes the first-deploy logs readable rather than alarming.
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n {{ k8s_observability_namespace }} rollout status
      {{ item.kind }}/{{ item.name }} --timeout=300s
  loop:
    - { kind: deploy, name: loki }
    - { kind: deploy, name: prometheus }
    - { kind: deploy, name: kube-state-metrics }
    - { kind: deploy, name: tempo }
    - { kind: daemonset, name: otel-collector }
    - { kind: deploy, name: grafana }
    - { kind: deploy, name: alertmanager }
  loop_control:
    label: "{{ item.name }}"
  become: true
  changed_when: false
  # A dry run applies with `--dry-run=server` and creates nothing, so a workload this role adds
  # is not live to wait on, and the wait fails the run with NotFound (#4729). For a workload
  # that is live, the wait reads a rollout the dry run did not change, so skipping it loses
  # nothing the dry run could check.
  when: not k8s_no_mutate

# The release record stamped `restart: false` for every entry, because each declares
# `restart_on: []`. This raises it for each workload the secret restart above restarted, the
# only roll that stamps the `restartedAt` that `probe.py health` then requires. After the wait,
# as pihole's amend is: ahead of it the record would claim a roll still in flight, and a failed
# wait would leave that claim behind. A skipped amend leaves no expectation rather than a false
# one, which is the safe direction rollout_amend.yml names.
- name: Record the telemetry workloads the secret restart rolled
  tags: [deploy]
  ansible.builtin.include_role:
    name: k8s/manifests
    tasks_from: rollout_amend.yml
  vars:
    manifests_amend_service: observability
    manifests_amend_workload: "{{ observability_restarted.item.name }}"
    manifests_amend_restart: "{{ observability_restarted is changed }}"
  # Only the workloads the restart ran for. A skip result is the workload it left alone.
  loop: "{{ observability_secret_restart.results | default([]) | rejectattr('skipped', 'defined') | list }}"
  # Not `item`: rollout_amend.yml loops over the record with `item` itself, and these vars
  # are templated lazily, so `item.item.name` would resolve against the inner loop's entry.
  loop_control:
    loop_var: observability_restarted
    label: "{{ observability_restarted.item.name }}"

# This role skips the shared role's wait (manifests_rollout: '') and rolls its own above, so it
# must also opt into the stabilisation gate explicitly — the wait it replaces cannot see a
# post-readiness liveness failure.
#
# The play-level window in post_tasks/k8s_stabilise_gate.yml does the observing, so this role
# carries no `pause` of its own. That is STRICTER than a fixed 60s pause: the gate observes
# these workloads for the remainder of the run.
#
# Roles on the normal path get this snapshot from roles/k8s/manifests/tasks/drain.yml, which never sees these
# workloads because nothing queued them into k8s_pending_rollouts. Queueing them there instead is not
# an option: the drain runs at the END of the batch, and "Sync the live Grafana admin password"
# below `kubectl exec`s into deploy/grafana, so it needs the rollout above to have already
# finished. The wait stays; only the pause moves.
- name: Snapshot the telemetry workloads' restart counts for the end-of-play gate
  tags: [deploy]
  # AFTER the wait above, never before. Reading restart counts while the old pod is still
  # terminating captures the OUTGOING pod's counts, and its replacement starts at zero — so the
  # gate's `after <= before` comparison would pass no matter what happened. Same reasoning, and
  # the same trap, as the snapshot task in roles/k8s/manifests/tasks/drain.yml.
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n {{ k8s_observability_namespace }} get pods
      -l app={{ item.name }}
      -o jsonpath={.items[*].status.containerStatuses[*].restartCount}
  loop: "{{ observability_stabilise_workloads }}"
  loop_control:
    label: "{{ item.name }}"
  register: observability_restarts_before
  become: true
  changed_when: false
  when:
    - not k8s_no_mutate
    # The config arm is the render AND the apply's own verdict, the same conjunction the restart
    # task above uses (#3115) and the shared role's queued `changed` flag uses (#3125).
    # `manifests_render is changed` alone compares rendered file bytes, so a YAML-comment or
    # whitespace edit to one manifest snapshotted all six workloads, appended all six to
    # k8s_stabilise_watch, and bought the play gate's `k8s_rollout_stabilise_seconds` pause plus
    # two kubectl reads per workload for a deploy in which no pod moved — each workload's
    # `checksum/config` annotation is unchanged on such an edit too, so nothing rolled. The
    # apply's `changed_when` is keyed on `created`/`configured` in its stdout, which an image-pin
    # bump trips, so this arm still catches the rolls this role has no separate image arm for
    # (#3133). The secret arm is the restart task's own per-entry condition, so a Secret edit
    # soaks only the workloads it restarted. It reads the render and not the apply:
    # verify_secret_keys patches a stale key out of a Secret after an apply that printed
    # `unchanged`, and the key's removal still moved its own file's render, so that restart is
    # soaked too.
    - (manifests_render is changed and manifests_apply is changed)
      or (item.restart_secrets | default([]) | intersect(observability_changed_secret_files) | length > 0)

- name: Fail if a telemetry pod selector matched no pods
  tags: [deploy]
  # This is the one way the gate could go quietly false-green: a selector matching nothing reports zero restarts and passes every comparison.
  # Each carries the repo-wide `app: <workload-name>` label; assert it rather than assume it.
  ansible.builtin.assert:
    that: item.stdout | trim | length > 0
    fail_msg: >-
      No pods matched `-l app={{ item.item.name }}` in namespace
      {{ k8s_observability_namespace }}, so the stabilisation gate has nothing to watch.
      Either the workload sets a different pod label than `app: {{ item.item.name }}`,
      or it has no pods at all.
    quiet: true
  # The producer above is gated on the render AND the apply both changing, or the secret render
  # changing. A SKIPPED task still sets the variable it registers to — to a result carrying
  # `skipped: true` and NO `stdout` key — so on any deploy that changes something other than
  # the manifests (a dashboards-only change is the common one) every entry here is a skip
  # result and `item.stdout` raises "object of type 'dict' has no attribute 'stdout'". Filter
  # to what the producer actually ran rather than mirroring its `when:`, so a partial skip
  # still asserts over the entries that did produce output.
  loop: "{{ observability_restarts_before.results | default([]) | rejectattr('skipped', 'defined') | list }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: not k8s_no_mutate

- name: Hand the telemetry workloads to the end-of-play stabilisation gate
  tags: [deploy]
  # noqa var-naming[no-role-prefix] — k8s_stabilise_watch is play-scoped by design, an
  # accumulator post_tasks/k8s_stabilise_gate.yml drains. Same reasoning as k8s_pending_rollouts
  # in roles/k8s/manifests.
  #
  # `namespace` is carried per entry because the gate reads it per item — these are the only
  # workloads in the run that do not live in k8s_namespace.
  ansible.builtin.set_fact:
    k8s_stabilise_watch: >-
      {{ (k8s_stabilise_watch | default([]))
         + [{
              'name': item.item.name,
              'namespace': k8s_observability_namespace,
              'kind': item.item.kind,
              'restarts_before': item.stdout,
            }] }}
  # Same skipped-register filter as the assert above, and for the same reason: `item.stdout`
  # does not exist on a skip result. Without it this task fails identically once the assert
  # stops failing first.
  loop: "{{ observability_restarts_before.results | default([]) | rejectattr('skipped', 'defined') | list }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: not k8s_no_mutate

# GF_SECURITY_ADMIN_PASSWORD (the grafana-admin Secret) is only consulted when Grafana
# initialises its database, so on an existing install a rotated grafana_admin_password
# never reaches the live admin user — SOPS and the actual login diverge silently.
# `grafana cli admin reset-admin-password` writes straight to the DB and needs no knowledge of the CURRENT password. Gated on
# `grafana-secret.yaml` changing, the one Secret file that renders `grafana_admin_password`. An
# edit to any other Secret file, Alertmanager's config included, never execs the CLI, whose
# `Migrate` pass contends with the live server (below).
#
# A POLL, not convertible to `kubectl wait`. The condition is the exit status of a process
# exec'd inside the container, which no API object carries.
#
# The retry does not wait for the server's schema migrations. `sqlstore.ProvideService` runs
# `Migrate` before it returns, and `HTTPServer` takes the store as a dependency
# (pkg/services/sqlstore/sqlstore.go, pkg/api/http_server.go), so `/api/health` — the readiness
# probe the `rollout status` loop above already waited on — answers only after the server's
# migrations are done. What the retry covers is the CLI: `reset-admin-password` runs under
# `runRunnerCommand` → `initializeRunner` → `server.InitializeForCLI`
# (pkg/cmd/grafana-cli/commands/commands.go), which constructs a SECOND store and runs its own
# `Migrate` pass on the same SQLite file the live server holds open, so the two contend for
# the file and the CLI can lose to a write the server has in flight.
- name: Sync the live Grafana admin password with SOPS # noqa no-handler
  tags: [deploy]
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n {{ k8s_observability_namespace }} exec deploy/grafana --
      grafana cli admin reset-admin-password {{ grafana_admin_password }}
  become: true
  # NOT under --check or a dry run, unlike the read-only probe below: this resets a live
  # credential. It is also latently broken there — check mode skips the command, so `rc` is
  # undefined, the `until` below can never match, and the run would die after 5 retries. That
  # only stays hidden while the secret happens not to differ, which is the condition guarding it.
  when: "'grafana-secret.yaml' in observability_changed_secret_files and not k8s_no_mutate"
  register: observability_admin_password_sync
  until: (observability_admin_password_sync.rc | default(1)) == 0
  retries: 5
  delay: 10
  changed_when: (observability_admin_password_sync.rc | default(1)) == 0
  no_log: true

- name: Read back the OTLP listener's bind address
  tags: [deploy]
  # The one property that cannot be inferred from a green rollout. hostPort/hostIP is what
  # makes the collector reachable from the HOST (Claude Code is not a container), and a
  # missing hostIP would silently bind 0.0.0.0 — publishing a receiver that carries prompts
  # and responses verbatim to the whole LAN. Assert it rather than trust the manifest.
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n {{ k8s_observability_namespace }} get daemonset otel-collector
      -o jsonpath={.spec.template.spec.containers[0].ports[0].hostIP}
  register: observability_bind
  become: true
  changed_when: false
  # Runs under --check too: this only reads. Skipped, it leaves stdout empty and the assert
  # below fails the run — losing exactly the check that keeps a prompt-carrying receiver off
  # the LAN, on the one mode where you most want it evaluated before touching anything.
  check_mode: false

- name: Fail if the OTLP receiver is not pinned to loopback
  tags: [deploy]
  ansible.builtin.assert:
    that: observability_bind.stdout == observability_otlp_host_ip
    fail_msg: >-
      OTLP receiver is bound to '{{ observability_bind.stdout | default('(unset)') }}',
      expected '{{ observability_otlp_host_ip }}'. With content logging enabled this
      receiver must not be reachable off the node.
    quiet: true

- name: Deploy the telemetry-stack heartbeat
  tags: [cron]
  # Runs as {{ sys_user }}, not root: all it does is open a TCP connection to the node's own
  # loopback and push the outcome, so it needs no privilege at all. That is the one probe no
  # in-cluster pod can run — the template's own DECIDED marker has why.
  #
  # DECIDED: the heartbeat keeps the name `claude-otel-health` though the role was renamed to
  # `observability` on 2026-10-01 (#2911). That string is a join key in four places outside
  # this role: the AutoKuma monitor id `claude-otel-health` in
  # roles/k8s/uptime-kuma/templates/static-monitors.yaml.j2, the group rule
  # `^claude-otel-health$` in that role's defaults, the syslog tag query B of the Alert History
  # board reads, and `probe.py alerts`' parser. Renaming it costs the Kuma monitor's history —
  # AutoKuma runs ON_DELETE=delete, so a changed id is a delete plus a create — and orphans
  # every `claude-otel-health` line already in Loki's 31-day window. A changed cron `name:` or
  # `cron_file:` would also leave the old crontab entry behind on daniel-box. The role name is
  # what the issue was about; this tag is not it.
  ansible.builtin.template:
    src: telemetry-health.sh.j2
    dest: /usr/local/bin/claude-otel-health.sh
    # DECIDED: 0700 owned by sys_user, not 0755 — embeds a live Kuma push token. Owner is
    # sys_user because the cron below runs as sys_user; root:root 0700 would lock out its own
    # caller. See the same marker in roles/k8s/janitorr/tasks/main.yml.
    mode: "0700"
    owner: "{{ sys_user }}"
    group: "{{ sys_user }}"
  become: true
  no_log: true  # renders the Kuma push token
  when: not k8s_dry_run | bool

- name: Schedule the telemetry-stack heartbeat
  tags: [cron]
  ansible.builtin.cron:
    name: "Claude Code telemetry health"
    minute: "{{ observability_health_cron_minute }}"
    user: "{{ sys_user }}"
    job: "/usr/local/bin/claude-otel-health.sh"
    cron_file: claude-otel-health
  become: true
  when: not k8s_dry_run | bool

# The 2026-10-01 rename from claude-otel (#2911) left the old service's release and render
# records beside observability.json; nothing declares claude-otel any more, so they are dead
# copies (#3088). A render record with no release record reads as `unknown: no release record`
# in every narrow-shadow line and in `probe.py releases` (#5162).
- name: Remove the release and render records the claude-otel name left behind
  tags: [config]
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /var/lib/homelab/k8s-releases.d/claude-otel.json
    - /var/lib/homelab/k8s-releases.d/claude-otel.previous.json
    - /var/lib/homelab/k8s-renders.d/claude-otel.json
  become: true
  when: not k8s_dry_run | bool
