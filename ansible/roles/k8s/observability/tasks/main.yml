---
# Flux owns observability (D5, Wave D), so no Ansible run reaches this file. It stays for the
# handback (docs/flux-deploy-plane.md), and the renderer reads the include's vars. The tasks it
# held before the flip moved:
# - the dashboard ConfigMaps: `grafana-dashboards.yaml` renders into the bundle, and Flux
#   applies it server-side, which the 262144-byte annotation cap needs;
# - the per-Secret restarts and their end-of-play soak: the renderer's restart annotation
#   rolls a workload whose Secret changed, and the revision's soak watches the rollout (D5.1e);
# - the OTLP bind readback: the `observability-verify` Job (templates/verify/).
- name: Render and apply the Claude Code telemetry manifests
  ansible.builtin.include_role:
    name: k8s/manifests
  vars:
    # Every namespaced document lives in k8s_observability_namespace, so the armed apply and its
    # prune run there.
    manifests_prune_namespace: "{{ k8s_observability_namespace }}"
    # The entry's `port` is Grafana's, whose Service grafana.yaml renders itself.
    manifests_exclude_files: [service.yaml]
    # The shared role waits on ONE Deployment in {{ k8s_namespace }}; this role has several,
    # in a different namespace.
    manifests_rollout: ''
    # The workloads the renderer's restart annotation targets. `namespace` is load-bearing:
    # the fingerprints default to k8s_namespace, and these workloads live in
    # k8s_observability_namespace.
    manifests_self_rollouts: >-
      {{ observability_stabilise_workloads
         | map('combine', {'namespace': k8s_observability_namespace}) | list }}
