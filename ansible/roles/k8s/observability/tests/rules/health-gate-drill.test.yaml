# promtool unit tests for files/rules/health-gate-drill.yaml. Run with
# `scripts/validate/alert_tools.sh promtool test rules <this file>`; the validate-alert-rules
# hook runs it on every commit that touches the rules.
#
# The drill needs no input series, so its one case is also the zero-series case every rule test
# file carries. It must fire with the three labels the health gate and the drill route read.
rule_files:
  - ../../files/rules/health-gate-drill.yaml
evaluation_interval: 1m
tests:
  - interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 1m
        alertname: HealthGateDrill
        exp_alerts:
          - exp_labels:
              severity: critical
              drill: "true"
              service: littlelink
            exp_annotations:
              summary: The health-gate drill holds littlelink's health gate red on purpose.
              description: >-
                M6's B-1d ships this rule so that probe.py health littlelink fails and names it.
                Alertmanager sends it to the blackhole receiver. B-1e removes it, and until then
                every health gate of littlelink fails.
