# promtool unit tests for files/rules/registry.yaml. Run with
# `scripts/validate/alert_tools.sh promtool test rules <this file>`; the validate-alert-rules
# hook runs it on every commit that touches the rules.
#
# The kube-state-metrics series carry the labels v2.20 gives them (job, instance), so a matcher
# that a live series would not satisfy fails here as it would live.
rule_files:
  - ../../files/rules/registry.yaml
evaluation_interval: 1m
tests:
  # The zero-series case: no input at all, so the kube-state-metrics job is missing.
  - interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 121m
        alertname: GhcrMirrorScaledToZero
        exp_alerts:
          - exp_labels:
              job: kube-state-metrics
              service: registry
              severity: warning
            exp_annotations: &annotations
              summary: The ghcr-mirror Deployment has wanted zero replicas for 2 hours.
              description: "homelab/ghcr-mirror has been scaled to zero for 2 hours, or Prometheus has no kube-state-metrics scrape job. registry-gc.sh holds it at zero for at most about 25 minutes, so a run probably died before its restore. Until the mirror serves again, containerd pulls ghcr.io images straight from GHCR and a WAN outage leaves no source to pull them from. Check `journalctl -t registry-gc` on daniel-box and that no registry-gc.sh is running, then `kubectl -n homelab scale deploy/ghcr-mirror --replicas=1`."

  # A GC run holds the mirror at zero for 25 minutes and restores it: nothing fires.
  - interval: 1m
    input_series:
      - series: 'up{job="kube-state-metrics", instance="kube-state-metrics:8080"}'
        values: '1x180'
      - series: 'kube_deployment_spec_replicas{job="kube-state-metrics", instance="kube-state-metrics:8080", namespace="homelab", deployment="ghcr-mirror"}'
        values: '0x25 1x155'
    alert_rule_test:
      - alertname: GhcrMirrorScaledToZero
        eval_time: 180m
        exp_alerts: []

  # A run killed before its restore leaves the mirror at zero. It fires after the 2h hold.
  - interval: 1m
    input_series:
      - series: 'up{job="kube-state-metrics", instance="kube-state-metrics:8080"}'
        values: '1x180'
      - series: 'kube_deployment_spec_replicas{job="kube-state-metrics", instance="kube-state-metrics:8080", namespace="homelab", deployment="ghcr-mirror"}'
        values: '0x180'
    alert_rule_test:
      - alertname: GhcrMirrorScaledToZero
        eval_time: 119m
        exp_alerts: []
      - alertname: GhcrMirrorScaledToZero
        eval_time: 121m
        exp_alerts:
          - exp_labels:
              job: kube-state-metrics
              instance: kube-state-metrics:8080
              namespace: homelab
              deployment: ghcr-mirror
              service: registry
              severity: warning
            exp_annotations: *annotations

  # daniel-server's mirror pull fails from minute 0 while daniel-box's passes. The failure fires
  # after its 45m hold, for daniel-server alone, and both check files stay fresh.
  - interval: 1m
    input_series:
      - series: 'homelab_check_success{check="ghcr-mirror-pull", instance="daniel-server", job="node", origin="daniel-server"}'
        values: '0x60'
      - series: 'homelab_check_success{check="ghcr-mirror-pull", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '1x60'
      - series: 'homelab_check_last_run_timestamp_seconds{check="ghcr-mirror-pull", instance="daniel-server", job="node", origin="daniel-server"}'
        values: '0+60x60'
      - series: 'homelab_check_last_run_timestamp_seconds{check="ghcr-mirror-pull", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '0+60x60'
      - series: 'up{instance="daniel-server", job="node", origin="daniel-server"}'
        values: '1x60'
      - series: 'up{instance="daniel-box", job="node", origin="daniel-box"}'
        values: '1x60'
    alert_rule_test:
      - eval_time: 44m
        alertname: GhcrMirrorPullFailed
        exp_alerts: []
      - eval_time: 46m
        alertname: GhcrMirrorPullFailed
        exp_alerts:
          - exp_labels:
              check: ghcr-mirror-pull
              instance: daniel-server
              job: node
              origin: daniel-server
              service: registry
              severity: warning
            exp_annotations:
              summary: daniel-server cannot pull nut's manifest through its ghcr.io mirror endpoint.
              description: "The ghcr-mirror-pull check on daniel-server has failed for 45 minutes. A GET of nut's manifest through the node's ghcr.io mirror endpoint was refused, timed out or answered an error, or the nut-ghcr-mirror-probe ConfigMap names no tag. containerd still pulls ghcr.io images straight from GHCR, so nothing breaks until a WAN outage, when nut cannot cold-start. Read the `ghcr-mirror-pull` container log of the node-exporter pod on daniel-server, then the ghcr-mirror pod, its NetworkPolicy and the node's registries.yaml."
      - eval_time: 46m
        alertname: GhcrMirrorPullNotReporting
        exp_alerts: []

  # The longest GC hold: the mirror is at zero for 27 minutes, and the down verdict stands until
  # the next write 10 minutes later. 37 minutes of failure stay under the hold, so nothing fires.
  - interval: 1m
    input_series:
      - series: 'homelab_check_success{check="ghcr-mirror-pull", instance="daniel-server", job="node", origin="daniel-server"}'
        values: '0x37 1x40'
    alert_rule_test:
      - eval_time: 37m
        alertname: GhcrMirrorPullFailed
        exp_alerts: []
      - eval_time: 77m
        alertname: GhcrMirrorPullFailed
        exp_alerts: []

  # daniel-box's check file stopped being refreshed at 0 while its exporter stays up, and
  # daniel-server's stays fresh. The stale-file arm fires once the timestamp is more than 3000s
  # old, between minutes 50 and 51.
  - interval: 1m
    input_series:
      - series: 'homelab_check_last_run_timestamp_seconds{check="ghcr-mirror-pull", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '0x60'
      - series: 'up{instance="daniel-box", job="node", origin="daniel-box"}'
        values: '1x60'
      - series: 'homelab_check_last_run_timestamp_seconds{check="ghcr-mirror-pull", instance="daniel-server", job="node", origin="daniel-server"}'
        values: '0+60x60'
      - series: 'up{instance="daniel-server", job="node", origin="daniel-server"}'
        values: '1x60'
    alert_rule_test:
      - eval_time: 50m
        alertname: GhcrMirrorPullNotReporting
        exp_alerts: []
      - eval_time: 51m
        alertname: GhcrMirrorPullNotReporting
        exp_alerts:
          - exp_labels:
              check: ghcr-mirror-pull
              instance: daniel-box
              job: node
              origin: daniel-box
              service: registry
              severity: warning
            exp_annotations:
              summary: daniel-box's ghcr.io mirror pull check has stopped reporting.
              description: "No ghcr-mirror-pull verdict newer than 50 minutes reached Prometheus from daniel-box's textfile collector, so nothing is watching whether the node's ghcr.io mirror endpoint serves pulls. Read the log of the node-exporter pod's `ghcr-mirror-pull` container on daniel-box."

  # No check file on daniel-server at all: the absent arm fires once 3000s pass with no series.
  - interval: 1m
    input_series:
      - series: 'homelab_check_last_run_timestamp_seconds{check="ghcr-mirror-pull", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '0+60x60'
      - series: 'up{instance="daniel-server", job="node", origin="daniel-server"}'
        values: '1x60'
    alert_rule_test:
      - eval_time: 51m
        alertname: GhcrMirrorPullNotReporting
        exp_alerts:
          - exp_labels:
              check: ghcr-mirror-pull
              origin: daniel-server
              service: registry
              severity: warning
            exp_annotations:
              summary: daniel-server's ghcr.io mirror pull check has stopped reporting.
              description: "No ghcr-mirror-pull verdict newer than 50 minutes reached Prometheus from daniel-server's textfile collector, so nothing is watching whether the node's ghcr.io mirror endpoint serves pulls. Read the log of the node-exporter pod's `ghcr-mirror-pull` container on daniel-server."

  # daniel-box's docker.io mirror pull fails from minute 0 while daniel-server's passes. It fires
  # after its 45m hold for daniel-box alone, and the ghcr.io check's alert stays silent.
  - interval: 1m
    input_series:
      - series: 'homelab_check_success{check="dockerhub-mirror-pull", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '0x60'
      - series: 'homelab_check_success{check="dockerhub-mirror-pull", instance="daniel-server", job="node", origin="daniel-server"}'
        values: '1x60'
      - series: 'homelab_check_last_run_timestamp_seconds{check="dockerhub-mirror-pull", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '0+60x60'
      - series: 'homelab_check_last_run_timestamp_seconds{check="dockerhub-mirror-pull", instance="daniel-server", job="node", origin="daniel-server"}'
        values: '0+60x60'
      - series: 'up{instance="daniel-server", job="node", origin="daniel-server"}'
        values: '1x60'
      - series: 'up{instance="daniel-box", job="node", origin="daniel-box"}'
        values: '1x60'
    alert_rule_test:
      - eval_time: 44m
        alertname: DockerhubMirrorPullFailed
        exp_alerts: []
      - eval_time: 46m
        alertname: DockerhubMirrorPullFailed
        exp_alerts:
          - exp_labels:
              check: dockerhub-mirror-pull
              instance: daniel-box
              job: node
              origin: daniel-box
              service: registry
              severity: warning
            exp_annotations:
              summary: daniel-box cannot pull a manifest through its docker.io mirror endpoint.
              description: "The dockerhub-mirror-pull check on daniel-box has failed for 45 minutes. A GET of node-exporter's own manifest, by digest, through the node's docker.io mirror endpoint was refused, timed out or answered an error. containerd still pulls docker.io images straight from Docker Hub, so nothing breaks until a WAN outage, when a pod whose image is not on its node cannot start. Read the `dockerhub-mirror-pull` container log of the node-exporter pod on daniel-box, then the dockerhub-mirror pod, its NetworkPolicy and the node's registries.yaml."
      - eval_time: 46m
        alertname: GhcrMirrorPullFailed
        exp_alerts: []
      - eval_time: 46m
        alertname: DockerhubMirrorPullNotReporting
        exp_alerts: []

  # daniel-server's docker.io check file stopped being refreshed at 0 while its exporter stays
  # up. The stale-file arm fires between minutes 50 and 51.
  - interval: 1m
    input_series:
      - series: 'homelab_check_last_run_timestamp_seconds{check="dockerhub-mirror-pull", instance="daniel-server", job="node", origin="daniel-server"}'
        values: '0x60'
      - series: 'up{instance="daniel-server", job="node", origin="daniel-server"}'
        values: '1x60'
      - series: 'homelab_check_last_run_timestamp_seconds{check="dockerhub-mirror-pull", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '0+60x60'
      - series: 'up{instance="daniel-box", job="node", origin="daniel-box"}'
        values: '1x60'
    alert_rule_test:
      - eval_time: 50m
        alertname: DockerhubMirrorPullNotReporting
        exp_alerts: []
      - eval_time: 51m
        alertname: DockerhubMirrorPullNotReporting
        exp_alerts:
          - exp_labels:
              check: dockerhub-mirror-pull
              instance: daniel-server
              job: node
              origin: daniel-server
              service: registry
              severity: warning
            exp_annotations:
              summary: daniel-server's docker.io mirror pull check has stopped reporting.
              description: "No dockerhub-mirror-pull verdict newer than 50 minutes reached Prometheus from daniel-server's textfile collector, so nothing is watching whether the node's docker.io mirror endpoint serves pulls. Read the log of the node-exporter pod's `dockerhub-mirror-pull` container on daniel-server."

  # No docker.io check file on daniel-box at all: the absent arm fires once 3000s pass.
  - interval: 1m
    input_series:
      - series: 'homelab_check_last_run_timestamp_seconds{check="dockerhub-mirror-pull", instance="daniel-server", job="node", origin="daniel-server"}'
        values: '0+60x60'
      - series: 'up{instance="daniel-box", job="node", origin="daniel-box"}'
        values: '1x60'
    alert_rule_test:
      - eval_time: 51m
        alertname: DockerhubMirrorPullNotReporting
        exp_alerts:
          - exp_labels:
              check: dockerhub-mirror-pull
              origin: daniel-box
              service: registry
              severity: warning
            exp_annotations:
              summary: daniel-box's docker.io mirror pull check has stopped reporting.
              description: "No dockerhub-mirror-pull verdict newer than 50 minutes reached Prometheus from daniel-box's textfile collector, so nothing is watching whether the node's docker.io mirror endpoint serves pulls. Read the log of the node-exporter pod's `dockerhub-mirror-pull` container on daniel-box."

  # A run killed during the dockerhub-mirror's phase leaves it at zero; the ghcr-mirror serves.
  # Only the dockerhub page fires, after the 2h hold.
  - interval: 1m
    input_series:
      - series: 'up{job="kube-state-metrics", instance="kube-state-metrics:8080"}'
        values: '1x180'
      - series: 'kube_deployment_spec_replicas{job="kube-state-metrics", instance="kube-state-metrics:8080", namespace="homelab", deployment="dockerhub-mirror"}'
        values: '0x180'
      - series: 'kube_deployment_spec_replicas{job="kube-state-metrics", instance="kube-state-metrics:8080", namespace="homelab", deployment="ghcr-mirror"}'
        values: '1x180'
    alert_rule_test:
      - alertname: DockerhubMirrorScaledToZero
        eval_time: 119m
        exp_alerts: []
      - alertname: GhcrMirrorScaledToZero
        eval_time: 121m
        exp_alerts: []
      - alertname: DockerhubMirrorScaledToZero
        eval_time: 121m
        exp_alerts:
          - exp_labels:
              job: kube-state-metrics
              instance: kube-state-metrics:8080
              namespace: homelab
              deployment: dockerhub-mirror
              service: registry
              severity: warning
            exp_annotations:
              summary: The dockerhub-mirror Deployment has wanted zero replicas for 2 hours.
              description: "homelab/dockerhub-mirror has been scaled to zero for 2 hours, or Prometheus has no kube-state-metrics scrape job. registry-gc.sh holds it at zero for at most about 25 minutes, so a run probably died before its restore. Until the mirror serves again, containerd pulls docker.io images straight from Docker Hub and a WAN outage leaves no source to pull them from. Check `journalctl -t registry-gc` on daniel-box and that no registry-gc.sh is running, then `kubectl -n homelab scale deploy/dockerhub-mirror --replicas=1`."

  # A GC phase holds the dockerhub-mirror at zero for 25 minutes and restores it: nothing fires.
  - interval: 1m
    input_series:
      - series: 'up{job="kube-state-metrics", instance="kube-state-metrics:8080"}'
        values: '1x180'
      - series: 'kube_deployment_spec_replicas{job="kube-state-metrics", instance="kube-state-metrics:8080", namespace="homelab", deployment="dockerhub-mirror"}'
        values: '1x30 0x25 1x125'
    alert_rule_test:
      - alertname: DockerhubMirrorScaledToZero
        eval_time: 180m
        exp_alerts: []

  # A GC run ends down: RegistryGcFailed fires at once, while the up verdict before it was quiet.
  - interval: 1m
    input_series:
      - series: 'homelab_check_success{check="registry-gc", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '1x5 0x5'
    alert_rule_test:
      - eval_time: 5m
        alertname: RegistryGcFailed
        exp_alerts: []
      - eval_time: 6m
        alertname: RegistryGcFailed
        exp_alerts:
          - exp_labels:
              check: registry-gc
              instance: daniel-box
              job: node
              origin: daniel-box
              service: registry
              severity: warning
              shadow: "true"
            exp_annotations:
              summary: The weekly registry garbage collection did not complete.
              description: "registry-gc.sh on daniel-box ended with status=down: a keep set was skipped, a mirror pod did not stop, a GC Job timed out, a mirror did not come back, or another run held the lock. Run `journalctl -t registry-gc` on daniel-box, then read the registry-gc-ghcr-mirror and registry-gc-dockerhub-mirror Job logs and the two mirror Deployments."

  # The GC wrote at 0 and never again while the exporter stays up. The stale-file arm fires once
  # the timestamp is more than 612000s (170h) old, so it is quiet at 170h and fires at 171h.
  - interval: 1h
    input_series:
      - series: 'homelab_check_last_run_timestamp_seconds{check="registry-gc", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '0x180'
      - series: 'up{instance="daniel-box", job="node", origin="daniel-box"}'
        values: '1x180'
    alert_rule_test:
      - eval_time: 170h
        alertname: RegistryGcNotReporting
        exp_alerts: []
      - eval_time: 171h
        alertname: RegistryGcNotReporting
        exp_alerts:
          - exp_labels:
              check: registry-gc
              instance: daniel-box
              job: node
              origin: daniel-box
              service: registry
              severity: warning
              shadow: "true"
            exp_annotations: &registry_gc_not_reporting
              summary: The weekly registry garbage collection has stopped reporting.
              description: "No registry-gc verdict newer than 612000s reached Prometheus from daniel-box's textfile collector, so nothing confirms the mirrors' weekly GC still runs. Read /etc/cron.d/registry-gc and `journalctl -t registry-gc` on daniel-box, then /var/lib/node-exporter-textfile/registry-gc.prom on the host."

  # The same stale file behind a dead node exporter is ScrapeTargetDown's page, not this one.
  - interval: 1h
    input_series:
      - series: 'homelab_check_last_run_timestamp_seconds{check="registry-gc", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '0x180'
      - series: 'up{instance="daniel-box", job="node", origin="daniel-box"}'
        values: '0x180'
    alert_rule_test:
      - eval_time: 171h
        alertname: RegistryGcNotReporting
        exp_alerts: []

  # No registry-gc file at all: the absent arm fires with no series in the 612000s window.
  - interval: 1h
    input_series:
      - series: 'up{instance="daniel-box", job="node", origin="daniel-box"}'
        values: '1x180'
    alert_rule_test:
      - eval_time: 171h
        alertname: RegistryGcNotReporting
        exp_alerts:
          - exp_labels:
              check: registry-gc
              origin: daniel-box
              service: registry
              severity: warning
              shadow: "true"
            exp_annotations: *registry_gc_not_reporting
