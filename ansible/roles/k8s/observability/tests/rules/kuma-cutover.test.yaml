# promtool unit tests for files/rules/kuma-cutover.yaml, the temporary CheckWithoutPager guard.
# Run with `scripts/validate/alert_tools.sh promtool test rules <this file>`. The rule has no
# `for:`, so its two hours are the term's [2h] window: a tile that stops reporting fires once
# its last sample is more than two hours old.
rule_files:
  - ../../files/rules/kuma-cutover.yaml
evaluation_interval: 1m
tests:
  # Zero-series case: no series at all, so every term fires and the page names each tile
  # through the label absent_over_time carries.
  - interval: 1m
    input_series: []
    alert_rule_test:
      - alertname: CheckWithoutPager
        eval_time: 5m
        exp_alerts:
          - exp_labels: {monitor_name: Docs Refresh, service: uptime-kuma, severity: critical}
            exp_annotations:
              summary: Kuma's Docs Refresh tile is gone and no alert rule pages in its place.
              description: "M6's cutover removed the Docs Refresh tile more than two hours ago, and its replacement rule still carries shadow=\"true\". Drop `shadow` from the rule, or revert the Kuma-side PR to restore the tile."
