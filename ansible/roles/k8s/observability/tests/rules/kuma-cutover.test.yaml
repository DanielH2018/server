  # Every tile present: no term fires.
  - interval: 1m
    input_series:
      - series: 'up{job="uptime-kuma", instance="uptime-kuma:3001"}'
        values: '1x140'
      - series: 'monitor_status{monitor_name="k3s Container Restarts", monitor_type="push"}'
        values: '1x140'
      - series: 'monitor_status{monitor_name="k3s Container OOM", monitor_type="push"}'
