          - exp_labels: {monitor_name: Memory, service: uptime-kuma, severity: critical}
            exp_annotations:
              summary: Kuma's Memory tile is gone and no alert rule pages in its place.
              description: "M6's cutover removed the Memory tile more than two hours ago, and its replacement rule still carries shadow=\"true\". Drop `shadow` from the rule, or revert the Kuma-side PR to restore the tile."
          - exp_labels: {monitor_name: Host Temperature, service: uptime-kuma, severity: critical}
