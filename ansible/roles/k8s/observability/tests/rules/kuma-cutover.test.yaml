# promtool unit tests for files/rules/kuma-cutover.yaml, the temporary CheckWithoutPager guard.
# Run with `scripts/validate/alert_tools.sh promtool test rules <this file>`. The rule has no
# `for:`, so its hold is the term's range: a tile that stops reporting fires once its last
# sample is older than its term's range. Only B9's six terms remain. Their ranges ([348h10m] and
# [340h10m]) are about 14 days, so the expiry case uses an hourly series.
rule_files:
  - ../../files/rules/kuma-cutover.yaml
evaluation_interval: 1m
tests:
  # Zero-series case: no series at all, so every term fires and the page names each tile
  # through the label absent_over_time carries.
  - interval: 1m
    input_series: []
    alert_rule_test:
      - alertname: CheckWithoutPager
        eval_time: 5m
        exp_alerts:
          - exp_labels: {monitor_name: AIDE Integrity (daniel-box), service: uptime-kuma, severity: critical}
            exp_annotations:
              summary: Kuma's AIDE Integrity (daniel-box) tile is gone and no alert rule pages in its place.
              description: "M6's cutover removed the AIDE Integrity (daniel-box) tile more than two hours ago, and its replacement rule still carries shadow=\"true\". Drop `shadow` from the rule, or revert the Kuma-side PR to restore the tile."
          - exp_labels: {monitor_name: AIDE Integrity (daniel-server), service: uptime-kuma, severity: critical}
            exp_annotations:
              summary: Kuma's AIDE Integrity (daniel-server) tile is gone and no alert rule pages in its place.
              description: "M6's cutover removed the AIDE Integrity (daniel-server) tile more than two hours ago, and its replacement rule still carries shadow=\"true\". Drop `shadow` from the rule, or revert the Kuma-side PR to restore the tile."
          - exp_labels: {monitor_name: AIDE Integrity (daniel-pi), service: uptime-kuma, severity: critical}
            exp_annotations:
              summary: Kuma's AIDE Integrity (daniel-pi) tile is gone and no alert rule pages in its place.
              description: "M6's cutover removed the AIDE Integrity (daniel-pi) tile more than two hours ago, and its replacement rule still carries shadow=\"true\". Drop `shadow` from the rule, or revert the Kuma-side PR to restore the tile."
          - exp_labels: {monitor_name: rkhunter Scan (daniel-box), service: uptime-kuma, severity: critical}
            exp_annotations:
              summary: Kuma's rkhunter Scan (daniel-box) tile is gone and no alert rule pages in its place.
              description: "M6's cutover removed the rkhunter Scan (daniel-box) tile more than two hours ago, and its replacement rule still carries shadow=\"true\". Drop `shadow` from the rule, or revert the Kuma-side PR to restore the tile."
          - exp_labels: {monitor_name: rkhunter Scan (daniel-server), service: uptime-kuma, severity: critical}
            exp_annotations:
              summary: Kuma's rkhunter Scan (daniel-server) tile is gone and no alert rule pages in its place.
              description: "M6's cutover removed the rkhunter Scan (daniel-server) tile more than two hours ago, and its replacement rule still carries shadow=\"true\". Drop `shadow` from the rule, or revert the Kuma-side PR to restore the tile."
          - exp_labels: {monitor_name: rkhunter Scan (daniel-pi), service: uptime-kuma, severity: critical}
            exp_annotations:
              summary: Kuma's rkhunter Scan (daniel-pi) tile is gone and no alert rule pages in its place.
              description: "M6's cutover removed the rkhunter Scan (daniel-pi) tile more than two hours ago, and its replacement rule still carries shadow=\"true\". Drop `shadow` from the rule, or revert the Kuma-side PR to restore the tile."
  # Every tile present: no term fires.
  - interval: 1m
    input_series:
      - series: 'up{job="uptime-kuma", instance="uptime-kuma:3001"}'
        values: '1x140'
      - series: 'monitor_status{monitor_name="AIDE Integrity (daniel-box)", monitor_type="push"}'
        values: '1x140'
      - series: 'monitor_status{monitor_name="AIDE Integrity (daniel-server)", monitor_type="push"}'
        values: '1x140'
      - series: 'monitor_status{monitor_name="AIDE Integrity (daniel-pi)", monitor_type="push"}'
        values: '1x140'
      - series: 'monitor_status{monitor_name="rkhunter Scan (daniel-box)", monitor_type="push"}'
        values: '1x140'
      - series: 'monitor_status{monitor_name="rkhunter Scan (daniel-server)", monitor_type="push"}'
        values: '1x140'
      - series: 'monitor_status{monitor_name="rkhunter Scan (daniel-pi)", monitor_type="push"}'
        values: '1x140'
    alert_rule_test:
      - alertname: CheckWithoutPager
        eval_time: 131m
        exp_alerts: []
  # One tile stops reporting at hour 10 while the others stay, with an hourly series so the
  # [348h10m] term can expire. It fires nothing at hour 357, 347 hours after the last sample, and
  # names only that tile at hour 360, which is past the range.
  - interval: 1h
    input_series:
      - series: 'up{job="uptime-kuma", instance="uptime-kuma:3001"}'
        values: '1x370'
      - series: 'monitor_status{monitor_name="AIDE Integrity (daniel-box)", monitor_type="push"}'
        values: '1x370'
      - series: 'monitor_status{monitor_name="AIDE Integrity (daniel-server)", monitor_type="push"}'
        values: '1x370'
      - series: 'monitor_status{monitor_name="AIDE Integrity (daniel-pi)", monitor_type="push"}'
        values: '1x10 _x360'
      - series: 'monitor_status{monitor_name="rkhunter Scan (daniel-box)", monitor_type="push"}'
        values: '1x370'
      - series: 'monitor_status{monitor_name="rkhunter Scan (daniel-server)", monitor_type="push"}'
        values: '1x370'
      - series: 'monitor_status{monitor_name="rkhunter Scan (daniel-pi)", monitor_type="push"}'
        values: '1x370'
    alert_rule_test:
      - alertname: CheckWithoutPager
        eval_time: 357h
        exp_alerts: []
      - alertname: CheckWithoutPager
        eval_time: 360h
        exp_alerts:
          - exp_labels: {monitor_name: AIDE Integrity (daniel-pi), service: uptime-kuma, severity: critical}
            exp_annotations:
              summary: Kuma's AIDE Integrity (daniel-pi) tile is gone and no alert rule pages in its place.
              description: "M6's cutover removed the AIDE Integrity (daniel-pi) tile more than two hours ago, and its replacement rule still carries shadow=\"true\". Drop `shadow` from the rule, or revert the Kuma-side PR to restore the tile."
  # A Kuma outage (up == 0) fires no term; KumaDown's own pager covers it.
  - interval: 1m
    input_series:
      - series: 'up{job="uptime-kuma", instance="uptime-kuma:3001"}'
        values: '0x140'
    alert_rule_test:
      - alertname: CheckWithoutPager
        eval_time: 131m
        exp_alerts: []
