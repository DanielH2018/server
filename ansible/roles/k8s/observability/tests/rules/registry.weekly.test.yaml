# promtool unit tests for files/rules/registry.yaml whose deadlines run to days. Run with
# `scripts/validate/alert_tools.sh promtool test rules <this file>`.
#
# promtool evaluates every rule in `rule_files` at each `evaluation_interval` step up to a
# group's last eval time, and the interval is file-wide. A 171h case at registry.test.yaml's 1m
# step is 10,260 steps; here it is 171. Every eval time and input series steps by whole hours.
# `alert_conventions.rule_test_stem` counts these cases toward registry with the main file's.
rule_files:
  - ../../files/rules/registry.yaml
evaluation_interval: 1h
tests:
  # The GC wrote at 0 and never again while the exporter stays up. The stale-file arm fires once
  # the timestamp is more than 612000s (170h) old, so it is quiet at 170h and fires at 171h.
  - interval: 1h
    input_series:
      - series: 'homelab_check_last_run_timestamp_seconds{check="registry-gc", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '0x180'
      - series: 'up{instance="daniel-box", job="node", origin="daniel-box"}'
        values: '1x180'
    alert_rule_test:
      - eval_time: 170h
        alertname: RegistryGcNotReporting
        exp_alerts: []
      - eval_time: 171h
        alertname: RegistryGcNotReporting
        exp_alerts:
          - exp_labels:
              check: registry-gc
              instance: daniel-box
              job: node
              origin: daniel-box
              service: registry
              severity: warning
            exp_annotations: &registry_gc_not_reporting
              summary: The weekly registry garbage collection has stopped reporting.
              description: "No registry-gc verdict newer than 612000s reached Prometheus from daniel-box's textfile collector, so nothing confirms the mirrors' weekly GC still runs. Read homelab-registry-gc.timer and `journalctl -t registry-gc` on daniel-box, then /var/lib/node-exporter-textfile/registry-gc.prom on the host."

  # The same stale file behind a dead node exporter is ScrapeTargetDown's page, not this one.
  - interval: 1h
    input_series:
      - series: 'homelab_check_last_run_timestamp_seconds{check="registry-gc", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '0x180'
      - series: 'up{instance="daniel-box", job="node", origin="daniel-box"}'
        values: '0x180'
    alert_rule_test:
      - eval_time: 171h
        alertname: RegistryGcNotReporting
        exp_alerts: []

  # No registry-gc file at all: the absent arm fires with no series in the 612000s window.
  - interval: 1h
    input_series:
      - series: 'up{instance="daniel-box", job="node", origin="daniel-box"}'
        values: '1x180'
    alert_rule_test:
      - eval_time: 171h
        alertname: RegistryGcNotReporting
        exp_alerts:
          - exp_labels:
              check: registry-gc
              origin: daniel-box
              service: registry
              severity: warning
            exp_annotations: *registry_gc_not_reporting
