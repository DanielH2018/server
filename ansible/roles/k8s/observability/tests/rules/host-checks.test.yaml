# promtool unit tests for files/rules/host-checks.yaml. Run with
# `scripts/validate/alert_tools.sh promtool test rules <this file>`; the validate-alert-rules
# hook runs it on every commit that touches the rules.
#
# The input series carry the labels the `node` scrape job adds: `job`, and `origin` and
# `instance`, both the node name. promtool's `time()` is the eval time in seconds from 0, so a
# fresh timestamp series reads 60 x the minute index (`0+60xN`), and a frozen one stays put.
#
# DiskHealthNotReporting fires with one of two label sets. Its first arm keeps the series'
# labels, `job` and `instance` included. Its absent_over_time arm carries only the equality
# matchers' `check` and `origin`. HostUpdateStale's two arms differ the same way.
#
# fixtures/host-update-stale.yaml holds the HostUpdateStale rule for a one-host map,
# fixture-host at 11400s, which gives the rule's shape cases that name no shipped host.
# host-checks.yaml carries daniel-pi's rule (job node-pi, 11400s) since H3.9c, and the cases
# after the fixture's own exercise it.
rule_files:
  - ../../files/rules/host-checks.yaml
  - fixtures/host-update-stale.yaml
evaluation_interval: 1m
tests:
  # The zero-series case: no input at all, so no disk-health series has existed for longer
  # than the 1500s deadline. DiskHealthNotReporting fires through absent_over_time, and the
  # rules that read a series stay quiet.
  - interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 26m
        alertname: DiskHealthNotReporting
        exp_alerts:
          - exp_labels:
              check: disk-health
              origin: daniel-box
              severity: critical
              service: daniel-box
            exp_annotations:
              summary: daniel-box's root disk check has stopped reporting.
              description: >-
                No disk-health verdict newer than 1500s reached Prometheus from daniel-box's
                textfile collector, so nothing is watching the root disk. Read the `daniel-box
                disk health` cron and the `disk-health` syslog tag, then
                /var/lib/node-exporter-textfile/disk-health.prom on the host.
      - eval_time: 26m
        alertname: DiskHealthFailed
        exp_alerts: []
      - eval_time: 26m
        alertname: TextfileCollectorError
        exp_alerts: []
      - eval_time: 26m
        alertname: HostReconcileFailed
        exp_alerts: []
      - eval_time: 26m
        alertname: HostUpdateStale
        exp_alerts: []
      - eval_time: 26m
        alertname: WiredLinkDown
        exp_alerts: []
      - eval_time: 26m
        alertname: IscsiSessionStale
        exp_alerts: []
      - eval_time: 26m
        alertname: IscsiSessionsNotReporting
        exp_alerts:
          - exp_labels:
              check: iscsi-sessions
              origin: daniel-box
              severity: warning
              service: daniel-box
            exp_annotations:
              summary: daniel-box's iSCSI session check has stopped reporting.
              description: >-
                No iscsi-sessions verdict newer than 300s reached Prometheus from daniel-box's
                textfile collector, so nothing is watching the node's iSCSI sessions. Read the
                log of the node-exporter pod's `iscsi-sessions` container on daniel-box.
          - exp_labels:
              check: iscsi-sessions
              origin: daniel-server
              severity: warning
              service: daniel-server
            exp_annotations:
              summary: daniel-server's iSCSI session check has stopped reporting.
              description: >-
                No iscsi-sessions verdict newer than 300s reached Prometheus from
                daniel-server's textfile collector, so nothing is watching the node's iSCSI
                sessions. Read the log of the node-exporter pod's `iscsi-sessions` container
                on daniel-server.

  # The verdict turns red from minute 3 while the file stays fresh. DiskHealthFailed fires at once,
  # and DiskHealthNotReporting stays quiet.
  - interval: 1m
    input_series:
      - series: 'homelab_check_success{check="disk-health", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '1x2 0x5'
      - series: 'homelab_check_last_run_timestamp_seconds{check="disk-health", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '0+60x7'
      - series: 'up{instance="daniel-box", job="node", origin="daniel-box"}'
        values: '1x7'
    alert_rule_test:
      - eval_time: 2m
        alertname: DiskHealthFailed
        exp_alerts: []
      - eval_time: 4m
        alertname: DiskHealthFailed
        exp_alerts:
          - exp_labels:
              check: disk-health
              instance: daniel-box
              job: node
              origin: daniel-box
              severity: critical
              service: daniel-box
            exp_annotations:
              summary: daniel-box's root disk check is red.
              description: >-
                disk-health.sh on daniel-box read the root filesystem above its threshold, or
                df failed. Longhorn stops scheduling replicas on the node at 75%.
                homelab_disk_root_used_ratio{check="disk-health"} holds the share it read, and
                the `disk-health` syslog tag holds the run's message.
      - eval_time: 4m
        alertname: DiskHealthNotReporting
        exp_alerts: []

  # The file stopped being refreshed: node_exporter keeps serving the timestamp written at 0.
  # The first arm fires once the timestamp is more than 1500s old, between minutes 25 and 26.
  - interval: 1m
    input_series:
      - series: 'homelab_check_last_run_timestamp_seconds{check="disk-health", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '0x40'
      - series: 'up{instance="daniel-box", job="node", origin="daniel-box"}'
        values: '1x40'
    alert_rule_test:
      - eval_time: 24m
        alertname: DiskHealthNotReporting
        exp_alerts: []
      - eval_time: 26m
        alertname: DiskHealthNotReporting
        exp_alerts:
          - exp_labels:
              check: disk-health
              instance: daniel-box
              job: node
              origin: daniel-box
              severity: critical
              service: daniel-box
            exp_annotations:
              summary: daniel-box's root disk check has stopped reporting.
              description: >-
                No disk-health verdict newer than 1500s reached Prometheus from daniel-box's
                textfile collector, so nothing is watching the root disk. Read the `daniel-box
                disk health` cron and the `disk-health` syslog tag, then
                /var/lib/node-exporter-textfile/disk-health.prom on the host.

  # The file is gone from minute 6, so the series goes stale while the exporter stays up. The
  # absent_over_time arm fires once 1500s pass with no sample, after minute 30 and not
  # before. The exporter-down group below differs from this one only in `up`, so this group
  # is its control.
  - interval: 1m
    input_series:
      - series: 'homelab_check_last_run_timestamp_seconds{check="disk-health", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '0+60x5 stale'
      - series: 'up{instance="daniel-box", job="node", origin="daniel-box"}'
        values: '1x45'
    alert_rule_test:
      - eval_time: 29m
        alertname: DiskHealthNotReporting
        exp_alerts: []
      - eval_time: 40m
        alertname: DiskHealthNotReporting
        exp_alerts:
          - exp_labels:
              check: disk-health
              origin: daniel-box
              severity: critical
              service: daniel-box
            exp_annotations:
              summary: daniel-box's root disk check has stopped reporting.
              description: >-
                No disk-health verdict newer than 1500s reached Prometheus from daniel-box's
                textfile collector, so nothing is watching the root disk. Read the `daniel-box
                disk health` cron and the `disk-health` syslog tag, then
                /var/lib/node-exporter-textfile/disk-health.prom on the host.

  # The exporter is down from minute 6: `up` reads 0 and the series is gone, as in the
  # control above. The bridge's `targets` check pages the dead exporter, so the `unless`
  # clause keeps DiskHealthNotReporting quiet past the point the control fires.
  - interval: 1m
    input_series:
      - series: 'homelab_check_last_run_timestamp_seconds{check="disk-health", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '0+60x5 stale'
      - series: 'up{instance="daniel-box", job="node", origin="daniel-box"}'
        values: '1x5 0x40'
    alert_rule_test:
      - eval_time: 40m
        alertname: DiskHealthNotReporting
        exp_alerts: []

  # M6 batch B1. The zero-series case: no input at all, so no k3s cron has written a verdict
  # inside its deadline, and no Kuma `up` series exists. Each NotReporting rule fires through
  # absent_over_time, once the longest deadline (90000s) has passed, and KumaDown fires on its
  # absent() arm. The Failed rules read a series and stay quiet.
  - interval: 10m
    input_series: []
    alert_rule_test:
      - eval_time: 26h
        alertname: LonghornBackupHealthNotReporting
        exp_alerts:
          - exp_labels:
              check: longhorn-backup-health
              origin: daniel-box
              severity: critical
              service: daniel-box
              shadow: "true"
            exp_annotations:
              summary: daniel-box's longhorn-backup-health check has stopped reporting.
              description: >-
                No longhorn-backup-health verdict newer than 1500s reached Prometheus from
                daniel-box's textfile collector, so nothing is watching the Longhorn backup plane.
                Read the `Longhorn backup health` cron and the `longhorn-backup-health` syslog tag,
                then /var/lib/node-exporter-textfile/longhorn-backup-health.prom on the host.
      - eval_time: 26h
        alertname: LonghornBackupHealthFailed
        exp_alerts: []
      - eval_time: 26h
        alertname: EtcdSnapshotOffboxNotReporting
        exp_alerts:
          - exp_labels:
              check: etcd-snapshot-offbox
              origin: daniel-box
              severity: critical
              service: daniel-box
              shadow: "true"
            exp_annotations:
              summary: daniel-box's etcd-snapshot-offbox check has stopped reporting.
              description: >-
                No etcd-snapshot-offbox verdict newer than 90000s reached Prometheus from
                daniel-box's textfile collector, so nothing is watching the off-box etcd snapshot.
                Read the `Off-box etcd snapshot` cron and the `etcd-snapshot-offbox` syslog tag,
                then /var/lib/node-exporter-textfile/etcd-snapshot-offbox.prom on the host.
      - eval_time: 26h
        alertname: EtcdSnapshotOffboxFailed
        exp_alerts: []
      - eval_time: 26h
        alertname: ManifestPruneCheckNotReporting
        exp_alerts:
          - exp_labels:
              check: manifest-prune-check
              origin: daniel-box
              severity: warning
              service: daniel-box
              shadow: "true"
            exp_annotations:
              summary: daniel-box's manifest-prune-check check has stopped reporting.
              description: >-
                No manifest-prune-check verdict newer than 90000s reached Prometheus from
                daniel-box's textfile collector, so nothing is watching deployed-artifact drift.
                Read the `kuma-check-manifest-prune` timer and the `manifest-prune-check` syslog
                tag, then /var/lib/node-exporter-textfile/manifest-prune-check.prom on the host.
      - eval_time: 26h
        alertname: ManifestPruneCheckFailed
        exp_alerts: []
      - eval_time: 26h
        alertname: ReleaseStalenessCheckNotReporting
        exp_alerts:
          - exp_labels:
              check: release-staleness-check
              origin: daniel-box
              severity: warning
              service: daniel-box
              shadow: "true"
            exp_annotations:
              summary: daniel-box's release-staleness-check check has stopped reporting.
              description: >-
                No release-staleness-check verdict newer than 3900s reached Prometheus from
                daniel-box's textfile collector, so nothing is watching release staleness. Read the
                `Release staleness drift check` cron and the `release-staleness-check` syslog tag,
                then /var/lib/node-exporter-textfile/release-staleness-check.prom on the host.
      - eval_time: 26h
        alertname: ReleaseStalenessCheckFailed
        exp_alerts: []
      - eval_time: 26h
        alertname: LiveDriftCheckNotReporting
        exp_alerts:
          - exp_labels:
              check: live-drift-check
              origin: daniel-box
              severity: warning
              service: daniel-box
              shadow: "true"
            exp_annotations:
              summary: daniel-box's live-drift-check check has stopped reporting.
              description: >-
                No live-drift-check verdict newer than 90000s reached Prometheus from daniel-box's
                textfile collector, so nothing is watching live-object drift. Read the
                `kuma-check-live-drift` timer and the `live-drift-check` syslog tag, then
                /var/lib/node-exporter-textfile/live-drift-check.prom on the host.
      - eval_time: 26h
        alertname: LiveDriftCheckFailed
        exp_alerts: []
      - eval_time: 26h
        alertname: KumaDown
        exp_alerts:
          - exp_labels:
              job: uptime-kuma
              severity: critical
              service: uptime-kuma
              shadow: "true"
            exp_annotations:
              summary: Uptime Kuma has stopped serving /metrics.
              description: >-
                Prometheus's scrape of the uptime-kuma Service failed for 5 minutes, or the job has
                no `up` series at all. Kuma still pages every check that has not moved to an alert
                rule, so a dead Kuma leaves those checks silent. Read `kubectl -n uptime-kuma get
                pods` and the pod's log.

  # M6 batch B1. Every check turns red from minute 3 while its file stays fresh. Each Failed
  # rule fires at once and no NotReporting rule does.
  - interval: 1m
    input_series:
      - series: 'homelab_check_success{check="longhorn-backup-health", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '1x2 0x5'
      - series: 'homelab_check_last_run_timestamp_seconds{check="longhorn-backup-health", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '0+60x7'
      - series: 'homelab_check_success{check="etcd-snapshot-offbox", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '1x2 0x5'
      - series: 'homelab_check_last_run_timestamp_seconds{check="etcd-snapshot-offbox", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '0+60x7'
      - series: 'homelab_check_success{check="manifest-prune-check", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '1x2 0x5'
      - series: 'homelab_check_last_run_timestamp_seconds{check="manifest-prune-check", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '0+60x7'
      - series: 'homelab_check_success{check="release-staleness-check", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '1x2 0x5'
      - series: 'homelab_check_last_run_timestamp_seconds{check="release-staleness-check", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '0+60x7'
      - series: 'homelab_check_success{check="live-drift-check", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '1x2 0x5'
      - series: 'homelab_check_last_run_timestamp_seconds{check="live-drift-check", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '0+60x7'
      - series: 'up{instance="daniel-box", job="node", origin="daniel-box"}'
        values: '1x7'
    alert_rule_test:
      - eval_time: 2m
        alertname: LonghornBackupHealthFailed
        exp_alerts: []
      - eval_time: 4m
        alertname: LonghornBackupHealthFailed
        exp_alerts:
          - exp_labels:
              check: longhorn-backup-health
              instance: daniel-box
              job: node
              origin: daniel-box
              severity: critical
              service: daniel-box
              shadow: "true"
            exp_annotations:
              summary: daniel-box's Longhorn backup check is red.
              description: >-
                longhorn_backup_health.py on daniel-box reported a failing backup-plane check: an
                unavailable backup target, a stale or errored backup, a failed job, or a restore
                drill that is overdue. `journalctl -t longhorn-backup-health` names the check. Read
                docs/longhorn-disaster-recovery.md after it.
      - eval_time: 4m
        alertname: LonghornBackupHealthNotReporting
        exp_alerts: []
      - eval_time: 2m
        alertname: EtcdSnapshotOffboxFailed
        exp_alerts: []
      - eval_time: 4m
        alertname: EtcdSnapshotOffboxFailed
        exp_alerts:
          - exp_labels:
              check: etcd-snapshot-offbox
              instance: daniel-box
              job: node
              origin: daniel-box
              severity: critical
              service: daniel-box
              shadow: "true"
            exp_annotations:
              summary: daniel-box's off-box etcd snapshot check is red.
              description: >-
                etcd-snapshot-offbox.sh on daniel-box could not take or upload the etcd snapshot, or
                the cluster token changed since the off-box copy was stamped. `journalctl -t
                etcd-snapshot-offbox` names which. Read docs/k3s-etcd-restore.md after it.
      - eval_time: 4m
        alertname: EtcdSnapshotOffboxNotReporting
        exp_alerts: []
      - eval_time: 2m
        alertname: ManifestPruneCheckFailed
        exp_alerts: []
      - eval_time: 4m
        alertname: ManifestPruneCheckFailed
        exp_alerts:
          - exp_labels:
              check: manifest-prune-check
              instance: daniel-box
              job: node
              origin: daniel-box
              severity: warning
              service: daniel-box
              shadow: "true"
            exp_annotations:
              summary: daniel-box has deployed-artifact drift.
              description: >-
                manifest-prune-check.sh on daniel-box found a live cluster object that no staged
                manifest declares, a deployed setup file that differs from the repo, or a rendered
                script that is older than its template. `journalctl -t manifest-prune-check` names
                the arm and the object.
      - eval_time: 4m
        alertname: ManifestPruneCheckNotReporting
        exp_alerts: []
      - eval_time: 2m
        alertname: ReleaseStalenessCheckFailed
        exp_alerts: []
      - eval_time: 4m
        alertname: ReleaseStalenessCheckFailed
        exp_alerts:
          - exp_labels:
              check: release-staleness-check
              instance: daniel-box
              job: node
              origin: daniel-box
              severity: warning
              service: daniel-box
              shadow: "true"
            exp_annotations:
              summary: A k8s service runs an older release than origin/master.
              description: >-
                release-staleness-check.sh on daniel-box found a service whose role paths changed on
                origin/master after its last applied commit. `uv run python
                scripts/diagnostics/probe.py releases --stale-only` prints each reason, and
                `./scripts/deploy.sh --tags <svc>` redeploys the service.
      - eval_time: 4m
        alertname: ReleaseStalenessCheckNotReporting
        exp_alerts: []
      - eval_time: 2m
        alertname: LiveDriftCheckFailed
        exp_alerts: []
      - eval_time: 4m
        alertname: LiveDriftCheckFailed
        exp_alerts:
          - exp_labels:
              check: live-drift-check
              instance: daniel-box
              job: node
              origin: daniel-box
              severity: warning
              service: daniel-box
              shadow: "true"
            exp_annotations:
              summary: A live cluster object differs from its last-applied manifest.
              description: >-
                live_drift_check.py on daniel-box found an object that was patched, edited or scaled
                by hand after Ansible applied it, or could not read the cluster. `journalctl -t
                live-drift-check` names the object. Redeploy the owning role.
      - eval_time: 4m
        alertname: LiveDriftCheckNotReporting
        exp_alerts: []

  # M6 batch B1. The files stop being refreshed: node_exporter keeps serving the timestamp
  # written at 0. The first arm fires once the timestamp is more than the deadline old, so
  # longhorn-backup-health (1500s) fires between minutes 25 and 26 and
  # release-staleness-check (3900s) between minutes 65 and 66. The two quiet checks use the
  # same labels, so a rule that read another check's deadline would show here.
  - interval: 1m
    input_series:
      - series: 'homelab_check_last_run_timestamp_seconds{check="longhorn-backup-health", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '0x70'
      - series: 'homelab_check_last_run_timestamp_seconds{check="release-staleness-check", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '0x70'
      - series: 'up{instance="daniel-box", job="node", origin="daniel-box"}'
        values: '1x70'
    alert_rule_test:
      - eval_time: 24m
        alertname: LonghornBackupHealthNotReporting
        exp_alerts: []
      - eval_time: 26m
        alertname: LonghornBackupHealthNotReporting
        exp_alerts:
          - exp_labels:
              check: longhorn-backup-health
              instance: daniel-box
              job: node
              origin: daniel-box
              severity: critical
              service: daniel-box
              shadow: "true"
            exp_annotations:
              summary: daniel-box's longhorn-backup-health check has stopped reporting.
              description: >-
                No longhorn-backup-health verdict newer than 1500s reached Prometheus from
                daniel-box's textfile collector, so nothing is watching the Longhorn backup plane.
                Read the `Longhorn backup health` cron and the `longhorn-backup-health` syslog tag,
                then /var/lib/node-exporter-textfile/longhorn-backup-health.prom on the host.
      - eval_time: 64m
        alertname: ReleaseStalenessCheckNotReporting
        exp_alerts: []
      - eval_time: 66m
        alertname: ReleaseStalenessCheckNotReporting
        exp_alerts:
          - exp_labels:
              check: release-staleness-check
              instance: daniel-box
              job: node
              origin: daniel-box
              severity: warning
              service: daniel-box
              shadow: "true"
            exp_annotations:
              summary: daniel-box's release-staleness-check check has stopped reporting.
              description: >-
                No release-staleness-check verdict newer than 3900s reached Prometheus from
                daniel-box's textfile collector, so nothing is watching release staleness. Read the
                `Release staleness drift check` cron and the `release-staleness-check` syslog tag,
                then /var/lib/node-exporter-textfile/release-staleness-check.prom on the host.

  # M6 batch B1. The exporter is down from minute 0 and every file is gone, so the bridge's
  # `targets` check pages the dead exporter and the `unless` clause keeps all five
  # NotReporting rules quiet past the point the zero-series case fires them.
  - interval: 10m
    input_series:
      - series: 'up{instance="daniel-box", job="node", origin="daniel-box"}'
        values: '0x160'
    alert_rule_test:
      - eval_time: 26h
        alertname: LonghornBackupHealthNotReporting
        exp_alerts: []
      - eval_time: 26h
        alertname: EtcdSnapshotOffboxNotReporting
        exp_alerts: []
      - eval_time: 26h
        alertname: ManifestPruneCheckNotReporting
        exp_alerts: []
      - eval_time: 26h
        alertname: ReleaseStalenessCheckNotReporting
        exp_alerts: []
      - eval_time: 26h
        alertname: LiveDriftCheckNotReporting
        exp_alerts: []

  # M6 batch B1. KumaDown's up arm: the scrape fails from minute 2, and the rule fires after
  # its 5 minutes. While Kuma is up it stays quiet.
  - interval: 1m
    input_series:
      - series: 'up{instance="uptime-kuma:3001", job="uptime-kuma"}'
        values: '1x2 0x10'
    alert_rule_test:
      - eval_time: 5m
        alertname: KumaDown
        exp_alerts: []
      - eval_time: 9m
        alertname: KumaDown
        exp_alerts:
          - exp_labels:
              instance: uptime-kuma:3001
              job: uptime-kuma
              severity: critical
              service: uptime-kuma
              shadow: "true"
            exp_annotations:
              summary: Uptime Kuma has stopped serving /metrics.
              description: >-
                Prometheus's scrape of the uptime-kuma Service failed for 5 minutes, or the job has
                no `up` series at all. Kuma still pages every check that has not moved to an alert
                rule, so a dead Kuma leaves those checks silent. Read `kubectl -n uptime-kuma get
                pods` and the pod's log.

  # A short gap: one, then two failed scrapes mark the series stale between fresh timestamps,
  # as a node-exporter roll does. A bare absent() would fire at each stale minute; the
  # absent_over_time arm still sees the earlier samples and stays quiet.
  - interval: 1m
    input_series:
      - series: 'homelab_check_last_run_timestamp_seconds{check="disk-health", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '0+60x4 stale 360+60x4 stale stale 780+60x10'
      - series: 'up{instance="daniel-box", job="node", origin="daniel-box"}'
        values: '1x23'
    alert_rule_test:
      - eval_time: 5m
        alertname: DiskHealthNotReporting
        exp_alerts: []
      - eval_time: 11m
        alertname: DiskHealthNotReporting
        exp_alerts: []
      - eval_time: 12m
        alertname: DiskHealthNotReporting
        exp_alerts: []
      - eval_time: 20m
        alertname: DiskHealthNotReporting
        exp_alerts: []

  # daniel-box's collector fails from minute 3. TextfileCollectorError fires in shadow for
  # daniel-box once its 10m hold has passed, and daniel-server's rule stays quiet.
  - interval: 1m
    input_series:
      - series: 'node_textfile_scrape_error{instance="daniel-box", job="node", origin="daniel-box"}'
        values: '0x2 1x20'
      - series: 'node_textfile_scrape_error{instance="daniel-server", job="node", origin="daniel-server"}'
        values: '0x22'
    alert_rule_test:
      - eval_time: 12m
        alertname: TextfileCollectorError
        exp_alerts: []
      - eval_time: 14m
        alertname: TextfileCollectorError
        exp_alerts:
          - exp_labels:
              instance: daniel-box
              job: node
              origin: daniel-box
              severity: warning
              service: daniel-box
              shadow: "true"
            exp_annotations:
              summary: node_exporter on daniel-box cannot read a textfile.
              description: >-
                node_exporter's textfile collector on daniel-box has failed for 10 minutes, so
                a file in /var/lib/node-exporter-textfile is malformed or unreadable, and every
                series in it is gone. Read node_textfile_mtime_seconds for the files it still
                sees, and the node-exporter pod's log.

  # The same failure on daniel-server fires its own rule, with daniel-server as `service`.
  - interval: 1m
    input_series:
      - series: 'node_textfile_scrape_error{instance="daniel-box", job="node", origin="daniel-box"}'
        values: '0x22'
      - series: 'node_textfile_scrape_error{instance="daniel-server", job="node", origin="daniel-server"}'
        values: '0x2 1x20'
    alert_rule_test:
      - eval_time: 14m
        alertname: TextfileCollectorError
        exp_alerts:
          - exp_labels:
              instance: daniel-server
              job: node
              origin: daniel-server
              severity: warning
              service: daniel-server
              shadow: "true"
            exp_annotations:
              summary: node_exporter on daniel-server cannot read a textfile.
              description: >-
                node_exporter's textfile collector on daniel-server has failed for 10 minutes,
                so a file in /var/lib/node-exporter-textfile is malformed or unreadable, and
                every series in it is gone. Read node_textfile_mtime_seconds for the files it
                still sees, and the node-exporter pod's log.

  # daniel-pi's reconcile reads 0 from minute 0, so the host holds. HostReconcileFailed is
  # pending at 14 minutes and fires for daniel-pi alone at 16, past its 15-minute hold.
  - interval: 1m
    input_series:
      - series: 'homelab_host_reconcile_ok{instance="daniel-pi", job="node-pi", origin="daniel-pi"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 14m
        alertname: HostReconcileFailed
        exp_alerts: []
      - eval_time: 16m
        alertname: HostReconcileFailed
        exp_alerts:
          - exp_labels:
              instance: daniel-pi
              job: node-pi
              origin: daniel-pi
              severity: critical
              service: daniel-pi
            exp_annotations:
              summary: daniel-pi holds after a failed reconcile.
              description: >-
                homelab_host_reconcile_ok on daniel-pi has read 0 for 15 minutes, so the host
                holds and installs no newer homelab package. Read `journalctl -u
                homelab-updater -u homelab-reconcile` on daniel-pi and docs/host-packages.md,
                "Host-plane pages". Once the cause is fixed, `sudo
                /usr/lib/homelab/homelab-updater --clear-hold` reruns reconcile and clears the
                hold if it passes, and `sudo /usr/lib/homelab/homelab-updater --clear-hold
                --install-newest` clears the hold and then installs the newest packages as a
                timer run does.

  # daniel-pi reconciles, and the two k3s nodes hold. Each node's rule fires with its own
  # `service`, and daniel-pi's stays quiet.
  - interval: 1m
    input_series:
      - series: 'homelab_host_reconcile_ok{instance="daniel-pi", job="node-pi", origin="daniel-pi"}'
        values: '1x20'
      - series: 'homelab_host_reconcile_ok{instance="daniel-box", job="node", origin="daniel-box"}'
        values: '0x20'
      - series: 'homelab_host_reconcile_ok{instance="daniel-server", job="node", origin="daniel-server"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 16m
        alertname: HostReconcileFailed
        exp_alerts:
          - exp_labels:
              instance: daniel-box
              job: node
              origin: daniel-box
              severity: critical
              service: daniel-box
            exp_annotations:
              summary: daniel-box holds after a failed reconcile.
              description: >-
                homelab_host_reconcile_ok on daniel-box has read 0 for 15 minutes, so the host
                holds and installs no newer homelab package. Read `journalctl -u
                homelab-updater -u homelab-reconcile` on daniel-box and docs/host-packages.md,
                "Host-plane pages". Once the cause is fixed, `sudo
                /usr/lib/homelab/homelab-updater --clear-hold` reruns reconcile and clears the
                hold if it passes, and `sudo /usr/lib/homelab/homelab-updater --clear-hold
                --install-newest` clears the hold and then installs the newest packages as a
                timer run does.
          - exp_labels:
              instance: daniel-server
              job: node
              origin: daniel-server
              severity: critical
              service: daniel-server
            exp_annotations:
              summary: daniel-server holds after a failed reconcile.
              description: >-
                homelab_host_reconcile_ok on daniel-server has read 0 for 15 minutes, so the host
                holds and installs no newer homelab package. Read `journalctl -u
                homelab-updater -u homelab-reconcile` on daniel-server and docs/host-packages.md,
                "Host-plane pages". Once the cause is fixed, `sudo
                /usr/lib/homelab/homelab-updater --clear-hold` reruns reconcile and clears the
                hold if it passes, and `sudo /usr/lib/homelab/homelab-updater --clear-hold
                --install-newest` clears the hold and then installs the newest packages as a
                timer run does.

  # The fixture host's last success stays at 0 while its exporter is up. HostUpdateStale is
  # quiet at 189 minutes (11340s) and fires at 191 (11460s), past the 11400s limit.
  - interval: 1m
    input_series:
      - series: 'homelab_host_update_success_timestamp_seconds{instance="fixture-host", job="node-fixture", origin="fixture-host"}'
        values: '0x200'
      - series: 'up{instance="fixture-host", job="node-fixture", origin="fixture-host"}'
        values: '1x200'
    alert_rule_test:
      - eval_time: 189m
        alertname: HostUpdateStale
        exp_alerts: []
      - eval_time: 191m
        alertname: HostUpdateStale
        exp_alerts:
          - exp_labels:
              instance: fixture-host
              job: node-fixture
              origin: fixture-host
              severity: critical
              service: fixture-host
            exp_annotations:
              summary: fixture-host has had no successful homelab update for 11400s.
              description: >-
                No homelab-updater run on fixture-host has succeeded in 11400s, or its exporter is
                up and serves no success timestamp. A failed fetch, a stopped
                homelab-apt-repo.service, a firewall rule, a keyring mismatch and a stopped
                timer each leave it stale. Read `systemctl status homelab-updater.timer` and
                `journalctl -u homelab-updater` on fixture-host, and docs/host-packages.md,
                "Host-plane pages".

  # A success timestamp that follows the clock keeps HostUpdateStale quiet.
  - interval: 1m
    input_series:
      - series: 'homelab_host_update_success_timestamp_seconds{instance="fixture-host", job="node-fixture", origin="fixture-host"}'
        values: '0+60x200'
      - series: 'up{instance="fixture-host", job="node-fixture", origin="fixture-host"}'
        values: '1x200'
    alert_rule_test:
      - eval_time: 191m
        alertname: HostUpdateStale
        exp_alerts: []

  # The exporter is up and serves no success timestamp. The absent arm fires with the equality
  # matchers' `job` and `origin` alone.
  - interval: 1m
    input_series:
      - series: 'up{instance="fixture-host", job="node-fixture", origin="fixture-host"}'
        values: '1x10'
    alert_rule_test:
      - eval_time: 5m
        alertname: HostUpdateStale
        exp_alerts:
          - exp_labels:
              job: node-fixture
              origin: fixture-host
              severity: critical
              service: fixture-host
            exp_annotations:
              summary: fixture-host has had no successful homelab update for 11400s.
              description: >-
                No homelab-updater run on fixture-host has succeeded in 11400s, or its exporter is
                up and serves no success timestamp. A failed fetch, a stopped
                homelab-apt-repo.service, a firewall rule, a keyring mismatch and a stopped
                timer each leave it stale. Read `systemctl status homelab-updater.timer` and
                `journalctl -u homelab-updater` on fixture-host, and docs/host-packages.md,
                "Host-plane pages".

  # The exporter is down, so every series of the target is stale and the success timestamp
  # reads as absent. `up` at 0 keeps the absent arm quiet: a failed scrape is not a stale host.
  - interval: 1m
    input_series:
      - series: 'up{instance="fixture-host", job="node-fixture", origin="fixture-host"}'
        values: '0x10'
    alert_rule_test:
      - eval_time: 5m
        alertname: HostUpdateStale
        exp_alerts: []

  # daniel-pi's last success stays at 0 while node-pi answers (`up` at 1). HostUpdateStale is
  # quiet at 189 minutes (11340s) and fires at 191 (11460s) for daniel-pi alone: the
  # fixture host has no series here.
  - interval: 1m
    input_series:
      - series: 'homelab_host_update_success_timestamp_seconds{instance="daniel-pi", job="node-pi", origin="daniel-pi"}'
        values: '0x200'
      - series: 'up{instance="daniel-pi", job="node-pi", origin="daniel-pi"}'
        values: '1x200'
    alert_rule_test:
      - eval_time: 189m
        alertname: HostUpdateStale
        exp_alerts: []
      - eval_time: 191m
        alertname: HostUpdateStale
        exp_alerts:
          - exp_labels:
              instance: daniel-pi
              job: node-pi
              origin: daniel-pi
              severity: critical
              service: daniel-pi
            exp_annotations:
              summary: daniel-pi has had no successful homelab update for 11400s.
              description: >-
                No homelab-updater run on daniel-pi has succeeded in 11400s, or its exporter is
                up and serves no success timestamp. A failed fetch, a stopped
                homelab-apt-repo.service, a firewall rule, a keyring mismatch and a stopped
                timer each leave it stale. Read `systemctl status homelab-updater.timer` and
                `journalctl -u homelab-updater` on daniel-pi, and docs/host-packages.md,
                "Host-plane pages".

  # A success timestamp that follows the clock keeps daniel-pi's rule quiet. This is the
  # control for the group above.
  - interval: 1m
    input_series:
      - series: 'homelab_host_update_success_timestamp_seconds{instance="daniel-pi", job="node-pi", origin="daniel-pi"}'
        values: '0+60x200'
      - series: 'up{instance="daniel-pi", job="node-pi", origin="daniel-pi"}'
        values: '1x200'
    alert_rule_test:
      - eval_time: 191m
        alertname: HostUpdateStale
        exp_alerts: []

  # node-pi answers and serves no success timestamp: the absent arm fires for daniel-pi.
  - interval: 1m
    input_series:
      - series: 'up{instance="daniel-pi", job="node-pi", origin="daniel-pi"}'
        values: '1x10'
    alert_rule_test:
      - eval_time: 5m
        alertname: HostUpdateStale
        exp_alerts:
          - exp_labels:
              job: node-pi
              origin: daniel-pi
              severity: critical
              service: daniel-pi
            exp_annotations:
              summary: daniel-pi has had no successful homelab update for 11400s.
              description: >-
                No homelab-updater run on daniel-pi has succeeded in 11400s, or its exporter is
                up and serves no success timestamp. A failed fetch, a stopped
                homelab-apt-repo.service, a firewall rule, a keyring mismatch and a stopped
                timer each leave it stale. Read `systemctl status homelab-updater.timer` and
                `journalctl -u homelab-updater` on daniel-pi, and docs/host-packages.md,
                "Host-plane pages".

  # node-pi fails its scrape (`up` at 0, a 30s-timeout miss on the Zero 2 W), so the success
  # timestamp reads as absent. The rule stays quiet: a failed scrape is not a stale host.
  - interval: 1m
    input_series:
      - series: 'up{instance="daniel-pi", job="node-pi", origin="daniel-pi"}'
        values: '0x10'
    alert_rule_test:
      - eval_time: 5m
        alertname: HostUpdateStale
        exp_alerts: []

  # The cable to daniel-box's eno1 is pulled at minute 3. Carrier reads 0, and the kernel's
  # operstate drops with it, so both arms of the rule are true at once and the alert fires
  # once. WiredLinkDown is pending at 7 minutes and fires for daniel-box at 9, past its
  # 5-minute hold. wlp4s0, the WiFi fallback, keeps carrier, and daniel-server's wired link
  # stays up, so neither raises an alert.
  - interval: 1m
    input_series:
      - series: 'node_network_carrier{device="eno1", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '1x2 0x10'
      - series: 'node_network_up{device="eno1", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '1x2 0x10'
      - series: 'node_network_carrier{device="wlp4s0", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '1x12'
      - series: 'node_network_carrier{device="enp88s0", instance="daniel-server", job="node", origin="daniel-server"}'
        values: '1x12'
      - series: 'node_network_up{device="enp88s0", instance="daniel-server", job="node", origin="daniel-server"}'
        values: '1x12'
    alert_rule_test:
      - eval_time: 7m
        alertname: WiredLinkDown
        exp_alerts: []
      - eval_time: 9m
        alertname: WiredLinkDown
        exp_alerts:
          - exp_labels:
              device: eno1
              instance: daniel-box
              job: node
              origin: daniel-box
              severity: warning
              service: daniel-box
            exp_annotations:
              summary: daniel-box's wired link eno1 is down, so the node runs on WiFi.
              description: >-
                eno1 on daniel-box has had no carrier, or has been down, for 5 minutes. The
                node routes over its WiFi fallback, which carries Longhorn replication and
                media at a fraction of the wired rate. Check the cable and the switch port,
                then run `ip link show eno1` and `ip route get 1.1.1.1` on daniel-box.

  # daniel-server's enp88s0 is set administratively down from minute 3, so node_exporter
  # serves no carrier series for it and only node_network_up reads 0. The `up` arm fires
  # daniel-server's rule. wlo1 losing carrier at the same time raises nothing, because no rule
  # reads the WiFi link.
  - interval: 1m
    input_series:
      - series: 'node_network_carrier{device="enp88s0", instance="daniel-server", job="node", origin="daniel-server"}'
        values: '1x2 stale'
      - series: 'node_network_up{device="enp88s0", instance="daniel-server", job="node", origin="daniel-server"}'
        values: '1x2 0x10'
      - series: 'node_network_carrier{device="wlo1", instance="daniel-server", job="node", origin="daniel-server"}'
        values: '1x2 0x10'
    alert_rule_test:
      - eval_time: 9m
        alertname: WiredLinkDown
        exp_alerts:
          - exp_labels:
              device: enp88s0
              instance: daniel-server
              job: node
              origin: daniel-server
              severity: warning
              service: daniel-server
            exp_annotations:
              summary: daniel-server's wired link enp88s0 is down, so the node runs on WiFi.
              description: >-
                enp88s0 on daniel-server has had no carrier, or has been down, for 5 minutes.
                The node routes over its WiFi fallback, which carries Longhorn replication and
                media at a fraction of the wired rate. Check the cable and the switch port,
                then run `ip link show enp88s0` and `ip route get 1.1.1.1` on daniel-server.

  # A three-minute flap, as a switch reboot leaves, reads carrier 0 at minutes 3 to 5 and
  # ends inside the 5-minute hold. The 5m evaluation sits inside the flap, so it fails if
  # the hold is dropped. The 9m evaluation shows the alert never fires after recovery.
  - interval: 1m
    input_series:
      - series: 'node_network_carrier{device="eno1", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '1x2 0x3 1x10'
      - series: 'node_network_up{device="eno1", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '1x15'
    alert_rule_test:
      - eval_time: 5m
        alertname: WiredLinkDown
        exp_alerts: []
      - eval_time: 9m
        alertname: WiredLinkDown
        exp_alerts: []

  # FanoutSlotsIdleWithFreeWork: two free issues and no batch series for 70 minutes fires at
  # the 1h hold. The same queue beside one live batch on daniel-server stays quiet, which is
  # the half that proves the `unless` arm reads the batch series at all.
  - interval: 1m
    input_series:
      - series: 'findings_issues{state="free", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '2x70'
    alert_rule_test:
      - eval_time: 30m
        alertname: FanoutSlotsIdleWithFreeWork
        exp_alerts: []
      - eval_time: 65m
        alertname: FanoutSlotsIdleWithFreeWork
        exp_alerts:
          - exp_labels:
              severity: warning
              service: daniel-box
              shadow: "true"
            exp_annotations:
              summary: Free fan-out issues have waited an hour with no batch running.
              description: >-
                findings_issues{state="free"} has been above 0 for an hour while no fan-out batch
                ran on either node. Read `uv run python scripts/dev/findings.py next` for what is
                free and `uv run python scripts/dev/fanout.py place read` for the hosts' headroom,
                then launch, or record why the queue waits (`findings.py defer`).
  - interval: 1m
    input_series:
      - series: 'findings_issues{state="free", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '2x70'
      - series: 'claude_fanout_batch_pids_current{batch="5642", instance="daniel-server", job="node", origin="daniel-server"}'
        values: '12x70'
    alert_rule_test:
      - eval_time: 65m
        alertname: FanoutSlotsIdleWithFreeWork
        exp_alerts: []

  # A FREE session on daniel-server, beside a logged-in one on daniel-box. IscsiSessionStale
  # fires for the FREE one after its 15m `for:` and never for the logged-in one. Both nodes'
  # check files stay fresh, so IscsiSessionsNotReporting stays quiet.
  - interval: 1m
    input_series:
      - series: 'homelab_iscsi_session_info{connection_state="failed", instance="daniel-server", job="node", origin="daniel-server", session="session2", state="FREE", target="iqn.2019-10.io.longhorn:pvc-1"}'
        values: '1x20'
      - series: 'homelab_iscsi_session_info{connection_state="up", instance="daniel-box", job="node", origin="daniel-box", session="session3", state="LOGGED_IN", target="iqn.2019-10.io.longhorn:pvc-2"}'
        values: '1x20'
      - series: 'homelab_check_last_run_timestamp_seconds{check="iscsi-sessions", instance="daniel-server", job="node", origin="daniel-server"}'
        values: '0+60x20'
      - series: 'homelab_check_last_run_timestamp_seconds{check="iscsi-sessions", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '0+60x20'
      - series: 'up{instance="daniel-server", job="node", origin="daniel-server"}'
        values: '1x20'
      - series: 'up{instance="daniel-box", job="node", origin="daniel-box"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: 14m
        alertname: IscsiSessionStale
        exp_alerts: []
      - eval_time: 16m
        alertname: IscsiSessionStale
        exp_alerts:
          - exp_labels:
              connection_state: failed
              instance: daniel-server
              job: node
              origin: daniel-server
              session: session2
              state: FREE
              target: iqn.2019-10.io.longhorn:pvc-1
              severity: warning
              service: daniel-server
            exp_annotations:
              summary: daniel-server holds an iSCSI session that is not logged in.
              description: >-
                session2 on daniel-server has read FREE for 15 minutes, for target
                iqn.2019-10.io.longhorn:pvc-1. The next attach of that volume on daniel-server
                fails its frontend init on `iscsiadm --logout` (error 32), and Longhorn deletes
                the pod every ~30s. Clean it up with docs/longhorn-disaster-recovery.md, "A
                stale iSCSI session blocks an attach".
      - eval_time: 16m
        alertname: IscsiSessionsNotReporting
        exp_alerts: []

  # daniel-box's check file stopped being refreshed at 0 while its exporter stays up, and
  # daniel-server's stays fresh. The stale-file arm fires once the timestamp is more than 300s old, between minutes 5 and 6.
  # The absent_over_time arm is the zero-series case's.
  - interval: 1m
    input_series:
      - series: 'homelab_check_last_run_timestamp_seconds{check="iscsi-sessions", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '0x10'
      - series: 'up{instance="daniel-box", job="node", origin="daniel-box"}'
        values: '1x10'
      - series: 'homelab_check_last_run_timestamp_seconds{check="iscsi-sessions", instance="daniel-server", job="node", origin="daniel-server"}'
        values: '0+60x10'
      - series: 'up{instance="daniel-server", job="node", origin="daniel-server"}'
        values: '1x10'
    alert_rule_test:
      - eval_time: 5m
        alertname: IscsiSessionsNotReporting
        exp_alerts: []
      - eval_time: 6m
        alertname: IscsiSessionsNotReporting
        exp_alerts:
          - exp_labels:
              check: iscsi-sessions
              instance: daniel-box
              job: node
              origin: daniel-box
              severity: warning
              service: daniel-box
            exp_annotations:
              summary: daniel-box's iSCSI session check has stopped reporting.
              description: >-
                No iscsi-sessions verdict newer than 300s reached Prometheus from daniel-box's
                textfile collector, so nothing is watching the node's iSCSI sessions. Read the
                log of the node-exporter pod's `iscsi-sessions` container on daniel-box.

  # The same frozen file behind a dead exporter: the `unless` clause leaves it to the bridge's
  # `targets` check. The group above is its control.
  - interval: 1m
    input_series:
      - series: 'homelab_check_last_run_timestamp_seconds{check="iscsi-sessions", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '0x10'
      - series: 'up{instance="daniel-box", job="node", origin="daniel-box"}'
        values: '0x10'
      - series: 'homelab_check_last_run_timestamp_seconds{check="iscsi-sessions", instance="daniel-server", job="node", origin="daniel-server"}'
        values: '0+60x10'
      - series: 'up{instance="daniel-server", job="node", origin="daniel-server"}'
        values: '1x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: IscsiSessionsNotReporting
        exp_alerts: []
  # B6's two daniel-box crons, in shadow beside their Kuma tiles. A failing verdict fires both
  # Failed rules with shadow="true" and leaves both NotReporting rules quiet.
  - interval: 1m
    input_series:
      - series: 'homelab_check_success{check="sync-artifacts", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '0x30'
      - series: 'homelab_check_last_run_timestamp_seconds{check="sync-artifacts", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '0+60x30'
      - series: 'homelab_check_success{check="claude-otel-health", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '0x30'
      - series: 'homelab_check_last_run_timestamp_seconds{check="claude-otel-health", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '0+60x30'
      - series: 'up{instance="daniel-box", job="node", origin="daniel-box"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: ArtifactsSyncFailed
        exp_alerts:
          - exp_labels:
              check: sync-artifacts
              instance: daniel-box
              job: node
              origin: daniel-box
              severity: warning
              service: daniel-box
              shadow: "true"
            exp_annotations:
              summary: The peer artifact sync on daniel-box is failing.
              description: >-
                sync-artifacts.sh has failed a peer for claude_code_artifacts_sync_alert_after_failures
                consecutive runs, so that peer's artifacts are stale in the browser. Run `journalctl -t
                sync-artifacts` on daniel-box for the peer and its streak, then ssh to the named peer.
      - eval_time: 20m
        alertname: OtlpDoorClosed
        exp_alerts:
          - exp_labels:
              check: claude-otel-health
              instance: daniel-box
              job: node
              origin: daniel-box
              severity: warning
              service: daniel-box
              shadow: "true"
            exp_annotations:
              summary: The telemetry OTLP receiver on daniel-box's loopback refuses connections.
              description: >-
                Claude Code cannot export telemetry even with every pod Ready, because the hostPort
                DNAT is an iptables rule rather than a socket. Check the otel-collector DaemonSet pod
                on daniel-box, then the portmap rule.
      - eval_time: 20m
        alertname: ArtifactsSyncNotReporting
        exp_alerts: []
      - eval_time: 20m
        alertname: OtlpDoorNotReporting
        exp_alerts: []
  # The two NotReporting rules differ by their own deadline. The files were last written at
  # minute 0, so at 20m they are 1200s old: only the 900s sync rule fires. At 40m both do.
  - interval: 1m
    input_series:
      - series: 'homelab_check_success{check="sync-artifacts", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '1x40'
      - series: 'homelab_check_last_run_timestamp_seconds{check="sync-artifacts", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '0x40'
      - series: 'homelab_check_success{check="claude-otel-health", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '1x40'
      - series: 'homelab_check_last_run_timestamp_seconds{check="claude-otel-health", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '0x40'
      - series: 'up{instance="daniel-box", job="node", origin="daniel-box"}'
        values: '1x40'
    alert_rule_test:
      - eval_time: 20m
        alertname: ArtifactsSyncNotReporting
        exp_alerts:
          - exp_labels:
              check: sync-artifacts
              instance: daniel-box
              job: node
              origin: daniel-box
              severity: warning
              service: daniel-box
              shadow: "true"
            exp_annotations: &sync_not_reporting
              summary: The peer artifact sync on daniel-box has stopped reporting.
              description: >-
                No sync-artifacts verdict newer than 900s reached Prometheus from daniel-box's
                textfile collector, so the cron stopped, or its flock is held by a hung run. Read the
                `Sync peer Claude artifacts` cron and `journalctl -t sync-artifacts`, then
                /var/lib/node-exporter-textfile/sync-artifacts.prom on the host.
      - eval_time: 20m
        alertname: OtlpDoorNotReporting
        exp_alerts: []
      - eval_time: 40m
        alertname: OtlpDoorNotReporting
        exp_alerts:
          - exp_labels:
              check: claude-otel-health
              instance: daniel-box
              job: node
              origin: daniel-box
              severity: warning
              service: daniel-box
              shadow: "true"
            exp_annotations: &otlp_not_reporting
              summary: The telemetry OTLP-door check on daniel-box has stopped reporting.
              description: >-
                No claude-otel-health verdict newer than 1500s reached Prometheus from daniel-box's
                textfile collector, so nothing is watching the OTLP door. Read the `Claude Code
                telemetry health` cron and `journalctl -t claude-otel-health`, then
                /var/lib/node-exporter-textfile/claude-otel-health.prom on the host.
  # Zero-series case: no sample has ever arrived, so both rules fire through absent_over_time,
  # carrying only the equality matchers' `check` and `origin`.
  - interval: 1m
    input_series:
      - series: 'up{instance="daniel-box", job="node", origin="daniel-box"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 30m
        alertname: ArtifactsSyncNotReporting
        exp_alerts:
          - exp_labels:
              check: sync-artifacts
              origin: daniel-box
              severity: warning
              service: daniel-box
              shadow: "true"
            exp_annotations: *sync_not_reporting
      - eval_time: 30m
        alertname: OtlpDoorNotReporting
        exp_alerts:
          - exp_labels:
              check: claude-otel-health
              origin: daniel-box
              severity: warning
              service: daniel-box
              shadow: "true"
            exp_annotations: *otlp_not_reporting
  # A dead node exporter is the `targets` check's page, so both NotReporting rules stay quiet.
  - interval: 1m
    input_series:
      - series: 'up{instance="daniel-box", job="node", origin="daniel-box"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 30m
        alertname: ArtifactsSyncNotReporting
        exp_alerts: []
      - eval_time: 30m
        alertname: OtlpDoorNotReporting
        exp_alerts: []

  # daniel-pi's AIDE check writes a fresh red verdict. AideCheckFailed fires for daniel-pi from
  # the `node-pi` job, and AideCheckNotReporting stays quiet for it while the file is fresh.
  - interval: 1m
    input_series:
      - series: 'homelab_check_success{check="aide-check", instance="daniel-pi", job="node-pi", origin="daniel-pi"}'
        values: '0x10'
      - series: 'homelab_check_last_run_timestamp_seconds{check="aide-check", instance="daniel-pi", job="node-pi", origin="daniel-pi"}'
        values: '0+60x10'
      - series: 'up{instance="daniel-pi", job="node-pi", origin="daniel-pi"}'
        values: '1x10'
    alert_rule_test:
      - eval_time: 5m
        alertname: AideCheckFailed
        exp_alerts:
          - exp_labels:
              check: aide-check
              instance: daniel-pi
              job: node-pi
              origin: daniel-pi
              severity: warning
              service: daniel-pi
              shadow: "true"
            exp_annotations:
              summary: daniel-pi's weekly AIDE check did not complete.
              description: >-
                aide-check.sh on daniel-pi ended with status=down: AIDE exited with an error and
                checked nothing, or the previous week's run still held the lock. Differences
                from the baseline read up. Run `journalctl -t aide-check` and `journalctl -t
                aide` on daniel-pi.

  # No AIDE file on any host, and daniel-pi's exporter is down. The absent_over_time arm fires
  # for the two k3s nodes, and daniel-pi's rule leaves its dead exporter to the `targets` check
  # because its `unless` clause reads `node-pi`, not `node`.
  - interval: 1m
    input_series:
      - series: 'up{instance="daniel-box", job="node", origin="daniel-box"}'
        values: '1x10'
      - series: 'up{instance="daniel-server", job="node", origin="daniel-server"}'
        values: '1x10'
      - series: 'up{instance="daniel-pi", job="node-pi", origin="daniel-pi"}'
        values: '0x10'
    alert_rule_test:
      - eval_time: 5m
        alertname: AideCheckNotReporting
        exp_alerts:
          - exp_labels:
              check: aide-check
              origin: daniel-box
              severity: warning
              service: daniel-box
              shadow: "true"
            exp_annotations:
              summary: daniel-box's weekly AIDE check has stopped reporting.
              description: >-
                No aide-check verdict newer than 626400s reached Prometheus from daniel-box's
                textfile collector, so nothing confirms the file-integrity scan still runs. Read
                the `Weekly AIDE file integrity check` cron and `journalctl -t aide-check`, then
                /var/lib/node-exporter-textfile/aide-check.prom on the host.
          - exp_labels:
              check: aide-check
              origin: daniel-server
              severity: warning
              service: daniel-server
              shadow: "true"
            exp_annotations:
              summary: daniel-server's weekly AIDE check has stopped reporting.
              description: >-
                No aide-check verdict newer than 626400s reached Prometheus from daniel-server's
                textfile collector, so nothing confirms the file-integrity scan still runs. Read
                the `Weekly AIDE file integrity check` cron and `journalctl -t aide-check`, then
                /var/lib/node-exporter-textfile/aide-check.prom on the host.

  # daniel-server's rkhunter file holds a verdict taken 611000s before time 0, so the test runs
  # minutes rather than a week. RkhunterScanNotReporting's first arm stays quiet at 10m
  # (611600s old) and fires at 20m, past the 612000s deadline. The verdict was green, so
  # RkhunterScanFailed stays quiet. The other two exporters read down, which keeps their hosts'
  # absent arms out of the case.
  - interval: 1m
    input_series:
      - series: 'up{instance="daniel-box", job="node", origin="daniel-box"}'
        values: '0x25'
      - series: 'up{instance="daniel-pi", job="node-pi", origin="daniel-pi"}'
        values: '0x25'
      - series: 'homelab_check_success{check="rkhunter-check", instance="daniel-server", job="node", origin="daniel-server"}'
        values: '1x25'
      - series: 'homelab_check_last_run_timestamp_seconds{check="rkhunter-check", instance="daniel-server", job="node", origin="daniel-server"}'
        values: '-611000x25'
      - series: 'up{instance="daniel-server", job="node", origin="daniel-server"}'
        values: '1x25'
    alert_rule_test:
      - eval_time: 10m
        alertname: RkhunterScanNotReporting
        exp_alerts: []
      - eval_time: 20m
        alertname: RkhunterScanFailed
        exp_alerts: []
      - eval_time: 20m
        alertname: RkhunterScanNotReporting
        exp_alerts:
          - exp_labels:
              check: rkhunter-check
              instance: daniel-server
              job: node
              origin: daniel-server
              severity: warning
              service: daniel-server
              shadow: "true"
            exp_annotations:
              summary: daniel-server's weekly rkhunter scan has stopped reporting.
              description: >-
                No rkhunter-check verdict newer than 612000s reached Prometheus from
                daniel-server's textfile collector, so nothing confirms the malware scan still
                runs. Read the `Weekly rkhunter malware scan` cron and `journalctl -t
                rkhunter-check`, then /var/lib/node-exporter-textfile/rkhunter-check.prom on the
                host.

  # A check no per-check rule names stops writing at time 0 with a 600s deadline. HostCheckOverdue
  # stays quiet at 9m and fires at 11m from its own deadline series. A pod exporter's check with
  # the same origin and an older timestamp is pods.yaml's to page, so it never appears here.
  - interval: 1m
    input_series:
      - series: 'homelab_check_last_run_timestamp_seconds{check="new-producer", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '0x15'
      - series: 'homelab_check_deadline_seconds{check="new-producer", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '600x15'
      - series: 'homelab_check_last_run_timestamp_seconds{check="cycle", instance="10.0.0.9:9100", job="autofix-bridge", origin="daniel-box"}'
        values: '0x15'
      - series: 'homelab_check_deadline_seconds{check="cycle", instance="10.0.0.9:9100", job="autofix-bridge", origin="daniel-box"}'
        values: '60x15'
      - series: 'up{instance="daniel-box", job="node", origin="daniel-box"}'
        values: '1x15'
    alert_rule_test:
      - eval_time: 9m
        alertname: HostCheckOverdue
        exp_alerts: []
      - eval_time: 11m
        alertname: HostCheckOverdue
        exp_alerts:
          - exp_labels:
              check: new-producer
              origin: daniel-box
              severity: warning
              service: daniel-box
              shadow: "true"
            exp_annotations:
              summary: daniel-box's new-producer check is past its own deadline.
              description: >-
                The new-producer textfile on daniel-box holds a verdict older than the
                homelab_check_deadline_seconds it declares, so its producer stopped writing.
                Read /var/lib/node-exporter-textfile/new-producer.prom on the host, then the
                journal of the cron or timer that writes it.

  # daniel-pi's collector fails from minute 3. Its own TextfileCollectorError fires after 10m.
  - interval: 1m
    input_series:
      - series: 'node_textfile_scrape_error{instance="daniel-pi", job="node-pi", origin="daniel-pi"}'
        values: '0x2 1x20'
    alert_rule_test:
      - eval_time: 14m
        alertname: TextfileCollectorError
        exp_alerts:
          - exp_labels:
              instance: daniel-pi
              job: node-pi
              origin: daniel-pi
              severity: warning
              service: daniel-pi
              shadow: "true"
            exp_annotations:
              summary: node_exporter on daniel-pi cannot read a textfile.
              description: >-
                node_exporter's textfile collector on daniel-pi has failed for 10 minutes, so a
                file in /var/lib/node-exporter-textfile is malformed or unreadable, and every
                series in it is gone. Read node_textfile_mtime_seconds for the files it still
                sees, and `journalctl -u node_exporter` on daniel-pi.

  # The Pi's compose run reads 1, then 0 from minute 3. ComposeUpFailed fires with no hold.
  - interval: 1m
    input_series:
      - series: 'homelab_compose_up_result{host="daniel-pi", instance="daniel-pi", job="node-pi", origin="daniel-pi", sha="abcdef012345"}'
        values: '1x2 0x5'
    alert_rule_test:
      - eval_time: 2m
        alertname: ComposeUpFailed
        exp_alerts: []
      - eval_time: 4m
        alertname: ComposeUpFailed
        exp_alerts:
          - exp_labels:
              host: daniel-pi
              instance: daniel-pi
              job: node-pi
              origin: daniel-pi
              sha: abcdef012345
              severity: warning
              service: daniel-pi
              shadow: "true"
            exp_annotations:
              summary: The Pi's last Compose run did not bring the project up.
              description: >-
                compose-run on daniel-pi wrote homelab_compose_up_result 0 at package
                abcdef012345: a key check, the config check, an image pull, compose-adopt or
                `docker compose up --wait` failed. Read `journalctl -u homelab-compose` and
                `docker ps -a` on daniel-pi.

  # daniel-box first owed a reboot 690000s before time 0, and a later package change rewrites
  # its reconcile file every minute without moving that time. It is quiet at 10m (690600s, under
  # the 691200s bound) and fires at 30m. daniel-server's 1 dates from before its last boot, so
  # that boot already cleared it, and its rule stays quiet.
  - interval: 1m
    input_series:
      - series: 'homelab_host_reboot_pending{host="daniel-box", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '1x35'
      - series: 'homelab_host_reboot_pending_since_seconds{host="daniel-box", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '-690000x35'
      - series: 'node_textfile_mtime_seconds{file="/textfile/homelab_host_reconcile.prom", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '0+60x35'
      - series: 'node_boot_time_seconds{instance="daniel-box", job="node", origin="daniel-box"}'
        values: '-1000000x35'
      - series: 'homelab_host_reboot_pending{host="daniel-server", instance="daniel-server", job="node", origin="daniel-server"}'
        values: '1x35'
      - series: 'homelab_host_reboot_pending_since_seconds{host="daniel-server", instance="daniel-server", job="node", origin="daniel-server"}'
        values: '-690000x35'
      - series: 'node_boot_time_seconds{instance="daniel-server", job="node", origin="daniel-server"}'
        values: '-600000x35'
    alert_rule_test:
      - eval_time: 10m
        alertname: HostRebootOverdue
        exp_alerts: []
      - eval_time: 30m
        alertname: HostRebootOverdue
        exp_alerts:
          - exp_labels:
              host: daniel-box
              instance: daniel-box
              job: node
              origin: daniel-box
              severity: warning
              service: daniel-box
            exp_annotations:
              summary: daniel-box has owed a reboot for more than 8 days.
              description: >-
                Reconcile recorded a reboot-class package change on daniel-box more than 8 days
                ago, and the host has not booted since, so the weekly reboot did not run or was
                refused. Read `journalctl -t weekly-restart` on daniel-box and
                docs/host-packages.md, "Reboot-pending and activation-pending", then reboot the
                host.

  # daniel-box's rkhunter scan writes a fresh red verdict, and RkhunterScanFailed fires for it.
  - interval: 1m
    input_series:
      - series: 'homelab_check_success{check="rkhunter-check", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '0x10'
    alert_rule_test:
      - eval_time: 5m
        alertname: RkhunterScanFailed
        exp_alerts:
          - exp_labels:
              check: rkhunter-check
              instance: daniel-box
              job: node
              origin: daniel-box
              severity: warning
              service: daniel-box
              shadow: "true"
            exp_annotations:
              summary: daniel-box's weekly rkhunter scan warned or did not complete.
              description: >-
                rkhunter-check.sh on daniel-box ended with status=down: rkhunter raised a
                warning, a suspect file or a possible rootkit, or the scan wrote no summary. An
                account change clears when the script is run again by hand. Read
                /var/log/rkhunter.log and `journalctl -t rkhunter-check` on daniel-box.
