              origin: daniel-box
            exp_annotations:
              summary: The renovate notifier on daniel-box has not completed a run in 36 hours.
              description: 'No renovate-notify verdict newer than 36 hours reached Prometheus from daniel-box''s
                textfile collector: the daily 13:00 timer did not fire or the run failed, and OnFailure
                will also have posted to Discord. It says nothing about Renovate itself. Read `systemctl
                status renovate-notify.timer` and `journalctl -u renovate-notify`.'
      - eval_time: 900h
        alertname: RenovateAgentNotReporting
        exp_alerts:
          - exp_labels:
              severity: warning
              service: daniel-box
              shadow: 'true'
              check: renovate-agent
              origin: daniel-box
            exp_annotations:
              summary: The renovate agent on daniel-box has not completed a clean run in 28 hours.
              description: 'No renovate-agent verdict newer than 28 hours reached Prometheus from daniel-box''s
                textfile collector: the daily 06:00 timer did not fire, the run crashed, or a worktree-blocked
                tick skipped it. Read `systemctl status renovate-agent.timer` and `journalctl -u renovate-agent`.'
