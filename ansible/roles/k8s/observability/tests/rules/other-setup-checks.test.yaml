# promtool unit tests for files/rules/other-setup-checks.yaml. Run with
# `scripts/validate/alert_tools.sh promtool test rules <this file>`; the validate-alert-rules
# hook runs it on every commit that touches the rules.
#
# Generated cases, one block per rule. A NotReporting case freezes the timestamp series at 0,
# which promtool's `time()` ages one second per second, so it sits just under its deadline at the
# first eval time and just over it at the second. The 10-minute producers step by the minute and
# the daily, monthly and renovate ones by the hour, so a sample is on every evaluation and the 5m
# lookback stays out of the arithmetic. A second case per NotReporting rule adds a dead `node`
# exporter (up == 0) and expects silence, because the `targets` check pages that. The input
# series carry the labels the `node` scrape job adds. A NotReporting rule fires with one of two
# label sets: its first arm keeps the series' labels, `job` and `instance` included, and its
# absent_over_time arm carries only the equality matchers' `check` and `origin`.
rule_files:
  - ../../files/rules/other-setup-checks.yaml
evaluation_interval: 1h
tests:
  - interval: 1h
    input_series: []
    alert_rule_test:
      - eval_time: 900h
        alertname: UpsSecondaryFailed
        exp_alerts: []
      - eval_time: 900h
        alertname: UpsSecondaryNotReporting
        exp_alerts:
          - exp_labels:
              severity: critical
              service: daniel-box
              shadow: 'true'
              check: ups-secondary-health
              origin: daniel-box
            exp_annotations:
              summary: daniel-box's UPS secondary watchdog has stopped reporting.
              description: No ups-secondary-health verdict newer than 25 minutes reached Prometheus from daniel-box's
                textfile collector, so nothing confirms the secondary upsmon can still hear upsd. Read
                the `UPS secondary watchdog` cron and the `ups-secondary-health` syslog tag, then /var/lib/node-exporter-textfile/ups-secondary-health.prom
                on the host.
          - exp_labels:
              severity: critical
              service: daniel-server
              shadow: 'true'
              check: ups-secondary-health
              origin: daniel-server
            exp_annotations:
              summary: daniel-server's UPS secondary watchdog has stopped reporting.
              description: No ups-secondary-health verdict newer than 25 minutes reached Prometheus from daniel-server's
                textfile collector, so nothing confirms the secondary upsmon can still hear upsd. Read
                the `UPS secondary watchdog` cron and the `ups-secondary-health` syslog tag, then /var/lib/node-exporter-textfile/ups-secondary-health.prom
                on the host.
      - eval_time: 900h
        alertname: FakeRemuxScanFailed
        exp_alerts: []
      - eval_time: 900h
        alertname: FakeRemuxScanNotReporting
        exp_alerts:
          - exp_labels:
              severity: warning
              service: daniel-box
              shadow: 'true'
              check: fake-remux-scan
              origin: daniel-box
            exp_annotations:
              summary: The fake-remux heartbeat on daniel-box has stopped reporting the scan.
              description: No fake-remux-scan verdict newer than 25 minutes reached Prometheus from daniel-box's
                textfile collector, so nothing confirms the scan's state file is being read. Read the
                `fake-remux health` cron and the `fake-remux-health` syslog tag, then /var/lib/node-exporter-textfile/fake-remux-scan.prom
                on the host.
      - eval_time: 900h
        alertname: FakeRemuxReplaceFailed
        exp_alerts: []
      - eval_time: 900h
        alertname: FakeRemuxReplaceNotReporting
        exp_alerts:
          - exp_labels:
              severity: warning
              service: daniel-box
              shadow: 'true'
