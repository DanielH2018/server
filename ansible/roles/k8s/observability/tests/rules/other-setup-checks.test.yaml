              origin: daniel-box
            exp_annotations:
              summary: The fake-remux heartbeat on daniel-box has stopped reporting the reconciler.
              description: No fake-remux-replace verdict newer than 25 minutes reached Prometheus from daniel-box's
                textfile collector, so nothing confirms the reconciler's state file is being read. Read
                the `fake-remux health` cron and the `fake-remux-health` syslog tag, then /var/lib/node-exporter-textfile/fake-remux-replace.prom
                on the host.
