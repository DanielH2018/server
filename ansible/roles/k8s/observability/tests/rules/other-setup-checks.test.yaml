            exp_annotations:
              summary: The etcd drill's egress fence leg on daniel-server has stopped reporting.
              description: No etcd-restore-drill-egress-fence verdict newer than 35 days (35 days) reached
                Prometheus from daniel-server's textfile collector. A run that dies before the fence leg
