              summary: The monthly etcd restore drill on daniel-server has stopped reporting.
              description: No etcd-restore-drill-vm verdict newer than 35 days (35 days) reached Prometheus
                from daniel-server's textfile collector, so no drill has run since the last 1st-of-month
                cron slot plus four days of slack. Read the `Full etcd restore drill in a throwaway guest`
                cron on daniel-server, cron.log under /var/log/etcd-restore-drill, then /var/lib/node-exporter-textfile/etcd-restore-drill-vm.prom
                on the host.
      - eval_time: 900h
        alertname: EtcdRestoreDrillEgressFenceFailed
        exp_alerts: []
      - eval_time: 900h
        alertname: EtcdRestoreDrillEgressFenceNotReporting
