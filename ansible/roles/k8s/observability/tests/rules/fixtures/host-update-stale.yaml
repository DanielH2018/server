# The HostUpdateStale rule for a one-host fixture map, {daniel-pi: {job: node-pi,
# limit_seconds: 11400}}. files/rules/host-checks.yaml carries one rule of this shape per entry
# of observability_expected_hosts, which is empty until H3.9c, so host-checks.test.yaml loads
# this file beside it to give the rule its firing and silent cases.
# ansible/tests/services/test_host_plane_rule_literals.py holds this file, and every shipped
# HostUpdateStale rule, equal to the rule it builds from a map entry. Never shipped: only
# observability_rule_groups' files reach Prometheus.
#
# The first arm reads a success timestamp past the limit. The second reads one that is absent
# while the host's exporter is up: a failed scrape marks every series of the target stale, and
# a dead exporter is not a stale host.
groups:
  - name: host-update-stale-fixture
    rules:
      - alert: HostUpdateStale
        expr: |
          (
              time() - homelab_host_update_success_timestamp_seconds{job="node-pi",origin="daniel-pi"} > 11400
            or
              (
                  absent(homelab_host_update_success_timestamp_seconds{job="node-pi",origin="daniel-pi"})
                and on (job, origin)
                  up{job="node-pi",origin="daniel-pi"} == 1
              )
          )
        labels:
          severity: critical
          service: daniel-pi
        annotations:
          summary: daniel-pi has had no successful homelab update for 11400s.
          description: >-
            No homelab-updater run on daniel-pi has succeeded in 11400s, or its exporter is up
            and serves no success timestamp. A failed fetch, a stopped homelab-apt-repo.service,
            a firewall rule, a keyring mismatch and a stopped timer each leave it stale. Read
            `systemctl status homelab-updater.timer` and `journalctl -u homelab-updater` on
            daniel-pi, and docs/host-packages.md, "Host-plane pages".
