              summary: Prometheus holds fewer than 11 DaemonSets from kube-state-metrics.
              description: "11 is the estate's DaemonSet count, fixed in the rule, so a DaemonSet has gone or kube-state-metrics stopped collecting daemonsets. Held 5 minutes where the bridge paged one sample."

  # kube_node_status_allocatable has no series. The GPU alert cannot tell this from a healthy
  # cluster, so it stays silent and the node alert pages instead.
  - interval: 1m
    input_series: [*unavailable, *daemonset_unavailable, *spec, *available, *updated, *restarts, *pod_owner, *replicaset_owner, *deployment_labels, *daemonset_labels]
