              summary: Prometheus holds no kube_node_status_allocatable series.
              description: kube-state-metrics is not collecting nodes, so K8sExtendedResourceMissing cannot see the GPU resource. The bridge read this as INERT; this rule pages it.
      - alertname: K8sExtendedResourceMissing
        eval_time: 6m
        exp_alerts: []

