# promtool unit tests for files/rules/scrape-targets.yaml. Run with
# `scripts/validate/alert_tools.sh promtool test rules <this file>`; the validate-alert-rules
# hook runs it on every commit that touches the rules.
rule_files:
  - ../../files/rules/scrape-targets.yaml
evaluation_interval: 1m
tests:
  # The zero-series case: `up` is empty, so the floor rule fires once its 10m hold has passed.
  # Every ScrapeTargetDown rule evaluates to nothing on the same input.
  - interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 9m
        alertname: ScrapeTargetsMissing
        exp_alerts: []
      - eval_time: 11m
        alertname: ScrapeTargetsMissing
        exp_alerts:
          - exp_labels:
              severity: warning
              service: observability
              shadow: "true"
            exp_annotations:
              summary: Prometheus sees too few scrape targets.
              description: >-
                Fewer than 3 scrape targets outside daniel-server, or none on it, have reported for
                10 minutes. The metrics estate is missing, so target health is unknown rather than
                fine. Read prometheus_tsdb_head_series, then daniel-server's remote write.
      - eval_time: 11m
        alertname: ScrapeTargetDown
        exp_alerts: []

  # Enough targets: three outside daniel-server and one on it, so the floor stays quiet.
  - interval: 1m
    input_series:
      - series: 'up{job="prometheus", instance="localhost:9090"}'
        values: '1x30'
      - series: 'up{job="alertmanager", instance="alertmanager:9093"}'
        values: '1x30'
      - series: 'up{job="node", origin="daniel-box", instance="daniel-box"}'
        values: '1x30'
      - series: 'up{job="node", origin="daniel-server", instance="daniel-server"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 30m
        alertname: ScrapeTargetsMissing
        exp_alerts: []

  # Two targets outside daniel-server is under the floor of 3.
  - interval: 1m
    input_series:
      - series: 'up{job="prometheus", instance="localhost:9090"}'
        values: '1x30'
      - series: 'up{job="alertmanager", instance="alertmanager:9093"}'
        values: '1x30'
      - series: 'up{job="node", origin="daniel-server", instance="daniel-server"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: ScrapeTargetsMissing
        exp_alerts:
          - exp_labels:
              severity: warning
              service: observability
              shadow: "true"
            exp_annotations:
              summary: Prometheus sees too few scrape targets.
              description: >-
                Fewer than 3 scrape targets outside daniel-server, or none on it, have reported for
                10 minutes. The metrics estate is missing, so target health is unknown rather than
                fine. Read prometheus_tsdb_head_series, then daniel-server's remote write.

  # daniel-server's series are gone while the cluster's three remain: the second floor.
  - interval: 1m
    input_series:
      - series: 'up{job="prometheus", instance="localhost:9090"}'
        values: '1x30'
      - series: 'up{job="alertmanager", instance="alertmanager:9093"}'
        values: '1x30'
      - series: 'up{job="node", origin="daniel-box", instance="daniel-box"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: ScrapeTargetsMissing
        exp_alerts:
          - exp_labels:
              severity: warning
              service: observability
              shadow: "true"
            exp_annotations:
              summary: Prometheus sees too few scrape targets.
              description: >-
                Fewer than 3 scrape targets outside daniel-server, or none on it, have reported for
                10 minutes. The metrics estate is missing, so target health is unknown rather than
                fine. Read prometheus_tsdb_head_series, then daniel-server's remote write.

  # Alertmanager's failed scrape. M1's AlertmanagerMetricsMissing leaves it to this rule, and the C7 gate for `observability` reads its service.
  - interval: 1m
    input_series:
      - series: 'up{job="alertmanager", instance="alertmanager.observability.svc:9093"}'
        values: '1x2 0x20'
    alert_rule_test:
      - eval_time: 9m
        alertname: ScrapeTargetDown
        exp_alerts: []
      - eval_time: 14m
        alertname: ScrapeTargetDown
        exp_alerts:
          - exp_labels:
              job: alertmanager
              instance: alertmanager.observability.svc:9093
              severity: warning
              service: observability
              shadow: "true"
            exp_annotations:
              summary: Prometheus cannot scrape the alertmanager target alertmanager.observability.svc:9093.
              description: >-
                alertmanager.observability.svc:9093 of job alertmanager has failed its scrape
                for 10 minutes, so its exporter is down or unreachable from Prometheus and its
                series have gone stale. Read the exporter pod's events and log, or the host's
                unit for a static target.

  # The homelab Loki's failed scrape, which LokiHomelabDown covers until Cutover-b deletes it.
  - interval: 1m
    input_series:
      - series: 'up{job="loki-homelab", instance="loki-homelab.homelab.svc:3100"}'
        values: '1x2 0x20'
    alert_rule_test:
      - eval_time: 9m
        alertname: ScrapeTargetDown
        exp_alerts: []
      - eval_time: 14m
        alertname: ScrapeTargetDown
        exp_alerts:
          - exp_labels:
              job: loki-homelab
              instance: loki-homelab.homelab.svc:3100
              severity: warning
              service: loki-homelab
              shadow: "true"
            exp_annotations:
              summary: Prometheus cannot scrape the loki-homelab target loki-homelab.homelab.svc:3100.
              description: >-
                loki-homelab.homelab.svc:3100 of job loki-homelab has failed its scrape for 10
                minutes, so its exporter is down or unreachable from Prometheus and its series
                have gone stale. Read the exporter pod's events and log, or the host's unit for
                a static target.

  # autofix-bridge's check exporter (M6 batch B7): its own rule names the service, and the
  # catch-all excludes the job, so exactly one rule pages it.
  - interval: 1m
    input_series:
      - series: 'up{job="autofix-bridge", instance="autofix-bridge.homelab.svc:9183"}'
        values: '1x2 0x20'
    alert_rule_test:
      - eval_time: 9m
        alertname: ScrapeTargetDown
        exp_alerts: []
      - eval_time: 14m
        alertname: ScrapeTargetDown
        exp_alerts:
          - exp_labels:
              job: autofix-bridge
              instance: autofix-bridge.homelab.svc:9183
              severity: warning
              service: autofix-bridge
              shadow: "true"
            exp_annotations:
              summary: Prometheus cannot scrape the autofix-bridge target autofix-bridge.homelab.svc:9183.
              description: >-
                autofix-bridge.homelab.svc:9183 of job autofix-bridge has failed its scrape for 10
                minutes, so its exporter is down or unreachable from Prometheus and its series
                have gone stale. Read the exporter pod's events and log, or the host's unit for
                a static target.

  # The exporter's failed scrape. The target carries service=homepage, and the rule's literal replaces it.
  - interval: 1m
    input_series:
      - series: 'up{job="blackbox-ingress", instance="blackbox-exporter.homelab.svc:9115", service="homepage", page_tier="critical"}'
        values: '1x2 0x20'
    alert_rule_test:
      - eval_time: 9m
        alertname: ScrapeTargetDown
        exp_alerts: []
      - eval_time: 14m
        alertname: ScrapeTargetDown
        exp_alerts:
          - exp_labels:
              job: blackbox-ingress
              instance: blackbox-exporter.homelab.svc:9115
              page_tier: critical
              severity: warning
              service: blackbox-exporter
              shadow: "true"
            exp_annotations:
              summary: Prometheus cannot scrape the blackbox-ingress target blackbox-exporter.homelab.svc:9115.
              description: >-
                blackbox-exporter.homelab.svc:9115 of job blackbox-ingress has failed its scrape
                for 10 minutes, so its exporter is down or unreachable from Prometheus and its
                series have gone stale. Read the exporter pod's events and log, or the host's
                unit for a static target.

  # A job no rule names: the catch-all pages it with service="unmapped", so a new scrape job
  # is never exempt.
  - interval: 1m
    input_series:
      - series: 'up{job="brand-new-exporter", instance="new:9100"}'
        values: '1x2 0x20'
    alert_rule_test:
      - eval_time: 14m
        alertname: ScrapeTargetDown
        exp_alerts:
          - exp_labels:
              job: brand-new-exporter
              instance: new:9100
              severity: warning
              service: unmapped
              shadow: "true"
            exp_annotations:
              summary: Prometheus cannot scrape the brand-new-exporter target new:9100.
              description: >-
                new:9100 of job brand-new-exporter has failed its scrape for 10 minutes, so its
                exporter is down or unreachable from Prometheus and its series have gone stale.
                Read the exporter pod's events and log, or the host's unit for a static target.

  # A scrape gap shorter than the 10m hold, as a rolling pod leaves, pages nobody.
  - interval: 1m
    input_series:
      - series: 'up{job="flux", instance="flux:8080"}'
        values: '1x5 0x5 1x20'
    alert_rule_test:
      - eval_time: 30m
        alertname: ScrapeTargetDown
        exp_alerts: []
