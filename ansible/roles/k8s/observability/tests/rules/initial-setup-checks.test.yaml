  - interval: 1h
    input_series:
      - series: 'homelab_check_last_run_timestamp_seconds{check="secret-rotation-audit", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '0+3600x1 stale'
      - series: 'up{instance="daniel-box", job="node", origin="daniel-box"}'
        values: '1x31'
    alert_rule_test:
      - eval_time: 25h
        alertname: SecretRotationAuditNotReporting
        exp_alerts: []
      - eval_time: 29h
        alertname: SecretRotationAuditNotReporting
        exp_alerts:
          - exp_labels: {check: secret-rotation-audit, origin: daniel-box, severity: warning, service: daniel-box, shadow: "true"}
            exp_annotations:
              summary: daniel-box's secret-rotation audit has stopped reporting.
              description: >-
                No secret-rotation-audit verdict newer than 25 hours reached Prometheus from
                daniel-box's textfile collector, so nothing confirms secret rotation is being
                audited. Read `systemctl status kuma-check-secret-rotation-audit` on daniel-box,
