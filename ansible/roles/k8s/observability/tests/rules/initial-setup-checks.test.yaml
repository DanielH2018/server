# promtool unit tests for files/rules/initial-setup-checks.yaml. Run with
# `scripts/validate/alert_tools.sh promtool test rules <this file>`; the validate-alert-rules
# hook runs it on every commit that touches the rules.
#
# The longest deadline is 626400s (a week and six hours), so the cases step an hour at a time:
# `evaluation_interval` and every input series use 1h, which puts a sample on each evaluation and
# keeps the 5m lookback out of the arithmetic. The input series carry the labels the `node`
# scrape job adds. promtool's `time()` is the evaluation time in seconds from 0, so a frozen
# timestamp series stays at 0 and a fresh one reads 3600 x the hour index (`0+3600xN`).
#
# A NotReporting rule fires with one of two label sets. Its first arm keeps the series' labels,
# `job` and `instance` included. Its absent_over_time arm carries only the equality matchers'
# `check` and `origin`.
rule_files:
  - ../../files/rules/initial-setup-checks.yaml
evaluation_interval: 1h
tests:
  # The zero-series case: no input at all, so no verdict has existed for longer than any
  # deadline. Every NotReporting rule fires through absent_over_time, and no Failed rule has a
  # series to read.
  - interval: 1h
    input_series: []
    alert_rule_test:
      - eval_time: 200h
        alertname: DocsRefreshNotReporting
        exp_alerts:
          - exp_labels: {check: docs-refresh, origin: daniel-box, severity: warning, service: daniel-box, shadow: "true"}
            exp_annotations:
              summary: daniel-box's generated-docs refresh has stopped reporting.
              description: >-
                No docs-refresh verdict newer than 13 hours reached Prometheus from daniel-box's
                textfile collector, so nothing confirms the generated docs are refreshing. Read
                the `Refresh generated docs` cron and the `docs-refresh` syslog tag, then
                /var/lib/node-exporter-textfile/docs-refresh.prom on the host.
      - eval_time: 200h
        alertname: DocsRefreshFailed
        exp_alerts: []
      - eval_time: 200h
        alertname: EvalSweepNotReporting
        exp_alerts:
          - exp_labels: {check: eval-run, origin: daniel-box, severity: warning, service: daniel-box, shadow: "true"}
            exp_annotations:
              summary: daniel-box's weekly eval sweep has stopped reporting.
              description: >-
                No eval-run verdict newer than 7 days 6 hours reached Prometheus from daniel-box's
                textfile collector, so nothing confirms the eval sweep is running. Read the
                `Homelab eval sweep` cron and the `eval-run` syslog tag, then
                /var/lib/node-exporter-textfile/eval-run.prom on the host.
      - eval_time: 200h
        alertname: EvalSweepFailed
        exp_alerts: []
      - eval_time: 200h
        alertname: SecretRotationAuditNotReporting
        exp_alerts:
          - exp_labels: {check: secret-rotation-audit, origin: daniel-box, severity: warning, service: daniel-box, shadow: "true"}
            exp_annotations:
              summary: daniel-box's secret-rotation audit has stopped reporting.
              description: >-
                No secret-rotation-audit verdict newer than 25 hours reached Prometheus from
                daniel-box's textfile collector, so nothing confirms secret rotation is being
                audited. Read `systemctl status kuma-check-secret-rotation-audit` on daniel-box,
                then /var/lib/node-exporter-textfile/secret-rotation-audit.prom on the host.
      - eval_time: 200h
        alertname: SecretRotationAuditFailed
        exp_alerts: []
      - eval_time: 200h
        alertname: SetupDriftNotReporting
        exp_alerts:
          - exp_labels: {check: setup-drift-check, origin: daniel-server, severity: warning, service: daniel-server, shadow: "true"}
            exp_annotations:
              summary: daniel-server's setup-drift check has stopped reporting.
              description: >-
                No setup-drift-check verdict newer than 25 hours reached Prometheus from
                daniel-server's textfile collector, so nothing confirms the setup plane is being
                compared with the repo. Read `systemctl status kuma-check-setup-drift` on
                daniel-server, then /var/lib/node-exporter-textfile/setup-drift-check.prom on
                the host.
      - eval_time: 200h
        alertname: SetupDriftFailed
        exp_alerts: []
      - eval_time: 200h
        alertname: LokiReadRouteNotReporting
        exp_alerts:
          - exp_labels: {check: loki-read-route-health, origin: daniel-box, severity: warning, service: daniel-box, shadow: "true"}
            exp_annotations:
              summary: daniel-box's Loki read-route witness has stopped reporting.
              description: >-
                No loki-read-route-health verdict newer than 2 hours reached Prometheus from
                daniel-box's textfile collector, so nothing confirms the Loki read route is
                being witnessed. Read `systemctl status kuma-check-loki-read-route` on
                daniel-box, then /var/lib/node-exporter-textfile/loki-read-route-health.prom on
                the host.
          - exp_labels: {check: loki-read-route-health, origin: daniel-server, severity: warning, service: daniel-server, shadow: "true"}
            exp_annotations:
              summary: daniel-server's Loki read-route witness has stopped reporting.
              description: >-
                No loki-read-route-health verdict newer than 2 hours reached Prometheus from
                daniel-server's textfile collector, so nothing confirms the Loki read route is
                being witnessed. Read `systemctl status kuma-check-loki-read-route` on
                daniel-server, then /var/lib/node-exporter-textfile/loki-read-route-health.prom
                on the host.
      - eval_time: 200h
        alertname: LokiReadRouteFailed
        exp_alerts: []

  # Each Failed rule: a verdict of 0 fires it with the host's labels, and a verdict of 1 does
  # not. The first group is the control for the second.
  - interval: 1h
    input_series:
      - series: 'homelab_check_success{check="docs-refresh", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '1x3 0x3'
    alert_rule_test:
      - eval_time: 2h
        alertname: DocsRefreshFailed
        exp_alerts: []
      - eval_time: 4h
        alertname: DocsRefreshFailed
        exp_alerts:
          - exp_labels: {check: docs-refresh, instance: daniel-box, job: node, origin: daniel-box, severity: warning, service: daniel-box, shadow: "true"}
            exp_annotations:
              summary: daniel-box's generated-docs refresh reported a failure.
              description: >-
                docs-refresh.sh on daniel-box ended with status=down: a generator, the
                shard-weight measurement or the site build failed, a previous run is unlanded or
                left the tree dirty, or the PR could not be published. The `docs-refresh` syslog
                tag holds the run's message.
  - interval: 1h
    input_series:
      - series: 'homelab_check_success{check="eval-run", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '1x3 0x3'
    alert_rule_test:
      - eval_time: 2h
        alertname: EvalSweepFailed
        exp_alerts: []
      - eval_time: 4h
        alertname: EvalSweepFailed
        exp_alerts:
          - exp_labels: {check: eval-run, instance: daniel-box, job: node, origin: daniel-box, severity: warning, service: daniel-box, shadow: "true"}
            exp_annotations:
              summary: daniel-box's weekly eval sweep reported a failure.
              description: >-
                eval-run.sh on daniel-box ended with status=down: an eval case regressed, or an
                earlier PR is unlanded for a reason that needs a human. A missing
                anthropic_api_key skips the sweep and reads up. The `eval-run` syslog tag holds
                the run's message.
  - interval: 1h
    input_series:
      - series: 'homelab_check_success{check="secret-rotation-audit", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '1x3 0x3'
    alert_rule_test:
      - eval_time: 2h
        alertname: SecretRotationAuditFailed
        exp_alerts: []
      - eval_time: 4h
        alertname: SecretRotationAuditFailed
        exp_alerts:
          - exp_labels: {check: secret-rotation-audit, instance: daniel-box, job: node, origin: daniel-box, severity: warning, service: daniel-box, shadow: "true"}
            exp_annotations:
              summary: daniel-box's secret-rotation audit reported a failure.
              description: >-
                secret-rotation-audit.sh on daniel-box ended with a non-zero exit code: a secret
                is past its rotation window, a secret in secrets.yml is missing from the
                registry, or a prior weekly secret-rotate left the tree dirty or unpushed. Run
                `secret_rotation.py audit` by hand to read which.
  - interval: 1h
    input_series:
      - series: 'homelab_check_success{check="setup-drift-check", instance="daniel-server", job="node", origin="daniel-server"}'
        values: '1x3 0x3'
    alert_rule_test:
      - eval_time: 2h
        alertname: SetupDriftFailed
        exp_alerts: []
      - eval_time: 4h
        alertname: SetupDriftFailed
        exp_alerts:
          - exp_labels: {check: setup-drift-check, instance: daniel-server, job: node, origin: daniel-server, severity: warning, service: daniel-server, shadow: "true"}
            exp_annotations:
              summary: daniel-server's setup plane has drifted from the repo.
              description: >-
                setup-drift-check.sh on daniel-server found a deployed file that differs from
                the repo, a rendered script that is an old render, or a checkout it cannot
                trust. The `setup-drift-check` syslog tag names the files. Re-run the
                initial_setup playbook for the role they belong to on that host.
  - interval: 1h
    input_series:
      - series: 'homelab_check_success{check="loki-read-route-health", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '1x3 0x3'
      - series: 'homelab_check_success{check="loki-read-route-health", instance="daniel-server", job="node", origin="daniel-server"}'
        values: '1x6'
      - series: 'homelab_check_last_run_timestamp_seconds{check="loki-read-route-health", instance="daniel-server", job="node", origin="daniel-server"}'
        values: '0+3600x6'
      - series: 'up{instance="daniel-server", job="node", origin="daniel-server"}'
        values: '1x6'
    alert_rule_test:
      - eval_time: 2h
        alertname: LokiReadRouteFailed
        exp_alerts: []
      - eval_time: 4h
        alertname: LokiReadRouteFailed
        exp_alerts:
          - exp_labels: {check: loki-read-route-health, instance: daniel-box, job: node, origin: daniel-box, severity: warning, service: daniel-box, shadow: "true"}
            exp_annotations:
              summary: daniel-box cannot read Loki through the loki-homelab route.
              description: >-
                loki-read-route-health.sh on daniel-box ran `probe.py loki-labels` through the
                loki-homelab IngressRoute and judged the answer down: the route returned 404 or
                an error, usually because the ClientIP guard rejects this host's source address.
                Read `systemctl status kuma-check-loki-read-route` on daniel-box and the traefik
                pod's placement.
  - interval: 1h
    input_series:
      - series: 'homelab_check_success{check="loki-read-route-health", instance="daniel-server", job="node", origin="daniel-server"}'
        values: '1x3 0x3'
      - series: 'homelab_check_success{check="loki-read-route-health", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '1x6'
      - series: 'homelab_check_last_run_timestamp_seconds{check="loki-read-route-health", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '0+3600x6'
      - series: 'up{instance="daniel-box", job="node", origin="daniel-box"}'
        values: '1x6'
    alert_rule_test:
      - eval_time: 2h
        alertname: LokiReadRouteFailed
        exp_alerts: []
      - eval_time: 4h
        alertname: LokiReadRouteFailed
        exp_alerts:
          - exp_labels: {check: loki-read-route-health, instance: daniel-server, job: node, origin: daniel-server, severity: warning, service: daniel-server, shadow: "true"}
            exp_annotations:
              summary: daniel-server cannot read Loki through the loki-homelab route.
              description: >-
                loki-read-route-health.sh on daniel-server ran `probe.py loki-labels` through
                the loki-homelab IngressRoute and judged the answer down: the route returned 404
                or an error, usually because the ClientIP guard rejects this host's source
                address. Read `systemctl status kuma-check-loki-read-route` on daniel-server and
                the traefik pod's placement.

  # The file stopped being refreshed: node_exporter keeps serving the timestamp written at 0.
  # The first arm is quiet when the gap equals the deadline and fires one hour later.
  - interval: 1h
    input_series:
      - series: 'homelab_check_last_run_timestamp_seconds{check="docs-refresh", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '0x16'
      - series: 'up{instance="daniel-box", job="node", origin="daniel-box"}'
        values: '1x16'
    alert_rule_test:
      - eval_time: 13h
        alertname: DocsRefreshNotReporting
        exp_alerts: []
      - eval_time: 14h
        alertname: DocsRefreshNotReporting
        exp_alerts:
          - exp_labels: {check: docs-refresh, instance: daniel-box, job: node, origin: daniel-box, severity: warning, service: daniel-box, shadow: "true"}
            exp_annotations:
              summary: daniel-box's generated-docs refresh has stopped reporting.
              description: >-
                No docs-refresh verdict newer than 13 hours reached Prometheus from daniel-box's
                textfile collector, so nothing confirms the generated docs are refreshing. Read
                the `Refresh generated docs` cron and the `docs-refresh` syslog tag, then
                /var/lib/node-exporter-textfile/docs-refresh.prom on the host.
  - interval: 1h
    input_series:
      - series: 'homelab_check_last_run_timestamp_seconds{check="eval-run", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '0x177'
      - series: 'up{instance="daniel-box", job="node", origin="daniel-box"}'
        values: '1x177'
    alert_rule_test:
      - eval_time: 174h
        alertname: EvalSweepNotReporting
        exp_alerts: []
      - eval_time: 175h
        alertname: EvalSweepNotReporting
        exp_alerts:
          - exp_labels: {check: eval-run, instance: daniel-box, job: node, origin: daniel-box, severity: warning, service: daniel-box, shadow: "true"}
            exp_annotations:
              summary: daniel-box's weekly eval sweep has stopped reporting.
              description: >-
                No eval-run verdict newer than 7 days 6 hours reached Prometheus from daniel-box's
                textfile collector, so nothing confirms the eval sweep is running. Read the
                `Homelab eval sweep` cron and the `eval-run` syslog tag, then
                /var/lib/node-exporter-textfile/eval-run.prom on the host.
  - interval: 1h
    input_series:
      - series: 'homelab_check_last_run_timestamp_seconds{check="secret-rotation-audit", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '0x28'
      - series: 'up{instance="daniel-box", job="node", origin="daniel-box"}'
        values: '1x28'
    alert_rule_test:
      - eval_time: 25h
        alertname: SecretRotationAuditNotReporting
        exp_alerts: []
      - eval_time: 26h
        alertname: SecretRotationAuditNotReporting
        exp_alerts:
          - exp_labels: {check: secret-rotation-audit, instance: daniel-box, job: node, origin: daniel-box, severity: warning, service: daniel-box, shadow: "true"}
            exp_annotations:
              summary: daniel-box's secret-rotation audit has stopped reporting.
              description: >-
                No secret-rotation-audit verdict newer than 25 hours reached Prometheus from
                daniel-box's textfile collector, so nothing confirms secret rotation is being
                audited. Read `systemctl status kuma-check-secret-rotation-audit` on daniel-box,
                then /var/lib/node-exporter-textfile/secret-rotation-audit.prom on the host.
  - interval: 1h
    input_series:
      - series: 'homelab_check_last_run_timestamp_seconds{check="setup-drift-check", instance="daniel-server", job="node", origin="daniel-server"}'
        values: '0x28'
      - series: 'up{instance="daniel-server", job="node", origin="daniel-server"}'
        values: '1x28'
    alert_rule_test:
      - eval_time: 25h
        alertname: SetupDriftNotReporting
        exp_alerts: []
      - eval_time: 26h
        alertname: SetupDriftNotReporting
        exp_alerts:
          - exp_labels: {check: setup-drift-check, instance: daniel-server, job: node, origin: daniel-server, severity: warning, service: daniel-server, shadow: "true"}
            exp_annotations:
              summary: daniel-server's setup-drift check has stopped reporting.
              description: >-
                No setup-drift-check verdict newer than 25 hours reached Prometheus from
                daniel-server's textfile collector, so nothing confirms the setup plane is being
                compared with the repo. Read `systemctl status kuma-check-setup-drift` on
                daniel-server, then /var/lib/node-exporter-textfile/setup-drift-check.prom on
                the host.
  - interval: 1h
    input_series:
      - series: 'homelab_check_last_run_timestamp_seconds{check="loki-read-route-health", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '0x5'
      - series: 'up{instance="daniel-box", job="node", origin="daniel-box"}'
        values: '1x5'
      - series: 'homelab_check_success{check="loki-read-route-health", instance="daniel-server", job="node", origin="daniel-server"}'
        values: '1x5'
      - series: 'homelab_check_last_run_timestamp_seconds{check="loki-read-route-health", instance="daniel-server", job="node", origin="daniel-server"}'
        values: '0+3600x5'
      - series: 'up{instance="daniel-server", job="node", origin="daniel-server"}'
        values: '1x5'
    alert_rule_test:
      - eval_time: 2h
        alertname: LokiReadRouteNotReporting
        exp_alerts: []
      - eval_time: 3h
        alertname: LokiReadRouteNotReporting
        exp_alerts:
          - exp_labels: {check: loki-read-route-health, instance: daniel-box, job: node, origin: daniel-box, severity: warning, service: daniel-box, shadow: "true"}
            exp_annotations:
              summary: daniel-box's Loki read-route witness has stopped reporting.
              description: >-
                No loki-read-route-health verdict newer than 2 hours reached Prometheus from
                daniel-box's textfile collector, so nothing confirms the Loki read route is
                being witnessed. Read `systemctl status kuma-check-loki-read-route` on
                daniel-box, then /var/lib/node-exporter-textfile/loki-read-route-health.prom on
                the host.
  - interval: 1h
    input_series:
      - series: 'homelab_check_last_run_timestamp_seconds{check="loki-read-route-health", instance="daniel-server", job="node", origin="daniel-server"}'
        values: '0x5'
      - series: 'up{instance="daniel-server", job="node", origin="daniel-server"}'
        values: '1x5'
      - series: 'homelab_check_success{check="loki-read-route-health", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '1x5'
      - series: 'homelab_check_last_run_timestamp_seconds{check="loki-read-route-health", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '0+3600x5'
      - series: 'up{instance="daniel-box", job="node", origin="daniel-box"}'
        values: '1x5'
    alert_rule_test:
      - eval_time: 2h
        alertname: LokiReadRouteNotReporting
        exp_alerts: []
      - eval_time: 3h
        alertname: LokiReadRouteNotReporting
        exp_alerts:
          - exp_labels: {check: loki-read-route-health, instance: daniel-server, job: node, origin: daniel-server, severity: warning, service: daniel-server, shadow: "true"}
            exp_annotations:
              summary: daniel-server's Loki read-route witness has stopped reporting.
              description: >-
                No loki-read-route-health verdict newer than 2 hours reached Prometheus from
                daniel-server's textfile collector, so nothing confirms the Loki read route is
                being witnessed. Read `systemctl status kuma-check-loki-read-route` on
                daniel-server, then /var/lib/node-exporter-textfile/loki-read-route-health.prom
                on the host.

  # The file is gone from hour 2, so the series goes stale while the exporter stays up. The
  # absent_over_time arm stays quiet while any sample lies inside the deadline window and fires
  # after it. The exporter-down group below differs only in `up`, so this group is its control.
  - interval: 1h
    input_series:
      - series: 'homelab_check_last_run_timestamp_seconds{check="docs-refresh", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '0+3600x1 stale'
      - series: 'up{instance="daniel-box", job="node", origin="daniel-box"}'
        values: '1x19'
    alert_rule_test:
      - eval_time: 13h
        alertname: DocsRefreshNotReporting
        exp_alerts: []
      - eval_time: 17h
        alertname: DocsRefreshNotReporting
        exp_alerts:
          - exp_labels: {check: docs-refresh, origin: daniel-box, severity: warning, service: daniel-box, shadow: "true"}
            exp_annotations:
              summary: daniel-box's generated-docs refresh has stopped reporting.
              description: >-
                No docs-refresh verdict newer than 13 hours reached Prometheus from daniel-box's
                textfile collector, so nothing confirms the generated docs are refreshing. Read
                the `Refresh generated docs` cron and the `docs-refresh` syslog tag, then
                /var/lib/node-exporter-textfile/docs-refresh.prom on the host.
  - interval: 1h
    input_series:
      - series: 'homelab_check_last_run_timestamp_seconds{check="eval-run", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '0+3600x1 stale'
      - series: 'up{instance="daniel-box", job="node", origin="daniel-box"}'
        values: '1x180'
    alert_rule_test:
      - eval_time: 174h
        alertname: EvalSweepNotReporting
        exp_alerts: []
      - eval_time: 178h
        alertname: EvalSweepNotReporting
        exp_alerts:
          - exp_labels: {check: eval-run, origin: daniel-box, severity: warning, service: daniel-box, shadow: "true"}
            exp_annotations:
              summary: daniel-box's weekly eval sweep has stopped reporting.
              description: >-
                No eval-run verdict newer than 7 days 6 hours reached Prometheus from daniel-box's
                textfile collector, so nothing confirms the eval sweep is running. Read the
                `Homelab eval sweep` cron and the `eval-run` syslog tag, then
