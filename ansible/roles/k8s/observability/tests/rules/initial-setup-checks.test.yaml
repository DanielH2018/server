  - interval: 1h
    input_series:
      - series: 'homelab_check_last_run_timestamp_seconds{check="setup-drift-check", instance="daniel-server", job="node", origin="daniel-server"}'
        values: '0+3600x1 stale'
      - series: 'up{instance="daniel-server", job="node", origin="daniel-server"}'
        values: '1x31'
    alert_rule_test:
      - eval_time: 25h
        alertname: SetupDriftNotReporting
        exp_alerts: []
      - eval_time: 29h
        alertname: SetupDriftNotReporting
        exp_alerts:
          - exp_labels: {check: setup-drift-check, origin: daniel-server, severity: warning, service: daniel-server, shadow: "true"}
            exp_annotations:
              summary: daniel-server's setup-drift check has stopped reporting.
              description: >-
                No setup-drift-check verdict newer than 25 hours reached Prometheus from
                daniel-server's textfile collector, so nothing confirms the setup plane is being
                compared with the repo. Read `systemctl status kuma-check-setup-drift` on
                daniel-server, then /var/lib/node-exporter-textfile/setup-drift-check.prom on
                the host.
  - interval: 1h
    input_series:
      - series: 'homelab_check_last_run_timestamp_seconds{check="loki-read-route-health", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '0+3600x1 stale'
      - series: 'up{instance="daniel-box", job="node", origin="daniel-box"}'
        values: '1x8'
      - series: 'homelab_check_success{check="loki-read-route-health", instance="daniel-server", job="node", origin="daniel-server"}'
        values: '1x8'
      - series: 'homelab_check_last_run_timestamp_seconds{check="loki-read-route-health", instance="daniel-server", job="node", origin="daniel-server"}'
