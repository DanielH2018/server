  # The exporter is down from hour 2: `up` reads 0 and the series is gone, as in the control
  # above. The bridge's `targets` check pages a dead exporter, so the `unless` clause keeps
  # every NotReporting rule quiet past the point the control fires.
  - interval: 1h
    input_series:
      - series: 'homelab_check_last_run_timestamp_seconds{check="eval-run", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '0+3600x1 stale'
