              severity: warning
              shadow: "true"
            exp_annotations:
              summary: "Only 0 hosts report series for the disk / check, under the floor of 2."
              description: "The disk / check reads one series family from every node-exporter and needs two hosts answering, and 0 do. The rest are unmonitored, not idle. Read the node scrape targets on Prometheus."
          - exp_labels:
              arm: 'disk /boot'
              service: observability
              severity: warning
              shadow: "true"
            exp_annotations:
              summary: "Only 0 hosts report series for the disk /boot check, under the floor of 2."
