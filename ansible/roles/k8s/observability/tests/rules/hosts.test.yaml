          - exp_labels:
              arm: 'disk /boot'
              service: observability
              severity: warning
              shadow: "true"
            exp_annotations:
              summary: "Only 1 hosts report series for the disk /boot check, under the floor of 2."
              description: "The disk /boot check reads one series family from every node-exporter and needs two hosts answering, and 1 do. The rest are unmonitored, not idle. Read the node scrape targets on Prometheus."
          - exp_labels:
              arm: 'disk /boot/efi'
              service: observability
              severity: warning
              shadow: "true"
            exp_annotations:
              summary: "Only 1 hosts report series for the disk /boot/efi check, under the floor of 2."
              description: "The disk /boot/efi check reads one series family from every node-exporter and needs two hosts answering, and 1 do. The rest are unmonitored, not idle. Read the node scrape targets on Prometheus."
          - exp_labels:
              arm: memory
              service: observability
              severity: warning
              shadow: "true"
            exp_annotations:
              summary: "Only 1 hosts report series for the memory check, under the floor of 2."
              description: "The memory check reads one series family from every node-exporter and needs two hosts answering, and 1 do. The rest are unmonitored, not idle. Read the node scrape targets on Prometheus."
          - exp_labels:
              arm: thermal-throttle
              service: observability
              severity: warning
              shadow: "true"
            exp_annotations:
              summary: "Only 1 hosts report series for the thermal-throttle check, under the floor of 2."
              description: "The thermal-throttle check reads one series family from every node-exporter and needs two hosts answering, and 1 do. The rest are unmonitored, not idle. Read the node scrape targets on Prometheus."
  # UPSOnBattery. NUT asserts OB at minute 5; the alert fires once it has held for 10m.
  - interval: 1m
    input_series:
      - series: 'network_ups_tools_ups_status{flag="OB", instance="nut-exporter.homelab.svc:9199", job="nut"}'
        values: '0x5 1x40'
    alert_rule_test:
      - alertname: UPSOnBattery
        eval_time: 14m
        exp_alerts: []
      - alertname: UPSOnBattery
        eval_time: 17m
        exp_alerts:
          - exp_labels:
              instance: 'nut-exporter.homelab.svc:9199'
              job: nut
              service: nut-exporter
              severity: critical
              shadow: "true"
            exp_annotations:
              summary: "The UPS is on battery."
              description: "NUT reports ups.status OB for 10 minutes: mains power is gone and the UPS is carrying the load. Read the UPS on the NUT host."
  # During an outage only UPSOnBattery speaks. Charge 30%, runtime 100s and the RB flag would
  # each fire on their own, and `unless` holds all three while OB is 1.
  - interval: 1m
    input_series:
      - series: 'network_ups_tools_ups_status{flag="OB", instance="nut-exporter.homelab.svc:9199", job="nut"}'
        values: '1x30'
      - series: 'network_ups_tools_ups_status{flag="RB", instance="nut-exporter.homelab.svc:9199", job="nut"}'
        values: '1x30'
      - series: 'network_ups_tools_battery_charge{instance="nut-exporter.homelab.svc:9199", job="nut"}'
        values: '30x30'
      - series: 'network_ups_tools_battery_runtime{instance="nut-exporter.homelab.svc:9199", job="nut"}'
        values: '100x30'
    alert_rule_test:
      - alertname: UPSOnBattery
        eval_time: 15m
        exp_alerts:
          - exp_labels:
              instance: 'nut-exporter.homelab.svc:9199'
              job: nut
              service: nut-exporter
              severity: critical
              shadow: "true"
            exp_annotations:
              summary: "The UPS is on battery."
              description: "NUT reports ups.status OB for 10 minutes: mains power is gone and the UPS is carrying the load. Read the UPS on the NUT host."
      - alertname: UPSBatteryLow
        eval_time: 15m
        exp_alerts: []
      - alertname: UPSRuntimeLow
        eval_time: 15m
        exp_alerts: []
      - alertname: UPSReplaceBattery
        eval_time: 15m
        exp_alerts: []
  # UPSBatteryLow, UPSRuntimeLow and UPSReplaceBattery on mains power. Charge 40% is under 50;
  # runtime 120s is under 300; the RB flag is set. Each fires after 10m.
  - interval: 1m
    input_series:
      - series: 'network_ups_tools_ups_status{flag="OB", instance="nut-exporter.homelab.svc:9199", job="nut"}'
        values: '0x30'
      - series: 'network_ups_tools_ups_status{flag="RB", instance="nut-exporter.homelab.svc:9199", job="nut"}'
        values: '1x30'
      - series: 'network_ups_tools_battery_charge{instance="nut-exporter.homelab.svc:9199", job="nut"}'
        values: '40x30'
      - series: 'network_ups_tools_battery_runtime{instance="nut-exporter.homelab.svc:9199", job="nut"}'
        values: '120x30'
    alert_rule_test:
      - alertname: UPSBatteryLow
        eval_time: 9m
        exp_alerts: []
      - alertname: UPSBatteryLow
        eval_time: 12m
        exp_alerts:
          - exp_labels:
              instance: 'nut-exporter.homelab.svc:9199'
              job: nut
              service: nut-exporter
              severity: critical
              shadow: "true"
            exp_annotations:
              summary: "The UPS battery is at 40%."
              description: "The UPS battery charge is under 50% (UPS_CHARGE_MIN_PCT) while mains power is on, for 10 minutes. Read the UPS on the NUT host."
      - alertname: UPSRuntimeLow
        eval_time: 12m
        exp_alerts:
          - exp_labels:
              instance: 'nut-exporter.homelab.svc:9199'
              job: nut
              service: nut-exporter
              severity: critical
              shadow: "true"
            exp_annotations:
              summary: "The UPS has 2m 0s of runtime."
              description: "The UPS estimates under 5 minutes of runtime (UPS_RUNTIME_MIN_S) on a full charge, for 10 minutes. The battery has aged. Read the UPS on the NUT host."
      - alertname: UPSReplaceBattery
        eval_time: 12m
        exp_alerts:
          - exp_labels:
              instance: 'nut-exporter.homelab.svc:9199'
              job: nut
              service: nut-exporter
              severity: critical
              shadow: "true"
            exp_annotations:
              summary: "The UPS asks for a battery replacement."
              description: "NUT reports ups.status RB for 10 minutes: the UPS's own self-test says the battery needs replacing. This trips before charge or runtime read low."
  # UPSBatteryLow at exactly 50% and UPSRuntimeLow at exactly 300s are not under the floor.
  - interval: 1m
    input_series:
      - series: 'network_ups_tools_ups_status{flag="OB", instance="nut-exporter.homelab.svc:9199", job="nut"}'
        values: '0x30'
      - series: 'network_ups_tools_battery_charge{instance="nut-exporter.homelab.svc:9199", job="nut"}'
        values: '50x30'
      - series: 'network_ups_tools_battery_runtime{instance="nut-exporter.homelab.svc:9199", job="nut"}'
        values: '300x30'
    alert_rule_test:
      - alertname: UPSBatteryLow
        eval_time: 15m
        exp_alerts: []
      - alertname: UPSRuntimeLow
        eval_time: 15m
        exp_alerts: []
  # UPSSensorAbsent. nut-exporter answers its scrape and publishes charge only, so the runtime,
  # replace-battery and on-battery arms fire after 10m.
  - interval: 1m
    input_series:
      - series: 'up{instance="nut-exporter.homelab.svc:9199", job="nut"}'
        values: '1x30'
      - series: 'network_ups_tools_battery_charge{instance="nut-exporter.homelab.svc:9199", job="nut"}'
        values: '80x30'
    alert_rule_test:
      - alertname: UPSSensorAbsent
        eval_time: 9m
        exp_alerts: []
      - alertname: UPSSensorAbsent
        eval_time: 12m
        exp_alerts:
          - exp_labels:
              arm: runtime
              instance: 'nut-exporter.homelab.svc:9199'
              job: nut
              service: nut-exporter
              severity: critical
              shadow: "true"
            exp_annotations:
              summary: "The UPS runtime series is absent."
              description: "The NUT exporter answers its scrape but publishes no runtime series for 10 minutes, so the UPS is unmonitored on that arm. A renamed or removed series is the usual cause. Read nut-exporter's /ups_metrics."
          - exp_labels:
              arm: replace-battery
              instance: 'nut-exporter.homelab.svc:9199'
              job: nut
              service: nut-exporter
              severity: critical
              shadow: "true"
            exp_annotations:
              summary: "The UPS replace-battery series is absent."
              description: "The NUT exporter answers its scrape but publishes no replace-battery series for 10 minutes, so the UPS is unmonitored on that arm. A renamed or removed series is the usual cause. Read nut-exporter's /ups_metrics."
          - exp_labels:
              arm: on-battery
              instance: 'nut-exporter.homelab.svc:9199'
              job: nut
              service: nut-exporter
              severity: critical
              shadow: "true"
            exp_annotations:
              summary: "The UPS on-battery series is absent."
              description: "The NUT exporter answers its scrape but publishes no on-battery series for 10 minutes, so the UPS is unmonitored on that arm. A renamed or removed series is the usual cause. Read nut-exporter's /ups_metrics."
  # UPSSensorAbsent with the nut scrape down (up 0) publishes nothing and stays silent:
  # ScrapeTargetDown owns a dead upsd or exporter.
  - interval: 1m
    input_series:
      - series: 'up{instance="nut-exporter.homelab.svc:9199", job="nut"}'
        values: '0x30'
    alert_rule_test:
      - alertname: UPSSensorAbsent
        eval_time: 20m
        exp_alerts: []
