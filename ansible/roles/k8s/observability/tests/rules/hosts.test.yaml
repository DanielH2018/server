  # HostCoverageShortfall and HostTemperatureCoverageShortfall, zero-series case: no series at
  # all, so every arm counts 0 hosts and fires with `or vector(0)`.
  - interval: 1m
    input_series: []
    alert_rule_test:
      - alertname: HostCoverageShortfall
        eval_time: 14m
