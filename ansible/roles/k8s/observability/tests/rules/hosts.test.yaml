        values: '5x40'
      - series: 'node_cooling_device_cur_state{name="0", type="Processor", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '0x40'
      - series: 'node_filesystem_size_bytes{mountpoint="/", device="sda1", fstype="ext4", instance="daniel-server", job="node", origin="daniel-server"}'
        values: '100x40'
      - series: 'node_filesystem_size_bytes{mountpoint="/boot", device="sda1", fstype="ext4", instance="daniel-server", job="node", origin="daniel-server"}'
        values: '100x40'
      - series: 'node_filesystem_size_bytes{mountpoint="/boot/efi", device="sda1", fstype="ext4", instance="daniel-server", job="node", origin="daniel-server"}'
        values: '100x40'
      - series: 'node_memory_MemAvailable_bytes{instance="daniel-server", job="node", origin="daniel-server"}'
        values: '5x40'
      - series: 'node_cooling_device_cur_state{name="0", type="Processor", instance="daniel-server", job="node", origin="daniel-server"}'
        values: '0x40'
      - series: 'node_filesystem_size_bytes{mountpoint="/", device="sda1", fstype="ext4", instance="daniel-pi", job="node-pi", origin="daniel-pi"}'
        values: '100x40'
      - series: 'node_hwmon_temp_celsius{chip="pci0000:00_0000:00:18_3", sensor="temp1", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '50x40'
      - series: 'node_hwmon_temp_celsius{chip="platform_coretemp_0", sensor="temp1", instance="daniel-server", job="node", origin="daniel-server"}'
        values: '50x40'
    alert_rule_test:
      - alertname: HostCoverageShortfall
        eval_time: 20m
        exp_alerts: []
      - alertname: HostTemperatureCoverageShortfall
        eval_time: 27m
        exp_alerts:
          - exp_labels:
              arm: temperature
              service: observability
              severity: warning
              shadow: "true"
            exp_annotations:
              summary: "Only 2 hosts report temperature sensors, under the floor of 3."
              description: "The host temperature check needs a non-NVMe hwmon sensor from each of the three hosts, and 2 answer. The rest are unmonitored, not cool. Read the node scrape targets on Prometheus."
  # Only box reports disk and memory: one host is under the floor of 2 for the three disk arms
  # and memory, and fires with 1. The cooling device arm has box's one device and fires too.
  - interval: 1m
    input_series:
      - series: 'node_filesystem_size_bytes{mountpoint="/", device="sda1", fstype="ext4", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '100x40'
      - series: 'node_filesystem_size_bytes{mountpoint="/boot", device="sda1", fstype="ext4", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '100x40'
      - series: 'node_filesystem_size_bytes{mountpoint="/boot/efi", device="sda1", fstype="ext4", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '100x40'
      - series: 'node_memory_MemAvailable_bytes{instance="daniel-box", job="node", origin="daniel-box"}'
        values: '5x40'
      - series: 'node_cooling_device_cur_state{name="0", type="Processor", instance="daniel-box", job="node", origin="daniel-box"}'
