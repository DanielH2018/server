          - exp_labels:
              arm: undervoltage
              instance: daniel-pi
              job: node-pi
              origin: daniel-pi
              service: daniel-pi
              severity: warning
              shadow: "true"
            exp_annotations:
              summary: "daniel-pi publishes no undervoltage series."
