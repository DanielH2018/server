          - exp_labels:
              arm: memory
              service: observability
              severity: warning
              shadow: "true"
            exp_annotations:
              summary: "Only 0 hosts report series for the memory check, under the floor of 2."
              description: "The memory check reads one series family from every node-exporter and needs two hosts answering, and 0 do. The rest are unmonitored, not idle. Read the node scrape targets on Prometheus."
          - exp_labels:
              arm: thermal-throttle
              service: observability
              severity: warning
              shadow: "true"
            exp_annotations:
              summary: "Only 0 hosts report series for the thermal-throttle check, under the floor of 2."
              description: "The thermal-throttle check reads one series family from every node-exporter and needs two hosts answering, and 0 do. The rest are unmonitored, not idle. Read the node scrape targets on Prometheus."
      - alertname: HostTemperatureCoverageShortfall
        eval_time: 24m
        exp_alerts: []
      - alertname: HostTemperatureCoverageShortfall
        eval_time: 26m
        exp_alerts:
          - exp_labels:
              arm: temperature
              service: observability
              severity: warning
              shadow: "true"
            exp_annotations:
              summary: "Only 0 hosts report temperature sensors, under the floor of 3."
              description: "The host temperature check needs a non-NVMe hwmon sensor from each of the three hosts, and 0 answer. The rest are unmonitored, not cool. Read the node scrape targets on Prometheus."
  # Both x86 hosts report every family, so HostCoverageShortfall stays silent at the floor of
  # 2. daniel-pi's root disk is excluded from the count. Only two hosts report a temperature
  # sensor, under the floor of 3, so HostTemperatureCoverageShortfall fires with 2.
  - interval: 1m
    input_series:
      - series: 'node_filesystem_size_bytes{mountpoint="/", device="sda1", fstype="ext4", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '100x40'
      - series: 'node_filesystem_size_bytes{mountpoint="/boot", device="sda1", fstype="ext4", instance="daniel-box", job="node", origin="daniel-box"}'
        values: '100x40'
      - series: 'node_filesystem_size_bytes{mountpoint="/boot/efi", device="sda1", fstype="ext4", instance="daniel-box", job="node", origin="daniel-box"}'
