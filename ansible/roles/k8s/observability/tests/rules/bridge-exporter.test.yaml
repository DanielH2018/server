# promtool unit tests for files/rules/bridge-exporter.yaml. Run with
# `scripts/validate/alert_tools.sh promtool test rules <this file>`; the validate-alert-rules
# hook runs it on every commit that touches the rules.
#
# Each firing case also asserts the evaluation one minute short of the 10m hold, so a shortened
# `for:` fails here. The series carry the labels the live scrape gives them: job
# `monitor-bridge`, instance monitor-bridge.homelab.svc:9181, and a `check` label per row. A
# timestamp series written `0+60x40` equals the evaluation time in seconds, so the row is
# fresh. The exporter's deadline is 900s, three 300s cycles.
rule_files:
  - ../../files/rules/bridge-exporter.yaml
evaluation_interval: 1m
tests:
  # THE WAN FAMILY (A6-3). Every gauge is 0 from the first sample, so the gate and its four
  # dependents all fire at once, with no `for:`. promtool does not run Alertmanager's inhibit
  # rule, so all five reach exp_alerts; ansible/tests/services/test_bridge_wan_rules.py holds the
  # inhibit against the rule labels. Each dependent carries `requires: wan`, the gate does not.
  - interval: 1m
    input_series:
      - series: homelab_check_success{job="monitor-bridge",instance="monitor-bridge.homelab.svc:9181",check="wan_reachable"}
        values: "0x5"
      - series: homelab_check_success{job="monitor-bridge",instance="monitor-bridge.homelab.svc:9181",check="discord"}
        values: "0x5"
      - series: homelab_check_success{job="monitor-bridge",instance="monitor-bridge.homelab.svc:9181",check="r2_usage"}
        values: "0x5"
      - series: homelab_check_success{job="monitor-bridge",instance="monitor-bridge.homelab.svc:9181",check="cloudflare_ips_drift"}
        values: "0x5"
      - series: homelab_check_success{job="monitor-bridge",instance="monitor-bridge.homelab.svc:9181",check="healthchecks_drift"}
        values: "0x5"
    alert_rule_test:
      - eval_time: 1m
        alertname: WANUnreachable
        exp_alerts:
          - exp_labels:
              job: monitor-bridge
              instance: monitor-bridge.homelab.svc:9181
              check: wan_reachable
              severity: critical
              service: wan
              shadow: "true"
            exp_annotations:
              summary: monitor-bridge cannot reach the public internet.
              description: >-
                Both WAN probe providers failed from monitor-bridge, so this house has no
                working link or no DNS. The rows behind this gate (Discord delivery, R2
                headroom, Cloudflare IP drift and Healthchecks.io console drift) are held by
                the inhibit rule. Read the probe's failure messages in the monitor-bridge log
                in the homelab namespace.
      - eval_time: 1m
        alertname: DiscordDeliveryFailing
        exp_alerts:
          - exp_labels:
              job: monitor-bridge
              instance: monitor-bridge.homelab.svc:9181
              check: discord
              severity: critical
              service: discord
              requires: wan
              shadow: "true"
            exp_annotations:
              summary: A Discord webhook no longer resolves, or the SMTP backstop login failed.
              description: >-
                One of the five Discord webhooks (Kuma, CrowdSec, gitops-deploy, *arr,
                healthchecks) no longer resolves, or the Gmail SMTP backstop login failed.
                Rotate the named webhook in SOPS and redeploy its consumer. The monitor-bridge
                log names the failing webhook.
      - eval_time: 1m
        alertname: R2FreeTierHeadroomLow
        exp_alerts:
          - exp_labels:
              job: monitor-bridge
              instance: monitor-bridge.homelab.svc:9181
              check: r2_usage
              severity: critical
              service: r2
              requires: wan
              shadow: "true"
            exp_annotations:
              summary: R2 usage is past 80% of the free tier on at least one arm.
              description: >-
                Month-to-date R2 storage, Class A operations, Class B operations or incomplete
                multipart uploads passed 80% of the free tier. Cloudflare offers no cap on R2, so
                this is the only boundary.
              runbook_url: https://docs.local.daniel-hunter.com/longhorn-backup-tiering/
      - eval_time: 1m
        alertname: CloudflareIPRangesDrifted
        exp_alerts:
          - exp_labels:
              job: monitor-bridge
              instance: monitor-bridge.homelab.svc:9181
              check: cloudflare_ips_drift
              severity: warning
              service: cloudflare
              requires: wan
              shadow: "true"
            exp_annotations:
              summary: Cloudflare's published IP ranges differ from the repo's cloudflare_ips list, or fetching them failed.
              description: >-
                cloudflare_ips in group_vars/all.yml sets Traefik's trustedIPs and the netpol
                allow-list. Update it and redeploy traefik, netpol-baseline and monitor-bridge.
                A failed fetch is retried every cycle; a match is re-checked daily.
      - eval_time: 1m
        alertname: HealthchecksConsoleDrifted
        exp_alerts:
          - exp_labels:
              job: monitor-bridge
              instance: monitor-bridge.homelab.svc:9181
              check: healthchecks_drift
              severity: warning
              service: healthchecks
              requires: wan
              shadow: "true"
            exp_annotations:
              summary: A Healthchecks.io dead-man check differs from the documented schedule.
              description: >-
                The monitor-bridge log names each slug and field that differs, or a check
                missing from the console. Fix the console, or change
                docs/healthchecks-io-deadman.md and monitor_bridge_healthchecks_expected
                together and redeploy monitor-bridge.
              runbook_url: https://docs.local.daniel-hunter.com/healthchecks-io-deadman/

  # Every WAN-family row passes, so nothing fires. One dependent down with the gate up fires
  # that dependent alone: a dependent's rule does not read the gate.
  - interval: 1m
    input_series:
      - series: homelab_check_success{job="monitor-bridge",instance="monitor-bridge.homelab.svc:9181",check="wan_reachable"}
        values: "1x5"
      - series: homelab_check_success{job="monitor-bridge",instance="monitor-bridge.homelab.svc:9181",check="discord"}
        values: "0x5"
      - series: homelab_check_success{job="monitor-bridge",instance="monitor-bridge.homelab.svc:9181",check="r2_usage"}
        values: "1x5"
      - series: homelab_check_success{job="monitor-bridge",instance="monitor-bridge.homelab.svc:9181",check="cloudflare_ips_drift"}
        values: "1x5"
      - series: homelab_check_success{job="monitor-bridge",instance="monitor-bridge.homelab.svc:9181",check="healthchecks_drift"}
        values: "1x5"
    alert_rule_test:
      - eval_time: 3m
        alertname: WANUnreachable
        exp_alerts: []
      - eval_time: 3m
        alertname: R2FreeTierHeadroomLow
        exp_alerts: []
      - eval_time: 3m
        alertname: CloudflareIPRangesDrifted
        exp_alerts: []
      - eval_time: 3m
        alertname: HealthchecksConsoleDrifted
        exp_alerts: []
      - eval_time: 3m
        alertname: DiscordDeliveryFailing
        exp_alerts:
          - exp_labels:
              job: monitor-bridge
              instance: monitor-bridge.homelab.svc:9181
              check: discord
              severity: critical
              service: discord
              requires: wan
              shadow: "true"
            exp_annotations:
              summary: A Discord webhook no longer resolves, or the SMTP backstop login failed.
              description: >-
                One of the five Discord webhooks (Kuma, CrowdSec, gitops-deploy, *arr,
                healthchecks) no longer resolves, or the Gmail SMTP backstop login failed.
                Rotate the named webhook in SOPS and redeploy its consumer. The monitor-bridge
                log names the failing webhook.

  # The zero-series case for the WAN family: a missing row is BridgeCheckStale's page, so none
  # of the five rules fires on an exporter with no `homelab_check_success` series.
  - interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 5m
        alertname: WANUnreachable
        exp_alerts: []
      - eval_time: 5m
        alertname: DiscordDeliveryFailing
        exp_alerts: []
      - eval_time: 5m
        alertname: R2FreeTierHeadroomLow
        exp_alerts: []
      - eval_time: 5m
        alertname: CloudflareIPRangesDrifted
        exp_alerts: []
      - eval_time: 5m
        alertname: HealthchecksConsoleDrifted
        exp_alerts: []

  # The zero-series case: no input at all, so the scrape job is missing from prometheus.yml.
  # MonitorBridgeDown fires through its absent() arm. BridgeCheckStale stays quiet, because a
  # dead exporter has neither of its series.
  - interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 9m
        alertname: MonitorBridgeDown
        exp_alerts: []
      - eval_time: 10m
        alertname: MonitorBridgeDown
        exp_alerts:
          - exp_labels:
              job: monitor-bridge
              severity: critical
              service: monitor-bridge
              shadow: "true"
            exp_annotations: &down
              summary: Prometheus cannot scrape monitor-bridge's check exporter.
              description: >-
                up{job="monitor-bridge"} has been 0 or missing for 10 minutes, so either the
                monitor-bridge pod is down or the monitor-bridge scrape job is gone from
                prometheus.yml. Read the pod's events and log in the homelab namespace.
      - eval_time: 30m
        alertname: BridgeCheckStale
        exp_alerts: []

  # A failed scrape that lasts: up is 0 from the start. The labelled series fires after the hold.
  - interval: 1m
    input_series:
      - series: up{job="monitor-bridge",instance="monitor-bridge.homelab.svc:9181"}
        values: "0x30"
    alert_rule_test:
      - eval_time: 9m
        alertname: MonitorBridgeDown
        exp_alerts: []
      - eval_time: 10m
        alertname: MonitorBridgeDown
        exp_alerts:
          - exp_labels:
              job: monitor-bridge
              instance: monitor-bridge.homelab.svc:9181
              severity: critical
              service: monitor-bridge
              shadow: "true"
            exp_annotations: *down

  # One missed scrape, as at a monitor-bridge restart, must not fire: the hold absorbs it.
  - interval: 1m
    input_series:
      - series: up{job="monitor-bridge",instance="monitor-bridge.homelab.svc:9181"}
        values: "1x5 0 1x30"
    alert_rule_test:
      - eval_time: 6m
        alertname: MonitorBridgeDown
        exp_alerts: []
      - eval_time: 20m
        alertname: MonitorBridgeDown
        exp_alerts: []

  # A hung loop behind a live HTTP thread: up stays 1 and both rows keep their gauges, but row
  # "a" stops being recorded, so its timestamp stays at 0 while row "b" keeps refreshing. Row "a"
  # passes its 900s deadline after 15m, and the alert fires after the 10m hold, at 26m.
  - interval: 1m
    input_series:
      - series: up{job="monitor-bridge",instance="monitor-bridge.homelab.svc:9181"}
        values: "1x40"
      - series: homelab_check_rows{job="monitor-bridge",instance="monitor-bridge.homelab.svc:9181"}
        values: "2x40"
      - series: homelab_check_success{job="monitor-bridge",instance="monitor-bridge.homelab.svc:9181",check="a"}
        values: "1x40"
      - series: homelab_check_success{job="monitor-bridge",instance="monitor-bridge.homelab.svc:9181",check="b"}
        values: "1x40"
      - series: homelab_check_deadline_seconds{job="monitor-bridge",instance="monitor-bridge.homelab.svc:9181",check="a"}
        values: "900x40"
      - series: homelab_check_deadline_seconds{job="monitor-bridge",instance="monitor-bridge.homelab.svc:9181",check="b"}
        values: "900x40"
      - series: homelab_check_last_run_timestamp_seconds{job="monitor-bridge",instance="monitor-bridge.homelab.svc:9181",check="a"}
        values: "0x40"
      - series: homelab_check_last_run_timestamp_seconds{job="monitor-bridge",instance="monitor-bridge.homelab.svc:9181",check="b"}
        values: "0+60x40"
    alert_rule_test:
      - eval_time: 25m
        alertname: BridgeCheckStale
        exp_alerts: []
      - eval_time: 26m
        alertname: BridgeCheckStale
        exp_alerts:
          - exp_labels:
              severity: critical
              service: monitor-bridge
              shadow: "true"
            exp_annotations: &stale
              summary: monitor-bridge's run loop has stopped recording some check verdicts.
              description: >-
                For 10 minutes either a row's homelab_check_last_run_timestamp_seconds has
                aged past its homelab_check_deadline_seconds, or fewer rows export
                homelab_check_success than homelab_check_rows counts. The scrape works, so the
                run loop is hung or skipping rows. Read the monitor-bridge pod's log in the
                homelab namespace.
      - eval_time: 30m
        alertname: MonitorBridgeDown
        exp_alerts: []

  # The missing-row case, which replaces the Kuma push-silence tile for failure-classes row 3.
  # Three rows are expected and only two export a verdict, with every timestamp fresh. The
  # count arm fires after the hold.
  - interval: 1m
    input_series:
      - series: homelab_check_rows{job="monitor-bridge",instance="monitor-bridge.homelab.svc:9181"}
        values: "3x30"
      - series: homelab_check_success{job="monitor-bridge",instance="monitor-bridge.homelab.svc:9181",check="a"}
        values: "1x30"
      - series: homelab_check_success{job="monitor-bridge",instance="monitor-bridge.homelab.svc:9181",check="b"}
        values: "1x30"
      - series: homelab_check_deadline_seconds{job="monitor-bridge",instance="monitor-bridge.homelab.svc:9181",check="a"}
        values: "900x30"
      - series: homelab_check_deadline_seconds{job="monitor-bridge",instance="monitor-bridge.homelab.svc:9181",check="b"}
        values: "900x30"
      - series: homelab_check_last_run_timestamp_seconds{job="monitor-bridge",instance="monitor-bridge.homelab.svc:9181",check="a"}
        values: "0+60x30"
      - series: homelab_check_last_run_timestamp_seconds{job="monitor-bridge",instance="monitor-bridge.homelab.svc:9181",check="b"}
        values: "0+60x30"
    alert_rule_test:
      - eval_time: 9m
        alertname: BridgeCheckStale
        exp_alerts: []
      - eval_time: 10m
        alertname: BridgeCheckStale
        exp_alerts:
          - exp_labels:
              severity: critical
              service: monitor-bridge
              shadow: "true"
            exp_annotations: *stale

  # A restart's first cycle: the exporter already reports 3 rows, but row "c" has no verdict for
  # its first 6m. The count arm is pending for 6m, under the hold, so nothing fires, and the
  # alert is quiet again once "c" arrives.
  - interval: 1m
    input_series:
      - series: up{job="monitor-bridge",instance="monitor-bridge.homelab.svc:9181"}
        values: "0 1x30"
      - series: homelab_check_rows{job="monitor-bridge",instance="monitor-bridge.homelab.svc:9181"}
        values: "3x30"
      - series: homelab_check_success{job="monitor-bridge",instance="monitor-bridge.homelab.svc:9181",check="a"}
        values: "1x30"
      - series: homelab_check_success{job="monitor-bridge",instance="monitor-bridge.homelab.svc:9181",check="b"}
        values: "1x30"
      - series: homelab_check_success{job="monitor-bridge",instance="monitor-bridge.homelab.svc:9181",check="c"}
        values: "_x6 1x24"
      - series: homelab_check_deadline_seconds{job="monitor-bridge",instance="monitor-bridge.homelab.svc:9181",check="a"}
        values: "900x30"
      - series: homelab_check_deadline_seconds{job="monitor-bridge",instance="monitor-bridge.homelab.svc:9181",check="b"}
        values: "900x30"
      - series: homelab_check_deadline_seconds{job="monitor-bridge",instance="monitor-bridge.homelab.svc:9181",check="c"}
        values: "_x6 900x24"
      - series: homelab_check_last_run_timestamp_seconds{job="monitor-bridge",instance="monitor-bridge.homelab.svc:9181",check="a"}
        values: "0+60x30"
      - series: homelab_check_last_run_timestamp_seconds{job="monitor-bridge",instance="monitor-bridge.homelab.svc:9181",check="b"}
        values: "0+60x30"
      - series: homelab_check_last_run_timestamp_seconds{job="monitor-bridge",instance="monitor-bridge.homelab.svc:9181",check="c"}
        values: "_x6 360+60x24"
    alert_rule_test:
      - eval_time: 9m
        alertname: BridgeCheckStale
        exp_alerts: []
      - eval_time: 20m
        alertname: BridgeCheckStale
        exp_alerts: []
      - eval_time: 20m
        alertname: MonitorBridgeDown
        exp_alerts: []

  # THE B2 FAMILY (A6-4). Both gauges are 0 from the first sample, so the gate and its dependent
  # fire at once, with no `for:`. promtool does not run Alertmanager's inhibit rule, so both reach
  # exp_alerts; monitor-bridge's tests/test_bridge_b2_rules.py holds the inhibit against the rule
  # labels. The dependent carries `requires: b2`, the gate does not.
  - interval: 1m
    input_series:
      - series: homelab_check_success{job="monitor-bridge",instance="monitor-bridge.homelab.svc:9181",check="b2_reachable"}
        values: "0x5"
      - series: homelab_check_success{job="monitor-bridge",instance="monitor-bridge.homelab.svc:9181",check="b2_storage"}
        values: "0x5"
    alert_rule_test:
      - eval_time: 1m
        alertname: B2Unreachable
        exp_alerts:
          - exp_labels:
              job: monitor-bridge
              instance: monitor-bridge.homelab.svc:9181
              check: b2_reachable
              severity: critical
              service: b2
              shadow: "true"
            exp_annotations:
              summary: Backblaze B2 refuses monitor-bridge's key, or the transaction cap is exceeded.
              description: >-
                monitor-bridge authenticates against B2 at most every 30 minutes. A cap denial looks
                the same as data loss, so read the monitor-bridge log message before assuming
                either.
              runbook_url: https://docs.local.daniel-hunter.com/longhorn-backup-tiering/
      - eval_time: 1m
        alertname: B2FreeTierHeadroomLow
        exp_alerts:
          - exp_labels:
              job: monitor-bridge
              instance: monitor-bridge.homelab.svc:9181
              check: b2_storage
              severity: critical
              service: b2
              requires: b2
              shadow: "true"
            exp_annotations:
              summary: B2 bucket usage is past the free-tier threshold.
              description: >-
                A drain is nearly free, but a prune pays per deleted backup, so read
                longhorn-backup-tiering before deleting anything.
              runbook_url: https://docs.local.daniel-hunter.com/longhorn-backup-tiering/

  # The dependent down with the gate up fires the dependent alone: its rule does not read the
  # gate. Before its first 0 sample, nothing fires.
  - interval: 1m
    input_series:
      - series: homelab_check_success{job="monitor-bridge",instance="monitor-bridge.homelab.svc:9181",check="b2_reachable"}
        values: "1x5"
      - series: homelab_check_success{job="monitor-bridge",instance="monitor-bridge.homelab.svc:9181",check="b2_storage"}
        values: "1x2 0x3"
    alert_rule_test:
      - eval_time: 2m
        alertname: B2Unreachable
        exp_alerts: []
      - eval_time: 2m
        alertname: B2FreeTierHeadroomLow
        exp_alerts: []
      - eval_time: 5m
        alertname: B2Unreachable
        exp_alerts: []
      - eval_time: 5m
        alertname: B2FreeTierHeadroomLow
        exp_alerts:
          - exp_labels:
              job: monitor-bridge
              instance: monitor-bridge.homelab.svc:9181
              check: b2_storage
              severity: critical
              service: b2
              requires: b2
              shadow: "true"
            exp_annotations:
              summary: B2 bucket usage is past the free-tier threshold.
              description: >-
                A drain is nearly free, but a prune pays per deleted backup, so read
                longhorn-backup-tiering before deleting anything.
              runbook_url: https://docs.local.daniel-hunter.com/longhorn-backup-tiering/

  # The zero-series case for the B2 family: a missing row is BridgeCheckStale's page, so neither
  # rule fires on an exporter with no `homelab_check_success` series.
  - interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 5m
        alertname: B2Unreachable
        exp_alerts: []
      - eval_time: 5m
        alertname: B2FreeTierHeadroomLow
        exp_alerts: []

  # THE UNGATED FAMILY (A6-6). The five rows have no gate, so every gauge is 0 from the first
  # sample and all five rules fire at once, with no `for:` and no `requires` label.
  - interval: 1m
    input_series:
      - series: homelab_check_success{job="monitor-bridge",instance="monitor-bridge.homelab.svc:9181",check="arr_queue"}
        values: "0x5"
      - series: homelab_check_success{job="monitor-bridge",instance="monitor-bridge.homelab.svc:9181",check="gitops_alive"}
        values: "0x5"
      - series: homelab_check_success{job="monitor-bridge",instance="monitor-bridge.homelab.svc:9181",check="gitops_status"}
        values: "0x5"
      - series: homelab_check_success{job="monitor-bridge",instance="monitor-bridge.homelab.svc:9181",check="etcd_restore_drill"}
        values: "0x5"
      - series: homelab_check_success{job="monitor-bridge",instance="monitor-bridge.homelab.svc:9181",check="ha_heartbeat"}
        values: "0x5"
    alert_rule_test:
      - eval_time: 1m
        alertname: ArrQueueNeedsReview
        exp_alerts:
          - exp_labels:
              job: monitor-bridge
              instance: monitor-bridge.homelab.svc:9181
              check: arr_queue
              severity: warning
              service: arr
              shadow: "true"
            exp_annotations:
              summary: A Sonarr or Radarr queue item needs review, or an arr API stayed unreachable.
              description: >-
                A queue item is in warning, importBlocked, or importPending with a status message,
                which is the shape of the 2026-07-01 fake-episode .exe. An arr API that stays
                unreachable past ARR_FETCH_CONSECUTIVE cycles pages the same way. The monitor-bridge
                log in the homelab namespace names the release and the app.
      - eval_time: 1m
        alertname: GitOpsDeployerNotTicking
        exp_alerts:
          - exp_labels:
              job: monitor-bridge
              instance: monitor-bridge.homelab.svc:9181
              check: gitops_alive
              severity: warning
              service: gitops-deploy
              shadow: "true"
            exp_annotations:
              summary: The pull-based deployer on daniel-box has stopped ticking.
              description: >-
                The deployer's last_run marker is older than GITOPS_MAX_AGE_MIN, missing or
                unparseable. Run `systemctl status gitops-deploy.timer` on daniel-box and read the
                SessionStart banner's parked state.
      - eval_time: 1m
        alertname: GitOpsDeployerParked
        exp_alerts:
          - exp_labels:
              job: monitor-bridge
              instance: monitor-bridge.homelab.svc:9181
              check: gitops_status
              severity: warning
              service: gitops-deploy
              shadow: "true"
            exp_annotations:
              summary: The deployer is parked or owes an apply.
              description: >-
                One of these holds: a held SHA after a failed health gate, a diverged tree, a busy
                service lock, a tree behind origin for 6h, a setup role only a hand can apply, or an
                image bump a broad tick deferred for lack of budget. The monitor-bridge log names
                which. gitops_state.py clears a marker once the cause is fixed.
      - eval_time: 1m
        alertname: EtcdRestoreDrillFailing
        exp_alerts:
          - exp_labels:
              job: monitor-bridge
              instance: monitor-bridge.homelab.svc:9181
              check: etcd_restore_drill
              severity: warning
              service: etcd
              shadow: "true"
            exp_annotations:
              summary: The weekly etcd restore drill has not passed within 8 days.
              description: >-
                No list-only drill has ever passed, the last-success-list-only stamp on daniel-box
                is older than 8 days, or the pod cannot read the stamp. Run `journalctl -t
                etcd-restore-drill` on daniel-box and check the stamp's mode.
              runbook_url: https://docs.local.daniel-hunter.com/k3s-etcd-restore/
      - eval_time: 1m
        alertname: HomeAssistantAutomationsStalled
        exp_alerts:
          - exp_labels:
              job: monitor-bridge
              instance: monitor-bridge.homelab.svc:9181
              check: ha_heartbeat
              severity: warning
              service: home-assistant
              shadow: "true"
            exp_annotations:
              summary: Home Assistant's scheduler heartbeat is stale, or HA banned an IP.
              description: >-
                Either HA is up with its automations not running, or HA banned an IP in the last
                hour. A ban of a cluster gateway locks out everything behind it, so read
                /config/ip_bans.yaml on a ban.

  # One ungated row down with the others up fires that row's rule alone, on its first 0 sample.
  - interval: 1m
    input_series:
      - series: homelab_check_success{job="monitor-bridge",instance="monitor-bridge.homelab.svc:9181",check="arr_queue"}
        values: "1x5"
      - series: homelab_check_success{job="monitor-bridge",instance="monitor-bridge.homelab.svc:9181",check="gitops_alive"}
        values: "1x2 0x3"
      - series: homelab_check_success{job="monitor-bridge",instance="monitor-bridge.homelab.svc:9181",check="gitops_status"}
        values: "1x5"
      - series: homelab_check_success{job="monitor-bridge",instance="monitor-bridge.homelab.svc:9181",check="etcd_restore_drill"}
        values: "1x5"
      - series: homelab_check_success{job="monitor-bridge",instance="monitor-bridge.homelab.svc:9181",check="ha_heartbeat"}
        values: "1x5"
    alert_rule_test:
      - eval_time: 2m
        alertname: GitOpsDeployerNotTicking
        exp_alerts: []
      - eval_time: 3m
        alertname: GitOpsDeployerNotTicking
        exp_alerts:
          - exp_labels:
              job: monitor-bridge
              instance: monitor-bridge.homelab.svc:9181
              check: gitops_alive
              severity: warning
              service: gitops-deploy
              shadow: "true"
            exp_annotations:
              summary: The pull-based deployer on daniel-box has stopped ticking.
              description: >-
                The deployer's last_run marker is older than GITOPS_MAX_AGE_MIN, missing or
                unparseable. Run `systemctl status gitops-deploy.timer` on daniel-box and read the
                SessionStart banner's parked state.
      - eval_time: 5m
        alertname: ArrQueueNeedsReview
        exp_alerts: []
      - eval_time: 5m
        alertname: GitOpsDeployerParked
        exp_alerts: []
      - eval_time: 5m
        alertname: EtcdRestoreDrillFailing
        exp_alerts: []
      - eval_time: 5m
        alertname: HomeAssistantAutomationsStalled
        exp_alerts: []

  # The zero-series case for the ungated family: a missing row is BridgeCheckStale's page, so
  # no rule fires on an exporter with no `homelab_check_success` series.
  - interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 5m
        alertname: ArrQueueNeedsReview
        exp_alerts: []
      - eval_time: 5m
        alertname: GitOpsDeployerNotTicking
        exp_alerts: []
      - eval_time: 5m
        alertname: GitOpsDeployerParked
        exp_alerts: []
      - eval_time: 5m
        alertname: EtcdRestoreDrillFailing
        exp_alerts: []
      - eval_time: 5m
        alertname: HomeAssistantAutomationsStalled
        exp_alerts: []

  # THE STARTUP-GRACE FAMILY (A6-5). Every gauge is 0 from the first sample. Each rule is
  # `for: 5m`, the grace the push path applies today as one extra 300s cycle: one minute short of
  # the hold nothing fires, and at the hold all six do. No rule carries `requires`, since no row
  # here has a gate.
  - interval: 1m
    input_series:
      - series: homelab_check_success{job="monitor-bridge",instance="monitor-bridge.homelab.svc:9181",check="n8n"}
        values: "0x8"
      - series: homelab_check_success{job="monitor-bridge",instance="monitor-bridge.homelab.svc:9181",check="bazarr"}
        values: "0x8"
      - series: homelab_check_success{job="monitor-bridge",instance="monitor-bridge.homelab.svc:9181",check="prowlarr_indexers"}
        values: "0x8"
      - series: homelab_check_success{job="monitor-bridge",instance="monitor-bridge.homelab.svc:9181",check="scrutiny"}
        values: "0x8"
      - series: homelab_check_success{job="monitor-bridge",instance="monitor-bridge.homelab.svc:9181",check="speedtest"}
        values: "0x8"
      - series: homelab_check_success{job="monitor-bridge",instance="monitor-bridge.homelab.svc:9181",check="swallowed_verdicts"}
        values: "0x8"
    alert_rule_test:
      - eval_time: 4m
        alertname: N8nWorkflowsFailing
        exp_alerts: []
      - eval_time: 4m
        alertname: BazarrHealthDegraded
        exp_alerts: []
      - eval_time: 4m
        alertname: ProwlarrIndexersFailing
        exp_alerts: []
      - eval_time: 4m
        alertname: SmartHealthFailing
        exp_alerts: []
      - eval_time: 4m
        alertname: SpeedtestDegraded
        exp_alerts: []
      - eval_time: 4m
        alertname: SwallowedPushVerdicts
        exp_alerts: []
      - eval_time: 5m
        alertname: N8nWorkflowsFailing
        exp_alerts:
          - exp_labels:
              job: monitor-bridge
              instance: monitor-bridge.homelab.svc:9181
              check: n8n
              severity: warning
              service: n8n
              shadow: "true"
            exp_annotations:
              summary: "An active n8n workflow failed repeatedly, or several workflows are failing."
              description: "An active workflow failed 3 times in a row, or 2 or more workflows are each failing repeatedly. The monitor-bridge log names the workflow; open its last execution in n8n."
      - eval_time: 5m
        alertname: BazarrHealthDegraded
        exp_alerts:
          - exp_labels:
              job: monitor-bridge
              instance: monitor-bridge.homelab.svc:9181
              check: bazarr
              severity: warning
              service: bazarr
              shadow: "true"
            exp_annotations:
              summary: "Bazarr rejects its sonarr or radarr API key, or reports a health issue."
              description: "Bazarr's own copy of the sonarr or radarr API key is rejected (an empty peer version field), or Bazarr reports a health issue. Bazarr holds those keys in its UI, so a key rotation misses it. The monitor-bridge log names which."
      - eval_time: 5m
        alertname: ProwlarrIndexersFailing
        exp_alerts:
          - exp_labels:
              job: monitor-bridge
              instance: monitor-bridge.homelab.svc:9181
              check: prowlarr_indexers
              severity: warning
              service: prowlarr
              shadow: "true"
            exp_annotations:
              summary: "A Prowlarr indexer has been failing for a week or more."
              description: "Prowlarr's own initialFailure puts an indexer at a week or more of failures. The Pirate Bay and 1337x are ignored as chronic flappers, and short outages never page. The monitor-bridge log names the indexer."
      - eval_time: 5m
        alertname: SmartHealthFailing
        exp_alerts:
          - exp_labels:
              job: monitor-bridge
              instance: monitor-bridge.homelab.svc:9181
              check: scrutiny
              severity: critical
              service: scrutiny
              shadow: "true"
            exp_annotations:
              summary: "Scrutiny reports a failing drive, stale collector data or high NVMe wear."
              description: "A drive's collector data is older than 26h, its SMART self-assessment or an attribute threshold failed, or NVMe wear passed 80%. Scrutiny's own notifier is unconfigured, so this is the only drive-failure page. The monitor-bridge log names the drive."
      - eval_time: 5m
        alertname: SpeedtestDegraded
        exp_alerts:
          - exp_labels:
              job: monitor-bridge
              instance: monitor-bridge.homelab.svc:9181
              check: speedtest
              severity: warning
              service: speedtest
              shadow: "true"
            exp_annotations:
              summary: "The newest speedtest result is stale, incomplete or under 100 Mbps."
              description: "The last speedtest-tracker run is older than 8 h, did not complete, or downloaded under 100 Mbps. Open the speedtest UI and check its scheduler and last result."
      - eval_time: 5m
        alertname: SwallowedPushVerdicts
        exp_alerts:
          - exp_labels:
              job: monitor-bridge
              instance: monitor-bridge.homelab.svc:9181
              check: swallowed_verdicts
              severity: warning
              service: monitor-bridge
              shadow: "true"
            exp_annotations:
              summary: "A host cron pushed a down verdict and the push failed while a sibling's landed."
              description: "The verdict was lost rather than the network. The monitor-bridge log names the cron; run it by hand and read its logger lines."

  # A row down for under the hold and then up again never fires: the 0 samples at minutes 0 to 3
  # start the pending state, and the 1 at minute 4 ends it before the 5m hold.
  - interval: 1m
    input_series:
      - series: homelab_check_success{job="monitor-bridge",instance="monitor-bridge.homelab.svc:9181",check="n8n"}
        values: "0x3 1x6"
      - series: homelab_check_success{job="monitor-bridge",instance="monitor-bridge.homelab.svc:9181",check="bazarr"}
        values: "0x3 1x6"
      - series: homelab_check_success{job="monitor-bridge",instance="monitor-bridge.homelab.svc:9181",check="prowlarr_indexers"}
        values: "0x3 1x6"
      - series: homelab_check_success{job="monitor-bridge",instance="monitor-bridge.homelab.svc:9181",check="scrutiny"}
        values: "0x3 1x6"
      - series: homelab_check_success{job="monitor-bridge",instance="monitor-bridge.homelab.svc:9181",check="speedtest"}
        values: "0x3 1x6"
      - series: homelab_check_success{job="monitor-bridge",instance="monitor-bridge.homelab.svc:9181",check="swallowed_verdicts"}
        values: "0x3 1x6"
    alert_rule_test:
      - eval_time: 8m
        alertname: N8nWorkflowsFailing
        exp_alerts: []
      - eval_time: 8m
        alertname: BazarrHealthDegraded
        exp_alerts: []
      - eval_time: 8m
        alertname: ProwlarrIndexersFailing
        exp_alerts: []
      - eval_time: 8m
        alertname: SmartHealthFailing
        exp_alerts: []
      - eval_time: 8m
        alertname: SpeedtestDegraded
        exp_alerts: []
      - eval_time: 8m
        alertname: SwallowedPushVerdicts
        exp_alerts: []

  # The zero-series case for the startup-grace family: a missing row is BridgeCheckStale's page,
  # so no rule fires on an exporter with no `homelab_check_success` series.
  - interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 10m
        alertname: N8nWorkflowsFailing
        exp_alerts: []
      - eval_time: 10m
        alertname: BazarrHealthDegraded
        exp_alerts: []
      - eval_time: 10m
        alertname: ProwlarrIndexersFailing
        exp_alerts: []
      - eval_time: 10m
        alertname: SmartHealthFailing
        exp_alerts: []
      - eval_time: 10m
        alertname: SpeedtestDegraded
        exp_alerts: []
      - eval_time: 10m
        alertname: SwallowedPushVerdicts
        exp_alerts: []
