# promtool unit tests for files/rules/log-pipeline.yaml. Run with
# `scripts/validate/alert_tools.sh promtool test rules <this file>`; the validate-alert-rules
# hook runs it on every commit that touches the rules.
#
# node_boot_time_seconds is 0 in a case that wants a long-settled node: promtool's clock starts
# at 0, so the node then booted `eval_time` ago. A case that wants a recent reboot sets a boot
# time just before the evaluation.
rule_files:
  - ../../files/rules/log-pipeline.yaml
evaluation_interval: 1m
tests:
  # The zero-series case: no input at all, so the shipper's counter is gone. The missing-series
  # alert fires after its 10m hold, and not before.
  - interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 9m
        alertname: LogShipperMetricsMissing
        exp_alerts: []
      - eval_time: 11m
        alertname: LogShipperMetricsMissing
        exp_alerts:
          - exp_labels:
              job: alloy
              severity: warning
              service: loki-homelab
              shadow: "true"
            exp_annotations:
              summary: Prometheus has lost the log shipper's dropped-entries counter.
              description: >-
                No loki_write_dropped_entries_total series exists for the alloy job, so the job
                is gone from prometheus.yml or Alloy renamed the counter.
                LogShipperDroppingEntries cannot fire until the series is back.

  # Client side: 200 dropped entries a minute is 12000 an hour, over the 3000 threshold. The
  # node settled long ago, so the 80-minute boot hold is not in play.
  - interval: 1m
    input_series:
      - series: 'loki_write_dropped_entries_total{job="alloy", instance="a:12345", reason="ingester_error"}'
        values: '0+200x120'
      - series: 'node_boot_time_seconds{job="node", origin="daniel-box"}'
        values: '0x120'
    alert_rule_test:
      - eval_time: 100m
        alertname: LogShipperDroppingEntries
        exp_alerts:
          - exp_labels:
              severity: warning
              service: loki-homelab
              shadow: "true"
            exp_annotations:
              summary: The log shippers dropped over 3000 entries in the last hour.
              description: >-
                Alloy gave up on more than 3000 log entries in an hour, so those lines never
                reached Loki. Read loki_write_dropped_entries_total by reason and instance, then
                the Alloy pod's log. A burst right after a shipper restart is a re-tail and not
                loss.
      - eval_time: 100m
        alertname: LogShipperMetricsMissing
        exp_alerts: []

  # The BOOT_SETTLE_S grace. The same drops, but the node booted 20 minutes before the
  # evaluation, inside the 80-minute hold, so the reboot's own drops page nobody.
  - interval: 1m
    input_series:
      - series: 'loki_write_dropped_entries_total{job="alloy", instance="a:12345", reason="ingester_error"}'
        values: '0+200x120'
      - series: 'node_boot_time_seconds{job="node", origin="daniel-box"}'
        values: '4800x120'
    alert_rule_test:
      - eval_time: 100m
        alertname: LogShipperDroppingEntries
        exp_alerts: []

  # Below the threshold: 40 entries a minute is 2400 an hour, which is churn.
  - interval: 1m
    input_series:
      - series: 'loki_write_dropped_entries_total{job="alloy", instance="a:12345", reason="ingester_error"}'
        values: '0+40x120'
      - series: 'node_boot_time_seconds{job="node", origin="daniel-box"}'
        values: '0x120'
    alert_rule_test:
      - eval_time: 100m
        alertname: LogShipperDroppingEntries
        exp_alerts: []

  # Server side, the homelab Loki: rate_limited discards page, and its reason names the cause.
  - interval: 1m
    input_series:
      - series: 'loki_discarded_samples_total{job="loki-homelab", reason="rate_limited"}'
        values: '0+200x120'
      - series: 'node_boot_time_seconds{job="node", origin="daniel-box"}'
        values: '0x120'
    alert_rule_test:
      - eval_time: 100m
        alertname: LokiDiscardingEntries
        exp_alerts:
          - exp_labels:
              reason: rate_limited
              severity: warning
              service: loki-homelab
              shadow: "true"
            exp_annotations:
              summary: The homelab Loki discarded over 3000 entries in the last hour.
              description: >-
                Loki discarded more than 3000 entries in an hour for the reason rate_limited.
                too_far_behind means entries arrived outside Loki's accept window, a clock or
                backfill problem. rate_limited, stream_limited and line_too_long are throughput
                or limit problems. Read loki_discarded_samples_total by reason.

  # Server side, the telemetry Loki: the same discards carry service=observability.
  - interval: 1m
    input_series:
      - series: 'loki_discarded_samples_total{job="loki-internal", reason="line_too_long"}'
        values: '0+200x120'
      - series: 'node_boot_time_seconds{job="node", origin="daniel-box"}'
        values: '0x120'
    alert_rule_test:
      - eval_time: 100m
        alertname: LokiDiscardingEntries
        exp_alerts:
          - exp_labels:
              reason: line_too_long
              severity: warning
              service: observability
              shadow: "true"
            exp_annotations:
              summary: The telemetry Loki discarded over 3000 entries in the last hour.
              description: >-
                The telemetry Loki discarded more than 3000 entries in an hour for the reason
                line_too_long, so Claude Code's logs are being lost. Read
                loki_discarded_samples_total by reason.

  # The SHIPPER_BACKLOG_GRACE_S grace. The node booted 100 minutes before the evaluation, past
  # the settle hold and inside 6h. A too_far_behind backlog is held, and rate_limited is not.
  - interval: 1m
    input_series:
      - series: 'loki_discarded_samples_total{job="loki-homelab", reason="too_far_behind"}'
        values: '0+200x120'
      - series: 'loki_discarded_samples_total{job="loki-homelab", reason="rate_limited"}'
        values: '0+200x120'
      - series: 'node_boot_time_seconds{job="node", origin="daniel-box"}'
        values: '0x120'
    alert_rule_test:
      - eval_time: 100m
        alertname: LokiDiscardingEntries
        exp_alerts:
          - exp_labels:
              reason: rate_limited
              severity: warning
              service: loki-homelab
              shadow: "true"
            exp_annotations:
              summary: The homelab Loki discarded over 3000 entries in the last hour.
              description: >-
                Loki discarded more than 3000 entries in an hour for the reason rate_limited.
                too_far_behind means entries arrived outside Loki's accept window, a clock or
                backfill problem. rate_limited, stream_limited and line_too_long are throughput
                or limit problems. Read loki_discarded_samples_total by reason.

  # Past the 6h backlog window the same too_far_behind count pages. The node booted at time 0,
  # so 6h has passed at 400m.
  - interval: 1m
    input_series:
      - series: 'loki_discarded_samples_total{job="loki-homelab", reason="too_far_behind"}'
        values: '0+200x450'
      - series: 'node_boot_time_seconds{job="node", origin="daniel-box"}'
        values: '0x450'
    alert_rule_test:
      - eval_time: 400m
        alertname: LokiDiscardingEntries
        exp_alerts:
          - exp_labels:
              reason: too_far_behind
              severity: warning
              service: loki-homelab
              shadow: "true"
            exp_annotations:
              summary: The homelab Loki discarded over 3000 entries in the last hour.
              description: >-
                Loki discarded more than 3000 entries in an hour for the reason too_far_behind.
                too_far_behind means entries arrived outside Loki's accept window, a clock or
                backfill problem. rate_limited, stream_limited and line_too_long are throughput
                or limit problems. Read loki_discarded_samples_total by reason.

  # The collector's export arm: one failed export in 15 minutes pages, and a collector that is
  # not scraped does not.
  - interval: 1m
    input_series:
      - series: 'otelcol_exporter_send_failed_log_records{job="otel-collector-internal", instance="c:8888", exporter="loki"}'
        values: '0+1x40'
      - series: 'up{job="otel-collector-internal", instance="c:8888"}'
        values: '1x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: OtelCollectorExportFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              service: observability
              shadow: "true"
            exp_annotations:
              summary: The OTel collector failed to export telemetry.
              description: >-
                The collector gave up on exporting telemetry in the last 15 minutes, so the data
                reaches neither Loki, Prometheus nor Tempo and no other counter records the
                loss. Read otelcol_exporter_send_failed_* by exporter, then the collector pod's
                log.

  # Tempo's blocklist poll: one failed poll in 15 minutes pages.
  - interval: 1m
    input_series:
      - series: 'tempodb_blocklist_tenant_index_errors_total{job="tempo-internal", instance="t:3200"}'
        values: '0+1x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: TempoBlocklistPollFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              service: observability
              shadow: "true"
            exp_annotations:
              summary: Tempo's blocklist poll failed.
              description: >-
                Tempo's blocklist poll failed in the last 15 minutes, so stored traces are
                unsearchable and retention deletes nothing. Read the Tempo pod's log for the
                poll error, and restart the pod once the object store answers.

  # Healthy: no drops, no discards, no failed exports.
  - interval: 1m
    input_series:
      - series: 'loki_write_dropped_entries_total{job="alloy", instance="a:12345", reason="ingester_error"}'
        values: '0x120'
      - series: 'up{job="otel-collector-internal", instance="c:8888"}'
        values: '1x120'
    alert_rule_test:
      - eval_time: 100m
        alertname: LogShipperDroppingEntries
        exp_alerts: []
      - eval_time: 100m
        alertname: OtelCollectorExportFailing
        exp_alerts: []
      - eval_time: 100m
        alertname: LogShipperMetricsMissing
        exp_alerts: []
