            target.
      # The bridge's two fail-closed floors, ported: CLUSTER_TARGETS_MIN visible series outside
      # daniel-server and TARGETS_MIN on it. A Prometheus that answers while its `up` vector has
      # emptied makes every rule above evaluate to nothing, which this rule reads as a fault.
      # `or vector(0)` turns an empty count into 0, so the empty-input case fires. The 10m hold
      # matches ScrapeTargetDown's, so a rolling pod's scrape gap pages neither.
      # ansible/tests/services/test_scrape_target_rule_jobs.py pins both floors to the bridge.
      - alert: ScrapeTargetsMissing
        expr: >-
          (count(up{origin!="daniel-server"}) or vector(0)) < 3
          or (count(up{origin="daniel-server"}) or vector(0)) < 1
        for: 10m
        labels:
          severity: warning
          service: observability
          shadow: "true"
        annotations:
          summary: Prometheus sees too few scrape targets.
          description: >-
            Fewer than 3 scrape targets outside daniel-server, or none on it, have reported for
            10 minutes. The metrics estate is missing, so target health is unknown rather than
            fine. Read prometheus_tsdb_head_series, then daniel-server's remote write.
