# Scrape health: every target Prometheus scrapes, read from the `up` series. Plain YAML, never
# Jinja: prometheus-rules.yaml.j2 carries this file verbatim. The design is
# docs/target-architecture/monitoring/m6-retire-kuma.md, "A3 and the handoffs it closes".
#
# SHADOW UNTIL M6's BATCH A3 CUTS OVER. Kuma's Scrape Targets and Cluster Scrape Targets tiles
# page `up == 0` today. monitor-bridge's check_targets_down reads `up{origin="daniel-server"}`
# and check_cluster_targets reads the complement, so between them they read every series
# below with no job exempt. M1 convention 5 allows one pager, so every rule here routes to the
# blackhole receiver until Cutover-b drops `shadow`.
#
# One `ScrapeTargetDown` rule per owning role. A rule's `service` is a literal, because
# scripts/validate/alert_conventions.py takes `service` from a literal, a workload-service
# join, or a job whose every target sets it, and a static scrape job has none of the last two.
# The last rule is the catch-all: a job that no earlier rule names still pages, with
# service="unmapped". ansible/tests/services/test_scrape_target_rule_jobs.py fails until every
# job in the rendered prometheus.yml is in exactly one earlier rule, so "unmapped" is a
# fallback and never a destination.
#
# DECIDED: service is the deploy tag of the role that deploys the target (Open question 2 of
# the M6 plan), with `k3s` for the control plane's own endpoints, `daniel-pi` for the Pi's
# host-level exporters and `exportarr` for the *arr sidecars, whose pods belong to three
# roles at once. The three blackbox jobs carry service="blackbox-exporter" by this rule's literal,
# which overrides the per-probe `service` its targets set, because a failed scrape of that job
# means the exporter is unreachable and says nothing about the probed service.
groups:
  - name: scrape-targets
    rules:
      - alert: ScrapeTargetDown
        expr: up{job=~"prometheus|otel-collector|otel-collector-internal|kube-state-metrics|loki-internal|tempo-internal|alertmanager"} == 0
        for: 10m
        labels:
          severity: warning
          service: observability
          shadow: "true"
        annotations:
          summary: Prometheus cannot scrape the {{ $labels.job }} target {{ $labels.instance }}.
          description: >-
            {{ $labels.instance }} of job {{ $labels.job }} has failed its scrape for 10
            minutes, so its exporter is down or unreachable from Prometheus and its series have
            gone stale. Read the exporter pod's events and log, or the host's unit for a static
            target.
      - alert: ScrapeTargetDown
        expr: up{job=~"loki-homelab|alloy"} == 0
        for: 10m
        labels:
