# The Flux controllers and the objects they reconcile. Plain YAML, never Jinja:
# prometheus-rules.yaml.j2 carries this file verbatim. The design is
# docs/target-architecture/deploy/d1-flux-installed.md, "Flux pages through the alert plane".
# The controllers' series come from the `flux` scrape job; gotk_resource_info comes from
# kube-state-metrics' custom-resource-state config (observability_ksm_flux_resource_state).
# notification-controller's Discord alerts stay as a second channel beside these.
groups:
  - name: flux
    rules:
      # SHADOW UNTIL M6's A3 DROPS THE LABEL. Kuma's Cluster Scrape Targets tile already pages
      # up == 0 for this job, because monitor-bridge's check_cluster_targets selects every up
      # series without an `origin` label, and the flux job carries none. M1 convention 5 allows
      # one pager, so this rule routes to the blackhole receiver. It shares its name with the
      # rule below so that the soak and A3 read one alert for "a controller is down".
      - alert: FluxControllerDown
        expr: up{job="flux"} == 0
        for: 5m
        labels:
          severity: critical
          service: flux
          shadow: "true"
        annotations:
          summary: Prometheus cannot scrape a Flux controller.
          description: >-
            {{ $labels.pod }} has failed its scrape for 5 minutes, so {{ $labels.app }} is down
            or unreachable from Prometheus. Read its pod's events and log in the flux-system
            namespace.
      # The family's zero-series alert, and what no Kuma tile sees. Pod discovery finds no
      # target for a controller with no pod, so a Deployment at 0 replicas or a pod that never
      # schedules leaves no up series at all. One absent() per controller, because a job-wide
      # absent(up{job="flux"}) waits for all three to vanish. The names mirror the flux role's
      # flux_controllers, and ansible/tests/services/test_flux_rule_literals.py holds them
      # equal. The last arm pages a scrape that works but carries no controller-runtime
      # series, as after an upgrade that renamed them. It is conjoined with up == 1, so this
      # rule never pages the tile's condition a second time.
      - alert: FluxControllerDown
        expr: >-
          absent(up{job="flux", app="source-controller"})
          or absent(up{job="flux", app="kustomize-controller"})
          or absent(up{job="flux", app="notification-controller"})
          or
          ((up{job="flux"} == 1)
          unless on(app) count by (app) (controller_runtime_reconcile_total{job="flux"}))
        for: 5m
        labels:
          severity: critical
          service: flux
        annotations:
          summary: A Flux controller has no pod, or Prometheus lost its metrics.
          description: >-
            For 5 minutes {{ $labels.app }} has either had no scrape target, so its pod is
            gone or the flux scrape job is missing from prometheus.yml, or it has been scraped
            with no controller_runtime_reconcile_total series. Read the Deployment in the
            flux-system namespace.
      # The max by() drops the labels that change while an object stays unhealthy. A failing
      # Kustomization's Ready flips between False and Unknown on every retry, and a label change
      # starts a new series, which would restart the 15-minute hold each time. The
      # OCIRepository arms name `homelab` and `last-good`, the base the soak Job diffs against,
      # so a stalled base pages as the source does. Neither arm names the drill's verify-drill,
      # which is meant to read Ready=False, so it never fires. An absent `ready` label, before the first condition is
      # written, also reads as not Ready.
      # last_over_time bridges a gap in kube-state-metrics' scrape. A failed scrape or a roll of
      # its pod stale-marks every series it exports, and an instant read would then return
      # nothing for one evaluation and restart the hold. The `unless` drops an object as soon as
      # it reads Ready=True, so the 10m window never keeps a recovered object pending.
      # The absent() arm is this family's zero-series alert for gotk_resource_info (#4809).
      # Without it, a kube-state-metrics upgrade that changes the custom-resource-state format,
      # a ClusterRole that loses list/watch on a Flux kind, or a Flux CRD version the config no
      # longer matches leaves both readiness arms and FluxSuspended with no series, so they stay
      # quiet. The kube-state-metrics job carries no `origin` label, so Kuma's Cluster Scrape
      # Targets tile pages its up == 0, and M1 convention 5 conjoins the arm with up == 1. A
      # failed kube-state-metrics scrape therefore returns nothing from this arm for that
      # evaluation and restarts its hold, as with M1's AlertmanagerMetricsMissing. The arm
      # names the root Kustomization alone, the one object that exists whenever Flux is
      # installed. Its alert carries no exported_namespace, which is how the annotations tell
      # the two cases apart.
      - alert: FluxNotReady
        expr: >-
          (
            max by (customresource_kind, exported_namespace, name) (
              last_over_time(gotk_resource_info{customresource_kind="Kustomization", ready!="True"}[10m])
              or last_over_time(gotk_resource_info{customresource_kind="OCIRepository", name="homelab", ready!="True"}[10m])
              or last_over_time(gotk_resource_info{customresource_kind="OCIRepository", name="last-good", ready!="True"}[10m])
            )
            unless on(customresource_kind, exported_namespace, name)
            gotk_resource_info{ready="True"}
          )
          or
          (absent(gotk_resource_info{customresource_kind="Kustomization", name="homelab"}) and on() (up{job="kube-state-metrics"} == 1))
        for: 15m
        labels:
          severity: warning
          service: flux
        annotations:
          summary: >-
            {{ if $labels.exported_namespace }}A Flux object has not been Ready for 15
            minutes.{{ else }}kube-state-metrics has exported no gotk_resource_info for the
            root Kustomization for 15 minutes.{{ end }}
          description: >-
            {{ if $labels.exported_namespace }}The {{ $labels.customresource_kind }}
            {{ $labels.name }} in {{ $labels.exported_namespace }} has had a Ready condition
            other than True for 15 minutes. Its status conditions name the failing
            step.{{ else }}kube-state-metrics is scraped, but for 15 minutes it has exported no
            gotk_resource_info series for the Kustomization {{ $labels.name }}, so FluxNotReady
            and FluxSuspended cannot see any Flux object. Read the kube-state-metrics log in
            the observability namespace for a Forbidden or a custom-resource-state config
            error, and compare the Flux CRD versions with
            observability_ksm_flux_resource_state.{{ end }}
      # kube-state-metrics drops a label whose field is absent, and the flux role writes
      # spec.suspend only while flux_sync_suspend is true, so suspension matches
      # suspended="true". flux_sync_suspend and a hand suspend both count. The max by() keeps
      # the hold across a change of the other labels, and last_over_time across a gap in
      # kube-state-metrics' scrape, as in FluxNotReady. Without it, a 24h hold would fire only
      # after a whole day with no failed scrape and no roll of that pod. The `unless` drops a
      # Kustomization once it reads as resumed.
      #
      # The same label drop means Prometheus holds no series with a `suspended` label at all
      # while nothing is suspended, so pint's live promql/series check reports the first
      # selector as a query on a series that does not exist. The next line exempts that one
      # selector only: a misspelled gotk_resource_info, or a changed customresource_kind,
      # no longer matches it and still fails the run.
      # pint disable promql/series(gotk_resource_info{customresource_kind="Kustomization", suspended="true"})
      - alert: FluxSuspended
        expr: >-
          max by (customresource_kind, exported_namespace, name) (
            last_over_time(gotk_resource_info{customresource_kind="Kustomization", suspended="true"}[10m])
          )
          unless on(customresource_kind, exported_namespace, name)
          gotk_resource_info{customresource_kind="Kustomization", suspended!="true"}
        for: 24h
        labels:
          severity: warning
          service: flux
        annotations:
          summary: A Flux Kustomization has been suspended for more than 24 hours.
          description: >-
            The Kustomization {{ $labels.name }} in {{ $labels.exported_namespace }} has been
            suspended for 24 hours, so Flux applies nothing it owns. If flux_sync_suspend is
            true, set it back and run the flux role; otherwise the suspend was made by hand.
      # Every kustomize-controller worker is busy and more work is waiting, so applies queue,
      # the fix for a failing one included. An unchanged Kustomization that is unhealthy holds a
      # worker for its whole `timeout` on every retry, and `verify`'s timeout leaves those out.
      # The design is docs/target-architecture/deploy/d4-ordering.md, "Saturated reconcile
      # workers". The maximum comes from its gauge, because `--concurrent` changes in D5.1. The
      # two worker gauges share one label set, so `==` matches them whole and the alert keeps
      # app, instance and pod; an on() there would drop them. The queue's series also carry
      # `name` and `priority`, so its join names its labels. A broad revision fills the workers
      # for hours while it progresses, so this is a warning and the soak never reads it. A
      # failed scrape stale-marks the gauges and restarts the hold. No last_over_time bridges
      # it: a missed scrape errs toward quiet, and FluxControllerDown pages one that stays down.
      - alert: FluxWorkersSaturated
        expr: >-
          (
            controller_runtime_active_workers{job="flux", app="kustomize-controller", controller="kustomization"}
            ==
            controller_runtime_max_concurrent_reconciles{job="flux", app="kustomize-controller", controller="kustomization"}
          )
          and on(pod, controller)
          (workqueue_depth{job="flux", app="kustomize-controller", controller="kustomization"} > 0)
        for: 30m
        labels:
          severity: warning
          service: flux
        annotations:
          summary: Every kustomize-controller reconcile worker has been busy for 30 minutes.
          description: >-
            All {{ $value }} of {{ $labels.pod }}'s reconcile workers have been busy for 30
            minutes with Kustomizations still queued, so a changed Kustomization waits for a
            free worker. Unhealthy Kustomizations that each hold a worker for their timeout
            are the usual cause. List them with kubectl get kustomizations -A; suspending one
            frees its worker once its current wait ends.
