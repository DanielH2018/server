# M6's live health-gate drill, which lives from B-1d to B-1e. Plain YAML, never Jinja:
# prometheus-rules.yaml.j2 carries this file verbatim. The procedure is "The health-gate drill
# (B-1d and B-1e, live)" in docs/target-architecture/monitoring/m6-retire-kuma.md.
#
# HealthGateDrill fires from the first evaluation and never resolves. Its service="littlelink"
# puts it in littlelink's health gate, so `probe.py health littlelink` must exit non-zero and
# name it. Its drill="true" matches Alertmanager's drill route, which sits ahead of both
# critical routes and sends it to the blackhole receiver, so it pages nobody.
# alert_conventions.py admits its constant expression only for this name with this label.
# B-1e deletes this file, its observability_rule_groups entry, its promtool test and that
# exemption, and keeps the route.
groups:
  - name: health-gate-drill
    rules:
      - alert: HealthGateDrill
        expr: vector(1)
        labels:
          severity: critical
          drill: "true"
          service: littlelink
        annotations:
          summary: The health-gate drill holds littlelink's health gate red on purpose.
          description: >-
            M6's B-1d ships this rule so that probe.py health littlelink fails and names it.
            Alertmanager sends it to the blackhole receiver. B-1e removes it, and until then
            every health gate of littlelink fails.
