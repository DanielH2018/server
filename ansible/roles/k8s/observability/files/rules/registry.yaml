# The registry role's own alerts. Plain YAML, never Jinja: prometheus-rules.yaml.j2 carries this
# file verbatim.
#
# GhcrMirrorScaledToZero covers the case nothing else sees, and DockerhubMirrorScaledToZero does
# the same for the dockerhub-mirror. registry-gc.sh scales each mirror's Deployment to zero every
# Sunday and back when its phase ends, and the Deployment renders no
# `replicas:`, so a run killed between the two leaves it at 0/0. That passes rollout status,
# K8sDeploymentZeroAvailable (which wants spec replicas above zero) and the registry deploy's
# netpol probe, and containerd falls back to ghcr.io until a WAN outage finds the mirror gone.
# The next GC run restores it from its stamp, which can be a week away. registry's deploy
# restored it too while Ansible owned registry; Flux owns it now and renders no `replicas:`. The 2h hold is well past the GC's longest hold of
# the mirror: registry_k8s_gc_deadline_s (1200s) plus the scale-down and scale-up waits.
groups:
  - name: registry
    rules:
      # The second arm is conjoined with up == 1, so a failed kube-state-metrics scrape, which
      # the Cluster Scrape Targets tile pages, does not page here a second time. The first arm
      # is the zero-series alert: with no scrape job, nothing can see the count.
      - alert: GhcrMirrorScaledToZero
        expr: >-
          absent(up{job="kube-state-metrics"})
          or
          (kube_deployment_spec_replicas{job="kube-state-metrics", namespace="homelab", deployment="ghcr-mirror"} == 0
          and on() (up{job="kube-state-metrics"} == 1))
        for: 2h
        labels:
          severity: warning
          service: registry
        annotations:
          summary: The ghcr-mirror Deployment has wanted zero replicas for 2 hours.
          description: >-
            homelab/ghcr-mirror has been scaled to zero for 2 hours, or Prometheus has no
            kube-state-metrics scrape job. registry-gc.sh holds it at zero for at most about 25
            minutes, so a run probably died before its restore. Until the mirror serves again,
            containerd pulls ghcr.io images straight from GHCR and a WAN outage leaves no source
            to pull them from. Check `journalctl -t registry-gc` on daniel-box and that no
            registry-gc.sh is running, then `kubectl -n homelab scale deploy/ghcr-mirror
            --replicas=1`.
      # The same page for the dockerhub-mirror, which registry-gc.sh scales the same way after the
      # ghcr-mirror's phase (#6536). Its Deployment renders no `replicas:` either.
      - alert: DockerhubMirrorScaledToZero
        expr: >-
          absent(up{job="kube-state-metrics"})
          or
          (kube_deployment_spec_replicas{job="kube-state-metrics", namespace="homelab", deployment="dockerhub-mirror"} == 0
          and on() (up{job="kube-state-metrics"} == 1))
        for: 2h
        labels:
          severity: warning
          service: registry
        annotations:
          summary: The dockerhub-mirror Deployment has wanted zero replicas for 2 hours.
          description: >-
            homelab/dockerhub-mirror has been scaled to zero for 2 hours, or Prometheus has no
            kube-state-metrics scrape job. registry-gc.sh holds it at zero for at most about 25
            minutes, so a run probably died before its restore. Until the mirror serves again,
            containerd pulls docker.io images straight from Docker Hub and a WAN outage leaves no
            source to pull them from. Check `journalctl -t registry-gc` on daniel-box and that no
            registry-gc.sh is running, then `kubectl -n homelab scale deploy/dockerhub-mirror
            --replicas=1`.
      # node-exporter's ghcr-mirror-pull sidecar GETs nut's manifest through each node's ghcr.io
      # mirror endpoint every 600s (#5542). containerd falls back to ghcr.io past a broken
      # mirror, so while the WAN is up nothing else sees one. The `for:` rides out the weekly GC:
      # registry-gc.sh holds the mirror at zero for at most 1620s (the pod-exit and Job-delete
      # waits of 120s each, registry_k8s_gc_deadline_s of 1200s and the 180s rollout wait), and
      # a down verdict stands until the next write 600s later, so 37 minutes at most. 45m
      # clears that, and a mirror the GC left at zero is GhcrMirrorScaledToZero's page as well.
      - alert: GhcrMirrorPullFailed
        expr: homelab_check_success{check="ghcr-mirror-pull"} == 0
        for: 45m
        labels:
          severity: warning
          service: registry
        annotations:
          summary: "{{ $labels.origin }} cannot pull nut's manifest through its ghcr.io mirror endpoint."
          description: >-
            The ghcr-mirror-pull check on {{ $labels.origin }} has failed for 45 minutes. A GET of
            nut's manifest through the node's ghcr.io mirror endpoint was refused, timed out or
            answered an error, or the nut-ghcr-mirror-probe ConfigMap names no tag. containerd
            still pulls ghcr.io images straight from GHCR, so nothing breaks until a WAN outage,
            when nut cannot cold-start. Read the `ghcr-mirror-pull` container log of the
            node-exporter pod on {{ $labels.origin }}, then the ghcr-mirror pod, its
            NetworkPolicy and the node's registries.yaml.
      # A sidecar that stopped writing, per node, because the absent arm cannot name a node it
      # never saw. The 3000s literals equal DEADLINE_S in node-exporter's
      # files/ghcr-mirror-pull.sh, and ansible/roles/k8s/node-exporter/tests/test_ghcr_mirror_pull.py
      # pins them to it. `unless` leaves a dead exporter to ScrapeTargetDown.
      - alert: GhcrMirrorPullNotReporting
        expr: |
          (
              time() - homelab_check_last_run_timestamp_seconds{check="ghcr-mirror-pull",origin="daniel-box"} > 3000
            or
              absent_over_time(homelab_check_last_run_timestamp_seconds{check="ghcr-mirror-pull",origin="daniel-box"}[3000s])
          )
          unless on (origin) (up{job="node"} == 0)
        labels:
          severity: warning
          service: registry
        annotations:
          summary: daniel-box's ghcr.io mirror pull check has stopped reporting.
          description: >-
            No ghcr-mirror-pull verdict newer than 50 minutes reached Prometheus from daniel-box's
            textfile collector, so nothing is watching whether the node's ghcr.io mirror
            endpoint serves pulls. Read the log of the node-exporter pod's `ghcr-mirror-pull`
            container on daniel-box.
      - alert: GhcrMirrorPullNotReporting
        expr: |
          (
              time() - homelab_check_last_run_timestamp_seconds{check="ghcr-mirror-pull",origin="daniel-server"} > 3000
            or
              absent_over_time(homelab_check_last_run_timestamp_seconds{check="ghcr-mirror-pull",origin="daniel-server"}[3000s])
          )
          unless on (origin) (up{job="node"} == 0)
        labels:
          severity: warning
          service: registry
        annotations:
          summary: daniel-server's ghcr.io mirror pull check has stopped reporting.
          description: >-
            No ghcr-mirror-pull verdict newer than 50 minutes reached Prometheus from daniel-server's
            textfile collector, so nothing is watching whether the node's ghcr.io mirror
            endpoint serves pulls. Read the log of the node-exporter pod's `ghcr-mirror-pull`
            container on daniel-server.
      # node-exporter's dockerhub-mirror-pull sidecar GETs the exporter's own image by digest
      # through each node's docker.io mirror endpoint every 600s (#6535). containerd falls back to
      # Docker Hub past a broken mirror, as it does to GHCR. The 45m hold is GhcrMirrorPullFailed's:
      # registry-gc.sh holds this mirror at zero for the same bounded window.
      - alert: DockerhubMirrorPullFailed
        expr: homelab_check_success{check="dockerhub-mirror-pull"} == 0
        for: 45m
        labels:
          severity: warning
          service: registry
        annotations:
          summary: "{{ $labels.origin }} cannot pull a manifest through its docker.io mirror endpoint."
          description: >-
            The dockerhub-mirror-pull check on {{ $labels.origin }} has failed for 45 minutes. A
            GET of node-exporter's own manifest, by digest, through the node's docker.io mirror
            endpoint was refused, timed out or answered an error. containerd still pulls docker.io
            images straight from Docker Hub, so nothing breaks until a WAN outage, when a pod whose
            image is not on its node cannot start. Read the `dockerhub-mirror-pull` container log
            of the node-exporter pod on {{ $labels.origin }}, then the dockerhub-mirror pod, its
            NetworkPolicy and the node's registries.yaml.
      # The 3000s literals equal DEADLINE_S in node-exporter's files/ghcr-mirror-pull.sh, which
      # this sidecar also runs, and ansible/roles/k8s/node-exporter/tests/test_dockerhub_mirror_pull.py
      # pins them to it.
      - alert: DockerhubMirrorPullNotReporting
        expr: |
          (
              time() - homelab_check_last_run_timestamp_seconds{check="dockerhub-mirror-pull",origin="daniel-box"} > 3000
            or
              absent_over_time(homelab_check_last_run_timestamp_seconds{check="dockerhub-mirror-pull",origin="daniel-box"}[3000s])
          )
          unless on (origin) (up{job="node"} == 0)
        labels:
          severity: warning
          service: registry
        annotations:
          summary: daniel-box's docker.io mirror pull check has stopped reporting.
          description: >-
            No dockerhub-mirror-pull verdict newer than 50 minutes reached Prometheus from
            daniel-box's textfile collector, so nothing is watching whether the node's docker.io
            mirror endpoint serves pulls. Read the log of the node-exporter pod's
            `dockerhub-mirror-pull` container on daniel-box.
      - alert: DockerhubMirrorPullNotReporting
        expr: |
          (
              time() - homelab_check_last_run_timestamp_seconds{check="dockerhub-mirror-pull",origin="daniel-server"} > 3000
            or
              absent_over_time(homelab_check_last_run_timestamp_seconds{check="dockerhub-mirror-pull",origin="daniel-server"}[3000s])
          )
          unless on (origin) (up{job="node"} == 0)
        labels:
          severity: warning
          service: registry
        annotations:
          summary: daniel-server's docker.io mirror pull check has stopped reporting.
          description: >-
            No dockerhub-mirror-pull verdict newer than 50 minutes reached Prometheus from
            daniel-server's textfile collector, so nothing is watching whether the node's docker.io
            mirror endpoint serves pulls. Read the log of the node-exporter pod's
            `dockerhub-mirror-pull` container on daniel-server.
