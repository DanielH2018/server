# The monitor-bridge check exporter's own rules. Plain YAML, never Jinja: prometheus-rules.yaml.j2
# carries this file verbatim. The design is docs/target-architecture/monitoring/m6-retire-kuma.md,
# "The bridge as an exporter" and "A6's PRs" (A6-2). The series come from the `monitor-bridge`
# scrape job, port 9181, which monitor-bridge's files/verdict_export.py serves.
#
# Both rules are `for: 10m`, two INTERVALs of 300s. The pod has no readinessProbe, so a restart
# reads `up == 0` for a scrape, and the first cycle after it has not yet set every row's gauge.
# Without the hold, either rule would fire on every monitor-bridge deploy.
groups:
  - name: bridge-exporter
    rules:
      # THE WAN FAMILY (A6-3): the gate row and the four rows behind it. Each rule reads one
      # row's `homelab_check_success` gauge, which the exporter sets to 0 when the row's verdict
      # is down. A dependent whose gate reads down is skipped and exports 0 in the same cycle as
      # the gate, so source and targets reach Alertmanager in one batch. None of these rules has
      # a `for:`: monitor-bridge's WAN body already needs both providers to fail, and none of
      # the four dependents is a `startup_grace` row. The gate shares this group with its
      # dependents, so Prometheus evaluates them together. `requires: wan` marks a dependent
      # for the inhibit rule in alertmanager-secret.yaml.j2, whose source is WANUnreachable.
      # A row with no series stays quiet here: BridgeCheckStale owns a missing row.
      # `service` is monitor-bridge on all five, the component that evaluates the rows until C-7.
      # Every rule is SHADOW UNTIL A6-7b, while Kuma's tile for the row pages.
      - alert: WANUnreachable
        expr: homelab_check_success{job="monitor-bridge", check="wan_reachable"} == 0
        labels:
          severity: critical
          service: monitor-bridge
          shadow: "true"
        annotations:
          summary: monitor-bridge cannot reach the public internet.
          description: >-
            Both WAN probe providers failed from monitor-bridge, so this house has no working link
            or no DNS. The rows behind this gate (Discord delivery, R2 headroom, Cloudflare IP
            drift and Healthchecks.io console drift) are held by the inhibit rule. Read the
            probe's failure messages in the monitor-bridge log in the homelab namespace.
      - alert: DiscordDeliveryFailing
        expr: homelab_check_success{job="monitor-bridge", check="discord"} == 0
        labels:
          severity: critical
          service: monitor-bridge
          requires: wan
          shadow: "true"
        annotations:
          summary: A Discord webhook no longer resolves, or the SMTP backstop login failed.
          description: >-
            One of the five Discord webhooks (Kuma, CrowdSec, gitops-deploy, *arr, healthchecks)
            no longer resolves, or the Gmail SMTP backstop login failed. Rotate the named webhook
            in SOPS and redeploy its consumer. The monitor-bridge log names the failing webhook.
      - alert: R2FreeTierHeadroomLow
        expr: homelab_check_success{job="monitor-bridge", check="r2_usage"} == 0
        labels:
          severity: critical
          service: monitor-bridge
          requires: wan
          shadow: "true"
        annotations:
          summary: R2 usage is past 80% of the free tier on at least one arm.
          description: >-
            Month-to-date R2 storage, Class A operations, Class B operations or incomplete
            multipart uploads passed 80% of the free tier. Cloudflare offers no cap on R2, so this
            is the only boundary. The runbook is longhorn-backup-tiering.
      - alert: CloudflareIPRangesDrifted
        expr: homelab_check_success{job="monitor-bridge", check="cloudflare_ips_drift"} == 0
        labels:
          severity: warning
          service: monitor-bridge
          requires: wan
          shadow: "true"
        annotations:
          summary: Cloudflare's published IP ranges differ from cloudflare_ips, or the fetch failed.
          description: >-
            cloudflare_ips in group_vars/all.yml sets Traefik's trustedIPs and the netpol
            allow-list. Update it and redeploy traefik, netpol-baseline and monitor-bridge. A
            failed fetch is retried every cycle; a match is re-checked daily.
      - alert: HealthchecksConsoleDrifted
        expr: homelab_check_success{job="monitor-bridge", check="healthchecks_drift"} == 0
        labels:
          severity: warning
          service: monitor-bridge
          requires: wan
          shadow: "true"
        annotations:
          summary: A Healthchecks.io dead-man check differs from the documented schedule.
          description: >-
            The monitor-bridge log names each slug and field that differs, or a check missing from
            the console. Fix the console, or change docs/healthchecks-io-deadman.md and
            monitor_bridge_healthchecks_expected together and redeploy monitor-bridge.
      # SHADOW UNTIL A6-7b. Kuma's Cluster Scrape Targets tile pages a failed scrape of this job
      # today, because the job carries no `origin` label (M1 convention 5 allows one pager). The
      # absent() arm is what that tile cannot see: a scrape job removed from prometheus.yml.
      - alert: MonitorBridgeDown
        expr: up{job="monitor-bridge"} == 0 or absent(up{job="monitor-bridge"})
        for: 10m
        labels:
          severity: critical
          service: monitor-bridge
          shadow: "true"
        annotations:
          summary: Prometheus cannot scrape monitor-bridge's check exporter.
          description: >-
            up{job="monitor-bridge"} has been 0 or missing for 10 minutes, so either the
            monitor-bridge pod is down or the monitor-bridge scrape job is gone from
            prometheus.yml. Read the pod's events and log in the homelab namespace.
      # SHADOW UNTIL A6-7b, with the rule above. It is the class-3 guard of
      # docs/failure-classes.md: a run loop that hangs behind a live HTTP thread keeps `up` at 1
      # and serves stale gauges. It is one aggregate alert, so a hung loop pages once rather than
      # once per row. The first arm finds any row whose timestamp is older than the row's own
      # deadline. The second finds a row count below homelab_check_rows, which the exporter sets
      # from the check table, so no literal here goes stale when a row is deleted. A dead
      # exporter has neither series, and MonitorBridgeDown owns that case.
      - alert: BridgeCheckStale
        expr: |
          count(
            time() - homelab_check_last_run_timestamp_seconds{job="monitor-bridge"}
            > homelab_check_deadline_seconds{job="monitor-bridge"}
          )
          or
          (
            count(homelab_check_success{job="monitor-bridge"})
            < on() homelab_check_rows{job="monitor-bridge"}
          )
        for: 10m
        labels:
          severity: critical
          service: monitor-bridge
          shadow: "true"
        annotations:
          summary: monitor-bridge's run loop has stopped recording some check verdicts.
          description: >-
            For 10 minutes either a row's homelab_check_last_run_timestamp_seconds has aged past
            its homelab_check_deadline_seconds, or fewer rows export homelab_check_success than
            homelab_check_rows counts. The scrape works, so the run loop is hung or skipping
            rows. Read the monitor-bridge pod's log in the homelab namespace.
