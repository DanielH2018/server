# The temporary guard for M6's no-pager windows (docs/target-architecture/monitoring/
# m6-retire-kuma.md, "No-pager windows"). A check pages from Kuma or from Alertmanager, never
# both, and a window in which a batch has neither is the unsafe direction.
#
# A rule that does not fire has no series, so PromQL cannot read its `shadow` label. This rule
# lists the tiles itself. Each shadow PR adds one
# `absent_over_time(monitor_status{monitor_name="<tile>"}[2h])` term per tile its batch retires,
# and each shadow-dropping PR (Cutover-b, Cutover-1b, A6-7b) removes its batch's terms. A term
# exists exactly while its rule is shadow, and it reads 1 once the tile has reported nothing for
# two hours. A PR that removes the last term deletes this file and its
# `observability_rule_groups` entry; a PR that adds a term to a missing group re-creates both.
#
# THE TWO HOURS LIVE IN THE EXPRESSION, NEVER IN `for:`. renderer_lib/soak.py:longest_for adds
# the `for:` of every unshadowed critical rule to its service's soak wait, so `for: 2h` on a
# uptime-kuma rule lengthens every promotion's soak by 7200s and fails
# ansible/tests/setup/test_lander_deadlines_cover_the_soak.py.
#
# A Kuma outage fires no term, because Kuma's own liveness pager covers it. `absent_over_time`
# carries the tile's name as a label, so the page names the tile. `service: uptime-kuma` is the
# role whose tiles it counts, so C7's gate on `observability` does not read it.
# DECIDED: each term's range is max(2h, 2 x the tile's push interval + 10m). Kuma restarts
# (19 in 7 days) drop a push tile's monitor_status series until its next push, so a 2h range
# on a tile that pushes less often than hourly would page while the tile is healthy. A daily
# tile therefore uses [48h10m]. Add a term with its own interval's range, never a bare 2h.
# Read the interval from the tile's declaration. Every monitor-bridge tile shares
# uptime_kuma_k8s_bridge_push_interval (1200s), so its range is [2h].
# A tile whose interval is 90000s (a daily timer plus an hour) uses [50h10m], as B3's two do.
# B9's three AIDE tiles (626400s) use [348h10m] and its three rkhunter tiles (612000s) use
# [340h10m], both inside the 30d retention. B6c's Registry GC tile (612000s) uses [340h10m] too.
# B4's two etcd drill tiles had no term: a monthly push tile's range would be 70d10m, which
# exceeds Prometheus's 30d retention. B4's five [2h] terms bounded their window, and all of B4's
# terms left with its Cutover-1b.
groups:
  - name: kuma-cutover
    rules:
      - alert: CheckWithoutPager
        expr: |
          (
              absent_over_time(monitor_status{monitor_name="AIDE Integrity (daniel-box)"}[348h10m])
            or
              absent_over_time(monitor_status{monitor_name="AIDE Integrity (daniel-server)"}[348h10m])
            or
              absent_over_time(monitor_status{monitor_name="AIDE Integrity (daniel-pi)"}[348h10m])
            or
              absent_over_time(monitor_status{monitor_name="rkhunter Scan (daniel-box)"}[340h10m])
            or
              absent_over_time(monitor_status{monitor_name="rkhunter Scan (daniel-server)"}[340h10m])
            or
              absent_over_time(monitor_status{monitor_name="rkhunter Scan (daniel-pi)"}[340h10m])
            or
              absent_over_time(monitor_status{monitor_name="Registry GC"}[340h10m])
            or
              absent_over_time(monitor_status{monitor_name="n8n Prod Workflows"}[2h])
            or
              absent_over_time(monitor_status{monitor_name="Bazarr Health"}[2h])
            or
              absent_over_time(monitor_status{monitor_name="Prowlarr Indexers"}[2h])
            or
              absent_over_time(monitor_status{monitor_name="SMART Data / Health"}[2h])
            or
              absent_over_time(monitor_status{monitor_name="k3s Speedtest"}[2h])
            or
              absent_over_time(monitor_status{monitor_name="Swallowed Push Verdicts"}[2h])
            or
              absent_over_time(monitor_status{monitor_name="WAN Reachable"}[2h])
            or
              absent_over_time(monitor_status{monitor_name="Discord Delivery"}[2h])
            or
              absent_over_time(monitor_status{monitor_name="R2 Free Tier Headroom"}[2h])
            or
              absent_over_time(monitor_status{monitor_name="Cloudflare IP Drift"}[2h])
            or
              absent_over_time(monitor_status{monitor_name="Healthchecks.io Console Drift"}[2h])
            or
              absent_over_time(monitor_status{monitor_name="B2 Reachable"}[2h])
            or
              absent_over_time(monitor_status{monitor_name="B2 Free Tier Headroom"}[2h])
            or
              absent_over_time(monitor_status{monitor_name="Arr Queue Warnings"}[2h])
            or
              absent_over_time(monitor_status{monitor_name="GitOps Deploy — Alive"}[2h])
            or
              absent_over_time(monitor_status{monitor_name="GitOps Deploy — Status"}[2h])
            or
              absent_over_time(monitor_status{monitor_name="etcd Restore Drill"}[2h])
            or
              absent_over_time(monitor_status{monitor_name="Home Assistant Automations"}[2h])
            or
              absent_over_time(monitor_status{monitor_name="Host Packages — Status"}[2h])
          )
          unless on() (up{job="uptime-kuma"} == 0)
        labels:
          severity: critical
          service: uptime-kuma
        annotations:
          summary: Kuma's {{ $labels.monitor_name }} tile is gone and no alert rule pages in its place.
          description: >-
            M6's cutover removed the {{ $labels.monitor_name }} tile more than two hours ago, and
            its replacement rule still carries shadow="true". Drop `shadow` from the rule, or
            revert the Kuma-side PR to restore the tile.
