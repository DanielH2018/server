            or
              absent_over_time(monitor_status{monitor_name="Loki"}[2h])
            or
              absent_over_time(monitor_status{monitor_name="k3s homelab-mcp (edge gate)"}[2h])
            or
              absent_over_time(monitor_status{monitor_name="Homelab Edge (all-clear)"}[2h])
            or
              absent_over_time(monitor_status{monitor_name="Pi-hole k8s DNS"}[2h])
            or
              absent_over_time(monitor_status{monitor_name="k3s Mosquitto (VIP)"}[2h])
            or
              absent_over_time(monitor_status{monitor_name="k3s Jellyfin (VIP)"}[2h])
            or
