# The alert plane's own health: whether Prometheus loaded its rules, and whether Alertmanager
# delivers and is still visible to Prometheus. Plain YAML, never Jinja: prometheus-rules.yaml.j2
# carries this file verbatim, so the Go templates in the annotations reach Prometheus intact.
# The conventions every rule file here follows are in
# docs/target-architecture/monitoring/m1-alertmanager.md.
groups:
  - name: alerting-meta
    rules:
      # Always fires. Alertmanager routes it to the alertmanager-watchdog check on
      # Healthchecks.io every 60s, so a silent Alertmanager, or a Prometheus that stopped
      # sending it alerts, pages off-site. The C7 health gate excludes it by name, and
      # alert_conventions.py holds the repo to exactly one rule of that name.
      - alert: Watchdog
        expr: vector(1)
        labels:
          severity: info
          service: observability
        annotations:
          summary: The alert pipeline is alive. This alert always fires.
      # prometheus_config_last_reload_successful covers the rule files as well as
      # prometheus.yml: a rule file that fails to load fails the whole reload, and Prometheus
      # keeps evaluating the last good set.
      - alert: PrometheusRuleReloadFailed
        expr: prometheus_config_last_reload_successful == 0
        for: 10m
        labels:
          severity: warning
          service: observability
        annotations:
          summary: Prometheus failed to reload its config or rule files.
          description: >-
            {{ $labels.instance }} has reported a failed reload for 10 minutes, so it still
            evaluates the last rule set it loaded. Its log names the file it refused.
      # A rule that loaded can still fail every evaluation. A join that matches many-to-many
      # is the usual cause, and the rule's output then goes stale: workload-service's
      # recording rules stop, and every alert joined to them falls back to service="unmapped".
      # PrometheusRuleReloadFailed cannot see this, because the reload succeeded. No other check
      # covers it, so it pages without a shadow label.
      - alert: PrometheusRuleEvaluationFailures
        expr: sum by (rule_group) (increase(prometheus_rule_evaluation_failures_total[10m])) > 0
        labels:
          severity: warning
          service: observability
        annotations:
          summary: Prometheus failed to evaluate a rule in {{ $labels.rule_group }}.
          description: >-
            At least one rule in {{ $labels.rule_group }} failed an evaluation in the last 10
            minutes, so its output is missing or stale. The Prometheus log names the rule and
            the error.
      # This rule covers a send Alertmanager drops. Critical, so it routes to
      # Discord and email both, and a dropped Discord send still reaches the operator.
      - alert: AlertmanagerNotificationsFailing
        expr: >-
          sum by (integration)
          (increase(alertmanager_notifications_failed_total{job="alertmanager"}[30m])) > 0
        labels:
          severity: critical
          service: observability
        annotations:
          summary: Alertmanager failed to deliver through {{ $labels.integration }}.
          description: >-
            Alertmanager's {{ $labels.integration }} integration failed at least one send in
            the last 30 minutes. Read alertmanager_notifications_failed_total by reason, and
            the alertmanager pod's log.
      # This family's zero-series alert. Without it, lost Alertmanager metrics would leave
      # AlertmanagerNotificationsFailing evaluating to nothing.
      #
      # A FAILED SCRAPE IS NOT THIS RULE'S TO PAGE. The job is configured and up{job="alertmanager"}
      # reads 0. ScrapeTargetDown pages that condition since M6's batch A3, and its rule for job
      # alertmanager carries service="observability" and no exemption: this rule's second arm
      # requires up == 1, so an exemption would leave the failed scrape with no pager.
      # The second arm is conjoined with up == 1 so that this rule does not page
      # ScrapeTargetDown's condition a second time.
      - alert: AlertmanagerMetricsMissing
        expr: >-
          absent(up{job="alertmanager"})
          or
          (absent(alertmanager_notifications_failed_total{job="alertmanager"})
          and on() (up{job="alertmanager"} == 1))
        for: 10m
        labels:
          severity: warning
          service: observability
        annotations:
          summary: Prometheus has lost Alertmanager's scrape job or its delivery counter.
          description: >-
            Either no up{job="alertmanager"} series exists, so the alertmanager job is gone from
            prometheus.yml, or the scrape works and alertmanager_notifications_failed_total is
            gone, as after an upgrade that renamed it. AlertmanagerNotificationsFailing cannot
            fire until the series is back.
      # A warning notifies Discord alone and repeats there every 6h, so one that never resolves
      # reaches nobody who acts on it (#8218). This rule ages each firing warning into a
      # critical, which routes to Discord and email. The original alertname and service move to
      # `escalated_from` and `escalated_service`: Prometheus overwrites `alertname` with this
      # rule's name, and a source `service` would put a critical in that tag's health gate and
      # block the landing that fixes the job. `alert-escalation` is no deploy tag, so no gate
      # reads this alert. To silence one escalation, match `escalated_from`.
      #
      # Shadow and drill alerts page nobody, so they never escalate. A rule whose warning holds
      # by design, such as DeployHoldActive, carries `escalate: "false"` and is left out too.
      #
      # NO `for:`. Prometheus does not carry an alert's activation across a restart
      # (m6-retire-kuma.md, Open question 9), so a 48h `for` would start over at every restart.
      # The age is read from the stored ALERTS samples instead: the warning fires now, fired in
      # the hour before the window opened, and fired in at least 95% of the window's
      # evaluations, counted against the Watchdog's, which fires at every one. A restart
      # gap removes samples from both counts, and an absence shorter than about 2h does not
      # restart the age.
      - alert: WarningUnresolved
        expr: >-
          label_replace(
            label_replace(
              max without (alertstate) (
                ALERTS{alertstate="firing", severity="warning", shadow!="true", drill!="true", escalate!="false"}
                and
                last_over_time(ALERTS{alertstate="firing", severity="warning", shadow!="true", drill!="true", escalate!="false"}[1h] offset 48h)
                and
                count_over_time(ALERTS{alertstate="firing", severity="warning", shadow!="true", drill!="true", escalate!="false"}[48h])
                >= on() group_left()
                0.95 * count_over_time(ALERTS{alertname="Watchdog", alertstate="firing"}[48h])
              ),
              "escalated_from", "$1", "alertname", "(.+)"
            ),
            "escalated_service", "$1", "service", "(.+)"
          )
        labels:
          severity: critical
          service: alert-escalation
        annotations:
          summary: >-
            {{ $labels.escalated_from }} ({{ $labels.escalated_service }}) has fired as a
            warning for 48 hours.
          description: >-
            The warning {{ $labels.escalated_from }} for {{ $labels.escalated_service }} has
            fired for 48 hours, and its Discord repeats have not cleared it. Its own
            description names the failing job. This page resolves when the warning does. If
            the warning holds by design, give its rule the label escalate: "false".
