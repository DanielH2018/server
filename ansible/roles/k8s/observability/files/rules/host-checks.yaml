      # A replaced Longhorn instance-manager leaves the iSCSI sessions it served in the kernel,
      # FREE with a failed connection, and the next attach of such a volume on that node loops
      # (#5826). The node-exporter DaemonSet's `iscsi-sessions` sidecar writes one
      # homelab_iscsi_session_info series per session. A session is FAILED for up to iscsid's
      # replacement_timeout while it reconnects, so 15m keeps a recovering session quiet. One
      # rule per k3s node, so `service` stays a literal. Both NotReporting rules mirror
      # DiskHealthNotReporting's two arms. Their 300s literals equal DEADLINE_S in
      # node-exporter's files/iscsi-sessions.sh, and
      # ansible/roles/k8s/node-exporter/tests/test_iscsi_sessions.py pins them to it.
      - alert: IscsiSessionStale
        expr: homelab_iscsi_session_info{state!="LOGGED_IN",origin="daniel-box"} == 1
        for: 15m
        labels:
          severity: warning
          service: daniel-box
        annotations:
          summary: daniel-box holds an iSCSI session that is not logged in.
          description: >-
            {{ $labels.session }} on daniel-box has read {{ $labels.state }} for 15 minutes,
            for target {{ $labels.target }}. The next attach of that volume on daniel-box fails
            its frontend init on `iscsiadm --logout` (error 32), and Longhorn deletes the pod
            every ~30s. Clean it up with docs/longhorn-disaster-recovery.md, "A stale iSCSI
            session blocks an attach".
