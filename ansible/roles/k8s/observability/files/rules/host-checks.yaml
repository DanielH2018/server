      - alert: AideCheckNotReporting
        expr: |
          (
              time() - homelab_check_last_run_timestamp_seconds{check="aide-check",origin="daniel-server"} > 626400
            or
              absent_over_time(homelab_check_last_run_timestamp_seconds{check="aide-check",origin="daniel-server"}[626400s])
          )
          unless on (origin) (up{job="node"} == 0)
        labels:
          severity: warning
          service: daniel-server
          shadow: "true"
        annotations:
          summary: daniel-server's weekly AIDE check has stopped reporting.
          description: >-
            No aide-check verdict newer than 626400s reached Prometheus from daniel-server's
