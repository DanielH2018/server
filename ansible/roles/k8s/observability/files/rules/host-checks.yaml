# Host checks that write a node_exporter textfile, read from the `node` scrape job, or from
# `node-pi` for daniel-pi. Plain YAML, never Jinja: prometheus-rules.yaml.j2 carries this file
# verbatim. The producer metric contract and the design are
# docs/target-architecture/monitoring/m3-textfile-timer.md, "The rules". The host-plane rules at
# the end are H3's (docs/target-architecture/host/h3-pi-pilot.md, "Host rules (PR H3.5d, C7)").
#
# Every rule names its host as a literal `service`. A node is not a workload, so M2's
# workload-service join cannot supply it, and deriving it from `origin` needs a label_replace
# that M1 has not admitted (M3's open question 3).
groups:
  - name: host-checks
    rules:
      - alert: DiskHealthFailed
        expr: homelab_check_success{check="disk-health",origin="daniel-box"} == 0
        labels:
          severity: critical
          service: daniel-box
        annotations:
          summary: daniel-box's root disk check is red.
          description: >-
            disk-health.sh on daniel-box read the root filesystem above its threshold, or df
            failed. Longhorn stops scheduling replicas on the node at 75%.
            homelab_disk_root_used_ratio{check="disk-health"} holds the share it read, and the
            `disk-health` syslog tag holds the run's message.
      # SHADOW UNTIL M3's PR 5, as above. Kuma's tile pages a silent cron today.
      #
      # The first arm catches a file that stopped being refreshed: node_exporter keeps serving
      # its last timestamp. The second catches a file that is gone, or a series that never
      # arrived. It is absent_over_time over the deadline, never a bare absent(): Prometheus
      # marks a target's series stale on every failed scrape and every node-exporter roll, and
      # a bare absent() would fire at the next evaluation. The `unless` clause leaves a dead
      # exporter to the bridge's `targets` check, so one dead exporter pages once.
      #
      # Both 1500s literals equal the DEADLINE_S that disk-health.sh.j2 renders from
      # k3s_disk_health_cron_minute. ansible/tests/services/test_disk_health_rule_literals.py
      # pins them to it.
      - alert: DiskHealthNotReporting
        expr: |
          (
              time() - homelab_check_last_run_timestamp_seconds{check="disk-health",origin="daniel-box"} > 1500
            or
              absent_over_time(homelab_check_last_run_timestamp_seconds{check="disk-health",origin="daniel-box"}[1500s])
          )
          unless on (origin) (up{job="node"} == 0)
        labels:
          severity: critical
          service: daniel-box
        annotations:
          summary: daniel-box's root disk check has stopped reporting.
          description: >-
            No disk-health verdict newer than 25 minutes reached Prometheus from daniel-box's
            textfile collector, so nothing is watching the root disk. Read the `daniel-box disk
            health` cron and the `disk-health` syslog tag, then
            /var/lib/node-exporter-textfile/disk-health.prom on the host.
      # SHADOW UNTIL M6's BATCH B6 CUTOVER-1b. The next four rules replace Kuma's `Artifacts Peer
      # Sync` and `k3s Telemetry OTLP Door` tiles, so they carry shadow="true" while the tiles
      # page (docs/target-architecture/monitoring/m6-retire-kuma.md, "The cutover order").
      # Both producers are daniel-box crons that write a check file through
      # homelab-check-lib.sh. Each NotReporting pair mirrors DiskHealthNotReporting, and its two
      # literals equal the deadline the producer renders from its own cron minute:
      # ansible/tests/services/test_b6a_rule_literals.py pins them. Both tiles notify Discord
      # only, so the rules are `warning`.
      - alert: ArtifactsSyncFailed
        expr: homelab_check_success{check="sync-artifacts",origin="daniel-box"} == 0
        labels:
          severity: warning
          service: daniel-box
          shadow: "true"
        annotations:
          summary: The peer artifact sync on daniel-box is failing.
          description: >-
            sync-artifacts.sh has failed a peer for claude_code_artifacts_sync_alert_after_failures
            consecutive runs, so that peer's artifacts are stale in the browser. Run `journalctl -t
            sync-artifacts` on daniel-box for the peer and its streak, then ssh to the named peer.
      - alert: ArtifactsSyncNotReporting
        expr: |
          (
              time() - homelab_check_last_run_timestamp_seconds{check="sync-artifacts",origin="daniel-box"} > 900
            or
              absent_over_time(homelab_check_last_run_timestamp_seconds{check="sync-artifacts",origin="daniel-box"}[900s])
          )
          unless on (origin) (up{job="node"} == 0)
        labels:
          severity: warning
          service: daniel-box
          shadow: "true"
        annotations:
          summary: The peer artifact sync on daniel-box has stopped reporting.
          description: >-
            No sync-artifacts verdict newer than 15 minutes reached Prometheus from daniel-box's
            textfile collector, so the cron stopped, or its flock is held by a hung run. Read the
            `Sync peer Claude artifacts` cron and `journalctl -t sync-artifacts`, then
            /var/lib/node-exporter-textfile/sync-artifacts.prom on the host.
      - alert: OtlpDoorClosed
        expr: homelab_check_success{check="claude-otel-health",origin="daniel-box"} == 0
        labels:
          severity: warning
          service: daniel-box
          shadow: "true"
        annotations:
          summary: The telemetry OTLP receiver on daniel-box's loopback refuses connections.
          description: >-
            Claude Code cannot export telemetry even with every pod Ready, because the hostPort
            DNAT is an iptables rule rather than a socket. Check the otel-collector DaemonSet pod
            on daniel-box, then the portmap rule.
      - alert: OtlpDoorNotReporting
        expr: |
          (
              time() - homelab_check_last_run_timestamp_seconds{check="claude-otel-health",origin="daniel-box"} > 1500
            or
              absent_over_time(homelab_check_last_run_timestamp_seconds{check="claude-otel-health",origin="daniel-box"}[1500s])
          )
          unless on (origin) (up{job="node"} == 0)
        labels:
          severity: warning
          service: daniel-box
          shadow: "true"
        annotations:
          summary: The telemetry OTLP-door check on daniel-box has stopped reporting.
          description: >-
            No claude-otel-health verdict newer than 25 minutes reached Prometheus from daniel-box's
            textfile collector, so nothing is watching the OTLP door. Read the `Claude Code
            telemetry health` cron and `journalctl -t claude-otel-health`, then
            /var/lib/node-exporter-textfile/claude-otel-health.prom on the host.
      # M6 BATCH B1, SHADOW UNTIL ITS CUTOVER-1B. The five k3s crons write the textfile beside
      # their Kuma push, and Kuma's tiles page the same verdicts until Cutover-1a deletes
      # them. Each check has the DiskHealth pair: `Failed` reads the verdict, and
      # `NotReporting` reads the file's age. The deadline literal in a NotReporting rule
      # equals the DEADLINE_S its producer renders, and
      # ansible/tests/services/test_b1_rule_literals.py pins the two together. A daily check
      # gets a day plus an hour (k3s_daily_check_deadline_s), the interval of its Kuma tile.
      # The `unless` clause leaves a dead exporter to the bridge's `targets` check.
      - alert: LonghornBackupHealthFailed
        expr: homelab_check_success{check="longhorn-backup-health",origin="daniel-box"} == 0
        labels:
          severity: critical
          service: daniel-box
          shadow: "true"
        annotations:
          summary: daniel-box's Longhorn backup check is red.
          description: >-
            longhorn_backup_health.py on daniel-box reported a failing backup-plane check: an
            unavailable backup target, a stale or errored backup, a failed job, or a restore drill
            that is overdue. `journalctl -t longhorn-backup-health` names the check. Read
            docs/longhorn-disaster-recovery.md after it.
      - alert: LonghornBackupHealthNotReporting
        expr: |
          (
              time() - homelab_check_last_run_timestamp_seconds{check="longhorn-backup-health",origin="daniel-box"} > 1500
            or
              absent_over_time(homelab_check_last_run_timestamp_seconds{check="longhorn-backup-health",origin="daniel-box"}[1500s])
          )
          unless on (origin) (up{job="node"} == 0)
        labels:
          severity: critical
          service: daniel-box
          shadow: "true"
        annotations:
          summary: daniel-box's longhorn-backup-health check has stopped reporting.
          description: >-
            No longhorn-backup-health verdict newer than 25 minutes reached Prometheus from daniel-box's
            textfile collector, so nothing is watching the Longhorn backup plane. Read the `Longhorn
            backup health` cron and the `longhorn-backup-health` syslog tag, then
            /var/lib/node-exporter-textfile/longhorn-backup-health.prom on the host.
      - alert: EtcdSnapshotOffboxFailed
        expr: homelab_check_success{check="etcd-snapshot-offbox",origin="daniel-box"} == 0
        labels:
          severity: critical
          service: daniel-box
          shadow: "true"
        annotations:
          summary: daniel-box's off-box etcd snapshot check is red.
          description: >-
            etcd-snapshot-offbox.sh on daniel-box could not take or upload the etcd snapshot, or the
            cluster token changed since the off-box copy was stamped. `journalctl -t
            etcd-snapshot-offbox` names which. Read docs/k3s-etcd-restore.md after it.
      - alert: EtcdSnapshotOffboxNotReporting
        expr: |
          (
              time() - homelab_check_last_run_timestamp_seconds{check="etcd-snapshot-offbox",origin="daniel-box"} > 90000
            or
              absent_over_time(homelab_check_last_run_timestamp_seconds{check="etcd-snapshot-offbox",origin="daniel-box"}[90000s])
          )
          unless on (origin) (up{job="node"} == 0)
        labels:
          severity: critical
          service: daniel-box
          shadow: "true"
        annotations:
          summary: daniel-box's etcd-snapshot-offbox check has stopped reporting.
          description: >-
            No etcd-snapshot-offbox verdict newer than 25 hours reached Prometheus from daniel-box's
            textfile collector, so nothing is watching the off-box etcd snapshot. Read the `Off-box
            etcd snapshot` cron and the `etcd-snapshot-offbox` syslog tag, then
            /var/lib/node-exporter-textfile/etcd-snapshot-offbox.prom on the host.
      - alert: ManifestPruneCheckFailed
        expr: homelab_check_success{check="manifest-prune-check",origin="daniel-box"} == 0
        labels:
          severity: warning
          service: daniel-box
          shadow: "true"
        annotations:
          summary: daniel-box has deployed-artifact drift.
          description: >-
            manifest-prune-check.sh on daniel-box found a live cluster object that no staged
            manifest declares, a deployed setup file that differs from the repo, or a rendered
            script that is older than its template. `journalctl -t manifest-prune-check` names the
            arm and the object.
      - alert: ManifestPruneCheckNotReporting
        expr: |
          (
              time() - homelab_check_last_run_timestamp_seconds{check="manifest-prune-check",origin="daniel-box"} > 90000
            or
