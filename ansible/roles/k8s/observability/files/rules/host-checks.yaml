      # The weekly host-maintenance crons (#6179): apt autoremove and the dpkg purge on every
      # host, the firmware update on daniel-box, the one host with fwupd. Each runs through
      # initial_setup's files/host-maintenance.sh, which writes the check's textfile with
      # success 0 when the job's command failed. No Kuma tile or Healthchecks.io check watches
      # these crons, so every rule here pages, and none is shadow: a shadow NotReporting source
      # would still inhibit HostCheckOverdue and leave a stopped cron paging nobody.
      #
