# Host checks that write a node_exporter textfile, read from the `node` scrape job, or from
# `node-pi` for daniel-pi. Plain YAML, never Jinja: prometheus-rules.yaml.j2 carries this file
# verbatim. The producer metric contract and the design are
# docs/target-architecture/monitoring/m3-textfile-timer.md, "The rules". The host-plane rules at
# the end are H3's (docs/target-architecture/host/h3-pi-pilot.md, "Host rules (PR H3.5d, C7)").
#
# Every rule names its host as a literal `service`. A node is not a workload, so M2's
# workload-service join cannot supply it, and deriving it from `origin` needs a label_replace
# that M1 has not admitted (M3's open question 3).
groups:
  - name: host-checks
    rules:
      # SHADOW UNTIL M3's PR 5. Kuma's `daniel-box Disk` tile pages the same red verdict until
      # PR 5 deletes the tile and drops this label in the same commit.
      - alert: DiskHealthFailed
        expr: homelab_check_success{check="disk-health",origin="daniel-box"} == 0
        labels:
          severity: critical
          service: daniel-box
          shadow: "true"
        annotations:
          summary: daniel-box's root disk check is red.
          description: >-
            disk-health.sh on daniel-box read the root filesystem above its threshold, or df
            failed. Longhorn stops scheduling replicas on the node at 75%.
            homelab_disk_root_used_ratio{check="disk-health"} holds the share it read, and the
            `disk-health` syslog tag holds the run's message.
      # SHADOW UNTIL M3's PR 5, as above. Kuma's tile pages a silent cron today.
      #
      # The first arm catches a file that stopped being refreshed: node_exporter keeps serving
      # its last timestamp. The second catches a file that is gone, or a series that never
      # arrived. It is absent_over_time over the deadline, never a bare absent(): Prometheus
      # marks a target's series stale on every failed scrape and every node-exporter roll, and
      # a bare absent() would fire at the next evaluation. The `unless` clause leaves a dead
      # exporter to the bridge's `targets` check, so one dead exporter pages once.
      #
      # Both 1500s literals equal the DEADLINE_S that disk-health.sh.j2 renders from
      # k3s_disk_health_cron_minute. ansible/tests/services/test_disk_health_rule_literals.py
      # pins them to it.
      - alert: DiskHealthNotReporting
        expr: |
          (
              time() - homelab_check_last_run_timestamp_seconds{check="disk-health",origin="daniel-box"} > 1500
            or
              absent_over_time(homelab_check_last_run_timestamp_seconds{check="disk-health",origin="daniel-box"}[1500s])
          )
          unless on (origin) (up{job="node"} == 0)
        labels:
          severity: critical
          service: daniel-box
          shadow: "true"
        annotations:
          summary: daniel-box's root disk check has stopped reporting.
          description: >-
            No disk-health verdict newer than 1500s reached Prometheus from daniel-box's
            textfile collector, so nothing is watching the root disk. Read the `daniel-box disk
            health` cron and the `disk-health` syslog tag, then
            /var/lib/node-exporter-textfile/disk-health.prom on the host.
      # SHADOW UNTIL M6's BATCH A1. A malformed claude_cgroup.prom already pages through
      # check_mem's cgroup arm, and a malformed disk-health.prom through DiskHealthNotReporting,
      # so a paging collector alert would page twice for one cause. Until A1 its value is the
      # diagnosis it leaves in ALERTS. One rule per k3s node, so `service` stays a literal.
      - alert: TextfileCollectorError
        expr: node_textfile_scrape_error{origin="daniel-box"} == 1
        for: 10m
        labels:
          severity: warning
          service: daniel-box
          shadow: "true"
        annotations:
          summary: node_exporter on daniel-box cannot read a textfile.
          description: >-
            node_exporter's textfile collector on daniel-box has failed for 10 minutes, so a
            file in /var/lib/node-exporter-textfile is malformed or unreadable, and every
            series in it is gone. Read node_textfile_mtime_seconds for the files it still sees,
            and the node-exporter pod's log.
      - alert: TextfileCollectorError
        expr: node_textfile_scrape_error{origin="daniel-server"} == 1
        for: 10m
        labels:
          severity: warning
          service: daniel-server
          shadow: "true"
        annotations:
          summary: node_exporter on daniel-server cannot read a textfile.
          description: >-
            node_exporter's textfile collector on daniel-server has failed for 10 minutes, so
            a file in /var/lib/node-exporter-textfile is malformed or unreadable, and every
            series in it is gone. Read node_textfile_mtime_seconds for the files it still sees,
            and the node-exporter pod's log.
      # One rule per k3s node whose host_vars set k3s_node_static_link, reading that link. Each
      # such node falls back to WiFi when the link drops (docs/k3s-node-plane-crons-and-incidents.md),
      # so it stays Ready on a slower link and nothing else reports it. The carrier arm catches
      # a pulled cable or a dead switch port. The `up` arm catches a link that is
      # administratively down, where node_exporter serves no carrier series at all. A warning,
      # not a page: the node still serves. ansible/tests/services/test_host_plane_rule_literals.py
      # holds the set to host_vars and prints the rule a new node needs.
      - alert: WiredLinkDown
        expr: |
          node_network_carrier{device="eno1",origin="daniel-box"} == 0
            or
          node_network_up{device="eno1",origin="daniel-box"} == 0
        for: 5m
        labels:
          severity: warning
          service: daniel-box
        annotations:
          summary: daniel-box's wired link eno1 is down, so the node runs on WiFi.
          description: >-
            eno1 on daniel-box has had no carrier, or has been down, for 5 minutes. The node
            routes over its WiFi fallback, which carries Longhorn replication and media at a
            fraction of the wired rate. Check the cable and the switch port, then run `ip link
            show eno1` and `ip route get 1.1.1.1` on daniel-box.
      - alert: WiredLinkDown
        expr: |
          node_network_carrier{device="enp88s0",origin="daniel-server"} == 0
            or
          node_network_up{device="enp88s0",origin="daniel-server"} == 0
        for: 5m
        labels:
          severity: warning
          service: daniel-server
        annotations:
          summary: daniel-server's wired link enp88s0 is down, so the node runs on WiFi.
          description: >-
            enp88s0 on daniel-server has had no carrier, or has been down, for 5 minutes. The
            node routes over its WiFi fallback, which carries Longhorn replication and media at
            a fraction of the wired rate. Check the cable and the switch port, then run `ip
            link show enp88s0` and `ip route get 1.1.1.1` on daniel-server.
      # One rule per inventory host, so `service` stays a literal. The updater writes
      # homelab_host_reconcile_ok 0 on every run while the host holds, so the rule pages a hold
      # that stands for 15 minutes, not one failed run.
      # ansible/tests/services/test_host_plane_rule_literals.py holds the set to hosts.ini.
      #
      # Convention 5 (m1-alertmanager.md) does not bind the host-plane rules, because the `node`
      # and `node-pi` jobs both carry `origin`. They meet it anyway: neither pages on `up`, and
      # HostUpdateStale's absent arm is conjoined with `up == 1`.
      - alert: HostReconcileFailed
        expr: homelab_host_reconcile_ok{origin="daniel-server"} == 0
        for: 15m
        labels:
          severity: critical
          service: daniel-server
        annotations:
          summary: daniel-server holds after a failed reconcile.
          description: >-
            homelab_host_reconcile_ok on daniel-server has read 0 for 15 minutes, so the host
            holds and installs no newer homelab package. Read `journalctl -u homelab-updater -u
            homelab-reconcile` on daniel-server and docs/host-packages.md, "Host-plane pages".
            Once the cause is fixed, `sudo /usr/lib/homelab/homelab-updater --clear-hold`
            reruns reconcile and clears the hold if it passes, and `sudo
            /usr/lib/homelab/homelab-updater --clear-hold --install-newest` clears the hold and
            then installs the newest packages as a timer run does.
      - alert: HostReconcileFailed
        expr: homelab_host_reconcile_ok{origin="daniel-pi"} == 0
        for: 15m
        labels:
          severity: critical
          service: daniel-pi
        annotations:
          summary: daniel-pi holds after a failed reconcile.
          description: >-
            homelab_host_reconcile_ok on daniel-pi has read 0 for 15 minutes, so the host holds
            and installs no newer homelab package. Read `journalctl -u homelab-updater -u
            homelab-reconcile` on daniel-pi and docs/host-packages.md, "Host-plane pages". Once
            the cause is fixed, `sudo /usr/lib/homelab/homelab-updater --clear-hold` reruns
            reconcile and clears the hold if it passes, and `sudo
            /usr/lib/homelab/homelab-updater --clear-hold --install-newest` clears the hold and
            then installs the newest packages as a timer run does.
      - alert: HostReconcileFailed
        expr: homelab_host_reconcile_ok{origin="daniel-box"} == 0
        for: 15m
        labels:
          severity: critical
          service: daniel-box
        annotations:
          summary: daniel-box holds after a failed reconcile.
          description: >-
            homelab_host_reconcile_ok on daniel-box has read 0 for 15 minutes, so the host holds
            and installs no newer homelab package. Read `journalctl -u homelab-updater -u
            homelab-reconcile` on daniel-box and docs/host-packages.md, "Host-plane pages". Once
            the cause is fixed, `sudo /usr/lib/homelab/homelab-updater --clear-hold` reruns
            reconcile and clears the hold if it passes, and `sudo
            /usr/lib/homelab/homelab-updater --clear-hold --install-newest` clears the hold and
            then installs the newest packages as a timer run does.
      # SHADOW UNTIL #5658's ruling on unattended launches decides whether idle slots page
      # anyone (#5672). No batch ran for 16.4h on the night of 2026-10-13 while 9 filed issues
      # waited, and nothing said so. The server lander writes findings_issues from issue labels
      # each pass (fanout_lib/operator_waits.py), and claude-cgroup-metrics.sh writes one
      # claude_fanout_batch_pids_current series per live batch on either node, so no series
      # at all means no batch runs anywhere. A free count with no series behind it reads
      # absent, never 0, so a lander that stopped writing leaves this quiet rather than firing.
      - alert: FanoutSlotsIdleWithFreeWork
        expr: >-
          max(findings_issues{state="free", origin="daniel-box"}) > 0
          unless on() count(claude_fanout_batch_pids_current) > 0
        for: 1h
        labels:
          severity: warning
          service: daniel-box
          shadow: "true"
        annotations:
          summary: Free fan-out issues have waited an hour with no batch running.
          description: >-
            findings_issues{state="free"} has been above 0 for an hour while no fan-out batch
            ran on either node. Read `uv run python scripts/dev/findings.py next` for what is
            free and `uv run python scripts/dev/fanout.py place read` for the hosts' headroom,
            then launch, or record why the queue waits (`findings.py defer`).
      # HostUpdateStale: one rule per entry of observability_expected_hosts, which is empty
      # until H3.9c, so no rule follows yet. Each entry's rule is the shape of
      # tests/rules/fixtures/host-update-stale.yaml, and
      # ansible/tests/services/test_host_plane_rule_literals.py prints the rule a new entry
      # needs.
