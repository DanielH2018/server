            staleness drift check` cron and the `release-staleness-check` syslog tag, then
            /var/lib/node-exporter-textfile/release-staleness-check.prom on the host.
      - alert: LiveDriftCheckFailed
        expr: homelab_check_success{check="live-drift-check",origin="daniel-box"} == 0
        labels:
          severity: warning
          service: daniel-box
          shadow: "true"
        annotations:
          summary: A live cluster object differs from its last-applied manifest.
          description: >-
            live_drift_check.py on daniel-box found an object that was patched, edited or scaled by
            hand after Ansible applied it, or could not read the cluster. `journalctl -t
            live-drift-check` names the object. Redeploy the owning role.
      - alert: LiveDriftCheckNotReporting
        expr: |
          (
              time() - homelab_check_last_run_timestamp_seconds{check="live-drift-check",origin="daniel-box"} > 90000
            or
              absent_over_time(homelab_check_last_run_timestamp_seconds{check="live-drift-check",origin="daniel-box"}[90000s])
          )
          unless on (origin) (up{job="node"} == 0)
        labels:
          severity: warning
          service: daniel-box
          shadow: "true"
        annotations:
          summary: daniel-box's live-drift-check has stopped reporting.
          description: >-
            No live-drift-check verdict newer than 25 hours reached Prometheus from daniel-box's
            textfile collector, so nothing is watching live-object drift. Read the
            `kuma-check-live-drift` timer and the `live-drift-check` syslog tag, then
            /var/lib/node-exporter-textfile/live-drift-check.prom on the host.
      # M6 BATCH B1, SHADOW UNTIL ITS CUTOVER-1B, which also adds the inhibit on
      # ScrapeTargetDown{job="uptime-kuma"}. Prometheus scrapes Kuma's Service directly, so
      # Authelia is not in this path. A 200 from /metrics is weaker than the
      # `uptime-kuma-alive` ping it replaces, which proved Kuma accepted a push.
      - alert: KumaDown
        expr: up{job="uptime-kuma"} == 0 or absent(up{job="uptime-kuma"})
        for: 5m
        labels:
          severity: critical
          service: uptime-kuma
          shadow: "true"
        annotations:
          summary: Uptime Kuma has stopped serving /metrics.
          description: >-
            Prometheus's scrape of the uptime-kuma Service failed for 5 minutes, or the job has no
            `up` series at all. Kuma still pages every check that has not moved to an alert rule, so
            a dead Kuma leaves those checks silent. Read `kubectl -n uptime-kuma get pods` and the
            pod's log.
      # M6 BATCH B9, SHADOW UNTIL ITS CUTOVER-1B (#6168). The weekly AIDE and rkhunter scans run on
      # every host and write the textfile beside their Kuma push, and the "AIDE Integrity" and
      # "rkhunter Scan" tiles page the same verdicts. Each host gets the DiskHealth pair for each
      # scan. A NotReporting rule's two literals equal the DEADLINE_S its script renders, which
      # equals the tile's interval: ansible/tests/setup/test_integrity_scan_rule_literals.py
      # pins all three. daniel-pi's rules read the `node-pi` job. Every tile notifies Discord
      # only, so the rules are `warning`. Each NotReporting rule fires from its deploy until the
      # scan's first run writes the file, up to a week, which pages nobody while it is shadow.
      - alert: AideCheckFailed
        expr: homelab_check_success{check="aide-check",origin="daniel-box"} == 0
        labels:
          severity: warning
          service: daniel-box
          shadow: "true"
