          summary: daniel-box's weekly AIDE check did not complete.
          description: >-
            aide-check.sh on daniel-box ended with status=down: AIDE exited with an error and
            checked nothing, or the previous week's run still held the lock. Differences from
            the baseline read up. Run `journalctl -t aide-check` and `journalctl -t aide` on
            daniel-box.
      - alert: AideCheckNotReporting
        expr: |
          (
              time() - homelab_check_last_run_timestamp_seconds{check="aide-check",origin="daniel-box"} > 626400
            or
              absent_over_time(homelab_check_last_run_timestamp_seconds{check="aide-check",origin="daniel-box"}[626400s])
          )
          unless on (origin) (up{job="node"} == 0)
        labels:
          severity: warning
          service: daniel-box
          shadow: "true"
        annotations:
          summary: daniel-box's weekly AIDE check has stopped reporting.
          description: >-
            No aide-check verdict newer than 626400s reached Prometheus from daniel-box's
            textfile collector, so nothing confirms the file-integrity scan still runs. Read the
            `Weekly AIDE file integrity check` cron and `journalctl -t aide-check`, then
            /var/lib/node-exporter-textfile/aide-check.prom on the host.
      - alert: AideCheckFailed
        expr: homelab_check_success{check="aide-check",origin="daniel-server"} == 0
        labels:
          severity: warning
          service: daniel-server
          shadow: "true"
        annotations:
          summary: daniel-server's weekly AIDE check did not complete.
          description: >-
            aide-check.sh on daniel-server ended with status=down: AIDE exited with an error and
