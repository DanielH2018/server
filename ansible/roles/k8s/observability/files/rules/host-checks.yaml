      # One rule per k3s node whose host_vars set k3s_node_static_link, reading that link. Each
      # such node falls back to WiFi when the link drops (docs/k3s-node-plane-crons-and-incidents.md),
      # so it stays Ready on a slower link and nothing else reports it. The carrier arm catches
      # a pulled cable or a dead switch port. The `up` arm catches a link that is
      # administratively down, where node_exporter serves no carrier series at all. A warning,
      # not a page: the node still serves. ansible/tests/services/test_host_plane_rule_literals.py
      # holds the set to host_vars and prints the rule a new node needs.
      - alert: WiredLinkDown
        expr: |
          node_network_carrier{device="eno1",origin="daniel-box"} == 0
            or
          node_network_up{device="eno1",origin="daniel-box"} == 0
        for: 5m
        labels:
          severity: warning
          service: daniel-box
        annotations:
          summary: daniel-box's wired link eno1 is down, so the node runs on WiFi.
          description: >-
            eno1 on daniel-box has had no carrier, or has been down, for 5 minutes. The node
            routes over its WiFi fallback, which carries Longhorn replication and media at a
            fraction of the wired rate. Check the cable and the switch port, then run `ip link
            show eno1` and `ip route get 1.1.1.1` on daniel-box.
      - alert: WiredLinkDown
        expr: |
          node_network_carrier{device="enp88s0",origin="daniel-server"} == 0
            or
          node_network_up{device="enp88s0",origin="daniel-server"} == 0
        for: 5m
        labels:
          severity: warning
          service: daniel-server
        annotations:
          summary: daniel-server's wired link enp88s0 is down, so the node runs on WiFi.
          description: >-
            enp88s0 on daniel-server has had no carrier, or has been down, for 5 minutes. The
            node routes over its WiFi fallback, which carries Longhorn replication and media at
            a fraction of the wired rate. Check the cable and the switch port, then run `ip
            link show enp88s0` and `ip route get 1.1.1.1` on daniel-server.
      # One rule per inventory host, so `service` stays a literal. The updater writes
      # homelab_host_reconcile_ok 0 on every run while the host holds, so the rule pages a hold
      # that stands for 15 minutes, not one failed run.
      # ansible/tests/services/test_host_plane_rule_literals.py holds the set to hosts.ini.
      #
      # Convention 5 (m1-alertmanager.md) does not bind the host-plane rules, because the `node`
      # and `node-pi` jobs both carry `origin`. They meet it anyway: neither pages on `up`, and
      # HostUpdateStale's absent arm is conjoined with `up == 1`.
      - alert: HostReconcileFailed
        expr: homelab_host_reconcile_ok{origin="daniel-server"} == 0
        for: 15m
        labels:
          severity: critical
          service: daniel-server
        annotations:
          summary: daniel-server's homelab package reconcile failed, so it installs no newer package.
          description: >-
            homelab_host_reconcile_ok on daniel-server has read 0 for 15 minutes, so the host
            holds and installs no newer homelab package. Read `journalctl -u homelab-updater -u
            homelab-reconcile` on daniel-server and docs/host-packages.md, "Host-plane pages".
            Once the cause is fixed, `sudo /usr/lib/homelab/homelab-updater --clear-hold`
            reruns reconcile and clears the hold if it passes, and `sudo
            /usr/lib/homelab/homelab-updater --clear-hold --install-newest` clears the hold and
            then installs the newest packages as a timer run does.
      - alert: HostReconcileFailed
        expr: homelab_host_reconcile_ok{origin="daniel-pi"} == 0
        for: 15m
        labels:
          severity: critical
          service: daniel-pi
        annotations:
          summary: daniel-pi's homelab package reconcile failed, so it installs no newer package.
          description: >-
            homelab_host_reconcile_ok on daniel-pi has read 0 for 15 minutes, so the host holds
            and installs no newer homelab package. Read `journalctl -u homelab-updater -u
            homelab-reconcile` on daniel-pi and docs/host-packages.md, "Host-plane pages". Once
            the cause is fixed, `sudo /usr/lib/homelab/homelab-updater --clear-hold` reruns
            reconcile and clears the hold if it passes, and `sudo
            /usr/lib/homelab/homelab-updater --clear-hold --install-newest` clears the hold and
            then installs the newest packages as a timer run does.
      - alert: HostReconcileFailed
        expr: homelab_host_reconcile_ok{origin="daniel-box"} == 0
        for: 15m
        labels:
          severity: critical
          service: daniel-box
        annotations:
          summary: daniel-box's homelab package reconcile failed, so it installs no newer package.
          description: >-
            homelab_host_reconcile_ok on daniel-box has read 0 for 15 minutes, so the host holds
            and installs no newer homelab package. Read `journalctl -u homelab-updater -u
            homelab-reconcile` on daniel-box and docs/host-packages.md, "Host-plane pages". Once
            the cause is fixed, `sudo /usr/lib/homelab/homelab-updater --clear-hold` reruns
            reconcile and clears the hold if it passes, and `sudo
            /usr/lib/homelab/homelab-updater --clear-hold --install-newest` clears the hold and
            then installs the newest packages as a timer run does.
      # The Pi's Compose project (H5). compose-run writes homelab_compose_up_result each time
      # homelab-reconcile starts homelab-compose.service, and a failed `up --wait` writes 0. The
      # Pi's recovery heartbeat pages the same 0 through its Kuma tile, so this rule is SHADOW
      # until that arm retires (h5-pi-compose.md, open question 5, "M1"). ComposeUpStale below
      # is its stale-time twin.
      - alert: ComposeUpFailed
        expr: homelab_compose_up_result{origin="daniel-pi"} == 0
        labels:
          severity: warning
          service: daniel-pi
          shadow: "true"
        annotations:
          summary: The Pi's last Compose run did not bring the project up.
          description: >-
            compose-run on daniel-pi wrote homelab_compose_up_result 0 at package
            {{ $labels.sha }}: a key check, the config check, an image pull, compose-adopt or
            `docker compose up --wait` failed. Read `journalctl -u homelab-compose` and
            `docker ps -a` on daniel-pi.
      # No schedule bounds the age of the compose result: reconcile restarts the unit only when
      # its file changes, so a quiet week leaves the timestamp a week old (#6187). Boot does
      # bound it. The unit is enabled for multi-user.target, so every boot runs compose-run
      # once, and TimeoutStartSec caps that run. A timestamp older than node_boot_time_seconds,
      # once the boot is older than the cap, means the boot run never wrote: the unit was
      # masked, systemd killed the run at its timeout, or the write failed. The second arm
      # catches a file that is gone. Both arms need node_boot_time_seconds, which goes stale
      # with every failed scrape, so a dead exporter leaves this quiet for ScrapeTargetDown.
      #
      # 1690s is the TimeoutStartSec that homelab-compose.service renders from the Pi's
      # healthcheck variables, 1390s, plus 300s for boot to reach the unit and for one scrape.
      # The boot run of 2026-10-25 wrote 94s after boot. Both literals are pinned to the
      # rendered unit by hosts/lib/tests/test_pi_compose_unit.py.
      - alert: ComposeUpStale
        expr: |
          (
              homelab_compose_up_timestamp_seconds{origin="daniel-pi"}
              < on (origin) group_left node_boot_time_seconds{origin="daniel-pi"}
            or
              absent_over_time(homelab_compose_up_timestamp_seconds{origin="daniel-pi"}[1690s])
          )
          and on (origin)
            time() - node_boot_time_seconds{origin="daniel-pi"} > 1690
        labels:
          severity: warning
          service: daniel-pi
        annotations:
          summary: The Pi's Compose project has not run since daniel-pi booted.
          description: >-
            daniel-pi booted more than 1690s ago, and homelab_compose_up_timestamp_seconds
            still predates that boot or is missing, so the boot's compose-run never wrote its
            result. The unit is masked or disabled, systemd killed the run at its
            TimeoutStartSec, or the write to /var/lib/node-exporter-textfile/homelab_compose.prom
            failed. Read `systemctl status homelab-compose` and `journalctl -b -u
            homelab-compose` on daniel-pi.
      # One rule per inventory host, so `service` stays a literal (#6166). Reconcile writes
      # homelab_host_reboot_pending 1 when a package change needs a reboot, and the weekly
      # reboot is what applies it. homelab_host_reboot_pending_since_seconds is when the host
      # first owed that reboot, the flag's mtime, which a later change never moves. The age is
      # read from it rather than from the file's mtime, because every later package change
      # rewrites the file. The `> node_boot_time_seconds` arm drops a 1 left in the file from
      # before the last boot: the updater runs reconcile only when a package changes, so the
      # file can outlive the boot that cleared the flag. 691200s is 8 days, a weekly reboot
      # slot plus a day.
      - alert: HostRebootOverdue
        expr: |
          (
              homelab_host_reboot_pending{origin="daniel-box"} == 1
            and on (origin)
              homelab_host_reboot_pending_since_seconds{origin="daniel-box"}
              > on (origin) node_boot_time_seconds{origin="daniel-box"}
            and on (origin)
              time() - homelab_host_reboot_pending_since_seconds{origin="daniel-box"} > 691200
          )
        labels:
          severity: warning
          service: daniel-box
        annotations:
          summary: daniel-box has owed a reboot for more than 8 days.
          description: >-
            Reconcile recorded a reboot-class package change on daniel-box more than 8 days
            ago, and the host has not booted since, so the weekly reboot did not run or was
            refused. Read `journalctl -t weekly-restart` on daniel-box and docs/host-packages.md,
            "Reboot-pending and activation-pending", then reboot the host.
      - alert: HostRebootOverdue
        expr: |
          (
              homelab_host_reboot_pending{origin="daniel-server"} == 1
            and on (origin)
              homelab_host_reboot_pending_since_seconds{origin="daniel-server"}
              > on (origin) node_boot_time_seconds{origin="daniel-server"}
            and on (origin)
              time() - homelab_host_reboot_pending_since_seconds{origin="daniel-server"} > 691200
          )
        labels:
          severity: warning
          service: daniel-server
        annotations:
          summary: daniel-server has owed a reboot for more than 8 days.
          description: >-
            Reconcile recorded a reboot-class package change on daniel-server more than 8 days
            ago, and the host has not booted since, so the weekly reboot did not run or was
            refused. Read `journalctl -t weekly-restart` on daniel-server and docs/host-packages.md,
            "Reboot-pending and activation-pending", then reboot the host.
      - alert: HostRebootOverdue
        expr: |
          (
              homelab_host_reboot_pending{origin="daniel-pi"} == 1
            and on (origin)
              homelab_host_reboot_pending_since_seconds{origin="daniel-pi"}
              > on (origin) node_boot_time_seconds{origin="daniel-pi"}
            and on (origin)
              time() - homelab_host_reboot_pending_since_seconds{origin="daniel-pi"} > 691200
          )
        labels:
          severity: warning
          service: daniel-pi
        annotations:
          summary: daniel-pi has owed a reboot for more than 8 days.
          description: >-
            Reconcile recorded a reboot-class package change on daniel-pi more than 8 days
            ago, and the host has not booted since, so the weekly reboot did not run or was
            refused. Read `journalctl -t weekly-restart` on daniel-pi and docs/host-packages.md,
            "Reboot-pending and activation-pending", then reboot the host.
      # SHADOW UNTIL #5658's ruling on unattended launches decides whether idle slots page
      # anyone (#5672). No batch ran for 16.4h on the night of 2026-10-13 while 9 filed issues
      # waited, and nothing said so. The server lander writes findings_issues from issue labels
      # each pass (fanout_lib/operator_waits.py), and claude-cgroup-metrics.sh writes one
      # claude_fanout_batch_pids_current series per live batch on either node, so no series
      # at all means no batch runs anywhere. A free count with no series behind it reads
      # absent, never 0, so a lander that stopped writing leaves this quiet rather than firing.
      - alert: FanoutSlotsIdleWithFreeWork
        expr: >-
          max(findings_issues{state="free", origin="daniel-box"}) > 0
          unless on() count(claude_fanout_batch_pids_current) > 0
        for: 1h
        labels:
          severity: warning
          service: daniel-box
          shadow: "true"
        annotations:
          summary: Free fan-out issues have waited an hour with no batch running.
          description: >-
            findings_issues{state="free"} has been above 0 for an hour while no fan-out batch
            ran on either node. Read `uv run python scripts/dev/findings.py next` for what is
            free and `uv run python scripts/dev/fanout.py place read` for the hosts' headroom,
            then launch, or record why the queue waits (`findings.py defer`).
      # HostUpdateStale: one rule per entry of observability_expected_hosts. Each entry's rule is
      # the shape of tests/rules/fixtures/host-update-stale.yaml, and
      # ansible/tests/services/test_host_plane_rule_literals.py prints the rule a new entry
      # needs.
      - alert: HostUpdateStale
        expr: |
          (
              time() - homelab_host_update_success_timestamp_seconds{job="node-pi",origin="daniel-pi"} > 11400
            or
              (
                  absent(homelab_host_update_success_timestamp_seconds{job="node-pi",origin="daniel-pi"})
                and on (job, origin)
                  up{job="node-pi",origin="daniel-pi"} == 1
              )
          )
        labels:
          severity: critical
          service: daniel-pi
        annotations:
          summary: daniel-pi has had no successful homelab update for 3 hours 10 minutes.
          description: >-
            No homelab-updater run on daniel-pi has succeeded in 3 hours 10 minutes, or its exporter is up
            and serves no success timestamp. A failed fetch, a stopped homelab-apt-repo.service,
            a firewall rule, a keyring mismatch and a stopped timer each leave it stale. Read
            `systemctl status homelab-updater.timer` and `journalctl -u homelab-updater` on
            daniel-pi, and docs/host-packages.md, "Host-plane pages".
