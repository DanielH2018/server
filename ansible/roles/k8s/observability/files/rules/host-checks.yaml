      # also requires the series within the last 2419200s (28 days, inside Prometheus's 30-day
      # retention). A file that vanishes after a run pages from its deadline until 28 days after
      # its last sample; a cron that stops but leaves its file pages through the stale arm for as
      # long as it stays stopped. Both literals of each NotReporting rule
      # equal the script's DEADLINE_S, and ansible/tests/setup/test_host_maintenance.py pins
