      # The catch-all deadman (#6166), one rule per host so `service` stays a literal. It reads
      # each check's own homelab_check_deadline_seconds, so a producer that writes the textfile
      # is covered the day it ships, before anyone writes its NotReporting pair. It is the
      # backstop, never the rule a check relies on, for two reasons the per-check literals keep:
      # it cannot carry an absent_over_time arm, because only a check's name says which series
      # should exist, and a file that loses its deadline series silently drops out of it, which
      # is why M3 keeps the deadline out of every rule's verdict
      # (docs/target-architecture/monitoring/m3-textfile-timer.md, "Three series"). Both sides
      # are restricted to the node jobs, because the pod exporters' rules in pods.yaml and
      # pod-producers.yaml already compare against the deadline. It fires beside every per-check
      # NotReporting rule's stale arm, at the same threshold, so an Alertmanager inhibit keyed on
      # `check` and `origin` (alertmanager-secret.yaml.j2) mutes it wherever a pair exists. It
      # pages alone only for a producer with no pair (#6186), and so it carries no `shadow`.
      # The `for: 2m` lets the pair fire first. Most pairs sit in another group, which Prometheus
      # evaluates at its own offset inside the 1m evaluation interval, so a pair can start up to
      # a minute after this rule crosses. Without the hold, this rule's page would flush after
      # group_wait, before the inhibit's source exists.
      - alert: HostCheckOverdue
        expr: |
          (
              time() - homelab_check_last_run_timestamp_seconds{job="node",origin="daniel-box"}
            > on (check, origin)
              homelab_check_deadline_seconds{job="node",origin="daniel-box"}
          )
          unless on (origin) (up{job="node"} == 0)
        for: 2m
        labels:
          severity: warning
          service: daniel-box
        annotations:
          summary: daniel-box's {{ $labels.check }} check is past its own deadline.
          description: >-
            The {{ $labels.check }} textfile on daniel-box holds a verdict older than the
            homelab_check_deadline_seconds it declares, so its producer stopped writing. Read
            /var/lib/node-exporter-textfile/{{ $labels.check }}.prom on the host, then the
            journal of the cron or timer that writes it.
      - alert: HostCheckOverdue
        expr: |
          (
              time() - homelab_check_last_run_timestamp_seconds{job="node",origin="daniel-server"}
            > on (check, origin)
              homelab_check_deadline_seconds{job="node",origin="daniel-server"}
