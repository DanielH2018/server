      - alert: ReleaseStalenessCheckFailed
        expr: homelab_check_success{check="release-staleness-check",origin="daniel-box"} == 0
        labels:
          severity: warning
          service: daniel-box
          shadow: "true"
        annotations:
          summary: A k8s service runs an older release than origin/master.
          description: >-
            release-staleness-check.sh on daniel-box found a service whose role paths changed on
            origin/master after its last applied commit. `uv run python scripts/diagnostics/probe.py
            releases --stale-only` prints each reason, and `./scripts/deploy.sh --tags <svc>`
            redeploys the service.
      - alert: ReleaseStalenessCheckNotReporting
        expr: |
          (
