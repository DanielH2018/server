# Host checks that write a node_exporter textfile, read from the `node` scrape job, or from
# `node-pi` for daniel-pi. Plain YAML, never Jinja: prometheus-rules.yaml.j2 carries this file
# verbatim. The producer metric contract and the design are
# docs/target-architecture/monitoring/m3-textfile-timer.md, "The rules". The host-plane rules at
# the end are H3's (docs/target-architecture/host/h3-pi-pilot.md, "Host rules (PR H3.5d, C7)").
#
# Every rule names its host as a literal `service`. A node is not a workload, so M2's
# workload-service join cannot supply it, and deriving it from `origin` needs a label_replace
# that M1 has not admitted (M3's open question 3).
groups:
  - name: host-checks
    rules:
      - alert: DiskHealthFailed
        expr: homelab_check_success{check="disk-health",origin="daniel-box"} == 0
        labels:
          severity: critical
          service: daniel-box
        annotations:
          summary: daniel-box's root disk check is red.
          description: >-
            disk-health.sh on daniel-box read the root filesystem above its threshold, or df
            failed. Longhorn stops scheduling replicas on the node at 75%.
            homelab_disk_root_used_ratio{check="disk-health"} holds the share it read, and the
            `disk-health` syslog tag holds the run's message.
      # SHADOW UNTIL M3's PR 5, as above. Kuma's tile pages a silent cron today.
      #
      # The first arm catches a file that stopped being refreshed: node_exporter keeps serving
      # its last timestamp. The second catches a file that is gone, or a series that never
      # arrived. It is absent_over_time over the deadline, never a bare absent(): Prometheus
      # marks a target's series stale on every failed scrape and every node-exporter roll, and
      # a bare absent() would fire at the next evaluation. The `unless` clause leaves a dead
      # exporter to the bridge's `targets` check, so one dead exporter pages once.
      #
      # Both 1500s literals equal the DEADLINE_S that disk-health.sh.j2 renders from
      # k3s_disk_health_cron_minute. ansible/tests/services/test_disk_health_rule_literals.py
      # pins them to it.
      - alert: DiskHealthNotReporting
        expr: |
          (
              time() - homelab_check_last_run_timestamp_seconds{check="disk-health",origin="daniel-box"} > 1500
            or
              absent_over_time(homelab_check_last_run_timestamp_seconds{check="disk-health",origin="daniel-box"}[1500s])
          )
          unless on (origin) (up{job="node"} == 0)
        labels:
          severity: critical
          service: daniel-box
        annotations:
          summary: daniel-box's root disk check has stopped reporting.
          description: >-
            No disk-health verdict newer than 1500s reached Prometheus from daniel-box's
            textfile collector, so nothing is watching the root disk. Read the `daniel-box disk
            health` cron and the `disk-health` syslog tag, then
            /var/lib/node-exporter-textfile/disk-health.prom on the host.
      # SHADOW UNTIL M6's BATCH B6 CUTOVER-1b. The next four rules replace Kuma's `Artifacts Peer
      # Sync` and `k3s Telemetry OTLP Door` tiles, so they carry shadow="true" while the tiles
      # page (docs/target-architecture/monitoring/m6-retire-kuma.md, "The cutover order").
      # Both producers are daniel-box crons that write a check file through
      # homelab-check-lib.sh. Each NotReporting pair mirrors DiskHealthNotReporting, and its two
      # literals equal the deadline the producer renders from its own cron minute:
      # ansible/tests/services/test_b6a_rule_literals.py pins them. Both tiles notify Discord
      # only, so the rules are `warning`.
      - alert: ArtifactsSyncFailed
        expr: homelab_check_success{check="sync-artifacts",origin="daniel-box"} == 0
        labels:
          severity: warning
          service: daniel-box
          shadow: "true"
        annotations:
          summary: The peer artifact sync on daniel-box is failing.
          description: >-
            sync-artifacts.sh has failed a peer for claude_code_artifacts_sync_alert_after_failures
            consecutive runs, so that peer's artifacts are stale in the browser. Run `journalctl -t
            sync-artifacts` on daniel-box for the peer and its streak, then ssh to the named peer.
      - alert: ArtifactsSyncNotReporting
        expr: |
          (
              time() - homelab_check_last_run_timestamp_seconds{check="sync-artifacts",origin="daniel-box"} > 900
            or
              absent_over_time(homelab_check_last_run_timestamp_seconds{check="sync-artifacts",origin="daniel-box"}[900s])
          )
          unless on (origin) (up{job="node"} == 0)
        labels:
          severity: warning
          service: daniel-box
          shadow: "true"
        annotations:
          summary: The peer artifact sync on daniel-box has stopped reporting.
          description: >-
            No sync-artifacts verdict newer than 900s reached Prometheus from daniel-box's
            textfile collector, so the cron stopped, or its flock is held by a hung run. Read the
            `Sync peer Claude artifacts` cron and `journalctl -t sync-artifacts`, then
            /var/lib/node-exporter-textfile/sync-artifacts.prom on the host.
      - alert: OtlpDoorClosed
        expr: homelab_check_success{check="claude-otel-health",origin="daniel-box"} == 0
        labels:
          severity: warning
          service: daniel-box
          shadow: "true"
        annotations:
          summary: The telemetry OTLP receiver on daniel-box's loopback refuses connections.
          description: >-
            Claude Code cannot export telemetry even with every pod Ready, because the hostPort
            DNAT is an iptables rule rather than a socket. Check the otel-collector DaemonSet pod
            on daniel-box, then the portmap rule.
      - alert: OtlpDoorNotReporting
        expr: |
          (
              time() - homelab_check_last_run_timestamp_seconds{check="claude-otel-health",origin="daniel-box"} > 1500
            or
              absent_over_time(homelab_check_last_run_timestamp_seconds{check="claude-otel-health",origin="daniel-box"}[1500s])
          )
          unless on (origin) (up{job="node"} == 0)
        labels:
          severity: warning
          service: daniel-box
          shadow: "true"
        annotations:
          summary: The telemetry OTLP-door check on daniel-box has stopped reporting.
          description: >-
            No claude-otel-health verdict newer than 1500s reached Prometheus from daniel-box's
            textfile collector, so nothing is watching the OTLP door. Read the `Claude Code
            telemetry health` cron and `journalctl -t claude-otel-health`, then
            /var/lib/node-exporter-textfile/claude-otel-health.prom on the host.
      # M6 BATCH B1, SHADOW UNTIL ITS CUTOVER-1B. The five k3s crons write the textfile beside
      # their Kuma push, and Kuma's tiles page the same verdicts until Cutover-1a deletes
      # them. Each check has the DiskHealth pair: `Failed` reads the verdict, and
      # `NotReporting` reads the file's age. The deadline literal in a NotReporting rule
      # equals the DEADLINE_S its producer renders, and
      # ansible/tests/services/test_b1_rule_literals.py pins the two together. A daily check
      # gets a day plus an hour (k3s_daily_check_deadline_s), the interval of its Kuma tile.
      # The `unless` clause leaves a dead exporter to the bridge's `targets` check.
      - alert: LonghornBackupHealthFailed
        expr: homelab_check_success{check="longhorn-backup-health",origin="daniel-box"} == 0
        labels:
          severity: critical
          service: daniel-box
          shadow: "true"
        annotations:
          summary: daniel-box's Longhorn backup check is red.
          description: >-
            longhorn_backup_health.py on daniel-box reported a failing backup-plane check: an
            unavailable backup target, a stale or errored backup, a failed job, or a restore drill
            that is overdue. `journalctl -t longhorn-backup-health` names the check. Read
            docs/longhorn-disaster-recovery.md after it.
      - alert: LonghornBackupHealthNotReporting
        expr: |
          (
              time() - homelab_check_last_run_timestamp_seconds{check="longhorn-backup-health",origin="daniel-box"} > 1500
            or
              absent_over_time(homelab_check_last_run_timestamp_seconds{check="longhorn-backup-health",origin="daniel-box"}[1500s])
          )
          unless on (origin) (up{job="node"} == 0)
        labels:
          severity: critical
          service: daniel-box
          shadow: "true"
        annotations:
          summary: daniel-box's longhorn-backup-health check has stopped reporting.
          description: >-
            No longhorn-backup-health verdict newer than 1500s reached Prometheus from daniel-box's
            textfile collector, so nothing is watching the Longhorn backup plane. Read the `Longhorn
            backup health` cron and the `longhorn-backup-health` syslog tag, then
            /var/lib/node-exporter-textfile/longhorn-backup-health.prom on the host.
      - alert: EtcdSnapshotOffboxFailed
        expr: homelab_check_success{check="etcd-snapshot-offbox",origin="daniel-box"} == 0
        labels:
          severity: critical
          service: daniel-box
          shadow: "true"
        annotations:
          summary: daniel-box's off-box etcd snapshot check is red.
          description: >-
            etcd-snapshot-offbox.sh on daniel-box could not take or upload the etcd snapshot, or the
            cluster token changed since the off-box copy was stamped. `journalctl -t
            etcd-snapshot-offbox` names which. Read docs/k3s-etcd-restore.md after it.
      - alert: EtcdSnapshotOffboxNotReporting
        expr: |
          (
              time() - homelab_check_last_run_timestamp_seconds{check="etcd-snapshot-offbox",origin="daniel-box"} > 90000
            or
              absent_over_time(homelab_check_last_run_timestamp_seconds{check="etcd-snapshot-offbox",origin="daniel-box"}[90000s])
          )
          unless on (origin) (up{job="node"} == 0)
        labels:
          severity: critical
          service: daniel-box
          shadow: "true"
        annotations:
          summary: daniel-box's etcd-snapshot-offbox check has stopped reporting.
          description: >-
            No etcd-snapshot-offbox verdict newer than 90000s reached Prometheus from daniel-box's
            textfile collector, so nothing is watching the off-box etcd snapshot. Read the `Off-box
            etcd snapshot` cron and the `etcd-snapshot-offbox` syslog tag, then
            /var/lib/node-exporter-textfile/etcd-snapshot-offbox.prom on the host.
      - alert: ManifestPruneCheckFailed
        expr: homelab_check_success{check="manifest-prune-check",origin="daniel-box"} == 0
        labels:
          severity: warning
          service: daniel-box
          shadow: "true"
        annotations:
          summary: daniel-box has deployed-artifact drift.
          description: >-
            manifest-prune-check.sh on daniel-box found a live cluster object that no staged
            manifest declares, a deployed setup file that differs from the repo, or a rendered
            script that is older than its template. `journalctl -t manifest-prune-check` names the
            arm and the object.
      - alert: ManifestPruneCheckNotReporting
        expr: |
          (
              time() - homelab_check_last_run_timestamp_seconds{check="manifest-prune-check",origin="daniel-box"} > 90000
            or
              absent_over_time(homelab_check_last_run_timestamp_seconds{check="manifest-prune-check",origin="daniel-box"}[90000s])
          )
          unless on (origin) (up{job="node"} == 0)
        labels:
          severity: warning
          service: daniel-box
          shadow: "true"
        annotations:
          summary: daniel-box's manifest-prune-check check has stopped reporting.
          description: >-
            No manifest-prune-check verdict newer than 90000s reached Prometheus from daniel-box's
            textfile collector, so nothing is watching deployed-artifact drift. Read the
            `kuma-check-manifest-prune` timer and the `manifest-prune-check` syslog tag, then
            /var/lib/node-exporter-textfile/manifest-prune-check.prom on the host.
      - alert: ReleaseStalenessCheckFailed
        expr: homelab_check_success{check="release-staleness-check",origin="daniel-box"} == 0
        labels:
          severity: warning
          service: daniel-box
          shadow: "true"
        annotations:
          summary: A k8s service runs an older release than origin/master.
          description: >-
            release-staleness-check.sh on daniel-box found a service whose role paths changed on
            origin/master after its last applied commit. `uv run python scripts/diagnostics/probe.py
            releases --stale-only` prints each reason, and `./scripts/deploy.sh --tags <svc>`
            redeploys the service.
      - alert: ReleaseStalenessCheckNotReporting
        expr: |
          (
              time() - homelab_check_last_run_timestamp_seconds{check="release-staleness-check",origin="daniel-box"} > 3900
            or
              absent_over_time(homelab_check_last_run_timestamp_seconds{check="release-staleness-check",origin="daniel-box"}[3900s])
          )
          unless on (origin) (up{job="node"} == 0)
        labels:
          severity: warning
          service: daniel-box
          shadow: "true"
        annotations:
          summary: daniel-box's release-staleness-check check has stopped reporting.
          description: >-
            No release-staleness-check verdict newer than 3900s reached Prometheus from daniel-box's
            textfile collector, so nothing is watching release staleness. Read the `Release
            staleness drift check` cron and the `release-staleness-check` syslog tag, then
            /var/lib/node-exporter-textfile/release-staleness-check.prom on the host.
      - alert: LiveDriftCheckFailed
        expr: homelab_check_success{check="live-drift-check",origin="daniel-box"} == 0
        labels:
          severity: warning
          service: daniel-box
          shadow: "true"
        annotations:
          summary: A live cluster object differs from its last-applied manifest.
          description: >-
            live_drift_check.py on daniel-box found an object that was patched, edited or scaled by
            hand after Ansible applied it, or could not read the cluster. `journalctl -t
            live-drift-check` names the object. Redeploy the owning role.
      - alert: LiveDriftCheckNotReporting
        expr: |
          (
              time() - homelab_check_last_run_timestamp_seconds{check="live-drift-check",origin="daniel-box"} > 90000
            or
              absent_over_time(homelab_check_last_run_timestamp_seconds{check="live-drift-check",origin="daniel-box"}[90000s])
          )
          unless on (origin) (up{job="node"} == 0)
        labels:
          severity: warning
          service: daniel-box
          shadow: "true"
        annotations:
          summary: daniel-box's live-drift-check check has stopped reporting.
          description: >-
            No live-drift-check verdict newer than 90000s reached Prometheus from daniel-box's
            textfile collector, so nothing is watching live-object drift. Read the
            `kuma-check-live-drift` timer and the `live-drift-check` syslog tag, then
            /var/lib/node-exporter-textfile/live-drift-check.prom on the host.
      # M6 BATCH B1, SHADOW UNTIL ITS CUTOVER-1B, which also adds the inhibit on
      # ScrapeTargetDown{job="uptime-kuma"}. Prometheus scrapes Kuma's Service directly, so
      # Authelia is not in this path. A 200 from /metrics is weaker than the
      # `uptime-kuma-alive` ping it replaces, which proved Kuma accepted a push.
      - alert: KumaDown
        expr: up{job="uptime-kuma"} == 0 or absent(up{job="uptime-kuma"})
        for: 5m
        labels:
          severity: critical
          service: uptime-kuma
          shadow: "true"
        annotations:
          summary: Uptime Kuma has stopped serving /metrics.
          description: >-
            Prometheus's scrape of the uptime-kuma Service failed for 5 minutes, or the job has no
            `up` series at all. Kuma still pages every check that has not moved to an alert rule, so
            a dead Kuma leaves those checks silent. Read `kubectl -n uptime-kuma get pods` and the
            pod's log.
      # SHADOW UNTIL M6's BATCH A1. A malformed claude_cgroup.prom already pages through
      # check_mem's cgroup arm, and a malformed disk-health.prom through DiskHealthNotReporting,
      # so a paging collector alert would page twice for one cause. Until A1 its value is the
      # diagnosis it leaves in ALERTS. One rule per k3s node, so `service` stays a literal.
      - alert: TextfileCollectorError
        expr: node_textfile_scrape_error{origin="daniel-box"} == 1
        for: 10m
        labels:
          severity: warning
          service: daniel-box
          shadow: "true"
        annotations:
          summary: node_exporter on daniel-box cannot read a textfile.
          description: >-
            node_exporter's textfile collector on daniel-box has failed for 10 minutes, so a
            file in /var/lib/node-exporter-textfile is malformed or unreadable, and every
            series in it is gone. Read node_textfile_mtime_seconds for the files it still sees,
            and the node-exporter pod's log.
      - alert: TextfileCollectorError
        expr: node_textfile_scrape_error{origin="daniel-server"} == 1
        for: 10m
        labels:
          severity: warning
          service: daniel-server
          shadow: "true"
        annotations:
          summary: node_exporter on daniel-server cannot read a textfile.
          description: >-
            node_exporter's textfile collector on daniel-server has failed for 10 minutes, so
            a file in /var/lib/node-exporter-textfile is malformed or unreadable, and every
            series in it is gone. Read node_textfile_mtime_seconds for the files it still sees,
            and the node-exporter pod's log.
      # A replaced Longhorn instance-manager leaves the iSCSI sessions it served in the kernel,
      # FREE with a failed connection, and the next attach of such a volume on that node loops
      # (#5826). The node-exporter DaemonSet's `iscsi-sessions` sidecar writes one
      # homelab_iscsi_session_info series per session. A session is FAILED for up to iscsid's
      # replacement_timeout while it reconnects, so 15m keeps a recovering session quiet. One
      # rule per k3s node, so `service` stays a literal. Both NotReporting rules mirror
      # DiskHealthNotReporting's two arms. Their 300s literals equal DEADLINE_S in
      # node-exporter's files/iscsi-sessions.sh, and
      # ansible/roles/k8s/node-exporter/tests/test_iscsi_sessions.py pins them to it.
      - alert: IscsiSessionStale
        expr: homelab_iscsi_session_info{state!="LOGGED_IN",origin="daniel-box"} == 1
        for: 15m
        labels:
          severity: warning
          service: daniel-box
        annotations:
          summary: daniel-box holds an iSCSI session that is not logged in.
          description: >-
            {{ $labels.session }} on daniel-box has read {{ $labels.state }} for 15 minutes,
            for target {{ $labels.target }}. The next attach of that volume on daniel-box fails
            its frontend init on `iscsiadm --logout` (error 32), and Longhorn deletes the pod
            every ~30s. Clean it up with docs/longhorn-disaster-recovery.md, "A stale iSCSI
            session blocks an attach".
      - alert: IscsiSessionStale
        expr: homelab_iscsi_session_info{state!="LOGGED_IN",origin="daniel-server"} == 1
        for: 15m
        labels:
          severity: warning
          service: daniel-server
        annotations:
          summary: daniel-server holds an iSCSI session that is not logged in.
          description: >-
            {{ $labels.session }} on daniel-server has read {{ $labels.state }} for 15 minutes,
            for target {{ $labels.target }}. The next attach of that volume on daniel-server fails
            its frontend init on `iscsiadm --logout` (error 32), and Longhorn deletes the pod
            every ~30s. Clean it up with docs/longhorn-disaster-recovery.md, "A stale iSCSI
            session blocks an attach".
      - alert: IscsiSessionsNotReporting
        expr: |
          (
              time() - homelab_check_last_run_timestamp_seconds{check="iscsi-sessions",origin="daniel-box"} > 300
            or
              absent_over_time(homelab_check_last_run_timestamp_seconds{check="iscsi-sessions",origin="daniel-box"}[300s])
          )
          unless on (origin) (up{job="node"} == 0)
        labels:
          severity: warning
          service: daniel-box
        annotations:
          summary: daniel-box's iSCSI session check has stopped reporting.
          description: >-
            No iscsi-sessions verdict newer than 300s reached Prometheus from daniel-box's
            textfile collector, so nothing is watching the node's iSCSI sessions. Read the
            log of the node-exporter pod's `iscsi-sessions` container on daniel-box.
      - alert: IscsiSessionsNotReporting
        expr: |
          (
              time() - homelab_check_last_run_timestamp_seconds{check="iscsi-sessions",origin="daniel-server"} > 300
            or
              absent_over_time(homelab_check_last_run_timestamp_seconds{check="iscsi-sessions",origin="daniel-server"}[300s])
          )
          unless on (origin) (up{job="node"} == 0)
        labels:
          severity: warning
          service: daniel-server
        annotations:
          summary: daniel-server's iSCSI session check has stopped reporting.
          description: >-
            No iscsi-sessions verdict newer than 300s reached Prometheus from daniel-server's
            textfile collector, so nothing is watching the node's iSCSI sessions. Read the
            log of the node-exporter pod's `iscsi-sessions` container on daniel-server.
      # One rule per k3s node whose host_vars set k3s_node_static_link, reading that link. Each
      # such node falls back to WiFi when the link drops (docs/k3s-node-plane-crons-and-incidents.md),
      # so it stays Ready on a slower link and nothing else reports it. The carrier arm catches
      # a pulled cable or a dead switch port. The `up` arm catches a link that is
      # administratively down, where node_exporter serves no carrier series at all. A warning,
      # not a page: the node still serves. ansible/tests/services/test_host_plane_rule_literals.py
      # holds the set to host_vars and prints the rule a new node needs.
      - alert: WiredLinkDown
        expr: |
          node_network_carrier{device="eno1",origin="daniel-box"} == 0
            or
          node_network_up{device="eno1",origin="daniel-box"} == 0
        for: 5m
        labels:
          severity: warning
          service: daniel-box
        annotations:
          summary: daniel-box's wired link eno1 is down, so the node runs on WiFi.
          description: >-
            eno1 on daniel-box has had no carrier, or has been down, for 5 minutes. The node
            routes over its WiFi fallback, which carries Longhorn replication and media at a
            fraction of the wired rate. Check the cable and the switch port, then run `ip link
            show eno1` and `ip route get 1.1.1.1` on daniel-box.
      - alert: WiredLinkDown
        expr: |
          node_network_carrier{device="enp88s0",origin="daniel-server"} == 0
            or
          node_network_up{device="enp88s0",origin="daniel-server"} == 0
        for: 5m
        labels:
          severity: warning
          service: daniel-server
        annotations:
          summary: daniel-server's wired link enp88s0 is down, so the node runs on WiFi.
          description: >-
            enp88s0 on daniel-server has had no carrier, or has been down, for 5 minutes. The
            node routes over its WiFi fallback, which carries Longhorn replication and media at
            a fraction of the wired rate. Check the cable and the switch port, then run `ip
            link show enp88s0` and `ip route get 1.1.1.1` on daniel-server.
      # One rule per inventory host, so `service` stays a literal. The updater writes
      # homelab_host_reconcile_ok 0 on every run while the host holds, so the rule pages a hold
      # that stands for 15 minutes, not one failed run.
      # ansible/tests/services/test_host_plane_rule_literals.py holds the set to hosts.ini.
      #
      # Convention 5 (m1-alertmanager.md) does not bind the host-plane rules, because the `node`
      # and `node-pi` jobs both carry `origin`. They meet it anyway: neither pages on `up`, and
      # HostUpdateStale's absent arm is conjoined with `up == 1`.
      - alert: HostReconcileFailed
        expr: homelab_host_reconcile_ok{origin="daniel-server"} == 0
        for: 15m
        labels:
          severity: critical
          service: daniel-server
        annotations:
          summary: daniel-server holds after a failed reconcile.
          description: >-
            homelab_host_reconcile_ok on daniel-server has read 0 for 15 minutes, so the host
            holds and installs no newer homelab package. Read `journalctl -u homelab-updater -u
            homelab-reconcile` on daniel-server and docs/host-packages.md, "Host-plane pages".
            Once the cause is fixed, `sudo /usr/lib/homelab/homelab-updater --clear-hold`
            reruns reconcile and clears the hold if it passes, and `sudo
            /usr/lib/homelab/homelab-updater --clear-hold --install-newest` clears the hold and
            then installs the newest packages as a timer run does.
      - alert: HostReconcileFailed
        expr: homelab_host_reconcile_ok{origin="daniel-pi"} == 0
        for: 15m
        labels:
          severity: critical
          service: daniel-pi
        annotations:
          summary: daniel-pi holds after a failed reconcile.
          description: >-
            homelab_host_reconcile_ok on daniel-pi has read 0 for 15 minutes, so the host holds
            and installs no newer homelab package. Read `journalctl -u homelab-updater -u
            homelab-reconcile` on daniel-pi and docs/host-packages.md, "Host-plane pages". Once
            the cause is fixed, `sudo /usr/lib/homelab/homelab-updater --clear-hold` reruns
            reconcile and clears the hold if it passes, and `sudo
            /usr/lib/homelab/homelab-updater --clear-hold --install-newest` clears the hold and
            then installs the newest packages as a timer run does.
      - alert: HostReconcileFailed
        expr: homelab_host_reconcile_ok{origin="daniel-box"} == 0
        for: 15m
        labels:
          severity: critical
          service: daniel-box
        annotations:
          summary: daniel-box holds after a failed reconcile.
          description: >-
            homelab_host_reconcile_ok on daniel-box has read 0 for 15 minutes, so the host holds
            and installs no newer homelab package. Read `journalctl -u homelab-updater -u
            homelab-reconcile` on daniel-box and docs/host-packages.md, "Host-plane pages". Once
            the cause is fixed, `sudo /usr/lib/homelab/homelab-updater --clear-hold` reruns
            reconcile and clears the hold if it passes, and `sudo
            /usr/lib/homelab/homelab-updater --clear-hold --install-newest` clears the hold and
            then installs the newest packages as a timer run does.
      # SHADOW UNTIL #5658's ruling on unattended launches decides whether idle slots page
      # anyone (#5672). No batch ran for 16.4h on the night of 2026-10-13 while 9 filed issues
      # waited, and nothing said so. The server lander writes findings_issues from issue labels
      # each pass (fanout_lib/operator_waits.py), and claude-cgroup-metrics.sh writes one
      # claude_fanout_batch_pids_current series per live batch on either node, so no series
      # at all means no batch runs anywhere. A free count with no series behind it reads
      # absent, never 0, so a lander that stopped writing leaves this quiet rather than firing.
      - alert: FanoutSlotsIdleWithFreeWork
        expr: >-
          max(findings_issues{state="free", origin="daniel-box"}) > 0
          unless on() count(claude_fanout_batch_pids_current) > 0
        for: 1h
        labels:
          severity: warning
          service: daniel-box
          shadow: "true"
        annotations:
          summary: Free fan-out issues have waited an hour with no batch running.
          description: >-
            findings_issues{state="free"} has been above 0 for an hour while no fan-out batch
            ran on either node. Read `uv run python scripts/dev/findings.py next` for what is
            free and `uv run python scripts/dev/fanout.py place read` for the hosts' headroom,
            then launch, or record why the queue waits (`findings.py defer`).
      # HostUpdateStale: one rule per entry of observability_expected_hosts. Each entry's rule is
      # the shape of tests/rules/fixtures/host-update-stale.yaml, and
      # ansible/tests/services/test_host_plane_rule_literals.py prints the rule a new entry
      # needs.
      - alert: HostUpdateStale
        expr: |
          (
              time() - homelab_host_update_success_timestamp_seconds{job="node-pi",origin="daniel-pi"} > 11400
            or
              (
                  absent(homelab_host_update_success_timestamp_seconds{job="node-pi",origin="daniel-pi"})
                and on (job, origin)
                  up{job="node-pi",origin="daniel-pi"} == 1
              )
          )
        labels:
          severity: critical
          service: daniel-pi
        annotations:
          summary: daniel-pi has had no successful homelab update for 11400s.
          description: >-
            No homelab-updater run on daniel-pi has succeeded in 11400s, or its exporter is up
            and serves no success timestamp. A failed fetch, a stopped homelab-apt-repo.service,
            a firewall rule, a keyring mismatch and a stopped timer each leave it stale. Read
            `systemctl status homelab-updater.timer` and `journalctl -u homelab-updater` on
            daniel-pi, and docs/host-packages.md, "Host-plane pages".
