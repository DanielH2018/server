---
# The observability plane: the Claude Code telemetry stack (collector, Tempo, Loki) and the
# cluster's metrics plane (Prometheus, kube-state-metrics, Grafana).
#
# Claude Code runs on the daniel-box HOST and exports to localhost:4317 — that endpoint is
# fixed by the chezmoi settings template, which enables telemetry on every host except
# daniel-pi and states the intent plainly: "Every host exports to localhost:4317 and every
# host keeps its own data."

# Pinned, Renovate-tracked.
observability_k8s_collector_image: otel/opentelemetry-collector-contrib:0.161.0
observability_k8s_loki_image: grafana/loki:3.7.8@sha256:1107dd5274e0ada47e42472b7a7e71f3b2a2fe878878108f3e2f9e51528f0193
observability_k8s_prometheus_image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
# scripts/validate/alert_tools.sh reads this tag, as it reads the Prometheus one above, to
# provision amtool for the validate-alert-rules hook, so the Alertmanager this role runs and the
# amtool CI checks its config with move in one Renovate bump.
observability_k8s_alertmanager_image: prom/alertmanager:v0.34.1@sha256:e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a
# Grafana 12 removed Angular, so every `graph` panel must be converted to `timeseries` and
# deployed before a major bump, not alongside it.
#
# DECIDED: grafana-data stays on longhorn-nobackup (operator declined a backup 2026-08-21);
# dashboards and datasources are provisioned from git.
# Grafana's schema migrations are one-way, which is tolerable because of that: the DB holds
# only preferences, version history and annotations. Recovery is deleting the PVC.
observability_k8s_grafana_image: grafana/grafana:13.2.3@sha256:b28bae15e219c998fb0e0424ed724930cc61b1f61fb404d47c862f9a23f9e572
# Distinct from the metrics-server k3s already bundles: that serves the
# resource-metrics API for `kubectl top`/HPA, while this exports kube_pod_status_ready and
# kube_deployment_status_* — the only readiness signal the seven routeless workloads have.
observability_k8s_kube_state_metrics_image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.20.0@sha256:42cfe3723a5f058171c627537fb57a3ea0f26e4380fa18555a95cb1a1b4cfc5b

# kube-state-metrics' custom-resource-state config for the Flux kinds. It produces
# gotk_resource_info, one series per Kustomization and OCIRepository, which the Flux
# controllers do not export themselves (docs/flux-deploy-plane.md).
#
# kube-state-metrics.yaml.j2 passes it inline as --custom-resource-state-config through
# to_json, not as a ConfigMap. The config then lives in the pod template, so a change here
# rolls kube-state-metrics through the apply, and the role gains no ConfigMap key for
# test_observability_config_rolls_one_workload.py to track.
#
# The metric name, the labels and `exported_namespace` follow fluxcd/flux2-monitoring-example,
# so upstream Flux boards and rules read these series unchanged, with one exception: a
# Kustomization's `revision` reads status.lastAppliedOriginRevision (`master@sha1:<sha>`), the
# field contracts.md C6 names, where upstream reads lastAppliedRevision (`prod@sha256:<digest>`),
# which names no commit.
#
# kube-state-metrics drops a label whose path is absent. The flux role omits spec.suspend
# unless its suspend lever is on, so `suspended` is absent rather than "false" on an object
# Flux is reconciling, and a rule reading it matches suspended="true".
#
# Each kind here needs list and watch in the ClusterRole in kube-state-metrics.yaml.j2.
observability_ksm_flux_resource_state:
  kind: CustomResourceStateMetrics
  spec:
    resources:
      - groupVersionKind: {group: kustomize.toolkit.fluxcd.io, version: v1, kind: Kustomization}
        metricNamePrefix: gotk
        metrics:
          - name: resource_info
            help: The current state of a Flux Kustomization.
            each:
              type: Info
              info:
                labelsFromPath:
                  name: [metadata, name]
            labelsFromPath:
              exported_namespace: [metadata, namespace]
              ready: [status, conditions, "[type=Ready]", status]
              suspended: [spec, suspend]
              revision: [status, lastAppliedOriginRevision]
              source_name: [spec, sourceRef, name]
      - groupVersionKind: {group: source.toolkit.fluxcd.io, version: v1, kind: OCIRepository}
        metricNamePrefix: gotk
        metrics:
          - name: resource_info
            help: The current state of a Flux OCIRepository.
            each:
              type: Info
              info:
                labelsFromPath:
                  name: [metadata, name]
            labelsFromPath:
              exported_namespace: [metadata, namespace]
              ready: [status, conditions, "[type=Ready]", status]
              suspended: [spec, suspend]
              revision: [status, artifact, revision]
              url: [spec, url]

# Auto-deploy stance — read by gitops_deploy (see the k8s auto-deploy coverage design).
# Observability: the Claude Code telemetry stack (collector/Loki/Prometheus/Grafana/Tempo/
# kube-state-metrics/Alertmanager) — a broken deploy blinds this whole diagnostic surface with nothing else
# watching it. ALSO Recreate + a PVC on each stateful sub-service (loki-data, grafana-data,
# prometheus-data, tempo-data, alertmanager-data) — several independently migrating-state-shaped Deployments behind
# one role, which compounds the risk across more than one component at once.
k8s_autodeploy: false  # noqa var-naming[no-role-prefix]
k8s_autodeploy_reason: "observability — the cluster metrics plane and Claude Code's own telemetry stack, one sub-image per workload across several Deployments. ALSO each stateful component (loki/grafana/prometheus/tempo/alertmanager) is Recreate + its own PVC — compounding, not single-component. COUPLING NOTE for a future promotion: UI-edited Grafana dashboards live only in the PVC until an export script round-trips them to git; a revert discards unsaved edits"  # noqa var-naming[no-role-prefix]

# longhorn-nobackup, NOT longhorn. Two reasons, either sufficient on its own:
#   - Volume: Loki with content logging on grows fast, and Prometheus TSDB is high-churn.
#     Both are bulky, regenerable state.
#   - Sensitivity: content logging is ON, so Loki holds prompts, responses and tool output
#     verbatim. The default class would copy transcript-grade data into B2 automatically.
observability_storage_class: longhorn-nobackup
observability_loki_storage: 10Gi
observability_prometheus_storage: 12Gi
# Grafana keeps only its own SQLite (users, prefs, starred dashboards). Datasources and
# dashboards are provisioned from ConfigMaps, so this volume is small and losing it costs
# nothing but UI state — it is on the no-backup class for that reason, not just size.
# allowUiUpdates is true, so a UI-edited board DOES live only here until
# scripts/grafana/export_grafana_dashboards.py round-trips it into the git tree — git is the
# backup, the export is the save step.
observability_grafana_storage: 1Gi
# Alertmanager's silences and notification log. Small, and on the no-backup class: losing it
# costs only those two, and the cost is one re-sent notification per open alert.
observability_alertmanager_storage: 1Gi

# The role's claims, rendered by k8s/manifests (#3387). Each names `namespace` because the claims
# live beside their workloads in k8s_observability_namespace, not in the shared k8s_namespace.
# No `k8s_autodeploy_snapshot_pvcs` here, so the claims are applied by the directory apply,
# after 00-namespace.yaml creates the namespace on a fresh cluster.
k8s_claims:  # noqa var-naming[no-role-prefix]
  - name: loki-data
    storage_class: "{{ observability_storage_class }}"
    size: "{{ observability_loki_storage }}"
    namespace: "{{ k8s_observability_namespace }}"
  - name: prometheus-data
    storage_class: "{{ observability_storage_class }}"
    size: "{{ observability_prometheus_storage }}"
    namespace: "{{ k8s_observability_namespace }}"
  - name: grafana-data
    storage_class: "{{ observability_storage_class }}"
    size: "{{ observability_grafana_storage }}"
    namespace: "{{ k8s_observability_namespace }}"
  - name: tempo-data
    storage_class: "{{ observability_storage_class }}"
    size: "{{ observability_tempo_storage }}"
    namespace: "{{ k8s_observability_namespace }}"
  - name: alertmanager-data
    storage_class: "{{ observability_storage_class }}"
    size: "{{ observability_alertmanager_storage }}"
    namespace: "{{ k8s_observability_namespace }}"

# OTLP gRPC, bound to loopback ON THE NODE via hostPort. Deliberately not a MetalLB VIP:
# with content logging on, this must not be reachable from the LAN. Loopback is the whole
# access control, exactly as the chezmoi bundle intends.
observability_otlp_port: 4317
observability_otlp_host_ip: 127.0.0.1
# Query-side twin of observability_otlp_host_ip, for Loki/Prometheus/Tempo. `otelq` is a
# host process and hardcodes 127.0.0.1 on 3100/9090/3200, so a ClusterIP-only Service is
# unreachable to it. Loopback is load-bearing for the same reason as the collector's:
# these backends hold prompts, responses and tool output verbatim, so the node-side
# listener must never bind 0.0.0.0.
observability_query_host_ip: 127.0.0.1

# Pinned ClusterIPs for the three query backends. These are the addresses they already
# hold; declaring them makes an existing allocation explicit rather than requesting a
# change, so an apply is a no-op.
#
# They are pinned because they are quoted as constants outside this repo. Loki, Prometheus
# and Tempo are single-replica Deployments with no nodeSelector, publishing their query
# ports on a hostPort bound to observability_query_host_ip — so only the node they happen to
# run on answers on loopback. When all three reschedule to the other node, every host-side
# query tool breaks while the telemetry itself stays healthy. `otelq` and `otel-sweep`
# (chezmoi: home/dot_local/bin/) try loopback first and these addresses second, which works
# from either node. That fallback is only sound while the addresses cannot be reassigned
# under it, which is what pinning buys.
#
# spec.clusterIP is immutable: changing a value here is rejected on apply, and actually
# moving one means deleting the Service and updating the constants in both repos together.
observability_loki_cluster_ip: 10.43.99.158
observability_prometheus_cluster_ip: 10.43.39.218
observability_tempo_cluster_ip: 10.43.4.147

# 744h (31d). Retention matters more here than in a normal log store: every prompt and
# response is retained verbatim for this window.
observability_loki_retention: 744h
# Dashboard folders. These are the subdirectories of roles/k8s/observability/files/dashboards,
# which is the single source of truth for the JSON.
# DECIDED: this list has no folder-level prune, and that is deliberate (operator 2026-08-28).
# Dropping a name here removes the folder's volume and volumeMount from grafana.yaml.j2 (both
# rendered by `{% for folder in observability_dashboard_folders %}`, at the volumeMounts and volumes
# blocks) but leaves the staged dir, the annotated dir and the live grafana-dashboards-<folder>
# ConfigMap behind. That orphan is INERT: the mount is by explicit per-folder volume name, so an
# unlisted ConfigMap is never mounted and never reaches Grafana. Adding a prune would trade an
# inert orphan for deletion behaviour that can remove a live ConfigMap — a worse failure than the
# one it closes, and the reason the 2026-08-28 review's fix-skeptic pass rejected it. Reopen only
# with a case where the orphan is reachable, not merely present.
observability_dashboard_folders:
  - AI
  - Apps
  - Infrastructure
  - Logs
  - Networking
  - Security

# ── deploy annotations ────────────────────────────────────────────────────────────────────────
# Deploys are recorded as syslog lines (deploy_lib/playbook.annotate and
# deployer_lib/deploy_io.py both call `logger`), promtail ships them to loki-homelab, and every
# dashboard gets an annotation query injected at deploy time by
# scripts/grafana/inject_dashboard_annotations.py. No Grafana API call, so no pinned ClusterIP and
# no standing write credential — see the emit_deploy_annotation comments.
#
# The uid MUST equal the `loki-homelab` datasource uid in templates/grafana.yaml.j2. A wrong one
# does not error: Grafana renders the annotation query against nothing and the board shows no
# deploy markers, silently. ansible/tests/deploy/test_deploy_annotations.py holds the two in lockstep.
observability_loki_homelab_uid: bf4q19tuivta8e
# `|= "event=deploy"` before `| logfmt`, in that order: the line filter runs first and is far
# cheaper than parsing every syslog line in the window.
observability_deploy_annotation_expr: '{job="syslog"} |= "event=deploy" | logfmt'

observability_prometheus_retention: 30d
# DECIDED: the size cap binds before the 30d time cap; read
# (time() - prometheus_tsdb_lowest_timestamp_seconds)/86400 before any retention claim.
#
# Deliberately well under observability_prometheus_storage (12Gi), not close to it. What the cap
# counts is persisted blocks PLUS the WAL and the m-mapped head chunks; what it does NOT cover is
# compaction, which needs room for the output block alongside its inputs. Sizing it near the
# volume is how a size-capped Prometheus still fills its disk; the ~58% ratio below is the
# thing to hold, not the absolute.
#
# Raising it does not defer a cardinality problem. With the four control-plane jobs at a 1m
# scrape interval, 30 days costs ~6.6GB (1957.7 samples/s x 1.297 bytes/sample = 219 MB/day).
# The model matches measured history: an earlier 5,734 samples/s predicts 642 MB/day, and the
# blocks grew at 695 MB/day — 8% agreement.
observability_prometheus_retention_size: 7GB

# Traces. Claude Code emits spans only with both CLAUDE_CODE_ENHANCED_TELEMETRY_BETA
# and OTEL_TRACES_EXPORTER set — the chezmoi settings template already sets both, so this is
# purely a matter of giving them somewhere to land.
# Tempo 3.0 removed the ingester module and replaced the compactor with
# backend_scheduler/backend_worker; tempo.yaml.j2 carries both changes and says why. 3.0 refuses
# vParquet3 and earlier blocks, so the instance must already write vParquet4 (read
# /status/config).
observability_k8s_tempo_image: grafana/tempo:3.1.0@sha256:3076b8dcdfb32fd6bc5ccef85e7b7313e6199b9cb84366257fc17ecb696db5fd
observability_tempo_storage: 5Gi
# 720h (30d) — the same window as the Prometheus retention, a day under Loki's 744h. Its own
# variable rather than a shared one because spans are per-turn and far bulkier than counters,
# so this is the value most likely to need cutting first if the PVC fills.
observability_tempo_retention: 720h

# Self-monitoring (templates/telemetry-health.sh.j2). Pushes to a static Kuma monitor rather
# than being polled, because monitor-bridge has no ServiceAccount and never calls the
# Kubernetes API this reads.
#
# */10, matching the Longhorn backup heartbeat: this queries the k8s API and Prometheus rather
# than reading a local file, and the fastest thing it watches (a 15m export-failure window)
# does not move faster than that. The Kuma monitor's heartbeat interval must stay above this
# (see the uptime-kuma role) so a dead cron trips the watchdog.
observability_health_cron_minute: "*/10"

# How often Alertmanager re-sends the always-firing Watchdog alert to its Healthchecks.io check,
# in whole seconds. alertmanager-secret.yaml.j2 renders it as the Watchdog route's
# `repeat_interval`, so no reader parses a duration string. The check's 600s period must stay
# well above it, or one late send pages. The M1 slice plan
# (docs/target-architecture/monitoring/m1-alertmanager.md) sizes the check.
observability_alertmanager_watchdog_repeat_seconds: 60

# Prometheus's rule groups. Each name is one file, files/rules/<name>.yaml, holding one group of
# that name, and prometheus-rules.yaml.j2 carries each listed file into the prometheus-rules
# ConfigMap. A rule file this list does not name never reaches Prometheus, so add the group
# here in the commit that adds its file; scripts/validate/alert_rules.py fails until they agree.
observability_rule_groups:
  - alerting-meta
  - workload-service
  - k8s-workloads
  - loki-homelab
  - flux
  - ingress-probes
  - host-checks
  - deploy-pipeline

# The telemetry workloads, as the {kind, name} pairs post_tasks/k8s_stabilise_gate.yml reads.
# A variable rather than a second inline copy of the list: tasks/main.yml still spells it out
# once (the wait loop; the restart loop reads this variable), and the stabilisation tasks that
# consume it must iterate the SAME set or the gate silently watches fewer workloads than rolled.
# ansible/tests/services/test_observability_stabilise_coverage.py holds the three in step.
#
# `restart_on` names which of roles/k8s/manifests's three change signals queues a
# `rollout restart` for that workload, and so which makes the release record expect a fresh
# `restartedAt` from it (`manifests_restart_triggers_default`, that role's defaults/main.yml).
# The shared default `[config, secret, image]` would restart all of them for one workload's
# edit: `manifests_render is changed` fires when ANY of this role's manifests changed.
#
# Every entry is `[]`: nothing the shared role decides needs a restart for any of them. A
# ConfigMap is hashed into its own pod template (`checksum/config`), so the apply moves the pod
# template and rolls the pod by itself; kube-state-metrics renders no ConfigMap at all, and every
# input it does have already lives in the pod template.
#
# `restart_secrets` is the one case the annotation cannot cover: the rendered Secret files a
# workload's pod reads. prometheus file-mounts `prometheus-scrape-credentials`, grafana reads
# `grafana-admin` through `env.valueFrom`, and alertmanager file-mounts `alertmanager-config`,
# its whole config. Hashing a Secret's bytes into a world-readable annotation would open a read
# path over it, so tasks/main.yml restarts an entry whose `restart_secrets` names a file whose
# render changed, and nothing else: an alertmanager config edit restarts alertmanager alone.
# `origin-pull-secret.yaml` restarts nothing, because only a Traefik middleware reads it.
#
# DECIDED: no rolled_by_role on these entries, though the release record's `restart` comes
# from the role's own amend after its private restart, as pihole-2's does. The shared role drops
# every entry carrying `rolled_by_role` from the pod-template fingerprints (the task "List the
# workloads whose pod template is fingerprinted" in roles/k8s/manifests/tasks/main.yml). These
# workloads are applied BY the shared apply, so their fingerprints are right and the restart's
# "the apply already rolled it" skip needs them: without it, an image bump and a Secret edit in
# one deploy roll a Recreate pod twice, deleting it mid-pull (#3115). `restart_on: []` gets the
# stamp's `restart: false` instead. The M1 plan
# (docs/target-architecture/monitoring/m1-alertmanager.md), PR 5, has the ruling.
observability_stabilise_workloads:
  - { kind: deploy, name: loki, restart_on: [] }
  - kind: deploy
    name: prometheus
    restart_on: []
    restart_secrets: [scrape-credentials-secret.yaml]
  - { kind: deploy, name: kube-state-metrics, restart_on: [] }
  - { kind: deploy, name: tempo, restart_on: [] }
  - { kind: daemonset, name: otel-collector, restart_on: [] }
  - kind: deploy
    name: grafana
    restart_on: []
    restart_secrets: [grafana-secret.yaml]
  - kind: deploy
    name: alertmanager
    restart_on: []
    restart_secrets: [alertmanager-secret.yaml]
