---
# No Flux path runs this file: the tag is flux-owned from its first commit. It stays so the role
# has the shape every k8s role has. Its only content is files/upstream/, which the renderer
# attaches to the bundle, so the include renders no template of its own, and there is no
# workload to roll.
- name: Deploy the Traefik CRDs to the cluster
  ansible.builtin.include_role:
    name: k8s/manifests
  vars:
    manifests_files: []
    manifests_rollout: ''
