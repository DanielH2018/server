---
# The release files/gotk-components.yaml was generated at. A bump regenerates that file by
# hand, with the pipeline its first line names (CLAUDE.md), because Renovate can rewrite this
# line but cannot run `flux install`. ansible/tests/k8s/test_flux_role.py fails a bump whose
# vendored header still names the old release.
# renovate: datasource=github-releases depName=fluxcd/flux2
flux_version: v2.9.6

k8s_autodeploy: false  # noqa var-naming[no-role-prefix]
k8s_autodeploy_reason: "platform: the deploy controller itself. A bump of flux_version must be regenerated by hand"  # noqa var-naming[no-role-prefix]

# The namespace the vendored install creates and every controller runs in. The manifests role
# applies and prunes here rather than in k8s_namespace.
flux_namespace: flux-system

# The three controllers, for the wait, the restart-count snapshot and the release record.
#
# `restart_on: []` on every entry is required. Without it the shared default `[config, secret,
# image]` applies, so any changed render whose apply leaves a controller's pod template alone
# (a NetworkPolicy edit, or a changed Secret render) records `restart: true` for all three.
# No task here restarts a controller, so `probe.py health flux` would then fail each as NOT
# ROLLED. No signal applies: no controller reads a Secret or a ConfigMap through env, envFrom or
# a subPath, notification-controller reads its Provider's Secret through the API on each event,
# and a pod-template change rolls the controller through the apply itself.
flux_controllers:
  - { kind: deploy, name: source-controller, restart_on: [] }
  - { kind: deploy, name: kustomize-controller, restart_on: [] }
  - { kind: deploy, name: notification-controller, restart_on: [] }

# A Deployment-shaped merge patch the flux_components filter applies to every vendored
# Deployment, so the fleet guards hold without an exemption row per guard.
# runAsUser and runAsGroup pin the uid all three images declare (`USER 65534:65534` in each
# controller's Dockerfile at the vendored tag) beside upstream's `runAsNonRoot`.
flux_pod_patch:
  spec:
    revisionHistoryLimit: 3
    template:
      spec:
        enableServiceLinks: false
        securityContext:
          runAsUser: 65534
          runAsGroup: 65534

# Upstream's generic volume names, each renamed to `<deployment>-<suffix>` by the
# flux_components filter. The filter refuses a volume this map does not name, so a
# regeneration that adds one fails the render rather than the volume-name guard.
flux_volume_suffixes:
  data: data
  tmp: tmp
  temp: tmp

# The artifact the `promote` workflow publishes, and the tag it moves to the newest published
# master commit. The OCIRepository `homelab` follows that tag with no pull secret, so the
# package must stay public (docs/flux-deploy-plane.md).
flux_artifact_url: oci://ghcr.io/danielh2018/homelab-manifests
flux_artifact_tag: prod

# The keyless identity `promote` signs under, as Go regular expressions for the
# OCIRepository's `matchOIDCIdentity`. scripts/deploy_tools/forge.py holds the same identity
# as SIGNER_IDENTITY and SIGNER_ISSUER for `cosign verify`, and
# ansible/tests/k8s/test_flux_role.py fails a drift between the two.
flux_signer_subject: '^https://github\.com/DanielH2018/server/\.github/workflows/promote\.yml@refs/heads/master$'
flux_signer_issuer: '^https://token\.actions\.githubusercontent\.com$'

# The repository notification-controller posts commit statuses to.
flux_github_repository_url: https://github.com/DanielH2018/server

# The way out: true renders `suspend: true` on the OCIRepository `homelab` and the root
# Kustomization, which stops all reconciliation and deletes nothing. False omits the field
# rather than writing `suspend: false`, so a hand suspend survives the role's next run. A
# suspend this lever wrote does not: the client-side apply's three-way merge removes a field
# the last apply rendered and this one omits.
flux_sync_suspend: false

# The signature drill. True renders a second OCIRepository, `verify-drill`, that follows the
# unsigned tag `promote.yml`'s `verify_drill` dispatch pushes and must read Ready=False. False
# deletes it, because dropping a document from the render deletes nothing live.
flux_verify_drill: false
