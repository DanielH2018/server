---
# Flux owns registry (D5, Wave D), so no Ansible run reaches this file. The self-tests and the
# netpol probe are the `registry-verify` Jobs in templates/verify/, which Flux applies once the
# `registry` Kustomization reads Ready. The ghcr-mirror's GC (registry-gc.sh, its cron,
# /var/lib/registry-gc and ghcr-mirror-gc-job.yaml) installs from
# roles/setup/k8s_host_files/tasks/registry.yml, because the mirror's GC stays a host script.
#
# What the deleted tasks did, and what replaces each:
#   - the rollout waits: the Kustomization's `wait` and the verify Jobs' deadlines;
#   - the self-test and netpol-probe Jobs: `registry-verify`;
#   - the deploy's restore of a ghcr-mirror a stopped GC left at zero (#5736): registry-gc.sh
#     restores a mirror its stamp shows it left there at the start of the next run, and
#     observability's GhcrMirrorScaledToZero pages one left at zero for 2h.
# The git history before the flip has the deleted tasks.

# The claims are `k8s_claims` in defaults/main.yml, which k8s/manifests renders and applies
# ahead of the workload. The include stays for the handback (docs/flux-deploy-plane.md).
- name: Deploy the image registry to the cluster
  ansible.builtin.include_role:
    name: k8s/manifests
  vars:
    # The ghcr.io mirror (templates/ghcr-mirror.yaml.j2). `restart_on: []`, because it reads no
    # ConfigMap or Secret: an unrelated edit to this role would otherwise restart it and drop
    # every pull in flight.
    manifests_extra_rollouts:
      - name: ghcr-mirror
        restart_on: []
