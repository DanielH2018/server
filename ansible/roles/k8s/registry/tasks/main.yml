---
# The claim is `k8s_claims` in defaults/main.yml; k8s/manifests renders and applies it.
#
# The prune k8s/manifests arms by default (its manifests_prune DECIDED comment). The render
# stamps homelab/role on every document, the k8s_claims claim included; the fixed allowlist
# never names PersistentVolumeClaim, so the claims are applied but never pruned. The three
# `*-job.yaml` templates stay out of this include's derived list by their suffix.
- name: Deploy the image registry to the cluster
  ansible.builtin.include_role:
    name: k8s/manifests
  vars:
    # The ghcr.io mirror (templates/ghcr-mirror.yaml.j2). `restart_on: []`, because it reads no
    # ConfigMap or Secret: an unrelated edit to this role would otherwise restart it and drop
    # every pull in flight. The apply still rolls it when its own pod template changes.
    manifests_extra_rollouts:
      - name: ghcr-mirror
        restart_on: []

# THE SECOND ROLE THAT MUST WAIT INLINE (crowdsec is the other; see its header). k8s/manifests
# deliberately does NOT wait — it queues the rollout for k8s/manifests/tasks/drain.yml at the end of the
# batch. Most roles tolerate that because nothing else in them touches the workload they just
# rolled. This one does: every self-test below dials registry over its Service, and the batch
# drain runs long after them.
#
# registry-selftest-push's first pod can get `connection refused` to the registry ClusterIP
# while the Deployment is still rolling. The Job's ONE retry (`backoffLimit: 1`) then absorbs
# the race, so the proof-of-loop spends its entire retry budget racing the pod it just
# restarted. A rollout slower than one retry backoff exhausts it, and the deploy fails on a
# registry that is merely slow to start.
#
# `rollout status`, not `wait --for=condition=Available`: this Deployment is single-replica, so
# the OLD pod satisfies Available and the wait returns instantly. Returns immediately when
# nothing rolled, so a no-change deploy pays nothing.
#
# It also returns success immediately for a Deployment scaled to ZERO, which registry-gc.sh
# does while it collects. This gate does not cover that case, and does not need to: GC is
# scheduled precisely so it never shares a window with a deploy (see the GC section below).
- name: Wait for the registry rollout before proving anything against it
  when: not k8s_no_mutate
  tags: [deploy]
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n {{ k8s_namespace }} rollout status deploy/registry --timeout=300s
  become: true
  changed_when: false

# The way back from a GC that died mid-run. ghcr-mirror.yaml.j2 renders no `replicas:`, so an
# apply never resets a count registry-gc.sh left at zero, and only that script scales it back.
# The EXIT trap that does so cannot run after a SIGKILL, an OOM kill or a power loss. A mirror
# stuck at 0/0 is invisible: rollout status passes, the netpol probe's mirror leg is refused
# as intended, monitor-bridge's zero-available check skips a Deployment that wants zero, and
# containerd falls back to ghcr.io until the WAN outage the mirror exists for. So every deploy
# restores it, unless a GC run holds the store.
#
# Only while Ansible owns registry. After the flip, registry-gc.sh's own stamp restores it at
# the start of the next run, and observability's GhcrMirrorScaledToZero pages a mirror left at
# zero for 2h.
- name: Read the ghcr-mirror replica count
  when: not k8s_no_mutate
  tags: [deploy]
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n {{ k8s_namespace }} get deploy ghcr-mirror -o jsonpath={.spec.replicas}
  become: true
  changed_when: false
  register: registry_mirror_replicas

# A GC run killed after it applied its Job has released its lock, and the Job may still be
# pruning, so the Job's own state gates the restore as well.
- name: Read whether the ghcr-mirror GC Job is running
  when: not k8s_no_mutate
  tags: [deploy]
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n {{ k8s_namespace }} get job registry-gc-ghcr-mirror --ignore-not-found
      -o jsonpath={.status.active}
  become: true
  changed_when: false
  register: registry_mirror_gc_active

# Under registry-gc.sh's lock (#5736). The script holds it from before its scale-down until
# after its restore, and it scales the mirror down before it creates its Job, so the Job read
# above is empty for the first two minutes of every run. `--nonblock` makes a held lock exit
# 75 at once, which means a GC run owns the mirror and this deploy leaves it alone.
# `--current-replicas=0` makes the API server refuse the write if anything moved the count
# since the read. The lock lives in /run/lock, which every host has, so a host with
# registry_k8s_manage_gc false takes it too.
- name: Restore a ghcr-mirror replica a stopped GC left at zero
  when:
    - not k8s_no_mutate
    - registry_mirror_replicas.stdout | trim == '0'
    - registry_mirror_gc_active.stdout | trim in ['', '0']
  tags: [deploy]
  ansible.builtin.command:
    cmd: >-
      flock --nonblock --conflict-exit-code 75 {{ registry_k8s_gc_lock_file }}
      k3s kubectl -n {{ k8s_namespace }} scale deploy/ghcr-mirror --current-replicas=0
      --replicas=1
  become: true
  register: registry_mirror_restore
  changed_when: registry_mirror_restore.rc == 0
  failed_when: registry_mirror_restore.rc not in [0, 75]

# The netpol probe below dials the mirror's port and passes when the dial is refused, which a
# mirror with no endpoint yet also produces. Waiting here makes that leg a test of the policy.
- name: Wait for the ghcr-mirror rollout before probing its policy
  when: not k8s_no_mutate
  tags: [deploy]
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n {{ k8s_namespace }} rollout status deploy/ghcr-mirror --timeout=300s
  become: true
  changed_when: false

# ── proof of loop ───────────────────────────────────────────────────────────
# A registry with an empty catalog is healthy by every signal and unproven. Its readiness probe
# only says the process answers, which is true of a registry that no builder can reach and no
# node can pull from. Nothing else in the fleet exercises it until n8n depends on it, and
# discovering a broken push path while also debugging a first build is the situation this
# proof avoids.
#
# Runs on every deploy rather than once, and the reason is the same as docker-user-verify's: the
# two things it checks are host and cluster state that can regress without anyone touching this
# role. registries.yaml is written by roles/setup/k3s, so a change there — or a containerd
# restart that never re-read it — breaks the pull path silently.

# THE JOB MANIFESTS GO IN THEIR OWN DIRECTORY, not `manifests/registry/`. That directory
# belongs to `k8s/manifests`, whose prune task deletes every file in it that the caller does
# not name in `manifests_files`/`manifests_secret_files`. These three are this role's own files
# rather than manifests of the workload, so no caller names them and the prune would delete
# all three at the start of every registry deploy. The `manifests_prune` default is the
# LIVE-object prune and is orthogonal to that staged-file prune.
#
# The GC Job manifest shares this directory, and roles/setup/k8s_host_files/tasks/registry.yml
# renders it: `registry-gc.sh` reads it at CRON time, so a prune of the directory would open a
# window in which a GC run fails on a missing manifest.
#
# ONE directory for all of them, rather than a `-selftest`/`-netpol`/`-gc` split. The reason
# headlamp gives for a probe's own directory is that `kubectl apply -f <dir>` sweeps a whole
# directory; registry applies each of these per-FILE, so that reason does not bite here, and
# every additional sibling name is another reservation under the manifest root that nothing
# enforces.
- name: Create the registry job manifest directory
  tags: [config, deploy, registry-gc]
  ansible.builtin.file:
    path: /etc/rancher/k3s/manifests/registry-jobs
    state: directory
    mode: "0700"
    owner: root
    group: root
  become: true
  when: not k8s_dry_run | bool

- name: Render the registry self-test jobs
  tags: [config]
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/rancher/k3s/manifests/registry-jobs/{{ item }}"
    mode: "0644"
    owner: root
    group: root
  loop:
    - selftest-push-job.yaml
    - selftest-pull-job.yaml
  become: true
  when: not k8s_dry_run | bool

# Deleted first because a Job's pod template is immutable: re-applying a completed Job is either
# a no-op or an error, and in both cases it proves nothing about today.
- name: Clear the previous registry self-test run
  when: not k8s_no_mutate
  tags: [deploy]
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n {{ k8s_namespace }} delete job
      registry-selftest-push registry-selftest-pull registry-selftest-pull-agent
      --ignore-not-found
  become: true
  changed_when: true

- name: Prove a pod can PUSH to the registry over its Service
  when: not k8s_no_mutate
  tags: [deploy]
  ansible.builtin.command:
    cmd: >-
      k3s kubectl apply -f
      /etc/rancher/k3s/manifests/registry-jobs/selftest-push-job.yaml
  become: true
  changed_when: true

- name: Wait for the push self-test
  when: not k8s_no_mutate
  tags: [deploy]
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n {{ k8s_namespace }} wait --for=condition=complete
      job/registry-selftest-push --timeout=180s
  become: true
  changed_when: false
  register: registry_push_probe
  failed_when: registry_push_probe.rc != 0

# Ordered after the push on purpose: it pulls what the push just wrote, so running them
# concurrently would race and a first-ever run would fail on a tag that does not exist yet.
- name: Prove containerd can PULL from the registry through registries.yaml
  when: not k8s_no_mutate
  tags: [deploy]
  ansible.builtin.command:
    cmd: >-
      k3s kubectl apply -f
      /etc/rancher/k3s/manifests/registry-jobs/selftest-pull-job.yaml
  become: true
  changed_when: true

- name: Wait for the pull self-tests
  when: not k8s_no_mutate
  tags: [deploy]
  # The list shrinks with the manifest. selftest-pull-job.yaml.j2 renders the agent half only
  # on a cluster that has an agent node, and `kubectl wait` on a Job that was never applied
  # fails NotFound — so naming it unconditionally turns a correct single-node deploy into a
  # failure. Same condition, stated in both places because neither can see the other.
  vars:
    registry_selftest_pull_jobs: >-
      job/registry-selftest-pull
      {{ 'job/registry-selftest-pull-agent' if k3s_agent_node_ips | default([]) | length > 0 else '' }}
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n {{ k8s_namespace }} wait --for=condition=complete
      {{ registry_selftest_pull_jobs }} --timeout=180s
  become: true
  changed_when: false
  register: registry_pull_probe
  failed_when: registry_pull_probe.rc != 0

- name: Report the proven registry loop
  when: not k8s_no_mutate
  tags: [deploy]
  ansible.builtin.debug:
    msg: >-
      Registry loop proven: pushed {{ registry_k8s_probe_source }} to
      {{ k8s_registry_push_host }}/{{ registry_k8s_probe_repo }}:probe over the Service, and
      containerd pulled it back as {{ k8s_registry_pull_host }}/{{ registry_k8s_probe_repo }}:probe.

# ── prove the NetworkPolicy, rather than assuming it ────────────────────────────────────────
# The positive half is already covered by the push/pull selftests above: registry-selftest-push
# carries the admitted label and its success proves the allow rule works. This is the negative
# half — a pod the policy does NOT admit must be refused.
- name: Render the registry netpol-isolation probe
  tags: [deploy]
  ansible.builtin.template:
    src: netpol-probe-job.yaml.j2
    dest: /etc/rancher/k3s/manifests/registry-jobs/netpol-probe-job.yaml
    mode: "0644"
    owner: root
    group: root
  become: true
  when: not k8s_dry_run | bool

- name: Remove any previous registry netpol-isolation probe
  when: not k8s_no_mutate
  tags: [deploy]
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n {{ k8s_namespace }} delete job registry-netpol-probe
      --ignore-not-found --wait=true
  become: true
  changed_when: true

- name: Run the registry netpol-isolation probe
  when: not k8s_no_mutate
  tags: [deploy]
  ansible.builtin.command:
    cmd: "k3s kubectl apply -f /etc/rancher/k3s/manifests/registry-jobs/netpol-probe-job.yaml"
  become: true
  changed_when: true

- name: Wait for the registry netpol-isolation probe to finish
  when: not k8s_no_mutate
  tags: [deploy]
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n {{ k8s_namespace }} wait --for=condition=complete
      job/registry-netpol-probe --timeout=180s
  become: true
  changed_when: false
  # The Job succeeds only when the connection is REFUSED or times out. A pod with neither
  # admitted label reaching the registry port fails the Job, and therefore the deploy.
  register: registry_netpol_probe
  failed_when: registry_netpol_probe.rc != 0

- name: Report the registry netpol-isolation result
  when: not k8s_no_mutate
  tags: [deploy]
  ansible.builtin.debug:
    msg: >-
      NetworkPolicy registry verified: a pod with neither netpol-role=image-builder nor an
      admitted selftest label cannot reach registry:{{ k8s_registry_port }}, and the push/pull
      selftests above prove the admitted pods can.

# ── garbage collection ──────────────────────────────────────────────────────
# The ghcr-mirror's GC (registry-gc.sh, its cron, /var/lib/registry-gc and ghcr-mirror-gc-job.yaml)
# installs from roles/setup/k8s_host_files/tasks/registry.yml, because a Flux-owned role runs no
# tasks and the mirror's GC stays a host script after the flip. `registry_k8s_manage_gc` still
# disarms it, from that role. It is scheduled, not run on deploy: GC takes the ghcr-mirror down
# for its duration, and the deploy's own restore above and its netpol probe both want it serving.
