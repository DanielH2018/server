---
registry_k8s_image: registry:3.0.0

# The address vars (k8s_registry_port / _host_ip / _pull_host) live in group_vars/all.yml
# because roles/setup/k3s needs them too, to write containerd's trust config.

# longhorn-nobackup on purpose. Every image here is reproducible from a Dockerfile in this
# repo, so backing them up would spend B2 Class C transactions — already ~60% of the daily cap
# — on bytes a rebuild regenerates. Losing this volume costs a rebuild, not data.
registry_k8s_claim: registry-data
registry_k8s_storage_class: longhorn-nobackup
registry_k8s_size: 10Gi

# The proof-of-loop pair (see tasks/main.yml). crane rather than docker or skopeo: it is a
# static binary in a distroless image, needs no daemon, and copies between registries directly
# without a local store to fill the node's disk.
registry_k8s_crane_image: gcr.io/go-containerregistry/crane:v0.21.9
# Deliberately tiny and deliberately not something the fleet runs — the point is to move bytes
# through the registry, and a real image would make a failure ambiguous between "the registry
# is broken" and "that image changed".
registry_k8s_probe_source: alpine:3.22
registry_k8s_probe_repo: registry-selftest
