---
registry_k8s_image: registry:3.0.0

# The address vars (k8s_registry_port / _host_ip / _pull_host) live in group_vars/all.yml
# because roles/setup/k3s needs them too, to write containerd's trust config.

# longhorn-nobackup on purpose. Every image here is reproducible from a Dockerfile in this
# repo, so backing them up would spend B2 Class C transactions — already ~60% of the daily cap
# — on bytes a rebuild regenerates. Losing this volume costs a rebuild, not data.
registry_k8s_claim: registry-data
registry_k8s_storage_class: longhorn-nobackup
registry_k8s_size: 10Gi

# ── garbage collection (registry-gc.sh, gc-job.yaml) ───────────────────────────────────────
# Nothing reclaimed this volume for its first nine days: DELETE_ENABLED only permits deletes,
# and the registry never collects on its own. Every rebuild pushes the same `latest` tag, which
# orphans the previous manifest, so the store grew until it filled and every cluster image build
# failed. Weekly is sized to that observed fill rate with room to spare.
#
# Sunday 04:20 — after the 03:30 Longhorn backup group and the weekly 07:30 host reboot's blast
# radius, and off the 30-min gitops-deploy tick's busiest hours. GC takes the registry offline
# for its duration, so this wants the quietest window available.
registry_k8s_gc_cron_weekday: "0"
registry_k8s_gc_cron_hour: "4"
registry_k8s_gc_cron_minute: "20"

# The registry stays DOWN for up to this long, so it bounds an outage rather than just a job.
# Observed full-store GC over ~10 GiB is minutes; 20 min is generous without being open-ended.
registry_k8s_gc_deadline_s: 1200
# Keep the finished Job around long enough that the next weekly run's operator can still read
# what the last one deleted — the Job log is the only authoritative record of that.
registry_k8s_gc_ttl_s: 604800

# The proof-of-loop pair (see tasks/main.yml). crane rather than docker or skopeo: it is a
# static binary in a distroless image, needs no daemon, and copies between registries directly
# without a local store to fill the node's disk.
registry_k8s_crane_image: gcr.io/go-containerregistry/crane:v0.21.9
# Deliberately tiny and deliberately not something the fleet runs — the point is to move bytes
# through the registry, and a real image would make a failure ambiguous between "the registry
# is broken" and "that image changed".
registry_k8s_probe_source: alpine:3.22
registry_k8s_probe_repo: registry-selftest

# ── NetworkPolicy (fencing an unauthenticated Service) ─────────────────────────────────────
# registry has no REGISTRY_AUTH, so network reachability to k8s_registry_port IS the access
# control. Two ingress rules admit legitimate pushers; everything else on that port is refused.
# See networkpolicy.yaml.j2 for the full reasoning, including the PULL-path caveat.
#
# alpine:3.22 for the same reason prowlarr's and sonarr's probes use it: busybox `nc` and musl
# `getent` both need to be present, and this image already ships in the cluster as
# registry_k8s_probe_source above.
registry_k8s_netpol_probe_image: alpine:3.22

# The CNI bridge gateway on daniel-box — `ip -4 addr show cni0` reads `10.42.0.1/24`, matching
# the live podCIDR `kubectl get node daniel-box -o jsonpath='{.spec.podCIDR}'` = 10.42.0.0/24
# (checked 2026-08-13). hostPort traffic (containerd's pull, see networkpolicy.yaml.j2) is
# SNAT'd to this address before it reaches the pod, so a podSelector cannot admit it — only an
# ipBlock can. Single-node today, so one address is exhaustive; a second node joining before
# slice 7's TLS/LAN-hostname rework would need this widened (or turned into a list) to admit
# that node's own cni0 gateway too.
registry_k8s_netpol_cni_gateway: 10.42.0.1/32

# daniel-server's flannel.1 address — `ip -4 addr show flannel.1` there reads 10.42.1.0/32
# (checked 2026-08-14). Its containerd's pulls of the ClusterIP mirror endpoint arrive
# SNAT'd to this; admitted so built images can run on that node (first consumer: nut).
registry_k8s_netpol_agent_flannel: 10.42.1.0/32
