---
# Same tag the Docker instance runs, so a behavioural difference between the two is never
# the version. The CRD manifests below are pinned to the matching minor.
traefik_k8s_image: traefik:v3.7.10
traefik_k8s_crd_version: v3.7

# Auto-deploy stance — read by gitops_deploy (see the k8s auto-deploy coverage design).
# Platform: this is the ingress edge everything else routes through. A failed deploy removes
# the ability to reach — or observe — anything else in the fleet, including this pod, and
# etp-local-vips-blackout-on-node-join shows host probes stay green straight through that kind
# of outage. Also Recreate + a PVC (the acme.json cert store) on its own state, which compounds
# the risk but isn't the primary reason.
k8s_autodeploy: false  # noqa var-naming[no-role-prefix]
k8s_autodeploy_reason: "platform — ingress edge; a failed deploy removes the ability to reach or fix anything else, and host probes stay green through that kind of outage. COUPLING NOTE for a future promotion: the traefik-acme PVC holds the ACME account key and issued certs; reverting past a real rotation reinstates stale cert state"  # noqa var-naming[no-role-prefix]

# Unprivileged ports inside the pod; the Service maps 80 -> http and 443 -> https. Binding
# :80/:443 in the container would need NET_BIND_SERVICE and a root-ish user for no gain.
traefik_k8s_http_port: 8000
traefik_k8s_https_port: 8443
traefik_k8s_ping_port: 8082

# Traefik's image has no passwd entry requirement; this UID owns the acme PVC via fsGroup.
traefik_k8s_uid: 65532

# Let's Encrypt directory. Empty means production. Set to
#   https://acme-staging-v02.api.letsencrypt.org/directory
# while iterating: both Traefik instances request the SAME SAN set, so they share one
# duplicate-certificate limit (5/week), and a debugging loop against production burns it.
# Flipping back is `rm` on acme.json in the PVC plus a redeploy, not a rebuild.
traefik_k8s_acme_ca_server: ""

# acme.json only. Regenerable — losing it costs one ACME re-issue, not data — so it is
# small and not the volume the slice-1 backup gate turns on.
traefik_k8s_acme_storage: 128Mi

# "1", not "1.0" — Kubernetes canonicalises quantities, so a manifest saying 1.0 produces a live
# object saying 1. The values match, but kubectl's last-applied-configuration annotation does not,
# so every `kubectl apply` patches the annotation and reports the Deployment "configured" forever.
# `kubectl diff` shows nothing (it compares the canonicalised objects), which is what makes this
# hard to see. Keep resource quantities in the form the API server stores.
traefik_k8s_cpu_limit: "1"
traefik_k8s_mem_limit: 512Mi
traefik_k8s_cpu_request: "100m"
traefik_k8s_mem_request: 128Mi

# Slice-6 B1 — the CrowdSec bouncer plugin (same pin as the Docker edge's traefik.yml.j2)
# and the log-tailing agent sidecar. The sidecar parses this pod's access log locally and
# ships signals to the in-cluster LAPI, so its collections are the HTTP-side subset — the
# syslog/authelia parsers stay with the agents that read those logs (daniel-server, B2).
traefik_k8s_bouncer_plugin_version: v1.6.0
traefik_k8s_agent_collections: >-
  crowdsecurity/traefik crowdsecurity/http-cve crowdsecurity/whitelist-good-actors
traefik_k8s_agent_cpu_limit: "0.5"
traefik_k8s_agent_mem_limit: 256Mi
traefik_k8s_agent_cpu_request: 50m
traefik_k8s_agent_mem_request: 64Mi
# The access log lives on an emptyDir shared between traefik, the crowdsec-agent sidecar, and
# the access-log-rotate sidecar below. sizeLimit is now a BACKSTOP, not a countdown: the
# access-log-rotate sidecar copytruncates the file well before this is reached (see its
# resources/policy below), so hitting this would mean rotation itself has stopped working.
traefik_k8s_access_log_size: 1Gi

# (repo:tag, no digest) matching the pattern this role already uses for traefik/crowdsec above —
# a real version tag, not a `latest` rolling one, so Renovate's k8s-defaults manager tracks it by
# tag bump with no digest-pin plumbing needed. Alpine's busybox provides everything the
# access-log-rotate sidecar's script needs: sh, tail, cp, mv, wc.
traefik_k8s_logrotate_image: alpine:3.24
traefik_k8s_logrotate_cpu_limit: "100m"
traefik_k8s_logrotate_mem_limit: 64Mi
traefik_k8s_logrotate_cpu_request: "10m"
traefik_k8s_logrotate_mem_request: 16Mi

# Rotation policy for the shared access log (copytruncate, see deployment.yaml.j2's
# access-log-rotate sidecar). At the measured ~0.7 req/s edge rate (~23.5MB/day of JSON access
# lines), a 100Mi threshold rotates roughly once every 4-5 days; keeping 2 rotated generations
# plus the live file caps the volume at ~300Mi worst case — comfortably under the 1Gi emptyDir
# cap above even through a traffic spike that fills the live file between checks.
traefik_k8s_access_log_rotate_mb: 100
traefik_k8s_access_log_keep: 2
