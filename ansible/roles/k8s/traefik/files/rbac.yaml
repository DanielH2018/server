# Traefik's ClusterRole, copied VERBATIM from the pinned upstream at
#   https://raw.githubusercontent.com/traefik/traefik/v3.7/docs/content/reference/dynamic-configuration/kubernetes-crd-rbac.yml
# with only the ServiceAccount and ClusterRoleBinding rewritten below.
#
# Upstream's binding names a ServiceAccount in the `default` namespace. Ours lives in the
# workload namespace, and a ClusterRoleBinding subject namespace cannot be patched sensibly
# after the fact — so the binding is authored here rather than applied from the URL. The
# ClusterRole itself is upstream's to maintain: re-sync it from that URL when the pinned
# Traefik version moves, and change nothing but the binding.
#
# Same arrangement, and the same reasoning, as files/longhorn-storageclass.yaml in the k3s
# setup role.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: traefik-ingress-controller
rules:
  - apiGroups:
      - ""
    resources:
      - services
      - secrets
      - nodes
      - configmaps
    verbs:
      - get
      - list
      - watch
  # The pods right is needed to inject k8s.pod.uid and k8s.pod.name OTel attributes.
  # When OTel tracing/logs/metrics are not enabled, this rule is not needed.
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
  - apiGroups:
      - discovery.k8s.io
    resources:
      - endpointslices
    verbs:
      - list
      - watch
  - apiGroups:
      - extensions
      - networking.k8s.io
    resources:
      - ingresses
      - ingressclasses
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - extensions
      - networking.k8s.io
    resources:
      - ingresses/status
    verbs:
      - update
  - apiGroups:
      - traefik.io
    resources:
      - middlewares
      - middlewaretcps
      - ingressroutes
      - traefikservices
      - ingressroutetcps
      - ingressrouteudps
      - tlsoptions
      - tlsstores
      - serverstransports
      - serverstransporttcps
    verbs:
      - get
      - list
      - watch
