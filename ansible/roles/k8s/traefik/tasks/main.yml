---
# Flux applies traefik through `promote` (`owner: flux`), and no Flux path runs this file. It
# stays for the handback (docs/flux-deploy-plane.md). The tasks it held before the flip moved:
# - the CRD install and its "established" wait: the `traefik-crds` tag renders the CRDs, and
#   traefik's Kustomization depends on it, so Flux applies traefik only once that tag is Ready;
# - the RBAC staging under /etc/rancher/k3s and its apply: rbac.yaml.j2 renders into this
#   tag's bundle like any other manifest;
# - the reserved-VIP assert: observability's TraefikIngressAddressNotPinned rule, which carries
#   verify="true", so the soak fails a revision that changes traefik while it fires.
- name: Deploy Traefik to the cluster
  ansible.builtin.include_role:
    name: k8s/manifests
