---
# CRDs come from the pinned upstream by URL, exactly as the k3s setup role installs Longhorn
# and MetalLB. They are a large, versioned, third-party set — not ours to hand-maintain. Only
# the ClusterRoleBinding is authored locally (see templates/rbac.yaml.j2 for why).
- name: Install the Traefik CRDs
  tags: [config]
  ansible.builtin.command:
    cmd: >-
      k3s kubectl apply -f
      https://raw.githubusercontent.com/traefik/traefik/{{ traefik_k8s_crd_version }}/docs/content/reference/dynamic-configuration/kubernetes-crd-definition-v1.yml
  register: traefik_k8s_crd_apply
  become: true
  changed_when: "'created' in traefik_k8s_crd_apply.stdout or 'configured' in traefik_k8s_crd_apply.stdout"

- name: Wait for the Traefik CRDs to be established
  tags: [config]
  # Without this the first run races: the Middleware and TLSOption objects in dynamic.yaml
  # are applied against an API server that has not finished registering their kinds yet, and
  # fail with "no matches for kind".
  ansible.builtin.command:
    cmd: >-
      k3s kubectl wait --for condition=established --timeout=60s
      crd/ingressroutes.traefik.io crd/middlewares.traefik.io crd/tlsoptions.traefik.io
  become: true
  changed_when: false

# Templated, not copied, since 2026-08-24: the file now carries one namespaced Role +
# RoleBinding per watched namespace alongside the cluster-scoped role, and those need
# k8s_namespace / k8s_observability_namespace / k8s_longhorn_namespace.
#
# Both halves ship in ONE manifest and ONE apply on purpose. Applying them as two tasks would
# leave a window in which the cluster-wide grant is already gone and the namespaced Roles are
# not yet in place — Traefik's Secret informers would lose their watch mid-flight, and it fails
# green (see the header in templates/rbac.yaml.j2).
- name: Install the Traefik RBAC (cluster-scoped role + per-namespace roles)
  tags: [config]
  ansible.builtin.template:
    src: rbac.yaml.j2
    dest: /etc/rancher/k3s/traefik-clusterrole.yaml
    mode: "0644"
    owner: root
    group: root
  become: true

- name: Apply the Traefik RBAC
  tags: [config]
  ansible.builtin.command:
    cmd: k3s kubectl apply -f /etc/rancher/k3s/traefik-clusterrole.yaml
  register: traefik_k8s_rbac_apply
  become: true
  changed_when: "'created' in traefik_k8s_rbac_apply.stdout or 'configured' in traefik_k8s_rbac_apply.stdout"

- name: Deploy Traefik to the cluster
  ansible.builtin.include_role:
    name: k8s/manifests
  vars:
    manifests_service: traefik
    # The ACME names are concatenated rather than listed, because dropping a name from the list
    # is the only way traefik_k8s_manage_acme reaches the PVC and the token Secret — neither
    # manifest has a template branch to gate.
    manifests_files: >-
      {{ ['rbac-binding.yaml']
         + (['acme-pvc.yaml'] if traefik_k8s_manage_acme | bool else [])
         + ['static-config.yaml', 'dynamic.yaml', 'deployment.yaml', 'service.yaml',
            'metrics-service.yaml', 'dashboard-ingressroute.yaml'] }}
    manifests_secret_files: >-
      {{ (['cf-token-secret.yaml'] if traefik_k8s_manage_acme | bool else [])
         + (['crowdsec-secret.yaml'] if traefik_k8s_manage_crowdsec | bool else [])
         + (['livesync-gate-secret.yaml'] if traefik_k8s_manage_livesync_gate | bool else []) }}

- name: Read the address MetalLB assigned to the Traefik Service
  tags: [deploy]
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n {{ k8s_namespace }} get svc traefik
      -o jsonpath={.status.loadBalancer.ingress[0].ip}
  register: traefik_k8s_lb_ip
  become: true
  changed_when: false
  # Runs under --check too: this only reads. Without it the command is skipped, stdout is
  # empty, `until` can never match, and the run dies after 12 pointless retries — taking the
  # VIP assertion below with it, which is the one thing --check could usefully have checked.
  check_mode: false
  retries: 12
  delay: 5
  until: traefik_k8s_lb_ip.stdout | length > 0

- name: Fail if Traefik did not get the reserved ingress VIP
  tags: [deploy]
  # Kubernetes accepts any annotation key and MetalLB ignores the ones it does not recognise,
  # so a wrong or misspelled request annotation costs nothing at apply time: the Service comes
  # up, an address is assigned out of the auto-assign pool, every pod is healthy and the
  # deploy is green — on the wrong address. That is exactly what the wrong annotation prefix
  # did here during slice 1, and it survived a full bring-up unnoticed. (The prefixes have
  # since swapped roles: metallb.io/ is correct as of MetalLB v0.15, universe.tf/ deprecated.
  # The lesson survives the swap — assert the address, not the spelling.)
  # The address is the one thing DNS and the router port-forward both hardcode, so
  # assert it rather than trusting the annotation was honoured.
  ansible.builtin.assert:
    that: traefik_k8s_lb_ip.stdout == k3s_metallb_ingress_vip
    fail_msg: >-
      Traefik holds {{ traefik_k8s_lb_ip.stdout }}, not the reserved ingress VIP
      {{ k3s_metallb_ingress_vip }}. MetalLB does not re-evaluate an existing allocation when
      pools or annotations change — delete the Service and redeploy to force reallocation.
    success_msg: "Traefik holds the reserved ingress VIP {{ k3s_metallb_ingress_vip }}"

- name: Deploy the Cloudflare IP drift check
  tags: [cron]
  when: traefik_k8s_manage_cloudflare_drift_check | bool
  # The cloudflare_ips allowlist gates forwardedHeaders.trustedIPs on both entrypoints
  # (static-config.yaml.j2). Its Docker-era watchdog retired in 84733119 with the
  # DOCKER-USER origin lock it also guarded, leaving this half unmonitored until 2026-08-15.
  ansible.builtin.template:
    src: cloudflare-ip-drift.sh.j2
    dest: /usr/local/bin/cloudflare-ip-drift.sh
    mode: "0750"
    owner: root
    group: root
  become: true

- name: Schedule the Cloudflare IP drift check
  tags: [cron]
  when: traefik_k8s_manage_cloudflare_drift_check | bool
  # Daily, not weekly like its predecessor: the check is two curls, and the Kuma monitor's
  # 90000s (25h) interval needs a push more often than that to stay green. Cloudflare
  # changes these ranges on a multi-year cadence — the cadence is about the heartbeat,
  # not about catching drift fast. Pushes "Cloudflare IP Drift" directly, no bridge hop.
  ansible.builtin.cron:
    name: "Cloudflare IP drift"
    minute: "25"
    hour: "5"
    user: root
    job: "/usr/local/bin/cloudflare-ip-drift.sh"
    cron_file: cloudflare-ip-drift
  become: true
