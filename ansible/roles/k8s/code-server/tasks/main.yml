---
# No docker plumbing: no DOCKER_HOST, so the image has no in-IDE docker CLI or devcontainers.
# Image built into the cluster registry from this role's templates/Dockerfile.j2.

- name: Build the code-server image
  ansible.builtin.include_role:
    name: k8s/image-builder

# Both claims are `k8s_claims` in defaults/main.yml, which k8s/manifests renders and applies
# ahead of the workload (#3387). The initContainer cannot start without the workspace claim.
- name: Deploy code-server to the cluster
  ansible.builtin.include_role:
    name: k8s/manifests
