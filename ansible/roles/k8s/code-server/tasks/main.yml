---
# Slice-7 Phase C (2026-08-10): ported WITHOUT its docker plumbing (operator decision) — no
# DOCKER_HOST, so the in-IDE docker CLI and devcontainers are gone, and docker-proxy-codeserver
# plus the `codeserver` net retire with the Docker copy. Image built into the cluster registry
# from the containers role's Dockerfile — that role remains the build source, same split as
# n8n/ical-proxy.

- name: Build the code-server image
  ansible.builtin.include_role:
    name: k8s/image-builder
  vars:
    image_builder_name: code-server
    image_builder_dockerfile: "{{ playbook_dir }}/roles/k8s/code-server/templates/Dockerfile.j2"
    # The one file the Dockerfile COPYs (flat — ConfigMap keys cannot contain '/').
    image_builder_context:
      "{{ playbook_dir }}/roles/k8s/code-server/files/extensions.sh": extensions.sh
    # MEASURED, and the measurement says leave it (#2213). This value is the Job's
    # `activeDeadlineSeconds` (image-builder/templates/build-job.yaml.j2), so exceeding it
    # kills the build rather than just failing the wait. A cold build on 2026-09-21 — base
    # bumped to 4.138.0-ls365 the same day, so no layer cache — took 1291 s end to end
    # (build-code-server, 20:10:06Z -> 20:31:37Z), 72% of this deadline. Where it went, from
    # the BuildKit log: 690 s pulling the linuxserver base from lscr.io, 247 s building the
    # pip venv, 197 s fetching the Anthropic.claude-code VSIX from the MS marketplace, 45 s
    # for Pylance, ~30 s for the rest. The default 900 s would have killed it during the venv.
    #
    # Pinning every input (#2149) fixed WHAT a build fetches, not how fast the mirrors serve
    # it: the base pull alone is a third of this budget and is the term that varies. Lower
    # this only after a cold build measured under ~900 s. A build that hits the registry
    # layer cache re-runs only the steps below the first changed one and never approaches it.
    image_builder_timeout: 1800

- name: Create the code-server config volume claim
  ansible.builtin.include_role:
    name: k8s/volume-claim
  vars:
    volume_claim_service: code-server
    volume_claim_name: "{{ code_server_k8s_claim }}"
    volume_claim_storage_class: "{{ code_server_k8s_storage_class }}"
    volume_claim_size: "{{ code_server_k8s_size }}"

- name: Deploy code-server to the cluster
  ansible.builtin.include_role:
    name: k8s/manifests
  vars:
    manifests_service: code-server
    manifests_rollout: code-server
    manifests_files:
      # Before the Deployment: the workload's initContainer cannot start without this claim.
      - pvc-workspace.yaml
      - deployment.yaml
      - service.yaml
      - ingressroute.yaml
    manifests_secret_files:
      - secret.yaml
