---
code_server_k8s_image: "{{ k8s_registry_pull_host }}/code-server:{{ k8s_built_image_tags.get('code-server', 'latest') }}"

# Auto-deploy stance — read by gitops_deploy (see the k8s auto-deploy coverage design).
# `code_server_k8s_image` above names a content tag computed from the build inputs, with no
# upstream version scheme, so Renovate's k8s-defaults manager has nothing to bump. Since D5.16
# Flux applies this role, so the flag's live reader is Renovate's automerge denylist.
k8s_autodeploy: false  # noqa var-naming[no-role-prefix]
k8s_autodeploy_reason: "in-cluster-built registry image with no upstream version scheme — Renovate can never generate an update PR for it, so there is no bump event to auto-deploy regardless of the migrating-state PVC shape below"  # noqa var-naming[no-role-prefix]
# The claims snapshotted before each revision applies. Under Flux the renderer turns this list
# into the code-server-snapshot Kustomization, whose Job snapshots both claims before
# code-server applies (D5.2a). After a handback, k8s/manifests takes the same snapshot through
# k8s/volume-snapshot.
k8s_autodeploy_snapshot_pvcs: [code-server-config, code-server-workspace]  # noqa var-naming[no-role-prefix]

# 6.2 G — mostly extensions and npm/pip caches; the workspace itself is ~2 M.
code_server_k8s_claim: code-server-config
# Still class `longhorn`, because storageClassName is immutable on a bound claim — the volume
# is held OUT of the backup set by its containers_list entry's `no_backup_claims` instead. What
# is worth keeping lives in code_server_k8s_workspace_claim below; everything else here is
# derived (extensions, caches, language-server state) or regenerated by the image on boot.
code_server_k8s_storage_class: longhorn
code_server_k8s_size: 10Gi

# The backed-up half. Four paths, ~2.5 M total, mounted by subPath out of one small claim:
# workspace (real working copies), .ssh, .config, and the git identity. Everything else on the
# config volume is reproducible — the seven extensions are baked into the image as .vsix and
# reinstalled by /custom-cont-init.d/10-extensions.sh on every container start.
#
# Backing up the whole config volume made ONE service 52% of the 13.72 GiB backup set and 3,668
# of its 7,023 blocks, which at one Class-B GET per block put a code-server restore at 147% of
# B2's 2,500/day allowance: not restorable in a day. This claim is a plain one, not a seeded
# one: the initContainer in deployment.yaml.j2 migrates the four paths off the config volume on
# first boot. Nothing is deleted there — the config PVC keeps its copy, it simply stops being
# backed up.
code_server_k8s_workspace_claim: code-server-workspace
code_server_k8s_workspace_storage_class: longhorn
# 1 Gi, and the size is NOT free headroom. An empty ext4
# volume still costs its journal and inode table, and Longhorn backs those blocks up like any
# other. Measured on this cluster: n8n-files is an empty 1 Gi claim
# and its backups are 78 MiB; wg-easy-config, terraria-stats-data and valheim-stats-data all
# sit at 80-86 MiB on the same footing. mke2fs scales both structures with the device, so 5 Gi
# would have meant a 128 MiB journal plus an ~80 MiB inode table — ~200 MiB of filesystem
# metadata to protect ~2.5 M of files.
# 1 Gi is the floor worth paying. The `longhorn` StorageClass has allowVolumeExpansion, so a
# workspace that outgrows this expands in place; it does not need buying up front.
code_server_k8s_workspace_size: 1Gi
# Note: .npm and friends are root-owned (written by the image's root init), so they are not
# backed up with the workspace. The workspace claim holds only user-owned state that the image
# can write to without `sudo`.

# Mirrors resources('4.0', '4096M', '0.10', '256M') — a dev env that runs builds.
code_server_k8s_cpu_limit: "4"
code_server_k8s_mem_limit: 4096Mi
code_server_k8s_cpu_request: "100m"
code_server_k8s_mem_request: 256Mi

# ── Build inputs pinned by version AND sha256 ─────────────────────────────────────────────
# Renovate has no datasource for a VS Code extension (neither Open VSX nor the MS Marketplace),
# so these are the inputs the build cannot track automatically. Each is a version plus the
# sha256 of the exact artifact the Dockerfile downloads; the build verifies the checksum before
# it keeps the file, so a re-uploaded artifact fails the build instead of reaching the image.
#
# To bump one:
#   Open VSX  — read the version from https://open-vsx.org/api/<publisher>/<name>/linux-x64
#               (or without the platform segment for a `universal` extension such as ms-python),
#               and the hash from the `.sha256` link in its `files` block.
#   Marketplace — query https://marketplace.visualstudio.com/items?itemName=<publisher>.<name>
#               for the version, download the `vspackage` URL below with `curl -fsSL --compressed`
#               (the marketplace serves it gzip-encoded; the hash is over the decoded VSIX) and
#               `sha256sum` it.
#   Either way, `uv run python scripts/validate/asset_pins.py --refresh '<pin name>'` does the
#               hash step in one command once the version and URL are edited; the pin name is
#               `code_server_k8s_extensions[<publisher>.<name>]`. Anthropic.claude-code moves
#               with every Renovate bump of the `@anthropic-ai/claude-code` CLI (#4584).
# Then merge: the content tag moves, CI's `images` job pushes it to GHCR and `promote` rolls the
# pod, and extensions.sh installs the new VSIX.
# A base-image bump PR (the Renovate `k8s base image` group, manual for this role) is the natural
# moment to refresh these too.
#
# THE PLATFORM SEGMENT IS LOAD-BEARING. An API asked for "the" download of the current version
# of a platform-specific extension returns whichever build is listed first: Open VSX returns the
# alpine-arm64 build of ruff and ty, and the marketplace returns the win32-x64 build of Claude
# Code, none of which runs in this image's linux-x64 userland. `linux-x64` in the URL selects
# the right build.
code_server_k8s_extensions:
  # Open VSX — universal (one VSIX for every platform).
  - name: ms-python.python
    version: 2026.4.0
    url: https://open-vsx.org/api/ms-python/python/2026.4.0/file/ms-python.python-2026.4.0.vsix
    sha256: 232aeafb01f069824fdd92d3e628c1c442bbcfa1d3cc945ff97076340bb2b4a6
  # Open VSX — platform-specific; the URL names linux-x64.
  - name: charliermarsh.ruff
    version: 2026.82.0
    url: https://open-vsx.org/api/charliermarsh/ruff/linux-x64/2026.82.0/file/charliermarsh.ruff-2026.82.0@linux-x64.vsix
    sha256: b19f5dc0ab023472104039c744b17b53fb2adedb773040838e91303b87a69fa2
  - name: astral-sh.ty
    version: 2026.72.0
    url: https://open-vsx.org/api/astral-sh/ty/linux-x64/2026.72.0/file/astral-sh.ty-2026.72.0@linux-x64.vsix
    sha256: b2051aa6f40304960685c5b7e4895e40869cc0d96d23691ccfd45e28c6fc3f1c
  # Bundles its own rust-analyzer server; resolves `std` from the rust-src the Dockerfile installs.
  - name: rust-lang.rust-analyzer
    version: 0.4.3080
    url: https://open-vsx.org/api/rust-lang/rust-analyzer/linux-x64/0.4.3080/file/rust-lang.rust-analyzer-0.4.3080@linux-x64.vsix
    sha256: 07aa97e77b9668ee967ebab39a00adb1dde85127e501ca8da2648923eaab7bcd
  # Open VSX — universal. TOML language server for Cargo.toml and friends.
  - name: tamasfe.even-better-toml
    version: 0.21.2
    url: https://open-vsx.org/api/tamasfe/even-better-toml/0.21.2/file/tamasfe.even-better-toml-0.21.2.vsix
    sha256: f3dc44f1c551edef397a79f0f8c5db4066c6a547e210b5c3cec4400bf173b008
  # GitHub release, NOT Open VSX. Open VSX carries only CodeLLDB's universal VSIX, a bootstrap
  # that downloads the platform package (debug adapter plus lldb) from GitHub the first time it
  # activates: an unpinned fetch at runtime, into the config volume. The release's
  # codelldb-linux-x64.vsix is that platform package, complete. GitHub lists its sha256 as the
  # asset digest: `gh release view v<version> -R vadimcn/codelldb --json assets`. Being a GitHub
  # release, it is the one extension Renovate tracks (its own customManager in renovate.json).
  - name: vadimcn.vscode-lldb
    version: 1.12.3
    url: https://github.com/vadimcn/codelldb/releases/download/v1.12.3/codelldb-linux-x64.vsix
    sha256: 1cd7f386598022b51a5b93b9ffa23e812b23f519cfe1833384ec4bef4bfd1be1
  # MS Marketplace — proprietary, not published to Open VSX. Pylance is universal.
  - name: ms-python.vscode-pylance
    version: 2026.3.104
    url: https://marketplace.visualstudio.com/_apis/public/gallery/publishers/ms-python/vsextensions/vscode-pylance/2026.3.104/vspackage
    sha256: ab57bc16eb8ed62cfe373a8681bb9355b86f76b16000fcd2033cbd7e359f3e6c
  # Platform-specific; `?targetPlatform=linux-x64` selects the Linux build. Kept at the same
  # version as the `@anthropic-ai/claude-code` CLI the Dockerfile installs.
  - name: Anthropic.claude-code
    version: 2.1.289
    url: https://marketplace.visualstudio.com/_apis/public/gallery/publishers/Anthropic/vsextensions/claude-code/2.1.289/vspackage?targetPlatform=linux-x64
    sha256: 754586008e80b456cc4e8283014c62133b0fb297e46ba922b4c27dfa5d66a33d

# Node.js, installed from the official linux-x64 tarball rather than NodeSource's `setup_22.x`
# script piped to bash, which resolves whatever NodeSource serves on build day. The
# sha256 is the tarball's line in https://nodejs.org/dist/v<version>/SHASUMS256.txt. Renovate
# tracks the version through the `# renovate:` annotation below; the hash is the manual
# finish on its PR (`asset_pins.py --refresh node`), the same class as
# `initial_setup_uv_version`. The URL sits beside the digest so
# `scripts/validate/asset_pins.py` pairs the two and fetches it.
# renovate: datasource=node-version depName=node
code_server_k8s_node_version: "24.21.0"
code_server_k8s_node_url: "https://nodejs.org/dist/v{{ code_server_k8s_node_version }}/node-v{{ code_server_k8s_node_version }}-linux-x64.tar.xz"
code_server_k8s_node_sha256: fd8e59d5a511510f6a298afb548f18c7d2b1be404d8b4a27d94fbe49f56cb2d6

# Rust, installed from the official standalone installers rather than rustup (the Dockerfile's
# step 3 says why). Two tarballs render from the one version: the toolchain, and rust-src, which
# rust-analyzer needs to resolve `std`. Each sha256 is the content of the `.sha256` file
# published beside its tarball under https://static.rust-lang.org/dist/. Renovate tracks the
# version through the annotation below and files it in the `code-server build pins` group; the
# two digests are the manual finish on that PR, `asset_pins.py --refresh rust-lang/rust`.
# renovate: datasource=github-releases depName=rust-lang/rust
code_server_k8s_rust_version: "1.99.0"
code_server_k8s_rust_url: "https://static.rust-lang.org/dist/rust-{{ code_server_k8s_rust_version }}-x86_64-unknown-linux-gnu.tar.xz"
code_server_k8s_rust_sha256: 891c6366d7100feda0bca4c03ce63f3c9ac827cbebbc283e7433061d42c6a376
code_server_k8s_rust_src_url: "https://static.rust-lang.org/dist/rust-src-{{ code_server_k8s_rust_version }}.tar.xz"
code_server_k8s_rust_src_sha256: 3f1f9b7ed48f4596fc87889b7b3c61747336a55c9c22db1ab0c697e0aadb77aa

# The claims k8s/manifests renders and applies for this role, ahead of the pre-apply snapshot of
# both (k8s_autodeploy_snapshot_pvcs above).
k8s_claims:  # noqa var-naming[no-role-prefix]
  - name: "{{ code_server_k8s_claim }}"
    storage_class: "{{ code_server_k8s_storage_class }}"
    size: "{{ code_server_k8s_size }}"
  - name: "{{ code_server_k8s_workspace_claim }}"
    storage_class: "{{ code_server_k8s_workspace_storage_class }}"
    size: "{{ code_server_k8s_workspace_size }}"

# The budget of the code-server-prepull Kustomization, whose Job pulls this role's image onto
# its node before the code-server Kustomization applies (scripts/renderer/renderer_lib/prepull.py).
# The Deployment is `Recreate`, so without it the old pod stops before the new pod's pull
# starts, and the editor is down for the whole pull. With it, the old pod keeps serving while
# the image arrives. MEASURED 2026-10-17 (#5525): GHCR serves daniel-box at 0.21-0.33 MB/s; a
# claude-code CLI bump re-pulls about 377 MB (about 22 minutes) and a base bump about 851 MB
# (about 50 minutes). 4500s covers the full re-pull down to 0.19 MB/s, below the measured low:
# at 0.21 MB/s it takes about 4050s. The Job has no deadline, so a pull slower still costs
# that revision its verdict, the Job keeps pulling, and Flux applies code-server on a later
# retry. Only Flux reads it: the renderer adds the Kustomization for a published tag alone,
# so an Ansible deploy ignores it.
flux_prepull_timeout: 4500s  # noqa var-naming[no-role-prefix]
