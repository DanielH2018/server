---
code_server_k8s_image: "{{ k8s_registry_pull_host }}/code-server:latest"

# Auto-deploy stance — read by gitops_deploy (see the k8s auto-deploy coverage design).
# Denied (k8s_autodeploy: false below) because the shape is not safe: strategy is
# Recreate, and the config claim (code_server_k8s_claim) is seeded
# through k8s/seed-volume, which hardcodes ReadWriteOnce. The workspace claim below is NOT
# seeded the same way — pvc-workspace.yaml.j2 is a plain claim, and an initContainer migrates
# workspace/.ssh/.config/git-identity onto it from the config volume on first boot — but it
# declares ReadWriteOnce in its own template, so the migrating-state shape (Recreate + RWO PVC)
# holds regardless of which mechanism populated which claim. A failed image swap can still
# migrate either volume before the gate observes a fault, then fail the rollback redeploy
# against data it can no longer read.
k8s_autodeploy: false  # noqa var-naming[no-role-prefix]
k8s_autodeploy_reason: "migrating state — Recreate + two RWO PVCs (config seeded via k8s/seed-volume, workspace via its own initContainer migration). The replacement pod migrates the volumes before the rollout gate can observe a fault, so the rollback redeploys the prior image against data it can no longer read. Same class as sonarr/prowlarr; revisit in slice 7 behind the Longhorn pre-deploy snapshot"  # noqa var-naming[no-role-prefix]

# 6.2 G at the port — mostly extensions and npm/pip caches; the workspace itself is ~2 M.
code_server_k8s_claim: code-server-config
# Still class `longhorn`, because storageClassName is immutable on a bound claim — the volume
# is held OUT of the backup set by `k3s_longhorn_nobackup_volumes` instead (2026-08-16). What
# is worth keeping moved to code_server_k8s_workspace_claim below; everything left here is
# derived (extensions, caches, language-server state) or regenerated by the image on boot.
code_server_k8s_storage_class: longhorn
code_server_k8s_size: 10Gi

# The backed-up half. Four paths, ~2.5 M total, mounted by subPath out of one small claim:
# workspace (real working copies), .ssh, .config, and the git identity. Everything else on the
# config volume is reproducible — the seven extensions are baked into the image as .vsix and
# reinstalled by /custom-cont-init.d/10-extensions.sh on every container start.
code_server_k8s_workspace_claim: code-server-workspace
code_server_k8s_workspace_storage_class: longhorn
# 1 Gi, and the size is NOT free headroom — this was 5 Gi and that was wrong. An empty ext4
# volume still costs its journal and inode table, and Longhorn backs those blocks up like any
# other. Measured on this cluster: n8n-files is a 1 Gi claim that has been empty since Oct 2025
# and its backups are 78 MiB; wg-easy-config, terraria-stats-data and valheim-stats-data all
# sit at 80-86 MiB on the same footing. mke2fs scales both structures with the device, so 5 Gi
# would have meant a 128 MiB journal plus an ~80 MiB inode table — ~200 MiB of filesystem
# metadata to protect ~2.5 M of files.
# 1 Gi is the floor worth paying. The `longhorn` StorageClass has allowVolumeExpansion, so a
# workspace that outgrows this expands in place; it does not need buying up front.
code_server_k8s_workspace_size: 1Gi
# Overridden at the cutover seed: .npm and friends are root-owned (written by the image's
# root init), so the unprivileged ssh|tar pipeline can't read them in place — a one-shot
# play stages a sudo copy into an ubuntu-owned dir first (the wg-easy pattern).
code_server_k8s_source_path: /home/ubuntu/server/containers/code-server/config

# Mirrors resources('4.0', '4096M', '0.10', '256M') — a dev env that runs builds.
code_server_k8s_cpu_limit: "4"
code_server_k8s_mem_limit: 4096Mi
code_server_k8s_cpu_request: "100m"
code_server_k8s_mem_request: 256Mi
