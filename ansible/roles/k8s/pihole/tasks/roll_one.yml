---
# One instance: restart, then block until it is serving again. Included per instance so the
# next Pi-hole is never taken down while this one is still coming back.
#
# Skipped entirely when the shared apply just created the Deployment (mirrors the guard in
# roles/k8s/manifests/tasks/main.yml): its pod has not appeared yet, so a `rollout restart` here
# races the initial rollout instead of following it. That apply only ever creates instance 1, so
# for pihole-2 the block runs and apply_instance_2.yml carries the `created` guard
# instead — it has to, because it is the task that would do the creating.
- name: Roll instance if this run did not just create it {{ pihole_instance }}
  tags: [deploy]
  # `| default('')` — see the same guard in k8s/observability for why an unreadable register
  # must mean "restart" rather than raise.
  when: not ((manifests_apply.stdout | default('')) is search('deployment.apps/' ~ pihole_instance ~ ' created'))
  block:
    - name: Determine the sibling of {{ pihole_instance }}
      ansible.builtin.set_fact:
        pihole_sibling_instance: "{{ 'pihole-2' if pihole_instance == 'pihole' else 'pihole' }}"

    # Restarting {{ pihole_instance }} with no ready sibling is a LAN-wide DNS outage: both
    # Deployments use Recreate (RWO Longhorn volume), so there is a gap with zero ready pods
    # behind pihole-dns. Fail loudly rather than proceed — the alternative is a household DNS
    # outage that this play would report as a success.
    # A freshly-created sibling Deployment is still provisioning a Longhorn PVC when the
    # first-ever deploy reaches this task and has no pod at all yet — `--for=create` makes the
    # unmatched selector wait for one instead of failing on the spot, and the 300s budget
    # matches the rollout status below. Timing out is still a loud failure, as it must be:
    # proceeding would knowingly cause a household DNS outage.
    - name: Verify the sibling instance is ready before restarting {{ pihole_instance }}
      ansible.builtin.command:
        cmd: >-
          k3s kubectl -n {{ k8s_namespace }} wait pod -l instance={{ pihole_sibling_instance }}
          --field-selector=status.phase=Running
          --for=create --for=condition=Ready --timeout=300s
      become: true
      changed_when: false

    # The wait above cannot tell a serving sibling from a terminating one. A pod that has begun
    # terminating keeps phase `Running` and condition `Ready` for its whole grace period, so the
    # check can pass against a sibling pod that is already going away, and the play would restart
    # this instance into a LAN-wide DNS outage it reports as failed=0.
    #
    # Both Deployments are `replicas: 1` with `Recreate`, so the sibling legitimately has exactly
    # one pod here and none of it terminating. Any `deletionTimestamp` at all is therefore the
    # condition to refuse: the jsonpath prints one per pod that carries the field and nothing for
    # a pod that does not, so an empty read is the only passing answer. failed_when rather than a
    # retry loop — this is the last moment before the restart, and a sibling mid-termination means
    # the play's own model of what is serving is wrong.
    - name: Refuse the restart while the sibling is terminating {{ pihole_instance }}
      ansible.builtin.command:
        cmd: >-
          k3s kubectl -n {{ k8s_namespace }} get pod -l instance={{ pihole_sibling_instance }}
          -o jsonpath={.items[*].metadata.deletionTimestamp}
      become: true
      changed_when: false
      register: pihole_sibling_terminating
      failed_when: (pihole_sibling_terminating.stdout | default('') | trim) != ''

    # Instance 2's Deployment is applied HERE, not by the shared role, and this is what makes an
    # image-pin bump reach the two instances one at a time. It runs after the checks
    # above, so instance 1 is serving before instance 2's pod template is allowed to change.
    - name: Apply the second Pi-hole instance's Deployment
      ansible.builtin.include_tasks: apply_instance_2.yml
      when: pihole_instance == 'pihole-2'

    # Skipped when an apply already rolled this instance -- its pod template changed, which an
    # image-pin bump does -- and only the restart is skipped: the checks above and the rollout
    # wait below still run, so the play follows that roll instead of adding a second one.
    #
    # Which apply depends on the instance. The shared apply carries instance 1
    # alone (`manifests_rolled_by_apply`), and instance 2 is rolled by apply_instance_2.yml above
    # (whose verdict arrives as `pihole_k8s_rolled_by_own_apply`, keyed by instance name the
    # same way, so the gate below reads one shape for both) after instance 1 is serving again.
    #
    # A second roll here would delete the pod the apply had just created
    # while the kubelet is mid-pull, and on these Recreate Deployments the wait below would sit
    # out the whole pull before the next ReplicaSet could appear. `manifests_rolled_by_apply` is the shared role's fingerprint verdict, keyed
    # by workload name; a name it never fingerprinted (an image-only trigger, where the
    # template is unchanged) reads false and restarts, as it must.
    - name: Restart Pi-hole instance {{ pihole_instance }}
      ansible.builtin.command:
        cmd: "k3s kubectl -n {{ k8s_namespace }} rollout restart deploy/{{ pihole_instance }}"
      become: true
      changed_when: true
      # Read by the record amend below: `is changed` is false both when the gate skipped this
      # task and when it never ran at all, which is exactly "no restartedAt was stamped".
      register: pihole_k8s_restarted
      when:
        # The trigger, per instance. The include in main.yml also fires
        # on rendered bytes alone for pihole-2, because it has to run apply_instance_2.yml to
        # learn whether that apply changed anything, so the restart re-checks the verdicts here.
        # Each config trigger is the render AND the matching apply's own `changed`: the shared
        # apply for the shared files (both instances read the ConfigMap), pihole-2's own apply
        # for deployment-2.yaml. A YAML comment edit moves the bytes and leaves both applies
        # `unchanged`. The secret trigger stays on the secret render, as in the shared role.
        # `pihole_instance == 'pihole-2'` first, so the `pihole` iteration never reads a register
        # that only the pihole-2 iteration creates.
        - (manifests_render is changed and manifests_apply is changed)
          or manifests_secret_render is changed or manifests_image_changed
          or (pihole_instance == 'pihole-2'
              and (pihole_k8s_instance_2_apply | default({})) is changed
              and (manifests_deferred_render | default({})) is changed)
        # Two facts, one per apply, both keyed by instance name so neither can suppress the
        # other instance's restart whatever order the loop runs in.
        - not (manifests_rolled_by_apply.get(pihole_instance, false)
               or pihole_k8s_rolled_by_own_apply.get(pihole_instance, false))

    - name: Wait for serving Pi-hole instance {{ pihole_instance }}
      ansible.builtin.command:
        cmd: >-
          k3s kubectl -n {{ k8s_namespace }} rollout status deploy/{{ pihole_instance }}
          --timeout=300s
      become: true
      changed_when: false

    # pihole-2 only, and only after the wait above proved the roll finished. The release
    # record was written before this file ran, and for pihole-2 it could not decide `restart` at
    # all — `rolled_by_role: true` in tasks/main.yml has the derivation. This is the moment the
    # answer exists: the restart above either ran, stamping a `restartedAt` newer than the
    # record's `applied_at`, or the apply in apply_instance_2.yml rolled pihole-2 by changing its
    # pod template and stamped nothing. Only the first is an expectation `probe.py health` can
    # satisfy, so only the first raises it.
    #
    # Instance 1 needs none of this: the shared apply carries its manifest, so release_stamp.yml
    # already decided its `restart` from the same facts the gate above reads.
    - name: Record that pihole-2's own roll was a restart
      ansible.builtin.include_role:
        name: k8s/manifests
        tasks_from: rollout_amend.yml
      vars:
        manifests_amend_service: pihole
        manifests_amend_workload: pihole-2
        manifests_amend_restart: "{{ pihole_k8s_restarted is changed }}"
      when: pihole_instance == 'pihole-2'
