---
# Flux applies pihole through `promote` (`owner: flux`), and no Flux path runs this file. It stays
# until R4 deletes it. The tasks it held before the flip moved:
# - `roll_one.yml` and `apply_instance_2.yml`: the one-at-a-time roll is Kustomization order
#   (`pihole-deferred` depends on `pihole` with `wait: true`), and the sibling check is
#   `templates/precheck/guard.yaml.j2`, which `pihole` waits on;
# - the gravity reconcile and rebuild: `templates/verify/gravity.yaml.j2`;
# - the ready-endpoint check: `wait: true` on `pihole` and `pihole-deferred`, with no successor;
# - the pinned-address assert: observability's `PiholeLanAddressNotPinned` rule, which carries
#   verify="true", so the soak fails a revision that changes pihole while it fires.
# The claims are `k8s_claims` in defaults/main.yml.
- name: Deploy pihole to the cluster
  ansible.builtin.include_role:
    name: k8s/manifests
