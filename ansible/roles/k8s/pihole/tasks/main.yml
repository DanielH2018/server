---
# The claims are `k8s_claims` in defaults/main.yml; k8s/manifests renders and applies them.
- name: Deploy pihole to the cluster
  ansible.builtin.include_role:
    name: k8s/manifests
  vars:
    # Restarting is done explicitly below, in sequence. The shared role fires its restarts
    # back to back and defers every wait to the end-of-batch drain, which would take both
    # Pi-holes down at once — exactly the outage the second instance exists to prevent.
    manifests_rollout: ''
    # Both instances, declared to the release record so `probe.py health` expects each to roll
    # after a changed render — but they reach it by different routes, because instance 2 has
    # its own staging directory and its own later apply (tasks/apply_instance_2.yml).
    # `image: pihole` on both:
    # roll_one.yml also fires on manifests_image_changed, which keys on the SERVICE name. The
    # shared role also fingerprints this entry's pod template across the apply, so roll_one.yml
    # can skip restarting the instance the apply already rolled.
    #
    # pihole-2 carries `rolled_by_role: true`: this include writes the release record
    # BEFORE apply_instance_2.yml runs, so it cannot decide instance 2's `restart`. Its verdict
    # would read true (the render changed; this apply did not roll it), and the sequenced apply
    # then rolls pihole-2 by changing its pod template, which stamps no `restartedAt` —
    # `probe.py health` would fail a roll that actually happened, on every image bump. The
    # marker makes the record stamp `restart: false` and hands the decision to roll_one.yml,
    # which raises it through the shared rollout_amend.yml once it knows whether it issued a
    # `rollout restart`. Deploy-time cover is unchanged and stricter either way: roll_one.yml
    # blocks on pihole-2's `rollout status`, and the ready-endpoint assertion at the end of this
    # file refuses fewer than two.
    manifests_self_rollouts:
      - { name: pihole, kind: deploy, image: pihole }
      - { name: pihole-2, kind: deploy, image: pihole, rolled_by_role: true }
    # The Deployment macro both instances' templates import. It renders no document of its own.
    manifests_exclude_files: [pihole-deployment.yaml]
    # Instance 2's Deployment: rendered, pruned and DIGESTED by the shared role, applied by this
    # one. Staged in its own directory, so neither the shared prune nor the shared
    # `kubectl apply -f <dir>/` touches it, and the shared role publishes the path as
    # `manifests_deferred_dir` and the render as `manifests_deferred_render`. Rendering it here
    # instead would leave its bytes outside `manifests_digest`, so a change to `deployment-2.yaml.j2`
    # moved no digest and `probe.py releases --stale-only` could neither clear pihole's path hit
    # by a match nor catch it by a mismatch — for half the workload.
    manifests_deferred_files:
      - deployment-2.yaml
    manifests_deferred_dir_name: pihole-instance-2
    # The default prune (#3388): the armed render stamps `homelab/role: pihole` on the four
    # files and the Secret above, and on both claims. Instance 2's Deployment stays out of reach: the deferred
    # render does not go through the labelling wrapper, so pihole-2 carries no `homelab/role`
    # label and `-l homelab/role=pihole` cannot select it.

# Instance 2's Deployment is applied SEPARATELY, from its own directory, and the apply above
# therefore carries instance 1 alone.
#
# `kubectl apply -f <dir>/` applies every file in a directory in one request, so two Deployments
# in one file change both pod templates on an image-pin bump, and the controller Recreate-cycles
# both instances in the same second, before the loop below ever runs. Both new pods then pull
# their image through the resolver they just replaced and fail with `lookup registry-1.docker.io:
# Try again`, while the play reports failed=0. Sequencing the restarts cannot help, because the
# restarts are not what rolls them.
#
# A separate directory rather than a second file in the shared one: the shared role's prune owns
# every file in /etc/rancher/k3s/manifests/pihole/ and its apply sweeps the whole directory, so a
# second Deployment file there would still be applied in the same request. `pihole-instance-2` is
# a sibling name no role's `manifests_service` claims — the same reservation `<service>-netpol`
# and `<service>-claims` use, derived rather than listed by
# ansible/tests/k8s/test_no_role_stages_files_in_a_pruned_manifest_dir.py.
#
# The RENDER of that directory is the shared role's, through `manifests_deferred_files`, so
# instance 2's bytes are inside `manifests_digest` and a dry run's render. The apply stays here, because the ordering of the apply is
# the whole point. What a dry run still does not cover is that apply: `kubectl apply -f <dir>/`
# is not recursive, so the dry-run render's subdirectory is never shown to the API server, and a
# dry run must not write the node outside roles/k8s/manifests (enforced by
# ansible/tests/deploy/test_k8s_dry_run_host_writes.py). What makes that residual gap small is
# the macro: both Deployments render from one body in templates/pihole-deployment.yaml.j2 and
# differ only in the workload name and the claim name, so instance 1's dry run exercises the
# schema instance 2 renders. `scripts/validate/k8s_manifests.py` renders and parses this template
# in CI either way.

# Always defined, so the restart gate in roll_one.yml can read it without a `| default`, and
# reset here rather than carried, so a previous run's answer never decides this one. The shared
# role resets its own `manifests_rolled_by_apply` for the same reason.
- name: Reset which instances their own apply rolled
  tags: [deploy]
  ansible.builtin.set_fact:
    pihole_k8s_rolled_by_own_apply: {}

- name: Roll the Pi-hole instances one at a time
  tags: [deploy]
  ansible.builtin.include_tasks: roll_one.yml
  # Only when this role actually changed something — otherwise a full-fleet deploy
  # Recreate-cycles both Pi-holes (and their Longhorn volumes) every run for nothing, up to
  # 2x180s, and never reports idempotent. Same facts the shared role itself gates its own
  # restart on (roles/k8s/manifests/tasks/main.yml, the `config`/`secret`/`image` triggers);
  # registered inside the include_role above, they stay in scope here because `register` sets
  # a play-scoped fact, not one local to the included role. The fact the shared role also gates
  # on, `manifests_rolled_by_apply`, is read inside roll_one.yml on the restart task alone: the
  # include still runs so the sibling check and the rollout wait follow a roll the apply started.
  #
  # The `config` trigger is the render AND the shared apply's own verdict:
  # `manifests_render is changed` compares rendered bytes, so a YAML comment edit moves it
  # while `kubectl apply` prints every object `unchanged`, and the LAN resolvers would roll for
  # nothing. The secret trigger stays on the secret render, as in the shared role.
  #
  # Never on a dry run or --check: a dry-run render is always `changed` and the apply rolled
  # nothing, so this would restart both live Pi-holes on every dry run.
  #
  # `manifests_deferred_render` is the other trigger: instance 2's Deployment is rendered into
  # its own directory and is not part of `manifests_render`, so a change to deployment-2.yaml.j2
  # alone moves none of the facts above and without this the apply that carries it would
  # never run. It fires the `pihole-2` iteration only: `when` on a looped include is evaluated
  # per item, and instance 1's manifests did not move, so rolling it would cost one needless
  # Recreate cycle of a live resolver plus a Longhorn detach/attach. Skipping the
  # `pihole` iteration skips nothing else — apply_instance_2.yml is included from `pihole-2`'s.
  # This clause is bytes only, because the apply it must let run has not happened yet; the
  # restart that follows it is gated on that apply's own verdict inside roll_one.yml.
  when:
    - not k8s_no_mutate
    - (manifests_render is changed and manifests_apply is changed)
      or manifests_secret_render is changed or manifests_image_changed
      or ((manifests_deferred_render | default({})) is changed and pihole_instance == 'pihole-2')
  loop:
    - pihole
    - pihole-2
  loop_control:
    loop_var: pihole_instance

# `kubectl exec deploy/<name>` resolves a pod through the Deployment's spec.selector, which
# is `app: pihole` on BOTH Deployments (spec.selector is immutable, so it can't carry the
# per-instance label). Both loop iterations below would therefore land on whichever pod that
# shared selector picks — never guaranteed to be the one named by `item`. Resolve the actual
# pod by the pod-only `instance` label first and exec that pod name explicitly.
#
# An instance caught mid-start (pod still Pending, crashlooping, or the Deployment just
# created — roll_one.yml skips its rollout wait on that run) has no Running pod yet, so wait
# for one to exist AND turn Ready before reading its name: `--for=create` is what makes an
# unmatched selector wait rather than fail on the spot with "no matching resources found".
# Two `--for` flags print the name once per condition under `-o`, so the read is separate.
- name: Wait for a Ready pod behind each Pi-hole instance
  when: not k8s_no_mutate
  tags: [deploy]
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n {{ k8s_namespace }} wait pod -l instance={{ item }}
      --field-selector=status.phase=Running
      --for=create --for=condition=Ready --timeout=300s
  become: true
  changed_when: false
  loop:
    - pihole
    - pihole-2

# No `[0]` index in the jsonpath: `.items[0]...` on zero matches makes kubectl error with
# "array index out of bounds" rather than an empty string, and the wait above already proved a
# match exists. failed_when keeps the loud failure if the read still comes back empty.
- name: Find the pod backing each Pi-hole instance
  when: not k8s_no_mutate
  tags: [deploy]
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n {{ k8s_namespace }} get pod -l instance={{ item }}
      --field-selector=status.phase=Running
      -o jsonpath={.items[*].metadata.name}
  become: true
  register: pihole_pods
  changed_when: false
  failed_when: pihole_pods.stdout | trim == ''
  loop:
    - pihole
    - pihole-2

- name: Map each Pi-hole instance name to its pod name
  when: not k8s_no_mutate
  tags: [deploy]
  ansible.builtin.set_fact:
    pihole_pod_by_instance: "{{ dict(pihole_pods.results | map(attribute='item') | zip(pihole_pods.results | map(attribute='stdout') | map('regex_replace', '\\s.*$', ''))) }}"

# Blocklist state is DECLARED (defaults/main.yml), not seeded — see the defaults for why a
# coexistence volume seed can never verify. SQL travels over exec stdin; total_changes() on
# the last line makes changed_when honest. Runs after the rollout wait, so FTL has already
# initialised the gravity.db schema on a first boot. INSERTs rely on the gravity schema's
# AFTER INSERT triggers to attach new rows to the default group.
# The name deliberately omits `{{ item }}`: Ansible renders a looped task's name once, before
# the loop binds `item`, so interpolating it emits a "'item' is undefined" template warning on
# every deploy and prints the error text in place of the instance name. Ansible already appends
# `=> (item=pihole)` per iteration, which is the per-instance label this was reaching for.
- name: Reconcile the declared adlists and regex denies into gravity.db
  when: not k8s_no_mutate
  tags: [deploy]
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n {{ k8s_namespace }} exec -i {{ pihole_pod_by_instance[item] }} -c pihole --
      pihole-FTL sqlite3 /etc/pihole/gravity.db
    stdin: |
      {% for a in pihole_k8s_adlists %}
      INSERT INTO adlist (address, enabled, comment)
        SELECT '{{ a.address }}', {{ a.enabled }}, 'ansible-declared'
        WHERE NOT EXISTS (SELECT 1 FROM adlist WHERE address = '{{ a.address }}');
      UPDATE adlist SET enabled = {{ a.enabled }}
        WHERE address = '{{ a.address }}' AND enabled != {{ a.enabled }};
      {% endfor %}
      {% for r in pihole_k8s_regex_deny %}
      INSERT INTO domainlist (type, domain, enabled, comment)
        SELECT 3, '{{ r }}', 1, 'ansible-declared'
        WHERE NOT EXISTS (SELECT 1 FROM domainlist WHERE type = 3 AND domain = '{{ r }}');
      {% endfor %}
      SELECT total_changes();
  register: pihole_k8s_gravity_sql
  become: true
  # changed_when is evaluated per loop iteration against that iteration's own result, so
  # this expression judges each instance on its own stdout, not the accumulated .results list. Verified against a local no-op
  # playbook: a registered loop task's changed_when sees the current iteration's fields
  # under the registered var's own name, exactly as it would outside a loop.
  changed_when: (pihole_k8s_gravity_sql.stdout_lines | last | default('0') | int) > 0
  loop:
    - pihole
    - pihole-2

# Only when the declaration actually changed something — gravity downloads big.oisd
# (~200k domains) and rebuilds the blocklist table, ~1-2 min. `is changed` on a registered
# loop result is true if ANY iteration changed (verified the same way as above), which is
# the behaviour wanted here: either instance's declaration changing should rebuild both, so
# they stay equivalent.
# Name omits `{{ item }}` for the same reason as the reconcile task above.
- name: Rebuild gravity after a blocklist change # noqa no-handler
  tags: [deploy]
  when:
    - not k8s_no_mutate
    - pihole_k8s_gravity_sql is changed
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n {{ k8s_namespace }} exec {{ pihole_pod_by_instance[item] }} -c pihole -- pihole -g
  become: true
  changed_when: true
  loop:
    - pihole
    - pihole-2

# Both instances have rolled by this point (or the play already failed loudly in roll_one.yml
# if a restart would have taken DNS down). This confirms they came up and both have a ready
# endpoint — it is not the stabilisation soak the shared drain gives most workloads.
# k8s_pending_rollouts is deliberately NOT used here: the drain snapshots restart counts with
# `-l app={{ item.name }}`, which matches both Pi-hole instances identically, so it could
# never tell which one actually restarted. That soak is knowingly given up for pihole.
- name: Verify both Pi-hole instances have a ready DNS endpoint
  tags: [deploy]
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n {{ k8s_namespace }} get endpointslice -l kubernetes.io/service-name=pihole-dns
      -o jsonpath={.items[*].endpoints[?(@.conditions.ready==true)].targetRef.name}
  become: true
  register: pihole_dns_ready_endpoints
  changed_when: false
  when: manifests_render is changed or manifests_secret_render is changed or manifests_image_changed
  failed_when: (pihole_dns_ready_endpoints.stdout.split() | length) < 2

# `wait` returns the moment MetalLB writes the address, and `-o jsonpath` prints that field
# once the condition holds — one watch instead of a 12x5s sampling loop.
- name: Read the pihole-dns LoadBalancer address
  tags: [deploy]
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n {{ k8s_namespace }} wait svc/pihole-dns
      --for=jsonpath={.status.loadBalancer.ingress[0].ip} --timeout=60s
      -o jsonpath={.status.loadBalancer.ingress[0].ip}
  register: pihole_k8s_lb_ip
  become: true
  changed_when: false
  # Only reads, so let it run under --check too — otherwise stdout is empty and the assertion
  # below dies with it.
  check_mode: false

# MetalLB reads a request annotation rather than a spec field, and it ignores annotation keys
# it does not recognise — so a wrong prefix is silent: the Service comes up on an
# auto-assigned address with every pod healthy and the deploy green. CoreDNS forwards here by
# address (k3s_coredns_upstreams) and LAN clients get it by DHCP, so assert what landed.
- name: Fail if pihole-dns did not get its pinned LAN address
  tags: [deploy]
  ansible.builtin.assert:
    that: pihole_k8s_lb_ip.stdout == pihole_k8s_lan_ip
    fail_msg: >-
      pihole-dns holds {{ pihole_k8s_lb_ip.stdout }}, not the pinned
      {{ pihole_k8s_lan_ip }}. MetalLB does not re-evaluate an existing allocation when
      pools or annotations change — delete the Service and redeploy to force reallocation.
    success_msg: "pihole-dns holds its pinned address {{ pihole_k8s_lan_ip }}"
