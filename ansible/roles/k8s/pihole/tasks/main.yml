---
# Slice 6, B3 (build half). Standing this up unattended is safe by design (D4): the DNS VIP
# serves nobody until the router's DHCP DNS option flips at cutover. (The web UI carried a
# `-k8s` suffix while a Docker copy held pihole.<domain>; both retired 2026-08-14/15.)

- name: Deploy pihole to the cluster
  ansible.builtin.include_role:
    name: k8s/manifests
  vars:
    manifests_service: pihole
    # Restarting is done explicitly below, in sequence. The shared role fires its restarts
    # back to back and defers every wait to the end-of-batch drain, which would take both
    # Pi-holes down at once — exactly the outage the second instance exists to prevent.
    manifests_rollout: ''
    manifests_files:
      - pvc.yaml
      - configmap.yaml
      - deployment.yaml
      - service.yaml
      - ingressroute.yaml
    manifests_secret_files:
      - secret.yaml

- name: Roll the Pi-hole instances one at a time
  tags: [deploy]
  ansible.builtin.include_tasks: roll_one.yml
  loop:
    - pihole
    - pihole-2
  loop_control:
    loop_var: pihole_instance

# Blocklist state is DECLARED (defaults/main.yml), not seeded — see the defaults for why a
# coexistence volume seed can never verify. SQL travels over exec stdin; total_changes() on
# the last line makes changed_when honest. Runs after the rollout wait, so FTL has already
# initialised the gravity.db schema on a first boot. INSERTs rely on the gravity schema's
# AFTER INSERT triggers to attach new rows to the default group.
- name: Reconcile the declared adlists and regex denies into gravity.db on {{ item }}
  tags: [deploy]
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n {{ k8s_namespace }} exec -i deploy/{{ item }} -c pihole --
      pihole-FTL sqlite3 /etc/pihole/gravity.db
    stdin: |
      {% for a in pihole_k8s_adlists %}
      INSERT INTO adlist (address, enabled, comment)
        SELECT '{{ a.address }}', {{ a.enabled }}, 'ansible-declared'
        WHERE NOT EXISTS (SELECT 1 FROM adlist WHERE address = '{{ a.address }}');
      UPDATE adlist SET enabled = {{ a.enabled }}
        WHERE address = '{{ a.address }}' AND enabled != {{ a.enabled }};
      {% endfor %}
      {% for r in pihole_k8s_regex_deny %}
      INSERT INTO domainlist (type, domain, enabled, comment)
        SELECT 3, '{{ r }}', 1, 'ansible-declared'
        WHERE NOT EXISTS (SELECT 1 FROM domainlist WHERE type = 3 AND domain = '{{ r }}');
      {% endfor %}
      SELECT total_changes();
  register: pihole_k8s_gravity_sql
  become: true
  # changed_when is evaluated per loop iteration against that iteration's own result, so
  # this expression (unchanged from the single-instance version) judges each instance on
  # its own stdout, not the accumulated .results list. Verified against a local no-op
  # playbook: a registered loop task's changed_when sees the current iteration's fields
  # under the registered var's own name, exactly as it would outside a loop.
  changed_when: (pihole_k8s_gravity_sql.stdout_lines | last | default('0') | int) > 0
  loop:
    - pihole
    - pihole-2

# Only when the declaration actually changed something — gravity downloads big.oisd
# (~200k domains) and rebuilds the blocklist table, ~1-2 min. `is changed` on a registered
# loop result is true if ANY iteration changed (verified the same way as above), which is
# the behaviour wanted here: either instance's declaration changing should rebuild both, so
# they stay equivalent.
- name: Rebuild gravity after a blocklist change on {{ item }} # noqa no-handler
  tags: [deploy]
  when: pihole_k8s_gravity_sql is changed
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n {{ k8s_namespace }} exec deploy/{{ item }} -c pihole -- pihole -g
  become: true
  changed_when: true
  loop:
    - pihole
    - pihole-2
