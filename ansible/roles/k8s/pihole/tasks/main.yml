---
# Flux applies pihole through `promote` (`owner: flux`), and no Flux path runs this file. It
# stays for the handback (docs/flux-deploy-plane.md). The tasks it held before the flip moved:
# - `roll_one.yml` and `apply_instance_2.yml`: the one-at-a-time roll is Kustomization order
#   (`pihole-deferred` depends on `pihole` with `wait: true`), and the sibling check is
#   `templates/precheck/guard.yaml.j2`, which `pihole` waits on;
# - the gravity reconcile and rebuild: `templates/verify/gravity.yaml.j2`;
# - the ready-endpoint check: `wait: true` on `pihole` and `pihole-deferred`, with no successor;
# - the pinned-address assert: observability's `PiholeLanAddressNotPinned` rule, which carries
#   verify="true", so the soak fails a revision that changes pihole while it fires.
# The claims are `k8s_claims` in defaults/main.yml.
- name: Deploy pihole to the cluster
  ansible.builtin.include_role:
    name: k8s/manifests
  vars:
    # Both Pi-holes are restart targets, so the renderer stamps `checksum/restart` on each
    # (scripts/renderer/renderer_lib/restart.py). Flux rolls instance 1 in `pihole` and instance 2
    # in `pihole-deferred`, after instance 1 is Ready. No Flux path runs a restart task, and a
    # handback restores `roll_one.yml` from the commit before the flip.
    manifests_rollout: ''
    manifests_self_rollouts:
      - { name: pihole, kind: deploy }
      - { name: pihole-2, kind: deploy }
    # The Deployment macro both instances' templates import. It renders no document of its own.
    manifests_exclude_files: [pihole-deployment.yaml]
    # Instance 2's Deployment renders into `pihole-deferred`, which waits on `pihole`.
    manifests_deferred_files:
      - deployment-2.yaml
    manifests_deferred_dir_name: pihole-instance-2
