---
# Renovate-managed pin.
pihole_k8s_image: pihole/pihole:2026.09.0
# Pinned (Renovate k8s-defaults manager). v-prefixed tags track upstream unbound releases.
pihole_k8s_unbound_image: klutchell/unbound:1.26.1

# Auto-deploy stance — read by gitops_deploy (see the k8s auto-deploy coverage design).
# Platform: the LAN's DNS resolver. A failed deploy breaks name resolution fleet-wide, and
# etp-local-vips-blackout-on-node-join shows host probes stay green straight through that kind
# of outage — DNS-dependent tooling (including the ability to reach a fix) goes dark first.
# Also Recreate + PVC (the gravity/FTL databases) on its own state, which compounds the risk
# but isn't the primary reason.
k8s_autodeploy: false  # noqa var-naming[no-role-prefix]
k8s_autodeploy_reason: "platform — LAN DNS resolver; a failed deploy breaks name resolution fleet-wide, and host probes stay green through that kind of outage"  # noqa var-naming[no-role-prefix]

pihole_k8s_claim: pihole-etc
# Second instance, for deploy-time DNS continuity. Its own claim because /etc/pihole is RWO
# and single-writer; the contents are fully derivable (see the note on pihole_k8s_claim), so
# two independent copies reconciled from the same declaration stay equivalent without sharing
# a volume.
pihole_k8s_claim_2: pihole-etc-2
# nobackup: every byte of /etc/pihole is derivable — gravity.db from the declared adlists
# below, pihole.toml from the FTLCONF env, dnsmasq.d from the shared template. pihole-FTL.db
# is query history: stats, not state.
pihole_k8s_storage_class: longhorn-nobackup
pihole_k8s_size: 2Gi

# Both instances' claims, which k8s/manifests renders and applies for this role (#3387).
k8s_claims:  # noqa var-naming[no-role-prefix]
  - name: "{{ pihole_k8s_claim }}"
    storage_class: "{{ pihole_k8s_storage_class }}"
    size: "{{ pihole_k8s_size }}"
  - name: "{{ pihole_k8s_claim_2 }}"
    storage_class: "{{ pihole_k8s_storage_class }}"
    size: "{{ pihole_k8s_size }}"

# Unbound listens here inside the pod — FTL owns :53 in the shared network namespace.
# Consumed by the ConfigMap (unbound server config), the probes, and FTL's upstream env.
pihole_k8s_unbound_port: 5335

# The pinned DNS VIP handed to the LAN; global (group_vars) because daniel-server's wg-easy
# and resolv.conf point at it too.
pihole_k8s_lan_ip: "{{ dns_k8s_vip }}"

# Pinned so CoreDNS can name it. Cluster DNS forwards to this address rather than to the LAN
# VIP (see k3s_coredns_upstreams): kube-proxy reaches either Pi-hole pod through it, where
# the VIP is subject to externalTrafficPolicy: Local. An unpinned clusterIP would be
# reassigned if the Service were ever recreated, silently pointing cluster DNS at nothing.
# Immutable once bound — changing it needs the Service deleted and recreated.
pihole_k8s_dns_cluster_ip: "{{ dns_k8s_cluster_ip }}"

# Blast-radius caps. k8s-native units on purpose: "1.0"/"0.50" normalize server-side
# ("1"/"500m") and make every `kubectl apply` report the Deployment "configured".
pihole_k8s_cpu_limit: "1"
pihole_k8s_mem_limit: 512Mi
pihole_k8s_cpu_request: 100m
pihole_k8s_mem_request: 64Mi
pihole_k8s_unbound_cpu_limit: 500m
pihole_k8s_unbound_mem_limit: 256Mi
pihole_k8s_unbound_cpu_request: 50m
pihole_k8s_unbound_mem_request: 32Mi

# Desired blocklist state, reconciled into gravity.db by tasks/main.yml (idempotent
# INSERT/UPDATE, then a gravity rebuild only when something changed). DECLARED rather than
# volume-seeded: volume-claim verifies against a quiescent source, and pihole-FTL.db moves on
# every DNS query, so a coexistence seed can never pass verification.
# StevenBlack is Pi-hole's first-boot default; declaring it disabled keeps a fresh boot from
# silently re-enabling it.
pihole_k8s_adlists:
  - address: https://big.oisd.nl
    enabled: 1
  - address: https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts
    enabled: 0
# domainlist type 3 = regex deny.
pihole_k8s_regex_deny:
  - '(\.|^)logs\.roku\.com$'
  - '(\.|^)ads\.samsung\.com$'
