---
# node-exporter on k8s (Phase F drain, 2026-08-14): successor to the prometheus role's
# Docker sidecar. Scraped per-pod (job `node` in claude-otel's prometheus.yaml.j2) with
# an origin label per node, so monitor-bridge's origin-pinned Root Disk / Memory checks
# keep their exact daniel-server scope.

- name: Deploy node-exporter to the cluster
  ansible.builtin.include_role:
    name: k8s/manifests
  vars:
    manifests_service: node-exporter
    # '' skips the shared role's deploy/-shaped rollout wait (this is a DaemonSet); the
    # explicit wait below replaces it.
    manifests_rollout: ''
    manifests_files:
      - daemonset.yaml

- name: Wait for the node-exporter DaemonSet rollout
  tags: [deploy]
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n {{ k8s_namespace }} rollout status daemonset/node-exporter
      --timeout=300s
  become: true
  changed_when: false
