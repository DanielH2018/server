---
# node-exporter on k8s (Phase F drain, 2026-08-14): successor to the prometheus role's
# Docker sidecar. Scraped per-pod (job `node` in claude-otel's prometheus.yaml.j2) with
# an origin label per node, so monitor-bridge's origin-pinned Root Disk / Memory checks
# keep their exact daniel-server scope.

- name: Deploy node-exporter to the cluster
  ansible.builtin.include_role:
    name: k8s/manifests
  vars:
    manifests_service: node-exporter
    # The stabilisation gate compares ready against desired for this DaemonSet (2 nodes). If
    # daniel-server goes NotReady mid-window, desired stays 2 while ready drops to 1 and the
    # gate rolls back — for a cause unrelated to this change. Accepted: it fails safe, and a
    # node going NotReady during a deploy is worth a rollback on its own.
    manifests_rollout: node-exporter
    manifests_rollout_kind: daemonset
    manifests_files:
      - daemonset.yaml
