# Phase F drain: host metrics as a DaemonSet — daniel-box gains node_* coverage it never
# had, daniel-server's LAN-published 9100 retires. Renovate tracks the pin.
node_exporter_k8s_image: prom/node-exporter:v1.10.2

# Auto-deploy stance — read by gitops_deploy (see the k8s auto-deploy coverage design).
k8s_autodeploy: true  # noqa var-naming[no-role-prefix]
k8s_autodeploy_reason: "stateless DaemonSet, read-only hostPath mounts (including / via rootfs) and no PVC, readinessProbe gates the rollout, version-pinned image; runs hostNetwork+hostPID by design, for node-level metrics"  # noqa var-naming[no-role-prefix]
