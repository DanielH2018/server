---
# Rolling upstream-branch tags, manual-update tier. Renovate cannot VERSION-track a branch tag and MUST NOT be taught to — moving to a
# different tag/branch is a deliberate redeploy with an image pull, never unsupervised `master`
# builds on a stateful monitoring service. The @sha256 pin below only lets Renovate raise DIGEST
# PRs for a new commit on the SAME tag; those aren't `minor`/`patch`, so the non-major group's
# matchUpdateTypes automerge rule doesn't touch them — they still land manually.
scrutiny_k8s_web_image: ghcr.io/analogj/scrutiny:master-web@sha256:192656ce791dc3e5bda7f7bf81cd3cb9f77ab2cde42a9bd0d8cac442b7e8bee1
scrutiny_k8s_collector_image: ghcr.io/analogj/scrutiny:master-collector@sha256:e0d55d2742017c7025e491e05eb516bc71758c575f7e0bfefe34f9ce13aced89
scrutiny_k8s_influxdb_image: influxdb:2.9@sha256:cdd3dbdea45c2f43513abd06ee9644b6e05d2354a2b93ca829c9f07d716eaaac

# Auto-deploy stance — read by gitops_deploy (see the k8s auto-deploy coverage design).
# Stateful / manual-upgrade: pins a rolling upstream branch tag on a stateful monitoring
# service by policy — moving to a different tag/branch is deliberately a manual, supervised
# redeploy, never unsupervised auto-merge. ALSO Recreate + a real config PVC from k8s_claims
# below (hardcoded ReadWriteOnce) — the migrating-state shape compounds the
# manual-upgrade policy, on top of the pinned influxdb engine holding the SMART trend history.
k8s_autodeploy: false  # noqa var-naming[no-role-prefix]
k8s_autodeploy_reason: "stateful / manual-upgrade — rolling branch tag on a stateful monitor, deliberately manual. ALSO Recreate + RWO PVC (migrating-state shape) — two independent reasons"  # noqa var-naming[no-role-prefix]

# SMART history is trend data and the whole point of the tool — backed-up class.
# It measures 3.1 MB; 2Gi leaves influxdb compaction headroom.
scrutiny_k8s_influxdb_claim: scrutiny-influxdb-data
scrutiny_k8s_influxdb_size: 2Gi
scrutiny_k8s_influxdb_storage_class: longhorn

# The web's SQLite config DB (32 KB) — device metadata, notification settings.
scrutiny_k8s_config_claim: scrutiny-web-config
scrutiny_k8s_config_size: 1Gi
scrutiny_k8s_config_storage_class: longhorn

# The claims k8s/manifests renders and applies for this role, ahead of the workload.
k8s_claims:  # noqa var-naming[no-role-prefix]
  - name: "{{ scrutiny_k8s_influxdb_claim }}"
    storage_class: "{{ scrutiny_k8s_influxdb_storage_class }}"
    size: "{{ scrutiny_k8s_influxdb_size }}"
  - name: "{{ scrutiny_k8s_config_claim }}"
    storage_class: "{{ scrutiny_k8s_config_storage_class }}"
    size: "{{ scrutiny_k8s_config_size }}"

# Collector cadence, pinned because monitor-bridge's SMART Data Freshness window (26 h)
# must not depend on the image's default.
scrutiny_k8s_collector_cron: "0 0 * * *"
