---
# Both claims are `k8s_claims` in defaults/main.yml, which k8s/manifests renders and applies
# ahead of the workload (#3387).
- name: Deploy scrutiny to the cluster
  ansible.builtin.include_role:
    name: k8s/manifests
  vars:
    manifests_service: scrutiny
    # Live prune: an object dropped from manifests_files is deleted on the next deploy (#3388).
    manifests_prune: true
    manifests_rollout: scrutiny-web
    # networkpolicy-influxdb.yaml is listed HERE rather than in netpol-baseline on purpose.
    # scrutiny-web panics rather than retries when InfluxDB is unreachable, so the policy
    # admitting it is part of this workload rather than part of the fleet baseline. Shipped one
    # role away, `--tags scrutiny` would stage a web pod whose `wait-for-influxdb` gate could
    # only time out. The file carries the reasoning.
    manifests_files:
      - influxdb.yaml
      - networkpolicy-influxdb.yaml
      - web.yaml
      - collector-configmap.yaml
      - collector-daemonset.yaml
      - ingressroute.yaml
    manifests_secret_files:
      - secret.yaml
