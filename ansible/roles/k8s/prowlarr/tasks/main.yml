---
# Slice 4, B4a — the indexer proxy, plus the headless browser it drives.
#

- name: Seed the prowlarr config volume
  tags: [deploy]
  ansible.builtin.include_role:
    name: k8s/seed-volume
  vars:
    seed_volume_service: prowlarr
    seed_volume_claim: "{{ prowlarr_k8s_claim }}"
    seed_volume_source_path: "{{ prowlarr_k8s_source_path }}"
    seed_volume_storage_class: "{{ prowlarr_k8s_storage_class }}"
    seed_volume_size: "{{ prowlarr_k8s_size }}"
    seed_volume_quiesce:
      - prowlarr

# flaresolverr's volume is NOT seeded. It is a browser profile cache that regenerates on first
# use, which is also why its class is longhorn-nobackup — copying it would spend a migration
# window on bytes the app rebuilds for free.
- name: Deploy prowlarr and flaresolverr to the cluster
  ansible.builtin.include_role:
    name: k8s/manifests
  vars:
    manifests_service: prowlarr
    # flaresolverr now rolls under maxUnavailable: 0 instead of Recreate, so a rollout that
    # never goes Ready leaves the OLD pod serving indefinitely — the failure is invisible
    # unless something actually runs `rollout status` on it. manifests_rollout above only
    # watches the Deployment named `prowlarr`; without this entry flaresolverr is never
    # queued into k8s_pending_rollouts and the batch drain never checks it.
    manifests_extra_rollouts:
      - name: flaresolverr
    manifests_files:
      # Both policies are listed FIRST so they exist before their pods can be scheduled. Within a
      # single `kubectl apply -f <dir>` that ordering is not guaranteed, which is why the pods
      # also cannot be reached in the gap: they take seconds to pull and start, and the policies
      # are applied in the same call. Each policy names its own subject:
      # networkpolicy-flaresolverr.yaml fences flaresolverr, networkpolicy-prowlarr.yaml
      # (slice 2) fences prowlarr itself.
      - networkpolicy-flaresolverr.yaml
      - networkpolicy-prowlarr.yaml
      - deployment-flaresolverr.yaml
      - service-flaresolverr.yaml
      - deployment.yaml
      - service.yaml
      - ingressroute.yaml
      # The query-only door for monitor-bridge on daniel-server (slice 4, B4c).
      - ingressroute-monitoring.yaml
    manifests_secret_files:
      # The exportarr sidecar's API key. Listed as a SECRET file so it is rendered 0600 under
      # no_log, like every other decrypted SOPS value.
      - secret-exportarr.yaml

# flaresolverr's config PVC was retired when the Deployment moved to an emptyDir. Dropping
# pvc-flaresolverr.yaml from manifests_files stops it being staged but does not remove the
# live object, so it is deleted here. --ignore-not-found makes this idempotent, which is what
# lets it stay in the role rather than being a one-shot play someone has to remember to run.
- name: Retire the flaresolverr config PVC
  tags: [deploy]
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n {{ k8s_namespace }} delete pvc {{ prowlarr_k8s_flaresolverr_claim }}
      --ignore-not-found --wait=false
  become: true
  register: prowlarr_k8s_pvc_retire
  # ansible.builtin.command is skipped entirely under --check, which leaves stdout undefined —
  # the | default('') keeps this task from erroring under the repo's mandated --check preview
  # instead of just showing nothing for the only task on this branch that destroys a volume.
  changed_when: "'deleted' in prowlarr_k8s_pvc_retire.stdout | default('')"

# ── prove the flaresolverr isolation survived the move ──────────────────────────────────────
# Its own directory: `kubectl apply -f <dir>` reads every file in the directory it is given, and
# a Job's pod template is immutable, so a Job left beside the Deployments would be re-applied as
# either a no-op or an error.
- name: Create the flaresolverr probe manifest directory
  tags: [config]
  ansible.builtin.file:
    path: /etc/rancher/k3s/manifests/prowlarr-netpol
    state: directory
    mode: "0700"
    owner: root
    group: root
  become: true

- name: Render the flaresolverr isolation probe
  tags: [config]
  ansible.builtin.template:
    src: netpol-probe-job.yaml.j2
    dest: /etc/rancher/k3s/manifests/prowlarr-netpol/netpol-probe-job.yaml
    mode: "0644"
    owner: root
    group: root
  become: true

- name: Clear the previous flaresolverr probe run
  tags: [deploy]
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n {{ k8s_namespace }} delete job flaresolverr-netpol-probe
      --ignore-not-found --wait=true
  become: true
  changed_when: true

- name: Run the flaresolverr isolation probe
  tags: [deploy]
  ansible.builtin.command:
    cmd: >-
      k3s kubectl apply -f
      /etc/rancher/k3s/manifests/prowlarr-netpol/netpol-probe-job.yaml
  become: true
  changed_when: true

- name: Wait for the flaresolverr isolation probe
  tags: [deploy]
  # 300s, up from 120s: the probe's control now retries for up to 150s to ride out prowlarr's
  # own restart, and the Job's activeDeadlineSeconds is 240s. This wait must outlive that
  # deadline, so a genuine failure surfaces as the probe's own message in the next task rather
  # than as an opaque wait timeout with no explanation.
  #
  # Known wart, pre-existing and unchanged in kind: `--for=condition=complete` cannot also watch
  # for `failed`, so a Job that fails fast still burns this whole timeout before the play stops.
  # Raising the timeout makes that slower (was ~2min, now ~5min) on the failure path only.
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n {{ k8s_namespace }} wait --for=condition=complete
      job/flaresolverr-netpol-probe --timeout=300s
  become: true
  changed_when: false
  register: prowlarr_k8s_netpol_probe
  failed_when: prowlarr_k8s_netpol_probe.rc != 0

- name: Report the flaresolverr isolation probe
  tags: [deploy]
  ansible.builtin.command:
    cmd: "k3s kubectl -n {{ k8s_namespace }} logs job/flaresolverr-netpol-probe"
  become: true
  changed_when: false
  register: prowlarr_k8s_netpol_log

- name: Show the flaresolverr isolation result
  tags: [deploy]
  ansible.builtin.debug:
    msg: "{{ prowlarr_k8s_netpol_log.stdout_lines }}"
