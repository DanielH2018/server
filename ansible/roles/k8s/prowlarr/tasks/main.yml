---
# The indexer proxy, plus the headless browser it drives.

# flaresolverr's volume is NOT seeded. It is a browser profile cache that regenerates on first
# use, so there is nothing to copy.
- name: Deploy prowlarr and flaresolverr to the cluster
  ansible.builtin.include_role:
    name: k8s/manifests
  vars:
    # No `manifests_rollout_timeout` here: defaults/main.yml sets it, where the renderer reads
    # it for Flux's `timeout` and k8s/manifests reads it for the rollout wait. An include var
    # of that name would override the default and loop through `prowlarr_k8s_rollout_timeout`.
    # The drain gives the flaresolverr entry below the same budget.
    # flaresolverr rolls under maxUnavailable: 0 rather than Recreate, so a rollout that
    # never goes Ready leaves the OLD pod serving indefinitely — the failure is invisible
    # unless something actually runs `rollout status` on it. manifests_rollout above only
    # watches the Deployment named `prowlarr`; without this entry flaresolverr is never
    # queued into k8s_pending_rollouts and the batch drain never checks it.
    manifests_extra_rollouts:
      - name: flaresolverr

# flaresolverr runs on an emptyDir: its /config is a browser profile cache it rebuilds on first
# use. Its old `prowlarr-flaresolverr-config` claim was deleted by a "Retire the flaresolverr
# config PVC" task here, removed in #5557 once `kubectl get pvc -n homelab` no longer listed it.

# ── prove the flaresolverr isolation ──────────────────────────────────────
# Its own directory: `kubectl apply -f <dir>` reads every file in the directory it is given, and
# a Job's pod template is immutable, so a Job left beside the Deployments would be re-applied as
# either a no-op or an error.
- name: Create the flaresolverr probe manifest directory
  tags: [config]
  ansible.builtin.file:
    path: /etc/rancher/k3s/manifests/prowlarr-netpol
    state: directory
    mode: "0700"
    owner: root
    group: root
  become: true
  when: not k8s_dry_run | bool

- name: Render the flaresolverr isolation probe
  tags: [config]
  ansible.builtin.template:
    src: netpol-probe-job.yaml.j2
    dest: /etc/rancher/k3s/manifests/prowlarr-netpol/netpol-probe-job.yaml
    mode: "0644"
    owner: root
    group: root
  become: true
  when: not k8s_dry_run | bool

- name: Clear the previous flaresolverr probe run
  when: not k8s_no_mutate
  tags: [deploy]
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n {{ k8s_namespace }} delete job flaresolverr-netpol-probe
      --ignore-not-found --wait=true
  become: true
  changed_when: true

- name: Run the flaresolverr isolation probe
  when: not k8s_no_mutate
  tags: [deploy]
  ansible.builtin.command:
    cmd: >-
      k3s kubectl apply -f
      /etc/rancher/k3s/manifests/prowlarr-netpol/netpol-probe-job.yaml
  become: true
  changed_when: true

- name: Wait for the flaresolverr isolation probe
  when: not k8s_no_mutate
  tags: [deploy]
  # 300s: the probe's control retries for up to 150s to ride out prowlarr's
  # own restart, and the Job's activeDeadlineSeconds is 240s. This wait must outlive that
  # deadline, so a genuine failure surfaces as the probe's own message in the next task rather
  # than as an opaque wait timeout with no explanation.
  #
  # Known wart: `--for=condition=complete` cannot also watch for `failed`, so a Job that fails
  # fast still burns this whole timeout (~5min) before the play stops. Only the failure path pays.
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n {{ k8s_namespace }} wait --for=condition=complete
      job/flaresolverr-netpol-probe --timeout=300s
  become: true
  changed_when: false
  register: prowlarr_k8s_netpol_probe
  failed_when: prowlarr_k8s_netpol_probe.rc != 0

- name: Report the flaresolverr isolation probe
  when: not k8s_no_mutate
  tags: [deploy]
  ansible.builtin.command:
    cmd: "k3s kubectl -n {{ k8s_namespace }} logs job/flaresolverr-netpol-probe"
  become: true
  changed_when: false
  register: prowlarr_k8s_netpol_log

- name: Show the flaresolverr isolation result
  tags: [deploy]
  # The whole probe chain above is `command` tasks, so `--check` creates no Job and reads no
  # logs. This debug is the only task left running, onto a skip result with no
  # `stdout_lines`.
  when: not k8s_no_mutate
  ansible.builtin.debug:
    msg: "{{ prowlarr_k8s_netpol_log.stdout_lines }}"
