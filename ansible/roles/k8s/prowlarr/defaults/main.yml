---
prowlarr_k8s_image: lscr.io/linuxserver/prowlarr:2.4.0.5397-ls150

# Auto-deploy stance — read by gitops_deploy (see the k8s auto-deploy coverage design).
# Migrating state — strategy is Recreate and the config volume (indexer definitions + API keys)
# is seeded through k8s/volume-claim (hardcoded ReadWriteOnce). This role renders TWO
# Deployments (prowlarr + flaresolverr) and gates both correctly via manifests_extra_rollouts —
# briefly removed from the denylist under an "ungated sub-deployment" reason that turned out to
# be stale, then restored (2026-08-20) once review found the real, unrelated reason below.
# Gatedness was never the issue; the PVC/Recreate shape is. The linuxserver -lsNN scheme also
# hides a breaking bump as a routine patch bump (currently 2.4.0.5397-ls150).
# Promoted in slice 7b (2026-08-21): k8s/manifests now takes a pre-apply Longhorn snapshot of
# the claim below and reverts it if the deploy fails, so a bad swap reverts to the snapshot
# instead of leaving the indexer definitions and API keys unreadable by the old image.
k8s_autodeploy: true  # noqa var-naming[no-role-prefix]
k8s_autodeploy_reason: "migrating state — Recreate + RWO volume-claim PVC, now protected by the pre-apply Longhorn snapshot and revert; -lsNN versioning still hides a breaking bump. NOT about gatedness: both rendered Deployments (prowlarr + flaresolverr) gate correctly. WEIGHED: prowlarr pushes indexer config to the *arr apps, which store Prowlarr-assigned indexer IDs back; a revert desyncs those IDs until the next reconciliation or a manual re-sync. UNATTENDED RECOVERY DOES NOT APPLY HERE: sonarr, radarr, bazarr and jellyfin all self-heal a revert (rescan / re-download / existence check), so an operator reading the rollback alert for prowlarr should expect to re-sync indexers by hand"  # noqa var-naming[no-role-prefix]
# Slice 7a task 3 — the pre-apply Longhorn snapshot k8s/manifests takes via k8s/volume-snapshot.
# Only the seeded config claim, not prowlarr_k8s_flaresolverr_claim — flaresolverr's PVC holds
# nothing but a disposable browser profile, not migrating state. Declared regardless of
# k8s_autodeploy — protects a manual deploy too, and slice 7b's revert is what this role's
# auto-deploy now depends on.
k8s_autodeploy_snapshot_pvcs: [prowlarr-config]  # noqa var-naming[no-role-prefix]

# 84 M at B4a. Holds the indexer definitions and their API keys.
prowlarr_k8s_claim: prowlarr-config
# `longhorn` — backed up. Briefly `longhorn-nobackup` on 2026-08-08, after B2's TRANSACTION cap
# fired twice in a week (08-02, 08-08) as slice 4 took Longhorn's daily run from 4 to 15 backups and
# incremental backups bound bandwidth, not transactions. Returned the same day: the exclusion left
# this volume with a single frozen 08-08 restore point, and whether steady-state incrementals are
# actually the problem cannot be read off anything Longhorn or B2 expose. So it is being tested
# rather than assumed, with B2 Reachable as the readout. docs/b2-transaction-cap-monitoring-gaps.md.
prowlarr_k8s_storage_class: longhorn
prowlarr_k8s_size: 2Gi

# ── flaresolverr ────────────────────────────────────────────────────────────────────────────
# Solves Cloudflare challenges for the indexers, which means it RENDERS ATTACKER-SUPPLIED PAGES
# in a headless browser. Under Compose it sits on its own `prowlarr-flaresolverr` network,
# reachable by prowlarr and nothing else — a deliberate isolation, not an accident of layout.
#
# One flat namespace would silently WIDEN that to every workload in {{ k8s_namespace }}. So the
# move is made a narrowing instead, by networkpolicy-flaresolverr.yaml.j2: ingress on 8191 from pods labelled
# app=prowlarr only. INGRESS is the enforced direction on this cluster — n8n-broker proves it,
# and B3 proved egress policies here do nothing — so this is a control that actually holds, and
# the probe beside it says so rather than assuming.
#
# Tag KEPT alongside the digest (repo:latest@sha256) so Renovate's k8s-defaults manager still
# tracks it for digest-bump PRs — a bare repo@sha256 would freeze it with zero update signal
# (2026-08-13 pin).
prowlarr_k8s_flaresolverr_image: ghcr.io/flaresolverr/flaresolverr:latest@sha256:139dfee1c6f89249c8d665d1333a42e8ec74ec0a86bc6bb1c8461e10d3a66a47
prowlarr_k8s_flaresolverr_port: 8191
prowlarr_k8s_flaresolverr_claim: prowlarr-flaresolverr-config

# busybox nc is all the isolation probe needs.
prowlarr_k8s_probe_image: alpine:3.24@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b

# Mirrors resources('1.0', '1024M', '0.10', '128M') for prowlarr and
# resources('2.0', '1024M', '0.10', '128M') for flaresolverr.
prowlarr_k8s_cpu_limit: "1"
prowlarr_k8s_mem_limit: 1024Mi
prowlarr_k8s_cpu_request: "100m"
prowlarr_k8s_mem_request: 128Mi
prowlarr_k8s_fs_cpu_limit: "2"
prowlarr_k8s_fs_mem_limit: 1024Mi
prowlarr_k8s_fs_cpu_request: "100m"
prowlarr_k8s_fs_mem_request: 128Mi

# See roles/k8s/sonarr/defaults/main.yml for the full rationale: upstream defaults are
# LogLevel=debug / Rotate=50 / SizeLimit=1MB, and the churn that produces is what inflates the
# backup, not the capped size. Bound via PROWLARR__LOG__* — Prowlarr's Bootstrap.cs binds
# LogOptions to the "Prowlarr:Log" section and registers AddEnvironmentVariables() unprefixed.
prowlarr_k8s_log_level: info
prowlarr_k8s_log_rotate: "10"

# The exportarr metrics sidecar (templates/exportarr.yml.j2). Pinned in this role's own defaults
# rather than once in group_vars, because Renovate's k8s-images manager matches
# `roles/k8s/*/defaults` and `_image:` keys only. sonarr and radarr carry the same pin, and
# ansible/tests/test_exportarr_pins_in_lockstep.py fails if the three drift apart.
prowlarr_exportarr_image: ghcr.io/onedr0p/exportarr:v2.3.0
