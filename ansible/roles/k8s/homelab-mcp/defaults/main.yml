---
# Built in-cluster by k8s/image-builder (same rolling tier as n8n/code-server:
# imagePullPolicy Always + build-on-deploy replaces the Docker role's Sunday
# rebuild cron for base refreshes).
homelab_mcp_k8s_image: "{{ k8s_registry_pull_host }}/homelab-mcp:latest"

# Auto-deploy stance — read by gitops_deploy (see the k8s auto-deploy coverage design).
# Stateless RollingUpdate Deployment, no PVC, readinessProbe. The image tag is a mutable
# :latest built in-cluster (imagePullPolicy: Always), not an upstream tag Renovate can bump
# blind — every rebuild is this repo's own image-builder run, not a vendor's release.
k8s_autodeploy: true  # noqa var-naming[no-role-prefix]
k8s_autodeploy_reason: "stateless RollingUpdate Deployment, no PVC, readinessProbe, in-cluster-built image under this repo's own control. NOTHING CAN TRIGGER THIS PROMOTION: homelab_mcp_k8s_image is a registry-built <pull-host>/homelab-mcp:latest ref, listed in REGISTRY_BUILT_IMAGES (scripts/tests/test_renovate_managers.py) — no upstream ref for Renovate to compare against and no version for it to offer. Only templates/Dockerfile.j2's FROM line moves, which is not the defaults/main.yml-only diff split_k8s_auto_deploy requires. The promotion is correct and harmless, not active"  # noqa var-naming[no-role-prefix]

# Carried over from the compose template's resources() caps.
homelab_mcp_k8s_cpu_limit: 500m
homelab_mcp_k8s_mem_limit: 256Mi
homelab_mcp_k8s_cpu_request: 50m
homelab_mcp_k8s_mem_request: 32Mi
