---
# Built in-cluster by k8s/image-builder (same rolling tier as n8n/code-server:
# imagePullPolicy Always + build-on-deploy refreshes the base image).
homelab_mcp_k8s_image: "{{ k8s_registry_pull_host }}/homelab-mcp:{{ k8s_built_image_tags.get('homelab-mcp', 'latest') }}"

# Renovate stance: whether an image bump here may automerge. `promote` deploys what merges.
# Stateless RollingUpdate Deployment, no PVC, readinessProbe. The image tag is a mutable
# :latest built in-cluster (imagePullPolicy: Always), not an upstream tag Renovate can bump
# blind — every rebuild is this repo's own image-builder run, not a vendor's release.
k8s_autodeploy: true  # noqa var-naming[no-role-prefix]
k8s_autodeploy_reason: "stateless RollingUpdate Deployment, no PVC, readinessProbe, in-cluster-built image under this repo's own control. NOTHING CAN TRIGGER AN AUTOMERGE: homelab_mcp_k8s_image is a registry-built <pull-host>/homelab-mcp ref, listed in REGISTRY_BUILT_IMAGES (scripts/tests/test_renovate_managers.py) — no upstream ref for Renovate to compare against and no version for it to offer. Only templates/Dockerfile.j2's FROM line moves, and every automerge rule in renovate.json is custom.regex-only, so that dockerfile-manager bump never automerges. The stance is correct and harmless, not active"  # noqa var-naming[no-role-prefix]

# Blast-radius caps.
homelab_mcp_k8s_cpu_limit: 500m
homelab_mcp_k8s_mem_limit: 256Mi
homelab_mcp_k8s_cpu_request: 50m
homelab_mcp_k8s_mem_request: 32Mi

image_builder_builds:  # noqa var-naming[no-role-prefix]
  - image_builder_name: homelab-mcp
    # playbook_dir, not role_path: these render INSIDE image-builder, where role_path
    # names the wrong role.
    image_builder_dockerfile: "{{ playbook_dir }}/roles/k8s/homelab-mcp/templates/Dockerfile.j2"
    # Raw files, not templates: app.py embeds PromQL whose {{...}} braces Jinja would
    # eat (the reason image_builder_context_files exists).
    image_builder_context_files:
      "{{ playbook_dir }}/roles/k8s/homelab-mcp/files/app.py": app.py
      "{{ playbook_dir }}/roles/k8s/homelab-mcp/files/safe_reads.py": safe_reads.py
      "{{ playbook_dir }}/roles/k8s/homelab-mcp/files/k8s_reads.py": k8s_reads.py
      # The Prometheus/Loki client probe.py shares. It lives outside this role. Under Flux an
      # edit to it moves the content tag, so promote rebuilds the image. After a handback to
      # Ansible, the deployer's K8S_BUILD_CONTEXT_FILES maps an edit to it to this role's tag
      # (#4840); a census test holds that table equal to this list.
      "{{ playbook_dir }}/../scripts/diagnostics/probe_lib/obs_api.py": obs_api.py

# The ClusterRole and ClusterRoleBinding in rbac.yaml are cluster-scoped, so the namespaced
# prune allowlist in k8s/manifests never selects them; dropping one still leaves it live.
manifests_rollout: homelab-mcp  # noqa var-naming[no-role-prefix]
