---
# The PVC is created by the manifests role below, from `k8s_claims` in defaults/main.yml.
#
# There is no automated way to repopulate this volume from empty. The setup wizard in the
# browser is the only import path; see the image pin's comment in defaults/main.yml.

- name: Deploy wg-easy to the cluster
  ansible.builtin.include_role:
    name: k8s/manifests
  vars:
    manifests_service: wg-easy
    manifests_rollout: wg-easy
    # Live prune: an object dropped from manifests_files is deleted on the next deploy (#3388).
    # Secret and PersistentVolumeClaim are outside the prune allowlist, so neither the claim
    # holding the server keypair nor the orphaned wg-easy-env Secret below can be pruned.
    manifests_prune: true
    manifests_files:
      - deployment.yaml
      - service.yaml
      - ingressroute.yaml
    # No manifests_secret_files: v15 owns its admin credentials in its own SQLite DB, so the
    # wg-easy-env Secret that carried v14's PASSWORD_HASH has no consumer. The prune never
    # deletes a Secret (it is outside manifests_prune_allowlist), so the live Secret
    # survives, orphaned, until someone deletes it by hand. It is unreferenced but still holds
    # a real bcrypt hash.
    #
    # PENDING OPERATOR WORK, and it needs BOTH of these or it fails:
    #
    #     sudo k3s kubectl delete secret wg-easy-env -n homelab
    #
    # `-n homelab`, not the default namespace — this role's objects live in homelab, and a
    # bare `kubectl delete secret wg-easy-env` targets `default` and reports Forbidden or
    # NotFound depending on identity, neither of which means what it looks like. `sudo k3s`,
    # because plain kubectl here resolves the read-only ServiceAccount, which is Forbidden on
    # secrets for `delete` AND for `get` — so an unprivileged caller cannot even confirm the
    # Secret exists. Root's kubeconfig at /etc/rancher/k3s/k3s.yaml carries the admin cert.
    #
    # Nothing in this repo can do it: `sudo` is denied to the agent and Ansible's k8s write
    # path here runs under the same read-only SA. The live Secret keeps the v14 bcrypt hash
    # until a person runs the command above.
