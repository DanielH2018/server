---
# Slice-6 B5, pulled forward from slice 7 (2026-08-09): the router's forwards — 51820/udp
# included — moved to daniel-box, so this move restored remote access.
#
# The k8s/seed-volume include this role used to open was dropped at the v15 upgrade
# (2026-08-23). It copied the Docker copy's bind mount from daniel-server, a host that has
# had no Docker since 2026-08-14, and it short-circuits on the claim's own seeded annotation
# anyway — so on the live PVC it had already been a no-op for every deploy since the cutover.
# The PVC itself is created by the manifests role below, from pvc.yaml.j2.
#
# There is no automated way to repopulate this volume from empty. v15's only v14 import path
# is the setup wizard in the browser; see the image pin's comment in defaults/main.yml.

- name: Deploy wg-easy to the cluster
  ansible.builtin.include_role:
    name: k8s/manifests
  vars:
    manifests_service: wg-easy
    manifests_rollout: wg-easy
    manifests_files:
      - pvc.yaml
      - deployment.yaml
      - service.yaml
      - ingressroute.yaml
    # No manifests_secret_files: v15 owns its admin credentials in its own SQLite DB, so the
    # wg-easy-env Secret that carried v14's PASSWORD_HASH has no consumer. The template is
    # deleted, but `kubectl apply` never prunes an object it stops rendering — the live
    # Secret survives, orphaned, until someone deletes it by hand. It is unreferenced (the
    # Deployment's envFrom went with it) but it still holds a real bcrypt hash.
    #
    # The repo side is DONE: `wg_easy_password_hash` was dropped from ansible/vars/secrets.yml
    # and ansible/secret_rotation.yml together on 2026-08-24 (review M-7) — together because
    # secret_rotation.py's registry_drift reports a registry entry with no secrets.yml key as
    # stale and a secrets.yml key with no registry entry as missing, and the daily Kuma monitor
    # goes red on either. Until then the audit reported the key "ok, due 2026-11-20", scheduling
    # a rotation for a credential nothing reads.
    #
    # STILL OPERATOR WORK: `kubectl delete secret wg-easy-env`. Nothing in this repo can do it
    # — the ServiceAccount Claude and the crons authenticate as is read-only, and `kubectl
    # delete` is denied outright. The live Secret keeps the bcrypt hash until someone runs that.
