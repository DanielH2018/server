---
# Flux applies authelia through `promote` (`owner: flux`), and no Flux path runs this file. It
# stays for the handback (docs/flux-deploy-plane.md). The checks it held before the flip moved
# to `cluster_vars.py write`, which refuses each of these before a value reaches the cluster:
# - "Fail if the claude-ui credentials are missing": an empty `authelia_claude_totp_secret`;
# - "Fail if a stored Authelia digest is malformed": a malformed or shared value in the three
#   `_argon2` keys;
# - the two template-action tasks: a `{{` in any value, which Authelia's `template` config
#   filter would read as a second action and refuse to start on.
# The claim is `k8s_claims` in defaults/main.yml; k8s/manifests renders and applies it.
- name: Deploy Authelia to the cluster
  ansible.builtin.include_role:
    name: k8s/manifests
  vars:
    # DECIDED: authelia stays off `manifests_prune` (#3388, operator decision 2026-10-05). An
    # armed prune deletes what the lever below drops, so turning `authelia_k8s_redis_sessions`
    # off would delete the live redis Deployment, Service and NetworkPolicy the lever exists to
    # keep. #3388 counts authelia as deliberately excluded. The prune is armed by default since
    # #3662, so this line is the opt-out.
    manifests_prune: false
    # The redis pair is concatenated rather than listed, for the same reason crowdsec-secret is
    # below: authelia_k8s_redis_sessions is a rollback lever, and dropping the names here is
    # what stops a `false` run staging manifests whose config nothing reads. The LIVE redis
    # Deployment and Service survive that — `kubectl apply` does not prune — which is the
    # intent: flipping the lever back on does not have to recreate them.
    #
    # networkpolicy-redis.yaml rides the same lever as the pair above, and it is listed HERE
    # rather than in netpol-baseline on purpose. Authelia cannot start without its
    # session store, so the policy admitting it to redis is part of this workload rather than
    # part of the fleet baseline — shipped one role away, `--tags authelia` would stage a portal
    # that CrashLoopBackOffs and returns 500 on every forwardAuth route. Gated with the pair so the three cannot
    # drift apart: with the lever off there is no redis pod for the policy to select.
    #
    # `kubectl apply -f <dir>` is alphabetical, so on a cluster with no redis yet
    # deployment.yaml lands before networkpolicy-redis.yaml and the portal may crashloop once
    # before the policy admits it. It self-heals within a backoff because the policy arrives
    # in the same deploy.
    manifests_files: >-
      {{ ['deployment.yaml', 'service.yaml', 'ingressroute.yaml',
          'forwardauth-middleware.yaml']
         + (['deployment-redis.yaml', 'service-redis.yaml', 'networkpolicy-redis.yaml']
            if authelia_k8s_redis_sessions | bool else []) }}
    # crowdsec-secret.yaml is concatenated rather than listed: it reads
    # crowdsec_k8s_agent_password, which a cluster not running the crowdsec role never
    # defines, and the Secret has no template branch to gate. oidc-jwk-secret.yaml rides
    # authelia_k8s_manage_oidc, the lever that gates the `jwks` block reading it: a passed list
    # wins whole, so a template named nowhere here is never rendered, and the Deployment would
    # mount a Secret no deploy wrote. It is never in manifests_files, which stages a file
    # world-readable and outside no_log.
    manifests_secret_files: >-
      {{ ['config-secret.yaml']
         + (['oidc-jwk-secret.yaml'] if authelia_k8s_manage_oidc | bool else [])
         + (['crowdsec-secret.yaml'] if authelia_k8s_manage_crowdsec | bool else [])
         + (['redis-secret.yaml'] if authelia_k8s_redis_sessions | bool else []) }}
    # `authelia-redis` is listed so the batch drain WAITS on its rollout, never so this role
    # restarts it (#4564). A redis image bump rolls it through the apply, and under Recreate SSO
    # has no session store until the new pod is up, so a landing that did not wait read
    # `settled` mid-pull. `restart_on: []` is the load-bearing half: without it the shared
    # extra restart rolls redis on every change to THIS role's manifests, several times a day,
    # and destroys the sessions it exists to keep. Gated on the lever like the pair above: with
    # it off on a cluster that never ran redis, `rollout status` on a Deployment that does not
    # exist would fail the drain.
    manifests_extra_rollouts: >-
      {{ [{'name': 'authelia-redis', 'restart_on': []}]
         if authelia_k8s_redis_sessions | bool else [] }}
