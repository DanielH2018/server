---
# The password hash is generated at deploy time rather than stored, matching the Docker role
# — but that role shells `docker run`, and daniel-box deliberately has no Docker (it is the
# k3s node). A one-shot pod is the equivalent.
#
# Read-back first, because argon2 salts are random: regenerating on every run would change
# the Secret every deploy and trigger a rollout restart that changes nothing. This is the k8s
# form of the Docker role's first-run-only users_database.yml guard.
- name: Look for an existing Authelia users database in the cluster
  tags: [config]
  # Fetches the whole .data map rather than jsonpath={.data.users_database\.yml}. A key
  # containing a dot cannot be addressed that way: kubectl does not error, it returns an
  # empty string and exit 0. The guard below then read that as "no existing hash", so every
  # deploy regenerated the argon2 hash with a fresh salt, rewrote the Secret and rolled the
  # pod — the exact churn the read-back exists to prevent, with nothing in the output saying so.
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n {{ k8s_namespace }} get secret authelia-config
      -o jsonpath={.data}
  register: authelia_k8s_existing
  become: true
  changed_when: false
  failed_when: false
  # Runs under --check too: reads only. This one matters more than the other read-back
  # guards, because skipping it does not just fail — it falls through to the GENERATE path
  # below, which spins up a pod to mint a fresh argon2 hash. A dry run must not do that.
  # With the read intact the hash is found, `authelia_password_hash is not defined` goes
  # false, and the generate task is never reached.
  check_mode: false
  no_log: true

- name: Reuse the password hash already in the cluster
  tags: [config]
  ansible.builtin.set_fact:
    authelia_password_hash: "{{ authelia_k8s_existing_hash }}"
  vars:
    # default('{}', true) covers both a missing Secret and an empty stdout — from_json on ''
    # raises. The regex tolerates the value being absent from the map on a partial Secret.
    authelia_k8s_existing_hash: >-
      {{ (authelia_k8s_existing.stdout | default('{}', true) | from_json).get('users_database.yml', '')
         | b64decode | regex_search('\$argon2[^\s\']+') | default('', true) }}
  when: authelia_k8s_existing_hash | length > 0
  no_log: true

- name: Hash the Authelia password
  tags: [config]
  # Same algorithm and parameters as the Docker role, so the two instances' users databases
  # stay interchangeable for the slice-6 cutover.
  #
  # authelia's CLI (4.39.20) has no --password-file or env-var form — only a literal
  # --password flag or an interactive terminal prompt (confirmed against the CLI
  # reference), so the value has to reach `authelia` as an argv token somewhere. Putting
  # it directly on the `kubectl run` command line put it in spec.containers[].command,
  # which anything with `get pods` can read (homelab-readonly's view binding,
  # homelab-mcp) and which persists in the object until the pod is GC'd — plus the node's
  # process table for as long as `kubectl run`/the shell live. Piping it over stdin and
  # having the in-pod shell `read` it into a local var, mirrored from the crowdsec role's
  # `cscli machines add` task (roles/k8s/crowdsec/tasks/main.yml), keeps it out of the pod
  # spec, the kubectl process argv, and the k8s exec audit trail entirely. It still lands
  # in `authelia`'s own argv for the pod's brief lifetime once the shell expands "$pw" —
  # that part is unavoidable without patching the CLI, and this task's own `ps` exposure
  # is no worse than the interactive-prompt path would be.
  #
  # IFS= (not bare `read -r pw`) so a leading/trailing space in the password isn't
  # stripped — `read` trims IFS whitespace by default, which would silently hash the
  # wrong string while still producing a well-formed $argon2id$ hash.
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n {{ k8s_namespace }} run authelia-hash
      --rm -i --attach --quiet --restart=Never --image={{ authelia_k8s_image }} --command --
      sh -c 'IFS= read -r pw; authelia crypto hash generate argon2 --password "$pw"
      --iterations 3 --memory 65536 --parallelism 4 --salt-size 16 --key-size 32'
    stdin: "{{ authelia_password }}"
  register: authelia_k8s_hash
  become: true
  changed_when: false
  no_log: true
  when: authelia_password_hash is not defined

- name: Extract the digest
  tags: [config]
  # regex_search rather than stripping a "Digest: " prefix: `kubectl run --attach` can
  # interleave its own lines with the container's output, so anchor on the hash itself.
  ansible.builtin.set_fact:
    authelia_password_hash: "{{ authelia_k8s_hash.stdout | regex_search('\\$argon2[^\\s]+') }}"
  when: authelia_password_hash is not defined
  no_log: true

- name: Fail if no password hash could be obtained
  tags: [config]
  # Without this the template renders an empty password and Authelia starts with an account
  # nobody can log into — a green deploy with a locked portal.
  ansible.builtin.assert:
    that: authelia_password_hash | default('') | length > 0
    fail_msg: >-
      Could not read or generate the Authelia password hash. Check that the authelia-hash
      pod could pull {{ authelia_k8s_image }}.

- name: Deploy Authelia to the cluster
  ansible.builtin.include_role:
    name: k8s/manifests
  vars:
    manifests_service: authelia
    manifests_files:
      - pvc.yaml
      - deployment.yaml
      - service.yaml
      - ingressroute.yaml
      - forwardauth-middleware.yaml
    # crowdsec-secret.yaml is concatenated rather than listed: it reads
    # crowdsec_k8s_agent_password, which a cluster not running the crowdsec role never
    # defines, and the Secret has no template branch to gate.
    manifests_secret_files: >-
      {{ ['config-secret.yaml']
         + (['crowdsec-secret.yaml'] if authelia_k8s_manage_crowdsec | bool else []) }}
