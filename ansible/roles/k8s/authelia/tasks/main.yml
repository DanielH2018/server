---
# Flux applies authelia through `promote` (`owner: flux`), and no Flux path runs this file. It stays
# until R4 deletes it. The checks it held before the flip moved
# to `cluster_vars.py write`, which refuses each of these before a value reaches the cluster:
# - "Fail if the claude-ui credentials are missing": an empty `authelia_claude_totp_secret`;
# - "Fail if a stored Authelia digest is malformed": a malformed or shared value in the three
#   `_argon2` keys;
# - the two template-action tasks: a `{{` in any value, which Authelia's `template` config
#   filter would read as a second action and refuse to start on.
# The claim is `k8s_claims` in defaults/main.yml; k8s/manifests renders and applies it.
- name: Deploy Authelia to the cluster
  ansible.builtin.include_role:
    name: k8s/manifests
