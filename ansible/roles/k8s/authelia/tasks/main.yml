---
# Each user's argon2 digest is a SOPS value (`authelia_password_argon2` and its two siblings),
# which templates/config-secret.yaml.j2 reads directly. A rotation mints the digest by hand and
# stores it beside the plaintext; docs/secret-rotation.md has the procedure.
- name: Fail if the claude-ui credentials are missing
  tags: [config]
  # The role default is an empty stand-in, so a cluster that manages this user and does NOT
  # hold the SOPS value resolves it to '' rather than failing on an undefined name. Without
  # this assert the seeding task below registers an empty TOTP secret, behind a green recap.
  ansible.builtin.assert:
    that:
      - authelia_claude_totp_secret | default('') | length > 0
    fail_msg: >-
      authelia_k8s_manage_claude_user is on, but authelia_claude_totp_secret is empty. Add it to
      ansible/vars/secrets.yml, or set authelia_k8s_manage_claude_user to false for this cluster.
    quiet: true
  no_log: true
  when: authelia_k8s_manage_claude_user | bool

- name: Fail if a stored Authelia digest is malformed
  tags: [config]
  # Every digest a managed user's `password:` line renders must be the PHC form of the hashing
  # block in templates/config-secret.yaml.j2: argon2id, m=65536, t=3, p=4, a 16-byte salt (22
  # base64 characters) and a 32-byte key (43). That refuses an empty value, a `Digest: ` prefix,
  # surrounding whitespace, a pasted plaintext and a digest minted with other parameters, before
  # the apply, so a bad value stops the play instead of breaking Authelia's load under
  # `Recreate`. Two users sharing one digest share one password, so that fails too. `\Z`, not
  # `$`, ends the pattern: Python's `$` also matches before a trailing newline.
  # DECIDED: guarded on `homelab_secret_stubs` alone, never on `k8s_dry_run`. A stubbed shadow
  # run feeds this `stub-` strings, which are not PHC-shaped. An ordinary dry run reads the
  # stored digests and is meant to check them.
  # docs/target-architecture/render/r3-remove-live-reads.md, Design, has the reasoning;
  # ansible/tests/services/test_authelia_digest_assert.py holds the guard.
  vars:
    authelia_k8s_digest_pattern: '^[$]argon2id[$]v=19[$]m=65536,t=3,p=4[$][A-Za-z0-9+/]{22}[$][A-Za-z0-9+/]{43}\Z'
    authelia_k8s_managed_digests: >-
      {{ [authelia_password_argon2 | default('')]
         + ([authelia_claude_password_argon2 | default('')]
            if authelia_k8s_manage_claude_user | bool else [])
         + ([authelia_agent_password_argon2 | default('')]
            if authelia_k8s_manage_agent_user | bool else []) }}
  ansible.builtin.assert:
    that:
      - authelia_k8s_managed_digests | reject('match', authelia_k8s_digest_pattern) | list | length == 0
      - authelia_k8s_managed_digests | unique | list | length == authelia_k8s_managed_digests | length
    fail_msg: >-
      A stored Authelia digest (authelia_password_argon2, authelia_claude_password_argon2 or
      authelia_agent_password_argon2) is not an argon2id digest with the hashing block's
      parameters, or two managed users share one. Mint it again with the procedure in
      docs/secret-rotation.md.
    quiet: true
  when: not (homelab_secret_stubs | default(false) | bool)
  no_log: true

# With OIDC on, Authelia's `template` config filter runs Go templating over the whole
# configuration.yml at start, and the one action it should find is the `jwks[].key` expression
# that reads the signing key's mount. Every test renders stub values, so none sees a real one.
# A real value holding `{{` would open a second action, and Authelia would refuse to start,
# taking SSO down under Recreate. These two tasks count the actions in the real render and
# stop the deploy before the apply, so the old config stays live. The count is the only fact
# set, and the assert prints that number and no value. With the lever off the config holds no
# expression and the filter is off, so a `{{` in a value is plain text and neither task runs.
# `[{][{]` matches the pair without writing it, which Ansible would read as a template.
# After D5's flip for authelia, no deploy task reads the rendered config; D3's refusal of `{{`
# in any value is the successor (docs/target-architecture/render/r2-secret-placeholders.md,
# PR 7).
- name: Count the template actions in Authelia's rendered configuration
  tags: [config]
  vars:
    authelia_k8s_rendered_config_secret: >-
      {{ lookup('ansible.builtin.template',
                playbook_dir + '/roles/k8s/authelia/templates/config-secret.yaml.j2') }}
  ansible.builtin.set_fact:
    authelia_k8s_config_action_count: >-
      {{ (authelia_k8s_rendered_config_secret | from_yaml).stringData['configuration.yml']
         | regex_findall('[{][{]') | length }}
  no_log: true
  when: authelia_k8s_manage_oidc | bool

- name: Fail unless the jwks key expression is the configuration's only template action
  tags: [config]
  ansible.builtin.assert:
    that:
      - authelia_k8s_config_action_count | int == 1
    fail_msg: >-
      Authelia's rendered configuration.yml holds {{ authelia_k8s_config_action_count }}
      template actions where only the jwks key expression should be one. A secret value
      holding a double opening brace would stop Authelia starting under its template config
      filter. Find the value with sops and store one without it.
    quiet: true
  when: authelia_k8s_manage_oidc | bool

# The claim is `k8s_claims` in defaults/main.yml; k8s/manifests renders and applies it.
- name: Deploy Authelia to the cluster
  ansible.builtin.include_role:
    name: k8s/manifests
  vars:
    # DECIDED: authelia stays off `manifests_prune` (#3388, operator decision 2026-10-05). An
    # armed prune deletes what the lever below drops, so turning `authelia_k8s_redis_sessions`
    # off would delete the live redis Deployment, Service and NetworkPolicy the lever exists to
    # keep. #3388 counts authelia as deliberately excluded. The prune is armed by default since
    # #3662, so this line is the opt-out.
    manifests_prune: false
    # The redis pair is concatenated rather than listed, for the same reason crowdsec-secret is
    # below: authelia_k8s_redis_sessions is a rollback lever, and dropping the names here is
    # what stops a `false` run staging manifests whose config nothing reads. The LIVE redis
    # Deployment and Service survive that — `kubectl apply` does not prune — which is the
    # intent: flipping the lever back on does not have to recreate them.
    #
    # networkpolicy-redis.yaml rides the same lever as the pair above, and it is listed HERE
    # rather than in netpol-baseline on purpose. Authelia cannot start without its
    # session store, so the policy admitting it to redis is part of this workload rather than
    # part of the fleet baseline — shipped one role away, `--tags authelia` would stage a portal
    # that CrashLoopBackOffs and returns 500 on every forwardAuth route. Gated with the pair so the three cannot
    # drift apart: with the lever off there is no redis pod for the policy to select.
    #
    # `kubectl apply -f <dir>` is alphabetical, so on a cluster with no redis yet
    # deployment.yaml lands before networkpolicy-redis.yaml and the portal may crashloop once
    # before the policy admits it. It self-heals within a backoff because the policy arrives
    # in the same deploy.
    manifests_files: >-
      {{ ['deployment.yaml', 'service.yaml', 'ingressroute.yaml',
          'forwardauth-middleware.yaml']
         + (['deployment-redis.yaml', 'service-redis.yaml', 'networkpolicy-redis.yaml']
            if authelia_k8s_redis_sessions | bool else []) }}
    # crowdsec-secret.yaml is concatenated rather than listed: it reads
    # crowdsec_k8s_agent_password, which a cluster not running the crowdsec role never
    # defines, and the Secret has no template branch to gate. oidc-jwk-secret.yaml rides
    # authelia_k8s_manage_oidc, the lever that gates the `jwks` block reading it: a passed list
    # wins whole, so a template named nowhere here is never rendered, and the Deployment would
    # mount a Secret no deploy wrote. It is never in manifests_files, which stages a file
    # world-readable and outside no_log.
    manifests_secret_files: >-
      {{ ['config-secret.yaml']
         + (['oidc-jwk-secret.yaml'] if authelia_k8s_manage_oidc | bool else [])
         + (['crowdsec-secret.yaml'] if authelia_k8s_manage_crowdsec | bool else [])
         + (['redis-secret.yaml'] if authelia_k8s_redis_sessions | bool else []) }}
    # `authelia-redis` is listed so the batch drain WAITS on its rollout, never so this role
    # restarts it (#4564). A redis image bump rolls it through the apply, and under Recreate SSO
    # has no session store until the new pod is up, so a landing that did not wait read
    # `settled` mid-pull. `restart_on: []` is the load-bearing half: without it the shared
    # extra restart rolls redis on every change to THIS role's manifests, several times a day,
    # and destroys the sessions it exists to keep. Gated on the lever like the pair above: with
    # it off on a cluster that never ran redis, `rollout status` on a Deployment that does not
    # exist would fail the drain.
    manifests_extra_rollouts: >-
      {{ [{'name': 'authelia-redis', 'restart_on': []}]
         if authelia_k8s_redis_sessions | bool else [] }}

# TOTP registrations live in Authelia's SQLite database, not in the rendered
# users_database.yml, so `claude-ui`'s second factor cannot be templated with the rest of
# the user. It is seeded through Authelia's own CLI against the running pod instead.
- name: Wait for Authelia to be rolled out before seeding the claude-ui TOTP
  tags: [config]
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n {{ k8s_namespace }} rollout status deploy/authelia --timeout=300s
  become: true
  changed_when: false
  # A read of rollout state, but `rollout status` blocks on a Deployment a no-mutation run
  # never created, so it stays out of one. 300s is this tree's default inline-gate budget.
  when: authelia_k8s_manage_claude_user | bool and not (k8s_no_mutate | bool)

- name: Seed the claude-ui TOTP registration
  tags: [config]
  # Re-seeded on every deploy with --force rather than guarded by a read-back. The secret is
  # fixed in SOPS, so the row this writes is identical each run — idempotent in effect, and
  # `changed_when: false` says so. The alternative, `authelia storage user totp export`,
  # would print live TOTP secrets into the Ansible output to decide whether to skip.
  #
  # --config, not --encryption-key: the pod's own configuration.yml already names the SQLite
  # path and the storage encryption key, so neither reaches argv here. The shared secret
  # still must — `--secret` has no file or env form — so it arrives on stdin and is expanded
  # by the in-pod shell, the same shape as the mint command in docs/secret-rotation.md.
  #
  # The three TOTP parameters are stated rather than left to the CLI defaults. ui_login.py
  # derives its codes from the same three constants, and a default that moved in a later
  # Authelia would put the two out of step with nothing but a rejected login to say so.
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n {{ k8s_namespace }} exec -i deploy/authelia -c authelia --
      sh -c 'IFS= read -r s; authelia storage user totp generate {{ authelia_k8s_claude_user }}
      --config /secrets/configuration.yml --secret "$s" --force
      --algorithm SHA1 --digits 6 --period 30'
    stdin: "{{ authelia_claude_totp_secret }}"
  become: true
  changed_when: false
  no_log: true
  when: authelia_k8s_manage_claude_user | bool and not (k8s_no_mutate | bool)
