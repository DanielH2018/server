---
- name: Deploy Authelia to the cluster
  ansible.builtin.include_role:
    name: k8s/manifests
  vars:
    manifests_service: authelia
    manifests_files:
      - pvc.yaml
      - deployment.yaml
      - service.yaml
      - ingressroute.yaml
      - forwardauth-middleware.yaml
    manifests_secret_files:
      - config-secret.yaml
