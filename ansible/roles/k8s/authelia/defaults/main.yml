---
# Same tag the Docker instance runs, so a behavioural difference between the two portals is
# never the version.
authelia_k8s_image: authelia/authelia:4.39.20

# Auto-deploy stance — read by gitops_deploy (see the k8s auto-deploy coverage design).
# Platform: the SSO/OIDC gate every Authelia-fronted route depends on. A failed deploy locks
# out access to the rest of the fleet, including whatever tooling would be used to fix it.
# Also Recreate + a PVC (its own SQLite session/config store) on its own state, which compounds
# the risk but isn't the primary reason.
k8s_autodeploy: false  # noqa var-naming[no-role-prefix]
k8s_autodeploy_reason: "platform — SSO/OIDC gate; a failed deploy locks out access to everything behind it, including the tools to fix it"  # noqa var-naming[no-role-prefix]

# The CrowdSec agent sidecar that parses this pod's auth log into the in-cluster LAPI, and
# the init container that seeds its config. False for a cluster that does not run the
# `crowdsec` role: `crowdsec:8080` does not resolve there, the sidecar crashloops, and the
# pod never reaches Ready — a false failure rather than a real one.
#
# DECIDED: separate from traefik_k8s_manage_crowdsec rather than one shared variable. A
# shared one would live in group_vars/all.yml, an `ansible/inventory/` path the GitOps
# deployer treats as broad — it defers and returns WITHOUT fast-forwarding, so the change
# would need clearing by hand. The surfaces are asymmetric too: this pod carries only an
# agent and PRODUCES signals, where Traefik carries a bouncer plugin and enforces bans.
#
# Gating this out does NOT stop Authelia writing /var/log/authelia/authelia.log. Its config
# names that path (config-secret.yaml.j2) and the emptyDir stays mounted; the init container
# pre-creates the file to win the start race against the agent, not to grant permission —
# an emptyDir under the pod's fsGroup is group-writable and Authelia runs in that group.
authelia_k8s_manage_crowdsec: true

# The OpenID Connect provider block, and the one relying party it serves — Jellyfin. False
# for a cluster whose subset holds no OIDC client: the block is then dead configuration whose
# only effect is to demand three credentials (`authelia_oidc_hmac_secret`,
# `authelia_oidc_rsa_key_content`, `authelia_client_password_hash`) that such a cluster has no
# reason to hold. Turning it off is what lets staging's secrets file stay small, which is the
# point of Decision 5 in docs/staging-cluster.md.
#
# It gates the config block, not the portal: forward-auth, the session store and the user
# database are unaffected, so a cluster with this false still proves the middleware chain
# every Authelia-fronted IngressRoute depends on.
authelia_k8s_manage_oidc: true

# Session cookie name. MUST differ from the Docker instance's `authelia_session_local`.
# Both portals serve the cookie domain local.<domain>, and a browser holds one cookie per
# (domain, name) pair — with a shared name, logging in at one portal overwrites the other's
# cookie, and since sessions are in-memory per instance the overwritten side then bounces the
# user back to login. Symptom: signing in here silently signs you out of daniel-server.
authelia_k8s_cookie_name: authelia_session_k8s

# Its own SQLite database on its own volume. This is the slice-1 hazard named in
# docs/archive/k3s-migration/design.md: two Authelias writing one SQLite file corrupts it for both.
# The storage encryption key (authelia_storage) was shared with the Docker instance so the
# slice-6 cutover could be a plain file copy with no re-encryption. That instance is gone —
# roles/containers/archive/authelia, and Docker was uninstalled from both cluster nodes on
# 2026-08-14 — so this role is the key's only consumer and it rotates on its own. The
# procedure is in docs/secret-rotation.md under `pinned`; it is not a `sops set`.
authelia_k8s_storage: 1Gi

# "1", not "1.0" — see the same note in the traefik role. Kubernetes canonicalises quantities, so
# 1.0 in the manifest and 1 in the live object never match in last-applied-configuration and every
# apply reports the Deployment "configured".
authelia_k8s_cpu_limit: "1"
authelia_k8s_mem_limit: 512Mi
authelia_k8s_cpu_request: "100m"
authelia_k8s_mem_request: 64Mi

# Authelia's startup checks report "Errors occurred performing startup checks" and nothing
# else at info — the per-provider failures only surface at debug. Raise it for a run with
# `-e authelia_k8s_log_level=debug` rather than committing a noisy default.
authelia_k8s_log_level: info

# Slice-6 B2 follow-up — the CrowdSec agent sidecar that parses this portal's auth log.
# Collections are the authelia-specific subset (the traefik/http ones belong to the agents
# reading those logs). The machine NAME is crowdsec_k8s_authelia_agent_machine in group_vars —
# the k8s/crowdsec role registers it, and only group_vars crosses that role boundary.
authelia_k8s_agent_collections: LePresidente/authelia
authelia_k8s_agent_cpu_limit: "0.5"
authelia_k8s_agent_mem_limit: 256Mi
authelia_k8s_agent_cpu_request: 50m
authelia_k8s_agent_mem_request: 64Mi
# Bounds a runaway auth log on the emptyDir shared with the sidecar.
authelia_k8s_log_size: 512Mi
