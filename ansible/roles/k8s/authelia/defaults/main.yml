---
authelia_k8s_image: authelia/authelia:4.39.28@sha256:bd97cff4fcbf715b5ff1f9ae286afbe6033afce385302520b0368122d43a6f54

# Renovate stance: whether an image bump here may automerge. `promote` deploys what merges.
# Platform: the SSO/OIDC gate every Authelia-fronted route depends on. A failed deploy locks
# out access to the rest of the fleet, including whatever tooling would be used to fix it.
# Also Recreate + a PVC (its own SQLite session/config store) on its own state, which compounds
# the risk but isn't the primary reason.
k8s_autodeploy: false  # noqa var-naming[no-role-prefix]
k8s_autodeploy_reason: "platform — SSO/OIDC gate; a failed deploy locks out access to everything behind it, including the tools to fix it"  # noqa var-naming[no-role-prefix]

# The CrowdSec agent sidecar that parses this pod's auth log into the in-cluster LAPI, and
# the init container that seeds its config. False for a cluster that does not run the
# `crowdsec` role: `crowdsec:8080` does not resolve there, the sidecar crashloops, and the
# pod never reaches Ready — a false failure rather than a real one.
#
# DECIDED: separate from traefik_k8s_manage_crowdsec rather than one shared variable. A
# shared one would live in group_vars/all.yml, an `ansible/inventory/` path the GitOps
# deployer treats as broad — it defers and returns WITHOUT fast-forwarding, so the change
# would need clearing by hand. The surfaces are asymmetric too: this pod carries only an
# agent and PRODUCES signals, where Traefik carries a bouncer plugin and enforces bans.
#
# Gating this out does NOT stop Authelia writing /var/log/authelia/authelia.log. Its config
# names that path (config-secret.yaml.j2) and the emptyDir stays mounted; the init container
# pre-creates the file to win the start race against the agent, not to grant permission —
# an emptyDir under the pod's fsGroup is group-writable and Authelia runs in that group.
authelia_k8s_manage_crowdsec: true

# The OpenID Connect provider block, and the relying parties it serves — Jellyfin and
# Grafana. False for a cluster whose subset holds no OIDC client: the block is then dead
# configuration whose only effect is to demand four credentials
# (`authelia_oidc_hmac_secret`, `authelia_oidc_rsa_key_content`,
# `authelia_client_password_hash`, `grafana_oidc_client_secret_hash`) that such a cluster has
# no reason to hold. Turning it off is what lets staging's secrets file stay small, which is the
# point of Decision 5 in docs/archive/staging-cluster.md.
#
# It gates the config block, not the portal: forward-auth, the session store and the user
# database are unaffected, so a cluster with this false still proves the middleware chain
# every Authelia-fronted IngressRoute depends on.
authelia_k8s_manage_oidc: true

# The manifest whose Secret holds the OIDC signing key, a multi-line PEM block that no Flux
# placeholder can carry. A placeholder render (scripts/renderer, target slice R2) leaves it
# out, and D3 ships it as a SOPS-encrypted manifest instead. Ansible renders and applies it,
# when authelia_k8s_manage_oidc is true, like any other secret file. `sops-manifest-entries`
# in scripts/renderer/renderer_lib/sops_entries.py holds the entry to one Secret of
# `SOPS_MANIFEST_KEYS` keys.
render_sops_manifests: [oidc-jwk-secret.yaml]  # noqa var-naming[no-role-prefix]

# Deliver identity-verification codes by email rather than to a file inside the pod. False
# falls back to the filesystem notifier. Leave it true; false is the break-glass path for a
# cluster with no usable `smtp_notify_app_password`.
authelia_k8s_smtp_notifier: true

# Session cookie name. This is a cookie NAME, not a credential. The session secret is `authelia_secret`, which
# the rotation registry tracks under that name — see this role's CLAUDE.md.
authelia_k8s_cookie_name: authelia_session_k8s

# --- Redis session store ----------------------------------------------------------------
# Authelia's session provider is IN-MEMORY unless a `session.redis` block exists — v4.39.21's
# own config.template.yml says "Memory is the provider unless redis is defined". So every roll
# of this Deployment destroys every session, remember-me ones included: `remember_me` only
# overrides the cookie lifetime and disables the inactivity timer, it does not change where the
# session lives. This pod rolls whenever its rendered manifests change. Redis moves the
# sessions out of the process so a roll does not log the fleet out.
#
# The rollback lever: set false and redeploy. Authelia goes back to memory sessions and the
# redis Deployment and Service stay applied but unused. Flipping it either way logs everyone
# out once, because the sessions live on the side being left.
authelia_k8s_redis_sessions: true

# repo:tag with no digest — the same shape as authelia_k8s_image above, so Renovate's docker
# manager tracks it.
authelia_k8s_redis_image: redis:8.10-alpine@sha256:21090af93f8324db2f0f0f4f38a7c60369d47d917e000c3423d89d2ae2883537

# Sessions are a CACHE with a one-month ceiling, not a record, so redis runs on an emptyDir and
# persists nothing. A node reboot, an eviction or a Renovate bump of the image still logs
# everyone out; a roll of THIS role does not. A Longhorn PVC would buy back the remaining cases
# at the price of a backed-up volume holding live session credentials.
authelia_k8s_redis_cpu_limit: "0.5"
authelia_k8s_redis_mem_limit: 128Mi
authelia_k8s_redis_cpu_request: 10m
authelia_k8s_redis_mem_request: 16Mi

# `maxmemory` sits UNDER the container memory limit so redis evicts its oldest sessions instead
# of being OOM-killed, which would drop all of them at once. allkeys-lru because every key here
# is a session and Authelia simply re-authenticates a user whose key is gone.
authelia_k8s_redis_maxmemory: 96mb
# Its own SQLite database on its own volume. This role is the only consumer of the storage encryption key (authelia_storage), so the key
# rotates on its own. The procedure is in docs/secret-rotation.md under `pinned`; it is not a
# `sops set`.
authelia_k8s_storage: 1Gi

# Plain `longhorn`, so the claim rides the daily R2 tier. It holds the SQLite database with TOTP
# secrets, WebAuthn devices and regulation records, which unlike Traefik's acme.json is not
# regenerable. A recurring-job-group label on the claim would do nothing: Longhorn reads those
# labels on its own Volume CRs, and PVC labels do not propagate to them.
authelia_k8s_storage_class: longhorn

# The claim the renderer emits for this role, which the authelia Kustomization applies (#3387).
k8s_claims:  # noqa var-naming[no-role-prefix]
  - name: authelia-config
    storage_class: "{{ authelia_k8s_storage_class }}"
    size: "{{ authelia_k8s_storage }}"

# "1", not "1.0" — see the same note in the traefik role. Kubernetes canonicalises quantities, so
# 1.0 in the manifest and 1 in the live object never match in last-applied-configuration and every
# apply reports the Deployment "configured".
authelia_k8s_cpu_limit: "1"
authelia_k8s_mem_limit: 512Mi
authelia_k8s_cpu_request: "100m"
authelia_k8s_mem_request: 64Mi

# Authelia's startup checks report "Errors occurred performing startup checks" and nothing
# else at info — the per-provider failures only surface at debug. Raise it for a run with
# `-e authelia_k8s_log_level=debug` rather than committing a noisy default.
authelia_k8s_log_level: info

# The CrowdSec agent sidecar that parses this portal's auth log.
# Collections are the authelia-specific subset (the traefik/http ones belong to the agents
# reading those logs). The machine NAME is crowdsec_k8s_sidecar_agents.authelia in group_vars —
# the k8s/crowdsec role registers it, and only group_vars crosses that role boundary.
authelia_k8s_agent_collections: LePresidente/authelia
authelia_k8s_agent_cpu_limit: "0.5"
authelia_k8s_agent_mem_limit: 256Mi
authelia_k8s_agent_cpu_request: 50m
authelia_k8s_agent_mem_request: 64Mi
# Bounds a runaway auth log on the emptyDir shared with the sidecar.
authelia_k8s_log_size: 512Mi

# The dedicated identity the headless UI tier logs in as, for the `two_factor` services
# (code-server, n8n, longhorn). Not a credential: the username is plaintext on purpose so
# the manifest guards and `test_ui_login.py` can assert on it without decrypting anything.
# Its password (`authelia_claude_password`) and TOTP shared secret
# (`authelia_claude_totp_secret`) are SOPS values, both generated locally and rotatable
# without touching the operator's enrolled phone.
#
# DECIDED: a second user rather than putting the OPERATOR's TOTP secret in SOPS. Making the
# two_factor tier unattended means the second factor becomes another value under the age
# key either way, so the factor count is not what this buys. What it buys is a blast radius
# with an edge: revoking Claude's reach into code-server, n8n and longhorn is deleting one
# block from `users_database.yml`, and rotating either credential is a `sops set` plus a
# deploy rather than re-enrolling a phone. The operator's own login is untouched by both.
#
# Its groups match the operator's deliberately. The access_control rules here are
# domain-scoped except alertmanager.local's, which `admins` passes (#6689), so groups change
# almost nothing about what this user can REACH — they change mainly what the apps behind
# those routes render. A narrower set would have the UI tier assert against a degraded page
# while still reporting green.
authelia_k8s_claude_user: claude-ui
authelia_k8s_claude_groups:
  - 'admins'
  - 'dev'

# The claude-ui user, its TOTP registration, and the two credentials they need. False for a
# cluster that does not run the headless UI tier — staging is one, and it holds neither
# credential.
#
# The TOTP row lives in Authelia's SQLite database (a PVC), not in the rendered
# users_database.yml — Authelia keeps registrations there whatever the authentication
# backend is. So the `seed-claude-totp` init container in templates/deployment.yaml.j2 seeds
# it with `authelia storage user totp generate --force` on every pod start rather than
# templating it: the secret is fixed in SOPS, so the row it writes is byte-identical each
# time and the seed is idempotent in effect.
authelia_k8s_manage_claude_user: true

# Empty stand-ins, NOT values. SOPS supplies both on a cluster that manages the user, and
# play vars outrank role defaults, so these are what a cluster with the flag off resolves
# instead of failing on an undefined name. An empty one reaching a cluster with the flag ON
# is a misconfiguration, and tasks/main.yml asserts against exactly that: the digest assert
# refuses an empty digest, and the TOTP assert an empty shared secret. The plaintext
# `authelia_claude_password` has no stand-in, because this role does not read it;
# scripts/diagnostics/ui_login.py does.
authelia_claude_password_argon2: ''
authelia_claude_totp_secret: ''

# The agent user's own identity for the homelab-ui MCP server (docs/claude-agent-user.md,
# slice 5). The Unix user `claude` logs in to the LAN portal as this account instead of
# borrowing the operator's login. The username is plaintext on purpose, like the one above, and
# the claude_code role mirrors it in `claude_code_homelab_ui_username`; a test holds the two
# equal. Its password, `authelia_agent_password`, is a SOPS value that Ansible decrypts as the
# operator, so the agent never holds the age key. This role reads only its digest,
# `authelia_agent_password_argon2`, as it does for claude-ui.
#
# DECIDED: no groups, unlike claude-ui, which copies the operator's two. The two groups carry
# privilege in the apps behind the portal: Grafana maps `admins` to its Admin role
# (observability/templates/grafana.yaml.j2), and Headlamp binds `oidc:admins` to the cluster's
# read RBAC (headlamp_k8s_oidc_group). claude-ui keeps them because its job is to assert
# against the same pages the operator sees. This account only has to render a service page, so a
# group nothing reads costs it nothing. The access_control rules are domain-scoped except
# alertmanager.local's, which denies it for want of `admins`; otherwise it reaches every
# `one_factor` `*.local.<domain>` route from RFC1918, the set the operator's own UI jar reaches. It has no
# TOTP registration, so the `two_factor` routes (code-server, n8n, longhorn, deploy-ui) refuse it
# at the second factor, and it has no public name.
authelia_k8s_agent_user: claude-agent
authelia_k8s_agent_groups: []

# Follows claude-ui's switch: a cluster that does not run the headless UI tier (staging) holds
# neither credential, and a user whose password is the empty string must never be rendered.
authelia_k8s_manage_agent_user: "{{ authelia_k8s_manage_claude_user }}"

# Empty stand-in, NOT a value, for the reason authelia_claude_password_argon2's is.
authelia_agent_password_argon2: ''

# DECIDED: authelia stays off `manifests_prune` (#3388, operator decision 2026-10-05). An
# armed prune deletes what the lever below drops, so turning `authelia_k8s_redis_sessions`
# off would delete the live redis Deployment, Service and NetworkPolicy the lever exists to
# keep. #3388 counts authelia as deliberately excluded. The prune is armed by default since
# #3662, so this line is the opt-out.
manifests_prune: false  # noqa var-naming[no-role-prefix]

# The redis pair is concatenated rather than listed, for the same reason crowdsec-secret is
# below: authelia_k8s_redis_sessions is a rollback lever, and dropping the names here is
# what stops a `false` run staging manifests whose config nothing reads. The LIVE redis
# Deployment and Service survive that — `kubectl apply` does not prune — which is the
# intent: flipping the lever back on does not have to recreate them.
#
# networkpolicy-redis.yaml rides the same lever as the pair above, and it is listed HERE
# rather than in netpol-baseline on purpose. Authelia cannot start without its
# session store, so the policy admitting it to redis is part of this workload rather than
# part of the fleet baseline — shipped one role away, `--tags authelia` would stage a portal
# that CrashLoopBackOffs and returns 500 on every forwardAuth route. Gated with the pair so the three cannot
# drift apart: with the lever off there is no redis pod for the policy to select.
#
# `kubectl apply -f <dir>` is alphabetical, so on a cluster with no redis yet
# deployment.yaml lands before networkpolicy-redis.yaml and the portal may crashloop once
# before the policy admits it. It self-heals within a backoff because the policy arrives
# in the same deploy.
manifests_files: >-  # noqa var-naming[no-role-prefix]
  {{ ['deployment.yaml', 'service.yaml', 'ingressroute.yaml',
      'forwardauth-middleware.yaml']
     + (['deployment-redis.yaml', 'service-redis.yaml', 'networkpolicy-redis.yaml']
        if authelia_k8s_redis_sessions | bool else []) }}

# crowdsec-secret.yaml is concatenated rather than listed: it reads
# crowdsec_k8s_agent_password, which a cluster not running the crowdsec role never
# defines, and the Secret has no template branch to gate. oidc-jwk-secret.yaml rides
# authelia_k8s_manage_oidc, the lever that gates the `jwks` block reading it: a passed list
# wins whole, so a template named nowhere here is never rendered, and the Deployment would
# mount a Secret no deploy wrote. It is never in manifests_files, which stages a file
# world-readable and outside no_log.
manifests_secret_files: >-  # noqa var-naming[no-role-prefix]
  {{ ['config-secret.yaml']
     + (['oidc-jwk-secret.yaml'] if authelia_k8s_manage_oidc | bool else [])
     + (['crowdsec-secret.yaml'] if authelia_k8s_manage_crowdsec | bool else [])
     + (['redis-secret.yaml'] if authelia_k8s_redis_sessions | bool else []) }}

# `authelia-redis` is listed so the batch drain WAITS on its rollout, never so this role
# restarts it (#4564). A redis image bump rolls it through the apply, and under Recreate SSO
# has no session store until the new pod is up, so a landing that did not wait read
# `settled` mid-pull. `restart_on: []` is the load-bearing half: without it the shared
# extra restart rolls redis on every change to THIS role's manifests, several times a day,
# and destroys the sessions it exists to keep. Gated on the lever like the pair above: with
# it off on a cluster that never ran redis, `rollout status` on a Deployment that does not
# exist would fail the drain.
manifests_extra_rollouts: >-  # noqa var-naming[no-role-prefix]
  {{ [{'name': 'authelia-redis', 'restart_on': []}]
     if authelia_k8s_redis_sessions | bool else [] }}
