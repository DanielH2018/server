---
# The shared media volume for the media stack's nine workloads. Declares it to the cluster; the
# daniel-box package creates its directories on the node (hosts/daniel-box/tmpfiles.d/).
#
# Flux owns this role, so no Flux path runs the include below; it stays until R4 deletes it. The
# hardlink probe this file ran after it is the Job in
# `media-volume-verify` (templates/verify/job.yaml.j2).

- name: Declare the media volume to the cluster
  ansible.builtin.include_role:
    name: k8s/manifests
    # Armed for the label, not for a deletion it can make: the StorageClass and PV are
    # cluster-scoped and the claim is a PersistentVolumeClaim, so no document here is a kind in
    # manifests_prune_allowlist. The prune would start covering a kind this role adds later.
