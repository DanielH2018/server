---
# The first \*arr in the cluster (slice 4, B3). Ran against a COPY of the live config and the B2
# media volume while Docker's sonarr stayed authoritative — the footgun rehearsal, done while a
# wrong answer cost nothing. The rehearsal ended at B4c (2026-08-07): this copy became
# authoritative and the egress-fence/isolation-probe harness that gated the rehearsal was
# retired (2026-08-17) as dead code — a NetworkPolicy attempt that selected the pod correctly but
# was never enforced, plus the probe jobs that tested it.

# ── the config database ─────────────────────────────────────────────────────────────────────
# Create the config volume claim BEFORE deploying the workload, so the pod has a PVC to mount.
- name: Create the sonarr config volume claim
  tags: [deploy]
  ansible.builtin.include_role:
    name: k8s/volume-claim
  vars:
    volume_claim_service: sonarr
    volume_claim_name: "{{ sonarr_k8s_claim }}"
    volume_claim_storage_class: "{{ sonarr_k8s_storage_class }}"
    volume_claim_size: "{{ sonarr_k8s_size }}"

- name: Deploy sonarr to the cluster
  ansible.builtin.include_role:
    name: k8s/manifests
  vars:
    manifests_service: sonarr
    # The startupProbe allows up to 10 min of first-boot DOCKER_MODS install
    # (2026-08-09); the default 300s rollout wait times out against it and aborts
    # the whole deploy while the pod is still coming up healthy.
    manifests_rollout_timeout: 660s
    manifests_files:
      # The policy is listed FIRST so it exists before the pod can be scheduled. `kubectl apply
      # -f <dir>` does not guarantee that ordering, which is why the gap is also survivable: the
      # pod takes seconds to pull and start, and the policy is applied in the same call.
      - networkpolicy.yaml
      - deployment.yaml
      - service.yaml
      - ingressroute.yaml
      # The query-only door for monitor-bridge on daniel-server (slice 4, B4c).
      - ingressroute-monitoring.yaml
    manifests_secret_files:
      # The exportarr sidecar's API key. Listed as a SECRET file so it is rendered 0600 under
      # no_log, like every other decrypted SOPS value.
      - secret-exportarr.yaml

- name: Prove the library survived the move
  tags: [deploy]
  ansible.builtin.include_tasks: verify.yml
