---
# ── the config database ─────────────────────────────────────────────────────────────────────
- name: Deploy sonarr to the cluster
  ansible.builtin.include_role:
    name: k8s/manifests
  # No `manifests_rollout_timeout` include var: defaults/main.yml sets it, where the renderer
  # reads it for Flux's `timeout` and k8s/manifests reads it for the rollout wait. An include
  # var of that name would override the default and loop through `sonarr_k8s_rollout_timeout`.

- name: Prove the library survived the move
  tags: [deploy]
  ansible.builtin.include_tasks: verify.yml

# The Discord Connect notification is a row in sonarr.db, not a manifest — live state a
# Longhorn revert or a recreated claim drops silently. roles/k8s/arr-notification declares it.
- name: Declare sonarr's Discord notification
  tags: [deploy]
  ansible.builtin.include_role:
    name: k8s/arr-notification
  vars:
    arr_notification_app: sonarr
