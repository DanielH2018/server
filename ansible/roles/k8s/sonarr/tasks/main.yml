---
# ── the config database ─────────────────────────────────────────────────────────────────────
- name: Deploy sonarr to the cluster
  ansible.builtin.include_role:
    name: k8s/manifests
  vars:
    # The startupProbe allows up to 10 min of first-boot DOCKER_MODS install; the shared rollout default times out against it and aborts
    # the whole deploy while the pod is still coming up healthy. The number lives in
    # defaults/main.yml because verify.yml's own rollout gate waits the same budget.
    manifests_rollout_timeout: "{{ sonarr_k8s_rollout_timeout }}"

- name: Prove the library survived the move
  tags: [deploy]
  ansible.builtin.include_tasks: verify.yml

# The Discord Connect notification is a row in sonarr.db, not a manifest — live state a
# Longhorn revert or a recreated claim drops silently. roles/k8s/arr-notification declares it.
- name: Declare sonarr's Discord notification
  tags: [deploy]
  ansible.builtin.include_role:
    name: k8s/arr-notification
  vars:
    arr_notification_app: sonarr
