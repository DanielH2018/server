---
# Flux applies sonarr (D5.20), and no Ansible path reaches this file; it stays for the handback.
# The verify reads became the Job in templates/verify/.
- name: Deploy sonarr to the cluster
  ansible.builtin.include_role:
    name: k8s/manifests
  # No `manifests_rollout_timeout` include var: defaults/main.yml sets it, where the renderer
  # reads it for Flux's `timeout` and k8s/manifests reads it for the rollout wait. An include
  # var of that name would override the default and loop through `sonarr_k8s_rollout_timeout`.

# The Discord Connect notification runs as the seed Job in templates/verify/notification.yaml.j2.
# The `k8s/arr-notification` include that declared it went in #5561, so a handback re-adds it
# (`arr_notification_app: sonarr`) as well as reverting the D5.20 flip.
