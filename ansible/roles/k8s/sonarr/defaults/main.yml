---
# Same tag the Docker copy runs. Both stay on it through coexistence so a behavioural difference
# between the two is never attributable to the image.
sonarr_k8s_image: lscr.io/linuxserver/sonarr:4.0.17.2952-ls312

# Auto-deploy stance — read by gitops_deploy (see the k8s auto-deploy coverage design).
# Migrating state — strategy is Recreate and the config volume is seeded through
# k8s/seed-volume (hardcoded ReadWriteOnce), so a bad image swap can migrate the library
# database + root-folder paths before the gate observes a fault, then fail the rollback
# redeploy against data it can no longer read. The linuxserver -lsNN scheme hides a breaking
# bump as a routine patch bump.
# Promoted in slice 7b (2026-08-21): k8s/manifests now takes a pre-apply Longhorn snapshot of
# the claim below and reverts it if the deploy fails, so a bad swap reverts to the snapshot
# instead of leaving the library database and root-folder paths unreadable by the old image.
k8s_autodeploy: true  # noqa var-naming[no-role-prefix]
k8s_autodeploy_reason: "migrating state — Recreate + RWO seed-volume PVC, now protected by the pre-apply Longhorn snapshot and revert; -lsNN versioning still hides a breaking bump. WEIGHED: sonarr also mounts media-data (shared RWX, not reverted); a revert rewinds import/rename history while the files stay where they were left, so it desyncs into duplicate-import attempts or a missed-file state, recoverable by a library rescan"  # noqa var-naming[no-role-prefix]
# Slice 7a task 3 — the pre-apply Longhorn snapshot k8s/manifests takes via k8s/volume-snapshot.
# Declared regardless of k8s_autodeploy — protects a manual deploy too, and slice 7b's revert
# is what this role's auto-deploy now depends on.
k8s_autodeploy_snapshot_pvcs: [sonarr-config]  # noqa var-naming[no-role-prefix]
# Claims this role MOUNTS but does not revert — the WEIGHED clause in the reason above, stated
# where a test can read it. media-data is rendered by k8s/media-volume, so no guard that reads
# what this role creates can see the coupling (2026-08-22 review M2).
k8s_autodeploy_unreverted_claims: [media-data]  # noqa var-naming[no-role-prefix]

# ── the config database ─────────────────────────────────────────────────────────────────────
# 85 M / 221 files at B3. `longhorn`, not longhorn-nobackup: sonarr.db holds the library and the
# absolute root-folder paths that this whole slice is careful about — it is exactly the state
# worth snapshotting.
sonarr_k8s_claim: sonarr-config
# `longhorn` — backed up. Briefly `longhorn-nobackup` on 2026-08-08, after B2's TRANSACTION cap
# fired twice in a week (08-02, 08-08) as slice 4 took Longhorn's daily run from 4 to 15 backups and
# incremental backups bound bandwidth, not transactions. Returned the same day: the exclusion left
# this volume with a single frozen 08-08 restore point, and whether steady-state incrementals are
# actually the problem cannot be read off anything Longhorn or B2 expose. So it is being tested
# rather than assumed, with B2 Reachable as the readout. docs/b2-transaction-cap-monitoring-gaps.md.
sonarr_k8s_storage_class: longhorn
sonarr_k8s_size: 2Gi
sonarr_k8s_source_path: /home/ubuntu/server/containers/sonarr/config

# The B2 volume, mounted at /data — byte-for-byte the Docker path contract (D4). Getting this
# wrong does not fail at startup; it fails as a library that looks intact until an import.
sonarr_k8s_media_claim: media-data

# TheCaptain989's striptracks mod, as the compose template runs it (there is no separate
# `sonarr-striptracks` — the radarr-named image auto-detects which app it is in).
sonarr_k8s_docker_mods: linuxserver/mods:radarr-striptracks

sonarr_k8s_cpu_limit: "1"
sonarr_k8s_mem_limit: 1024Mi
sonarr_k8s_cpu_request: "100m"
sonarr_k8s_mem_request: 128Mi

# Kept after the isolation-probe harness was retired (2026-08-17). qbittorrent's verify.yml read
# this var for its own probe pod until 2026-08-22 and now carries its own; nothing outside this
# role consumes it.
sonarr_k8s_probe_image: alpine:3.24

# Logging, bound through Sonarr's own config system rather than config.xml — the *arr apps read
# `<App>:Log` from IConfiguration, and AddEnvironmentVariables() is registered with NO prefix
# filter, so the section maps to SONARR__LOG__*. Verified against Sonarr's Bootstrap.cs
# (`services.Configure<LogOptions>(config.GetSection("Sonarr:Log"))`) and LogOptions.cs, which
# declares Level and Rotate; radarr and prowlarr bind the identical shape under their own names.
#
# WHY: upstream's defaults are LogLevel=debug, Rotate=50, SizeLimit=1MB — so every *arr sits at
# a 50 MB steady state of debug chatter it rewrites continuously. Measured 2026-08-16: sonarr
# and prowlarr each held 51 MiB in /config/logs, radarr 25 MiB. The size is capped, so this is
# not primarily a space fix; it is a CHURN fix. Longhorn backs up allocated device blocks, and
# a directory that rewrites 50 MB in a rolling window leaves freed-but-undiscarded blocks that
# the backup ships forever. sonarr-config backed up at 278 MiB against 91 MiB of live files.
#
# info keeps every message the UI's log view and the support workflow actually use; debug is a
# developer setting upstream ships on. Rotate 10 caps the directory at ~10 MB.
sonarr_k8s_log_level: info
sonarr_k8s_log_rotate: "10"
