---
sonarr_k8s_image: lscr.io/linuxserver/sonarr:4.0.20.3014-ls329@sha256:44b06045a98bc1f237b9ffefc4b28dab64cb29305e4a2a94875ae93b5224e4cc

# Auto-deploy stance — read by gitops_deploy (see the k8s auto-deploy coverage design).
# Migrating state — strategy is Recreate and the config volume comes from
# k8s_claims below (hardcoded ReadWriteOnce), so a bad image swap can migrate the library
# database + root-folder paths before the gate observes a fault, then fail the rollback
# redeploy against data it can no longer read. The linuxserver -lsNN scheme hides a breaking
# bump as a routine patch bump.
# Flux's sonarr-snapshot Job snapshots the claim below before each revision applies. A failed
# revision that changes sonarr writes the stateful hold without a reset, and the operator
# reverts the claim through docs/volume-snapshot-drills.md, so a bad swap can be
# reverted instead of leaving the library database and root-folder paths unreadable by the old
# image.
k8s_autodeploy: true  # noqa var-naming[no-role-prefix]
k8s_autodeploy_reason: "migrating state — Recreate + RWO PVC, protected by the sonarr-snapshot Job before each revision and an operator revert to it after a failed one; -lsNN versioning still hides a breaking bump. WEIGHED: sonarr also mounts media-data (shared RWX, not reverted); a revert rewinds import/rename history while the files stay where they were left, so it desyncs into duplicate-import attempts or a missed-file state, recoverable by a library rescan"  # noqa var-naming[no-role-prefix]
# The claim snapshotted before each revision applies. Under Flux the renderer turns this
# list into the sonarr-snapshot Kustomization, whose Job snapshots it before sonarr applies
# (D5.2a). After a handback, k8s/manifests takes the same snapshot through k8s/volume-snapshot.
# The snapshot is the recovery point this role's auto-deploy depends on.
k8s_autodeploy_snapshot_pvcs: [sonarr-config]  # noqa var-naming[no-role-prefix]
# Claims this role MOUNTS but does not revert — the WEIGHED clause in the reason above, stated
# where a test can read it. media-data is rendered by k8s/media-volume, so no guard that reads
# what this role creates can see the coupling.
k8s_autodeploy_unreverted_claims: [media-data]  # noqa var-naming[no-role-prefix]

# The rollout budget, declared once. Read as Flux's health-check `timeout` and by
# `progressDeadlineSeconds` in templates/deployment.yaml.j2, so the two cannot drift. After a
# handback, k8s/manifests' rollout wait reads it too.
# A first boot installing DOCKER_MODS takes up to 10 minutes. That is the whole 600s default
# (Flux's, and manifests_rollout_timeout_default after a handback), so the default leaves no
# margin over the startupProbe that allows it.
# The deadline has to move with the budget: at the 600s Kubernetes default, `rollout status`
# fails on ProgressDeadlineExceeded whatever `--timeout` says, so the last 60s of this budget
# is unreachable unless the deadline is rendered from this variable too.
# The literal is `manifests_rollout_timeout` because the renderer reads a role's Flux
# Kustomization `timeout` only from a literal role default (`role_fields` in
# scripts/lib/k8s_roles.py); as an include var it would render Flux's 600s default (#5464).
manifests_rollout_timeout: 660s  # noqa var-naming[no-role-prefix]
sonarr_k8s_rollout_timeout: "{{ manifests_rollout_timeout }}"

# ── the config database ─────────────────────────────────────────────────────────────────────
# 85 M / 221 files. `longhorn`, not longhorn-nobackup: sonarr.db holds the library and the
# absolute root-folder paths — it is exactly the state worth snapshotting.
sonarr_k8s_claim: sonarr-config
# `longhorn` — backed up. Excluding this volume would leave it with a single frozen restore
# point. B2 Reachable is the readout for whether its incrementals strain B2's TRANSACTION cap.
sonarr_k8s_storage_class: longhorn
sonarr_k8s_size: 2Gi

# The B2 volume, mounted at /data — sonarr stores absolute in-container paths, so the mount
# must match them byte for byte (D4). Getting this wrong does not fail at startup; it fails as a library that looks intact until an import.
sonarr_k8s_media_claim: media-data

# TheCaptain989's striptracks mod (there is no separate `sonarr-striptracks` — the
# radarr-named image auto-detects which app it is in).
sonarr_k8s_docker_mods: linuxserver/mods:radarr-striptracks

sonarr_k8s_cpu_limit: "1"
sonarr_k8s_mem_limit: 1024Mi
sonarr_k8s_cpu_request: "100m"
sonarr_k8s_mem_request: 128Mi

# Logging, bound through Sonarr's own config system rather than config.xml — the *arr apps read
# `<App>:Log` from IConfiguration, and AddEnvironmentVariables() is registered with NO prefix
# filter, so the section maps to SONARR__LOG__*. Verified against Sonarr's Bootstrap.cs
# (`services.Configure<LogOptions>(config.GetSection("Sonarr:Log"))`) and LogOptions.cs, which
# declares Level and Rotate; radarr and prowlarr bind the identical shape under their own names.
#
# WHY: upstream's defaults are LogLevel=debug, Rotate=50, SizeLimit=1MB — so every *arr sits at
# a 50 MB steady state of debug chatter it rewrites continuously. Measured: sonarr
# and prowlarr each held 51 MiB in /config/logs, radarr 25 MiB. The size is capped, so this is
# not primarily a space fix; it is a CHURN fix. Longhorn backs up allocated device blocks, and
# a directory that rewrites 50 MB in a rolling window leaves freed-but-undiscarded blocks that
# the backup ships forever. sonarr-config backed up at 278 MiB against 91 MiB of live files.
#
# info keeps every message the UI's log view and the support workflow actually use; debug is a
# developer setting upstream ships on. Rotate 10 caps the directory at ~10 MB.
sonarr_k8s_log_level: info
sonarr_k8s_log_rotate: "10"

# The exportarr metrics sidecar (templates/exportarr.yml.j2). Pinned HERE, in the role's own
# defaults, rather than once in group_vars: Renovate's k8s-images manager matches
# `roles/k8s/*/defaults` and `_image:` keys only, so a shared var one directory up is invisible
# to it and to the coverage test — the escape `crowdsec_k8s_image` made from group_vars.
# radarr and prowlarr carry the same pin for the same reason, and
# ansible/tests/services/test_exportarr_sidecars.py::test_the_image_pins_stay_in_lockstep
# fails if the three drift apart.
sonarr_k8s_exportarr_image: ghcr.io/onedr0p/exportarr:v2.3.0@sha256:af535d94061cf97a52e1661945ffba78c03f9443eae7c0da1a80a5a4be56b520

# The claim the renderer emits for this role. The sonarr Kustomization applies it after the
# sonarr-snapshot Job; after a handback, k8s/manifests applies it ahead of the pre-apply snapshot.
k8s_claims:  # noqa var-naming[no-role-prefix]
  - name: "{{ sonarr_k8s_claim }}"
    storage_class: "{{ sonarr_k8s_storage_class }}"
    size: "{{ sonarr_k8s_size }}"
