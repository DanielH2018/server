---
# Same images the Docker role runs — both copies stay on the same TAG through coexistence so a
# difference in behaviour between them is never the image. The k8s copies are additionally
# @sha256-pinned (the compose copy, frozen in renovate.json's ignorePaths, stays floating as a
# rollback artifact — see that file) so the k8s-defaults manager tracks digest bumps for the
# pod that's actually live; a bare repo@sha256 would freeze it with zero update signal instead
# (2026-08-13 pin).
freshrss_k8s_image: lscr.io/linuxserver/freshrss:latest@sha256:7ba33d8d9721c2a27bba7780e6072c004c477b9ad27ee770eab5d60c834de0d0
freshrss_k8s_cache_image: nginx:alpine@sha256:4a73073bd557c65b759505da037898b61f1be6cbcc3c2c3aeac22d2a470c1752

# Auto-deploy stance — read by gitops_deploy (see the k8s auto-deploy coverage design).
# Migrating state — strategy is Recreate and the config volume is seeded through
# k8s/seed-volume (hardcoded ReadWriteOnce). Briefly removed from the denylist under an
# "ungated sub-deployment" reason that turned out to be stale, then restored (2026-08-20) once
# review found the real, unrelated reason: this role tracks :latest by digest, so it rides
# whatever image lands after Renovate's digest soak with no version-scheme signal at all —
# sharper than the -lsNN roles, which at least advertise a version number that CAN be misread.
# Promoted in slice 7b (2026-08-21): k8s/manifests now takes a pre-apply Longhorn snapshot of
# the claim below and reverts it if the deploy fails, so a bad digest swap reverts instead of
# migrating the config volume with no version signal to have even warned about it.
k8s_autodeploy: true  # noqa var-naming[no-role-prefix]
k8s_autodeploy_reason: "migrating state — Recreate + RWO seed-volume PVC, now protected by the pre-apply Longhorn snapshot and revert; still tracks :latest by digest with no version signal to misread"  # noqa var-naming[no-role-prefix]
# Slice 7a task 3 — the pre-apply Longhorn snapshot k8s/manifests takes via k8s/volume-snapshot.
# Declared regardless of k8s_autodeploy — protects a manual deploy too, and slice 7b's revert
# is what this role's auto-deploy now depends on.
k8s_autodeploy_snapshot_pvcs: [freshrss-config]  # noqa var-naming[no-role-prefix]
freshrss_k8s_cpu_limit: "1"
freshrss_k8s_mem_limit: 512Mi
freshrss_k8s_cpu_request: "100m"
freshrss_k8s_mem_request: 64Mi
# Mirrors resources('0.50', '128M', '0.05', '16M') for the nginx sidecar.
freshrss_k8s_cache_cpu_limit: "500m"
freshrss_k8s_cache_mem_limit: 128Mi
freshrss_k8s_cache_cpu_request: "50m"
freshrss_k8s_cache_mem_request: 16Mi

# 86M and 730 files at migration time — mostly the extensions unpacked under
# config/www/freshrss/extensions, which seeding carries across for free because they live
# inside the same directory. Sized with room for the feed database to grow.
freshrss_k8s_claim: freshrss-config
freshrss_k8s_storage_class: longhorn
freshrss_k8s_size: 2Gi
freshrss_k8s_source_path: /home/ubuntu/server/containers/freshrss/config

# Whether this cluster seeds the config volume from the pre-migration Docker tree.
#
# DECIDED 2026-08-28: per-cluster. `seed_volume_source_path` above is a path on
# `seed_volume_source_host` (daniel-server), and it no longer exists — Docker was uninstalled
# there on 2026-08-14 and the tree went with it. Prod never notices: its PV already carries the
# seed label, so seed-volume short-circuits and never reads the source. A cluster with a FRESH
# PVC has no such label, so the copy decision resolves to true and the deploy fails trying to
# tar a directory that is gone.
#
# With this false, k8s/seed-volume is skipped entirely and `pvc.yaml` is rendered instead, so
# the claim still exists and FreshRSS runs its own first-boot setup against an empty volume —
# which is what a staging cluster wants anyway.
#
# Gating the include rather than adding an input to seed-volume is deliberate. The seed pod,
# the readiness wait and the marker check are gated on `seed_volume_short_circuit`, while only
# the quiesce is gated on `seed_volume_copying`, so a "do not copy" input would have to feed
# both — and the copy-decision expression carries a comment recording that mutating it renders
# True and would tar a long-gone source over all 25 live volumes. Not a line to reshape for
# staging's benefit.
freshrss_k8s_manage_seed: true
