---
# @sha256-pinned as well as tagged, so the k8s-defaults Renovate manager tracks digest bumps;
# a bare repo@sha256 would freeze the image with zero update signal instead.
freshrss_k8s_image: lscr.io/linuxserver/freshrss:latest@sha256:bd13d4a611959bad42bd79965d3202c518494bd775be4a0f61e4b81098b18b01
freshrss_k8s_cache_image: nginx:alpine@sha256:df221db836e1754089190208cee7eeda94f233197056426eda74a43ab1abeac2

# Auto-deploy stance — read by gitops_deploy (see the k8s auto-deploy coverage design).
# Migrating state — strategy is Recreate and the config volume is ReadWriteOnce. This role
# tracks :latest by digest, so it rides whatever image lands after Renovate's digest soak with
# no version-scheme signal at all —
# sharper than the -lsNN roles, which at least advertise a version number that CAN be misread.
# Auto-deploy is allowed because k8s/manifests takes a pre-apply Longhorn snapshot of the claim
# below and reverts it if the deploy fails, so a bad digest swap reverts instead of migrating
# the config volume with no version signal to have even warned about it.
k8s_autodeploy: true  # noqa var-naming[no-role-prefix]
k8s_autodeploy_reason: "migrating state — Recreate + RWO PVC, now protected by the pre-apply Longhorn snapshot and revert; still tracks :latest by digest with no version signal to misread"  # noqa var-naming[no-role-prefix]
# The pre-apply Longhorn snapshot k8s/manifests takes via k8s/volume-snapshot.
# Declared regardless of k8s_autodeploy — protects a manual deploy too, and the revert
# is what this role's auto-deploy depends on.
k8s_autodeploy_snapshot_pvcs: [freshrss-config]  # noqa var-naming[no-role-prefix]
freshrss_k8s_cpu_limit: "1"
freshrss_k8s_mem_limit: 512Mi
freshrss_k8s_cpu_request: "100m"
freshrss_k8s_mem_request: 64Mi
# Mirrors resources('0.50', '128M', '0.05', '16M') for the nginx sidecar.
freshrss_k8s_cache_cpu_limit: "500m"
freshrss_k8s_cache_mem_limit: 128Mi
freshrss_k8s_cache_cpu_request: "50m"
freshrss_k8s_cache_mem_request: 16Mi

# 86M and 730 files — mostly the extensions unpacked under
# config/www/freshrss/extensions. Sized with room for the feed database to grow.
freshrss_k8s_claim: freshrss-config
freshrss_k8s_storage_class: longhorn
freshrss_k8s_size: 2Gi

# The claim k8s/manifests renders and applies for this role, ahead of the pre-apply snapshot.
k8s_claims:  # noqa var-naming[no-role-prefix]
  - name: "{{ freshrss_k8s_claim }}"
    storage_class: "{{ freshrss_k8s_storage_class }}"
    size: "{{ freshrss_k8s_size }}"
