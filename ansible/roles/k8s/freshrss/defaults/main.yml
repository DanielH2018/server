---
# @sha256-pinned as well as tagged, so the k8s-defaults Renovate manager tracks digest bumps;
# a bare repo@sha256 would freeze the image with zero update signal instead.
freshrss_k8s_image: lscr.io/linuxserver/freshrss:latest@sha256:3bdf970c2baebb4e8c8753c84e44c87991888311a437466d669b0016bb7e89c5
freshrss_k8s_cache_image: nginx:alpine@sha256:a3554c0d0b48177b1413c26e01f695334428020d9df01243fbae3e11cfd17417

# Auto-deploy stance — read by gitops_deploy (see the k8s auto-deploy coverage design).
# Migrating state — strategy is Recreate and the config volume is ReadWriteOnce. This role
# tracks :latest by digest, so it rides whatever image lands after Renovate's digest soak with
# no version-scheme signal at all —
# sharper than the -lsNN roles, which at least advertise a version number that CAN be misread.
# Auto-deploy is allowed because Flux's freshrss-snapshot Job snapshots the claim below before
# each revision applies. A failed revision that changes freshrss writes the stateful hold without
# a reset, and the operator reverts the claim through docs/volume-snapshot-drills.md, so a bad
# digest swap can be reverted instead of leaving the config volume migrated with no version
# signal to have even warned about it.
k8s_autodeploy: true  # noqa var-naming[no-role-prefix]
k8s_autodeploy_reason: "migrating state — Recreate + RWO PVC, protected by the freshrss-snapshot Job before each revision and an operator revert to it after a failed one; still tracks :latest by digest with no version signal to misread"  # noqa var-naming[no-role-prefix]
# The claim snapshotted before each revision applies. Under Flux the renderer turns this
# list into the freshrss-snapshot Kustomization, whose Job snapshots it before freshrss applies
# (D5.2a). After a handback, k8s/manifests takes the same snapshot through k8s/volume-snapshot.
# The snapshot is the recovery point this role's auto-deploy depends on.
k8s_autodeploy_snapshot_pvcs: [freshrss-config]  # noqa var-naming[no-role-prefix]
freshrss_k8s_cpu_limit: "1"
freshrss_k8s_mem_limit: 512Mi
freshrss_k8s_cpu_request: "100m"
freshrss_k8s_mem_request: 64Mi
# Mirrors resources('0.50', '128M', '0.05', '16M') for the nginx sidecar.
freshrss_k8s_cache_cpu_limit: "500m"
freshrss_k8s_cache_mem_limit: 128Mi
freshrss_k8s_cache_cpu_request: "50m"
freshrss_k8s_cache_mem_request: 16Mi

# 86M and 730 files — mostly the extensions unpacked under
# config/www/freshrss/extensions. Sized with room for the feed database to grow.
freshrss_k8s_claim: freshrss-config
freshrss_k8s_storage_class: longhorn
freshrss_k8s_size: 2Gi

# The claim the renderer emits for this role. The freshrss Kustomization applies it after the
# freshrss-snapshot Job; after a handback, k8s/manifests applies it ahead of the pre-apply
# snapshot.
k8s_claims:  # noqa var-naming[no-role-prefix]
  - name: "{{ freshrss_k8s_claim }}"
    storage_class: "{{ freshrss_k8s_storage_class }}"
    size: "{{ freshrss_k8s_size }}"
