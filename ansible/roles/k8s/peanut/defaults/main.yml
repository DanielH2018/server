---
# Tag KEPT alongside the digest (repo:latest@sha256) so Renovate's k8s-defaults manager still
# tracks it for digest-bump PRs — a bare repo@sha256 would freeze it with zero update signal.
peanut_k8s_image: brandawg93/peanut:latest@sha256:b58b9627f77448f25e29f772870ee01f0f5a245c6ad7d6e0d7f620d1bb0fb623
# peanut's image has no cp, so the seed-config initContainer uses alpine instead. Same init image zigbee2mqtt and
# home-assistant use.
peanut_k8s_init_image: alpine:3.24@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a

# Auto-deploy stance — read by gitops_deploy (see the k8s auto-deploy coverage design).
# Stateless RollingUpdate Deployment, no PVC, readinessProbe, digest-pinned image. Talks to the
# nut Service as a client only — it owns no UPS state of its own.
k8s_autodeploy: true  # noqa var-naming[no-role-prefix]
k8s_autodeploy_reason: "stateless RollingUpdate Deployment, no PVC, readinessProbe, digest-pinned image"  # noqa var-naming[no-role-prefix]

# Blast-radius caps for peanut itself; the nut role carries its own.
peanut_k8s_cpu_limit: "500m"
peanut_k8s_mem_limit: 256Mi
peanut_k8s_cpu_request: "50m"
peanut_k8s_mem_request: 32Mi
# upsd's port on the in-cluster `nut` Service.
peanut_k8s_nut_port: 3493
