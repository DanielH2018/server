---
# Tag KEPT alongside the digest (repo:tag@sha256) so Renovate's k8s-defaults manager still
# tracks it for digest-bump PRs — a bare repo@sha256 would freeze it with zero update signal.
headlamp_k8s_image: ghcr.io/headlamp-k8s/headlamp:v0.45.0@sha256:db3f0e0fc58d358d41daa3fe7fc852437552c7ee873c3645470f7b86a8e0db49

# Auto-deploy stance — read by gitops_deploy (see the k8s auto-deploy coverage design).
# Stateless: RollingUpdate Deployment, no PVC, readinessProbe, digest-pinned image. The
# netpol-probe Job below is a one-shot check, not a workload the rollout gate needs to cover.
k8s_autodeploy: true  # noqa var-naming[no-role-prefix]
k8s_autodeploy_reason: "stateless RollingUpdate Deployment, no PVC, readinessProbe, digest-pinned image"  # noqa var-naming[no-role-prefix]

headlamp_k8s_cpu_limit: "500m"
headlamp_k8s_mem_limit: 256Mi
headlamp_k8s_cpu_request: "20m"
headlamp_k8s_mem_request: 64Mi
# The upstream image's uid/gid (charts/headlamp/templates/deployment.yaml runs 100:101).
headlamp_k8s_uid: 100
headlamp_k8s_gid: 101
# How long a browser session survives before Headlamp re-reads the ServiceAccount token.
headlamp_k8s_session_ttl: 86400
headlamp_k8s_netpol_probe_image: alpine:3.24@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
# CRD groups the built-in `view` ClusterRole cannot cover — nothing aggregates into `view`,
# so a group missing here degrades silently: the UI loads, that one resource list is empty,
# and it reads as "the cluster has none of those". Mirrors k3s_readonly_crd_api_groups
# (roles/setup/k3s/defaults) plus the two k3s-internal groups a cluster UI wants to show;
# that var is a different role's default and is not in scope for the k8s deploy play.
headlamp_k8s_crd_api_groups:
  - traefik.io
  - metallb.io
  - longhorn.io
  - helm.cattle.io
  - k3s.cattle.io

# Headlamp plugins, installed by the `fetch-plugins` init container in deployment.yaml.j2.
# The upstream image ships NO plugins: Prometheus charts on workload pages, Flux views and the
# rest are each a plugin from github.com/headlamp-k8s/plugins, released as
# <name>-<version>.tar.gz and unpacked to /headlamp/plugins/<name>/. The init container
# downloads each tarball on every pod start, refuses a checksum mismatch, and refuses to start
# the pod when GitHub is unreachable — a dashboard down during a GitHub outage is the trade
# for keeping the plugin out of the image and out of git.
#
# To add a plugin: one entry here. Renovate opens the version bump (renovate.json, the
# `headlamp plugins` manager); the sha256 is NOT derivable from the release, so the PR is a
# signal the operator finishes:
#   gh release download <name>-<ver> -R headlamp-k8s/plugins -p '<name>-<ver>.tar.gz' -D /tmp
#   sha256sum /tmp/<name>-<ver>.tar.gz
headlamp_k8s_plugins:
  # Charts on Pod/Deployment/... detail pages. It finds Prometheus by the
  # `headlamp-prometheus: "true"` label on the Service in roles/k8s/claude-otel and queries it
  # through the API server's service proxy, which is what the Role in rbac.yaml.j2 grants.
  - name: prometheus
    version: "0.9.1"
    sha256: 06afabe42da69e8e0c5c2632acc3fee020566825d2ae71ff8e4f3dd7f78fc4ae
