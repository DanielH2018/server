---
# Longhorn holds every PVC. The app manifest is an in-tree copy, files/upstream/longhorn.yaml,
# byte for byte what the item's `url` serves. No render may fetch a URL (D5, C1), so the renderer
# attaches the copy to this tag's bundle verbatim, and `sha256` still describes what Flux applies.
# scripts/dev/vendor_manifest.py owns the item's shape and the refresh:
#   uv run python scripts/dev/vendor_manifest.py longhorn
# Merging a bump of the version is the upgrade (H1 Open question 6): land it through land.sh,
# which runs the longhorn-upgrade gates, one minor per PR. Run the refresh in the same PR and read
# docs/longhorn-upgrade.md.
#
# Longhorn holds every PVC, and a careless bump is worse than a stale one: Longhorn has
# version-to-version upgrade constraints and does not support arbitrary version skips. Tracked
# for the signal, never automerged.
# renovate: datasource=github-releases depName=longhorn/longhorn
k3s_longhorn_version: v1.13.0  # noqa var-naming[no-role-prefix]
longhorn_vendored_manifests:
  - name: longhorn.yaml
    url: "https://raw.githubusercontent.com/longhorn/longhorn/{{ k3s_longhorn_version }}/deploy/longhorn.yaml"
    fetched_url: "https://raw.githubusercontent.com/longhorn/longhorn/v1.13.0/deploy/longhorn.yaml"
    sha256: "d0f99488e7b2789312d45b0127ce7388df71a971e6fca2085e88635303cc0a1f"

# Memory REQUEST only (no limit) for longhorn-manager, applied by files/patches/longhorn-manager.yaml.
# A kustomize patch is copied verbatim, so the patch holds the literal and
# ansible/tests/longhorn/test_longhorn_control_plane_resources.py holds the two equal.
# Upstream's deploy/longhorn.yaml ships longhorn-manager with an empty `resources: {}`, which gives
# BestEffort QoS and oom_score_adj 1000 — the worst possible score, so the kernel eats the storage
# control plane first under any memory pressure. Measured at the OOM kill: longhorn-manager held
# 137 MB anon-rss, while instance-manager (already Burstable) survived untouched. A REQUEST alone
# moves the pod to Burstable and drops oom_score_adj without adding a new kill path — a LIMIT set
# too low would trade "killed by badness" for "killed by cgroup cap". Headroom is roughly double
# the measured RSS: enough to absorb ordinary growth without inflating node allocatable so far
# that real pressure elsewhere goes unschedulable.
k3s_longhorn_manager_memory_request: 256Mi  # noqa var-naming[no-role-prefix]

# Memory REQUEST only (no limit) for the four csi-* sidecar Deployments (csi-attacher,
# csi-provisioner, csi-resizer, csi-snapshotter), applied through the
# `system-managed-csi-components-resource-limits` Setting (templates/settings.yaml.j2).
# longhorn-driver-deployer creates the Deployments at runtime with `resources: {}`, which gives
# BestEffort QoS and oom_score_adj 1000, the same exposure as the manager above. Measured at the
# OOM kill: a csi-* sidecar held 97 MB anon-rss. The request is roughly double that, for the same
# reasons as the manager's.
#
# DECIDED: the Setting is the one writer. longhorn-manager's SettingController treats the Setting
# as the source of truth for these four containers' `resources` and clears any field it does not
# name, hourly. Until #5958 the `longhorn-reconcile` CronJob patched the request onto the
# Deployments, the manager cleared it, and each Deployment rolled about twice an hour. The driver
# deployer also reads the Setting when it creates a Deployment, so a recreated one starts with
# the request.
k3s_longhorn_csi_sidecar_memory_request: 192Mi  # noqa var-naming[no-role-prefix]

# The Longhorn Settings this role renders (templates/settings.yaml.j2), each under the name
# it had in setup/k3s's defaults. Flux applies them, so a change here is a change to the live
# Setting once the tag promotes. Longhorn-manager creates each with its upstream default and
# keeps its own annotation and status on the object.

# Two replicas, one per node, which is what makes replication, and therefore failover, exist.
# More replicas than nodes would leave every volume permanently "degraded" — upstream's
# StorageClass ships 3.
#
# This reaches volumes through the `default-replica-count` setting alone, which only applies
# to StorageClasses that do not pin a count themselves. That is why the role replaces
# upstream's class with the `longhorn` role's files/patches/longhorn-storageclass.yaml, which
# deliberately omits numberOfReplicas — so changing this stays a Setting change.
k3s_longhorn_replica_count: 2  # noqa var-naming[no-role-prefix]

# How hard Longhorn checks a snapshot disk file against its recorded checksum. Upstream's
# default is `fast-check`, which re-hashes only when the file is unhashed or its mtime moved —
# and upstream states plainly that "filesystem-unaware corruption cannot be detected" in that
# mode (longhorn-manager v1.12.1, types/setting.go). Bit rot does not move mtime, so the exact
# failure this setting exists to catch goes uncovered in that mode.
#
# `enabled` hashes every snapshot disk file on the snapshot-data-integrity-cronjob schedule
# (`0 0 */7 * *` here — the 1st, 8th, 15th, 22nd and 29th). That is CPU and disk-read work on a
# two-node cluster whose storage control plane was OOM-killed once under memory pressure
# (#1243), so the cost was measured before this was kept. DECIDED: keep `enabled`. MEASURED
# 2026-09-11 on a fire forced by overriding the schedule key below, 73 snapshots across 44 volumes
# (50 GB of replica data per node): the run took 6m21s and read ~24 GB per node at 40-57 MB/s.
# The hashing CPU is instance-manager's own, 0.21 → 0.37-0.50 cores over the window; node-level
# CPU is not attributable, because daniel-box swings 1.6-2.4 cores across any 7-minute window.
# instance-manager's working set did not move (1.44 GB before, during and after), MemAvailable
# never dropped below 17.5 GB, and no Longhorn pod restarted — the memory pressure #1243 warns
# about did not appear. Six minutes every seventh day at 00:00 UTC is acceptable. The numbers
# and the queries that produced them are on #1364.
k3s_longhorn_snapshot_data_integrity: enabled  # noqa var-naming[no-role-prefix]

# When the integrity check above runs. Upstream's default, restated here so the schedule is a
# variable rather than a value only the cluster knows: `0 0 */7 * *` is a DAY-OF-MONTH step on
# the manager's clock (UTC), so it fires at 00:00 on the 1st, 8th, 15th, 22nd and 29th, not
# "every seven days". To fire a check early, land a change that sets this to a one-shot daily
# minute such as `55 12 * * *`, then land its revert. Flux owns the Setting, so a hand patch is
# reverted at the next reconcile. Never use a repeating `*/N` for it: a full-hash schedule stranded by a dead session risks the
# memory pressure that OOM-kills the storage control plane.
# Same DataEngineSpecific JSON-map shape as the mode above.
k3s_longhorn_snapshot_data_integrity_cronjob: "0 0 */7 * *"  # noqa var-naming[no-role-prefix]

# Back up detached volumes too. pi-peer-backup-data is mounted only for the minutes its
# nightly pull CronJob runs, so at the 03:30 daily-backup tick it is detached — and with
# this off, Longhorn silently skips it, leaving the WireGuard peer copy with no off-site
# backup. "true" attaches such a volume in maintenance mode for the
# backup and detaches it after; the attach is brief and it is the only detached
# default-group volume, so the global scope costs nothing.
k3s_longhorn_backup_detached_volumes: "true"  # noqa var-naming[no-role-prefix]

# Block size, in MiB, for volumes created from here on. Every B2 cost Longhorn incurs is priced
# PER BLOCK: pruning a backup issues ~1.28 Class C LISTs per stored block (it walks the volume's
# whole block tree), backing up issues one Class B HeadObject per changed block, and restoring
# issues one Class B GET per block. Block size is the only lever that moves all three at once.
#
# Upstream's default is 2. At that size the store held 3,472 blocks, so a
# full-cluster restore would need ~3,472 Class B against a 2,500/day free-tier cap — 139%, which
# means a total-loss recovery CANNOT complete in a day. At 16 that is ~434 blocks, about a sixth
# of one day's allowance, and disaster recovery stops being rationed by transactions.
#
# NEW VOLUMES ONLY, and this is the trap: the field is immutable per volume, so every PVC created
# while this reads 2 is locked at 2 until it is destroyed and recreated. Flipping it costs nothing
# and changes nothing that already exists — the saving accrues only as volumes are replaced.
#
# Longhorn accepts 2 or 16 and nothing between. Governed by the SETTING rather than the
# StorageClass on purpose: a StorageClass parameter beats the setting and its parameters are
# immutable, which is the trap `numberOfReplicas` springs (see
# the `longhorn` role's files/patches/longhorn-storageclass.yaml and
# ansible/tests/longhorn/test_longhorn_storageclass.py).
k3s_longhorn_backup_block_size: 16  # noqa var-naming[no-role-prefix]

# How many volume engines Longhorn upgrades per node once the manager moves to a new version.
# Upstream ships 0, which means engines NEVER follow the manager — after a version bump every
# volume keeps running the old engine image until someone walks the UI. Across the v1.7.2 ->
# v1.12.1 ladder (docs/longhorn-upgrade.md) that lag would compound over five hops, and a
# manager more than one engine version ahead is outside what upstream tests. 3 upgrades the
# healthy volumes a few at a time rather than all at once; Longhorn skips any volume that
# is degraded, so this cannot stampede a rebuild.
k3s_longhorn_concurrent_engine_upgrade: 3  # noqa var-naming[no-role-prefix]

# What Longhorn does with a pod whose node goes down while the pod holds an RWO volume.
# `do-nothing` is upstream's default: the pod stays Terminating, so its volume stays attached
# to the dead node, until an operator force-deletes it. The rejected values
# (`delete-statefulset-pod`, `delete-deployment-pod`,
# `delete-both-statefulset-and-deployment-pod`) have Longhorn force-delete the pod and move the
# volume to the survivor unattended.
# DECIDED: `do-nothing` — keep the stateful failover a human step on this two-node cluster.
# There is no fencing and no third node, so Longhorn cannot tell a dead daniel-server from one
# cut off from daniel-box: an automatic delete on a partition would run a second copy of the
# workload against the other replica. The survivor also lacks the memory for the lost node's
# whole load until the shed set is scaled to zero (docs/break-glass.md, *daniel-server is
# dead*), and that step is manual too. Stateless pods still reschedule on their own. Revisit
# when a third node or a fencing mechanism exists.
k3s_longhorn_node_down_pod_deletion_policy: do-nothing  # noqa var-naming[no-role-prefix]

# The longest the tag's Kustomization waits for longhorn-manager to roll. The DaemonSet rolls with
# maxUnavailable 100%, so both pods are replaced at once and the wait is one pod's start time, not
# two. The literal is `manifests_rollout_timeout` because the renderer reads a role's Flux
# timeout from that key.
# Measured 2026-10-22: 36s from deleting both manager pods to both replacements Ready (30s of it
# termination grace), doubled and rounded up to a minute. Cited in #5922.
manifests_rollout_timeout: 2m  # noqa var-naming[no-role-prefix]

# DECIDED: never pruned. Under prune: true, a render that dropped the manager DaemonSet or a CRD
# would make Flux delete it, and deleting a Longhorn CRD deletes every Volume, Engine and Replica
# CR of its kind: every PVC detaches at once. With prune: false a render that drops an object
# leaves it serving. The cost is that an object removed here, or retired by a later upstream
# release, stays live until the operator deletes it (**operator-only**). Full analysis: the H1
# plan's *Plumbing tags are never pruned*.
flux_prune: false  # noqa var-naming[no-role-prefix]

# Forward-only (the H1 plan's *Forward-only tags and the promote rule*). Longhorn supports no
# downgrade, so a promote that fails on a revision changing this tag holds without resetting
# `prod`. H1.5a (#5922) omitted this flag; the H1 plan names longhorn, so #5927 sets it.
# scripts/deploy_tools/promote_lib/forward_only.py reads the flag from a top-level line.
flux_forward_only: true  # noqa var-naming[no-role-prefix]

# Auto-deploy stance. Flux applies the tag, so this gates no apply; the reason records why a bad
# merge here is not a routine bump.
k8s_autodeploy: false  # noqa var-naming[no-role-prefix]
k8s_autodeploy_reason: "platform — Longhorn holds every PVC; a bad apply or a version skip detaches or corrupts the volumes under every stateful service, and host probes stay green through that outage"  # noqa var-naming[no-role-prefix]
