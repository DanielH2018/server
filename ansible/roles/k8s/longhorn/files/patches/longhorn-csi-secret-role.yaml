---
# Drops the ClusterRole that longhorn-csi-secret-bind.yaml's binding granted (#5969). Unbound it
# grants nothing, but keeping it would leave a cluster-wide Secret `get` one binding away. The
# reasons and the precondition for reverting are in longhorn-csi-secret-bind.yaml.
$patch: delete
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: longhorn-csi-secret-role
