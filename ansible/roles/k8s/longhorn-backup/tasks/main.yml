---
# No Flux path runs this file: the tag is flux-owned from its first commit. It stays so the role
# has the shape every k8s role has, and the renderer reads the include's vars. The objects are the
# two credential Secrets, the BackupTargets `default` and `r2`, and the RecurringJobs. There is no
# workload to roll, and the objects live in `longhorn-system`, which the `longhorn` tag creates.
- name: Deploy the Longhorn backup plane to the cluster
  ansible.builtin.include_role:
    name: k8s/manifests
  vars:
    manifests_prune_namespace: "{{ k8s_longhorn_namespace }}"
    manifests_rollout: ''
