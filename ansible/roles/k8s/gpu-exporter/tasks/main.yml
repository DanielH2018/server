---
# gpu-exporter: DRM sysfs turned into `homelab_gpu_*` series, one pod per node. It measures the
# render node the dri-device-plugin advertises, so a slow jellyfin or tdarr transcode can be
# told from a contended one. The scrape job lives in observability's prometheus.yaml.j2
# (job_name: gpu).

- name: Deploy gpu-exporter to the cluster
  ansible.builtin.include_role:
    name: k8s/manifests
  vars:
    manifests_rollout: gpu-exporter
    # `daemonset` literally: the assert in k8s/manifests refuses kubectl's `ds`/`DaemonSet`
    # aliases, because the stabilise gate would then read a Deployment's jsonpath off this and
    # pass on 0 == 0.
    manifests_rollout_kind: daemonset
    # No Service, though the entry carries a `port`: the `gpu` scrape job discovers each pod, and
    # a ClusterIP over the two pods would flip one series between two GPUs (CLAUDE.md).
    manifests_exclude_files: [service.yaml]
