---
# The host half of the UPS stack is package-owned on both cluster nodes: hosts/components/nut-secondary
# ships the secondary upsmon's drop-in, the rendered upsmon.conf and the watchdog timer, and
# daniel-server's package also ships the APC udev rule. The k8s/nut pod (upsd + driver + primary
# upsmon) is the other half. docs/target-architecture/host/h7-delete-ansible.md, H7.33.

# DECIDED: this role is emptied, never deleted, until H7.20a. A play that names a missing role
# fails to parse, so deleting the role would mean editing initial_setup.yml, which is in the
# deployer's _BROAD_MANUAL_PREFIXES and parks every session's landing. An unconditional end_role
# keeps the playbook line, and the tick applies the role on daniel-box as a no-op.
# setup_gates.role_end_guard reads this task, so the two-writer census and the setup census count
# the role as empty on every host. The role's templates and defaults stay in the role directory
# because hosts/components/nut-secondary renders them (`role: nut_host`) until H7.20a moves them.
- name: End the role, whose work the host packages own
  ansible.builtin.meta: end_role
