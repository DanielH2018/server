---
# The builder's arm (docs/target-architecture/host/h3-pi-pilot.md, *Steps, as PRs*, item 5).
# True runs install.yml on the GitOps host. False runs teardown.yml, so turning the builder
# off is this flag and the setup-plane tick; the teardown keeps the signer's GnuPG home.
homelab_builder_enabled: true

# The state directories (*Shared names*, Builder state). The builder owns its own; the signer
# owns the GnuPG home and the published tree. Teardown removes the builder's and never the
# signer's.
homelab_builder_state_dir: /var/lib/homelab-builder
homelab_builder_signer_dir: /var/lib/homelab-signer

# The apt repository: python3's http.server over the signer's repo/ on daniel-box's
# server_ip (*Shared names*, Repository).
homelab_builder_repo_port: 8791

# The hosts that read the repository. ufw admits homelab_builder_repo_port from these two
# addresses. Each is a peer's server_ip, never a typed address and never lan_subnet.
#
# DECIDED: the rule admits every pod on daniel-server as well as the host itself — flannel
# masquerades a pod's traffic to an address outside the pod CIDR to that node's LAN IP (see
# roles/setup/k3s/tasks/node.yml), so a pod arrives as daniel-server's server_ip and matches
# the allow. The repository serves only signed, public packages, so the wider reach exposes no
# data, and nothing at L3 tells the host apart from its pods.
homelab_builder_repo_clients:
  - "{{ hostvars['daniel-server'].server_ip }}"
  - "{{ hostvars['daniel-pi'].server_ip }}"

# The signing key's user ID. `gpg --quick-generate-key` takes it once, behind a creates:
# guard, so changing it later renames nothing.
homelab_builder_key_uid: "homelab archive signing key <homelab-archive@daniel-box>"
