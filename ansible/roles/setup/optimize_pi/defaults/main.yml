---
# The nameserver lines this host's /etc/resolv.conf carries, IN ORDER. First entry wins on
# every query; the rest are fallbacks. The cluster Pi-hole first so the Pi's internal lookups
# stay on the private path; a public resolver behind it so the Pi never DEPENDS on the cluster
# for DNS. That ordering is the point — this is the break-glass host, and its wg-easy tunnel
# is the documented way in when the cluster's own is unreachable
# (roles/containers/wg-easy/CLAUDE.md).
#
# Rendered by the SHARED roles/setup/common/templates/resolv.conf.j2, which carries the
# reasoning and is the same file daniel-box uses. Read it before changing the order.
optimize_pi_dns_servers:
  - "{{ dns_k8s_vip }}"
  - 1.1.1.1

# Seconds to wait for each nameserver, and how many rounds over the WHOLE list to make before
# returning an error — `attempts` is rounds, not per-server retries (resolv.conf(5)). Matches
# daniel-box and daniel-server: a dead Pi-hole costs one 2s timeout per lookup, then answers.
optimize_pi_dns_timeout: 2
optimize_pi_dns_attempts: 1
optimize_pi_dns_options: "timeout:{{ optimize_pi_dns_timeout }} attempts:{{ optimize_pi_dns_attempts }}"

# The apt timers and the daily minute each is pinned to (tasks/main.yml, section 9). Both
# are UTC, in the window between the midnight cluster and the 06:00 hour, update before
# upgrade. `at` is the time half of a systemd OnCalendar (`*-*-* <at>`).
optimize_pi_apt_timers:
  - unit: apt-daily.timer
    at: "04:20"
  - unit: apt-daily-upgrade.timer
    at: "05:20"

# node_exporter as a host unit (tasks/main.yml, section 10). The same version the cluster's
# DaemonSet pins (roles/k8s/node-exporter/defaults/main.yml) and the container ran; noble's
# prometheus-node-exporter package is 1.7.0, five minors behind, so the upstream tarball keeps
# the pin. The checksum is the linux-arm64 line of the release's sha256sums.txt. Renovate does
# not track this; bump it by hand alongside the cluster's. The URL sits beside the digest, not
# inline in the get_url task, so `scripts/validate/asset_pins.py` pairs the two and fetches the
# tarball to check the digest (#2224).
optimize_pi_node_exporter_version: "1.12.1"
optimize_pi_node_exporter_url: "https://github.com/prometheus/node_exporter/releases/download/v{{ optimize_pi_node_exporter_version }}/node_exporter-{{ optimize_pi_node_exporter_version }}.linux-arm64.tar.gz"
optimize_pi_node_exporter_sha256: "ad35b605f9954b9f1ffddf5ba054bdc5a98d790b9eae5291e1eeb83f1ecbd0e7"
