---
# The nameserver lines this host's /etc/resolv.conf carries, IN ORDER. First entry wins on
# every query; the rest are fallbacks. The cluster Pi-hole first so the Pi's internal lookups
# stay on the private path; a public resolver behind it so the Pi never DEPENDS on the cluster
# for DNS. That ordering is the point — this is the break-glass host, and its wg-easy tunnel
# is the documented way in when the cluster's own is unreachable
# (roles/containers/wg-easy/CLAUDE.md).
#
# Rendered by the SHARED roles/setup/common/templates/resolv.conf.j2, which carries the
# reasoning and is the same file daniel-box uses. Read it before changing the order.
optimize_pi_dns_servers:
  - "{{ dns_k8s_vip }}"
  - 1.1.1.1

# Seconds to wait for each nameserver, and how many rounds over the WHOLE list to make before
# returning an error — `attempts` is rounds, not per-server retries (resolv.conf(5)). Matches
# daniel-box and daniel-server: a dead Pi-hole costs one 2s timeout per lookup, then answers.
optimize_pi_dns_timeout: 2
optimize_pi_dns_attempts: 1
optimize_pi_dns_options: "timeout:{{ optimize_pi_dns_timeout }} attempts:{{ optimize_pi_dns_attempts }}"

# The apt timers and the daily minute each is pinned to (tasks/main.yml, section 9). Both
# are UTC, in the window between the midnight cluster and the 06:00 hour, update before
# upgrade. `at` is the time half of a systemd OnCalendar (`*-*-* <at>`).
optimize_pi_apt_timers:
  - unit: apt-daily.timer
    at: "04:20"
  - unit: apt-daily-upgrade.timer
    at: "05:20"

# node_exporter as a host unit (tasks/main.yml, section 10). The same version the cluster's
# DaemonSet pins (roles/k8s/node-exporter/defaults/main.yml); noble's
# prometheus-node-exporter package is 1.7.0, five minors behind, so the upstream tarball keeps
# the pin. The checksum is the linux-arm64 line of the release's sha256sums.txt. Renovate does
# not track this; bump it by hand alongside the cluster's. The URL sits beside the digest, not
# inline in the get_url task, so `scripts/validate/asset_pins.py` pairs the two and fetches the
# tarball to check the digest.
optimize_pi_node_exporter_version: "1.12.1"
optimize_pi_node_exporter_url: "https://github.com/prometheus/node_exporter/releases/download/v{{ optimize_pi_node_exporter_version }}/node_exporter-{{ optimize_pi_node_exporter_version }}.linux-arm64.tar.gz"
optimize_pi_node_exporter_sha256: "ad35b605f9954b9f1ffddf5ba054bdc5a98d790b9eae5291e1eeb83f1ecbd0e7"

# /etc/log2ram.conf — the premise every cap in tasks/main.yml section 7 is computed from.
# log2ram 1.7.2 SHIPS exactly these four values, and daniel-pi's copy is byte-identical to
# upstream's (md5 f62aef1aeae1473882baba0e521f752e, which is also the conffile md5 dpkg
# recorded, so nothing there was ever hand-edited). Declaring them therefore writes nothing
# today; it costs something only at the moment an upstream default MOVES, which is exactly when
# the caps below need the number pinned — log2ram shipped SIZE=40M before it shipped 128M, and a
# package default that moves under a 32M journald cap either overflows the tmpfs or wastes RAM
# on a 512 MB board, with nothing to announce it.
optimize_pi_log2ram_size: 128M
# ZL2R decides WHICH of the two sizes governs: false means /var/log is a plain tmpfs of
# `optimize_pi_log2ram_size`, so the two zram-backing values below are inert and declared as a
# record of the mode this host is not in. Flipping ZL2R to true makes them live.
optimize_pi_log2ram_zram_backed: "false"
optimize_pi_log2ram_disk_size: 256M
optimize_pi_log2ram_comp_alg: lz4

# The daily rotated-log integrity sweep (templates/pi-gz-integrity.sh.j2). It `gzip -t`s every
# rotated log and writes a verdict the 5-minute SD-health heartbeat folds into its Kuma push.
#
# BOTH roots, and /var/hdd.log is the load-bearing one: /var/log is log2ram's RAM tmpfs, while
# /var/hdd.log is the copy on the SD card and the destination of the sync that corrupted 37
# files. Against the live Pi the sweep found 37 of 144 files failing, every one of them under
# /var/hdd.log and none under /var/log.
optimize_pi_gz_integrity_roots:
  - /var/log
  - /var/hdd.log
# Non-vacuity floor: a glob that matches nothing passes `gzip -t` trivially, so a logrotate
# config change or a moved root would turn the sweep green forever. 144 files across both roots;
# /var/log alone swings 35-72 over a logrotate cycle, so 40 sits below the
# trough of either root and well above zero.
optimize_pi_gz_integrity_min_files: 40
# /var/lib, NOT /var/log: a verdict written into log2ram's tmpfs is gone after a reboot, and the
# heartbeat would then read "no verdict" (a down) until the next daily sweep.
optimize_pi_gz_integrity_state_file: /var/lib/pi-health/gz-integrity.state
# How old a verdict the heartbeat still trusts. Longer than the sweep's daily period so one
# missed run is tolerated; shorter than two, so a sweep that stops running goes down rather
# than reporting yesterday's verdict forever.
optimize_pi_gz_integrity_max_age_h: 26

# Arms the container-recovery cron (tasks/main.yml, `Schedule the container-recovery heartbeat`).
# True installs the cron; false REMOVES it, which is the reversal a role re-run respects — where
# editing the task to `state: absent` is a repo edit another session's `--tags recovery-health`
# run silently undoes. Set it per host in `inventory/host_vars/daniel-pi.yml`, so the intent
# lives in the inventory rather than in a working tree.
#
# It ships TRUE, unlike renovate_agent's switch: the cron is the only thing that restarts a
# container whose *create* failed at the OCI runtime — `restart: unless-stopped` does not. A
# default-off flag would make the next `--tags recovery-health` run remove the live cron.
#
# Detection and remediation share one script, so disarming ends the heartbeat too: the "Daniel
# Pi Recovery" Kuma monitor trips its 600s watchdog within ten minutes. That is the intended
# signal, not a second fault.
# ENFORCED: ansible/tests/setup/test_pi_recovery_restarts_and_reports.py.
optimize_pi_recovery_restart_enabled: true
