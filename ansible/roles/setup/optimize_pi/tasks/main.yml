---
- name: Set variables
  # Dual-tagged: vars are consumed by the gpu_mem task AND the zram task.
  # zram 75% of RAM is the device's UNCOMPRESSED capacity (~343 MB), not its RAM
  # cost — with zstd (~3.5:1 on typical anon pages) a full device costs ~98 MB
  # physical, about what lz4 paid for the old 50% device. Net: +115 MB swap
  # capacity before the SD-card swapfile gets touched, for free.
  tags: [gpu-mem, zram]
  ansible.builtin.set_fact:
    optimize_pi_gpu_memory_mb: 16
    optimize_pi_zram_percentage: 75

# 1. DYNAMIC CONFIG PATH DETECTION (Bookworm vs Bullseye)
- name: Check if /boot/firmware/config.txt exists (Bookworm)
  # Dual-tagged: the resolved config path is used by gpu_mem AND the watchdog dtparam.
  tags: [gpu-mem, watchdog]
  ansible.builtin.stat:
    path: /boot/firmware/config.txt
  register: optimize_pi_firmware_config

- name: Set config.txt path variable
  tags: [gpu-mem, watchdog]
  ansible.builtin.set_fact:
    optimize_pi_rpi_config_path: "{{ '/boot/firmware/config.txt' if optimize_pi_firmware_config.stat.exists else '/boot/config.txt' }}"

# 2. GPU MEMORY SPLIT (Reclaim RAM)
- name: Set GPU memory MB to {{ optimize_pi_gpu_memory_mb }}
  tags: [gpu-mem]
  ansible.builtin.lineinfile:
    path: "{{ optimize_pi_rpi_config_path }}"
    regexp: "^gpu_mem="
    line: "gpu_mem={{ optimize_pi_gpu_memory_mb }}"
    mode: "0755"
    create: true
  notify: Reboot Pi

# 3. ZRAM CONFIGURATION (Compressed RAM)
- name: Install zram-tools
  tags: [zram]
  ansible.builtin.apt:
    name: zram-tools
    state: present
    update_cache: true
  become: true

- name: Configure ZRAM percentage and compression algorithm
  tags: [zram]
  ansible.builtin.lineinfile:
    path: /etc/default/zramswap
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
  loop:
    - regexp: "^PERCENT="
      line: "PERCENT={{ optimize_pi_zram_percentage }}"
    # zstd is ~3.5:1 vs lz4's ~2.5:1 on this workload — the better ratio is what makes the
    # 75% device size affordable. zstd costs more CPU per page than lz4, but the A53 cores
    # idle ~95% here; the SD-card swapfile this avoids is FAR slower.
    - regexp: "^#?ALGO="
      line: "ALGO=zstd"
  loop_control:
    label: "{{ item.regexp }}"
  notify: Restart ZRAM

- name: Prefer zram swap over page-cache eviction (vm.swappiness=130)
  tags: [zram]
  # Kernel default 60 treats swap as expensive (true for the SD swapfile, false
  # for zram). >100 (valid on 5.8+; this is 6.8) tells reclaim that compressing
  # an idle anon page is cheaper than re-reading a hot file page from SD.
  # daniel-server runs swappiness=10 for the opposite reason — see initial_setup.
  ansible.posix.sysctl:
    name: vm.swappiness
    value: "130"
    state: present
    sysctl_set: true
  become: true

- name: Disable swap readahead (vm.page-cluster=0)
  tags: [zram]
  # 3 = 8-page readahead per fault: a win on rotating disks, pure decompression
  # waste on zram where each page is random-access. 0 cuts swap-in latency ~8x.
  ansible.posix.sysctl:
    name: vm.page-cluster
    value: "0"
    state: present
    sysctl_set: true
  become: true

# 4. LOG2RAM (Save SD Card)
- name: Install python3-debian (required by deb822_repository, below)
  tags: [log2ram]
  ansible.builtin.apt:
    name: python3-debian
    state: present
    update_cache: true
  become: true

- name: Add Azlux GPG key for Log2Ram
  tags: [log2ram]
  ansible.builtin.get_url:
    url: https://azlux.fr/repo.gpg
    dest: /usr/share/keyrings/azlux-archive-keyring.gpg
    mode: "0644"

- name: Verify the Azlux GPG key fingerprint
  tags: [log2ram]
  # Fail the play closed if the fetched key is not Azlux's signing key (fingerprint
  # 98B824A5 FA7D3A10 FDB225B7 CA548A0A 0312D8E6, uid "Azlux <github@azlux.fr>"). Azlux is a
  # third-party repo with no prominently-published checksum, so this pins the fingerprint of
  # the key currently trusted on the Pi — a swapped/MITM'd key on a later fetch then fails the
  # play before deb822 trusts it. Runs every play (changed_when: false).
  ansible.builtin.command:
    cmd: gpg --show-keys --with-colons /usr/share/keyrings/azlux-archive-keyring.gpg
  register: optimize_pi_azlux_key_fpr
  changed_when: false
  failed_when: "'98B824A5FA7D3A10FDB225B7CA548A0A0312D8E6' not in optimize_pi_azlux_key_fpr.stdout"

- name: Add Log2Ram repository
  tags: [log2ram]
  # deb822 format (.sources) — the one-line "deb [...] ..." apt_repository form is deprecated.
  ansible.builtin.deb822_repository:
    name: azlux
    types: [deb]
    uris: http://packages.azlux.fr/debian/
    suites: bookworm
    components: [main]
    signed_by: /usr/share/keyrings/azlux-archive-keyring.gpg
    state: present
  become: true

- name: Remove the deprecated one-line Log2Ram APT source
  tags: [log2ram]
  # deb822_repository writes azlux.sources; drop any azlux.list left by the old
  # apt_repository task so apt doesn't see the repo "configured multiple times".
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/azlux.list
    state: absent
  become: true

- name: Install Log2Ram
  tags: [log2ram]
  ansible.builtin.apt:
    name: log2ram
    state: present
    update_cache: true
  notify: Reboot Pi
  become: true

# 5. HARDWARE WATCHDOG (Auto-Reboot on Freeze)
- name: Enable watchdog kernel module in {{ optimize_pi_rpi_config_path }}
  tags: [watchdog]
  ansible.builtin.lineinfile:
    path: "{{ optimize_pi_rpi_config_path }}"
    regexp: "^dtparam=watchdog="
    line: "dtparam=watchdog=on"
  notify: Reboot Pi

- name: Install watchdog daemon
  tags: [watchdog]
  ansible.builtin.apt:
    name: watchdog
    state: present
  become: true

- name: Configure watchdog device
  tags: [watchdog]
  ansible.builtin.lineinfile:
    path: /etc/watchdog.conf
    regexp: "^#?watchdog-device"
    line: "watchdog-device = /dev/watchdog"

- name: Configure watchdog max load (Reboot if load > 24)
  tags: [watchdog]
  ansible.builtin.lineinfile:
    path: /etc/watchdog.conf
    regexp: "^#?max-load-1\\s="
    line: "max-load-1 = 24"
  notify: Restart Watchdog

- name: Ensure watchdog service is enabled
  tags: [watchdog]
  ansible.builtin.service:
    name: watchdog
    enabled: true
    state: started

# 6. DEBLOAT (Reclaim RAM on the 512 MB board)
- name: Purge Open vSwitch (unused) and snapd (no snaps installed)
  tags: [debloat]
  # Found 2026-06-11: openvswitch-switch-dpdk was installed (apt-mark: manual) but
  # `ovs-vsctl show` had no bridges and netplan has no OVS stanzas — yet ovs-vswitchd
  # ran with --mlockall, pinning ~14 MB of unswappable RAM. snapd ran with zero snaps
  # installed. netplan-generator only *Suggests* openvswitch-switch, so this purge is
  # dependency-safe (verified with `apt-get -s purge`: exactly these 4, nothing else).
  ansible.builtin.apt:
    name:
      - openvswitch-switch-dpdk
      - openvswitch-switch
      - openvswitch-common
      - snapd
    state: absent
    purge: true
    autoremove: true
  become: true

- name: Purge fwupd (no LVFS-updatable firmware on a Pi; daemon start thrashes 512 MB RAM)
  tags: [debloat]
  # Found 2026-06-11: fwupd-refresh.timer fired ~hourly; each dbus activation of
  # fwupd.service swapped the Zero 2 W into the ground (zram 100% full, IO PSI
  # full>40%, RCU stalls) — every container healthcheck timed out and autoheal
  # restart-stormed (RestartCount=20 on itself). fwupd never even started: it hit
  # the 25 s dbus activation timeout every time, so it provided nothing. Pi firmware
  # ships via apt (raspi packages), not LVFS. Dependency-safe: `apt-get -s purge`
  # removes exactly fwupd; ubuntu-server/ubuntu-server-raspi only Recommend it.
  # daniel-server already has no fwupd installed, so this is Pi-only debloat.
  ansible.builtin.apt:
    name: fwupd
    state: absent
    purge: true
    autoremove: true
  become: true

- name: Check the purged fwupd units for stale failed state # noqa command-instead-of-module
  tags: [debloat]
  # Found 2026-06-12: apt purge removes the unit files but never runs reset-failed,
  # so units that were `failed` at purge time (fwupd.service hit the 25 s dbus
  # timeout every activation) stay pinned in memory as not-found/failed and pollute
  # `systemctl --failed` until a reset or reboot.
  ansible.builtin.command: systemctl is-failed {{ item }}
  loop: [fwupd.service, fwupd-refresh.service]
  register: optimize_pi_fwupd_unit_state
  changed_when: false
  failed_when: false
  check_mode: false # read-only query; must run under --check or the when: below breaks
  become: true

- name: Clear stale failed state left behind by the purge
  tags: [debloat]
  ansible.builtin.command: systemctl reset-failed {{ item.item }}
  loop: "{{ optimize_pi_fwupd_unit_state.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.stdout == 'failed'
  changed_when: true
  become: true

# Reclaim ~17 MB more on the 512 MB board by shedding a redundant logger, an unused radio's
# supplicant, and a stale init log — all found 2026-07-06 while auditing where the ~310 MB used
# goes (dockerd+containerd+shims are ~108 MB of it and can't be trimmed). Pi-only, since this whole
# role is `when: inventory_hostname == 'daniel-pi'` — the server keeps these (it has RAM to spare).

- name: Disable + mask rsyslog (journald is the log of record here)
  tags: [debloat]
  # journald already captures everything (journalctl works) and fail2ban reads the journal
  # (systemd backend, verified), so rsyslog is a redundant SECOND logger — and its text logs
  # (/var/log/{syslog,kern,auth,daemon}.log) land in the log2ram tmpfs = REAL RAM. Mask, not just
  # disable, so a package/dependency update can't silently re-enable it. journald provides /dev/log
  # via its own socket, so syslog() calls still get captured.
  ansible.builtin.systemd:
    name: rsyslog.service
    state: stopped
    enabled: false
    masked: true
  become: true

- name: Find the stale rsyslog text logs left in the log2ram tmpfs
  tags: [debloat]
  # rsyslog stops writing once masked, but the files it already produced sit in RAM-backed /var/log
  # until logrotate/reboot. Collect them (incl. rotated .1/.gz) to reclaim the RAM now — journald
  # retains the same records and nothing here reads these text files.
  ansible.builtin.find:
    paths: /var/log
    patterns:
      ["syslog*", "kern.log*", "auth.log*", "daemon.log*", "user.log*", "messages*", "debug*"]
    recurse: false
  register: optimize_pi_rsyslog_logs
  become: true

- name: Remove the stale rsyslog text logs
  tags: [debloat]
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ optimize_pi_rsyslog_logs.files }}"
  loop_control:
    label: "{{ item.path }}"
  become: true

- name: Disable + mask wpa_supplicant (the Pi is on wired ethernet; wlan0 is down)
  tags: [debloat]
  # The USB ethernet NIC carries the default route and wlan0 is DOWN, so the WiFi supplicant runs
  # for nothing. Mask, don't purge — netplan / the network stack depend on the wpasupplicant package;
  # this stops the daemon (and the idle radio) without touching those deps.
  ansible.builtin.systemd:
    name: wpa_supplicant.service
    state: stopped
    enabled: false
    masked: true
  become: true

- name: Remove the stale AIDE init log from the log2ram tmpfs (RAM)
  tags: [debloat]
  # /var/log/aide/aide.log is the one-time `aideinit` report (~9 MB, written when the DB was first
  # built). The weekly `aide --check` cron logs to journald (`| logger -t aide`, see initial_setup),
  # NOT here, so this file has been dead since init yet sits in RAM-backed /var/log. Safe to remove:
  # AIDE reads its DB (/var/lib/aide), never this log, and aideinit is `creates:`-guarded (won't rerun).
  ansible.builtin.file:
    path: /var/log/aide/aide.log
    state: absent
  become: true

# 7. LOG RAM BUDGET (log2ram tmpfs is 128 MB of REAL RAM)
# Everything under /var/log lives in log2ram's RAM-backed tmpfs. Found 2026-06-11
# at 81% (103/128 MB): journald carried the server-sized 1G cap from initial_setup
# (would overflow the tmpfs and fail log writes), and acct's savelog kept 30 daily
# pacct generations (36 MB and growing toward ~90 MB). Cap both.

- name: Cap journald to fit the log2ram tmpfs (overrides initial_setup's 1G)
  tags: [log2ram]
  # 60-homelab-pi sorts after initial_setup's 50-homelab.conf, so this wins.
  # journald vacuums archived journals down to the cap on restart.
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/60-homelab-pi.conf
    content: |
      # Managed by Ansible (optimize_pi role) — edits here are overwritten.
      # /var/log is a 128 MB log2ram tmpfs (= RAM); the 1G default would overflow it.
      [Journal]
      SystemMaxUse=32M
      SystemMaxFileSize=8M
    mode: "0644"
  become: true
  notify: Restart systemd-journald

- name: Keep 2 days of sysstat history, not 7 (HISTORY)
  tags: [log2ram]
  # The fourth server-sized default in this tmpfs, and the one the auditd census above
  # missed. initial_setup installs sysstat with its shipped HISTORY=7 (accounting.yml),
  # which on this host is 18 sa/sar files and 9.9 MB of the 128 MB log2ram tmpfs —
  # measured 2026-08-29, second only to journald.
  #
  # CAP, DO NOT DISABLE, for the same reason auditd is capped rather than masked:
  # docs/security-tools.md gives `sar` its own triage row, so a machine-side census that
  # finds no consumer is not evidence nothing reads it. 2 days keeps "what did the box do
  # overnight", which is the window that row actually uses.
  ansible.builtin.lineinfile:
    path: /etc/sysstat/sysstat
    regexp: '^#?HISTORY='
    line: 'HISTORY=2'
  become: true

- name: Keep 3 days of process accounting, not 30 (ACCT_LOGGING)
  tags: [log2ram]
  # /etc/cron.daily/acct rotates pacct with savelog -c $ACCT_LOGGING. The healthcheck
  # exec churn writes ~28 MB/day, all of it RAM via log2ram; 30 generations is a
  # server-disk default. 3 days keeps enough for "what ran last night" forensics.
  ansible.builtin.lineinfile:
    path: /etc/default/acct
    regexp: '^#?ACCT_LOGGING='
    line: 'ACCT_LOGGING="3"'
  become: true

# auditd was the third server-sized default in this tmpfs and the last one left. Measured
# 2026-08-29: /var/log/audit was 28 MB of 128 MB, and 20 MB of that was rotated history dating to
# June 21 and July 15 — auditd's shipped defaults are max_log_file=8 MB with num_logs=5, a 40 MB
# ceiling written for a server disk. It fills slowly (roughly 8 MB every three weeks here), which
# is exactly why it went unnoticed: nothing about it ever moves.
#
# CAP, DO NOT DISABLE. A review proposed masking auditd on the grounds that nothing reads it, and
# the machine-side census behind that was right as far as it went — fail2ban uses `backend =
# systemd` (/etc/fail2ban/jail.d/defaults-debian.conf:4) and promtail ships only container logs.
# What it missed is the HUMAN reader: docs/security-tools.md documents auditd as a deployed
# security tool with a runbook, and its triage table routes "Sensitive file modified" to
# `ausearch -k identity` / `-k sshd`. The same check clears sysstat and acct, which that review
# also proposed removing — `sar` and `lastcomm` have their own sections and triage rows. A census
# that only looks for machine consumers cannot see a documented operator procedure.
#
# Capping keeps the tool and takes back the RAM, which is also what this section already decided
# for journald and acct above.
- name: Cap auditd's rotation to fit the log2ram tmpfs
  tags: [log2ram]
  ansible.builtin.lineinfile:
    path: /etc/audit/auditd.conf
    regexp: "^{{ item.key }}\\s*="
    line: "{{ item.key }} = {{ item.value }}"
  loop:
    # 4 MB x (1 live + 2 rotated) = a 12 MB ceiling, down from 40 MB. At the observed fill rate
    # that is still ~6 weeks of history, well past the window any of the runbook queries use.
    - {key: max_log_file, value: "4"}
    - {key: num_logs, value: "3"}
  loop_control:
    label: "{{ item.key }}"
  register: optimize_pi_auditd_cap
  become: true

- name: Make auditd re-read the capped config # noqa: no-handler
  tags: [log2ram]
  # Inline rather than a `notify:`, deliberately. This role's handlers live in
  # initial_setup.yml (see the role's CLAUDE.md), and that file is one of the deployer's
  # _BROAD_MANUAL_PREFIXES — a commit touching it defers the GitOps tick WITHOUT
  # fast-forwarding, parking every other session's unrelated commits until someone applies
  # the bring-up playbook by hand. A Pi log cap is not worth that, so the reload stays here.
  #
  # `restarted`, and the reverse was tried first. This said `reloaded`, on the general claim
  # that auditd.service ships RefuseManualStop=yes with an ExecReload — which is written about
  # Debian/Ubuntu widely enough to sound safe, and is FALSE on this host. Measured 2026-08-29
  # with `systemctl show auditd`: `CanReload=no` and `RefuseManualStop=no`, the opposite of
  # both halves. The apply failed with:
  #
  #   Unable to reload service auditd: Job type reload is not applicable for unit auditd.service
  #
  # `--check` could not catch it. Check mode does not execute a service action, so the dry run
  # reported this task `changed` against a unit that cannot do what was being asked. A green
  # dry run says the task is well-formed, never that the service accepts the verb.
  #
  # Restarting drops nothing that matters here: auditd is running with no rules loaded, and
  # the config being applied governs rotation size rather than what is captured.
  ansible.builtin.service:
    name: auditd
    state: restarted
  when: optimize_pi_auditd_cap is changed
  become: true

- name: Find the audit rotations left behind by the old 40 MB ceiling
  tags: [log2ram]
  # num_logs is applied at ROTATION, so auditd does not drop the now-surplus generations until it
  # next fills a log — roughly three weeks away at this fill rate. Collect them so the RAM comes
  # back on this deploy rather than at some unattended point later.
  ansible.builtin.find:
    paths: /var/log/audit
    patterns: ["audit.log.[3-9]", "audit.log.[1-9][0-9]"]
    use_regex: false
    recurse: false
  register: optimize_pi_surplus_audit_logs
  become: true

- name: Find audit rotations older than the retention the cap was sized for
  tags: [log2ram]
  # The index-based find above collects generations the NEW num_logs excludes. It cannot see
  # the other half of the problem: a rotation written under the OLD 8 MB max_log_file is
  # double the capped size, and keeping index 1 and 2 is exactly what num_logs=3 asks for.
  # Measured 2026-08-29, after the cap had already landed: audit.log 4.1 MB (correctly capped)
  # but audit.log.1 and audit.log.2 at 8.39 MB each — 20.9 MB against the 12 MB ceiling this
  # section set. auditd only replaces a generation when it rotates, ~3 weeks apart here, so
  # the surplus outlives the cap by months.
  #
  # Collect by AGE, not by size. Size would also take audit.log.1 (26 days old), which is
  # inside the ~6 weeks of history the cap's own comment above defends as "well past the
  # window any of the runbook queries use" — reclaiming RAM by deleting history the section
  # deliberately kept would contradict the decision, not complete it. Age takes only what is
  # already past that window, which brings the directory to ~12.5 MB and holds it there.
  ansible.builtin.find:
    paths: /var/log/audit
    patterns: ["audit.log.[1-9]", "audit.log.[1-9][0-9]"]
    use_regex: false
    recurse: false
    age: 6w
  register: optimize_pi_expired_audit_logs
  become: true

- name: Remove the surplus audit rotations
  tags: [log2ram]
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ optimize_pi_surplus_audit_logs.files + optimize_pi_expired_audit_logs.files }}"
  loop_control:
    label: "{{ item.path }}"
  become: true

# 8. EARLYOOM (kill the hog before the watchdog reboots)
- name: Install earlyoom
  tags: [earlyoom]
  ansible.builtin.apt:
    name: earlyoom
    state: present
  become: true

- name: Configure earlyoom thresholds and protected processes
  tags: [earlyoom]
  # Without this the only escape from a memory spiral is the hardware watchdog
  # hard-rebooting at load 24 (≥10 min of full stall first). earlyoom SIGTERMs the
  # largest process, then SIGKILLs it at half the threshold.
  # --avoid shields the processes whose death would be worse than the stall.
  #
  # THE SWAP CONDITION IS DELIBERATELY NON-BINDING, and this reverses an earlier choice
  # here. This read `-s 10`, described as firing "once BOTH avail mem < 10% AND free swap
  # < 10% — a true OOM spiral, not the swap-heavy-but-stable steady state this box likes
  # to run". The intent was right; the setting could never express it. earlyoom's own help
  # states the rule: "both memory and swap must be below minimum for earlyoom to act". This
  # host has 1.37 GB of combined swap (350 MB zram at priority 100, a 1 GB SD-card swapfile
  # at -2), so free swap < 10% means less than 137 MB free across both — a state reached
  # only after hours of SD-card thrashing, long past the point the guard exists to prevent.
  # Measured 2026-08-29 over four hours of earlyoom's own report lines: mem avail never left
  # 30-34%, free swap never left 77-79%. The guard was inert for its whole life, which is
  # why the 2026-08-29 autoheal failure ("Timeout waiting for systemd to create scope",
  # /proc/pressure/memory full avg10=30.74) hit a box with no escape hatch at all.
  #
  # `-s 100,100` makes both swap thresholds always true, so the memory condition alone
  # decides. That is not a loosening in practice: `-m 10` still means 45 MB available of
  # 456 MB, against the 137-156 MB this box actually sits at, so it fires only in genuine
  # exhaustion. The zram device is NOT the thing to shrink to buy headroom — measured
  # 4.61:1 compression (mm_stat: 275.7 MiB stored in 62.4 MiB), so it is the cheapest RAM
  # on the box.
  #
  # dbus-daemon joins --avoid because Docker's cgroup driver is `systemd`: runc asks systemd
  # over dbus to create a scope for every container start. Killing dbus-daemon would turn a
  # recoverable stall into the exact create-time failure that took autoheal down, and leave
  # nothing able to start a container until reboot.
  ansible.builtin.lineinfile:
    path: /etc/default/earlyoom
    regexp: '^#?EARLYOOM_ARGS='
    line: >-
      EARLYOOM_ARGS="-m 10 -s 100,100 -r 3600 --avoid
      '(^|/)(systemd|systemd-.*|init|sshd|dbus-daemon|dbus-broker|dockerd|containerd|containerd-shim.*|watchdog)$'"
  become: true
  notify: Restart earlyoom

- name: Enable earlyoom service
  tags: [earlyoom]
  ansible.builtin.systemd:
    name: earlyoom
    enabled: true
    state: started
  become: true

# The Kuma-push helper both health crons below source is no longer installed here. It moved to
# the initial_setup role as /usr/local/lib/kuma-push-lib.sh once the cluster's own health crons
# needed the same six-line curl; initial_setup runs on every host and runs earlier in
# initial_setup.yml than this role, so the file is on disk before either script is rendered.

- name: Remove the superseded Pi-only Kuma-push helper
  tags: [sd-health, recovery-health]
  # Nothing sources it after the rename, and an orphaned copy on disk is the one that gets
  # edited by mistake. Ansible does not reap a file it stopped managing.
  ansible.builtin.file:
    path: /usr/local/lib/pi-kuma-push-lib.sh
    state: absent
  become: true

- name: Create the directory both health crons write their verdict to
  tags: [sd-health, recovery-health]
  # Both scripts append an rsyslog-shaped `status=` line here, which the Pi's promtail tails
  # under `job="syslog"` so `probe.py alerts` can reconstruct a Pi episode. Owned by the cron
  # user rather than root: the crons run as {{ sys_user }} (uid 1000), and so does promtail
  # (`user: "1000:1000"`), so the same uid writes and reads and no group_add is needed.
  #
  # This is under /var/log, which is log2ram's 128 MB RAM tmpfs — hence the logrotate stanza
  # below rather than letting it grow. Two crons x 288 runs/day x ~90 B is ~52 KB/day, so the
  # cap is precautionary, not load-bearing.
  ansible.builtin.file:
    path: /var/log/pi-health
    state: directory
    owner: "{{ sys_user }}"
    group: "{{ sys_user }}"
    mode: "0755"
  become: true

- name: Cap the health log so it cannot grow into the log2ram tmpfs
  tags: [sd-health, recovery-health]
  # `create`, NOT `copytruncate`. promtail holds the file open and tracks a byte offset;
  # truncating in place leaves that offset past the new end, so it silently ships nothing
  # until the offset happens to be passed again. Renaming and creating a fresh inode is the
  # rotation promtail's glob-based tailer handles correctly.
  ansible.builtin.copy:
    dest: /etc/logrotate.d/pi-health
    content: |
      # Managed by Ansible (optimize_pi role) — edits here are overwritten.
      /var/log/pi-health/*.log {
        daily
        rotate 1
        size 256k
        missingok
        notifempty
        create 0644 {{ sys_user }} {{ sys_user }}
        su {{ sys_user }} {{ sys_user }}
      }
    mode: "0644"
  become: true

- name: Deploy the SD-card health heartbeat script
  tags: [sd-health]
  # SD cards can't do SMART (no ATA/NVMe command set behind mmcblk0), so scrutiny is
  # useless here; the ext4 errors_count sysfs counter is the earliest reliable
  # failure signal. The script pushes it to the static "Daniel Pi SD Health" Kuma
  # push monitor (defined in the uptime-kuma role) through the LAN-only Authelia
  # bypass on ^/api/push/. Mode 0700: the push token is embedded, so it's legible
  # only to the cron user that runs it.
  ansible.builtin.template:
    src: pi-sd-health.sh.j2
    dest: /usr/local/bin/pi-sd-health.sh
    owner: "{{ sys_user }}"
    group: "{{ sys_user }}"
    mode: "0700"
  become: true

- name: Schedule the SD-card health heartbeat
  tags: [sd-health]
  # Every 5 min — the Kuma monitor's 600s heartbeat window is 2x this, so one
  # missed push is tolerated but a dead cron/host alerts. Cost per run: one sysfs
  # read + one LAN HTTPS request; nothing measurable on the Zero 2 W.
  ansible.builtin.cron:
    name: "Pi SD-card health heartbeat"
    minute: "*/5"
    job: "/usr/local/bin/pi-sd-health.sh"
    user: "{{ sys_user }}"
  become: true

- name: Deploy the container-recovery heartbeat script
  tags: [recovery-health]
  # AutoKuma reads only the server's docker socket, so the Pi's autoheal + docker-proxy have
  # no liveness monitor (a silent-death window). This script pushes their running-state to the
  # static "Daniel Pi Recovery" Kuma push monitor (uptime-kuma role) via the LAN-only Authelia
  # bypass on ^/api/push/. Mode 0700: the push token is embedded, so it's legible only to the
  # cron user that runs it (same as the SD-health heartbeat above).
  ansible.builtin.template:
    src: pi-recovery-health.sh.j2
    dest: /usr/local/bin/pi-recovery-health.sh
    owner: "{{ sys_user }}"
    group: "{{ sys_user }}"
    mode: "0700"
  become: true

- name: Schedule the container-recovery heartbeat
  tags: [recovery-health]
  # Every 5 min — the Kuma monitor's 600s window is 2x this. Cost per run: two `docker ps`
  # filters + one LAN HTTPS request; nothing measurable on the Zero 2 W.
  ansible.builtin.cron:
    name: "Pi container-recovery heartbeat"
    minute: "*/5"
    job: "/usr/local/bin/pi-recovery-health.sh"
    user: "{{ sys_user }}"
  become: true
