---
- name: Create renovate-notify directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ sys_user }}"
    group: "{{ sys_user }}"
    mode: "0750"
  loop:
    - /opt/renovate-notify       # notifier scripts
    - /var/lib/renovate-notify   # state (last_notified, last_run) + monitor-bridge bind source
    - /etc/renovate-notify       # config.env (0600 secret)
  become: true

- name: Install notifier Python files
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/opt/renovate-notify/{{ item }}"
    owner: "{{ sys_user }}"
    group: "{{ sys_user }}"
    mode: "0755"
  loop:
    - renovate_notify.py
    - notify_logic.py
  become: true
  notify: Run renovate-notify once

- name: Install the shared host_lib helper (source of truth in roles/setup/common/files)
  ansible.builtin.copy:
    src: "{{ role_path }}/../common/files/host_lib.py"
    dest: /opt/renovate-notify/host_lib.py
    owner: "{{ sys_user }}"
    group: "{{ sys_user }}"
    mode: "0755"
  become: true
  notify: Run renovate-notify once

- name: Write notifier config (secret webhook, host-only)
  ansible.builtin.template:
    src: config.env.j2
    dest: /etc/renovate-notify/config.env
    owner: "{{ sys_user }}"
    group: "{{ sys_user }}"
    mode: "0600"
  become: true
  no_log: true
  notify: Run renovate-notify once

- name: Install systemd units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    mode: "0644"
  loop:
    - renovate-notify.service
    - renovate-notify.timer
  become: true
  notify:
    - Reload systemd
    - Run renovate-notify once

- name: Write the alert webhook where only systemd reads it
  ansible.builtin.template:
    src: alert-webhook.env.j2
    dest: /etc/renovate-notify/alert-webhook.env
    owner: root
    group: root
    mode: "0600"
  become: true
  no_log: true
  notify:
    - Reload systemd
    - Run renovate-notify once

# 2026-08-23b review M5, the same defect as gitops-deploy-alert.service: embedding the webhook
# and installing 0600 did not protect it, because `systemctl show <unit> -p ExecStart` serves
# unit content over the system bus regardless of file mode. 0644 is the honest mode now that the
# unit holds no secret.
- name: Install the alert unit
  ansible.builtin.template:
    src: renovate-notify-alert.service.j2   # OnFailure target — pages Discord if the notifier crashes
    dest: /etc/systemd/system/renovate-notify-alert.service
    mode: "0644"
  become: true
  notify:
    - Reload systemd
    - Run renovate-notify once

- name: Enable and start the timer
  ansible.builtin.systemd:
    name: renovate-notify.timer
    enabled: true
    state: started
    daemon_reload: true
  become: true

# Render provenance for manifest-prune-check.sh's stale-script arm — see the gitops_deploy role
# for why these were previously watched by nothing (2026-08-23b review H1).
- name: Stamp the rendered renovate-notify units
  ansible.builtin.import_tasks: "{{ role_path }}/../common/tasks/stamp_render.yml"
  vars:
    stamp_render_name: renovate-notify
    stamp_render_templates:
      - ansible/roles/setup/renovate_notify/templates/renovate-notify.service.j2
      - ansible/roles/setup/renovate_notify/templates/renovate-notify-alert.service.j2
      - ansible/roles/setup/renovate_notify/templates/renovate-notify.timer.j2
      # Same reasoning as the gitops_deploy list: the stamp and the check both hash the repo
      # source, never the rendered file, so an .env.j2 carries no secret into either
      # (2026-08-24 review M-9).
      - ansible/roles/setup/renovate_notify/templates/config.env.j2
      - ansible/roles/setup/renovate_notify/templates/alert-webhook.env.j2

# The notifier's own code was watched by nothing until 2026-08-24 (review M-5): the deployed-code
# arm hardcoded gitops-deploy's three paths, so this role's three could run any age against a
# green drift check.
- name: Record the deployed renovate-notify code
  ansible.builtin.import_tasks: "{{ role_path }}/../common/tasks/stamp_deployed.yml"
  vars:
    stamp_deployed_name: renovate-notify
    stamp_deployed_pairs:
      - live: /opt/renovate-notify/renovate_notify.py
        src: ansible/roles/setup/renovate_notify/files/renovate_notify.py
      - live: /opt/renovate-notify/notify_logic.py
        src: ansible/roles/setup/renovate_notify/files/notify_logic.py
      - live: /opt/renovate-notify/host_lib.py
        src: ansible/roles/setup/common/files/host_lib.py
