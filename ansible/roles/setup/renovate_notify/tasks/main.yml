---
# One task file per subject, each under its own tag, so the GitOps deployer can apply a change
# to the code alone (`--tags renovate-notify-code`) or to the units alone (`--tags renovate-notify-service`)
# rather than the whole role (#3135). `narrow_setup` reads a task file's OWN tags, so each task
# in code.yml and service.yml carries its tag, and each import below repeats it so an edit to
# this file narrows too. The directories serve both halves.
- name: Create renovate-notify directories
  tags: [renovate-notify-code, renovate-notify-service]
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ sys_user }}"
    group: "{{ sys_user }}"
    mode: "0750"
  loop:
    - /opt/renovate-notify       # notifier scripts
    - /var/lib/renovate-notify   # state (last_notified, last_run, pending_seen.json) + monitor-bridge bind source
    - /etc/renovate-notify       # config.env (0600 secret)
  become: true

- name: Install the renovate-notify code
  tags: [renovate-notify-code]
  ansible.builtin.import_tasks: code.yml

- name: Install and arm the renovate-notify units
  tags: [renovate-notify-service]
  ansible.builtin.import_tasks: service.yml
