---
# The host packages own sops: homelab-tools ships the pinned binary, the `sops` component puts it
# on PATH and retires /usr/local/bin/sops, and bootstrap-host.sh's step 3 creates the host's age
# key. The collections install moved to initial_setup. docs/target-architecture/host/
# h7-delete-ansible.md, H7.24b.

# DECIDED: this role is emptied, never deleted, until H7.20a. A play that names a missing role
# fails to parse, so deleting the role would mean editing initial_setup.yml and bootstrap.yml,
# which are in the deployer's _BROAD_MANUAL_PREFIXES and park every session's landing. An
# unconditional end_role keeps the playbook lines, and the role applies as a no-op.
# setup_gates.role_end_guard reads this task, so the two-writer census and the setup census count
# the role as empty on every host.
- name: End the role, whose work the host packages own
  ansible.builtin.meta: end_role
