---
# 1. INSTALLATION
- name: Ensure 'age' is installed (Debian/Ubuntu)
  tags: [sops-install]
  ansible.builtin.apt:
    name: age
    state: present
    update_cache: true

- name: Download and install SOPS binary
  tags: [sops-install]
  ansible.builtin.get_url:
    url: "{{ sops_setup_binary_url }}"
    dest: /usr/local/bin/sops
    mode: "0755"
    # The version, both URLs and both digests are `defaults/main.yml`'s, beside each other,
    # so `scripts/validate/asset_pins.py` can render them and fetch the hash a Renovate bump
    # leaves for a human to finish (#2313). That file carries the full argument.
    checksum: "sha256:{{ sops_setup_binary_sha256 }}"
  vars:
    # ONE selection of the architecture, read twice. The pins themselves are role defaults —
    # a copy here would outrank them, letting the checked pin and the installed pin drift.
    sops_setup_arch: "{{ 'amd64' if ansible_facts.architecture == 'x86_64' else 'arm64' }}"
    sops_setup_binary_url: "{{ sops_setup_binary_amd64_url if sops_setup_arch == 'amd64' else sops_setup_binary_arm64_url }}"
    sops_setup_binary_sha256: "{{ sops_setup_binary_amd64_sha256 if sops_setup_arch == 'amd64' else sops_setup_binary_arm64_sha256 }}"

- name: Install pinned Ansible collections from requirements.yml
  tags: [collections]
  # Install community.sops (and the rest of the pinned set) at the versions locked in
  # ansible/requirements.yml rather than pulling unpinned latest — keeps the runtime
  # collections in lockstep with the tooling. Install into the path ansible.cfg loads
  # from (collections_path = ansible/collections), matching the prek lint hook.
  # Run as the regular user (become: false) so it installs for the repo owner.
  become: false
  ansible.builtin.command: >-
    ansible-galaxy collection install
    -r {{ playbook_dir }}/requirements.yml
    -p {{ playbook_dir }}/collections
  changed_when: false
  # `command` runs on the TARGET, so both paths must exist there. They are the CONTROLLER's
  # collections in any case — a host Ansible drives over ssh never loads them.
  when: has_repo_checkout

# 2. KEY GENERATION

- name: Setup SOPS config directory
  tags: [age-key]
  ansible.builtin.set_fact:
    sops_setup_sops_config_dir: "{{ home_dir }}/.config/sops/age"
  vars:
    home_dir: "/home/{{ sys_user }}"

- name: Setup SOPS with Key File location
  tags: [age-key]
  ansible.builtin.set_fact:
    sops_setup_key_file: "{{ sops_setup_sops_config_dir }}/keys.txt"

- name: Create directory for Age keys
  tags: [age-key]
  become: false
  ansible.builtin.file:
    path: "{{ sops_setup_sops_config_dir }}"
    state: directory
    mode: "0700"

# DR NOTE: host keys at ~/.config/sops/age/keys.txt are in NO automated backup — nothing outside
# a Longhorn volume is, since Kopia retired 2026-08-13 (and it only covered `containers/` before). Since 2026-06-11 .sops.yaml has a third, OFF-BOX recovery
# recipient (private half only in the operator's password manager), so losing both hosts'
# keys no longer strands the secrets. Host keys also backed up out-of-band (2026-06-06).
- name: Generate Age key (only if it doesn't exist)
  tags: [age-key]
  become: false
  ansible.builtin.command: "age-keygen -o {{ sops_setup_key_file }}"
  args:
    creates: "{{ sops_setup_key_file }}"

- name: Display the new Public Key
  tags: [age-key]
  become: false
  ansible.builtin.shell:
    # pipefail needs bash; Ubuntu's /bin/sh is dash, which errors on `set -o pipefail`.
    cmd: "set -o pipefail && grep 'public key' {{ sops_setup_key_file }} | awk '{print $4}'"
    executable: /bin/bash
  register: sops_setup_public_key
  changed_when: false

- name: Show the Public Key to user
  tags: [age-key]
  ansible.builtin.debug:
    msg: "Your Public Key is: {{ sops_setup_public_key.stdout }}"

# 3. CONFIGURATION (.sops.yaml)
- name: Seed ansible/.sops.yaml (first-host bootstrap only)
  # Tagged age-key (not its own tag): consumes sops_setup_public_key registered above,
  # so it can only run as part of the key-generation block.
  tags: [age-key]
  become: false
  ansible.builtin.copy:
    dest: "{{ playbook_dir }}/.sops.yaml"
    content: |
      creation_rules:
        - path_regex: .*(vars|secrets)\/.*\.ya?ml$
          age: "{{ sops_setup_public_key.stdout }}"
    mode: "0644"
  # Only seeds the very first host. ansible/.sops.yaml is tracked, so every host that has
  # the repo checkout already has it -> this skips. Additional hosts add their key to the
  # existing ansible/.sops.yaml + `sops updatekeys`; they must NOT overwrite it here.
  # Two conditions, and the second is not redundant. `dest` writes on the TARGET while a
  # `lookup()` reads on the CONTROLLER, so on its own the guard below decides a target-side
  # write by reading the controller's copy. It happens to skip on a checkout-less host, because
  # ansible/.sops.yaml is tracked and the controller always has one — correct by accident. The
  # gate says what is actually meant.
  when:
    - has_repo_checkout
    - not (lookup('file', playbook_dir + '/.sops.yaml', errors='ignore'))
