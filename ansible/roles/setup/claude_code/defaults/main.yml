---
# Remote Control host (claude-rc.service). See CLAUDE.md in this role for what the
# service is and why it exists.
#
# Every var here carries the role's `claude_code_` prefix (ansible-lint
# var-naming[no-role-prefix]), so the Remote Control ones read `claude_code_rc_*`.

# The service hands anything holding the claude.ai account a session on the k3s
# control-plane node, and it depends on a prerequisite Ansible cannot check: whether a
# phone-spawned worktree clears the workspace-trust dialog, which nobody can answer remotely.
# Confirmed on daniel-box — a session created from the phone produced
# `.claude/worktrees/test-scratch` on branch `worktree-test-scratch` and reached a prompt,
# with no dialog. Setting this to false stops AND disables the host and its restart timer;
# that is the rollback.
claude_code_rc_enabled: true

# The account claude-rc.service runs as. Slice 4 of docs/claude-agent-user.md moves it to
# `claude_code_agent_user`; the default keeps the operator, so a host that does not set this
# renders the unit it always did. Only a non-operator user gets the unit's hardening lines.
claude_code_user: "{{ sys_user }}"

# That account's home. The agent user's lives outside /home (claude_code_agent_user_home), so
# the unit's ProtectHome=yes can hide every human home without hiding it.
claude_code_user_home: >-
  {{ claude_code_agent_user_home if claude_code_user == claude_code_agent_user
  else '/home/' ~ claude_code_user }}

# The directory the host runs in. Sessions spawned on demand get their own worktree
# underneath it; the pre-created session stays here.
claude_code_rc_workdir: "{{ claude_code_user_home }}/server"

# DECIDED: worktree, not same-dir. Concurrent sessions sharing one checkout is the exact
# thing this repo's parallel-session rule forbids, and `prune_worktrees.py` already
# collects finished worktrees while respecting a live session's lock.
claude_code_rc_spawn_mode: worktree

# DECIDED: auto, matching interactive sessions on this host. `default` prompts on nearly
# every tool call, which from a phone means a session that stops constantly. Falling back
# to `default` is the supported answer if auto degrades without a TTY — answering prompts
# remotely is what Remote Control is for.
claude_code_rc_permission_mode: auto

# DECIDED: 10, not the CLI's default of 32. Measured on daniel-box, a `claude` process sits
# at 200-400 MB RSS, so 10 sessions ask for up to ~4 GB against ~15 GB available with k3s
# already running. Raised from 3 to 10 on 2026-09-04 at user request.
#
# This is NOT the memory bound, though it read as one here until 2026-09-05. The per-process
# figure above is accurate — the two live sessions during that day's stall measured 404 MB
# and 376 MB. What it does not count is the subprocess tree: those two sessions held 203
# processes and 6.96 GB anon, because the memory belongs to what a session SPAWNS. Capacity
# multiplies that tree, it does not bound it. claude_code_rc_pytest_workers below is the
# bound on the fan-out; MemoryHigh in the unit is the throttle when it is exceeded anyway.
claude_code_rc_capacity: 10

# Workers a single `-n auto` pytest run may use on this host, via PYTEST_XDIST_AUTO_NUM_WORKERS
# in the unit. daniel-box has 16 cores, so `auto` means 16 per run and nothing bounds how many
# runs the sessions launch at once.
#
# Derivation, and the thing to re-derive if you change it: the worst case is workers ×
# capacity, not workers. At 4 × 10 that is 40 workers, and xdist workers measured 20-150 MB
# RSS during a stall, so call it ~4 GB of workers against the 8 GB MemoryHigh,
# with the 10 `claude` processes taking most of the rest. That sits the extreme case at the
# throttle point, which is where a throttle belongs.
#
# Nine concurrent runs at this cap are 36 workers, roughly 3.6 GB, where uncapped `auto` was
# 144 workers and ~15 GB. Raise it on measurement, and re-check the product, not the factor.
#
# A sibling entry in ~/.claude/settings.json's `env` block carries the same value for Claude
# sessions this unit does not spawn (chezmoi repo, home/.chezmoitemplates/settings.base.json).
# Raise both together, or the cap depends on how the session started.
claude_code_rc_pytest_workers: 4

# ── The fleet bound ─────────────────────────────────────────────────────────────────────
# The Claude fleet occupies TWO cgroups on this box: claude-rc.service's own, and
# user-<claude_code_login_uid>.slice for a session started from an interactive shell. They are
# siblings under different parents, so a cap on each reads as one bound and is two: neither
# sees the other's usage and the real throttle point is the SUM, such as 16G of anon plus 4G
# of swap on a 28 GiB box that also runs k3s, Longhorn and the rest of the homelab plane. The
# vars below make the sum the number, applied to the one slice that is a parent of both
# planes.

# Whether the fleet bound is applied: the drop-in on claude_code_fleet_slice, and the
# Slice= line that moves claude-rc.service under it. false removes both — the drop-in is
# deleted and the RC unit goes back to system.slice keeping only its own per-plane cap.
# That is the rollback if a shared parent ever needs to come off, e.g. to give one plane the
# whole box for a deliberate heavy run.
claude_code_fleet_caps_enabled: true

# The slice both planes live under. user.slice is not a choice among several — it is the
# only slice that can hold both, and the reason is worth knowing before changing this.
# systemd.slice(5): "The name of the slice encodes the location in the tree", and for a
# slice unit Slice= takes "the only accepted value ... the parent slice", so
# user-<uid>.slice cannot be moved anywhere: its name fixes it under user.slice, and
# systemd-logind creates it under that name. user.slice is therefore the tightest legal
# common ancestor, and measured on daniel-box it is safe to place a unit in:
# StopWhenUnneeded=no, where user-<uid>.slice has StopWhenUnneeded=yes with Linger=no — a
# service placed THERE would be stopped along with the slice at the last logout. This
# role's CLAUDE.md carries the full answer to "can user-<uid>.slice be reparented".
claude_code_fleet_slice: user.slice

# DECIDED: 14G on the shared parent, with the per-plane caps below at 10G as sub-bounds.
# Lowering both planes to 7G would also make the sum 14G, and is the worse shape: a plane
# would throttle at half the box's fleet budget while the other plane sat idle. A parent
# ceiling shares elastically — either plane may take up to its own 10G, and the two together
# are held to 14G by the parent.
#
# Derivation, measured on daniel-box 2026-09-06. Re-derive all of it if you change this:
#   RAM: MemTotal 29,576,480 kB = 28.2 GiB.
#   The homelab plane's unreclaimable footprint, read as cgroup anon rather than
#     memory.current (which counts page cache and so overstates what must stay resident):
#     kubepods.slice 5.7 GiB + system.slice minus claude-rc.service 1.4 GiB = 7.1 GiB.
#     Budgeted at 10 GiB so k3s and Longhorn can grow ~40% without racing the fleet.
#   Kernel: SUnreclaim 0.55 GiB. Page cache left free for Longhorn and etcd I/O: ~3 GiB.
#   28.2 - 10 - 0.55 - 3 = 14.6 GiB available to the fleet. The cap was 12G until
#     2026-09-26, leaving ~2.6 GiB of that unspent. It was raised to 14G at user request to
#     fit one more fan-out batch, which leaves ~0.6 GiB unspent. Do not raise it past the
#     14.6 GiB: the excess comes out of the page cache Longhorn and etcd need, and the
#     throttle stalls whichever cgroup loses the race for reclaim, which must not be the
#     homelab plane.
# Re-measured 2026-09-26 before the raise: the homelab plane's anon was kubepods.slice
# 6.61 GiB + system.slice 1.70 GiB = 8.3 GiB, inside its 10 GiB budget. That budget is the
# number to re-check first if k3s grows, because the fleet now spends nearly all that is
# left after it.
# Fleet peak at the old 12G cap, measured 2026-09-06: 4.0 GiB for claude-rc.service and
# 7.2 GiB for user-1000.slice, 11.2 GiB together.
#
# memory.high counts PAGE CACHE as well as anon, so an ordinary multi-agent pytest fan-out
# will touch this bound and reclaim cache. That is the cheap half of reclaim and it is
# intended; the anon budget above is what the number is derived from, not what it throttles
# on.
claude_code_fleet_memory_high: 14G

# The fleet's swap ceiling. 2G is a quarter of this host's 8 GiB /swap.img, so the homelab
# plane keeps three quarters. Same not-zero reasoning as the per-plane cap below.
claude_code_fleet_swap_max: 2G

# ── The per-plane sub-bounds ────────────────────────────────────────────────────────────
# One plane's share of the fleet bound above, applied to claude-rc.service's own cgroup AND
# to user-<uid>.slice's drop-in. Each must be <= the fleet bound: a sub-bound above its
# parent's is a number that can never be reached. ENFORCED by
# ansible/tests/setup/test_claude_fleet_slice_cap.py.
#
# Every fan-out agent on this host
# runs in the login plane, so this is the cap the fan-out dispatcher runs out of first, and
# raising the fleet cap alone adds no fan-out width. Deliberately more than half of 14G: a
# plane doing real work while the other is idle should be able to use most of the fleet's
# budget, and the parent is what stops the two of them together. See the unit template on
# why this is MemoryHigh and not MemoryMax.
claude_code_rc_memory_high: 10G

# One plane's swap ceiling, written to memory.swap.max. Without it a plane swaps without
# limit: one cgroup can hold all 8 GiB of this box's swap, stall in reclaim, and starve every
# other cgroup, k3s included. MemoryHigh cannot prevent that. It throttles rather than caps,
# and swap is exactly where a throttled cgroup's anon pages go.
#
# 2G here equals claude_code_fleet_swap_max, so one plane may take the fleet's whole swap
# share while the two together still cannot exceed it. Raise them together.
#
# NOT 0. Zero swap does not contain a cgroup, it relocates the same growth into RAM:
# nothing reclaims anon without swap, MemoryMax is deliberately infinity, so the terminal
# state becomes the GLOBAL OOM killer choosing a victim by badness anywhere on the box —
# a k3s process included. See the unit template on why a kill is the response this host
# cannot absorb.
claude_code_rc_memory_swap_max: 2G

# Whether to set CLAUDE_CODE_DISABLE_BG_SHELL_PRESSURE_REAP on the host, turning off Claude
# Code's kill of backgrounded Bash tasks under a Node memoryPressure event. On by default;
# the unit template carries the reasoning. Set this false to hand the reaper back — the
# reaper is upstream's protection against a runaway background shell, and turning it off
# leaves MemoryHigh and claude_code_rc_capacity as the only bounds.
claude_code_rc_disable_bg_shell_pressure_reap: true

# How often to restart the host so it picks up a Claude Code auto-update. The binary
# updates itself in the background, but a long-lived process keeps running the version it
# started with. systemd OnCalendar syntax.
claude_code_rc_restart_schedule: weekly

# ── Login-session caps ──────────────────────────────────────────────────────────────────
# claude-rc.service's MemoryHigh, MemorySwapMax and PYTEST_XDIST_AUTO_NUM_WORKERS bound only
# that unit's own cgroup. A session started with `claude agents` (or a bare `claude`) from
# an interactive SSH shell lands in user.slice/user-{{ claude_code_login_uid }}.slice/
# session-<n>.scope instead, which none of the three touch, so such a scope can grow without
# bound while claude-rc.service stays small.

# Whether the two tasks below are applied. Unlike claude_code_rc_enabled this has no
# "installed but stopped" middle state to fall back to — false removes the drop-in and the
# environment.d file outright, which is the rollback if the cap ever needs to come off a
# login session (e.g. while debugging a plain human `pytest -n auto` run that wants full
# width).
claude_code_login_caps_enabled: true

# The numeric uid whose login-session slice (user-<uid>.slice) gets the same caps as
# claude-rc.service's own cgroup. Confirmed to be 1000 for {{ sys_user }} on daniel-box.
# Override per-host if a different uid
# ever owns the account this role manages — a getent lookup was considered and rejected
# here: it would need `become: true` just to read NSS and would make the render tests below
# depend on a fact rather than a plain default.
claude_code_login_uid: 1000

# ── Memory store copy (issue #3123) ─────────────────────────────────────────────────────
# Sessions on each host read that host's own ~/.claude memory store, and nothing kept the two
# in step: on 2026-10-01 daniel-server's and daniel-box's stores shared 2 of 85 and 66 file
# names, and daniel-server's index told sessions to stay on master. The operator chose
# daniel-box as the source and a one-way, overwriting copy, so this is true only in
# daniel-box's host_vars. False stops and disables the timer and removes its units.
claude_code_memory_sync_enabled: false

# The ssh destination the store is copied to, as this host's user resolves it.
claude_code_memory_sync_target: daniel-server

# The store's directory, the same path on both hosts. Claude Code keys a project's store by
# its working directory with every `/` turned into `-`, so it derives from the checkout.
claude_code_memory_sync_dir: "{{ claude_code_user_home }}/.claude/projects/{{ claude_code_rc_workdir | replace('/', '-') }}/memory"

# How often the copy runs, as a systemd time span. A memory written here reaches the other
# host's next session within this interval.
claude_code_memory_sync_interval: 15min

# ── The agent user ──────────────────────────────────────────────────────────────────────
# A dedicated Unix user for the operator's Claude sessions, built by the same shared task file
# as renovate-agent's (roles/setup/common/tasks/agent_user.yml). A session running as
# {{ sys_user }} reads everything that user can: the age key, which decrypts the become
# password, the operator's gh token, ssh keys, and the deployer's primary checkout. This user
# reaches none of them. No unit runs as it: claude-rc.service runs as {{ sys_user }}.
#
# To start a session as it, open a login shell, which reads the .profile this role writes, then
# run `claude` in ~/server. The first run needs `/login` and trusting the directory:
#   sudo machinectl shell claude@ /bin/bash -l
# Each apply of this role syncs the clone's .venv, which the hooks run in. A pull that changes
# uv.lock needs `uv sync` in ~/server before the next `claude`, as in any checkout.
#
# True only in daniel-box's host_vars. False expires the account rather than removing it, so
# nothing can log in as it, and its home keeps the clone and any work not yet pushed. True
# again lifts the expiry.
claude_code_agent_user_enabled: false
claude_code_agent_user: claude
# Outside /home, as renovate-agent's is, so a unit's ProtectHome= hides every human home and
# not this one.
claude_code_agent_user_home: /var/lib/claude
claude_code_agent_user_clone_dir: "{{ claude_code_agent_user_home }}/server"
claude_code_agent_user_repo: DanielH2018/server

# Whether the agent user reads the system journal, through the systemd-journal group. Without
# it, `journalctl` shows the agent only its own units. The operator granted it on 2026-10-09,
# after a gitleaks scan of 14 days of journal found only the kernel's public module-signing
# key fingerprint (docs/claude-agent-user.md, slice 4). False removes the group again.
claude_code_agent_journal_access: true
# Whether the operator reads the agent's artifacts and memory store. claude-memory-sync runs as
# sys_user, and the artifact browser and the operator's own sessions read both once the phone
# host runs as the agent (slice 4). tasks/agent_access.yml has how; false closes the agent's
# ~/.claude to its own user again and removes the ACLs.
claude_code_agent_operator_read: true
# The agent's own memory store: Claude Code keys it by the project directory, the agent's clone.
claude_code_agent_memory_dir: >-
  {{ claude_code_agent_user_home }}/.claude/projects/{{
  claude_code_agent_user_clone_dir | replace('/', '-') }}/memory

# Whether the agent user gets a subset of the operator's user-level Claude config: the user
# CLAUDE.md, rules/, output-styles/ and skills/, and the operator's `outputStyle`. It gets no
# hooks. The operator decided on 2026-10-09 to copy the subset from the deployed
# /home/{{ sys_user }}/.claude rather than from chezmoi's source (docs/claude-agent-user.md,
# slice 4); tasks/agent_operator_config.yml has how, and the limit of the root ownership. False
# removes the copied trees, the import line in the agent's CLAUDE.md, and the `outputStyle` it
# set.
claude_code_agent_operator_config: true
claude_code_agent_operator_config_src: /home/{{ sys_user }}/.claude

# The agent user's GitHub machine account, created 2026-10-05 (tasks/agent_github.yml). It is a
# write collaborator and a bypass actor on no ruleset. "agent branch fence" lets it create,
# update and delete only refs/heads/worktree-claude+**, the branch EnterWorktree gives a
# `claude/<slug>` worktree, and "master review gate" keeps it from merging its own PRs.
# Its token is claude_code_agent_gh_token in SOPS: a classic token with only public_repo,
# because GitHub offers no fine-grained token to a collaborator on another personal account's
# repo. Without the `workflow` scope, GitHub refuses its pushes that edit .github/workflows/.
claude_code_agent_github_login: DanielClaudeBot
# The worktree-name prefix the agent's own CLAUDE.md (templates/agent-user-claude-md.j2) tells
# its sessions to use. EnterWorktree turns `claude/<slug>` into the branch
# `worktree-claude+<slug>`, the one shape the fence above lets this account push. The repo
# CLAUDE.md cannot carry it, because the operator's sessions read that file too (#3612). The
# agent's login profile also exports it as CLAUDE_WORKTREE_PREFIX, which
# scripts/dev/fanout_lib/target.py:branch_name reads to name fan-out batch branches (#3618).
claude_code_agent_worktree_prefix: claude
claude_code_agent_github_id: 338220904
# The account's noreply address. GitHub attributes a commit to the account by it, and marks the
# commit Verified when the signing key below is on the account as a Signing Key.
claude_code_agent_git_email: >-
  {{ claude_code_agent_github_id }}+{{ claude_code_agent_github_login }}@users.noreply.github.com
# Generated on the host as the agent, so the private half never leaves its home. The operator
# adds the `.pub` beside it to the account as a Signing Key, never an Authentication Key: the
# agent pushes over HTTPS with the token, so the key can sign and cannot push.
claude_code_agent_signing_key: "{{ claude_code_agent_user_home }}/.ssh/git_signing_ed25519"

# The agent's login for the homelab-ui MCP server (tasks/agent_homelab_ui.yml). The username is
# the Authelia account the authelia role creates (`authelia_k8s_agent_user`), mirrored here
# because the two roles cannot read each other's defaults; a test holds the two equal. The
# password is `authelia_agent_password` in SOPS, which the apply decrypts as {{ sys_user }}.
# The file also carries `domain`: ui_mcp.sh and ui_login.py read it from SOPS for the operator,
# and the agent has no age key to do that. The agent can already read the domain, because its
# read-only kubeconfig covers the traefik.io IngressRoutes that name it, so the file widens
# nothing. scripts/diagnostics/probe_lib/core.py:AGENT_CREDENTIALS_PATH reads this path.
claude_code_homelab_ui_username: claude-agent
claude_code_homelab_ui_credentials: "{{ claude_code_agent_user_home }}/.config/homelab-ui/credentials.json"

# ── The agent's lander ──────────────────────────────────────────────────────────────────
# The agent's account cannot merge its own PRs: "master review gate" wants an approval from
# someone other than the last pusher. claude-land@<n>.service lands PR <n> as {{ sys_user }},
# whose admin role the gate lets through, by running land.sh with the landing policy switched
# on (scripts/deploy_tools/land_lib/policy.py). The agent user may start that unit and do
# nothing else with it (templates/50-claude-land.rules.j2). It reads the outcome back from
# /var/lib/claude-land/<n>.verdict.
#
# True only in daniel-box's host_vars, and installed only while claude_code_agent_user_enabled
# is also true. False on either removes the rule, the unit and the approval list; a landing
# already running finishes.
claude_code_lander_enabled: false
# The checkout land.sh runs from: the deployer's primary, which only ever fast-forwards to
# master, so the lander runs the land.sh that master holds and never a branch's copy.
claude_code_lander_checkout: "/home/{{ sys_user }}/server"
# The only branches the lander lands, the shape EnterWorktree gives a `claude/<slug>` worktree.
# It must match the fence's exclude (gitops_deploy_fence_ruleset_exclude), the one branch
# shape the account can push.
claude_code_lander_branch_prefix: "worktree-{{ claude_code_agent_worktree_prefix }}+"
# The operator's GitHub login. Its approval of a PR's head SHA lifts the approval-path refusal
# below, so the agent can land a PR the operator has reviewed. Never the agent's own login.
claude_code_lander_approver: DanielH2018
# Paths that widen the agent's own authority. land.sh refuses an agent PR that changes, adds,
# deletes or renames out of a path under one of these prefixes, unless the approver above has
# approved its head. Plain prefixes, so `scripts/deploy_tools/land` covers land.sh, land.py and
# land_lib/.
# The modules the landing process imports from scripts/lib/ and elsewhere are not listed here.
# The policy derives them at landing time from what it has loaded (land_lib/policy.py,
# gate_hits), so this list holds only what no import walk can see.
claude_code_lander_approval_paths:
  # This role, which defines the agent user, its token, this list and the lander itself.
  - ansible/roles/setup/claude_code/
  # The unattended agent and its own lander.
  - ansible/roles/setup/renovate_agent/
  # The deployer, and the drift check that holds the rulesets to their declared shape.
  - ansible/roles/setup/gitops_deploy/
  # What builds an agent user, and the deployer's host helpers.
  - ansible/roles/setup/common/tasks/agent_user.yml
  - ansible/roles/setup/common/files/host_lib.py
  # sudo, ssh and the operator's own login, and the agent's login on the peers.
  - ansible/roles/setup/initial_setup/tasks/access.yml
  - ansible/roles/setup/initial_setup/tasks/claude-peer.yml
  # Every switch above lives in host_vars.
  - ansible/inventory/
  # The secrets and who can decrypt them.
  - ansible/.sops.yaml
  - ansible/vars/secrets.yml
  # CI, which decides what "green" means for the merge.
  - .github/
  # The landing policy and the code that runs it.
  - scripts/deploy_tools/land
  # The interpreter and packages `uv run` syncs before land.py starts. A package can run code
  # at interpreter start through a .pth file, before any policy check.
  - pyproject.toml
  - uv.lock
  - uv.toml
  - .python-version
