---
# Remote Control host (claude-rc.service). See CLAUDE.md in this role for what the
# service is and why it exists.
#
# Every var here carries the role's `claude_code_` prefix (ansible-lint
# var-naming[no-role-prefix]), so the Remote Control ones read `claude_code_rc_*`.

# The service hands anything holding the claude.ai account a session on the k3s
# control-plane node, so it shipped disabled until the prerequisite Ansible cannot check was
# confirmed by hand: whether a phone-spawned worktree clears the workspace-trust dialog,
# which nobody can answer remotely. Confirmed on daniel-box 2026-08-23 — a session created
# from the phone produced `.claude/worktrees/test-scratch` on branch `worktree-test-scratch`
# and reached a prompt, with no dialog. Setting this back to false stops AND disables the
# host and its restart timer; that is the rollback.
claude_code_rc_enabled: true

# The directory the host runs in. Sessions spawned on demand get their own worktree
# underneath it; the pre-created session stays here.
claude_code_rc_workdir: "/home/{{ sys_user }}/server"

# DECIDED: worktree, not same-dir. Concurrent sessions sharing one checkout is the exact
# thing this repo's parallel-session rule forbids, and `prune_worktrees.py` already
# collects finished worktrees while respecting a live session's lock.
claude_code_rc_spawn_mode: worktree

# DECIDED: auto, matching interactive sessions on this host. `default` prompts on nearly
# every tool call, which from a phone means a session that stops constantly. Falling back
# to `default` is the supported answer if auto degrades without a TTY — answering prompts
# remotely is what Remote Control is for.
claude_code_rc_permission_mode: auto

# DECIDED: 10, not the CLI's default of 32. Measured on daniel-box, a `claude` process sits
# at 200-400 MB RSS, so 10 sessions ask for up to ~4 GB against ~15 GB available with k3s
# already running. Raised from 3 to 10 on 2026-09-04 at user request.
#
# This is NOT the memory bound, though it read as one here until 2026-09-05. The per-process
# figure above is accurate — the two live sessions during that day's stall measured 404 MB
# and 376 MB. What it does not count is the subprocess tree: those two sessions held 203
# processes and 6.96 GB anon, because the memory belongs to what a session SPAWNS. Capacity
# multiplies that tree, it does not bound it. claude_code_rc_pytest_workers below is the
# bound on the fan-out; MemoryHigh in the unit is the throttle when it is exceeded anyway.
claude_code_rc_capacity: 10

# Workers a single `-n auto` pytest run may use on this host, via PYTEST_XDIST_AUTO_NUM_WORKERS
# in the unit. daniel-box has 16 cores, so `auto` means 16 per run and nothing bounds how many
# runs the sessions launch at once.
#
# Derivation, and the thing to re-derive if you change it: the worst case is workers ×
# capacity, not workers. At 4 × 10 that is 40 workers, and xdist workers measured 20-150 MB
# RSS during the 2026-09-05 stall, so call it ~4 GB of workers against the 8 GB MemoryHigh,
# with the 10 `claude` processes taking most of the rest. That sits the extreme case at the
# throttle point, which is where a throttle belongs.
#
# Checked against the incident rather than only the arithmetic: nine concurrent runs would
# have been 36 workers instead of 144, roughly 3.6 GB instead of the ~15 GB that exhausted
# the box's swap. Raise it on measurement, and re-check the product, not the factor.
#
# A sibling entry in ~/.claude/settings.json's `env` block carries the same value for Claude
# sessions this unit does not spawn (chezmoi repo, home/.chezmoitemplates/settings.base.json).
# Raise both together, or the cap depends on how the session started.
claude_code_rc_pytest_workers: 4

# ── The fleet bound (issue #1264) ───────────────────────────────────────────────────────
# The Claude fleet occupies TWO cgroups on this box: claude-rc.service's own, and
# user-<claude_code_login_uid>.slice for a session started from an interactive shell. Both
# used to carry claude_code_rc_memory_high directly, which reads as one bound and is two —
# they are siblings under different parents, so neither saw the other's usage and the real
# throttle point was the SUM. 16G of anon plus 4G of swap on a 28 GiB box that also runs
# k3s, Longhorn and the rest of the homelab plane. The vars below make the sum the number,
# applied to the one slice that is a parent of both planes.

# Whether the fleet bound is applied: the drop-in on claude_code_fleet_slice, and the
# Slice= line that moves claude-rc.service under it. false removes both — the drop-in is
# deleted and the RC unit goes back to system.slice keeping only its own per-plane cap.
# That is the rollback if a shared parent ever needs to come off, e.g. to give one plane the
# whole box for a deliberate heavy run.
claude_code_fleet_caps_enabled: true

# The slice both planes live under. user.slice is not a choice among several — it is the
# only slice that can hold both, and the reason is worth knowing before changing this.
# systemd.slice(5): "The name of the slice encodes the location in the tree", and for a
# slice unit Slice= takes "the only accepted value ... the parent slice", so
# user-<uid>.slice cannot be moved anywhere: its name fixes it under user.slice, and
# systemd-logind creates it under that name. user.slice is therefore the tightest legal
# common ancestor, and measured on daniel-box it is safe to place a unit in:
# StopWhenUnneeded=no, where user-<uid>.slice has StopWhenUnneeded=yes with Linger=no — a
# service placed THERE would be stopped along with the slice at the last logout. This
# role's CLAUDE.md carries the full answer to "can user-<uid>.slice be reparented".
claude_code_fleet_slice: user.slice

# DECIDED: 12G on the shared parent, with the per-plane caps below left at 8G as sub-bounds.
# Lowering both planes to 6G would also make the sum 12G, and is the worse shape: a plane
# would throttle at half the box's fleet budget while the other plane sat idle. A parent
# ceiling shares elastically — either plane may take up to its own 8G, and the two together
# are held to 12G by the parent.
#
# Derivation, measured on daniel-box 2026-09-06. Re-derive all of it if you change this:
#   RAM: MemTotal 29,576,480 kB = 28.2 GiB.
#   The homelab plane's unreclaimable footprint, read as cgroup anon rather than
#     memory.current (which counts page cache and so overstates what must stay resident):
#     kubepods.slice 5.7 GiB + system.slice minus claude-rc.service 1.4 GiB = 7.1 GiB.
#     Budgeted at 10 GiB so k3s and Longhorn can grow ~40% without racing the fleet.
#   Kernel: SUnreclaim 0.55 GiB. Page cache left free for Longhorn and etcd I/O: ~3 GiB.
#   28.2 - 10 - 0.55 - 3 = 14.6 GiB available to the fleet. 12G leaves ~2.6 GiB of that
#     unspent, because the throttle stalls whichever cgroup loses the race for reclaim and
#     the homelab plane is the one that must not.
# Checked against measurement, not only the arithmetic: the 24h peak memory.current was
# 4.0 GiB for claude-rc.service and 7.2 GiB for user-1000.slice, a fleet peak of 11.2 GiB.
# So 12G sits just above what the fleet actually reaches, which is where a throttle belongs.
#
# memory.high counts PAGE CACHE as well as anon, so an ordinary multi-agent pytest fan-out
# will touch this bound and reclaim cache. That is the cheap half of reclaim and it is
# intended; the anon budget above is what the number is derived from, not what it throttles
# on.
claude_code_fleet_memory_high: 12G

# The fleet's swap ceiling. 2G is a quarter of this host's 8 GiB /swap.img, so the homelab
# plane keeps three quarters — which is what the per-plane 2G was already documented as
# meaning while actually delivering 4G across the two planes. Same not-zero reasoning as
# the per-plane cap below.
claude_code_fleet_swap_max: 2G

# ── The per-plane sub-bounds ────────────────────────────────────────────────────────────
# One plane's share of the fleet bound above, applied to claude-rc.service's own cgroup AND
# to user-<uid>.slice's drop-in. Each must be <= the fleet bound: a sub-bound above its
# parent's is a number that can never be reached. ENFORCED by
# ansible/tests/setup/test_claude_fleet_slice_cap.py.
#
# 8G, unchanged from 2026-09-05 (raised 6G -> 8G at user request alongside the fan-out cap
# above). Deliberately more than half of 12G: a plane doing real work while the other is
# idle should be able to use most of the fleet's budget, and the parent is what stops the
# two of them together. See the unit template on why this is MemoryHigh and not MemoryMax.
claude_code_rc_memory_high: 8G

# One plane's swap ceiling, written to memory.swap.max. Without it a plane swaps without
# limit: on 2026-09-05 claude-rc.service's cgroup held all 8 GiB of this box's swap plus
# 6.96 GB anon, stalled in reclaim 98.5% of the time, and starved every other cgroup — k3s
# at 2.9 GB and kubepods.slice at 10.8 GB. MemoryHigh cannot prevent that. It throttles
# rather than caps, and swap is exactly where a throttled cgroup's anon pages go. Issue
# #1154.
#
# 2G here equals claude_code_fleet_swap_max, so one plane may take the fleet's whole swap
# share while the two together still cannot exceed it. Raise them together.
#
# NOT 0. Zero swap does not contain a cgroup, it relocates the same growth into RAM:
# nothing reclaims anon without swap, MemoryMax is deliberately infinity, so the terminal
# state becomes the GLOBAL OOM killer choosing a victim by badness anywhere on the box —
# a k3s process included. See the unit template on why a kill is the response this host
# cannot absorb.
claude_code_rc_memory_swap_max: 2G

# Whether to set CLAUDE_CODE_DISABLE_BG_SHELL_PRESSURE_REAP on the host, turning off Claude
# Code's kill of backgrounded Bash tasks under a Node memoryPressure event. On by default;
# the unit template carries the reasoning. Set this false to hand the reaper back — the
# reaper is upstream's protection against a runaway background shell, and turning it off
# leaves MemoryHigh and claude_code_rc_capacity as the only bounds.
claude_code_rc_disable_bg_shell_pressure_reap: true

# How often to restart the host so it picks up a Claude Code auto-update. The binary
# updates itself in the background, but a long-lived process keeps running the version it
# started with. systemd OnCalendar syntax.
claude_code_rc_restart_schedule: weekly

# ── Login-session caps (issue #1213) ────────────────────────────────────────────────────
# claude-rc.service's MemoryHigh, MemorySwapMax and PYTEST_XDIST_AUTO_NUM_WORKERS bound only
# that unit's own cgroup. A session started with `claude agents` (or a bare `claude`) from
# an interactive SSH shell lands in user.slice/user-{{ claude_code_login_uid }}.slice/
# session-<n>.scope instead, which none of the three touch. On 2026-09-05 that gap put 965
# processes and 20.4G anon in one such scope while claude-rc.service held 50.9 MB — every
# bound the role had added up to then was scoped to the RC unit's cgroup alone.

# Whether the two tasks below are applied. Unlike claude_code_rc_enabled this has no
# "installed but stopped" middle state to fall back to — false removes the drop-in and the
# environment.d file outright, which is the rollback if the cap ever needs to come off a
# login session (e.g. while debugging a plain human `pytest -n auto` run that wants full
# width).
claude_code_login_caps_enabled: true

# The numeric uid whose login-session slice (user-<uid>.slice) gets the same caps as
# claude-rc.service's own cgroup. Confirmed to be 1000 for {{ sys_user }} on daniel-box by
# the 2026-09-05 incident evidence itself: the runaway scope was
# `user.slice/user-1000.slice/session-14505.scope`. Override per-host if a different uid
# ever owns the account this role manages — a getent lookup was considered and rejected
# here: it would need `become: true` just to read NSS and would make the render tests below
# depend on a fact rather than a plain default.
claude_code_login_uid: 1000
