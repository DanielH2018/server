---
# Remote Control host (claude-rc.service). See CLAUDE.md in this role for what the
# service is and why it exists.
#
# Every var here carries the role's `claude_code_` prefix (ansible-lint
# var-naming[no-role-prefix]), so the Remote Control ones read `claude_code_rc_*`.

# The service hands anything holding the claude.ai account a session on the k3s
# control-plane node, so it shipped disabled until the prerequisite Ansible cannot check was
# confirmed by hand: whether a phone-spawned worktree clears the workspace-trust dialog,
# which nobody can answer remotely. Confirmed on daniel-box 2026-08-23 — a session created
# from the phone produced `.claude/worktrees/test-scratch` on branch `worktree-test-scratch`
# and reached a prompt, with no dialog. Setting this back to false stops AND disables the
# host and its restart timer; that is the rollback.
claude_code_rc_enabled: true

# The directory the host runs in. Sessions spawned on demand get their own worktree
# underneath it; the pre-created session stays here.
claude_code_rc_workdir: "/home/{{ sys_user }}/server"

# DECIDED: worktree, not same-dir. Concurrent sessions sharing one checkout is the exact
# thing this repo's parallel-session rule forbids, and `prune_worktrees.py` already
# collects finished worktrees while respecting a live session's lock.
claude_code_rc_spawn_mode: worktree

# DECIDED: auto, matching interactive sessions on this host. `default` prompts on nearly
# every tool call, which from a phone means a session that stops constantly. Falling back
# to `default` is the supported answer if auto degrades without a TTY — answering prompts
# remotely is what Remote Control is for.
claude_code_rc_permission_mode: auto

# DECIDED: 10, not the CLI's default of 32. Measured on daniel-box, a `claude` process sits
# at 200-400 MB RSS, so 10 sessions ask for up to ~4 GB against ~15 GB available with k3s
# already running. Raised from 3 to 10 on 2026-09-04 at user request.
#
# This is NOT the memory bound, though it read as one here until 2026-09-05. The per-process
# figure above is accurate — the two live sessions during that day's stall measured 404 MB
# and 376 MB. What it does not count is the subprocess tree: those two sessions held 203
# processes and 6.96 GB anon, because the memory belongs to what a session SPAWNS. Capacity
# multiplies that tree, it does not bound it. claude_code_rc_pytest_workers below is the
# bound on the fan-out; MemoryHigh in the unit is the throttle when it is exceeded anyway.
claude_code_rc_capacity: 10

# Workers a single `-n auto` pytest run may use on this host, via PYTEST_XDIST_AUTO_NUM_WORKERS
# in the unit. daniel-box has 16 cores, so `auto` means 16 per run and nothing bounds how many
# runs the sessions launch at once.
#
# Derivation, and the thing to re-derive if you change it: the worst case is workers ×
# capacity, not workers. At 4 × 10 that is 40 workers, and xdist workers measured 20-150 MB
# RSS during the 2026-09-05 stall, so call it ~4 GB of workers against the 8 GB MemoryHigh,
# with the 10 `claude` processes taking most of the rest. That sits the extreme case at the
# throttle point, which is where a throttle belongs.
#
# Checked against the incident rather than only the arithmetic: nine concurrent runs would
# have been 36 workers instead of 144, roughly 3.6 GB instead of the ~15 GB that exhausted
# the box's swap. Raise it on measurement, and re-check the product, not the factor.
claude_code_rc_pytest_workers: 4

# The cgroup throttle for the whole rc host — the host process plus every session it spawns.
# Raised 6G -> 8G on 2026-09-05 at user request, alongside the fan-out cap above. 8G leaves
# roughly 7 GB clear of the ~13 GB k3s + kubepods baseline on this 28 GB box; that headroom
# is the reason not to raise it further, since the throttle stalls whatever cgroup loses the
# race and the homelab plane is the one that must not. See the unit template on why this is
# MemoryHigh and not MemoryMax.
claude_code_rc_memory_high: 8G

# The cgroup's swap ceiling, written to memory.swap.max. Without it the cgroup swaps without
# limit: on 2026-09-05 it held all 8 GiB of this box's swap plus 6.96 GB anon, stalled in
# reclaim 98.5% of the time, and starved every other cgroup — k3s at 2.9 GB and
# kubepods.slice at 10.8 GB. MemoryHigh cannot prevent that. It throttles rather than caps,
# and swap is exactly where a throttled cgroup's anon pages go. Issue #1154.
#
# Derivation, and what to re-derive if you change it: 2G is a quarter of this host's 8 GiB
# /swap.img, so the three-quarters the incident took from the homelab plane stays with it.
# The other half of the sum is MemoryHigh: 8G + 2G puts the cgroup's committed ceiling at
# 10 GB against 28 GiB of RAM with a ~13 GB k3s + kubepods baseline, which leaves ~5 GB
# clear. Raise this only alongside that arithmetic, not on its own.
#
# NOT 0. Zero swap does not contain the cgroup, it relocates the same growth into RAM:
# nothing reclaims anon without swap, MemoryMax is deliberately infinity, so the terminal
# state becomes the GLOBAL OOM killer choosing a victim by badness anywhere on the box —
# a k3s process included. See the unit template on why a kill is the response this host
# cannot absorb.
claude_code_rc_memory_swap_max: 2G

# Whether to set CLAUDE_CODE_DISABLE_BG_SHELL_PRESSURE_REAP on the host, turning off Claude
# Code's kill of backgrounded Bash tasks under a Node memoryPressure event. On by default;
# the unit template carries the reasoning. Set this false to hand the reaper back — the
# reaper is upstream's protection against a runaway background shell, and turning it off
# leaves MemoryHigh and claude_code_rc_capacity as the only bounds.
claude_code_rc_disable_bg_shell_pressure_reap: true

# How often to restart the host so it picks up a Claude Code auto-update. The binary
# updates itself in the background, but a long-lived process keeps running the version it
# started with. systemd OnCalendar syntax.
claude_code_rc_restart_schedule: weekly
