---
- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true
  become: true

# An edited unit takes effect at deploy time instead of waiting for the weekly restart
# timer. Guarded because a handler restart would otherwise START a host that is deliberately
# stopped — the same reason claude-rc-restart.service uses try-restart rather than restart.
- name: Restart claude-rc
  ansible.builtin.systemd:
    name: claude-rc.service
    state: restarted
    daemon_reload: true
  become: true
  when: claude_code_rc_enabled

# Unconditional, unlike claude-rc above: this timer only samples cgroup counters, so unlike
# the rc host there is no "deliberately stopped" state it could wrongly start.
- name: Restart claude-cgroup-metrics timer
  ansible.builtin.systemd:
    name: claude-cgroup-metrics.timer
    state: restarted
    daemon_reload: true
  become: true
