---
# Claude Code is a per-user install (binary under ~/.local/share/claude, launcher symlinked
# at ~/.local/bin/claude), so like chezmoi_setup every task runs become: false. Installing
# it as root would put it in /root and leave the real user without it.
#
# Deliberately the native installer rather than the apt repo Anthropic also publishes: it
# matches daniel-server, needs no root, and auto-updates in the background. The apt route
# would need elevation and would not auto-update.
#
# The home directory is /home/{{ sys_user }}, NOT ansible_env.HOME — ansible_env reports
# the environment of the user facts were GATHERED as, and this play gathers them escalated,
# so ansible_env.HOME is /root even in a become: false task. See chezmoi_setup for the
# failure this caused.

- name: Ensure the installer directory exists
  tags: [claude_code]
  ansible.builtin.file:
    path: "/home/{{ sys_user }}/.local/share/installers"
    state: directory
    mode: "0755"
  become: false

- name: Download the Claude Code installer
  tags: [claude_code]
  # Fetched to a user-owned directory rather than piped straight into a shell: the script
  # is executed, so it should land somewhere world-writable code cannot have tampered with
  # it first, and it stays inspectable after the fact.
  #
  # DECIDED: no `checksum:` on install.sh, unlike the k3s, chezmoi and uv installers. A pin
  # controls which bytes run only when the installed binary stays the one the pinned script
  # fetched. The k3s binary does: it never updates itself. Claude Code does not: the native
  # binary updates itself from downloads.claude.ai, so whatever runs a day after install came
  # from that origin with or without a pin here. The script itself is unversioned at a URL
  # upstream replaces in place, so a pin would only fail the next fresh install (a new host or
  # agent user, since `creates:` below makes the install run-once) until someone re-pinned it.
  # The script checks the binary's sha256 against manifest.json before installing it. That
  # catches a corrupt or truncated download; it is not authentication, because the manifest
  # comes from the same origin as the binary. The trust root is TLS to claude.ai either way.
  # The agent user's copy of this fetch, in setup/common/tasks/agent_user.yml, rests on this
  # decision (#3979).
  ansible.builtin.get_url:
    url: https://claude.ai/install.sh
    dest: "/home/{{ sys_user }}/.local/share/installers/claude-install.sh"
    mode: "0755"
  become: false

- name: Install Claude Code
  tags: [claude_code]
  # `creates` makes this run-once. The native installer manages ~/.local/bin/claude as a
  # symlink into ~/.local/share/claude/versions/ and updates itself thereafter, so
  # re-running the installer on every play would fight its own updater.
  ansible.builtin.command:
    cmd: bash /home/{{ sys_user }}/.local/share/installers/claude-install.sh
  args:
    creates: "/home/{{ sys_user }}/.local/bin/claude"
  become: false

- name: Report the Claude Code version
  tags: [claude_code]
  ansible.builtin.command:
    cmd: "/home/{{ sys_user }}/.local/bin/claude --version"
  register: claude_code_version
  become: false
  changed_when: false
  # A read, so it runs under --check too: skipped, it leaves no stdout and the login report
  # below errors on the attribute. On a host without claude yet, --check only
  # simulated the install above, so there is nothing to run; that is not a failure of the
  # check run.
  check_mode: false
  failed_when: claude_code_version.rc != 0 and not ansible_check_mode

- name: Keep the user manager alive after logout (loginctl enable-linger)
  # user-1000.slice is StopWhenUnneeded=yes, so a fan-out agent launched from an ssh login
  # dies at logout unless the user lingers. This is what lets `systemd-run --user` hold a
  # transient service after the launching ssh call returns.
  tags: [claude_code]
  ansible.builtin.command: "loginctl enable-linger {{ sys_user }}"
  args:
    creates: "/var/lib/systemd/linger/{{ sys_user }}"
  become: true

- name: Check whether Claude Code has been authenticated
  tags: [claude_code]
  # ~/.claude/.credentials.json is written by an interactive `claude login` and holds a
  # refreshing OAuth token. It is per-machine and per-user: it cannot be templated from
  # SOPS, and copying one between hosts would be sharing a credential rather than
  # provisioning one. So this role installs everything EXCEPT the login.
  ansible.builtin.stat:
    path: "/home/{{ sys_user }}/.claude/.credentials.json"
  register: claude_code_credentials
  become: false

- name: Report that an interactive login is still required
  tags: [claude_code]
  ansible.builtin.debug:
    msg: >-
      Claude Code {{ claude_code_version.stdout }} is installed, but this host has no
      ~/.claude/.credentials.json. Log in once, by hand, on {{ inventory_hostname }}:
      run `claude` and follow the browser prompt. Ansible cannot do this step.
  when: not claude_code_credentials.stat.exists

# ── Remote Control host ────────────────────────────────────────────────────────────────
# claude-rc.service keeps `claude rc` running so sessions can be created from the phone
# with nothing started at the terminal first. Claude Code 2.1.241 reports "Service install
# is disabled in this version — the daemon runs on demand and exits when the last client
# disconnects", so there is no built-in always-on host to enable and systemd supervises it
# instead. See this role's CLAUDE.md.

# ── The fleet bound ────────────────────────────────────────────────────────────────────
# One cap for both Claude cgroup planes, on the slice that parents them: claude-rc.service
# (moved into it by the unit's Slice= line) and the user-<uid>.slice of every uid in
# claude_code_login_uids.
# Applied BEFORE the unit is installed so the parent cap is already on disk when the first
# daemon-reload of this play happens — otherwise the unit lands in a slice with no cap until
# the next run. See defaults/main.yml for the derivation and for why user.slice is the only
# slice that can hold both planes.

- name: Ensure the fleet slice drop-in directory exists
  tags: [claude_code]
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ claude_code_fleet_slice }}.d"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true
  when: claude_code_fleet_caps_enabled

- name: Bound the whole Claude fleet with one cap on the slice that parents both planes
  tags: [claude_code]
  ansible.builtin.template:
    src: fleet-slice-caps.conf.j2
    dest: "/etc/systemd/system/{{ claude_code_fleet_slice }}.d/claude-fleet-caps.conf"
    owner: root
    group: root
    mode: "0644"
  become: true
  when: claude_code_fleet_caps_enabled
  notify: Reload systemd

# The way out: removing the drop-in drops the shared ceiling, and the unit's own Slice= line
# disappears with the same variable, which puts claude-rc.service back in system.slice on its
# next restart. Both planes keep their per-plane caps.
- name: Remove the fleet slice cap when the shared parent is disabled
  tags: [claude_code]
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ claude_code_fleet_slice }}.d/claude-fleet-caps.conf"
    state: absent
  become: true
  when: not claude_code_fleet_caps_enabled
  notify: Reload systemd

- name: Install the Remote Control host units
  tags: [claude_code]
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    mode: "0644"
  loop:
    - claude-rc.service
    - claude-rc-restart.service
    - claude-rc-restart.timer
  become: true
  notify:
    - Reload systemd
    - Restart claude-rc

- name: Ensure the Remote Control config directory exists
  tags: [claude_code]
  ansible.builtin.file:
    path: /etc/claude-rc
    state: directory
    owner: root
    group: root
    mode: "0750"
  become: true

# OnFailure target, which pages Discord if the host dies. What it CANNOT catch is an expired
# login: the host keeps running and systemd keeps reporting `active` while every session fails,
# so no OnFailure= ever fires. This role's CLAUDE.md has that gap.
- name: Install the Remote Control failure alert
  tags: [claude_code]
  ansible.builtin.import_tasks: "{{ role_path }}/../common/tasks/alert_unit.yml"
  vars:
    alert_unit_name: claude-rc
    alert_unit_description: Alert when the Claude Code Remote Control host fails
    alert_unit_message: "🚨 claude-rc unit failed on {{ inventory_hostname }} — Remote Control sessions cannot be started from the phone. Check `journalctl -u claude-rc`."
    alert_unit_env_dir: /etc/claude-rc

# Both states are driven from the one var so the service has a way out as well as a way in:
# false stops AND disables it, which is the rollback if a phone-reachable session on the
# control-plane node turns out to be a bad idea.
- name: Set the Remote Control host's running state
  tags: [claude_code]
  ansible.builtin.systemd:
    name: claude-rc.service
    enabled: "{{ claude_code_rc_enabled }}"
    state: "{{ 'started' if claude_code_rc_enabled else 'stopped' }}"
    daemon_reload: true
  become: true

- name: Set the Remote Control restart timer's running state
  tags: [claude_code]
  # Follows the host: a timer restarting a service that is meant to be down is noise, and
  # try-restart would no-op anyway.
  ansible.builtin.systemd:
    name: claude-rc-restart.timer
    enabled: "{{ claude_code_rc_enabled }}"
    state: "{{ 'started' if claude_code_rc_enabled else 'stopped' }}"
    daemon_reload: true
  become: true

- name: Report that the Remote Control host is installed but not started
  tags: [claude_code]
  ansible.builtin.debug:
    msg: >-
      claude-rc.service is installed and left stopped. Before enabling it, run
      `claude rc --spawn={{ claude_code_rc_spawn_mode }} --permission-mode
      {{ claude_code_rc_permission_mode }} --capacity 2` by hand on {{ inventory_hostname }}
      and confirm a session created from the phone reaches a prompt in its own worktree —
      a workspace-trust dialog there cannot be answered remotely. Then set
      claude_code_rc_enabled=true.
  when: not claude_code_rc_enabled

# ── Cgroup resource metrics ────────────────────────────────────────────────────────────
# The cgroup counters for claude-rc.service and user-1000.slice (SSH-started sessions) are
# already free (this host sets DefaultMemoryAccounting/CPUAccounting=yes) and node-exporter's
# textfile collector is already deployed and scraped, so this drops a gauge set into it every
# 30s with no exporter change. Read-only observation only — it does not touch the cap
# mechanism.

- name: Deploy the cgroup metrics script
  tags: [claude_code]
  ansible.builtin.copy:
    src: claude-cgroup-metrics.sh
    dest: /usr/local/bin/claude-cgroup-metrics.sh
    mode: "0755"
    owner: root
    group: root
  become: true

- name: Install the cgroup metrics timer units
  tags: [claude_code]
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    mode: "0644"
  loop:
    - claude-cgroup-metrics.service
    - claude-cgroup-metrics.timer
  become: true
  notify:
    - Reload systemd
    - Restart claude-cgroup-metrics timer

- name: Enable and start the cgroup metrics timer
  tags: [claude_code]
  ansible.builtin.systemd:
    name: claude-cgroup-metrics.timer
    enabled: true
    state: started
    daemon_reload: true
  become: true

# ── Memory store copy (issue #3123) ─────────────────────────────────────────────────────
# Copies this host's Claude memory store to claude_code_memory_sync_target, one-way and
# overwriting. Armed only in daniel-box's host_vars; see defaults/main.yml and this role's
# CLAUDE.md contract. The alert unit reads the webhook file written above.

- name: Install the memory store copy units
  tags: [claude_code]
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - claude-memory-sync.service
    - claude-memory-sync.timer
  become: true
  when: claude_code_memory_sync_enabled
  notify: Reload systemd

# Shares claude-rc's webhook file in /etc/claude-rc; rewriting it here changes nothing.
- name: Install the memory store copy failure alert
  tags: [claude_code]
  when: claude_code_memory_sync_enabled
  ansible.builtin.import_tasks: "{{ role_path }}/../common/tasks/alert_unit.yml"
  vars:
    alert_unit_name: claude-memory-sync
    alert_unit_description: Alert when the Claude memory store copy fails
    alert_unit_message: "claude-memory-sync failed on {{ inventory_hostname }}: sessions on {{ claude_code_memory_sync_target }} keep reading a stale memory store. Check `journalctl -u claude-memory-sync`."
    alert_unit_env_dir: /etc/claude-rc

- name: Enable and start the memory store copy timer
  tags: [claude_code]
  ansible.builtin.systemd:
    name: claude-memory-sync.timer
    enabled: true
    state: started
    daemon_reload: true
  become: true
  when: claude_code_memory_sync_enabled

# The way out: false stops the timer and removes all three units, so a disarmed host is left
# with nothing that could copy. The far store keeps whatever the last run wrote.
- name: Check whether a memory store copy timer is installed
  tags: [claude_code]
  ansible.builtin.stat:
    path: /etc/systemd/system/claude-memory-sync.timer
  register: claude_code_memory_sync_timer_file
  become: true
  when: not claude_code_memory_sync_enabled

# Guarded on the file: systemd refuses to stop a unit it has never heard of, which is every
# host that was never armed.
- name: Stop and disable the memory store copy timer when disarmed
  tags: [claude_code]
  ansible.builtin.systemd:
    name: claude-memory-sync.timer
    enabled: false
    state: stopped
  become: true
  when:
    - not claude_code_memory_sync_enabled
    - claude_code_memory_sync_timer_file.stat.exists

- name: Remove the memory store copy units when disarmed
  tags: [claude_code]
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ item }}"
    state: absent
  loop:
    - claude-memory-sync.service
    - claude-memory-sync.timer
    - claude-memory-sync-alert.service
  become: true
  when: not claude_code_memory_sync_enabled
  notify: Reload systemd

# ── The agent user ──────────────────────────────────────────────────────────────────────
# A Unix user for the operator's Claude sessions with no sudo, no group membership and no read
# on /home/{{ sys_user }}. See defaults/main.yml and this role's CLAUDE.md.

- name: Create the agent user, its tools and its clone
  tags: [claude_code]
  when: claude_code_agent_user_enabled
  ansible.builtin.import_tasks: "{{ role_path }}/../common/tasks/agent_user.yml"
  vars:
    agent_user_name: "{{ claude_code_agent_user }}"
    agent_user_home: "{{ claude_code_agent_user_home }}"
    agent_user_clone_dir: "{{ claude_code_agent_user_clone_dir }}"
    agent_user_repo: "{{ claude_code_agent_user_repo }}"

# The reverse of the expiry the switched-off arm below sets.
- name: Lift the agent user's account expiry
  tags: [claude_code]
  ansible.builtin.user:
    name: "{{ claude_code_agent_user }}"
    expires: -1
  become: true
  when: claude_code_agent_user_enabled

- name: Give the agent user a login profile
  tags: [claude_code]
  ansible.builtin.template:
    src: agent-user-profile.j2
    dest: "{{ claude_code_agent_user_home }}/.profile"
    owner: "{{ claude_code_agent_user }}"
    # The group the shared task file's recursive chown sets, so the two never flip each other.
    group: "{{ sys_user }}"
    mode: "0644"
  become: true
  when: claude_code_agent_user_enabled

- name: Sync the repo's venv in the agent user's clone
  tags: [claude_code]
  # The profile points the hook shim at this clone, and the shim runs every guard with
  # `uv run --no-sync`. A clone with no .venv has guards that cannot import, and each one
  # falls back to `ask` (#3513). renovate-agent syncs its own worktree before each session
  # (renovate_agent/files/run_worktree.py); nothing else does it for this user. runuser for
  # the reason the shared task file gives: a root-run sync leaves a root-owned .venv.
  ansible.builtin.command:
    argv:
      - runuser
      - -u
      - "{{ claude_code_agent_user }}"
      - --
      - "{{ claude_code_agent_user_home }}/.local/bin/uv"
      - sync
      - --frozen
    chdir: "{{ claude_code_agent_user_clone_dir }}"
  environment:
    HOME: "{{ claude_code_agent_user_home }}"
    # runuser keeps root's TMPDIR (/tmp/user/0 on the host), which the agent cannot write.
    TMPDIR: /tmp
  register: claude_code_agent_user_sync
  changed_when: >-
    claude_code_agent_user_sync.stderr is search('^(Installed|Uninstalled) ', multiline=True)
  become: true
  when: claude_code_agent_user_enabled

- name: Create the agent user's kubeconfig directory
  tags: [claude_code]
  ansible.builtin.file:
    path: "{{ claude_code_agent_user_home }}/.kube"
    state: directory
    owner: "{{ claude_code_agent_user }}"
    # The group the shared task file's recursive chown sets, so the two never flip each other.
    group: "{{ sys_user }}"
    mode: "0700"
  become: true
  when: claude_code_agent_user_enabled

- name: Give the agent user the operator's read-only kubeconfig
  tags: [claude_code]
  # The homelab-readonly ServiceAccount the k3s role writes for {{ sys_user }}: get, list and
  # watch, with Secrets and pods/exec refused. Never /etc/rancher/k3s/k3s.yaml, which is
  # cluster-admin. Copied, as uv is, so a token the k3s role re-mints reaches the agent on the
  # next apply of this role.
  ansible.builtin.copy:
    src: "/home/{{ sys_user }}/.kube/config"
    dest: "{{ claude_code_agent_user_home }}/.kube/config"
    remote_src: true
    owner: "{{ claude_code_agent_user }}"
    group: "{{ sys_user }}"
    mode: "0600"
  become: true
  # The file carries the ServiceAccount's token, which a --diff run would print.
  diff: false
  no_log: true
  when: claude_code_agent_user_enabled

- name: Look for the operator's deployed cc-wait
  tags: [claude_code]
  ansible.builtin.stat:
    path: /home/{{ sys_user }}/.local/share/cc-wait/cc_wait
  register: claude_code_agent_cc_wait
  become: true
  when: claude_code_agent_user_enabled

- name: Create the agent user's cc-wait directory
  tags: [claude_code]
  ansible.builtin.file:
    path: "{{ claude_code_agent_user_home }}/.local/share/cc-wait"
    state: directory
    owner: "{{ claude_code_agent_user }}"
    group: "{{ sys_user }}"
    mode: "0755"
  become: true
  when: claude_code_agent_user_enabled

- name: Give the agent user the operator's cc-wait
  tags: [claude_code]
  # The repo's skills wait with cc-wait, `land.sh ... --detach && cc-wait land <n>` among them,
  # and the dotfiles repo deploys it under the operator's home only. Copied, as claude_guard is,
  # so the agent waits with the operator's version. A host without the dotfiles deploy skips
  # this. `default`: a skipped stat above still sets the register, with no `stat` key in it.
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    remote_src: true
    owner: "{{ claude_code_agent_user }}"
    group: "{{ sys_user }}"
    mode: preserve
  loop:
    - src: /home/{{ sys_user }}/.local/share/cc-wait/cc_wait
      dest: "{{ claude_code_agent_user_home }}/.local/share/cc-wait/"
    - src: /home/{{ sys_user }}/.local/bin/cc-wait
      dest: "{{ claude_code_agent_user_home }}/.local/bin/cc-wait"
  become: true
  when:
    - claude_code_agent_user_enabled
    - claude_code_agent_cc_wait.stat.exists | default(false)

- name: Give the agent user its GitHub identity
  tags: [claude_code]
  when: claude_code_agent_user_enabled
  ansible.builtin.import_tasks: agent_github.yml

- name: Give the agent user its homelab-ui login
  tags: [claude_code]
  when: claude_code_agent_user_enabled
  ansible.builtin.import_tasks: agent_homelab_ui.yml

- name: Give the agent user its homelab-ui browser and MCP registration, or take them back
  tags: [claude_code]
  when: claude_code_agent_user_enabled
  ansible.builtin.import_tasks: agent_browser.yml

- name: Set what the agent reads of the host, and what the operator reads of the agent
  tags: [claude_code]
  when: claude_code_agent_user_enabled
  ansible.builtin.import_tasks: agent_access.yml

- name: Give the agent a subset of the operator's Claude config, or take it back
  tags: [claude_code]
  when: claude_code_agent_user_enabled
  ansible.builtin.import_tasks: agent_operator_config.yml

# Once, when the phone host moves to the agent: its sessions would otherwise start with an
# empty memory store. Guarded again inside by the agent's own MEMORY.md.
- name: Copy the operator's memory store into the agent's, the first time the agent is the host's user
  tags: [claude_code]
  when:
    - claude_code_agent_user_enabled
    - claude_code_user == claude_code_agent_user
    - claude_code_agent_memory_seed
  ansible.builtin.import_tasks: agent_memory_seed.yml

# After the agent user exists: the caps follow its uid, looked up from the passwd database.
# The block sits down here, not beside the cgroup metrics above, because a first apply that
# built the user in the same run would otherwise find no uid to cap.
- name: Cap the login-session slices of every account that starts Claude sessions
  tags: [claude_code]
  ansible.builtin.import_tasks: login_caps.yml

# The token is the one credential in the home that works off this host, so switching the user
# off removes it. The signing key stays: it can only sign, and a new one would need adding to
# the account again. Revoking the token on GitHub is the operator's half of this.
- name: Remove the agent user's GitHub token when it is switched off
  tags: [claude_code]
  ansible.builtin.file:
    path: "{{ claude_code_agent_user_home }}/.config/gh/hosts.yml"
    state: absent
  become: true
  when: not claude_code_agent_user_enabled

# The homelab-ui login is a live Authelia credential, so switching the user off removes it too.
# Disabling the Authelia account itself is the operator's half: delete the `claude-agent` block
# in the authelia role and redeploy.
- name: Remove the agent user's homelab-ui login when it is switched off
  tags: [claude_code]
  ansible.builtin.file:
    path: "{{ claude_code_homelab_ui_credentials }}"
    state: absent
  become: true
  when: not claude_code_agent_user_enabled

- name: Look for the agent user on a host that has it switched off
  tags: [claude_code]
  ansible.builtin.getent:
    database: passwd
    key: "{{ claude_code_agent_user }}"
    fail_key: false
  when: not claude_code_agent_user_enabled

# The way out. Expired rather than removed: removing the user strands its files under a bare
# uid, and the home holds the agent's clone and any work it has not pushed. 86400 is
# 1970-01-02, because a shadow expiry of day 0 also reads as "never expires".
- name: Expire the agent user's account when it is switched off
  tags: [claude_code]
  ansible.builtin.user:
    name: "{{ claude_code_agent_user }}"
    expires: 86400
  become: true
  when:
    - not claude_code_agent_user_enabled
    - ansible_facts.getent_passwd[claude_code_agent_user] is not none

# ── The agent's lander ──────────────────────────────────────────────────────────────────
# claude-land@<n>.service lands one of the agent's PRs as {{ sys_user }}, under land.sh's
# landing policy. See defaults/main.yml. The approval list and the unit go in before the rule,
# so the agent cannot start a landing that would read neither.

- name: Create the lander's config directory
  tags: [claude_code]
  ansible.builtin.file:
    path: /etc/claude-land
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true
  when: claude_code_agent_user_enabled and claude_code_lander_enabled

- name: Write the paths an agent PR cannot land without the operator
  tags: [claude_code]
  ansible.builtin.template:
    src: claude-land-approval-paths.j2
    dest: /etc/claude-land/approval-paths
    owner: root
    group: root
    mode: "0644"
  become: true
  when: claude_code_agent_user_enabled and claude_code_lander_enabled

- name: Install the lander unit
  tags: [claude_code]
  ansible.builtin.template:
    src: claude-land@.service.j2
    dest: /etc/systemd/system/claude-land@.service
    owner: root
    group: root
    mode: "0644"
  become: true
  when: claude_code_agent_user_enabled and claude_code_lander_enabled
  notify: Reload systemd

- name: Let the agent user start a landing and nothing else (polkit)
  tags: [claude_code]
  ansible.builtin.template:
    src: 50-claude-land.rules.j2
    dest: /etc/polkit-1/rules.d/50-claude-land.rules
    owner: root
    group: root
    mode: "0644"
  become: true
  when: claude_code_agent_user_enabled and claude_code_lander_enabled
  # No handler: polkitd watches rules.d and reloads a changed rule on its own.

# The way out, when either switch is off. The rule goes first, so the agent loses the start
# before anything else changes. Removing the unit file does not stop a landing already running.
- name: Remove the lander when the agent user or the lander is switched off
  tags: [claude_code]
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/polkit-1/rules.d/50-claude-land.rules
    - /etc/systemd/system/claude-land@.service
    - /etc/claude-land
  become: true
  when: not (claude_code_agent_user_enabled and claude_code_lander_enabled)
  notify: Reload systemd

# Render provenance for manifest-prune-check.sh's stale-script arm: without a stamp, an edit to
# a rendered file can sit undeployed on this host with every repo-side check green. Last in the
# role so a failed run leaves the previous checksums rather than claiming these. `import_tasks`,
# not `include_tasks`: an include renders no fragment.
- name: Stamp the rendered Remote Control units
  tags: [claude_code]
  ansible.builtin.import_tasks: "{{ role_path }}/../common/tasks/stamp_render.yml"
  vars:
    stamp_render_name: claude-code
    stamp_render_templates:
      - ansible/roles/setup/claude_code/templates/claude-rc.service.j2
      - ansible/roles/setup/common/templates/unit-failure-alert.service.j2
      - ansible/roles/setup/common/templates/alert-webhook.env.j2
      - ansible/roles/setup/claude_code/templates/claude-rc-restart.service.j2
      - ansible/roles/setup/claude_code/templates/claude-rc-restart.timer.j2
      - ansible/roles/setup/claude_code/templates/claude-cgroup-metrics.service.j2
      - ansible/roles/setup/claude_code/templates/claude-cgroup-metrics.timer.j2
      - ansible/roles/setup/claude_code/templates/fleet-slice-caps.conf.j2
      - ansible/roles/setup/claude_code/templates/login-slice-caps.conf.j2
      - ansible/roles/setup/claude_code/templates/pytest-fanout-cap.conf.j2
      - ansible/roles/setup/claude_code/templates/claude-memory-sync.service.j2
      - ansible/roles/setup/claude_code/templates/claude-memory-sync.timer.j2
      - ansible/roles/setup/claude_code/templates/claude-land@.service.j2
      - ansible/roles/setup/claude_code/templates/50-claude-land.rules.j2
      - ansible/roles/setup/claude_code/templates/claude-land-approval-paths.j2

# Sibling of the stamp above, for the ONE copy:-deployed (not template:-rendered) artifact
# this role carries — manifest-prune-check.sh's second arm (is the deployed code the repo's
# code?) only sees a copy:-deployed script if it is registered here.
- name: Record the deployed cgroup metrics script for drift checking
  tags: [claude_code]
  ansible.builtin.import_tasks: "{{ role_path }}/../common/tasks/stamp_deployed.yml"
  vars:
    stamp_deployed_name: claude-code-cgroup-metrics
    stamp_deployed_pairs:
      - live: /usr/local/bin/claude-cgroup-metrics.sh
        src: ansible/roles/setup/claude_code/files/claude-cgroup-metrics.sh
