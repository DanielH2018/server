---
# One agent user: a Unix user for Claude sessions with no sudo, no group membership and no read
# on /home/{{ sys_user }}. main.yml includes this file once per entry of claude_code_agents, and
# maps the entry's profile onto the claude_code_agent_* names every task and template here
# reads, so one copy of these tasks serves every agent. defaults/main.yml has the fields;
# filter_plugins/claude_agents.py has the checks.
#
# Units are named after the agent (<name>-clone-sync), so two agents never share one. The
# primary agent alone gets the peer ssh login; main.yml gives it the homelab-ui browser and
# login, and tasks/lander.yml the lander, outside this loop.

- name: Create the agent user, its tools and its clone
  tags: [claude_code]
  when: claude_code_agent_user_enabled
  ansible.builtin.import_tasks: "{{ role_path }}/../common/tasks/agent_user.yml"
  vars:
    agent_user_name: "{{ claude_code_agent_user }}"
    agent_user_home: "{{ claude_code_agent_user_home }}"
    agent_user_clone_dir: "{{ claude_code_agent_user_clone_dir }}"
    agent_user_repo: "{{ claude_code_agent_user_repo }}"

# The reverse of the expiry the switched-off arm below sets.
- name: Lift the agent user's account expiry
  tags: [claude_code]
  ansible.builtin.user:
    name: "{{ claude_code_agent_user }}"
    expires: -1
  become: true
  when: claude_code_agent_user_enabled

- name: Keep the agent user's manager alive after logout, so its fan-out batches survive
  # The same reason as the operator's linger above, for the agent user: fanout_place.py
  # launches a batch with `systemd-run --user` as the agent, locally or over ssh, and the batch
  # outlives that call. After the user exists: loginctl refuses a name it cannot look up, which
  # failed a host's first apply (daniel-server, 2026-10-10).
  tags: [claude_code]
  ansible.builtin.command: "loginctl enable-linger {{ claude_code_agent_user }}"
  args:
    creates: "/var/lib/systemd/linger/{{ claude_code_agent_user }}"
  become: true
  when: claude_code_agent_user_enabled

- name: Give the agent user a login profile
  tags: [claude_code]
  ansible.builtin.template:
    src: agent-user-profile.j2
    dest: "{{ claude_code_agent_user_home }}/.profile"
    owner: "{{ claude_code_agent_user }}"
    # The group the shared task file's recursive chown sets, so the two never flip each other.
    group: "{{ sys_user }}"
    mode: "0644"
  become: true
  when: claude_code_agent_user_enabled

# The shared task file clones once and never pulls, yet two things run from this clone's main
# working tree rather than from a session's worktree: the hook shim (the profile above) and the
# homelab-ui MCP launcher (agent_browser.yml). A clone left 94 commits behind ran a ui_mcp.sh
# that still decrypted SOPS, which the agent cannot do, and the MCP server never connected
# (#4067, #4099). files/claude-clone-sync.sh fast-forwards it when it is a clean master, and
# leaves anything else alone as the agent's work in progress. This apply runs it before the venv
# sync below reads the clone's uv.lock. <name>-clone-sync.timer runs it between applies, since a
# merge touching only the launcher or .claude/hooks/ applies no role at all (#4162).
- name: Fast-forward the agent user's clone to origin's master
  tags: [claude_code]
  # Never fatal. The GitOps tick applies this role, and a red task there holds the deployer
  # over the agent's own clone. A session's fetch holding a ref lock, a diverged local master
  # or a network blip fails this pull; the report task below names it instead.
  ansible.builtin.command:
    argv:
      - runuser
      - -u
      - "{{ claude_code_agent_user }}"
      - --
      - /usr/local/bin/claude-clone-sync.sh
      - "{{ claude_code_agent_user_clone_dir }}"
  environment:
    HOME: "{{ claude_code_agent_user_home }}"
    # runuser keeps root's TMPDIR (/tmp/user/0 on the host), which the agent cannot write.
    TMPDIR: /tmp
  register: claude_code_agent_clone_pull
  changed_when: claude_code_agent_clone_pull.stdout | default('') is search('^advanced ', multiline=True)
  failed_when: false
  become: true
  when: claude_code_agent_user_enabled

- name: Report that the agent user's clone was left behind
  tags: [claude_code]
  ansible.builtin.debug:
    msg: >-
      {{ claude_code_agent_user_clone_dir }} was not fast-forwarded:
      {{ 'its sync failed: ' ~ (claude_code_agent_clone_pull.stderr | default(''))
      if claude_code_agent_clone_pull.rc | default(0) != 0
      else claude_code_agent_clone_pull.stdout | default('the sync did not run') }}.
      The agent's hook shim and homelab-ui launcher keep running its old code until it moves.
  when:
    - claude_code_agent_user_enabled
    - not ansible_check_mode
    - >-
      claude_code_agent_clone_pull is skipped
      or claude_code_agent_clone_pull.rc | default(0) != 0
      or claude_code_agent_clone_pull.stdout | default('') is search('^skipped: ', multiline=True)

- name: Install the agent user's clone sync units
  tags: [claude_code]
  ansible.builtin.template:
    src: "claude-clone-sync.{{ item }}.j2"
    dest: "/etc/systemd/system/{{ claude_code_agent_user }}-clone-sync.{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: [service, timer]
  become: true
  when: claude_code_agent_user_enabled
  notify: Reload systemd

# Shares claude-rc's webhook file in /etc/claude-rc, which the role creates on every host.
- name: Install the agent user's clone sync failure alert
  tags: [claude_code]
  when: claude_code_agent_user_enabled
  ansible.builtin.import_tasks: "{{ role_path }}/../common/tasks/alert_unit.yml"
  vars:
    alert_unit_name: "{{ claude_code_agent_user }}-clone-sync"
    alert_unit_description: Alert when the {{ claude_code_agent_user }} agent user's clone cannot be fast-forwarded
    alert_unit_message: "{{ claude_code_agent_user }}-clone-sync failed on {{ inventory_hostname }}: the {{ claude_code_agent_user }} agent user keeps running old hooks and an old homelab-ui launcher. Check `journalctl -u {{ claude_code_agent_user }}-clone-sync`."
    alert_unit_env_dir: /etc/claude-rc

- name: Enable and start the agent user's clone sync timer
  tags: [claude_code]
  ansible.builtin.systemd:
    name: "{{ claude_code_agent_user }}-clone-sync.timer"
    enabled: true
    state: started
    daemon_reload: true
  become: true
  when: claude_code_agent_user_enabled

- name: Sync the repo's venv in the agent user's clone
  tags: [claude_code]
  # The profile points the hook shim at this clone, and the shim runs every guard with
  # `uv run --no-sync`. A clone with no .venv has guards that cannot import, and each one
  # falls back to `ask` (#3513). renovate-agent syncs its own worktree before each session
  # (renovate_agent/files/run_worktree.py); nothing else does it for this user. runuser for
  # the reason the shared task file gives: a root-run sync leaves a root-owned .venv.
  ansible.builtin.command:
    argv:
      - runuser
      - -u
      - "{{ claude_code_agent_user }}"
      - --
      - "{{ claude_code_agent_user_home }}/.local/bin/uv"
      - sync
      - --frozen
    chdir: "{{ claude_code_agent_user_clone_dir }}"
  environment:
    HOME: "{{ claude_code_agent_user_home }}"
    # runuser keeps root's TMPDIR (/tmp/user/0 on the host), which the agent cannot write.
    TMPDIR: /tmp
  register: claude_code_agent_user_sync
  changed_when: >-
    claude_code_agent_user_sync.stderr is search('^(Installed|Uninstalled) ', multiline=True)
  become: true
  when: claude_code_agent_user_enabled

- name: Install the pinned Ansible collections in the agent user's clone
  tags: [claude_code]
  # ansible.cfg's absolute collections fallback is the operator's checkout, under the 0750
  # /home/{{ sys_user }}, so a worktree of this clone resolved no collection at all and every
  # playbook the agent ran died at `couldn't resolve module/action` (#4108). The login profile
  # points ANSIBLE_COLLECTIONS_PATH's fallback here instead. The venv's ansible-galaxy, which
  # the sync above just installed, rather than `uv run`, which would sync again.
  ansible.builtin.command:
    argv:
      - runuser
      - -u
      - "{{ claude_code_agent_user }}"
      - --
      - "{{ claude_code_agent_user_clone_dir }}/.venv/bin/ansible-galaxy"
      - collection
      - install
      - -r
      - ansible/requirements.yml
      - -p
      - ansible/collections
    chdir: "{{ claude_code_agent_user_clone_dir }}"
  environment:
    HOME: "{{ claude_code_agent_user_home }}"
    TMPDIR: /tmp
  register: claude_code_agent_collections
  changed_when: claude_code_agent_collections.stdout is search('was installed successfully')
  # Never fatal, for the clone pull's reason above: a Galaxy outage would otherwise hold the
  # deployer over the agent's development environment. A failure leaves the collections the
  # last apply installed, and the warning below names it.
  failed_when: false
  become: true
  when: claude_code_agent_user_enabled

- name: Report that the agent user's collections were not installed
  tags: [claude_code]
  ansible.builtin.debug:
    msg: >-
      ansible-galaxy failed in {{ claude_code_agent_user_clone_dir }}:
      {{ claude_code_agent_collections.stderr | default('') }}.
      The agent's playbooks keep the collections an earlier apply installed, or none.
  when:
    - claude_code_agent_user_enabled
    - not ansible_check_mode
    - claude_code_agent_collections.rc | default(0) != 0

- name: Install the commit hooks in the agent user's clone
  tags: [claude_code]
  # Without them the agent's commits skip gitleaks and the commit-time ratchets, and a
  # plaintext secret reaches a pushed branch before anything scans it (#4100). One install
  # covers every worktree of the clone, since worktrees share its .git/hooks. The hook calls
  # the prek that installed it by absolute path, so it runs the agent's copy. `removes:` skips
  # a host where agent_user.yml found no prek to copy; renovate_agent imports that file too
  # and gets the binary but no hooks, so its unattended commits behave as before.
  ansible.builtin.command:
    argv:
      - runuser
      - -u
      - "{{ claude_code_agent_user }}"
      - --
      - "{{ claude_code_agent_user_home }}/.local/bin/prek"
      - install
    chdir: "{{ claude_code_agent_user_clone_dir }}"
    creates: "{{ claude_code_agent_user_clone_dir }}/.git/hooks/pre-commit"
    removes: "{{ claude_code_agent_user_home }}/.local/bin/prek"
  environment:
    HOME: "{{ claude_code_agent_user_home }}"
    TMPDIR: /tmp
  register: claude_code_agent_hooks
  # Never fatal, for the clone pull's reason above. prek refuses while the clone sets
  # core.hooksPath, and the report below names that.
  failed_when: false
  become: true
  when: claude_code_agent_user_enabled

- name: Report that the agent user's commit hooks were not installed
  tags: [claude_code]
  ansible.builtin.debug:
    msg: >-
      prek install failed in {{ claude_code_agent_user_clone_dir }}:
      {{ claude_code_agent_hooks.stderr | default('') }}.
      The agent's commits skip gitleaks and the commit-time checks until it succeeds.
  when:
    - claude_code_agent_user_enabled
    - not ansible_check_mode
    - claude_code_agent_hooks.rc | default(0) != 0

- name: Create the agent user's kubeconfig directory
  tags: [claude_code]
  ansible.builtin.file:
    path: "{{ claude_code_agent_user_home }}/.kube"
    state: directory
    owner: "{{ claude_code_agent_user }}"
    # The group the shared task file's recursive chown sets, so the two never flip each other.
    group: "{{ sys_user }}"
    mode: "0700"
  become: true
  when: claude_code_agent_user_enabled

- name: Look for the operator's read-only kubeconfig
  tags: [claude_code]
  ansible.builtin.stat:
    path: "/home/{{ sys_user }}/.kube/config"
  register: claude_code_operator_kubeconfig
  become: true
  when: claude_code_agent_user_enabled

# Only where the operator has one. daniel-server, a k3s agent node, has none, and its agent
# runs fan-out batches that stop at the PR, so it reads no cluster state (2026-10-10).
- name: Give the agent user the operator's read-only kubeconfig
  tags: [claude_code]
  # The homelab-readonly ServiceAccount the k3s role writes for {{ sys_user }}: get, list and
  # watch, with Secrets and pods/exec refused. Never /etc/rancher/k3s/k3s.yaml, which is
  # cluster-admin. Copied, as uv is, so a token the k3s role re-mints reaches the agent on the
  # next apply of this role.
  ansible.builtin.copy:
    src: "/home/{{ sys_user }}/.kube/config"
    dest: "{{ claude_code_agent_user_home }}/.kube/config"
    remote_src: true
    owner: "{{ claude_code_agent_user }}"
    group: "{{ sys_user }}"
    mode: "0600"
  become: true
  # The file carries the ServiceAccount's token, which a --diff run would print.
  diff: false
  no_log: true
  when:
    - claude_code_agent_user_enabled
    - claude_code_operator_kubeconfig.stat.exists

- name: Look for the operator's deployed cc-wait
  tags: [claude_code]
  ansible.builtin.stat:
    path: /home/{{ sys_user }}/.local/share/cc-wait/cc_wait
  register: claude_code_agent_cc_wait
  become: true
  when: claude_code_agent_user_enabled

- name: Create the agent user's cc-wait directory
  tags: [claude_code]
  ansible.builtin.file:
    path: "{{ claude_code_agent_user_home }}/.local/share/cc-wait"
    state: directory
    owner: "{{ claude_code_agent_user }}"
    group: "{{ sys_user }}"
    mode: "0755"
  become: true
  when: claude_code_agent_user_enabled

- name: Give the agent user the operator's cc-wait
  tags: [claude_code]
  # The repo's skills wait with cc-wait, `land.sh ... --detach && cc-wait land <n>` among them,
  # and the dotfiles repo deploys it under the operator's home only. Copied, as claude_guard is,
  # so the agent waits with the operator's version. A host without the dotfiles deploy skips
  # this. `default`: a skipped stat above still sets the register, with no `stat` key in it.
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    remote_src: true
    owner: "{{ claude_code_agent_user }}"
    group: "{{ sys_user }}"
    mode: preserve
  loop:
    - src: /home/{{ sys_user }}/.local/share/cc-wait/cc_wait
      dest: "{{ claude_code_agent_user_home }}/.local/share/cc-wait/"
    - src: /home/{{ sys_user }}/.local/bin/cc-wait
      dest: "{{ claude_code_agent_user_home }}/.local/bin/cc-wait"
  become: true
  when:
    - claude_code_agent_user_enabled
    - claude_code_agent_cc_wait.stat.exists | default(false)
    - not claude_code_agent_dotfiles

- name: Look for the operator's deployed jsonq
  tags: [claude_code]
  ansible.builtin.stat:
    path: /home/{{ sys_user }}/.local/share/jsonq
  register: claude_code_agent_jsonq
  become: true
  when: claude_code_agent_user_enabled

- name: Give the agent user the operator's jsonq
  tags: [claude_code]
  # The operator's CLAUDE.md, which the agent imports, says jsonq is installed for JSON work jq
  # cannot express; without it a session falls back to the prompting `python3 -c` (#4101). The
  # dotfiles repo deploys it under the operator's home only. The script loads its modules from
  # ../share/jsonq beside its own real path, so both halves are copied. Copied as cc-wait is
  # above, and skipped the same way on a host without the dotfiles deploy.
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    remote_src: true
    owner: "{{ claude_code_agent_user }}"
    group: "{{ sys_user }}"
    mode: preserve
  loop:
    - src: /home/{{ sys_user }}/.local/share/jsonq
      dest: "{{ claude_code_agent_user_home }}/.local/share/"
    - src: /home/{{ sys_user }}/.local/bin/jsonq
      dest: "{{ claude_code_agent_user_home }}/.local/bin/jsonq"
  become: true
  when:
    - claude_code_agent_user_enabled
    - claude_code_agent_jsonq.stat.exists | default(false)
    - not claude_code_agent_dotfiles

- name: Give the agent user its GitHub identity
  tags: [claude_code]
  when: claude_code_agent_user_enabled
  ansible.builtin.import_tasks: agent_github.yml

- name: Give the agent user an ssh key for the peers and name them
  tags: [claude_code]
  when:
    - claude_code_agent_user_enabled
    - claude_code_agent_is_primary
    - inventory_hostname == claude_agent_ssh_key_host
  ansible.builtin.import_tasks: agent_peers.yml

- name: Let the key host's agent log in as this host's agent user, or take it back
  tags: [claude_code]
  when:
    - claude_code_agent_user_enabled
    - claude_code_agent_is_primary
    - inventory_hostname != claude_agent_ssh_key_host
  ansible.builtin.import_tasks: agent_ssh_login.yml

- name: Set what the agent reads of the host, and what the operator reads of the agent
  tags: [claude_code]
  when: claude_code_agent_user_enabled
  ansible.builtin.import_tasks: agent_access.yml

# One of the two, never both: chezmoi rewrites settings.json whole, and the subset's settings
# task would strip on each apply the env keys chezmoi writes.
- name: Give the agent a subset of the operator's Claude config, or take it back
  tags: [claude_code]
  when:
    - claude_code_agent_user_enabled
    - not claude_code_agent_dotfiles
  ansible.builtin.import_tasks: agent_operator_config.yml

- name: Apply the operator's dotfiles to the agent, or take them back
  tags: [claude_code]
  when: claude_code_agent_user_enabled
  ansible.builtin.import_tasks: agent_dotfiles.yml

# Once, when the phone host moves to the agent: its sessions would otherwise start with an
# empty memory store. Guarded again inside by the agent's own MEMORY.md.
- name: Copy the operator's memory store into the agent's, the first time the agent is the host's user
  tags: [claude_code]
  when:
    - claude_code_agent_user_enabled
    - claude_code_user == claude_code_agent_user
    - claude_code_agent_memory_seed
  ansible.builtin.import_tasks: agent_memory_seed.yml

# The token is the one credential in the home that works off this host, so switching the user
# off removes it. The signing key stays: it can only sign, and a new one would need adding to
# the account again. Revoking the token on GitHub is the operator's half of this.
- name: Remove the agent user's GitHub token when it is switched off
  tags: [claude_code]
  ansible.builtin.file:
    path: "{{ claude_code_agent_user_home }}/.config/gh/hosts.yml"
    state: absent
  become: true
  when: not claude_code_agent_user_enabled

- name: Look for the agent user on a host that has it switched off
  tags: [claude_code]
  ansible.builtin.getent:
    database: passwd
    key: "{{ claude_code_agent_user }}"
    fail_key: false
  when: not claude_code_agent_user_enabled

# The way out. Expired rather than removed: removing the user strands its files under a bare
# uid, and the home holds the agent's clone and any work it has not pushed. 86400 is
# 1970-01-02, because a shadow expiry of day 0 also reads as "never expires".
- name: Expire the agent user's account when it is switched off
  tags: [claude_code]
  ansible.builtin.user:
    name: "{{ claude_code_agent_user }}"
    expires: 86400
  become: true
  when:
    - not claude_code_agent_user_enabled
    - ansible_facts.getent_passwd[claude_code_agent_user] is not none

# The way out of the worktree holder scan's socket group, which agent_access.yml gives every
# enabled agent (#4304). initial_setup's root map refuses a switched-off agent already, so the
# membership grants nothing; this keeps the group's member list equal to the enabled agents.
# Read first, so a host without the group or the member changes nothing.
- name: Look up the worktree holder scan's socket group for a switched-off agent user
  tags: [claude_code]
  ansible.builtin.getent:
    database: group
    key: "{{ initial_setup_worktree_holders_group }}"
    fail_key: false
  when: not claude_code_agent_user_enabled

- name: Take the switched-off agent user out of the worktree holder scan's socket group
  tags: [claude_code]
  ansible.builtin.command:
    argv:
      - gpasswd
      - --delete
      - "{{ claude_code_agent_user }}"
      - "{{ initial_setup_worktree_holders_group }}"
  become: true
  when:
    - not claude_code_agent_user_enabled
    - ansible_facts.getent_group[initial_setup_worktree_holders_group] is not none
    - >-
      claude_code_agent_user in
      ansible_facts.getent_group[initial_setup_worktree_holders_group][2].split(',')

- name: Stop the switched-off agent user's manager lingering
  tags: [claude_code]
  ansible.builtin.command: "loginctl disable-linger {{ claude_code_agent_user }}"
  args:
    removes: "/var/lib/systemd/linger/{{ claude_code_agent_user }}"
  become: true
  when: not claude_code_agent_user_enabled

# The way out for the clone sync. An expired account does not stop a `User=` service, which
# runs with no PAM account check, so the units must go or the timer keeps pulling.
- name: Check whether an agent clone sync timer is installed
  tags: [claude_code]
  ansible.builtin.stat:
    path: "/etc/systemd/system/{{ claude_code_agent_user }}-clone-sync.timer"
  register: claude_code_agent_clone_sync_timer_file
  become: true
  when: not claude_code_agent_user_enabled

# Guarded on the file: systemd refuses to stop a unit it has never heard of.
- name: Stop and disable the agent clone sync timer when the agent user is switched off
  tags: [claude_code]
  ansible.builtin.systemd:
    name: "{{ claude_code_agent_user }}-clone-sync.timer"
    enabled: false
    state: stopped
  become: true
  when:
    - not claude_code_agent_user_enabled
    - claude_code_agent_clone_sync_timer_file.stat.exists

- name: Remove the agent clone sync units when the agent user is switched off
  tags: [claude_code]
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ claude_code_agent_user }}-{{ item }}"
    state: absent
  loop:
    - clone-sync.service
    - clone-sync.timer
    - clone-sync-alert.service
  become: true
  when: not claude_code_agent_user_enabled
  notify: Reload systemd
