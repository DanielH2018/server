---
# What the agent user may read of the host, and what the operator may read of the agent.
# Imported from main.yml when claude_code_agent_user_enabled, after agent_github.yml, whose
# ~/.claude task sets that directory's mode. docs/claude-agent-user.md (slice 4) has the
# reasoning and the check; defaults/main.yml has both switches.

# Exact, not appended: the agent joins no other group (the shared agent_user.yml gives it
# none), so an empty list is the way back out. ssh-users is the one group sshd's AllowGroups
# admits, and a peer whose claude_agent_ssh_login_enabled is true puts the agent in it so the
# key host's agent can log in (agent_ssh_login.yml). That login is the primary agent's alone.
- name: Set the agent user's journal access and its ssh login group
  ansible.builtin.user:
    name: "{{ claude_code_agent_user }}"
    groups: >-
      {{ (['systemd-journal'] if claude_code_agent_journal_access else [])
      + (['ssh-users'] if claude_agent_ssh_login_enabled and claude_code_agent_is_primary
      and inventory_hostname != claude_agent_ssh_key_host else []) }}
    append: false
  become: true

# The memory store sits two directories under ~/.claude, and the operator needs traverse on
# each. 0710 gives group sys_user traverse without a listing. Claude Code creates both on a
# session's first run at a mode nobody has checked, so the role creates them first.
- name: Let the operator traverse to the agent's memory store
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ claude_code_agent_user }}"
    group: "{{ sys_user }}"
    mode: "{{ '0710' if claude_code_agent_operator_read else '0700' }}"
  loop:
    - "{{ claude_code_agent_user_home }}/.claude/projects"
    - "{{ claude_code_agent_memory_dir | dirname }}"
  become: true

# setgid keeps a file Claude Code writes here in group sys_user. Root runs this, because the
# agent belongs to no group it could chgrp to.
- name: Open the agent's artifacts and memory directories to the operator
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ claude_code_agent_user }}"
    group: "{{ sys_user }}"
    mode: "{{ '2750' if claude_code_agent_operator_read else '0700' }}"
  loop: &operator_read_dirs
    - "{{ claude_code_agent_user_home }}/.claude/artifacts"
    - "{{ claude_code_agent_memory_dir }}"
  become: true

# After every mode task above: chmod rewrites the ACL mask from the group bits, and a mask of
# --- disables every named entry while getfacl still lists it. The default entry gives a file
# Claude Code writes later the operator's read, as long as its create mode has a group read
# bit to keep; a file created 0600 stays unreadable, which is why the slice 4 check reads a
# new file as the operator rather than reading getfacl.
- name: Give files the agent writes there the operator's read
  ansible.posix.acl:
    path: "{{ item }}"
    entity: "{{ sys_user }}"
    etype: group
    permissions: rX
    default: true
    state: "{{ 'present' if claude_code_agent_operator_read else 'absent' }}"
  loop: *operator_read_dirs
  become: true
  register: claude_code_agent_read_acl
  # Check mode creates neither directory above, and setfacl on a missing path fails.
  failed_when:
    - not ansible_check_mode
    - claude_code_agent_read_acl is failed

# The deployer's state directory is 0750 sys_user and the agent belongs to no group, so without
# this it cannot check hold_sha or owed.jsonl before a landing (#4198). Not recursive, for the
# reason renovate_agent's grant gives (#3607): the default entry makes each marker readable as
# the deployer rewrites it, and a recursive rX reports changed on every apply. initial_setup.yml
# runs gitops_deploy before claude_code, so the directory exists by the time this runs.
- name: Let the agent user read the deployer's hold markers and owed ledger
  ansible.posix.acl:
    path: /var/lib/gitops-deploy
    entity: "{{ claude_code_agent_user }}"
    etype: user
    permissions: "{{ item.permissions }}"
    default: "{{ item.default }}"
    state: "{{ 'present' if claude_code_agent_gitops_read else 'absent' }}"
  loop:
    - {permissions: rX, default: false}
    - {permissions: r, default: true}
  become: true
  when: has_gitops | default(false)
  register: claude_code_agent_gitops_acl
  # Check mode on a fresh deployer creates no state directory, and setfacl on a missing path fails.
  failed_when:
    - not ansible_check_mode
    - claude_code_agent_gitops_acl is failed
