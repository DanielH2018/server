---
# The fake-remux detector + reconciler on daniel-box. The scripts and the config template live
# in this role.

- name: Ensure the media-inspection tools are installed
  tags: [fake_remux]
  # Both crons probe on this host. There is no Docker here, and the library is a local
  # directory, so the probe is a plain binary against a plain path.
  #
  # mkvtoolnix rides along for mkvpropedit, which rewrites an mkv header in place without
  # re-encoding. jellyfin-ffmpeg 7.1 rejects a font attachment whose filename holds anything
  # outside [A-Za-z0-9_.-] (fftools/ffmpeg_demux.c, safe_filename), and it aborts the WHOLE input
  # rather than skipping that one attachment — so a font named `Nexa Bold.otf` kills every
  # burned-in-subtitle transcode of that file while direct play stays fine. Renaming the
  # attachment is safe: ASS scripts reference fonts by internal family name, never by attachment
  # filename. This host's own ffmpeg is 6.1.1, predates the check, and cannot reproduce it.
  ansible.builtin.apt:
    name:
      - ffmpeg
      - mkvtoolnix
    state: present
  become: true

- name: Create fake-remux directories
  tags: [fake_remux]
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ sys_user }}"
    group: "{{ sys_user }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ fake_remux_opt_dir }}", mode: "0750" } # scripts
    - { path: "{{ fake_remux_opt_dir }}/fake_remux_lib", mode: "0750" } # fake_remux.py's modules
    - { path: "{{ fake_remux_config_dir }}", mode: "0750" } # config.env (0600 inside)
    - { path: "{{ fake_remux_state_dir }}", mode: "0755" } # ledger + the two state files
  become: true

- name: Install the shared host_lib helper beside the fake-remux scripts
  tags: [fake_remux]
  # Before the entry scripts below: the sibling copy is what they `from host_lib import`
  # at runtime, and the cron invokes them by absolute path.
  ansible.builtin.import_tasks: "{{ role_path }}/../common/tasks/install_host_lib.yml"
  vars:
    host_lib_dir: "{{ fake_remux_opt_dir }}"
    host_lib_owner: "{{ sys_user }}"

- name: Install the fake-remux scripts
  tags: [fake_remux]
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ fake_remux_opt_dir }}/{{ item | basename }}"
    owner: "{{ sys_user }}"
    group: "{{ sys_user }}"
    mode: "0755"
  loop:
    - state_push.py
    - "{{ role_path }}/files/fake_remux.py"
    - "{{ role_path }}/files/mkv_attachment_repair.py"
    - "{{ role_path }}/files/mkv_attachment_logic.py"
  become: true

- name: Install the fake-remux library
  tags: [fake_remux]
  # One file at a time rather than the directory: a directory copy also ships whatever
  # __pycache__ the controller's checkout holds.
  ansible.builtin.copy:
    src: "{{ role_path }}/files/fake_remux_lib/{{ item }}"
    dest: "{{ fake_remux_opt_dir }}/fake_remux_lib/{{ item }}"
    owner: "{{ sys_user }}"
    group: "{{ sys_user }}"
    mode: "0644"
  loop:
    - fake_remux_scan.py
    - fake_remux_logic.py
    - fake_remux_replace.py
    - fake_remux_replace_logic.py
  become: true

- name: Remove the fake-remux scripts that moved into fake_remux_lib
  tags: [fake_remux]
  # Until #4353 these four sat flat in the install dir, two of them run directly by the crons.
  # A copy loop removes nothing it stops naming, so without this the old entrypoints stay
  # runnable and the drift check no longer watches them.
  ansible.builtin.file:
    path: "{{ fake_remux_opt_dir }}/{{ item }}"
    state: absent
  loop:
    - fake_remux_scan.py
    - fake_remux_logic.py
    - fake_remux_replace.py
    - fake_remux_replace_logic.py
  become: true

- name: Resolve Sonarr's ClusterIP
  tags: [fake_remux]
  # Resolved every deploy rather than pinned: a ClusterIP is stable for the Service's life but not
  # across a delete. Fails the play if the Service is gone, which is the right outcome — a cron
  # pointed at a stale IP would fail silently at 04:45 instead.
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n {{ fake_remux_sonarr_namespace }} get svc {{ fake_remux_sonarr_service }}
      -o jsonpath={.spec.clusterIP}
  become: true
  changed_when: false
  # A read of the cluster's Service, so it runs under --check too: skipped, it leaves no stdout
  # and the assert and the config render below error on the attribute.
  check_mode: false
  register: fake_remux_sonarr_ip

- name: Assert Sonarr resolved to an address
  tags: [fake_remux]
  ansible.builtin.assert:
    that: fake_remux_sonarr_ip.stdout | length > 0
    fail_msg: >-
      {{ fake_remux_sonarr_service }} has no ClusterIP in {{ fake_remux_sonarr_namespace }} —
      both crons would be pointed at nothing.
    quiet: true

- name: Render the fake-remux config
  tags: [fake_remux]
  # The autofix-bridge role's template, rendered with this host's overrides. no_log: it embeds the
  # Sonarr API key and the *arr Discord webhook.
  ansible.builtin.template:
    src: "{{ role_path }}/templates/fake-remux.config.env.j2"
    dest: "{{ fake_remux_config_dir }}/config.env"
    owner: "{{ sys_user }}"
    group: "{{ sys_user }}"
    mode: "0600"
  vars:
    autofix_fake_remux_host_data_root: "{{ fake_remux_host_data_root }}"
    autofix_fake_remux_jellyfin_container: "{{ fake_remux_jellyfin_container }}"
    autofix_fake_remux_sonarr_url: "http://{{ fake_remux_sonarr_ip.stdout }}:{{ fake_remux_sonarr_port }}"
  become: true
  no_log: true

- name: Render the fake-remux replacement policy
  tags: [fake_remux]
  ansible.builtin.copy:
    content: "{{ autofix_fake_remux_policy | to_nice_json }}\n"
    dest: "{{ fake_remux_config_dir }}/policy.json"
    owner: "{{ sys_user }}"
    group: "{{ sys_user }}"
    mode: "0644"
  become: true

- name: Schedule the fake-remux scan
  tags: [fake_remux]
  ansible.builtin.cron:
    name: "fake-remux scan"
    hour: "{{ fake_remux_scan_cron_hour }}"
    minute: "{{ fake_remux_scan_cron_minute }}"
    user: "{{ sys_user }}"
    # No config override: the script's own default IS fake_remux_config_dir/config.env. Passing
    # CONFIG_PATH= would read nothing and report "disabled": it is not the variable either script
    # reads (the two subcommands use FAKE_REMUX_CONFIG / FAKE_REMUX_REPLACE_CONFIG).
    job: >-
      /usr/bin/flock -w 600 {{ fake_remux_lock }}
      /usr/local/bin/uv run --no-project --no-python-downloads --python {{ host_python_version }} {{ fake_remux_opt_dir }}/fake_remux.py scan
      >/dev/null 2>&1 || logger -t fake-remux-scan 'scan wrapper failed'
    cron_file: fake-remux-scan
  become: true

- name: Schedule the fake-remux reconcile
  tags: [fake_remux]
  ansible.builtin.cron:
    name: "fake-remux reconcile"
    minute: "{{ fake_remux_replace_cron_minute }}"
    user: "{{ sys_user }}"
    job: >-
      /usr/bin/flock -w 600 {{ fake_remux_lock }}
      /usr/local/bin/uv run --no-project --no-python-downloads --python {{ host_python_version }} {{ fake_remux_opt_dir }}/fake_remux.py replace
      >/dev/null 2>&1 || logger -t fake-remux-reconcile 'reconcile wrapper failed'
    cron_file: fake-remux-reconcile
  become: true

- name: Schedule the mkv attachment-name repair
  tags: [fake_remux]
  # DECIDED: takes fake_remux_lock, though it shares no ledger with the other two crons. The
  # reconciler deletes and swaps the same mkv files this rewrites the header of, and mkvpropedit
  # rewriting a header mid-swap corrupts the file it was called to fix. The lock costs a wait.
  ansible.builtin.cron:
    name: "mkv attachment repair"
    minute: "{{ fake_remux_mkv_attachment_cron_minute }}"
    user: "{{ sys_user }}"
    job: >-
      /usr/bin/flock -w 600 {{ fake_remux_lock }}
      /usr/local/bin/uv run --no-project --no-python-downloads --python {{ host_python_version }} {{ fake_remux_opt_dir }}/mkv_attachment_repair.py
      >/dev/null 2>&1 || logger -t mkv-attachment-repair 'repair wrapper failed'
    cron_file: mkv-attachment-repair
  become: true

# DECIDED: rendered here rather than reusing the k3s role's /etc/rancher/k3s/kuma-push.env. This
# role is host-conditional and tag-scoped, so `initial_setup.yml --tags fake_remux` would render
# the script without ever writing that file — and the script then exits 0 without pushing, which
# is silence rather than an error. Same file, same tag, same run.
- name: Deploy the fake-remux Kuma push credentials
  tags: [fake_remux]
  # 0640 root:{{ sys_user }}, for the same reason as the k3s role's kuma-push.env: the script that
  # consumes these lands 0755 (it must stay world-executable — it is root:root and its cron runs
  # as {{ sys_user }}, so the world-execute bit is the only thing that lets the cron run it), and a
  # Kuma push token is enough to forge or suppress a heartbeat, which hides a real outage. The
  # group bit is what lets the {{ sys_user }} cron read this.
  ansible.builtin.template:
    src: fake-remux-push.env.j2
    dest: "{{ fake_remux_config_dir }}/kuma-push.env"
    mode: "0640"
    owner: root
    group: "{{ sys_user }}"
  become: true
  no_log: true  # renders both Kuma push tokens

- name: Deploy the fake-remux heartbeats
  tags: [fake_remux]
  # No no_log: this renders no secret. Both Kuma push tokens live in the env file above, and the
  # script sources them at runtime.
  ansible.builtin.template:
    src: fake-remux-health.sh.j2
    dest: /usr/local/bin/fake-remux-health.sh
    mode: "0755"
    owner: root
    group: root
  become: true

- name: Schedule the fake-remux heartbeats
  tags: [fake_remux]
  ansible.builtin.cron:
    name: "fake-remux health"
    minute: "{{ fake_remux_health_cron_minute }}"
    user: "{{ sys_user }}"
    job: "/usr/local/bin/fake-remux-health.sh"
    cron_file: fake-remux-health
  become: true

# Render provenance for manifest-prune-check.sh's stale-script arm.
# Stamped on whichever host fake_remux_host names — the manifest is per-host by construction,
# so a host that does not run this role simply has no fragment for it.
- name: Stamp the rendered fake-remux health script
  ansible.builtin.import_tasks: "{{ role_path }}/../common/tasks/stamp_render.yml"
  vars:
    stamp_render_name: fake-remux
    stamp_render_templates:
      - ansible/roles/setup/fake_remux/templates/fake-remux-health.sh.j2
      # Same reasoning as the renovate_notify list: the stamp and the check both hash the repo
      # source, never the rendered file, so an .env.j2 carries no secret into either.
      - ansible/roles/setup/fake_remux/templates/fake-remux-push.env.j2

# The scripts this role `copy:`-deploys, recorded for the deployed-code drift check.
- name: Record the deployed fake-remux code
  tags: [fake_remux]
  ansible.builtin.import_tasks: "{{ role_path }}/../common/tasks/stamp_deployed.yml"
  vars:
    stamp_deployed_name: fake-remux
    stamp_deployed_pairs:
      # The sibling host_lib copy, listed with the scripts that import it. Every consumer shares
      # it, so a single repo-side change to host_lib.py strands a stale copy in every role at
      # once unless the drift check can see it.
      - live: "{{ fake_remux_opt_dir }}/host_lib.py"
        src: ansible/roles/setup/common/files/host_lib.py
      - live: "{{ fake_remux_opt_dir }}/kuma_push.py"
        src: ansible/roles/setup/common/files/kuma_push.py
      - live: "{{ fake_remux_opt_dir }}/state_push.py"
        src: ansible/roles/setup/fake_remux/files/state_push.py
      - live: "{{ fake_remux_opt_dir }}/fake_remux.py"
        src: ansible/roles/setup/fake_remux/files/fake_remux.py
      - live: "{{ fake_remux_opt_dir }}/fake_remux_lib/fake_remux_scan.py"
        src: ansible/roles/setup/fake_remux/files/fake_remux_lib/fake_remux_scan.py
      - live: "{{ fake_remux_opt_dir }}/fake_remux_lib/fake_remux_logic.py"
        src: ansible/roles/setup/fake_remux/files/fake_remux_lib/fake_remux_logic.py
      - live: "{{ fake_remux_opt_dir }}/fake_remux_lib/fake_remux_replace.py"
        src: ansible/roles/setup/fake_remux/files/fake_remux_lib/fake_remux_replace.py
      - live: "{{ fake_remux_opt_dir }}/fake_remux_lib/fake_remux_replace_logic.py"
        src: ansible/roles/setup/fake_remux/files/fake_remux_lib/fake_remux_replace_logic.py
      - live: "{{ fake_remux_opt_dir }}/mkv_attachment_repair.py"
        src: ansible/roles/setup/fake_remux/files/mkv_attachment_repair.py
      - live: "{{ fake_remux_opt_dir }}/mkv_attachment_logic.py"
        src: ansible/roles/setup/fake_remux/files/mkv_attachment_logic.py
