---
- name: Install the deploy-ui files
  tags: [deploy-ui-code]
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ deploy_ui_dir }}/{{ item }}"
    mode: "0644"
  loop:
    - deploy_ui.py
    - deploy_ui_reads.py
    - deploy_ui_writes.py
    - gitops_markers.py
    - deploy_ui.html
  become: true
  notify: Restart deploy-ui

- name: Record the deployed deploy-ui code
  tags: [deploy-ui-code]
  ansible.builtin.import_tasks: "{{ role_path }}/../common/tasks/stamp_deployed.yml"
  vars:
    stamp_deployed_name: deploy-ui
    stamp_deployed_pairs:
      - live: "{{ deploy_ui_dir }}/deploy_ui.py"
        src: ansible/roles/setup/deploy_ui/files/deploy_ui.py
      - live: "{{ deploy_ui_dir }}/deploy_ui_reads.py"
        src: ansible/roles/setup/deploy_ui/files/deploy_ui_reads.py
      - live: "{{ deploy_ui_dir }}/deploy_ui_writes.py"
        src: ansible/roles/setup/deploy_ui/files/deploy_ui_writes.py
      - live: "{{ deploy_ui_dir }}/gitops_markers.py"
        src: ansible/roles/setup/deploy_ui/files/gitops_markers.py
      - live: "{{ deploy_ui_dir }}/deploy_ui.html"
        src: ansible/roles/setup/deploy_ui/files/deploy_ui.html
