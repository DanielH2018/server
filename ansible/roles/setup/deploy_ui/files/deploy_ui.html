<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Deploy queue</title>
<style>
:root{--base:#1e1e2e;--mantle:#181825;--surface0:#313244;--surface1:#45475a;--text:#cdd6f4;--sub:#a6adc8;--mute:#6c7086;--blue:#89b4fa;--green:#a6e3a1;--yellow:#f9e2af;--red:#f38ba8;--crust:#11111b}
body{margin:0;background:var(--base);color:var(--text);font:15px/1.5 system-ui,sans-serif}
main{max-width:1000px;margin:0 auto;padding:24px}
h1{font-size:22px;margin:0 0 16px}h2{font-size:16px;margin:24px 0 8px;border-bottom:1px solid var(--surface1)}
table{width:100%;border-collapse:collapse}td,th{padding:6px 8px;border-bottom:1px solid var(--surface1);text-align:left;vertical-align:top}
th{color:var(--sub);font-size:12px;text-transform:uppercase}
code{font-family:ui-monospace,monospace;background:var(--surface0);padding:1px 4px;border-radius:3px}
button{background:var(--blue);color:var(--crust);border:0;padding:4px 10px;border-radius:3px;font-weight:600;cursor:pointer}
button.danger{background:var(--red)}button.warn{background:var(--yellow)}
.unavail{color:var(--red)}.clear{color:var(--green)}.mute{color:var(--mute)}
pre{background:var(--mantle);border:1px solid var(--surface1);padding:10px;max-height:320px;overflow:auto;white-space:pre-wrap}
#msg{min-height:1.4em;color:var(--yellow)}
</style></head><body><main>
<h1>Deploy queue</h1><div id="msg"></div>
<h2>Locks, landings and deploys in flight</h2><div id="inflight"></div>
<h2>Merged but undeployed</h2><div id="stale"></div>
<h2>Deployer state</h2><div id="state"></div>
<h2>Open pull requests</h2><div id="prs"></div>
<h2>Log</h2><pre id="log" class="mute">no action yet</pre>
<script>
const H={'X-Deploy-UI':'1','Content-Type':'application/json'};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let logPath=null;
async function post(path,payload){const r=await fetch(path,{method:'POST',headers:H,body:JSON.stringify(payload)});const t=await r.text();
  document.getElementById('msg').textContent=r.status+' '+t;if(r.status===202){logPath=JSON.parse(t).log;}refresh();}
async function panel(id,path,render){const el=document.getElementById(id);try{const r=await fetch(path);const b=await r.json();
  el.innerHTML=b.unavailable?`<span class="unavail">unavailable: ${esc(b.unavailable)}</span>`:render(b);}catch(e){el.innerHTML=`<span class="unavail">unavailable: ${esc(e)}</span>`;}}
function inflight(b){const held=b.runs.filter(r=>r.locks.length);
  let s=`<p>Locks: ${!b.locks_watched.length?'<span class="unavail">no lock files found</span>':held.length?held.map(r=>`<code>${esc(r.locks.join(' '))}</code> pid ${r.pid}, ${r.elapsed_s}s`).join('; '):`<span class="clear">free</span> <span class="mute">(${b.locks_watched.length} watched)</span>`}</p>`;
  if(!b.runs.length)return s+'<p class="mute">nothing in flight</p>';
  return s+'<table><tr><th>kind</th><th>PR / tag</th><th>pid</th><th>elapsed</th><th>locks</th><th>command</th><th></th></tr>'+b.runs.map(r=>`<tr><td>${esc(r.kind)}</td><td>${r.pr?'#'+esc(r.pr):esc(r.tag)}</td><td>${r.pid}</td><td>${r.elapsed_s}s</td><td>${esc(r.locks.join(' '))}${r.waiting_on.length?`<span class="mute">waiting on ${esc(r.waiting_on.join(' '))}</span>`:''}</td><td><code>${esc(r.args)}</code><br><span class="mute">${esc(r.log)}</span></td><td>${r.kind==='land'?`<button class="danger" onclick="post('/api/cancel',{pid:${r.pid}})">cancel</button>`:''}</td></tr>`).join('')+'</table>';}
function stale(b){if(!b.stale.length)return '<p class="clear">every release is current</p>';
  return '<table><tr><th>service</th><th>why</th><th></th></tr>'+b.stale.map(r=>`<tr><td>${esc(r.service)}</td><td>${esc(r.reason)}</td><td><button onclick="post('/api/deploy',{tag:'${esc(r.service)}'})">deploy</button></td></tr>`).join('')+'</table>';}
// A Clear drops every hold_plane entry at once, and each entry is a plane nobody has applied.
// The prompt names them, because after the Clear nothing records them at all.
let holdWarn='Type the held SHA to clear it';
function clearHold(){const s=prompt(holdWarn);if(s)post('/api/hold/clear',{expected_sha:s});}
function state(b){const row=(k,v,extra='')=>`<tr><td>${k}</td><td>${v?`<code>${esc(v)}</code>`:'<span class="clear">clear</span>'}</td><td>${extra}</td></tr>`;
  const planes=b.hold_plane_entries||[];
  holdWarn=planes.length?`Clearing drops ${planes.length} plane(s) still recorded as UNAPPLIED:\n\n${planes.join('\n')}\n\nEach still needs applying by hand, and nothing records them after this.\n\nType the held SHA to clear it:`:'Type the held SHA to clear it';
  const hold=b.hold_sha?'<button class="warn" onclick="clearHold()">clear hold</button>':'';
  const planeCell=planes.length?planes.map(p=>`<code>${esc(p)}</code>`).join('<br>'):'<span class="clear">clear</span>';
  const ov=b.staging_gate_override?`<button onclick="post('/api/staging-override',{action:'clear'})">clear override</button>`:`<button class="warn" onclick="post('/api/staging-override',{action:'set'})">set override</button>`;
  // No deploy button beside a deferred bump, unlike the stale panel above: the tick deferred it
  // for lack of wall clock, so the operator picks the moment. The two commands are printed in
  // the order they are run — deploy, then clear.
  const def=b.k8s_deferred_entries||[];
  const defCell=def.length?def.map(d=>`${esc(d.service)} <span class="mute">${esc(d.origin)}</span><br><code>${esc(d.deploy)}</code><br><code>${esc(d.clear)}</code>`).join('<br>'):'<span class="clear">clear</span>';
  return '<table>'+row('hold_sha',b.hold_sha,hold)+`<tr><td>hold_plane</td><td>${planeCell}</td><td></td></tr>`+row('last_run',b.last_run)+row('behind_since',b.behind_since)+row('staging_gate_override',b.staging_gate_override,ov)+`<tr><td>k8s_deferred</td><td>${defCell}</td><td></td></tr>`+'</table>';}
function prs(b){if(!b.prs.length)return '<p class="mute">no open PRs</p>';
  return '<table><tr><th>#</th><th>title</th><th>CI</th><th></th></tr>'+b.prs.map(p=>`<tr><td>${p.number}</td><td>${esc(p.title)}${p.draft?' <span class="mute">draft</span>':''}<br><span class="mute">${esc(p.branch)}</span></td><td>${p.ci}</td><td><button onclick="{const s=prompt('--since SHA (master before the merge)');if(s)post('/api/land',{pr:'${p.number}',since:s})}">land</button></td></tr>`).join('')+'</table>';}
async function tail(){if(!logPath)return;const r=await fetch('/api/log?path='+encodeURIComponent(logPath));document.getElementById('log').textContent=await r.text();}
function refresh(){panel('inflight','/api/inflight',inflight);panel('stale','/api/stale',stale);panel('state','/api/state',state);panel('prs','/api/prs',prs);tail();}
refresh();setInterval(refresh,10000);
</script></main></body></html>
