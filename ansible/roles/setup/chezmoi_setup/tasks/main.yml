---
# chezmoi manages a USER's home directory, so every task here runs as the connecting
# user with become: false. The play sets become: true for OS hardening; inheriting it
# would deploy the dotfiles into /root instead.
#
# The home directory is /home/{{ sys_user }}, NOT ansible_env.HOME. ansible_env reports
# the environment of the user facts were GATHERED as, and initial_setup.yml gathers them
# escalated (its setup: pre_task runs under the play's become: true) — so ansible_env.HOME
# is /root even inside a become: false task. Using it here failed on daniel-box with
# "Permission denied: /root/.local". Same reason config_files hardcodes the path.

- name: Ensure the per-user directories exist
  tags: [chezmoi]
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /home/{{ sys_user }}/.local/bin
    - /home/{{ sys_user }}/.local/share/installers
    - /home/{{ sys_user }}/.config/chezmoi
  become: false

- name: Download the chezmoi installer
  tags: [chezmoi]
  # Fetched to a user-owned directory rather than /tmp: this script is executed, and /tmp
  # is world-writable. get_url's default force: false means an existing copy is not
  # re-fetched, so this is quiet on re-runs.
  ansible.builtin.get_url:
    url: https://get.chezmoi.io
    dest: /home/{{ sys_user }}/.local/share/installers/chezmoi-install.sh
    mode: "0755"
  become: false

- name: Install the chezmoi binary
  tags: [chezmoi]
  # Pinned to ~/.local/bin to match daniel-server. `creates` makes it run-once; upgrading
  # chezmoi is a deliberate act, not a side effect of every play.
  ansible.builtin.command:
    cmd: >-
      /home/{{ sys_user }}/.local/share/installers/chezmoi-install.sh
      -b /home/{{ sys_user }}/.local/bin
  args:
    creates: /home/{{ sys_user }}/.local/bin/chezmoi
  become: false

- name: Check GitHub authentication before cloning
  tags: [chezmoi]
  # DanielH2018/dotfiles is PRIVATE. Without a credential, chezmoi fails with
  # "fatal: could not read Username for 'https://github.com'" — a git-level error that
  # says nothing about what to do. Check first so the failure names the fix.
  ansible.builtin.command:
    cmd: gh auth status
  register: chezmoi_setup_gh_auth
  become: false
  changed_when: false
  failed_when: false

- name: Fail with a usable message if GitHub authentication is missing
  tags: [chezmoi]
  ansible.builtin.assert:
    that: chezmoi_setup_gh_auth.rc == 0
    fail_msg: >-
      Cannot reach {{ chezmoi_setup_repo }} — it is private and this host has no GitHub
      credential. Run `gh auth login` once, by hand, on {{ inventory_hostname }}, then
      re-run this play. (The github_cli role installs gh and sets the credential helper,
      but the login itself is interactive.)

- name: Install the distro packages the dotfiles scripts cannot install themselves
  tags: [chezmoi]
  # become: true is the exception in this role. install-cli-tools.sh shells out to sudo for
  # these, but sudo has no TTY under Ansible and ubuntu has no NOPASSWD, so the script
  # defers them and exits 1 — which, being a run_once_after script, means chezmoi never
  # records success and retries the failure on every later apply. Ansible already has the
  # become password from SOPS, so it does the job the script cannot.
  ansible.builtin.apt:
    name: "{{ chezmoi_setup_distro_packages }}"
    state: present
  become: true

- name: Seed the chezmoi config data so init never needs a TTY
  tags: [chezmoi]
  # promptBoolOnce/promptStringOnce only prompt when the value is absent from the config
  # data, so seeding the two answers is what makes a non-interactive init possible. The
  # --promptBool/--promptString flags do NOT cover this: they were passed on daniel-box
  # (chezmoi v2.71.1) and init prompted anyway, dying on "could not open a new TTY".
  #
  # force: false — once init has rendered the real config from .chezmoi.toml.tmpl, this
  # must not clobber it on every later run.
  ansible.builtin.template:
    src: chezmoi-seed.toml.j2
    dest: /home/{{ sys_user }}/.config/chezmoi/chezmoi.toml
    mode: "0644"
    force: false
  become: false

- name: Initialise chezmoi from the dotfiles repo and apply
  tags: [chezmoi]
  # Unconditional rather than gated on the source directory being absent. A failed init
  # leaves a COMPLETE clone but no rendered config (exactly what happened on daniel-box:
  # the clone succeeded, then the config template hit the TTY error). Gating on the source
  # would then skip init forever and fall through to a bare `apply`, running without the
  # umask pin and [interpreters.sh] that .chezmoi.toml.tmpl provides. Re-running init is
  # safe and re-renders the full config, so the role self-heals instead of needing a
  # manual rm of the partial state.
  ansible.builtin.command:
    cmd: >-
      /home/{{ sys_user }}/.local/bin/chezmoi init {{ chezmoi_setup_repo }} --apply
  register: chezmoi_setup_init
  become: false
  changed_when: chezmoi_setup_init.stdout | length > 0
