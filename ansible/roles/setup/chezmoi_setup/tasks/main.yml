---
# chezmoi manages a USER's home directory, so every task here runs as the connecting
# user with become: false. The play sets become: true for OS hardening; inheriting it
# would deploy the dotfiles into /root instead.

- name: Ensure the per-user directories exist
  tags: [chezmoi]
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ ansible_env.HOME }}/.local/bin"
    - "{{ ansible_env.HOME }}/.local/share/installers"
  become: false

- name: Download the chezmoi installer
  tags: [chezmoi]
  # Fetched to a user-owned directory rather than /tmp: this script is executed, and /tmp
  # is world-writable. get_url's default force: false means an existing copy is not
  # re-fetched, so this is quiet on re-runs.
  ansible.builtin.get_url:
    url: https://get.chezmoi.io
    dest: "{{ ansible_env.HOME }}/.local/share/installers/chezmoi-install.sh"
    mode: "0755"
  become: false

- name: Install the chezmoi binary
  tags: [chezmoi]
  # Pinned to ~/.local/bin to match daniel-server. `creates` makes it run-once; upgrading
  # chezmoi is a deliberate act, not a side effect of every play.
  ansible.builtin.command:
    cmd: >-
      {{ ansible_env.HOME }}/.local/share/installers/chezmoi-install.sh
      -b {{ ansible_env.HOME }}/.local/bin
  args:
    creates: "{{ ansible_env.HOME }}/.local/bin/chezmoi"
  become: false

- name: Check whether chezmoi has a source directory yet
  tags: [chezmoi]
  ansible.builtin.stat:
    path: "{{ ansible_env.HOME }}/.local/share/chezmoi/.git"
  register: chezmoi_setup_source
  become: false

- name: Initialise chezmoi from the dotfiles repo and apply
  tags: [chezmoi]
  # --promptBool/--promptString answer the promptBoolOnce/promptStringOnce calls in
  # .chezmoi.toml.tmpl. Without them init would block on a TTY Ansible hasn't provided.
  # Only on first run: after this the answers live in ~/.config/chezmoi/chezmoi.toml and
  # re-passing them would silently overwrite a value changed by hand on the host.
  ansible.builtin.command:
    cmd: >-
      {{ ansible_env.HOME }}/.local/bin/chezmoi init {{ chezmoi_setup_repo }} --apply
      --promptBool work={{ chezmoi_setup_work | lower }}
      --promptString profile={{ chezmoi_setup_profile }}
  when: not chezmoi_setup_source.stat.exists
  become: false
  changed_when: true

- name: Apply chezmoi
  tags: [chezmoi]
  # Idempotent by design: chezmoi prints the targets it changed and nothing when the
  # destination already matches the source, so an unchanged run reports ok.
  ansible.builtin.command:
    cmd: "{{ ansible_env.HOME }}/.local/bin/chezmoi apply"
  when: chezmoi_setup_source.stat.exists
  register: chezmoi_setup_apply
  become: false
  changed_when: chezmoi_setup_apply.stdout | length > 0
