---
# The KVM/libvirt toolchain. qemu-system-x86 is the emulator, libvirt-daemon-system brings
# libvirtd and its systemd units, libvirt-clients brings virsh, and virtinst brings
# virt-install — the guest is defined with it in a later slice, and pulling it in here keeps
# the package set to one task rather than two.
#
# Deliberately NOT here: ovmf (the guest is a BIOS-boot cloud image, not UEFI) and
# cloud-image-utils (the cloud-init seed belongs with the guest definition, not with the
# hypervisor). Add them in the slice that needs them, so this role stays "a host that can
# run VMs" rather than "a host with one particular VM's dependencies".
hypervisor_packages:
  - qemu-system-x86
  - qemu-utils
  - libvirt-daemon-system
  - libvirt-clients
  - virtinst

# Groups that let sys_user reach qemu:///system without sudo. Both are needed: libvirt for
# the daemon socket, kvm for /dev/kvm itself.
hypervisor_user_groups:
  - libvirt
  - kvm

# Where the rendered network XML lives. Our own path, not /etc/libvirt/qemu/networks —
# that is libvirt's internal store, written by net-define and not meant to be edited
# underneath it.
hypervisor_net_source_dir: /etc/libvirt/declared-networks

# The staging NAT network.
#
# DECIDED: 192.168.140.0/24, chosen against a census of what daniel-server actually routes
# rather than by picking an unused-looking number (2026-08-27). In use there: 10.0.0.0/24
# (LAN), 10.42.0.0/16 and 10.43.0.0/16 (k3s pods and services), 10.200.0.0/16 and
# 172.17.0.0/16 (bridges left by the retired Docker install), and 192.168.122.0/24
# (libvirt's own `default`, defined-but-stopped). Sitting outside 10/8 entirely means a
# future k3s or Docker range cannot grow into it.
# ENFORCED by ansible/tests/staging/test_staging_network.py, which re-checks the overlap.
hypervisor_staging_net_name: staging
hypervisor_staging_net_bridge: virbr-stage
# The egress fence attached to the guest's interface. Named rather than inlined because two
# places must agree on the string: the filter definition and the domain's <filterref>.
hypervisor_staging_nwfilter_name: staging-egress-fence
hypervisor_staging_net_gateway: 192.168.140.1
hypervisor_staging_net_netmask: 255.255.255.0
# The dynamic range deliberately excludes staging_vm_ip, which is a reservation.
hypervisor_staging_net_dhcp_start: 192.168.140.50
hypervisor_staging_net_dhcp_end: 192.168.140.99

# The staging guest. Sizing from docs/staging-cluster.md, Decision 1, re-checked against the
# host on 2026-08-27: 24.7 GB of 31.7 GB RAM available and 312 GB free on /.
hypervisor_staging_vm_memory_mib: 8192
hypervisor_staging_vm_vcpus: 4
hypervisor_staging_vm_disk_size: 100G

# The base image and the guest's own copy. The base is kept so a rebuild does not re-download.
# The path deliberately does NOT end in `_image`: in a setup role's defaults that suffix means
# a container image pin, and scripts/test_renovate_managers.py reads every such key as one
# Renovate must be able to bump. This is a file on disk, so naming it `_image` made it fail a
# guard that was reading it correctly.
hypervisor_staging_vm_image_url: https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img
# DECIDED: pin the checksum even though `current` rotates (2026-08-27). Upstream moves this
# roughly monthly, so a host that has not downloaded the image yet WILL eventually fail here
# — which is the intended failure. A staging substrate silently built from a different image
# than the one reviewed defeats the point of having a reviewed substrate. Re-pin from
# https://cloud-images.ubuntu.com/noble/current/SHA256SUMS when it fails.
hypervisor_staging_vm_image_sha256: d0fe84bb5f80853425fa6be28e2c106f30104c3cfe8611933f2e65c9b63f0e30
hypervisor_staging_vm_base_image_path: /var/lib/libvirt/images/noble-server-cloudimg-amd64.img
hypervisor_staging_vm_disk: /var/lib/libvirt/images/{{ staging_vm_hostname }}.qcow2

# The cloud-init NoCloud seed.
hypervisor_staging_vm_seed_dir: /var/lib/libvirt/seed/{{ staging_vm_hostname }}
hypervisor_staging_vm_seed: /var/lib/libvirt/images/{{ staging_vm_hostname }}-seed.iso
# Bump to make cloud-init re-run its per-instance modules on the next start, without
# rebuilding the guest's disk.
hypervisor_staging_vm_instance_id: "01"

# First boot runs cloud-init, grows the root filesystem and generates host keys, so ssh
# answers well after the guest is up. Generous because that work happens once.
hypervisor_staging_vm_boot_timeout: 300

# The checkout the staging gate deploys FROM, and the lock that serialises it.
#
# It exists because the gate used to render from /home/ubuntu/server — this host's own
# checkout — which it fast-forwarded to the SHA under test, unlocked, and never restored
# (2026-08-29 review M-2). Three things were wrong with that, and only the first is obvious:
# an operator's tree jumped to arbitrary commits behind their back; two gate runs could
# interleave on one tree; and a dirty tree there made the gate answer PREP_FAILED for every
# commit until someone noticed, because a NO VERDICT is silent by design.
#
# A dedicated clone fixes all three by giving the gate a tree it owns. The gate moving its
# OWN tree forward is the point, not a defect — what M-2 objects to is it moving someone
# else's.
#
# Deliberately NOT a git worktree of the primary checkout: that shares .git, so the two
# trees' fates are coupled again through the object store and `git worktree list` on this
# host stops being about Claude sessions. A separate clone costs one working tree and
# nothing else. `ansible.builtin.git` is set `update: no` below, so Ansible creates this
# once and then never fights the gate for the branch it is sitting on.
hypervisor_staging_gate_repo: /home/ubuntu/server-staging
hypervisor_staging_gate_repo_url: https://github.com/DanielH2018/server.git
# Serialises two gate runs against that one tree — the timer's, and an operator driving
# staging_gate.py by hand. NOT /var/lock/server-git-tree.lock: deploy.sh takes that one
# inside the gate, and a lock is not reentrant across a fresh open, so sharing it would
# deadlock the gate against itself.
hypervisor_staging_gate_lock: /var/lock/staging-gate.lock

# The forced command behind the staging gate's restricted ssh key, and the key itself.
#
# The gate reaches this host over ssh (daniel-box cannot route to the staging guest's NAT
# network, so something has to cross a host boundary — docs/staging-phase-c.md, Decision 1).
# Until 2026-08-29 that hop authenticated with the operator's own unrestricted key, so anything
# able to invoke the gate had a full shell here (review M-3). A dedicated key pinned to one
# forced command replaces it.
#
# The public half is committed; the private half is `staging_gate_ssh_key` in SOPS and is
# deployed to daniel-box by roles/setup/gitops_deploy, which is where the gate runs from.
hypervisor_staging_gate_dispatch_path: /usr/local/bin/staging-gate-dispatch
hypervisor_staging_gate_pubkey_file: staging-gate.pub

# The verdict-bearing half, installed here rather than executed from the gate's checkout so the
# gate that runs is not chosen by the commit it is judging.
hypervisor_staging_gate_runner_path: /usr/local/bin/staging-gate-run
