---
# Makes the host able to run VMs. Does NOT define any guest or any network — those belong
# to the slices that own them, so this role stays re-runnable on a host that already has a
# staging VM without touching it.

- name: Read the CPU virtualisation flags
  tags: [hypervisor]
  # /proc/cpuinfo rather than a fact: ansible.builtin.setup exposes no CPU flag list, so
  # `ansible_processor_flags` -- the obvious-looking name -- is simply undefined. That was
  # shipped once and reached a real host, because no lint or test evaluates a conditional.
  # Reading the file is also independent of whether the kvm module has loaded yet, which a
  # /dev/kvm stat would not be at this point in the role.
  ansible.builtin.command:
    cmd: grep -cE '^flags\s*:.*\s(vmx|svm)(\s|$)' /proc/cpuinfo
  register: hypervisor_virt_flags
  changed_when: false
  failed_when: false
  become: true

- name: Assert the CPU supports hardware virtualisation
  tags: [hypervisor]
  # Fail here with the reason rather than several tasks later with a qemu error. Software
  # emulation would "work" and be slow enough to make the staging cluster useless, which is
  # a worse outcome than refusing.
  ansible.builtin.assert:
    that: hypervisor_virt_flags.stdout | int > 0
    fail_msg: >-
      {{ inventory_hostname }}'s /proc/cpuinfo lists neither vmx nor svm on any core, so KVM
      cannot accelerate a guest. Check that virtualisation is enabled in firmware before
      installing libvirt.

- name: Install the KVM/libvirt packages
  tags: [hypervisor]
  ansible.builtin.apt:
    name: "{{ hypervisor_packages }}"
    state: present
  become: true

- name: Add the deploy user to the libvirt and kvm groups
  tags: [hypervisor]
  # Group membership is read at login, so an existing session keeps the old set until it
  # reconnects. virsh over a fresh ssh connection picks it up; a long-lived shell will not.
  ansible.builtin.user:
    name: "{{ sys_user }}"
    groups: "{{ hypervisor_user_groups }}"
    append: true
  become: true

- name: Enable and start libvirtd
  tags: [hypervisor]
  ansible.builtin.systemd_service:
    name: libvirtd
    state: started
    enabled: true
  become: true

- name: Read the state of libvirt's built-in default network
  tags: [hypervisor]
  # DECIDED: the packaged `default` NAT network is stopped and un-autostarted rather than
  # left alone. Installing libvirt otherwise brings up virbr0 and a set of NAT/forward rules
  # on a host that already runs k3s's flannel and kube-router chains — an undeclared third
  # writer of firewall state, appearing as a side effect of a package install. The staging
  # network is declared explicitly in its own slice; this makes sure nothing else is.
  #
  # command rather than a module: community.libvirt is not in ansible/requirements.yml, and
  # adding a pinned collection is a lockstep change with ansible-core that is not worth
  # making for three calls. Revisit if the guest definition needs it.
  ansible.builtin.command:
    cmd: virsh --connect qemu:///system net-info default
  register: hypervisor_default_net
  changed_when: false
  failed_when: false
  become: true

- name: Stop libvirt's built-in default network
  tags: [hypervisor]
  when:
    - hypervisor_default_net.rc == 0
    - hypervisor_default_net.stdout is search('Active:\s+yes')
  ansible.builtin.command:
    cmd: virsh --connect qemu:///system net-destroy default
  changed_when: true
  become: true

- name: Stop libvirt's built-in default network from autostarting
  tags: [hypervisor]
  when:
    - hypervisor_default_net.rc == 0
    - hypervisor_default_net.stdout is search('Autostart:\s+yes')
  ansible.builtin.command:
    cmd: virsh --connect qemu:///system net-autostart --disable default
  changed_when: true
  become: true

- name: Verify virsh reaches the system hypervisor
  tags: [hypervisor]
  # The role's exit criterion, asserted rather than left to the operator. It proves the
  # property that matters -- a member of the libvirt group can reach
  # /var/run/libvirt/libvirt-sock (root:libvirt 0770) -- rather than that root can, which
  # every later slice does not rely on.
  #
  # `sg libvirt -c` rather than become_user: sys_user. Supplementary groups are read at
  # session start, and the task that adds sys_user to libvirt runs in THIS play. Worse,
  # ansible optimises become away entirely when the target user equals the connection user,
  # which sys_user is on this host -- so the check inherits the controller's own group set
  # from before the add and fails with "Permission denied" on every first run. That is a
  # verification that can only pass on a re-run, which is no verification at all. Observed
  # 2026-08-27. `sg` starts a new session with the group applied, so the result reflects the
  # host rather than the age of the ansible process.
  ansible.builtin.command:
    cmd: sg libvirt -c "virsh --connect qemu:///system version"
  become: true
  become_user: "{{ sys_user }}"
  changed_when: false

- name: Declare the staging network
  tags: [hypervisor]
  # After the verification above, so a broken libvirt fails on "can virsh reach the
  # hypervisor" rather than several tasks later on a net-define that could not have worked.
  ansible.builtin.include_tasks: network.yml

- name: Define and start the staging guest
  tags: [hypervisor]
  # After network.yml: the domain's interface names that network, and libvirt refuses to
  # start a domain whose network is not defined.
  ansible.builtin.include_tasks: guest.yml

- name: Clone the checkout the staging gate deploys from
  tags: [hypervisor]
  # `update: no` is the whole point, not a performance choice. The gate fetches and
  # fast-forwards this tree itself, every tick, to the SHA under test. An updating clone
  # would race that: Ansible would yank the tree back to master's tip while a gate run was
  # rendering from an older commit, and deploy.sh renders from the working directory, so the
  # verdict would describe a tree nobody asked about. Ansible creates this once; the gate
  # owns it thereafter.
  #
  # Cloned from the remote rather than from /home/ubuntu/server, so the two checkouts share
  # no object store and this one cannot be broken by anything done to that one.
  ansible.builtin.git:
    repo: "{{ hypervisor_staging_gate_repo_url }}"
    dest: "{{ hypervisor_staging_gate_repo }}"
    version: master
    update: false
  become: true
  become_user: "{{ sys_user }}"

- name: Install the staging-gate ssh dispatcher
  tags: [hypervisor]
  # Root-owned and not writable by sys_user, which is the point rather than habit: the
  # restricted key's authorized_keys entry pins this path as its forced command, so anything
  # that could rewrite this file could choose what that key runs.
  ansible.builtin.template:
    src: staging-gate-dispatch.sh.j2
    dest: "{{ hypervisor_staging_gate_dispatch_path }}"
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Authorize the staging-gate key against that dispatcher only
  tags: [hypervisor]
  # `restrict` turns off port/agent/X11 forwarding, pty allocation and user rc — the whole
  # tunnelling surface — and `command=` pins the one program the key may run. The two are not
  # redundant: without `restrict` the key could still forward a port even while being unable to
  # run a shell.
  #
  # A forced command does NOT stop ssh forwarding stdin, which is the trap that makes the naive
  # version of this useless. The dispatcher closes stdin itself; see the header there and
  # ansible/tests/test_staging_gate_dispatch.py, which drives that property.
  #
  # This ADDS a key. It deliberately does not touch the operator's own key, and `exclusive` is
  # left false: removing the only other way into this host in the same change that adds an
  # untested one is how a host becomes reachable only with a screwdriver.
  ansible.posix.authorized_key:
    user: "{{ sys_user }}"
    key: "{{ lookup('file', role_path ~ '/files/' ~ hypervisor_staging_gate_pubkey_file) }}"
    key_options: 'restrict,command="{{ hypervisor_staging_gate_dispatch_path }}"'
    state: present
  become: true
