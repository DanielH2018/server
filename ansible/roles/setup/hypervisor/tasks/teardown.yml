---
# Reverses install.yml on a host whose has_hypervisor went false. Everything is state=absent
# or guarded, so this is a no-op on a host that never had libvirt — which is every host but
# daniel-server.

- name: Check whether libvirt is installed
  tags: [hypervisor]
  ansible.builtin.stat:
    path: /usr/sbin/libvirtd
  register: hypervisor_libvirtd_binary
  become: true

- name: List any guests still defined
  tags: [hypervisor]
  when: hypervisor_libvirtd_binary.stat.exists
  ansible.builtin.command:
    cmd: virsh --connect qemu:///system list --all --name
  register: hypervisor_defined_guests
  changed_when: false
  failed_when: false
  become: true

- name: Refuse to remove a hypervisor that still has guests
  tags: [hypervisor]
  # Purging libvirt out from under a defined domain leaves its disk image orphaned in
  # /var/lib/libvirt/images with nothing that knows how to start it again — a one-way door
  # that reads as a successful teardown. Undefining a guest is a decision, not a side effect
  # of flipping a flag, so this stops and says which guests are in the way.
  when: hypervisor_libvirtd_binary.stat.exists
  ansible.builtin.assert:
    that: hypervisor_defined_guests.stdout | trim | length == 0
    fail_msg: >-
      {{ inventory_hostname }} still has libvirt guests defined
      ({{ hypervisor_defined_guests.stdout_lines | select | join(', ') }}), so the hypervisor
      is not being removed. Undefine them deliberately first — `virsh undefine <name>
      --remove-all-storage` destroys their disks — then re-run.

- name: Check whether the staging network is defined
  tags: [hypervisor]
  when: hypervisor_libvirtd_binary.stat.exists
  ansible.builtin.command:
    cmd: virsh --connect qemu:///system net-info {{ hypervisor_staging_net_name }}
  register: hypervisor_teardown_net_info
  changed_when: false
  failed_when: false
  become: true

- name: Stop the staging network
  tags: [hypervisor]
  # Destroy before undefine so the bridge and its NAT rules go now rather than at the next
  # reboot. Purging Docker taught this directly: #479 removed the packages and left 13
  # bridges and their routes on daniel-server until someone reboots it. Removing a thing
  # should remove what it put on the host.
  when:
    - hypervisor_libvirtd_binary.stat.exists
    - hypervisor_teardown_net_info.rc == 0
    - hypervisor_teardown_net_info.stdout is search('Active:\s+yes')
  ansible.builtin.command:
    cmd: virsh --connect qemu:///system net-destroy {{ hypervisor_staging_net_name }}
  changed_when: true
  become: true

- name: Undefine the staging network
  tags: [hypervisor]
  when:
    - hypervisor_libvirtd_binary.stat.exists
    - hypervisor_teardown_net_info.rc == 0
  ansible.builtin.command:
    cmd: virsh --connect qemu:///system net-undefine {{ hypervisor_staging_net_name }}
  changed_when: true
  become: true

- name: Remove the declared network source directory
  tags: [hypervisor]
  ansible.builtin.file:
    path: "{{ hypervisor_net_source_dir }}"
    state: absent
  become: true

- name: Stop and disable libvirtd
  tags: [hypervisor]
  when: hypervisor_libvirtd_binary.stat.exists
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop:
    - libvirtd.service
    - libvirtd.socket
  become: true

- name: Purge the KVM/libvirt packages
  tags: [hypervisor]
  # /var/lib/libvirt is deliberately left alone, on the same reasoning as /var/lib/docker:
  # it holds disk images, deleting them is irreversible in a way removing a package is not,
  # and the assert above has already established no guest is using them.
  ansible.builtin.apt:
    name: "{{ hypervisor_packages }}"
    state: absent
    purge: true
    autoremove: true
  become: true

- name: Check whether the staging-gate checkout exists
  tags: [hypervisor]
  ansible.builtin.stat:
    path: "{{ hypervisor_staging_gate_repo }}/.git"
  register: hypervisor_teardown_gate_repo
  become: true

- name: Read whether the staging-gate checkout has uncommitted work # noqa command-instead-of-module
  tags: [hypervisor]
  # `command`, not ansible.builtin.git: that module clones, checks out and pulls, and has no
  # mode that REPORTS working-tree status. There is nothing to switch to here.
  when: hypervisor_teardown_gate_repo.stat.exists
  ansible.builtin.command:
    cmd: git status --porcelain
    chdir: "{{ hypervisor_staging_gate_repo }}"
  register: hypervisor_teardown_gate_dirty
  changed_when: false
  failed_when: false
  become: true
  become_user: "{{ sys_user }}"

- name: Refuse to remove a staging-gate checkout with uncommitted work in it
  tags: [hypervisor]
  # Same reasoning as the guests assert above, and the same reasoning that leaves
  # /var/lib/libvirt alone: this tree is reproducible from the remote, so removing a CLEAN
  # one costs a re-clone. An edit that exists only here is not reproducible from anywhere,
  # and a flag flip is not a decision to discard it.
  when:
    - hypervisor_teardown_gate_repo.stat.exists
    - hypervisor_teardown_gate_dirty.rc == 0
  ansible.builtin.assert:
    that: hypervisor_teardown_gate_dirty.stdout | trim | length == 0
    fail_msg: >-
      {{ hypervisor_staging_gate_repo }} has uncommitted changes
      ({{ hypervisor_teardown_gate_dirty.stdout_lines | select | join(', ') }}), so it is not
      being removed. The staging gate owns this tree and never leaves it dirty, so an edit
      here is someone's — commit or discard it deliberately, then re-run.

- name: Remove the staging-gate checkout
  tags: [hypervisor]
  when: hypervisor_teardown_gate_repo.stat.exists
  ansible.builtin.file:
    path: "{{ hypervisor_staging_gate_repo }}"
    state: absent
  become: true

- name: Remove the staging-gate lock
  tags: [hypervisor]
  ansible.builtin.file:
    path: "{{ hypervisor_staging_gate_lock }}"
    state: absent
  become: true
