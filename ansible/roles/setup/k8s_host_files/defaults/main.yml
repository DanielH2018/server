---
# Copies of the registry role's variables that its GC script, job manifest and cron read. The
# registry role keeps the originals because the Kuma tile, the docs fragments and its deploy-time
# mirror restore read them too. test_k8s_host_files_pairs.py holds each copy equal to
# roles/k8s/registry/defaults/main.yml. They live here rather than in a task's vars because the
# strict render test and the shell-template gate resolve a template's names from role defaults,
# and because Renovate reaches a setup role's defaults. An image bump edits both copies in one PR
# only because renovate.json lists this file in every rule that matches the registry role's
# defaults; scripts/tests/test_renovate_host_file_copies.py holds the two resolving alike.
# No other setup role names these keys, so the play-wide scope reads nothing across roles
# (test_setup_cross_role_reads.py).
registry_k8s_manage_gc: true  # noqa var-naming[no-role-prefix]
registry_k8s_gc_cron_weekday: "0"  # noqa var-naming[no-role-prefix]
registry_k8s_gc_cron_hour: "4"  # noqa var-naming[no-role-prefix]
registry_k8s_gc_cron_minute: "20"  # noqa var-naming[no-role-prefix]
registry_k8s_gc_deadline_s: 1200  # noqa var-naming[no-role-prefix]
registry_k8s_gc_ttl_s: 604800  # noqa var-naming[no-role-prefix]
registry_k8s_gc_lock_file: /run/lock/registry-gc.lock  # noqa var-naming[no-role-prefix]
registry_k8s_ghcr_mirror_claim: registry-ghcr-mirror  # noqa var-naming[no-role-prefix]
registry_k8s_ghcr_mirror_keep_revisions: 3  # noqa var-naming[no-role-prefix]
registry_k8s_dockerhub_mirror_claim: registry-dockerhub-mirror  # noqa var-naming[no-role-prefix]
registry_k8s_dockerhub_mirror_keep_revisions: 3  # noqa var-naming[no-role-prefix]
registry_k8s_image: registry:3.1.2@sha256:ddf754342cfc8acc51a56d5d0ab6af06826461864460636d8bd5c546dab2a7b8  # noqa var-naming[no-role-prefix]
registry_k8s_netpol_probe_image: alpine:3.24@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6  # noqa var-naming[no-role-prefix]

# How long registry-gc.sh's warm phase may read manifests and blobs through the mirror after the
# GC. Not a copy: only this role's script reads it. A cold warm of every ghcr.io image the cluster ran on
# 2026-10-24, about 6.1 GB before deduplication, takes about 2 minutes at the 49 MB/s measured
# that day. 1800s leaves room for a slow week and bounds how long the run holds the GC lock.
k8s_host_files_ghcr_mirror_warm_budget_s: 1800
# The same bound on the dockerhub-mirror's warm phase, which runs after the ghcr-mirror's. Half
# the ghcr-mirror's: Docker Hub's anonymous limit refuses a cold warm's manifest reads long before
# bandwidth runs out. Both watchers allow two hours past the schedule, and
# ansible/tests/services/test_registry_gc_watchers_cover_the_worst_run.py fails when the two
# phases' worst case outgrows that.
k8s_host_files_dockerhub_mirror_warm_budget_s: 900
