---
# crowdsec's edge probe timer on daniel-pi was here from D5's first crowdsec conversion PR (#5650)
# until H5.14 moved it into the Pi package (hosts/components/crowdsec-probe). The package's legacy
# entries retire the units and the script this file installed.
#
# Moved from roles/k8s/crowdsec by D5's second crowdsec conversion PR (#5742). H7 deletes them
# with their RETIRED entries in ansible/tests/repo/_retired_cron_row.py.
#
# The remote allowlist, the bouncer prune and the AppSec verify were daniel-box root crons until
# H2.4b, and the home allowlist until H2.4c (docs/target-architecture/host/h2-shrink-host-plane.md,
# Steps items 11 and 12). The crowdsec-jobs sidecar and the crowdsec-home-ips CronJob run them
# since. In crowdsec's role these arms had to run ahead of its manifests, so no host cron
# outlived the sidecar that replaced it. That ordering stopped mattering once H2.4c deployed on
# 2026-10-19 and the arms had removed every cron, so they run on daniel-box here and remove
# nothing from a host that no longer carries them.
- name: Remove the retired remote-allowlist cron
  ansible.builtin.cron:
    name: "CrowdSec remote allowlist"
    user: root
    cron_file: crowdsec-remote-allowlist
    state: absent
  become: true

- name: Remove the retired bouncer-prune cron
  ansible.builtin.cron:
    name: "CrowdSec bouncer prune"
    user: root
    cron_file: crowdsec-bouncer-prune
    state: absent
  become: true

- name: Remove the retired AppSec verify cron
  ansible.builtin.cron:
    name: "CrowdSec AppSec verify"
    user: root
    cron_file: crowdsec-appsec-verify
    state: absent
  become: true

- name: Remove the retired home allowlist cron
  ansible.builtin.cron:
    name: "CrowdSec home allowlist"
    user: root
    cron_file: crowdsec-home-allowlist
    state: absent
  become: true

- name: Remove the retired crowdsec cron scripts from the host
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /usr/local/bin/crowdsec-update-remote-allowlist.sh
    - /opt/crowdsec-remote-allowlist
    - /usr/local/bin/crowdsec-prune-bouncers.sh
    - /opt/crowdsec-bouncer-prune
    - /usr/local/bin/crowdsec-appsec-verify.sh
    - /usr/local/bin/crowdsec-update-home-allowlist.sh
    - /opt/crowdsec-home-allowlist
    # The host cron's last values. The allowlist itself holds the stored entries since H2.4c.
    - /var/lib/crowdsec-home-allowlist
  become: true
