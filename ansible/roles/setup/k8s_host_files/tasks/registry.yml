---
# The registry's garbage collection is `hosts/components/registry-gc`. These are its two absent
# arms left over, which H7.48 turns into legacy entries.
#
# Removing the push store's `gc-job.yaml` came first (D5's push-store GC retirement); nothing
# reads that manifest since.
- name: Remove the retired push store's garbage-collection job manifest
  ansible.builtin.file:
    path: /etc/rancher/k3s/manifests/registry-jobs/gc-job.yaml
    state: absent
  become: true

# `registry-gc.sh` embedded a token until M6 B6c, so the apply recorded its hash here for
# `probe.py applied`. Nothing writes or reads the record since (#6987).
- name: Remove the retired apply-time SHA-256 record directory
  ansible.builtin.file:
    path: /var/lib/homelab/setup-applied-sha256.d
    state: absent
  become: true
