---
# Moved from roles/k8s/registry by D5's k8s_host_files conversion PR for registry, while Ansible
# still owns registry. The ghcr-mirror's GC stays a host script after the flip (operator ruling on
# #5680 and #5732): nothing but registry-gc.sh writes the mirror's `spec.replicas`. A Flux-owned
# role runs no tasks, so the script, its state directory, its cron and the Job manifest it applies
# at cron time install here. H7.18c turns the push store's absent arm into a legacy entry.
#
# Removing the push store's `gc-job.yaml` came first (D5's push-store GC retirement); nothing
# reads that manifest since.
- name: Remove the retired push store's garbage-collection job manifest
  ansible.builtin.file:
    path: /etc/rancher/k3s/manifests/registry-jobs/gc-job.yaml
    state: absent
  become: true

# `registry_k8s_manage_gc: false` skips the whole unit. Skip-only, as it was in the registry
# role: turning it off on a host that already has the cron installs nothing and removes nothing.
- name: Manage the registry garbage collection
  when: registry_k8s_manage_gc | bool
  become: true
  block:
    # registry-gc.sh reads this manifest at cron time. The registry role creates the same
    # directory for its self-test Jobs, with the same owner and mode, until it flips.
    - name: Create the registry job manifest directory
      ansible.builtin.file:
        path: /etc/rancher/k3s/manifests/registry-jobs
        state: directory
        mode: "0700"
        owner: root
        group: root

    - name: Render the ghcr-mirror garbage-collection job
      ansible.builtin.template:
        src: ghcr-mirror-gc-job.yaml.j2
        dest: /etc/rancher/k3s/manifests/registry-jobs/ghcr-mirror-gc-job.yaml
        mode: "0644"
        owner: root
        group: root

    - name: Render the dockerhub-mirror garbage-collection job
      ansible.builtin.template:
        src: dockerhub-mirror-gc-job.yaml.j2
        dest: /etc/rancher/k3s/manifests/registry-jobs/dockerhub-mirror-gc-job.yaml
        mode: "0644"
        owner: root
        group: root

    # Root-owned and root-run: it uses the root kubeconfig because it must scale the two mirror
    # Deployments. 0700 so the credential path it implies isn't readable by other local accounts.
    - name: Deploy the registry garbage-collection script
      ansible.builtin.template:
        src: registry-gc.sh.j2
        dest: /usr/local/bin/registry-gc.sh
        mode: "0700"
        owner: root
        group: root
      no_log: true  # renders the Kuma push token

    # `probe.py applied` cannot hash the render, which holds the token as a STUB, so it compares
    # the live file with this record instead (#6913). `lineinfile`, because the probe reads no
    # such task: a `copy` of a registered value would read UNCHECKED itself.
    # DECIDED: the record is 0644 so the probe reads it as the operator. It holds a hash of a
    # 0700 file, which guesses nothing: the token in it is random and the hash covers the script.
    - name: Create the apply-time SHA-256 record directory
      ansible.builtin.file:
        path: /var/lib/homelab/setup-applied-sha256.d
        state: directory
        mode: "0755"
        owner: root
        group: root

    - name: Read the installed garbage-collection script's SHA-256
      ansible.builtin.stat:
        path: /usr/local/bin/registry-gc.sh
        checksum_algorithm: sha256
      register: k8s_host_files_registry_gc_script_stat

    - name: Record the garbage-collection script's SHA-256 for probe.py applied
      ansible.builtin.lineinfile:
        path: /var/lib/homelab/setup-applied-sha256.d/k8s_host_files
        regexp: '^[0-9a-f]{64}  /usr/local/bin/registry-gc\.sh$'
        line: "{{ k8s_host_files_registry_gc_script_stat.stat.checksum }}  /usr/local/bin/registry-gc.sh"
        create: true
        mode: "0644"
        owner: root
        group: root
      when: k8s_host_files_registry_gc_script_stat.stat.exists

    - name: Create the registry garbage-collection state directory
      ansible.builtin.file:
        path: /var/lib/registry-gc
        state: directory
        mode: "0755"
        owner: root
        group: root

    - name: Schedule the registry garbage collection
      ansible.builtin.cron:
        name: "Registry garbage collection"
        weekday: "{{ registry_k8s_gc_cron_weekday }}"
        minute: "{{ registry_k8s_gc_cron_minute }}"
        hour: "{{ registry_k8s_gc_cron_hour }}"
        user: root
        job: "/usr/local/bin/registry-gc.sh 2>&1 | logger -t registry-gc"
        cron_file: registry-gc
