---
# The host-side rows D5 moves out of the k8s roles, one task file per source role, each named
# after that role and imported here by its conversion PR
# (docs/target-architecture/deploy/d5-bulk-move.md, *Host-side rows*). A static import, so the
# play's `k8s_host_files` tag reaches every task in the file.
- name: Artifacts' host directories
  ansible.builtin.import_tasks: artifacts.yml

- name: Janitorr's retired health reader absent arms
  ansible.builtin.import_tasks: janitorr.yml

- name: Media-volume's media directories
  ansible.builtin.import_tasks: media-volume.yml

- name: Configarr's retired host health reader
  ansible.builtin.import_tasks: configarr.yml

- name: Crowdsec's edge probe timer on daniel-pi and its retired host cron absent arms
  ansible.builtin.import_tasks: crowdsec.yml

- name: Observability's retired dashboard staging trees
  ansible.builtin.import_tasks: observability.yml

- name: Qbittorrent's retired prefs drift check
  ansible.builtin.import_tasks: qbittorrent.yml

- name: Registry's retired push-store GC manifest
  ansible.builtin.import_tasks: registry.yml

- name: Traefik's Cloudflare IP drift absent arms
  ansible.builtin.import_tasks: traefik.yml

- name: Uptime-kuma's stale autokuma-data staging directory
  ansible.builtin.import_tasks: uptime-kuma.yml
