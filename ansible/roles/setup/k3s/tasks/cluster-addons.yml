---
# MetalLB (the LAN load-balancer). The workload-tier PriorityClasses are the cluster-base role's
# (roles/k8s/cluster-base), which Flux applies (H1.2).

- name: Install MetalLB
  tags: [metallb]
  ansible.builtin.command:
    cmd: >-
      k3s kubectl apply -f
      https://raw.githubusercontent.com/metallb/metallb/{{ k3s_metallb_version }}/config/manifests/metallb-native.yaml
  register: k3s_metallb_apply
  become: true
  changed_when: "'created' in k3s_metallb_apply.stdout or 'configured' in k3s_metallb_apply.stdout"

- name: Wait for the MetalLB controller
  tags: [metallb]
  ansible.builtin.command:
    cmd: k3s kubectl -n metallb-system wait --for=condition=Available deploy/controller --timeout=300s
  become: true
  changed_when: false

- name: Render the MetalLB address pool
  tags: [metallb]
  ansible.builtin.template:
    src: metallb-pool.yaml.j2
    dest: /etc/rancher/k3s/metallb-pool.yaml
    mode: "0644"
    owner: root
    group: root
  become: true

- name: Apply the MetalLB address pool
  tags: [metallb]
  ansible.builtin.command:
    cmd: k3s kubectl apply -f /etc/rancher/k3s/metallb-pool.yaml
  register: k3s_metallb_pool_apply
  become: true
  changed_when: "'created' in k3s_metallb_pool_apply.stdout or 'configured' in k3s_metallb_pool_apply.stdout"
