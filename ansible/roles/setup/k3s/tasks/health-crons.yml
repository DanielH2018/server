---
# Host crons that push heartbeats for the backup plane, root-disk headroom and
# manifest drift, plus the shared Healthchecks.io ping key they use.
# Split out of main.yml on 2026-08-15; task content and tags are unchanged.

- name: Create the setup-plane state directory
  tags: [backup-health, disk-health, manifest-prune]
  ansible.builtin.file:
    path: /var/lib/homelab
    state: directory
    mode: "0755"
    owner: root
    group: root
  become: true

# The provenance half of the drift check in manifest-prune-check.sh. That script can compare
# `copy:`-deployed artifacts byte-for-byte, but NOT the `template:`-rendered scripts beside it:
# a rendered file legitimately differs from its .j2, and re-rendering to compare would need
# every role's vars and secrets. So the comparison moves up a level — these tasks stamp the
# SOURCE checksum of each template at render time, and the check re-computes those checksums
# from the repo. Equal means this host has run initial_setup.yml since the templates last
# changed; unequal means it has not, and is still executing the old rendered copy.
#
# THE FAILURE THIS CLOSES (2026-08-23): /usr/local/bin/longhorn-backup-health.sh was two
# commits behind for two days while manifest-prune-check pushed "deployed scripts match the
# repo" — true of the three files it compared, false of the twenty it did not, including
# itself. roles/setup/ changes are deferred-and-alerted by the gitops tick, but that alert
# clears the moment the tree ff-merges, leaving the stale render with nothing watching it
# (the mechanism deploy_logic.py:86-100 already predicted in a comment).
#
# ONE STAMP PER TAG FAMILY, each carrying that family's tags — see k3s_render_stamp_groups in
# defaults/main.yml for why a single untagged stamp over all eight was worse than none. The
# stamps live at the END of this file, AFTER every template: task, for the second half of the
# same problem: the old stamp ran first, so a run that died partway through had still declared
# every script current.

- name: Deploy the Kuma push credentials for the heartbeat scripts
  tags: [backup-health, disk-health, manifest-prune, etcd-snapshot, remember-logs]
  # 0640 root:{{ sys_user }}, for the same reason as live-drift-check.env below: the scripts that
  # consume these land 0755, so a token rendered inline is readable by every local account — and
  # a Kuma push token is enough to forge or suppress a heartbeat, which hides a real outage. The
  # root crons (etcd-snapshot, manifest-prune) and the {{ sys_user }} crons (backup/disk health)
  # both read this one file; the group is what lets the latter.
  ansible.builtin.template:
    src: kuma-push.env.j2
    dest: /etc/rancher/k3s/kuma-push.env
    mode: "0640"
    owner: root
    group: "{{ sys_user }}"
  become: true
  no_log: true  # renders five Kuma push tokens

- name: Create the Healthchecks.io credential directory
  tags: [backup-health, disk-health, manifest-prune]
  ansible.builtin.file:
    path: /etc/healthchecks
    state: directory
    mode: "0755"
    owner: root
    group: root
  become: true

- name: Deploy the Healthchecks.io ping key
  tags: [backup-health, disk-health, manifest-prune]
  # NOT inlined into the heartbeat scripts. Those land at 0755 (they must be executable by the
  # {{ sys_user }} crons), so a key inlined there is readable by every local account on this
  # host — and a project ping key is broader than the Kuma push tokens already exposed that
  # way: a Kuma token spoofs one monitor, this one can hold every check in the project green
  # and so suppress the alerts the whole mechanism exists to deliver. 0640 root:{{ sys_user }}
  # covers both callers — manifest-prune-check runs as root (owner), the other two as
  # {{ sys_user }} (group). Same shape as /etc/renovate-notify/config.env.
  ansible.builtin.copy:
    # Single-quoted for the same reason as kuma-push.env and live-drift-check.env: this file is
    # `.`-sourced by root and {{ sys_user }} scripts, so an unquoted value is shell input rather
    # than data (2026-08-23b review L5, applied to the whole class rather than the one instance).
    content: "HC_PING_KEY='{{ healthchecks_ping_key | default('') }}'\n"
    dest: /etc/healthchecks/ping.env
    mode: "0640"
    owner: root
    group: "{{ sys_user }}"
  become: true
  no_log: true  # renders the Healthchecks.io ping key

# Deployed as a VERSIONED RELEASE rather than rendered straight over /usr/local/bin — see
# roles/setup/common/tasks/release_bin.yml. Each script lands in
# /opt/homelab/releases/k3s-backup-health/<sha>/ and /usr/local/bin/<name> becomes a symlink
# through /opt/homelab/current/k3s-backup-health, so a cron's provenance is readable
# (`probe.py releases` for the k8s plane, `readlink -f` here) and a rollback is one symlink
# swing rather than a git revert plus a redeploy. The crons below are unchanged: they still
# invoke /usr/local/bin/<name>, and setup-drift-lib.sh's `cmp` reads through the symlink.
#
# The file list comes from k3s_render_stamp_groups, the SAME list stamp_render.yml is given
# below. That is deliberate: a release and its stamp describing different sets of files is
# exactly the partial-group false-green the comment above that stamp task warns about, and
# sharing one list makes the two incapable of disagreeing.
#
# The per-script notes that used to sit in this loop now live beside that list in
# roles/setup/k3s/defaults/main.yml, next to the paths they describe.
- name: Deploy the backup-health scripts as a versioned release
  tags: [backup-health]
  ansible.builtin.import_tasks: "{{ role_path }}/../common/tasks/release_bin.yml"
  vars:
    release_bin_group: k3s-backup-health
    release_bin_templates: >-
      {{ (k3s_render_stamp_groups | selectattr('name', 'eq', 'k3s-backup-health')
          | first).templates }}

- name: Schedule the Longhorn backup-plane heartbeat
  tags: [backup-health]
  ansible.builtin.cron:
    name: "Longhorn backup health"
    minute: "{{ k3s_longhorn_backup_health_cron_minute }}"
    user: "{{ sys_user }}"
    job: "/usr/local/bin/longhorn-backup-health.sh"
    cron_file: longhorn-backup-health
  become: true

- name: Schedule the Longhorn filesystem-trim sweep
  tags: [backup-health]
  # After BOTH backup windows (03:30 daily, 04:30 weekly) and clear of the 05:15 manifest-prune
  # check, so a trim never contends with a snapshot being taken. Order matters more than the
  # hour: trimming before the day's snapshot would hand back blocks the snapshot then re-pins.
  ansible.builtin.cron:
    name: "Longhorn filesystem trim"
    hour: "{{ k3s_longhorn_trim_cron_hour }}"
    minute: "{{ k3s_longhorn_trim_cron_minute }}"
    user: "{{ sys_user }}"
    job: "/usr/local/bin/longhorn-trim-volumes.sh"
    cron_file: longhorn-trim
  become: true

- name: Schedule the Longhorn restore drill
  tags: [backup-health]
  # Runs as ROOT, unlike the heartbeat beside it. The drill creates and deletes Volume/PV/PVC
  # objects and runs a pod; the read-only ServiceAccount the heartbeat uses is Forbidden on all
  # of it. Root's k3s kubectl reads /etc/rancher/k3s/k3s.yaml and has the cluster-admin cert.
  ansible.builtin.cron:
    name: "Longhorn restore drill"
    minute: "{{ k3s_longhorn_restore_drill_cron.split()[0] }}"
    hour: "{{ k3s_longhorn_restore_drill_cron.split()[1] }}"
    day: "{{ k3s_longhorn_restore_drill_cron.split()[2] }}"
    user: root
    job: "/usr/local/bin/longhorn-restore-drill.sh"
    cron_file: longhorn-restore-drill
  become: true

- name: Deploy the root-disk headroom heartbeat as a versioned release
  tags: [disk-health]
  ansible.builtin.import_tasks: "{{ role_path }}/../common/tasks/release_bin.yml"
  vars:
    release_bin_group: k3s-disk-health
    release_bin_templates: >-
      {{ (k3s_render_stamp_groups | selectattr('name', 'eq', 'k3s-disk-health')
          | first).templates }}

- name: Schedule the root-disk headroom heartbeat
  tags: [disk-health]
  ansible.builtin.cron:
    name: "daniel-box disk health"
    minute: "{{ k3s_disk_health_cron_minute }}"
    user: "{{ sys_user }}"
    job: "/usr/local/bin/disk-health.sh"
    cron_file: disk-health
  become: true

- name: Deploy the remember log-rotation heartbeat as a versioned release
  tags: [remember-logs]
  ansible.builtin.import_tasks: "{{ role_path }}/../common/tasks/release_bin.yml"
  vars:
    release_bin_group: k3s-remember-logs
    release_bin_templates: >-
      {{ (k3s_render_stamp_groups | selectattr('name', 'eq', 'k3s-remember-logs')
          | first).templates }}

- name: Schedule the remember log-rotation heartbeat
  tags: [remember-logs]
  # Runs as {{ sys_user }}, not root, and that is a requirement rather than a convention: the
  # stores it prunes are {{ sys_user }}-owned under /home/{{ sys_user }}, and a root prune would
  # be free to delete outside them if the search path were ever wrong. It reads the shared
  # kuma-push.env through the 0640 root:{{ sys_user }} group bit, same as disk-health.
  ansible.builtin.cron:
    name: "remember log rotation health"
    minute: "{{ k3s_remember_logs_cron_minute }}"
    user: "{{ sys_user }}"
    job: "/usr/local/bin/remember-logs-health.sh"
    cron_file: remember-logs-health
  become: true

- name: Deploy the manifest-prune drift check as a versioned release
  tags: [manifest-prune]
  # Root-owned AND root-run (see the cron task below): /etc/rancher/k3s/manifests/*/ is mode
  # 0700 (k8s/manifests role), so comparing live objects against the staged manifests needs
  # root at the OS level. The kubectl calls inside the script stay scoped to the read-only
  # ServiceAccount kubeconfig regardless, same as the heartbeats above — root here buys
  # filesystem access, not cluster-mutation ability. release_bin.yml owns root by default.
  ansible.builtin.import_tasks: "{{ role_path }}/../common/tasks/release_bin.yml"
  vars:
    release_bin_group: k3s-manifest-prune
    release_bin_templates: >-
      {{ (k3s_render_stamp_groups | selectattr('name', 'eq', 'k3s-manifest-prune')
          | first).templates }}
    # manifest-declares.py rides in the same release as the script that calls it. Splitting
    # them would let the reader and its caller land from different commits, and a reader that
    # disagrees with its caller about what "declared" means is a silent false all-clear.
    release_bin_files: >-
      {{ (k3s_release_file_groups | selectattr('name', 'eq', 'k3s-manifest-prune')
          | first).files }}

- name: Schedule the manifest-prune drift check
  tags: [manifest-prune]
  ansible.builtin.cron:
    name: "Manifest prune drift check"
    minute: "{{ k3s_manifest_prune_cron_minute }}"
    hour: "{{ k3s_manifest_prune_cron_hour }}"
    user: root
    job: "/usr/local/bin/manifest-prune-check.sh"
    cron_file: manifest-prune-check
  become: true

- name: Deploy the live-object drift check
  tags: [live-drift]
  # Root-owned but NOT root-run, unlike manifest-prune-check.sh beside it. That one needs root
  # to read /etc/rancher/k3s/manifests/*/ at mode 0700; this one reads no files at all — it
  # compares each live object against its own last-applied annotation, which is a plain
  # `kubectl get`. So it runs as {{ sys_user }} with the read-only ServiceAccount kubeconfig
  # and needs no privilege of any kind.
  #
  # The one `release_bin_files` caller: this is copied verbatim, not rendered, and the host name
  # differs from the source name (live_drift_check.py -> live-drift-check.py), which is exactly
  # why that parameter takes {src, name} dicts rather than bare paths.
  ansible.builtin.import_tasks: "{{ role_path }}/../common/tasks/release_bin.yml"
  vars:
    release_bin_group: k3s-live-drift
    release_bin_files: >-
      {{ (k3s_release_file_groups | selectattr('name', 'eq', 'k3s-live-drift')
          | first).files }}

- name: Deploy the live-drift check Kuma credentials
  tags: [live-drift]
  # 0640 root:{{ sys_user }} rather than inlined into the cron entry. /etc/cron.d is 0700
  # root:root on this host, so a token in the cron file would not leak today — but that mode
  # comes from the cron package, not from anything this role asserts, and a credential's
  # protection should not rest on a default nothing here owns. Same split as ping.env for the
  # Healthchecks key.
  ansible.builtin.template:
    src: live-drift-check.env.j2
    dest: /etc/rancher/k3s/live-drift-check.env
    mode: "0640"
    owner: root
    group: "{{ sys_user }}"
  become: true
  no_log: true  # renders the Kuma push token

- name: Schedule the live-object drift check
  tags: [live-drift]
  # KUBECONFIG is set explicitly because cron inherits neither it nor a useful PATH — without
  # it kubectl talks to no cluster and every kind returns an error, which the check reports as
  # exit 2 rather than as a clean run. `set -a` around the env file exports its assignments;
  # sourcing alone would leave PUSH_TOKEN unset in the script's environment.
  ansible.builtin.cron:
    name: "Live object drift check"
    minute: "{{ k3s_live_drift_cron_minute }}"
    hour: "{{ k3s_live_drift_cron_hour }}"
    user: "{{ sys_user }}"
    job: >-
      set -a; . /etc/rancher/k3s/live-drift-check.env; set +a;
      KUBECONFIG=/home/{{ sys_user }}/.kube/config
      /usr/local/bin/uv run --no-project --no-python-downloads
      --python {{ host_python_version }} /usr/local/bin/live-drift-check.py
    cron_file: live-drift-check
  become: true

- name: Deploy the off-box etcd snapshot credentials
  tags: [etcd-snapshot]
  # 0600 root:root, not 0640 root:{{ sys_user }} like the Healthchecks key above: these are the
  # R2 write credentials for the bucket that also holds every Longhorn backup, and the only
  # caller is a root cron. Kept out of the script itself because that lands 0755 — the same
  # reasoning as ping.env, one tier stricter because the blast radius is the backup store.
  ansible.builtin.copy:
    content: |
      AWS_ACCESS_KEY_ID={{ r2_access_key_id }}
      AWS_SECRET_ACCESS_KEY={{ r2_secret_access_key }}
      ETCD_S3_BUCKET={{ r2_bucket }}
      ETCD_S3_ENDPOINT={{ r2_account_id }}.r2.cloudflarestorage.com
    dest: /etc/rancher/k3s/etcd-s3.env
    mode: "0600"
    owner: root
    group: root
  become: true
  no_log: true  # renders the R2 access key and secret

- name: Deploy the off-box etcd snapshot as a versioned release
  tags: [etcd-snapshot]
  # Root-run: `k3s etcd-snapshot save` talks to the local etcd through the server's own data-dir
  # and token. Unlike the heartbeats above it cannot use the read-only ServiceAccount at all —
  # this is a control-plane operation, not a cluster API read.
  #
  # Eligible for a release despite the task above carrying `no_log`: that one renders the R2
  # credentials into a SEPARATE env file, and this script only sources them. What disqualifies a
  # script is a credential in its own rendered bytes, which retention would then keep five copies
  # of — not the presence of a secret anywhere in its role.
  ansible.builtin.import_tasks: "{{ role_path }}/../common/tasks/release_bin.yml"
  vars:
    release_bin_group: k3s-etcd-snapshot
    release_bin_templates: >-
      {{ (k3s_render_stamp_groups | selectattr('name', 'eq', 'k3s-etcd-snapshot')
          | first).templates }}

- name: Schedule the off-box etcd snapshot
  tags: [etcd-snapshot]
  ansible.builtin.cron:
    name: "Off-box etcd snapshot"
    minute: "{{ k3s_etcd_s3_cron_minute }}"
    hour: "{{ k3s_etcd_s3_cron_hour }}"
    user: root
    job: "/usr/local/bin/etcd-snapshot-offbox.sh"
    cron_file: etcd-snapshot-offbox
  become: true

- name: Schedule the etcd restore drill
  tags: [etcd-snapshot]
  # Run IN PLACE from the primary checkout, not copied to /usr/local/bin — the same shape the
  # gen_infra_map and docs-refresh crons use for scripts under scripts/. Copying it would add a
  # deployed artifact that the drift arm then has to track, to gain nothing: the checkout is what
  # gitops keeps fast-forwarded, so in-place is the copy that is actually current.
  #
  # PATH is load-bearing. Cron inherits neither PATH nor KUBECONFIG, and the drill's preflight is
  # `command -v k3s`, with k3s at /usr/local/bin/k3s — without this the drill dies on a host that
  # has k3s, reporting it as missing.
  #
  # --list-only ONLY. See the k3s_etcd_restore_drill_cron block in defaults/main.yml for why the
  # full restore must not be scheduled; the short version is that it cannot pass on this host and
  # every failure would hold a restored etcd database in /var/tmp for 30 days.
  ansible.builtin.cron:
    name: "etcd restore drill"
    minute: "{{ k3s_etcd_restore_drill_cron.split()[0] }}"
    hour: "{{ k3s_etcd_restore_drill_cron.split()[1] }}"
    weekday: "{{ k3s_etcd_restore_drill_cron.split()[4] }}"
    user: root
    job: >-
      PATH=/usr/local/bin:/usr/bin:/bin
      /home/{{ sys_user }}/server/scripts/backup/etcd_restore_drill.sh --list-only
    cron_file: etcd-restore-drill
    state: "{{ 'present' if k3s_etcd_restore_drill_armed else 'absent' }}"
  become: true

# Render provenance, stamped LAST so a run that fails partway through leaves the previous
# checksums in place rather than declaring the scripts it never reached to be current. Each
# group carries only its own tag family, so a tag-scoped run restamps only what it rendered.
#
# DECIDED: the fix for a sub-tag that renders without stamping is to DROP the sub-tag, never to
# add it here. `--tags restore-drill` used to render 1 of this group's 5 templates and stamp
# none, which reads as drift on 1 script — a false RED. Adding `restore-drill` to this task's
# tags restamps all 5, declaring the 4 it never rendered to be current: a false GREEN, and the
# exact defect the 2026-08-23b review's M6 was raised for. A false RED costs an investigation;
# a false GREEN costs the guarantee. Two reviewers proposed the additive fix on 2026-08-24 and
# both were wrong; the sub-tag is gone entirely — the deploy task above is now a single loop over
# all 5 backup-health scripts (including the restore drill), so there is no per-script tag left
# to add one to. Contradict this only with a stamp mechanism that can record a PARTIAL group.
- name: Stamp the backup-plane scripts this host has rendered
  tags: [backup-health]
  ansible.builtin.import_tasks: "{{ role_path }}/../common/tasks/stamp_render.yml"
  vars:
    stamp_render_name: k3s-backup-health
    stamp_render_templates: "{{ (k3s_render_stamp_groups | selectattr('name', 'eq', 'k3s-backup-health') | first).templates }}"

# live-drift-check.py is `copy:`-deployed, not rendered, so the stale-script arm structurally
# cannot see it — it belongs to the deployed-code arm, which hardcoded three gitops-deploy paths
# and knew nothing of this one (2026-08-24 review M-5). Tagged with the family that deploys it,
# so a `--tags live-drift` run records exactly what it just installed.
- name: Record the deployed live-drift check
  tags: [live-drift]
  ansible.builtin.import_tasks: "{{ role_path }}/../common/tasks/stamp_deployed.yml"
  vars:
    stamp_deployed_name: k3s-live-drift
    stamp_deployed_pairs:
      - live: /usr/local/bin/live-drift-check.py
        src: ansible/roles/setup/k3s/files/live_drift_check.py

- name: Stamp the disk-health script this host has rendered
  tags: [disk-health]
  ansible.builtin.import_tasks: "{{ role_path }}/../common/tasks/stamp_render.yml"
  vars:
    stamp_render_name: k3s-disk-health
    stamp_render_templates: "{{ (k3s_render_stamp_groups | selectattr('name', 'eq', 'k3s-disk-health') | first).templates }}"

- name: Stamp the remember log-rotation script this host has rendered
  tags: [remember-logs]
  ansible.builtin.import_tasks: "{{ role_path }}/../common/tasks/stamp_render.yml"
  vars:
    stamp_render_name: k3s-remember-logs
    stamp_render_templates: "{{ (k3s_render_stamp_groups | selectattr('name', 'eq', 'k3s-remember-logs') | first).templates }}"

- name: Record the deployed manifest-declares reader
  tags: [manifest-prune]
  # `copy:`-deployed like live-drift-check.py, so the stale-script arm cannot see it — it
  # belongs to the deployed-code arm, which compares bytes on the host against the repo.
  ansible.builtin.import_tasks: "{{ role_path }}/../common/tasks/stamp_deployed.yml"
  vars:
    stamp_deployed_name: k3s-manifest-declares
    stamp_deployed_pairs:
      - live: /usr/local/bin/manifest-declares.py
        src: ansible/roles/setup/k3s/files/manifest_declares.py

- name: Stamp the manifest-prune script this host has rendered
  tags: [manifest-prune]
  ansible.builtin.import_tasks: "{{ role_path }}/../common/tasks/stamp_render.yml"
  vars:
    stamp_render_name: k3s-manifest-prune
    stamp_render_templates: "{{ (k3s_render_stamp_groups | selectattr('name', 'eq', 'k3s-manifest-prune') | first).templates }}"

- name: Stamp the etcd-snapshot script this host has rendered
  tags: [etcd-snapshot]
  ansible.builtin.import_tasks: "{{ role_path }}/../common/tasks/stamp_render.yml"
  vars:
    stamp_render_name: k3s-etcd-snapshot
    stamp_render_templates: "{{ (k3s_render_stamp_groups | selectattr('name', 'eq', 'k3s-etcd-snapshot') | first).templates }}"
