---
# Host crons that write textfile verdicts for the backup plane and root-disk headroom, plus the
# shared Healthchecks.io ping key they use.

- name: Create the setup-plane state directory
  tags: [backup-health, disk-health]
  ansible.builtin.file:
    path: /var/lib/homelab
    state: directory
    mode: "0755"
    owner: root
    group: root
  become: true

# The provenance half of the drift check in setup-drift-check.sh. That script can compare
# `copy:`-deployed artifacts byte-for-byte, but NOT the `template:`-rendered scripts beside it:
# a rendered file legitimately differs from its .j2, and re-rendering to compare would need
# every role's vars and secrets. So the comparison moves up a level — these tasks stamp the
# SOURCE checksum of each template at render time, and the check re-computes those checksums
# from the repo. Equal means this host has run initial_setup.yml since the templates last
# changed; unequal means it has not, and is still executing the old rendered copy.
#
# THE FAILURE THIS CLOSES: a rendered script falls behind the repo while setup-drift-check
# reports "deployed scripts match the repo" — true of the files it compares, false of the ones
# it does not, including itself. roles/setup/ changes are deferred-and-alerted by the gitops
# tick, but that alert clears the moment the tree ff-merges, leaving the stale render with
# nothing watching it.
#
# ONE STAMP PER TAG FAMILY, each carrying that family's tags — see k3s_render_stamp_groups in
# defaults/main.yml for why a single untagged stamp over all eight was worse than none. The
# stamps live at the END of this file, AFTER every template: task, for the second half of the
# same problem: a stamp that ran first would let a run that died partway through declare
# every script current.

# Nothing removes a file the role stops declaring. M6 batch B1's Cutover-2 stopped the four
# shell scripts from sourcing /etc/rancher/k3s/kuma-push.env, so this retires the host copy. It
# holds four Kuma push tokens in a 0640 file, which a retired credential must not outlive.
- name: Retire the Kuma push credentials of the heartbeat scripts
  tags: [backup-health, disk-health, etcd-snapshot]
  ansible.builtin.file:
    path: /etc/rancher/k3s/kuma-push.env
    state: absent
  become: true

- name: Create the Healthchecks.io credential directory
  tags: [backup-health, disk-health]
  ansible.builtin.file:
    path: /etc/healthchecks
    state: directory
    mode: "0755"
    owner: root
    group: root
  become: true

- name: Deploy the Healthchecks.io ping key
  tags: [backup-health, disk-health]
  # NOT inlined into the heartbeat scripts. Those land at 0755 (they must be executable by the
  # {{ sys_user }} crons), so a key inlined there is readable by every local account on this
  # host — and a project ping key is broader than the Kuma push tokens already exposed that
  # way: a Kuma token spoofs one monitor, this one can hold every check in the project green
  # and so suppress the alerts the whole mechanism exists to deliver. 0640 root:{{ sys_user }}
  # covers both callers — etcd-token-drift runs as root (owner), the other two as
  # {{ sys_user }} (group). Same shape as /etc/renovate-notify/config.env.
  ansible.builtin.copy:
    # Single-quoted because this file is `.`-sourced by root and {{ sys_user }} scripts, so an
    # unquoted value is shell input rather than data.
    content: "HC_PING_KEY='{{ healthchecks_ping_key | default('') }}'\n"
    dest: /etc/healthchecks/ping.env
    mode: "0640"
    owner: root
    group: "{{ sys_user }}"
  become: true
  no_log: true  # renders the Healthchecks.io ping key

# The two Longhorn reapers moved to scripts/backup/ (#2978) and run from the repo checkout, so
# this role no longer installs them. Nothing removes a file the role stops declaring, so these
# tasks retire the host copies. Each one matters on its own:
#   - /opt/longhorn-reap/ held the Python and a host_lib.py sibling.
#   - The k3s-longhorn-reap fragment named those files. Left behind, setup-drift-check.sh's
#     deployed-code arm reports every one of them as missing.
#   - The /usr/local/bin links pointed through current/k3s-backup-health, and release_bin.yml
#     only ever creates links, so once `current` swings to a release without the shims they dangle.
- name: Retire the host-installed Longhorn reapers
  tags: [backup-health]
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /opt/longhorn-reap
    - /var/lib/homelab/setup-deployed-manifest.d/k3s-longhorn-reap
    - /usr/local/bin/longhorn-reap-orphan-backups.sh
    - /usr/local/bin/longhorn-reap-orphan-snapshots.sh
  become: true

- name: Install the Longhorn backup health reader
  tags: [backup-health]
  # Installed BEFORE the shim below, deliberately: the shim's every-10-minutes cron invokes
  # /opt/longhorn-backup-health/longhorn_backup_health.py by absolute path the moment it lands,
  # so if the shim's release install ran first, a `*/10` cron firing in the window between the
  # two tasks would call a reader that doesn't exist yet (first install) — a spurious page,
  # not a real one.
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ sys_user }}"
    group: "{{ sys_user }}"
    mode: "0755"
  loop:
    - /opt/longhorn-backup-health
    - /opt/longhorn-backup-health/longhorn_lib # the reader's libraries, a namespace package
  become: true

- name: Install the shared host_lib helper beside the backup health reader
  tags: [backup-health]
  # Before the reader, not in the same loop after it. The `*/10` cron invokes the reader by
  # absolute path, so a window in which the reader exists and its sibling import does not is a
  # spurious page — the same hazard the directory task above documents, one file over.
  ansible.builtin.import_tasks: "{{ role_path }}/../common/tasks/install_host_lib.yml"
  vars:
    host_lib_dir: /opt/longhorn-backup-health
    host_lib_owner: "{{ sys_user }}"

- name: Install the Longhorn backup health reader libraries
  tags: [backup-health]
  # Plain `copy:`, not a versioned release like the shell script beside it: these are imported
  # by absolute sys.path, not invoked as their own /usr/local/bin/<name>, so the release
  # mechanism's per-name symlink (common_release_names unions template AND file names) would
  # give each of them a dangling /usr/local/bin entry nothing calls — the same reason the
  # host_lib include above is a copy rather than a release. Same shape as configarr's health
  # reader (roles/k8s/configarr/tasks/main.yml).
  #
  # The source is `scripts/lib/longhorn_lib/` since H7.2e, because the reapers, `probe.py` and
  # the runbook gates import the same modules from the checkout. One file at a time rather than
  # the directory, because a directory copy also ships the controller checkout's __pycache__.
  # The libraries come before the reader for the same cron-window reason: the reader that lands
  # imports them from longhorn_lib/.
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../scripts/lib/longhorn_lib/{{ item }}"
    dest: "/opt/longhorn-backup-health/longhorn_lib/{{ item }}"
    owner: "{{ sys_user }}"
    group: "{{ sys_user }}"
    mode: "0755"
  loop:
    - longhorn_backup_health_logic.py
    - longhorn_backups.py
    - longhorn_cluster_state.py
    - longhorn_cron_evidence_logic.py
    - longhorn_etcd_s3_logic.py
    - longhorn_restore_drill_stamps.py
    - longhorn_skipped_volumes_logic.py
  become: true

- name: Install the Longhorn backup health reader scripts
  tags: [backup-health]
  # The reader itself, after the libraries it imports (see the task above).
  ansible.builtin.copy:
    src: longhorn_backup_health.py
    dest: /opt/longhorn-backup-health/longhorn_backup_health.py
    owner: "{{ sys_user }}"
    group: "{{ sys_user }}"
    mode: "0755"
  become: true

- name: Remove the reader libraries that moved into longhorn_lib
  tags: [backup-health]
  # Until #4354 these five sat flat beside the reader. A copy loop removes nothing it stops
  # naming, so without this they stay on disk, unread and unwatched by the drift check. After
  # the reader above, which no longer imports them, so no cron fire finds them missing.
  ansible.builtin.file:
    path: "/opt/longhorn-backup-health/{{ item }}"
    state: absent
  loop:
    - longhorn_backup_health_logic.py
    - longhorn_backups.py
    - longhorn_cron_evidence_logic.py
    - longhorn_restore_drill_stamps.py
    - longhorn_skipped_volumes_logic.py
  become: true

# Deployed as a VERSIONED RELEASE rather than rendered straight over /usr/local/bin — see
# roles/setup/common/tasks/release_bin.yml. Each script lands in
# /opt/homelab/releases/k3s-backup-health/<sha>/ and /usr/local/bin/<name> becomes a symlink
# through /opt/homelab/current/k3s-backup-health, so a cron's provenance is readable
# (`probe.py releases` for the k8s plane, `readlink -f` here) and a rollback is one symlink
# swing rather than a git revert plus a redeploy. The crons below are unchanged: they still
# invoke /usr/local/bin/<name>, and setup-drift-lib.sh's `cmp` reads through the symlink.
#
# The file list comes from k3s_render_stamp_groups, the SAME list stamp_render.yml is given
# below. That is deliberate: a release and its stamp describing different sets of files is
# exactly the partial-group false-green the comment above that stamp task warns about, and
# sharing one list makes the two incapable of disagreeing.
#
# The per-script notes live beside that list in
# roles/setup/k3s/defaults/main.yml, next to the paths they describe.
- name: Deploy the backup-health scripts as a versioned release
  tags: [backup-health]
  # Runs AFTER the reader above lands, not before — see that task's comment.
  ansible.builtin.import_tasks: "{{ role_path }}/../common/tasks/release_bin.yml"
  vars:
    release_bin_group: k3s-backup-health
    release_bin_templates: >-
      {{ (k3s_render_stamp_groups | selectattr('name', 'eq', 'k3s-backup-health')
          | first).templates }}

- name: Record the deployed Longhorn backup health reader
  tags: [backup-health]
  # `copy:`-deployed, so a stale copy of the reader is visible to setup-drift-check's
  # deployed-code arm
  # — the render-stamp arm above only ever sees the shell shim.
  ansible.builtin.import_tasks: "{{ role_path }}/../common/tasks/stamp_deployed.yml"
  vars:
    stamp_deployed_name: k3s-longhorn-backup-health-reader
    stamp_deployed_pairs:
      - live: /opt/longhorn-backup-health/longhorn_backup_health.py
        src: ansible/roles/setup/k3s/files/longhorn_backup_health.py
      - live: /opt/longhorn-backup-health/longhorn_lib/longhorn_backup_health_logic.py
        src: scripts/lib/longhorn_lib/longhorn_backup_health_logic.py
      - live: /opt/longhorn-backup-health/longhorn_lib/longhorn_backups.py
        src: scripts/lib/longhorn_lib/longhorn_backups.py
      - live: /opt/longhorn-backup-health/longhorn_lib/longhorn_cluster_state.py
        src: scripts/lib/longhorn_lib/longhorn_cluster_state.py
      - live: /opt/longhorn-backup-health/longhorn_lib/longhorn_cron_evidence_logic.py
        src: scripts/lib/longhorn_lib/longhorn_cron_evidence_logic.py
      - live: /opt/longhorn-backup-health/longhorn_lib/longhorn_etcd_s3_logic.py
        src: scripts/lib/longhorn_lib/longhorn_etcd_s3_logic.py
      - live: /opt/longhorn-backup-health/longhorn_lib/longhorn_restore_drill_stamps.py
        src: scripts/lib/longhorn_lib/longhorn_restore_drill_stamps.py
      - live: /opt/longhorn-backup-health/longhorn_lib/longhorn_skipped_volumes_logic.py
        src: scripts/lib/longhorn_lib/longhorn_skipped_volumes_logic.py
      - live: /opt/longhorn-backup-health/host_lib.py
        src: hosts/lib/host_lib.py

- name: Schedule the Longhorn backup-plane heartbeat
  tags: [backup-health]
  ansible.builtin.cron:
    name: "Longhorn backup health"
    minute: "{{ k3s_longhorn_backup_health_cron_minute }}"
    user: "{{ sys_user }}"
    job: "/usr/local/bin/longhorn-backup-health.sh 2>&1 | logger -t longhorn-backup-health"
    cron_file: longhorn-backup-health
  become: true

- name: Create the directory the cron fire stamps live in
  tags: [backup-health]
  # Check 10 of longhorn-backup-health reads these stamps; the defaults entry for
  # k3s_cron_fired_stamp_dir says why the /etc/cron.d stat cannot stand in for them (#3677).
  ansible.builtin.file:
    path: "{{ k3s_cron_fired_stamp_dir }}"
    state: directory
    owner: "{{ sys_user }}"
    group: "{{ sys_user }}"
    mode: "0755"
  become: true

# The filesystem trim is Longhorn's `trim` RecurringJob in the `longhorn-backup` Flux role since
# H2.2c, and backup health's checks 9 and 10 read its CronJob, Job and pod log. Nothing removes a
# cron file, a script link or a stamp the role stops declaring, so these three arms retire the
# host copies. An absent arm names no schedule field, because the schedule keys left this role.
- name: Retire the host Longhorn filesystem trim cron
  tags: [backup-health]
  ansible.builtin.cron:
    name: "Longhorn filesystem trim"
    cron_file: longhorn-trim
    user: "{{ sys_user }}"
    state: absent
  become: true

- name: Retire the host Longhorn filesystem trim script and its fire stamp
  tags: [backup-health]
  # The script is a symlink through `/opt/homelab/current/k3s-backup-health`, which
  # release_bin.yml only ever creates, so it dangles once `current` swings to a release without
  # the trim. The stamp is the one the script touched for check 10, which no longer reads it.
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /usr/local/bin/longhorn-trim-volumes.sh
    - "{{ k3s_cron_fired_stamp_dir }}/longhorn-trim"
  become: true

- name: Schedule the after-the-fact B2 deletion accounting
  tags: [backup-health]
  when: has_repo_checkout
  # Charges each completed backup deletion to the B2 ledger, from longhorn-manager's own logs.
  # Without this pass the ledger records only the two read-only listing probes, so the one
  # operation it exists to capture writes no line at all: a deletion walks the volume's whole
  # block tree at ~1.28 Class C per stored block, which is what sets the daily cap, and once
  # the tree is gone nothing can price it.
  #
  # After Longhorn's 06:10 trim and well clear of both prune windows (03:30 daily, 04:30
  # weekly), so the day's deletions have all completed. Same UTC day as those windows under
  # either DST offset, which matters because the ledger is keyed on the UTC day B2's counters
  # reset on. Reads Loki and the Kubernetes API only — it spends nothing on B2 itself.
  ansible.builtin.cron:
    name: "B2 deletion accounting"
    hour: "{{ k3s_b2_deletion_accounting_cron_hour }}"
    minute: "{{ k3s_b2_deletion_accounting_cron_minute }}"
    user: "{{ sys_user }}"
    # PATH and KUBECONFIG for the reason the infra-map cron sets them: cron inherits neither,
    # and without KUBECONFIG the read-only kubectl falls back to a root-owned k3s.yaml — so the
    # BackupTarget lookup that decides B2-versus-R2 fails only ever when unattended.
    #
    # Piped through `logger` so each run's summary reaches Loki. That is this cron's required
    # evidence: an UNPRICED deletion means transactions were spent that no later run can price,
    # and cron discards both the exit code and stdout. The ledger carries the same fact as a
    # zero line with UNPRICED in its note, so the two surfaces agree.
    #
    # The leading touch is check 10's fire stamp, written whether or not the run then completes.
    # `;`, not `&&`: a stamp that cannot be written must not stop the accounting.
    job: >-
      touch {{ k3s_cron_fired_stamp_dir }}/b2-deletion-accounting;
      cd /home/{{ sys_user }}/server &&
      PATH=/usr/local/bin:/usr/bin:/bin KUBECONFIG=/home/{{ sys_user }}/.kube/config
      /home/{{ sys_user }}/.local/bin/uv run --quiet python
      scripts/diagnostics/probe.py b2-deletions 2>&1 | logger -t b2-deletions
    cron_file: b2-deletion-accounting
  become: true

- name: Schedule the B2 block-tree listing that prices the next day's deletions
  tags: [backup-health]
  when: has_repo_checkout
  # Ten minutes AFTER the accounting pass above, and the order is the whole point. A deletion
  # can only be priced by a listing taken BEFORE it — afterwards the tree is smaller than the
  # one it walked — so today's pass charges against yesterday's listing and this refreshes for
  # tomorrow. Running it first would silently understate every charge.
  #
  # This one does spend B2: one paged listing, measured at 2-3 Class C per run against the
  # 2,500/day cap. It also refreshes the per-shard budget projection as a side effect.
  ansible.builtin.cron:
    name: "B2 backup budget listing"
    hour: "{{ k3s_b2_budget_cron_hour }}"
    minute: "{{ k3s_b2_budget_cron_minute }}"
    user: "{{ sys_user }}"
    job: >-
      cd /home/{{ sys_user }}/server &&
      PATH=/usr/local/bin:/usr/bin:/bin KUBECONFIG=/home/{{ sys_user }}/.kube/config
      /home/{{ sys_user }}/.local/bin/uv run --quiet python
      scripts/diagnostics/probe.py b2-budget
      2>&1 | logger -t b2-budget
    cron_file: b2-budget-listing
  become: true

# The restore drill is a CronJob in the `longhorn-restore-drill` Flux role since H2.3d. Nothing
# removes a cron file or a script the role stops declaring, so these two arms retire the host
# copies. An absent arm names no schedule field, because the schedule key left this role's
# defaults with the drill. The CronJob ships suspended, so deleting the cron here leaves no
# scheduled drill until H2.3e unsuspends it; the arms must be applied, and the cron file seen
# gone, before that flip.
- name: Retire the host Longhorn restore drill cron
  tags: [backup-health]
  ansible.builtin.cron:
    name: "Longhorn restore drill"
    cron_file: longhorn-restore-drill
    user: root
    state: absent
  become: true

- name: Retire the host Longhorn restore drill script
  tags: [backup-health]
  # `/usr/local/bin/longhorn-restore-drill.sh` is a symlink through
  # `/opt/homelab/current/k3s-backup-health`, which release_bin.yml only ever creates. Once
  # `current` swings to a release without the drill, the link dangles, so this arm removes it.
  ansible.builtin.file:
    path: /usr/local/bin/longhorn-restore-drill.sh
    state: absent
  become: true

# node-exporter's textfile collector reads this directory through a hostPath with no `type`, so
# the kubelet created it root 0755 on first start. disk-health.sh runs as {{ sys_user }} and
# writes disk-health.prom here, so the group gets write access; setgid keeps that group on new
# files. The files are written 0644, which node_exporter (uid 65534) reads. The root-run
# claude-cgroup-metrics writer is unaffected. The metric contract a file here follows is in
# docs/target-architecture/monitoring/m3-textfile-timer.md (*The producer metric contract*).
- name: Let the deploy-user health crons write to the node_exporter textfile directory
  tags: [disk-health, backup-health, etcd-snapshot]
  ansible.builtin.file:
    path: /var/lib/node-exporter-textfile
    state: directory
    owner: root
    group: "{{ sys_user }}"
    mode: "2775"
  become: true

- name: Deploy the root-disk headroom heartbeat as a versioned release
  tags: [disk-health]
  ansible.builtin.import_tasks: "{{ role_path }}/../common/tasks/release_bin.yml"
  vars:
    release_bin_group: k3s-disk-health
    release_bin_templates: >-
      {{ (k3s_render_stamp_groups | selectattr('name', 'eq', 'k3s-disk-health')
          | first).templates }}

- name: Schedule the root-disk headroom heartbeat
  tags: [disk-health]
  ansible.builtin.cron:
    name: "daniel-box disk health"
    minute: "{{ k3s_disk_health_cron_minute }}"
    user: "{{ sys_user }}"
    job: "/usr/local/bin/disk-health.sh 2>&1 | logger -t disk-health"
    cron_file: disk-health
  become: true

# The three drift checks are disarmed, and their code stays in the tree until the next deletion.
# Nothing removes a file the role stops declaring, so these arms retire the host copies. Each
# unit stops before the arm that removes the files it runs, and a .prom file goes with its check:
# left behind, it reads as an overdue check to HostCheckOverdue. Flux owns what replaces them, and
# setup-drift-check.sh reads the host-plane stamps that manifest-prune-check also read.
- name: Disarm the manifest-prune drift check
  tags: [manifest-prune]
  ansible.builtin.import_tasks: "{{ role_path }}/../common/tasks/check_timer.yml"
  vars:
    check_timer_state: absent
    check_timer_name: manifest-prune
    check_timer_description: Manifest prune drift check (textfile verdict)
    check_timer_user: root
    check_timer_on_calendar: "*-*-* {{ '%02d' | format(k3s_manifest_prune_cron_hour | int) }}:{{ '%02d' | format(k3s_manifest_prune_cron_minute | int) }}:00"
    check_timer_restart_sec: 30min
    check_timer_cron_name: "Manifest prune drift check"
    check_timer_cron_file: manifest-prune-check

- name: Retire the manifest-prune drift check's host files
  tags: [manifest-prune]
  # Links before the release they point through, so no path dangles.
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /usr/local/bin/manifest-prune-check.sh
    - /usr/local/bin/manifest-declares.py
    - /opt/homelab/current/k3s-manifest-prune
    - /opt/homelab/releases/k3s-manifest-prune
    - /var/lib/homelab/setup-render-manifest.d/k3s-manifest-prune
    - /var/lib/homelab/setup-deployed-manifest.d/k3s-manifest-declares
    - /var/lib/node-exporter-textfile/manifest-prune-check.prom
  become: true

- name: Disarm the release-staleness drift check
  tags: [release-staleness]
  ansible.builtin.cron:
    name: "Release staleness drift check"
    user: "{{ sys_user }}"
    cron_file: release-staleness-check
    state: absent
  become: true

- name: Retire the release-staleness drift check's host files
  tags: [release-staleness]
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /usr/local/bin/release-staleness-check.sh
    - /opt/homelab/current/k3s-release-staleness
    - /opt/homelab/releases/k3s-release-staleness
    - /var/lib/homelab/release-staleness
    - /var/lib/homelab/setup-render-manifest.d/k3s-release-staleness
    - /var/lib/node-exporter-textfile/release-staleness-check.prom
  become: true

- name: Disarm the live-object drift check
  tags: [live-drift]
  ansible.builtin.import_tasks: "{{ role_path }}/../common/tasks/check_timer.yml"
  vars:
    check_timer_state: absent
    check_timer_name: live-drift
    check_timer_description: Live object drift check (textfile verdict)
    check_timer_user: "{{ sys_user }}"
    check_timer_environment:
      - "KUBECONFIG=/home/{{ sys_user }}/.kube/config"
      - "BOOT_GRACE_S={{ k3s_health_cron_boot_grace_s }}"
      - "DEADLINE_S={{ k3s_daily_check_deadline_s }}"
    check_timer_on_calendar: "*-*-* {{ '%02d' | format(k3s_live_drift_cron_hour | int) }}:{{ '%02d' | format(k3s_live_drift_cron_minute | int) }}:00"
    check_timer_restart_sec: 30min
    check_timer_cron_name: "Live object drift check"
    check_timer_cron_file: live-drift-check

# M6 batch B1's Cutover-2 stopped the live-drift check from reading its push token and host, so
# this retires the host copy of the file that held them.
- name: Retire the live-drift check Kuma credentials
  tags: [live-drift]
  ansible.builtin.file:
    path: /etc/rancher/k3s/live-drift-check.env
    state: absent
  become: true

- name: Retire the live-object drift check's host files
  tags: [live-drift]
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /usr/local/bin/live-drift-check.py
    - /opt/homelab/current/k3s-live-drift
    - /opt/homelab/releases/k3s-live-drift
    - /opt/live-drift-check
    - /var/lib/homelab/setup-deployed-manifest.d/k3s-live-drift
    - /var/lib/node-exporter-textfile/live-drift-check.prom
  become: true

- name: Deploy the etcd restore credentials
  tags: [etcd-snapshot]
  # 0600 root:root, not 0640 root:{{ sys_user }} like the Healthchecks key above: these are the
  # R2 write credentials for the bucket that also holds every Longhorn backup, and only root reads
  # them: the restore runbook and the etcd restore drill. k3s's own schedule uploads with the
  # Secret `longhorn-backup` renders, which a restore cannot use because the API may be gone.
  ansible.builtin.copy:
    content: |
      AWS_ACCESS_KEY_ID={{ r2_access_key_id }}
      AWS_SECRET_ACCESS_KEY={{ r2_secret_access_key }}
      ETCD_S3_BUCKET={{ r2_bucket }}
      ETCD_S3_ENDPOINT={{ r2_account_id }}.r2.cloudflarestorage.com
    dest: /etc/rancher/k3s/etcd-s3.env
    mode: "0600"
    owner: root
    group: root
  become: true
  no_log: true  # renders the R2 access key and secret

- name: Deploy the cluster-token drift check as a versioned release
  tags: [etcd-snapshot]
  # Root-run: the token file and the operator's stamp are root-only. The check reads no cluster.
  ansible.builtin.import_tasks: "{{ role_path }}/../common/tasks/release_bin.yml"
  vars:
    release_bin_group: k3s-etcd-snapshot
    release_bin_templates: >-
      {{ (k3s_render_stamp_groups | selectattr('name', 'eq', 'k3s-etcd-snapshot')
          | first).templates }}

- name: Schedule the cluster-token drift check
  tags: [etcd-snapshot]
  # The logger tag keeps the check's name, `etcd-snapshot-offbox`, which the textfile, the
  # Healthchecks.io slug and the rules read.
  ansible.builtin.cron:
    name: "etcd token drift"
    minute: "{{ k3s_etcd_s3_cron_minute }}"
    hour: "{{ k3s_etcd_s3_cron_hour }}"
    user: root
    job: "/usr/local/bin/etcd-token-drift.sh 2>&1 | logger -t etcd-snapshot-offbox"
    cron_file: etcd-token-drift
  become: true

# k3s's native schedule uploads the off-box snapshots since H2.8b. Nothing removes a cron file or a
# script link the role stops declaring, so these two arms retire the host copies. The link runs
# through `/opt/homelab/current/k3s-etcd-snapshot`, whose new release lacks the script.
- name: Retire the off-box etcd snapshot cron
  tags: [etcd-snapshot]
  ansible.builtin.cron:
    name: "Off-box etcd snapshot"
    cron_file: etcd-snapshot-offbox
    user: root
    state: absent
  become: true

- name: Retire the off-box etcd snapshot script link
  tags: [etcd-snapshot]
  ansible.builtin.file:
    path: /usr/local/bin/etcd-snapshot-offbox.sh
    state: absent
  become: true

- name: Schedule the etcd restore drill
  tags: [etcd-snapshot]
  # Run IN PLACE from the primary checkout, not copied to /usr/local/bin — the same shape the
  # gen_infra_map and docs-refresh crons use for scripts under scripts/. Copying it would add a
  # deployed artifact that the drift arm then has to track, to gain nothing: the checkout is what
  # gitops keeps fast-forwarded, so in-place is the copy that is actually current.
  #
  # PATH is load-bearing. Cron inherits neither PATH nor KUBECONFIG, and the drill's preflight is
  # `command -v k3s`, with k3s at /usr/local/bin/k3s — without this the drill dies on a host that
  # has k3s, reporting it as missing.
  #
  # --list-only ONLY. See the k3s_etcd_restore_drill_cron block in defaults/main.yml for why the
  # full restore must not be scheduled; the short version is that it cannot pass on this host and
  # every failure would hold a restored etcd database in /var/tmp for 30 days.
  #
  # Output goes to the journal: the drill's `log()` prints progress lines on every
  # pass. A failure is still seen, because monitor-bridge reads the drill's success stamp.
  ansible.builtin.cron:
    name: "etcd restore drill"
    minute: "{{ k3s_etcd_restore_drill_cron.split()[0] }}"
    hour: "{{ k3s_etcd_restore_drill_cron.split()[1] }}"
    weekday: "{{ k3s_etcd_restore_drill_cron.split()[4] }}"
    user: root
    job: >-
      PATH=/usr/local/bin:/usr/bin:/bin
      /home/{{ sys_user }}/server/scripts/backup/etcd_restore_drill.sh --list-only
      2>&1 | logger -t etcd-restore-drill
    cron_file: etcd-restore-drill
    state: "{{ 'present' if k3s_etcd_restore_drill_armed else 'absent' }}"
  become: true
  # Runs the drill IN PLACE from the checkout (see the comment above), so a host without one
  # gets a cron pointing at nothing. `ansible.builtin.cron` writes the line regardless, so the
  # deploy would read green and the drill would fail weekly where nothing reads its stderr.
  # daniel-stage is a k3s server and does not override `k3s_etcd_restore_drill_armed`, so
  # without this gate the first setup-plane run against it installs exactly that.
  when: has_repo_checkout

# Render provenance, stamped LAST so a run that fails partway through leaves the previous
# checksums in place rather than declaring the scripts it never reached to be current. Each
# group carries only its own tag family, so a tag-scoped run restamps only what it rendered.
#
# DECIDED: the fix for a sub-tag that renders without stamping is to DROP the sub-tag, never to
# add it here. `--tags restore-drill` used to render 1 of this group's 5 templates and stamp
# none, which reads as drift on 1 script — a false RED. Adding `restore-drill` to this task's
# tags restamps all 5, declaring the 4 it never rendered to be current: a false GREEN, and the
# exact defect the 2026-08-23b review's M6 was raised for. A false RED costs an investigation;
# a false GREEN costs the guarantee. Two reviewers proposed the additive fix on 2026-08-24 and
# both were wrong; the sub-tag is gone entirely — the deploy task above is now a single loop over
# all 5 backup-health scripts (including the restore drill), so there is no per-script tag left
# to add one to. Contradict this only with a stamp mechanism that can record a PARTIAL group.
- name: Stamp the backup-plane scripts this host has rendered
  tags: [backup-health]
  ansible.builtin.import_tasks: "{{ role_path }}/../common/tasks/stamp_render.yml"
  vars:
    stamp_render_name: k3s-backup-health
    stamp_render_templates: "{{ (k3s_render_stamp_groups | selectattr('name', 'eq', 'k3s-backup-health') | first).templates }}"

- name: Stamp the disk-health script this host has rendered
  tags: [disk-health]
  ansible.builtin.import_tasks: "{{ role_path }}/../common/tasks/stamp_render.yml"
  vars:
    stamp_render_name: k3s-disk-health
    stamp_render_templates: "{{ (k3s_render_stamp_groups | selectattr('name', 'eq', 'k3s-disk-health') | first).templates }}"

- name: Stamp the etcd-snapshot script this host has rendered
  tags: [etcd-snapshot]
  ansible.builtin.import_tasks: "{{ role_path }}/../common/tasks/stamp_render.yml"
  vars:
    stamp_render_name: k3s-etcd-snapshot
    stamp_render_templates: "{{ (k3s_render_stamp_groups | selectattr('name', 'eq', 'k3s-etcd-snapshot') | first).templates }}"
