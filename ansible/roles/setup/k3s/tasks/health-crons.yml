---
# Host crons that push heartbeats for the backup plane, root-disk headroom and
# manifest drift, plus the shared Healthchecks.io ping key they use.

- name: Create the setup-plane state directory
  tags: [backup-health, disk-health, manifest-prune]
  ansible.builtin.file:
    path: /var/lib/homelab
    state: directory
    mode: "0755"
    owner: root
    group: root
  become: true

# The provenance half of the drift check in manifest-prune-check.sh. That script can compare
# `copy:`-deployed artifacts byte-for-byte, but NOT the `template:`-rendered scripts beside it:
# a rendered file legitimately differs from its .j2, and re-rendering to compare would need
# every role's vars and secrets. So the comparison moves up a level — these tasks stamp the
# SOURCE checksum of each template at render time, and the check re-computes those checksums
# from the repo. Equal means this host has run initial_setup.yml since the templates last
# changed; unequal means it has not, and is still executing the old rendered copy.
#
# THE FAILURE THIS CLOSES: a rendered script falls behind the repo while manifest-prune-check
# pushes "deployed scripts match the repo" — true of the files it compares, false of the ones
# it does not, including itself. roles/setup/ changes are deferred-and-alerted by the gitops
# tick, but that alert clears the moment the tree ff-merges, leaving the stale render with
# nothing watching it.
#
# ONE STAMP PER TAG FAMILY, each carrying that family's tags — see k3s_render_stamp_groups in
# defaults/main.yml for why a single untagged stamp over all eight was worse than none. The
# stamps live at the END of this file, AFTER every template: task, for the second half of the
# same problem: a stamp that ran first would let a run that died partway through declare
# every script current.

- name: Deploy the Kuma push credentials for the heartbeat scripts
  tags: [backup-health, disk-health, manifest-prune, etcd-snapshot, release-staleness]
  # 0640 root:{{ sys_user }}, for the same reason as live-drift-check.env below: the scripts that
  # consume these land 0755, so a token rendered inline is readable by every local account — and
  # a Kuma push token is enough to forge or suppress a heartbeat, which hides a real outage. The
  # root crons (etcd-snapshot, manifest-prune) and the {{ sys_user }} crons (backup/disk health)
  # both read this one file; the group is what lets the latter.
  ansible.builtin.template:
    src: kuma-push.env.j2
    dest: /etc/rancher/k3s/kuma-push.env
    mode: "0640"
    owner: root
    group: "{{ sys_user }}"
  become: true
  no_log: true  # renders five Kuma push tokens

- name: Create the Healthchecks.io credential directory
  tags: [backup-health, disk-health, manifest-prune]
  ansible.builtin.file:
    path: /etc/healthchecks
    state: directory
    mode: "0755"
    owner: root
    group: root
  become: true

- name: Deploy the Healthchecks.io ping key
  tags: [backup-health, disk-health, manifest-prune]
  # NOT inlined into the heartbeat scripts. Those land at 0755 (they must be executable by the
  # {{ sys_user }} crons), so a key inlined there is readable by every local account on this
  # host — and a project ping key is broader than the Kuma push tokens already exposed that
  # way: a Kuma token spoofs one monitor, this one can hold every check in the project green
  # and so suppress the alerts the whole mechanism exists to deliver. 0640 root:{{ sys_user }}
  # covers both callers — manifest-prune-check runs as root (owner), the other two as
  # {{ sys_user }} (group). Same shape as /etc/renovate-notify/config.env.
  ansible.builtin.copy:
    # Single-quoted for the same reason as kuma-push.env and live-drift-check.env: this file is
    # `.`-sourced by root and {{ sys_user }} scripts, so an unquoted value is shell input rather
    # than data.
    content: "HC_PING_KEY='{{ healthchecks_ping_key | default('') }}'\n"
    dest: /etc/healthchecks/ping.env
    mode: "0640"
    owner: root
    group: "{{ sys_user }}"
  become: true
  no_log: true  # renders the Healthchecks.io ping key

# The two Longhorn reapers moved to scripts/backup/ (#2978) and run from the repo checkout, so
# this role no longer installs them. Nothing removes a file the role stops declaring, so these
# tasks retire the host copies. Each one matters on its own:
#   - /opt/longhorn-reap/ held the Python and a host_lib.py sibling.
#   - The k3s-longhorn-reap fragment named those files. Left behind, manifest-prune-check.sh's
#     deployed-code arm reports every one of them as missing.
#   - The /usr/local/bin links pointed through current/k3s-backup-health, and release_bin.yml
#     only ever creates links, so once `current` swings to a release without the shims they dangle.
- name: Retire the host-installed Longhorn reapers
  tags: [backup-health]
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /opt/longhorn-reap
    - /var/lib/homelab/setup-deployed-manifest.d/k3s-longhorn-reap
    - /usr/local/bin/longhorn-reap-orphan-backups.sh
    - /usr/local/bin/longhorn-reap-orphan-snapshots.sh
  become: true

- name: Install the Longhorn backup health reader
  tags: [backup-health]
  # Installed BEFORE the shim below, deliberately: the shim's every-10-minutes cron invokes
  # /opt/longhorn-backup-health/longhorn_backup_health.py by absolute path the moment it lands,
  # so if the shim's release install ran first, a `*/10` cron firing in the window between the
  # two tasks would call a reader that doesn't exist yet (first install) — a spurious page,
  # not a real one.
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ sys_user }}"
    group: "{{ sys_user }}"
    mode: "0755"
  loop:
    - /opt/longhorn-backup-health
    - /opt/longhorn-backup-health/longhorn_lib # the reader's libraries, a namespace package
  become: true

- name: Install the shared host_lib helper beside the backup health reader
  tags: [backup-health]
  # Before the reader, not in the same loop after it. The `*/10` cron invokes the reader by
  # absolute path, so a window in which the reader exists and its sibling import does not is a
  # spurious page — the same hazard the directory task above documents, one file over.
  ansible.builtin.import_tasks: "{{ role_path }}/../common/tasks/install_host_lib.yml"
  vars:
    host_lib_dir: /opt/longhorn-backup-health
    host_lib_owner: "{{ sys_user }}"

- name: Install the Longhorn backup health reader scripts
  tags: [backup-health]
  # Plain `copy:`, not a versioned release like the shell script beside it: these are imported
  # by absolute sys.path, not invoked as their own /usr/local/bin/<name>, so the release
  # mechanism's per-name symlink (common_release_names unions template AND file names) would
  # give each of them a dangling /usr/local/bin entry nothing calls — the same reason the
  # host_lib include above is a copy rather than a release. Same shape as configarr's health
  # reader (roles/k8s/configarr/tasks/main.yml).
  #
  # The libraries come before the reader in the loop for the same cron-window reason: the
  # reader that lands imports them from longhorn_lib/. One file at a time rather than the
  # directory, because a directory copy also ships the controller checkout's __pycache__.
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/opt/longhorn-backup-health/{{ item }}"
    owner: "{{ sys_user }}"
    group: "{{ sys_user }}"
    mode: "0755"
  loop:
    - longhorn_lib/longhorn_backup_health_logic.py
    - longhorn_lib/longhorn_backups.py
    - longhorn_lib/longhorn_cron_evidence_logic.py
    - longhorn_lib/longhorn_restore_drill_stamps.py
    - longhorn_lib/longhorn_skipped_volumes_logic.py
    - longhorn_backup_health.py
  become: true

- name: Remove the reader libraries that moved into longhorn_lib
  tags: [backup-health]
  # Until #4354 these five sat flat beside the reader. A copy loop removes nothing it stops
  # naming, so without this they stay on disk, unread and unwatched by the drift check. After
  # the reader above, which no longer imports them, so no cron fire finds them missing.
  ansible.builtin.file:
    path: "/opt/longhorn-backup-health/{{ item }}"
    state: absent
  loop:
    - longhorn_backup_health_logic.py
    - longhorn_backups.py
    - longhorn_cron_evidence_logic.py
    - longhorn_restore_drill_stamps.py
    - longhorn_skipped_volumes_logic.py
  become: true

# Deployed as a VERSIONED RELEASE rather than rendered straight over /usr/local/bin — see
# roles/setup/common/tasks/release_bin.yml. Each script lands in
# /opt/homelab/releases/k3s-backup-health/<sha>/ and /usr/local/bin/<name> becomes a symlink
# through /opt/homelab/current/k3s-backup-health, so a cron's provenance is readable
# (`probe.py releases` for the k8s plane, `readlink -f` here) and a rollback is one symlink
# swing rather than a git revert plus a redeploy. The crons below are unchanged: they still
# invoke /usr/local/bin/<name>, and setup-drift-lib.sh's `cmp` reads through the symlink.
#
# The file list comes from k3s_render_stamp_groups, the SAME list stamp_render.yml is given
# below. That is deliberate: a release and its stamp describing different sets of files is
# exactly the partial-group false-green the comment above that stamp task warns about, and
# sharing one list makes the two incapable of disagreeing.
#
# The per-script notes live beside that list in
# roles/setup/k3s/defaults/main.yml, next to the paths they describe.
- name: Deploy the backup-health scripts as a versioned release
  tags: [backup-health]
  # Runs AFTER the reader above lands, not before — see that task's comment.
  ansible.builtin.import_tasks: "{{ role_path }}/../common/tasks/release_bin.yml"
  vars:
    release_bin_group: k3s-backup-health
    release_bin_templates: >-
      {{ (k3s_render_stamp_groups | selectattr('name', 'eq', 'k3s-backup-health')
          | first).templates }}

- name: Record the deployed Longhorn backup health reader
  tags: [backup-health]
  # `copy:`-deployed, like live-drift-check.py and manifest-declares.py, so a stale copy of the
  # reader is visible to manifest-prune-check's deployed-code arm rather than invisible to it
  # — the render-stamp arm above only ever sees the shell shim.
  ansible.builtin.import_tasks: "{{ role_path }}/../common/tasks/stamp_deployed.yml"
  vars:
    stamp_deployed_name: k3s-longhorn-backup-health-reader
    stamp_deployed_pairs:
      - live: /opt/longhorn-backup-health/longhorn_backup_health.py
        src: ansible/roles/setup/k3s/files/longhorn_backup_health.py
      - live: /opt/longhorn-backup-health/longhorn_lib/longhorn_backup_health_logic.py
        src: ansible/roles/setup/k3s/files/longhorn_lib/longhorn_backup_health_logic.py
      - live: /opt/longhorn-backup-health/longhorn_lib/longhorn_backups.py
        src: ansible/roles/setup/k3s/files/longhorn_lib/longhorn_backups.py
      - live: /opt/longhorn-backup-health/longhorn_lib/longhorn_cron_evidence_logic.py
        src: ansible/roles/setup/k3s/files/longhorn_lib/longhorn_cron_evidence_logic.py
      - live: /opt/longhorn-backup-health/longhorn_lib/longhorn_restore_drill_stamps.py
        src: ansible/roles/setup/k3s/files/longhorn_lib/longhorn_restore_drill_stamps.py
      - live: /opt/longhorn-backup-health/longhorn_lib/longhorn_skipped_volumes_logic.py
        src: ansible/roles/setup/k3s/files/longhorn_lib/longhorn_skipped_volumes_logic.py
      - live: /opt/longhorn-backup-health/host_lib.py
        src: ansible/roles/setup/common/files/host_lib.py
      - live: /opt/longhorn-backup-health/kuma_push.py
        src: ansible/roles/setup/common/files/kuma_push.py

- name: Schedule the Longhorn backup-plane heartbeat
  tags: [backup-health]
  ansible.builtin.cron:
    name: "Longhorn backup health"
    minute: "{{ k3s_longhorn_backup_health_cron_minute }}"
    user: "{{ sys_user }}"
    job: "/usr/local/bin/longhorn-backup-health.sh"
    cron_file: longhorn-backup-health
  become: true

- name: Create the directory the cron fire stamps live in
  tags: [backup-health]
  # Check 10 of longhorn-backup-health reads these stamps; the defaults entry for
  # k3s_cron_fired_stamp_dir says why the /etc/cron.d stat cannot stand in for them (#3677).
  ansible.builtin.file:
    path: "{{ k3s_cron_fired_stamp_dir }}"
    state: directory
    owner: "{{ sys_user }}"
    group: "{{ sys_user }}"
    mode: "0755"
  become: true

- name: Schedule the Longhorn filesystem-trim sweep
  tags: [backup-health]
  # After BOTH backup windows (03:30 daily, 04:30 weekly) and clear of the 05:15 manifest-prune
  # check, so a trim never contends with a snapshot being taken. Order matters more than the
  # hour: trimming before the day's snapshot would hand back blocks the snapshot then re-pins.
  #
  # `2>&1 | logger -t longhorn-trim-cron` for the journal reason on the secret-rotation cron in
  # `initial_setup/tasks/crons.yml`: without it cron mails one `trim <volume>` or `skip <volume>`
  # line per volume per day into a spool nothing opens.
  #
  # A DIFFERENT TAG FROM THE SCRIPT'S OWN `logger -t longhorn-trim`, deliberately. Check 9 of
  # longhorn-backup-health reads that tag's window and matches `_TRIM_SUMMARY_RE` /
  # `_TRIM_ABORT_RE` as written; pouring the per-volume chatter and the operator NOTE block into
  # the same tag would put unrelated newest-first lines in front of the verdict the check reads
  # backwards for. The verdict keeps its own tag and its own two lines.
  ansible.builtin.cron:
    name: "Longhorn filesystem trim"
    hour: "{{ k3s_longhorn_trim_cron_hour }}"
    minute: "{{ k3s_longhorn_trim_cron_minute }}"
    user: "{{ sys_user }}"
    # Check 10's fire stamp is the script's first act rather than a `touch` on this line: the
    # cron-target resolver in scripts/validate/validate_lib/cron_targets.py accepts only the
    # bare script path here, and a prefix would take the trim out of every cron rule it checks.
    job: "/usr/local/bin/longhorn-trim-volumes.sh 2>&1 | logger -t longhorn-trim-cron"
    cron_file: longhorn-trim
  become: true

- name: Schedule the after-the-fact B2 deletion accounting
  tags: [backup-health]
  when: has_repo_checkout
  # Charges each completed backup deletion to the B2 ledger, from longhorn-manager's own logs.
  # Without this pass the ledger records only the two read-only listing probes, so the one
  # operation it exists to capture writes no line at all: a deletion walks the volume's whole
  # block tree at ~1.28 Class C per stored block, which is what sets the daily cap, and once
  # the tree is gone nothing can price it.
  #
  # After the trim sweep at 06:10 and well clear of both prune windows (03:30 daily, 04:30
  # weekly), so the day's deletions have all completed. Same UTC day as those windows under
  # either DST offset, which matters because the ledger is keyed on the UTC day B2's counters
  # reset on. Reads Loki and the Kubernetes API only — it spends nothing on B2 itself.
  ansible.builtin.cron:
    name: "B2 deletion accounting"
    hour: "{{ k3s_b2_deletion_accounting_cron_hour }}"
    minute: "{{ k3s_b2_deletion_accounting_cron_minute }}"
    user: "{{ sys_user }}"
    # PATH and KUBECONFIG for the reason the infra-map cron sets them: cron inherits neither,
    # and without KUBECONFIG the read-only kubectl falls back to a root-owned k3s.yaml — so the
    # BackupTarget lookup that decides B2-versus-R2 fails only ever when unattended.
    #
    # Piped through `logger` so each run's summary reaches Loki. That is this cron's required
    # evidence: an UNPRICED deletion means transactions were spent that no later run can price,
    # and cron discards both the exit code and stdout. The ledger carries the same fact as a
    # zero line with UNPRICED in its note, so the two surfaces agree.
    #
    # The leading touch is check 10's fire stamp, written whether or not the run then completes.
    # `;`, not `&&`: a stamp that cannot be written must not stop the accounting.
    job: >-
      touch {{ k3s_cron_fired_stamp_dir }}/b2-deletion-accounting;
      cd /home/{{ sys_user }}/server &&
      PATH=/usr/local/bin:/usr/bin:/bin KUBECONFIG=/home/{{ sys_user }}/.kube/config
      /home/{{ sys_user }}/.local/bin/uv run --quiet python
      scripts/diagnostics/probe.py b2-deletions 2>&1 | logger -t b2-deletions
    cron_file: b2-deletion-accounting
  become: true

- name: Schedule the B2 block-tree listing that prices the next day's deletions
  tags: [backup-health]
  when: has_repo_checkout
  # Ten minutes AFTER the accounting pass above, and the order is the whole point. A deletion
  # can only be priced by a listing taken BEFORE it — afterwards the tree is smaller than the
  # one it walked — so today's pass charges against yesterday's listing and this refreshes for
  # tomorrow. Running it first would silently understate every charge.
  #
  # This one does spend B2: one paged listing, measured at 2-3 Class C per run against the
  # 2,500/day cap. It also refreshes the per-shard budget projection as a side effect.
  ansible.builtin.cron:
    name: "B2 backup budget listing"
    hour: "{{ k3s_b2_budget_cron_hour }}"
    minute: "{{ k3s_b2_budget_cron_minute }}"
    user: "{{ sys_user }}"
    job: >-
      cd /home/{{ sys_user }}/server &&
      PATH=/usr/local/bin:/usr/bin:/bin KUBECONFIG=/home/{{ sys_user }}/.kube/config
      /home/{{ sys_user }}/.local/bin/uv run --quiet python
      scripts/diagnostics/probe.py b2-budget --retain {{ k3s_longhorn_weekly_backup_retain }}
      2>&1 | logger -t b2-budget
    cron_file: b2-budget-listing
  become: true

- name: Schedule the Longhorn restore drill
  tags: [backup-health]
  # Runs as ROOT, unlike the heartbeat beside it. The drill creates and deletes Volume/PV/PVC
  # objects and runs a pod; the read-only ServiceAccount the heartbeat uses is Forbidden on all
  # of it. Root's k3s kubectl reads /etc/rancher/k3s/k3s.yaml and has the cluster-admin cert.
  ansible.builtin.cron:
    name: "Longhorn restore drill"
    minute: "{{ k3s_longhorn_restore_drill_cron.split()[0] }}"
    hour: "{{ k3s_longhorn_restore_drill_cron.split()[1] }}"
    day: "{{ k3s_longhorn_restore_drill_cron.split()[2] }}"
    user: root
    job: "/usr/local/bin/longhorn-restore-drill.sh"
    cron_file: longhorn-restore-drill
  become: true

- name: Deploy the root-disk headroom heartbeat as a versioned release
  tags: [disk-health]
  ansible.builtin.import_tasks: "{{ role_path }}/../common/tasks/release_bin.yml"
  vars:
    release_bin_group: k3s-disk-health
    release_bin_templates: >-
      {{ (k3s_render_stamp_groups | selectattr('name', 'eq', 'k3s-disk-health')
          | first).templates }}

- name: Schedule the root-disk headroom heartbeat
  tags: [disk-health]
  ansible.builtin.cron:
    name: "daniel-box disk health"
    minute: "{{ k3s_disk_health_cron_minute }}"
    user: "{{ sys_user }}"
    job: "/usr/local/bin/disk-health.sh"
    cron_file: disk-health
  become: true

- name: Deploy the manifest-prune drift check as a versioned release
  tags: [manifest-prune]
  # Root-owned AND root-run (see the cron task below): /etc/rancher/k3s/manifests/*/ is mode
  # 0700 (k8s/manifests role), so comparing live objects against the staged manifests needs
  # root at the OS level. The kubectl calls inside the script stay scoped to the read-only
  # ServiceAccount kubeconfig regardless, same as the heartbeats above — root here buys
  # filesystem access, not cluster-mutation ability. release_bin.yml owns root by default.
  ansible.builtin.import_tasks: "{{ role_path }}/../common/tasks/release_bin.yml"
  vars:
    release_bin_group: k3s-manifest-prune
    release_bin_templates: >-
      {{ (k3s_render_stamp_groups | selectattr('name', 'eq', 'k3s-manifest-prune')
          | first).templates }}
    # manifest-declares.py rides in the same release as the script that calls it. Splitting
    # them would let the reader and its caller land from different commits, and a reader that
    # disagrees with its caller about what "declared" means is a silent false all-clear.
    release_bin_files: >-
      {{ (k3s_release_file_groups | selectattr('name', 'eq', 'k3s-manifest-prune')
          | first).files }}

- name: Schedule the manifest-prune drift check
  tags: [manifest-prune]
  # A systemd timer (roles/setup/common/tasks/kuma_check_timer.yml): a red
  # verdict reruns every 30 min until it clears rather than sitting on the tile for a day.
  ansible.builtin.import_tasks: "{{ role_path }}/../common/tasks/kuma_check_timer.yml"
  vars:
    kuma_check_state: present
    kuma_check_name: manifest-prune
    kuma_check_description: Manifest prune drift check (Kuma push)
    kuma_check_exec: /usr/local/bin/manifest-prune-check.sh
    kuma_check_user: root
    kuma_check_on_calendar: "*-*-* {{ '%02d' | format(k3s_manifest_prune_cron_hour | int) }}:{{ '%02d' | format(k3s_manifest_prune_cron_minute | int) }}:00"
    kuma_check_restart_sec: 30min
    kuma_check_cron_name: "Manifest prune drift check"
    kuma_check_cron_file: manifest-prune-check

- name: Deploy the release-staleness drift check as a versioned release
  tags: [release-staleness]
  # {{ sys_user }}-owned, unlike manifest-prune-check beside it: this check needs no filesystem
  # access root would buy — it reads the release records under /var/lib/homelab (0755, world
  # readable) and runs `git`/`uv` against the primary checkout, which {{ sys_user }} already
  # owns. Running it as root would leave root-owned objects in that checkout (a fetched ref, a
  # lock file) that {{ sys_user }}'s own git operations — deploy.sh, other Claude sessions —
  # would then trip on.
  ansible.builtin.import_tasks: "{{ role_path }}/../common/tasks/release_bin.yml"
  vars:
    release_bin_group: k3s-release-staleness
    release_bin_owner: "{{ sys_user }}"
    release_bin_templates: >-
      {{ (k3s_render_stamp_groups | selectattr('name', 'eq', 'k3s-release-staleness')
          | first).templates }}

- name: Create the release-staleness check's state directory
  tags: [release-staleness]
  # Holds the stale set the last DOWN pushed, so the check can re-alert when that set changes
  # while the tile stays DOWN. Owned by the cron's own user, and outside the primary
  # checkout: an untracked file there would park the GitOps deployer.
  ansible.builtin.file:
    path: /var/lib/homelab/release-staleness
    state: directory
    mode: "0755"
    owner: "{{ sys_user }}"
    group: "{{ sys_user }}"
  become: true

- name: Schedule the release-staleness drift check
  tags: [release-staleness]
  ansible.builtin.cron:
    name: "Release staleness drift check"
    minute: "{{ k3s_release_staleness_cron_minute }}"
    user: "{{ sys_user }}"
    job: "/usr/local/bin/release-staleness-check.sh"
    cron_file: release-staleness-check
  become: true

- name: Create the live-object drift check's host_lib directory
  tags: [live-drift]
  ansible.builtin.file:
    path: /opt/live-drift-check
    state: directory
    owner: "{{ sys_user }}"
    group: "{{ sys_user }}"
    mode: "0755"
  become: true

- name: Install the shared host_lib helper for the live-object drift check
  tags: [live-drift]
  # A fixed directory the script puts on sys.path itself, not the release directory. The check
  # runs through the /usr/local/bin symlink, so Python puts the resolved per-SHA release
  # directory first on sys.path, and a release_bin file would also get a /usr/local/bin/host_lib.py
  # symlink nothing calls. Installed before the script, so no run sees the import without the file.
  ansible.builtin.import_tasks: "{{ role_path }}/../common/tasks/install_host_lib.yml"
  vars:
    host_lib_dir: /opt/live-drift-check
    host_lib_owner: "{{ sys_user }}"

- name: Deploy the live-object drift check
  tags: [live-drift]
  # Root-owned but NOT root-run, unlike manifest-prune-check.sh beside it. That one needs root
  # to read /etc/rancher/k3s/manifests/*/ at mode 0700; this one reads no files at all — it
  # compares each live object against its own last-applied annotation, which is a plain
  # `kubectl get`. So it runs as {{ sys_user }} with the read-only ServiceAccount kubeconfig
  # and needs no privilege of any kind.
  #
  # The one `release_bin_files` caller: this is copied verbatim, not rendered, and the host name
  # differs from the source name (live_drift_check.py -> live-drift-check.py), which is exactly
  # why that parameter takes {src, name} dicts rather than bare paths.
  ansible.builtin.import_tasks: "{{ role_path }}/../common/tasks/release_bin.yml"
  vars:
    release_bin_group: k3s-live-drift
    release_bin_files: >-
      {{ (k3s_release_file_groups | selectattr('name', 'eq', 'k3s-live-drift')
          | first).files }}

- name: Deploy the live-drift check Kuma credentials
  tags: [live-drift]
  # 0640 root:{{ sys_user }} rather than inlined into the cron entry. /etc/cron.d is 0700
  # root:root on this host, so a token in the cron file would not leak today — but that mode
  # comes from the cron package, not from anything this role asserts, and a credential's
  # protection should not rest on a default nothing here owns. Same split as ping.env for the
  # Healthchecks key.
  ansible.builtin.template:
    src: live-drift-check.env.j2
    dest: /etc/rancher/k3s/live-drift-check.env
    mode: "0640"
    owner: root
    group: "{{ sys_user }}"
  become: true
  no_log: true  # renders the Kuma push token

- name: Schedule the live-object drift check
  tags: [live-drift]
  # KUBECONFIG is set explicitly because systemd supplies neither it nor a useful PATH, as cron
  # did not — without it kubectl talks to no cluster and every kind returns an error, which the
  # check reports as exit 2 rather than as a clean run. The env file carries the push token;
  # EnvironmentFile= exports it the way the cron's `set -a` did.
  #
  # A systemd timer (roles/setup/common/tasks/kuma_check_timer.yml): a red
  # verdict reruns every 30 min until it clears rather than sitting on the tile for a day.
  # BOOT_GRACE_S makes a Persistent catch-up run at boot exit 1 without a push, so the restart
  # carries the real verdict once the cluster is up.
  ansible.builtin.import_tasks: "{{ role_path }}/../common/tasks/kuma_check_timer.yml"
  vars:
    kuma_check_state: present
    kuma_check_name: live-drift
    kuma_check_description: Live object drift check (Kuma push)
    kuma_check_exec: >-
      /usr/local/bin/uv run --no-project --no-python-downloads
      --python {{ host_python_version }} /usr/local/bin/live-drift-check.py
    kuma_check_user: "{{ sys_user }}"
    kuma_check_env_file: /etc/rancher/k3s/live-drift-check.env
    kuma_check_environment:
      - "KUBECONFIG=/home/{{ sys_user }}/.kube/config"
      - "BOOT_GRACE_S={{ k3s_health_cron_boot_grace_s }}"
    kuma_check_on_calendar: "*-*-* {{ '%02d' | format(k3s_live_drift_cron_hour | int) }}:{{ '%02d' | format(k3s_live_drift_cron_minute | int) }}:00"
    kuma_check_restart_sec: 30min
    kuma_check_cron_name: "Live object drift check"
    kuma_check_cron_file: live-drift-check

- name: Deploy the off-box etcd snapshot credentials
  tags: [etcd-snapshot]
  # 0600 root:root, not 0640 root:{{ sys_user }} like the Healthchecks key above: these are the
  # R2 write credentials for the bucket that also holds every Longhorn backup, and the only
  # caller is a root cron. Kept out of the script itself because that lands 0755 — the same
  # reasoning as ping.env, one tier stricter because the blast radius is the backup store.
  ansible.builtin.copy:
    content: |
      AWS_ACCESS_KEY_ID={{ r2_access_key_id }}
      AWS_SECRET_ACCESS_KEY={{ r2_secret_access_key }}
      ETCD_S3_BUCKET={{ r2_bucket }}
      ETCD_S3_ENDPOINT={{ r2_account_id }}.r2.cloudflarestorage.com
    dest: /etc/rancher/k3s/etcd-s3.env
    mode: "0600"
    owner: root
    group: root
  become: true
  no_log: true  # renders the R2 access key and secret

- name: Deploy the off-box etcd snapshot as a versioned release
  tags: [etcd-snapshot]
  # Root-run: `k3s etcd-snapshot save` talks to the local etcd through the server's own data-dir
  # and token. Unlike the heartbeats above it cannot use the read-only ServiceAccount at all —
  # this is a control-plane operation, not a cluster API read.
  #
  # Eligible for a release despite the task above carrying `no_log`: that one renders the R2
  # credentials into a SEPARATE env file, and this script only sources them. What disqualifies a
  # script is a credential in its own rendered bytes, which retention would then keep five copies
  # of — not the presence of a secret anywhere in its role.
  ansible.builtin.import_tasks: "{{ role_path }}/../common/tasks/release_bin.yml"
  vars:
    release_bin_group: k3s-etcd-snapshot
    release_bin_templates: >-
      {{ (k3s_render_stamp_groups | selectattr('name', 'eq', 'k3s-etcd-snapshot')
          | first).templates }}

- name: Schedule the off-box etcd snapshot
  tags: [etcd-snapshot]
  ansible.builtin.cron:
    name: "Off-box etcd snapshot"
    minute: "{{ k3s_etcd_s3_cron_minute }}"
    hour: "{{ k3s_etcd_s3_cron_hour }}"
    user: root
    job: "/usr/local/bin/etcd-snapshot-offbox.sh"
    cron_file: etcd-snapshot-offbox
  become: true

- name: Schedule the etcd restore drill
  tags: [etcd-snapshot]
  # Run IN PLACE from the primary checkout, not copied to /usr/local/bin — the same shape the
  # gen_infra_map and docs-refresh crons use for scripts under scripts/. Copying it would add a
  # deployed artifact that the drift arm then has to track, to gain nothing: the checkout is what
  # gitops keeps fast-forwarded, so in-place is the copy that is actually current.
  #
  # PATH is load-bearing. Cron inherits neither PATH nor KUBECONFIG, and the drill's preflight is
  # `command -v k3s`, with k3s at /usr/local/bin/k3s — without this the drill dies on a host that
  # has k3s, reporting it as missing.
  #
  # --list-only ONLY. See the k3s_etcd_restore_drill_cron block in defaults/main.yml for why the
  # full restore must not be scheduled; the short version is that it cannot pass on this host and
  # every failure would hold a restored etcd database in /var/tmp for 30 days.
  #
  # Output goes to the journal: the drill's `log()` prints progress lines on every
  # pass. A failure is still seen, because monitor-bridge reads the drill's success stamp.
  ansible.builtin.cron:
    name: "etcd restore drill"
    minute: "{{ k3s_etcd_restore_drill_cron.split()[0] }}"
    hour: "{{ k3s_etcd_restore_drill_cron.split()[1] }}"
    weekday: "{{ k3s_etcd_restore_drill_cron.split()[4] }}"
    user: root
    job: >-
      PATH=/usr/local/bin:/usr/bin:/bin
      /home/{{ sys_user }}/server/scripts/backup/etcd_restore_drill.sh --list-only
      2>&1 | logger -t etcd-restore-drill
    cron_file: etcd-restore-drill
    state: "{{ 'present' if k3s_etcd_restore_drill_armed else 'absent' }}"
  become: true
  # Runs the drill IN PLACE from the checkout (see the comment above), so a host without one
  # gets a cron pointing at nothing. `ansible.builtin.cron` writes the line regardless, so the
  # deploy would read green and the drill would fail weekly where nothing reads its stderr.
  # daniel-stage is a k3s server and does not override `k3s_etcd_restore_drill_armed`, so
  # without this gate the first setup-plane run against it installs exactly that.
  when: has_repo_checkout

# Render provenance, stamped LAST so a run that fails partway through leaves the previous
# checksums in place rather than declaring the scripts it never reached to be current. Each
# group carries only its own tag family, so a tag-scoped run restamps only what it rendered.
#
# DECIDED: the fix for a sub-tag that renders without stamping is to DROP the sub-tag, never to
# add it here. `--tags restore-drill` used to render 1 of this group's 5 templates and stamp
# none, which reads as drift on 1 script — a false RED. Adding `restore-drill` to this task's
# tags restamps all 5, declaring the 4 it never rendered to be current: a false GREEN, and the
# exact defect the 2026-08-23b review's M6 was raised for. A false RED costs an investigation;
# a false GREEN costs the guarantee. Two reviewers proposed the additive fix on 2026-08-24 and
# both were wrong; the sub-tag is gone entirely — the deploy task above is now a single loop over
# all 5 backup-health scripts (including the restore drill), so there is no per-script tag left
# to add one to. Contradict this only with a stamp mechanism that can record a PARTIAL group.
- name: Stamp the backup-plane scripts this host has rendered
  tags: [backup-health]
  ansible.builtin.import_tasks: "{{ role_path }}/../common/tasks/stamp_render.yml"
  vars:
    stamp_render_name: k3s-backup-health
    stamp_render_templates: "{{ (k3s_render_stamp_groups | selectattr('name', 'eq', 'k3s-backup-health') | first).templates }}"

# live-drift-check.py is `copy:`-deployed, not rendered, so the stale-script arm structurally
# cannot see it — it belongs to the deployed-code arm, which hardcoded three gitops-deploy paths
# and knew nothing of this one. Tagged with the family that deploys it,
# so a `--tags live-drift` run records exactly what it just installed.
- name: Record the deployed live-drift check
  tags: [live-drift]
  ansible.builtin.import_tasks: "{{ role_path }}/../common/tasks/stamp_deployed.yml"
  vars:
    stamp_deployed_name: k3s-live-drift
    stamp_deployed_pairs:
      - live: /usr/local/bin/live-drift-check.py
        src: ansible/roles/setup/k3s/files/live_drift_check.py
      - live: /opt/live-drift-check/host_lib.py
        src: ansible/roles/setup/common/files/host_lib.py
      - live: /opt/live-drift-check/kuma_push.py
        src: ansible/roles/setup/common/files/kuma_push.py

- name: Stamp the disk-health script this host has rendered
  tags: [disk-health]
  ansible.builtin.import_tasks: "{{ role_path }}/../common/tasks/stamp_render.yml"
  vars:
    stamp_render_name: k3s-disk-health
    stamp_render_templates: "{{ (k3s_render_stamp_groups | selectattr('name', 'eq', 'k3s-disk-health') | first).templates }}"

- name: Record the deployed manifest-declares reader
  tags: [manifest-prune]
  # `copy:`-deployed like live-drift-check.py, so the stale-script arm cannot see it — it
  # belongs to the deployed-code arm, which compares bytes on the host against the repo.
  ansible.builtin.import_tasks: "{{ role_path }}/../common/tasks/stamp_deployed.yml"
  vars:
    stamp_deployed_name: k3s-manifest-declares
    stamp_deployed_pairs:
      - live: /usr/local/bin/manifest-declares.py
        src: ansible/roles/setup/k3s/files/manifest_declares.py

- name: Stamp the manifest-prune script this host has rendered
  tags: [manifest-prune]
  ansible.builtin.import_tasks: "{{ role_path }}/../common/tasks/stamp_render.yml"
  vars:
    stamp_render_name: k3s-manifest-prune
    stamp_render_templates: "{{ (k3s_render_stamp_groups | selectattr('name', 'eq', 'k3s-manifest-prune') | first).templates }}"

- name: Stamp the release-staleness script this host has rendered
  tags: [release-staleness]
  ansible.builtin.import_tasks: "{{ role_path }}/../common/tasks/stamp_render.yml"
  vars:
    stamp_render_name: k3s-release-staleness
    stamp_render_templates: "{{ (k3s_render_stamp_groups | selectattr('name', 'eq', 'k3s-release-staleness') | first).templates }}"

- name: Stamp the etcd-snapshot script this host has rendered
  tags: [etcd-snapshot]
  ansible.builtin.import_tasks: "{{ role_path }}/../common/tasks/stamp_render.yml"
  vars:
    stamp_render_name: k3s-etcd-snapshot
    stamp_render_templates: "{{ (k3s_render_stamp_groups | selectattr('name', 'eq', 'k3s-etcd-snapshot') | first).templates }}"
