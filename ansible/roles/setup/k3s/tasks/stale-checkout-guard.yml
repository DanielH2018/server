---
# The stale-checkout guard: one import of stale-checkout-check.yml per distinct tag set that
# this role's cluster writers carry. The plan is
# docs/target-architecture/host/h1-cluster-config-to-flux.md, H1.1h.
#
# Each import carries exactly the effective tags of the writer tasks its rows name, so a
# `--tags` or `--skip-tags` selection runs an instance exactly when it runs one of those
# writers. A host-only tag such as `node-address` reaches no instance and never reads the API.
# One guard tagged with the union of the writers' tags would be dropped by bring-up step 1's
# `--skip-tags kubeconfig` while the other writers still ran.
#
# A row maps a writer task, by name, to the Flux inventory ids (`<namespace>_<name>_<group>_<kind>`)
# of the objects it writes. Where a writer's target is an object no Kustomization lists
# (a Volume label, a runtime CSI Deployment, the manager-written `longhorn` StorageClass), the
# row names the Flux object that takes the duty over instead, and a comment says which.
#
# Each H1 PR from H1.2 to H1.7b deletes a row in the commit that deletes its task, and deletes
# an instance left with no row. ansible/tests/setup/test_k3s_stale_checkout_map.py fails on a
# row naming a missing task, on an instance whose tags differ from its rows' tasks, and on a
# flagged writer with no row.

- name: Guard the MetalLB writers against a stale checkout
  ansible.builtin.import_tasks: stale-checkout-check.yml
  tags: [metallb]
  vars:
    k3s_stale_checkout_rows:
      - task: Install MetalLB
        ids:
          - metallb-system_speaker_apps_DaemonSet
          - metallb-system_controller_apps_Deployment
      - task: Apply the MetalLB address pool
        ids:
          - metallb-system_homelab-pool_metallb.io_IPAddressPool
          - metallb-system_ingress-pool_metallb.io_IPAddressPool
          - metallb-system_homelab-l2_metallb.io_L2Advertisement

- name: Guard the CoreDNS writers against a stale checkout
  ansible.builtin.import_tasks: stale-checkout-check.yml
  tags: [coredns]
  vars:
    k3s_stale_checkout_rows:
      - task: Point cluster DNS at Pi-hole first
        ids: [kube-system_coredns__ConfigMap]
      - task: Run the CoreDNS image k3s bundles
        ids: [kube-system_coredns_apps_Deployment]

- name: Guard the Longhorn writers against a stale checkout
  ansible.builtin.import_tasks: stale-checkout-check.yml
  tags: [longhorn]
  vars:
    k3s_stale_checkout_rows:
      - task: Install Longhorn
        ids:
          - longhorn-system_longhorn-manager_apps_DaemonSet
          - longhorn-system_longhorn-driver-deployer_apps_Deployment
      - task: Give longhorn-manager a memory request so it leaves BestEffort
        ids: [longhorn-system_longhorn-manager_apps_DaemonSet]
      - task: Apply the Longhorn metrics NetworkPolicy
        ids:
          - longhorn-system_longhorn-manager-allow-metrics-scrape_networking.k8s.io_NetworkPolicy
      # The CSI Deployments exist only at runtime; the longhorn-reconcile CronJob takes the
      # patch over.
      - task: Give the Longhorn CSI sidecars a memory request so they leave BestEffort
        ids: [longhorn-system_longhorn-reconcile_batch_CronJob]
      - task: Set the default Longhorn replica count
        ids: [longhorn-system_default-replica-count_longhorn.io_Setting]
      - task: Set the Longhorn snapshot data-integrity mode
        ids: [longhorn-system_snapshot-data-integrity_longhorn.io_Setting]
      - task: Set the Longhorn snapshot data-integrity cron schedule
        ids: [longhorn-system_snapshot-data-integrity-cronjob_longhorn.io_Setting]
      - task: Let volume engines follow the Longhorn manager version
        ids: [longhorn-system_concurrent-automatic-engine-upgrade-per-node-limit_longhorn.io_Setting]
      - task: Set what Longhorn does with a down node's pods
        ids: [longhorn-system_node-down-pod-deletion-policy_longhorn.io_Setting]
      - task: Keep the StorageClass ConfigMap in step with the rendered class
        ids: [longhorn-system_longhorn-storageclass__ConfigMap]
      # longhorn-manager writes the `longhorn` class from the ConfigMap Flux owns, so the
      # ConfigMap is the object that marks these two as stale.
      - task: Delete the StorageClass while its parameters differ from the rendered class
        ids: [longhorn-system_longhorn-storageclass__ConfigMap]
      - task: Apply the Longhorn StorageClass
        ids: [longhorn-system_longhorn-storageclass__ConfigMap]
      - task: Apply the no-backup Longhorn StorageClass
        ids: [_longhorn-nobackup_storage.k8s.io_StorageClass]
      # Volume CRs are runtime objects; the longhorn-reconcile CronJob takes the label
      # reconcile over, the two weekly-shard tasks included.
      - task: Move excluded volumes into the no-backup recurring-job group
        ids: [longhorn-system_longhorn-reconcile_batch_CronJob]
      - task: Return volumes to the default recurring-job group
        ids: [longhorn-system_longhorn-reconcile_batch_CronJob]
      - task: Move weekly-tier volumes out of the daily group
        ids: [longhorn-system_longhorn-reconcile_batch_CronJob]
      - task: Migrate legacy weekly-backup labels to their weekday shard
        ids: [longhorn-system_longhorn-reconcile_batch_CronJob]
      - task: Return legacy weekly-tier volumes to the default recurring-job group
        ids: [longhorn-system_longhorn-reconcile_batch_CronJob]
      # `raw`: the task's name is a template over its include's loop variable, and the row
      # must render to that name as written.
      - task: "Return de-listed volumes to the default recurring-job group from shard d{% raw %}{{ shard }}{% endraw %}"
        ids: [longhorn-system_longhorn-reconcile_batch_CronJob]
      - task: "Move volumes whose weekday changed out of shard d{% raw %}{{ shard }}{% endraw %}"
        ids: [longhorn-system_longhorn-reconcile_batch_CronJob]

- name: Guard the Longhorn writers that also serve backups against a stale checkout
  ansible.builtin.import_tasks: stale-checkout-check.yml
  tags: [longhorn, longhorn_backup]
  vars:
    k3s_stale_checkout_rows:
      - task: Set the Longhorn backup-store poll interval
        ids: ["longhorn-system_{{ 'b2_target' | longhorn_backup_name }}_longhorn.io_BackupTarget"]
      - task: Allow recurring backups of detached volumes
        ids: [longhorn-system_allow-recurring-job-while-volume-detached_longhorn.io_Setting]
      - task: Set the backup block size for new volumes
        ids: [longhorn-system_default-backup-block-size_longhorn.io_Setting]

# The two instances below cover only tasks/longhorn-backup.yml, which main.yml imports under
# this same `when:`, so an instance runs exactly when its writers do.
- name: Guard the Longhorn backup writers against a stale checkout
  ansible.builtin.import_tasks: stale-checkout-check.yml
  tags: [longhorn_backup]
  when: k3s_manage_backup_targets | bool
  vars:
    k3s_stale_checkout_rows:
      - task: Reconcile the Longhorn backup credential
        ids: [longhorn-system_longhorn-b2__Secret]
      - task: Point Longhorn at the backup target (or enforce the blanked target)
        ids: ["longhorn-system_{{ 'b2_target' | longhorn_backup_name }}_longhorn.io_BackupTarget"]
      - task: Point Longhorn at the backup credential
        ids: ["longhorn-system_{{ 'b2_target' | longhorn_backup_name }}_longhorn.io_BackupTarget"]
      - task: Apply the Longhorn recurring backup job
        ids: [longhorn-system_daily-backup_longhorn.io_RecurringJob]
      # The retired job is in no inventory; the RecurringJob set Flux takes over is.
      - task: Remove the retired flat weekly-backup recurring job
        ids: [longhorn-system_daily-backup_longhorn.io_RecurringJob]

- name: Guard the Longhorn R2 writers against a stale checkout
  ansible.builtin.import_tasks: stale-checkout-check.yml
  tags: [longhorn_backup, longhorn_r2]
  when: k3s_manage_backup_targets | bool
  vars:
    k3s_stale_checkout_rows:
      - task: Reconcile the Longhorn R2 credential
        ids: [longhorn-system_longhorn-r2__Secret]
      - task: Apply the R2 backup target
        ids: ["longhorn-system_{{ 'r2_target' | longhorn_backup_name }}_longhorn.io_BackupTarget"]
      # Volume CRs are runtime objects; the longhorn-reconcile CronJob takes each Volume's
      # `spec.backupTargetName` over from H1.7a.
      - task: Route the selected volumes to R2
        ids: [longhorn-system_longhorn-reconcile_batch_CronJob]
      - task: Return de-listed volumes to the default backup target
        ids: [longhorn-system_longhorn-reconcile_batch_CronJob]
