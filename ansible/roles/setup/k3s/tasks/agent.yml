---
# DECIDED: this stays a task file that refuses, until H7.20a deletes k3s-bringup.yml. The join play
# names it, and an edit to that playbook parks the deployer (H7's *Roles are emptied before
# H7.20a*). A silent end would read as a finished join.
- name: Refuse the join, which bootstrap-host.sh and the host package own
  tags: [k3s_agent]
  ansible.builtin.fail:
    msg: >-
      {{ inventory_hostname }} joins through hosts/bootstrap-host.sh, which installs k3s from
      K3S_URL and K3S_TOKEN, and homelab-{{ inventory_hostname }}, which ships the rest of the
      agent's host half (hosts/components/k3s-agent).
