---
# Phase F (slice-7 §F): join THIS host to the existing cluster as an agent.
# Invoked by the "Join an agent node" play in k3s-bringup.yml, which supplies
# k3s_join_token (read on daniel-box by the preceding play — no delegation here, see the
# playbook's three-play comment). The server-side firewall allows (k3s_agent_node_ips +
# the join-firewall tag) must be deployed on daniel-box first: the agent's registration
# dials 6443 before anything else. Post-join verification is agent_verify.yml, run from
# the server side.
#
# Deliberately NOT here:
#   - the A1 node-DNS drop-in (see below).
#
# The no-Docker assert USED to be listed here as deliberately omitted, on the reasoning
# that "coexistence with the remaining Docker residuals is exactly what §F plans". That
# was true during the drain and expired when it finished: daniel-server's Docker was
# purged on 2026-08-14 and has_docker went false the same day. The omission then cost
# what it was always going to — Docker was reinstalled on 2026-08-19 and ran unnoticed
# for eight days, because the only guard lives in server.yml under tags: [k3s_server] and
# this host is the agent. Contradicting that marker deliberately; the assert is below.
#   - the A1 node-DNS drop-in (checked 2026-08-13): daniel-server does not run
#     systemd-resolved — its static /etc/resolv.conf is `10.0.0.243` (the in-cluster
#     Pi-hole VIP) with a `1.1.1.1` fallback and `timeout:2 attempts:1`, so a cold
#     cluster start falls through to the upstream after 2s, which is the property A1's
#     drop-in exists to guarantee. Pinning upstream-ONLY would break the Docker
#     containers' `.local` resolution (they forward to the host's resolv.conf:
#     promtail's loki push URL, monitor-bridge's check targets). Revisit at the drain.

- name: Refuse to run on an agent host that already runs Docker
  tags: [k3s_agent]
  # Same assert as server.yml, same reason: k3s brings its own containerd and its iptables
  # rules would land on top of Docker's chains. Both node roles need it — a guard on one
  # path is a guard the other host can walk around, which is exactly what happened on
  # 2026-08-19. ENFORCED as a pair by ansible/tests/test_k3s_docker_guard.py.
  ansible.builtin.stat:
    path: /usr/bin/docker
  register: k3s_agent_docker_binary
  become: true

- name: Fail if Docker is installed on the agent
  tags: [k3s_agent]
  ansible.builtin.assert:
    that: not k3s_agent_docker_binary.stat.exists
    fail_msg: >-
      Docker is installed on {{ inventory_hostname }}. This role targets a host with no
      other container runtime; k3s brings its own containerd and its iptables rules would
      land on top of Docker's chains. Run initial_setup.yml --tags docker_install to let
      the teardown purge it, then re-run this.

- name: Allow cluster traffic from the server node
  tags: [k3s_agent]
  community.general.ufw:
    rule: allow
    from_ip: "{{ k3s_server_join_url | urlsplit('hostname') }}"
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
  loop: "{{ k3s_join_agent_ports }}"
  become: true

- name: Install Longhorn prerequisites
  tags: [k3s_agent]
  # Same pair the server flow installs (main.yml). Found missing at the §F replica raise:
  # the join omitted host prep, so daniel-server's Longhorn node sat RequiredPackages:False
  # (nfs-common). open-iscsi is the not-optional one — without it volumes hang in
  # "Attaching" with an error that never names the missing package.
  ansible.builtin.apt:
    name:
      - open-iscsi
      - nfs-common
    state: present
  become: true

- name: Blacklist Longhorn devices from multipathd
  tags: [k3s_agent]
  # Same fix as the server flow (main.yml) — multipathd claims fresh /dev/longhorn
  # devices and mounts fail; found live at the 2026-08-14 drain gate on both nodes.
  ansible.builtin.blockinfile:
    path: /etc/multipath.conf
    create: true
    mode: "0644"
    owner: root
    group: root
    marker: "# {mark} ANSIBLE MANAGED - longhorn multipath blacklist"
    block: |
      blacklist {
          devnode "^sd[a-z0-9]+"
      }
  become: true
  register: k3s_agent_multipath_conf

- name: Restart multipathd after a blacklist change # noqa no-handler
  tags: [k3s_agent]
  ansible.builtin.systemd:
    name: multipathd
    state: restarted
  become: true
  when: k3s_agent_multipath_conf is changed

- name: Download the k3s installer
  tags: [k3s_agent]
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /usr/local/bin/k3s-install.sh
    mode: "0755"
  become: true

- name: Read the installed k3s-agent systemd unit
  tags: [k3s_agent]
  ansible.builtin.slurp:
    src: /etc/systemd/system/k3s-agent.service
  register: k3s_agent_unit
  become: true
  failed_when: false

- name: Read the installed k3s-agent version
  tags: [k3s_agent]
  # See the server install for why the args guard alone cannot see a version bump. The agent
  # needs its own read: it is a separate host, so the server's reading says nothing about it,
  # and an agent left a minor behind its server is the skew k3s does not support.
  ansible.builtin.command:
    cmd: /usr/local/bin/k3s --version
  register: k3s_agent_installed_version
  become: true
  changed_when: false
  failed_when: false
  check_mode: false

- name: Install or reconfigure the k3s agent
  tags: [k3s_agent]
  # Same unit-args-plus-version guard as the server install (see main.yml): detects
  # missing/changed flags, not removed ones. The installer writes K3S_URL/K3S_TOKEN into
  # /etc/systemd/system/k3s-agent.service.env (0600 root), rewrites the unit,
  # daemon-reloads and restarts the agent itself.
  ansible.builtin.command:
    cmd: /usr/local/bin/k3s-install.sh
  environment:
    INSTALL_K3S_EXEC: "{{ k3s_agent_args }}"
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    K3S_URL: "{{ k3s_server_join_url }}"
    K3S_TOKEN: "{{ k3s_join_token }}"
  become: true
  no_log: true  # K3S_TOKEN is a cluster credential
  when: >-
    (k3s_agent_args.split() | reject('equalto', 'agent')
     | difference(k3s_agent_unit.content | default('') | b64decode | replace("'", "") | split())
     | length > 0)
    or (k3s_version not in (k3s_agent_installed_version.stdout | default('')))
  changed_when: true

# ── Registry mirror (2026-08-14, nut→k8s port) ────────────────────────────────────────
# Same template as the server node, but the mirror endpoint resolves to the registry
# Service's pinned ClusterIP instead of a loopback hostPort — this is what lets built
# images (first: nut) run on this node. Written after the install so a change can
# restart the running agent; on a first join the installer's own start reads it too
# late, and the restart below covers that case as well.
#
# The directory first: the agent installer never creates /etc/rancher/k3s (nothing else
# is configured there on an agent), and template does not create parents — hit live at
# the 2026-08-14 cutover.
- name: Create the k3s config directory
  tags: [k3s_agent]
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    mode: "0755"
    owner: root
    group: root
  become: true

- name: Configure containerd's view of the in-cluster registry
  tags: [k3s_agent]
  ansible.builtin.template:
    src: registries.yaml.j2
    dest: /etc/rancher/k3s/registries.yaml
    mode: "0644"
    owner: root
    group: root
  become: true
  register: k3s_agent_registries

# Safe for running pods: k3s restarts its embedded containerd, but the containerd-shims
# keep the containers alive across it (same property the k3s upgrade path relies on).
- name: Restart the agent so containerd re-reads registries.yaml # noqa no-handler
  tags: [k3s_agent]
  ansible.builtin.systemd:
    name: k3s-agent
    state: restarted
  become: true
  when: k3s_agent_registries is changed

# ── VIP kube-proxy bypass — RETIRED 2026-08-14 ────────────────────────────────────────
# Existed for Docker-bridge (forwarded, non-node-source) traffic dialing the MetalLB
# VIPs from this host: kube-proxy programs every VIP on every node, and with ETP Local
# plus no local endpoint that traffic hit a filter-table "no local endpoints" DROP
# (the Phase F join blackout, 2026-08-13). The Docker uninstall removed the last such
# client, and the pins-permanent decision (design.md §10 #6) removed the prospect of
# endpoints ever living here. These absent-state tasks reap the deployed script, unit
# and timer; the iptables rules die with the timer at the next reboot and were removed
# live at retirement.
- name: Remove the retired VIP bypass units and script
  tags: [k3s_agent]
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/vip-kube-bypass.timer
    - /etc/systemd/system/vip-kube-bypass.service
    - /usr/local/bin/vip-kube-bypass.sh
  become: true

- name: Raise the inotify instance limit for pod log tailing
  tags: [node-sysctl, k3s_agent]
  # Same budget math as the server node — kubelet's log watchers plus every root-uid
  # container share the per-uid default of 128.
  ansible.posix.sysctl:
    name: fs.inotify.max_user_instances
    value: "1024"
    state: present
    reload: true
  become: true
