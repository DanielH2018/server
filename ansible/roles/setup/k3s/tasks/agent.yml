---
# Join THIS host to the existing cluster as an agent.
# Invoked by the "Join an agent node" play in k3s-bringup.yml, which supplies
# k3s_join_token (read on daniel-box by the preceding play — no delegation here, see the
# playbook's three-play comment). The server-side firewall allows (k3s_agent_node_ips, in
# daniel-box's package as the k3s-join-* ufw rules) must be live first: the agent's registration
# dials 6443 before anything else. Post-join verification is agent_verify.yml, run from
# the server side.
#
# The agent's same-path files (registries.yaml, the logging drop-in and its logrotate file) are
# daniel-server's host package's since H6.5a (hosts/components/k3s-agent), so a fresh agent
# installs its package before this join.
#
# Deliberately NOT here:
#   - the A1 node-DNS drop-in: daniel-server does not run
#     systemd-resolved — its static /etc/resolv.conf is `10.0.0.243` (the in-cluster
#     Pi-hole VIP) with a `1.1.1.1` fallback and `timeout:2 attempts:1`, so a cold
#     cluster start falls through to the upstream after 2s, which is the property A1's
#     drop-in exists to guarantee.

- name: Read the k3s pin from the system-upgrade role
  tags: [k3s_agent]
  # H6.1b moved `k3s_version`, `k3s_install_script_url` and `k3s_install_script_sha256` to the
  # Flux-owned role that drives the SUC Plans, so a pin change routes to that tag and writes no
  # `manual_plane` line. This install reads the same file, and only on a fresh host (H6.3c).
  ansible.builtin.include_vars:
    file: "{{ playbook_dir }}/roles/k8s/system-upgrade/defaults/main.yml"
  when: has_repo_checkout | bool

- name: Refuse to run on an agent host that already runs Docker
  tags: [k3s_agent]
  # Same assert as server.yml, same reason: k3s brings its own containerd and its iptables
  # rules would land on top of Docker's chains. Both node roles need it — a guard on one
  # path is a guard the other host can walk around, which is exactly what happened on
  # 2026-08-19. ENFORCED as a pair by ansible/tests/setup/test_k3s_host_has_no_docker.py.
  ansible.builtin.stat:
    path: /usr/bin/docker
  register: k3s_agent_docker_binary
  become: true

- name: Fail if Docker is installed on the agent
  tags: [k3s_agent]
  ansible.builtin.assert:
    that: not k3s_agent_docker_binary.stat.exists
    fail_msg: >-
      Docker is installed on {{ inventory_hostname }}. This role targets a host with no
      other container runtime; k3s brings its own containerd and its iptables rules would
      land on top of Docker's chains. Run initial_setup.yml --tags docker_install to let
      the teardown purge it, then re-run this.

# DECIDED: this agent-side mirror is tagged k3s_agent, and daniel-box's package holds the
# server half; change a port on both halves together.
- name: Allow cluster traffic from the server node
  tags: [k3s_agent]
  community.general.ufw:
    rule: allow
    from_ip: "{{ k3s_server_join_url | urlsplit('hostname') }}"
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
  loop: "{{ k3s_join_agent_ports }}"
  become: true

- name: Install Longhorn prerequisites
  tags: [k3s_agent]
  # Same pair the server flow installs (main.yml). Without it the Longhorn node reports
  # RequiredPackages:False (nfs-common). open-iscsi is the not-optional one — without it volumes hang in
  # "Attaching" with an error that never names the missing package.
  ansible.builtin.apt:
    name:
      - open-iscsi
      - nfs-common
    state: present
  become: true

- name: Blacklist Longhorn devices from multipathd
  tags: [k3s_agent]
  # Same fix as the server flow (main.yml) — multipathd claims fresh /dev/longhorn
  # devices and mounts fail.
  ansible.builtin.blockinfile:
    path: /etc/multipath.conf
    create: true
    mode: "0644"
    owner: root
    group: root
    marker: "# {mark} ANSIBLE MANAGED - longhorn multipath blacklist"
    block: |
      blacklist {
          devnode "^sd[a-z0-9]+"
      }
  become: true
  register: k3s_agent_multipath_conf

- name: Restart multipathd after a blacklist change # noqa no-handler
  tags: [k3s_agent]
  ansible.builtin.systemd:
    name: multipathd
    state: restarted
  become: true
  when: k3s_agent_multipath_conf is changed

- name: Download the k3s installer
  tags: [k3s_agent]
  # Same pinned script and checksum as server.yml; the comment there has the reasoning.
  ansible.builtin.get_url:
    url: "{{ k3s_install_script_url }}"
    dest: /usr/local/bin/k3s-install.sh
    mode: "0755"
    checksum: "sha256:{{ k3s_install_script_sha256 }}"
  become: true

- name: Read the packaged registries.yaml
  tags: [k3s_agent]
  ansible.builtin.stat:
    path: /etc/rancher/k3s/registries.yaml
  register: k3s_agent_registries_file
  become: true

- name: Fail if the host package has not installed the agent's files
  tags: [k3s_agent]
  # The installer starts k3s-agent, and an agent started without registries.yaml pulls every
  # in-cluster image over HTTPS and fails, and skips the LAN mirrors. The package ships it
  # with the log drop-in, so this file stands for both.
  ansible.builtin.assert:
    that: k3s_agent_registries_file.stat.exists
    fail_msg: >-
      /etc/rancher/k3s/registries.yaml is missing on {{ inventory_hostname }}. Install the
      homelab-{{ inventory_hostname }} package first: it ships the k3s agent's files
      (hosts/components/k3s-agent).

- name: Read the packaged k3s agent flags
  tags: [k3s_agent]
  ansible.builtin.stat:
    path: /etc/rancher/k3s/config.yaml.d/50-homelab.yaml
  register: k3s_agent_config_file
  become: true

- name: Fail if the host package has not installed the k3s agent flags
  tags: [k3s_agent]
  # The installer passes a bare `agent`, so k3s-agent started without this file would come up
  # with an autodetected node IP and without the kubelet's unsafe-sysctl allowlist.
  ansible.builtin.assert:
    that: k3s_agent_config_file.stat.exists
    fail_msg: >-
      /etc/rancher/k3s/config.yaml.d/50-homelab.yaml is missing on {{ inventory_hostname }}.
      Install the homelab-{{ inventory_hostname }} package first: it ships the k3s agent's
      flags (hosts/components/k3s-agent).

- name: Read the installed k3s-agent binary
  tags: [k3s_agent]
  # SUC owns the agent's version since H6.3d, so this read only tells a missing binary from a
  # present one. The agent needs its own read: it is a separate host, so the server's reading
  # says nothing about it. `check_mode: false` because a skipped command leaves this register
  # undefined and the guard consuming it is what breaks, not the read.
  ansible.builtin.command:
    cmd: /usr/local/bin/k3s --version
  register: k3s_agent_installed_version
  become: true
  changed_when: false
  failed_when: false
  check_mode: false

- name: Install the k3s agent
  tags: [k3s_agent]
  # Runs only when the binary is missing. SUC's k3s-agent Plan is the only writer of the agent's
  # version (H6.3d), and the package is the only writer of its flags (H6.5b), so a joined agent
  # has nothing left for the installer to do. `agent` alone: the package's 50-homelab.conf
  # replaces the ExecStart the installer writes. The installer writes K3S_URL/K3S_TOKEN into
  # /etc/systemd/system/k3s-agent.service.env (0600 root), and nothing rewrites that file on a
  # joined agent, so a server-token rotation needs the operator to update it by hand.
  ansible.builtin.command:
    cmd: /usr/local/bin/k3s-install.sh
  environment:
    INSTALL_K3S_EXEC: agent
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    K3S_URL: "{{ k3s_server_join_url }}"
    K3S_TOKEN: "{{ k3s_join_token }}"
  become: true
  no_log: true  # K3S_TOKEN is a cluster credential
  when: (k3s_agent_installed_version.rc | default(1)) != 0
  changed_when: true

# ── Reap the retired VIP kube-proxy bypass ────────────────────────────────────────────
# These absent-state tasks remove the bypass's deployed script, unit and timer from hosts
# that still carry them.
- name: Remove the retired VIP bypass units and script
  tags: [k3s_agent]
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/vip-kube-bypass.timer
    - /etc/systemd/system/vip-kube-bypass.service
    - /usr/local/bin/vip-kube-bypass.sh
  become: true

- name: Raise the inotify instance limit for pod log tailing
  tags: [node-sysctl, k3s_agent]
  # Same budget math as the server node — kubelet's log watchers plus every root-uid
  # container share the per-uid default of 128.
  ansible.posix.sysctl:
    name: fs.inotify.max_user_instances
    value: "1024"
    state: present
    reload: true
  become: true
  when: inventory_hostname not in k3s_packaged_hosts['inotify']
