---
# Longhorn install, StorageClasses, and the recurring-job group reconciliation
# that moves a bound volume between the daily / weekly / no-backup tiers.

- name: Stage the Longhorn metrics NetworkPolicy
  tags: [longhorn]
  # Must follow the install: the upstream manifest ships the policies this one reopens a hole
  # in, and applying ours first would be a no-op that the install then fences off again.
  ansible.builtin.copy:
    src: longhorn-metrics-networkpolicy.yaml
    dest: /etc/rancher/k3s/longhorn-metrics-networkpolicy.yaml
    mode: "0644"
    owner: root
    group: root
  become: true

- name: Apply the Longhorn metrics NetworkPolicy
  tags: [longhorn]
  ansible.builtin.command:
    cmd: k3s kubectl apply -f /etc/rancher/k3s/longhorn-metrics-networkpolicy.yaml
  register: k3s_longhorn_netpol_apply
  become: true
  changed_when: >-
    'created' in k3s_longhorn_netpol_apply.stdout
    or 'configured' in k3s_longhorn_netpol_apply.stdout

- name: Wait for the Longhorn driver deployer
  tags: [longhorn]
  ansible.builtin.command:
    cmd: k3s kubectl -n longhorn-system rollout status deploy/longhorn-driver-deployer --timeout=600s
  become: true
  changed_when: false

- name: Give the Longhorn CSI sidecars a memory request so they leave BestEffort
  tags: [longhorn]
  # Same fix as longhorn-manager above, for the four csi-* Deployments — csi-attacher,
  # csi-provisioner, csi-resizer, csi-snapshotter — which upstream also ships at resources: {}.
  # Measured under memory pressure: those four restarted 13/14/-/7 times while the
  # Burstable instance-manager restarted zero. Unlike longhorn-manager, none of the four is IN
  # deploy/longhorn.yaml — longhorn-driver-deployer creates them at runtime once it starts,
  # the same asynchronous-appearance race `k3s_join_longhorn_sched` rides out above with
  # `until: rc == 0` — so this MUST run after "Wait for the Longhorn driver deployer", never
  # between "Install Longhorn" and that wait, or it 404s on a fresh bring-up. Each Deployment's
  # single container shares its Deployment's name.
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n longhorn-system patch deployment {{ item }} --type=strategic
      -p {{ sidecar_patch | quote }}
  vars:
    sidecar_patch: >-
      {"spec":{"template":{"spec":{"containers":[{"name":"{{ item }}",
      "resources":{"requests":{"memory":"{{ k3s_longhorn_csi_sidecar_memory_request }}"}}}]}}}}
  loop:
    - csi-attacher
    - csi-provisioner
    - csi-resizer
    - csi-snapshotter
  register: k3s_longhorn_csi_resources
  become: true
  changed_when: "'no change' not in k3s_longhorn_csi_resources.stdout"
  retries: 12
  delay: 10
  until: k3s_longhorn_csi_resources.rc == 0
  # Skipped under `--check`, not opted out of it. This task PATCHES four Deployments, so
  # `check_mode: false` would have a dry run write to the cluster — the one thing `--check`
  # promises it will not do. Left unguarded it fails instead: check mode skips `command`, the
  # skip result carries no `rc`, and the `until` above then burns all 12 retries.
  when: not ansible_check_mode

- name: Set the default Longhorn replica count
  tags: [longhorn]
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n longhorn-system patch settings.longhorn.io default-replica-count
      --type=merge -p {{ replica_patch | quote }}
  vars:
    replica_patch: '{"value":"{{ k3s_longhorn_replica_count }}"}'
  register: k3s_longhorn_replicas
  become: true
  changed_when: "'no change' not in k3s_longhorn_replicas.stdout"

- name: Set the Longhorn snapshot data-integrity mode
  tags: [longhorn]
  # `snapshot-data-integrity` is DataEngineSpecific, so its `value` is a JSON MAP SERIALISED AS
  # A STRING (`{"v1":"enabled","v2":"enabled"}`), not the bare string every other setting patched
  # in this file takes. A patch copying the shape of the five above stores the wrong thing and
  # Longhorn ignores it. The double `to_json` builds that shape without hand-escaping: the first
  # renders the map, the second quotes it as a JSON string. ENFORCED by
  # ansible/tests/longhorn/test_snapshot_data_integrity_patch_is_a_json_map.py.
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n longhorn-system patch settings.longhorn.io snapshot-data-integrity
      --type=merge -p {{ integrity_patch | quote }}
  vars:
    integrity_mode: "{{ k3s_longhorn_snapshot_data_integrity }}"
    integrity_patch: >-
      {"value":{{ {"v1": integrity_mode, "v2": integrity_mode} | to_json | to_json }}}
  register: k3s_longhorn_integrity
  become: true
  changed_when: "'no change' not in k3s_longhorn_integrity.stdout"

- name: Set the Longhorn snapshot data-integrity cron schedule
  tags: [longhorn]
  # DataEngineSpecific like the mode above, so the same double-`to_json` map shape applies and
  # the same guard test pins it. Overriding the variable at apply time is how a check is fired
  # early (defaults/main.yml shows the form); Longhorn has no run-now for it.
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n longhorn-system patch settings.longhorn.io snapshot-data-integrity-cronjob
      --type=merge -p {{ integrity_cron_patch | quote }}
  vars:
    integrity_cron: "{{ k3s_longhorn_snapshot_data_integrity_cronjob }}"
    integrity_cron_patch: >-
      {"value":{{ {"v1": integrity_cron, "v2": integrity_cron} | to_json | to_json }}}
  register: k3s_longhorn_integrity_cron
  become: true
  changed_when: "'no change' not in k3s_longhorn_integrity_cron.stdout"

- name: Set the Longhorn backup-store poll interval
  tags: [longhorn, longhorn_backup]
  # Rate-limits the only recurring B2 caller in the cluster. See the variable's comment in
  # defaults/main.yml — at upstream's 300s this exhausts Backblaze's Class C transaction
  # allowance and takes every backup tier down.
  #
  # Lives on the BackupTarget CR, not in settings: v1.8.0 moved backup-target config out of
  # the global settings and onto backuptargets.longhorn.io as part of supporting more than
  # one target. The `backupstore-poll-interval` setting no longer exists, and patching it
  # fails NotFound. The CR takes a duration string, where the setting took bare seconds.
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n longhorn-system patch backuptargets.longhorn.io
      {{ 'b2_target' | longhorn_backup_name }}
      --type=merge -p {{ poll_patch | quote }}
  vars:
    poll_patch: '{"spec":{"pollInterval":"{{ k3s_longhorn_backupstore_poll_interval }}s"}}'
  register: k3s_longhorn_poll_interval
  become: true
  changed_when: "'no change' not in k3s_longhorn_poll_interval.stdout"

- name: Allow recurring backups of detached volumes
  tags: [longhorn, longhorn_backup]
  # Without this the nightly silently skips any volume that happens to be detached at
  # 03:30 — which pi-peer-backup-data always is. See the variable's comment in
  # defaults/main.yml.
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n longhorn-system patch settings.longhorn.io allow-recurring-job-while-volume-detached
      --type=merge -p {{ detached_patch | quote }}
  vars:
    detached_patch: '{"value":"{{ k3s_longhorn_backup_detached_volumes }}"}'
  register: k3s_longhorn_detached_backup
  become: true
  changed_when: "'no change' not in k3s_longhorn_detached_backup.stdout"

- name: Set the backup block size for new volumes
  tags: [longhorn, longhorn_backup]
  # Cuts prune, backup AND restore cost by the same factor — every one of them is priced per
  # block. See the variable's comment in defaults/main.yml for the numbers.
  #
  # Applies to volumes created AFTER this runs; the field is immutable per volume, so this
  # patch never touches anything that already exists and cannot be a migration risk. It is
  # also why leaving it alone is not free: each PVC created meanwhile is locked at the old size.
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n longhorn-system patch settings.longhorn.io default-backup-block-size
      --type=merge -p {{ block_size_patch | quote }}
  vars:
    block_size_patch: '{"value":"{{ k3s_longhorn_backup_block_size }}"}'
  register: k3s_longhorn_block_size
  become: true
  changed_when: "'no change' not in k3s_longhorn_block_size.stdout"

- name: Let volume engines follow the Longhorn manager version
  tags: [longhorn]
  # Upstream's 0 means engines never follow a manager upgrade, so a version bump leaves every
  # volume on the old engine image. See the variable's comment in defaults/main.yml.
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n longhorn-system patch settings.longhorn.io concurrent-automatic-engine-upgrade-per-node-limit
      --type=merge -p {{ engine_upgrade_patch | quote }}
  vars:
    engine_upgrade_patch: '{"value":"{{ k3s_longhorn_concurrent_engine_upgrade }}"}'
  register: k3s_longhorn_engine_upgrade
  become: true
  changed_when: "'no change' not in k3s_longhorn_engine_upgrade.stdout"

- name: Set what Longhorn does with a down node's pods
  tags: [longhorn]
  # Pins upstream's default so the decision lives in the repo rather than in an unset value.
  # See the variable's DECIDED comment in defaults/main.yml.
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n longhorn-system patch settings.longhorn.io node-down-pod-deletion-policy
      --type=merge -p {{ node_down_patch | quote }}
  vars:
    node_down_patch: '{"value":"{{ k3s_longhorn_node_down_pod_deletion_policy }}"}'
  register: k3s_longhorn_node_down
  become: true
  changed_when: "'no change' not in k3s_longhorn_node_down.stdout"

- name: Render the no-backup Longhorn StorageClass
  tags: [longhorn]
  # Opt-in class for bulky, high-churn or sensitive state that must stay out of B2. It has
  # to be a StorageClass rather than a PVC label: Longhorn reads recurring-job labels off its
  # own Volume CRs, and PVC labels do not reach them. Reasoning in the file header.
  ansible.builtin.copy:
    src: longhorn-storageclass-nobackup.yaml
    dest: /etc/rancher/k3s/longhorn-storageclass-nobackup.yaml
    mode: "0644"
    owner: root
    group: root
  become: true

- name: Apply the no-backup Longhorn StorageClass
  tags: [longhorn]
  ansible.builtin.command:
    cmd: k3s kubectl apply -f /etc/rancher/k3s/longhorn-storageclass-nobackup.yaml
  register: k3s_longhorn_nobackup_sc_apply
  become: true
  changed_when: >-
    'created' in k3s_longhorn_nobackup_sc_apply.stdout
    or 'configured' in k3s_longhorn_nobackup_sc_apply.stdout

# The StorageClass above only decides a volume's recurring-job group at PROVISION time, and a
# PVC's storageClassName is immutable — so a volume that must LEAVE the backup set after it is
# bound cannot be moved by editing either one. Longhorn reads the group off its own Volume CR
# label, and that label is mutable, so this reconciles it. Declarative rather than a one-off
# `kubectl label`, because the alternative is a live cluster that silently disagrees with the repo
# about what is backed up.
- name: Find backed-up Longhorn volumes that should be excluded
  tags: [longhorn]
  # argv, not cmd: the jsonpath contains spaces, and a folded `cmd` scalar collapses the newlines
  # into them — command's shell-like split then tears `{range .items[*]}` into two arguments.
  ansible.builtin.command:
    argv:
      - k3s
      - kubectl
      - -n
      - longhorn-system
      - get
      - volumes.longhorn.io
      - -l
      - "{{ 'default' | backup_group_label }}=enabled"
      - -o
      - 'jsonpath={range .items[*]}{.metadata.name}{" "}{.status.kubernetesStatus.namespace}/{.status.kubernetesStatus.pvcName}{"\n"}{end}'
  become: true
  changed_when: false
  register: k3s_longhorn_backed_up
  # A read of state that exists independently of this play, and the label tasks below
  # loop its `stdout_lines`. Without this `--check` skips it and they error on the
  # attribute instead of skipping.
  check_mode: false

# Naturally idempotent: a volume that has already moved no longer carries the `default` label, so
# it does not come back from the query above and this loop has nothing to do on a second run.
- name: Move excluded volumes into the no-backup recurring-job group
  tags: [longhorn]
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n longhorn-system label volumes.longhorn.io {{ item.split(' ')[0] }}
      {{ 'no-backup' | backup_group_label }}=enabled
      {{ 'default' | backup_group_label }}- --overwrite
  loop: "{{ k3s_longhorn_backed_up.stdout_lines }}"
  when: item.split(' ')[1] in k3s_longhorn_nobackup_volumes
  become: true
  changed_when: true

# The move above is one-way on its own: the query feeding it selects on `default=enabled`, so a
# volume that has already left never comes back from it and nothing returns it. Without a reverse
# the list would be a trapdoor rather than a declaration. These two tasks are the other
# direction, so removing a name from the list restores scheduled protection.
#
# The reverse CANNOT be "anything labelled no-backup and absent from the list" — most of the
# no-backup volumes (prometheus-data, loki-data, registry-data, tempo-data, karakeep-meili, …) were
# never in it. They are excluded by their StorageClass at creation, and sweeping them into the
# backup set is precisely the transaction blowup this file exists to prevent. So the intent is read
# from the class: `longhorn` asks for backups, `longhorn-nobackup` does not, and the list overrides
# the class for volumes bound before the distinction existed.
- name: Find PVCs whose StorageClass asks for backups
  tags: [longhorn]
  ansible.builtin.command:
    argv:
      - k3s
      - kubectl
      - get
      - pvc
      - --all-namespaces
      - -o
      - 'jsonpath={range .items[?(@.spec.storageClassName=="longhorn")]}{.metadata.namespace}/{.metadata.name}{"\n"}{end}'
  become: true
  changed_when: false
  register: k3s_longhorn_backup_class_pvcs
  # A read of state that exists independently of this play, and the label tasks below
  # loop its `stdout_lines`. Without this `--check` skips it and they error on the
  # attribute instead of skipping.
  check_mode: false

- name: Find excluded Longhorn volumes that should be backed up again
  tags: [longhorn]
  ansible.builtin.command:
    argv:
      - k3s
      - kubectl
      - -n
      - longhorn-system
      - get
      - volumes.longhorn.io
      - -l
      - "{{ 'no-backup' | backup_group_label }}=enabled"
      - -o
      - 'jsonpath={range .items[*]}{.metadata.name}{" "}{.status.kubernetesStatus.namespace}/{.status.kubernetesStatus.pvcName}{"\n"}{end}'
  become: true
  changed_when: false
  register: k3s_longhorn_excluded
  # A read of state that exists independently of this play, and the label tasks below
  # loop its `stdout_lines`. Without this `--check` skips it and they error on the
  # attribute instead of skipping.
  check_mode: false

# Idempotent for the same reason as its mirror: a volume that has moved back no longer carries the
# `no-backup` label, so the query above stops returning it.
- name: Return volumes to the default recurring-job group
  tags: [longhorn]
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n longhorn-system label volumes.longhorn.io {{ item.split(' ')[0] }}
      {{ 'default' | backup_group_label }}=enabled
      {{ 'no-backup' | backup_group_label }}- --overwrite
  loop: "{{ k3s_longhorn_excluded.stdout_lines }}"
  when:
    - item.split(' ')[1] in k3s_longhorn_backup_class_pvcs.stdout_lines
    - item.split(' ')[1] not in k3s_longhorn_nobackup_volumes
    - item.split(' ')[1] not in k3s_longhorn_weekly_volumes
  become: true
  changed_when: true

# ── weekly tier (mirrors the no-backup pair above, same idempotence argument) ────────────
# Sharded across weekdays: a volume's group is weekly-backup-d<N>, where N is the shard its
# containers_list entry declares in weekly_backup_claims (0=Sunday). NB a weekly→no-backup
# move routes THROUGH default (the shard reconcile returns it to default, the no-backup pair above claims
# it on the NEXT run) — converges on the second deploy.
- name: Move weekly-tier volumes out of the daily group
  tags: [longhorn]
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n longhorn-system label volumes.longhorn.io {{ item.split(' ')[0] }}
      {{ item.split(' ')[1] | weekly_backup_shard(k3s_longhorn_weekly_volumes) | weekly_backup_group | backup_group_label }}=enabled
      {{ 'default' | backup_group_label }}- --overwrite
  loop: "{{ k3s_longhorn_backed_up.stdout_lines }}"
  when: item.split(' ')[1] in k3s_longhorn_weekly_volumes
  become: true
  changed_when: true

# Pre-shard volumes carry the retired flat `weekly-backup` label, which no RecurringJob selects
# any more — a volume stuck with it is silently unprotected, so this sweep stays permanently as
# the guard against hand-applied legacy labels, not just as one-time migration.
- name: Find volumes still carrying the legacy weekly-backup label
  tags: [longhorn]
  ansible.builtin.command:
    argv:
      - k3s
      - kubectl
      - -n
      - longhorn-system
      - get
      - volumes.longhorn.io
      - -l
      - "{{ 'weekly-backup' | backup_group_label }}=enabled"
      - -o
      - 'jsonpath={range .items[*]}{.metadata.name}{" "}{.status.kubernetesStatus.namespace}/{.status.kubernetesStatus.pvcName}{"\n"}{end}'
  become: true
  changed_when: false
  register: k3s_longhorn_weekly_labelled
  # A read of state that exists independently of this play, and the label tasks below
  # loop its `stdout_lines`. Without this `--check` skips it and they error on the
  # attribute instead of skipping.
  check_mode: false

- name: Migrate legacy weekly-backup labels to their weekday shard
  tags: [longhorn]
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n longhorn-system label volumes.longhorn.io {{ item.split(' ')[0] }}
      {{ item.split(' ')[1] | weekly_backup_shard(k3s_longhorn_weekly_volumes) | weekly_backup_group | backup_group_label }}=enabled
      {{ 'weekly-backup' | backup_group_label }}- --overwrite
  loop: "{{ k3s_longhorn_weekly_labelled.stdout_lines }}"
  when: item.split(' ')[1] in k3s_longhorn_weekly_volumes
  become: true
  changed_when: true

- name: Return legacy weekly-tier volumes to the default recurring-job group
  tags: [longhorn]
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n longhorn-system label volumes.longhorn.io {{ item.split(' ')[0] }}
      {{ 'default' | backup_group_label }}=enabled
      {{ 'weekly-backup' | backup_group_label }}- --overwrite
  loop: "{{ k3s_longhorn_weekly_labelled.stdout_lines }}"
  when: item.split(' ')[1] not in k3s_longhorn_weekly_volumes
  become: true
  changed_when: true

# Per-shard membership: returns de-listed volumes to default and moves volumes whose weekday
# changed (an edited shard) to their current shard. Dynamic include, so the tags must be applied
# to the included tasks explicitly — the include's own tag only gates the include itself.
- name: Reconcile each weekly shard's membership
  tags: [longhorn]
  ansible.builtin.include_tasks:
    file: longhorn-weekly-shard.yml
    apply:
      tags: [longhorn]
  loop: "{{ range(0, 7) | list }}"
  loop_control:
    loop_var: shard
