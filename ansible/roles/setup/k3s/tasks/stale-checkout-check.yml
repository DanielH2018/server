---
# The stale-checkout guard's bounded read and its assert. The plan is
# docs/target-architecture/host/h1-cluster-config-to-flux.md, H1.1h.
#
# No tags of its own, on purpose: stale-checkout-guard.yml imports this file once per tag set
# that its writer tasks carry, and each import gives it that set and the rows in
# `k3s_stale_checkout_rows`. A selection therefore runs an instance exactly when it runs one of
# the writers the instance covers.
#
# It fails when an object id a row names appears in the `status.inventory` of a Kustomization
# in flux-system. The checkout then still holds a task that would write an object Flux owns.
# It passes on two named absences only, because each means nothing Flux-owned exists: no k3s
# binary (a fresh host under `--check`, or a narrowed apply that skipped `k3s_server`), and an
# API that has no Kustomization resource type (Flux is not installed). Any other read error
# that outlasts the bounded retry fails the play rather than reading as "nothing owned".

- name: Find the k3s binary the stale-checkout guard reads the API with
  ansible.builtin.stat:
    path: "{{ k3s_stale_checkout_binary }}"
  register: k3s_stale_checkout_bin

- name: Read the Flux inventory, or stop when the API never answers
  when: k3s_stale_checkout_bin.stat.exists
  vars:
    # kubectl's answer for a resource type the API does not serve.
    k3s_stale_checkout_no_flux: "the server doesn't have a resource type"
  block:
    # `check_mode: false`: a read of state this play did not create, so `--check` reaches it
    # and a dry run of a stale checkout fails the same way a real run does.
    - name: Read the inventory of every Flux Kustomization
      ansible.builtin.command:
        argv:
          - "{{ k3s_stale_checkout_binary }}"
          - kubectl
          - -n
          - flux-system
          - get
          - kustomizations.kustomize.toolkit.fluxcd.io
          - -o
          - json
      register: k3s_stale_checkout_read
      become: true
      check_mode: false
      changed_when: false
      failed_when:
        - k3s_stale_checkout_read.rc != 0
        - k3s_stale_checkout_no_flux not in k3s_stale_checkout_read.stderr
      retries: "{{ k3s_stale_checkout_retries }}"
      delay: "{{ k3s_stale_checkout_delay }}"
      until: >-
        k3s_stale_checkout_read.rc == 0
        or k3s_stale_checkout_no_flux in k3s_stale_checkout_read.stderr
  # An exhausted `until` fails the task whatever `failed_when` says, so the named message
  # lives in a rescue rather than in a later assert that would never run.
  rescue:
    - name: Stop when the k3s API never answered the inventory read
      ansible.builtin.fail:
        msg: >-
          The stale-checkout guard could not read the Flux Kustomizations: the k3s API is
          unreachable or refused the read in {{ k3s_stale_checkout_retries | int + 1 }} tries, so
          the guard cannot tell whether this checkout is stale. Last error:
          {{ ansible_failed_result.stderr | default(ansible_failed_result.msg | default('')) }}

- name: Refuse a checkout that would write an object Flux owns
  ansible.builtin.fail:
    msg: >-
      This checkout is older than the commit that handed these objects to Flux, and it still
      holds the tasks that would write them: {{ k3s_stale_checkout_hits | default('', true) | trim }}
      Run the play from a checkout at or after the commit `prod` names.
  vars:
    # One line per (row, inventory entry) match. A loop that emits nothing renders as None,
    # not as an empty string, hence `default('', true)` wherever it is read.
    k3s_stale_checkout_hits: >-
      {%- for kustomization in (k3s_stale_checkout_read.stdout | from_json)['items'] -%}
      {%- for entry in ((kustomization.status | default({})).inventory | default({})).entries | default([]) -%}
      {%- for row in k3s_stale_checkout_rows if entry.id in row.ids -%}
      task '{{ row.task }}' writes {{ entry.id }}, which Kustomization
      {{ kustomization.metadata.name }} owns.
      {% endfor -%}
      {%- endfor -%}
      {%- endfor -%}
  when:
    - k3s_stale_checkout_bin.stat.exists
    - k3s_stale_checkout_read.rc == 0
    - k3s_stale_checkout_hits | default('', true) | trim | length > 0
