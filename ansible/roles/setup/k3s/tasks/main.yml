---
# The k3s server's host half is daniel-box's package (hosts/components/k3s-server), and
# docs/host-packages.md's *Rebuilding daniel-box* holds the install and its post-start checks
# (H7.44). docs/target-architecture/host/h7-delete-ansible.md.

# DECIDED: this role is emptied, never deleted, until H7.20a. A play that names a missing role
# fails to parse, so deleting the role would mean editing k3s-bringup.yml, which is in the
# deployer's _BROAD_MANUAL_PREFIXES and parks every session's landing.
- name: End the role, whose work the host package owns
  ansible.builtin.meta: end_role
