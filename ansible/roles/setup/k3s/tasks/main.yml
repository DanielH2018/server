---
# Originally slice 0 of the k3s migration — see docs/k3s-migration/slice-0-cluster-foundation.md.
# This role installs the k3s SERVER (control plane) on daniel-box. daniel-server joined as an
# agent in slice 7 (2026-08-14) via tasks/agent.yml, once its Docker workload had drained: k3s
# ships its own containerd and flannel/kube-proxy iptables rules, and landing those alongside
# Docker's DOCKER-USER chain and the wg-easy hairpin NAT was the risk the ordering avoided.
#
# Split into per-topic task files on 2026-08-15 (main.yml had reached 1058 lines).
# These are import_tasks, not include_tasks: imports are static, so every task keeps
# its own tags and --tags selection is unchanged.

- name: Install the k3s server
  ansible.builtin.import_tasks: server.yml
- name: Install MetalLB and the PriorityClasses
  ansible.builtin.import_tasks: cluster-addons.yml
- name: Install Longhorn and reconcile its recurring-job groups
  ansible.builtin.import_tasks: longhorn.yml
- name: Configure the Longhorn backup targets and job
  ansible.builtin.import_tasks: longhorn-backup.yml
- name: Install the host heartbeat crons
  ansible.builtin.import_tasks: health-crons.yml
- name: Create the read-only cluster identity and kubeconfig
  ansible.builtin.import_tasks: kubeconfig.yml
- name: Apply node-level host configuration
  ansible.builtin.import_tasks: node.yml
- name: Point cluster DNS at Pi-hole
  ansible.builtin.import_tasks: coredns.yml
