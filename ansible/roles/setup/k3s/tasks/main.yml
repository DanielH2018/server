---
# Slice 0 of the k3s migration — see docs/k3s-migration/slice-0-cluster-foundation.md.
# This role brings up a SINGLE-NODE cluster on daniel-box. daniel-server deliberately does
# not join until slice 7: k3s ships its own containerd and flannel/kube-proxy iptables
# rules, and landing those on the host running 46 containers, the custom DOCKER-USER rule
# and the wg-easy hairpin-NAT setup is the riskiest possible starting point.

- name: Refuse to run on a host that already runs Docker containers
  tags: [k3s_server]
  # The whole risk assessment behind "k3s goes on daniel-box first" is that the host is
  # empty. If Docker is present, that assumption no longer holds and the iptables
  # interaction needs deciding before, not during, an install.
  ansible.builtin.stat:
    path: /usr/bin/docker
  register: k3s_docker_binary

- name: Fail if Docker is installed
  tags: [k3s_server]
  ansible.builtin.assert:
    that: not k3s_docker_binary.stat.exists
    fail_msg: >-
      Docker is installed on {{ inventory_hostname }}. This role targets a host with no
      container runtime; k3s brings its own containerd and its iptables rules would land
      on top of Docker's chains. Resolve that interaction deliberately before proceeding.

- name: Download the k3s installer
  tags: [k3s_server]
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /usr/local/bin/k3s-install.sh
    mode: "0755"
  become: true

- name: Read the installed k3s systemd unit
  tags: [k3s_server]
  ansible.builtin.slurp:
    src: /etc/systemd/system/k3s.service
  register: k3s_unit
  become: true
  failed_when: false

- name: Install or reconfigure the k3s server
  tags: [k3s_server]
  # Guarded on the unit's arguments, not on /usr/local/bin/k3s existing. The old
  # `creates:` guard meant a change to k3s_server_args never reached an already-installed
  # host: the play reported ok while the unit kept its original ExecStart. That is how the
  # node IP stayed pinned to a NIC that had been removed. The installer rewrites the unit,
  # daemon-reloads and restarts k3s itself, so no handler is needed.
  #
  # Quotes are stripped from the unit before matching because the installer single-quotes
  # each argument. This detects arguments that are missing, which covers adding or changing
  # a flag; it does not detect one that was *removed* from k3s_server_args, so a removal
  # needs the installer re-run by hand. Deliberate: a stricter set comparison that
  # misjudged the unit's quoting would restart k3s on every play.
  ansible.builtin.command:
    cmd: /usr/local/bin/k3s-install.sh
  environment:
    INSTALL_K3S_EXEC: "{{ k3s_server_args }}"
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
  become: true
  when: >-
    k3s_server_args.split() | reject('equalto', 'server')
    | difference(k3s_unit.content | default('') | b64decode | replace("'", "") | split())
    | length > 0
  changed_when: true

- name: Wait for the node to report Ready
  tags: [k3s_server]
  ansible.builtin.command:
    cmd: k3s kubectl wait --for=condition=Ready node --all --timeout=300s
  become: true
  changed_when: false

# containerd reads this only at startup, so a change needs k3s restarted — see the restart
# task below. Written here rather than in the registry role because it is node configuration,
# not a workload, and because it has to exist before any pod references a built image.
- name: Configure containerd's view of the in-cluster registry
  tags: [k3s_server]
  ansible.builtin.template:
    src: registries.yaml.j2
    dest: /etc/rancher/k3s/registries.yaml
    mode: "0600"
    owner: root
    group: root
  become: true
  notify:
    - Restart k3s
    - Wait for the node to report Ready again

- name: Read the node's registered internal IP
  tags: [k3s_server]
  ansible.builtin.command:
    # Single-quoted deliberately: the command module shlex-splits cmd, which would
    # otherwise strip the quotes around "InternalIP" and leave an invalid jsonpath.
    cmd: >-
      k3s kubectl get node -o
      jsonpath='{.items[0].status.addresses[?(@.type=="InternalIP")].address}'
  register: k3s_node_ip
  become: true
  changed_when: false

- name: Fail if the node registered an address the host does not own
  tags: [k3s_server]
  # The failure this catches took the cluster down silently: pods kept dialling an
  # apiserver endpoint on an address that no longer existed on any interface, while
  # `kubectl` from the host went on working over 127.0.0.1 and hid it.
  ansible.builtin.assert:
    that: k3s_node_ip.stdout == server_ip
    fail_msg: >-
      k3s registered {{ inventory_hostname }} at {{ k3s_node_ip.stdout }}, but its canonical
      address is {{ server_ip }}. Every pod reaches the apiserver through that address, so
      it must be one the host will keep. Check for a second NIC winning autodetection.

- name: Check the datastore backing the control plane
  tags: [k3s_server]
  ansible.builtin.stat:
    path: /var/lib/rancher/k3s/server/db/etcd
  register: k3s_etcd_dir
  become: true

- name: Fail if the control plane is on SQLite rather than embedded etcd
  tags: [k3s_server]
  ansible.builtin.assert:
    that: k3s_etcd_dir.stat.isdir | default(false)
    fail_msg: >-
      /var/lib/rancher/k3s/server/db/etcd is absent, so --cluster-init did not take and
      k3s is running on SQLite. Recoverable (restart the server with --cluster-init) but
      everything below would be built on the wrong datastore, so stop here.

- name: List kube-system workloads
  tags: [k3s_server]
  ansible.builtin.command:
    cmd: k3s kubectl get pods -n kube-system -o name
  register: k3s_kube_system_pods
  become: true
  changed_when: false

- name: Fail if the bundled Traefik, servicelb or local-path provisioner is running
  tags: [k3s_server]
  # All three disables are load-bearing: a bundled Traefik would fight the real ingress in
  # slice 1, klipper-lb would race MetalLB for LoadBalancer Services, and local-path ships
  # a second default StorageClass next to longhorn (see defaults/main.yml).
  ansible.builtin.assert:
    that:
      - "'traefik' not in k3s_kube_system_pods.stdout"
      - "'svclb' not in k3s_kube_system_pods.stdout"
      - "'local-path-provisioner' not in k3s_kube_system_pods.stdout"
    fail_msg: >-
      k3s started with a bundled component the --disable flags in k3s_server_args should
      have kept off — check /etc/systemd/system/k3s.service.

- name: Install MetalLB
  tags: [metallb]
  ansible.builtin.command:
    cmd: >-
      k3s kubectl apply -f
      https://raw.githubusercontent.com/metallb/metallb/{{ k3s_metallb_version }}/config/manifests/metallb-native.yaml
  register: k3s_metallb_apply
  become: true
  changed_when: "'created' in k3s_metallb_apply.stdout or 'configured' in k3s_metallb_apply.stdout"

- name: Wait for the MetalLB controller
  tags: [metallb]
  ansible.builtin.command:
    cmd: k3s kubectl -n metallb-system wait --for=condition=Available deploy/controller --timeout=300s
  become: true
  changed_when: false

- name: Render the MetalLB address pool
  tags: [metallb]
  ansible.builtin.template:
    src: metallb-pool.yaml.j2
    dest: /etc/rancher/k3s/metallb-pool.yaml
    mode: "0644"
    owner: root
    group: root
  become: true

- name: Apply the MetalLB address pool
  tags: [metallb]
  ansible.builtin.command:
    cmd: k3s kubectl apply -f /etc/rancher/k3s/metallb-pool.yaml
  register: k3s_metallb_pool_apply
  become: true
  changed_when: "'created' in k3s_metallb_pool_apply.stdout or 'configured' in k3s_metallb_pool_apply.stdout"

- name: Render the workload-tier PriorityClasses
  tags: [priorityclass]
  ansible.builtin.template:
    src: priorityclass.yaml.j2
    dest: /etc/rancher/k3s/priorityclass.yaml
    mode: "0644"
    owner: root
    group: root
  become: true

- name: Apply the workload-tier PriorityClasses
  tags: [priorityclass]
  ansible.builtin.command:
    cmd: k3s kubectl apply -f /etc/rancher/k3s/priorityclass.yaml
  register: k3s_priorityclass_apply
  become: true
  changed_when: "'created' in k3s_priorityclass_apply.stdout or 'configured' in k3s_priorityclass_apply.stdout"

- name: Install Longhorn prerequisites
  tags: [longhorn]
  # open-iscsi is not optional: without it volumes hang in "Attaching" with an error that
  # never names the missing package.
  ansible.builtin.apt:
    name:
      - open-iscsi
      - nfs-common
    state: present
  become: true

- name: Blacklist Longhorn devices from multipathd
  tags: [longhorn]
  # The Longhorn KB's multipath fix (troubleshooting-volume-with-multipath): multipathd
  # claims freshly attached /dev/longhorn devices and every mount fails "already in use".
  # Latent behind the node CR's standing Multipathd:False warning until the 2026-08-14
  # drain gate's mass reattach cycle stalled ten workloads on it at once.
  ansible.builtin.blockinfile:
    path: /etc/multipath.conf
    create: true
    mode: "0644"
    owner: root
    group: root
    marker: "# {mark} ANSIBLE MANAGED - longhorn multipath blacklist"
    block: |
      blacklist {
          devnode "^sd[a-z0-9]+"
      }
  become: true
  register: k3s_multipath_conf

- name: Restart multipathd after a blacklist change # noqa no-handler
  tags: [longhorn]
  # Not a handler on purpose: the role's play has no handler flush before the Longhorn
  # verify tasks, and a deferred restart would leave multipathd claiming devices through
  # the very checks that prove volumes mount.
  ansible.builtin.systemd:
    name: multipathd
    state: restarted
  become: true
  when: k3s_multipath_conf is changed

- name: Install Longhorn
  tags: [longhorn]
  ansible.builtin.command:
    cmd: >-
      k3s kubectl apply -f
      https://raw.githubusercontent.com/longhorn/longhorn/{{ k3s_longhorn_version }}/deploy/longhorn.yaml
  register: k3s_longhorn_apply
  become: true
  changed_when: "'created' in k3s_longhorn_apply.stdout or 'configured' in k3s_longhorn_apply.stdout"

- name: Wait for the Longhorn driver deployer
  tags: [longhorn]
  ansible.builtin.command:
    cmd: k3s kubectl -n longhorn-system rollout status deploy/longhorn-driver-deployer --timeout=600s
  become: true
  changed_when: false

- name: Set the default Longhorn replica count
  tags: [longhorn]
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n longhorn-system patch settings.longhorn.io default-replica-count
      --type=merge -p {{ replica_patch | quote }}
  vars:
    replica_patch: '{"value":"{{ k3s_longhorn_replica_count }}"}'
  register: k3s_longhorn_replicas
  become: true
  changed_when: "'no change' not in k3s_longhorn_replicas.stdout"

- name: Set the Longhorn backup-store poll interval
  tags: [longhorn, longhorn_backup]
  # Rate-limits the only recurring B2 caller in the cluster. See the variable's comment in
  # defaults/main.yml — at upstream's 300s this exhausted Backblaze's Class C transaction
  # allowance and took every backup tier down for 13h.
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n longhorn-system patch settings.longhorn.io backupstore-poll-interval
      --type=merge -p {{ poll_patch | quote }}
  vars:
    poll_patch: '{"value":"{{ k3s_longhorn_backupstore_poll_interval }}"}'
  register: k3s_longhorn_poll_interval
  become: true
  changed_when: "'no change' not in k3s_longhorn_poll_interval.stdout"

- name: Allow recurring backups of detached volumes
  tags: [longhorn, longhorn_backup]
  # Without this the nightly silently skips any volume that happens to be detached at
  # 03:30 — which pi-peer-backup-data always is. See the variable's comment in
  # defaults/main.yml.
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n longhorn-system patch settings.longhorn.io allow-recurring-job-while-volume-detached
      --type=merge -p {{ detached_patch | quote }}
  vars:
    detached_patch: '{"value":"{{ k3s_longhorn_backup_detached_volumes }}"}'
  register: k3s_longhorn_detached_backup
  become: true
  changed_when: "'no change' not in k3s_longhorn_detached_backup.stdout"

- name: Render the Longhorn StorageClass
  tags: [longhorn]
  # The setting patched above only governs volumes whose StorageClass stays quiet about
  # replicas, and upstream's class does not: it pins numberOfReplicas: "3". Without this
  # block every PVC lands at 3 replicas on a one-node cluster and sits Degraded forever.
  # Full reasoning in the header of files/longhorn-storageclass.yaml.
  ansible.builtin.copy:
    src: longhorn-storageclass.yaml
    dest: /etc/rancher/k3s/longhorn-storageclass.yaml
    mode: "0644"
    owner: root
    group: root
  become: true

- name: Render the StorageClass ConfigMap patch
  tags: [longhorn]
  # longhorn-driver-deployer recreates the class from this ConfigMap whenever it is absent,
  # and `Install Longhorn` above re-applies upstream's "3" into it on every run. Patching it
  # from the same file the class is applied from stops the two disagreeing.
  ansible.builtin.copy:
    content: "{{ {'data': {'storageclass.yaml': lookup('file', 'longhorn-storageclass.yaml')}} | to_json }}"
    dest: /etc/rancher/k3s/longhorn-storageclass-configmap-patch.json
    mode: "0644"
    owner: root
    group: root
  become: true

- name: Keep the StorageClass ConfigMap in step with the rendered class
  tags: [longhorn]
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n longhorn-system patch configmap longhorn-storageclass --type=merge
      --patch-file /etc/rancher/k3s/longhorn-storageclass-configmap-patch.json
  register: k3s_longhorn_sc_configmap
  become: true
  changed_when: "'no change' not in k3s_longhorn_sc_configmap.stdout"

- name: Read the replica count pinned by the live StorageClass
  tags: [longhorn]
  ansible.builtin.command:
    cmd: k3s kubectl get storageclass longhorn -o jsonpath={.parameters.numberOfReplicas}
  register: k3s_longhorn_sc_replicas
  become: true
  changed_when: false
  failed_when: false

- name: Delete the StorageClass while it still pins a replica count
  tags: [longhorn]
  # StorageClass parameters are immutable, so `apply` cannot remove one — the class has to be
  # recreated. This is safe: parameters are read at provision time only, so deleting the class
  # neither touches an existing PV nor unbinds a PVC. The task skips itself once the pin is
  # gone, which is what makes this pair idempotent rather than a delete/recreate every run.
  ansible.builtin.command:
    cmd: k3s kubectl delete storageclass longhorn
  become: true
  when: k3s_longhorn_sc_replicas.stdout | default('', true) | length > 0
  changed_when: true

- name: Apply the Longhorn StorageClass
  tags: [longhorn]
  ansible.builtin.command:
    cmd: k3s kubectl apply -f /etc/rancher/k3s/longhorn-storageclass.yaml
  register: k3s_longhorn_sc_apply
  become: true
  changed_when: "'created' in k3s_longhorn_sc_apply.stdout or 'configured' in k3s_longhorn_sc_apply.stdout"

- name: Render the no-backup Longhorn StorageClass
  tags: [longhorn]
  # Opt-in class for bulky, high-churn or sensitive state that must stay out of B2. It has
  # to be a StorageClass rather than a PVC label: Longhorn reads recurring-job labels off its
  # own Volume CRs, and PVC labels do not reach them. Reasoning in the file header.
  ansible.builtin.copy:
    src: longhorn-storageclass-nobackup.yaml
    dest: /etc/rancher/k3s/longhorn-storageclass-nobackup.yaml
    mode: "0644"
    owner: root
    group: root
  become: true

- name: Apply the no-backup Longhorn StorageClass
  tags: [longhorn]
  ansible.builtin.command:
    cmd: k3s kubectl apply -f /etc/rancher/k3s/longhorn-storageclass-nobackup.yaml
  register: k3s_longhorn_nobackup_sc_apply
  become: true
  changed_when: >-
    'created' in k3s_longhorn_nobackup_sc_apply.stdout
    or 'configured' in k3s_longhorn_nobackup_sc_apply.stdout

# The StorageClass above only decides a volume's recurring-job group at PROVISION time, and a
# PVC's storageClassName is immutable — so a volume that must LEAVE the backup set after it is
# bound cannot be moved by editing either one. Longhorn reads the group off its own Volume CR
# label, and that label is mutable, so this reconciles it. Declarative rather than a one-off
# `kubectl label`, because the alternative is a live cluster that silently disagrees with the repo
# about what is backed up.
- name: Find backed-up Longhorn volumes that should be excluded
  tags: [longhorn]
  # argv, not cmd: the jsonpath contains spaces, and a folded `cmd` scalar collapses the newlines
  # into them — command's shell-like split then tears `{range .items[*]}` into two arguments.
  ansible.builtin.command:
    argv:
      - k3s
      - kubectl
      - -n
      - longhorn-system
      - get
      - volumes.longhorn.io
      - -l
      - recurring-job-group.longhorn.io/default=enabled
      - -o
      - 'jsonpath={range .items[*]}{.metadata.name}{" "}{.status.kubernetesStatus.namespace}/{.status.kubernetesStatus.pvcName}{"\n"}{end}'
  become: true
  changed_when: false
  register: k3s_longhorn_backed_up

# Naturally idempotent: a volume that has already moved no longer carries the `default` label, so
# it does not come back from the query above and this loop has nothing to do on a second run.
- name: Move excluded volumes into the no-backup recurring-job group
  tags: [longhorn]
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n longhorn-system label volumes.longhorn.io {{ item.split(' ')[0] }}
      recurring-job-group.longhorn.io/no-backup=enabled
      recurring-job-group.longhorn.io/default- --overwrite
  loop: "{{ k3s_longhorn_backed_up.stdout_lines }}"
  when: item.split(' ')[1] in k3s_longhorn_nobackup_volumes
  become: true
  changed_when: true

# The move above is one-way, and the defaults file used to claim otherwise ("removing a name from
# this list is what restores scheduled protection"). It did not: the query feeding it selects on
# `default=enabled`, so a volume that has already left never comes back from it and nothing returns
# it. That made the list a trapdoor rather than a declaration. These two tasks are the other
# direction, so the list means what it says.
#
# The reverse CANNOT be "anything labelled no-backup and absent from the list" — most of the
# no-backup volumes (prometheus-data, loki-data, registry-data, tempo-data, karakeep-meili, …) were
# never in it. They are excluded by their StorageClass at creation, and sweeping them into the
# backup set is precisely the transaction blowup this file exists to prevent. So the intent is read
# from the class: `longhorn` asks for backups, `longhorn-nobackup` does not, and the list overrides
# the class for volumes bound before the distinction existed.
- name: Find PVCs whose StorageClass asks for backups
  tags: [longhorn]
  ansible.builtin.command:
    argv:
      - k3s
      - kubectl
      - get
      - pvc
      - --all-namespaces
      - -o
      - 'jsonpath={range .items[?(@.spec.storageClassName=="longhorn")]}{.metadata.namespace}/{.metadata.name}{"\n"}{end}'
  become: true
  changed_when: false
  register: k3s_longhorn_backup_class_pvcs

- name: Find excluded Longhorn volumes that should be backed up again
  tags: [longhorn]
  ansible.builtin.command:
    argv:
      - k3s
      - kubectl
      - -n
      - longhorn-system
      - get
      - volumes.longhorn.io
      - -l
      - recurring-job-group.longhorn.io/no-backup=enabled
      - -o
      - 'jsonpath={range .items[*]}{.metadata.name}{" "}{.status.kubernetesStatus.namespace}/{.status.kubernetesStatus.pvcName}{"\n"}{end}'
  become: true
  changed_when: false
  register: k3s_longhorn_excluded

# Idempotent for the same reason as its mirror: a volume that has moved back no longer carries the
# `no-backup` label, so the query above stops returning it.
- name: Return volumes to the default recurring-job group
  tags: [longhorn]
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n longhorn-system label volumes.longhorn.io {{ item.split(' ')[0] }}
      recurring-job-group.longhorn.io/default=enabled
      recurring-job-group.longhorn.io/no-backup- --overwrite
  loop: "{{ k3s_longhorn_excluded.stdout_lines }}"
  when:
    - item.split(' ')[1] in k3s_longhorn_backup_class_pvcs.stdout_lines
    - item.split(' ')[1] not in k3s_longhorn_nobackup_volumes
    - item.split(' ')[1] not in k3s_longhorn_weekly_volumes
  become: true
  changed_when: true

# ── weekly tier (mirrors the no-backup pair above, same idempotence argument) ────────────
# NB a weekly→no-backup move routes THROUGH default (this pair returns it to default, the
# no-backup pair above claims it on the NEXT run) — converges on the second deploy.
- name: Move weekly-tier volumes out of the daily group
  tags: [longhorn]
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n longhorn-system label volumes.longhorn.io {{ item.split(' ')[0] }}
      recurring-job-group.longhorn.io/weekly-backup=enabled
      recurring-job-group.longhorn.io/default- --overwrite
  loop: "{{ k3s_longhorn_backed_up.stdout_lines }}"
  when: item.split(' ')[1] in k3s_longhorn_weekly_volumes
  become: true
  changed_when: true

- name: Find weekly-tier volumes that should be daily again
  tags: [longhorn]
  ansible.builtin.command:
    argv:
      - k3s
      - kubectl
      - -n
      - longhorn-system
      - get
      - volumes.longhorn.io
      - -l
      - recurring-job-group.longhorn.io/weekly-backup=enabled
      - -o
      - 'jsonpath={range .items[*]}{.metadata.name}{" "}{.status.kubernetesStatus.namespace}/{.status.kubernetesStatus.pvcName}{"\n"}{end}'
  become: true
  changed_when: false
  register: k3s_longhorn_weekly_labelled

- name: Return weekly-tier volumes to the default recurring-job group
  tags: [longhorn]
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n longhorn-system label volumes.longhorn.io {{ item.split(' ')[0] }}
      recurring-job-group.longhorn.io/default=enabled
      recurring-job-group.longhorn.io/weekly-backup- --overwrite
  loop: "{{ k3s_longhorn_weekly_labelled.stdout_lines }}"
  when: item.split(' ')[1] not in k3s_longhorn_weekly_volumes
  become: true
  changed_when: true

- name: Derive the B2 region from the Kopia endpoint
  tags: [longhorn_backup]
  # Longhorn's S3 target is s3://<bucket>@<region>/<prefix>; Kopia stores a hostname.
  # Derived rather than duplicated so the two can't drift apart in SOPS.
  # Deliberately not the capture-group form of regex_search: on no match it returns None,
  # and `None | first` raises a Jinja error before any default can catch it — so a bad
  # endpoint would blow up here instead of hitting the assert below with a usable message.
  # Search-then-replace degrades to an empty string instead, which the assert reports.
  ansible.builtin.set_fact:
    k3s_longhorn_b2_region: >-
      {{ kopia_b2_endpoint
         | regex_search('s3\.[a-z0-9-]+\.backblazeb2\.com')
         | default('', true)
         | regex_replace('^s3\.([a-z0-9-]+)\.backblazeb2\.com$', '\1') }}

- name: Fail if the B2 region could not be derived
  tags: [longhorn_backup]
  ansible.builtin.assert:
    that: k3s_longhorn_b2_region | length > 0
    fail_msg: >-
      Could not derive a B2 region from kopia_b2_endpoint. Longhorn needs
      s3://<bucket>@<region>/<prefix>. Set k3s_longhorn_b2_region explicitly in host_vars
      rather than loosening the regex.

- name: Look for an existing Longhorn backup credential
  tags: [longhorn_backup]
  ansible.builtin.command:
    cmd: k3s kubectl -n longhorn-system get secret longhorn-b2 -o name
  register: k3s_longhorn_secret
  become: true
  changed_when: false
  failed_when: false

- name: Create the Longhorn backup credential
  tags: [longhorn_backup]
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n longhorn-system create secret generic longhorn-b2
      --from-literal=AWS_ACCESS_KEY_ID={{ kopia_b2_key_id }}
      --from-literal=AWS_SECRET_ACCESS_KEY={{ kopia_b2_application_key }}
      --from-literal=AWS_ENDPOINTS=https://s3.{{ k3s_longhorn_b2_region }}.backblazeb2.com
  become: true
  no_log: true
  when: k3s_longhorn_secret.rc != 0
  changed_when: true

# Declarative in BOTH directions: k3s_longhorn_backup_armed=false enforces a BLANK target.
# It used to arm unconditionally, which silently resurrected a deliberately blanked target
# on every role run — that re-arm restarted the B2 transaction-cap death spiral twice
# (2026-08-10 and 2026-08-12; docs/b2-transaction-cap-monitoring-gaps.md). Blanking is the
# incident lever that stops all backupstore S3 traffic, so a blank must survive deploys
# until an operator flips the var back.
- name: Point Longhorn at the backup target (or enforce the blanked target)
  tags: [longhorn_backup]
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n longhorn-system patch settings.longhorn.io backup-target
      --type=merge -p {{ target_patch | quote }}
  vars:
    target_patch: >-
      {"value":"{% if k3s_longhorn_backup_armed | bool %}s3://{{ kopia_b2_bucket }}@{{ k3s_longhorn_b2_region }}/{{ k3s_longhorn_backup_prefix }}{% endif %}"}
  register: k3s_longhorn_target
  become: true
  changed_when: "'no change' not in k3s_longhorn_target.stdout"

- name: Point Longhorn at the backup credential
  tags: [longhorn_backup]
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n longhorn-system patch settings.longhorn.io backup-target-credential-secret
      --type=merge -p {{ secret_patch | quote }}
  vars:
    secret_patch: '{"value":"longhorn-b2"}'
  register: k3s_longhorn_target_secret
  become: true
  changed_when: "'no change' not in k3s_longhorn_target_secret.stdout"

# Skipped while disarmed: a blank target is never `available`, so this gate would fail the
# play before the recurring-job and label-reconcile tasks below it — which must keep
# converging exactly when the target is deliberately down.
- name: Check whether Longhorn can reach the backup target
  tags: [longhorn_backup]
  ansible.builtin.command:
    cmd: k3s kubectl -n longhorn-system get backuptarget default -o jsonpath={.status.available}
  register: k3s_backup_available
  become: true
  changed_when: false
  retries: 12
  delay: 10
  until: k3s_backup_available.stdout == "true"
  when: k3s_longhorn_backup_armed | bool

- name: Render the Longhorn recurring backup job
  tags: [longhorn_backup]
  ansible.builtin.template:
    src: longhorn-recurringjob.yaml.j2
    dest: /etc/rancher/k3s/longhorn-recurringjob.yaml
    mode: "0644"
    owner: root
    group: root
  become: true

- name: Apply the Longhorn recurring backup job
  tags: [longhorn_backup]
  ansible.builtin.command:
    cmd: k3s kubectl apply -f /etc/rancher/k3s/longhorn-recurringjob.yaml
  register: k3s_longhorn_recurringjob
  become: true
  changed_when: "'created' in k3s_longhorn_recurringjob.stdout or 'configured' in k3s_longhorn_recurringjob.stdout"

- name: Report what still needs proving by hand
  tags: [longhorn_backup]
  # available:true proves credentials and reachability. It does NOT prove an object was
  # ever written, and "a backup system that reports success while storing nothing" is the
  # exact failure this slice exists to prevent. Only listing the bucket settles it.
  ansible.builtin.debug:
    msg: >-
      Longhorn reports the backup target reachable. This does NOT prove an object was
      written. Before migrating any service (slice 1), snapshot a test volume, back it up,
      and confirm the object exists under the '{{ k3s_longhorn_backup_prefix }}/' prefix in
      bucket '{{ kopia_b2_bucket }}' by listing it from outside the cluster.

- name: Deploy the Longhorn backup-plane heartbeat
  tags: [backup-health]
  # Runs as {{ sys_user }}, not root: it reads the cluster through that user's read-only
  # kubeconfig, which is the whole point — the cron cannot mutate anything.
  ansible.builtin.template:
    src: longhorn-backup-health.sh.j2
    dest: /usr/local/bin/longhorn-backup-health.sh
    mode: "0755"
    owner: root
    group: root
  become: true
  no_log: true  # renders the Kuma push token

- name: Schedule the Longhorn backup-plane heartbeat
  tags: [backup-health]
  ansible.builtin.cron:
    name: "Longhorn backup health"
    minute: "{{ k3s_longhorn_backup_health_cron_minute }}"
    user: "{{ sys_user }}"
    job: "/usr/local/bin/longhorn-backup-health.sh"
    cron_file: longhorn-backup-health
  become: true

- name: Deploy the root-disk headroom heartbeat
  tags: [disk-health]
  ansible.builtin.template:
    src: disk-health.sh.j2
    dest: /usr/local/bin/disk-health.sh
    mode: "0755"
    owner: root
    group: root
  become: true
  no_log: true  # renders the Kuma push token

- name: Schedule the root-disk headroom heartbeat
  tags: [disk-health]
  ansible.builtin.cron:
    name: "daniel-box disk health"
    minute: "{{ k3s_disk_health_cron_minute }}"
    user: "{{ sys_user }}"
    job: "/usr/local/bin/disk-health.sh"
    cron_file: disk-health
  become: true

- name: Deploy the manifest-prune drift check
  tags: [manifest-prune]
  # Root-owned AND root-run (see the cron task below): /etc/rancher/k3s/manifests/*/ is mode
  # 0700 (k8s/manifests role), so comparing live objects against the staged manifests needs
  # root at the OS level. The kubectl calls inside the script stay scoped to the read-only
  # ServiceAccount kubeconfig regardless, same as the heartbeats above — root here buys
  # filesystem access, not cluster-mutation ability.
  ansible.builtin.template:
    src: manifest-prune-check.sh.j2
    dest: /usr/local/bin/manifest-prune-check.sh
    mode: "0755"
    owner: root
    group: root
  become: true
  no_log: true  # renders the Kuma push token

- name: Schedule the manifest-prune drift check
  tags: [manifest-prune]
  ansible.builtin.cron:
    name: "Manifest prune drift check"
    minute: "{{ k3s_manifest_prune_cron_minute }}"
    hour: "{{ k3s_manifest_prune_cron_hour }}"
    user: root
    job: "/usr/local/bin/manifest-prune-check.sh"
    cron_file: manifest-prune-check
  become: true

- name: Render the read-only cluster identity
  tags: [kubeconfig]
  ansible.builtin.template:
    src: readonly-rbac.yaml.j2
    dest: /etc/rancher/k3s/readonly-rbac.yaml
    mode: "0644"
    owner: root
    group: root
  become: true

- name: Apply the read-only cluster identity
  tags: [kubeconfig]
  ansible.builtin.command:
    cmd: k3s kubectl apply -f /etc/rancher/k3s/readonly-rbac.yaml
  register: k3s_readonly_rbac_apply
  become: true
  changed_when: "'created' in k3s_readonly_rbac_apply.stdout or 'configured' in k3s_readonly_rbac_apply.stdout"

- name: Read the read-only ServiceAccount token
  tags: [kubeconfig]
  # The token controller populates the Secret asynchronously after `apply` returns, so a
  # first run reaches this before the value exists. Retry rather than render an empty token
  # into a kubeconfig that then fails authentication with nothing pointing back to here.
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n {{ k3s_readonly_sa_namespace }} get secret
      {{ k3s_readonly_sa_name }}-token -o jsonpath={.data.token}
  register: k3s_readonly_token
  become: true
  changed_when: false
  no_log: true
  retries: 12
  delay: 5
  until: k3s_readonly_token.stdout | length > 0

- name: Read the admin kubeconfig for the API server's CA
  tags: [kubeconfig]
  # NOT the ca.crt inside the ServiceAccount token Secret. That is the CA k3s issues service
  # account certificates from, and it does not sign the apiserver's serving certificate — a
  # kubeconfig built from it authenticates fine and then dies at the TLS handshake:
  #   tls: failed to verify certificate: x509: certificate signed by unknown authority
  # The admin kubeconfig's CA is by definition the one that validates the endpoint it points
  # at, which is the same endpoint used below.
  ansible.builtin.slurp:
    src: /etc/rancher/k3s/k3s.yaml
  register: k3s_admin_kubeconfig
  become: true
  no_log: true

- name: Create the kubeconfig directory
  tags: [kubeconfig]
  # /home/{{ sys_user }} hardcoded, not ansible_env.HOME — these tasks are escalated, so
  # ansible_env reports root's home. Same trap chezmoi_setup documents.
  ansible.builtin.file:
    path: "/home/{{ sys_user }}/.kube"
    state: directory
    owner: "{{ sys_user }}"
    group: "{{ sys_user }}"
    mode: "0700"
  become: true

- name: Write the read-only kubeconfig
  tags: [kubeconfig]
  ansible.builtin.template:
    src: readonly-kubeconfig.j2
    dest: "/home/{{ sys_user }}/.kube/config"
    owner: "{{ sys_user }}"
    group: "{{ sys_user }}"
    mode: "0600"
  vars:
    k3s_readonly_token_plain: "{{ k3s_readonly_token.stdout | b64decode }}"
    k3s_readonly_ca_b64: "{{ (k3s_admin_kubeconfig.content | b64decode | from_yaml).clusters[0].cluster['certificate-authority-data'] }}"
  become: true
  no_log: true

- name: Point shells at the read-only kubeconfig
  tags: [kubeconfig]
  # `k3s kubectl` (and the kubectl symlink k3s installs) hardcode /etc/rancher/k3s/k3s.yaml
  # and fail outright when it is unreadable — they do NOT fall back to ~/.kube/config:
  #   error loading config file "/etc/rancher/k3s/k3s.yaml": permission denied
  # So the fallback has to be made explicit. Guarded on ~/.kube/config existing, which root
  # has none of, so root keeps resolving to the admin config it can already read.
  ansible.builtin.copy:
    dest: /etc/profile.d/k3s-kubeconfig.sh
    content: |
      # Managed by Ansible (roles/setup/k3s) — do not edit.
      if [ -z "${KUBECONFIG:-}" ] && [ -r "$HOME/.kube/config" ]; then
        export KUBECONFIG="$HOME/.kube/config"
      fi
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Source the kubeconfig hook from zsh as well
  tags: [kubeconfig]
  # zsh does not read /etc/profile.d. Ubuntu's /etc/zsh/zprofile does not source /etc/profile
  # either, so the hook above never fires for the login shell this host actually uses. zshenv
  # is the one zsh startup file read by every invocation, including non-interactive ones —
  # which is what an unattended caller gets.
  ansible.builtin.blockinfile:
    path: /etc/zsh/zshenv
    marker: "# {mark} ANSIBLE MANAGED — k3s kubeconfig"
    block: |
      if [ -r /etc/profile.d/k3s-kubeconfig.sh ]; then
        . /etc/profile.d/k3s-kubeconfig.sh
      fi
    create: false
  become: true

# Phase F: node-to-node cluster traffic terminates in host processes (apiserver, kubelet,
# flannel), not the Docker/kube NAT paths every service port rides — so it is the one
# class of traffic that actually meets UFW's default-deny INPUT and needs explicit
# allows. No-op while k3s_agent_node_ips is empty.
- name: Allow cluster traffic from agent nodes
  tags: [join-firewall]
  community.general.ufw:
    rule: allow
    from_ip: "{{ item.0 }}"
    port: "{{ item.1.port }}"
    proto: "{{ item.1.proto }}"
  loop: "{{ k3s_agent_node_ips | product(k3s_join_server_ports) | list }}"
  become: true

- name: Create the systemd-resolved drop-in directory
  tags: [node-dns]
  ansible.builtin.file:
    path: /etc/systemd/resolved.conf.d
    state: directory
    mode: "0755"
    owner: root
    group: root
  become: true

- name: Pin the node's DNS to upstream resolvers
  tags: [node-dns]
  ansible.builtin.template:
    src: node-dns.conf.j2
    dest: /etc/systemd/resolved.conf.d/50-homelab-upstream.conf
    mode: "0644"
    owner: root
    group: root
  become: true
  register: k3s_node_dns_dropin

- name: Restart systemd-resolved to apply the pinned upstreams # noqa no-handler
  tags: [node-dns]
  ansible.builtin.systemd:
    name: systemd-resolved
    state: restarted
  become: true
  when: k3s_node_dns_dropin.changed

- name: Raise the inotify instance limit for pod log tailing
  tags: [node-sysctl]
  # Kernel default is 128 instances PER UID — and every root-uid process on the node
  # (kubelet's log watchers plus each root container) draws from the same budget. The
  # crowdsec agent sidecar was the straw that broke it at slice-6 B1: its file
  # acquisition died with "couldn't initialize inotify: too many open files" while the
  # node sat well under every other limit. 1024 matches what log-shipping DaemonSet
  # docs (promtail/vector) recommend for container nodes.
  ansible.posix.sysctl:
    name: fs.inotify.max_user_instances
    value: "1024"
    state: present
    reload: true
  become: true
