---
# Node-level host config: the agent-join firewall allows, pinned DNS upstreams,
# and the inotify limit pod log tailing needs.
# Split out of main.yml on 2026-08-15; task content and tags are unchanged.

# Phase F: node-to-node cluster traffic terminates in host processes (apiserver, kubelet,
# flannel), not the Docker/kube NAT paths every service port rides — so it is the one
# class of traffic that actually meets UFW's default-deny INPUT and needs explicit
# allows. No-op while k3s_agent_node_ips is empty.
- name: Allow cluster traffic from agent nodes
  tags: [join-firewall]
  community.general.ufw:
    rule: allow
    from_ip: "{{ item.0 }}"
    port: "{{ item.1.port }}"
    proto: "{{ item.1.proto }}"
  loop: "{{ k3s_agent_node_ips | product(k3s_join_server_ports) | list }}"
  become: true

# ── The host forwarder ──────────────────────────────────────────────────────────────────
# EVERY TASK HERE RUNS BEFORE THE resolv.conf BLOCK BELOW, and that is the safety property.
# resolv.conf ends up naming 127.0.0.1 and nothing else, so a run that installed CoreDNS
# after switching the file would leave a window — or, on failure, a permanent state — with
# the node pointed at a port nothing is listening on. The verify task at the end of this
# block is the gate: it fails the play before the switch rather than after it.

- name: Allow Prometheus pods to scrape the host forwarder
  tags: [node-dns]
  # Pod-to-host traffic terminates in a host process, so unlike a Service port it genuinely
  # meets UFW's default-deny INPUT. Same class as the agent-join allows above.
  community.general.ufw:
    rule: allow
    from_ip: "{{ k3s_pod_cidr }}"
    port: "{{ k3s_host_dns_metrics_port }}"
    proto: tcp
  become: true
  when: k3s_host_coredns_enabled

- name: Create the host forwarder's directories
  tags: [node-dns]
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
    owner: root
    group: root
  loop:
    - "{{ k3s_host_coredns_versioned_bin | dirname }}"
    - "{{ k3s_host_coredns_conf | dirname }}"
  become: true
  when: k3s_host_coredns_enabled

- name: Install the pinned CoreDNS release
  tags: [node-dns]
  # checksum: is the whole security argument. The release's own .sha256 sidecar travels over
  # the same connection as the tarball and is signed by nothing, so fetching it would verify
  # transport integrity twice and authenticity never. The pin lives in defaults/main.yml and
  # a changed artifact fails here. Same shape as roles/setup/sops_setup.
  ansible.builtin.unarchive:
    src: "{{ k3s_host_coredns_url }}"
    dest: "{{ k3s_host_coredns_versioned_bin | dirname }}"
    remote_src: true
    include: [coredns]
    mode: "0755"
    owner: root
    group: root
    # Keyed on the VERSIONED path. An unversioned `creates:` would make the pin inert after
    # the first install: a Renovate bump would edit defaults/main.yml, pass CI, deploy green,
    # and leave the old binary running with nothing reporting the mismatch.
    creates: "{{ k3s_host_coredns_versioned_bin }}"
  become: true
  when: k3s_host_coredns_enabled

# The unit executes this symlink, so a version bump swaps the target without rewriting the
# unit file — which keeps `k3s_host_coredns_unit.changed` meaning "the unit changed" rather
# than "the version changed", and lets each of them pick restart-vs-reload on its own.
- name: Point the stable path at the installed version
  tags: [node-dns]
  ansible.builtin.file:
    src: "{{ k3s_host_coredns_versioned_bin }}"
    dest: "{{ k3s_host_coredns_bin }}"
    state: link
  become: true
  register: k3s_host_coredns_link
  when: k3s_host_coredns_enabled

- name: Write the host forwarder's Corefile
  tags: [node-dns]
  ansible.builtin.template:
    src: host-corefile.j2
    dest: "{{ k3s_host_coredns_conf }}"
    mode: "0644"
    owner: root
    group: root
  become: true
  register: k3s_host_coredns_corefile
  when: k3s_host_coredns_enabled

- name: Install the host forwarder's unit
  tags: [node-dns]
  ansible.builtin.template:
    src: coredns-host.service.j2
    dest: /etc/systemd/system/coredns-host.service
    mode: "0644"
    owner: root
    group: root
  become: true
  register: k3s_host_coredns_unit
  when: k3s_host_coredns_enabled

- name: Start and enable the host forwarder
  tags: [node-dns]
  ansible.builtin.systemd:
    name: coredns-host
    # A new binary needs an exec, which only a restart gives; SIGUSR1 re-reads config only.
    state: "{{ 'restarted' if (k3s_host_coredns_unit.changed or k3s_host_coredns_link.changed) else 'started' }}"
    enabled: true
    daemon_reload: true
  become: true
  when: k3s_host_coredns_enabled

# SIGUSR1, not a restart. CoreDNS re-reads the Corefile in place, and once resolv.conf names
# only 127.0.0.1 the seconds of a restart are seconds with no DNS on this node at all. Skipped
# when the unit itself changed, because that task already restarted the process.
- name: Reload the host forwarder after a Corefile change # noqa no-handler
  tags: [node-dns]
  ansible.builtin.systemd:
    name: coredns-host
    state: reloaded
  become: true
  when:
    - k3s_host_coredns_enabled
    - k3s_host_coredns_corefile.changed
    - not k3s_host_coredns_unit.changed
    - not k3s_host_coredns_link.changed

# THE GATE. `systemctl start` returning is not evidence that DNS works — CoreDNS exits
# non-zero on a bad Corefile, but a forward list pointing somewhere unreachable starts
# cleanly and answers nothing. Prove it by behaviour, the same way tasks/coredns.yml proves
# the cluster forward, and prove it BEFORE resolv.conf depends on it.
- name: Prove the host forwarder answers before pointing the node at it
  tags: [node-dns]
  ansible.builtin.command:
    cmd: dig +short +time=2 +tries=1 @127.0.0.1 {{ k3s_host_dns_probe_name }}
  changed_when: false
  register: k3s_host_coredns_probe
  # Same shape as the cluster probe in tasks/coredns.yml: `until` owns the verdict, so a dig
  # that exits non-zero is retried rather than failing on its first attempt — and the task
  # still fails when the condition is never met, which is the outcome worth reporting.
  failed_when: false
  until: k3s_host_coredns_probe.stdout | trim | length > 0
  retries: "{{ k3s_coredns_probe_retries | int }}"
  delay: 2
  when: k3s_host_coredns_enabled

# TASK ORDER IS THE SAFETY PROPERTY HERE. The real file is written BEFORE systemd-resolved is
# stopped, so a run that dies midway leaves a working resolv.conf rather than a symlink to a
# stub nothing is serving. Never reorder these three.
- name: Check whether /etc/resolv.conf is still the systemd-resolved stub symlink
  tags: [node-dns]
  ansible.builtin.stat:
    path: /etc/resolv.conf
    follow: false
  register: k3s_node_resolv_stat
  become: true

# Guarded on islnk so a rerun cannot delete the regular file the next task writes. An
# unconditional `state: absent` here would blow away this node's resolver on every deploy.
- name: Remove the stub symlink so a regular /etc/resolv.conf can replace it
  tags: [node-dns]
  ansible.builtin.file:
    path: /etc/resolv.conf
    state: absent
  become: true
  when: k3s_node_resolv_stat.stat.islnk | default(false)

- name: Point the node at Pi-hole first with a public fallback
  tags: [node-dns]
  # Absolute src: templates resolve against THIS role's templates/ directory, and the file is
  # shared with optimize_pi (daniel-pi runs the identical config). Same reach-across pattern
  # the archived pihole role uses for its resolver configs.
  ansible.builtin.template:
    src: "{{ playbook_dir }}/roles/setup/common/templates/resolv.conf.j2"
    dest: /etc/resolv.conf
    mode: "0644"
    owner: root
    group: root
  become: true
  vars:
    common_resolver_nameservers: "{{ k3s_node_dns_upstreams }}"
    common_resolver_options: "{{ k3s_node_dns_options }}"
    common_resolver_timeout: "{{ k3s_node_dns_timeout }}"

# EXISTING PODS KEEP THE OLD FILE. kubelet copies the node's resolv.conf into a pod at
# CREATION, so the Default-dnsPolicy pods already running here — metallb-system/speaker and
# homelab/node-exporter, both hostNetwork — still carry whatever was there when they started,
# and after this change that is a `nameserver 127.0.0.53` pointing at a stub nothing serves.
# DELIBERATELY NOT RESTARTED. Neither resolves names in normal operation (both reach the
# apiserver by IP), all 70 Prometheus targets stayed up across the 2026-09-01 cutover, and
# restarting the speaker is what blacks out the ETP-Local VIPs it announces. They pick the new
# file up on their next restart for any other reason. The Pi has the same problem with Docker
# and DOES need the fix, because its containers genuinely resolve — see optimize_pi.
#
# systemd-resolved owns /etc/resolv.conf whenever it runs, so it has to go for the file above
# to survive. It is DISABLED rather than masked, matching daniel-server, which has run without
# it since 2026-08-10. With it gone, k3s reads /etc/resolv.conf directly for the pod template,
# which is why no --resolv-conf kubelet arg is needed (daniel-server carries none either).
- name: Stop and disable systemd-resolved
  tags: [node-dns]
  ansible.builtin.systemd:
    name: systemd-resolved
    state: stopped
    enabled: false
  become: true

# The A1 drop-in is inert once resolved is disabled, and an inert config file that still reads
# like the active mechanism is how the next reader gets it wrong. Remove it rather than leave
# it: `k3s_node_dns_upstreams` now renders into resolv.conf, not into this.
- name: Remove the retired systemd-resolved upstream drop-in
  tags: [node-dns]
  ansible.builtin.file:
    path: /etc/systemd/resolved.conf.d/50-homelab-upstream.conf
    state: absent
  become: true

# KEPT AS DEFENCE IN DEPTH, no longer the active mechanism. While systemd-resolved ran, this
# override was what kept /run/systemd/resolve/resolv.conf from running six nameservers deep —
# kubelet copies that file into every pod whose effective dnsPolicy is Default and Kubernetes
# keeps only the first 3, so the lease's resolvers cost a DNSConfigForming warning per pod
# sync. resolved is disabled above, so kubelet now reads the two-line /etc/resolv.conf this
# role writes and that warning cannot recur. The override stays because it is what stops the
# lease contributing resolvers again the moment anything re-enables resolved — an apt upgrade,
# a re-image, or a future decision to reverse the task above. Removing it would make that
# reversal silently wrong. ENFORCED by ansible/tests/setup/test_netplan_dns_overrides.py.
- name: Drop the DHCP-supplied resolvers from the node's DNS set
  tags: [node-dns]
  ansible.builtin.template:
    src: netplan-dns.yaml.j2
    dest: /etc/netplan/99-homelab-dns.yaml
    mode: "0600"
    owner: root
    group: root
  become: true
  register: k3s_node_dns_netplan

# Split from the apply deliberately: `generate` parses and merges every /etc/netplan/*.yaml
# and fails without touching the running configuration, so a bad merge stops here rather
# than reconfiguring the control-plane node's only uplink.
- name: Validate the merged netplan configuration # noqa no-handler
  tags: [node-dns]
  ansible.builtin.command:
    cmd: netplan generate
  become: true
  changed_when: false
  when: k3s_node_dns_netplan.changed

- name: Apply the netplan DNS override # noqa no-handler
  tags: [node-dns]
  ansible.builtin.command:
    cmd: netplan apply
  become: true
  changed_when: true
  when: k3s_node_dns_netplan.changed

- name: Raise the inotify instance limit for pod log tailing
  tags: [node-sysctl]
  # Kernel default is 128 instances PER UID — and every root-uid process on the node
  # (kubelet's log watchers plus each root container) draws from the same budget. The
  # crowdsec agent sidecar was the straw that broke it at slice-6 B1: its file
  # acquisition died with "couldn't initialize inotify: too many open files" while the
  # node sat well under every other limit. 1024 matches what log-shipping DaemonSet
  # docs (promtail/vector) recommend for container nodes.
  ansible.posix.sysctl:
    name: fs.inotify.max_user_instances
    value: "1024"
    state: present
    reload: true
  become: true
