---
# What Longhorn needs on the node itself, as opposed to the objects in the cluster: the iSCSI and
# NFS client packages, and multipathd's blacklist for Longhorn's devices. Longhorn's own install is
# the `longhorn` Kustomization's (H1.5a); this file is the host half it leaves behind.
#
# TAGGED `longhorn_host` ONLY, never `longhorn` or `longhorn_backup`. Bring-up step 1 skips both of
# those tags from H1.5a until H1.7b (docs/longhorn-disaster-recovery.md, *Order from H1.2*, and
# the H1 plan's *The Longhorn window*), because the tasks they select read `longhorn-system`
# objects before Flux has created them. A `--skip-tags` exclusion matches any tag a task carries,
# so a host task that also carried `longhorn` would be skipped with them and a rebuilt node
# would never get open-iscsi. ansible/tests/setup/test_k3s_longhorn_host_tasks.py holds this.
#
# main.yml imports this file ahead of longhorn-backup.yml. The agent flow keeps its own copies of
# the three tasks in agent.yml.

- name: Install Longhorn prerequisites
  tags: [longhorn_host]
  # open-iscsi is not optional: without it volumes hang in "Attaching" with an error that
  # never names the missing package.
  ansible.builtin.apt:
    name:
      - open-iscsi
      - nfs-common
    state: present
  become: true

- name: Blacklist Longhorn devices from multipathd
  tags: [longhorn_host]
  # The Longhorn KB's multipath fix (troubleshooting-volume-with-multipath): multipathd
  # claims freshly attached /dev/longhorn devices and every mount fails "already in use".
  # Latent behind the node CR's standing Multipathd:False warning until a mass reattach
  # cycle stalls many workloads on it at once.
  ansible.builtin.blockinfile:
    path: /etc/multipath.conf
    create: true
    mode: "0644"
    owner: root
    group: root
    marker: "# {mark} ANSIBLE MANAGED - longhorn multipath blacklist"
    block: |
      blacklist {
          devnode "^sd[a-z0-9]+"
      }
  become: true
  register: k3s_multipath_conf

- name: Restart multipathd after a blacklist change # noqa no-handler
  tags: [longhorn_host]
  # Not a handler on purpose: the role's play has no handler flush before the Longhorn
  # verify tasks, and a deferred restart would leave multipathd claiming devices through
  # the very checks that prove volumes mount.
  ansible.builtin.systemd:
    name: multipathd
    state: restarted
  become: true
  when: k3s_multipath_conf is changed
