---
# Install and validate the k3s server (control plane).

- name: Read the k3s pin from the system-upgrade role
  tags: [k3s_server]
  # H6.1b moved `k3s_version`, `k3s_install_script_url` and `k3s_install_script_sha256` to the
  # Flux-owned role that drives the SUC Plans, so a pin change routes to that tag and writes no
  # `manual_plane` line. This install reads the same file, and only on a fresh host (H6.3c).
  ansible.builtin.include_vars:
    file: "{{ playbook_dir }}/roles/k8s/system-upgrade/defaults/main.yml"
  when: has_repo_checkout | bool

- name: Refuse to run on a host that already runs Docker containers
  tags: [k3s_server]
  # The whole risk assessment behind "k3s goes on daniel-box first" is that the host is
  # empty. If Docker is present, that assumption no longer holds and the iptables
  # interaction needs deciding before, not during, an install.
  ansible.builtin.stat:
    path: /usr/bin/docker
  register: k3s_docker_binary

- name: Fail if Docker is installed
  tags: [k3s_server]
  ansible.builtin.assert:
    that: not k3s_docker_binary.stat.exists
    fail_msg: >-
      Docker is installed on {{ inventory_hostname }}. This role targets a host with no
      container runtime; k3s brings its own containerd and its iptables rules would land
      on top of Docker's chains. Resolve that interaction deliberately before proceeding.

- name: Download the k3s installer
  tags: [k3s_server]
  # The script from the pinned release's tag, not get.k3s.io: that URL serves master, which
  # moves between plays with no signal, and the script is what runs as root. The checksum is
  # the whole argument -- a copy already on the host that hashes differently is re-fetched,
  # and a fetch that hashes differently fails here.
  # Both pins live in defaults/main.yml; a k3s_version bump finishes the sha256 by hand.
  ansible.builtin.get_url:
    url: "{{ k3s_install_script_url }}"
    dest: /usr/local/bin/k3s-install.sh
    mode: "0755"
    checksum: "sha256:{{ k3s_install_script_sha256 }}"
  become: true

# The audit log directory, audit policy, authentication config, registries.yaml, the unit drop-in
# and the server's flags are the homelab-daniel-box package's (hosts/components/k3s-server): the
# files since H6.4a, the flags since H6.4b. No task here writes them. The package's 50-homelab.conf
# runs a bare `k3s server`, which reads its flags from config.yaml.d, so the installer below passes
# only `server` and a host with no k3s yet needs the package installed first. The package's
# CoreDNS marker is the exception: it belongs after the read in coredns.yml. Both orders on a bare
# host are an attended procedure until H7 replaces this path.

- name: Read the installed k3s binary
  tags: [k3s_server]
  # SUC owns the server's version since H6.3c, so this read only tells a missing binary from a
  # present one. `check_mode: false` because a skipped command leaves this register undefined
  # and the guard consuming it several tasks later is what breaks, not the read.
  ansible.builtin.command:
    cmd: /usr/local/bin/k3s --version
  register: k3s_installed_version
  become: true
  changed_when: false
  failed_when: false
  check_mode: false

- name: Read the packaged k3s server flags
  tags: [k3s_server]
  ansible.builtin.stat:
    path: /etc/rancher/k3s/config.yaml.d/50-homelab.yaml
  register: k3s_server_config_file
  become: true
  when: (k3s_installed_version.rc | default(1)) != 0

- name: Fail if the host package has not installed the k3s server flags
  tags: [k3s_server]
  # The installer passes a bare `server`, so k3s started without this file would come up with
  # the bundled Traefik, servicelb and local-path, an autodetected node IP, no secrets
  # encryption and no audit log. Gated like the install below, so a converged host never reads it.
  ansible.builtin.assert:
    that: k3s_server_config_file.stat.exists
    fail_msg: >-
      /etc/rancher/k3s/config.yaml.d/50-homelab.yaml is missing on {{ inventory_hostname }}.
      Install the homelab-{{ inventory_hostname }} package first: it ships the k3s server's
      flags and every file they name (hosts/components/k3s-server).
  when: (k3s_installed_version.rc | default(1)) != 0

- name: Install the k3s server
  tags: [k3s_server]
  # Runs only when the binary is missing. SUC's k3s-server Plan is the only writer of the
  # server's version (H6.3c), and the package is the only writer of its flags (H6.4b), so an
  # installed host has nothing left for the installer to do. `server` alone: the package's
  # 50-homelab.conf replaces the ExecStart the installer writes.
  ansible.builtin.command:
    cmd: /usr/local/bin/k3s-install.sh
  environment:
    INSTALL_K3S_EXEC: server
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
  become: true
  when: (k3s_installed_version.rc | default(1)) != 0
  changed_when: true
  register: k3s_server_install

- name: Wait for the node to report Ready
  tags: [k3s_server]
  ansible.builtin.command:
    cmd: k3s kubectl wait --for=condition=Ready node --all --timeout=300s
  become: true
  changed_when: false

# ── secrets encryption: arming the flag is only half of it ──────────────────────────────
# --secrets-encryption makes the apiserver encrypt Secrets on WRITE. Everything already in
# etcd stays plaintext until it is rewritten, so a run that stops at the flag leaves exactly
# the exposure the flag was added to close — and every check reads green, because encryption
# genuinely IS enabled. `reencrypt` is the half that rewrites them.
- name: Read the secrets-encryption status
  tags: [k3s_server]
  # RETRIES ARE LOAD-BEARING. `k3s secrets-encrypt`
  # talks to the SUPERVISOR, which starts later than the apiserver — so the preceding
  # `kubectl wait --for=condition=Ready` returns while this endpoint is still refusing, and the
  # first attempt right after the installer restarts k3s fails with `secret-encrypt error ID
  # 21789`. The assert below then fails the play with the flag armed and every existing
  # Secret still plaintext: exactly the half-applied state the assert exists to prevent, caused
  # by reading the status too early rather than by anything being wrong.
  #
  # `failed_when: false` keeps the unreadable case flowing to the assert, which reports it far
  # better than a bare non-zero exit; `until` is what stops a transient from getting there.
  #
  # `check_mode: false` because the three tasks below read this register — two asserts and
  # the rotate-keys `when`. Check mode skips `command` and the skip result carries no
  # `stdout`, so under `--check` this task burns all 12 retries against a skip and fails the
  # play, and the assert that follows would error on the missing `stdout` if it did not.
  # `status` reads the supervisor and writes nothing, so running it for real keeps the dry
  # run's promise.
  ansible.builtin.command:
    cmd: k3s secrets-encrypt status
  register: k3s_secrets_encrypt_status
  become: true
  check_mode: false
  changed_when: false
  failed_when: false
  until: "'Encryption Status:' in k3s_secrets_encrypt_status.stdout"
  retries: 12
  delay: 5
  when: k3s_secrets_encryption | bool

- name: Fail if the secrets-encryption status could not be read
  tags: [k3s_server]
  # Guards the guard. Every task below keys off this output, so an unparseable result must
  # stop the play rather than silently skip the re-encryption and leave the plaintext in
  # place — an unreadable input and "nothing to do" are otherwise indistinguishable.
  ansible.builtin.assert:
    that: "'Encryption Status:' in k3s_secrets_encrypt_status.stdout"
    fail_msg: >-
      `k3s secrets-encrypt status` returned no recognisable status on {{ inventory_hostname }}
      (rc={{ k3s_secrets_encrypt_status.rc }}): {{ k3s_secrets_encrypt_status.stdout | default('') }}
      {{ k3s_secrets_encrypt_status.stderr | default('') }}. Re-encryption is skipped when this
      cannot be read, which would leave existing Secrets in etcd as plaintext while the flag
      reports enabled.
  when: k3s_secrets_encryption | bool

- name: Fail if the encryption flag did not take
  tags: [k3s_server]
  # Separated from the re-encryption below so a flag that never reached the apiserver reports
  # itself, rather than surfacing as a confusing error from rotate-keys several tasks later.
  ansible.builtin.assert:
    that: "'Encryption Status: Enabled' in k3s_secrets_encrypt_status.stdout"
    fail_msg: >-
      secrets-encryption is armed in k3s_server_config but the apiserver reports
      {{ k3s_secrets_encrypt_status.stdout_lines[0] | default('no status') }}. Check that
      /etc/rancher/k3s/config.yaml.d/50-homelab.yaml carries it and that k3s restarted since.
  when: k3s_secrets_encryption | bool

- name: Rotate the encryption key and re-encrypt Secrets already stored in etcd
  tags: [k3s_server]
  # `rotate-keys`, NOT `reencrypt`. On k3s v1.30+ rotate-keys is the whole procedure — it
  # rotates the key and re-encrypts every Secret with it. Bare `reencrypt` belongs to the
  # legacy v1.29 prepare -> rotate -> reencrypt sequence and is INVALID from the initial
  # `start` stage, which is the stage a freshly armed cluster is in. Getting this wrong fails
  # after the control plane has already restarted, leaving encryption enabled and every
  # existing Secret still plaintext — armed, green, and not actually protecting anything.
  #
  # Runs only when the cluster has never completed a re-encryption. The stage advances to
  # reencrypt_finished and stays there, so this fires once on the arming run and skips on
  # every play after it; rewriting every Secret each play would churn etcd at ~5 Secrets/s
  # for nothing.
  ansible.builtin.command:
    cmd: k3s secrets-encrypt rotate-keys
  become: true
  changed_when: true
  when:
    - k3s_secrets_encryption | bool
    - "'reencrypt_finished' not in k3s_secrets_encrypt_status.stdout"
  notify:
    # k3s documents a server restart after the rotation completes. The handler runs at the end
    # of the play, which is after the wait below — so the restart lands on a finished rotation,
    # not a half-done one.
    - Restart k3s
    - Wait for the node to report Ready again

- name: Wait for the re-encryption to finish
  tags: [k3s_server]
  # rotate-keys returns as soon as the request is accepted and re-encrypts in the background,
  # so without this the play moves on while Secrets are still being rewritten — and restarting
  # k3s mid-rotation is how a rotation gets stranded part-done.
  ansible.builtin.command:
    cmd: k3s secrets-encrypt status
  register: k3s_reencrypt_wait
  become: true
  changed_when: false
  until: "'reencrypt_finished' in k3s_reencrypt_wait.stdout"
  retries: 30
  delay: 10
  when:
    # Skipped under `--check`, not opted out of it. The rotate-keys above is the thing this
    # waits on and a dry run only simulates it, so running the wait for real would spend 30
    # retries at 10s on a rotation nobody asked for. Unlike the status read above, nothing
    # downstream reads this register.
    - not ansible_check_mode
    - k3s_secrets_encryption | bool
    - "'reencrypt_finished' not in k3s_secrets_encrypt_status.stdout"

- name: Read the node's registered internal IP
  tags: [k3s_server]
  ansible.builtin.command:
    # Single-quoted deliberately: the command module shlex-splits cmd, which would
    # otherwise strip the quotes around "InternalIP" and leave an invalid jsonpath.
    cmd: >-
      k3s kubectl get node -o
      jsonpath='{.items[0].status.addresses[?(@.type=="InternalIP")].address}'
  register: k3s_node_ip
  become: true
  changed_when: false
  # A read of the node object k3s already holds, so it runs under --check too: skipped, it
  # leaves no stdout and the assert below fails on an address it never read.
  check_mode: false

- name: Fail if the node registered an address the host does not own
  tags: [k3s_server]
  # The failure this catches is silent: pods keep dialling an apiserver endpoint on an
  # address that no longer exists on any interface, while `kubectl` from the host goes on
  # working over 127.0.0.1 and hides it.
  ansible.builtin.assert:
    that: k3s_node_ip.stdout == server_ip
    fail_msg: >-
      k3s registered {{ inventory_hostname }} at {{ k3s_node_ip.stdout }}, but its canonical
      address is {{ server_ip }}. Every pod reaches the apiserver through that address, so
      it must be one the host will keep. Check for a second NIC winning autodetection.

- name: Check the datastore backing the control plane
  tags: [k3s_server]
  ansible.builtin.stat:
    path: /var/lib/rancher/k3s/server/db/etcd
  register: k3s_etcd_dir
  become: true

- name: Fail if the control plane is on SQLite rather than embedded etcd
  tags: [k3s_server]
  ansible.builtin.assert:
    that: k3s_etcd_dir.stat.isdir | default(false)
    fail_msg: >-
      /var/lib/rancher/k3s/server/db/etcd is absent, so --cluster-init did not take and
      k3s is running on SQLite. Recoverable (restart the server with --cluster-init) but
      everything below would be built on the wrong datastore, so stop here.

- name: List kube-system workloads
  tags: [k3s_server]
  ansible.builtin.command:
    cmd: k3s kubectl get pods -n kube-system -o name
  register: k3s_kube_system_pods
  become: true
  changed_when: false
  # A read of the pods k3s already runs, so it runs under --check too: skipped, it leaves no
  # stdout and the assert below errors on the attribute.
  check_mode: false

- name: Fail if the bundled Traefik, servicelb or local-path provisioner is running
  tags: [k3s_server]
  # All three disables are load-bearing: a bundled Traefik would fight the real ingress,
  # klipper-lb would race MetalLB for LoadBalancer Services, and local-path ships
  # a second default StorageClass next to longhorn (see defaults/main.yml).
  ansible.builtin.assert:
    that:
      - "'traefik' not in k3s_kube_system_pods.stdout"
      - "'svclb' not in k3s_kube_system_pods.stdout"
      - "'local-path-provisioner' not in k3s_kube_system_pods.stdout"
    fail_msg: >-
      k3s started with a bundled component the `disable` list in k3s_server_config should
      have kept off — check /etc/rancher/k3s/config.yaml.d/50-homelab.yaml.
