---
# Pin the node's LAN address statically, so k3s does not depend on the gateway's DHCP server
# to start. Two importers: main.yml for the server node, and k3s-bringup.yml's agent-address
# play for daniel-server (#3891). That play runs ON the agent, not through the join play's
# SSH session, because `netplan apply` reconfigures the link such a session rides on.
# templates/netplan-static-address.yaml.j2 has the incident (#3882) and why DHCPv4 is switched
# off rather than kept alongside.
#
# Set `k3s_node_static_link` in host_vars to the link that carries server_ip, and only after
# the gateway reserves that address (the template names why). Emptying it is the way back:
# the file is removed and netplan re-applied, which returns the link to the installer's DHCP.

- name: Pin the node's LAN address in netplan
  tags: [node-address]
  ansible.builtin.template:
    src: netplan-static-address.yaml.j2
    dest: /etc/netplan/90-homelab-static-address.yaml
    mode: "0600"
    owner: root
    group: root
  become: true
  when: k3s_node_static_link | length > 0
  register: k3s_node_static_netplan

- name: Remove the pinned address when no link is named
  tags: [node-address]
  ansible.builtin.file:
    path: /etc/netplan/90-homelab-static-address.yaml
    state: absent
  become: true
  when: k3s_node_static_link | length == 0
  register: k3s_node_static_netplan_removed

# The template's `ignore-carrier: true` keeps the pinned default routes installed with the cable
# out, and with the kernel default (0) the kernel still routes over a linkdown route. The pinned
# metric-100 routes would then beat the metric-600 routes of daniel-server's wifi fallback: the
# static IPv4 route (#4510), and the RA-learned IPv6 route until its lifetime runs out (#4561).
# This key makes route lookups skip the link's routes while it has no carrier. The address stays
# assigned and the local table is not affected, so k3s still binds server_ip.
# The key is per link, not `all`, so cni0, flannel.1 and the VM bridge keep the default.
# A per-link key in sysctl.d persists across a reboot even when the NIC appears after
# systemd-sysctl.service: udev's 99-systemd.rules re-runs systemd-sysctl with the
# `net/ipv{4,6}/conf/<link>` prefix on every net device add.
- name: Stop routing over the pinned link while it has no carrier
  tags: [node-address]
  ansible.posix.sysctl:
    name: "net.{{ item }}.conf.{{ k3s_node_static_link }}.ignore_routes_with_linkdown"
    value: "1"
    sysctl_file: /etc/sysctl.d/90-homelab-static-link.conf
    sysctl_set: true
    state: present
    reload: true
  loop: [ipv4, ipv6]
  become: true
  when: k3s_node_static_link | length > 0

# The link's name is gone by the time this runs, so the live value stays 1 until the next
# reboot. That is harmless: back on DHCP, networkd drops the link's routes on carrier loss.
- name: Remove the linkdown sysctl when no link is named
  tags: [node-address]
  ansible.builtin.file:
    path: /etc/sysctl.d/90-homelab-static-link.conf
    state: absent
  become: true
  when: k3s_node_static_link | length == 0

# The WiFi fallback uplink. It sits here, under the same tag, because the fallback only works
# alongside the pin's ignore_routes_with_linkdown above, and because both plays that pin an
# address import this file. templates/netplan-wifi-fallback.yaml.j2 has the routing argument.
# Emptying `k3s_node_wifi_link` removes the file, the same way back as the pin's.
- name: Refuse a WiFi fallback whose credentials are not in SOPS
  tags: [node-address]
  ansible.builtin.assert:
    that:
      - wifi_ssid is defined
      - wifi_password is defined
    fail_msg: >-
      k3s_node_wifi_link is {{ k3s_node_wifi_link }}, but ansible/vars/secrets.yml holds no
      wifi_ssid or no wifi_password. Add both with sops before applying, or empty the link.
    quiet: true
  when: k3s_node_wifi_link | length > 0

- name: Join the WiFi as a fallback uplink in netplan
  tags: [node-address]
  ansible.builtin.template:
    src: netplan-wifi-fallback.yaml.j2
    dest: /etc/netplan/80-homelab-wifi-fallback.yaml
    mode: "0600"
    owner: root
    group: root
  become: true
  no_log: true
  diff: false
  when: k3s_node_wifi_link | length > 0
  register: k3s_node_wifi_netplan

- name: Remove the WiFi fallback when no WiFi link is named
  tags: [node-address]
  ansible.builtin.file:
    path: /etc/netplan/80-homelab-wifi-fallback.yaml
    state: absent
  become: true
  when: k3s_node_wifi_link | length == 0
  register: k3s_node_wifi_netplan_removed

# Split from the apply for the reason node.yml splits the DNS override's: `generate` parses
# and merges every /etc/netplan/*.yaml and fails without touching the running configuration,
# so a bad merge stops here rather than reconfiguring the node's only uplink.
- name: Validate the merged netplan configuration with the pinned address # noqa no-handler
  tags: [node-address]
  ansible.builtin.command:
    cmd: netplan generate
  become: true
  changed_when: false
  when: >-
    k3s_node_static_netplan.changed or k3s_node_static_netplan_removed.changed
    or k3s_node_wifi_netplan.changed or k3s_node_wifi_netplan_removed.changed

- name: Apply the pinned address and WiFi fallback, or their removal # noqa no-handler
  tags: [node-address]
  ansible.builtin.command:
    cmd: netplan apply
  become: true
  changed_when: true
  when: >-
    k3s_node_static_netplan.changed or k3s_node_static_netplan_removed.changed
    or k3s_node_wifi_netplan.changed or k3s_node_wifi_netplan_removed.changed
