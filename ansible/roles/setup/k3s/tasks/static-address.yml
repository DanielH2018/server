---
# DECIDED: this stays a task file that refuses, for the reason tasks/agent.yml gives: the
# agent-address play in k3s-bringup.yml imports it until H7.20a. Each node's pin is its
# package's: hosts/components/k3s-server on daniel-box, hosts/components/k3s-agent on
# daniel-server.
- name: Refuse the address pin, which the host package owns
  tags: [node-address]
  ansible.builtin.fail:
    msg: >-
      {{ inventory_hostname }}'s LAN address pin ships in homelab-{{ inventory_hostname }}.
      Set k3s_node_static_link in host_vars and let the package install it.
