---
# Pinned upstream versions. Bump deliberately — Longhorn has version-to-version
# upgrade constraints and does not support arbitrary version skips.
#
# k3s is pinned because the install task re-runs the installer whenever k3s_server_args
# changes, and get.k3s.io installs the latest stable unless told otherwise — an unpinned
# reconfigure would silently upgrade the control plane as a side effect of editing a flag.
k3s_version: v1.36.2+k3s1
k3s_metallb_version: v0.14.8
k3s_longhorn_version: v1.7.2

# Flags for the k3s server install:
#   --cluster-init       embedded etcd from day one. Not a one-way door (k3s converts
#                        SQLite->etcd on restart with this flag) but it saves a
#                        control-plane restart if a third node is ever added.
#   --disable=traefik    the bundled Traefik cannot carry the existing config: CrowdSec
#                        Yaegi plugin, Authelia forwardauth, the raw-TCP Terraria
#                        entrypoint, Cloudflare trustedIPs.
#   --disable=servicelb  k3s's klipper-lb fights MetalLB for LoadBalancer Services.
#   --disable=local-storage
#                        the bundled local-path provisioner shipped a SECOND default
#                        StorageClass next to longhorn (two defaults make an unclassed PVC's
#                        placement a k8s-version-dependent coin flip, and local-path data is
#                        node-local + unbackuped). Un-defaulting it with kubectl patch does
#                        not stick — k3s reapplies its bundled manifests on every restart —
#                        so the addon is disabled outright; nothing ever provisioned with it
#                        (checked 2026-08-09: zero local-path PVCs).
#   --node-ip,           pin the node's identity to the host's canonical address instead of
#   --advertise-address  letting k3s autodetect it. daniel-box was multi-homed at install
#                        time — a USB adapter on 10.0.0.153 alongside eno1 on 10.0.0.215,
#                        both with equal-metric default routes — and k3s picked the USB one.
#                        When that adapter vanished on 2026-08-01 the node IP stopped
#                        existing: kubelet logged "failed to validate nodeIP: node IP
#                        '10.0.0.153' not found in the host's network interfaces", and the
#                        kubernetes Service endpoint still pointed at 10.0.0.153:6443, so
#                        every pod got "no route to host" dialling 10.43.0.1 and Longhorn
#                        could not provision a single volume. A control-plane node must not
#                        bind its identity to a removable NIC.
#
#                        CHANGING THIS ON A LIVE CLUSTER IS NOT A RESTART. etcd stores the
#                        member's peer URL, and k3s validates its own membership against it
#                        on startup: "this server is not a member of the etcd cluster.
#                        Found [...=https://<old>:2380], expect: ...=https://<new>:2380".
#                        It then retries forever without signalling ready, so `systemctl
#                        restart k3s` — and any play that triggers one — hangs indefinitely
#                        (the unit is Type=notify with TimeoutStartSec=0). Repair with
#                        `k3s server --cluster-reset`, or wipe and re-run k3s-bringup.yml.
k3s_server_args: >-
  server --cluster-init --disable=traefik --disable=servicelb --disable=local-storage
  --write-kubeconfig-mode 0640
  --node-ip {{ server_ip }} --advertise-address {{ server_ip }}
  --kubelet-arg=allowed-unsafe-sysctls=net.ipv4.conf.all.src_valid_mark,net.ipv4.ip_forward

# ── why two unsafe sysctls are allow-listed ─────────────────────────────────────────────
# net.ipv4.ip_forward (slice-6 B5, wg-easy pulled forward): the wg-easy SERVER routes
# between wg0 and eth0 inside its pod netns, and /proc/sys is ro in a pod even with
# NET_ADMIN (measured — see below), so forwarding can only arrive via the pod spec's
# securityContext.sysctls, which kubelet refuses unless allow-listed. Namespaced, so this
# enables forwarding for pods that ASK, not for the node.
#
# net.ipv4.conf.all.src_valid_mark (slice 4, D11):
# qbittorrent runs inside a WireGuard/Mullvad netns, and wg-quick refuses to bring the tunnel
# up without net.ipv4.conf.all.src_valid_mark=1. Measured on this node: /proc/sys is mounted
# `ro` in a pod even with NET_ADMIN, so the container cannot set it itself; and wg-quick's
# line 240 only ATTEMPTS the write when the value is not already 1, so pre-setting it from the
# pod spec makes wg-quick skip the write and proceed.
#
# Narrow on purpose. This sysctl is NAMESPACED — a pod setting it affects its own network
# namespace and nothing else, so allow-listing it grants no reach over the node or its
# neighbours. "Unsafe" is kubelet's conservative default list, not a risk ranking. The two
# net.ipv6.conf.*.disable_ipv6 sysctls the Compose file also sets are deliberately NOT here:
# a pod's only v6 addresses are ::1 and a link-local, with no route off-link, so there is no
# leak path for them to close.
#
# The alternative was a privileged init container, rejected because slice 4 concentrates
# privilege in exactly one component (roles/k8s/dri-device-plugin) and qbittorrent — which
# handles arbitrary torrent payloads — is the worst place to add a second.
#
# REMOVING THIS NEEDS A MANUAL INSTALLER RE-RUN. The install task above detects an argument
# that was ADDED but not one that was removed; see its comment.

# LoadBalancer addresses. Must sit OUTSIDE the router's DHCP scope, or MetalLB will hand
# out addresses the router also leases.
#
# The ingress VIP is carved out into its own autoAssign: false pool (see
# templates/metallb-pool.yaml.j2) so it can only be claimed by the Service that names it
# in a metallb.io/loadBalancerIPs annotation. Ingress is the one address that appears in
# DNS and, eventually, in the router's port-forward — it must not move because some other
# Service happened to ask for a LoadBalancer first.
#
# k3s_metallb_ingress_vip itself lives in group_vars/all.yml, not here: Pi-hole on
# daniel-server points the *-k8s hostnames at it, so it is consumed on a host that never
# runs this role.
k3s_metallb_pool: 10.0.0.241-10.0.0.250

# One replica until daniel-server joins the cluster (slice 7). More replicas than nodes leaves
# every volume permanently "degraded", which buries a real fault in expected noise — and
# upstream's StorageClass ships 3. Slice 7 raises this to 2, one per node — that is the step
# where replication, and therefore failover, starts existing.
#
# This reaches volumes through the `default-replica-count` setting alone, which only applies
# to StorageClasses that do not pin a count themselves. That is why the role replaces
# upstream's class with files/longhorn-storageclass.yaml, which deliberately omits
# numberOfReplicas — so raising this at slice 7 stays a settings patch.
k3s_longhorn_replica_count: 1

# How often Longhorn lists the B2 backup store, in seconds. Upstream default is 300, which
# cost us an outage: `backup ls` is an S3 LIST, LIST is a Backblaze Class C transaction, and
# the free allowance is 2,500 Class C/day. At 300s that is 288 polls a day, each issuing
# several LISTs (volumes, then backups per volume) — enough to exhaust the cap on its own.
# On 2026-08-02 it did, and B2 then refused every request account-wide: Kopia could not read
# its own repository blob and every backup tier went down for 13h+, with the bucket at
# 6.05/10 GB. Storage was never the constraint.
#
# 3600 cuts that 12x, to 24 polls/day. What it costs is freshness of the backup *list* in the
# Longhorn UI, which is worth nothing here — backups are driven by a recurring job, not by
# someone watching the list. 0 disables polling entirely, but then the UI never reflects
# reality without a manual sync, which is a worse trade than an hour of staleness.
#
# The failure mode this guards against is a ratchet: once the cap trips, Longhorn keeps
# polling and Kopia retries each GetBlob 10 times, so the failed state itself burns
# transactions and eats into the next day's allowance.
k3s_longhorn_backupstore_poll_interval: 3600

# Read-only cluster access for {{ sys_user }}. The admin kubeconfig k3s writes is root:root
# 0640, so every `kubectl` otherwise goes through sudo — which is passworded on this host and
# therefore needs a TTY, blocking anything unattended (diagnostics, health checks, an agent
# reading pod logs). This ServiceAccount closes that gap without handing out cluster-admin:
# it can read, and only read. Writes keep going through Ansible, which escalates properly.
k3s_readonly_sa_name: homelab-readonly
k3s_readonly_sa_namespace: kube-system
k3s_readonly_kubeconfig_server: https://127.0.0.1:6443

# CRD API groups the read-only role can read. The built-in `view` ClusterRole covers none of
# them and nothing here aggregates into it, so a group left off this list means `kubectl get`
# on that resource falls back to sudo. Add a group when a new operator's CRDs need inspecting.
k3s_readonly_crd_api_groups:
  - traefik.io
  - metallb.io
  - longhorn.io

# Longhorn writes under this prefix inside the existing Kopia B2 bucket, so the two tools
# never share a namespace and a lifecycle rule written for one cannot expire the other's
# data. Kopia's own snapshots live at the bucket root.
k3s_longhorn_backup_prefix: longhorn

# Daily volume backup to that target. 03:30 keeps it clear of the Kopia run and of the daily
# secret-rotation cron. 14 retained backups per volume is two weeks of daily recovery points
# — Longhorn backups are incremental at the block level, so the marginal cost of depth here is
# small compared to the first full.
k3s_longhorn_backup_cron: "30 3 * * *"
k3s_longhorn_backup_retain: 14

# Backup-plane heartbeat (templates/longhorn-backup-health.sh.j2). Pushes to a static Kuma
# monitor rather than being polled, because monitor-bridge runs on daniel-server and cannot
# see this cluster.
#
# 30h against a 03:30 daily job: one full day plus 6h of slack, so a single late or slow run
# does not page, while a genuinely missed day does — ~26.5h after the fact. Deliberately looser
# than the interval, because the failure worth catching is "the job stopped", not "the job ran
# 40 minutes late".
k3s_longhorn_backup_max_age_hours: 30

# */10 rather than the Pi crons' */5: this queries the k8s API rather than reading a local file,
# and nothing here changes faster than the daily backup it watches. The Kuma monitor's heartbeat
# interval must stay above this (see the uptime-kuma role) so a dead cron trips the watchdog.
k3s_longhorn_backup_health_cron_minute: "*/10"

# Daily-backup-volume budget, added 2026-08-08 after B2's TRANSACTION cap fired for the second
# time (docs/b2-transaction-cap-monitoring-gaps.md, gap G2 — bytes were monitored, transactions
# were not). B2 exposes no cap-headroom API, so nothing can measure the remaining allowance
# directly; what CAN be watched is the input that grew. Longhorn's daily run went 4 -> 7 -> 15
# backups over three days as slice 4 moved config PVCs into the cluster, and the free tier's
# 2500-transaction Class B/C ceiling stopped absorbing it.
#
# A PROXY, and the health script says so in its message: it counts Longhorn's own daily backups,
# and cannot see kopia's or the b2-usage rclone's share of the same account-wide cap. So the
# budget is deliberately well under what Longhorn alone could consume — the headroom left over is
# for the other two consumers.
#
# 17, set against the 15 volumes in the backup group after the eight slice-4 config volumes were
# returned to it on 2026-08-08 (see below), leaving room for a couple of additions.
#
# It was 10 for a few hours, against the reduced set of 7. Raising it back is NOT silencing the
# warning — this arm counts backups, not what they cost, so at 15/day it would fire every morning
# on a condition deliberately created, and a monitor that pages daily for an expected reason is one
# nobody reads. What detects the thing actually feared — the cap firing again — is **B2 Reachable**,
# which probes b2_authorize_account and reports B2's own `transaction_cap_exceeded`. That is the
# instrument for the re-add; this one stays a growth tripwire and is set above the new normal.
#
# A tripwire on GROWTH, not a derived ceiling: Longhorn's per-backup transaction cost was never
# measured, so no threshold here can come from first principles. What is evidenced is the trend
# (4 -> 7 -> 15 in three days) and where it ended.
#
# Raise it only together with a decision about the cap itself, never to silence the warning.
k3s_longhorn_daily_backup_budget: 17

# Root-disk headroom heartbeat (templates/disk-health.sh.j2). 75, not the fleet's 90: Longhorn's
# storageMinimalAvailablePercentage=25 stops replica scheduling once the disk passes 75% used, so
# this pages at the line where the storage plane starts degrading, not after. Same */10-cron /
# 1200s-Kuma-interval pairing as the backup heartbeat above.
k3s_disk_max_pct: 75
k3s_disk_health_cron_minute: "*/10"

# Bound volumes forced OUT of the backup set, as `namespace/pvcName` — an override for volumes
# whose StorageClass says `longhorn` (back me up) but which should not be. Needed as a separate
# lever because storageClassName is immutable: a volume that must leave the backup set after it is
# bound cannot be moved by editing the class.
#
# EMPTY as of 2026-08-08. It held the eight slice-4 config volumes for a few hours after the B2
# transaction cap fired, and they are back in the backup group now. The exclusion was the right
# call under a live cap and the wrong one to leave standing: it bought quiet by leaving
# sonarr/radarr/prowlarr/bazarr/qbittorrent/jellyfin-config and tdarr-server/tdarr-configs with a
# single frozen 2026-08-08 restore point that is never pruned and never refreshed.
#
# Re-added as a measurement, because the cost could not be looked up. Longhorn's first backup of a
# volume is a full and later ones ship only changed blocks, so the 08-08 spike was plausibly a
# one-time migration cost — but nothing exposed measures it. `Backup.status.size` is the backup's
# LOGICAL volume size, not blocks uploaded (traefik-acme reports 35 -> 48 MB across daily backups of
# a 25 MB volume), and B2 publishes no cap-headroom endpoint, which is gap G2's whole premise. So
# the 03:30 run is the experiment and **B2 Reachable** is the readout. If the cap fires again, the
# eight names go back in here and the answer is a staggered weekly group, not a permanent exclusion.
k3s_longhorn_nobackup_volumes: []

# Slice-6 D8/A1: upstream resolvers the k3s node is pinned to. The node must NEVER resolve
# through the in-cluster Pi-hole VIP — a cold cluster start needs DNS (image pulls, Longhorn,
# MetalLB election) before that VIP exists. Before A1 the node happened to use the ISP's
# DHCP-supplied resolvers, which was cold-boot-safe by accident; the resolved drop-in below
# makes it configuration a router or lease change cannot quietly undo.
k3s_node_dns_upstreams:
  - 1.1.1.1
  - 1.0.0.1
