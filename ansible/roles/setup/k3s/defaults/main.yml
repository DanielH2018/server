---
# Pinned upstream versions. Bump deliberately — Longhorn has version-to-version
# upgrade constraints and does not support arbitrary version skips.
#
# k3s is pinned because the install task re-runs the installer whenever k3s_server_args
# changes, and get.k3s.io installs the latest stable unless told otherwise — an unpinned
# reconfigure would silently upgrade the control plane as a side effect of editing a flag.
k3s_version: v1.37.1+k3s1
# The installer script at that same tag, and its hash. get.k3s.io serves master's copy, which
# can differ from the tag's and moves with no signal, and the script runs as root on both
# nodes. Renovate's k3s manager bumps
# k3s_version; the sha256 is a MANUAL finish on that PR (same class as sops_setup's binary):
#   curl -fsSL "https://raw.githubusercontent.com/k3s-io/k3s/<tag>/install.sh" | sha256sum
k3s_install_script_url: "https://raw.githubusercontent.com/k3s-io/k3s/{{ k3s_version }}/install.sh"
k3s_install_script_sha256: ed01f89fd977bf20ac1516bbebf8370bf3ddbaa55dac8aba610956a4c78cc00b
k3s_metallb_version: v0.16.0
k3s_longhorn_version: v1.12.1

# Where k3s's own stdout/stderr goes on both node types (tasks/unit-logging.yml). journald
# stores nothing below notice on these hosts and every k3s line is info, so without this the
# reason for a crash loop is lost. Read this file, not `journalctl -u k3s`.
k3s_log_file: /var/log/k3s.log

# Flags for the k3s server install:
#   --cluster-init       embedded etcd from day one. Not a one-way door (k3s converts
#                        SQLite->etcd on restart with this flag) but it saves a
#                        control-plane restart if a third node is ever added.
#   --disable=traefik    the bundled Traefik cannot carry the existing config: CrowdSec
#                        Yaegi plugin, Authelia forwardauth, the raw-TCP Terraria
#                        entrypoint, Cloudflare trustedIPs.
#   --disable=servicelb  k3s's klipper-lb fights MetalLB for LoadBalancer Services.
#   --disable=local-storage
#                        the bundled local-path provisioner shipped a SECOND default
#                        StorageClass next to longhorn (two defaults make an unclassed PVC's
#                        placement a k8s-version-dependent coin flip, and local-path data is
#                        node-local + unbackuped). Un-defaulting it with kubectl patch does
#                        not stick — k3s reapplies its bundled manifests on every restart —
#                        so the addon is disabled outright.
#   --node-ip,           pin the node's identity to the host's canonical address instead of
#   --advertise-address  letting k3s autodetect it. A multi-homed host with equal-metric
#                        default routes lets k3s pick a removable NIC (daniel-box's USB
#                        adapter). When that NIC vanishes the node IP stops existing: kubelet
#                        fails "validate nodeIP: node IP ... not found in the host's network
#                        interfaces", and the kubernetes Service endpoint still points at the
#                        dead address, so every pod gets "no route to host" dialling
#                        10.43.0.1 and Longhorn cannot provision a single volume. A
#                        control-plane node must not bind its identity to a removable NIC.
#
#                        CHANGING THIS ON A LIVE CLUSTER IS NOT A RESTART. etcd stores the
#                        member's peer URL, and k3s validates its own membership against it
#                        on startup: "this server is not a member of the etcd cluster.
#                        Found [...=https://<old>:2380], expect: ...=https://<new>:2380".
#                        It then retries forever without signalling ready, so `systemctl
#                        restart k3s` — and any play that triggers one — hangs indefinitely
#                        (the unit is Type=notify with TimeoutStartSec=0). Repair with
#                        `k3s server --cluster-reset`, or wipe and re-run k3s-bringup.yml.
k3s_server_args: >-
  server --cluster-init --disable=traefik --disable=servicelb --disable=local-storage
  --write-kubeconfig-mode 0640
  --node-ip {{ server_ip }} --advertise-address {{ server_ip }}
  --kubelet-arg=allowed-unsafe-sysctls=net.ipv4.conf.all.src_valid_mark,net.ipv4.ip_forward
  {% if k3s_secrets_encryption %}--secrets-encryption{% endif %}
  {% if k3s_etcd_expose_metrics %}--etcd-expose-metrics{% endif %}
  {% if k3s_audit_log_enabled %}
  --kube-apiserver-arg=audit-policy-file={{ k3s_audit_policy_path }}
  --kube-apiserver-arg=audit-log-path={{ k3s_audit_log_path }}
  --kube-apiserver-arg=audit-log-maxage={{ k3s_audit_log_maxage }}
  --kube-apiserver-arg=audit-log-maxbackup={{ k3s_audit_log_maxbackup }}
  --kube-apiserver-arg=audit-log-maxsize={{ k3s_audit_log_maxsize }}
  {% endif %}
  --kube-apiserver-arg=authentication-config={{ k3s_authentication_config_path }}

# ── why none of the arguments above is quoted ───────────────────────────────────────────
# The install task's `when:` compares `k3s_server_args.split()` against the installed unit
# with single quotes STRIPPED, because the installer single-quotes every argument it writes.
# A quoted value here — `--kube-apiserver-arg='audit-log-path=…'` — therefore never matches
# its own installed form, so the comparison reports a missing argument on every play and
# reinstalls k3s each time, restarting the control plane. None of these values contains a
# space, so none of them needs quoting. Keep it that way.
# `ansible/tests/setup/test_k3s_control_plane_hardening.py` fails if a quote reappears.

# ── secrets encryption at rest (G1) ─────────────────────────────────────────────────────
# Off is k3s's default, which leaves every Secret stored in etcd as plaintext — and
# `etcd-snapshot-offbox.sh` then ships a daily copy of that plaintext to R2, so the
# credentials SOPS protects on the git side sit unprotected in an object store. This flag
# makes the apiserver encrypt Secrets on WRITE with a generated AES-CBC key.
#
# ARMING THIS IS ONLY HALF THE JOB. Existing Secrets stay plaintext in etcd until they are
# rewritten; the role runs `k3s secrets-encrypt reencrypt` for that (see server.yml), which
# needs root on the control-plane host.
#
# The key lives on the same disk as etcd, so this defends against a stolen snapshot or a
# stolen disk, not against root on daniel-box. The snapshot is the copy that leaves the
# house, which is the exposure that matters here.
#
# ROLLBACK: set false, then re-run the installer BY HAND. The install task detects an
# argument that was added, never one that was removed — the same caveat the allow-listed
# sysctls carry above.
k3s_secrets_encryption: true

# ── the API server trusts Authelia as an OIDC provider ─────────────────────────────────
# One flag pointing at a FILE, and the file is the point. They exist so Headlamp can log a
# person in instead of browsing the cluster as its own ServiceAccount: Headlamp forwards the
# browser's `id_token` and the API SERVER is what accepts or rejects it, so the trust has to
# be configured here rather than in the workload's role.
#
# WHY A FILE RATHER THAN `--oidc-*` FLAGS. Authelia derives `iss` from the host the
# authorization request arrived on, and `--oidc-issuer-url` takes exactly one value. The flag
# path could therefore trust `auth.local.<domain>` or `auth.<domain>`, never both, and
# Headlamp's login would work on only one of its two hostnames: a public-route login comes
# back from Authelia with `iss: https://auth.<domain>` and the API server refuses it.
# `AuthenticationConfiguration.jwt` is a list of issuers, which is the only mechanism
# kube-apiserver offers for more than one.
#
# THE TWO ARE MUTUALLY EXCLUSIVE: "This flag is mutually exclusive
# with the --oidc-* flags if the file configures the JWT Token authenticator"
# (kube-apiserver flag reference). Passing both makes the API server refuse to start, which
# on this Type=notify unit is the indefinite hang described above, not an error.
#
# ADDING THESE RESTARTS THE CONTROL PLANE. The install task above re-runs get.k3s.io when
# k3s_server_args gains an argument, and the installer rewrites the unit and restarts k3s.
# That is a routine event on this host, but it is not a no-op, and
# `k3s-bringup.yml` is in `_BROAD_MANUAL_PREFIXES` (deploy_changes.py) precisely so nothing
# automated ever applies it.
#
# A WRONG ISSUER VALUE DOES NOT LOCK YOU OUT, and the failure mode is worth stating exactly
# because it is easy to over-fear. An unreachable or misspelled issuer leaves the API server
# up and serving, with OIDC logins failing and nothing else affected. The root kubeconfig
# authenticates by CLIENT CERTIFICATE, which this never touches; so do every ServiceAccount
# and every in-cluster controller.
#
# A MALFORMED FILE IS A DIFFERENT MATTER, and this is the one way the config file is riskier
# than the flags would be. The API server VALIDATES this file at startup and refuses to
# start when it fails validation, so a schema error wedges the node: the k3s unit is
# Type=notify with TimeoutStartSec=0, so `systemctl restart k3s` hangs indefinitely rather
# than failing — the same hang the --node-ip comment above describes. The validation is
# stricter than it looks; `prefix` alone has two rules the flag path did not have (see the
# template). `ansible/tests/setup/test_k3s_oidc_trusts_authelia.py` renders and shape-checks
# it for that reason. Read `/var/log/k3s.log` (not `journalctl -u k3s`, which keeps none of
# k3s's own lines — see k3s_log_file) before walking away.
#
# ROLLBACK IS BY HAND. The install task's guard detects an argument that was ADDED and never one
# that was REMOVED, so deleting the one flag below adds nothing, the guard reads false and the
# unit keeps it. Re-run /usr/local/bin/k3s-install.sh with the new INSTALL_K3S_EXEC. Do NOT
# hand-edit the unit to "help" this along.

# BOTH Authelia issuers, trusted at once, which is the whole reason this is a file. The `iss`
# each name mints is measured, not assumed: `/.well-known/openid-configuration`
# returns exactly these two strings on the two hostnames, and both answer 200 from daniel-box
# (the API server fetches JWKS from each URL itself, so host reachability is a requirement and
# not an incidental).
#
# REACHABILITY AT APISERVER-START TIME IS THE ONE THAT MATTERS, AND THE APISERVER STARTS
# FIRST. kube-apiserver builds the JWT authenticator by fetching each issuer's
# `/.well-known/openid-configuration` at startup, but both URLs are served by Authelia behind
# Traefik — workloads this same apiserver has to schedule. Every boot therefore races, and
# `oidc.go` retries every 10s until one succeeds, which is why the race normally costs nothing.
#
# THE RETRY LOOP CANNOT RECOVER FROM A 421, and that is the failure to recognise.
# Traefik's SNICheck pins a connection's TLS-options name at handshake time, so a connection
# opened while Traefik is still reconciling routes is answered 421 for as long as it lives.
# Go's HTTP client reuses it, so the apiserver redials never. After a reboot the symptom is
# `oidc.go:433 oidc authenticator: initializing plugin` errors in `/var/log/k3s.log`, unbroken,
# walking DNS `Try again` -> `no route to host` -> `404 page not found` -> `421 Misdirected
# Request` as the edge comes up around the two pinned connections. One connection per issuer
# below: `auth.local.<domain>` over the VIP, `auth.<domain>` out through Cloudflare and back to
# daniel-box's own global IPv6. The authenticator never initialises, so Headlamp login stays
# dead while client-cert and ServiceAccount auth carry on untouched — which is why nothing pages.
#
# RECOVERY IS A SOCKET CLOSE, not a k3s restart: the apiserver redials on its next 10s tick.
# CLOSE BOTH — there is one connection per issuer, and a filter written for the VIP misses the
# public one entirely, which leaves half the errors running. `sudo ss -tnp | grep k3s-server`
# on daniel-box names them: one to the ingress VIP on 443, one from the host's own global IPv6
# to Cloudflare on 443. This is reasoned from the retry loop above and NOT yet measured —
# confirm the `oidc.go:433` lines stop in `/var/log/k3s.log` and a Headlamp login mints a
# token. A k3s restart also works and is the heavier option on a Type=notify unit with
# `TimeoutStartSec=0`.
#
# Order does not matter; kube-apiserver selects the entry by the token's `iss`. Duplicates are
# a validation error, so the two must stay distinct. NO TRAILING SLASH on either: the
# comparison against `iss` is exact.
k3s_oidc_issuer_urls:
  - "https://auth.local.{{ domain }}"
  - "https://auth.{{ domain }}"
# Where the file above is written, read by the apiserver ONCE at startup. Under
# /var/lib/rancher/k3s/server alongside the audit policy, which is root-only and on the same
# disk as etcd.
k3s_authentication_config_path: /var/lib/rancher/k3s/server/authentication-config.yaml
# The audience. Authelia's default `id_token_audience_mode: specification` puts only the
# client id in `aud`, so this is the Authelia client id, and one client cannot serve two
# audiences here.
k3s_oidc_client_id: headlamp
# Authelia hydrates NEITHER of the two claims below into the ID token by default — the
# provider docs call the `claims_policies.id_token` list "claims automatically copied to the
# ID Token in addition to the standard ID Token claims". Headlamp forwards the ID token, so
# the Authelia client MUST name a claims policy carrying both, or this API server sees a
# token with no username claim and rejects it.
k3s_oidc_username_claim: preferred_username
k3s_oidc_groups_claim: groups
# There is NO `k3s_oidc_username_prefix` here, and its absence is deliberate. The
# flag path took `-` as a sentinel meaning "no prefix", because kube-apiserver otherwise
# prefixed the username with the issuer URL plus `#` for any claim other than `email`. The
# structured config does no implicit prefixing and honours no sentinel: `prefix` is required
# whenever `claim` is set, and `""` disables it. The template writes that empty string
# literally; a variable holding `-` would produce usernames prefixed with a hyphen, which is
# the same class of bug the sentinel existed to avoid.
#
# Groups DO carry a prefix, for the opposite reason: it is what keeps an Authelia group name
# from ever being read as a built-in `system:` group. `headlamp_k8s_oidc_group`
# (roles/k8s/headlamp/defaults) is this prefix plus the Authelia group and must agree with it;
# ansible/tests/setup/test_k3s_oidc_trusts_authelia.py fails when the two drift, because the
# symptom is a login that succeeds onto an empty dashboard with nothing logged.
k3s_oidc_groups_prefix: "oidc:"

# ── apiserver audit logging (G2/G3) ─────────────────────────────────────────────────────
# k3s writes no audit log by default, so there is no record of API writes at all. This
# cluster auto-approves `kubectl exec`, `cp` and `port-forward` for agent sessions, and
# several of those containers mount Longhorn PVCs — the controls that make that acceptable
# are all preventive, with nothing underneath them to answer "which session did this".
#
# ORDER IS LOAD-BEARING. The apiserver reads the policy file at STARTUP and refuses to come
# up if it is missing, so the log directory and the policy must both exist before the
# installer rewrites the unit and restarts k3s. server.yml creates them immediately before
# the install task for exactly that reason; moving them after it wedges the control plane on
# the one node that also serves LAN DNS.
#
# ROLLBACK: same as secrets encryption — set false and re-run the installer by hand.
#
# k3s_audit_log_enabled, k3s_audit_log_dir and k3s_audit_log_path live in
# inventory/group_vars/all.yml, NOT here: loki-homelab's promtail config reads them to tail
# the file, and a role default is invisible to another role's templates. Same reason
# k3s_metallb_ingress_vip sits there.

# The policy the apiserver reads at startup. Role-local because only this role writes it.
k3s_audit_policy_path: /var/lib/rancher/k3s/server/audit.yaml

# Rotation, and it is not optional. An unrotated audit log grows without bound on the disk
# `disk-health.sh` watches at k3s_disk_max_pct — a Metadata-level policy on a cluster this
# chatty produces a steady stream of entries, so the apiserver's own rotation is what keeps
# the control-plane disk from filling. 5 x 100 MiB bounds the log at ~500 MiB.
k3s_audit_log_maxage: 30       # days a rotated file is kept
k3s_audit_log_maxbackup: 5     # rotated files kept
k3s_audit_log_maxsize: 100     # MiB before rotating

# ── why two unsafe sysctls are allow-listed ─────────────────────────────────────────────
# net.ipv4.ip_forward (wg-easy): the wg-easy SERVER routes
# between wg0 and eth0 inside its pod netns, and /proc/sys is ro in a pod even with
# NET_ADMIN (measured — see below), so forwarding can only arrive via the pod spec's
# securityContext.sysctls, which kubelet refuses unless allow-listed. Namespaced, so this
# enables forwarding for pods that ASK, not for the node.
#
# net.ipv4.conf.all.src_valid_mark (qbittorrent):
# qbittorrent runs inside a WireGuard/Mullvad netns, and wg-quick refuses to bring the tunnel
# up without net.ipv4.conf.all.src_valid_mark=1. Measured on this node: /proc/sys is mounted
# `ro` in a pod even with NET_ADMIN, so the container cannot set it itself; and wg-quick's
# line 240 only ATTEMPTS the write when the value is not already 1, so pre-setting it from the
# pod spec makes wg-quick skip the write and proceed.
#
# Narrow on purpose. This sysctl is NAMESPACED — a pod setting it affects its own network
# namespace and nothing else, so allow-listing it grants no reach over the node or its
# neighbours. "Unsafe" is kubelet's conservative default list, not a risk ranking. The two
# net.ipv6.conf.*.disable_ipv6 sysctls the Compose file also sets are deliberately NOT here:
# a pod's only v6 addresses are ::1 and a link-local, with no route off-link, so there is no
# leak path for them to close.
#
# A privileged init container is the rejected alternative: privilege is concentrated in exactly
# one component (roles/k8s/dri-device-plugin) and qbittorrent — which handles arbitrary torrent
# payloads — is the worst place to add a second.
#
# REMOVING THIS NEEDS A MANUAL INSTALLER RE-RUN. The install task above detects an argument
# that was ADDED but not one that was removed; see its comment.

# LoadBalancer addresses. Must sit OUTSIDE the router's DHCP scope, or MetalLB will hand
# out addresses the router also leases.
#
# The ingress VIP is carved out into its own autoAssign: false pool (see
# templates/metallb-pool.yaml.j2) so it can only be claimed by the Service that names it
# in a metallb.io/loadBalancerIPs annotation. Ingress is the one address that appears in
# DNS and, eventually, in the router's port-forward — it must not move because some other
# Service happened to ask for a LoadBalancer first.
#
# k3s_metallb_ingress_vip itself lives in group_vars/all.yml, not here: Pi-hole on
# daniel-server points the *-k8s hostnames at it, so it is consumed on a host that never
# runs this role.
k3s_metallb_pool: 10.0.0.241-10.0.0.250

# Two replicas, one per node, which is what makes replication, and therefore failover, exist.
# More replicas than nodes would leave every volume permanently "degraded" — upstream's
# StorageClass ships 3.
#
# This reaches volumes through the `default-replica-count` setting alone, which only applies
# to StorageClasses that do not pin a count themselves. That is why the role replaces
# upstream's class with files/longhorn-storageclass.yaml, which deliberately omits
# numberOfReplicas — so changing this stays a settings patch.
k3s_longhorn_replica_count: 2

# How hard Longhorn checks a snapshot disk file against its recorded checksum. Upstream's
# default is `fast-check`, which re-hashes only when the file is unhashed or its mtime moved —
# and upstream states plainly that "filesystem-unaware corruption cannot be detected" in that
# mode (longhorn-manager v1.12.1, types/setting.go). Bit rot does not move mtime, so the exact
# failure this setting exists to catch goes uncovered in that mode.
#
# `enabled` hashes every snapshot disk file on the snapshot-data-integrity-cronjob schedule
# (`0 0 */7 * *` here — the 1st, 8th, 15th, 22nd and 29th). That is CPU and disk-read work on a
# two-node cluster whose storage control plane was OOM-killed once under memory pressure
# (#1243), so the cost was measured before this was kept. DECIDED: keep `enabled`. MEASURED
# 2026-09-11 on a fire forced with the `-e` override below, 73 snapshots across 44 volumes
# (50 GB of replica data per node): the run took 6m21s and read ~24 GB per node at 40-57 MB/s.
# The hashing CPU is instance-manager's own, 0.21 → 0.37-0.50 cores over the window; node-level
# CPU is not attributable, because daniel-box swings 1.6-2.4 cores across any 7-minute window.
# instance-manager's working set did not move (1.44 GB before, during and after), MemAvailable
# never dropped below 17.5 GB, and no Longhorn pod restarted — the memory pressure #1243 warns
# about did not appear. Six minutes every seventh day at 00:00 UTC is acceptable. The numbers
# and the queries that produced them are on #1364.
k3s_longhorn_snapshot_data_integrity: enabled

# When the integrity check above runs. Upstream's default, restated here so the schedule is a
# variable rather than a value only the cluster knows: `0 0 */7 * *` is a DAY-OF-MONTH step on
# the manager's clock (UTC), so it fires at 00:00 on the 1st, 8th, 15th, 22nd and 29th, not
# "every seven days". To fire a check early, override it at apply time with a one-shot daily
# minute, then re-apply without the override to restore it:
#   uv run ansible-playbook ansible/k3s-bringup.yml --tags longhorn \
#     -e k3s_longhorn_snapshot_data_integrity_cronjob='55 12 * * *'
# Never use a repeating `*/N` for it: a full-hash schedule stranded by a dead session risks the
# memory pressure that OOM-kills the storage control plane.
# Same DataEngineSpecific JSON-map shape as the mode above.
k3s_longhorn_snapshot_data_integrity_cronjob: "0 0 */7 * *"

# Whether joined agent nodes participate in Longhorn replica scheduling, so daniel-server holds
# the second replica of every volume. The join window keeps it off: agent_verify patches
# allowScheduling:false and asserts zero replicas landed.
k3s_agent_longhorn_scheduling: true

# How often Longhorn lists the B2 backup store, in seconds. Upstream default is 300, which
# exhausts the allowance on its own: `backup ls` is an S3 LIST, LIST is a Backblaze Class C
# transaction, and the free allowance is 2,500 Class C/day. At 300s that is 288 polls a day,
# each issuing several LISTs (volumes, then backups per volume). Once the cap trips, B2 refuses
# every request account-wide and every backup tier goes down, whatever the bucket holds.
#
# 3600 cuts that 12x and fixes the Class C math — but each poll ALSO GETs the .cfg of every
# volume and every retained backup, and those are Class B (same 2,500/day cap, counted
# separately). That read count grows with retention: ~100-150 cfg GETs/poll x 24 polls against a
# 14-day daily tier reach the Class B cap by midday with zero restore traffic — surfacing as
# the restore drill failing with a masked "cannot find volume.cfg in backupstore" (a cap 403,
# not data loss). 0 disables polling entirely:
# Longhorn still syncs a volume's backup list right after each backup completes, so the
# only loss is UI staleness between nightlies (manual sync: Backup -> Sync). That also
# removes the poll's LISTs from Class C.
#
# The failure mode 0 guards against is a ratchet: once the cap trips, every BackupVolume
# controller retries its denied LISTs (~60/min observed), so the failed state
# itself burns transactions and eats into the next day's allowance.
k3s_longhorn_backupstore_poll_interval: 0

# Back up detached volumes too. pi-peer-backup-data is mounted only for the minutes its
# nightly pull CronJob runs, so at the 03:30 daily-backup tick it is detached — and with
# this off, Longhorn silently skips it, leaving the WireGuard peer copy with no off-site
# backup. "true" attaches such a volume in maintenance mode for the
# backup and detaches it after; the attach is brief and it is the only detached
# default-group volume, so the global scope costs nothing.
k3s_longhorn_backup_detached_volumes: "true"

# Block size, in MiB, for volumes created from here on. Every B2 cost Longhorn incurs is priced
# PER BLOCK: pruning a backup issues ~1.28 Class C LISTs per stored block (it walks the volume's
# whole block tree), backing up issues one Class B HeadObject per changed block, and restoring
# issues one Class B GET per block. Block size is the only lever that moves all three at once.
#
# Upstream's default is 2. At that size the store held 3,472 blocks, so a
# full-cluster restore would need ~3,472 Class B against a 2,500/day free-tier cap — 139%, which
# means a total-loss recovery CANNOT complete in a day. At 16 that is ~434 blocks, about a sixth
# of one day's allowance, and disaster recovery stops being rationed by transactions.
#
# NEW VOLUMES ONLY, and this is the trap: the field is immutable per volume, so every PVC created
# while this reads 2 is locked at 2 until it is destroyed and recreated. Flipping it costs nothing
# and changes nothing that already exists — the saving accrues only as volumes are replaced.
#
# Longhorn accepts 2 or 16 and nothing between. Governed by the SETTING rather than the
# StorageClass on purpose: a StorageClass parameter beats the setting and its parameters are
# immutable, which is the trap `numberOfReplicas` springs (see
# files/longhorn-storageclass.yaml and ansible/tests/longhorn/test_longhorn_storageclass.py).
k3s_longhorn_backup_block_size: 16

# Memory REQUEST only (no limit) for longhorn-manager and the csi-* sidecar Deployments.
# Upstream's deploy/longhorn.yaml ships every one of them with an empty `resources: {}`, which
# gives BestEffort QoS and oom_score_adj 1000 — the worst possible score, so the kernel eats the
# storage control plane first under any memory pressure. Measured at the OOM kill:
# longhorn-manager held 137 MB anon-rss and a csi-* sidecar 97 MB, while instance-manager
# (already Burstable) survived untouched. A REQUEST alone moves the pod to Burstable and drops
# oom_score_adj without adding a new kill path — a LIMIT set too low would trade "killed by
# badness" for "killed by cgroup cap". Headroom is roughly double the measured
# RSS on both: enough to absorb ordinary growth without inflating node allocatable so far that
# real pressure elsewhere goes unschedulable.
k3s_longhorn_manager_memory_request: 256Mi
k3s_longhorn_csi_sidecar_memory_request: 192Mi

# Restore drill — proves the backups come BACK, which nothing else here checks. The heartbeat
# watches Longhorn's own objects, and none of them can tell you whether the bytes in B2 restore.
#
# ROTATES over every volume declared for backup — one per night, least-recently-attempted first,
# which is a full cycle in as many days as there are candidates. Empty means
# rotate; setting this to a PVC name pins the drill to that one volume, which is a debugging
# lever and not the normal mode. To drill one volume ONCE, do not set this: pass the PVC to the
# script (`sudo /usr/local/bin/longhorn-restore-drill.sh <pvc>`, or RESTORE_DRILL_PIN=<pvc>),
# which overrides this value for that run only.
#
# Rotation is affordable because of the block size (k3s_longhorn_backup_block_size): the whole B2
# candidate set is ~250 blocks, so one night's drill costs 4-85 Class B (a GET per block) against
# the 2,500/day cap, and a 25-day cycle costs less than a single day's measured baseline of
# 253-363.
#
# R2 volumes are IN the rotation. Drilling an R2 volume proves Cloudflare and says nothing about
# B2, the store under a transaction cap, but each target is proven on the nights its own volumes
# come up. R2 restores are free (10M Class B/month, zero egress), so those four volumes cost
# nothing on the axis that is scarce.
k3s_longhorn_restore_drill_pvc: ""
# Fallback only, for a volume whose kubernetesStatus carries no namespace. The rotation reads the
# namespace off each volume, because candidates are not all in one place.
k3s_longhorn_restore_drill_namespace: homelab
# Skip a candidate whose actualSize exceeds this. Bounds one night's egress and wall-clock so a
# slow restore cannot read as a failed one. A backed-up volume excluded here is undrilled, and the
# drill publishes it to `excluded_oversize` so the backup heartbeat pages naming it. Raise
# this and the timeout below together.
# DECIDED: 4 GiB, raised from 2 GiB on 2026-08-24. The old value's rationale said it "excludes
# NOTHING today — the largest candidate is valheim-config at ~1.3 GB", and both halves had gone
# wrong: valheim-config was 2.83 GiB of actualSize and HAD been excluded (25 volumes declared
# backed-up, 24 in the candidate file), and the 1.3 GB figure was its B2-STORED size while this cap
# is applied to actualSize — the wrong quantity was compared when the cap was first set. Compare
# `actualSize` from the Volume CR, never the stored-block total from `probe.py b2-longhorn`.
# Cost of the raise is ~100 Class B GETs and ~1.34 GB egress once per 25-night rotation.
k3s_longhorn_restore_drill_max_actual_bytes: 4294967296
# A restored volume that mounts but is EMPTY is the failure mode this floor catches: an empty
# filesystem passes every check that only asks whether the mount succeeded. Deliberately low —
# this asserts "real data came back", not any particular size, so it does not need revisiting
# when the service grows or shrinks. tdarr-configs holds five JSON files, 1007 bytes in total,
# the whole of Tdarr's /app/configs, and must pass. The drill's `files > 0`
# check is what rejects an empty mount; this floor only has to reject files that hold nothing.
k3s_longhorn_restore_drill_min_bytes: 1
# PVCs whose restore legitimately comes back with no files, so the two content assertions above
# are waived for them and nothing else is. Everything the drill can still prove for such a volume
# it does prove: the restore completes, the probe pod mounts it and reports. n8n-files is here
# because n8n writes to /files only when a workflow does and none has — its actualSize has stayed
# within 51.05-51.77 MB (bare ext4 metadata on a 1 GiB volume), and the drill restores it to
# files=0.
# A volume that starts holding data DOES leave the waiver behind, but the drill no longer depends
# on anyone noticing: the ceiling below withdraws it. Remove the name anyway once that happens —
# the list is a claim about the volume, and the waiver is dead weight once the content assertions
# can pass.
k3s_longhorn_restore_drill_empty_ok_pvcs:
  - n8n-files
# The waiver above applies only while the SOURCE volume's actualSize stays under this. Without
# the ceiling the waiver applies by name alone, whatever the volume held, so an empty restore of
# a volume that had filled up would still stamp success and check 8 would read it as
# restore-proven.
# 60 MiB: the recorded bare-ext4 band for the one declared volume is 51.05-51.77 MB, so this
# clears the observed noise by ~11 MB while withdrawing the waiver
# from anything that could plausibly be real data. Raising it widens the band of real content a
# `files=0` restore would still be waived for, which is the whole thing this bounds.
k3s_longhorn_restore_drill_empty_ok_max_actual_bytes: 62914560
k3s_longhorn_restore_drill_image: busybox:stable@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
# A drill restores 51 MB in ~21s and the rotation admits volumes 25x that size: a slow restore
# is not itself a failure, but a hung one must not leave a
# Volume CR attached forever, and a timeout fires as a restore failure that nothing distinguishes
# from a real one. Keep this above what k3s_longhorn_restore_drill_max_actual_bytes can take.
# DECIDED: 2700s, raised from 1800s with the cap on 2026-08-24 — and this is NOT free to raise
# further. The 04:10 cron is placed to clear the 05:15 manifest-prune window, which would otherwise
# see the drill's transient restore-drill-* objects, so the timeout ceiling is 05:15 minus 04:10
# minus a margin. 2700s ends by 04:55. A larger cap therefore cannot simply buy more time here:
# past ~3900s the two windows collide and the cron must move first.
k3s_longhorn_restore_drill_timeout_s: 2700
k3s_longhorn_restore_drill_stamp_dir: /var/lib/longhorn-restore-drill
# 04:10 nightly: after the daily tier's 03:30 run and clear of every weekly shard's 04:30, so the
# drill never contends with a backup in flight. Also clear of the 05:15 manifest-prune window,
# which would otherwise see the drill's transient restore-drill-* objects.
k3s_longhorn_restore_drill_cron: "10 4 * * *"
# How stale the drill's last success may be before the heartbeat calls it out. Nightly cadence, so
# this allows two consecutive failed or skipped nights — short enough that a drill which has
# silently stopped is noticed within the week, long enough not to page on a single bad night.
# Cadence and this number move TOGETHER: check 7's stamp age is the drill's only alert path
# (`logger` and stderr reach nobody), so raising the cadence without lowering this buys nothing.
k3s_longhorn_restore_drill_max_age_days: 3
# Coverage slack, on top of one full rotation cycle. Check 8 derives the window as
# (candidate count + this) days, so it tracks the fleet automatically instead of going stale each
# time a volume joins the backup set. A volume that fails every time it comes up stays invisible
# to check 7 — the global stamp goes green on the other 24 — and this is what catches it.
# It also absorbs the drill's retry: a failed attempt is re-drilled the next night, and
# that night is one the rotation does not advance on, so a cycle runs (candidate count + volumes
# currently failing) nights. At 5 the window stays correct until 5 volumes fail at once — a
# state check 8 is already paging about on its own terms.
k3s_longhorn_restore_drill_coverage_slack_days: 5

# How far back checks 9 and 10 of longhorn-backup-health.sh read the `longhorn-trim` and
# `b2-deletions` journal tags. Both crons run daily, so 26h holds the last run under either DST
# offset with a couple of hours of jitter to spare. It is also how long a reported fault stays
# RED: the trim arm reads only the NEWEST run, so a fixed trim goes green on its next run
# whatever this is, while an UNPRICED deletion — a permanent event, not a state — ages out after
# this window.
#
# Check 10 makes the window load-bearing twice over. It alarms when the window holds NO
# line from a cron, which is only a fault because 26h exceeds one 24h cron period — below one
# period the check disables that arm rather than page on normal silence. The same 26h is the
# grace for a freshly installed cron, so there is no second tunable to keep in step.
k3s_longhorn_cron_evidence_window_hours: 26

# How many volume engines Longhorn upgrades per node once the manager moves to a new version.
# Upstream ships 0, which means engines NEVER follow the manager — after a version bump every
# volume keeps running the old engine image until someone walks the UI. Across the v1.7.2 ->
# v1.12.1 ladder (docs/longhorn-upgrade.md) that lag would compound over five hops, and a
# manager more than one engine version ahead is outside what upstream tests. 3 upgrades the
# healthy volumes a few at a time rather than all at once; Longhorn skips any volume that
# is degraded, so this cannot stampede a rebuild.
k3s_longhorn_concurrent_engine_upgrade: 3

# What Longhorn does with a pod whose node goes down while the pod holds an RWO volume.
# `do-nothing` is upstream's default: the pod stays Terminating, so its volume stays attached
# to the dead node, until an operator force-deletes it. The rejected values
# (`delete-statefulset-pod`, `delete-deployment-pod`,
# `delete-both-statefulset-and-deployment-pod`) have Longhorn force-delete the pod and move the
# volume to the survivor unattended.
# DECIDED: `do-nothing` — keep the stateful failover a human step on this two-node cluster.
# There is no fencing and no third node, so Longhorn cannot tell a dead daniel-server from one
# cut off from daniel-box: an automatic delete on a partition would run a second copy of the
# workload against the other replica. The survivor also lacks the memory for the lost node's
# whole load until the shed set is scaled to zero (docs/break-glass.md, *daniel-server is
# dead*), and that step is manual too. Stateless pods still reschedule on their own. Revisit
# when a third node or a fencing mechanism exists.
k3s_longhorn_node_down_pod_deletion_policy: do-nothing

# Read-only cluster access for {{ sys_user }}. The admin kubeconfig k3s writes is root:root
# 0640, so every `kubectl` otherwise goes through sudo — which is passworded on this host and
# therefore needs a TTY, blocking anything unattended (diagnostics, health checks, an agent
# reading pod logs). This ServiceAccount closes that gap without handing out cluster-admin:
# it can read, and only read. Writes keep going through Ansible, which escalates properly.
k3s_readonly_sa_name: homelab-readonly
k3s_readonly_sa_namespace: kube-system
k3s_readonly_kubeconfig_server: https://127.0.0.1:6443

# CRD API groups the read-only role can read. The built-in `view` ClusterRole covers none of
# them and nothing here aggregates into it, so a group left off this list means `kubectl get`
# on that resource falls back to sudo. Add a group when a new operator's CRDs need inspecting.
k3s_readonly_crd_api_groups:
  - traefik.io
  - metallb.io
  - longhorn.io
  # k3s's own CRDs. `scripts/deploy_tools/k3s_etcd_restore_gates.py` gate 3 reads
  # ETCDSnapshotFile to check that the snapshot an operator is about to restore exists and
  # reports `status.readyToUse` — the one cluster-side answer to that question. The template
  # grants `resources: ["*"]` per group, so this also grants read on `Addon`, the group's only
  # other resource. Both are safe to read: ETCDSnapshotFile's `spec.s3` records the bucket,
  # endpoint, folder and region but no keys (those stay in the 0600 root-only
  # /etc/rancher/k3s/etcd-s3.env), and an Addon records a manifest's path and checksum.
  - k3s.cattle.io

# Longhorn writes under this prefix inside the B2 bucket, so its objects keep their own
# namespace and a lifecycle rule written for anything else in the bucket cannot expire them.
k3s_longhorn_backup_prefix: longhorn
# Whether the backup target is armed. false enforces a BLANK target URL - the containment
# lever for a B2 transaction-cap spiral (see the task comment).
#
# The spiral is driven purely by failure. BackupVolumeController.reconcile runs `longhorn backup
# ls --volume <vol>` — ONE LIST PER BackupVolume CR. Once the cap trips, B2 answers
# `AccessDenied Transaction cap exceeded`, a FAILED reconcile is requeued and a successful one
# is not, so the loop runs whatever pollInterval says. Rate: 64-192 req/min, i.e. 92k-276k/day
# against a 2,500/day cap. That is 40-110x the entire daily allowance, which is why it cannot
# recover on its own and why the daily reset alone is not a fix. A denied metadata GET surfaces
# as "cannot find volume.cfg in backupstore", NOT as a 403 — a masked failure mode.
#
# Where the Class C goes, from the backupstore source and one direct listing of the bucket
# (10 Class C — the measurement was never the expensive part):
#
#   1. THE PRUNE IS THE COST, and it is priced in DIRECTORIES, not bytes or changed blocks.
#      DeleteDeltaBlockBackup -> getBlockNamesForVolume walks `blocks/<lv1>/<lv2>/` with one
#      delimited ListObjects per directory (backupstore deltablock.go:1496-1510, s3.go:108), so a
#      volume's prune costs 1 + lv1dirs + lv2dirs LISTs — about 1.28 per stored block. One
#      volume's prune measured ~2,738 LISTs.
#   2. IT RUNS ONCE PER DELETED BACKUP, not once per run. 93 backups against retain 4 queue ~71
#      tree walks costing ~22,989 Class C — nine days of cap. Delete an over-retention backlog
#      directly against the B2 API instead: deletes are Class A and unmetered, so the end state
#      Longhorn wants costs nothing to reach.
#   3. RE-ARMING ITSELF IS CHEAP. The target sync pulls one BackupVolume CR per remote prefix
#      (~25 Class C) and one Backup CR per remote backup (~93 Class B), once. At pollInterval 0
#      nothing re-lists afterwards: btc.go's isBackupTargetSyncRequired gates on
#      SyncRequestedAt > LastSyncedAt and no BackupStoreTimer exists to advance it.
#
# The storm is failure-driven — a failed sync returns before LastSyncedAt is set, so the gate
# never closes and every watch event re-lists — but it only starts once the cap is already
# gone. Keeping spend under the cap is therefore the whole defence, and the worst weekday shard
# projects at ~1,524 Class C against 2,500. `probe.py b2-budget` recomputes that projection from
# the live bucket; run it after adding a volume, because the cost grows with stored blocks and
# nothing else will announce the drift.
#
# DO NOT RE-ARM ON A TIMER, and do not re-arm without draining the over-retention backlog
# first — that ordering, not the clock, is what makes a re-arm hold.
k3s_longhorn_backup_armed: true

# Daily volume backup to that target. 03:30 clears the daily secret-rotation cron. (The
# `longhorn_b2_*` SOPS key names are Longhorn's credentials.) 14 retained backups per volume is
# two weeks of recovery — Longhorn backups are incremental at the block level, so the marginal
# cost of depth here is small compared to the first full. In steady state this group is only
# the four R2-routed volumes plus any newly provisioned PVC awaiting reconcile — every
# B2-destined volume lives in a weekday shard below.
k3s_longhorn_backup_cron: "30 3 * * *"
k3s_longhorn_backup_retain: 14

# Weekly tier: B2 transaction spend scales with volume COUNT per run — each backup pays fixed
# lock/list/config overhead plus per-block existence checks (HeadObject, Class B; the console
# census read 34k Heads / 37k Lists) — and even a Sunday-only weekly batch, stacked with the
# daily tier, retention pruning on both, and the 07:30 Sunday-reboot resync, blows both
# 2,500/day caps. Every B2-destined volume therefore backs up WEEKLY, sharded across the seven
# weekdays (list index mod 7 = cron day-of-week, 0=Sunday) so no single cap-day carries more
# than 3 volumes' worth of transactions. The operator accepted a week-old worst-case restore
# for the B2 set; the four R2-routed volumes keep the daily cadence, R2's caps being monthly
# and vast.
#
# retain 2 ≈ a fortnight of weeklies. Retention is what costs: a prune walks the volume's whole
# block tree (see k3s_longhorn_backup_armed), so the price is set by how many blocks the
# retained backups pin. A lower count pins fewer, and every prune is cheaper for it. The trade
# the operator accepted is recovery REACH: a corruption noticed on day 15 has no clean copy
# behind it. Raising this is a storage-and-transaction decision, not a free one.
#
# Note retention is enforced PER RECURRING JOB, over that job's own backups only, and only while
# the job still selects the volume — so this number does not govern the daily-era backups left
# behind when a volume moved into a weekday shard. Nothing prunes those;
# scripts/backup/longhorn_reap_orphan_backups.py is their only owner.
k3s_longhorn_weekly_backup_minute_hour: "30 4"
k3s_longhorn_weekly_backup_retain: 2
# PVC names; the reconcile task swaps the volume's recurring-job group label. A PVC
# recreated from the `longhorn` StorageClass reverts to daily until the next deploy — drift
# in the over-backed-up direction, caught by the reconcile rerun.
# ── Cloudflare R2: the second backup target ──────────────────────────────────────────────
# Longhorn has supported more than one BackupTarget since v1.8.0. A volume is routed by its
# OWN spec.backupTargetName, and
# RecurringJob carries no target field — so daily-backup and weekly-backup keep working
# unchanged and simply follow each volume to wherever it points. Nothing below changes how
# any volume is scheduled, only where its backups land.
#
# R2 is here for the axis B2 ran out of, not for capacity: 10M Class B operations/month and
# ZERO egress, against B2's 2,500/day Class B allowance, whose exhaustion takes the entire
# backup plane down and makes a restore drill read as data loss. R2's free storage
# is 10 GB against ~8.2 GB of live volume data, so it could not hold everything anyway.
k3s_longhorn_r2_armed: true

# R2's region component is literally "auto" and the account-specific part is the endpoint
# host. Deliberately NOT derived the way k3s_longhorn_b2_region is derived from the B2
# endpoint: R2 shares no configuration with B2, so a derivation would invent a coupling
# that does not exist and would break the moment either side moved.
k3s_longhorn_r2_region: auto
k3s_longhorn_r2_backup_prefix: longhorn

# 0 for the same reason B2 is 0 — see k3s_longhorn_backupstore_poll_interval. A poll costs a
# metadata GET per volume per retained backup, and a target that starts failing retries far
# faster than its interval, so the failure itself burns the allowance. R2 would absorb it
# comfortably (~333k Class B/day available against a 300s poll's ~43k), which makes this
# conservatism rather than necessity — but it is the right default to start from, and the
# only cost is UI staleness between nightlies. Raise deliberately.
k3s_longhorn_r2_poll_interval: 0

# The volumes whose restore path must not be rate-limited: the TLS material the whole edge
# depends on, the SSO store behind every authenticated route, and the two home-automation
# stores that are slow and error-prone to rebuild by hand. Small, config-shaped, and exactly
# the set worth putting on a target with free egress. Names are namespace/pvcName, matching
# k3s_longhorn_weekly_volumes below.
#
# Derived, not listed: every `backup_claims` volume of every `home-critical` containers_list
# entry (tier `home-edge` or `home-automation`; filter_plugins/service_tier.py, #3389). To
# change the set, edit the entry. Python
# readers resolve it through scripts/lib/service_tiers.py, because a raw YAML read returns
# this expression. No `default([])` on containers_list: an empty result does not route
# nothing, it makes "Return de-listed volumes to the default backup target" move all four
# back to B2, so an undefined list must fail the play instead.
k3s_longhorn_r2_volumes: "{{ containers_list | tier_backup_claims('home-critical', k8s_namespace) }}"

# DECIDED: swap a replacement into a removed volume's index, never delete it; the weekday is
# index mod 7, so a removal moves later volumes onto other shards and other retain jobs.
#
# ORDER MATTERS: a volume's backup weekday is its list index mod 7 (0=Sunday). The list is
# laid out in columns of seven — positions 0-6 are the seven largest volumes, one per day,
# then the next seven, then the smallest — so no weekday stacks two heavy volumes. Reordering
# moves volumes to a different weekday (harmless beyond a one-off cadence wobble), but append
# new volumes at the END so existing assignments stay put.
k3s_longhorn_weekly_volumes:
  # Index 0 is a replacement swapped in place for the removed volume, not an append: a
  # volume's weekday is its index mod 7, so deleting index 0 would shift all twenty volumes
  # below it by a day and could stack two heavy volumes on one cap-day.
  - homelab/code-server-workspace # Sun
  - homelab/jellyfin-config # Mon
  - homelab/valheim-config # Tue
  - homelab/karakeep-data # Wed
  - homelab/prowlarr-config # Thu
  - homelab/freshrss-config # Fri
  - homelab/sonarr-config # Sat
  - homelab/n8n-data # Sun
  - homelab/tdarr-server # Mon
  - homelab/radarr-config # Tue
  - homelab/terraria-config # Wed
  - homelab/qbittorrent-config # Thu
  - homelab/bazarr-config # Fri
  - homelab/scrutiny-web-config # Sat
  - homelab/terraria-stats-data # Sun
  - homelab/valheim-stats-data # Mon
  - homelab/tdarr-configs # Tue
  # Index 17 is navidrome-data, moved up from the tail when healthchecks-config retired
  # (#2806). Taking the last entry shifts no other volume's weekday; navidrome alone moves from
  # Sun to Wed, and it is parked at 0 replicas, so its data does not change between backups.
  - homelab/navidrome-data # Wed
  - homelab/wg-easy-config # Thu
  - homelab/n8n-files # Fri
  - homelab/pi-peer-backup-data # Sat

# Backup-plane heartbeat (templates/longhorn-backup-health.sh.j2). Pushes to a static Kuma
# monitor rather than being polled, because monitor-bridge runs on daniel-server and cannot
# see this cluster.
#
# 30h against a 03:30 daily job: one full day plus 6h of slack, so a single late or slow run
# does not page, while a genuinely missed day does — ~26.5h after the fact. Deliberately looser
# than the interval, because the failure worth catching is "the job stopped", not "the job ran
# 40 minutes late".
k3s_longhorn_backup_max_age_hours: 30

# How far back the Error-state check looks. An Error Backup object is immortal once the job that
# created it is gone: Longhorn's `retain: N` prunes only Completed backups owned by a live job,
# and the reaper skips every state that is not Completed. Unbounded, one bad night pins the
# backup monitor red permanently, reported on every 10-minute tick with no way to clear it. 24h
# is one full daily cycle, so a real
# failure pages through its own retry window and then clears itself.
k3s_longhorn_backup_error_max_age_hours: 24

# The weekly tier's equivalent bound, for the volumes in k3s_longhorn_weekly_volumes. Same
# reasoning scaled to a weekly 04:30 job: 8 days plus 6h, so one late or skipped run pages while
# a normal ~7-day-old backup does not. Without a second bound these volumes would be walked by
# nothing — the daily 30h could never apply to them, so they would simply be left out of the coverage
# loop and could stop backing up indefinitely with the tile green. The bound is per-volume, so
# the weekday sharding (each volume still backed up every 7 days) leaves it unchanged.
k3s_longhorn_weekly_backup_max_age_hours: 198

# */10 rather than the Pi crons' */5: this queries the k8s API rather than reading a local file,
# and nothing here changes faster than the daily backup it watches. The Kuma monitor's heartbeat
# interval must stay above this (see the uptime-kuma role) so a dead cron trips the watchdog.
k3s_longhorn_backup_health_cron_minute: "*/10"

# Filesystem trim (templates/longhorn-trim-volumes.sh.j2). 06:10 daily: after BOTH backup windows
# (03:30 daily, 04:30 weekly) and clear of the 05:15 manifest-prune check. The ordering is the
# constraint, not the hour — trimming BEFORE the day's snapshot hands back blocks that the
# snapshot then pins again, so the sweep has to follow the snapshot, not precede it.
k3s_longhorn_trim_cron_hour: "6"
k3s_longhorn_trim_cron_minute: "10"

# The B2 deletion ledger's two crons (tasks/health-crons.yml). 07:10 charges the day's completed
# deletions, 07:20 re-lists the block tree so tomorrow's charges have a price. That ORDER is the
# constraint, not the hour: a deletion can only be priced by a listing taken before it, because
# afterwards the tree is smaller than the one the deletion walked. Both sit after the 06:10 trim
# and clear of both prune windows, and both land on the same UTC day as those windows under
# either DST offset — the ledger is keyed on the UTC day B2's counters reset on.
k3s_b2_deletion_accounting_cron_hour: "7"
k3s_b2_deletion_accounting_cron_minute: "10"
k3s_b2_budget_cron_hour: "7"
k3s_b2_budget_cron_minute: "20"

# Daily-backup-volume budget. B2 exposes no cap-headroom API, so nothing can measure the
# remaining allowance directly; what CAN be watched is the input that grows, the count of
# Longhorn's daily backups against the free tier's 2500-transaction Class B/C ceiling.
#
# A PROXY, and the health script says so in its message: it counts Longhorn's own daily backups,
# and cannot see the b2-usage rclone's share of the same account-wide cap. So the
# budget is deliberately well under what Longhorn alone could consume — the headroom left over is
# for the other consumer.
#
# Raising it is NOT silencing the warning — this arm counts backups, not what they cost, so a
# threshold below the normal count fires every morning on a condition deliberately created, and
# a monitor that pages daily for an expected reason is one nobody reads. What detects the thing
# actually feared — the cap firing — is **B2 Reachable**, which probes b2_authorize_account and
# reports B2's own `transaction_cap_exceeded`. This arm stays a growth tripwire, set above the
# normal count.
#
# A tripwire on GROWTH, not a derived ceiling: the threshold sits just above the normal count
# rather than coming from a per-backup cost model.
#
# 16: every backed-up volume uses 16 MiB blocks, so block count per volume fell about 8.6x
# (sonarr 200 -> 23, prowlarr 216 -> 25) and with it the prune cost each backup carries.
# `probe.py b2-budget` prices a stored block at ~2 Class C, matching the two shards it could
# price (d4: 50 blocks / 101 C, d6: 35 / 70 C). The worst projected shard is ~220 Class C
# against the 2100 budget, where d2 alone was 1359 at 2 MiB blocks.
#
# Deliberately 16 rather than the ~24 the arithmetic allows. All 21 volumes backing up on one day
# would cost roughly 790 Class C, so cost is not the binding constraint and the count is —
# which is exactly when a growth tripwire has to stay tight. 16 sits just above what a
# migration-sized night produced (12) rather than at the ceiling.
#
# PROMOTING TO 24. Elapsed time is not the gate; these three are:
#
#   1. Every shard has been priced. `probe.py b2-budget` can only cost a shard whose volumes
#      already hold backups, so while a weekday's volumes have none yet (after a rebuild, say)
#      the ~220 worst-shard figure above is a projection. Promote on the measured number.
#   2. That measured worst shard is not materially above ~220 Class C. If it is, the ~2 C/block
#      model is wrong and the arithmetic behind 24 goes with it.
#   3. The arm has not fired at 16 on a day with no deliberate burst. A tripwire already firing
#      on ordinary traffic is one to investigate, not one to loosen.
#
# b2-budget models cost, it does not measure it — B2 publishes no usage API, so the console's
# Caps & Alerts page stays the only ground truth for what was actually spent.
#
# Raise it only together with a decision about the cap itself, never to silence the warning.
#
# DECIDED: a modeled proxy (B2-destined backups per 24h), not a metered count; B2's per-class
# counters are Partner-tier only, so never publish a log-derived Class-B figure as a cap
# fraction.
k3s_longhorn_daily_backup_budget: 16

# Root-disk headroom heartbeat (templates/disk-health.sh.j2). 75, not the fleet's 90: Longhorn's
# storageMinimalAvailablePercentage=25 stops replica scheduling once the disk passes 75% used, so
# this pages at the line where the storage plane starts degrading, not after. Same */10-cron /
# 1200s-Kuma-interval pairing as the backup heartbeat above.
k3s_disk_max_pct: 75
k3s_disk_health_cron_minute: "*/10"

# Boot grace for the */10 health crons (boot_grace_active in kuma-push-lib.sh). A cron firing
# seconds after boot evaluates a half-started cluster and sends a healthchecks.io `/fail`, which
# alerts immediately — the check's own grace cannot absorb it. A boot is the worked example:
# daniel-box booted at 07:39:48, the */10 crons ran at 07:40:00, and the last pod
# reached Ready at 07:45:06, so both `longhorn-backup-health` and `uptime-kuma-alive` paged.
#
# DERIVED, not chosen. Two bounds, and the value is the only round number between them:
#   LOWER  — must exceed the worst observed boot-to-Ready, 5m18s (07:39:48 boot, 07:45:06
#            last pod Ready). Anything shorter lets the cron run against a cluster that
#            is still coming up, which is the bug.
#   UPPER  — must stay STRICTLY BELOW the 600s cron interval, so at most one slot is ever skipped
#            whatever minute the host boots on. That single-miss bound is what lets the dead-men
#            keep a grace of period + one slot instead of an open-ended one.
# 420 < 600 satisfies the upper bound with 3 minutes of margin, and clears the lower by 102s.
# Raising this past 599 breaks the arithmetic in docs/healthchecks-io-deadman.md — the guard test
# in ansible/tests/setup/test_health_cron_boot_grace.py enforces the bound rather than the number.
#
# NOT applied to the daily crons (manifest-prune 05:15, etcd-snapshot-offbox 02:45). For them a
# skipped slot is a skipped DAY, which is a worse trade than the rare boot landing inside their
# one-minute window; their 1-hour graces already cover a late run.
k3s_health_cron_boot_grace_s: 420

# Manifest-prune drift check (templates/manifest-prune-check.sh.j2). Daily, not */10 like the
# heartbeats above: staged-manifest drift only changes on a deploy, so there is nothing new to
# find between two deploys in the same day. 05:15 — after the 03:30 nightly Longhorn backup
# (k3s_longhorn_backup_cron) and its 04:30 Sunday sibling have both finished, ahead of the
# day's first deploy.
# Live-object drift check: 05:45, half an hour after the manifest-prune check at 05:15, so a
# morning with both firing does not put two full kubectl sweeps on the API server at once.
k3s_live_drift_cron_hour: "5"
k3s_live_drift_cron_minute: "45"

k3s_manifest_prune_cron_hour: "5"
k3s_manifest_prune_cron_minute: "15"

# Release-staleness drift check (templates/release-staleness-check.sh.j2). This is
# the durable signal for a k8s role change gitops_deploy.py's `cs.k8s` branch ff-merges and
# defers-and-alerts: the Discord page fires once per SHA and clears the moment the tree
# ff-merges, so nothing else watches the gap between "merged" and "applied" — see the
# `# DECIDED:` at that branch of `deploy_alerts.alert_deferred` in
# roles/setup/gitops_deploy/files/.
#
# Every 30 minutes, not daily like manifest-prune above: the deployer ticks every 10 minutes, so
# a deferred change can land at any point in the day, and a daily window would leave it unwatched
# for up to 24h. 30 minutes catches it within three gitops ticks.
k3s_release_staleness_cron_minute: "*/30"
# A merge younger than this is named in the push message but not counted stale. Grading drift
# from the moment a commit reaches origin/master pages for a merge whose own landing is
# mid-deploy. Two cron periods, per the schedule rule for
# grace periods: a merge landing right after a run gets a full deploy window (a code-server
# image build alone is 20-30 min, after the CI wait) before the run after next grades it.
k3s_release_staleness_grace_minutes: 60

# ── Off-box etcd snapshots (templates/etcd-snapshot-offbox.sh.j2) ────────────────────────────
# k3s already takes scheduled etcd snapshots — 00:00 and 12:00, 5 retained — but they land in
# ${data-dir}/server/db/snapshots on daniel-box's own disk, which is the one thing a snapshot is
# supposed to survive. Longhorn covers PVC *data*; nothing covered the cluster's own object
# store. "Ansible rebuilds it" is not the same guarantee: Ansible reproduces what the repo
# declares, and the manifest-prune check beside this file exists precisely because live state and
# declared state drift.
#
# DELIBERATELY A CRON, NOT A SERVER FLAG. `--etcd-s3` and friends can be set on the k3s server,
# but changing k3s_server_args re-runs the install script and restarts the control plane — on a
# cluster with MetalLB ETP-Local VIP pinning, with Pi-hole
# serving LAN DNS from it. `k3s etcd-snapshot save --s3 ...` takes the identical flag surface as
# a one-shot against the running server (verified against `k3s etcd-snapshot save --help`,
# v1.36.2+k3s1), so the whole feature lands with no restart and no server-arg change.
#
# Destination is the R2 bucket the Longhorn secondary target already uses, under its OWN folder.
# Not B2: snapshot uploads are Class-B transaction volume and B2's cap is the scarce axis. Not
# the `longhorn` prefix: the orphaned-backup reaper walks that space. (It reconciles Longhorn
# Backup CRs rather than raw objects, so it could not see an etcd snapshot anyway — the
# separate folder means that stays true if it ever grows a bucket-level sweep.)
k3s_etcd_s3_armed: true
k3s_etcd_s3_folder: etcd-snapshots
# 14 daily snapshots. Larger than k3s's local default of 5 because this is the copy that exists
# after the box is gone. MEASURED: a snapshot is 7.85-7.87 MB compressed, against the 104 MB
# the uncompressed local snapshots beside it take — --snapshot-compress is doing the work. Two
# weeks therefore costs ~110 MB, which is nothing against R2's 10 GB free tier next to ~8.2 GB
# of Longhorn data. Retention could go considerably higher on cost grounds; 14 days is the recovery window,
# not the budget.
k3s_etcd_s3_retention: 14
# 02:45 — before the 03:30 nightly Longhorn backup rather than after, so the two never contend
# for upload bandwidth, and comfortably clear of the 05:15 manifest-prune check.
k3s_etcd_s3_cron_hour: "2"
k3s_etcd_s3_cron_minute: "45"

# The restore side of the same tier. The snapshot above is taken, uploaded and alarmed; without
# a schedule nothing proves it comes BACK, and an off-box copy verified once by hand drifts. The
# Longhorn plane applies the same rule — its drill is scheduled and its stamp is read
# fail-closed — and etcd is the tier that carries the Backup CRs needed to FIND the Longhorn
# backups, so it is the worse one to leave unproven.
#
# DECIDED: `--list-only`, weekly, and NOT the full restore. --list-only proves the off-box leg
# end to end: credentials, bucket, folder, download, decompression. The FULL drill does not pass
# on daniel-box at all — five structural failures documented at scripts/backup/etcd_restore_drill.sh:43-64
# — and scheduling it would be strictly harmful: cleanup() sets KEEP=1 on ANY non-zero exit and
# scratch dirs are swept only at +30 days, so a monthly failing full drill holds one to two
# restored etcd databases plus cluster-token copies in /var/tmp as a steady state. The scheduled
# list-only arm has no such cost: it exits at the drill's `--list-only` branch, BEFORE the
# `install -d "$SCRATCH"` that creates the directory at all, so however often it fails it writes
# nothing to /var/tmp. That asymmetry is why one mode is scheduled and the other is not ON THIS
# HOST. The full drill IS scheduled since #1175 — monthly, in a throwaway guest on daniel-server
# (`etcd_drill_full_cron` in group_vars, mechanism in roles/setup/hypervisor), where the guest's
# disk is deleted after every run and so nothing accumulates anywhere.
#
# Monday 10:20: clear of every backup window (02:45 snapshot, 03:30/04:30 Longhorn, 04:10 drill),
# clear of the 05:15 manifest-prune and the 06:10 trim, and in an hour nothing else uses. Daytime
# is deliberate for a read-only drill — --list-only downloads ~8 MB and decompresses it, so there
# is no restore stage to wedge, and a failure is visible on a day someone is around.
k3s_etcd_restore_drill_armed: true
k3s_etcd_restore_drill_cron: "20 10 * * 1"

# Bound volumes forced OUT of the backup set, as `namespace/pvcName` — an override for volumes
# whose StorageClass says `longhorn` (back me up) but which should not be. Needed as a separate
# lever because storageClassName is immutable: a volume that must leave the backup set after it is
# bound cannot be moved by editing the class.
#
# Exclude only what regenerates. An excluded volume keeps a single frozen restore point that is
# never pruned and never refreshed, so excluding a volume to buy quiet under a live B2 cap
# leaves it with stale recovery. Under a cap the answer is a staggered weekly group, not a
# permanent exclusion. `Backup.status.size` is the backup's LOGICAL volume size, not blocks
# uploaded (traefik-acme reports 35 -> 48 MB across daily backups of a 25 MB volume), and B2
# publishes no cap-headroom endpoint, so **B2 Reachable** is the readout for a cap that fires.
# Each entry below names the reason it is excluded.
k3s_longhorn_nobackup_volumes:
  # autokuma's state rebuilds from the static-monitors Secret — fully regenerable, so it
  # meets the same standard as the nobackup StorageClass.
  - homelab/autokuma-data
  # The volume holds ONLY the SMART TSDB (verified single mount), regenerating from the
  # daily collector runs.
  - homelab/scrutiny-influxdb-data
  # Monitors + notifications regenerate from the git-rendered static-monitors Secret. DR
  # caveat: the first-run admin is recreated by hand and status HISTORY is not kept anywhere.
  - homelab/uptime-kuma-data
  # Decisions expire and re-derive from logs; Metabase dashboards are provisioned.
  - homelab/crowdsec-db
  # Measured composition, not an estimate. `du` inside the pod puts 5.8 G in
  # .local/share/code-server/extensions — a directory the server does NOT read, since it runs
  # with `--extensions-dir /config/extensions` (637 M, complete) — plus 223 M of caches and
  # 17 M of code-server state, against 2.4 M of workspace. Backing up the whole volume made
  # one service 52% of the 13.72 GiB backup set and 3,668 of 7,023 blocks; at one Class-B GET
  # per block on restore, that volume alone was 147% of B2's 2,500/day cap and could not be
  # restored inside a day. The keepers live in the code-server-workspace claim, which IS
  # backed up. Not a class change, because storageClassName is immutable once bound.
  - homelab/code-server-config

# The nameserver lines this node's /etc/resolv.conf carries, IN ORDER. First entry wins on
# every query; the rest are fallbacks. See templates/resolv.conf.j2 for why the order alone
# is the whole mechanism.
#
# The preference order lives in k3s_host_dns_upstreams below, where the host forwarder applies
# it; this file names only the forwarder.
#
# A cold start does not need Pi-hole: the forwarder's public fallback upstreams cover it. The
# window before the VIP exists is nearly empty — k3s is active ~20s into boot, and a warm
# containerd store resolves no registry names at boot (zero image pulls and zero
# name-resolution failures in the first 10 minutes). A REBUILT node with an empty image store
# is the real case, and that runs k3s-bringup.yml by hand anyway.
#
# DELIBERATELY NO FALLBACK ENTRY. Adding `1.1.1.1` behind the forwarder would make a dead
# CoreDNS silently degrade to unfiltered DNS — a drop-in that reads as working while resolving
# through Cloudflare half the time. A dead forwarder here
# takes the node's DNS with it, which is loud. `Restart=always` on the unit covers a crash,
# and tasks/node.yml proves CoreDNS answers BEFORE it points this file at it.
k3s_node_dns_upstreams:
  - 127.0.0.1

# Seconds to wait for each nameserver, and how many rounds over the WHOLE list to make before
# returning an error — `attempts` is rounds, not per-server retries (resolv.conf(5)). One
# round at 2s means a dead Pi-hole costs one 2s timeout per lookup and then answers, rather
# than failing.
k3s_node_dns_timeout: 2
k3s_node_dns_attempts: 1
k3s_node_dns_options: "timeout:{{ k3s_node_dns_timeout }} attempts:{{ k3s_node_dns_attempts }}"

# ---------------------------------------------------------------------------
# The host forwarder
#
# glibc picks a nameserver per query and cannot ask "is Pi-hole up?" — it only learns an
# entry is dead by spending a timeout on it, per process, with no memory. A local CoreDNS
# CAN ask: `health_check` probes each upstream out of band, so a dead Pi-hole is skipped
# BEFORE a query is sent to it rather than after one has already stalled.
#
# It also makes the answer observable. VERIFIED AGAINST THE PINNED BUILD, because the obvious
# guess is wrong: 1.14.7 exports no `coredns_forward_requests_total`. The per-upstream series
# is `coredns_proxy_request_duration_seconds_count{proxy_name="forward",to="10.0.0.243:53"}`,
# and it says what
# fraction of this node's queries actually reached Pi-hole, which is the question otherwise
# answerable only by hand with a marked lookup.
k3s_host_coredns_enabled: true
k3s_host_coredns_version: "1.14.7"

# amd64 only — daniel-box is the sole consumer, and node.yml is a server-node play. The
# checksum is PINNED IN-REPO rather than fetched from the release's .sha256 sidecar: a
# sidecar fetched over the same connection as the tarball is authenticated by the same
# thing the tarball is, so it verifies transport integrity and nothing else. Pinning it
# here means a changed artifact fails the deploy and shows up as a diff. Same reasoning
# and same shape as roles/setup/sops_setup — and, as there, a Renovate version bump is a
# MANUAL FINISH: the hash below is not derivable from the tag, so `automerge: false`.
k3s_host_coredns_sha256: "9a09356438c6d9591cb80011a2a7a52f87fc3a113f6690e41f243f98b98faac9"

# WHERE THE PREFERENCE LIVES. This is the ordered forward list, and `policy sequential`
# below is what makes it an order rather than a load-balance — CoreDNS's forward plugin
# defaults to `random`, which would make the list a coin-flip. Two public entries, not one, because a forwarder with a single fallback has the
# same single point of failure the fallback exists to remove.
k3s_host_dns_upstreams:
  - "{{ dns_k8s_vip }}"
  - 1.1.1.1
  - 1.0.0.1

# A health check is "a recursive DNS query (. IN NS)" against each upstream. While an
# upstream reports unhealthy CoreDNS re-probes it every 0.5s regardless of this interval and
# stops probing once it is healthy again, so this value bounds how long a NEWLY dead Pi-hole
# keeps receiving queries, not how fast a recovered one is picked back up.
#
# max_fails 2, not 1: a single lost UDP packet must not evict Pi-hole. And not 0 — that
# value means "never mark this upstream down and never health check it", which would turn
# the whole mechanism off while still reading like it was configured.
k3s_host_dns_health_check: 5s
k3s_host_dns_max_fails: 2

# Answers served from cache never reach an upstream, so this bounds how stale a Pi-hole
# blocklist change can be on this node. 30s is short enough that a blocklist edit takes
# effect within one Kuma poll and long enough to absorb a boot's worth of repeat lookups.
k3s_host_dns_cache_ttl: 30

# Metrics bind to the node's LAN address, NOT 127.0.0.1. Prometheus scrapes from inside a
# pod, where 127.0.0.1 is the pod's own loopback and reaches nothing on the host. The UFW
# allow in tasks/node.yml is the other half — pod-to-host traffic terminates in a host
# process, which is the one class that meets UFW's default-deny INPUT.
k3s_host_dns_metrics_port: 9253

# Installed outside /usr/local/bin deliberately: this binary is version-pinned by Ansible and
# a bare `coredns` on PATH would be ambiguous with anything a future package installs.
# Two paths, deliberately. The versioned one is what `creates:` keys on, so a Renovate bump
# actually reinstalls; a single unversioned path would make the pin INERT after the first
# install — the file would say 1.15.0 and the node would keep running 1.14.7 forever, with
# every check green. The stable path is a symlink and is what the unit executes, so the unit
# file does not churn on every bump.
k3s_host_coredns_dir: /usr/local/lib/coredns
k3s_host_coredns_versioned_bin: "{{ k3s_host_coredns_dir }}/{{ k3s_host_coredns_version }}/coredns"
k3s_host_coredns_bin: "{{ k3s_host_coredns_dir }}/coredns"
k3s_host_coredns_conf: /etc/coredns/Corefile
k3s_host_coredns_url: >-
  https://github.com/coredns/coredns/releases/download/v{{ k3s_host_coredns_version }}/coredns_{{ k3s_host_coredns_version }}_linux_amd64.tgz
# Where get_url lands the tarball it checks against k3s_host_coredns_sha256. Inside the
# versioned directory, not /tmp: a file that survives a reboot is what lets get_url's own
# checksum comparison skip the download on every later run.
k3s_host_coredns_tarball: "{{ k3s_host_coredns_versioned_bin | dirname }}/coredns_{{ k3s_host_coredns_version }}_linux_amd64.tgz"

# DELIBERATELY A PUBLIC NAME, not `pi.hole`. This gate protects the resolv.conf switch, so
# what it must establish is "the forwarder answers", not "Pi-hole is up". Probing pi.hole
# would fail the deploy whenever Pi-hole is down — precisely the case the fallback exists to
# survive. Which upstream actually served the answer is the metric's job, not the gate's.
k3s_host_dns_probe_name: github.com


# Links whose DHCP lease must not contribute resolvers. The drop-in above pins the node's
# DNS, but it does not stop systemd-resolved from ALSO listing the lease's servers per link
# — six nameservers total, against the 3 Kubernetes gives a pod. See templates/netplan-dns.yaml.j2.
# eno1 is the only link carrying a lease with DNS; enx9cebe885f44e (USB NIC) is down and is
# left alone so the override cannot outlive the interface it names.
k3s_node_dns_dhcp_links:
  - eno1

# ── Cluster DNS (tasks/coredns.yml) ─────────────────────────────────────────────────────
# What CoreDNS forwards to, in order. This is deliberately NOT the node's resolv.conf that
# k3s's bundled Corefile uses: that inherits whichever resolvers CoreDNS's node happens to
# carry, and forward's default `random` policy then treats them as peers rather than as a
# primary and a fallback — so Pi-hole would answer roughly half of all cluster queries and the
# other half would silently lose ad-blocking and the local.daniel-hunter.com records.
#
# First entry is the pihole-dns Service's CLUSTER IP, not the LAN VIP. kube-proxy routes it
# to either Pi-hole pod regardless of the LoadBalancer's externalTrafficPolicy: Local, which
# is what blackholes VIP traffic the MetalLB announcer would have to forward to another node.
#
# This does NOT weaken the cold-boot invariant above. That one governs the NODE's resolvers,
# which must work before the cluster exists; CoreDNS is a cluster workload that cannot run
# before the cluster does, so its depending on an in-cluster Service costs nothing.
k3s_coredns_upstreams:
  - "{{ dns_k8s_cluster_ip }}"
  - 1.1.1.1
  - 1.0.0.1

# `policy sequential` alone would make every query wait out a dead Pi-hole. health_check
# probes the upstream on this interval and max_fails marks it down, so only the queries
# inside one interval pay the penalty — the same intent as daniel-server's resolv.conf
# `timeout:2 attempts:1`.
k3s_coredns_health_check: 5s
k3s_coredns_max_fails: 2

# The cluster DNS Service address, from kube-system/cluster-dns. Used only by the post-patch
# resolver probe, which queries CoreDNS directly rather than through the node's resolver.
k3s_cluster_dns_ip: 10.43.0.10

# CoreDNS's `reload` plugin re-reads the Corefile within ~30s; 8 tries at 5s covers it.
k3s_coredns_probe_retries: 8

# ── Agent join ─────────────────────────────────────────────────────────────
# daniel-server joins as an AGENT, not a second server (a two-member etcd halves
# availability rather than doubling it). Run via:
#   uv run ansible-playbook ansible/k3s-bringup.yml --tags join-firewall   # on daniel-box first
#   uv run ansible-playbook ansible/k3s-bringup.yml -e join_agent=daniel-server
k3s_server_join_url: "https://{{ hostvars['daniel-box'].server_ip }}:6443"

# Agent install flags. node.longhorn.io/create-default-disk=false is INERT: Longhorn honors
# it only when the cluster-level `create-default-disk-labeled-nodes` setting is true, which
# this cluster never sets — a default disk appears anyway. The label stays (removing it would
# churn the unit and re-run the installer for nothing); the enforced lever is agent_verify.yml
# patching the Longhorn node CR to allowScheduling:false. Storage participation
# (k3s_agent_longhorn_scheduling) flips that back deliberately.
k3s_agent_args: >-
  agent --node-ip {{ server_ip }}
  --node-label node.longhorn.io/create-default-disk=false
  --kubelet-arg=allowed-unsafe-sysctls=net.ipv4.conf.all.src_valid_mark,net.ipv4.ip_forward

# The `template:`-rendered scripts this role puts in /usr/local/bin, checksummed at render time
# into /var/lib/homelab/setup-render-manifest.d/ so manifest-prune-check.sh can tell whether this
# host has run initial_setup.yml since they last changed.
#
# GROUPED BY TAG FAMILY, and the grouping is the correctness property, not organisation. Each
# group is stamped by a task carrying that family's tags, so `--tags manifest-prune` restamps
# only manifest-prune-check.sh. A single flat list stamped by one untagged loop over all eight
# would declare all eight current while a tag-scoped run rendered one, and the seven it never
# touched would read as fresh forever. Keep each group's membership identical to the tags on the
# `template:` task that renders it; ansible/tests/deploy/test_setup_render_manifest.py asserts that.
#
# Paths are relative to the REPO ROOT, not to templates/, because the manifest is shared with
# four other setup-plane roles — the check joins nothing onto a hardcoded directory.
k3s_render_stamp_groups:
  # This group is read TWICE: stamp_render.yml stamps it, and release_bin.yml deploys it as a
  # versioned release (health-crons.yml). One list on purpose — a release and its stamp
  # describing different file sets is the partial-group false-green that health-crons.yml's
  # stamp comment warns about, and sharing the list makes them incapable of disagreeing. The
  # host name of each script is its basename minus `.j2`.
  - name: k3s-backup-health         # tags: [backup-health]
    templates:
      # Longhorn backup-plane heartbeat. Runs as the sys_user, not root: it reads the cluster
      # through that user's read-only kubeconfig, which is the whole point — the cron cannot
      # mutate anything. No no_log: this renders no secret. The Kuma push token lives in
      # kuma-push.env, which the script sources at runtime. That it renders no secret is also
      # what makes this group eligible for a versioned release at all — see release_bin.yml's
      # header.
      - ansible/roles/setup/k3s/templates/longhorn-backup-health.sh.j2
      # Longhorn restore drill. Check 7 (manifest-prune-check.sh) reads a stamp only this
      # script writes, so it must ship under the same tag as the backup-plane heartbeat above —
      # deploying one without the other either installs a drill nothing watches or leaves
      # check 7 paging for a drill that was never installed.
      - ansible/roles/setup/k3s/templates/longhorn-restore-drill.sh.j2
      # Longhorn filesystem-trim sweep. Runs as the sys_user through the read-only kubeconfig:
      # it reads volume state with kubectl and issues the trim through the longhorn-backend
      # API, which needs no Kubernetes write.
      - ansible/roles/setup/k3s/templates/longhorn-trim-volumes.sh.j2
  - name: k3s-disk-health           # tags: [disk-health]
    templates:
      - ansible/roles/setup/k3s/templates/disk-health.sh.j2
  - name: k3s-manifest-prune        # tags: [manifest-prune]
    templates:
      - ansible/roles/setup/k3s/templates/manifest-prune-check.sh.j2
  - name: k3s-release-staleness     # tags: [release-staleness]
    templates:
      - ansible/roles/setup/k3s/templates/release-staleness-check.sh.j2
  - name: k3s-etcd-snapshot         # tags: [etcd-snapshot]
    templates:
      - ansible/roles/setup/k3s/templates/etcd-snapshot-offbox.sh.j2

# Release groups whose artifacts are COPIED verbatim rather than rendered, so they have no
# `templates` list and cannot live in k3s_render_stamp_groups above (stamp_render.yml renders
# what it is given). Separate list, same structure: the release resolver in
# scripts/lib/release_bin_groups.py matches any list of dicts carrying `name`, and reads
# `templates` and `files` alike, so both checks see this group without an edit.
k3s_release_file_groups:
  - name: k3s-live-drift            # tags: [live-drift]
    files:
      - src: ansible/roles/setup/k3s/files/live_drift_check.py
        name: live-drift-check.py
  # Shares the k3s-manifest-prune release with the rendered script that calls it, so the two
  # version together: a reader that drifted from its caller is exactly the fault this check
  # exists to report. Stdlib-only — the cron runs it directly, with no uv and no PyYAML.
  - name: k3s-manifest-prune        # tags: [manifest-prune]
    files:
      - src: ansible/roles/setup/k3s/files/manifest_declares.py
        name: manifest-declares.py

# Node-to-node traffic UFW must admit (both hosts default-deny INPUT, and unlike every
# service port this traffic terminates in host processes, not Docker/kube NAT):
#   6443/tcp  agent -> server   apiserver registration + watch
#   8472/udp  both directions   flannel VXLAN (pod-to-pod)
#   10250/tcp both directions   kubelet API (logs/exec/metrics-server)
#   9100/tcp  both directions   node-exporter scrape (see the two rules below)
# The two lists below are mirrors apart from 6443, which is server-only because agents dial the
# API and the server never dials theirs. ansible/tests/setup/test_k3s_join_port_symmetry.py enforces
# that.
#
# NOT a complete inventory of what this cluster needs open. A port missing from BOTH lists is
# symmetric by construction, so the test is blind to it — MetalLB's memberlist 7946 sat in that
# blind spot, blocked on both nodes with the
# speakers never converging. Completeness is not a property any check here can establish; the
# only evidence is a live probe from the node that needs the port.
k3s_join_server_ports:  # allowed FROM each agent, ON the server
  - { port: "6443", proto: tcp }
  - { port: "8472", proto: udp }
  - { port: "10250", proto: tcp }
  # The mirror of the agent-side 9100 rule below, and it must stay symmetric. Prometheus is a
  # single-replica Deployment with NO nodeSelector and no affinity, so it lands wherever the
  # scheduler puts it after a reboot; whichever node it is NOT on has to admit the scrape. The
  # agent-side rule alone would assume "prometheus runs on the server", but a reboot can move it
  # to daniel-server — daniel-box's node target then sits down,
  # dropping its host memory and /boot coverage entirely (check_disk/check_mem read green off the
  # surviving node; see monitor-bridge check.py). Fix the firewall, not the placement: pinning
  # prometheus back to daniel-box would re-break this the first time the pin is lifted.
  - { port: "9100", proto: tcp }
  # MetalLB memberlist gossip. Without this rule both nodes block it and the speakers never
  # converge. INERT: L2Advertisement homelab-l2 pins every pool to
  # daniel-box, so one speaker owns every VIP and has nobody to gossip with. It stops being
  # inert the moment that pin is lifted, at which point two speakers each believe they own the
  # address. Symmetric on both lists, which is why the symmetry test could never have caught
  # it — a port missing from both sides is symmetric by construction.
  - { port: "7946", proto: tcp }
  - { port: "7946", proto: udp }
k3s_join_agent_ports:  # allowed FROM the server, ON the agent
  - { port: "8472", proto: udp }
  - { port: "10250", proto: tcp }
  # node-exporter DS is hostNetwork, so prometheus (on the server node) scrapes the
  # agent's 9100 on its LAN address, masqueraded from the server's LAN IP — a path the
  # vxlan/kubelet allows above never covered. Without it the daniel-server node target sits
  # down; pod-IP scrapes (promtail) ride 8472 and mask the gap.
  - { port: "9100", proto: tcp }
  # The mirror of the server-side MetalLB memberlist rule above — see it for why this is
  # inert and why it must land before the L2Advertisement node pin is lifted.
  - { port: "7946", proto: tcp }
  - { port: "7946", proto: udp }

# Agent node IPs the server-side firewall admits. Set in daniel-box host_vars once an
# agent exists; empty means the allow tasks are no-ops.
k3s_agent_node_ips: []

# Which of the role's topic files run. Every flag here defaults TRUE, so prod's behaviour is
# the behaviour of the role with nothing overridden — a staging cluster turns pieces OFF in
# its own host_vars rather than prod turning them on. ENFORCED by
# ansible/tests/setup/test_k3s_stage_gates.py, because a gate that defaults false silently stops
# doing prod's work and every repo-side check still reads green.
#
# DECIDED: `when:` on the existing `import_tasks`, not a switch to `include_tasks`. An import
# is static, so each task keeps its own tags and `--tags longhorn-backup` still selects; a
# dynamic include would hide those tags from selection and break the tag-based deploys.

# Longhorn's B2/R2 backup targets and RecurringJobs. Off on a cluster that holds no real
# credentials — staging has none by design (docs/archive/staging-cluster.md, Decision 5).
k3s_manage_backup_targets: true

# The host heartbeat crons: Kuma push URLs, Healthchecks.io ping keys, the backup-plane and
# restore-drill checks. Off anywhere that must not push into prod's monitoring, which would
# make a staging failure page a real operator.
k3s_manage_health_crons: true

# The name the post-patch CoreDNS probe resolves to prove the forward works by behaviour.
# It must be a name only the configured upstream answers, and NXDOMAIN everywhere else —
# `pi.hole` is answered by FTL itself. Set empty to skip the probe where no such name exists.
k3s_coredns_probe_name: pi.hole

# Storage smoke check (tasks/storage_smoke.yml) — opt-in, never part of a bringup. See that
# file for why prod does not run it.
k3s_storage_smoke_name: storage-smoke
k3s_storage_smoke_class: longhorn
# 64Mi is a multiple of both Longhorn block sizes in use here (2 MiB and 16 MiB). Longhorn
# refuses a size that is not a block-size multiple, and the refusal names neither the block
# size nor the rounding — see the longhorn-volume-size-must-be-block-size-multiple note.
k3s_storage_smoke_size: 64Mi
# Provisioning is fast when it works; this covers a cold csi-provisioner rather than a slow
# volume. 24 tries at 5s is two minutes.
k3s_storage_smoke_retries: 24
