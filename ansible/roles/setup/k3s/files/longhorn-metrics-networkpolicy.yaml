# Let Prometheus scrape longhorn-manager's metrics port.
#
# Longhorn v1.12's own deploy/longhorn.yaml ships six NetworkPolicies into longhorn-system, and
# the `longhorn-manager` one admits ingress only from Longhorn's own components: the manager, the
# UI, the CSI plugin, recurring-job pods, job-task pods and the driver deployer. Prometheus is not
# on that list, so from the moment those policies landed the `longhorn` scrape target read
# `up == 0` with `dial tcp ...:9500: connect: connection refused`, and
# `count(longhorn_volume_robustness)` returned nothing at all. Volume robustness and replica loss
# — degraded volumes, a replica rebuild that never finishes — were unwatched, on the storage layer
# every PVC in the cluster sits on.
#
# This is additive, not a patch of the upstream object. Editing theirs in place would be undone by
# the next `kubectl apply -f .../longhorn.yaml`, which is how the role installs and upgrades
# Longhorn; NetworkPolicies are additive by design (a pod is reachable if ANY policy selecting it
# allows the traffic), so a separate object survives the upgrade and needs no reconciliation.
#
# Scoped to the metrics port and the observability namespace: this reopens the manager's :9500 to
# Prometheus, and nothing else to anyone else.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: longhorn-manager-allow-metrics-scrape
  namespace: longhorn-system
  labels:
    app.kubernetes.io/managed-by: ansible
spec:
  podSelector:
    matchLabels:
      app: longhorn-manager
  policyTypes:
    - Ingress
  ingress:
    - from:
        # kubernetes.io/metadata.name is set automatically by the apiserver on every namespace,
        # so this does not depend on anyone remembering to label observability by hand.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - protocol: TCP
          port: 9500
