---
# Schedule a host check as a systemd timer that RERUNS while the check is red.
#
# THE PROBLEM. A check run from cron writes `down` to its textfile, and the Prometheus rule stays
# firing until the cron's next slot — 1 h to 25 h later — however soon the fault is fixed,
# because nothing writes `up` in between. The only place a recovery is observable is the
# producer, so the producer is what reruns.
#
# THE SHAPE. One oneshot service and one timer per check, rendered from the shared pair in
# roles/setup/common/templates/. The contract is the exit code: the script exits non-zero
# after it writes `down` and 0 after `up`, and `Restart=on-failure` reruns it every `RestartSec` until
# it exits 0. Chosen over a marker-file runner (a third scheduler beside cron and
# monitor-bridge) and over moving the checks into monitor-bridge (most read the host checkout,
# root-only files or the host's `gh` login).
#
# A REBOOT ENDS THE RESTART LOOP (#4495). `Persistent=true` catches up only a slot that never
# fired, and the slot that wrote `down` already had. So the service's ExecStopPost= keeps one
# marker per check, /var/lib/kuma-check/<name>.down, present while the last run did not exit 0.
# A third unit, kuma-check-<name>-boot.service, is conditioned on that marker and starts the
# service once at boot. It schedules nothing: the timer and the restart loop still own every
# run after that. Chosen over `OnBootSec=` on the timer, which would rerun every check at every
# boot, and write a false down for up to one RestartSec from each check without a boot grace.
#
# BOTH DIRECTIONS. `check_timer_state: absent` stops and disables the timer, removes the unit
# files and removes the legacy cron, so a host that leaves a `*_hosts` list keeps neither. The
# present arm removes the legacy cron too: a host must never run both.
#
# DECIDED: the units keep the `kuma-check-` prefix, by the operator's ruling in ADR 0026.
#
# NO TAGS IN THIS FILE, matching release_bin.yml and the stamp files. Tags union in Ansible, so
# a tag here would also inherit the caller's and become selectable two ways. `when:` on the
# caller's import_tasks applies to every task here, because the import is static.
#
# Callers pass:
#   check_timer_name         unit suffix, filename-safe: kuma-check-<name>.{service,timer}
#   check_timer_description  the units' Description=
#   check_timer_exec         ExecStart=, an absolute path
#   check_timer_user         User= of the service (root, or the cron's former owner)
#   check_timer_on_calendar  OnCalendar=, systemd calendar syntax (`*-*-* *:23:00` for hourly at :23)
#   check_timer_restart_sec  RestartSec=, how long a red check waits before it reruns
#   check_timer_state        present | absent
#   check_timer_env_file     optional EnvironmentFile=; omitted when empty
#   check_timer_environment  optional list of `NAME=value` strings, one Environment= line each,
#                           for what cron used to set inline (KUBECONFIG, a grace) and the env
#                           file must not carry
#   check_timer_cron_name    optional: the `ansible.builtin.cron` name this timer replaces, removed
#                           in both states so the two never coexist
#   check_timer_cron_user    the legacy cron's owner; defaults to check_timer_user
#   check_timer_cron_file    the legacy cron's `cron_file:` when it had one; a /etc/cron.d entry
#                           is only found again through the same file name

- name: Render the kuma-check units for {{ check_timer_name }}
  when: check_timer_state == 'present'
  # `src` names the owning role outright. A task file imported from another role resolves a bare
  # basename against the role that owns the file, which happens to be this one, but
  # release_bin.yml records that trap and the explicit path does not depend on it.
  ansible.builtin.template:
    src: "{{ playbook_dir }}/roles/setup/common/templates/check-timer.{{ item }}.j2"
    dest: "/etc/systemd/system/kuma-check-{{ check_timer_name }}.{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: [service, timer]
  become: true
  register: common_check_timer_units

- name: Render the boot-rerun unit for {{ check_timer_name }}
  when: check_timer_state == 'present'
  ansible.builtin.template:
    src: "{{ playbook_dir }}/roles/setup/common/templates/check-timer-boot.service.j2"
    dest: "/etc/systemd/system/kuma-check-{{ check_timer_name }}-boot.service"
    owner: root
    group: root
    mode: "0644"
  become: true
  register: common_check_timer_boot_unit

- name: Enable and start the kuma-check timer for {{ check_timer_name }}
  # Under --check the template task writes nothing, so on a host that lacks the unit this task
  # fails with "Could not find the requested service" — --check breaking the consumer, not the
  # read. Skipping it there keeps a --check run green; a real run still starts it.
  when: check_timer_state == 'present' and not (ansible_check_mode and common_check_timer_units is changed)
  ansible.builtin.systemd:
    name: "kuma-check-{{ check_timer_name }}.timer"
    enabled: true
    state: started
    daemon_reload: true
  become: true

- name: Enable the boot-rerun unit for {{ check_timer_name }}
  # Enabled, never started: starting it here would rerun a red check at every deploy rather
  # than at boot. Same --check guard as the timer start.
  when: check_timer_state == 'present' and not (ansible_check_mode and common_check_timer_boot_unit is changed)
  ansible.builtin.systemd:
    name: "kuma-check-{{ check_timer_name }}-boot.service"
    enabled: true
    daemon_reload: true
  become: true

- name: Restart the kuma-check timer when its units changed, for {{ check_timer_name }}
  # `state: started` on an already-running timer is a no-op, so a changed OnCalendar= would not
  # take until the next boot without this. Same --check guard as the start above.
  when: check_timer_state == 'present' and common_check_timer_units is changed and not ansible_check_mode
  ansible.builtin.systemd:
    name: "kuma-check-{{ check_timer_name }}.timer"
    state: restarted
  become: true

- name: Look for the kuma-check timer before stopping it, for {{ check_timer_name }}
  when: check_timer_state == 'absent'
  ansible.builtin.stat:
    path: "/etc/systemd/system/kuma-check-{{ check_timer_name }}.timer"
  register: common_check_timer_file

- name: Stop and disable the kuma-check timer for {{ check_timer_name }}
  # Guarded on the file: `systemd:` fails on a unit that does not exist, and the absent arm runs
  # on every host outside the caller's list, most of which never had the timer.
  when: check_timer_state == 'absent' and common_check_timer_file.stat.exists
  ansible.builtin.systemd:
    name: "kuma-check-{{ check_timer_name }}.timer"
    enabled: false
    state: stopped
  become: true

- name: Look for the boot-rerun unit before disabling it, for {{ check_timer_name }}
  when: check_timer_state == 'absent'
  ansible.builtin.stat:
    path: "/etc/systemd/system/kuma-check-{{ check_timer_name }}-boot.service"
  register: common_check_timer_boot_file

- name: Disable the boot-rerun unit for {{ check_timer_name }}
  # Guarded on the file for the same reason as the timer stop above.
  when: check_timer_state == 'absent' and common_check_timer_boot_file.stat.exists
  ansible.builtin.systemd:
    name: "kuma-check-{{ check_timer_name }}-boot.service"
    enabled: false
  become: true

- name: Remove the kuma-check units and the down marker for {{ check_timer_name }}
  when: check_timer_state == 'absent'
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "/etc/systemd/system/kuma-check-{{ check_timer_name }}.service"
    - "/etc/systemd/system/kuma-check-{{ check_timer_name }}.timer"
    - "/etc/systemd/system/kuma-check-{{ check_timer_name }}-boot.service"
    - "/var/lib/kuma-check/{{ check_timer_name }}.down"
  become: true
  register: common_check_timer_units_removed

- name: Reload systemd after removing the kuma-check units for {{ check_timer_name }}
  when: check_timer_state == 'absent' and common_check_timer_units_removed is changed
  ansible.builtin.systemd:
    daemon_reload: true
  become: true

- name: Remove the cron the kuma-check timer replaces, for {{ check_timer_name }}
  when: check_timer_cron_name | default('') | length > 0
  ansible.builtin.cron:
    name: "{{ check_timer_cron_name }}"
    user: "{{ check_timer_cron_user | default(check_timer_user) }}"
    cron_file: "{{ check_timer_cron_file | default(omit) }}"
    state: absent
  become: true
