---
# One task file per subject, each under its own tag, so the GitOps deployer can apply a change
# to the code alone (`--tags renovate-agent-code`) or to the units alone (`--tags renovate-agent-service`)
# rather than the whole role (#3135). `narrow_setup` reads a task file's OWN tags, so each task
# in code.yml and service.yml carries its tag, and each import below repeats it so an edit to
# this file narrows too. The directories serve both halves.
- name: Create the agent session's own user
  tags: [renovate-agent-code, renovate-agent-service]
  # The session reads third-party text, so it runs as a user with no sudo and no read on
  # /home/{{ sys_user }} (0750). renovate-agent-land@.service is the one privileged thing it
  # may start.
  ansible.builtin.user:
    name: "{{ renovate_agent_user }}"
    system: true
    home: "{{ renovate_agent_home }}"
    create_home: false
    shell: /bin/bash
    password_lock: true
  become: true

- name: Create renovate-agent directories
  tags: [renovate-agent-code, renovate-agent-service]
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    # Code and the rendered prompt: readable by the agent and by the lander, writable by root
    # alone, so the session cannot change what the lander runs.
    - {path: /opt/renovate-agent, owner: root, group: root, mode: "0755"}
    # The agent's home, state and clone. Group sys_user and setgid, so the docs cron reads the
    # run record (scripts/docs/reference/state.py) while the agent reads nothing of sys_user's.
    - {path: "{{ renovate_agent_home }}", owner: "{{ renovate_agent_user }}", group: "{{ sys_user }}", mode: "2750"}
    - {path: /etc/renovate-agent, owner: root, group: "{{ renovate_agent_user }}", mode: "0750"}
  become: true

- name: Install the agent user's Claude Code, clone and read access
  tags: [renovate-agent-code, renovate-agent-service]
  ansible.builtin.import_tasks: identity.yml
  # The controller's interpreter is the repo venv under /home/{{ sys_user }}, which the agent's
  # user cannot execute, so a `become_user` task there dies with "Permission denied".
  vars:
    ansible_python_interpreter: /usr/bin/python3

- name: Install the renovate-agent code
  tags: [renovate-agent-code]
  ansible.builtin.import_tasks: code.yml

- name: Install and arm the renovate-agent units
  tags: [renovate-agent-service]
  ansible.builtin.import_tasks: service.yml
