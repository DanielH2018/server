---
- name: Install agent Python files
  tags: [renovate-agent-code]
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/opt/renovate-agent/{{ item | basename }}"
    # Root-owned: the agent's user runs these and the lander runs land_renovate_pr.py, and
    # neither may change what the other runs.
    owner: root
    group: root
    mode: "0755"
  loop:
    - renovate_agent.py
    - agent_toolbox.py
    - run_worktree.py
    - agent_logic.py
    - land_renovate_pr.py
    # The deployer's own modules, shipped from its `files/` rather than a copy here.
    # `deploy_changes.SETUP_FILES_SHIPPED_BY_OTHER_ROLES` routes a change to either to
    # this role as well (#3306).
    - "{{ role_path }}/../gitops_deploy/files/gitops_markers.py"
    - "{{ role_path }}/../gitops_deploy/files/gitops_ledger.py"
  become: true

- name: Install the shared host_lib helper beside the agent
  tags: [renovate-agent-code]
  ansible.builtin.import_tasks: "{{ role_path }}/../common/tasks/install_host_lib.yml"
  vars:
    host_lib_dir: /opt/renovate-agent

- name: Record the deployed renovate-agent code
  tags: [renovate-agent-code]
  ansible.builtin.import_tasks: "{{ role_path }}/../common/tasks/stamp_deployed.yml"
  vars:
    stamp_deployed_name: renovate-agent
    stamp_deployed_pairs:
      - live: /opt/renovate-agent/renovate_agent.py
        src: ansible/roles/setup/renovate_agent/files/renovate_agent.py
      - live: /opt/renovate-agent/agent_toolbox.py
        src: ansible/roles/setup/renovate_agent/files/agent_toolbox.py
      - live: /opt/renovate-agent/run_worktree.py
        src: ansible/roles/setup/renovate_agent/files/run_worktree.py
      - live: /opt/renovate-agent/agent_logic.py
        src: ansible/roles/setup/renovate_agent/files/agent_logic.py
      - live: /opt/renovate-agent/land_renovate_pr.py
        src: ansible/roles/setup/renovate_agent/files/land_renovate_pr.py
      - live: /opt/renovate-agent/gitops_markers.py
        src: ansible/roles/setup/gitops_deploy/files/gitops_markers.py
      - live: /opt/renovate-agent/gitops_ledger.py
        src: ansible/roles/setup/gitops_deploy/files/gitops_ledger.py
      - live: /opt/renovate-agent/host_lib.py
        src: ansible/roles/setup/common/files/host_lib.py
