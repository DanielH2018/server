---
# What the agent's own user needs that the operator's user used to supply: uv and the pinned
# Python, a Claude Code install, a clone to work in, and read access to the deployer's hold
# markers.
#
# Every task runs as root with HOME pointed at the agent's home, and the last one hands the
# home to the agent. Not `become_user`: a module run as the agent needs an interpreter it can
# execute, and the controller's is the repo venv under the 0750 /home/{{ sys_user }}, while the
# system python3 is below the repo's syntax floor
# (ansible/tests/setup/test_host_python_invocations.py). Root runs nothing here that
# sys_user does not already run in the claude_code and initial_setup roles.

- name: Create the agent user's bin and claude-guard directories
  tags: [renovate-agent-code, renovate-agent-service]
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ renovate_agent_home }}/.local/bin"
    - "{{ renovate_agent_home }}/.local/share/claude-guard"
  become: true

- name: Give the agent user the operator's pinned uv
  tags: [renovate-agent-code, renovate-agent-service]
  # /usr/local/bin/uv is a symlink into /home/{{ sys_user }}, which ProtectHome= and the 0750
  # home both hide from this user. A copy of the binary initial_setup pins, rather than a second
  # installer pin, so a uv bump reaches the agent on the next apply of this role.
  ansible.builtin.copy:
    src: /home/{{ sys_user }}/.local/bin/uv
    dest: "{{ renovate_agent_home }}/.local/bin/uv"
    remote_src: true
    # The ownership the closing chown sets, so the two tasks do not flip it on every apply.
    owner: "{{ renovate_agent_user }}"
    group: "{{ sys_user }}"
    mode: "0755"
  become: true

- name: Look for the operator's deployed claude_guard package
  tags: [renovate-agent-code, renovate-agent-service]
  ansible.builtin.stat:
    path: /home/{{ sys_user }}/.local/share/claude-guard/claude_guard
  register: renovate_agent_claude_guard
  become: true

- name: Give the agent user the operator's claude_guard package
  tags: [renovate-agent-code, renovate-agent-service]
  # block-footguns splits every command naming gh, kubectl or ssh with this package, which the
  # dotfiles repo deploys under the operator's home (.claude/hooks/_claude_guard.py looks in
  # ~/.local/share/claude-guard). Without it the guard asks on each such command, the session's
  # work is `gh pr` calls, and an unattended `ask` is a denial. Copied rather than pinned, as
  # uv is above, so the agent runs the operator's rules. A host without the dotfiles deploy
  # skips this, and the agent asks exactly where the operator's own sessions would.
  ansible.builtin.copy:
    src: /home/{{ sys_user }}/.local/share/claude-guard/claude_guard
    dest: "{{ renovate_agent_home }}/.local/share/claude-guard/"
    remote_src: true
    owner: "{{ renovate_agent_user }}"
    group: "{{ sys_user }}"
    mode: preserve
  become: true
  when: renovate_agent_claude_guard.stat.exists

- name: Install the pinned host Python for the agent user
  tags: [renovate-agent-code, renovate-agent-service]
  # The wrapper and every project hook run under `uv run --python {{ host_python_version }}`,
  # and uv keeps interpreters under the user's own data dir. Without one, each of the session's
  # Bash calls meets a hook that cannot start, and an unattended `ask` is a denial.
  ansible.builtin.command:
    cmd: "{{ renovate_agent_home }}/.local/bin/uv python install {{ host_python_version }}"
  environment:
    HOME: "{{ renovate_agent_home }}"
  register: renovate_agent_python
  changed_when: >-
    'Installed' in (renovate_agent_python.stderr | default(''))
    + (renovate_agent_python.stdout | default(''))
  become: true

- name: Download the Claude Code installer for the agent's user
  tags: [renovate-agent-code, renovate-agent-service]
  ansible.builtin.get_url:
    url: https://claude.ai/install.sh
    dest: "{{ renovate_agent_home }}/claude-install.sh"
    mode: "0755"
  become: true

- name: Install Claude Code for the agent's user
  tags: [renovate-agent-code, renovate-agent-service]
  # Run-once, as in the claude_code role: the native installer updates itself thereafter.
  ansible.builtin.command:
    cmd: bash {{ renovate_agent_home }}/claude-install.sh
  args:
    creates: "{{ renovate_agent_home }}/.local/bin/claude"
  environment:
    HOME: "{{ renovate_agent_home }}"
  become: true

- name: Clone the repo for the agent's user
  tags: [renovate-agent-code, renovate-agent-service]
  # Its own clone, so the session never writes the primary checkout's .git, which the deployer
  # fetches and fast-forwards. Run-once rather than the git module: root's git refuses a
  # repository another user owns, and run_worktree.py fetches on every run anyway.
  ansible.builtin.command:
    argv:
      - git
      - clone
      - --quiet
      - "https://github.com/{{ renovate_agent_repo }}.git"
      - "{{ renovate_agent_clone_dir }}"
  args:
    creates: "{{ renovate_agent_clone_dir }}/.git"
  become: true

- name: Hand the agent's home to its own user
  tags: [renovate-agent-code, renovate-agent-service]
  # Everything above ran as root, and the run record predates the move, written by sys_user.
  # The group stays sys_user so the docs cron reads the run record.
  ansible.builtin.file:
    path: "{{ renovate_agent_home }}"
    state: directory
    recurse: true
    owner: "{{ renovate_agent_user }}"
    group: "{{ sys_user }}"
  become: true

- name: Let the agent's user read the deployer's hold markers
  tags: [renovate-agent-code, renovate-agent-service]
  # The wrapper skips a run while the deployer holds (agent_logic.decide), and the deployer's
  # state directory is 0750 sys_user. Read-only, by ACL. The default entry keeps markers the
  # deployer writes later readable too.
  ansible.posix.acl:
    path: /var/lib/gitops-deploy
    entity: "{{ renovate_agent_user }}"
    etype: user
    permissions: "{{ item.permissions }}"
    default: "{{ item.default }}"
    recursive: true
    state: present
  loop:
    - {permissions: rX, default: false}
    - {permissions: r, default: true}
  become: true
