---
# Arming needs the agent's two credentials. Without them the session would run on nothing, or
# be tempted back onto the operator's token, which is what the agent's own user exists to end.
- name: Refuse to arm the agent without its own GitHub token and Claude credential
  tags: [renovate-agent-service]
  ansible.builtin.assert:
    that:
      - renovate_agent_gh_token | default('') | length > 0
      - renovate_agent_claude_oauth_token | default('') | length > 0
    fail_msg: >-
      renovate_agent_enabled is true, but renovate_agent_gh_token or
      renovate_agent_claude_oauth_token is not in secrets.yml. Add both with the add-secret
      skill first; the role's CLAUDE.md lists what each must be.
    quiet: true
  when: renovate_agent_enabled
  no_log: true

# Rendered rather than shipped as a file so it can carry the caps the unit actually enforces.
# A prompt naming a different PR cap or timeout from the ones in defaults/main.yml is how the
# session ends up starting a landing it has no budget to finish.
- name: Render the session prompt
  tags: [renovate-agent-service]
  ansible.builtin.template:
    src: prompt.txt.j2
    dest: /opt/renovate-agent/prompt.txt
    owner: root
    group: root
    mode: "0644"
  become: true

# Readable by the agent, writable by root alone: a session steered by text it read could
# otherwise raise its own budget or timeout, or point PROMPT_FILE at a prompt of its own for
# the next run.
- name: Write agent config (secret webhook, host-only)
  tags: [renovate-agent-service]
  ansible.builtin.template:
    src: config.env.j2
    dest: /etc/renovate-agent/config.env
    owner: root
    group: "{{ renovate_agent_user }}"
    mode: "0640"
  become: true
  no_log: true

- name: Write the session's GitHub token and Claude credential where only systemd reads them
  tags: [renovate-agent-service]
  ansible.builtin.template:
    src: session.env.j2
    dest: /etc/renovate-agent/session.env
    owner: root
    group: root
    mode: "0600"
  become: true
  no_log: true

- name: Install the renovate-agent failure alert
  tags: [renovate-agent-service]
  ansible.builtin.import_tasks: "{{ role_path }}/../common/tasks/alert_unit.yml"
  vars:
    alert_unit_name: renovate-agent
    alert_unit_description: Alert when renovate-agent fails
    alert_unit_message: "🚨 renovate-agent unit failed on {{ inventory_hostname }} — check `journalctl -u renovate-agent` and /var/lib/renovate-agent/last_session.json."
    alert_unit_env_dir: /etc/renovate-agent

- name: Install systemd units
  tags: [renovate-agent-service]
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    mode: "0644"
  loop:
    - renovate-agent.service
    - renovate-agent.timer
    - renovate-agent-land@.service
  become: true
  notify: Reload systemd

- name: Let the agent's user start a landing and nothing else (polkit)
  tags: [renovate-agent-service]
  ansible.builtin.template:
    src: 50-renovate-agent-land.rules.j2
    dest: /etc/polkit-1/rules.d/50-renovate-agent-land.rules
    owner: root
    group: root
    mode: "0644"
  become: true
  # No handler: polkitd watches rules.d and reloads a changed rule on its own.

# Both directions are wired: setting renovate_agent_enabled back to false stops AND disables
# the timer. A one-way arming switch is the reverse-state bug this repo keeps paying for.
# ENFORCED: ansible/tests/setup/test_renovate_agent_unit.py.
- name: Enable and start the timer
  tags: [renovate-agent-service]
  ansible.builtin.systemd:
    name: renovate-agent.timer
    enabled: "{{ renovate_agent_enabled }}"
    state: "{{ 'started' if renovate_agent_enabled else 'stopped' }}"
    daemon_reload: true
  become: true

# Render provenance for manifest-prune-check.sh's stale-script arm — see the gitops_deploy role
# for the reasoning.
- name: Stamp the rendered renovate-agent units
  tags: [renovate-agent-service]
  ansible.builtin.import_tasks: "{{ role_path }}/../common/tasks/stamp_render.yml"
  vars:
    stamp_render_name: renovate-agent
    stamp_render_templates:
      - ansible/roles/setup/renovate_agent/templates/renovate-agent.service.j2
      - ansible/roles/setup/common/templates/unit-failure-alert.service.j2
      - ansible/roles/setup/common/templates/alert-webhook.env.j2
      - ansible/roles/setup/renovate_agent/templates/renovate-agent.timer.j2
      - ansible/roles/setup/renovate_agent/templates/renovate-agent-land@.service.j2
      - ansible/roles/setup/renovate_agent/templates/50-renovate-agent-land.rules.j2
      # The stamp and the check both hash the repo source, never the rendered file, so an
      # .env.j2 carries no secret into either.
      - ansible/roles/setup/renovate_agent/templates/config.env.j2
      - ansible/roles/setup/renovate_agent/templates/session.env.j2
      - ansible/roles/setup/renovate_agent/templates/prompt.txt.j2
