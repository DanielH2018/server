---
# The deliberate Docker engine bump -- the only path that moves the held engine packages.
# Reached by name only (`tags: [never, docker-engine-upgrade]` on the include in install.yml):
#
#   uv run ansible-playbook ansible/initial_setup.yml --tags docker-engine-upgrade -e target=daniel-pi
#
# Why a stop/upgrade/recreate cycle rather than an in-place upgrade: live-restore keeps
# containers running across a dockerd restart, but a containerd.io upgrade replaces the
# containerd shim binary under every running container, and a docker.socket restart gives
# /var/run/docker.sock a new inode that a container bind-mounting the FILE never sees. On
# 2026-09-18 the dist-upgrade did both on daniel-pi: autoheal's shim died and docker-proxy
# sat unhealthy (503) until a hand redeploy recreated it (#1961). Stopping the projects
# first means no shim is live when dpkg swaps it; the forced recreate afterwards gives every
# container the new socket.
#
# The Compose projects are the ones deploy.yml renders under ~/server/containers/<name>,
# owned 0600 by the connecting user, so the compose tasks run as that user (become: false)
# the way deploy.yml runs them. A project that was never deployed to this host fails the stop
# task before anything is upgraded.

- name: Refuse to move the engine where the Compose projects cannot be reached
  ansible.builtin.assert:
    that: has_repo_checkout
    fail_msg: >-
      This host has no ~/server checkout, so nothing here can stop or recreate its Compose
      projects -- and an engine upgrade under running containers is #1961.

- name: Refresh the apt cache
  ansible.builtin.apt:
    update_cache: true
    force_apt_get: true
  become: true

- name: Upgrade the held engine packages
  # The hold is released before the containers stop, because the pending check needs it
  # released: it is the apt module's own check mode, whose `changed` is the module's verdict
  # on whether `state: latest` would install anything. A held package reads as current.
  # `always:` re-holds on every exit, so a no-op run, a failed apt run and a good one all
  # leave the engine held.
  become: true
  block:
    - name: Release the hold for the upgrade
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: install
      loop: "{{ docker_engine_packages }}"

    - name: Ask apt whether an engine upgrade is pending
      ansible.builtin.apt:
        name: "{{ docker_engine_packages }}"
        state: latest
        only_upgrade: true
      check_mode: true
      register: docker_install_engine_upgrade_probe

    - name: Record whether the engine has an upgrade pending
      ansible.builtin.set_fact:
        docker_install_engine_upgrade_pending: "{{ docker_install_engine_upgrade_probe.changed }}"

    - name: Report an engine that is already current
      ansible.builtin.debug:
        msg: "Docker engine packages are at their candidate versions; nothing stopped, nothing upgraded."
      when: not docker_install_engine_upgrade_pending

    - name: Stop every Compose project before the engine moves
      # Reverse list order, so a dependent stops before what it depends on.
      community.docker.docker_compose_v2:
        project_src: "/home/{{ sys_user }}/server/containers/{{ item.name }}"
        state: stopped
      loop: "{{ containers_list | default([]) | filter_by_platform('docker') | reverse }}"
      loop_control:
        label: "{{ item.name }}"
      become: false
      when:
        - docker_install_engine_upgrade_pending
        - has_repo_checkout

    - name: Upgrade the engine packages
      ansible.builtin.apt:
        name: "{{ docker_engine_packages }}"
        state: latest
        only_upgrade: true
      when: docker_install_engine_upgrade_pending
  always:
    - name: Hold the engine packages again
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop: "{{ docker_engine_packages }}"

- name: Start the Docker daemon on the upgraded engine
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: started
  loop:
    - docker.socket
    - docker.service
  become: true
  when: docker_install_engine_upgrade_pending

- name: Recreate every Compose project on the upgraded engine
  # `recreate: always`, not `auto`: the compose config-hash did not change, so `auto` would
  # only start the stopped containers -- and the one that bind-mounts the daemon socket would
  # come back holding the old inode. This is the recreate the incident needed by hand.
  community.docker.docker_compose_v2:
    project_src: "/home/{{ sys_user }}/server/containers/{{ item.name }}"
    state: present
    recreate: always
    remove_orphans: true
  loop: "{{ containers_list | default([]) | filter_by_platform('docker') }}"
  loop_control:
    label: "{{ item.name }}"
  become: false
  when:
    - docker_install_engine_upgrade_pending
    - has_repo_checkout
