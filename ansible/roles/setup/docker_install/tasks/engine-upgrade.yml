---
# The deliberate Docker engine bump -- the only path that moves the held engine packages.
# Reached by name only (`tags: [never, docker-engine-upgrade]` on the include in install.yml):
#
#   uv run ansible-playbook ansible/initial_setup.yml --tags docker-engine-upgrade -e docker_install_engine_upgrade=true -e target=daniel-pi
#
# Why a stop/upgrade/recreate cycle rather than an in-place upgrade: live-restore keeps
# containers running across a dockerd restart, but a containerd.io upgrade replaces the
# containerd shim binary under every running container, and a docker.socket restart gives
# /var/run/docker.sock a new inode that a container bind-mounting the FILE never sees. A
# dist-upgrade does both: autoheal's shim dies and docker-proxy sits unhealthy (503) until a
# redeploy recreates it. Stopping the project
# first means no shim is live when dpkg swaps it; the forced recreate afterwards gives every
# container the new socket.
#
# The one Compose project is `homelab` (H5), the package's /usr/lib/homelab/compose, whose env
# file is root 0600, so its tasks run with become: true. H5.12 deleted the per-project loop over
# containers_list, whose projects Ansible's Compose path rendered under ~/server/containers/.
#
# The play and homelab-reconcile both write the `homelab` project. The play therefore masks
# homelab-updater.timer first (H3's per-host lever), waits out any updater or reconcile run
# already in progress, and unmasks the timer only as its last task. A failed play leaves the
# timer masked on purpose: the Pi installs no package until the operator clears it
# (docs/target-architecture/host/h5-pi-compose.md, *The engine upgrade*).

- name: Look for the homelab project's compose file
  ansible.builtin.stat:
    path: "{{ docker_install_homelab_compose_dir }}/compose.yaml"
  register: docker_install_homelab_compose_file
  become: true

- name: Refuse to move the engine under a homelab project whose compose file is missing
  ansible.builtin.assert:
    that: docker_install_homelab_compose_file.stat.exists
    fail_msg: >-
      compose_services is not empty, but {{ docker_install_homelab_compose_dir }}/compose.yaml
      is missing, so the play could neither stop nor recreate the homelab project.
  when: compose_services | default([]) | length > 0

- name: Read the updater timer's unit state
  # No state is requested, so the module only reports `status`.
  ansible.builtin.systemd_service:
    name: homelab-updater.timer
  register: docker_install_updater_timer
  become: true

- name: Remember a mask the operator set before this play
  ansible.builtin.set_fact:
    docker_install_updater_was_masked: "{{ docker_install_updater_timer.status.UnitFileState | default('') == 'masked' }}"

- name: Mask the updater timer so no package installs during the play
  ansible.builtin.systemd_service:
    name: homelab-updater.timer
    masked: true
    state: stopped
  become: true
  when: not docker_install_updater_was_masked

- name: Wait for a running updater or reconcile to finish
  # The limit is docker_install_updater_wait_limit_s, which must exceed the rendered
  # homelab-updater.service's TimeoutStartSec. Past it the play fails before apt, with the
  # timer masked and nothing stopped.
  ansible.builtin.systemd_service:
    name: "{{ item }}"
  loop:
    - homelab-updater.service
    - homelab-reconcile.service
  register: docker_install_updater_activity
  until: docker_install_updater_activity.status.ActiveState not in ['active', 'activating']
  retries: "{{ docker_install_updater_wait_limit_s // 10 }}"
  delay: 10
  become: true

- name: Refresh the apt cache
  ansible.builtin.apt:
    update_cache: true
    force_apt_get: true
  become: true

- name: Upgrade the held engine packages
  # The hold is released before the containers stop, because the pending check needs it
  # released: it is the apt module's own check mode, whose `changed` is the module's verdict
  # on whether installing the pinned versions would change anything. A held package reads as
  # current. The pins are docker_install_package_specs (defaults/main.yml): "pending"
  # means the host is not at the pin, never "download.docker.com has something newer" -- that
  # signal is Renovate's PR. A pin BELOW the installed version fails at the upgrade task
  # (apt refuses a downgrade without allow_downgrade), which is the right verdict for a pin
  # nobody meant to lower.
  # `always:` re-holds on every exit, so a no-op run, a failed apt run and a good one all
  # leave the engine held.
  become: true
  block:
    - name: Release the hold for the upgrade
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: install
      loop: "{{ docker_engine_packages }}"

    - name: Ask apt whether the engine is behind its pin
      ansible.builtin.apt:
        name: "{{ docker_install_package_specs }}"
        state: present
      check_mode: true
      register: docker_install_engine_upgrade_probe

    - name: Record whether the engine has an upgrade pending
      ansible.builtin.set_fact:
        docker_install_engine_upgrade_pending: "{{ docker_install_engine_upgrade_probe.changed }}"

    - name: Report an engine that is already current
      ansible.builtin.debug:
        msg: "Docker engine packages are at their pinned versions; nothing stopped, nothing upgraded."
      when: not docker_install_engine_upgrade_pending

    - name: Stop the homelab project before the engine moves
      community.docker.docker_compose_v2:
        project_src: "{{ docker_install_homelab_compose_dir }}"
        files: [compose.yaml]
        state: stopped
      become: true
      when:
        - docker_install_engine_upgrade_pending
        - compose_services | default([]) | length > 0

    - name: Upgrade the engine packages to their pins
      ansible.builtin.apt:
        name: "{{ docker_install_package_specs }}"
        state: present
      when: docker_install_engine_upgrade_pending
  always:
    - name: Hold the engine packages again
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop: "{{ docker_engine_packages }}"

- name: Start the Docker daemon on the upgraded engine
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: started
  loop:
    - docker.socket
    - docker.service
  become: true
  when: docker_install_engine_upgrade_pending

- name: Recreate the homelab project on the upgraded engine
  # `recreate: always`, not `auto`: the compose config-hash did not change, so `auto` would only
  # start the stopped containers. `up -d --force-recreate` gives every container the new shim,
  # and gives the one that bind-mounts the daemon socket the socket's new inode.
  community.docker.docker_compose_v2:
    project_src: "{{ docker_install_homelab_compose_dir }}"
    files: [compose.yaml]
    state: present
    recreate: always
  become: true
  when:
    - docker_install_engine_upgrade_pending
    - compose_services | default([]) | length > 0

- name: Release the updater timer
  # Last on purpose: a failed play never reaches it, and the timer stays masked. A timer that
  # was masked before the play stays masked, so the play never undoes the operator's lever.
  ansible.builtin.systemd_service:
    name: homelab-updater.timer
    masked: false
    state: started
  become: true
  when: not docker_install_updater_was_masked
