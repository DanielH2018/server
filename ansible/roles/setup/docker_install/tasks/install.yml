---
- name: Add packages
  tags: [docker-repo]
  ansible.builtin.apt:
    name: "{{ packages }}"
    state: present
  vars:
    packages:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
      - python3-debian  # required by ansible.builtin.deb822_repository (below)
  become: true

- name: Ensure the APT keyring directory exists
  tags: [docker-repo]
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
    owner: root
    group: root
  become: true

- name: Install the Docker GPG key
  tags: [docker-repo]
  # Fetched ASCII-armored straight to its final path. apt reads armored keys referenced by
  # Signed-By, so there is nothing to dearmor — this is what Docker's own install docs do.
  #
  # Deliberately NOT `gpg --dearmor` via `command`: that creates the file under root's
  # umask, which the initial_setup role tightens to 027 EARLIER IN THE SAME PLAY. On a fresh
  # host the keyring therefore landed 0640; apt fetches as the unprivileged `_apt` user,
  # could not read it, and reported the repo as unsigned — failing the play at the cache
  # refresh below, before Docker was ever installed (daniel-box, 2026-08-01). Existing hosts
  # never showed it because their keyring predates the umask change and a `creates:` guard
  # stopped it being regenerated. get_url sets the mode declaratively, so no umask can reach
  # it. Same idiom as optimize_pi's azlux key.
  #
  # force defaults to false, so an existing key is not re-fetched every run; the fingerprint
  # check below still runs every play, and now validates the exact file apt consumes.
  #
  # The checksum is the bytes of the armored key as published 2026-09-21; the fingerprint check
  # below is the stronger control (it proves WHOSE key this is), and the checksum is the one
  # that fires before apt ever reads the file. A key Docker re-publishes (a new subkey, a
  # re-armor) fails here as a mismatch: re-verify the fingerprint, then update the hash.
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"
    owner: root
    group: root
    checksum: sha256:1500c1f56fa9e26b9b8f42452a553675796ade0807cdce11975eb98170b3a570
  become: true

- name: Verify the Docker GPG key fingerprint
  tags: [docker-repo]
  # Fail the play closed if the fetched key is NOT Docker's published signing key
  # (fingerprint 9DC85822 9FC7DD38 854AE2D8 8D81803C 0EBFCD88, per docs.docker.com). Without
  # this, a swapped/MITM'd key fetched over the network would be silently trusted by apt.
  # Runs every play (changed_when: false), so a tampered key is also caught on re-runs, not
  # just first install. gpg --show-keys reads armored input, so this needs no dearmored copy.
  ansible.builtin.command:
    cmd: gpg --show-keys --with-colons /etc/apt/keyrings/docker.asc
  register: docker_install_key_fpr
  changed_when: false
  failed_when: "'9DC858229FC7DD38854AE2D88D81803C0EBFCD88' not in docker_install_key_fpr.stdout"

- name: Add Docker APT repository
  tags: [docker-repo]
  # deb822 format (.sources) — the one-line "deb [...] ..." apt_repository form is deprecated.
  # No update_cache here (deb822_repository lacks it); the next task refreshes the cache.
  ansible.builtin.deb822_repository:
    name: docker
    types: [deb]
    uris: https://download.docker.com/linux/ubuntu
    suites: "{{ ansible_facts.distribution_release }}"
    components: [stable]
    architectures: ["{{ repo_arch }}"]
    signed_by: /etc/apt/keyrings/docker.asc
    state: present
  vars:
    # Map ansible_facts.architecture (x86_64) to dpkg terms (amd64)
    repo_arch: "{{ 'amd64' if ansible_facts.architecture == 'x86_64' else 'arm64' }}"
  become: true

- name: Remove the deprecated one-line Docker APT source
  tags: [docker-repo]
  # deb822_repository writes docker.sources; drop any docker.list left by the old
  # apt_repository task so apt doesn't see the repo "configured multiple times".
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/docker.list
    state: absent
  become: true

- name: Remove the superseded dearmored keyring and its download artefact
  tags: [docker-repo]
  # Runs AFTER deb822_repository has repointed Signed-By at the .asc, so apt is never left
  # referencing a keyring that no longer exists. On a host provisioned before this change
  # the old file is the 0640 one that broke the cache refresh; leaving it around invites a
  # future Signed-By pointing back at an unreadable key.
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /usr/share/keyrings/docker-archive-keyring.gpg
    - /tmp/docker.gpg
  become: true

- name: Update apt-get repo and cache
  tags: [docker-repo]
  # Cache refresh only. This task carried `upgrade: true` until 2026-09-18 -- a second full
  # `apt-get upgrade` on every docker_install run, after initial_setup's dist-upgrade had
  # already run one, and a second path by which docker-ce moved under running containers
  # (#1961). initial_setup owns the host upgrade; this role owns the engine's.
  ansible.builtin.apt:
    update_cache: true
    force_apt_get: true
  become: true

- name: Read the installed docker-ce version
  tags: [docker-engine]
  # The install below names exact versions, and `apt-get install pkg=ver` moves a HELD package
  # (the hold binds upgrade/dist-upgrade, not an explicit install). So on a host that already
  # has an engine this task decides whether the install runs at all: it does not, whatever the
  # pin says. dpkg-query exits 1 with nothing on stdout where docker-ce is not installed.
  ansible.builtin.command:
    cmd: dpkg-query -W -f '${Version}' docker-ce
  register: docker_install_installed_engine
  changed_when: false
  failed_when: false
  # Read-only, so it runs under --check too; skipped, the two consumers below would read an
  # undefined stdout and fail several tasks later with an error naming neither.
  check_mode: false

- name: Install Docker
  tags: [docker-engine]
  # docker_install_package_specs (defaults/main.yml) is docker_engine_packages
  # (group_vars/all.yml) -- docker-ce, -cli, containerd.io and, explicitly,
  # docker-compose-plugin + docker-buildx-plugin -- each at its pinned version. Compose v2 is
  # the engine behind community.docker.docker_compose_v2 (our deploy module) and buildx backs
  # its `build: always`, so they are declared rather than left to docker-ce-cli Recommends
  # (which apt marks auto-installed and could drop under a stricter apt config).
  # Fresh hosts only (the `when`): an installed engine is never moved by this task, whatever
  # the pin says -- the deliberate bump is engine-upgrade.yml, which stops the containers first.
  ansible.builtin.apt:
    name: "{{ docker_install_package_specs }}"
    state: present
  become: true
  when: docker_install_installed_engine.stdout | length == 0

- name: Report an installed engine that is behind its pin
  tags: [docker-engine]
  # Not a failure: the pin moved (a merged Renovate bump) and this host has not had the
  # deliberate upgrade yet. That upgrade is the operator's call, because it stops every
  # Compose project; this task only stops the gap being invisible behind a green run.
  ansible.builtin.debug:
    msg: >-
      docker-ce is {{ docker_install_installed_engine.stdout }} and the pin is
      {{ docker_install_package_versions['docker-ce'] }}{{ docker_install_apt_suffix }}.
      Nothing moved. To apply the pin, run the docker-engine-upgrade play (comment below).
  when:
    - docker_install_installed_engine.stdout | length > 0
    - docker_install_installed_engine.stdout != docker_install_package_versions['docker-ce'] ~ docker_install_apt_suffix

- name: Hold the Docker engine packages
  tags: [docker-engine]
  # The same hold initial_setup's host-basics sets before its dist-upgrade, repeated here for
  # the fresh host that had nothing to hold at that point. Held, `apt-get upgrade`,
  # `dist-upgrade` and unattended-upgrades all leave the engine alone; the only path that
  # moves it is the tagged upgrade below, which stops the containers first (#1961).
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop: "{{ docker_engine_packages }}"
  become: true

- name: Upgrade the Docker engine deliberately
  # Runs only when asked for by name AND by variable --
  #   uv run ansible-playbook ansible/initial_setup.yml --tags docker-engine-upgrade \
  #     -e docker_install_engine_upgrade=true -e target=daniel-pi
  # It stops every Compose project in containers_list, unholds, upgrades, re-holds, and brings
  # every project back with a forced recreate, so a container that bind-mounts
  # /var/run/docker.sock (docker-proxy) picks up the socket the restarted daemon created.
  #
  # `never` alone did not keep it out of a role-level run (#1998): initial_setup.yml tags
  # the whole role `docker_install`, tags inherit onto every task in it, and an explicitly
  # requested tag overrides `never`. So `--tags docker_install` ran this include -- measured
  # 2026-09-18 in check mode: the hold released for all five engine packages and re-set,
  # with nothing pending that day. The variable is the gate no tag reaches; `never` stays
  # so a bare untagged run still skips it without evaluating the `when`.
  ansible.builtin.include_tasks:
    file: engine-upgrade.yml
    apply:
      tags: [docker-engine-upgrade]
  tags: [never, docker-engine-upgrade]
  when: docker_install_engine_upgrade | bool

- name: Remove the deprecated linuxserver docker-compose v1 wrapper
  tags: [docker-engine]
  # Superseded by docker-compose-plugin (`docker compose`). The old run.sh wrapper
  # shipped EOL Compose v1.29 and was fetched from an unpinned GitHub master.
  ansible.builtin.file:
    path: /usr/local/bin/docker-compose
    state: absent
  become: true

- name: Resolve the deploy user (for docker group membership)
  tags: [docker-group]
  # ansible_facts.env.USER is "root" under the play's become:true, but the user who runs
  # docker (the become:false connecting user) is who needs docker-group membership.
  ansible.builtin.command: id -un
  become: false
  changed_when: false
  register: docker_install_deploy_user

- name: Add user to docker group
  tags: [docker-group]
  ansible.builtin.user:
    name: "{{ docker_install_deploy_user.stdout }}"
    groups: docker
    append: true
  become: true

- name: Expose containerd's metrics on the LAN IP and keep its shims on the default GC
  tags: [docker-daemon, docker-go-runtime, docker-go-runtime-containerd]
  # containerd serves Prometheus metrics at /v1/metrics once `[metrics] address` is set;
  # the cluster scrapes it as `containerd-pi`. Same reason as dockerd's metrics-addr below:
  # containerd took 53 major faults/s on daniel-pi (#2003) and its live heap is what sizes
  # a GOMEMLIMIT. The packaged config.toml carries only `disabled_plugins = ["cri"]`, so a
  # marked block is the whole of what this role owns in it.
  #
  # The shim-manager `env` is appended to every shim's environment AFTER the daemon's own
  # (pkg/shim/util.go), and Go keeps the last value of a duplicate key, so it undoes the
  # `GOGC=off` / `GOMEMLIMIT` the containerd.service drop-in (go-runtime.yml) would
  # otherwise hand every shim and, through it, every runc. It carries the go-runtime tags
  # so that a `--tags docker-go-runtime-containerd` run cannot land the drop-in without
  # it. The file has no `version =` key; containerd 2.3.5 reads it as version 1 and its
  # migration passes a dotted plugin name through unchanged -- `containerd config dump`
  # on daniel-pi shows the section under version 4.
  ansible.builtin.blockinfile:
    path: /etc/containerd/config.toml
    marker: "# {mark} ANSIBLE MANAGED BLOCK (roles/setup/docker_install)"
    block: |
      [metrics]
        address = "{{ server_ip }}:1338"
      [plugins.'io.containerd.shim.v1.manager']
        env = ["GOGC=100", "GOMEMLIMIT=off"]
    create: true
    mode: "0644"
  become: true
  register: docker_install_containerd_metrics

- name: Restart containerd to read its config.toml block # noqa no-handler
  tags: [docker-daemon, docker-go-runtime, docker-go-runtime-containerd]
  # docker.service only `Wants=` containerd, so this does not cascade into dockerd, and
  # live-restore keeps the containers up. The shim binaries are not replaced here, which is
  # what made the 2026-09-18 engine upgrade (#1961) different.
  ansible.builtin.systemd:
    name: containerd
    state: restarted
  become: true
  when: docker_install_containerd_metrics.changed

- name: Allow the LAN to reach the dockerd and containerd metrics listeners
  tags: [docker-daemon]
  # Host listeners, not Docker-published ports, so the UFW bypass Docker's iptables chain
  # gets does not apply (initial_setup's network.yml defaults incoming to deny).
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
    from_ip: "{{ lan_subnet }}"
    comment: "docker_install: {{ 'dockerd' if item == '9323' else 'containerd' }} metrics"
  loop: ["9323", "1338"]
  become: true

- name: Configure Docker daemon (log limits + live-restore)
  tags: [docker-daemon]
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    # live-restore keeps containers running across a daemon restart (e.g. a
    # docker-ce package upgrade), so a Docker restart doesn't bounce all ~42
    # containers. Safe on this single-node, non-swarm host.
    #
    # default-address-pools: Docker's built-in default (172.17-172.31/16 + 192.168.0.0/16
    # as /20s) is nearly exhausted — all fourteen 172.x /16 slots are used and new isolation
    # nets have started landing in the 192.168.0.0/16 fallback, which also squats on a common
    # home-LAN range AND on the RFC1918 blocks Authelia/Unbound/Mullvad treat as trusted. Pin
    # new-network allocation to 10.200.0.0/16 in /24s (256 nets): clear of the LAN (`lan_subnet`,
    # 10.0.0.0/24), wg-easy (`wg_client_subnet`, 10.8.0.0/24), the Mullvad tunnel
    # (10.64.0.0/10), and Docker's own 172.16/12 +
    # 192.168/16 defaults. Only NEW `docker network create` calls draw from this; the ~20
    # existing networks keep their current subnets across the restart (live-restore).
    #
    # metrics-addr: dockerd's own Prometheus endpoint (engine counters and the Go runtime's
    # `go_memstats_*`), on the LAN IP so the cluster's Prometheus scrapes it as `dockerd-pi`
    # (roles/k8s/claude-otel). It exists to size a GOMEMLIMIT: dockerd took 97 major
    # faults/s on daniel-pi, 30% of the host's, each GC cycle faulting a swapped-out heap
    # back from zram (#2003), and the pairing that cuts that (`GOGC=off` under a limit, as
    # the Pi Alloy runs) needs the live heap measured first — a limit under the live set is
    # the continuous-collection treadmill (#932). The UFW allow below is what makes the
    # listener reachable: Docker-published ports bypass UFW, a host listener does not.
    content: |
      {
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "10m",
          "max-file": "3"
        },
        "metrics-addr": "{{ server_ip }}:9323",
        "live-restore": true,
        "default-address-pools": [
          { "base": "10.200.0.0/16", "size": 24 }
        ]
      }
    mode: "0644"
    owner: root
    group: root
  become: true
  register: docker_install_daemon_config

- name: Restart Docker to apply daemon config # noqa no-handler
  tags: [docker-daemon]
  ansible.builtin.systemd:
    name: docker
    state: restarted
  become: true
  when: docker_install_daemon_config.changed

# One Go daemon per import, each with its own tag, so the pairing can land on one daemon a
# day and the day-after `rate(node_vmstat_pswpin{job="node-pi"}[1d])` reading is
# attributable (#2003). A role-level or `--tags docker-go-runtime` run applies both at
# once, which is the intended end state; the stagger is measurement discipline, not a
# constraint the tasks enforce. Static imports for the reason main.yml gives: an include
# is a task `--tags` judges first.
- name: Pair dockerd's Go runtime with a memory limit
  ansible.builtin.import_tasks: go-runtime.yml
  vars:
    go_runtime_unit: docker
    go_runtime_daemon: dockerd
  tags: [docker-go-runtime, docker-go-runtime-dockerd]

- name: Pair containerd's Go runtime with a memory limit
  ansible.builtin.import_tasks: go-runtime.yml
  vars:
    go_runtime_unit: containerd
    go_runtime_daemon: containerd
  tags: [docker-go-runtime, docker-go-runtime-containerd]

- name: Create Docker networks
  tags: [docker-networks]
  community.docker.docker_network:
    name: "{{ item }}"
    state: present
  loop:
    - "{{ docker_network }}"
    - monitoring
    - media
    - apps
    # homepage_private removed 2026-08-14 — retired with homepage at E3; recreating it
    # here only masked the dangling reference in docker-proxy's compose.
    - lifecycle  # private net: Watchtower + Autoheal <-> docker-proxy-lifecycle only
    - codeserver # isolation net: code-server <-> docker-proxy-codeserver only (keeps the shared docker-proxy off apps — Security M1)
    # `kopia` removed 2026-08-27 — the role retired 2026-08-13, and daniel-pi (the only Docker
    # host left) never ran Kopia, so this created an empty isolation net on the wrong machine.
    - terraria   # isolation net: Terraria <-> Traefik only (raw-TCP game port bypasses the CrowdSec chain; keeps a game-protocol exploit off the shared apps net)
    # `ups` and `mqtt` retired 2026-08-09 with slice-5 B3: their memberships (NUT<->HA,
    # Mosquitto<->z2m<->HA) all crossed to the cluster or the DOCKER-USER-locked LAN publish.
    - portainer-agent  # isolation net (daniel-pi): single-member — keeps the root-equivalent Docker-socket agent off the Pi's shared proxy bridge (reached only via its host-published :9001)
  become: true
