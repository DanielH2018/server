---
# The Pi's Docker engine is package-owned since H7.26 (hosts/components/pi-docker). H7.48 moved the
# teardown half's crons and drop-ins into the cluster nodes' packages as legacy entries.
# docs/target-architecture/host/h7-delete-ansible.md.

# DECIDED: this role is emptied, never deleted, until H7.20a. A play that names a missing role
# fails to parse, so deleting the role would mean editing initial_setup.yml, which is in the
# deployer's _BROAD_MANUAL_PREFIXES and parks every session's landing. setup_gates.role_end_guard
# reads this task.
- name: End the role, whose work the host packages own
  ansible.builtin.meta: end_role
