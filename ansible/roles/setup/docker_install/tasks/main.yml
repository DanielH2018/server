# The Pi's Docker engine is package-owned since H7.26 (hosts/components/pi-docker). H7.48 moved the
# teardown half's crons and drop-ins into the cluster nodes' packages as legacy entries.
# docs/target-architecture/host/h7-delete-ansible.md.

# DECIDED: this role is emptied, never deleted, until H7.20a, for the reason the claude_code stub
# gives (ansible/roles/setup/claude_code/tasks/main.yml). setup_gates.role_end_guard reads this task.
- name: End the role, whose work the host packages own
  ansible.builtin.meta: end_role
