---
# Reaps what an imperative Docker uninstall leaves behind. Runs on any host with
# has_docker: false; everything here is state=absent, so it is a no-op on a host that
# never had Docker.
#
# /var/lib/docker is still deliberately NOT touched: it holds image and volume data, and
# deleting it is irreversible in a way removing a package is not. It is inert once the
# daemon is gone.
#
# The PACKAGES used to be left alone too, on the reasoning that purging them was the
# operator's call and "on daniel-server it is already done". Both halves of that failed.
# docker-ce was purged on 2026-08-14 and reinstalled on 2026-08-19 at 22:37 by an Ansible
# run that saw has_docker: true — so `has_docker: false` described an end state nothing
# enforced, and the host ran a second container runtime for eight days while every repo
# check read green. A declared state that the role will not converge to is not a declared
# state. Purging here is what makes has_docker: false mean something.

- name: Find leftover docker-compose systemd units
  tags: [docker-teardown]
  # The containers/common role installs one docker-compose-<svc>.service per boot-managed
  # service. They are not removed when a service retires, and each Requires=docker.service —
  # so on a Docker-less host they fail at every boot. Globbed rather than listed by name:
  # the retired services are exactly the ones no inventory still names.
  ansible.builtin.find:
    paths: /etc/systemd/system
    patterns: "docker-compose-*.service"
    file_type: file
  register: docker_install_leftover_units
  become: true

- name: Disable and remove the leftover docker-compose units
  tags: [docker-teardown]
  # Disabling first drops the multi-user.target wants symlink; file:absent alone would
  # leave that dangling. state: stopped is safe — without a docker.service they are
  # inactive already, and systemd no-ops a stop on an inactive unit.
  ansible.builtin.systemd_service:
    name: "{{ item.path | basename }}"
    state: stopped
    enabled: false
  loop: "{{ docker_install_leftover_units.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  become: true

- name: Remove the leftover docker-compose unit files
  tags: [docker-teardown]
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ docker_install_leftover_units.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  notify: Reload systemd after docker teardown
  become: true

- name: Remove crons belonging to retired Compose services
  tags: [docker-teardown]
  # Ansible-managed crons are only reaped by the role that wrote them, and these roles are
  # archived — so they outlive their services. Both were still scheduled on daniel-server
  # two days after the uninstall: the ical-proxy redeploy invokes a Docker deploy for a
  # service that is now a k8s workload, and the tdarr sweep points at a transcode_cache
  # directory the migration emptied, making it a silent no-op rather than merely stale.
  # Listed by name because ansible.builtin.cron matches on its exact comment marker.
  ansible.builtin.cron:
    name: "{{ item }}"
    user: "{{ sys_user }}"
    state: absent
  loop: "{{ docker_install_stale_crons }}"
  become: true

- name: Check whether the Docker daemon is still installed
  tags: [docker-teardown]
  ansible.builtin.stat:
    path: /usr/bin/dockerd
  register: docker_install_dockerd_binary
  become: true

- name: Stop and disable Docker before purging it
  tags: [docker-teardown]
  # Stopping first so the daemon tears down its own iptables chains and bridges rather
  # than leaving them orphaned by a package removal. Guarded on the binary: the unit does
  # not exist on a host that never had Docker, and systemd_service errors on an unknown
  # unit rather than no-opping.
  when: docker_install_dockerd_binary.stat.exists
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop:
    - docker.socket
    - docker.service
  become: true

- name: Purge the Docker packages
  tags: [docker-teardown]
  # containerd.io is safe to purge alongside the engine: it provides /usr/bin/containerd,
  # which only dockerd uses. k3s runs its OWN embedded containerd out of
  # /var/lib/rancher/k3s/data/current/bin/ and never reads the packaged one — verified on
  # daniel-server 2026-08-27, where the running shim resolved under /var/lib/rancher.
  # Purge rather than remove so /etc/docker (daemon.json, live-restore) goes too;
  # autoremove drops the pulled-in extras (pigz, rootless-extras, slirp4netns).
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - docker-ce-rootless-extras
      - containerd.io
      - docker-compose-plugin
      - docker-buildx-plugin
    state: absent
    purge: true
    autoremove: true
  become: true
