---
# Crons written by Compose roles that no longer exist, so those roles cannot reap them.
# ansible.builtin.cron matches on the exact `#Ansible: <name>` marker, so these are the
# literal `name:` values from the roles that created them.
# Add an entry here when a Compose role that owned a cron is retired.
docker_install_stale_crons:
  - Redeploy ical-proxy
  - Clean stale tdarr transcode cache

# The engine versions this role installs. Without pins, a fresh install takes whatever
# download.docker.com serves that day and the deliberate upgrade moves to whatever it serves
# on the day it runs, so the Pi's engine would be a function of the calendar. Four upstream
# versions, not one: docker-ce and docker-ce-cli share the Moby version, and the other three
# packages each carry their own. Renovate tracks each on the `deb` datasource against
# download.docker.com's own noble/arm64 index (docker-ce, containerd.io,
# docker-compose-plugin, docker-buildx-plugin) in ONE manual group. It does not read the
# upstream GitHub releases: Docker packages a release days-to-weeks after upstream tags
# it, so a bump could name a version apt has no package for, and the play that applies it
# would fail AFTER stopping every Compose project. Merging a bump still moves nothing on the
# Pi by itself; tasks/install.yml refuses to move an installed engine and engine-upgrade.yml
# is the path that applies it (it stops every Compose project first).
#
# One `# renovate:` annotation per pin, each naming the apt package whose spec its var
# renders (scripts/tests/test_renovate_docker_engine_pins.py holds the two together).
# - `suite` and `binaryArch` are daniel-pi's own, measured 2026-09-24 (`dpkg
#   --print-architecture` -> arm64, `VERSION_CODENAME` -> noble). A second Docker host on
#   another release or arch needs its own registryUrl.
# - extractVersion strips apt's epoch and Debian revision (`5:29.8.1-1~ubuntu.24.04~noble`
#   -> `29.8.1`). It is deliberately NOT anchored on `~ubuntu`: the same index carries bare
#   `<version>-<rev>` rows for containerd.io, and a version extractVersion cannot match is
#   dropped from the version space. The stripped revision is the blind spot, so a
#   revision-only repackage offers no PR; the spec globs the revision for that reason (#2357).
# - `versioning=semver` overrides the deb datasource's default `deb` versioning, so the bare
#   versions classify major/minor/patch the way the packageRules expect.
# renovate: datasource=deb depName=docker-ce versioning=semver extractVersion=^(?:\d+:)?(?<version>[\d.]+)- registryUrl=https://download.docker.com/linux/ubuntu?suite=noble&components=stable&binaryArch=arm64
docker_install_engine_version: "29.8.1"
# renovate: datasource=deb depName=containerd.io versioning=semver extractVersion=^(?:\d+:)?(?<version>[\d.]+)- registryUrl=https://download.docker.com/linux/ubuntu?suite=noble&components=stable&binaryArch=arm64
docker_install_containerd_version: "2.3.5"
# renovate: datasource=deb depName=docker-compose-plugin versioning=semver extractVersion=^(?:\d+:)?(?<version>[\d.]+)- registryUrl=https://download.docker.com/linux/ubuntu?suite=noble&components=stable&binaryArch=arm64
docker_install_compose_plugin_version: "5.5.1"
# renovate: datasource=deb depName=docker-buildx-plugin versioning=semver extractVersion=^(?:\d+:)?(?<version>[\d.]+)- registryUrl=https://download.docker.com/linux/ubuntu?suite=noble&components=stable&binaryArch=arm64
docker_install_buildx_plugin_version: "0.37.1"

# Docker's apt versions are `<upstream>-<rev>~ubuntu.<release>~<codename>` for every package,
# and the two Moby packages carry a `5:` epoch on top. Keys are exactly docker_engine_packages
# (group_vars/all.yml, the hold list); ansible/tests/setup/test_docker_engine_is_held_before_apt_upgrade.py
# refuses a package on one list and not the other, so nothing is installed the hold never sees.
#
# DECIDED: the Debian revision is a GLOB, never a literal `-1` (#2357). A pin here names an
# UPSTREAM version -- Renovate strips the revision from the version space it reads
# (renovate.json), so it cannot propose one, nor prove that `-1` exists for what it proposes.
# Docker publishes several revisions of one upstream version: the noble/arm64 index carries
# `containerd.io 2.3.4-1~ubuntu.24.04~noble` and `2.3.4-2~ubuntu.24.04~noble` side by side. A
# hardcoded `-1` therefore asserted a revision nothing verifies, and a repackage superseding a
# withdrawn `-1` rendered a spec apt cannot resolve -- `no available installation candidate`
# from the fresh install and from the deliberate upgrade's pending check.
# ansible.builtin.apt fnmatches the version in a `name=version` spec (its own
# `package_best_match` pins the pattern at priority 1001) and hands apt-get the concrete
# newest match, so apt chooses the revision. Measured on daniel-pi 2026-09-24 in check
# mode: `containerd.io=2.3.4-*~ubuntu.24.04~noble` built
# `apt-get --simulate install 'containerd.io=2.3.4-2~ubuntu.24.04~noble'`, the newer revision of
# the two. Long form in this role's CLAUDE.md.
docker_install_apt_suffix: "-*~ubuntu.{{ ansible_facts.distribution_version }}~{{ ansible_facts.distribution_release }}"
docker_install_package_versions:
  docker-ce: "5:{{ docker_install_engine_version }}"
  docker-ce-cli: "5:{{ docker_install_engine_version }}"
  containerd.io: "{{ docker_install_containerd_version }}"
  docker-compose-plugin: "{{ docker_install_compose_plugin_version }}"
  docker-buildx-plugin: "{{ docker_install_buildx_plugin_version }}"
# The `name=version` specs apt receives: `docker-ce=5:29.8.1-*~ubuntu.24.04~noble`.
docker_install_package_specs: >-
  {{ docker_install_package_versions | dict2items
     | map(attribute='key') | zip(docker_install_package_versions | dict2items | map(attribute='value'))
     | map('join', '=') | map('regex_replace', '$', docker_install_apt_suffix) | list }}

# The gate on the deliberate engine upgrade (tasks/install.yml). Tags cannot gate it on
# their own -- the role tag inherits onto the `never`-tagged include and overrides it
# -- so the upgrade needs `-e docker_install_engine_upgrade=true` as well as
# `--tags docker-engine-upgrade`.
docker_install_engine_upgrade: false

# GOMEMLIMIT for each Go daemon, paired with GOGC=off in a systemd drop-in
# (tasks/go-runtime.yml, tags `docker-go-runtime-dockerd` / `docker-go-runtime-containerd`).
# With GOGC off the limit is the only thing that starts a collection, so the distance from
# the daemon's live set plus the runtime's non-heap classes up to the limit is one cycle's
# allocation. Measured on daniel-pi over 4.3 h of the `dockerd-pi` and
# `containerd-pi` scrapes (roles/k8s/observability): live heap 11-14 MB each
# (`go_memstats_heap_alloc_bytes` floor 10.7 / 10.4 MB, `go_memstats_next_gc_bytes` up to
# 28.0 / 27.3 MB under the default GOGC=100), non-heap runtime 10.3 / 8.2 MB, allocation
# 114 / 97 KB/s, 0.70 / 0.68 GC cycles a minute -- ABOVE the two-minute forced-cycle floor,
# so today the heap goal is the trigger, not the timer. 64 MiB leaves ~40 MB of slack for
# dockerd (a cycle every ~350 s) and ~42 MB for containerd (every ~430 s), the cadence the
# Pi Alloy runs at, against ~85 s with the default GOGC. A "live + 50% + non-heap"
# recipe would give 31 / 28 MiB, 7 MB of slack, and a cycle every ~60 s -- more often than
# that; a percentage of a 14 MB heap is not slack. The guard that holds these above the
# floor is ansible/tests/setup/test_docker_daemons_gomemlimit_headroom.py; its docstring
# carries the re-measure queries.
#
# An empty value removes that daemon's drop-in and restarts it back to the runtime's
# defaults. Two scalars rather than one dict: Ansible replaces a dict on override, so a
# host_vars entry emptying one daemon's key would have dropped the other's as well.
# Sized for daniel-pi; every Docker host is the Pi.
docker_install_gomemlimit_dockerd: 64MiB
docker_install_gomemlimit_containerd: 64MiB
