---
- name: Restart rsyslog
  ansible.builtin.service:
    name: rsyslog
    state: restarted

- name: Reload audit rules
  ansible.builtin.command: augenrules --load
  become: true
  changed_when: true

# Notified by "Stop the hardware watchdog during provisioning (Pi)" in tasks/host-basics.yml.
- name: Start Watchdog after provisioning
  ansible.builtin.service:
    name: watchdog
    state: started

# i915 loads from the initramfs, so a modprobe.d option only reaches it once the
# initramfs is regenerated. update-grub is NOT run: kernel module parameters set this way
# don't touch the boot loader config.
- name: Rebuild initramfs for i915
  ansible.builtin.command: update-initramfs -u
  changed_when: true

# Deliberately no reboot handler. This fires on the machine running the whole homelab, and
# rebooting it unattended to apply a transcode tunable is not a trade initial_setup.yml should
# make on its own.
- name: Warn that a reboot is required for i915 GuC
  ansible.builtin.debug:
    msg: >-
      /etc/modprobe.d/i915.conf changed and the initramfs was rebuilt, but GuC firmware
      loading only takes effect after a reboot. Reboot this host when convenient, then
      confirm with `ls /dev/dri` and `dmesg | grep -i guc`.
