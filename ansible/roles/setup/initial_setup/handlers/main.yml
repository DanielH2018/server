---
# Handlers fire in the order they are DEFINED, not the order tasks notify them, and the roles
# in initial_setup.yml contribute theirs in role order. Two pairs below depend on that, so each
# pair stays in this one file. optimize_pi notifies `Restart systemd-journald` and
# `Restart Watchdog` across the role boundary; they live here rather than there because a
# role's handlers inherit its `when:`, and optimize_pi's is gated to one host while this role
# is unconditional.
- name: Restart fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: restarted

# BEFORE Restart systemd-journald. journald forwards at info (MaxLevelSyslog, see
# tasks/system-tuning.yml), so if journald restarted first there would be a window where every
# info line on the host reached /var/log/syslog before the filter that discards them was loaded.
- name: Restart rsyslog
  ansible.builtin.service:
    name: rsyslog
    state: restarted

- name: Restart systemd-journald
  ansible.builtin.service:
    name: systemd-journald
    state: restarted

- name: Reload Postfix
  ansible.builtin.service:
    name: postfix
    state: reloaded

# inet_interfaces changes require a full restart — `postfix reload` does not
# rebind listening sockets (per Postfix docs), so loopback-only wouldn't take
# effect until the next restart without this.
- name: Restart Postfix
  ansible.builtin.service:
    name: postfix
    state: restarted

- name: Restart SSH
  ansible.builtin.service:
    name: ssh
    state: restarted

- name: Reload audit rules
  ansible.builtin.command: augenrules --load
  become: true
  changed_when: true

# Notified by optimize_pi's watchdog config tasks.
- name: Restart Watchdog
  ansible.builtin.service:
    name: watchdog
    state: restarted

# Notified by "Stop the hardware watchdog during provisioning (Pi)" in tasks/host-basics.yml.
# After Restart Watchdog, because a restart already starts it.
- name: Start Watchdog after provisioning
  ansible.builtin.service:
    name: watchdog
    state: started

# i915 loads from the initramfs, so a modprobe.d option only reaches it once the
# initramfs is regenerated. update-grub is NOT run: kernel module parameters set this way
# don't touch the boot loader config.
- name: Rebuild initramfs for i915
  ansible.builtin.command: update-initramfs -u
  changed_when: true

# Deliberately no reboot handler. Unlike optimize_pi's "Reboot Pi" — gated to daniel-pi —
# this fires on the machine running the whole homelab, and rebooting it unattended to
# apply a transcode tunable is not a trade initial_setup.yml should make on its own.
- name: Warn that a reboot is required for i915 GuC
  ansible.builtin.debug:
    msg: >-
      /etc/modprobe.d/i915.conf changed and the initramfs was rebuilt, but GuC firmware
      loading only takes effect after a reboot. Reboot this host when convenient, then
      confirm with `ls /dev/dri` and `dmesg | grep -i guc`.
