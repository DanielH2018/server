---
# Pi memory safety — MUST run before the heavy apt below.
# The Zero 2 W has 512 MB RAM; apt-show-versions' cache build and
# `upgrade: dist` OOM-kill mid-dpkg without disk-backed swap, corrupting the
# package DB (the classic "dpkg was interrupted" deploy hang). The thrash can
# also trip the watchdog (`max-load-1 = 24`, hosts/components/pi-tuning/) into rebooting mid-apt,
# so we stop the watchdog for the run.
#
# The stop notifies a handler that starts the daemon again, because handlers run at the end of
# the play whichever tags were selected. A `state: started` task behind a `watchdog` tag left
# the watchdog daemon dead after any run that reached `pi-swap` without that tag:
# the 2026-09-27 23:28 run stopped it, wd_keepalive took over the device, and the daemon's load
# test stayed off for four days (#3241).
#
# The stop reports `changed` even on a stopped daemon, because Ansible fires a handler only on
# `changed`. Reporting `ok` there would leave a daemon that an interrupted run stopped dead through
# every later run (#7202).
- name: Gather service facts
  tags: [pi-swap]
  ansible.builtin.service_facts:
  when:
    - inventory_hostname not in initial_setup_packaged_hosts['host_basics']
    - has_low_memory_board

- name: Stop the hardware watchdog during provisioning (Pi)
  tags: [pi-swap]
  ansible.builtin.systemd:
    name: watchdog
    state: stopped
  become: true
  changed_when: true
  notify: Start Watchdog after provisioning
  when:
    - inventory_hostname not in initial_setup_packaged_hosts['host_basics']
    - has_low_memory_board
    - "'watchdog.service' in (ansible_facts.services | default({}))"

- name: Create swap file (Pi)
  tags: [pi-swap]
  ansible.builtin.command:
    cmd: "fallocate -l {{ pi_swapfile_size }} {{ pi_swapfile_path }}"
    creates: "{{ pi_swapfile_path }}"
  become: true
  register: initial_setup_swapfile_create
  when:
    - inventory_hostname not in initial_setup_packaged_hosts['host_basics']
    - has_low_memory_board

- name: Secure swap file permissions (Pi)
  tags: [pi-swap]
  ansible.builtin.file:
    path: "{{ pi_swapfile_path }}"
    owner: root
    group: root
    mode: "0600"
  become: true
  when:
    - inventory_hostname not in initial_setup_packaged_hosts['host_basics']
    - has_low_memory_board

- name: Format swap file (Pi)
  tags: [pi-swap]
  ansible.builtin.command:
    cmd: "mkswap {{ pi_swapfile_path }}"
  become: true
  changed_when: true
  when:
    - inventory_hostname not in initial_setup_packaged_hosts['host_basics']
    - has_low_memory_board
    - initial_setup_swapfile_create is changed

- name: Persist swap file in fstab (Pi)
  tags: [pi-swap]
  ansible.posix.mount:
    path: none
    src: "{{ pi_swapfile_path }}"
    fstype: swap
    opts: sw
    state: present
  become: true
  when:
    - inventory_hostname not in initial_setup_packaged_hosts['host_basics']
    - has_low_memory_board

- name: Activate swap file (Pi)
  tags: [pi-swap]
  ansible.builtin.command:
    cmd: "swapon {{ pi_swapfile_path }}"
  become: true
  changed_when: true
  when:
    - inventory_hostname not in initial_setup_packaged_hosts['host_basics']
    - has_low_memory_board
    - initial_setup_swapfile_create is changed

# The Docker engine must not move under running containers -- and it sits here, BEFORE the
# dist-upgrade, so the dist-upgrade never sees an unheld engine package.
- name: Check whether the Docker engine is installed (Docker hosts)
  tags: [apt-upgrade]
  # A stat, not package_facts: building the apt cache is the kind of memory spike the Pi
  # comment above warns about, and it would sit right in front of the heavy apt it guards.
  ansible.builtin.stat:
    path: /usr/bin/dockerd
  register: initial_setup_dockerd_binary
  when:
    - inventory_hostname not in initial_setup_packaged_hosts['host_basics']
    - has_docker

- name: Hold the Docker engine packages (Docker hosts)
  tags: [apt-upgrade]
  # DECIDED: the engine packages are held, so a dist-upgrade never touches them. On 2026-09-18
  # this task's dist-upgrade replaced containerd.io, docker-ce and the plugins on daniel-pi
  # with every container running: autoheal's shim died (`failed to create TTRPC connection`),
  # ssh refused connections for ~20 min, and docker-proxy sat unhealthy behind a stale socket
  # bind-mount until a hand redeploy recreated it (#1961). live-restore keeps containers up
  # across a dockerd restart; it does nothing for a shim binary swapped under them. The cost
  # is that a Docker security fix waits for homelab-docker-engine.service, which stops the
  # containers, upgrades, re-holds and recreates them -- docs/docker-engine-pins-and-runtime.md.
  # Guarded on the binary because dpkg_selections fails on a name dpkg has never seen: a
  # fresh host passes through here, and the engine unit holds them the moment it installs them.
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop: "{{ docker_engine_packages }}"
  become: true
  when:
    - inventory_hostname not in initial_setup_packaged_hosts['host_basics']
    - has_docker
    - initial_setup_dockerd_binary.stat.exists

- name: Update and upgrade system packages
  tags: [apt-upgrade]
  ansible.builtin.apt:
    update_cache: true
    upgrade: dist
  become: true
  when: inventory_hostname not in initial_setup_packaged_hosts['host_basics']

- name: Install Raspberry Pi-specific packages
  # openvswitch-switch-dpdk is deliberately absent from this list: it is never
  # configured (no bridges, no netplan stanzas) and mlockall-pins ~14 MB on the
  # 512 MB board. Step 4 of hosts/bootstrap-host.sh purges it, and listing it here
  # would reinstall it on every full run.
  tags: [packages]
  ansible.builtin.apt:
    name:
      - linux-raspi
      - wireguard
    state: present
  become: true
  when:
    - inventory_hostname not in initial_setup_packaged_hosts['host_basics']
    - has_raspi_kernel

# apt-show-versions hooks EVERY apt invocation with a full cache rebuild — 10-30 min
# of swap-thrash on the 512 MB Pi. The Pi
# gets nothing from it (apticron-style reporting), so it's roomy-hosts-only.
# The Pi removal runs before the base-package install below, so a missing base package
# can't trigger one final hook grind on the way in. The dist-upgrade and the Pi-specific
# install above run first, so a host still carrying it can pay their hook runs.
- name: Remove apt-show-versions (daniel-pi — apt-hook tax on 512 MB)
  ansible.builtin.apt:
    name: apt-show-versions
    state: absent
    purge: true
  become: true
  when:
    - inventory_hostname not in initial_setup_packaged_hosts['host_basics']
    - has_low_memory_board
  tags: [packages]

- name: Install required packages
  ansible.builtin.apt:
    name:
      - unzip
      - unattended-upgrades
      - update-notifier-common
      - fail2ban
      - libpam-tmpdir
      - debsums
      - jq  # Claude Code plugin hooks (ralph-loop stop-hook) parse hook JSON with it
    state: present
  become: true
  tags: [packages]
  when: inventory_hostname not in initial_setup_packaged_hosts['host_basics']

- name: Install apt-show-versions (roomy hosts only)
  # The inverse of the removal above, on the same fact: the apt-hook cache rebuild is the
  # cost a 512 MB board cannot pay.
  ansible.builtin.apt:
    name: apt-show-versions
    state: present
  become: true
  when:
    - inventory_hostname not in initial_setup_packaged_hosts['host_basics']
    - not has_low_memory_board
  tags: [packages]

- name: Resolve the deploy user's home directory
  tags: [tooling]
  # The play runs become:true, so gather_facts escalated and ansible_facts.env.HOME is /root.
  # H7.63 deletes this read with the two tool tasks below; no task reads the fact.
  ansible.builtin.shell: echo "$HOME"
  become: false
  changed_when: false
  register: initial_setup_user_home
  # Read-only, so it runs under --check too.
  check_mode: false

- name: Read the uv tools this host already has
  tags: [tooling]
  # `uv tool list` prints one `<name> v<version>` line per tool, which is what the install
  # below compares its pins against. A `creates:` guard on the tool directory would be
  # satisfied by any version, so a pin here would never reach a host that already has the
  # tool. /usr/bin/uv is the package's: ~/.local/bin/uv is the dotfiles repo's, which need not
  # have run yet on a rebuilt host.
  ansible.builtin.command: /usr/bin/uv tool list
  register: initial_setup_uv_tools
  changed_when: false
  failed_when: false
  become: false
  when: inventory_hostname in dev_tooling_hosts

- name: Install Python CLI tooling as uv tools
  tags: [tooling]
  # uv manages global CLI tools in isolated venvs (~/.local/share/uv/tools), exposing
  # shims in ~/.local/bin — the pipx replacement. Pinned to Python 3.15 to match the
  # repo's .python-version (the test/validate `uv run` hooks).
  #
  # Every tool is pinned, and each pin has a twin elsewhere in the tree that
  # ansible/tests/repo/test_host_tool_pins_match_their_twins.py holds it equal to:
  #   ansible-core  == pyproject.toml's dev-group pin -- the ansible that runs deploys is the
  #                    one the tests and `uv run ansible-playbook` resolve.
  #   ansible-lint  == prek.toml's ansible/ansible-lint rev (the hook's own version).
  # Renovate rewrites each pin here in the same PR as its twin (renovate.json groups them).
  ansible.builtin.command: "/usr/bin/uv tool install --python 3.15 {{ item }}"
  loop:
    - ansible-core==2.22.0rc2
    - ansible-lint==26.10.1
  become: false
  when:
    - inventory_hostname in dev_tooling_hosts
    - (item | replace('==', ' v')) not in (initial_setup_uv_tools.stdout_lines | default([]))

- name: Install pinned Ansible collections from requirements.yml
  tags: [collections]
  # The deployer applies a requirements.yml bump as `initial_setup.yml --tags collections`
  # (deploy_changes.setup_tags_for). The install goes to the path ansible.cfg loads from, as the
  # repo owner, so community.sops lands for the user who runs deploys. `command` runs on the
  # TARGET, but these are the CONTROLLER's collections: a host Ansible drives over ssh never
  # loads them.
  #
  # `playbook_dir` is a controller path, so it names the target's tree only on a
  # connection=local host. An ssh host gets its own checkout: a run from a session worktree
  # otherwise hands daniel-pi a path that exists only on the controller.
  become: false
  ansible.builtin.command: ansible-galaxy collection install -r requirements.yml -p collections
  args:
    chdir: >-
      {{ playbook_dir if ansible_connection == 'local'
         else '/home/' ~ sys_user ~ '/server/ansible' }}
  changed_when: false
  when: has_repo_checkout
