---
# Split out of main.yml on 2026-08-15; task content and tags are unchanged.
# Pi memory safety — MUST run before the heavy apt below.
# The Zero 2 W has 512 MB RAM; apt-show-versions' cache build and
# `upgrade: dist` OOM-kill mid-dpkg without disk-backed swap, corrupting the
# package DB (the classic "dpkg was interrupted" deploy hang). The thrash can
# also trip the optimize_pi watchdog (max-load-1=24) into rebooting mid-apt,
# so we stop the watchdog for the run — optimize_pi re-enables it at the end.
# This lives here, not in optimize_pi, because optimize_pi runs LAST in
# initial_setup.yml — too late to protect these apt tasks.
- name: Gather service facts
  tags: [pi-swap]
  ansible.builtin.service_facts:
  when: inventory_hostname == 'daniel-pi'

- name: Stop the hardware watchdog during provisioning (Pi)
  tags: [pi-swap]
  ansible.builtin.systemd:
    name: watchdog
    state: stopped
  become: true
  when:
    - inventory_hostname == 'daniel-pi'
    - "'watchdog.service' in (ansible_facts.services | default({}))"

- name: Create swap file (Pi)
  tags: [pi-swap]
  ansible.builtin.command:
    cmd: "fallocate -l {{ pi_swapfile_size }} {{ pi_swapfile_path }}"
    creates: "{{ pi_swapfile_path }}"
  become: true
  register: initial_setup_swapfile_create
  when: inventory_hostname == 'daniel-pi'

- name: Secure swap file permissions (Pi)
  tags: [pi-swap]
  ansible.builtin.file:
    path: "{{ pi_swapfile_path }}"
    owner: root
    group: root
    mode: "0600"
  become: true
  when: inventory_hostname == 'daniel-pi'

- name: Format swap file (Pi)
  tags: [pi-swap]
  ansible.builtin.command:
    cmd: "mkswap {{ pi_swapfile_path }}"
  become: true
  changed_when: true
  when:
    - inventory_hostname == 'daniel-pi'
    - initial_setup_swapfile_create is changed

- name: Persist swap file in fstab (Pi)
  tags: [pi-swap]
  ansible.posix.mount:
    path: none
    src: "{{ pi_swapfile_path }}"
    fstype: swap
    opts: sw
    state: present
  become: true
  when: inventory_hostname == 'daniel-pi'

- name: Activate swap file (Pi)
  tags: [pi-swap]
  ansible.builtin.command:
    cmd: "swapon {{ pi_swapfile_path }}"
  become: true
  changed_when: true
  when:
    - inventory_hostname == 'daniel-pi'
    - initial_setup_swapfile_create is changed

# The Docker engine must not move under running containers -- and it sits here, BEFORE the
# dist-upgrade, because docker_install runs after this role in initial_setup.yml, so a hold
# set there would land one full upgrade too late.
- name: Check whether the Docker engine is installed (Docker hosts)
  tags: [apt-upgrade]
  # A stat, not package_facts: building the apt cache is the kind of memory spike the Pi
  # comment above warns about, and it would sit right in front of the heavy apt it guards.
  ansible.builtin.stat:
    path: /usr/bin/dockerd
  register: initial_setup_dockerd_binary
  when: has_docker

- name: Hold the Docker engine packages (Docker hosts)
  tags: [apt-upgrade]
  # DECIDED: the engine packages are held, so a dist-upgrade never touches them. On 2026-09-18
  # this task's dist-upgrade replaced containerd.io, docker-ce and the plugins on daniel-pi
  # with every container running: autoheal's shim died (`failed to create TTRPC connection`),
  # ssh refused connections for ~20 min, and docker-proxy sat unhealthy behind a stale socket
  # bind-mount until a hand redeploy recreated it (#1961). live-restore keeps containers up
  # across a dockerd restart; it does nothing for a shim binary swapped under them. The cost
  # is that a Docker security fix waits for `--tags docker-engine-upgrade`, which stops the
  # containers, upgrades, re-holds and recreates them -- see docker_install's CLAUDE.md.
  # Guarded on the binary because dpkg_selections fails on a name dpkg has never seen: a
  # fresh host passes through here and docker_install holds them the moment it installs them.
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop: "{{ docker_engine_packages }}"
  become: true
  when:
    - has_docker
    - initial_setup_dockerd_binary.stat.exists

- name: Update and upgrade system packages
  tags: [apt-upgrade]
  ansible.builtin.apt:
    update_cache: true
    upgrade: dist
  become: true

- name: Install Raspberry Pi-specific packages
  # openvswitch-switch-dpdk was removed from this list 2026-06-11: it was never
  # configured (no bridges, no netplan stanzas) and mlockall-pinned ~14 MB on the
  # 512 MB board — optimize_pi's debloat task now purges it, and listing it here
  # would reinstall it on every full run.
  tags: [packages]
  ansible.builtin.apt:
    name:
      - linux-raspi
      - wireguard
    state: present
  become: true
  when: inventory_hostname == 'daniel-pi'

# apt-show-versions hooks EVERY apt invocation with a full cache rebuild — 10-30 min
# of swap-thrash on the 512 MB Pi (caused the 2026-06-08 dpkg corruption pre-swapfile,
# and the 2026-06-10 "hung play" → stacked-run → watchdog-reboot incident). The Pi
# gets nothing from it (apticron-style reporting), so it's roomy-hosts-only.
# The Pi removal runs BEFORE any other package work so a missing base package
# can't trigger one final hook grind on the way in.
- name: Remove apt-show-versions (daniel-pi — apt-hook tax on 512 MB)
  ansible.builtin.apt:
    name: apt-show-versions
    state: absent
    purge: true
  become: true
  when: inventory_hostname == 'daniel-pi'
  tags: [packages]

- name: Install required packages
  ansible.builtin.apt:
    name:
      - unzip
      - unattended-upgrades
      - update-notifier-common
      - fail2ban
      - libpam-tmpdir
      - debsums
      - jq  # Claude Code plugin hooks (ralph-loop stop-hook) parse hook JSON with it
    state: present
  become: true
  tags: [packages]

- name: Install apt-show-versions (non-Pi hosts only)
  ansible.builtin.apt:
    name: apt-show-versions
    state: present
  become: true
  when: inventory_hostname != 'daniel-pi'
  tags: [packages]

- name: Resolve the deploy user's home directory
  # Dual-tagged: registers a fact consumed by BOTH the uv tasks (tooling) and the
  # prek task (git-hooks); a tag-scoped run of either still needs it.
  tags: [tooling, git-hooks]
  # The play runs become:true, so gather_facts escalated and ansible_facts.env.HOME is
  # /root. The uv/prek tasks below run become:false (per-user installs as the connecting
  # user), so they need THAT user's home, not root's. Capture it explicitly here rather
  # than re-gathering env facts globally (config_files/docker_install also read env facts).
  ansible.builtin.shell: echo "$HOME"
  become: false
  changed_when: false
  register: initial_setup_user_home
  # Read-only, so it runs under --check too. Skipped, its stdout is empty and every consumer
  # renders a path under `/.local` -- the get_url below failed a --check that way (#2148).
  check_mode: false

- name: Create the connecting user's installers directory
  tags: [tooling]
  # Fetched to a user-owned directory rather than /tmp: the script is executed, and /tmp is
  # world-writable. Same directory chezmoi_setup uses for its installer.
  ansible.builtin.file:
    path: "{{ initial_setup_user_home.stdout }}/.local/share/installers"
    state: directory
    mode: "0755"
  become: false
  when: inventory_hostname in dev_tooling_hosts

- name: Download the pinned uv installer
  tags: [tooling]
  # The versioned URL, not astral.sh/uv/install.sh: that one installs the newest release at
  # run time, so two hosts provisioned a month apart got different uv (#2148 -- daniel-box
  # 0.12.1 and daniel-server 0.12.5 on 2026-09-21). The checksum re-fetches a copy on the
  # host that hashes differently and fails a fetch that does. The version, the URL and the
  # sha256 are `defaults/main.yml`'s, beside each other, so `scripts/validate/asset_pins.py`
  # can render the URL and check the hash without a raw curl (#2301).
  ansible.builtin.get_url:
    url: "{{ initial_setup_uv_installer_url }}"
    dest: "{{ initial_setup_user_home.stdout }}/.local/share/installers/uv-install.sh"
    mode: "0755"
    checksum: "sha256:{{ initial_setup_uv_installer_sha256 }}"
  become: false
  when: inventory_hostname in dev_tooling_hosts

- name: Read the uv version this host already has
  tags: [tooling]
  # `creates:` would be wrong here -- any uv satisfies it, so a version bump would never
  # install. The absolute path, for the reason the Vale read below gives.
  ansible.builtin.command: "{{ initial_setup_user_home.stdout }}/.local/bin/uv --version"
  register: initial_setup_uv_installed
  changed_when: false
  failed_when: false
  become: false
  when: inventory_hostname in dev_tooling_hosts

- name: Install uv (per-user; PEP 668-safe on 24.04+)
  tags: [tooling]
  # 24.04 / Python 3.12 marks the system environment externally-managed (PEP 668), so a
  # global `pip install` errors. uv is a standalone binary (no system Python needed),
  # installed per-user into ~/.local/bin via the pinned script above. Run as the connecting
  # user (not the play's become: true) so it lands in the repo owner's home. The script
  # replaces an older uv in place, so this is also how a pin bump reaches a host.
  ansible.builtin.command:
    cmd: "{{ initial_setup_user_home.stdout }}/.local/share/installers/uv-install.sh"
  changed_when: true
  become: false
  when:
    - inventory_hostname in dev_tooling_hosts
    - (initial_setup_uv_installed.stdout | default('')).split()[1:2] != [initial_setup_uv_version]

- name: Read the uv tools this host already has
  tags: [tooling]
  # `uv tool list` prints one `<name> v<version>` line per tool, which is what the install
  # below compares its pins against. `creates:` on the tool directory used to guard the
  # install, and any version satisfied it -- so a pin here would never have reached a host
  # that already had the tool (#2148).
  ansible.builtin.command: "{{ initial_setup_user_home.stdout }}/.local/bin/uv tool list"
  register: initial_setup_uv_tools
  changed_when: false
  failed_when: false
  become: false
  when: inventory_hostname in dev_tooling_hosts

- name: Install Python CLI tooling as uv tools
  tags: [tooling]
  # uv manages global CLI tools in isolated venvs (~/.local/share/uv/tools), exposing
  # shims in ~/.local/bin — the pipx replacement. Pinned to Python 3.14 to match the
  # repo's .python-version (the test/validate `uv run` hooks). Per-user, so `prek install`
  # (below) finds prek on ~/.local/bin.
  #
  # Every tool is pinned, and each pin has a twin elsewhere in the tree that
  # ansible/tests/repo/test_host_tool_pins_match_their_twins.py holds it equal to:
  #   ansible-core  == pyproject.toml's dev-group pin -- the ansible that runs deploys is the
  #                    one the tests and `uv run ansible-playbook` resolve. On 2026-09-21 the
  #                    two hosts ran 2.21.0 and 2.21.2 against a 2.21.4 lock (#2148).
  #   ansible-lint  == prek.toml's ansible/ansible-lint rev (the hook's own version).
  #   prek          == ci.yml's `pip install prek==` pin.
  # Renovate rewrites each pin here in the same PR as its twin (renovate.json groups them).
  ansible.builtin.command: "{{ initial_setup_user_home.stdout }}/.local/bin/uv tool install --python 3.14 {{ item }}"
  loop:
    - ansible-core==2.21.4
    - ansible-lint==26.8.0
    - prek==0.5.3
  become: false
  when:
    - inventory_hostname in dev_tooling_hosts
    - (item | replace('==', ' v')) not in (initial_setup_uv_tools.stdout_lines | default([]))

- name: Install the pinned host Python
  tags: [tooling]
  # become: false to match how uv itself is installed above — uv keeps interpreters under the
  # connecting user's data dir.
  ansible.builtin.command:
    cmd: "{{ initial_setup_user_home.stdout }}/.local/bin/uv python install {{ host_python_version }}"
  register: initial_setup_host_python
  changed_when: "'Installed' in initial_setup_host_python.stdout"
  become: false
  when: inventory_hostname in dev_tooling_hosts

- name: Publish uv at a stable path for systemd and cron
  tags: [tooling]
  # Host scripts run through `uv run`, so what needs a stable absolute path is UV, not a Python.
  # systemd and cron inherit no useful PATH and cannot expand ~, and hardcoding the connecting
  # user's home into unit files couples them to a path that is not guaranteed.
  #
  # Deliberately NOT a python3.14 symlink: a second system-level interpreter would be a second
  # way to run Python on these hosts, and the whole point is that there is one way — uv.
  ansible.builtin.file:
    src: "{{ initial_setup_user_home.stdout }}/.local/bin/uv"
    dest: /usr/local/bin/uv
    state: link
    force: true
  become: true
  when: inventory_hostname in dev_tooling_hosts

- name: Pin the Vale version this host installs
  tags: [tooling]
  # The prek `vale` hook is `language = "system"`, so it runs whatever binary is on PATH and
  # fails with exit 127 where there is none. .github/workflows/ci.yml installs the same version
  # on the runner, so CI passed while a commit touching any top-level docs page died on a
  # workstation (#1703) — and the way round it is a hand-fetched tarball or `--no-verify`.
  #
  # ONE copy of the version, set here rather than in group_vars: Renovate's Vale manager reads
  # this file and ci.yml together, and a version in group_vars/all.yml would land in the k8s
  # image group instead (renovate.json's matchFileNames). The two copies agreeing is ENFORCED by
  # ansible/tests/repo/test_vale_matches_the_ci_pin.py.
  ansible.builtin.set_fact:
    initial_setup_vale_version: "3.22.0"
  when: inventory_hostname in dev_tooling_hosts

- name: Read the Vale version this host already has
  tags: [tooling]
  # `creates:` would be wrong here — it is satisfied by ANY vale on the path, so a version bump
  # would never install. Reading the version is what makes the bump take effect.
  #
  # The ABSOLUTE path, not a bare `vale`: a bare one resolves against the remote PATH, which on
  # a host carrying a hand-installed ~/.local/bin/vale (what PR #1702 left on daniel-server)
  # reports that copy's version. The task would then skip, /usr/local/bin/vale would never be
  # written, and the role would report success having installed nothing. Remove a hand-installed
  # copy once this has run — it shadows /usr/local/bin on an interactive PATH.
  ansible.builtin.command: /usr/local/bin/vale --version
  register: initial_setup_vale_installed
  changed_when: false
  failed_when: false
  become: false
  when: inventory_hostname in dev_tooling_hosts

- name: Install the pinned Vale binary
  tags: [tooling]
  # Only on `dev_tooling_hosts`: this exists for the prek hook, and a host nobody commits from
  # never runs one. That gate used to be `has_repo_checkout`, which admitted daniel-pi — it
  # holds a checkout but is driven remotely over ssh (issue #1726).
  #
  # No checksum pin, unlike sops_setup's binary. That one is the root of the secret-decryption
  # trust chain; this is a prose linter for Markdown, and ci.yml fetches it unverified from the
  # same release. Pinning a per-arch sha256 here would make every Renovate bump a manual finish
  # for no trust gained over what CI already does.
  ansible.builtin.unarchive:
    src: >-
      https://github.com/vale-cli/vale/releases/download/v{{ initial_setup_vale_version }}/vale_{{ initial_setup_vale_version }}_Linux_{{ vale_asset_arch }}.tar.gz
    dest: /usr/local/bin
    remote_src: true
    include: [vale]
    mode: "0755"
    owner: root
    group: root
  vars:
    # Vale's own asset naming, not Debian's: `64-bit` where apt would say `amd64`.
    vale_asset_arch: "{{ '64-bit' if ansible_facts.architecture == 'x86_64' else 'arm64' }}"
  become: true
  when:
    - inventory_hostname in dev_tooling_hosts
    - initial_setup_vale_version not in (initial_setup_vale_installed.stdout | default('')).split()
