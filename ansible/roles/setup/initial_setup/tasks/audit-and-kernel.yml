---
# auditd, sensitive-file permissions, the rare-protocol module blacklist, the
# WireGuard module, and Intel GuC firmware for QuickSync.
# Split out of main.yml on 2026-08-15; task content and tags are unchanged.

- name: Install auditd
  tags: [audit]
  ansible.builtin.apt:
    name: auditd
    state: present
  become: true

- name: Enable and start auditd
  tags: [audit]
  ansible.builtin.systemd:
    name: auditd
    state: started
    enabled: true
  become: true

- name: Configure audit rules
  tags: [audit]
  ansible.builtin.copy:
    dest: /etc/audit/rules.d/hardening.rules
    owner: root
    group: root
    mode: "0640"
    content: |
      # Identity file changes
      -w /etc/passwd -p wa -k identity
      -w /etc/group -p wa -k identity
      -w /etc/shadow -p wa -k identity
      # SSH configuration changes
      -w /etc/ssh/sshd_config -p wa -k sshd
      # Privilege escalation changes
      -w /etc/sudoers -p wa -k actions
      -w /etc/sudoers.d -p wa -k actions
  become: true
  notify: Reload audit rules

- name: Restrict sensitive file permissions
  tags: [file-perms]
  ansible.builtin.file:
    path: "{{ item.path }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "/etc/ssh/sshd_config", mode: "0600" }
    - { path: "/etc/crontab", mode: "0600" }
    - { path: "/boot/grub/grub.cfg", mode: "0600" }
    - { path: "/etc/cron.d", mode: "0700" }
    - { path: "/etc/cron.daily", mode: "0700" }
    - { path: "/etc/cron.hourly", mode: "0700" }
    - { path: "/etc/cron.weekly", mode: "0700" }
    - { path: "/etc/cron.monthly", mode: "0700" }
  become: true
  failed_when: false

- name: Blacklist unused rare network kernel modules
  tags: [kernel-modules]
  ansible.builtin.copy:
    dest: /etc/modprobe.d/blacklist-rare-network.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      install dccp /bin/true
      install sctp /bin/true
      install rds /bin/true
      install tipc /bin/true
  become: true

# WireGuard containers (wg-easy — runs on both daniel-server and daniel-pi — and
# qbittorrent's VPN sidecar) run without the SYS_MODULE capability, so the host must
# provide the kernel module.
- name: Ensure the WireGuard kernel module is loaded on the host
  tags: [kernel-modules]
  community.general.modprobe:
    name: wireguard
    state: present
  become: true

- name: Persist the WireGuard kernel module across reboots
  tags: [kernel-modules]
  ansible.builtin.copy:
    content: "wireguard\n"
    dest: /etc/modules-load.d/wireguard.conf
    owner: root
    group: root
    mode: "0644"
  become: true

# QuickSync transcode for jellyfin/tdarr needs the i915 GuC firmware loaded. This was a
# hand-run `echo … | tee -a` in the bring-up runbook, which appends a DUPLICATE option line
# every time it's run — daniel-server's i915.conf carries the line twice from exactly that.
#
# has_igpu alone is the WRONG gate: it means "pass /dev/dri through to jellyfin/tdarr", which
# is vendor-neutral (AMD does VAAPI through the same device node), whereas enable_guc is an
# i915 option. So detect the driver rather than trusting the flag or hardcoding a hostname —
# /sys/module/i915 exists iff the i915 driver is loaded, and it loads on its own for any Intel
# GPU (the option only tunes it). On an AMD/NVIDIA host this skips instead of writing a
# modprobe option for a module that never loads.
- name: Check whether the i915 driver is loaded (Intel GPU)
  tags: [igpu]
  ansible.builtin.stat:
    path: /sys/module/i915
  register: initial_setup_i915_module

- name: Enable Intel GuC firmware loading for QuickSync transcode
  tags: [igpu]
  when:
    - has_igpu | default(false)
    - initial_setup_i915_module.stat.exists
  ansible.builtin.copy:
    dest: /etc/modprobe.d/i915.conf
    owner: root
    group: root
    mode: "0644"
    content: "options i915 enable_guc=2\n"
  become: true
  notify:
    - Rebuild initramfs for i915
    - Warn that a reboot is required for i915 GuC
