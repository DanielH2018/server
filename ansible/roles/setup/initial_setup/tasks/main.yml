---
# The host baseline is package-owned: each host package and step 4 of hosts/bootstrap-host.sh
# carry it (H7.58 to H7.62), and the legacy lists retire the setup-drift check and the last cron
# arm (H7.63). docs/target-architecture/host/h7-delete-ansible.md.

# DECIDED: this role is emptied, never deleted, until H7.20a. A play that names a missing role
# fails to parse, so deleting the role would mean editing initial_setup.yml, which is in the
# deployer's _BROAD_MANUAL_PREFIXES. An unconditional end_role keeps the playbook line.
# setup_gates.role_end_guard reads this task, so the two-writer census and the setup census count
# the role as empty on every host.
- name: End the role, whose work the host packages own
  ansible.builtin.meta: end_role
