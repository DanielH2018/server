---
# Base host provisioning, applied to every host by initial_setup.yml.
#
# These are import_tasks, not include_tasks: imports are static, so every task keeps its own
# tags and --tags selection works as usual. Import ORDER is load-bearing —
# host-basics.yml must stay first (the Pi's swap has to exist before the heavy apt).

- name: Prepare swap, packages and user tooling
  ansible.builtin.import_tasks: host-basics.yml
- name: Scope the sudo cache and harden the SSH directory
  ansible.builtin.import_tasks: access.yml
  when: inventory_hostname not in initial_setup_packaged_hosts['access']
- name: Install the host crons
  ansible.builtin.import_tasks: crons.yml
- name: Filter rsyslog, revert host tuning and install git hooks
  ansible.builtin.import_tasks: system-tuning.yml
- name: Configure auditd, file permissions and kernel modules
  ansible.builtin.import_tasks: audit-and-kernel.yml
  when: inventory_hostname not in initial_setup_packaged_hosts['audit_and_kernel']
- name: Set the login banners
  ansible.builtin.import_tasks: accounting.yml
  when: inventory_hostname not in initial_setup_packaged_hosts['accounting']
- name: Suppress core dumps and mask networkd-dispatcher
  ansible.builtin.import_tasks: integrity.yml
  when: inventory_hostname not in initial_setup_packaged_hosts['integrity']
