---
# The sudo credential cache and the SSH directory ownership. The sshd settings, fail2ban and
# unattended upgrades are host-package components.

- name: Scope the sudo credential cache to the user rather than the terminal
  tags: [sudo-timestamp]
  # sudo's default timestamp_type is `tty`, and when there is NO controlling terminal it
  # falls back to keying the ticket on sudo's parent pid. Every Claude Code `!` command and
  # every `ssh host cmd` is a freshly spawned shell with a new pid, so each one gets a ticket
  # that nothing afterwards can match — the credential is re-requested every single time, and
  # no timeout value fixes that because the ticket is never *found*, only ever created.
  # `global` keys the ticket on the user alone, so one authentication covers every pane and
  # every non-tty shell for the window. Measured on daniel-box: two `sudo -v` calls
  # in one pane prompted once (per-tty caching was already working), while `sudo -n -v` from a
  # `!` command reported "a password is required" — the no-tty path, not expiry.
  #
  # This weakens the per-invocation veto and is a deliberate trade: within the window, sudo
  # called from inside a script or play no longer draws the ~/.local/bin/tmux-askpass popup,
  # so it succeeds without being seen. A password is still required to open the window.
  # Pairs with SUDO_ASKPASS + the ~/.local/bin/sudo shim in chezmoi's dot_zshenv, which solve
  # *where* to prompt; this solves how often. Audited — audit-and-kernel.yml watches
  # /etc/sudoers.d. `validate` is not optional: a malformed drop-in locks sudo out entirely,
  # and sudo is the only write path to the cluster (the k3s SA is read-only).
  ansible.builtin.copy:
    dest: /etc/sudoers.d/10-timestamp
    content: |
      # Managed by Ansible (roles/setup/initial_setup) — edits here are overwritten.
      Defaults timestamp_type=global, timestamp_timeout=60
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s
  become: true

- name: Harden the sys user's SSH directory
  tags: [ssh]
  # THE PATH IS ABSOLUTE, and has to be. The file module expands `~` as the BECOME user; this
  # play is `become: true` (ansible/initial_setup.yml) and the sudo plugin defaults to `-H`, so
  # `~` resolves to /root. A `~/.ssh` path would chown /root/.ssh to ubuntu recursively, which
  # StrictModes reads as a wrong-owner key file and refuses root's keys, while the sys user's
  # directory stays unhardened. The task would report `ok` throughout, because chowning the
  # wrong directory succeeds.
  #
  # `become: true` STAYS. With the path pinned, escalation no longer decides which directory is
  # written, and it is what lets this correct an owner that has already drifted to root.
  #
  # `u=rwX,go=` rather than 0700: a recursive numeric 0700 marks the public keys, known_hosts and
  # the ControlMaster sockets under cm/ executable. The capital X sets the search bit on
  # directories only, which is the distinction a numeric recursive mode cannot make.
  ansible.builtin.file:
    path: "/home/{{ sys_user }}/.ssh"
    state: directory
    mode: u=rwX,go=
    owner: "{{ sys_user }}"
    group: "{{ sys_user }}"
    recurse: true
  become: true

- name: Check whether root has an SSH directory
  tags: [ssh]
  ansible.builtin.stat:
    path: /root/.ssh
  register: initial_setup_root_ssh_dir
  become: true

- name: Give root back its own SSH directory
  tags: [ssh]
  # Pinning the path above stops the wrong directory being chowned; it does nothing about
  # ownership already on disk, which stays ubuntu-owned until something puts it back. Ownership
  # ONLY: root's modes are not this task's business. Guarded on the stat above so it can never
  # CREATE /root/.ssh: a host where root has no keys should keep it that way.
  ansible.builtin.file:
    path: /root/.ssh
    state: directory
    owner: root
    group: root
    recurse: true
  become: true
  when: initial_setup_root_ssh_dir.stat.isdir | default(false)

- name: Create ssh-users group
  tags: [ssh]
  ansible.builtin.group:
    name: ssh-users
    state: present
  become: true

- name: Add sys user to ssh-users group
  tags: [ssh]
  ansible.builtin.user:
    name: "{{ sys_user }}"
    groups: ssh-users
    append: true
  become: true
