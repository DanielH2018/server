---
# Unattended security upgrades, fail2ban, and SSH hardening.
# Split out of main.yml on 2026-08-15; task content and tags are unchanged.

- name: Enable periodic unattended security upgrades
  tags: [unattended-upgrades]
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Download-Upgradeable-Packages "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Set local unattended-upgrades policy
  tags: [unattended-upgrades]
  # Security origins are enabled by the distro's 50unattended-upgrades. This local
  # drop-in pins the bits we care about: no surprise reboots (the weekly "Weekly
  # system restart" cron owns reboots) and cleanup of obsolete kernels/deps.
  #
  # Extra origins go in Origins-Pattern, not Allowed-Origins, and use the `::` APPEND syntax
  # rather than a `{ ... }` block. Two separate traps:
  #
  # 1. Allowed-Origins is the legacy `origin:archive` form, and unattended-upgrade rewrites
  #    each entry to `o=X,a=Y` — so it can only match a repo publishing a `Suite:` field.
  #    Origins-Pattern takes `key=value` pairs and can match on `codename`, `label` or `site`
  #    instead. The GitHub CLI repo has no Suite (origin='gh', archive='', codename='stable',
  #    measured via python-apt on daniel-box 2026-08-24), so `gh:stable` in Allowed-Origins
  #    matched nothing while reading as configured.
  # 2. A `{ ... }` block READS like a replacement. Both forms in fact append (measured with
  #    `apt-config -c`), but a replacement here would silently drop the -security and ESM
  #    pockets — deleting the whole protection while looking like it added to it.
  #
  # After any change to this task, verify with `apt-config dump` that BOTH
  # `Unattended-Upgrade::Allowed-Origins` still lists -security and
  # `Unattended-Upgrade::Origins-Pattern` lists the extras.
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/52unattended-upgrades-local
    content: |
      Unattended-Upgrade::Automatic-Reboot "false";
      Unattended-Upgrade::Remove-Unused-Kernel-Packages "true";
      Unattended-Upgrade::Remove-New-Unused-Dependencies "true";
      {% for pattern in unattended_upgrades_origins_patterns %}
      Unattended-Upgrade::Origins-Pattern:: "{{ pattern }}";
      {% endfor %}
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Scope the sudo credential cache to the user rather than the terminal
  tags: [sudo-timestamp]
  # sudo's default timestamp_type is `tty`, and when there is NO controlling terminal it
  # falls back to keying the ticket on sudo's parent pid. Every Claude Code `!` command and
  # every `ssh host cmd` is a freshly spawned shell with a new pid, so each one gets a ticket
  # that nothing afterwards can match — the credential is re-requested every single time, and
  # no timeout value fixes that because the ticket is never *found*, only ever created.
  # `global` keys the ticket on the user alone, so one authentication covers every pane and
  # every non-tty shell for the window. Measured on daniel-box 2026-08-16: two `sudo -v` calls
  # in one pane prompted once (per-tty caching was already working), while `sudo -n -v` from a
  # `!` command reported "a password is required" — the no-tty path, not expiry.
  #
  # This weakens the per-invocation veto and is a deliberate trade: within the window, sudo
  # called from inside a script or play no longer draws the ~/.local/bin/tmux-askpass popup,
  # so it succeeds without being seen. A password is still required to open the window.
  # Pairs with SUDO_ASKPASS + the ~/.local/bin/sudo shim in chezmoi's dot_zshenv, which solve
  # *where* to prompt; this solves how often. Audited — audit-and-kernel.yml watches
  # /etc/sudoers.d. `validate` is not optional: a malformed drop-in locks sudo out entirely,
  # and sudo is the only write path to the cluster (the k3s SA is read-only).
  ansible.builtin.copy:
    dest: /etc/sudoers.d/10-timestamp
    content: |
      # Managed by Ansible (roles/setup/initial_setup) — edits here are overwritten.
      Defaults timestamp_type=global, timestamp_timeout=60
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s
  become: true

- name: Enable and start fail2ban
  tags: [fail2ban]
  ansible.builtin.systemd:
    name: fail2ban
    state: started
    enabled: true
  become: true

- name: Deploy fail2ban jail configuration
  tags: [fail2ban]
  ansible.builtin.template:
    src: fail2ban_homelab.conf.j2
    dest: /etc/fail2ban/jail.d/homelab.conf
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Restart fail2ban

- name: Set SSH directory permissions
  tags: [ssh]
  ansible.builtin.file:
    path: ~/.ssh
    mode: "0700"
    owner: ubuntu
    group: ubuntu
    recurse: true

- name: Create ssh-users group
  tags: [ssh]
  ansible.builtin.group:
    name: ssh-users
    state: present
  become: true

- name: Add sys user to ssh-users group
  tags: [ssh]
  ansible.builtin.user:
    name: "{{ sys_user }}"
    groups: ssh-users
    append: true
  become: true

- name: Configure SSH security settings
  tags: [ssh]
  ansible.builtin.lineinfile:
    path: "{{ ssh_config_path }}"
    regexp: "^#?{{ item.key }}"
    line: "{{ item.key }} {{ item.value }}"
  loop:
    - { key: "PasswordAuthentication", value: "no" }
    - { key: "PermitEmptyPasswords", value: "no" }
    - { key: "PermitRootLogin", value: "no" }
    - { key: "IgnoreRhosts", value: "yes" }
    - { key: "ChallengeResponseAuthentication", value: "no" }
    - { key: "MaxAuthTries", value: "3" }
    # 10 is OpenSSH's own default and still within the CIS ceiling. MaxSessions caps channels
    # per CONNECTION, not per host, and every interactive session to these hosts is multiplexed
    # down one ControlMaster connection (chezmoi home/private_dot_ssh/private_config.tmpl) —
    # so 2 meant two concurrent shells per host. The third got `error: no more sessions` from
    # sshd, which the client reports as `mux_client_request_session: session request failed:
    # Session open refused by peer`. It then falls back to its own connection and cannot claim
    # the control socket, so one refusal produced several error lines.
    - { key: "MaxSessions", value: "10" }
    - { key: "ClientAliveCountMax", value: "2" }
    - { key: "LoginGraceTime", value: "30" }
    - { key: "LogLevel", value: "VERBOSE" }
    - { key: "DisableForwarding", value: "yes" }
    - { key: "AllowTcpForwarding", value: "no" }
    - { key: "AllowAgentForwarding", value: "no" }
    - { key: "X11Forwarding", value: "no" }
    - { key: "Compression", value: "no" }
    - { key: "TCPKeepAlive", value: "no" }
    - { key: "AllowGroups", value: "ssh-users" }
  notify: Restart SSH

- name: Configure SSH Match block for sys user forwarding
  tags: [ssh]
  ansible.builtin.blockinfile:
    path: "{{ ssh_config_path }}"
    marker: "# {mark} ANSIBLE MANAGED BLOCK - sys user forwarding"
    block: |
      Match User {{ sys_user }}
          # `all`, not `local`. The clipboard bridge (chezmoi
          # home/dot_local/bin/executable_clip-bridge) needs the sys user to open ONE
          # reverse forward: a unix socket on this host that carries a clipboard read back
          # to the workstation, so Claude Code running here can answer an image paste.
          #
          # Setting only AllowStreamLocalForwarding does NOT achieve that, which cost an
          # afternoon to establish. sshd builds the channel layer from AllowTcpForwarding
          # alone: when it excludes FORWARD_REMOTE it calls channel_disable_admin() for
          # remote listens, and check_rfwd_permission then refuses EVERY remote forward --
          # unix-domain ones included -- before AllowStreamLocalForwarding is consulted.
          # The giveaway is the log line "to remote forward to path ... but the request was
          # denied", which comes from that permission check rather than from the forwarding
          # allowlist (whose refusal reads "Server has disabled port forwarding").
          #
          # So reverse TCP forwarding is unavoidably re-enabled here. It is a real widening
          # and the reason it is acceptable is that this user already has a full shell:
          # AllowTcpForwarding restricts a key used purely as a tunnel, not an account that
          # can run sshd -R itself. GatewayPorts stays at its default of no, so a reverse
          # forward binds this host's loopback only.
          AllowTcpForwarding all
          # Narrows the streamlocal side back down to the one direction the bridge needs.
          AllowStreamLocalForwarding remote
          # sshd, not the client, creates and removes the socket for a REMOTE forward, so
          # the client-side StreamLocalBindUnlink does nothing here and this is the one that
          # counts. Default is no: a tunnel killed uncleanly (suspend, network drop, reboot)
          # leaves the socket file behind, the next bind fails on it, and the workstation's
          # Restart=always tunnel then loops forever with nothing to self-heal against.
          StreamLocalBindUnlink yes
          DisableForwarding no
  notify: Restart SSH
