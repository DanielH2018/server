---
# rkhunter, /etc/login.defs policy, core-dump suppression, Postfix hardening,
# and the AIDE file-integrity baseline + weekly check.

- name: Install rkhunter malware scanner
  tags: [rkhunter]
  ansible.builtin.apt:
    name: rkhunter
    state: present
  become: true

- name: Update rkhunter data files
  tags: [rkhunter]
  ansible.builtin.command: rkhunter --update --nocolors
  become: true
  changed_when: false
  failed_when: false

- name: Initialize rkhunter file-properties baseline (first run only)
  tags: [rkhunter]
  # --propupd rewrites the *trusted* baseline of file hashes/properties. Running it
  # on every play would silently re-bless any tampering that happened between runs,
  # defeating the weekly --check. Guard it to first install; the APT_AUTOGEN setting
  # below keeps the baseline fresh after *legitimate* package upgrades instead.
  ansible.builtin.command: rkhunter --propupd --nocolors
  args:
    creates: /var/lib/rkhunter/db/rkhunter.dat
  become: true

- name: Refresh rkhunter baseline automatically after apt operations
  tags: [rkhunter]
  # With APT_AUTOGEN=true, rkhunter --propupd runs via the package-manager hook after
  # apt installs/upgrades (including unattended-upgrades), so the only file-property
  # changes the weekly scan flags are ones NOT explained by a trusted package event.
  ansible.builtin.lineinfile:
    path: /etc/default/rkhunter
    regexp: '^APT_AUTOGEN='
    line: 'APT_AUTOGEN="true"'
  become: true

- name: Read whether the main sshd_config sets PermitRootLogin, for rkhunter
  tags: [rkhunter]
  # rkhunter reads this one file and none of its drop-ins, so rkhunter.conf.local below expects
  # a line here only where one exists. Read on every run rather than set per host: daniel-box
  # hardens a drop-in, yet its main file carries the line, and daniel-pi's main file does not.
  # The pattern is the one rkhunter 1.4.6 greps with.
  ansible.builtin.command: grep -qiE '^[[:space:]]*PermitRootLogin[[:space:]=]' /etc/ssh/sshd_config
  register: initial_setup_rkhunter_sshd_root_login
  changed_when: false
  failed_when: initial_setup_rkhunter_sshd_root_login.rc > 1
  check_mode: false
  become: true

- name: Allowlist the warnings rkhunter raises every week from benign causes
  tags: [rkhunter]
  # rkhunter-check.sh pages on any warning (#4638), so a routine warning left out of this file
  # turns the tile red every Wednesday. A regular file, not a link: rkhunter skips a symlinked
  # .local file.
  ansible.builtin.template:
    src: rkhunter.conf.local.j2
    dest: /etc/rkhunter.conf.local
    owner: root
    group: root
    mode: "0644"
  vars:
    # `unset` accepts only an absent line, so a PermitRootLogin of any value later added to the
    # main file still warns.
    initial_setup_rkhunter_allow_ssh_root_user: >-
      {{ 'no' if initial_setup_rkhunter_sshd_root_login.rc == 0 else 'unset' }}
  become: true

- name: Create the rkhunter scan credentials directory
  tags: [rkhunter]
  # Same owner and mode as the AIDE, setup-drift and Loki-witness tasks that also create it, so
  # they never fight over it.
  ansible.builtin.file:
    path: /etc/homelab
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Deploy the rkhunter scan push credentials
  tags: [rkhunter]
  # 0600 root: the scan runs as root and nothing else reads this file. A push token is enough to
  # forge or suppress the heartbeat.
  ansible.builtin.template:
    src: rkhunter-kuma-push.env.j2
    dest: /etc/homelab/rkhunter-kuma-push.env
    owner: root
    group: root
    mode: "0600"
  become: true
  no_log: true  # renders a Kuma push token

- name: Deploy the weekly rkhunter scan
  tags: [rkhunter]
  # The script runs rkhunter, reads whether the scan completed from its log, and pushes the
  # verdict to this host's Kuma tile; its header has why the exit code alone cannot say (#4598).
  ansible.builtin.template:
    src: rkhunter-check.sh.j2
    dest: /usr/local/bin/rkhunter-check.sh
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Schedule weekly rkhunter scan
  tags: [rkhunter]
  ansible.builtin.cron:
    name: "Weekly rkhunter malware scan"
    minute: "0"
    hour: "2"
    # Wednesday, staggered off the Monday AIDE check, which runs for over an hour
    # on the Pi. The two once overlapped there at full priority; an rkhunter scan
    # takes two to three minutes. The script runs rkhunter nice/ionice-idle so a
    # scan can never starve containers.
    weekday: "3"
    # The script logs the warnings and its verdict itself; this routes anything else it prints,
    # such as a bash error, to the journal rather than to root's unread mail spool.
    job: "/usr/local/bin/rkhunter-check.sh 2>&1 | /usr/bin/logger -t rkhunter-check"
    user: root
  become: true

- name: Record the rendered rkhunter scan
  tags: [rkhunter]
  ansible.builtin.import_tasks: "{{ role_path }}/../common/tasks/stamp_render.yml"
  vars:
    stamp_render_name: rkhunter-check
    stamp_render_templates:
      - ansible/roles/setup/initial_setup/templates/rkhunter-check.sh.j2
      - ansible/roles/setup/initial_setup/templates/rkhunter-kuma-push.env.j2
      - ansible/roles/setup/initial_setup/templates/rkhunter.conf.local.j2

- name: Set default umask to 027 in /etc/login.defs
  tags: [login-defs]
  when: inventory_hostname not in initial_setup_packaged_hosts['sysctl']
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    regexp: '^UMASK\s'
    line: "UMASK\t\t027"
  become: true

- name: Configure password hash rounds in /etc/login.defs
  tags: [login-defs]
  when: inventory_hostname not in initial_setup_packaged_hosts['sysctl']
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    regexp: '^#?\s*{{ item.key }}\s'
    line: "{{ item.key }}\t{{ item.value }}"
  loop:
    - { key: "SHA_CRYPT_MIN_ROUNDS", value: "65536" }
    - { key: "SHA_CRYPT_MAX_ROUNDS", value: "65536" }
  become: true

- name: Configure password age policy in /etc/login.defs
  tags: [login-defs]
  when: inventory_hostname not in initial_setup_packaged_hosts['sysctl']
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    regexp: '^{{ item.key }}\s'
    line: "{{ item.key }}\t{{ item.value }}"
  loop:
    - { key: "PASS_MIN_DAYS", value: "1" }
    - { key: "PASS_MAX_DAYS", value: "365" }
    - { key: "PASS_WARN_AGE", value: "14" }
  become: true

- name: Disable core dumps in /etc/security/limits.conf
  tags: [coredumps]
  when: inventory_hostname not in initial_setup_packaged_hosts['sysctl']
  ansible.builtin.lineinfile:
    path: /etc/security/limits.conf
    line: "* hard core 0"
    state: present
  become: true

- name: Create systemd coredump drop-in directory
  tags: [coredumps]
  ansible.builtin.file:
    path: /etc/systemd/coredump.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Disable core dumps via systemd coredump
  tags: [coredumps]
  ansible.builtin.copy:
    dest: /etc/systemd/coredump.conf.d/disable.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      [Coredump]
      Storage=none
      ProcessSizeMax=0
  become: true

- name: Bind Postfix to loopback only (send-only local mailer)
  tags: [postfix]
  # Postfix here only delivers local system mail (cron/AIDE/rkhunter -> root); it
  # never needs to accept SMTP from the network. The package default
  # `inet_interfaces = all` binds 0.0.0.0:25 — exposed to the whole LAN (and to the
  # internet if the router ever forwards 25). `mynetworks` already restricts RELAY to
  # loopback so it's not an open relay, but loopback-only removes the listener from
  # the network surface entirely while local submission + delivery keep working.
  # Needs a RESTART (notify below), not reload — inet_interfaces rebinds sockets.
  ansible.builtin.lineinfile:
    path: /etc/postfix/main.cf
    regexp: '^inet_interfaces\s*='
    line: "inet_interfaces = loopback-only"
  become: true
  notify: Restart Postfix

- name: Harden Postfix SMTP banner to hide OS info
  tags: [postfix]
  ansible.builtin.lineinfile:
    path: /etc/postfix/main.cf
    regexp: '^smtpd_banner\s*='
    line: "smtpd_banner = $myhostname ESMTP"
  become: true
  notify: Reload Postfix

- name: Disable Postfix VRFY command
  tags: [postfix]
  ansible.builtin.lineinfile:
    path: /etc/postfix/main.cf
    regexp: '^disable_vrfy_command\s*='
    line: "disable_vrfy_command = yes"
  become: true
  notify: Reload Postfix

- name: Install AIDE file integrity monitor
  tags: [aide]
  ansible.builtin.apt:
    name: aide
    state: present
  become: true

- name: Deploy local AIDE exclusions for Docker homelab
  tags: [aide]
  ansible.builtin.template:
    src: 98_aide_local.conf.j2
    # No dot in the name: Debian's aide.conf includes this directory with
    # `@@x_include /etc/aide/aide.conf.d ^[a-zA-Z0-9_-]+$`, so a file named
    # `98_aide_local.conf` is skipped without a word. It was, from 2026-05-31 to 2026-10-20,
    # and every exclusion below went unread while `aide --config-check` passed (#5785).
    dest: /etc/aide/aide.conf.d/98_aide_local
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Remove the AIDE exclusions file AIDE never loaded
  tags: [aide]
  # The dotted name the task above used until #5785. Left in place it is inert, but it reads
  # as the live config to anyone who opens the directory.
  ansible.builtin.file:
    path: /etc/aide/aide.conf.d/98_aide_local.conf
    state: absent
  become: true

- name: Initialize AIDE database with progress monitoring
  tags: [aide]
  ansible.builtin.shell: |
    set -o pipefail
    aideinit &
    AIDEINIT_PID=$!
    sleep 5
    AIDE_PID=$(pgrep -P "$AIDEINIT_PID" -x aide 2>/dev/null || pgrep -x aide 2>/dev/null)
    PREV_BYTES=0
    while kill -0 "$AIDEINIT_PID" 2>/dev/null; do
      if [ -n "$AIDE_PID" ] && [ -f "/proc/$AIDE_PID/io" ]; then
        BYTES=$(awk '/^read_bytes/{print $2}' "/proc/$AIDE_PID/io" 2>/dev/null)
        GB=$(( BYTES / 1073741824 ))
        RATE_MB=$(( (BYTES - PREV_BYTES) / 1048576 ))
        echo "AIDE progress: ${GB}GB read, ${RATE_MB}MB/min"
        PREV_BYTES=$BYTES
      else
        echo "AIDE initializing..."
      fi
      sleep 60
    done
    wait "$AIDEINIT_PID"
  args:
    creates: /var/lib/aide/aide.db
    # pipefail (and the $!/arithmetic bashisms above) need bash, not dash (/bin/sh).
    executable: /bin/bash
  become: true
  changed_when: false

- name: Create the AIDE check credentials directory
  tags: [aide]
  # Same owner and mode as the setup-drift and Loki-witness tasks that also create it, so
  # the three never fight over it on a host that runs more than one.
  ansible.builtin.file:
    path: /etc/homelab
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Deploy the AIDE check push credentials
  tags: [aide]
  # 0600 root: the check runs as root and nothing else reads this file. A push token is enough
  # to forge or suppress the heartbeat.
  ansible.builtin.template:
    src: aide-kuma-push.env.j2
    dest: /etc/homelab/aide-kuma-push.env
    owner: root
    group: root
    mode: "0600"
  become: true
  no_log: true  # renders a Kuma push token

- name: Deploy the weekly AIDE check
  tags: [aide]
  # The script runs aide, keeps its exit code and pushes the verdict to this host's Kuma tile;
  # its header has the exit-code mapping and why differences push UP (#4594).
  ansible.builtin.template:
    src: aide-check.sh.j2
    dest: /usr/local/bin/aide-check.sh
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Schedule weekly AIDE integrity check
  tags: [aide]
  # The script runs aide nice/ionice-idle: the check reads the whole filesystem for >1h (Pi);
  # at normal priority it competes with containers for CPU and SD-card IO. The rkhunter scan
  # is staggered to Wednesday for the same reason.
  #
  # DECIDED: a cron, not a kuma_check_timer.yml timer like the setup-drift check. That file's
  # contract reruns a red check every RestartSec and once more at boot, and here every rerun is
  # another full-filesystem scan of an hour or more. The faults that turn this tile red, a broken
  # config or a missing database, do not clear by themselves, so a rerun would only repeat the
  # DOWN. The tile stays red until the next Monday run or a run of the script by hand.
  ansible.builtin.cron:
    name: "Weekly AIDE file integrity check"
    minute: "0"
    hour: "3"
    weekday: "1"
    # The script logs its own report and verdict; this routes anything else it prints, such as
    # a bash error, to the journal rather than to root's unread mail spool.
    job: "/usr/local/bin/aide-check.sh 2>&1 | /usr/bin/logger -t aide-check"
    user: root
  become: true

- name: Record the rendered AIDE check
  tags: [aide]
  ansible.builtin.import_tasks: "{{ role_path }}/../common/tasks/stamp_render.yml"
  vars:
    stamp_render_name: aide-check
    stamp_render_templates:
      - ansible/roles/setup/initial_setup/templates/aide-check.sh.j2
      - ansible/roles/setup/initial_setup/templates/aide-kuma-push.env.j2

- name: Mask the Debian dailyaidecheck timer (duplicates our weekly cron)
  tags: [aide]
  # The aide package ships dailyaidecheck.timer, which would run a FULL integrity
  # check nightly on top of the weekly cron above — ~1h20m of CPU per night on the
  # Pi Zero 2 W. The timer's run is also alert-broken (the _aide
  # user can't mail(1) without extra capabilities; it warned every run), while the
  # weekly cron logs to syslog as root. Mask rather than disable so a package
  # upgrade can't re-enable it.
  ansible.builtin.systemd_service:
    name: dailyaidecheck.timer
    enabled: false
    state: stopped
    masked: true
  become: true

- name: Check the masked AIDE timer for a stale pre-mask failed state # noqa command-instead-of-module
  tags: [aide]
  # Masking doesn't clear a unit's last recorded state. A timer already `failed` when
  # the task above masks it (the broken _aide mail(1) alert) stays pinned in memory as
  # masked/failed and pollutes `systemctl --failed` on every incident triage. Only
  # reset-failed clears it.
  ansible.builtin.command: systemctl is-failed dailyaidecheck.timer
  register: initial_setup_aide_timer_state
  changed_when: false
  failed_when: false
  check_mode: false # read-only query; must run under --check or the when: below breaks
  become: true

- name: Clear the stale failed state (masking alone keeps the flag forever)
  tags: [aide]
  ansible.builtin.command: systemctl reset-failed dailyaidecheck.timer
  when: initial_setup_aide_timer_state.stdout == 'failed'
  changed_when: true
  become: true

- name: Mask networkd-dispatcher (no hooks installed — pure veth-event noise)
  tags: [debloat]
  # Ubuntu ships this Python daemon enabled, but its only job is
  # running hook scripts from /etc/networkd-dispatcher/*.d — and every one of those
  # dirs is empty on both hosts. Meanwhile each Docker container create/destroy is a
  # veth link event, so it wakes constantly, forks a `networkctl` per event (extra
  # churn on the Pi), and races the vanishing veth — the recurring journal error
  # `networkctl[...]: Interface "vethXXX" not found`. Mask rather than purge:
  # zero package-dependency risk, and an apt upgrade can't re-enable it.
  ansible.builtin.systemd_service:
    name: networkd-dispatcher.service
    enabled: false
    state: stopped
    masked: true
  become: true
