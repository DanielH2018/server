---
# Host crons: secret-rotation audit + rotation, the weekly restart, image
# pruning, ansible.log truncation, and the infrastructure-map refresh.
# Split out of main.yml on 2026-08-15; task content and tags are unchanged.

- name: Deploy the shared Kuma-push helper
  # DECIDED: `always`, not `crons` — this is a dependency of tasks in OTHER roles under other
  # tags, so any tag that selects a consumer must also select this. optimize_pi's Pi crons are
  # tagged `sd-health` / `recovery-health`, so the one-liner that role's CLAUDE.md documents
  # (`initial_setup.yml --tags recovery-health -e target=daniel-pi`) rendered a cron that
  # sources a file the same run never copied. Enumerating consumer tags here would re-break the
  # next time a cron picks up a new tag; `always` cannot drift. Cost is one idempotent copy per
  # tag-scoped run of initial_setup.yml.
  tags: [always]
  # FIRST in this file, and initial_setup runs before deploy.yml (ansible/README.md §4): every
  # health cron on every host sources this, including secret-rotate.sh.j2 further down, so it
  # has to be on disk before any of them are rendered. Consumers source it with a `|| exit 1`
  # guard, so a host that somehow misses it fails its cron loudly and drops the heartbeat
  # rather than skipping the push and reporting green.
  ansible.builtin.copy:
    src: kuma-push-lib.sh
    dest: /usr/local/lib/kuma-push-lib.sh
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Deploy the daily secret-rotation audit wrapper (gitops host only)
  tags: [crons]
  # Gated on has_gitops, not a hostname: this reads ansible/secret_rotation.yml and the key
  # list of ansible/vars/secrets.yml straight off the working tree (no SOPS decrypt, no live
  # source), so it's only trustworthy on a host whose tree self-refreshes — gitops-deploy.service
  # pulls origin every 30 min. daniel-server carries neither has_gitops nor an auto-pulling
  # tree; its checkout can silently sit weeks behind origin (verified 39 commits behind on
  # 2026-08-17) while this cron keeps reading its stale copy and reporting a green monitor on
  # a secret the registry never saw. Follow has_gitops if it moves to a different host later.
  when: has_gitops
  ansible.builtin.template:
    src: secret-rotation-audit.sh.j2
    dest: /usr/local/bin/secret-rotation-audit.sh
    owner: "{{ sys_user }}"
    group: "{{ sys_user }}"
    mode: "0700"
  become: true
  no_log: true  # renders secret_rotation_push_token (gitops_deploy wrapper parity)

- name: Schedule the daily secret-rotation audit (gitops host only)
  tags: [crons]
  # 08:00 — after the Sunday 07:30 reboot + 07:15 CrowdSec-hub jobs settle; clear of the
  # 06:xx redeploy window. Pushes the "Secret Rotation" Kuma monitor (uptime-kuma role).
  when: has_gitops
  ansible.builtin.cron:
    name: "Daily secret rotation audit"
    minute: "0"
    hour: "8"
    job: "/usr/local/bin/secret-rotation-audit.sh"
    user: "{{ sys_user }}"
  become: true

- name: Deploy the weekly secret-rotation wrapper (gitops host only)
  tags: [crons]
  # Unattended rotation of coming-due auto-tier push tokens (rotate --commit --deploy +
  # git push; anything due within ROTATE_LEAD_DAYS rotates BEFORE it goes overdue).
  # Reverts on failure; cross-host tokens stay manual. See scripts/secret_rotation.py +
  # docs/secret-rotation.md. Same has_gitops gate as the daily audit above — the tree this
  # script commits/pushes from must be the one origin (and CI) actually see.
  when: has_gitops
  ansible.builtin.template:
    src: secret-rotate.sh.j2
    dest: /usr/local/bin/secret-rotate.sh
    owner: "{{ sys_user }}"
    group: "{{ sys_user }}"
    mode: "0700"
  become: true
  no_log: true  # renders secret_rotation_push_token (gitops_deploy wrapper parity)

- name: Schedule the weekly secret rotation (gitops host only)
  tags: [crons]
  # Sunday 09:00 — after the 07:30 reboot, the 06:xx redeploys, and the 08:00 daily audit
  # have all settled; quiet window minimises any clash with a concurrent operator session.
  when: has_gitops
  ansible.builtin.cron:
    name: "Weekly secret rotation (auto tier)"
    minute: "0"
    hour: "9"
    weekday: "0"
    job: "/usr/local/bin/secret-rotate.sh"
    user: "{{ sys_user }}"
  become: true

# Reverse of the has_gitops gate above. A skipped cron task leaves an already-installed entry
# running, so gating alone would have left daniel-server's two crons in place reading its stale
# tree while daniel-box gained its own — two hosts pushing one Kuma monitor, which is worse than
# the staleness this move fixes. These run everywhere the gate is false, so the crons follow
# has_gitops in both directions.
- name: Remove the secret-rotation crons from any non-gitops host
  tags: [crons]
  when: not has_gitops
  ansible.builtin.cron:
    name: "{{ item }}"
    state: absent
    user: "{{ sys_user }}"
  loop:
    - "Daily secret rotation audit"
    - "Weekly secret rotation (auto tier)"
  become: true

- name: Remove the secret-rotation wrappers from any non-gitops host
  tags: [crons]
  when: not has_gitops
  ansible.builtin.file:
    path: "/usr/local/bin/{{ item }}"
    state: absent
  loop:
    - secret-rotation-audit.sh
    - secret-rotate.sh
  become: true

- name: Schedule sudo crontab for weekly restart
  tags: [crons]
  # Pings the Healthchecks "Reboot" monitor, then reboots. The ping lives INSIDE the
  # Ansible-managed job (not a manual crontab append, which a later [crons] deploy would
  # strip — that silent regression is exactly why this check went stale). `;` not `&&`:
  # the reboot must happen even if the ping fails. UUID = the check's dashed code.
  ansible.builtin.cron:
    name: "Weekly system restart"
    minute: "30"
    hour: "7"
    weekday: "0"
    job: "curl -fsS -m 10 --retry 3 https://healthchecks.{{ domain }}/ping/ea0ed733-f631-4bd5-b1c9-4ab394bd13eb ; /sbin/shutdown -r +5"
    user: root
  become: true

- name: Detect whether fwupd is installed on this host
  tags: [crons, firmware]
  # Only daniel-box has fwupd: optimize_pi purges it (the Zero 2 W swapped itself to death on
  # every dbus activation) and daniel-server has never had it. Gate on the binary rather than
  # on inventory_hostname so a future host is covered without editing this file.
  ansible.builtin.stat:
    path: /usr/bin/fwupdmgr
  register: initial_setup_fwupdmgr
  check_mode: false # read-only query; must run under --check or the when: below breaks

- name: Schedule weekly firmware update
  tags: [crons, firmware]
  # Sunday 07:00 — 30 minutes ahead of the "Weekly system restart" above, which is what
  # actually commits the update: a UEFI capsule is staged to the ESP and applied by the
  # firmware on the next boot, so applying it without a reboot in the same window leaves it
  # pending indefinitely. The write itself takes seconds; the 30 min is slack, not need.
  #
  # `refresh --force` because a plain refresh exits non-zero once the metadata is younger than
  # its refresh interval, which is the normal weekly case, not an error. Output goes to syslog
  # rather than /dev/null so a real failure is recoverable from Loki (`{job="syslog"}`) — and
  # piping into logger makes the job's exit status logger's, which keeps cron from mailing
  # root every week for the `update` exit code that means "nothing to do".
  #
  # `--no-reboot-check` because the reboot is the next cron's job, not this one's.
  #
  # Note on value: Secure Boot is DISABLED on daniel-box, so the db/dbx signature databases
  # these updates carry are not consulted by anything. The cron is here for real firmware
  # (BIOS, SSD) arriving later, and to stop the login MOTD accruing a permanent backlog.
  ansible.builtin.cron:
    name: "Weekly firmware update"
    minute: "0"
    hour: "7"
    weekday: "0"
    job: "/usr/bin/fwupdmgr refresh --force >/dev/null 2>&1 ; /usr/bin/fwupdmgr update -y --no-reboot-check 2>&1 | /usr/bin/logger -t fwupd-auto"
    user: root
  become: true
  when: initial_setup_fwupdmgr.stat.exists

- name: Remove the firmware cron on hosts without fwupd
  tags: [crons, firmware]
  # The way out of the task above. A host that later purges fwupd (as optimize_pi does on the
  # Pi) would otherwise keep a cron that logs "command not found" to syslog every Sunday.
  ansible.builtin.cron:
    name: "Weekly firmware update"
    state: absent
    user: root
  become: true
  when: not initial_setup_fwupdmgr.stat.exists

- name: Schedule Docker image cleanup
  # `until=168h` keeps anything created in the last week: after a bad Renovate
  # bump the previous pinned image is still local, so rollback = git revert +
  # redeploy with no registry re-pull. Older unused images/build cache still go
  # daily. (Caveat: `until` filters on CreatedAt, so an upstream image built >1wk
  # ago is pruned as soon as it's unused — the window protects fresh builds/pulls.)
  # Pings the Healthchecks "Docker Image Prune" monitor ON SUCCESS (`&&`): a failed
  # prune leaves the check un-pinged so it alerts. Ping kept in the Ansible-managed job
  # so a [crons] redeploy can't silently strip it (the late-May regression). Dashed UUID.
  # has_docker-gated: daniel-box and daniel-server have had no docker binary since the
  # 2026-08-14 k3s migration completed; the ping lives inside this same job, so gating it
  # here (rather than skipping only the `docker` call) also retires the monitor cleanly
  # instead of leaving a dead-man that never pings on those two hosts.
  when: has_docker
  ansible.builtin.cron:
    name: "Clean unused Docker images"
    minute: "30"
    hour: "6"
    job: '/usr/bin/docker system prune -a -f --filter "until=168h" && curl -fsS -m 10 --retry 3 https://healthchecks.{{ domain }}/ping/6c716f7f-219c-42e1-9f8b-d1d964b6cc35'
    user: "{{ ansible_facts.user_id }}"
  become: true
  tags: [prune, crons]

# Reverse of the has_docker gate above. The cron was installed unconditionally before this
# change, so it already exists on both cluster nodes, where it has been failing since the
# 2026-08-14 Docker removal and leaving the Healthchecks dead-man un-pinged. Skipping the task
# would leave it there; this retires the entry so the monitor stops being fed by a host that
# cannot run it.
- name: Remove the Docker image cleanup cron from any host without Docker
  when: not has_docker
  ansible.builtin.cron:
    name: "Clean unused Docker images"
    state: absent
    user: "{{ ansible_facts.user_id }}"
  become: true
  tags: [prune, crons]


- name: Create cron job to clear ansible.log weekly
  # ansible.cfg sets `log_path = ./ansible.log`, which resolves relative to the CWD
  # the playbook is run from (the repo root) — i.e. server/ansible.log, NOT
  # server/ansible/ansible.log. Truncate the file that actually grows.
  ansible.builtin.cron:
    name: "Clear ansible log file"
    minute: "0"
    hour: "6"
    weekday: "0" # 0 is Sunday
    job: "truncate -s 0 /home/{{ sys_user }}/server/ansible.log"
  become: true
  tags: [crons]

- name: Schedule the infrastructure-map refresh (box only)
  tags: [crons, infra-map]
  # Regenerates the architecture diagram + declared-vs-live map (scripts/gen_infra_map.py).
  # Runs on daniel-box because that is where kubectl is local — both cluster nodes are read
  # from the cluster, not host by host. Only daniel-pi is polled remotely, over ONE ssh call
  # per run, well clear of the `ufw limit ssh` 6-connections-per-30s reject threshold.
  #
  # No Healthchecks ping, unlike the crons above: a failed run leaves the previous page in
  # place rather than corrupting anything, and the page prints the timestamp it was generated
  # at — so a run that stops working shows up as a visibly stale date on the artifact itself.
  when: inventory_hostname == 'daniel-box'
  ansible.builtin.cron:
    name: "Refresh homelab infrastructure map"
    minute: "*/15"
    # PATH and KUBECONFIG are both set explicitly, because cron inherits neither and each
    # omission blinds the k3s half of the map while the Docker half keeps working — a page
    # that renders fine and quietly reports declared-only for every k8s service.
    #   PATH:       cron's default `/usr/bin:/bin` omits /usr/local/bin, where kubectl lives.
    #   KUBECONFIG: unset, k3s's kubectl falls back to /etc/rancher/k3s/k3s.yaml, which is
    #               root-owned 0640. An interactive shell exports the user copy, so this
    #               only ever fails unattended.
    # The script defends itself against both as well (find_tool / find_kubeconfig); these
    # are the second layer, kept because they are also the documentation.
    job: "cd /home/{{ sys_user }}/server && PATH=/usr/local/bin:/usr/bin:/bin KUBECONFIG=/home/{{ sys_user }}/.kube/config /home/{{ sys_user }}/.local/bin/uv run --quiet python scripts/gen_infra_map.py -o /home/{{ sys_user }}/.claude/artifacts/homelab-infra-map.html"
    user: "{{ sys_user }}"
  become: true

# Render provenance for manifest-prune-check.sh's stale-script arm (2026-08-23b review H1).
# secret-rotate.sh is the reason this one matters most of the nine that were uncovered: it is a
# weekly STATE-CHANGING cron that commits and pushes, so a stale render runs old rotation logic
# against live secrets with every repo-side check reading green.
#
# Same has_gitops gate and same [crons] tag as the two wrappers above — a stamp that ran where
# the wrappers do not would claim coverage this host never renders.
- name: Stamp the rendered secret-rotation wrappers (gitops host only)
  tags: [crons]
  when: has_gitops
  ansible.builtin.import_tasks: "{{ role_path }}/../common/tasks/stamp_render.yml"
  vars:
    stamp_render_name: secret-rotation
    stamp_render_templates:
      - ansible/roles/setup/initial_setup/templates/secret-rotate.sh.j2
      - ansible/roles/setup/initial_setup/templates/secret-rotation-audit.sh.j2

# kuma-push-lib.sh is sourced by EVERY health cron on every host, with a `|| exit 1` guard — so a
# stale copy silently changes how every heartbeat pushes. It was watched by nothing until
# 2026-08-24 (review M-5). `tags: [always]`, matching the copy task it records: this fragment must
# not be left describing a version a tag-scoped run never deployed.
- name: Record the deployed shared push library
  tags: [always]
  ansible.builtin.import_tasks: "{{ role_path }}/../common/tasks/stamp_deployed.yml"
  vars:
    stamp_deployed_name: kuma-push-lib
    stamp_deployed_pairs:
      - live: /usr/local/lib/kuma-push-lib.sh
        src: ansible/roles/setup/initial_setup/files/kuma-push-lib.sh

- name: Install the docs refresh script (box only)
  tags: [crons, docs]
  when: inventory_hostname == 'daniel-box'
  ansible.builtin.template:
    src: docs-refresh.sh.j2
    dest: /usr/local/bin/docs-refresh.sh
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Schedule the generated-docs refresh (box only)
  tags: [crons, docs]
  # Regenerates docs/reference/, rebuilds the MkDocs site into the hostPath the docs pod
  # serves, and commits any change (scripts/build_docs.py, under the git-tree lock).
  # Runs on daniel-box because the primary checkout, uv and the served site directory are
  # all there — and because gen_infra_map, one of the generators, needs a local kubectl.
  #
  # No Healthchecks ping, matching the infra-map cron above: every generated page carries
  # the timestamp its content was last built from, and the served site carries
  # build-info.json saying when this last ran, so a run that stops working shows up on the
  # page rather than needing its own alert channel.
  #
  # Twice daily, not every 15 minutes like the infra map. That one writes an artifact
  # nothing commits; this one commits and pushes, so each run that finds a change costs a
  # master CI run. The inputs are repo files, which only move when a PR merges.
  when: inventory_hostname == 'daniel-box'
  ansible.builtin.cron:
    name: "Refresh generated docs"
    minute: "17"
    hour: "6,18"
    # Same PATH/KUBECONFIG reasoning as the infra-map cron above: cron inherits neither,
    # and gen_infra_map runs inside build_docs.py. Without them the topology SVG silently
    # renders declared-only while everything else looks healthy.
    job: "PATH=/usr/local/bin:/usr/bin:/bin KUBECONFIG=/home/{{ sys_user }}/.kube/config /usr/local/bin/docs-refresh.sh"
    user: "{{ sys_user }}"
    cron_file: docs-refresh
  become: true

# Render provenance for manifest-prune-check.sh's stale-script arm. docs-refresh.sh belongs
# here for secret-rotate.sh's reason: it is a STATE-CHANGING cron that commits and pushes,
# so a stale render would keep committing generated pages from old generator wiring while
# every repo-side check reads green.
- name: Stamp the rendered docs-refresh wrapper (box only)
  tags: [crons]
  when: inventory_hostname == 'daniel-box'
  ansible.builtin.import_tasks: "{{ role_path }}/../common/tasks/stamp_render.yml"
  vars:
    stamp_render_name: docs-refresh
    stamp_render_templates:
      - ansible/roles/setup/initial_setup/templates/docs-refresh.sh.j2
