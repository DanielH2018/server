---
# Host crons: the weekly restart, image pruning, the ansible.log cron's removal, the setup-drift
# check and the Loki witness on the hosts whose package does not own it yet. The checkout timers
# (secret rotation, docs refresh, infra map, eval sweep, git repair) are host-package components
# since H7.36.

- name: Deploy the shared Kuma-push helper
  # DECIDED: `always`, not `crons` — this is a dependency of tasks in OTHER roles under other
  # tags, so any tag that selects a consumer must also select this. optimize_pi's Pi crons are
  # tagged `sd-health` / `recovery-health`, so the one-liner that role's CLAUDE.md documents
  # (`initial_setup.yml --tags recovery-health -e target=daniel-pi`) rendered a cron that
  # sources a file the same run never copied. Enumerating consumer tags here would re-break the
  # next time a cron picks up a new tag; `always` cannot drift. Cost is one idempotent copy per
  # tag-scoped run of initial_setup.yml.
  tags: [always]
  # FIRST in this file, and initial_setup runs before deploy.yml (ansible/README.md §4): nearly
  # every health cron on every host sources this, including secret-rotate.sh.j2 further down, so
  # it has to be on disk before any of them are rendered. Consumers source it with a `|| exit 1`
  # guard, so a host that somehow misses it fails its cron loudly and drops the heartbeat
  # rather than skipping the push and reporting green.
  # Two push scripts deliberately do NOT source it, each for a stated reason, and
  # ansible/tests/setup/test_cron_scripts_publish_via_pr.py carries that exemption set with the reasons.
  # The invariant that binds ALL of them — no push token ever reaches curl's argv — is asserted
  # separately there with no exemptions at all, so opting out of the library cannot opt a script
  # out of the security property.
  ansible.builtin.copy:
    src: kuma-push-lib.sh
    dest: /usr/local/lib/kuma-push-lib.sh
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Deploy the shared host-check library
  # `always` for the same reason as the push helper above: consumers under other roles' tags
  # source it with a `|| exit 1` guard, and `install_host_lib.yml` runs under each consumer's tag
  # only. Every M6 host batch waits for this task's apply on its own host.
  tags: [always]
  ansible.builtin.copy:
    src: homelab-check-lib.sh
    dest: /usr/local/lib/homelab-check-lib.sh
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Deploy the shared setup-plane drift arms
  # `always` for the same reason as the push helper above: it is sourced by scripts rendered
  # under other roles' tags (manifest-prune-check.sh under the k3s role's, setup-drift-check.sh
  # under this one's), so any tag selecting a consumer must also select this. Both consumers
  # source it with a `|| exit 1` guard, so a host that misses it fails its cron loudly and drops
  # the heartbeat rather than reporting a green with two arms silently absent.
  tags: [always]
  ansible.builtin.copy:
    src: setup-drift-lib.sh
    dest: /usr/local/lib/setup-drift-lib.sh
    owner: root
    group: root
    mode: "0644"
  become: true

# The way out for a host that once ran the secret-rotation crons. Since H7.36 the secret-rotation
# component of homelab-daniel-box ships both timers, and has_gitops is true on daniel-box alone.
# A non-gitops host that still carried an Ansible-era cron would read a stale tree and push the
# same Kuma monitor, so these run everywhere the flag is false. Reconcile retires daniel-box's
# own legacy entries.
- name: Remove the secret-rotation crons from any non-gitops host
  tags: [crons, secret-rotation]
  when: not has_gitops
  ansible.builtin.cron:
    name: "{{ item }}"
    state: absent
    user: "{{ sys_user }}"
  loop:
    - "Daily secret rotation audit"
    - "Weekly secret rotation (auto tier)"
  become: true

- name: Remove the secret-rotation wrappers from any non-gitops host
  tags: [crons, secret-rotation]
  when: not has_gitops
  ansible.builtin.file:
    path: "/usr/local/bin/{{ item }}"
    state: absent
  loop:
    - secret-rotation-audit.sh
    - secret-rotate.sh
  become: true

- name: Create the Healthchecks.io credential directory
  tags: [crons, prune, weekly-restart, worktree-sweep]
  # The same path, mode and owner as the k3s role's task, so the two writers agree on
  # daniel-box. This role writes it too because its two pinging crons run on every host, and
  # the k3s role reaches neither daniel-pi nor, for this file, daniel-server.
  ansible.builtin.file:
    path: /etc/healthchecks
    state: directory
    mode: "0755"
    owner: root
    group: root
  become: true

- name: Deploy the Healthchecks.io ping key
  tags: [crons, prune, weekly-restart, worktree-sweep]
  # Byte-identical to the k3s role's `Deploy the Healthchecks.io ping key`, which carries the
  # reasoning: the project ping key can hold every check green, so it lives in a 0640 file the
  # crons source at run time, never in a crontab line. cron logs each command it runs to the
  # journal, and the journal ships to Loki. root owns it for the reboot cron, and the group is
  # {{ sys_user }} for the prune and worktree-sweep crons.
  ansible.builtin.copy:
    content: "HC_PING_KEY='{{ healthchecks_ping_key | default('') }}'\n"
    dest: /etc/healthchecks/ping.env
    mode: "0640"
    owner: root
    group: "{{ sys_user }}"
  become: true
  no_log: true  # renders the Healthchecks.io ping key

- name: Schedule sudo crontab for weekly restart
  tags: [crons, weekly-restart]
  # Pings healthchecks.io's per-host `weekly-reboot-<host>` check, then reboots. The ping lives
  # INSIDE the Ansible-managed job (not a manual crontab append, which a later [crons] deploy
  # would strip). `;` not `&&`: the reboot must happen even if the ping fails.
  #
  # One slug per host because a shared check stays green while any host pings it, so one host
  # missing its reboot was invisible.
  # The key is sourced from ping.env at run time. `[ -r ] &&` guards the `.`, because a failed
  # `.` exits /bin/sh and would skip the shutdown. The ping discards its output.
  # The schedule and the `-r +N` delay come from group_vars/all.yml, not from literals here:
  # roles/k8s/uptime-kuma derives its Kuma maintenance window from the same four values, and a
  # reboot moved without that window pages Discord for every monitor it takes down.
  # The chain goes to the journal: on a healthy run shutdown prints "Shutdown scheduled for
  # ...", which cron would mail to root every week.
  ansible.builtin.cron:
    name: "Weekly system restart"
    minute: "{{ weekly_reboot_minute }}"
    hour: "{{ weekly_reboot_hour }}"
    weekday: "{{ weekly_reboot_weekday }}"
    job: "{ [ -r /etc/healthchecks/ping.env ] && . /etc/healthchecks/ping.env ; [ -n \"$HC_PING_KEY\" ] && curl -fs -m 10 --retry 3 \"https://hc-ping.com/$HC_PING_KEY/weekly-reboot-{{ inventory_hostname }}\" >/dev/null 2>&1 ; /sbin/shutdown -r +{{ weekly_reboot_shutdown_delay_minutes }}; } 2>&1 | logger -t weekly-restart"
    user: root
  become: true

- name: Detect whether fwupd is installed on this host
  tags: [crons, firmware]
  # Only daniel-box has fwupd: optimize_pi purges it (the Zero 2 W swapped itself to death on
  # every dbus activation) and daniel-server has never had it. Gate on the binary rather than
  # on inventory_hostname so a future host is covered without editing this file.
  ansible.builtin.stat:
    path: /usr/bin/fwupdmgr
  register: initial_setup_fwupdmgr
  check_mode: false # read-only query; must run under --check or the when: below breaks

- name: Schedule weekly firmware update
  tags: [crons, firmware]
  # Sunday 07:00 — 30 minutes ahead of the "Weekly system restart" above, which is what
  # actually commits the update: a UEFI capsule is staged to the ESP and applied by the
  # firmware on the next boot, so applying it without a reboot in the same window leaves it
  # pending indefinitely. The write itself takes seconds; the 30 min is slack, not need.
  #
  # `refresh --force` because a plain refresh exits non-zero once the metadata is younger than
  # its refresh interval, which is the normal weekly case, not an error. Output goes to syslog
  # rather than /dev/null so a real failure is recoverable from Loki (`{job="syslog"}`) — and
  # piping into logger makes the job's exit status logger's, which keeps cron from mailing
  # root every week for the `update` exit code that means "nothing to do".
  #
  # `--no-reboot-check` because the reboot is the next cron's job, not this one's.
  #
  # Note on value: Secure Boot is DISABLED on daniel-box, so the db/dbx signature databases
  # these updates carry are not consulted by anything. The cron is here for real firmware
  # (BIOS, SSD) arriving later, and to stop the login MOTD accruing a permanent backlog.
  ansible.builtin.cron:
    name: "Weekly firmware update"
    minute: "0"
    hour: "7"
    weekday: "0"
    job: "/usr/bin/fwupdmgr refresh --force >/dev/null 2>&1 ; /usr/bin/fwupdmgr update -y --no-reboot-check 2>&1 | /usr/bin/logger -t fwupd-auto"
    user: root
  become: true
  when: initial_setup_fwupdmgr.stat.exists

- name: Remove the firmware cron on hosts without fwupd
  tags: [crons, firmware]
  # The way out of the task above. A host that later purges fwupd (as optimize_pi does on the
  # Pi) would otherwise keep a cron that logs "command not found" to syslog every Sunday.
  ansible.builtin.cron:
    name: "Weekly firmware update"
    state: absent
    user: root
  become: true
  when: not initial_setup_fwupdmgr.stat.exists

- name: Schedule Docker image cleanup
  # `until=168h` keeps anything created in the last week: after a bad Renovate
  # bump the previous pinned image is still local, so rollback = git revert +
  # redeploy with no registry re-pull. Older unused images/build cache still go
  # daily. (Caveat: `until` filters on CreatedAt, so an upstream image built >1wk
  # ago is pruned as soon as it's unused — the window protects fresh builds/pulls.)
  # Pings healthchecks.io's `<host>-docker-prune` check ON SUCCESS (`&&`): a failed prune
  # leaves the check un-pinged so it alerts. Ping kept in the Ansible-managed job so a
  # [crons] redeploy can't silently strip it. The key is sourced as the reboot's is.
  # has_docker-gated: daniel-box and daniel-server have no docker binary; the ping lives inside this same job, so gating it
  # here (rather than skipping only the `docker` call) also retires the monitor cleanly
  # instead of leaving a dead-man that never pings on those two hosts.
  # The chain is braced and sent to the journal: prune prints "Total reclaimed space" on
  # every healthy run. A failure is the un-pinged dead-man above.
  when: has_docker
  ansible.builtin.cron:
    name: "Clean unused Docker images"
    minute: "{{ initial_setup_docker_prune_cron_minute }}"
    hour: "{{ initial_setup_docker_prune_cron_hour }}"
    job: '{ /usr/bin/docker system prune -a -f --filter "until=168h" && { [ -r /etc/healthchecks/ping.env ] && . /etc/healthchecks/ping.env; [ -n "$HC_PING_KEY" ] && curl -fs -m 10 --retry 3 "https://hc-ping.com/$HC_PING_KEY/{{ inventory_hostname }}-docker-prune" >/dev/null 2>&1; }; } 2>&1 | logger -t docker-prune'
    user: "{{ ansible_facts.user_id }}"
  become: true
  tags: [prune, crons]

# Reverse of the has_docker gate above. Skipping the task would leave an already-installed
# entry on a host without Docker, failing and leaving the Healthchecks dead-man un-pinged;
# this retires the entry so the monitor stops being fed by a host that cannot run it.
- name: Remove the Docker image cleanup cron from any host without Docker
  when: not has_docker
  ansible.builtin.cron:
    name: "Clean unused Docker images"
    state: absent
    user: "{{ ansible_facts.user_id }}"
  become: true
  tags: [prune, crons]


- name: Remove the weekly ansible.log truncation cron
  # H7.36 deletes the job, and the census allowlists the item `Clear ansible log file` as
  # deleted. The task stays as an absent arm until H7.20a, because daniel-server and daniel-pi
  # carry the entry the removed task installed. It sits in root's crontab: `become` with no
  # `user:` names the current user, which is root. Reconcile retires daniel-box's copy only
  # if a package lists it, and none does, so this arm is what removes it there.
  ansible.builtin.cron:
    name: "Clear ansible log file"
    state: absent
  become: true
  tags: [crons, ansible-log]

- name: Create the directory the worktree holder scan installs into
  tags: [crons, worktree-sweep]
  # Ubuntu does not ship /usr/local/libexec, and `copy` does not create a missing parent. The
  # first apply of the install below failed on daniel-box with "Destination directory
  # /usr/local/libexec does not exist" and held the initial_setup plane.
  when: has_claude_code
  ansible.builtin.file:
    path: /usr/local/libexec
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Install the netcat the shell worktree removal asks the holder scan with
  tags: [crons, worktree-sweep]
  # fanout_lib.clean.live_process_scan runs in a shell chain before any interpreter, and a shell
  # has no unix-socket redirect, so it connects with `nc -U`. Ubuntu ships this package by
  # default; naming it keeps a minimal image from turning every fan-out clean into a refusal.
  when: has_claude_code
  ansible.builtin.apt:
    name: netcat-openbsd
    state: present
  become: true

- name: Install the root-run worktree holder scan a worktree removal asks first
  tags: [crons, worktree-sweep]
  # The sweep runs as sys_user, and /proc refuses that uid another user's cwd and environ. A
  # `claude` process started through `su`, `runuser -l` or `systemd-run --uid` can hold a
  # worktree from the claude user's own slice, where the unprivileged scan does not look
  # (#4170). This helper scans every process as root. worktree-holders@.service runs it for
  # each connection to the socket below, and `lib.worktrees.privileged_holders` connects there.
  #
  # Every has_claude_code host, not only ops_cron_host: the weekly sweep runs on daniel-box,
  # but a fan-out's `fanout_place clean` removes worktrees on whichever host ran the batch.
  #
  # A root-owned COPY, never a path into the checkout: sys_user and every agent can write the
  # repo, so a root unit naming a file there is root for whoever edits it. 0700, because only
  # the service runs it. On a file that carries an ACL, the group bits of the mode are the ACL
  # mask, so 0700 leaves any `user:claude` entry the sudo grant added with no permission.
  when: has_claude_code
  ansible.builtin.copy:
    src: worktree_holders.py
    dest: /usr/local/libexec/worktree-holders
    owner: root
    group: root
    mode: "0700"
  become: true

- name: Name the agent users granted the worktree holder scan
  tags: [crons, worktree-sweep]
  # The operator ruled on 2026-10-10 that each agent user gets the same grant as sys_user
  # (#4021): its root is its own clone, so a removal it runs in that clone sees a sys_user
  # process inside the tree. Every present entry of claude_code_agents, through the filter
  # claude_code builds the users with (#4295), so names and clones follow that role.
  # deploy_cross_role.SETUP_ROLES_CALLING_FILTER_PLUGINS lists initial_setup as its caller.
  #
  # Whether the user exists yet is not read. initial_setup runs before claude_code creates an
  # agent, and an entry for a user with no uid matches no caller. Filtering it out would leave
  # a new agent in the socket's group but refused by the service, so every removal it ran
  # would be refused until the next apply.
  when: has_claude_code
  ansible.builtin.set_fact:
    initial_setup_worktree_holders_agents: >-
      {{ claude_code_agents
         | claude_agent_profiles(claude_code_agent_user, claude_code_agent_primary_profile)
         | selectattr('state', 'eq', 'present')
         | list }}

- name: List the worktree holder scan's users and the checkout each one works in
  tags: [crons, worktree-sweep]
  when: has_claude_code
  ansible.builtin.set_fact:
    initial_setup_worktree_holders_users: >-
      {{ [sys_user] + initial_setup_worktree_holders_agents | map(attribute='name') | list }}
    initial_setup_worktree_holders_checkouts: >-
      {{ [claude_code_operator_checkout]
         + initial_setup_worktree_holders_agents | map(attribute='clone_dir') | list }}

- name: Map each user of the worktree holder scan to the worktree root it reports under
  tags: [crons, worktree-sweep]
  # DECIDED: the map entry is the per-user grant (#4295), and the socket's group is only the
  # gate on who may connect. The service refuses any uid this map does not name, so dropping
  # an agent from claude_code_agents revokes its scan at the next apply, though it keeps the
  # group. A group alone could not be the grant: a membership reaches a process only at its
  # next login, and claude_code's agent_access.yml owns each agent's exact group list.
  #
  # Root-owned: the service runs as root and trusts this file for the directory it reports on.
  # World-readable, because lib.worktrees.holder_root reads it as the caller, to ask only about
  # a tree inside the root the service scans.
  when: has_claude_code
  ansible.builtin.copy:
    dest: /etc/worktree-holders.json
    content: >-
      {{ dict(initial_setup_worktree_holders_users | zip(initial_setup_worktree_holders_checkouts
                 | map('regex_replace', '$', '/.claude/worktrees'))) | to_nice_json }}
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Create the group that may connect to the worktree holder scan's socket
  tags: [crons, worktree-sweep]
  when: has_claude_code
  ansible.builtin.group:
    name: "{{ initial_setup_worktree_holders_group }}"
    system: true
  register: initial_setup_worktree_holders_group_made
  become: true

- name: Let sys_user connect to the worktree holder scan's socket
  tags: [crons, worktree-sweep]
  # Appended, because other roles give sys_user its other groups. Each agent user gets this
  # group in claude_code's agent_access.yml instead, whose group list is exact. Skipped by a
  # --check run that has not created the group, because usermod refuses a group it cannot
  # find even when it only reports.
  when:
    - has_claude_code
    - not (ansible_check_mode and initial_setup_worktree_holders_group_made is changed)
  ansible.builtin.user:
    name: "{{ sys_user }}"
    groups: "{{ initial_setup_worktree_holders_group }}"
    append: true
  become: true

- name: Install the worktree holder scan's socket and its per-connection service
  tags: [crons, worktree-sweep]
  # The operator ruled on 2026-10-10 that a socket replaces the sudo grant (#4297): sudo cannot
  # gain root under claude-rc.service's NoNewPrivileges=yes, and a socket needs no setuid.
  when: has_claude_code
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - worktree-holders.socket
    - worktree-holders@.service
  register: initial_setup_worktree_holders_units
  become: true

- name: Listen on the worktree holder scan's socket
  tags: [crons, worktree-sweep]
  # Restarted when a unit changed, because a running socket keeps its old SocketGroup and mode.
  # Skipped by a --check run that has not written a changed unit, which systemd cannot load.
  when:
    - has_claude_code
    - not (ansible_check_mode and initial_setup_worktree_holders_units is changed)
  ansible.builtin.systemd_service:
    name: worktree-holders.socket
    enabled: true
    state: "{{ 'restarted' if initial_setup_worktree_holders_units is changed else 'started' }}"
    daemon_reload: "{{ initial_setup_worktree_holders_units is changed }}"
  become: true

- name: Remove the worktree holder scan's old sudoers rule
  tags: [crons, worktree-sweep]
  # The way out of the sudo grant #4270 and #4296 installed, on every host: the socket replaced
  # it, and a NOPASSWD root rule must not outlive its purpose.
  ansible.builtin.file:
    path: /etc/sudoers.d/20-worktree-holders
    state: absent
  become: true

- name: Record the deployed worktree holder scan
  tags: [crons, worktree-sweep]
  when: has_claude_code
  ansible.builtin.import_tasks: "{{ role_path }}/../common/tasks/stamp_deployed.yml"
  vars:
    stamp_deployed_name: worktree-holders
    stamp_deployed_pairs:
      - live: /usr/local/libexec/worktree-holders
        src: ansible/roles/setup/initial_setup/files/worktree_holders.py

- name: Read whether the worktree holder scan's socket is installed
  tags: [crons, worktree-sweep]
  when: not has_claude_code
  ansible.builtin.stat:
    path: /etc/systemd/system/worktree-holders.socket
  register: initial_setup_worktree_holders_socket_unit

- name: Stop the worktree holder scan's socket on a host with no Claude sessions
  tags: [crons, worktree-sweep]
  # Before its unit file goes, because systemd cannot stop a unit it no longer finds.
  when:
    - not has_claude_code
    - initial_setup_worktree_holders_socket_unit.stat.exists
  ansible.builtin.systemd_service:
    name: worktree-holders.socket
    enabled: false
    state: stopped
  become: true

- name: Remove the worktree holder scan from a host with no Claude sessions
  tags: [crons, worktree-sweep]
  # The way out: a host that stops running Claude sessions keeps a root service otherwise.
  when: not has_claude_code
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/worktree-holders.socket
    - /etc/systemd/system/worktree-holders@.service
    - /usr/local/libexec/worktree-holders
    - /etc/worktree-holders.json
    - /var/lib/homelab/setup-deployed-manifest.d/worktree-holders
  register: initial_setup_worktree_holders_removed
  become: true

- name: Forget the removed worktree holder scan units
  tags: [crons, worktree-sweep]
  when:
    - not has_claude_code
    - initial_setup_worktree_holders_removed is changed
  ansible.builtin.systemd_service:
    daemon_reload: true
  become: true

- name: Remove the worktree holder scan's socket group from a host with no Claude sessions
  tags: [crons, worktree-sweep]
  when: not has_claude_code
  ansible.builtin.group:
    name: "{{ initial_setup_worktree_holders_group }}"
    state: absent
  become: true

- name: Retire the TLS cert-expiry watch
  tags: [crons, cert-expiry]
  # Reaps the retired TLS cert-expiry watcher. Traefik serves ONE certificate -- a wildcard
  # whose SANs cover `*.<domain>`, `*.local.<domain>` and the apex -- and monitor-bridge's
  # `check_cert` reads that leaf out of `traefik_tls_certs_not_after` every 5 minutes into a
  # critical-tagged Kuma monitor. `probe.py cert <host>` keeps the per-host served-chain view
  # for an operator.
  #
  # Deleting the installing tasks alone would leave the crontab entry and the credentials file
  # on daniel-box forever, so this task removes them. It runs on every host rather than behind
  # the `ops_cron_host` gate, because asking cron to remove an absent entry is free and a host
  # that was once the ops cron host still has the entry.
  become: true
  block:
    - name: Remove the TLS cert-expiry watch cron
      ansible.builtin.cron:
        name: "TLS cert-expiry watch"
        state: absent
        user: "{{ sys_user }}"

    - name: Remove the cert-expiry webhook credentials file
      ansible.builtin.file:
        path: /etc/homelab/cert-expiry-webhook.env
        state: absent

# kuma-push-lib.sh is sourced by EVERY health cron on every host, with a `|| exit 1` guard — so a
# stale copy silently changes how every heartbeat pushes. `tags: [always]`, matching the copy task it records: this fragment must
# not be left describing a version a tag-scoped run never deployed.
- name: Record the deployed shared push library
  tags: [always]
  ansible.builtin.import_tasks: "{{ role_path }}/../common/tasks/stamp_deployed.yml"
  vars:
    stamp_deployed_name: kuma-push-lib
    stamp_deployed_pairs:
      - live: /usr/local/lib/kuma-push-lib.sh
        src: ansible/roles/setup/initial_setup/files/kuma-push-lib.sh

# homelab-check-lib.sh is sourced by the host checks M6 moves off Kuma, with a `|| exit 1` guard.
# `tags: [always]`, matching the copy task it records.
- name: Record the deployed shared host-check library
  tags: [always]
  ansible.builtin.import_tasks: "{{ role_path }}/../common/tasks/stamp_deployed.yml"
  vars:
    stamp_deployed_name: homelab-check-lib
    stamp_deployed_pairs:
      - live: /usr/local/lib/homelab-check-lib.sh
        src: ansible/roles/setup/initial_setup/files/homelab-check-lib.sh

# The drift library is itself copy:-deployed, so the arm it implements watches it. `tags:
# [always]`, matching the copy task above, so a tag-scoped run cannot leave this fragment
# describing a version it never deployed.
- name: Record the deployed setup-drift library
  tags: [always]
  ansible.builtin.import_tasks: "{{ role_path }}/../common/tasks/stamp_deployed.yml"
  vars:
    stamp_deployed_name: setup-drift-lib
    stamp_deployed_pairs:
      - live: /usr/local/lib/setup-drift-lib.sh
        src: ansible/roles/setup/initial_setup/files/setup-drift-lib.sh

# ── setup-plane drift reader for hosts with no manifest-prune-check ───────────────────────────
- name: Create the setup-drift credentials directory
  tags: [crons, setup_drift]
  when: inventory_hostname in setup_drift_check_hosts
  ansible.builtin.file:
    path: /etc/homelab
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Deploy the setup-drift push credentials
  tags: [crons, setup_drift]
  when: inventory_hostname in setup_drift_check_hosts
  # 0640 root:{{ sys_user }}, sourced rather than inlined: the script lands 0755, so an inlined
  # token would be readable by every local account. Its own file rather than
  # /etc/rancher/k3s/kuma-push.env, which roles/setup/k3s owns as a whole-content template and
  # which does not exist on an agent node at all.
  ansible.builtin.template:
    src: setup-drift-kuma-push.env.j2
    dest: /etc/homelab/kuma-push.env
    owner: root
    group: "{{ sys_user }}"
    mode: "0640"
  become: true
  no_log: true  # renders setup_drift_push_token

- name: Deploy the setup-plane drift check
  tags: [crons, setup_drift]
  when: inventory_hostname in setup_drift_check_hosts
  ansible.builtin.template:
    src: setup-drift-check.sh.j2
    dest: /usr/local/bin/setup-drift-check.sh
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Schedule the setup-plane drift check
  tags: [crons, setup_drift]
  # Daily rather than hourly: the setup plane changes only when someone runs a play by hand, so
  # a shorter period would re-read the same answer all day. 08:20 sits after the Sunday reboot's
  # Kuma maintenance window (07:25-08:15, #2802) closes, since a push inside it is recorded as
  # MAINTENANCE (#4540), and before the 08:30 secret-rotation audit. Root, because the
  # deployed-code arm compares live artifacts under /usr/local that are not all world-readable.
  #
  # A systemd timer (roles/setup/common/tasks/kuma_check_timer.yml): a red
  # verdict reruns every 30 min until it clears rather than sitting on the tile for a day. The
  # state follows setup_drift_check_hosts so a host dropped from the list loses the timer and
  # the old cron.
  ansible.builtin.import_tasks: "{{ role_path }}/../common/tasks/kuma_check_timer.yml"
  vars:
    kuma_check_state: "{{ 'present' if inventory_hostname in setup_drift_check_hosts else 'absent' }}"
    kuma_check_name: setup-drift
    kuma_check_description: Setup-plane drift check (Kuma push)
    kuma_check_exec: /usr/local/bin/setup-drift-check.sh
    kuma_check_user: root
    kuma_check_on_calendar: "*-*-* 08:20:00"
    kuma_check_restart_sec: 30min
    kuma_check_cron_name: "Setup-plane drift check"

- name: Record the rendered setup-drift check
  tags: [crons, setup_drift]
  when: inventory_hostname in setup_drift_check_hosts
  ansible.builtin.import_tasks: "{{ role_path }}/../common/tasks/stamp_render.yml"
  vars:
    stamp_render_name: setup-drift-check
    stamp_render_templates:
      - ansible/roles/setup/initial_setup/templates/setup-drift-check.sh.j2
      - ansible/roles/setup/initial_setup/templates/setup-drift-kuma-push.env.j2

# ── Loki read-route witness, one per cluster node ─────────────────────────────────────────────
# The route's only caller is a host process and nothing else watches it. See
# templates/loki-read-route-health.sh.j2 for why a pod cannot be the witness and why one host is
# not enough.
# daniel-box's witness is the loki-route-witness component of homelab-daniel-box since H7.36, so
# every task here skips the hosts in initial_setup_packaged_hosts['loki_route_witness'].
- name: Create the Loki read-route witness credentials directory
  tags: [crons, loki_route_witness]
  when:
    - inventory_hostname in loki_route_witness_hosts
    - inventory_hostname not in initial_setup_packaged_hosts['loki_route_witness']
  ansible.builtin.file:
    path: /etc/homelab
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Deploy the Loki read-route witness push credentials
  tags: [crons, loki_route_witness]
  when:
    - inventory_hostname in loki_route_witness_hosts
    - inventory_hostname not in initial_setup_packaged_hosts['loki_route_witness']
  # 0640 root:{{ sys_user }}: the cron runs as {{ sys_user }} (it needs that user's uv and age
  # key), and nothing else on the host may read a token that can suppress this heartbeat.
  ansible.builtin.template:
    src: loki-route-kuma-push.env.j2
    dest: /etc/homelab/loki-route-kuma-push.env
    owner: root
    group: "{{ sys_user }}"
    mode: "0640"
  become: true
  no_log: true  # renders a Kuma push token

- name: Let the Loki read-route witness write to the node_exporter textfile directory
  tags: [crons, loki_route_witness]
  # node-exporter's textfile collector reads this directory through a hostPath with no `type`, so
  # the kubelet creates it root 0755 on first start, and the witness runs as {{ sys_user }}. The
  # owner, group and mode are M3's contract (docs/target-architecture/monitoring/m3-textfile-timer.md,
  # *The textfile directory's owner*), the same values as the k3s role's task on daniel-box:
  # the group gets write access, and setgid keeps it on new files. Files are written 0644, which
  # node_exporter (uid 65534) reads. Gated on the witness hosts like the rest of this block, which
  # is both k3s nodes; the Pi's directory belongs to optimize_pi.
  when:
    - inventory_hostname in loki_route_witness_hosts
    - inventory_hostname not in initial_setup_packaged_hosts['loki_route_witness']
  ansible.builtin.file:
    path: /var/lib/node-exporter-textfile
    state: directory
    owner: root
    group: "{{ sys_user }}"
    mode: "2775"
  become: true

- name: Create the Loki read-route verdict reader directory
  tags: [crons, loki_route_witness]
  when:
    - inventory_hostname in loki_route_witness_hosts
    - inventory_hostname not in initial_setup_packaged_hosts['loki_route_witness']
  ansible.builtin.file:
    path: /opt/loki-route-health
    state: directory
    owner: "{{ sys_user }}"
    group: "{{ sys_user }}"
    mode: "0755"
  become: true

- name: Install the Loki read-route verdict reader
  tags: [crons, loki_route_witness]
  when:
    - inventory_hostname in loki_route_witness_hosts
    - inventory_hostname not in initial_setup_packaged_hosts['loki_route_witness']
  # Before the script that calls it, not after: the cron invokes the reader by absolute path, so
  # a window where the script exists and the reader does not is a spurious DOWN on a first install
  # — the same hazard the Longhorn backup-health reader documents in the k3s role.
  ansible.builtin.copy:
    src: loki_route_health.py
    dest: /opt/loki-route-health/loki_route_health.py
    owner: "{{ sys_user }}"
    group: "{{ sys_user }}"
    mode: "0755"
  become: true

- name: Deploy the Loki read-route witness
  tags: [crons, loki_route_witness]
  when:
    - inventory_hostname in loki_route_witness_hosts
    - inventory_hostname not in initial_setup_packaged_hosts['loki_route_witness']
  ansible.builtin.template:
    src: loki-read-route-health.sh.j2
    dest: /usr/local/bin/loki-read-route-health.sh
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Schedule the Loki read-route witness
  tags: [crons, loki_route_witness]
  when: inventory_hostname not in initial_setup_packaged_hosts['loki_route_witness']
  # Hourly, and as {{ sys_user }} rather than root: probe.py resolves the domain through that
  # user's age key and runs from that user's uv. Minute 23 keeps it off the :00 and :30 slots the
  # */10 and */30 health crons already crowd.
  #
  # The route carries no production traffic, so an hourly answer is proportionate — what this
  # catches is a route that has been unreachable since the last deploy, not a transient.
  #
  # A systemd timer rather than a cron, so a red verdict reruns every 15 min
  # until it clears instead of sitting on the tile until the next slot. The task file carries
  # the contract; the script exits 1 after a down push. `kuma_check_state` wires both
  # directions: a host outside loki_route_witness_hosts loses the timer and the old cron.
  ansible.builtin.import_tasks: "{{ role_path }}/../common/tasks/kuma_check_timer.yml"
  vars:
    kuma_check_state: "{{ 'present' if inventory_hostname in loki_route_witness_hosts else 'absent' }}"
    kuma_check_name: loki-read-route
    kuma_check_description: Loki read-route witness (Kuma push)
    kuma_check_exec: /usr/local/bin/loki-read-route-health.sh
    kuma_check_user: "{{ sys_user }}"
    kuma_check_on_calendar: "*-*-* *:23:00"
    kuma_check_restart_sec: 15min
    kuma_check_cron_name: "Loki read-route witness"

- name: Record the rendered Loki read-route witness
  tags: [crons, loki_route_witness]
  when:
    - inventory_hostname in loki_route_witness_hosts
    - inventory_hostname not in initial_setup_packaged_hosts['loki_route_witness']
  ansible.builtin.import_tasks: "{{ role_path }}/../common/tasks/stamp_render.yml"
  vars:
    stamp_render_name: loki-route-witness
    stamp_render_templates:
      - ansible/roles/setup/initial_setup/templates/loki-read-route-health.sh.j2
      - ansible/roles/setup/initial_setup/templates/loki-route-kuma-push.env.j2
      - ansible/roles/setup/common/templates/kuma-check.service.j2
      - ansible/roles/setup/common/templates/kuma-check.timer.j2

- name: Record the deployed Loki read-route verdict reader
  tags: [crons, loki_route_witness]
  when:
    - inventory_hostname in loki_route_witness_hosts
    - inventory_hostname not in initial_setup_packaged_hosts['loki_route_witness']
  # `copy:`-deployed, so the render arm cannot see it — this is what puts it under the
  # deployed-code arm, which compares live bytes against the repo.
  ansible.builtin.import_tasks: "{{ role_path }}/../common/tasks/stamp_deployed.yml"
  vars:
    stamp_deployed_name: loki-route-health
    stamp_deployed_pairs:
      - live: /opt/loki-route-health/loki_route_health.py
        src: ansible/roles/setup/initial_setup/files/loki_route_health.py

- name: Remove the Loki read-route witness from any host that is not a witness
  tags: [crons, loki_route_witness]
  # The way out. A host dropped from loki_route_witness_hosts keeps running the check otherwise,
  # pushing a monitor the manifest no longer declares — which Kuma answers 404, and which
  # kuma-push-lib retries three times every hour forever. The timer and the old cron go in the
  # kuma_check_timer.yml import above (its absent arm); this block removes the files.
  when: inventory_hostname not in loki_route_witness_hosts
  block:
    - name: Remove the Loki read-route witness files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /usr/local/bin/loki-read-route-health.sh
        - /etc/homelab/loki-route-kuma-push.env
        - /opt/loki-route-health
      become: true
