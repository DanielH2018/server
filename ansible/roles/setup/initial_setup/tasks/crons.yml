---
# Host crons: the ansible.log cron's removal and the setup-drift check. The checkout timers
# (secret rotation, docs refresh, infra map, eval sweep, git repair) and the Loki witness are
# host-package components.

- name: Deploy the shared host-check library
  # DECIDED: `always`, not `crons` — this is a dependency of tasks in OTHER roles under other
  # tags, so any tag that selects a consumer must also select this. Consumers source it with a
  # `|| exit 1` guard, and enumerating their tags here would re-break the next time one picks up
  # a new tag. Cost is one idempotent copy per tag-scoped run of initial_setup.yml.
  tags: [always]
  ansible.builtin.copy:
    src: homelab-check-lib.sh
    dest: /usr/local/lib/homelab-check-lib.sh
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Deploy the shared setup-plane drift arms
  # `always` so that any tag selecting its one consumer, setup-drift-check.sh, also selects this.
  # The consumer sources it with a `|| exit 1` guard, so a host that misses it fails its cron
  # loudly and drops the heartbeat rather than reporting a green with two arms silently absent.
  tags: [always]
  ansible.builtin.copy:
    src: setup-drift-lib.sh
    dest: /usr/local/lib/setup-drift-lib.sh
    owner: root
    group: root
    mode: "0644"
  become: true

# The way out for a host that once ran the secret-rotation crons. Since H7.36 the secret-rotation
# component of homelab-daniel-box ships both timers, and has_gitops is true on daniel-box alone.
# A non-gitops host that still carried an Ansible-era cron would read a stale tree and report the
# same check, so these run everywhere the flag is false. Reconcile retires daniel-box's
# own legacy entries.
- name: Remove the secret-rotation crons from any non-gitops host
  tags: [crons, secret-rotation]
  when: not has_gitops
  ansible.builtin.cron:
    name: "{{ item }}"
    state: absent
    user: "{{ sys_user }}"
  loop:
    - "Daily secret rotation audit"
    - "Weekly secret rotation (auto tier)"
  become: true

- name: Remove the secret-rotation wrappers from any non-gitops host
  tags: [crons, secret-rotation]
  when: not has_gitops
  ansible.builtin.file:
    path: "/usr/local/bin/{{ item }}"
    state: absent
  loop:
    - secret-rotation-audit.sh
    - secret-rotate.sh
  become: true

- name: Remove the weekly ansible.log truncation cron
  # H7.36 deletes the job, and the census allowlists the item `Clear ansible log file` as
  # deleted. The task stays as an absent arm until H7.20a, because daniel-server and daniel-pi
  # carry the entry the removed task installed. It sits in root's crontab: `become` with no
  # `user:` names the current user, which is root. Reconcile retires daniel-box's copy only
  # if a package lists it, and none does, so this arm is what removes it there.
  ansible.builtin.cron:
    name: "Clear ansible log file"
    state: absent
  become: true
  tags: [crons, ansible-log]

- name: Find the ansible.log files the removed log_path left in each checkout
  tags: [crons, ansible-log]
  when: has_repo_checkout
  # ansible.cfg set `log_path = ./ansible.log` until #6217, so the primary checkout and every
  # `.claude/worktrees/<name>` checkout grew their own copy, and a `--diff` run wrote rendered
  # bodies into it. Nothing writes the file any more; this and the task below delete the copies
  # left behind, and find nothing once they are gone. Depth 2 reaches `worktrees/<name>/`.
  ansible.builtin.find:
    paths:
      - "/home/{{ sys_user }}/server"
      - "/home/{{ sys_user }}/server/.claude/worktrees"
    patterns: ansible.log
    file_type: file
    recurse: true
    depth: 2
  register: initial_setup_stale_ansible_logs
  check_mode: false # read-only query; must run under --check or the loop below breaks
  become: true

- name: Delete the ansible.log files the removed log_path left behind
  tags: [crons, ansible-log]
  when: has_repo_checkout
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ initial_setup_stale_ansible_logs.files }}"
  loop_control:
    label: "{{ item.path }}"
  become: true

- name: Remove the worktree holder scan's old sudoers rule
  tags: [crons, worktree-sweep]
  # The way out of the sudo grant #4270 and #4296 installed, on every host: the socket replaced
  # it, and a NOPASSWD root rule must not outlive its purpose.
  ansible.builtin.file:
    path: /etc/sudoers.d/20-worktree-holders
    state: absent
  become: true

- name: Read whether the worktree holder scan's socket is installed
  tags: [crons, worktree-sweep]
  when: not has_claude_code
  ansible.builtin.stat:
    path: /etc/systemd/system/worktree-holders.socket
  register: initial_setup_worktree_holders_socket_unit

- name: Stop the worktree holder scan's socket on a host with no Claude sessions
  tags: [crons, worktree-sweep]
  # Before its unit file goes, because systemd cannot stop a unit it no longer finds.
  when:
    - not has_claude_code
    - initial_setup_worktree_holders_socket_unit.stat.exists
  ansible.builtin.systemd_service:
    name: worktree-holders.socket
    enabled: false
    state: stopped
  become: true

- name: Remove the worktree holder scan from a host with no Claude sessions
  tags: [crons, worktree-sweep]
  # The way out: a host that stops running Claude sessions keeps a root service otherwise.
  when: not has_claude_code
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/worktree-holders.socket
    - /etc/systemd/system/worktree-holders@.service
    - /usr/local/libexec/worktree-holders
    - /etc/worktree-holders.json
    - /var/lib/homelab/setup-deployed-manifest.d/worktree-holders
  register: initial_setup_worktree_holders_removed
  become: true

- name: Forget the removed worktree holder scan units
  tags: [crons, worktree-sweep]
  when:
    - not has_claude_code
    - initial_setup_worktree_holders_removed is changed
  ansible.builtin.systemd_service:
    daemon_reload: true
  become: true

- name: Remove the worktree holder scan's socket group from a host with no Claude sessions
  tags: [crons, worktree-sweep]
  when: not has_claude_code
  ansible.builtin.group:
    name: "{{ initial_setup_worktree_holders_group }}"
    state: absent
  become: true

- name: Retire the TLS cert-expiry watch
  tags: [crons, cert-expiry]
  # Reaps the retired TLS cert-expiry watcher. Traefik serves ONE certificate -- a wildcard
  # whose SANs cover `*.<domain>`, `*.local.<domain>` and the apex -- and observability's
  # edge.yaml pages on that leaf's `traefik_tls_certs_not_after`. `probe.py cert <host>` keeps
  # the per-host served-chain view for an operator.
  #
  # Deleting the installing tasks alone would leave the crontab entry and the credentials file
  # on daniel-box forever, so this task removes them. It runs on every host rather than behind
  # the `ops_cron_host` gate, because asking cron to remove an absent entry is free and a host
  # that was once the ops cron host still has the entry.
  become: true
  block:
    - name: Remove the TLS cert-expiry watch cron
      ansible.builtin.cron:
        name: "TLS cert-expiry watch"
        state: absent
        user: "{{ sys_user }}"

    - name: Remove the cert-expiry webhook credentials file
      ansible.builtin.file:
        path: /etc/homelab/cert-expiry-webhook.env
        state: absent

# homelab-check-lib.sh is sourced by the host checks M6 moves off Kuma, with a `|| exit 1` guard.
# `tags: [always]`, matching the copy task it records.
- name: Record the deployed shared host-check library
  tags: [always]
  ansible.builtin.import_tasks: "{{ role_path }}/../common/tasks/stamp_deployed.yml"
  vars:
    stamp_deployed_name: homelab-check-lib
    stamp_deployed_pairs:
      - live: /usr/local/lib/homelab-check-lib.sh
        src: ansible/roles/setup/initial_setup/files/homelab-check-lib.sh

# The drift library is itself copy:-deployed, so the arm it implements watches it. `tags:
# [always]`, matching the copy task above, so a tag-scoped run cannot leave this fragment
# describing a version it never deployed.
- name: Record the deployed setup-drift library
  tags: [always]
  ansible.builtin.import_tasks: "{{ role_path }}/../common/tasks/stamp_deployed.yml"
  vars:
    stamp_deployed_name: setup-drift-lib
    stamp_deployed_pairs:
      - live: /usr/local/lib/setup-drift-lib.sh
        src: ansible/roles/setup/initial_setup/files/setup-drift-lib.sh

# ── setup-plane drift reader on every host that renders setup templates ───────────────────────
# Nothing removes a file the role stops declaring. M6 batch B2's Cutover-2 stopped
# setup-drift-check.sh sourcing /etc/homelab/kuma-push.env, so this retires the host copy. It
# holds a Kuma push token in a 0640 file, which a retired credential must not outlive. No `when:`,
# so a host that left setup_drift_check_hosts loses its copy too. /etc/homelab itself stays: the
# etcd drill's env file lives there.
- name: Retire the setup-drift Kuma push credentials
  tags: [crons, setup_drift]
  ansible.builtin.file:
    path: /etc/homelab/kuma-push.env
    state: absent
  become: true

- name: Deploy the setup-plane drift check
  tags: [crons, setup_drift]
  when: inventory_hostname in setup_drift_check_hosts
  ansible.builtin.template:
    src: setup-drift-check.sh.j2
    dest: /usr/local/bin/setup-drift-check.sh
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Schedule the setup-plane drift check
  tags: [crons, setup_drift]
  # Daily rather than hourly: the setup plane changes only when someone runs a play by hand, so
  # a shorter period would re-read the same answer all day. 08:20 sits after the Sunday reboot's
  # Alertmanager mute (07:25-08:15, #2802) closes, so the mute holds no page from this run,
  # and before the 08:30 secret-rotation audit. Root, because the
  # deployed-code arm compares live artifacts under /usr/local that are not all world-readable.
  #
  # A systemd timer (roles/setup/common/tasks/check_timer.yml): a red
  # verdict reruns every 30 min until it clears rather than sitting on the tile for a day. The
  # state follows setup_drift_check_hosts so a host dropped from the list loses the timer and
  # the old cron. The last task of this section removes its files.
  ansible.builtin.import_tasks: "{{ role_path }}/../common/tasks/check_timer.yml"
  vars:
    check_timer_state: "{{ 'present' if inventory_hostname in setup_drift_check_hosts else 'absent' }}"
    check_timer_name: setup-drift
    check_timer_description: Setup-plane drift check
    check_timer_exec: /usr/local/bin/setup-drift-check.sh
    check_timer_user: root
    check_timer_on_calendar: "*-*-* 08:20:00"
    check_timer_restart_sec: 30min
    check_timer_cron_name: "Setup-plane drift check"

- name: Record the rendered setup-drift check
  tags: [crons, setup_drift]
  when: inventory_hostname in setup_drift_check_hosts
  ansible.builtin.import_tasks: "{{ role_path }}/../common/tasks/stamp_render.yml"
  vars:
    stamp_render_name: setup-drift-check
    stamp_render_templates:
      - ansible/roles/setup/initial_setup/templates/setup-drift-check.sh.j2
      - ansible/roles/setup/common/templates/check-timer.service.j2
      - ansible/roles/setup/common/templates/check-timer.timer.j2
      - ansible/roles/setup/common/templates/check-timer-boot.service.j2

- name: Remove the setup-plane drift check's files from a host off the list
  tags: [crons, setup_drift]
  # The way out. A .prom file left behind keeps exporting its last run, so HostCheckOverdue fires
  # about 25 hours later and never clears, and a fragment left behind can read as a stale render
  # if the host rejoins the list.
  when: inventory_hostname not in setup_drift_check_hosts
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /var/lib/node-exporter-textfile/setup-drift-check.prom
    - /usr/local/bin/setup-drift-check.sh
    - /var/lib/homelab/setup-render-manifest.d/setup-drift-check
  become: true
