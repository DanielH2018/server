---
# IPv4 forwarding and the kernel security sysctls. The ufw rules and its enable are the
# ssh-firewall host component and reconcile's ufw arm on every host (H7.30 to H7.32).

- name: Enable IPv4 forwarding
  tags: [sysctl]
  when: inventory_hostname not in initial_setup_packaged_hosts['sysctl']
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    state: present
    reload: true
  become: true

# UFW keeps its OWN sysctl file and re-applies it on every `ufw enable`/`reload` and at boot
# (`IPT_SYSCTL=/etc/ufw/sysctl.conf` in /etc/default/ufw). Ubuntu ships that file with
# `net/ipv4/conf/{all,default}/log_martians=0` uncommented, so it is the one thing on the host
# that sets the key to 0 — /etc/sysctl.conf persists 1 and no /etc/sysctl.d or /usr/lib/sysctl.d
# file mentions the key at all. The hardening loop below writes 1, then the next `ufw enable`
# or `reload` re-applies 0, so the key reads 0 after a run that reported `changed` and the loop
# reports `changed` again every run.
# Rewriting UFW's copy to 1 here, BEFORE the loop, makes the two
# files agree: the loop sets the live value and any later reload re-asserts the same 1.
# Host-agnostic on purpose — the file is the distro default, identical on daniel-box.
- name: Check for UFW's own sysctl file
  # Dual-tagged: `--tags firewall` reloads UFW, which re-applies this file.
  tags: [sysctl, firewall]
  ansible.builtin.stat:
    path: /etc/ufw/sysctl.conf
  register: initial_setup_ufw_sysctl

- name: Stop UFW's sysctl file from disabling martian logging
  # Dual-tagged: `--tags firewall` reloads UFW, which re-applies this file.
  tags: [sysctl, firewall]
  ansible.builtin.lineinfile:
    path: /etc/ufw/sysctl.conf
    regexp: "^#?net/ipv4/conf/{{ item }}/log_martians="
    line: "net/ipv4/conf/{{ item }}/log_martians=1"
  loop:
    - all
    - default
  become: true
  when:
    - inventory_hostname not in initial_setup_packaged_hosts['sysctl']
    - initial_setup_ufw_sysctl.stat.exists

- name: Apply kernel security hardening
  tags: [sysctl]
  when: inventory_hostname not in initial_setup_packaged_hosts['sysctl']
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
    reload: true
  loop:
    - { name: "net.ipv4.conf.all.rp_filter", value: "2" }
    - { name: "net.ipv4.conf.all.accept_redirects", value: "0" }
    - { name: "net.ipv4.conf.default.accept_redirects", value: "0" }
    - { name: "net.ipv4.conf.all.send_redirects", value: "0" }
    - { name: "net.ipv4.conf.default.send_redirects", value: "0" }
    # Reject source-routed packets (IPv4 + IPv6) — the companion to the redirect
    # rules above. `default.*` is the template every NEW interface inherits, which
    # matters here because Docker constantly spins up bridge/veth interfaces; the
    # host default for default.accept_source_route was 1 (accept).
    - { name: "net.ipv4.conf.all.accept_source_route", value: "0" }
    - { name: "net.ipv4.conf.default.accept_source_route", value: "0" }
    - { name: "net.ipv6.conf.all.accept_source_route", value: "0" }
    - { name: "net.ipv6.conf.default.accept_source_route", value: "0" }
    - { name: "net.ipv4.icmp_echo_ignore_broadcasts", value: "1" }
    - { name: "net.ipv4.conf.all.log_martians", value: "1" }
    - { name: "net.ipv4.conf.default.log_martians", value: "1" }
    - { name: "kernel.sysrq", value: "0" }
    - { name: "kernel.dmesg_restrict", value: "1" }
    - { name: "kernel.kptr_restrict", value: "2" }
    - { name: "net.core.bpf_jit_harden", value: "2" }
    - { name: "fs.suid_dumpable", value: "0" }
    - { name: "fs.protected_fifos", value: "2" }
    - { name: "dev.tty.ldisc_autoload", value: "0" }
  become: true

# The staging guest's egress fence is NOT here. It is a libvirt nwfilter, defined and
# attached by roles/setup/hypervisor.
#
# A ufw `route deny` on this host is INERT for that traffic. /etc/default/ufw already sets
# DEFAULT_FORWARD_POLICY="DROP", so if ufw's forward chain governed the guest it would already
# be fenced. libvirt's own FORWARD accept is reached first, and no rule ufw can place changes
# that. A firewall rule that is present and inert reads identical to a working one from the
# host, so "the rule is in `ufw status`" is not evidence. The probe at the far side is.
