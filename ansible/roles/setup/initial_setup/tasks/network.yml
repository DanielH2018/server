---
# IPv4 forwarding, kernel security sysctls, and the UFW ruleset.
# Split out of main.yml on 2026-08-15; task content and tags are unchanged.

- name: Enable IPv4 forwarding
  tags: [sysctl]
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    state: present
    reload: true
  become: true

- name: Apply kernel security hardening
  tags: [sysctl]
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
    reload: true
  loop:
    - { name: "net.ipv4.conf.all.rp_filter", value: "2" }
    - { name: "net.ipv4.conf.all.accept_redirects", value: "0" }
    - { name: "net.ipv4.conf.default.accept_redirects", value: "0" }
    - { name: "net.ipv4.conf.all.send_redirects", value: "0" }
    - { name: "net.ipv4.conf.default.send_redirects", value: "0" }
    # Reject source-routed packets (IPv4 + IPv6) — the companion to the redirect
    # rules above. `default.*` is the template every NEW interface inherits, which
    # matters here because Docker constantly spins up bridge/veth interfaces; the
    # host default for default.accept_source_route was 1 (accept).
    - { name: "net.ipv4.conf.all.accept_source_route", value: "0" }
    - { name: "net.ipv4.conf.default.accept_source_route", value: "0" }
    - { name: "net.ipv6.conf.all.accept_source_route", value: "0" }
    - { name: "net.ipv6.conf.default.accept_source_route", value: "0" }
    - { name: "net.ipv4.icmp_echo_ignore_broadcasts", value: "1" }
    - { name: "net.ipv4.conf.all.log_martians", value: "1" }
    - { name: "net.ipv4.conf.default.log_martians", value: "1" }
    - { name: "kernel.sysrq", value: "0" }
    - { name: "kernel.dmesg_restrict", value: "1" }
    - { name: "kernel.kptr_restrict", value: "2" }
    - { name: "net.core.bpf_jit_harden", value: "2" }
    - { name: "fs.suid_dumpable", value: "0" }
    - { name: "fs.protected_fifos", value: "2" }
    - { name: "dev.tty.ldisc_autoload", value: "0" }
  become: true

- name: Remove plain SSH allow rule (superseded by rate-limit)
  tags: [firewall]
  community.general.ufw:
    rule: allow
    port: ssh
    proto: tcp
    delete: true
  become: true
  failed_when: false

# Pin UFW's default policies in IaC rather than relying on the distro default.
# `deny incoming` is the host's baseline — only the explicit allow/limit rules
# below (SSH, WireGuard) open ports. Default-deny is safe to set over an active
# SSH session because the explicit `limit ssh` rule that follows takes precedence
# over the default policy.
#
# The routed DEFAULT policy is still not managed here, but the reason written here
# until 2026-08-27 had expired on both halves. It said Docker owns FORWARD via
# DOCKER-USER and the WireGuard containers depend on host forwarding — Docker was
# uninstalled from daniel-server on 2026-08-14, and wg-easy runs on daniel-pi. The
# surviving reason is narrower: daniel-pi genuinely still runs Docker and wg-easy,
# so a routed default set for every host would fight the one host where the old
# rationale is still true. Specific `route` rules below are unaffected by the
# default and are the right shape for a targeted fence.
- name: Set UFW default policy - deny incoming
  tags: [firewall]
  community.general.ufw:
    default: deny
    direction: incoming
  become: true

- name: Set UFW default policy - allow outgoing
  tags: [firewall]
  community.general.ufw:
    default: allow
    direction: outgoing
  become: true

# DECIDED: the LAN is exempt from SSH rate-limiting, and this rule must sort ABOVE the
# `limit` rule below. ufw matches in order and takes the first hit, so an allow appended
# after the limit rule is inert — the "present but does nothing" shape that #508 already
# cost this role once, described at length further down.
#
# WHY THE EXEMPTION. `limit` REJECTs a source IP that opens 6 connections in 30 seconds, on a
# ROLLING window, so sustained retries hold the block open instead of riding it out. Several
# Claude sessions work this repo at once and each reaches daniel-server over ssh; on
# 2026-08-06 and again on 2026-08-29 that quorum crossed the threshold, every session read
# the resulting "Connection refused" as sshd being down, and four of them started retry loops
# that fed the same counter. The block then never lifted. Loki showed `[UFW LIMIT BLOCK]
# SRC=10.0.0.215 DST=10.0.0.161 DPT=22` arriving at exactly the loops' cadence; killing the
# loops and leaving 90 seconds of silence let a single connection through immediately. The
# host was healthy throughout. The downstream cost is larger than a stalled shell — the
# staging gate reaches daniel-stage only through an ssh hop to this host, so a self-inflicted
# block surfaces as NO VERDICT on every commit, which is silent by design.
#
# WHAT THE EXEMPTION COSTS. Very little. `limit` is a brute-force control, and the thing that
# actually answers a credential attack is fail2ban's sshd jail (bantime 1h, triggered by auth
# FAILURES rather than by connection count) — that is untouched here and still covers the LAN.
# `limit` counts successful connections too, which is why well-behaved automation trips it and
# an attacker pacing himself does not.
#
# Non-LAN sources keep the limiter. That deliberately includes WireGuard peers, whose source
# address is the wg subnet rather than lan_subnet: this change removes no access from anyone,
# it only stops rate-limiting hosts that are already inside the LAN.
- name: Configure UFW firewall - allow SSH from the LAN without rate-limiting
  tags: [firewall]
  community.general.ufw:
    rule: allow
    port: ssh
    proto: tcp
    from_ip: "{{ lan_subnet }}"
    # Insert at the top rather than appending. On a host that already carries the `limit`
    # rule from an earlier run — which is every host this has ever deployed to — appending
    # would place this BELOW it and change nothing at all.
    #
    # `insert_relative_to: first-ipv4` rather than a bare `insert: 1` because the module
    # degrades it gracefully: on a fresh host with no rules yet it computes a position past
    # the last rule number and drops the `insert` clause, appending instead. A bare
    # `insert: 1` makes ufw fail on a host whose rule list is still empty.
    insert: 0
    insert_relative_to: first-ipv4
  become: true

- name: Configure UFW firewall - rate-limit SSH
  tags: [firewall]
  community.general.ufw:
    rule: limit
    port: ssh
    proto: tcp
  become: true

# The staging guest's egress fence is NOT here. It is a libvirt nwfilter, defined and
# attached by roles/setup/hypervisor.
#
# Recorded because the wrong answer is the plausible one, and it was mine. #508 fenced the
# guest with a ufw `route deny` on this host. It deployed cleanly, `ufw status` listed it,
# and it was INERT — the acceptance probe still reached the production MetalLB VIP, the k3s
# API and daniel-pi's unauthenticated wg-easy admin UI from inside the guest. The proof it
# could never have worked is one line of /etc/default/ufw: DEFAULT_FORWARD_POLICY="DROP" was
# already set, so if ufw's forward chain governed this traffic the guest would have been
# fenced before #508 was written. libvirt's own FORWARD accept is reached first, and no rule
# ufw can place changes that.
#
# The lesson is not about ufw. A firewall rule that is present and inert reads identical to
# a working one from the host, so "the rule is in `ufw status`" was never evidence. The
# probe at the far side is, which is why it exists and why it caught this.
#
# The task below deletes the inert rule rather than leaving it as belt-and-braces. A rule
# that reads as protection and provides none is worse than no rule at all — the next
# operator to run `ufw status` stops looking. Drop this task after 2026-10-01, by which time
# no host still carries the rule.
- name: Remove the inert staging route-deny rule that PR 508 left behind
  tags: [firewall]
  when: has_hypervisor | bool
  community.general.ufw:
    rule: deny
    route: true
    src: "{{ staging_net_cidr }}"
    dest: "{{ lan_subnet }}"
    delete: true
  become: true

- name: Remove the stale WireGuard 51820/udp allow on the Pi
  tags: [firewall]
  # History: written when the Pi's wg-easy listened on 51820; the Pi moved to 51822
  # (both hosts share one public IP, so the listen ports must differ) and this rule
  # was never updated. No replacement is added: wg-easy publishes its UDP port via
  # Docker, whose nat/FORWARD rules bypass UFW INPUT entirely — proven by the Pi's
  # glances web UI being LAN-reachable with no UFW allow for 61208.
  # The Pi's manually-added 51822 allow is left in place (harmless, documents intent).
  # Kept as a delete-task (not just removed) so existing hosts converge.
  community.general.ufw:
    rule: allow
    port: "51820"
    proto: udp
    delete: true
  become: true
  when: inventory_hostname == 'daniel-pi'

- name: Enable UFW firewall
  tags: [firewall]
  community.general.ufw:
    state: enabled
