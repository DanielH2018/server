---
# Role defaults for initial_setup. Most of this role's tunables live in `group_vars/all.yml`,
# because other roles read them; what lives here is the uv pin, which nothing outside this
# role reads and which `scripts/validate/asset_pins.py` has to see.

# The uv release this host installs, and the versioned installer it is fetched with.
#
# ONE copy of the version, here rather than in group_vars: the `# renovate:` annotation below
# is read only from role defaults (github-releases, astral-sh/uv, no automerge). The role used
# to fetch `astral.sh/uv/install.sh`, which installs the newest release at run time, so
# daniel-box and daniel-server were provisioned onto 0.12.1 and 0.12.5 (#2148). The sha256 is
# the installer script's, and a bump finishes it with `uv run python
# scripts/validate/asset_pins.py --refresh astral-sh/uv`, which fetches the URL below and
# rewrites the hash. Run `--only initial_setup_uv_installer` afterwards before you trust the
# answer: astral.sh serves copies that have hashed differently, and the `get_url` on a host
# re-fetches rather than reusing what CI saw.
# That script embeds the sha256 of every release artifact it downloads and verifies the
# tarball against it, so pinning the script's hash pins the binary too.
#
# The URL sits beside the digest rather than inline in `tasks/host-basics.yml` so that
# `asset_pins.py` can render it: the checker reads `defaults/main.yml` alone, and an inline
# URL leaves the digest unpaired — the finish an unattended renovate_agent run could not do
# without a raw `curl` (#2301).
# renovate: datasource=github-releases depName=astral-sh/uv
initial_setup_uv_version: "0.13.4"
initial_setup_uv_installer_url: "https://astral.sh/uv/{{ initial_setup_uv_version }}/install.sh"
initial_setup_uv_installer_sha256: 1f5390d273b0158bd5eaa3527ae049f3667baa881abb1e7c883dd637d84432f9

# When the daily Docker image prune runs, in the host's clock (UTC on every host). A variable
# rather than a literal in `tasks/crons.yml` so that the healthchecks.io deadman-cadences fragment
# and monitor-bridge's console expectation read the schedule from the same place the cron does
# (#2806). Only `has_docker` hosts install the cron.
initial_setup_docker_prune_cron_minute: 30
initial_setup_docker_prune_cron_hour: 6

# When the weekly worktree sweep runs on `ops_cron_host`, in UTC, for the same reason: it pings
# the `<host>-worktree-sweep` Healthchecks.io check, whose console schedule monitor-bridge holds
# to these values (#4482).
initial_setup_worktree_sweep_cron_minute: 20
initial_setup_worktree_sweep_cron_hour: 4
initial_setup_worktree_sweep_cron_weekday: 0  # Sunday

# The group whose members may connect to the worktree holder scan's socket,
# /run/worktree-holders.sock (tasks/crons.yml, #4297). initial_setup adds sys_user to it, and
# claude_code's agent_access.yml adds each present agent user, because that task's group list
# is exact and would strip a membership granted anywhere else.
initial_setup_worktree_holders_group: worktree-holders

# The hosts whose package owns a subject this role still writes on the others (H7, *Moving one
# host at a time*). A task of the subject carries `when: inventory_hostname not in
# initial_setup_packaged_hosts['<subject>']`. It lives in role defaults, never in `host_vars`,
# because an `inventory/` edit is a deploy-plane change. The last host's PR deletes the subject's
# tasks and this entry.
#   loki_route_witness: daniel-box's witness is the loki-route-witness component since H7.36;
#                       daniel-server keeps the Ansible-era timer until its package moves it.
initial_setup_packaged_hosts:
  loki_route_witness: [daniel-box]
