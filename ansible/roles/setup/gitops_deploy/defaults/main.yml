---
# ── CI gate ───────────────────────────────────────────────────────────────────────────────────
# Refuse to deploy a master tip whose CI is red or still running. Branch protection can't cover
# this: a required status check gates the MERGE, and this gates the DEPLOY, which is the half
# that matters once a whole-tree failure only shows up on master (PR CI is scoped to changed
# files). Set false to deploy whatever is on master.
gitops_deploy_require_ci: true

# Check-run names that must be green. The list lives in `ansible/inventory/group_vars/all.yml`
# as `ci_required_contexts` since H7.2e, with the reasoning, because `promote.py decide`, the
# host-package builder and `homelab-checkout-sync` read it and outlive this role. This default
# is a reference to it until H7.19a retires the deployer, so the deployer's settings file renders
# the same list.
gitops_deploy_ci_contexts: "{{ ci_required_contexts }}"

# How many commits back from the tip the gate may ask GitHub about when the tip is not green.
# The value and its reasoning live in `ansible/inventory/group_vars/all.yml` as
# `ci_ancestor_walk_max` since H7.2e. This default is a reference to it until H7.19a.
gitops_deploy_ci_ancestor_walk_max: "{{ ci_ancestor_walk_max }}"

# One GET per tick that would otherwise deploy, authenticated through `gh auth token` when the
# CLI is logged in (deploy_logic.github_token) — anonymous is 60/hour per source IP, shared with
# every landing's await_ci.py poll.
gitops_deploy_github_repo: DanielH2018/server

# How often the timer starts a tick (systemd time span). The gate authenticates (5000/hour), so
# the anonymous 60/hour per-IP budget does not set the cadence. A shorter interval buys latency
# for everything not landed by hand through land.sh, chiefly Renovate's auto-merged image bumps.
# A noop tick costs one `git fetch`; the GitHub read is spent only on a tick that would
# otherwise deploy. A tick that overruns the interval is safe: the elapse is coalesced into the
# run in flight (timer template), and the tree lock serializes everything else.
gitops_deploy_tick_interval: 10min

# --- The MERGE gate, which is a different thing from gitops_deploy_ci_contexts above ---
#
# The list above is what this DEPLOYER waits for. The list here is what GitHub's ruleset requires
# before a PR can merge at all, and it is a superset: `renovate config validator` gates merges
# while deliberately not gating deploys (see the reasoning above), and `pull + boot changed
# images` is required for merges but has no `push:` trigger, so it never produces a check run on
# master and could never be waited on by a tick. `flux-deletion-drill` is the same shape: it runs
# on `pull_request` only, skips itself when no deletion path changed, and always reports (#6042).
#
# Declared here so github-ruleset-drift.sh can compare it against the live ruleset daily. That
# comparison is the whole point: this list is a hand-copy of remote state that can silently go
# stale. Reconcile this list when the drift
# monitor fires — do not edit the ruleset to match the list.
gitops_deploy_ruleset_id: 20912512
gitops_deploy_expected_ruleset_contexts:
  - prek (lint + validate + tests + secrets)
  - pull + boot changed images
  - renovate config validator
  - flux-deletion-drill
# Nobody merges past the CI gate. A bypass actor added here could merge an un-CI'd PR, through
# land.sh's REST merge or any other merge call it makes. Each entry is
# `<actor_type>:<actor_id>:<bypass_mode>`, as the rulesets API names them.
gitops_deploy_ruleset_bypass_actors: []
# The CI gate's pull_request rule: every change to master arrives as a PR, and none needs an
# approving review. GitHub's auto-merge never applies a bypass, so a non-zero count leaves every
# auto-merged PR BLOCKED. The operator chose on 2026-10-11 that PRs from the operator's account
# and the agent's account both auto-merge once CI is green.
gitops_deploy_ruleset_required_approvals: 0

# The branch-protection ruleset ("Default": `deletion` + `non_fast_forward` on every ref, admin
# bypass only) must exclude Renovate's branches, or GitHub refuses the app's post-merge delete
# and its rebase force-push. A merged branch then survives at its green SHA and the next
# version's PR automerges empty off that stale verdict. The drift
# check alerts when the exclusion is missing; it never writes the ruleset.
gitops_deploy_branch_ruleset_id: 17358590
gitops_deploy_branch_ruleset_renovate_exclude: refs/heads/renovate/**

# The fence ruleset ("agent branch fence", created 2026-10-05): creating, updating and deleting
# a branch is restricted everywhere except the exclusions below. The agent's GitHub account is
# not a bypass actor, so it cannot push onto a branch an operator session or Renovate opened,
# where the next landing of that branch would carry its commit to master. An exclusion added to
# the live ruleset is a branch the agent can push to, so the drift check compares the list
# exactly. Master is excluded so that the agent's account can merge a PR, by auto-merge or
# otherwise. The CI gate's pull_request rule still stops it pushing to master without a PR.
gitops_deploy_fence_ruleset_id: 24517167
gitops_deploy_fence_ruleset_exclude:
  # Master is open to the agent only through a merged PR: see gitops_deploy_ruleset_required_approvals.
  - refs/heads/master
  # EnterWorktree names a `claude/<slug>` worktree's branch `worktree-claude+<slug>`: it
  # replaces `/` with `+` (observed 2026-10-05). `worktree-claude-*` would also match operator
  # branches such as worktree-claude-agent-github-identity.
  - refs/heads/worktree-claude+**
gitops_deploy_fence_ruleset_bypass_actors:
  # `always`, because the operator's sessions and Renovate push branches, not only merge PRs.
  - RepositoryRole:5:always
  - Integration:2740:always

# Daily, offset from the other daniel-box health crons. Rulesets change on a human cadence, and
# the endpoint is rate-limited per source IP (60/hr unauthenticated, shared with renovate_notify),
# so this is a safety net rather than a control loop.
gitops_deploy_ruleset_drift_cron_hour: "6"
gitops_deploy_ruleset_drift_cron_minute: "40"

# The repo's GitHub interaction limit: who may comment, react, open issues and open PRs on a
# repo that stays public. `collaborators_only` closes every one of those to anyone not listed
# as a collaborator; `none` clears the limit. GitHub caps the setting at six months and lets it
# lapse silently, so github-interaction-limit.sh re-applies it daily — a PUT with the same body
# resets the expiry. Change the declaration here, never in the GitHub UI: the cron applies
# whatever this says on its next run. Ten minutes after the ruleset check, same token budget.
gitops_deploy_interaction_limit: collaborators_only
gitops_deploy_interaction_limit_expiry: six_months
gitops_deploy_interaction_limit_cron_hour: "6"
gitops_deploy_interaction_limit_cron_minute: "50"

# k8s auto-deploy — design: docs/gitops-pipeline.md
#
# The tick deploys no k8s role since D6.12. The three keys below stay until D6.2a, because the
# deployer still re-renders the denylist line of config.env that the Renovate lander reads.
gitops_deploy_k8s_autodeploy_enabled: false

# While non-empty, ONLY these services are eligible — the slice-1 pilot scope.
gitops_deploy_k8s_autodeploy_pilot: []

# Roles that must never be auto-deployed, derived from each role's own declaration:
# roles/k8s/<name>/defaults/main.yml sets `k8s_autodeploy` plus a `k8s_autodeploy_reason`
# giving the mechanism.
#
# The filter fails closed: a role that declares nothing, declares a non-boolean, or cannot
# be parsed raises rather than dropping out of this list. Absence from the denylist means
# auto-deployable.
#
# An empty denylist still disarms the feature in gitops_deploy.py rather than allowing
# everything — but the filter refuses to render an empty one, so that guard is a backstop
# rather than a live path.
gitops_deploy_k8s_autodeploy_denylist: "{{ playbook_dir | k8s_autodeploy_denylist }}"

# Bounds ONE broad-plane apply: `initial_setup.yml --tags <role>` for a setup-plane change.
# That arm is FORWARD-ONLY, so this is the only bound between a wedged playbook and systemd's
# TimeoutStartSec SIGTERM — and a SIGTERM lands with no hold written and no alert sent, leaving
# the tree fast-forwarded onto a commit nothing recorded as bad.
#
# 1800 was sized for a 1212s measured full deploy.yml, which the arm no longer runs, and fits
# inside the unit's TimeoutStartSec alongside the 180s max flock wait. Since D6.12 it is also
# the deployer's whole worst-case hold of the git-tree lock, so the lock waiters in
# `test_gitops_deploy_timeout_budgets.py`'s census are checked against it. It deliberately does
# NOT fund a rollback re-run on top, and the arm stays forward-only — the DECIDED marker in
# deploy_remediation.py carries why.
gitops_deploy_broad_timeout_s: 1800

# ── self-render kick ──────────────────────────────────────────────────────────────────────────
# Whether applying this role kicks an immediate `systemctl start gitops-deploy.service`. True for
# every ordinary apply: it is what makes activation fully IaC on a first install. The deployer's
# own denylist reconcile passes false, because that apply runs INSIDE the unit the kick would
# start and the handler would block on the activation already in flight — see
# `deploy_io.render_gitops_config`.
gitops_deploy_kick_after_change: true
