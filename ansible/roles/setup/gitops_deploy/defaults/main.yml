---
# ── CI gate ───────────────────────────────────────────────────────────────────────────────────
# Refuse to deploy a master tip whose CI is red or still running. Until this existed the deployer
# applied whatever landed on master: nothing in the pull path consulted a workflow result, so a
# broken commit reached the homelab on the next 30-min tick. Branch protection can't cover it
# either — a required status check gates the MERGE, and this gates the DEPLOY, which is the half
# that matters once a whole-tree failure only shows up on master (PR CI is scoped to changed
# files). Set false to go back to deploying whatever is on master.
gitops_deploy_require_ci: true

# Check-run names that must be green. These are GitHub's check-run NAMES, which are also the
# strings branch protection calls contexts — they must match ci.yml's `name:` EXACTLY, and that
# file carries a comment saying as much. `renovate config validator` is deliberately not required:
# it self-skips its real work off a per-PR condition, so on a master push it proves nothing.
gitops_deploy_ci_contexts:
  - prek (lint + validate + tests + secrets)

# Queried unauthenticated (public repo), one GET per tick that would otherwise deploy.
gitops_deploy_github_repo: DanielH2018/server

# k8s auto-deploy — design: docs/superpowers/specs/2026-08-14-renovate-k8s-autodeploy-design.md
#
# Ships OFF. Slice 1 enables it scoped to the pilot service; slice 3 clears the pilot list once
# the induced-failure drill has proven rollback + hold clearing.
gitops_deploy_k8s_autodeploy_enabled: false

# While non-empty, ONLY these services are eligible — the slice-1 pilot scope.
gitops_deploy_k8s_autodeploy_pilot: []

# Most services one tick may promote; 0 disables the cap. deploy_k8s joins every promoted
# service into a SINGLE ansible-playbook run under one K8S_DEPLOY_TIMEOUT_S (900s), and the
# failure path is `git reset --hard local` over the whole merged range — so a batch that
# overruns discards the good bumps along with the bad one. At roughly 2.5 min of rollout and
# soak per service, 900s is spent around five or six.
#
# renovate.json states the intent ("keeps each auto-deploy tick to a single service, which is
# what the deploy timeout is sized for") but nothing enforced it: a tick diffs local..origin,
# spanning every commit since the last one, and the per-service k8s PRs share one daily window
# with platformAutomerge. The pilot list happens to bound this today at one service; this
# survives the pilot being cleared, which is when it would otherwise start to matter.
#
# 3 rather than 1: a cap of 1 would defer routine multi-bump mornings a tick at a time for no
# safety gain, since three services fit the timeout with room to spare.
gitops_deploy_k8s_autodeploy_max_per_tick: 3

# Services that must NEVER auto-deploy, even on a clean image-only diff. This list is the safety
# boundary: eligibility is (image-only diff) AND (not denylisted) AND (pilot scope, if set).
# An EMPTY list disables the feature outright rather than allowing everything — see the
# fail-closed guard in gitops_deploy.py.
gitops_deploy_k8s_autodeploy_denylist:
  # platform — a failed deploy here removes the ability to observe OR fix the failure, and
  # etp-local-vips-blackout-on-node-join shows host probes stay green straight through it
  - traefik
  - authelia
  - pihole
  - crowdsec
  - wg-easy
  # observability — a broken monitor cannot page about being broken
  - monitor-bridge
  - autofix-bridge
  - uptime-kuma
  - claude-otel
  - loki-homelab
  - healthchecks
  # migrating state — Recreate + RWO Longhorn migrates the volume BEFORE failure is detected, so
  # the rollback redeploy can fail too and leave the pod crashlooping on data it can no longer
  # read. home-assistant is the sharpest: the linuxserver -lsNN regex versioning makes
  # 2026.6.3 -> 2026.7.0 a MINOR, so HA's breaking-change channel would auto-merge.
  - home-assistant
  - sonarr
  - radarr
  - jellyfin
  - zigbee2mqtt
  # Same class, added 2026-08-16 when the pilot list was cleared: all three are Recreate + RWO
  # Longhorn, identical in shape to their denylisted siblings above, and were eligible only
  # because the slice-1 pilot happened to name neither. qbittorrent is the sharpest of the three
  # — its WireGuard sidecar's kill-switch lives in the pod netns and outlives the container that
  # owns it, so a failed image swap does not merely crashloop, it deadlocks the pod behind a
  # fence nothing in the rollout gate can see (9h / 107 restarts, 2026-08-16).
  - qbittorrent
  - bazarr
  - tdarr
  # dependency edges — this deployer models no intra-tick ordering. registry is the image-supply
  # path for n8n, n8n-runners, homelab-mcp, ical-proxy, nut, pi-peer-backup and code-server
  # (homelab-mcp pulls with imagePullPolicy: Always); mosquitto is the broker for zigbee2mqtt
  # and home-assistant.
  - registry
  - mosquitto
  # ungated sub-deployments — these roles render a SECOND Deployment that k8s/manifests never
  # waits on (it gates deploy/{{ manifests_rollout | default(service) }}, exactly one). Remove
  # once a role stops rendering two; the guard test in scripts/ enforces the invariant.
  - prowlarr
  - freshrss
  # stateful / manual-upgrade — pinned influxdb; meilisearch DB-format migration; probe-less
  # sub-deployments (karakeep time-tagger, n8n runners)
  - scrutiny
  - karakeep
  - n8n
  # livesync is a CouchDB instance (Recreate + RWO) — a database, in the same class as the
  # pinned influxdb above. Added 2026-08-16 with the pilot clearing.
  - livesync
  # nothing for `rollout status` to gate — CronJob / Job / volume / DaemonSet
  - configarr
  - pi-peer-backup
  - media-volume
  - n8n-images
  # route-only role: renders an IngressRoute + Middlewares into longhorn-system and owns no
  # Deployment at all (Longhorn itself comes from roles/setup/k3s), so there is nothing for
  # `rollout status` to gate. It also pins no image, so it can never qualify anyway.
  - longhorn-ui
  - node-exporter
  - dri-device-plugin
  # probe-less Deployments — `rollout status` returns on Running and proves nothing
  - cloudflare-ddns
  - janitorr
  - nut
  - terraria
  # valheim renders no readinessProbe at all — the same shape as terraria directly above, and
  # missed for the same reason the two below were (added 2026-08-16 with the pilot clearing).
  - valheim
  # games
  - terraria-stats
  - valheim-stats

# Wall-clock cap for one `ansible-playbook` invocation on the k8s path, in seconds. Sized as
# (max rollout wait + stabilise soak) x 2 so a forward rollout AND its rollback redeploy both fit
# inside the unit's TimeoutStartSec=25min. RUN_BUDGET_S does NOT cover this path — it bounds only
# the Docker health gate (gate_services), which is inert on an all-k8s host.
gitops_deploy_k8s_timeout_s: 900
