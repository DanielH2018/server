---
# ── CI gate ───────────────────────────────────────────────────────────────────────────────────
# Refuse to deploy a master tip whose CI is red or still running. Branch protection can't cover
# this: a required status check gates the MERGE, and this gates the DEPLOY, which is the half
# that matters once a whole-tree failure only shows up on master (PR CI is scoped to changed
# files). Set false to deploy whatever is on master.
gitops_deploy_require_ci: true

# Check-run names that must be green. The list lives in `ansible/inventory/group_vars/all.yml`
# as `ci_required_contexts` since H7.2e, with the reasoning, because `promote.py decide`, the
# host-package builder and `homelab-checkout-sync` read it and outlive this role. This default
# is a reference to it until H7.19a retires the deployer, so the deployer's settings file renders
# the same list.
gitops_deploy_ci_contexts: "{{ ci_required_contexts }}"

# How many commits back from the tip the gate may ask GitHub about when the tip is not green.
# The value and its reasoning live in `ansible/inventory/group_vars/all.yml` as
# `ci_ancestor_walk_max` since H7.2e. This default is a reference to it until H7.19a.
gitops_deploy_ci_ancestor_walk_max: "{{ ci_ancestor_walk_max }}"

# One GET per tick that would otherwise deploy, authenticated through `gh auth token` when the
# CLI is logged in (deploy_logic.github_token) — anonymous is 60/hour per source IP, shared with
# every landing's await_ci.py poll.
gitops_deploy_github_repo: DanielH2018/server

# How often the timer starts a tick (systemd time span). The gate authenticates (5000/hour), so
# the anonymous 60/hour per-IP budget does not set the cadence. A shorter interval buys latency
# for everything not landed by hand through land.sh, chiefly Renovate's auto-merged image bumps.
# A noop tick costs one `git fetch`; the GitHub read is spent only on a tick that would
# otherwise deploy. A tick that overruns the interval is safe: the elapse is coalesced into the
# run in flight (timer template), and the tree lock serializes everything else.
gitops_deploy_tick_interval: 10min

# Bounds ONE broad-plane apply: `initial_setup.yml --tags <role>` for a setup-plane change.
# That arm is FORWARD-ONLY, so this is the only bound between a wedged playbook and systemd's
# TimeoutStartSec SIGTERM — and a SIGTERM lands with no hold written and no alert sent, leaving
# the tree fast-forwarded onto a commit nothing recorded as bad.
#
# 1800 was sized for a 1212s measured full deploy.yml, which the arm no longer runs, and fits
# inside the unit's TimeoutStartSec alongside the 180s max flock wait. Since D6.12 it is also
# the deployer's whole worst-case hold of the git-tree lock, so the lock waiters in
# `test_gitops_deploy_timeout_budgets.py`'s census are checked against it. It deliberately does
# NOT fund a rollback re-run on top, and the arm stays forward-only — the DECIDED marker in
# deploy_remediation.py carries why.
gitops_deploy_broad_timeout_s: 1800
