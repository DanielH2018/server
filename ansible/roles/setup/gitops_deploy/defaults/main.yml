---
# ── CI gate ───────────────────────────────────────────────────────────────────────────────────
# Refuse to deploy a master tip whose CI is red or still running. Branch protection can't cover
# this: a required status check gates the MERGE, and this gates the DEPLOY, which is the half
# that matters once a whole-tree failure only shows up on master (PR CI is scoped to changed
# files). Set false to deploy whatever is on master.
gitops_deploy_require_ci: true

# Check-run names that must be green. These are GitHub's check-run NAMES, which are also the
# strings branch protection calls contexts — they must match ci.yml's `name:` EXACTLY, and that
# file carries a comment saying as much. `renovate config validator` is deliberately not required,
# but NOT because it skips: `ci.yml`'s guard is
# `if: github.event_name != 'pull_request' || steps.scope.outputs.changed == 'true'`, whose left
# operand is true on a push, so it runs unconditionally on master — which is exactly the tip
# `fetch_ci_verdict` reads, and ci.yml says so itself. It is excluded because a red
# renovate.json does not change what a deploy renders or applies: the config is consumed by the
# hosted Mend app when it opens PRs, a plane this deployer never touches. Blocking the deploy
# gate on it would park every later image bump behind a dependency-management fault.
gitops_deploy_ci_contexts:
  - prek (lint + validate + tests + secrets)

# How many commits back from the tip the gate may ask GitHub about when the tip is not green.
# The tip's own request counts, so 10 is at most ten requests on a tick that would otherwise
# defer, and zero on every other tick. It bounds `deploy_phases.assess`'s walk to the newest
# green ancestor: master takes about 124 merges a day (median gap 315s) against a ~103s CI
# sweep, so the tip is pending on most ticks that would deploy, and gating on the tip alone parks
# a green commit behind every later merge's sweep.
#
# 10 rather than a larger number: it covers the measured p25 merge gap of 88s against a sweep
# of ~103s several times over, and the walk is spent inside one tick's wall clock while the
# tree lock is held. A range longer than ten commits behind a red tail is a state for the
# behind-origin watchdog to page on, not one to keep spending requests on.
#
# Worst case, authenticated: ten GETs on one tick against 5000/hour per token. ANONYMOUS the
# walk does not run at all — `deploy_phases._newest_green_ancestor` asks
# `tools.github_authenticated()` first and logs one line saying it skipped. The anonymous limit
# is 60/hour per source IP, shared with every landing's await_ci.py poll (45 per 900s wait), so
# a ten-request burst per tick would exhaust it and every reader on the host would then read
# `HTTP Error 403`, which this gate maps to `pending` — buying one tick's latency by deferring
# the next several. 0 (or any value below it) disarms the walk on every host.
gitops_deploy_ci_ancestor_walk_max: 10

# One GET per tick that would otherwise deploy, authenticated through `gh auth token` when the
# CLI is logged in (deploy_logic.github_token) — anonymous is 60/hour per source IP, shared with
# every landing's await_ci.py poll.
gitops_deploy_github_repo: DanielH2018/server

# How often the timer starts a tick (systemd time span). The gate authenticates (5000/hour), so
# the anonymous 60/hour per-IP budget does not set the cadence. A shorter interval buys latency
# for everything not landed by hand through land.sh, chiefly Renovate's auto-merged image bumps.
# A noop tick costs one `git fetch`; the GitHub read is spent only on a tick that would
# otherwise deploy. A tick that overruns the interval is safe: the elapse is coalesced into the
# run in flight (timer template), and the tree lock serializes everything else.
gitops_deploy_tick_interval: 10min

# --- The MERGE gate, which is a different thing from gitops_deploy_ci_contexts above ---
#
# The list above is what this DEPLOYER waits for. The list here is what GitHub's ruleset requires
# before a PR can merge at all, and it is a superset: `renovate config validator` gates merges
# while deliberately not gating deploys (see the reasoning above), and `pull + boot changed
# images` is required for merges but has no `push:` trigger, so it never produces a check run on
# master and could never be waited on by a tick.
#
# Declared here so github-ruleset-drift.sh can compare it against the live ruleset daily. That
# comparison is the whole point: this list is a hand-copy of remote state that can silently go
# stale. Reconcile this list when the drift
# monitor fires — do not edit the ruleset to match the list.
gitops_deploy_ruleset_id: 20912512
gitops_deploy_expected_ruleset_contexts:
  - prek (lint + validate + tests + secrets)
  - pull + boot changed images
  - renovate config validator

# The branch-protection ruleset ("Default": `deletion` + `non_fast_forward` on every ref, admin
# bypass only) must exclude Renovate's branches, or GitHub refuses the app's post-merge delete
# and its rebase force-push. A merged branch then survives at its green SHA and the next
# version's PR automerges empty off that stale verdict. The drift
# check alerts when the exclusion is missing; it never writes the ruleset.
gitops_deploy_branch_ruleset_id: 17358590
gitops_deploy_branch_ruleset_renovate_exclude: refs/heads/renovate/**

# Daily, offset from the other daniel-box health crons. Rulesets change on a human cadence, and
# the endpoint is rate-limited per source IP (60/hr unauthenticated, shared with renovate_notify),
# so this is a safety net rather than a control loop.
gitops_deploy_ruleset_drift_cron_hour: "6"
gitops_deploy_ruleset_drift_cron_minute: "40"

# The repo's GitHub interaction limit: who may comment, react, open issues and open PRs on a
# repo that stays public. `collaborators_only` closes every one of those to anyone not listed
# as a collaborator; `none` clears the limit. GitHub caps the setting at six months and lets it
# lapse silently, so github-interaction-limit.sh re-applies it daily — a PUT with the same body
# resets the expiry. Change the declaration here, never in the GitHub UI: the cron applies
# whatever this says on its next run. Ten minutes after the ruleset check, same token budget.
gitops_deploy_interaction_limit: collaborators_only
gitops_deploy_interaction_limit_expiry: six_months
gitops_deploy_interaction_limit_cron_hour: "6"
gitops_deploy_interaction_limit_cron_minute: "50"

# k8s auto-deploy — design: docs/gitops-pipeline.md
#
# Ships OFF. Slice 1 enables it scoped to the pilot service; slice 3 clears the pilot list once
# the induced-failure drill has proven rollback + hold clearing.
gitops_deploy_k8s_autodeploy_enabled: false

# While non-empty, ONLY these services are eligible — the slice-1 pilot scope.
gitops_deploy_k8s_autodeploy_pilot: []

# Most services one tick may promote; 0 disables the cap. deploy_k8s joins every promoted
# service into a SINGLE ansible-playbook run under one K8S_DEPLOY_TIMEOUT_S (1440s), and the
# failure path is `git reset --hard local` over the whole merged range — so a batch that
# overruns discards the good bumps along with the bad one. At roughly 2.5 min of rollout and
# soak per service, 1440s is spent around nine; the cap is sized for the worst SINGLE role.
#
# renovate.json states the intent ("keeps each auto-deploy tick to a single service, which is
# what the deploy timeout is sized for"), and this cap enforces it: a tick diffs local..origin,
# spanning every commit since the last one, and the per-service k8s PRs share one daily window
# with platformAutomerge. The pilot list bounds the tick at one service while it is non-empty;
# the cap still holds once the pilot is cleared.
#
# 3 rather than 1: a cap of 1 would defer routine multi-bump mornings a tick at a time for no
# safety gain, since three services fit the timeout with room to spare.
gitops_deploy_k8s_autodeploy_max_per_tick: 3

# Most services declaring `k8s_autodeploy_snapshot_pvcs` one tick may promote; 0 disables the cap.
# Separate from the cap above because the two bound different costs. max_per_tick bounds the
# FORWARD deploy, where every service costs about the same. This bounds the ROLLBACK, where only
# claim-declaring services pay a snapshot+revert phase — serially, inside the one playbook run —
# while gitops_deploy_k8s_rollback_timeout_s is derived for the worst SINGLE such service.
#
# Two co-batched claim-declaring services need ~1680s against that 1320s budget and three ~2160s;
# past it killpg fires mid-revert, leaving a workload at zero replicas with its volume attached in
# Longhorn maintenance mode. The lscr.io/linuxserver/* siblings share one Renovate automerge
# window with no stagger, so a 2-3 sibling tick is ordinary rather than rare.
#
# 1, not a larger number: this is what makes the single-service rollback ceiling the binding one.
# Claim-FREE services still batch up to max_per_tick — they cost nothing on the revert path — so
# this defers far less than lowering max_per_tick to 1 would. Surplus stays in cs.k8s and
# defer-and-alerts, naming the services and their deploy tags.
gitops_deploy_k8s_autodeploy_max_claim_services_per_tick: 1

# Roles that must never be auto-deployed, derived from each role's own declaration:
# roles/k8s/<name>/defaults/main.yml sets `k8s_autodeploy` plus a `k8s_autodeploy_reason`
# giving the mechanism.
#
# The filter fails closed: a role that declares nothing, declares a non-boolean, or cannot
# be parsed raises rather than dropping out of this list. Absence from the denylist means
# auto-deployable.
#
# An empty denylist still disarms the feature in gitops_deploy.py rather than allowing
# everything — but the filter refuses to render an empty one, so that guard is a backstop
# rather than a live path.
gitops_deploy_k8s_autodeploy_denylist: "{{ playbook_dir | k8s_autodeploy_denylist }}"

# Wall-clock cap for one `ansible-playbook` invocation on the k8s path, in seconds — the FORWARD
# deploy only; the rollback redeploy has its own budget below.
#
# DERIVED from the worst promoted role. The same terms the rollback budget below sums,
# minus the revert ones, run inside this one budget in sequence: claims x volume_snapshot_timeout
# (the pre-apply snapshot) + the role's OWN in-role waits + manifests_rollout_timeout +
# k8s_rollout_stabilise_seconds. prowlarr is the worst at 120 + 300 + 780 + 60 = 1260s. The
# rollout term is counted only for a role that queues one: netpol-baseline has the most in-role
# waiting in the repo (five probe Jobs at `--timeout=130s`) and passes `manifests_rollout: ""`,
# so it pays 710s rather than the 1310s its own rollout budget would suggest.
#
# On top of the role terms the tick pays two things no role declares:
#   - the service-lock wait, spent out of this same budget (`deploy_locks.locked_budget`). 90s
#     allowance: a sonarr tick showed a 70s gap consistent with one.
#   - playbook overhead (start-up, facts, renders). 60s allowance: a sonarr tick was 27.8s in
#     total, of which the snapshot was 4.74s and the probe 0.27s.
# 1260 + 90 + 60 = 1410, rounded up to 1440. Under 1410 a cap kill lands as a killpg MID-DRAIN
# that routes to _rollback_k8s, and it binds before prowlarr's own 780s rollout timeout does.
#
# Every second here is inside `_worst_lock_hold` (600 + 120 + 1440 + 1620 = 3780s), so raising
# this moves four other values with it, in the same change: the tree-lock waits of secret-rotate,
# docs-refresh and eval-run (`flock -w`) and deploy.sh's LOCK_WAIT, all 3840, and the unit's
# TimeoutStartSec (70min). `test_gitops_deploy_timeout_budgets.py` derives the forward worst case
# from role sources and fails if it outgrows this cap, and its waiter census fails if a waiter
# falls under the hold.
#
# The broad arm starts a promoted bump only while this much of BROAD_DEPLOY_TIMEOUT_S (1800) is
# left, so a larger cap defers a bump out of a broad tick sooner. The deferral is the safe side:
# the bump defer-and-alerts, and the next k8s tick deploys it.
gitops_deploy_k8s_timeout_s: 1440

# Wall-clock cap for the ROLLBACK redeploy specifically — the run that also reverts each claimed
# volume to its pre-deploy snapshot (k8s/volume-revert), which does strictly more work than a
# forward deploy: per claim, worst case is 3 state waits + 3 API calls against Longhorn on the
# revert, plus its own pre-revert snapshot wait, plus the forward apply's own rollout wait and
# the post-rollout stabilisation soak — all inside the SAME playbook run, on one continuous
# timeline where nothing fails (a failure aborts the whole play immediately — no
# ignore_errors/failed_when anywhere in this chain — so it can never compound with an
# independent failure elsewhere; see CLAUDE.md's rollback-timeout section).
#
# Sized against every promoted (`k8s_autodeploy: true`) role that also declares
# `k8s_autodeploy_snapshot_pvcs`, at task 6b's drill-sized volume_revert_state_timeout/api_timeout
# (90/30) and volume_snapshot_timeout (120):
#   ceiling = claims x (volume_snapshot_timeout + 3xvolume_revert_state_timeout
#             + 3xvolume_revert_api_timeout) + the role's OWN in-role waits
#             + manifests_rollout_timeout + k8s_rollout_stabilise_seconds (60)
#
# The in-role term matters. A role's own `tasks/` run before k8s/manifests/tasks/drain.yml, so
# what they wait for adds to the drain rather than overlapping it: prowlarr waits
# `--timeout=300s` for its flaresolverr isolation probe Job, on top of its 780s rollout. That
# makes prowlarr the worst promoted service at 480 + 300 + 780 + 60 = 1620s. An inline `rollout status` gate is
# NOT counted — sonarr's 660s gate waits for the rollout the drain also waits for, so the two are
# alternatives on one timeline, not additions.
#
# 1620 is the worst case exactly, with no slack, and that is deliberate: it is the largest
# value the four tree-lock waiters (3840s) still clear with a 60s margin. The test below computes the real ceiling
# from role sources rather than trusting this number, so a new in-role wait or a rollout bump
# fails there instead of being absorbed silently.
#
# The multi-service case is NOT covered by this constant and is not meant to be. Every role in a
# batch runs its own snapshot+revert phase and its own in-role waits in sequence inside the one
# playbook run (only the rollout WAIT is batched/deduped via roles/k8s/manifests/tasks/drain.yml), so a
# batch's cost is additive — radarr and sonarr together come to 2x(120+360) + 660 + 60 = 1680s,
# and three such services to ~2160s. Past this budget `run()`'s killpg fires MID-REVERT, after
# k8s/volume-revert has scaled the workload to zero replicas and attached its volume with
# disableFrontend: true.
#
# What closes it is gitops_deploy_k8s_autodeploy_max_claim_services_per_tick (below), which caps
# claim-declaring services per tick so this single-service ceiling is always the binding one.
# Per-service invocation on the rollback path does NOT fit: 3 x 1200 + 1440 forward + 180 flock
# = 5220s exceeds the unit's TimeoutStartSec (gitops-deploy.service.j2 is the live value).
#
# This value has its OWN budget rather than sharing gitops_deploy_k8s_timeout_s (1440) at runtime
# because the two runs are sequential within one systemd unit activation — see
# gitops-deploy.service.j2's TimeoutStartSec and that template's own arithmetic comment.
# Consequence: the lock this unit holds (/var/lock/server-git-tree.lock, the same one
# ./scripts/deploy.sh and the weekly secret-rotate cron take) can be held past the timer
# interval in the pathological case both k8s timeouts are spent in full — see CLAUDE.md for what that does to a concurrent
# ./scripts/deploy.sh (exit 75, nothing deployed) or the secret-rotate cron (waits on the lock).
gitops_deploy_k8s_rollback_timeout_s: 1620

# Bounds ONE broad-plane apply: `initial_setup.yml --tags <role>` for a setup-plane change, or
# a full `deploy.yml` for a shared-template/inventory one. That arm is FORWARD-ONLY, so this is
# the only bound between a wedged playbook and systemd's TimeoutStartSec SIGTERM — and a SIGTERM
# lands with no hold written and no alert sent, leaving the tree fast-forwarded onto a commit
# nothing recorded as bad.
#
# 1800 covers the 1212s measured full deploy with headroom, and fits inside the unit's
# TimeoutStartSec alongside the 180s max flock wait. It deliberately does NOT fund a rollback
# re-run on top, and the arm stays forward-only — the DECIDED marker in deploy_remediation.py
# carries why.
gitops_deploy_broad_timeout_s: 1800

# The retired staging gate's dedicated ssh identity, a reap target rather than a deployed file.
#
# install.yml deletes this path; the name stays only so both halves of the role name the same
# file. Drop it once every has_gitops host has applied the role at least once.
gitops_deploy_retired_staging_gate_key_path: /etc/gitops-deploy/staging_gate_ed25519

# ── self-render kick ──────────────────────────────────────────────────────────────────────────
# Whether applying this role kicks an immediate `systemctl start gitops-deploy.service`. True for
# every ordinary apply: it is what makes activation fully IaC on a first install. The deployer's
# own denylist reconcile passes false, because that apply runs INSIDE the unit the kick would
# start and the handler would block on the activation already in flight — see
# `deploy_io.render_gitops_config`.
gitops_deploy_kick_after_change: true
