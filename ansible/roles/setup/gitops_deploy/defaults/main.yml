---
# ── CI gate ───────────────────────────────────────────────────────────────────────────────────
# Refuse to deploy a master tip whose CI is red or still running. Until this existed the deployer
# applied whatever landed on master: nothing in the pull path consulted a workflow result, so a
# broken commit reached the homelab on the next 30-min tick. Branch protection can't cover it
# either — a required status check gates the MERGE, and this gates the DEPLOY, which is the half
# that matters once a whole-tree failure only shows up on master (PR CI is scoped to changed
# files). Set false to go back to deploying whatever is on master.
gitops_deploy_require_ci: true

# Check-run names that must be green. These are GitHub's check-run NAMES, which are also the
# strings branch protection calls contexts — they must match ci.yml's `name:` EXACTLY, and that
# file carries a comment saying as much. `renovate config validator` is deliberately not required,
# but NOT because it skips: `ci.yml`'s guard is
# `if: github.event_name != 'pull_request' || steps.scope.outputs.changed == 'true'`, whose left
# operand is true on a push, so it runs unconditionally on master — which is exactly the tip
# `fetch_ci_verdict` reads, and ci.yml says so itself. It is excluded because a red
# renovate.json does not change what a deploy renders or applies: the config is consumed by the
# hosted Mend app when it opens PRs, a plane this deployer never touches. Blocking the deploy
# gate on it would park every later image bump behind a dependency-management fault.
gitops_deploy_ci_contexts:
  - prek (lint + validate + tests + secrets)

# Queried unauthenticated (public repo), one GET per tick that would otherwise deploy.
gitops_deploy_github_repo: DanielH2018/server

# k8s auto-deploy — design: docs/superpowers/specs/2026-08-14-renovate-k8s-autodeploy-design.md
#
# Ships OFF. Slice 1 enables it scoped to the pilot service; slice 3 clears the pilot list once
# the induced-failure drill has proven rollback + hold clearing.
gitops_deploy_k8s_autodeploy_enabled: false

# While non-empty, ONLY these services are eligible — the slice-1 pilot scope.
gitops_deploy_k8s_autodeploy_pilot: []

# Most services one tick may promote; 0 disables the cap. deploy_k8s joins every promoted
# service into a SINGLE ansible-playbook run under one K8S_DEPLOY_TIMEOUT_S (900s), and the
# failure path is `git reset --hard local` over the whole merged range — so a batch that
# overruns discards the good bumps along with the bad one. At roughly 2.5 min of rollout and
# soak per service, 900s is spent around five or six.
#
# renovate.json states the intent ("keeps each auto-deploy tick to a single service, which is
# what the deploy timeout is sized for") but nothing enforced it: a tick diffs local..origin,
# spanning every commit since the last one, and the per-service k8s PRs share one daily window
# with platformAutomerge. The pilot list happens to bound this today at one service; this
# survives the pilot being cleared, which is when it would otherwise start to matter.
#
# 3 rather than 1: a cap of 1 would defer routine multi-bump mornings a tick at a time for no
# safety gain, since three services fit the timeout with room to spare.
gitops_deploy_k8s_autodeploy_max_per_tick: 3

# Most services declaring `k8s_autodeploy_snapshot_pvcs` one tick may promote; 0 disables the cap.
# Separate from the cap above because the two bound different costs. max_per_tick bounds the
# FORWARD deploy, where every service costs about the same. This bounds the ROLLBACK, where only
# claim-declaring services pay a snapshot+revert phase — serially, inside the one playbook run —
# while gitops_deploy_k8s_rollback_timeout_s is derived for the worst SINGLE such service.
#
# Two co-batched claim-declaring services need ~1680s against that 1320s budget and three ~2160s;
# past it killpg fires mid-revert, leaving a workload at zero replicas with its volume attached in
# Longhorn maintenance mode. Slice 7b co-promoted five lscr.io/linuxserver/* siblings sharing one
# Renovate automerge window with no stagger, so a 2-3 sibling tick is ordinary rather than rare.
#
# 1, not a larger number: this is what makes the single-service rollback ceiling the binding one.
# Claim-FREE services still batch up to max_per_tick — they cost nothing on the revert path — so
# this defers far less than lowering max_per_tick to 1 would. Surplus stays in cs.k8s and
# defer-and-alerts, naming the services and their deploy tags.
gitops_deploy_k8s_autodeploy_max_claim_services_per_tick: 1

# Roles that must never be auto-deployed, derived from each role's own declaration:
# roles/k8s/<name>/defaults/main.yml sets `k8s_autodeploy` plus a `k8s_autodeploy_reason`
# giving the mechanism. The reasons that used to be comments here now live beside the role
# they describe, where every property that justifies them is visible at once.
#
# The filter fails closed: a role that declares nothing, declares a non-boolean, or cannot
# be parsed raises rather than dropping out of this list. Absence from the denylist means
# auto-deployable, which is how seed-volume and image-builder went months as eligible.
#
# An empty denylist still disarms the feature in gitops_deploy.py rather than allowing
# everything — but the filter refuses to render an empty one, so that guard is now a
# backstop rather than a live path.
gitops_deploy_k8s_autodeploy_denylist: "{{ playbook_dir | k8s_autodeploy_denylist }}"

# Wall-clock cap for one `ansible-playbook` invocation on the k8s path, in seconds — the FORWARD
# deploy only; the rollback redeploy has its own budget below. RUN_BUDGET_S does NOT cover this
# path — it bounds only the Docker health gate (gate_services), which is inert on an all-k8s host.
gitops_deploy_k8s_timeout_s: 900

# Wall-clock cap for the ROLLBACK redeploy specifically — the run that also reverts each claimed
# volume to its pre-deploy snapshot (k8s/volume-revert), which does strictly more work than a
# forward deploy: per claim, worst case is 3 state waits + 3 API calls against Longhorn on the
# revert, plus its own pre-revert snapshot wait, plus the forward apply's own rollout wait and
# the post-rollout stabilisation soak — all inside the SAME playbook run, on one continuous
# timeline where nothing fails (a failure aborts the whole play immediately — no
# ignore_errors/failed_when anywhere in this chain — so it can never compound with an
# independent failure elsewhere; see CLAUDE.md's rollback-timeout section).
#
# Re-sized (round 2, this fix): the prior 900s residual named 180s for "the rest of the run"
# and never named the forward apply's OWN rollout wait — `manifests_rollout_timeout`, which
# `radarr`/`sonarr` override to 660s (first-boot DOCKER_MODS install) while everything else
# defaults to 300s. Sized here against every currently-promoted (`k8s_autodeploy: true`) role
# that also declares `k8s_autodeploy_snapshot_pvcs`, at task 6b's drill-sized
# volume_revert_state_timeout/api_timeout (90/30) and volume_snapshot_timeout (120):
#   ceiling = claims x (volume_snapshot_timeout + 3xvolume_revert_state_timeout
#             + 3xvolume_revert_api_timeout) + manifests_rollout_timeout
#             + k8s_rollout_stabilise_seconds (60)
# 1320 was derived from `tdarr` (2 claims, default 300s rollout): 2x(120+360) + 300 + 60. tdarr
# has since been re-denied (`k8s_autodeploy: false`, 2026-08-22) over its shared-media coupling,
# so it is no longer in the promoted set and no longer the worst PROMOTED service — that is now
# radarr/sonarr's single-claim 660s-rollout case at 1200s. The constant is therefore 120s larger
# than today's worst case, which errs safe; the test below computes the real ceiling from role
# sources rather than trusting this number, so a future promotion re-tightens it automatically.
#
# The multi-service case is NOT covered by this constant and is not meant to be. Every role in a
# batch runs its own snapshot+revert phase in sequence inside the one playbook run (only the
# rollout WAIT is batched/deduped via roles/k8s/rollout-drain), so a batch's snapshot+revert cost
# is additive — radarr and sonarr together come to 2x(120+360) + 660 + 60 = 1680s, and three
# such services to ~2160s. Past this budget `run()`'s killpg fires MID-REVERT, after
# k8s/volume-revert has scaled the workload to zero replicas and attached its volume with
# disableFrontend: true.
#
# What closes it is gitops_deploy_k8s_autodeploy_max_claim_services_per_tick (below), which caps
# claim-declaring services per tick so this single-service ceiling is always the binding one.
# Per-service invocation on the rollback path — the fix this comment used to name — does NOT fit:
# 3 x 1200 + 900 forward + 180 flock exceeds the unit's 2700s TimeoutStartSec.
#
# This value has its OWN budget rather than sharing gitops_deploy_k8s_timeout_s (900) at runtime
# because the two runs are sequential within one systemd unit activation — see
# gitops-deploy.service.j2's TimeoutStartSec (raised to 45min for exactly this) and that
# template's own arithmetic comment. Consequence: the lock this unit holds
# (/var/lock/server-git-tree.lock, the same one ./scripts/deploy.sh and the weekly secret-rotate
# cron take) can now be held past the 30-minute timer interval in the pathological case both
# k8s timeouts are spent in full — see CLAUDE.md for what that does to a concurrent
# ./scripts/deploy.sh (exit 75, nothing deployed) or the secret-rotate cron (waits on the lock).
gitops_deploy_k8s_rollback_timeout_s: 1320

# The staging gate (Phase C slice 3, docs/staging-phase-c.md). ADVISORY: the deployer asks
# daniel-stage about the commit, logs and alerts the verdict, and deploys prod either way.
# Blocking is slice 4 and is a separate change.
#
# False everywhere by default. Enabling it costs every k8s-deploying tick the staging deploy's
# wall-clock, and it only works on a host that can reach daniel-server over ssh — which today
# means daniel-box, the only host running this deployer. It is a switch rather than a given
# because the point of the slice is to measure a false-failure rate against real merges before
# anything depends on the answer.
gitops_deploy_staging_gate: false
