---
# ── CI gate ───────────────────────────────────────────────────────────────────────────────────
# Refuse to deploy a master tip whose CI is red or still running. Until this existed the deployer
# applied whatever landed on master: nothing in the pull path consulted a workflow result, so a
# broken commit reached the homelab on the next 30-min tick. Branch protection can't cover it
# either — a required status check gates the MERGE, and this gates the DEPLOY, which is the half
# that matters once a whole-tree failure only shows up on master (PR CI is scoped to changed
# files). Set false to go back to deploying whatever is on master.
gitops_deploy_require_ci: true

# Check-run names that must be green. These are GitHub's check-run NAMES, which are also the
# strings branch protection calls contexts — they must match ci.yml's `name:` EXACTLY, and that
# file carries a comment saying as much. `renovate config validator` is deliberately not required:
# it self-skips its real work off a per-PR condition, so on a master push it proves nothing.
gitops_deploy_ci_contexts:
  - prek (lint + validate + tests + secrets)

# Queried unauthenticated (public repo), one GET per tick that would otherwise deploy.
gitops_deploy_github_repo: DanielH2018/server

# k8s auto-deploy — design: docs/superpowers/specs/2026-08-14-renovate-k8s-autodeploy-design.md
#
# Ships OFF. Slice 1 enables it scoped to the pilot service; slice 3 clears the pilot list once
# the induced-failure drill has proven rollback + hold clearing.
gitops_deploy_k8s_autodeploy_enabled: false

# While non-empty, ONLY these services are eligible — the slice-1 pilot scope.
gitops_deploy_k8s_autodeploy_pilot: []

# Most services one tick may promote; 0 disables the cap. deploy_k8s joins every promoted
# service into a SINGLE ansible-playbook run under one K8S_DEPLOY_TIMEOUT_S (900s), and the
# failure path is `git reset --hard local` over the whole merged range — so a batch that
# overruns discards the good bumps along with the bad one. At roughly 2.5 min of rollout and
# soak per service, 900s is spent around five or six.
#
# renovate.json states the intent ("keeps each auto-deploy tick to a single service, which is
# what the deploy timeout is sized for") but nothing enforced it: a tick diffs local..origin,
# spanning every commit since the last one, and the per-service k8s PRs share one daily window
# with platformAutomerge. The pilot list happens to bound this today at one service; this
# survives the pilot being cleared, which is when it would otherwise start to matter.
#
# 3 rather than 1: a cap of 1 would defer routine multi-bump mornings a tick at a time for no
# safety gain, since three services fit the timeout with room to spare.
gitops_deploy_k8s_autodeploy_max_per_tick: 3

# Roles that must never be auto-deployed, derived from each role's own declaration:
# roles/k8s/<name>/defaults/main.yml sets `k8s_autodeploy` plus a `k8s_autodeploy_reason`
# giving the mechanism. The reasons that used to be comments here now live beside the role
# they describe, where every property that justifies them is visible at once.
#
# The filter fails closed: a role that declares nothing, declares a non-boolean, or cannot
# be parsed raises rather than dropping out of this list. Absence from the denylist means
# auto-deployable, which is how seed-volume and image-builder went months as eligible.
#
# An empty denylist still disarms the feature in gitops_deploy.py rather than allowing
# everything — but the filter refuses to render an empty one, so that guard is now a
# backstop rather than a live path.
gitops_deploy_k8s_autodeploy_denylist: "{{ playbook_dir | k8s_autodeploy_denylist }}"

# Wall-clock cap for one `ansible-playbook` invocation on the k8s path, in seconds. Sized as
# (max rollout wait + stabilise soak) x 2 so a forward rollout AND its rollback redeploy both fit
# inside the unit's TimeoutStartSec=25min. RUN_BUDGET_S does NOT cover this path — it bounds only
# the Docker health gate (gate_services), which is inert on an all-k8s host.
gitops_deploy_k8s_timeout_s: 900
