# The deployer's timer is retired (H7.52): homelab-checkout-sync fast-forwards daniel-box's checkout,
# and the host packages' legacy lists remove the units this role installed or reaped.
# docs/target-architecture/host/h7-delete-ansible.md. The deployer's code under files/ stays until
# H7.53 re-homes and deletes it.

# DECIDED: this role is emptied, never deleted, until H7.20a. A play that names a missing role
# fails to parse, so deleting the role would mean editing initial_setup.yml, which is in the
# deployer's _BROAD_MANUAL_PREFIXES and parks every session's landing. An unconditional end_role
# keeps the playbook line.
- name: End the role, whose work the host packages own
  ansible.builtin.meta: end_role
