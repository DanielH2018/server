---
# Here rather than in install.yml's directory task, so a change to this layout narrows to this
# file's tag alone. The parent comes from install.yml, which runs first.
- name: Create the deployer_lib package directory
  tags: [gitops-deploy-code]
  ansible.builtin.file:
    path: /opt/gitops-deploy/deployer_lib
    state: directory
    owner: "{{ sys_user }}"
    group: "{{ sys_user }}"
    mode: "0750"
  become: true

# `deploy_git.py` imports the CI gate from `hosts/lib/ci_verdict.py` by bare name (H7.2e), so this
# lands before the loop below: a `deploy_git.py` that arrives first would fail at import on the
# next tick. The file is not in this role's files/, so the ship-list test asserts its copy and its
# stamp pair directly, as it does for host_lib.py.
- name: Install the CI gate module beside the deployer
  tags: [gitops-deploy-code]
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../hosts/lib/ci_verdict.py"
    dest: /opt/gitops-deploy/ci_verdict.py
    owner: "{{ sys_user }}"
    group: "{{ sys_user }}"
    mode: "0755"
  become: true
  notify: Run gitops-deploy once

- name: Install deployer Python files
  tags: [gitops-deploy-code]
  # The libraries come before the entry point, which imports them from deployer_lib/. One file
  # at a time rather than the directory, because a directory copy also ships the controller
  # checkout's __pycache__.
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/opt/gitops-deploy/{{ item }}"
    owner: "{{ sys_user }}"
    group: "{{ sys_user }}"
    mode: "0755"
  # ENFORCED by ansible/tests/deploy/test_gitops_deploy_ship_list.py: this loop and the
  # stamp_deployed_pairs below must both name every runtime module in files/ and deployer_lib/.
  loop:
    - deployer_lib/deploy_alert_text.py
    - deployer_lib/deploy_alerts.py
    - deployer_lib/deploy_broad_k8s.py
    - deployer_lib/deploy_changes.py
    - deployer_lib/deploy_config.py
    - deployer_lib/deploy_cross_role.py
    - deployer_lib/deploy_defer.py
    - deployer_lib/deploy_failtext.py
    - deployer_lib/deploy_git.py
    - deployer_lib/deploy_handlers.py
    - deployer_lib/deploy_health.py
    - deployer_lib/deploy_inventory.py
    - deployer_lib/deploy_io.py
    - deployer_lib/deploy_k8s.py
    - deployer_lib/deploy_k8s_owed.py
    - deployer_lib/deploy_locks.py
    - deployer_lib/deploy_logic.py
    - deployer_lib/deploy_narrow.py
    - deployer_lib/deploy_phases.py
    - deployer_lib/deploy_release.py
    - deployer_lib/deploy_render_bases.py
    - deployer_lib/deploy_remediation.py
    - deployer_lib/deploy_setup_roles.py
    - deployer_lib/deploy_state.py
    - deployer_lib/deploy_tick_types.py
    - deployer_lib/deploy_toolbox.py
    - gitops_markers.py
    - gitops_ledger.py
    - gitops_hold.py
    - gitops_tick_metrics.py
    - gitops_deploy.py
  become: true
  notify: Run gitops-deploy once

# Until #4355 the deploy_* libraries sat flat beside the entry point. A copy loop removes nothing
# it stops naming, so without this they stay on disk, unread and unwatched by the drift check.
# After the copy above, so the entry point that lands no longer imports them.
- name: Remove the deployer libraries that moved into deployer_lib
  tags: [gitops-deploy-code]
  ansible.builtin.file:
    path: "/opt/gitops-deploy/{{ item }}"
    state: absent
  loop:
    - deploy_alert_text.py
    - deploy_alerts.py
    - deploy_broad_k8s.py
    - deploy_changes.py
    - deploy_config.py
    - deploy_cross_role.py
    - deploy_defer.py
    - deploy_failtext.py
    - deploy_git.py
    - deploy_handlers.py
    - deploy_health.py
    - deploy_inventory.py
    - deploy_io.py
    - deploy_k8s.py
    - deploy_k8s_owed.py
    - deploy_locks.py
    - deploy_logic.py
    - deploy_narrow.py
    - deploy_phases.py
    - deploy_release.py
    - deploy_render_bases.py
    - deploy_remediation.py
    - deploy_setup_roles.py
    - deploy_state.py
    - deploy_tick_types.py
    - deploy_toolbox.py
  become: true

# A copy loop removes nothing it stops naming. These three mixins folded back into
# deploy_state.py (#3661); nothing imports them, so the copies left behind are dead files.
- name: Remove deployer modules folded into another
  tags: [gitops-deploy-code]
  ansible.builtin.file:
    path: "/opt/gitops-deploy/{{ item }}"
    state: absent
  loop:
    - deploy_state_k8s.py
    - deploy_state_hold.py
    - deploy_state_alerts.py
  become: true

- name: Install the shared host_lib helper beside the deployer
  tags: [gitops-deploy-code]
  ansible.builtin.import_tasks: "{{ role_path }}/../common/tasks/install_host_lib.yml"
  vars:
    host_lib_dir: /opt/gitops-deploy
    host_lib_owner: "{{ sys_user }}"
    host_lib_notify: [Run gitops-deploy once]

# manifest-prune-check.sh's deployed-code arm reads these pairs from the role's declaration,
# which is what lets the sibling roles declare theirs.
- name: Record the deployed gitops-deploy code
  tags: [gitops-deploy-code]
  ansible.builtin.import_tasks: "{{ role_path }}/../common/tasks/stamp_deployed.yml"
  vars:
    stamp_deployed_name: gitops-deploy
    stamp_deployed_pairs:
      - live: /opt/gitops-deploy/gitops_deploy.py
        src: ansible/roles/setup/gitops_deploy/files/gitops_deploy.py
      - live: /opt/gitops-deploy/deployer_lib/deploy_logic.py
        src: ansible/roles/setup/gitops_deploy/files/deployer_lib/deploy_logic.py
      - live: /opt/gitops-deploy/deployer_lib/deploy_io.py
        src: ansible/roles/setup/gitops_deploy/files/deployer_lib/deploy_io.py
      - live: /opt/gitops-deploy/deployer_lib/deploy_config.py
        src: ansible/roles/setup/gitops_deploy/files/deployer_lib/deploy_config.py
      - live: /opt/gitops-deploy/deployer_lib/deploy_state.py
        src: ansible/roles/setup/gitops_deploy/files/deployer_lib/deploy_state.py
      - live: /opt/gitops-deploy/gitops_markers.py
        src: ansible/roles/setup/gitops_deploy/files/gitops_markers.py
      - live: /opt/gitops-deploy/gitops_ledger.py
        src: ansible/roles/setup/gitops_deploy/files/gitops_ledger.py
      - live: /opt/gitops-deploy/gitops_hold.py
        src: ansible/roles/setup/gitops_deploy/files/gitops_hold.py
      - live: /opt/gitops-deploy/gitops_tick_metrics.py
        src: ansible/roles/setup/gitops_deploy/files/gitops_tick_metrics.py
      - live: /opt/gitops-deploy/deployer_lib/deploy_failtext.py
        src: ansible/roles/setup/gitops_deploy/files/deployer_lib/deploy_failtext.py
      - live: /opt/gitops-deploy/deployer_lib/deploy_alerts.py
        src: ansible/roles/setup/gitops_deploy/files/deployer_lib/deploy_alerts.py
      - live: /opt/gitops-deploy/deployer_lib/deploy_alert_text.py
        src: ansible/roles/setup/gitops_deploy/files/deployer_lib/deploy_alert_text.py
      - live: /opt/gitops-deploy/deployer_lib/deploy_changes.py
        src: ansible/roles/setup/gitops_deploy/files/deployer_lib/deploy_changes.py
      - live: /opt/gitops-deploy/deployer_lib/deploy_remediation.py
        src: ansible/roles/setup/gitops_deploy/files/deployer_lib/deploy_remediation.py
      - live: /opt/gitops-deploy/deployer_lib/deploy_git.py
        src: ansible/roles/setup/gitops_deploy/files/deployer_lib/deploy_git.py
      - live: /opt/gitops-deploy/deployer_lib/deploy_health.py
        src: ansible/roles/setup/gitops_deploy/files/deployer_lib/deploy_health.py
      - live: /opt/gitops-deploy/deployer_lib/deploy_inventory.py
        src: ansible/roles/setup/gitops_deploy/files/deployer_lib/deploy_inventory.py
      - live: /opt/gitops-deploy/deployer_lib/deploy_k8s.py
        src: ansible/roles/setup/gitops_deploy/files/deployer_lib/deploy_k8s.py
      - live: /opt/gitops-deploy/deployer_lib/deploy_locks.py
        src: ansible/roles/setup/gitops_deploy/files/deployer_lib/deploy_locks.py
      - live: /opt/gitops-deploy/deployer_lib/deploy_toolbox.py
        src: ansible/roles/setup/gitops_deploy/files/deployer_lib/deploy_toolbox.py
      - live: /opt/gitops-deploy/deployer_lib/deploy_tick_types.py
        src: ansible/roles/setup/gitops_deploy/files/deployer_lib/deploy_tick_types.py
      - live: /opt/gitops-deploy/deployer_lib/deploy_phases.py
        src: ansible/roles/setup/gitops_deploy/files/deployer_lib/deploy_phases.py
      - live: /opt/gitops-deploy/deployer_lib/deploy_handlers.py
        src: ansible/roles/setup/gitops_deploy/files/deployer_lib/deploy_handlers.py
      - live: /opt/gitops-deploy/deployer_lib/deploy_defer.py
        src: ansible/roles/setup/gitops_deploy/files/deployer_lib/deploy_defer.py
      - live: /opt/gitops-deploy/deployer_lib/deploy_k8s_owed.py
        src: ansible/roles/setup/gitops_deploy/files/deployer_lib/deploy_k8s_owed.py
      - live: /opt/gitops-deploy/deployer_lib/deploy_release.py
        src: ansible/roles/setup/gitops_deploy/files/deployer_lib/deploy_release.py
      - live: /opt/gitops-deploy/deployer_lib/deploy_render_bases.py
        src: ansible/roles/setup/gitops_deploy/files/deployer_lib/deploy_render_bases.py
      - live: /opt/gitops-deploy/deployer_lib/deploy_broad_k8s.py
        src: ansible/roles/setup/gitops_deploy/files/deployer_lib/deploy_broad_k8s.py
      - live: /opt/gitops-deploy/deployer_lib/deploy_narrow.py
