---
- name: Write deployer config (secrets, host-only)
  tags: [gitops-deploy-service]
  ansible.builtin.template:
    src: config.env.j2
    dest: /etc/gitops-deploy/config.env
    owner: "{{ sys_user }}"
    group: "{{ sys_user }}"
    mode: "0600"
  become: true
  no_log: true
  notify: Run gitops-deploy once

- name: Install systemd units
  tags: [gitops-deploy-service]
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    mode: "0644"
  loop:
    - gitops-deploy.service
    - gitops-deploy.timer
  become: true
  notify:
    - Reload systemd
    - Run gitops-deploy once

- name: Install the gitops-deploy failure alert
  tags: [gitops-deploy-service]
  ansible.builtin.import_tasks: "{{ role_path }}/../common/tasks/alert_unit.yml"
  vars:
    alert_unit_name: gitops-deploy
    alert_unit_description: Alert when gitops-deploy fails
    alert_unit_message: "🚨 gitops-deploy unit failed on {{ inventory_hostname }} — check `journalctl -u gitops-deploy`."
    alert_unit_env_dir: /etc/gitops-deploy
    alert_unit_notify: [Run gitops-deploy once]

- name: Allow the deploy user to trigger a tick without root (polkit)
  tags: [gitops-deploy-service]
  ansible.builtin.template:
    src: 50-gitops-deploy.rules.j2
    dest: /etc/polkit-1/rules.d/50-gitops-deploy.rules
    owner: root
    group: root
    mode: "0644"
  become: true
  # No handler: polkitd watches rules.d and reloads a changed rule on its own, so
  # there is nothing to restart. The rule's own header explains the narrow scope
  # (this unit, `start` only) and why it must not test subject.active.

- name: Enable and start the timer
  tags: [gitops-deploy-service]
  ansible.builtin.systemd:
    name: gitops-deploy.timer
    enabled: true
    state: started
    daemon_reload: true
  become: true

# Render provenance for manifest-prune-check.sh's stale-script arm. Last in this file, after
# every template it stamps, so a failed run leaves the previous checksums rather than claiming
# these.
- name: Stamp the rendered gitops-deploy units
  tags: [gitops-deploy-service]
  ansible.builtin.import_tasks: "{{ role_path }}/../common/tasks/stamp_render.yml"
  vars:
    stamp_render_name: gitops-deploy
    stamp_render_templates:
      - ansible/roles/setup/gitops_deploy/templates/gitops-deploy.service.j2
      - ansible/roles/setup/common/templates/unit-failure-alert.service.j2
      - ansible/roles/setup/common/templates/alert-webhook.env.j2
      - ansible/roles/setup/gitops_deploy/templates/gitops-deploy.timer.j2
      - ansible/roles/setup/gitops_deploy/templates/50-gitops-deploy.rules.j2
      # The two .env.j2 sources are stamped too. Stamping does not leak a secret:
      # stamp_render.yml hashes the REPO SOURCE (:56), and the arm re-hashes that same source
      # (manifest-prune-check.sh.j2:284), so neither side reads the rendered file with the
      # secret in it. Omitting them would let a change to the deployer's budget or CI lines
      # render stale unnoticed.
      - ansible/roles/setup/gitops_deploy/templates/config.env.j2
