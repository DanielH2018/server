---
# The false half. Only the units: /opt/gitops-deploy and /etc/gitops-deploy stay, because a
# host flipped back to has_gitops: true re-renders them anyway and the config.env there holds
# nothing the install half does not rewrite.
#
# Everything else install.yml writes outside those two directories is reaped here: all six
# systemd units, the polkit rule that lets a non-root caller trigger a tick, and the two
# GitHub crons plus the scripts they run. Every task is state: absent, so a host that never
# had has_gitops: true no-ops through the whole file.

- name: Check whether the GitOps deploy timers were ever installed here
  ansible.builtin.stat:
    path: "/etc/systemd/system/{{ item }}"
  loop:
    - gitops-deploy.timer
    - staging-backfill.timer
  loop_control:
    label: "{{ item }}"
  register: gitops_deploy_timer_stats

- name: Stop and disable the GitOps deploy timers
  ansible.builtin.systemd:
    name: "{{ item.item }}"
    enabled: false
    state: stopped
  loop: "{{ gitops_deploy_timer_stats.results }}"
  loop_control:
    label: "{{ item.item }}"
  become: true
  when: item.stat.exists

- name: Remove the deployer unit files
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ item }}"
    state: absent
  become: true
  loop:
    - gitops-deploy.service
    - gitops-deploy.timer
    - gitops-deploy-alert.service
    - staging-backfill.service
    - staging-backfill.timer
    - staging-backfill-alert.service
  notify: Reload systemd

- name: Remove the manual-trigger polkit rule
  ansible.builtin.file:
    path: /etc/polkit-1/rules.d/50-gitops-deploy.rules
    state: absent
  become: true

- name: Remove the GitHub ruleset drift cron
  ansible.builtin.cron:
    name: "GitHub ruleset drift"
    user: root
    state: absent
    cron_file: github-ruleset-drift
  become: true

- name: Remove the GitHub interaction-limit cron
  ansible.builtin.cron:
    name: "GitHub interaction limit"
    user: root
    state: absent
    cron_file: github-interaction-limit
  become: true

- name: Remove the GitHub drift-check scripts
  ansible.builtin.file:
    path: "/usr/local/bin/{{ item }}"
    state: absent
  loop:
    - github-ruleset-drift.sh
    - github-interaction-limit.sh
  become: true
