---
# The false half. Every task is state: absent, so a host that never had has_gitops: true
# no-ops through the whole file.
#
# It reaps everything install.yml writes: all six systemd units, the polkit rule that lets a
# non-root caller trigger a tick, the two GitHub crons plus the scripts they run, and the three
# directories at the end. A host flipped back to has_gitops: true gets all three from
# install.yml.

- name: Check whether the GitOps deploy timers were ever installed here
  tags: [gitops-deploy-teardown]
  ansible.builtin.stat:
    path: "/etc/systemd/system/{{ item }}"
  loop:
    - gitops-deploy.timer
    - staging-backfill.timer
  loop_control:
    label: "{{ item }}"
  register: gitops_deploy_timer_stats

- name: Stop and disable the GitOps deploy timers
  tags: [gitops-deploy-teardown]
  ansible.builtin.systemd:
    name: "{{ item.item }}"
    enabled: false
    state: stopped
  loop: "{{ gitops_deploy_timer_stats.results }}"
  loop_control:
    label: "{{ item.item }}"
  become: true
  when: item.stat.exists

- name: Remove the deployer unit files
  tags: [gitops-deploy-teardown]
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ item }}"
    state: absent
  become: true
  loop:
    - gitops-deploy.service
    - gitops-deploy.timer
    - gitops-deploy-alert.service
    - staging-backfill.service
    - staging-backfill.timer
    - staging-backfill-alert.service
  notify: Reload systemd for gitops_deploy

- name: Remove the manual-trigger polkit rule
  tags: [gitops-deploy-teardown]
  ansible.builtin.file:
    path: /etc/polkit-1/rules.d/50-gitops-deploy.rules
    state: absent
  become: true

# The two GitHub checks are kuma-check timers (install.yml); the shared task file's absent arm
# stops the timer, removes its units and removes the cron the timer replaced, so a host that
# still has the cron is reaped the same way.
- name: Remove the GitHub ruleset drift timer
  tags: [gitops-deploy-teardown]
  ansible.builtin.import_tasks: "{{ role_path }}/../common/tasks/check_timer.yml"
  vars:
    check_timer_state: absent
    check_timer_name: github-ruleset-drift
    check_timer_description: GitHub ruleset drift check (textfile verdict)
    check_timer_exec: /usr/local/bin/github-ruleset-drift.sh
    check_timer_user: root
    check_timer_on_calendar: "*-*-* 06:40:00"
    check_timer_restart_sec: 30min
    check_timer_cron_name: "GitHub ruleset drift"
    check_timer_cron_file: github-ruleset-drift

- name: Remove the GitHub interaction-limit timer
  tags: [gitops-deploy-teardown]
  ansible.builtin.import_tasks: "{{ role_path }}/../common/tasks/check_timer.yml"
  vars:
    check_timer_state: absent
    check_timer_name: github-interaction-limit
    check_timer_description: GitHub interaction-limit re-arm (textfile verdict)
    check_timer_exec: /usr/local/bin/github-interaction-limit.sh
    check_timer_user: root
    check_timer_on_calendar: "*-*-* 06:50:00"
    check_timer_restart_sec: 30min
    check_timer_cron_name: "GitHub interaction limit"
    check_timer_cron_file: github-interaction-limit

# A file left behind keeps exporting its last run: the tick's counts (#5676), and each GitHub
# check's deadline, which HostCheckOverdue pages on 25 hours later and never clears (#7354).
- name: Remove the GitOps tick and GitHub check textfiles
  tags: [gitops-deploy-teardown]
  ansible.builtin.file:
    path: "/var/lib/node-exporter-textfile/{{ item }}"
    state: absent
  loop:
    - gitops_tick.prom
    - github-ruleset-drift.prom
    - github-interaction-limit.prom
  become: true

- name: Remove the GitHub drift-check scripts
  tags: [gitops-deploy-teardown]
  ansible.builtin.file:
    path: "/usr/local/bin/{{ item }}"
    state: absent
  loop:
    - github-ruleset-drift.sh
    - github-interaction-limit.sh
  become: true

# The three directories install.yml creates. ENFORCED by
# ansible/tests/setup/test_gitops_deploy_reaps_on_non_deployer.py: this list must cover
# install.yml's create loop.
#
# DECIDED: /var/lib/gitops-deploy is reaped, not kept. It is the deployer's memory of THIS
# host's checkout — hold_sha, behind_since, the per-SHA alert throttles, the undelivered alert
# queue — and a host that is not the deployer has nothing that reads it: monitor-bridge
# hostPath-mounts daniel-box's copy alone (bridge/config_service.py, GITOPS_STATE_DIR). Kept, it
# would hand a re-enabled deployer a hold and a behind-origin clock from before it was retired;
# reaped, the first tick writes a fresh, honest state. The forensic value it had for #1733 was
# read and recorded on that issue before this task existed.
- name: Remove the deployer's payload, config and state directories
  tags: [gitops-deploy-teardown]
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /opt/gitops-deploy
    - /var/lib/gitops-deploy
    - /etc/gitops-deploy
  become: true
