---
# The deployer's install half, one task file per subject, each under its own tag, so the GitOps
# deployer can apply a change to one subject rather than the whole role (#3154). `narrow_setup`
# reads a task file's OWN tags, so every task in the four files carries its file's tag, and
# each import below repeats it so an edit to this file narrows too. The directories serve the
# code and the service halves both.

- name: Create gitops-deploy directories
  tags: [gitops-deploy-code, gitops-deploy-service]
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ sys_user }}"
    group: "{{ sys_user }}"
    mode: "0750"
  loop:
    - /opt/gitops-deploy      # deployer scripts
    - /var/lib/gitops-deploy  # state (hold_sha, last_run, per-SHA alert markers, pending_alerts.json)
    - /etc/gitops-deploy      # config.env (0600 secrets) — template won't mkdir its parent
  become: true

# State files whose marker was retired from `MARKERS`. Nothing removes a file the code stops
# naming, and `teardown.yml` removes the state directory only on a host that is NOT the
# deployer, so the deployer converges here (#3079 was the first). `broad_applied` lost its
# writer and every reader when `land.sh` moved onto `receipts.jsonl` (#3391, #3461); a
# `land.sh` from a worktree cut before that still reads it, and only its absence stops that
# read going stale. `manual_plane` and its `manual_plane_tags` sidecar lost their writer when the
# class moved into the `owed` ledger (#3392) and their readers in #3487. `k8s_deferred` lost
# its writer the same way in #3533, and its readers in #3535. `hold_plane` lost its writer in
# #3540, and its readers in the PR that added it here. A marker retired later joins this list
# in the PR that drops its `MARKERS` entry, never before: `tests/test_deployer_state.py` fails
# on a live basename here.
- name: Remove the state files of retired deployer markers
  tags: [gitops-deploy-code]
  ansible.builtin.file:
    path: "/var/lib/gitops-deploy/{{ item }}"
    state: absent
  loop:
    - broad_applied
    - manual_plane
    - manual_plane_tags
    - k8s_deferred
    - hold_plane
  become: true

- name: Install the deployer code
  tags: [gitops-deploy-code]
  ansible.builtin.import_tasks: code.yml

- name: Install the deployer config, units and timer
  tags: [gitops-deploy-service]
  ansible.builtin.import_tasks: service.yml

# `cron` is the repo-wide tag for scheduled checks, kept beside the subject tag.
- name: Install the GitHub ruleset and interaction-limit checks
  tags: [cron, gitops-deploy-github-checks]
  ansible.builtin.import_tasks: github_checks.yml
