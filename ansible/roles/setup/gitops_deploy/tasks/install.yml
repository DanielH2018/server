---
- name: Create gitops-deploy directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ sys_user }}"
    group: "{{ sys_user }}"
    mode: "0750"
  loop:
    - /opt/gitops-deploy      # deployer scripts
    - /var/lib/gitops-deploy  # state (hold_sha, last_run, per-SHA alert markers, pending_alerts.json)
    - /etc/gitops-deploy      # config.env (0600 secrets) — template won't mkdir its parent
  become: true

- name: Install deployer Python files
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/opt/gitops-deploy/{{ item }}"
    owner: "{{ sys_user }}"
    group: "{{ sys_user }}"
    mode: "0755"
  # ENFORCED by ansible/tests/deploy/test_gitops_deploy_ship_list.py: this loop and the
  # stamp_deployed_pairs below must both name every runtime module in files/.
  loop:
    - gitops_deploy.py
    - deploy_logic.py
    - deploy_io.py
    - deploy_config.py
    - deploy_state.py
    - deploy_state_k8s.py
    - deploy_state_alerts.py
    - gitops_markers.py
    - deploy_failtext.py
    - deploy_alerts.py
    - deploy_alert_text.py
    - deploy_changes.py
    - deploy_defer.py
    - deploy_release.py
    - deploy_remediation.py
    - deploy_git.py
    - deploy_health.py
    - deploy_inventory.py
    - deploy_k8s.py
    - deploy_locks.py
    - deploy_broad_k8s.py
    - deploy_toolbox.py
    - deploy_tick_types.py
    - deploy_phases.py
    - deploy_handlers.py
    - deploy_narrow.py
  become: true
  notify: Run gitops-deploy once

- name: Install the shared host_lib helper beside the deployer
  ansible.builtin.import_tasks: "{{ role_path }}/../common/tasks/install_host_lib.yml"
  vars:
    host_lib_dir: /opt/gitops-deploy
    host_lib_owner: "{{ sys_user }}"
    host_lib_notify: [Run gitops-deploy once]

- name: Write deployer config (secrets, host-only)
  ansible.builtin.template:
    src: config.env.j2
    dest: /etc/gitops-deploy/config.env
    owner: "{{ sys_user }}"
    group: "{{ sys_user }}"
    mode: "0600"
  become: true
  no_log: true
  notify: Run gitops-deploy once

- name: Install systemd units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    mode: "0644"
  loop:
    - gitops-deploy.service
    - gitops-deploy.timer
  become: true
  notify:
    - Reload systemd
    - Run gitops-deploy once

- name: Write the alert webhook where only systemd reads it
  ansible.builtin.template:
    src: alert-webhook.env.j2
    dest: /etc/gitops-deploy/alert-webhook.env
    owner: root
    group: root
    mode: "0600"
  become: true
  no_log: true
  notify:
    - Reload systemd
    - Run gitops-deploy once

# The unit reads the webhook through EnvironmentFile and contains no secret, so 0644 is the
# honest mode. A 0600 unit would not protect an embedded value: systemd serves unit content over
# the system bus regardless of file mode, so `systemctl show gitops-deploy-alert -p ExecStart`
# prints the full webhook URL to an unprivileged user. With EnvironmentFile the same command
# prints the literal `${ALERT_WEBHOOK}`.
- name: Install the alert unit
  ansible.builtin.template:
    src: gitops-deploy-alert.service.j2
    dest: /etc/systemd/system/gitops-deploy-alert.service
    mode: "0644"
  become: true
  notify:
    - Reload systemd
    - Run gitops-deploy once

- name: Allow the deploy user to trigger a tick without root (polkit)
  ansible.builtin.template:
    src: 50-gitops-deploy.rules.j2
    dest: /etc/polkit-1/rules.d/50-gitops-deploy.rules
    owner: root
    group: root
    mode: "0644"
  become: true
  # No handler: polkitd watches rules.d and reloads a changed rule on its own, so
  # there is nothing to restart. The rule's own header explains the narrow scope
  # (this unit, `start` only) and why it must not test subject.active.

- name: Enable and start the timer
  ansible.builtin.systemd:
    name: gitops-deploy.timer
    enabled: true
    state: started
    daemon_reload: true
  become: true

# DECIDED: retire the staging-backfill ratchet rather than keep it as the gate's exerciser.
# The operator chose this on 2026-09-24 (#2414), after reading the case for keeping it (closed
# PR #2457). The cost is real. The hourly ratchet was the only thing that drove the staging gate
# regularly, and a real gated tick reaches `consult_staging` about once a month. A gate that
# rots answers NO_VERDICT, and `staging_blocks` blocks only on REJECTED, so a rotted gate lets
# prod through without blocking anything. What remains to notice that is `consult_staging`'s
# own Discord alert on every non-PASS of a real tick. The ratchet did not alarm on a NO_VERDICT
# either (#2455), so the exercise it provided had no alarm attached. The long form is
# docs/archive/staging-phase-c.md, *After the flip: the ratchet is retired*.
#
# These tasks converge daniel-box, the only host that ran it. `teardown.yml` reaps the same
# units on a host that is not the deployer. They stop the timer before the service so an
# in-flight run cannot be re-triggered, and stop the service before removing state because its
# ExecStopPost= rewrote the heartbeat on every exit. staging-backfill.jsonl, the Part 1 ledger,
# is deliberately KEPT: see the docs section above.
- name: Check whether the retired staging-backfill units are still installed
  ansible.builtin.stat:
    path: "/etc/systemd/system/{{ item }}"
  loop:
    - staging-backfill.timer
    - staging-backfill.service
  loop_control:
    label: "{{ item }}"
  register: gitops_deploy_backfill_units

- name: Stop and disable the retired staging-backfill timer
  ansible.builtin.systemd:
    name: staging-backfill.timer
    enabled: false
    state: stopped
  become: true
  when: gitops_deploy_backfill_units.results[0].stat.exists

# Stopped, not disabled: the service is timer-activated and has no [Install] section to undo.
- name: Stop the retired staging-backfill service
  ansible.builtin.systemd:
    name: staging-backfill.service
    state: stopped
  become: true
  when: gitops_deploy_backfill_units.results[1].stat.exists

- name: Remove the retired staging-backfill units and their liveness state
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/staging-backfill.service
    - /etc/systemd/system/staging-backfill.timer
    - /etc/systemd/system/staging-backfill-alert.service
    - /var/lib/gitops-deploy/staging-backfill-armed
    - /var/lib/gitops-deploy/staging-backfill-last-run
  become: true
  notify: Reload systemd

# Removing a unit file does not clear a `failed` state systemd already recorded for it. Left
# alone, the units sit in `systemctl --failed` as not-found until a reboot. The same pair of
# tasks as the fwupd purge in optimize_pi.
- name: Check the retired staging-backfill units for a stale failed state # noqa command-instead-of-module
  ansible.builtin.command: systemctl is-failed {{ item }}
  loop:
    - staging-backfill.service
    - staging-backfill-alert.service
  register: gitops_deploy_backfill_failed
  changed_when: false
  failed_when: false
  check_mode: false # read-only query; must run under --check or the when: below breaks
  become: true

- name: Clear the stale failed state the retired staging-backfill units left behind
  ansible.builtin.command: systemctl reset-failed {{ item.item }}
  loop: "{{ gitops_deploy_backfill_failed.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.stdout == 'failed'
  changed_when: true
  become: true

# The staging gate's own per-SHA alert marker. No reader names it, because it was never an
# `ALERT_SLOTS` member. `teardown.yml` removes the whole state directory, but
# only on a host that is NOT the deployer — so the deployer converges here, the way
# `hypervisor/tasks/reap_staging.yml` reaps the guest from its install path.
#
# The two staging ledgers in the same directory are deliberately KEPT: `staging-backfill.jsonl`
# for the reason in the DECIDED: marker above, and `staging-ticks.jsonl` for the same one — both
# are the raw evidence behind a measurement an operator still reads with `jq`, and neither has a
# writer left. This marker is a dedupe throttle with nothing to measure.
- name: Remove the retired staging gate's alert marker
  ansible.builtin.file:
    path: /var/lib/gitops-deploy/staging_alerted_sha
    state: absent
  become: true

# Render provenance for manifest-prune-check.sh's stale-script arm. Last in the role so a failed run leaves the previous checksums rather than claiming these.
- name: Stamp the rendered gitops-deploy units
  ansible.builtin.import_tasks: "{{ role_path }}/../common/tasks/stamp_render.yml"
  vars:
    stamp_render_name: gitops-deploy
    stamp_render_templates:
      - ansible/roles/setup/gitops_deploy/templates/gitops-deploy.service.j2
      - ansible/roles/setup/gitops_deploy/templates/gitops-deploy-alert.service.j2
      - ansible/roles/setup/gitops_deploy/templates/gitops-deploy.timer.j2
      - ansible/roles/setup/gitops_deploy/templates/50-gitops-deploy.rules.j2
      # The two .env.j2 sources are stamped too. Stamping does not leak a secret:
      # stamp_render.yml hashes the REPO SOURCE (:56), and the arm re-hashes that same source
      # (manifest-prune-check.sh.j2:284), so neither side reads the rendered file with the
      # secret in it. Omitting them would let a change to the deployer's budget or CI lines
      # render stale unnoticed.
      - ansible/roles/setup/gitops_deploy/templates/config.env.j2
      - ansible/roles/setup/gitops_deploy/templates/alert-webhook.env.j2

# manifest-prune-check.sh's deployed-code arm reads these pairs from the role's declaration,
# which is what lets the sibling roles declare theirs.
- name: Record the deployed gitops-deploy code
  ansible.builtin.import_tasks: "{{ role_path }}/../common/tasks/stamp_deployed.yml"
  vars:
    stamp_deployed_name: gitops-deploy
    stamp_deployed_pairs:
      - live: /opt/gitops-deploy/gitops_deploy.py
        src: ansible/roles/setup/gitops_deploy/files/gitops_deploy.py
      - live: /opt/gitops-deploy/deploy_logic.py
        src: ansible/roles/setup/gitops_deploy/files/deploy_logic.py
      - live: /opt/gitops-deploy/deploy_io.py
        src: ansible/roles/setup/gitops_deploy/files/deploy_io.py
      - live: /opt/gitops-deploy/deploy_config.py
        src: ansible/roles/setup/gitops_deploy/files/deploy_config.py
      - live: /opt/gitops-deploy/deploy_state.py
        src: ansible/roles/setup/gitops_deploy/files/deploy_state.py
      - live: /opt/gitops-deploy/deploy_state_k8s.py
        src: ansible/roles/setup/gitops_deploy/files/deploy_state_k8s.py
      - live: /opt/gitops-deploy/deploy_state_alerts.py
        src: ansible/roles/setup/gitops_deploy/files/deploy_state_alerts.py
      - live: /opt/gitops-deploy/gitops_markers.py
        src: ansible/roles/setup/gitops_deploy/files/gitops_markers.py
      - live: /opt/gitops-deploy/deploy_failtext.py
        src: ansible/roles/setup/gitops_deploy/files/deploy_failtext.py
      - live: /opt/gitops-deploy/deploy_alerts.py
        src: ansible/roles/setup/gitops_deploy/files/deploy_alerts.py
      - live: /opt/gitops-deploy/deploy_alert_text.py
        src: ansible/roles/setup/gitops_deploy/files/deploy_alert_text.py
      - live: /opt/gitops-deploy/deploy_changes.py
        src: ansible/roles/setup/gitops_deploy/files/deploy_changes.py
      - live: /opt/gitops-deploy/deploy_remediation.py
        src: ansible/roles/setup/gitops_deploy/files/deploy_remediation.py
      - live: /opt/gitops-deploy/deploy_git.py
        src: ansible/roles/setup/gitops_deploy/files/deploy_git.py
      - live: /opt/gitops-deploy/deploy_health.py
        src: ansible/roles/setup/gitops_deploy/files/deploy_health.py
      - live: /opt/gitops-deploy/deploy_inventory.py
        src: ansible/roles/setup/gitops_deploy/files/deploy_inventory.py
      - live: /opt/gitops-deploy/deploy_k8s.py
        src: ansible/roles/setup/gitops_deploy/files/deploy_k8s.py
      - live: /opt/gitops-deploy/deploy_locks.py
        src: ansible/roles/setup/gitops_deploy/files/deploy_locks.py
      - live: /opt/gitops-deploy/deploy_toolbox.py
        src: ansible/roles/setup/gitops_deploy/files/deploy_toolbox.py
      - live: /opt/gitops-deploy/deploy_tick_types.py
        src: ansible/roles/setup/gitops_deploy/files/deploy_tick_types.py
      - live: /opt/gitops-deploy/deploy_phases.py
        src: ansible/roles/setup/gitops_deploy/files/deploy_phases.py
      - live: /opt/gitops-deploy/deploy_handlers.py
        src: ansible/roles/setup/gitops_deploy/files/deploy_handlers.py
      - live: /opt/gitops-deploy/deploy_defer.py
        src: ansible/roles/setup/gitops_deploy/files/deploy_defer.py
      - live: /opt/gitops-deploy/deploy_release.py
        src: ansible/roles/setup/gitops_deploy/files/deploy_release.py
      - live: /opt/gitops-deploy/deploy_broad_k8s.py
        src: ansible/roles/setup/gitops_deploy/files/deploy_broad_k8s.py
      - live: /opt/gitops-deploy/deploy_narrow.py
        src: ansible/roles/setup/gitops_deploy/files/deploy_narrow.py
      - live: /opt/gitops-deploy/host_lib.py
        src: ansible/roles/setup/common/files/host_lib.py

- name: Remove the retired staging gate's ssh identity
  # The private half of the retired staging gate's key must not stay on this host.
  # teardown.yml removes /etc/gitops-deploy wholesale, but that file only runs on a host whose
  # has_gitops went false — never on the deployer, which is the one host that held this key.
  ansible.builtin.file:
    path: "{{ gitops_deploy_retired_staging_gate_key_path }}"
    state: absent
  become: true

- name: Deploy the GitHub ruleset drift check
  tags: [cron]
  # The ruleset is the merge gate this deployer's CI verdict rests on, and an edit in the
  # GitHub UI changes it with no commit and no signal. The check pushes its own Kuma monitor
  # directly, in the cloudflare-ip-drift shape, with no monitor-bridge hop.
  ansible.builtin.template:
    src: github-ruleset-drift.sh.j2
    dest: /usr/local/bin/github-ruleset-drift.sh
    mode: "0750"
    owner: root
    group: root
  no_log: true  # renders ruleset_drift_push_token
  become: true

- name: Schedule the GitHub ruleset drift check
  tags: [cron]
  # Daily. Rulesets change on a human cadence, so the cadence is about the monitor's heartbeat,
  # not about catching drift fast — and GitHub's unauthenticated limit is 60 req/hr per source
  # IP, shared with renovate_notify on this same host.
  #
  # A systemd timer (roles/setup/common/tasks/kuma_check_timer.yml): a red
  # verdict reruns every 30 min until it clears — two calls an hour at worst, inside the
  # unauthenticated limit even on the anonymous fallback.
  ansible.builtin.import_tasks: "{{ role_path }}/../common/tasks/kuma_check_timer.yml"
  vars:
    kuma_check_state: present
    kuma_check_name: github-ruleset-drift
    kuma_check_description: GitHub ruleset drift check (Kuma push)
    kuma_check_exec: /usr/local/bin/github-ruleset-drift.sh
    kuma_check_user: root
    kuma_check_on_calendar: "*-*-* {{ '%02d' | format(gitops_deploy_ruleset_drift_cron_hour | int) }}:{{ '%02d' | format(gitops_deploy_ruleset_drift_cron_minute | int) }}:00"
    kuma_check_restart_sec: 30min
    kuma_check_cron_name: "GitHub ruleset drift"
    kuma_check_cron_file: github-ruleset-drift

- name: Deploy the GitHub interaction-limit re-arm
  tags: [cron]
  # The repo stays public but closed to non-collaborators through GitHub's interaction limit,
  # which the API only grants for six months at a time and lets lapse with no signal. This
  # re-applies the declared limit daily and beats its own Kuma monitor, in the ruleset-drift
  # shape directly above. Unlike that check it reconciles — the script's DECIDED marker says why.
  ansible.builtin.template:
    src: github-interaction-limit.sh.j2
    dest: /usr/local/bin/github-interaction-limit.sh
    mode: "0750"
    owner: root
    group: root
  no_log: true  # renders interaction_limit_push_token
  become: true

- name: Schedule the GitHub interaction-limit re-arm
  tags: [cron]
  # Daily, ten minutes after the ruleset check. The setting only moves when it expires, so the
  # cadence is about how long a lapse can go unnoticed (one day) rather than about load.
  #
  # A systemd timer (roles/setup/common/tasks/kuma_check_timer.yml): a red
  # verdict reruns every 30 min until it clears. The re-arm PUT is idempotent, so a rerun is
  # the same reconcile again.
  ansible.builtin.import_tasks: "{{ role_path }}/../common/tasks/kuma_check_timer.yml"
  vars:
    kuma_check_state: present
    kuma_check_name: github-interaction-limit
    kuma_check_description: GitHub interaction-limit re-arm (Kuma push)
    kuma_check_exec: /usr/local/bin/github-interaction-limit.sh
    kuma_check_user: root
    kuma_check_on_calendar: "*-*-* {{ '%02d' | format(gitops_deploy_interaction_limit_cron_hour | int) }}:{{ '%02d' | format(gitops_deploy_interaction_limit_cron_minute | int) }}:00"
    kuma_check_restart_sec: 30min
    kuma_check_cron_name: "GitHub interaction limit"
    kuma_check_cron_file: github-interaction-limit
