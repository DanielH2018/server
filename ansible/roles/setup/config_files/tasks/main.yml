---
# The play (initial_setup.yml) runs become:true, so `$HOME` would ship these dotfiles to /root.
# The deploy user's home is hardcoded as /home/{{ sys_user }} (as in sops_setup's .bashrc
# path).
# chezmoi owns .bashrc and .gitconfig on the hosts that have its source directory (daniel-box
# and daniel-server; `chezmoi source-path` resolves both there), and neither file here is
# chezmoi's version. Copying over them would replace the dotfiles' .bashrc and the templated
# .gitconfig that carries commit signing. Only daniel-pi, which has no chezmoi, takes
# these files. The stat carries both sub-tags so a `--tags bash` or `--tags git` run sets it.
- name: Check whether chezmoi manages this host's dotfiles
  ansible.builtin.stat:
    path: "/home/{{ sys_user }}/.local/share/chezmoi"
  register: config_files_chezmoi_source
  tags: [git, bash]

- name: Copy .gitconfig to home directory
  ansible.builtin.copy:
    src: .gitconfig
    dest: "/home/{{ sys_user }}/.gitconfig"
    owner: "{{ sys_user }}"
    group: "{{ sys_user }}"
    mode: "0644"
    backup: true
  when: not config_files_chezmoi_source.stat.exists
  tags: git

- name: Copy .bashrc to home directory
  ansible.builtin.copy:
    src: .bashrc
    dest: "/home/{{ sys_user }}/.bashrc"
    owner: "{{ sys_user }}"
    group: "{{ sys_user }}"
    mode: "0644"
    backup: true
  when: not config_files_chezmoi_source.stat.exists
  tags: bash

- name: Display completion message
  ansible.builtin.debug:
    msg: "Configuration files have been deployed successfully"
