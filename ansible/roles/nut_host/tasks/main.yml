---
# Host-side half of the UPS stack; the k8s/nut pod (upsd + driver + primary upsmon) is
# the other half. Moved from the retired containers/peanut role when nut went in-cluster
# (D6 reversed, 2026-08-14). Nothing here changed at that cutover: the pod re-creates
# the same 127.0.0.1:3493 loopback publish (as a hostPort) the Docker container held.
#
# Runs from initial_setup.yml, gated to ups_host (group_vars/all.yml).

# ── USB half: only the host the UPS is physically attached to ───────────────────
- name: Install udev rule for APC UPS USB permissions
  ansible.builtin.copy:
    dest: /etc/udev/rules.d/99-nut-apc.rules
    content: 'SUBSYSTEM=="usb", ATTR{idVendor}=="051d", ATTR{idProduct}=="0002", MODE="0666"'
    mode: "0644"
  become: true
  when: inventory_hostname == ups_host

- name: Reload udev rules
  ansible.builtin.command: udevadm control --reload-rules
  become: true
  changed_when: false
  when: inventory_hostname == ups_host

- name: Trigger udev for USB subsystem
  ansible.builtin.command: udevadm trigger --subsystem-match=usb
  become: true
  changed_when: false
  when: inventory_hostname == ups_host

# ── Endpoint resolution, for a host the UPS is not attached to ──────────────────
# The Service does not pin its clusterIP, so this is a snapshot taken at deploy time. The assert
# below is what stops a stale snapshot from becoming a shutdown chain that is silently dead: a
# wrong endpoint and a working one look identical while mains power is up, and the difference
# only shows during the cut this exists for.
- name: Resolve the nut ClusterIP for a cross-node secondary
  when:
    - inventory_hostname != ups_host
    - not k8s_no_mutate
  ansible.builtin.command:
    cmd: k3s kubectl -n {{ k8s_namespace }} get service nut -o jsonpath={.spec.clusterIP}
  become: true
  changed_when: false
  register: nut_host_clusterip_lookup

- name: Set the resolved upsd endpoint
  when: inventory_hostname != ups_host
  ansible.builtin.set_fact:
    nut_host_upsd_clusterip: "{{ nut_host_clusterip_lookup.stdout | default('') | trim }}"

- name: Fail if upsd is not reachable at the resolved endpoint
  when:
    - inventory_hostname != ups_host
    - not k8s_no_mutate
  ansible.builtin.wait_for:
    host: "{{ nut_host_upsd_host }}"
    port: 3493
    timeout: 10
    msg: >-
      nut_host: upsd is unreachable at {{ nut_host_upsd_host }}:3493 from {{ inventory_hostname }},
      so a secondary upsmon here would install a shutdown chain that never fires. An empty host
      means the nut Service was not found; a timeout means the ClusterIP is not routable from this
      node's host netns, or the nut NetworkPolicy no longer admits this node's flannel.1 address.

# ── Graceful shutdown (the part the pod CANNOT do) ──────────────────────────────
# The pod's upsmon (primary) raises FSD but can't power off the host. This host-native
# upsmon in `secondary` mode watches the same upsd over the pod's 127.0.0.1:3493
# hostPort and runs the real poweroff.
- name: Install NUT client (host-side upsmon)
  ansible.builtin.apt:
    name: nut-client
    state: present
  become: true

- name: Configure host NUT mode (netclient)
  ansible.builtin.template:
    src: host-nut.conf.j2
    dest: /etc/nut/nut.conf
    owner: root
    group: nut
    mode: "0640"
  become: true
  register: nut_host_nutconf

- name: Configure host upsmon (secondary, performs the actual poweroff)
  ansible.builtin.template:
    src: host-upsmon.conf.j2
    dest: /etc/nut/upsmon.conf
    owner: root
    group: nut
    mode: "0640"
  no_log: true
  become: true
  register: nut_host_upsmon

- name: Enable and start the host upsmon service
  ansible.builtin.systemd_service:
    name: nut-monitor
    enabled: true
    state: "{{ 'restarted' if (nut_host_nutconf is changed or nut_host_upsmon is changed) else 'started' }}"
  become: true

# ── Runtime watchdog for the link the assert above only proves once ─────────────
# See defaults/main.yml for why the neighbouring UPS checks do not cover this path.
- name: Deploy the UPS secondary watchdog's Kuma credentials
  when: nut_host_watchdog_armed | bool
  ansible.builtin.template:
    src: kuma-push.env.j2
    dest: /etc/nut/kuma-push.env
    owner: root
    group: "{{ sys_user }}"
    mode: "0640"
  no_log: true
  become: true

- name: Deploy the UPS secondary watchdog
  when: nut_host_watchdog_armed | bool
  ansible.builtin.template:
    src: ups-secondary-health.sh.j2
    dest: /usr/local/bin/ups-secondary-health.sh
    owner: root
    group: root
    mode: "0755"
  become: true

# Root-run because the script reads /etc/nut/upsmon.conf (0640 root:nut) to take the endpoint
# from the file upsmon actually uses. Same shape as manifest-prune-check.sh.
- name: Schedule the UPS secondary watchdog
  when: nut_host_watchdog_armed | bool
  ansible.builtin.cron:
    name: "UPS secondary watchdog"
    minute: "*/{{ nut_host_watchdog_interval_minutes }}"
    user: root
    job: "/usr/local/bin/ups-secondary-health.sh"
    cron_file: ups-secondary-health
  become: true

# The stale-render arm of manifest-prune-check.sh can only report drift for templates that
# stamped a sha256, and nut_host stamped none — so a change to the shutdown chain's config
# could never be reported stale (2026-08-29 review M-10). Stamping it here closes that on
# daniel-box. It does NOT close it on daniel-server: manifest-prune-check.sh is installed by
# the k3s role's health-crons.yml, which k3s-bringup.yml gates to k3s_server_hosts, so
# /var/lib/homelab/setup-render-manifest.d/ does not exist there at all. That host stays
# structurally uncovered and the decision to leave it so is the operator's — see this role's
# entry in the review report rather than reading this stamp as full coverage.
- name: Record the rendered UPS host config
  when: nut_host_watchdog_armed | bool
  ansible.builtin.import_tasks: "{{ role_path }}/../setup/common/tasks/stamp_render.yml"
  vars:
    stamp_render_name: nut-host
    stamp_render_templates:
      - ansible/roles/nut_host/templates/host-upsmon.conf.j2
      - ansible/roles/nut_host/templates/host-nut.conf.j2
      - ansible/roles/nut_host/templates/ups-secondary-health.sh.j2
